<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460"
     role="img" aria-labelledby="et-title et-desc" font-family="Arial, Helvetica, sans-serif">
  <title id="et-title">Three Experiment Modes in AI/ML Research</title>
  <desc id="et-desc">Three columns comparing Development Loop (fast, daily work), Pre-Experiment (sanity check, 1-2 days), and Full Experiment (rigorous, weeks). Increasing rigor left to right. Each column shows purpose, typical steps, data scale, and output.</desc>

  <rect width="1000" height="460" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111">Three Experiment Modes in AI/ML Research</text>

  <!-- ═══ Column 1: Development Loop ═══ -->
  <rect x="30" y="55" width="290" height="360" rx="10" fill="#f5f5f5" stroke="#aaaaaa" stroke-width="2"/>
  <rect x="30" y="55" width="290" height="40" rx="10" fill="#aaaaaa"/>
  <text x="175" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Development Loop</text>

  <text x="175" y="120" text-anchor="middle" font-size="10" font-weight="700" fill="#444">Purpose</text>
  <text x="175" y="137" text-anchor="middle" font-size="10" fill="#555">Make the code work correctly</text>

  <text x="175" y="163" text-anchor="middle" font-size="10" font-weight="700" fill="#444">Cadence</text>
  <text x="175" y="180" text-anchor="middle" font-size="10" fill="#555">Minutes to hours · many iterations</text>

  <text x="175" y="206" text-anchor="middle" font-size="10" font-weight="700" fill="#444">Data</text>
  <text x="175" y="223" text-anchor="middle" font-size="10" fill="#555">Tiny subset (10–100 samples)</text>

  <text x="175" y="249" text-anchor="middle" font-size="10" font-weight="700" fill="#444">Steps</text>
  <rect x="55" y="258" width="240" height="92" rx="5" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="75" y="275" font-size="10" fill="#333">Code → run → inspect output</text>
  <text x="75" y="291" font-size="10" fill="#333">Debug → fix → re-run</text>
  <text x="75" y="307" font-size="10" fill="#333">Unit test · assert shapes/types</text>
  <text x="75" y="323" font-size="10" fill="#333">Commit working version to Git</text>
  <text x="75" y="341" font-size="10" fill="#333">No statistics needed</text>

  <rect x="55" y="363" width="240" height="32" rx="6" fill="#eeeeee" stroke="#aaaaaa" stroke-width="1"/>
  <text x="175" y="384" text-anchor="middle" font-size="10" fill="#555">Output: working, tested codebase</text>

  <!-- ═══ Column 2: Pre-Experiment ═══ -->
  <rect x="355" y="55" width="290" height="360" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <rect x="355" y="55" width="290" height="40" rx="10" fill="#4285f4"/>
  <text x="500" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Pre-Experiment</text>

  <text x="500" y="120" text-anchor="middle" font-size="10" font-weight="700" fill="#174ea6">Purpose</text>
  <text x="500" y="137" text-anchor="middle" font-size="10" fill="#555">Verify setup · check sanity · is approach viable?</text>

  <text x="500" y="163" text-anchor="middle" font-size="10" font-weight="700" fill="#174ea6">Cadence</text>
  <text x="500" y="180" text-anchor="middle" font-size="10" fill="#555">Hours to 1–2 days</text>

  <text x="500" y="206" text-anchor="middle" font-size="10" font-weight="700" fill="#174ea6">Data</text>
  <text x="500" y="223" text-anchor="middle" font-size="10" fill="#555">Small representative sample (1–5%)</text>

  <text x="500" y="249" text-anchor="middle" font-size="10" font-weight="700" fill="#174ea6">Steps</text>
  <rect x="380" y="258" width="240" height="92" rx="5" fill="#fff" stroke="#4285f4" stroke-width="1"/>
  <text x="400" y="275" font-size="10" fill="#333">1–2 conditions (baseline + one variant)</text>
  <text x="400" y="291" font-size="10" fill="#333">Quick run on reduced data</text>
  <text x="400" y="307" font-size="10" fill="#333">Check: does metric move at all?</text>
  <text x="400" y="323" font-size="10" fill="#333">Spot-check results for plausibility</text>
  <text x="400" y="341" font-size="10" fill="#333">Log results (no full stats yet)</text>

  <rect x="380" y="363" width="240" height="32" rx="6" fill="#c5d9f5" stroke="#4285f4" stroke-width="1"/>
  <text x="500" y="384" text-anchor="middle" font-size="10" fill="#174ea6">Output: go/no-go decision for full experiment</text>

  <!-- ═══ Column 3: Full Experiment ═══ -->
  <rect x="680" y="55" width="290" height="360" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="2.5"/>
  <rect x="680" y="55" width="290" height="40" rx="10" fill="#34a853"/>
  <text x="825" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Full Experiment</text>

  <text x="825" y="120" text-anchor="middle" font-size="10" font-weight="700" fill="#137333">Purpose</text>
  <text x="825" y="137" text-anchor="middle" font-size="10" fill="#555">Answer the research question · publishable result</text>

  <text x="825" y="163" text-anchor="middle" font-size="10" font-weight="700" fill="#137333">Cadence</text>
  <text x="825" y="180" text-anchor="middle" font-size="10" fill="#555">Days to weeks · planned runs</text>

  <text x="825" y="206" text-anchor="middle" font-size="10" font-weight="700" fill="#137333">Data</text>
  <text x="825" y="223" text-anchor="middle" font-size="10" fill="#555">Full dataset · held-out test set</text>

  <text x="825" y="249" text-anchor="middle" font-size="10" font-weight="700" fill="#137333">Steps</text>
  <rect x="705" y="258" width="240" height="92" rx="5" fill="#fff" stroke="#34a853" stroke-width="1"/>
  <text x="725" y="275" font-size="10" fill="#333">All conditions + strong baseline</text>
  <text x="725" y="291" font-size="10" fill="#333">Multiple runs (random seeds)</text>
  <text x="725" y="307" font-size="10" fill="#333">Ablation study (what matters?)</text>
  <text x="725" y="323" font-size="10" fill="#333">Statistical test (t-test, Wilcoxon)</text>
  <text x="725" y="341" font-size="10" fill="#333">Document everything for replication</text>

  <rect x="705" y="363" width="240" height="32" rx="6" fill="#b8e5c4" stroke="#34a853" stroke-width="1"/>
  <text x="825" y="384" text-anchor="middle" font-size="10" fill="#137333">Output: results section of the paper</text>

  <!-- Rigor arrow at bottom -->
  <line x1="80" y1="428" x2="920" y2="428" stroke="#555" stroke-width="2" marker-end="url(#re)"/>
  <defs>
    <marker id="re" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <text x="500" y="448" text-anchor="middle" font-size="11" font-weight="600" fill="#555">increasing rigour, time, and dataset size →</text>
</svg>
