<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"
     role="img" aria-labelledby="ps-title ps-desc" font-family="Arial, Helvetica, sans-serif">
  <title id="ps-title">The King Model of Paper Structure</title>
  <desc id="ps-desc">Hourglass / King Model: Title and Abstract at top (wide), narrowing through Introduction to Body (narrow waist), expanding through Discussion to References (wide base). Thematic scope arrow at bottom goes narrow then wide.</desc>

  <rect width="900" height="520" fill="#ffffff"/>

  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#111">The King Model of Paper Structure</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#666">Thematic scope narrows from general motivation to specific results, then broadens to implications</text>

  <!-- Left label: Logical Order -->
  <text x="28" y="310" text-anchor="middle" font-size="11" fill="#888" transform="rotate(-90 28 310)">Logical Order →</text>
  <line x1="42" y1="75" x2="42" y2="480" stroke="#ccc" stroke-width="1.5" marker-end="url(#da)"/>

  <!-- Right label: Thematic Scope -->
  <text x="872" y="310" text-anchor="middle" font-size="11" fill="#888" transform="rotate(90 872 310)">Thematic Scope</text>

  <defs>
    <marker id="da" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ccc"/>
    </marker>
  </defs>

  <!-- === Title (wide, dark blue) === -->
  <polygon points="120,70 780,70 720,108 180,108" fill="#1a73e8" stroke="#1a73e8" stroke-width="1"/>
  <text x="450" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Title</text>

  <!-- === Abstract (slightly narrower, medium blue) === -->
  <polygon points="180,112 720,112 680,148 220,148" fill="#4285f4" stroke="#4285f4" stroke-width="1"/>
  <text x="450" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Abstract</text>

  <!-- === Introduction (narrowing, light blue) === -->
  <polygon points="220,152 680,152 580,220 320,220" fill="#669df6" stroke="#669df6" stroke-width="1"/>
  <text x="450" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Introduction</text>
  <text x="450" y="208" text-anchor="middle" font-size="9" fill="#e8f0fe">establish territory · niche · occupy</text>

  <!-- === Body (narrow, red-orange) === -->
  <polygon points="320,224 580,224 540,340 360,340" fill="#ea4335" stroke="#ea4335" stroke-width="1"/>
  <text x="450" y="275" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Body</text>
  <text x="450" y="292" text-anchor="middle" font-size="9" fill="#fce8e6">methods · data · results</text>
  <text x="450" y="307" text-anchor="middle" font-size="9" fill="#fce8e6">how? · what found?</text>

  <!-- === Discussion (widening, green) === -->
  <polygon points="360,344 540,344 640,420 260,420" fill="#34a853" stroke="#34a853" stroke-width="1"/>
  <text x="450" y="386" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Discussion / Conclusion</text>
  <text x="450" y="402" text-anchor="middle" font-size="9" fill="#e6f4ea">compare · conclude · implications</text>

  <!-- === References (wide, dark green) === -->
  <polygon points="260,424 640,424 720,464 180,464" fill="#188038" stroke="#188038" stroke-width="1"/>
  <text x="450" y="449" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">References</text>

  <!-- Thematic scope double arrow at bottom -->
  <line x1="130" y1="490" x2="770" y2="490" stroke="#555" stroke-width="1.5"/>
  <line x1="130" y1="484" x2="130" y2="496" stroke="#555" stroke-width="1.5"/>
  <line x1="770" y1="484" x2="770" y2="496" stroke="#555" stroke-width="1.5"/>
  <text x="450" y="510" text-anchor="middle" font-size="10" fill="#666">← Thematic Scope →</text>

  <!-- Annotations right side -->
  <text x="770" y="90" font-size="9" fill="#1a73e8" font-weight="600">King</text>
  <text x="770" y="102" font-size="9" fill="#1a73e8" font-weight="600">Model</text>
  <line x1="760" y1="89" x2="760" y2="465" stroke="#1a73e8" stroke-width="1" stroke-dasharray="3,2"/>

  <text x="770" y="190" font-size="9" fill="#ea4335" font-weight="600">Hourglass</text>
  <text x="770" y="202" font-size="9" fill="#ea4335" font-weight="600">Model</text>
  <line x1="752" y1="189" x2="752" y2="422" stroke="#ea4335" stroke-width="1" stroke-dasharray="3,2"/>
</svg>
