<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240"
     role="img" aria-labelledby="rls-title rls-desc" font-family="Arial, Helvetica, sans-serif">
  <title id="rls-title">The Research Loop — 11 Steps</title>
  <desc id="rls-desc">Two-row numbered roadmap. Row 1 left to right: steps 1–6 (Literature, Find Gap, Research Q., Hypothesis, Design, Implement). Row 2 right to left: steps 7–11 (Experiment, Results, Analyse, Write-up, Communicate). Down arrow connects row 1 end to row 2. Dashed blue arrow returns from step 11 to step 1.</desc>

  <rect width="960" height="240" fill="#ffffff"/>

  <defs>
    <marker id="ma" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="mb" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4285f4"/>
    </marker>
    <marker id="mc" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea4335"/>
    </marker>
  </defs>

  <!-- ═══ ROW 1: steps 1–6 (y-center = 70) ═══ -->
  <!-- Box width=130, height=44, gap=16 → row width=6*130+5*16=860, start x=50 -->

  <!-- ① Literature (blue) -->
  <rect x="50" y="48" width="130" height="44" rx="7" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="115" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#174ea6">① Literature</text>
  <text x="115" y="82" text-anchor="middle" font-size="9" fill="#555">read · map · cite</text>
  <line x1="185" y1="70" x2="191" y2="70" stroke="#555" stroke-width="1.5" marker-end="url(#ma)"/>

  <!-- ② Find the Gap (purple) -->
  <rect x="196" y="48" width="130" height="44" rx="7" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="261" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#4a148c">② Find Gap</text>
  <text x="261" y="82" text-anchor="middle" font-size="9" fill="#555">tension · limit · open Q</text>
  <line x1="331" y1="70" x2="337" y2="70" stroke="#555" stroke-width="1.5" marker-end="url(#ma)"/>

  <!-- ③ Research Question (purple) -->
  <rect x="342" y="48" width="130" height="44" rx="7" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="407" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#4a148c">③ Research Q.</text>
  <text x="407" y="82" text-anchor="middle" font-size="9" fill="#555">specific · feasible</text>
  <line x1="477" y1="70" x2="483" y2="70" stroke="#555" stroke-width="1.5" marker-end="url(#ma)"/>

  <!-- ④ Hypothesis (amber) -->
  <rect x="488" y="48" width="130" height="44" rx="7" fill="#fff3cd" stroke="#f9ab00" stroke-width="2"/>
  <text x="553" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#b06000">④ Hypothesis</text>
  <text x="553" y="82" text-anchor="middle" font-size="9" fill="#555">falsifiable · directional</text>
  <line x1="623" y1="70" x2="629" y2="70" stroke="#555" stroke-width="1.5" marker-end="url(#ma)"/>

  <!-- ⑤ Design (amber) -->
  <rect x="634" y="48" width="130" height="44" rx="7" fill="#fff3cd" stroke="#f9ab00" stroke-width="2"/>
  <text x="699" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#b06000">⑤ Design</text>
  <text x="699" y="82" text-anchor="middle" font-size="9" fill="#555">conditions · metrics</text>
  <line x1="769" y1="70" x2="775" y2="70" stroke="#555" stroke-width="1.5" marker-end="url(#ma)"/>

  <!-- ⑥ Implement (red) -->
  <rect x="780" y="48" width="130" height="44" rx="7" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="845" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#c5221f">⑥ Implement</text>
  <text x="845" y="82" text-anchor="middle" font-size="9" fill="#555">code · data · verify</text>

  <!-- Down connector 6 → 7 (right side) -->
  <line x1="920" y1="92" x2="920" y2="143" stroke="#555" stroke-width="1.5" marker-end="url(#ma)"/>
  <line x1="910" y1="70" x2="920" y2="70" stroke="#555" stroke-width="1"/>
  <line x1="910" y1="165" x2="920" y2="165" stroke="#555" stroke-width="1"/>

  <!-- ═══ ROW 2: steps 7–11 (y-center = 165), reading RIGHT → LEFT ═══ -->

  <!-- ⑦ Experiment (red) -->
  <rect x="780" y="143" width="130" height="44" rx="7" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="845" y="161" text-anchor="middle" font-size="11" font-weight="700" fill="#c5221f">⑦ Experiment</text>
  <text x="845" y="177" text-anchor="middle" font-size="9" fill="#555">run · log · repeat</text>
  <line x1="775" y1="165" x2="769" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#ma)"/>

  <!-- ⑧ Results (green) -->
  <rect x="634" y="143" width="130" height="44" rx="7" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="699" y="161" text-anchor="middle" font-size="11" font-weight="700" fill="#137333">⑧ Results</text>
  <text x="699" y="177" text-anchor="middle" font-size="9" fill="#555">measure · compare</text>
  <line x1="629" y1="165" x2="623" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#ma)"/>

  <!-- ⑨ Analyse (green) -->
  <rect x="488" y="143" width="130" height="44" rx="7" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="553" y="161" text-anchor="middle" font-size="11" font-weight="700" fill="#137333">⑨ Analyse</text>
  <text x="553" y="177" text-anchor="middle" font-size="9" fill="#555">rule out errors · iterate</text>
  <line x1="483" y1="165" x2="477" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#ma)"/>

  <!-- ⑩ Write-up (blue) -->
  <rect x="342" y="143" width="130" height="44" rx="7" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="407" y="161" text-anchor="middle" font-size="11" font-weight="700" fill="#174ea6">⑩ Write-up</text>
  <text x="407" y="177" text-anchor="middle" font-size="9" fill="#555">draft · argue · revise</text>
  <line x1="337" y1="165" x2="331" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#ma)"/>

  <!-- ⑪ Communicate (blue) -->
  <rect x="196" y="143" width="130" height="44" rx="7" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="261" y="161" text-anchor="middle" font-size="11" font-weight="700" fill="#174ea6">⑪ Communicate</text>
  <text x="261" y="177" text-anchor="middle" font-size="9" fill="#555">paper · talk · poster</text>

  <!-- Return arc (step 11 → step 1), left side dashed blue -->
  <path d="M 196 165 L 30 165 L 30 70 L 46 70"
        fill="none" stroke="#4285f4" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#mb)"/>
  <text x="18" y="120" font-size="9" fill="#4285f4" text-anchor="middle" transform="rotate(-90 18 120)">new cycle</text>

  <!-- Iterate arc below (step 9 → step 7): errors found, re-run -->
  <path d="M 553 187 Q 553 220 699 220 Q 780 220 845 187"
        fill="none" stroke="#ea4335" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#mc)"/>
  <text x="699" y="233" text-anchor="middle" font-size="9" fill="#c5221f" font-weight="600">iterate: fix errors → re-run</text>
</svg>
