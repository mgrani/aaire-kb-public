<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"
     role="img" aria-labelledby="rl-title rl-desc" font-family="Arial, Helvetica, sans-serif">
  <title id="rl-title">The Scientific Research Loop</title>
  <desc id="rl-desc">Two-row flow diagram of the research cycle. Top row left to right: Literature → Gap → Hypothesis → Design → Implement. Bottom row right to left: Experiment → Results → Analyse → Write-up → Communicate. Dashed arcs show the iterate loop and the cycle restart.</desc>

  <rect width="1000" height="500" fill="#ffffff"/>

  <defs>
    <marker id="ra" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="rb" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4285f4"/>
    </marker>
    <marker id="rc" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea4335"/>
    </marker>
    <marker id="rd" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f9ab00"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111">The Scientific Research Loop</text>

  <!-- Phase labels -->
  <text x="500" y="70" text-anchor="middle" font-size="12" font-weight="600" fill="#777">Conceive → → → → →</text>
  <text x="500" y="398" text-anchor="middle" font-size="12" font-weight="600" fill="#777">← ← ← ← ← Execute &amp; Report</text>

  <!-- ═══ ROW 1 (y center = 120) ═══ -->
  <!-- Node width=130, height=48, x centers: 100, 290, 500, 710, 900 -->

  <!-- 1. Literature (blue) -->
  <rect x="35" y="96" width="130" height="48" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2.5"/>
  <text x="100" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#174ea6">1. Literature</text>
  <text x="100" y="132" text-anchor="middle" font-size="9" fill="#555">read · understand · map</text>

  <line x1="165" y1="120" x2="225" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#ra)"/>

  <!-- 2. Gap (purple) -->
  <rect x="225" y="96" width="130" height="48" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2.5"/>
  <text x="290" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#4a148c">2. Find the Gap</text>
  <text x="290" y="132" text-anchor="middle" font-size="9" fill="#555">open problem · tension</text>

  <line x1="355" y1="120" x2="415" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#ra)"/>

  <!-- 3. Hypothesis (amber) -->
  <rect x="415" y="96" width="130" height="48" rx="8" fill="#fff3cd" stroke="#f9ab00" stroke-width="2.5"/>
  <text x="480" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#b06000">3. Hypothesis</text>
  <text x="480" y="132" text-anchor="middle" font-size="9" fill="#555">idea → testable claim</text>

  <line x1="545" y1="120" x2="605" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#ra)"/>

  <!-- 4. Design (amber) -->
  <rect x="605" y="96" width="130" height="48" rx="8" fill="#fff3cd" stroke="#f9ab00" stroke-width="2.5"/>
  <text x="670" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#b06000">4. Design</text>
  <text x="670" y="132" text-anchor="middle" font-size="9" fill="#555">conditions · metrics · baseline</text>

  <line x1="735" y1="120" x2="795" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#ra)"/>

  <!-- 5. Implement (red-orange) -->
  <rect x="795" y="96" width="130" height="48" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="2.5"/>
  <text x="860" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#c5221f">5. Implement</text>
  <text x="860" y="132" text-anchor="middle" font-size="9" fill="#555">code · data · setup</text>

  <!-- Down arrow: 5 → 6 -->
  <line x1="860" y1="144" x2="860" y2="286" stroke="#555" stroke-width="2" marker-end="url(#ra)"/>

  <!-- ═══ ROW 2 (y center = 310) ═══ -->
  <!-- x centers: 860 (Exp), 670 (Results), 480 (Analyse), 290 (Write-up), 100 (Communicate) -->

  <!-- 6. Experiment (red) -->
  <rect x="795" y="286" width="130" height="48" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="2.5"/>
  <text x="860" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#c5221f">6. Experiment</text>
  <text x="860" y="322" text-anchor="middle" font-size="9" fill="#555">run · log · repeat</text>

  <line x1="795" y1="310" x2="745" y2="310" stroke="#555" stroke-width="1.5" marker-end="url(#ra)"/>

  <!-- 7. Results (green) -->
  <rect x="605" y="286" width="130" height="48" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2.5"/>
  <text x="670" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#137333">7. Results</text>
  <text x="670" y="322" text-anchor="middle" font-size="9" fill="#555">measure · compare</text>

  <line x1="605" y1="310" x2="555" y2="310" stroke="#555" stroke-width="1.5" marker-end="url(#ra)"/>

  <!-- 8. Analyse (green) -->
  <rect x="415" y="286" width="130" height="48" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2.5"/>
  <text x="480" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#137333">8. Analyse</text>
  <text x="480" y="322" text-anchor="middle" font-size="9" fill="#555">rule out errors · iterate</text>

  <line x1="415" y1="310" x2="365" y2="310" stroke="#555" stroke-width="1.5" marker-end="url(#ra)"/>

  <!-- 9. Write-up (blue) -->
  <rect x="225" y="286" width="130" height="48" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2.5"/>
  <text x="290" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#174ea6">9. Write-up</text>
  <text x="290" y="322" text-anchor="middle" font-size="9" fill="#555">draft · consolidate · review</text>

  <line x1="225" y1="310" x2="175" y2="310" stroke="#555" stroke-width="1.5" marker-end="url(#ra)"/>

  <!-- 10. Communicate (blue) -->
  <rect x="35" y="286" width="130" height="48" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2.5"/>
  <text x="100" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#174ea6">10. Communicate</text>
  <text x="100" y="322" text-anchor="middle" font-size="9" fill="#555">paper · talk · blog</text>

  <!-- Up arrow: 10 → 1 (new cycle, blue dashed) -->
  <line x1="100" y1="286" x2="100" y2="144" stroke="#4285f4" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#rb)"/>
  <text x="55" y="215" font-size="9" fill="#4285f4" text-anchor="middle">new</text>
  <text x="55" y="227" font-size="9" fill="#4285f4" text-anchor="middle">cycle</text>

  <!-- Iterate arc below row 2: Analyse → back to Experiment -->
  <path d="M 480 334 Q 480 415 670 415 Q 795 415 860 334"
        fill="none" stroke="#ea4335" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#rc)"/>
  <text x="670" y="435" text-anchor="middle" font-size="10" fill="#c5221f" font-weight="600">Iterate: fix errors → re-run experiment</text>

  <!-- Hypothesis revision arc between the rows (right side gap) -->
  <path d="M 545 310 Q 582 222 545 144"
        fill="none" stroke="#f9ab00" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#rd)"/>
  <text x="607" y="228" font-size="9" fill="#b06000" text-anchor="middle">revise</text>
  <text x="607" y="240" font-size="9" fill="#b06000" text-anchor="middle">hypothesis</text>

  <!-- Bottom caption -->
  <text x="500" y="478" text-anchor="middle" font-size="11" fill="#888">Science is iterative — every step can and should be revisited. Non-linear paths are the norm.</text>
</svg>
