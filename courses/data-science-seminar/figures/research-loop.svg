<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="380" viewBox="0 0 1040 380"
     role="img" aria-labelledby="rl-title rl-desc" font-family="Arial, Helvetica, sans-serif">
  <title id="rl-title">The Scientific Research Loop</title>
  <desc id="rl-desc">Unified research loop with 11 numbered steps. Top row left to right: Literature, Find Gap, Research Question, Hypothesis, Design, Implement. Bottom row right to left: Experiment, Results, Analyse, Write-up, Communicate. A dashed blue arrow restarts the cycle and a red dashed arc shows iteration from analysis back to experiment.</desc>

  <rect width="1040" height="380" fill="#ffffff"/>

  <defs>
    <marker id="ma" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="mb" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4285f4"/>
    </marker>
    <marker id="mc" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea4335"/>
    </marker>
    <marker id="md" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f9ab00"/>
    </marker>
  </defs>

  <text x="520" y="44" text-anchor="middle" font-size="12" font-weight="600" fill="#777">Conceive and frame the problem → build and test → analyse and communicate → start again</text>

  <text x="520" y="74" text-anchor="middle" font-size="12" font-weight="600" fill="#777">Conceptualisation → → → → →</text>
  <text x="520" y="285" text-anchor="middle" font-size="12" font-weight="600" fill="#777">← ← ← ← ← Execution, interpretation, and reporting</text>

  <!-- top row -->
  <rect x="70" y="92" width="130" height="46" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2.5"/>
  <text x="135" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#174ea6">1. Literature</text>
  <text x="135" y="126" text-anchor="middle" font-size="9" fill="#555">read · understand · map</text>
  <line x1="205" y1="115" x2="211" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#ma)"/>

  <rect x="216" y="92" width="130" height="46" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2.5"/>
  <text x="281" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#4a148c">2. Find the Gap</text>
  <text x="281" y="126" text-anchor="middle" font-size="9" fill="#555">open problem · tension</text>
  <line x1="351" y1="115" x2="357" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#ma)"/>

  <rect x="362" y="92" width="130" height="46" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2.5"/>
  <text x="427" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#4a148c">3. Research Question</text>
  <text x="427" y="126" text-anchor="middle" font-size="9" fill="#555">specific · feasible · sharp</text>
  <line x1="497" y1="115" x2="503" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#ma)"/>

  <rect x="508" y="92" width="130" height="46" rx="8" fill="#fff3cd" stroke="#f9ab00" stroke-width="2.5"/>
  <text x="573" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#b06000">4. Hypothesis</text>
  <text x="573" y="126" text-anchor="middle" font-size="9" fill="#555">testable claim · expectation</text>
  <line x1="643" y1="115" x2="649" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#ma)"/>

  <rect x="654" y="92" width="130" height="46" rx="8" fill="#fff3cd" stroke="#f9ab00" stroke-width="2.5"/>
  <text x="719" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#b06000">5. Design</text>
  <text x="719" y="126" text-anchor="middle" font-size="9" fill="#555">conditions · metrics · baseline</text>
  <line x1="789" y1="115" x2="795" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#ma)"/>

  <rect x="800" y="92" width="130" height="46" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="2.5"/>
  <text x="865" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#c5221f">6. Implement</text>
  <text x="865" y="126" text-anchor="middle" font-size="9" fill="#555">code · data · verify</text>

  <line x1="940" y1="138" x2="940" y2="222" stroke="#555" stroke-width="1.8" marker-end="url(#ma)"/>
  <line x1="930" y1="115" x2="940" y2="115" stroke="#555" stroke-width="1"/>
  <line x1="930" y1="245" x2="940" y2="245" stroke="#555" stroke-width="1"/>

  <!-- bottom row -->
  <rect x="800" y="222" width="130" height="46" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="2.5"/>
  <text x="865" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#c5221f">7. Experiment</text>
  <text x="865" y="256" text-anchor="middle" font-size="9" fill="#555">run · log · repeat</text>
  <line x1="795" y1="245" x2="789" y2="245" stroke="#555" stroke-width="1.5" marker-end="url(#ma)"/>

  <rect x="654" y="222" width="130" height="46" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2.5"/>
  <text x="719" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#137333">8. Results</text>
  <text x="719" y="256" text-anchor="middle" font-size="9" fill="#555">measure · compare</text>
  <line x1="649" y1="245" x2="643" y2="245" stroke="#555" stroke-width="1.5" marker-end="url(#ma)"/>

  <rect x="508" y="222" width="130" height="46" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2.5"/>
  <text x="573" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#137333">9. Analyse</text>
  <text x="573" y="256" text-anchor="middle" font-size="9" fill="#555">rule out errors · interpret</text>
  <line x1="503" y1="245" x2="497" y2="245" stroke="#555" stroke-width="1.5" marker-end="url(#ma)"/>

  <rect x="362" y="222" width="130" height="46" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2.5"/>
  <text x="427" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#174ea6">10. Write-up</text>
  <text x="427" y="256" text-anchor="middle" font-size="9" fill="#555">draft · argue · revise</text>
  <line x1="357" y1="245" x2="351" y2="245" stroke="#555" stroke-width="1.5" marker-end="url(#ma)"/>

  <rect x="216" y="222" width="130" height="46" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2.5"/>
  <text x="281" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#174ea6">11. Communicate</text>
  <text x="281" y="256" text-anchor="middle" font-size="9" fill="#555">paper · talk · poster</text>

  <path d="M 216 245 L 50 245 L 50 127 L 66 127"
        fill="none" stroke="#4285f4" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#mb)"/>
  <text x="35" y="185" font-size="10" fill="#4285f4" text-anchor="middle" transform="rotate(-90 35 185)">new cycle</text>

  <path d="M 573 268 Q 573 326 719 326 Q 815 326 865 268"
        fill="none" stroke="#ea4335" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#mc)"/>
  <text x="719" y="346" text-anchor="middle" font-size="10" fill="#c5221f" font-weight="600">iterate: fix errors → re-run experiment</text>

  <path d="M 573 222 Q 625 168 492 138"
        fill="none" stroke="#f9ab00" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#md)"/>
  <text x="615" y="176" font-size="9" fill="#b06000" text-anchor="middle">refine</text>
  <text x="615" y="188" font-size="9" fill="#b06000" text-anchor="middle">question / hypothesis</text>

  <text x="520" y="368" text-anchor="middle" font-size="11" fill="#888">Science is iterative: framing, testing, analysis, and communication all feed the next cycle.</text>
</svg>
