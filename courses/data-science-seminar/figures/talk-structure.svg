<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420"
     role="img" aria-labelledby="ts-title ts-desc" font-family="Arial, Helvetica, sans-serif">
  <title id="ts-title">The Roller-Coaster Talk Structure</title>
  <desc id="ts-desc">Five sections of a research talk shown as a curve: Title/Hook (start low, peak at motivation), Motivate (high excitement), Explain (dip for key idea), Details (optional depth), Conclusion (climb to summary). Audience attention plotted as dashed line.</desc>

  <rect width="960" height="420" fill="#ffffff"/>

  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#111">The Roller-Coaster Talk Structure</text>
  <text x="480" y="52" text-anchor="middle" font-size="11" fill="#666">Attention rises and falls — ride it deliberately</text>

  <!-- Y axis label -->
  <text x="24" y="240" text-anchor="middle" font-size="11" fill="#888" transform="rotate(-90 24 240)">Audience Attention</text>
  <line x1="60" y1="80" x2="60" y2="360" stroke="#ddd" stroke-width="1.5"/>

  <!-- X axis -->
  <line x1="60" y1="360" x2="920" y2="360" stroke="#ddd" stroke-width="1.5"/>

  <!-- Section dividers -->
  <line x1="220" y1="75" x2="220" y2="365" stroke="#eee" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="400" y1="75" x2="400" y2="365" stroke="#eee" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="620" y1="75" x2="620" y2="365" stroke="#eee" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="790" y1="75" x2="790" y2="365" stroke="#eee" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Attention curve (smooth path) -->
  <path d="M 60 300 C 100 290 160 160 220 130 C 280 100 350 170 400 200 C 450 230 500 310 560 280 C 590 265 610 250 620 240 C 680 200 730 310 790 310 C 840 310 880 180 920 160"
        fill="none" stroke="#4285f4" stroke-width="3"/>

  <!-- Roller coaster track (audience energy) -->
  <path d="M 60 320 C 110 318 180 220 220 190 C 260 165 350 230 400 260 C 440 285 500 340 560 320 C 585 310 605 298 620 290 C 670 265 730 340 790 330 C 840 320 880 220 920 200"
        fill="none" stroke="#ea4335" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- Section labels (below x axis) -->
  <text x="140" y="380" text-anchor="middle" font-size="11" font-weight="700" fill="#1a73e8">1. Title &amp; Hook</text>
  <text x="310" y="380" text-anchor="middle" font-size="11" font-weight="700" fill="#34a853">2. Motivate</text>
  <text x="510" y="380" text-anchor="middle" font-size="11" font-weight="700" fill="#f9ab00">3. Key Idea</text>
  <text x="705" y="380" text-anchor="middle" font-size="11" font-weight="700" fill="#ea4335">4. Details</text>
  <text x="855" y="380" text-anchor="middle" font-size="11" font-weight="700" fill="#1a73e8">5. Conclusion</text>

  <!-- Section time labels -->
  <text x="140" y="395" text-anchor="middle" font-size="9" fill="#888">~2 min</text>
  <text x="310" y="395" text-anchor="middle" font-size="9" fill="#888">~20% of talk</text>
  <text x="510" y="395" text-anchor="middle" font-size="9" fill="#888">~50% of talk</text>
  <text x="705" y="395" text-anchor="middle" font-size="9" fill="#888">~20% of talk</text>
  <text x="855" y="395" text-anchor="middle" font-size="9" fill="#888">~5 min</text>

  <!-- Annotation bubbles at peaks -->
  <rect x="80" y="88" width="130" height="36" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1"/>
  <text x="145" y="104" text-anchor="middle" font-size="9" fill="#174ea6">Why should I care?</text>
  <text x="145" y="118" text-anchor="middle" font-size="9" fill="#174ea6">Hook audience immediately</text>

  <rect x="250" y="70" width="135" height="36" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="1"/>
  <text x="317" y="86" text-anchor="middle" font-size="9" fill="#137333">Show the gap, the cost,</text>
  <text x="317" y="100" text-anchor="middle" font-size="9" fill="#137333">the exciting opportunity</text>

  <rect x="450" y="170" width="130" height="36" rx="6" fill="#fff3cd" stroke="#f9ab00" stroke-width="1"/>
  <text x="515" y="186" text-anchor="middle" font-size="9" fill="#b06000">1 big idea, explained</text>
  <text x="515" y="200" text-anchor="middle" font-size="9" fill="#b06000">with examples</text>

  <rect x="640" y="195" width="130" height="36" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1"/>
  <text x="705" y="211" text-anchor="middle" font-size="9" fill="#c5221f">Skip if time pressure.</text>
  <text x="705" y="225" text-anchor="middle" font-size="9" fill="#c5221f">Key results only.</text>

  <rect x="820" y="120" width="120" height="36" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1"/>
  <text x="880" y="136" text-anchor="middle" font-size="9" fill="#174ea6">What they should</text>
  <text x="880" y="150" text-anchor="middle" font-size="9" fill="#174ea6">remember tomorrow</text>

  <!-- Legend -->
  <line x1="80" y1="340" x2="110" y2="340" stroke="#4285f4" stroke-width="3"/>
  <text x="115" y="344" font-size="9" fill="#4285f4">Planned attention arc</text>
  <line x1="80" y1="356" x2="110" y2="356" stroke="#ea4335" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="115" y="360" font-size="9" fill="#ea4335">Actual audience energy</text>
</svg>
