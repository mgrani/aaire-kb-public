<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Lecture 04 argument map</title>
  <desc id="desc">What makes a learning problem, why learning needs an inductive bias, linear and logistic regression, naive Bayes, and how to measure performance honestly.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="12" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#64748b"/>
    </marker>
    <style>
      .head { font: 700 17px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .text { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .small { font: 12px Arial, "Helvetica Neue", sans-serif; fill: #475569; }
      .tag { font: 700 11px Arial, "Helvetica Neue", sans-serif; letter-spacing: 0.08em; }
      .arclabel { font: 700 14px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
      .arcsub { font: 12px Arial, "Helvetica Neue", sans-serif; fill: #64748b; }
      .arcnum { font: 700 12px Arial, "Helvetica Neue", sans-serif; }
      .arcname { font: 12px Arial, "Helvetica Neue", sans-serif; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="1" y="1" width="1118" height="638" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="50" y="46" class="arclabel" style="font-size:15px">Lecture 04 · argument map</text>
  <path d="M358 134 H406" class="arrow"/>
  <path d="M714 134 H762" class="arrow"/>
  <path d="M916 196 C916 217 204 217 204 238" class="arrow"/>
  <path d="M358 300 H406" class="arrow"/>
  <path d="M714 300 H762" class="arrow"/>
  <path d="M916 362 C916 383 916 383 916 404" class="arrow"/>
  <g transform="translate(50 72)">
    <rect width="308" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">MODULE 1</text>
    <text x="18" y="48" class="head">A learning problem</text>
    <text x="18" y="73" class="text">task, experience, performance</text>
    <text x="18" y="93" class="small">four choices: data, model,</text>
    <text x="18" y="111" class="small">loss, optimiser</text>
  </g>
  <g transform="translate(406 72)">
    <rect width="308" height="124" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#7c3aed">MODULE 2</text>
    <text x="18" y="48" class="head">Learning needs a bias</text>
    <text x="18" y="73" class="text">infinitely many rules fit the data</text>
    <text x="18" y="93" class="small">search a hypothesis space;</text>
    <text x="18" y="111" class="small">bias–variance: no escape</text>
  </g>
  <g transform="translate(762 72)">
    <rect width="308" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">MODULE 3</text>
    <text x="18" y="48" class="head">Linear regression</text>
    <text x="18" y="73" class="text">minimise squared residuals</text>
    <text x="18" y="93" class="small">closed form or gradient descent</text>
    <text x="18" y="111" class="small">Gauss–Markov: why squared error</text>
  </g>
  <g transform="translate(50 238)">
    <rect width="308" height="124" rx="12" fill="#f0fdf4" stroke="#16803c" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#16803c">MODULE 4</text>
    <text x="18" y="48" class="head">From lines to decisions</text>
    <text x="18" y="73" class="text">a line fitted to 0/1 labels breaks</text>
    <text x="18" y="93" class="small">logistic: a sigmoid on log-odds,</text>
    <text x="18" y="111" class="small">fitted by maximum likelihood</text>
  </g>
  <g transform="translate(406 238)">
    <rect width="308" height="124" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#d97706">MODULE 5</text>
    <text x="18" y="48" class="head">Naive Bayes</text>
    <text x="18" y="73" class="text">attributes independent given class</text>
    <text x="18" y="93" class="small">known to be false — works, since</text>
    <text x="18" y="111" class="small">only the argmax must be right</text>
  </g>
  <g transform="translate(762 238)">
    <rect width="308" height="124" rx="12" fill="#fff1f1" stroke="#dc2626" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#dc2626">MODULE 6</text>
    <text x="18" y="48" class="head">What are we measuring?</text>
    <text x="18" y="73" class="text">99.9% accuracy, zero detections</text>
    <text x="18" y="93" class="small">never test on training data</text>
    <text x="18" y="111" class="small">precision vs recall: costs decide</text>
  </g>
  <g transform="translate(50 404)">
    <rect width="1020" height="124" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#7c3aed">TAKEAWAY</text>
    <text x="18" y="48" class="head">Every learner assumes a form — so test it on unseen data</text>
    <text x="18" y="73" class="text">the hypothesis space, the loss and the independence assumptions are chosen, not found in the data</text>
    <text x="18" y="93" class="small">Module 6 is how we find out whether the choice was right — against a baseline</text>
  </g>
  <line x1="50" y1="540" x2="1070" y2="540" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="50" y="582" class="arclabel">Course arc</text>
  <text x="50" y="600" class="arcsub">assume → check</text>
  <rect x="150" y="556" width="86" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="193" y="574" text-anchor="middle" class="arcnum" fill="#64748b">L01</text>
  <text x="193" y="591" text-anchor="middle" class="arcname" fill="#64748b">Data does</text>
  <text x="193" y="606" text-anchor="middle" class="arcname" fill="#64748b">not speak</text>
  <rect x="243" y="556" width="86" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="286" y="574" text-anchor="middle" class="arcnum" fill="#64748b">L02</text>
  <text x="286" y="591" text-anchor="middle" class="arcname" fill="#64748b">Chance</text>
  <text x="286" y="606" text-anchor="middle" class="arcname" fill="#64748b">has rules</text>
  <rect x="335" y="556" width="86" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="378" y="574" text-anchor="middle" class="arcnum" fill="#64748b">L03</text>
  <text x="378" y="591" text-anchor="middle" class="arcname" fill="#64748b">Draw the</text>
  <text x="378" y="606" text-anchor="middle" class="arcname" fill="#64748b">dependences</text>
  <rect x="428" y="556" width="86" height="60" rx="10" fill="#164374" stroke="#164374" stroke-width="2"/>
  <text x="471" y="574" text-anchor="middle" class="arcnum" fill="#ffffff">L04</text>
  <text x="471" y="591" text-anchor="middle" class="arcname" fill="#ffffff">Assume</text>
  <text x="471" y="606" text-anchor="middle" class="arcname" fill="#ffffff">a form</text>
  <rect x="521" y="556" width="86" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="564" y="574" text-anchor="middle" class="arcnum" fill="#64748b">L05</text>
  <text x="564" y="591" text-anchor="middle" class="arcname" fill="#64748b">Learn the</text>
  <text x="564" y="606" text-anchor="middle" class="arcname" fill="#64748b">features</text>
  <rect x="614" y="556" width="86" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="656" y="574" text-anchor="middle" class="arcnum" fill="#64748b">L06</text>
  <text x="656" y="591" text-anchor="middle" class="arcname" fill="#64748b">Ask short</text>
  <text x="656" y="606" text-anchor="middle" class="arcname" fill="#64748b">questions</text>
  <rect x="706" y="556" width="86" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="749" y="574" text-anchor="middle" class="arcnum" fill="#64748b">L07</text>
  <text x="749" y="591" text-anchor="middle" class="arcname" fill="#64748b">Look before</text>
  <text x="749" y="606" text-anchor="middle" class="arcname" fill="#64748b">you fit</text>
  <rect x="799" y="556" width="86" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="842" y="574" text-anchor="middle" class="arcnum" fill="#64748b">L08</text>
  <text x="842" y="591" text-anchor="middle" class="arcname" fill="#64748b">Define</text>
  <text x="842" y="606" text-anchor="middle" class="arcname" fill="#64748b">similarity</text>
  <rect x="892" y="556" width="86" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="934" y="574" text-anchor="middle" class="arcnum" fill="#64748b">L09</text>
  <text x="934" y="591" text-anchor="middle" class="arcname" fill="#64748b">Beat the</text>
  <text x="934" y="606" text-anchor="middle" class="arcname" fill="#64748b">base rate</text>
  <rect x="984" y="556" width="86" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1027" y="574" text-anchor="middle" class="arcnum" fill="#64748b">L10</text>
  <text x="1027" y="591" text-anchor="middle" class="arcname" fill="#64748b">Choose what</text>
  <text x="1027" y="606" text-anchor="middle" class="arcname" fill="#64748b">to keep</text>
</svg>
