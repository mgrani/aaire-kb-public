# Module 5
## Random Variables and Distributions

> **Guiding Question:** We rarely care which outcome occurred, only what it was
> worth. How do we move from outcomes to quantities?

Notes:
Session boundary: the second session starts here. Recall the three-card flow
from the opening (assume → observe → check): Modules 1–4 built the model of
chance for events; Modules 5–7 turn outcomes into quantities, describe a sample
and check a difference.

--

## Motivation: We Rarely Care About the Outcome Itself

Toss three fair coins:
$\Omega = \lbrace H,T\rbrace \times \lbrace H,T\rbrace \times \lbrace H,T\rbrace $, eight outcomes.

Usually the interesting quantity is not *which* sequence occurred, but the
**number of heads** $Y$:


<div class="grid-4">


<div class="column">

$$P(Y=0) = \tfrac{1}{8}$$
$(T,T,T)$

</div>


<div class="column">

$$P(Y=1) = \tfrac{3}{8}$$
$(H,T,T), (T,H,T), (T,T,H)$

</div>


<div class="column">

$$P(Y=2) = \tfrac{3}{8}$$
$(H,H,T), (T,H,H), (H,T,H)$

</div>


<div class="column">

$$P(Y=3) = \tfrac{1}{8}$$
$(H,H,H)$

</div>


</div>


$Y$ compresses eight outcomes into four numbers — and the probabilities come
along automatically.

Notes:
Intuition first (P4). Ask what was lost in the compression (which coin showed
heads) and what was gained (a quantity we can average, compare, plot). That
trade is the entire point of a random variable.

--

## Definition


<div class="c-definition">

**Definition (Random variable).** A random variable $X$ maps outcomes to a
measurable range $E$: $X : \Omega \to E$. Its probabilities are inherited from
the underlying probability space:
$$
P(X \in S) = P(\lbrace \omega \in \Omega \mid X(\omega) \in S\rbrace )
$$

</div>



<div class="c-warning">

A random variable is neither random nor a variable — it is a **function** on the
sample space. The randomness lives in $\omega$, not in $X$.

</div>


Notes:
The naming trap is worth one minute; it removes a persistent confusion. The
formula says: to get the probability of a value, collect all outcomes that map
to it and use the measure we already have.

--

## The Function, Drawn

<div class="viz viz-lg" data-viz="math/random-variable-map" data-steps="4"></div>

Notes:
Stepped visualization (P6), three coins: the eight outcomes; the arrows, one per
outcome; the four values with their counts; the resulting mass function. Two
things to say out loud while stepping. First, *every* outcome has exactly one
arrow leaving it — that is what makes Y a function. Second, three arrows arrive
at 1 and three at 2, and that is the entire reason those values are more
probable. The probability was never invented; it was inherited.

--

## Examples


<div class="grid-3">


<div class="column">

**Two coins**

$\Omega = \lbrace HH, HT, TH, TT\rbrace $

$X$ = number of heads

</div>


<div class="column">

**People**

$\Omega = \lbrace \text{person}\_1, \text{person}\_2, \ldots\rbrace $

$X$ = height of the person

</div>


<div class="column">

**Two dice**

$\Omega = \lbrace \langle n\_1, n\_2\rangle\rbrace $

$X(\omega) = n\_1 + n\_2$

</div>


</div>


Notes:
The middle example is the one that connects to data science: a dataset column
*is* a random variable — a function from records to values. Say it explicitly;
it makes the next chapters feel continuous with this one.

--

## Discrete and Continuous


<div class="grid-2">


<div class="column">


<div class="card">

**Discrete random variables**

Countable range, usually $E \subseteq \mathbb{N}$.

- number of children of a person
- sum of two dice

</div>


</div>


<div class="column">


<div class="card">

**Continuous random variables**

Real-valued range, $E = \mathbb{R}$.

- height of a person
- horsepower of a car

</div>


</div>


</div>


The distinction decides *how* we may describe the probabilities — with a mass
function or with a density.

Notes:
Keep this light: the deep measure-theoretic reasons are out of scope. What
students need is the practical consequence — sums for discrete, integrals for
continuous.

--

## A Random Variable With Infinitely Many Values

Flip a biased coin ($P(H) = p$) until the first head. Let $X$ be the number of
flips needed:

$$
P(X = 1) = p, \quad P(X = 2) = (1-p)p, \quad P(X = 3) = (1-p)^2 p
$$
$$
P(X = n) = (1-p)^{n-1} p
$$

Countably infinite range, and the probabilities still sum to 1.

Notes:
This is the geometric distribution, met before it is named — fine, because it is
constructed from the chain rule the students already have. Ask them to verify
the sum is 1 (geometric series) if the group is comfortable with it.

--

## Takeaway


<div class="takeaway">

A random variable is a **function from outcomes to numbers** that carries the
probability measure with it. It lets us stop talking about sample spaces and
start talking about quantities — which is what the rest of the course does.

</div>


--

## Probability Mass Function


<div class="c-definition">

**Definition (PMF).** For a discrete random variable $X$, the **probability
mass function** is
$$
p(a) = P(X = a)
$$

</div>



<div class="grid-3">


<div class="column">

$p(a) > 0$ for at most countably many $a$

</div>


<div class="column">

$\sum\_i p(a\_i) = 1$

</div>


<div class="column">

$p$ is itself a probability measure

</div>


</div>


Notes:
The PMF is just the probability measure, re-indexed by values instead of
outcomes. Everything from the axioms still applies — which is why the three
properties are consequences, not new assumptions.

--

## Example: Sum of Two Dice

<div class="viz" data-viz="math/distribution-explorer"
 data-params='{"kind": "dice-sum"}'></div>

The triangular shape is counting, drawn: six of the
36 outcomes give 7, only one gives 2.

Notes:
Connect the picture to the Laplace assumption: 36 equally likely outcomes,
counted by sum. Ask why the shape is symmetric and peaked — more ways to make a
middling sum. This is the first hint
of why sums of random quantities concentrate.

--

## Expectation


<div class="c-definition">

**Definition (Expected value).**
$$
E[X] = \sum\_i a\_i \cdot p(a\_i)
$$

</div>



<div class="grid-2">


<div class="column">

- Frequentist reading: the **average outcome** if the experiment were repeated
 infinitely often
- The first moment: $\mu = E[X^1]$; the first *central* moment
 $E[X - E[X]]$ is always $0$

</div>


<div class="column">

For a real function $g$:
$$
E[g(X)] = \sum\_i g(a\_i) p(a\_i)
$$
and for constants $a, b$:
$$
E[aX + b] = a E[X] + b
$$

</div>


</div>


Notes:
The linearity identity is the one used constantly later (in regression, in
evaluation). Note that E[g(X)] ≠ g(E[X]) in general — ask for a counterexample
with g(x) = x².

--

## Variance


<div class="c-definition">

**Definition (Variance).**
$$
\mathrm{Var}(X) = E\big[(X - \mu)^2\big] = E[X^2] - \big(E[X]\big)^2
$$

</div>



<div class="grid-2">


<div class="column">

- a measure of **dispersion** around the mean — larger variance, larger typical
 deviation
- the second central moment

</div>


<div class="column">

- $\mathrm{Var}(aX + b) = a^2 \mathrm{Var}(X)$
- $\sigma = \sqrt{\mathrm{Var}(X)}$ is the **standard deviation**, in the same
 unit as $X$

</div>


</div>


Notes:
Two things to stabilise: the computational identity E[X²] − E[X]², and why we
report σ rather than the variance (units). The b disappearing under variance is
worth a question: shifting data does not change its spread.

--

## Takeaway


<div class="takeaway">

A discrete distribution is a PMF; expectation and variance compress it into
**where it sits** and **how much it spreads**.

</div>


--

## Bernoulli and Binomial


<div class="grid-2">


<div class="column">


<div class="card">

**Bernoulli$(p)$** — one trial

$X = 1$ success, $X = 0$ failure

$$E[X] = p, \quad \mathrm{Var}(X) = p(1-p)$$

</div>


</div>


<div class="column">


<div class="card">

**Binomial $B(n,p)$** — $n$ independent trials

$$p(k) = \binom{n}{k} p^k (1-p)^{n-k}$$

$$E[X] = np, \quad \mathrm{Var}(X) = np(1-p)$$

</div>


</div>


</div>


$\binom{n}{k} = \frac{n!}{k!\\,(n-k)!}$ counts the sequences with $k$ successes;
the PMF multiplies it by the probability of one such sequence — combinatorics
and independence in a single line.

Notes:
Point at where each ingredient comes from: the binomial coefficient counts the
ways to place k successes among n trials, the product p^k(1−p)^(n−k) comes from
independence. Nothing here is new machinery, which is exactly the message.

--

## How the Shape Depends on the Parameters

<div class="viz viz-lg" data-viz="math/distribution-explorer" data-steps="4"
 data-params='{"kind": "binomial", "p": 0.5, "n": 5, "sweep": {"param": "n", "values": [5, 10, 20, 40, 60]}}'></div>

**Predict before each click:** as $n$ grows, does the distribution get wider or
narrower — and what happens to its shape?

Notes:
Predict-then-check (P6). Two things happen at once: the spread in absolute terms
grows (√n) while the shape becomes symmetric and bell-like. The second
observation is the central limit theorem at work — a sum of many independent
coin flips. Name it as an observation; the theorem itself is stated with the
normal distribution.

--

## Mini-Exercise

A student guesses all **10** questions of a quiz, each with **4** options.


<div class="q">

How many correct answers should they expect — and is 5 or more likely?

</div>



<div class="fragment">

$B(10, 0.25)$: on average $10 \cdot 0.25 = 2.5$ correct. Five or more is
twice the expectation — unlikely (about 8%).

</div>


Notes:
Two minutes: the expectation is head arithmetic, the second half only asks for
a judgement. If someone wants the exact tail, it is P(X ≥ 5) ≈ 0.078 — a sum over
six PMF values, not one. The modelling point matters more than the number: the
binomial needs independent guesses with a constant success probability; ask
when that would fail in a real exam.

--

## Takeaway


<div class="takeaway">

A yes/no attribute is a **Bernoulli** variable with one parameter $p$; counting
the yeses in $n$ independent trials gives a **binomial**. Both are counting in
probabilistic clothing — and $p$ is the number data will have to tell us.

</div>


--

## From Mass to Density


<div class="c-definition">

**Definition (PDF).** A continuous random variable $X$ has a **probability
density function** $f$ with
$$
P(b \leq X \leq c) = \int\_b^c f(a) da,
\qquad \int\_{-\infty}^{\infty} f(a) da = 1
$$

</div>



<div class="c-warning">

$f(a)$ is **not** a probability — it is probability *per unit interval*.
Consequently $f(a) > 1$ is perfectly possible, and $P(X = a) = 0$ for every
single value $a$.

</div>


Notes:
The density-is-not-probability point is the single biggest source of confusion
in this unit. A useful question: what is the probability that a person is
exactly 180.000... cm tall? Zero — probability lives on intervals now.

--

## Probability Is Area Under the Curve

<div class="viz viz-lg" data-viz="math/distribution-explorer" data-steps="1"
 data-params='{"kind": "normal", "mu": 0, "sigma": 1, "shade": [-1, 1]}'></div>

The shaded region is $P(-1 \leq X \leq 1)$ — the same "probability as area"
intuition from the axioms unit, now with a curve instead of a Venn diagram.

Notes:
Deliberate callback (P7 spiral): area was the intuition for the axioms, and it
still is. Ask what the total area must be, and why that forces the normalisation
constant in the density formula.

--

## Expectation and Variance — Sums Become Integrals


<div class="grid-2">


<div class="column">

**Discrete**
$$E[X] = \sum\_i a\_i p(a\_i)$$
$$E[g(X)] = \sum\_i g(a\_i) p(a\_i)$$

</div>


<div class="column">

**Continuous**
$$E[X] = \int\_{-\infty}^{\infty} a f(a) da$$
$$E[g(X)] = \int\_{-\infty}^{\infty} g(a) f(a) da$$

</div>


</div>


The rules are unchanged: $E[aX + b] = a E[X] + b$, and
$\mathrm{Var}(X) = E[(X - \mu)^2]$.

Notes:
Emphasise the continuity of concepts across the discrete/continuous divide:
only the summation symbol changed. Students who see this stop treating the two
cases as separate theories.

--

## Two Basic Continuous Distributions


<div class="grid-2">


<div class="column">


<div class="card">

**Uniform on $[a,b]$**

$$f(x) = \frac{1}{b-a} \text{ for } x \in [a,b]$$

Every interval of equal length is equally likely — the Laplace assumption,
continuous version.

</div>


</div>


<div class="column">


<div class="card">

**Normal $N(\mu, \sigma^2)$**

$$f(x) = \frac{1}{\sigma\sqrt{2\pi}} e^{-\frac{(x-\mu)^2}{2\sigma^2}}$$

$E[X] = \mu$, $\mathrm{Var}(X) = \sigma^2$;
$N(0,1)$ is the **standard** normal.

</div>


</div>


</div>


Notes:
The uniform is worth naming as the continuous Laplace assumption — it makes the
earlier discussion feel like one idea rather than two.

--

## What σ Does to the Shape

<div class="viz viz-lg" data-viz="math/distribution-explorer" data-steps="3"
 data-params='{"kind": "normal", "mu": 0, "sigma": 0.6, "sweep": {"param": "sigma", "values": [0.6, 1, 1.6, 2.4]}}'></div>

The peak falls as the curve widens — the area is always 1.

Notes:
Predict-then-check: ask what must happen to the height when the width grows.
The constraint "total area = 1" is doing the work, and it is the same
normalisation axiom that defined a probability measure.

--

## Why the Normal Is Everywhere


<div class="c-insight">

The **central limit theorem**: under mild conditions, the average of $n$
independent observations is approximately normal for large $n$ — whatever the
original distribution was.

</div>


This is why the normal is the default when the true distribution is unknown —
and why a sum of many independent coin flips, the binomial, looks bell-shaped.

Notes:
State the CLT, do not prove it. If the binomial sweep has already been shown,
call back to it — students already saw it happen; if it comes later, it will
confirm the theorem. This also sets up the sampling distribution of a mean,
which every error bar computed from a sample rests on.

--

## Other Distributions You Will Meet


<div class="grid-2">


<div class="column">

- **Exponential** — time until an event occurs (e.g. until the next earthquake)
- **Gamma** — time until $n$ events have occurred

</div>


<div class="column">

- **Beta** — values in $[0,1]$, e.g. an unknown probability
- **Dirichlet** — distributions *over* probabilities

</div>


</div>



<div class="takeaway">

Continuous distributions replace mass with **density** and sums with
**integrals**. Probability remains area, expectation remains a weighted average,
and the normal is the default shape because of the central limit theorem.

</div>


Notes:
The last two (Beta, Dirichlet) are named for recognition only — they return
wherever a probability is itself unknown, as priors over probabilities. That is
a legitimate forward *pointer*, not a forward dependency: nothing here uses them.

--

## More Than One Random Variable


<div class="grid-3">


<div class="column">

### Univariate
one random variable

</div>


<div class="column">

### Bivariate
two random variables

</div>


<div class="column">

### Multivariate
three or more

</div>


</div>


A **joint distribution** describes the outcomes of several random variables *at
the same time* — which is what every dataset with more than one column is.

Notes:
Make the dataset connection explicit: a table with columns age, income, and
churn is a sample from a trivariate joint distribution. Everything in the rest
of the course operates on joints.

--

## Joint Mass and Density


<div class="grid-2">


<div class="column">

**Discrete** — joint PMF
$$p\_{X,Y}(a,b) = P(X = a, Y = b)$$

</div>


<div class="column">

**Continuous** — joint PDF
$$P((X,Y) \in R) = \iint\_R f\_{X,Y}(a,b) da db$$

</div>



</div>


<div class="c-note">

**Notational convention from here on.** We stop distinguishing discrete from
continuous variables and simply write $p(a, b, c, \ldots)$ for the probability
that $\lbrace X\_1, X\_2, X\_3, \ldots\rbrace $ is in state $a, b, c, \ldots$

</div>


Notes:
Flag the convention as a deliberate simplification, and say why it is safe: the
rules (marginalise, condition, factorise) are identical; only the mechanics of
summing versus integrating differ.

--

## Marginalisation


<div class="c-definition">

**Marginalisation** eliminates a random variable by summing over all its states.
For $p(x\_1, \ldots, x\_n)$, a **marginal** over a subset is
$$
p(x\_1) = \sum\_{x\_2} \cdots \sum\_{x\_n} p(x\_1, x\_2, \ldots, x\_n)
$$

</div>


"Forget about a variable, but keep its influence correctly accounted for."

Notes:
Marginalisation is the total-probability theorem, applied to random variables —
say so, since students met the theorem with conditional probability. That
continuity is worth more than the formula.

--

## Example: Boys and Girls

15% of families have no children, 20% have one, 35% have two, 30% have three.
Each child is independently a boy or a girl with probability $\tfrac{1}{2}$.

Let $B$ = number of boys, $G$ = number of girls.

| $p(B,G)$ | $G=0$ | $G=1$ | $G=2$ | $G=3$ | $p(B)$ |
|---|---|---|---|---|---|
| $B=0$ | .15 | .10 | .0875 | .0375 | .375 |
| $B=1$ | .10 | .175 | .1125 | 0 | .3875 |
| $B=2$ | .0875 | .1125 | 0 | 0 | .2 |
| $B=3$ | .0375 | 0 | 0 | 0 | .0375 |
| $p(G)$ | .375 | .3875 | .2 | .0375 | 1 |

The margins of the table *are* the marginals — which is where the name comes
from.

Notes:
Have students read one cell aloud as a sentence ("11.25% of families have one boy
and two girls"). Then ask whether B and G are independent — they are not, since
the family size couples them. Good preparation for covariance.

--

## Covariance


<div class="c-definition">

$$
\mathrm{cov}(A, B) = E\big[(A - E[A])(B - E[B])\big]
$$

</div>



<div class="grid-3">


<div class="column">


<div class="card">

$\mathrm{cov} > 0$

$A$ large when $B$ large — positively related

</div>


</div>


<div class="column">


<div class="card">

$\mathrm{cov} < 0$

$A$ large when $B$ small — negatively related

</div>


</div>


<div class="column">


<div class="card">

$\mathrm{cov}(A,A) = \mathrm{Var}(A)$

variance is self-covariance

</div>


</div>



</div>


<div class="c-warning">

Independence implies zero covariance. **The converse is false** — covariance
only detects *monotone linear* association.

</div>


Notes:
The warning is the load-bearing statement. A classic counterexample: X uniform
on [−1,1] and Y = X² are dependent but have zero covariance. This is why later
methods that rely on correlation can miss real structure.

--

## Covariance Sees Only One Kind of Structure

<div class="viz viz-lg" data-viz="math/covariance-cloud" data-steps="4"
 data-params='{"rho": 0.7}'></div>

**Predict first:** with $Y = X^2 - 1$, every point is fixed by its $x$. The
covariance?

Notes:
Stepped, then manipulable (P6 tiers 2 and 3). The quadrant signs make the
definition visible: covariance averages the sign of (x−x̄)(y−ȳ), so a cloud
that is symmetric about the vertical line has the two signs in balance and
averages to zero — however tightly the points sit on a curve.

Collect the prediction before switching. Almost everyone says "large": the
dependence is total. The reading afterwards is ≈ 0. That is the counterexample
from the warning above, on screen, and it is the reason "uncorrelated" and
"independent" must stay different words.

--

## Takeaway


<div class="takeaway">

The joint distribution holds everything; **marginalisation** sums a variable
away, **conditioning** restricts, and **covariance** summarises linear
co-variation. Zero covariance is weaker than independence.

</div>


---

<!-- .slide: class="module-slide" -->

# Module 6
## Describing Data

> **Guiding Question:** The distribution is unknown and all we have is a
> sample. What can we honestly say about it?

--

## We Never Know the Distribution

Up to now we assumed a distribution was given. In practice it is **unknown**,
and we must estimate its properties from data.


<div class="grid-2">


<div class="column">


<div class="card">

**Population**

The entire group — all humans on earth, all transactions, all documents.

Its properties ($\mu$, $\sigma^2$) are the truth we cannot observe.

</div>


</div>


<div class="column">


<div class="card">

**Sample**

The observations we actually have.

Its properties ($\overline{x}$, $s^2$) are what we compute; estimates of the
population's ($\overline{x}$, $\hat{\sigma}^2$) are built from them.

</div>


</div>


</div>


**Descriptive statistics** summarise a sample, usually while assuming something
about the underlying distribution.

Notes:
This slide is the hinge of the whole module: everything before it was
deduction from a model, everything after is inference from data. The
population/sample distinction is exactly the gap that statistics manages.

--

## What We Summarise


<div class="grid-3">


<div class="column">

### Central tendency
1st order moment

sample mean, median

</div>


<div class="column">

### Dispersion
2nd central moment

variance, standard deviation, interquartile range

</div>


<div class="column">

### Shape
3rd central moment

skewness — or, without moments, quantiles

</div>


</div>


Univariate statistics describe one random variable; **multivariate** statistics
describe $X\_1, \ldots, X\_d$ together.

Notes:
The moment ordering gives a clean mental index: where is it, how spread, how
lopsided. Each has a robust and a non-robust representative: the median against
the mean for location, the interquartile range against the standard deviation
for spread.

--

## Means


<div class="grid-2">


<div class="column">

**Sample mean**
$$\overline{x} = \frac{1}{n}\sum\_{i=1}^{n} x\_i$$

**Weighted mean**
$$\overline{x}\_w = \frac{\sum\_i w\_i x\_i}{\sum\_i w\_i}$$

</div>


<div class="column">

**Geometric mean** — for rates and ratios
$$\Big(\prod\_i x\_i\Big)^{1/n}$$

**Harmonic mean** — for averaging rates
$$\frac{n}{\sum\_i 1/x\_i}$$

</div>


</div>


**Trimmed mean:** drop the $k$ smallest and largest values, then average — a
cheap way to buy robustness.

Notes:
The sample mean estimates E[X]. Ask when the arithmetic mean is simply wrong:
average speed over equal distances (harmonic), average growth rate
(geometric). Choosing the mean is a modelling decision, not a formality.

--

## Median


<div class="c-definition">

The **median** is the middle value of the sorted sample: for odd $n$ the
$\frac{n+1}{2}$-th value, for even $n$ the average of the two middle values.

</div>



<div class="grid-2">


<div class="column">


<div class="card good">

**Robust** against outliers — one extreme value moves the median by at most one
position

</div>


</div>


<div class="column">


<div class="c-warning">

**Costlier** to compute: requires sorting, or an interval approximation over
binned data

</div>


</div>


</div>


For binned data, the median is interpolated within its interval from the
cumulative counts, the interval's lower border and width.

Notes:
The mean-versus-median contrast is the first robustness discussion of the
course, and it returns in clustering (k-means vs. k-medoids) and in evaluation.
Ask which one a salary report should quote, and why the answer is political.

--

## One Value, Two Very Different Reactions

<div class="viz viz-lg" data-viz="math/robust-center" data-steps="3"></div>

**Commit first:** drag the top salary to the far right. Which marker follows?

Notes:
Manipulable widget (P6 tier 3) with the prediction taken first, as the policy
requires. The mean is drawn as the fulcrum the beam balances on, so the drag is
visibly a lever: one value far out has to be balanced by everything else.

Drag it all the way and stop. The mean is now above six of the seven salaries —
a "typical" value that almost nobody earns. The median has not moved at
all — it is still 44 k€. Then ask the political question: which number goes in the recruitment
advert, and which one in the union's press release?

--

## Mini-Exercise

Salaries in a small firm (in k€): 38, 41, 42, 44, 45, 47, 260.

Compute the mean and the median. Which number should appear in a recruitment ad,
and which one describes a typical employee?

--

## Mini-Exercise — Solution


<div class="fragment">

Mean $\approx 73.9$, median $= 44$.

The single large value pulls the mean above **every** salary except one. The
median describes the typical employee; the mean describes the payroll divided by
headcount. Both are correct — they answer different questions.

</div>


Notes:
The punchline: neither number is wrong, but only one is honest as a summary of
"typical". This is the first appearance of the idea that a statistic encodes a
question.

--

## Dispersion

**Dispersion** describes how stretched or squeezed the data is around its
centre.


<div class="grid-2">


<div class="column">


<div class="card">

**Sample variance** — the variance *of the observed data*
$$s^2 = \frac{1}{n}\sum\_{i=1}^{n}(x\_i - \overline{x})^2$$

**Standard deviation** $s = \sqrt{s^2}$, in the unit of the data.

</div>


</div>


<div class="column">


<div class="c-tip">

Computable in **one pass** over the data, $O(n)$, using
$$\sum x\_i^2 \text{ and } \sum x\_i$$
— which matters when the data does not fit in memory.

</div>


</div>


</div>


Notes:
The one-pass remark is the data-engineering link: streaming aggregations rely on
it. Mention the numerical-stability caveat if the group is advanced.

--

## Why the Denominator Changes


<div class="c-definition">

The **population variance** $\sigma^2$ is the variance over the whole
population. If the true mean $\mu$ is unknown, we must estimate it — and using
$\overline{x}$ in its place makes the deviations systematically too small.

$$
\hat{\sigma}^2 = \frac{1}{n-1}\sum\_{i=1}^{n}(x\_i - \overline{x})^2
$$

</div>



<div class="c-note">

Dividing by $n-1$ compensates: one degree of freedom was spent estimating the
mean from the same data.

Naming is not uniform: many textbooks, and pandas, call the $n-1$ version $s^2$;
NumPy's `var` divides by $n$ unless told otherwise.

</div>


Notes:
Do not derive the correction; give the intuition. A good probe: with n = 1, the
sample variance is 0 (the point equals its own mean) — clearly not an estimate
of population spread, and the corrected formula refuses to answer at all.

--

## Takeaway


<div class="takeaway">

$s^2$ describes **the sample**; $\hat{\sigma}^2$ estimates **the population**.
The $n-1$ is not a convention — it is the price of having estimated the mean
from the same data.

</div>


--

## Quantiles


<div class="c-definition">

The $k$-th $q$-**quantile** is the value $x$ such that $k/q$ of the values are
smaller and $(q-k)/q$ are larger ($0 < k < q$).

</div>



<div class="grid-3">


<div class="column">

### Percentiles
$q = 100$

"the 12th percentile"

</div>


<div class="column">

### Quartiles
$q = 4$

$Q\_1$ = 25th, $Q\_2$ = 50th (= median), $Q\_3$ = 75th percentile

</div>


<div class="column">

### IQR
$$\mathrm{IQR} = Q\_3 - Q\_1$$

the middle half of the data

</div>


</div>


Quantiles summarise **shape and skewness** without assuming a distribution.

Notes:
Quantiles are the distribution-free alternative to moments: no assumption of
symmetry, no sensitivity to tails. The boxplot is their standard graphical form
— minimum, Q1, median, Q3, maximum, with outliers marked separately.

--

## Anscombe's Quartet

<div class="viz viz-lg" data-viz="math/anscombe-quartet" data-steps="5"></div>

Notes:
Stepped reveal (P6): one dataset per click, then the shared regression line
and the shared statistics.
All four have the same mean, variance, correlation and least-squares line.
Ask after the fourth click, before revealing: "these four have identical
summary statistics — what does that tell you about summary statistics?"
Anscombe (1973), the origin of "always plot your data".

--

## What the Quartet Teaches


<div class="grid-2">


<div class="column">


<div class="c-warning">

**Summaries compress — and compression loses.**

Identical moments can hide a curve, an outlier, or a variable that barely
varies at all.

</div>


</div>


<div class="column">


<div class="c-tip">

**Plot first, summarise second.**

Visual inspection is not a soft alternative to statistics; it is how you find
out which statistics are meaningful.

</div>


</div>


</div>



<div class="takeaway">

Quantiles describe a distribution without assuming its shape — and no set of
summary numbers can replace looking at the data.

</div>


Notes:
This is the bridge to the data-exploration chapter, where visual analytics gets
its own treatment. Stabilise the lesson as a working rule, not a slogan: every
summary answers one question and is silent about the rest.

--

## You Computed a Number. Which Number Did You Want?

Seven salaries gave a sample mean of $\overline{x} = 73.9$ k€.


<div class="q">

What is the probability that the population mean $\mu$ is exactly 73.9 k€?

</div>



<div class="fragment">

Zero. $\overline{x}$ is not $\mu$ — it is one **estimate** of it, computed from
the seven people who happened to be in the sample.

The honest question is not *what is $\mu$* but **how far from $\mu$ can this
number be?**

</div>


Notes:
Open on the gap, not on a definition (P1, P4). Most students will answer with a
number or hedge; the point is that the question is malformed. Everything in this
unit exists to replace "μ = 73.9" with "μ = 73.9 ± something", and to say where
the something comes from.

--

## Estimator and Estimate


<div class="c-definition">

**Definition.** An **estimator** is a function of the sample —
$\hat{\theta} = g(X\_1, \ldots, X\_n)$ — used to approximate an unknown quantity
$\theta$ of the population. The number it takes on for one particular sample is
an **estimate**.

</div>


The sample is random, so the estimator is a **function of random variables**:
$\hat{\theta}$ is itself a random variable, with a distribution of its own.


<div class="c-note">

$\overline{x}$, $s^2$ and $\hat{\sigma}^2$ from descriptive statistics are all
estimators. We used them without saying what kind of object they are.

</div>


Notes:
Math first (P5) — this is a second pass over objects the students already
compute. The load-bearing sentence is the middle one: a statistic inherits
randomness from the sample. Everything else follows from taking that seriously.

--

## An Estimator Has a Distribution

<div class="viz viz-lg" data-viz="math/sampling-distribution" data-steps="4"
 data-params='{"shape": "uniform", "n": 5}'></div>

**Predict first:** after a thousand samples, what shape will the lower picture
have — and how wide?

Notes:
Stepped visualization (P6 tier 2 with tier-3 controls). One click per step: draw
one sample; record its mean; fifty samples; a thousand, with the normal curve
and the standard error. Both pictures share the x-axis, so "the means are more
tightly packed than the population" is something students see rather than
something we assert. Collect predictions before the third click — the common
guess is that the spread stays the same.

--

## Three Things the Picture Shows


<div class="marks-step">

- The means pile up **around $\mu$** — the estimator is not systematically off
- The pile is **narrower than the population** — averaging cancels noise
- The pile is **bell-shaped**, even though the population was not

</div>



<div class="c-definition">

**Definition (Sampling distribution).** The distribution of an estimator
$\hat{\theta}$ over all possible samples of size $n$.
$\hat{\theta}$ is **unbiased** if $E[\hat{\theta}] = \theta$.

</div>


Notes:
The three observations are, in order: unbiasedness, the standard error, and the
central limit theorem — named on the next slides. Naming them here would be
faster and worse. Ask which of the three would still hold for the *median*
(the first two do; the third does too, but that needs a different argument).

--

## Use the Widget: Change the Population

Set the population to **skewed** and then to **bimodal**, keeping $n = 5$.


<div class="q">

Which of the three observations survive a population that is not symmetric?

</div>



<div class="fragment">

All three. The shape of the sampling distribution stops depending on the shape
of the population as soon as $n$ is more than a handful — which is why one
formula can cover cases we never inspect.

</div>


Notes:
Tier-3 exploration, with the prediction committed first as the policy requires.
The bimodal population is the persuasive one: two separate humps, and the means
of five draws still form a single bell. Push n to 2 to show where it breaks
down — the claim is asymptotic, not magic.

--

## Standard Error


<div class="c-definition">

**Definition (Standard error).** The standard deviation of an estimator's
sampling distribution. For the sample mean of independent draws:
$$
\mathrm{SE}(\overline{X}) = \frac{\sigma}{\sqrt{n}}
$$

</div>


It is measured in the unit of the data and answers "how far off is a typical
estimate", where $\sigma$ answers "how far apart are typical *observations*".


<div class="c-warning">

$\sigma$ and $\mathrm{SE}$ are different quantities. More data does nothing to
$\sigma$ — the world stays as variable as it was — and shrinks $\mathrm{SE}$.

</div>


Notes:
The warning is the most valuable line in the unit: σ is the variability of the
world (aleatoric uncertainty), SE is our ignorance about the estimate (epistemic
uncertainty) — the two words return at the end of the unit. Ask which one a weather
forecast's "±3 °C" refers to; the answer is usually both, mixed.

--

## Precision Costs Data

| Multiply the data by… | …and the standard error is multiplied by |
|---|---|
| 2 | 0.71 |
| **4** | **½** |
| 25 | ⅕ |
| **100** | **⅒** |

The $\sqrt{n}$ is why the last digit of an estimate is so expensive: halving the
error costs four times the data, and a tenfold improvement costs a hundredfold.

Notes:
The economics of data collection in one line, and a sanity check students can
apply to any claim about "more data". Ask what this implies for an A/B test that
wants to detect a 0.1% difference. It also foreshadows why we later care about
better *models* rather than only bigger *samples*.

--

## Two Theorems We Have Already Seen Happen


<div class="grid-2">


<div class="column">


<div class="c-insight">

**Law of large numbers**

$\overline{X}\_n \to \mu$ as $n \to \infty$.

The estimate converges on the truth — the pile keeps narrowing.

</div>


</div>


<div class="column">


<div class="c-insight">

**Central limit theorem**

$\overline{X}\_n$ is approximately
$N(\mu, \sigma^2/n)$ for large $n$.

And we know the *shape* of what is left.

</div>


</div>


</div>


The first says the error goes away; the second says how much of it is left after
$n$ observations. Only the second lets us put a number on our ignorance.

Notes:
Deliberate spiral (P7): the CLT was stated in the continuous-distributions unit
and was visible in the binomial sweep. Here it acquires a job. Emphasise the
division of labour between the two theorems — students routinely quote the LLN
where they need the CLT.

--

## From a Number to an Interval

If $\overline{X} \approx N(\mu, \sigma^2/n)$, then for 95% of samples
$\overline{X}$ lands within $1.96\thinsp\mathrm{SE}$ of $\mu$ — and therefore $\mu$
lands within $1.96\thinsp\mathrm{SE}$ of $\overline{X}$.

<div class="viz eq-explain" data-viz="core/equation-explain" data-steps="3"
 data-params='{"labels": ["the estimate — our best single guess", "how confident we insist on being", "how noisy the estimate is"]}'>

$$
\eqa{\overline{x}} \pm \eqb{1.96} \cdot \eqc{\frac{\sigma}{\sqrt{n}}}
$$

</div>

Notes:
Math-first-then-meaning (P5), legitimate because the picture came first. Walk the
three parts and ask what each one would have to do to make the interval wider.
σ is treated as known here; the correction for an estimated σ (the t
distribution) is a refinement, not a different idea.

--

## What Does "95% Confident" Mean?

<div class="viz viz-lg" data-viz="math/confidence-intervals" data-steps="4"
 data-params='{"mu": 100, "sigma": 15, "n": 10, "level": 0.95}'></div>

Notes:
Stepped, then manipulable. One interval; twenty; sixty with the coverage tally;
then the invitation to change the level and n. Ask before the third click how
many of sixty intervals should miss. The red rows are the whole argument: the
misses look exactly like the hits from the inside.

--

## The Sentence Almost Everyone Gets Wrong


<div class="grid-2">


<div class="column">


<div class="card muted">

<span class="eyebrow">What it does not mean</span>

"There is a 95% probability that $\mu$ lies in **this** interval."

$\mu$ is a fixed number. It is either in this interval or it is not — there is
no probability left to have.

</div>


</div>


<div class="column">


<div class="c-important">

<span class="eyebrow">What it means</span>

"95% of the intervals produced **by this procedure** contain $\mu$."

The probability is a property of the recipe, evaluated before the data is seen.

</div>


</div>


</div>


Notes:
This is the distinction the picture just made — the rows are the procedure, one
row is your data. Expect resistance: the wrong reading is the useful-sounding
one. Note also that a Bayesian credible interval *does* license the first
sentence, at the price of requiring a prior — a forward pointer, not a
dependency.

--

## Where This Leaves Us


<div class="grid-2-1">


<div class="column">

Two kinds of uncertainty meet in one formula. We can now measure one of them.


<div class="marks-step">

- $\sigma$ — how variable the world is. **Aleatoric.** Unchanged by data.
- $\mathrm{SE} = \sigma/\sqrt{n}$ — how badly we know our own estimate.
 **Epistemic.** Shrinks with data.

</div>


</div>


<div class="column">


<div class="c-note">

"More data helps" was a slogan.

It is now a rate: $1/\sqrt{n}$.

</div>


</div>


</div>


Notes:
If the course has already named the two kinds of uncertainty, close that loop
here; if not, the two bullets introduce the words. This is the slide to point back to
whenever a later lecture claims a model is uncertain "because it has not seen
enough" — that claim has a magnitude, and this is where it comes from.

--

## Mini-Exercise

A shop timed $n = 100$ customers at a counter: $\overline{x} = 180$ s, and past
records give $\sigma = 60$ s. What is the standard error — and how many
customers would halve it?


<div class="fragment">

$\mathrm{SE} = 60/\sqrt{100} = 6$ s, so the 95% interval is about
$180 \pm 12$ s. Halving the SE needs twice the $\sqrt{n}$ — **four times the
data**, $n = 400$. $\sigma = 60$ s does not change: customers stay as variable
as they were; only our knowledge of their average improves.

</div>


Notes:
Solution on the same slide, click-gated. The second part is the one that
transfers: the √n law is the answer to nearly every "how much data do we need"
question a student will be asked. The interval is 180 ± 1.96 · 6 ≈ [168, 192] s.
If time allows, ask what would change if σ had to be estimated too.

--

## Takeaway


<div class="takeaway">

A statistic is a **random variable**. Its distribution over repeated samples is
the sampling distribution; its spread is the **standard error**, $\sigma/\sqrt{n}$.
A confidence interval reports that spread — and its percentage describes the
**procedure**, not the one interval in front of you.

</div>


Notes:
Stabilise three things: statistic-as-random-variable, the 1/√n rate, and the
procedure reading of confidence. All three return whenever a measured number —
an accuracy, an error rate — is reported with an error bar, and a Bayesian
treatment gives the same question a different, more directly stated answer.

---

# Module 7
## Hypothesis Testing

> **Guiding Question:** Your new model scores higher than the baseline. How do
> you know the improvement is real?

--

## Motivation: Comparing Two ML Experiments


<div class="grid-2">


<div class="column">


<div class="card">

**Experiment A** — baseline model

accuracy measured over $n\_A$ runs

</div>


</div>


<div class="column">


<div class="card">

**Experiment B** — new architecture

accuracy measured over $n\_B$ runs

</div>


</div>


</div>


**B scored higher. Is the improvement systematic, or just randomness?**


<div class="c-note">

$H\_0$: the two means are equal — $\mu\_A = \mu\_B$
<br>
$H\_1$: they differ — $\mu\_A \neq \mu\_B$

</div>


Notes:
Guiding question of the module, in the students' own working context. Every one
of them has compared two model runs; almost none has asked whether the
difference survives resampling. Keep the example running through the unit.

--

## The Idea


<div class="c-insight">

Compare what we **observed** with what $H\_0$ **predicts**. If the disagreement
is large enough to be implausible under $H\_0$, reject $H\_0$.

</div>


We never prove $H\_1$. We only measure how badly $H\_0$ fails to explain the data.

Notes:
The asymmetry is the hardest idea in the unit. "Fail to reject" is not
"accept". Ask what a court verdict of "not guilty" claims, and what it does not.

--

## Test Statistic and p-Value


<div class="grid-2-1">


<div class="column">

A **test statistic** $T = T(X\_1, \ldots, X\_n)$ compresses the data so that its
distribution **under $H\_0$** is known.

The **p-value** is the probability, under $H\_0$, of observing a statistic at
least as extreme as the one we got.

Small p-value → the data is surprising under $H\_0$.

</div>


<div class="column">


<div class="c-warning">

The p-value is **not** the probability that $H\_0$ is true.

It is $P(|T| \ge |t\_{\text{obs}}| \mid H\_0)$ — a tail probability of the
statistic — not $P(H\_0 \mid \text{data})$.

</div>


</div>


</div>


Notes:
The warning box is the Bayes unit returning: swapping the two conditionals is
the same error as the disease test, now with a career's worth of published
consequences. Make that link explicit — students remember it.

--

## The Rejection Region

<div class="viz viz-lg" data-viz="math/distribution-explorer" data-steps="1"
 data-params='{"kind": "normal", "mu": 0, "sigma": 1, "shade": [1.96, 4]}'></div>

Under $H\_0$ the statistic follows a known distribution. The shaded tail carries
probability $\alpha/2$: if $T$ lands there, we reject.

Notes:
One click shades the tail. Emphasise: α is chosen *before* seeing the data, and
it is the rate of false alarms we are willing to tolerate — a decision, not a
discovery.

--

## Two Ways to Be Wrong


<div class="grid-2">


<div class="column">


<div class="card">

**Type I error** — false alarm

Reject $H\_0$ when it is true.

Probability $\alpha$ (we choose it).

</div>


</div>


<div class="column">


<div class="card">

**Type II error** — miss

Fail to reject $H\_0$ when $H\_1$ holds.

Probability $\beta$; **power** $= 1 - \beta$.

</div>


</div>


</div>


Lowering $\alpha$ raises $\beta$ for a fixed design. To improve both: more
data, less noise, or a **paired** design that cancels shared noise.

Notes:
The trade-off is the practical content of the slide. In an ML context: a strict
α means real improvements get dismissed; a lax α means noise gets published.
Power analysis answers "how many runs do I need", which is the question people
actually have. The paired design is the cheap one in ML: evaluate both models on
the same seeds and test splits, and the split-to-split noise cancels in the
differences.

--

## One Sample: $z$ or $t$?


<div class="grid-2">


<div class="card">

### Known variance — $z$-test
$$Z = \frac{\overline{X} - \mu\_0}{\sigma/\sqrt{n}}$$
Reject (two-sided) if $|Z| > z\_{1-\alpha/2}$.

</div>


<div class="card">

### Unknown variance — $t$-test
$$T = \frac{\overline{X} - \mu\_0}{s/\sqrt{n}}$$
$s$ estimated from the data → **heavier tails** ($t$ with $n-1$ d.f.).

</div>


</div>



<div class="c-note">

$\sigma/\sqrt{n}$ is the **standard error**: the standard deviation of the
sample mean $\overline{X}$. $s = \sqrt{s^2}$ is the sample standard deviation.
Both statistics measure the distance from $\mu\_0$ in standard errors.

</div>


Notes:
The only difference between the two is the denominator. Plugging in an estimate
$s$ for $\sigma$ adds uncertainty, which the $t$ distribution's heavier tails
pay for; with $n \ge 30$ the two are practically the same.

--

## Two Samples: Which $t$?

| Situation | Test | Statistic |
|---|---|---|
| independent runs, equal variances credible | pooled $t$ | $\frac{\overline{X}\_B - \overline{X}\_A}{s\_p \sqrt{1/n\_A + 1/n\_B}}$ |
| independent runs, variances may differ | **Welch's $t$** | $\frac{\overline{X}\_B - \overline{X}\_A}{\sqrt{s\_A^2/n\_A + s\_B^2/n\_B}}$ |
| both models on the **same** seeds or splits | **paired $t$** | $t$-test on the differences $d\_i = x\_{B,i} - x\_{A,i}$ |


<div class="c-tip">

Welch is the default for independent runs. When both models can be run on the
same splits, pair them: the shared noise cancels in $d\_i$.

</div>


Notes:
A table because the three tests differ along the same dimensions. Welch by
default because the equal-variance assumption is rarely justified across
architectures. The paired test is the one ML comparisons usually need and
rarely use: a cross-validation comparison evaluates both models on the same
folds, so the fold results are not independent samples.

--

## Testing Variances


<div class="grid-2">


<div class="column">

**Single variance** (normal model), $\chi^2$ statistic with $n-1$ degrees of
freedom.

*Is run-to-run variability within specification?*

</div>


<div class="column">

**Two variances**, $F = s\_A^2 / s\_B^2$.

If the variances differ, **do not pool** — go back to Welch's $t$ for the means.

</div>


</div>


Notes:
Variance tests matter in ML more than people think: a model that is equally
accurate on average but wildly less stable across seeds is a different product.

--

## Back to the A/B Question — Worked

Ten runs each. A: mean accuracy 80 %, $s\_A = 2$. B: mean 82 %, $s\_B = 1$.

$$
t = \frac{82 - 80}{\sqrt{4/10 + 1/10}} = \frac{2}{0.71} \approx 2.83
$$


<div class="fragment">

Welch's degrees of freedom ≈ 13; the critical value $t\_{0.975} \approx 2.16$.
Since $2.83 > 2.16$, **reject $H\_0$** at $\alpha = 0.05$ ($p \approx 0.014$).

</div>



<div class="fragment c-insight">

Paired on the same ten seeds, with differences of mean 2 and $s\_d = 0.5$:
$t = 2 / (0.5/\sqrt{10}) \approx 12.6$. Pairing buys far more power than more
runs.

</div>


Notes:
The numbers are chosen so the standard error is $\sqrt{0.5} \approx 0.71$.
Welch's d.f.: $0.25 / ((0.16 + 0.01)/9) \approx 13.2$. The paired numbers are
hypothetical — the point is that the per-seed differences vary far less than
either model's accuracies do, because a hard seed is hard for both.

--

## The Recommendation


<div class="grid-3">


<div class="card">

### Default
Welch's two-sample $t$ on the mean difference — or paired $t$ if both ran on
the same splits

</div>


<div class="card">

### Care about stability
$F$-test on $s\_A^2 / s\_B^2$

</div>


<div class="card">

### Normality dubious
Permutation (randomisation) test on the mean difference

</div>


</div>



<div class="takeaway">

Hypothesis testing compares data to a model through a statistic whose null
distribution is known. Known vs. unknown variance changes that distribution
($z$ vs. $t$); the design changes the test (Welch for independent runs, paired
for shared splits).

## The Churn Shop: Is the Difference Real?

Lecture 01's dashboard, with counts. Over one year:

| | customers | churned | rate |
|---|---|---|---|
| **app users** | 400 | 40 | 10% |
| **no app** | 400 | 60 | 15% |

$H\_0$: both groups churn at the same rate. Pooled rate $\hat{p} = 100/800 = 0.125$.


<div class="fragment">

$$
z = \frac{0.15 - 0.10}{\sqrt{\hat{p}(1-\hat{p})\left(\frac{1}{400} + \frac{1}{400}\right)}}
  = \frac{0.05}{0.023} \approx 2.1 \qquad p \approx 0.03
$$

</div>



<div class="fragment">


<div class="c-insight">

Chance alone would rarely produce a gap this large: at $\alpha = 0.05$ the
difference is **real**. Whether the app *causes* it is a different question —
Lecture 03 draws both answers.

</div>

z-test of this lecture applied to two proportions: a proportion is the mean of a
Bernoulli variable, so its standard error is √(p(1−p)/n), and under H₀ both
groups share one p, estimated from all 800 customers. Exact values: SE ≈ 0.0234,
z ≈ 2.14, two-sided p ≈ 0.033.

Say the limit clearly: the test says the gap is unlikely under "no
difference"; it says nothing about which way the arrow points. Loyal customers
may simply be the ones who install the app.
