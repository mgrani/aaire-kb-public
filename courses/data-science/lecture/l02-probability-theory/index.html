## Example: Two Fruit Boxes


<div class="grid-2">


<div class="column">


<div class="card">

**Red box**

2 apples, 6 oranges

</div>


</div>


<div class="column">


<div class="card">

**Blue box**

3 apples, 1 orange

</div>


</div>


</div>


We pick a box, then a fruit from it.

- If we pick the **red box 40%** of the time, how often do we get an apple?
- We got an **orange** — which box did it probably come from?

Notes:
Deliberate overview slide (P4): the two questions are the whole chapter in
miniature. Do not formalise anything yet — the point is that both questions are
answerable by counting, and that the second one feels harder than the first.

--

## The Counts, in One Grid

A hundred picks with the red box chosen 40% of the time, as a table of counts —
box across, fruit down:

| | $B = r$ | $B = b$ | **row total** |
|---|---|---|---|
| $F = a$ (apple) | 10 | 45 | **55** |
| $F = o$ (orange) | 30 | 15 | **45** |
| **column total** | **40** | **60** | **100** |


<div class="grid-3">


<div class="column">


<div class="card">

**Joint**

a single cell over the total

$P(B=r, F=a) = \tfrac{10}{100}$

</div>


</div>


<div class="column">


<div class="card">

**Marginal**

a row or column total over the total

$P(F=a) = \tfrac{55}{100}$

</div>


</div>


<div class="column">


<div class="card">

**Conditional**

a cell over its own row or column

$P(F=a \mid B=r) = \tfrac{10}{40}$

</div>


</div>


</div>


Notes:
The counts are what the boxes' contents would produce on average: of 40 red
picks a quarter are apples, of 60 blue picks three quarters. Everything on this
slide is division of counts. Have students compute one of
each kind before naming them. The names will be redefined formally later; here
they are labels for three ways of dividing the same table.

--

## The Two Rules


<div class="grid-2">


<div class="column">


<div class="c-definition">

**Sum rule**
$$
P(X) = \sum\_Y P(X, Y)
$$
Add along a row or column to remove a variable.

</div>


</div>


<div class="column">


<div class="c-definition">

**Product rule**
$$
P(X, Y) = P(Y \mid X) P(X)
$$
A cell is its column total times its share of that column.

</div>


</div>


</div>


Almost all of probability theory is these two rules applied repeatedly.

Notes:
This is the Bishop framing: two rules, everything else derived. Students who
carry only these two out of the chapter are in good shape — the formal
apparatus that follows exists to justify them and to extend them beyond finite
tables.

--

## Bayes' Theorem, in Advance

Combining the two rules and the symmetry $P(X,Y) = P(Y,X)$:

$$
P(Y \mid X) = \frac{P(X \mid Y) P(Y)}{P(X)},
\qquad P(X) = \sum\_Y P(X \mid Y) P(Y)
$$

**Which box did the orange come from?**


<div class="fragment">

$$
P(B = r \mid F = o) = \frac{P(F=o \mid B=r) P(B=r)}{P(F=o)}
= \frac{\tfrac{6}{8}\cdot 0.4}{\tfrac{6}{8} \cdot 0.4 + \tfrac{1}{4} \cdot 0.6} = \tfrac{2}{3}
$$

Before the pick: 40% red. After seeing an orange: 67% red. The orange is
**evidence** — because the red box is full of oranges and the blue one is not.

</div>



<div class="fragment">


<div class="q">

And if the blue box held 3 apples and 9 oranges — the same orange share as the
red one?

</div>


</div>


Notes:
Bishop's numbers: the answer moves from 0.4 to 2/3, and the table on the
previous slide confirms it (30 of 45 oranges came from red). Then the follow-up
question: with 3 apples and 9 oranges in blue, both boxes are 75% oranges and
the posterior is the prior, 0.4 — the fruit says nothing about the box. That is
the deeper lesson: evidence updates belief only to the extent that the
hypotheses predict different things.

--

## Takeaway


<div class="takeaway">

Two rules — **sum** to remove a variable, **product** to split a joint — generate
joint, marginal, conditional probabilities and Bayes' theorem. What follows
makes them precise and extends them beyond counting.

</div>


Notes:
Signpost explicitly: everything just used informally gets a definition in the
coming modules. This unit is the map, not the territory.

# Module 1
## Events and the Algebra of Sets

> **Guiding Question:** If probability is going to be a *measure*, what exactly
> are the objects it measures — and how do they combine?

--

## What Makes an Experiment "Random"?


<div class="c-definition">

**Definition (Random experiment).** A procedure that can — at least in theory —
be repeated infinitely often, characterised by:

1. **Configuration** — a precisely specified system that can be reconstructed.
2. **Procedure** — an instruction for executing the experiment.
3. **Unpredictability** of the outcome.

</div>


**Coin flip:** a 1-Euro coin (configuration), placed on the thumb and snapped
into the air (procedure), record heads or tails (outcome).

Notes:
Note what the definition does *not* say: nothing about the world being
indeterministic. Ask students for a "natural random experiment" — rainfall,
click-through, a queue — where nobody designed the configuration.

--

## Randomness as Missing Information


<div class="c-note">

A random experiment is still causal. Its unpredictability reflects **missing
information about the causal chain**, not an absence of causes.

Consequence: a random experiment can become a deterministic process once new
information is available.

</div>


A coin flip filmed at 10,000 fps and measured precisely enough stops being
random. What does that imply for a model that calls something "random"?

Notes:
This is the epistemic-modeling principle in probability form (P3): calling
something random is a statement about our knowledge, not only about the system.
Good place to ask where that matters in data science — noise vs. unmodelled
signal is the same distinction.

--

## Sample Space and Events


<div class="c-definition">

**Definition (Sample space, event space).**
A set $\Omega = \lbrace \omega\_1, \omega\_2, \ldots, \omega\_n\rbrace $ is the **sample
space** of a random experiment if every outcome is associated with exactly one
element $\omega \in \Omega$. The elements are called **outcomes**.

Let $\Omega$ be finite. Every subset $A \subseteq \Omega$ is an **event**; the
event $A$ **occurs** iff the observed outcome $\omega$ is a member of $A$.
The set of all events, the power set $\mathcal{P}(\Omega)$, is the **event
space**.

</div>


An outcome is a single result; an event is a *question you can ask* about the
result.

For infinite $\Omega$ — the drug dosage below — the event space is a suitable
family of subsets rather than the full power set; we return to this when
continuous distributions appear.

Notes:
Math first (P5). The load-bearing word is "exactly one" — outcomes must be
mutually exclusive and exhaustive, which is a modelling decision, not a
mathematical one. The outcome/event distinction is the one students blur.

--

## Important Event Types


<div class="grid-3">


<div class="column">

### $\emptyset$
impossible event

</div>


<div class="column">

### $\Omega$
certain event

</div>


<div class="column">

### $\overline{A} := \Omega \setminus A$
complementary event

</div>


<div class="column">

### $|A| = 1$
elementary event

</div>


<div class="column">

### $A \subseteq B$
$A$ is a sub-event of $B$ — "$A$ entails $B$"

</div>


<div class="column">

### $A \cap B = \emptyset$
$A$ and $B$ are incompatible

</div>


</div>


Notes:
2x3 grid, read as vocabulary rather than results. "Entails" is worth dwelling
on: set inclusion is logical implication between events, which is why the next
unit can do algebra with pictures.

--

## Examples


<div class="grid-2">


<div class="column">

**One coin flip**

$\Omega = \lbrace H, T\rbrace $

$\mathcal{P}(\Omega) = \lbrace \emptyset, \lbrace H\rbrace , \lbrace T\rbrace , \lbrace H,T\rbrace \rbrace $

Event "heads": $E = \lbrace H\rbrace $

</div>


<div class="column">

**Two coin flips**

$\Omega = \lbrace HH, HT, TH, TT\rbrace $

Event "at least one head":
$E = \lbrace HH, HT, TH\rbrace $

Four outcomes, sixteen possible events.

</div>


</div>


Notes:
Have students write down the event "exactly one head" ({HT, TH}) and the event
"the first flip is heads" ({HH, HT}) — same sample space, different questions.

--

## The Event Space Grows Fast

**Three-sided die:** $\Omega = \lbrace 1, 2, 3\rbrace $, so $\mathcal{P}(\Omega)$ has
$2^3 = 8$ events, ordered by inclusion:


<div class="grid-3">


<div class="column">

$\lbrace 1,2,3\rbrace $

</div>


<div class="column">

$\lbrace 1,2\rbrace \quad \lbrace 1,3\rbrace \quad \lbrace 2,3\rbrace $

</div>


<div class="column">

$\lbrace 1\rbrace \quad \lbrace 2\rbrace \quad \lbrace 3\rbrace \quad \emptyset$

</div>


</div>


For $|\Omega| = n$ the event space has $2^n$ elements — far too many to list,
which is why probability is done by counting, not by enumeration.

Notes:
The lattice diagram of the original is replaced by three inclusion levels;
the point is the 2^n growth, not the drawing. This motivates counting and,
later, why we cannot always take the full power set for infinite Ω.

--

## Not Every Sample Space Is Finite


<div class="grid-2">


<div class="column">

**Dosage of a drug**

$\Omega = (0, \infty)$

Uncountably many outcomes.

</div>


<div class="column">

**Race with 7 teams**

$\Omega = \lbrace \text{all orderings of } 1,\ldots,7\rbrace $

$7! = 5040$ outcomes.

</div>


</div>



<div class="takeaway">

Choosing $\Omega$ is a modelling decision: it fixes what counts as an outcome,
and therefore which questions can be asked at all.

</div>


Notes:
Close the module on the modelling move (P3). Ask what is lost by modelling
dosage as a positive real (measurement precision, dosing intervals) — the same
question returns for every feature in every dataset later in the course.

--

## Venn Diagrams

**Venn diagrams** are the graphical representation of events:

- the rectangle represents the sample space $\Omega$
- circles represent events $A \subseteq \Omega$, $A \in \mathcal{P}(\Omega)$

Every region of the picture *is* a set — and every set operation is a region
you can point at.

Notes:
Bridge from sets to pictures before any formula (P4). The payoff of the
diagram: once probabilities are attached, probability laws become area
arguments.

--

## Important Event Types

**Before each step: which region will light up?**

<div class="viz" data-viz="math/set-operations" data-steps="4"
 data-params='{"sets": 2, "ops": ["A", "notA", "subset", "disjoint"]}'></div>

Notes:
Stepped visualization (P6, tier 2), one click per event type: the event A;
the complement Ā = Ω∖A; the subset B ⊂ A; disjoint events A ∩ B = ∅.
Predict-then-check on every click — students name the region first, the
highlight confirms. Disjointness is the one to slow down on: it is a statement

--

## Algebra of Events

| Law | Union form | Intersection form |
|---|---|---|
| Commutative | $A\cup B = B \cup A$ | $A\cap B = B\cap A$ |
| Associative | $(A\cup B)\cup C = A \cup (B \cup C)$ | $(A\cap B)\cap C = A \cap (B \cap C)$ |
| Distributive | $(A\cup B)\cap C = (A \cap C) \cup (B \cap C)$ | $(A\cap B)\cup C = (A \cup C) \cap (B \cup C)$ |

Events form a set algebra — the same laws you know, but now every identity is
a picture.

--

## Set Operations as Regions

<div class="viz" data-viz="math/set-operations" data-steps="4"
 data-params='{"sets": 3, "ops": ["AuB", "AnB", "AnBnC", "AuBuC"]}'></div>

Notes:
Second stepped pass with three sets: A∪B, A∩B, A∩B∩C, A∪B∪C. Same
predict-then-check rhythm.

--

## Mini-Exercise

Sketch (pen and paper) the regions for:

1. $(A\cup B)\cap C$
2. $(A\cap B)\cup C$

Are they the same region? Which algebra law says so — or says they are not?

--

## Mini-Exercise — Solution


<div class="fragment">

They differ: $(A\cup B)\cap C$ lies entirely **inside** $C$, while
$(A\cap B)\cup C$ contains **all** of $C$ plus the lens $A\cap B$ outside it.

The distributive laws expand each into a different expression — the algebra
distinguishes exactly what the picture shows.

</div>


Notes:
Solution fragmented per the animation policy (solutions always click-gated).
This replaces the last two TikZ slides of the original unit with an active
task — same content, students draw instead of watch.

--

## Takeaway


<div class="takeaway">

An event is a **subset** of the sample space, and combining statements about
outcomes is set algebra: *or* is a union, *and* an intersection, *not* a
complement. Choosing $\Omega$ decides which events exist at all.

</div>


Notes:
Module 1 closes here (course-local slide: the Venn unit ends on its exercise).
The point to carry into Module 3: a probability will be a number attached to
each of these subsets, so the algebra of events is what the rules of
probability are written in.

# Module 2
## Counting

> **Guiding Question:** How do we determine the size of a sample space we could
> never write down?

--

## Why Counting Comes First

If every outcome in a finite sample space is equally likely, then the
probability of an event is a **ratio of counts**:

$$
P(A) = \frac{|A|}{|\Omega|}
$$

So before we can measure probability, we must be able to count $|A|$ and
$|\Omega|$ — often without enumerating them.

Notes:
Motivate combinatorics as the arithmetic of sample spaces, not as a separate
topic. Flag the assumption doing the work here — "equally likely" — which the
axiomatic definition of probability replaces with an axiom system that does not need it.

--

## Basic Principle of Counting


<div class="c-definition">

**Generalised basic principle of counting.** If an experiment consists of $r$
stages, where stage $i$ has $n\_i$ possible outcomes regardless of the earlier
stages, then the whole experiment has

$$
n\_1 \cdot n\_2 \cdots n\_r
$$

possible outcomes.

</div>


**Example.** How many 7-place licence plates, if the first 3 places are letters
(26) and the last 4 are digits (10)?

$$
26^3 \cdot 10^4 = 175{,}760{,}000
$$

Notes:
The phrase "regardless of the earlier stages" is the hidden assumption — it
fails as soon as choices interact (no repeated letters, say), which is exactly
what the four cases below systematise.

--

## Three Questions Decide the Formula


<div class="grid-3">


<div class="column">

### Order?
Does the sequence matter?

matters → **permutation**
(rankings)

does not → **combination**
(committees)

</div>


<div class="column">

### Repetition?
May an element be picked twice?

without — teams of people

with — letters in a word

</div>


<div class="column">

### How many?
Select $k$ of $n$ elements, or arrange all $n$?

</div>


</div>


Notes:
Give students a problem and have them answer these three questions *before*
reaching for a formula. Nearly every counting error is a misread of one of
these three, not an algebra slip.

--

## The Four Basic Cases


<div class="grid-2">


<div class="column">


<div class="card">

**Ordered, without repetition**

$k$-permutation of $n$:

$$\frac{n!}{(n-k)!}$$

From $\lbrace a,b\rbrace $, $k=2$: $ab, ba$

</div>


</div>


<div class="column">


<div class="card">

**Ordered, with repetition**

$$n^k$$

From $\lbrace a,b\rbrace $, $k=2$: $aa, ab, ba, bb$

</div>


</div>


<div class="column">


<div class="card">

**Unordered, without repetition**

$k$-combination of $n$:

$$\binom{n}{k} = \frac{n!}{k! (n-k)!}$$

From $\lbrace a,b\rbrace $, $k=2$: $\lbrace a,b\rbrace $

</div>


</div>


<div class="column">


<div class="card">

**Unordered, with repetition**

$$\binom{n+k-1}{k}$$

From $\lbrace a,b\rbrace $, $k=2$: $\lbrace a,a\rbrace , \lbrace a,b\rbrace , \lbrace b,b\rbrace $

</div>


</div>


</div>


Notes:
2x2 grid — the whole unit in one slide. Keep it visible while working examples;
students should learn to locate a problem in this square rather than recall
four formulas in isolation.

--

## Permutations


<div class="c-definition">

**Definition ($k$-permutation).** An ordered selection of $k$ elements from a
set of $n$ distinct elements without repetition. Counting position by position:
$n$ choices, then $n-1$, …, down to $n-k+1$, giving $\frac{n!}{(n-k)!}$.

</div>


**Example.** A class of 6 men and 4 women is ranked after an exam, no ties.
How many possible rankings? $10! = 3{,}628{,}800$.

Notes:
The stage-by-stage argument *is* the basic counting principle applied with a
shrinking pool — worth making explicit so the formula is derived, not given.

--

## Combinations


<div class="grid-2-1">


<div class="column">

Each $k$-combination corresponds to $k!$ different $k$-permutations — the same
$k$ elements in every possible order. Therefore

$$
\binom{n}{k} = \frac{\text{number of } k\text{-permutations}}{k!}
 = \frac{n!}{k! (n-k)!}
$$

**Example.** A committee of 3 from 20 people:
$\binom{20}{3} = 1140$.

</div>


<div class="column">


<div class="c-note">

Dividing by $k!$ is the standard move for "forgetting" an ordering we counted.

Remember it as *over-count, then correct*.

</div>


</div>


</div>


Notes:
The over-count-then-divide pattern recurs constantly. Ask why we divide by k!
and not by something else — because every unordered selection was counted
exactly k! times, uniformly.

--

## Properties of the Binomial Coefficient


<div class="grid-2">


<div class="column">

$$
\binom{n}{k} = \binom{n}{n-k}
$$

Choosing which $k$ to include is the same as choosing which $n-k$ to leave out.

</div>


<div class="column">

$$
\binom{n}{k} = \binom{n-1}{k-1} + \binom{n-1}{k}
$$

Split by a fixed element $i$: groups **containing** $i$, plus groups **not
containing** $i$.

</div>



</div>


<div class="c-definition">

**Binomial theorem.**
$$
(x+y)^n = \sum\_{k=0}^{n} \binom{n}{k} x^k y^{n-k}
$$

</div>


Notes:
Both identities are proved by counting the same set two ways — the standard
combinatorial proof technique. The binomial theorem's proof is the same idea:
expanding the product gives 2^n terms, and x^k y^(n-k) appears exactly as often
as there are ways to pick which k factors contribute x.

--

## Application: How Many Subsets?

A set with $n$ elements has

$$
\sum\_{k=0}^{n} \binom{n}{k} = 2^n
$$

subsets — sum over all subset sizes.


<div class="c-insight">

**Alternative intuition.** Each element is either in the subset or not: a binary
choice, $n$ times, so $2 \cdot 2 \cdots 2 = 2^n$.

</div>


This is the size of the event space $\mathcal{P}(\Omega)$ from the sample-space unit.

Notes:
Close the loop with the sample-space unit: the 2^n we asserted there is now
derived twice. Ask which of the two arguments they would trust more under
pressure — the binary-choice one generalises better.

--

## Mini-Exercise

From 5 people, how many ways are there to pick a **chair and a deputy**? And
how many ways to pick a **two-person committee**?


<div class="fragment">

Chair and deputy: order matters, $5 \cdot 4 = 20$. Committee: each pair was
counted twice (as $ab$ and $ba$), so $20 / 2! = 10 = \binom{5}{2}$.

</div>


Notes:
One point: the same selection, counted with and without order, differs by the
factor $k!$ — over-count, then correct. Ask which cell of the four-case square
each answer sits in.

--

## Takeaway


<div class="takeaway">

Counting reduces to three questions — **order? repetition? how many?** — and one
habit: when an ordering was counted that should not have been, divide it out.

</div>

# Module 3
## What Is a Probability?

> **Guiding Question:** Every attempt to *define* probability turns out to be
> circular. What do we do instead?

--

## An Intuition: Probability as Area

Draw a Venn diagram on the ground, with each area proportional to the number of
elementary events it contains. Throw a stone into the rectangle at random.


<div class="grid-2-1">


<div class="column">

The probability of $A$ is how likely the stone lands inside $A$, assuming

1. we hit the rectangle $\Omega$ for certain, and
2. every part of $\Omega$ is equally likely to be hit.

Probability is then a **measure of the state** $A \subseteq \Omega$ of a random
experiment — literally, how much of the sample space the event occupies.

</div>


<div class="column">


<div class="c-note">

Both assumptions are doing real work.

Assumption 2 is the one we will have to give up.

</div>


</div>


</div>


Notes:
Intuition first (P4), and it connects directly to the Venn unit: events were
regions, now regions have size. Ask what happens to the picture if some parts
of Ω are "heavier" than others — that is precisely what the axioms will allow.

--

## Two Ways to Read a Probability


<div class="grid-2">


<div class="column">


<div class="card">

**Frequentist**

The probability of an elementary event $a$ is the fraction of repetitions of
the experiment that yield $a$.

*Requires* the experiment to be repeatable.

</div>


</div>


<div class="column">


<div class="card">

**Bayesian**

The probability of $a$ is the degree of certainty that $a$ will happen — even
without conducting the experiment.

*Requires* a stated state of knowledge.

</div>


</div>


</div>


Both interpretations yield the same mathematics. They are mental models for
what the number *means*, not different theories.

Notes:
Interpretation over recitation (P2): ask which reading makes sense for "the
probability that this patient has the disease" (no repetition available) versus
"the probability that this machine part fails within a year". The distinction
returns whenever we call something a prior.

--

## The Classical (Laplace) Definition


<div class="c-definition">

**Definition (Classical / Laplace probability).** If every elementary event in
$\Omega$ is assigned the same probability, then

$$
P(A) = \frac{|A|}{|\Omega|}
 = \frac{\text{number of cases favourable for } A}{\text{number of possible outcomes}}
$$

</div>


An experiment whose configuration and procedure make outcomes equiprobable —
by definition or by construction — is a **Laplace experiment**; its
probabilities need not be estimated, they are implied by the setup.

Notes:
This is the definition that counting serves. Emphasise that it is
only usable under the Laplace assumption; when that fails, probabilities must
come from data.

--

## Why That Definition Is Not Enough


<div class="c-warning">

**The circularity.** "Laplace probability" defines probability using
*equiprobability* — that is, using another notion of probability. Strictly
speaking it is a circular definition.

</div>


The frequentist repair — defining probability as the limit of relative
frequencies — fails too: such a limit exists only in mathematical settings,
never in an experiment that can actually be repeated.

**So what do we do?** Stop trying to *define* what probability is, and instead
specify what it must *do*.

Notes:
This slide is the pivot of the module and answers the guiding question. Let the
tension sit for a moment before the axioms arrive: students should feel why an
axiomatic move is the honest way out, not a formal ritual.

--

<!-- .slide: class="smaller" -->

## The Kolmogorov Axioms


<div class="c-definition">

**Definition (Probability measure, Kolmogorov 1933).** Let $\Omega$ be a sample
space and $\mathcal{P}(\Omega)$ its event space. A function
$P : \mathcal{P}(\Omega) \to \mathbb{R}$ is a **probability measure** if:

</div>



<div class="grid-3">


<div class="column">

### Axiom I
$$P(A) \geq 0$$
non-negative

</div>


<div class="column">

### Axiom II
$$P(\Omega) = 1$$
normalised

</div>


<div class="column">

### Axiom III
$$A \cap B = \emptyset \Rightarrow$$
$$P(A \cup B) = P(A) + P(B)$$
additive

</div>


</div>


Nothing is said about *which* probabilities the events get — only about how any
assignment must behave.


<div class="c-note">

**Beyond finite sample spaces.** When $\Omega$ is infinite, the event space is
not the full power set but a **$\sigma$-algebra** of measurable sets, and
Axiom III is required for **countably many** disjoint events. Everything we
compute in this course is unaffected; the construction belongs to measure
theory.

</div>


Notes:
Math first (P5). Ask: which axiom does the area picture make obvious? (All
three — areas are non-negative, the whole rectangle is everything, disjoint
regions have additive areas.) The axioms are the area intuition, minus the
requirement that the areas be equal.

--

## Probability Space


<div class="c-definition">

**Definition.** Let $\Omega$ be a sample space, $\mathcal{P}(\Omega)$ an event
space, and $P$ a probability measure. The triple
$(\Omega, \mathcal{P}(\Omega), P)$ — also written $(\Omega, P)$ — is a
**probability space**.

</div>


Every probabilistic statement in this course is made inside some probability
space. Naming it is the discipline that keeps modelling assumptions visible.

Notes:
Whenever a later theorem opens with "let (Ω, P(Ω), P) be a probability space",
students should hear "we have agreed on outcomes, questions, and a measure".

--

## What the Axioms Already Give Us


<div class="grid-2">


<div class="column">

$$P(A) + P(\overline{A}) = 1$$
*(Axioms II, III)*

</div>


<div class="column">

$$P(\emptyset) = 0$$
*(from the above with $A = \Omega$)*

</div>


<div class="column">

$$A \subseteq B \Rightarrow P(A) \leq P(B)$$
monotonicity *(Axioms I, III)*

</div>


<div class="column">

$$P(A \cup B) = P(A) + P(B) - P(A \cap B)$$
inclusion–exclusion *(Axiom III)*

</div>


</div>


For mutually exclusive $A\_1, \ldots, A\_p$:
$P(A\_1 \cup \ldots \cup A\_p) = P(A\_1) + \ldots + P(A\_p)$.

Notes:
2x2 grid of consequences. Have students justify inclusion–exclusion on the Venn
picture — the overlap was counted twice. Note that "A entails B implies A is no
more likely than B" is monotonicity: the logic of events transfers to numbers.

--

## Takeaway


<div class="takeaway">

Probability is not defined by counting or by repetition — it is any assignment
of numbers to events that is **non-negative, normalised, and additive**. The
Laplace formula is one such assignment, not the definition.

</div>


Notes:
Stabilise the epistemic move: an axiomatic definition says what the object must
do, leaving where the numbers come from to the modeller. That freedom is what
lets the same theory carry frequentist and Bayesian readings.

--

## Laplace Probabilities in Practice

When all outcomes in $\Omega$ are equally likely, computing $P(A)$ means
**counting twice**: the favourable cases, and the possible ones.

$$
P(A) = \frac{|A|}{|\Omega|}
$$

The whole difficulty is choosing a sample space in which "equally likely" is
actually true.

Notes:
The formula is trivial; the modelling is not. Every error in the examples below
comes from an Ω where outcomes are not equiprobable.

--

## Example: Sum of Two Dice

**What is the probability that two dice sum to 7?**


<div class="grid-2-1">


<div class="column">


<div class="fragment">

- $|\Omega| = 6 \cdot 6 = 36$ ordered pairs
- $E = \lbrace (1,6), (6,1), (2,5), (5,2), (3,4), (4,3)\rbrace $, so $|E| = 6$

$$
P(\text{sum} = 7) = \frac{6}{36} = \frac{1}{6}
$$

</div>


</div>


<div class="column">


<div class="c-warning">

Why ordered pairs?

Because $(1,6)$ and $(6,1)$ are two distinct equally likely outcomes — the
unordered sample space is **not** equiprobable.

</div>


</div>


</div>


Notes:
The classic trap. If a student proposes the 21 unordered pairs, ask them to bet
on "double six" versus "one and six" — the intuition corrects itself fast.

--

## Example: Ordered or Unordered — Both Work

An urn holds **6 white** and **5 black** balls. Three are drawn.
**What is the probability of exactly 1 white and 2 black?**


<div class="grid-2">


<div class="column">


<div class="card">

**Variant 1 — order matters**

$|\Omega| = 11 \cdot 10 \cdot 9 = 990$

Favourable: white-black-black, black-white-black, black-black-white
$= 6\cdot5\cdot4 + 5\cdot6\cdot4 + 5\cdot4\cdot6 = 360$

$$\frac{360}{990} = \frac{4}{11}$$

</div>


</div>


<div class="column">


<div class="card">

**Variant 2 — order ignored**

$|\Omega| = \binom{11}{3} = 165$

Favourable:
$\underbrace{\binom{6}{1}}\_{\text{the white}} \cdot \underbrace{\binom{5}{2}}\_{\text{the blacks}} = 6 \cdot 10 = 60$

$$\frac{60}{165} = \frac{4}{11}$$

</div>


</div>


</div>


Notes:
Same answer, two sample spaces — the point of the slide. Both are legitimate
*because* both are equiprobable: ordered draws are equally likely, and so are
unordered groups. Mixing the two (favourable counted unordered, total counted
ordered) is the error to warn against.

--

## The General Rule


<div class="c-insight">

When selecting $k$ items from $n$, you may count **with** or **without** order —
as long as you are consistent, and as long as the chosen sample space really is
equiprobable.

</div>


Pick whichever counting is easier for the event at hand.

Notes:
Connects straight back to the four cases in the counting unit: the choice of
case is a modelling choice about Ω, not a property of the problem.

--

## Mini-Exercise

The urn again, smaller: **2 white and 2 black** balls, two drawn. What is the
probability of **one of each**? Count without order, then check with order.


<div class="fragment">

Unordered: $\binom{4}{2} = 6$ pairs, $2 \cdot 2 = 4$ mixed, so $4/6 = 2/3$.
Ordered: $4 \cdot 3 = 12$ draws, $2 \cdot 2 + 2 \cdot 2 = 8$ mixed, so
$8/12 = 2/3$ — the same, because both sample spaces are equiprobable.

</div>


Notes:
One point: either counting works if it is used consistently. The common error
to listen for is 4 favourable unordered pairs over 12 ordered draws (1/3).
The earlier ten-couples problem ("five chosen from 10 couples, none a couple",
$\binom{10}{5} 2^5 / \binom{20}{5} \approx 0.52$) belongs on the exercise sheet.

--

## Takeaway


<div class="takeaway">

Laplace's formula — favourable over possible cases — is **one** probability
measure, valid only in a sample space whose outcomes are equally likely. The
formula is trivial; choosing that sample space is the work.

</div>


Notes:
Module 3 closes here (course-local slide: the examples unit ends on its
exercise). Connect back to the axioms: Laplace satisfies them, which is why it
is a probability — not the other way round.


---

# Module 4
## Conditioning, Independence, Bayes

> **Guiding Question:** A 99%-accurate test says you are sick. Why is that
> *not* a 99% chance of being sick — and what is the correct bookkeeping?

--

## Motivating Example

You roll a die twice. **After the first roll you see a 3.** Knowing this, what
is the probability that both rolls sum to 8?


<div class="fragment">


<div class="grid-2">


<div class="column">

- Before the first roll: $\Omega = \lbrace (1,1), (1,2), \ldots, (6,6)\rbrace $, $|\Omega| = 36$
- After seeing the 3, only $\Omega\_{red} = \lbrace (3,1), \ldots, (3,6)\rbrace $ remains
- Outcomes like $(2,4)$ have become **impossible**

</div>


<div class="column">

- The reduced space now carries all the probability: $P(\Omega\_{red}) = 1$
- "Sum is 8" inside it: $E = \lbrace (3,5)\rbrace $

$$P = \tfrac{1}{6}$$

</div>


</div>


</div>


Notes:
Intuition first (P4): conditioning is not a new kind of probability, it is the
old probability computed in a **smaller sample space**. Let students do the
count before the definition appears.

--

## Definition


<div class="c-definition">

**Definition (Conditional probability).**
$$
P(A \mid B) = \frac{P(A \cap B)}{P(B)}, \qquad \text{if } P(B) > 0
$$
$P(A \mid B)$ is the probability of $A$ **under the condition** $B$.

</div>


Back to the stone: *given that the stone landed in area $B$, how likely is it
that it also landed in $A$?* We renormalise by the area of $B$, because $B$ is
now the whole world.

Notes:
Math first (P5) after the dice intuition. The division by P(B) is exactly the
renormalisation students performed implicitly when they used the six remaining
outcomes.

--

## Conditioning, Drawn

<div class="viz viz-lg" data-viz="math/conditional-unit-square" data-steps="4"
 data-params='{"pA": 0.4, "pBgivenA": 0.75, "pBgivenNotA": 0.25}'></div>

**Before the last click:** what must the two shaded cells be divided by?

Notes:
Stepped visualization (P6): the A columns; B's share inside each column; keep
only B; renormalise. The stretch factor *is* the 1/P(B) in the definition, so
the picture performs the formula rather than illustrating it.

Then use the sliders. Two settings are worth doing live: drag P(B|A) and
P(B|¬A) to the same value — the bar's split stops moving and P(A|B) = P(A),
which is independence, met before it has a name. Then set
P(B|¬A) near zero: B becomes nearly conclusive evidence for A. Ask what has to
be true of the two conditionals for evidence to be worth anything.

--

## Example: Two Coins

Two coins are flipped. The event of interest is $B = \lbrace (h,h)\rbrace $.


<div class="grid-2">


<div class="column">


<div class="card">

**(a) "The first coin is heads"**

$F = \lbrace (h,h), (h,t)\rbrace $

$$P(B \mid F) = \frac{P(B \cap F)}{P(F)} = \frac{1/4}{1/2} = \frac{1}{2}$$

</div>


</div>


<div class="column">


<div class="card">

**(b) "At least one coin is heads"**

$A = \lbrace (h,h), (h,t), (t,h)\rbrace $

$$P(B \mid A) = \frac{P(B \cap A)}{P(A)} = \frac{1/4}{3/4} = \frac{1}{3}$$

</div>


</div>


</div>


Same event $B$, two different pieces of information, two different answers.
**Why is (b) smaller?**

Notes:
Force interpretation (P2). The information in (a) is stronger — it names *which*
coin — so it eliminates more of the sample space. This is the classic
"boy or girl" puzzle in disguise; expect disagreement, which is the point.

--

## Total Probability


<div class="c-definition">

**Theorem (Total probability).** Let $B\_1, \ldots, B\_k$ be mutually exclusive
with $\Omega = B\_1 \cup \ldots \cup B\_k$ and $P(B\_i) > 0$. Then for any event
$A$:
$$
P(A) = \sum\_{i=1}^{k} P(B\_i) \cdot P(A \mid B\_i)
$$

</div>


**Proof.** Decompose $A$ along the partition and use additivity:

$$
P(A) = P((B\_1 \cup \ldots \cup B\_k) \cap A)
 = \sum\_{i=1}^{k} P(B\_i \cap A)
 = \sum\_{i=1}^{k} P(B\_i) \cdot P(A \mid B\_i)
$$

Notes:
Two axioms do all the work: completeness of the partition, then exclusiveness
for additivity. This theorem is the denominator of Bayes' rule — say so now, so
that Bayes looks assembled rather than conjured.

--

## Rules That Follow


<div class="grid-2">


<div class="column">


<div class="card">

### Product rule
$$P(A \cap B) = P(B) \cdot P(A \mid B)$$
$$\phantom{P(A \cap B)} = P(A) \cdot P(B \mid A)$$

</div>


</div>


<div class="column">


<div class="card">

### Reversing the condition
$$P(B \mid A) = \frac{P(B) \cdot P(A \mid B)}{P(A)}$$

</div>


</div>


<div class="column">


<div class="card">

### Complement, same condition
$$P(\overline{A} \mid B) = 1 - P(A \mid B)$$

</div>


</div>


<div class="column">


<div class="c-warning">

**But in general**
$$P(A \mid \overline{B}) \neq 1 - P(A \mid B)$$

</div>


</div>



</div>


<div class="c-insight">

Held fixed at $B$, the map $A \mapsto P(A \mid B)$ satisfies the Kolmogorov
axioms — conditioning yields a **new probability measure** $P\_B$.

</div>


Notes:
2x2 grid. The top-right box is already Bayes' theorem — flag it, then move on;
the Bayes unit gives it its name and its interpretation. The bottom two boxes are
the most common exam mistake: you may complement the *event*, not the
*condition*.

--

## Chain Rule

$$
P(E\_1 \cap E\_2 \cap \ldots \cap E\_n) =
P(E\_1) \cdot P(E\_2 \mid E\_1) \cdot P(E\_3 \mid E\_1 \cap E\_2) \cdots
P(E\_n \mid E\_1 \cap \ldots \cap E\_{n-1})
$$

By successive application of the product rule.


<div class="c-note">

Any joint probability can be written as a chain of conditionals. Choosing a
*good* order — and dropping conditions that do not matter — is exactly what
graphical models will do later.

</div>


Notes:
Do not belabour the proof; the payoff is the remark. The chain rule plus
conditional independence is the entire idea behind belief networks.

--

## Takeaway


<div class="takeaway">

Conditioning **shrinks the sample space and renormalises**. Everything else —
product rule, total probability, Bayes, the chain rule — is bookkeeping on that
single move.

</div>


--

## Independence


<div class="c-definition">

**Definition (Statistical independence).** Two events $A$ and $B$ are
**independent** iff
$$
P(A \cap B) = P(A) \cdot P(B)
$$

</div>


If additionally $0 < P(B) < 1$, this is equivalent to

$$
P(A \mid B) = P(A) \qquad\text{and}\qquad P(A \mid B) = P(A \mid \overline{B})
$$

Independence means: **learning $B$ changes nothing about $A$.**

Notes:
The conditional form is the meaningful one; the product form is the one that is
easy to check and stays defined when P(B) = 0. Emphasise the reading: knowing B
tells you nothing new.

--

## The Classic Confusion


<div class="c-warning">

**Statistical independence does not mean the events are disjoint.**

</div>


Disjoint events with positive probability are about as **dependent** as events
can be: if $A$ occurs, $B$ certainly did not.

$$
A \cap B = \emptyset \Rightarrow P(A \mid B) = 0 \neq P(A)
$$

Notes:
Ask students to state, in one sentence, why disjointness is the opposite of
independence. The Venn picture misleads here — non-overlapping circles look
"unrelated", which is exactly wrong.

--

## Independence Is About Areas, Not Overlap

<div class="viz" data-viz="math/independence-areas" data-steps="4"
 data-params='{"pA": 0.3, "pB": 0.4, "pAB": 0.12}'></div>

Notes:
Stepped viz (P6): band A, band B, their intersection, then the test.
0.3 · 0.4 = 0.12 — independent. Ask before the last click whether they expect
equality. The lesson: independence is a numerical coincidence of areas, not a
visual property of the drawing.

--

## The Same Picture, Dependent

<div class="viz" data-viz="math/independence-areas" data-steps="4"
 data-params='{"pA": 0.3, "pB": 0.4, "pAB": 0.20, "label": "C"}'></div>

Here $P(A) \cdot P(C) = 0.12$ but $P(A \cap C) = 0.20$: the intersection is
**larger** than independence would predict — $A$ and $C$ occur together more
often than chance.

Notes:
Same marginals as the previous slide, different joint. This is the payoff of
the pair: the marginals never tell you whether events are independent. Later,
that is exactly why joint distributions are needed.

--

## More Than Two Events


<div class="c-definition">

Events $A\_1, \ldots, A\_n$ are (mutually) independent iff for **every** subset
of indices $i\_1, \ldots, i\_l$:
$$
P(A\_{i\_1} \cap \ldots \cap A\_{i\_l}) = P(A\_{i\_1}) \cdots P(A\_{i\_l})
$$

</div>



<div class="c-note">

Pairwise independence is **not** enough — every subset must factorise.

</div>


Notes:
Give the standard counterexample if time allows (two fair coins and the event
"the results agree" are pairwise independent but not mutually independent).
The distinction matters for naive Bayes, which assumes far more than pairwise.

--

## Takeaway


<div class="takeaway">

Independence is a statement about **numbers**, not pictures: $P(A \cap B)$
equals the product of the marginals. Disjoint is not independent, and identical
marginals can hide either.

</div>


--

## Conditional Independence


<div class="c-definition">

**Definition.** Events $A$ and $B$ are **conditionally independent given $C$**
(written $A \indep B \mid C$) iff
$$
P(A \cap B \mid C) = P(A \mid C) \cdot P(B \mid C)
$$
equivalently
$$
P(A \mid B \cap C) = P(A \mid C)
$$

</div>


Reading: **once $C$ is known, $B$ carries no further information about $A$.**

Notes:
Math first (P5), but immediately give the reading. The second form is the one
used in practice: it says B becomes redundant in the presence of C.

--

## Dependent, but Independent Given C

Let $P(A) = \tfrac{8}{16}$, $P(B) = \tfrac{3}{16}$, $P(C) = \tfrac{4}{16}$ on a
16-cell sample space.


<div class="grid-2">


<div class="column">


<div class="card bad">

**Unconditionally dependent**

$$P(A \cap B) = \tfrac{1}{16}$$
$$P(A)\cdot P(B) = \tfrac{3}{32}$$

$\tfrac{1}{16} \neq \tfrac{3}{32}$, so $A \nindep B$

</div>


</div>


<div class="column">


<div class="card good">

**Conditionally independent given $C$**

$$P(A \cap B \mid C) = \tfrac{1}{4}$$
$$P(A \mid C)\cdot P(B \mid C) = \tfrac{2}{4}\cdot\tfrac{2}{4} = \tfrac{1}{4}$$

so $A \indep B \mid C$

</div>


</div>


</div>


Also directly: $P(A \mid B \cap C) = \tfrac{1}{2} = P(A \mid C)$.

Notes:
The whole idea in one comparison. Conditioning on C *created* independence that
did not exist before. Ask for a real example: ice-cream sales and drownings are
dependent, but conditionally independent given the temperature.

--

## Why This Matters


<div class="grid-3">


<div class="column">


<div class="card">

**Common cause**

A common cause $C$ can make two effects look related; given $C$, they are
independent.

</div>


</div>


<div class="column">


<div class="card">

**Common effect**

Two independent causes become dependent once their common effect is observed
— *explaining away*.

</div>


</div>


<div class="column">


<div class="card">

**Model size**

Conditional independence lets a joint distribution factorise into small pieces
— naive Bayes and graphical models are built on it.

</div>


</div>



</div>


<div class="c-warning">

Conditional independence neither implies nor is implied by ordinary
independence. Both directions can fail.

</div>


Notes:
The first two cards are the two directions of the takeaway: conditioning on a
common cause *removes* a dependence (ice cream and drownings, given the
temperature); conditioning on a common effect *creates* one (a wet lawn: rain
and the sprinkler, once you know the grass is wet, compete to explain it). Name
the models that rest on the definition without developing them. The warning box
is worth a moment — students routinely assume one form gives the other.

--

## Takeaway


<div class="takeaway">

Conditioning can **create** independence as easily as it destroys it. "Given
what I already know, does this extra fact still tell me anything?" is the
question that makes large probabilistic models tractable.

</div>


--

## Bayes' Theorem — An Intuition First

A test for a rare disease is **99% accurate**: positive for 99% of the sick,
negative for 99% of the healthy. About **1 in 1,000 people** has the disease.

**Your test comes back positive. How likely is it that you are actually sick?**


<div class="fragment">


<div class="c-important">

Only about **9%** — the answer most people miss by a factor of ten.

</div>


</div>


Notes:
Intuition-first entry (P4). Collect guesses by show of hands *before* clicking:
most say 99%. The surprise is the motivation for the whole module. Do not
explain yet — the next slide lets them count it themselves.

--

## Why? Count People, Not Percentages

<div class="viz viz-lg" data-viz="math/bayes-natural-frequencies" data-steps="4"
 data-params='{"population": 1000, "prevalence": 0.001, "sensitivity": 0.99, "specificity": 0.99}'></div>

Notes:
Stepped visualization (P6 tier 2), one click per step: the population; the one
sick person; the ~10 false alarms among the 999 healthy; restricting to the 11
positives. Ask before the last click: "of these 11 flagged people, how many are
sick?" Everything here is counting and restriction of the sample space — no new
machinery. This *is* conditioning, drawn.

--

## What Just Happened


<div class="grid-2-1">


<div class="column">

Restricting attention to the people who tested positive is exactly the move
from the conditional-probability definition:

$$
P(A \mid B) = \frac{P(A\cap B)}{P(B)}
$$

The 11 positives are the new sample space $B$; the single sick person among
them is $A \cap B$. The rarity of the disease survives the evidence because
there were so many more healthy people to misclassify.

</div>


<div class="column">


<div class="c-warning">

**The trap**

"99% accurate" describes
$P(\text{positive} \mid \text{sick})$.

You wanted
$P(\text{sick} \mid \text{positive})$.

These are different numbers.

</div>


</div>


</div>


Notes:
Name the confusion explicitly — swapping the two conditionals is the single
most common probabilistic error, in exams and in the newspapers. Bayes' theorem
is the machine that converts one into the other.

--

## Bayes' Theorem — Two Events


<div class="c-definition">

**Theorem (Bayes, 2 events).** Let $(\Omega,\mathcal{P}(\Omega),P)$ be a
probability space and $A, B \in \mathcal{P}(\Omega)$ two events with $P(B) > 0$.
Then:

</div>


<div class="viz eq-explain" data-viz="core/equation-explain" data-steps="4"
 data-params='{"labels": ["posterior — what we believe after", "likelihood — how well A explains B", "prior — belief before the evidence", "evidence — how ordinary B is"]}'>

$$
\eqa{P(A \mid B)} = \frac{\eqb{P(B \mid A)} \cdot \eqc{P(A)}}{\eqd{P(B)}}
$$

</div>

Which of the four was "99% accurate", and which one did the intuition ignore?

Notes:
Math-first-then-meaning (P5), legitimate here because the intuition already
exists. Stepped equation walk-through: each click highlights one part and its
brace — posterior, likelihood, prior, evidence — while the rest dims. Map the
disease test onto the symbols as you go: A = sick, B = positive test. P(A) =
1/1000 is the term everyone forgets. Reference: (Sheldon & others 2002).

--

## Proof — Two Events

From the definition of conditional probability, twice:

$$
P(A \mid B) = \frac{P(A\cap B)}{P(B)}
 = \frac{\frac{P(A \cap B)}{P(A)} \cdot P(A)}{P(B)}
 = \frac{P(B \mid A) \cdot P(A)}{P(B)}
$$

Notes:
One line: expand, multiply by P(A)/P(A), recognise the likelihood. Worth
asking which step needed P(B) > 0 and which needed P(A) > 0.

--

## Bayes' Theorem — Multiple Hypotheses


<div class="c-definition">

**Theorem (Bayes, multiple events).** Let $A\_i \in \mathcal{P}(\Omega)$ be
mutually exclusive with $\Omega = A\_1 \cup \ldots \cup A\_k$ and $P(A\_i) > 0$,
and let $B$ be an event with $P(B) > 0$. Then

$$
P(A\_i \mid B) = \frac{P(B \mid A\_i)\cdot P(A\_i)}{P(B)}
 = \frac{P(B \mid A\_i)\cdot P(A\_i)}{\sum\_{j=1}^{k} P(B \mid A\_j) \cdot P(A\_j)}
$$

</div>


The denominator is the **total probability** of the evidence: the same
observation, explained by every competing hypothesis, weighted by how much we
believed each one beforehand.

Notes:
The hypotheses partition Ω — "sick vs. healthy" was the k = 2 case. This is the
form that reappears as a classifier (naive Bayes) and in belief networks:
score every hypothesis by likelihood × prior, then normalise.

--

## Proof — Multiple Hypotheses

As before, with the theorem of total probability supplying the denominator:

$$
P(B) = \sum\_{j=1}^{k} P(B \mid A\_j) \cdot P(A\_j)
$$

--

## Mini-Exercise

Same test, but now screening a **high-risk group** where 1 in 20 people is
sick — the test is unchanged.

Estimate $P(\text{sick} \mid \text{positive})$ before computing it.

--

## Mini-Exercise — Solution


<div class="fragment">

Out of 1,000: 50 sick → 49.5 true positives; 950 healthy → 9.5 false alarms.

$$
P(\text{sick} \mid \text{positive}) = \frac{49.5}{49.5 + 9.5} = \frac{49.5}{59} \approx 84\\%
$$

**The test did not change. The prior did.** This is why screening decisions
depend on who is screened.

</div>


Notes:
Solution fragmented per the animation policy. The punchline is the comparison
with 9%: identical likelihoods, different prior, completely different clinical
meaning.

--

## Takeaway


<div class="takeaway">

Bayes' theorem is the arithmetic of changing your mind: **posterior ∝
likelihood × prior**. Evidence never speaks alone — it is always weighed
against how plausible the hypothesis was to begin with.

</div>


Notes:
Stabilise both halves: the base-rate trap (9%) and the prior's power (84%).
Both return in Bayesian decision making and graphical models.

---
