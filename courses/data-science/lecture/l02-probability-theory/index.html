## Example: Students, Courses and Exams


<div class="grid-2">


<div class="column">


<div class="card">

**Probabilistic ML** — 40 students

a quarter of them fail the exam

</div>


</div>


<div class="column">


<div class="card">

**Databases** — 60 students

one in ten fails the exam

</div>


</div>


</div>


Each of 100 students sat exactly one of the two exams.

- **Forward:** how many students fail overall?
- **Backward:** a student failed — how probable is it that they took PML?

Notes:
The example is Bishop's two-box experiment (*Pattern Recognition and Machine
Learning*, §1.2) with a course in place of a box and an exam result in place of
a fruit. The experiment has two stages: a course $C \in \lbrace
\text{PML}, \text{DB}\rbrace$ with $P(C = \text{PML}) = 0.4$, then a result
$R \in \lbrace \text{pass}, \text{fail}\rbrace$ with
$P(R = \text{fail} \mid \text{PML}) = 0.25$ and
$P(R = \text{fail} \mid \text{DB}) = 0.1$. The forward question asks for a
marginal, $P(\text{fail}) = 0.4 \cdot 0.25 + 0.6 \cdot 0.1 = 0.16$; it runs
in the direction of the experiment. The backward question asks for
$P(\text{PML} \mid \text{fail})$; it runs from the observed result back to its
cause and needs Bayes' theorem. Both are answerable by counting alone.

--

## Joint, Marginal, Conditional — One Table

<div class="viz viz-xl" data-viz="math/count-table" data-steps="6"
 data-params='{"view": "read"}'></div>

Notes:
Each question is shown first; the room answers before the next click marks
the counted cells (teal) and the count they are taken out of (violet). Joint:
$P(\text{PML}, \text{fail}) = 10/100$, one cell over the grand total.
Marginal: $P(\text{fail}) = 16/100$, a row total over the grand total.
Conditional: $P(\text{fail} \mid \text{PML}) = 10/40$, a cell over its own
column total; the DB column is not taken into account at all.

The joint probabilities sum to 1 over the four cells; the conditionals sum to
1 only within their own column,
$P(\text{pass} \mid \text{PML}) + P(\text{fail} \mid \text{PML}) = 30/40 + 10/40 = 1$.
The formal definitions follow later; on a finite table they reduce to exactly
these divisions.

--

## Sum Rule and Product Rule — On the Table

<div class="viz viz-xl" data-viz="math/count-table" data-steps="4"
 data-params='{"view": "rules"}'></div>

Notes:
Sum rule: the row total is the sum of the row's cells, so
$P(\text{fail}) = P(\text{PML}, \text{fail}) + P(\text{DB}, \text{fail})
= 0.10 + 0.06 = 0.16$; summing over the course removes it. Product rule: a
cell is its column's share of the table times the cell's share of that column,
$P(\text{PML}, \text{fail}) = P(\text{PML})\\,P(\text{fail} \mid \text{PML})
= \tfrac{40}{100} \cdot \tfrac{10}{40}$. The column total appears once as a
numerator and once as a denominator and cancels.

--

## The Two Rules


<div class="grid-2">


<div class="column">


<div class="c-definition">

**Sum rule**
$$
P(X) = \sum\_Y P(X, Y)
$$
Add along a row or column to remove a variable.

</div>


</div>


<div class="column">


<div class="c-definition">

**Product rule**
$$
P(X, Y) = P(Y \mid X) P(X)
$$
A cell is its column total times its share of that column.

</div>


</div>


</div>


Almost all of probability theory is these two rules applied repeatedly.

Notes:
$X$ and $Y$ stand for the course and the result. $P(X)$ is shorthand for the
whole distribution of $X$, so each rule is one equation per value. For
continuous variables the sum becomes an integral,
$p(x) = \int p(x, y)\\,dy$. The product rule holds in either order,
$P(X, Y) = P(Y \mid X)P(X) = P(X \mid Y)P(Y)$; equating the two forms gives
Bayes' theorem. The formal treatment justifies both rules from the axioms and
the definition of conditional probability and extends them beyond finite
tables.

--

## Bayes' Theorem — On the Table

<div class="viz viz-xl" data-viz="math/count-table" data-steps="9"
 data-params='{"view": "bayes"}'></div>

Notes:
Steps 1–3 answer the question by counting: the evidence "failed" removes the
pass row, 16 students remain, 10 of them from PML, so
$P(\text{PML} \mid \text{fail}) = 10/16 = 0.625$, up from the prior
$P(\text{PML}) = 0.4$ because PML students fail more often (a quarter against
a tenth).

Steps 4–8 rebuild the same answer from what is usually known instead of a
table: the course sizes (the prior) and the fail rate per course (the
likelihoods). The cell counts are hidden and appear only once they can be
inferred. Prior times likelihood gives the cell, $0.4 \cdot 0.25 = 0.10$
(product rule); summing that over both courses gives the normaliser
$P(\text{fail}) = 0.10 + 0.06 = 0.16$ (sum rule); their ratio is the
posterior. The pass row is never needed. Step 9 asks the comparative
question, which course is more probable: both posteriors share the
normaliser, so the comparison needs only the cells, $10 : 6$ in favour of PML.

--

## Bayes' Theorem, in Advance

Combining the two rules and the symmetry $P(X,Y) = P(Y,X)$:

$$
P(Y \mid X) = \frac{P(X \mid Y) P(Y)}{P(X)},
\qquad P(X) = \sum\_Y P(X \mid Y) P(Y)
$$

$$
P(\text{PML} \mid \text{fail}) = \frac{0.25 \cdot 0.4}{0.25 \cdot 0.4 + 0.1 \cdot 0.6} = \frac{0.10}{0.16} \approx 0.63
$$


<div class="fragment">


<div class="q">

And if one in four DB students failed too?

</div>


</div>



<div class="fragment">

Then $P(\text{PML} \mid \text{fail}) = 0.4$: the result says nothing about the
course.

</div>


Notes:
With equal fail rates, $P(\text{fail} \mid \text{PML}) =
P(\text{fail} \mid \text{DB}) = 0.25$, the likelihood cancels and the posterior
equals the prior: $0.10 / (0.10 + 0.15) = 0.4$. Course and result are then
independent. In general, evidence changes a belief only to the extent that the
hypotheses assign it different probabilities; the ratio
$P(\text{fail} \mid \text{PML}) / P(\text{fail} \mid \text{DB})$ (2.5
originally, 1 in the variant) measures how much.

--

## Takeaway


<div class="takeaway">

Two rules — **sum** to remove a variable, **product** to split a joint — generate
joint, marginal, conditional probabilities and Bayes' theorem. What follows
makes them precise and extends them beyond counting.

</div>


Notes:
The terms used informally here — joint, marginal, conditional probability,
Bayes' theorem — are all derived later from three axioms plus the definition
$P(A \mid B) = P(A \cap B) / P(B)$. The sum rule is additivity (the third
axiom) applied to the disjoint events $\lbrace Y = y\rbrace$; the product rule
is that definition rearranged; combined, they give the theorem of total
probability. The formal treatment does not contradict the counting picture; it
removes the restriction to finite tables of counts.

# Module 1
## Events and the Algebra of Sets

> **Guiding Question:** If probability is going to be a *measure*, what exactly
> are the objects it measures — and how do they combine?

--

## What Is a Random Experiment?


<div class="q">

A coin flip, tomorrow's rainfall, whether a user clicks a link. What makes
each of them a *random experiment* — and what would not be one?

</div>



<div class="fragment">


<div class="c-definition">

**Definition (Random experiment).** A procedure that can — at least in theory —
be repeated infinitely often, characterised by:

1. **Configuration** — a precisely specified system that can be reconstructed.
2. **Procedure** — an instruction for executing the experiment.
3. **Unpredictability** of the outcome.

</div>


**Coin flip:** a 1-Euro coin (configuration), placed on the thumb and snapped
into the air (procedure), record heads or tails (outcome).

</div>


Notes:
The definition does not require the world to be indeterministic; it requires
only that the outcome cannot be predicted from what is specified. Repeatability
"in theory" means the configuration and procedure can be re-created, not that
the experiment is actually repeated. Many random experiments in data analysis
are not designed by anyone — daily rainfall, whether a user clicks a link, the
length of a queue at noon. There the configuration is whatever system produced
the data, and treating it as repeatable is a modelling assumption, typically
that the observations come from the same unchanged process.

--

## Randomness as Missing Information


<div class="c-note">

A random experiment is still causal. Its unpredictability reflects **missing
information about the causal chain**, not an absence of causes.

Consequence: a random experiment can become a deterministic process once new
information is available.

</div>


A coin flip filmed at 10,000 fps and measured precisely enough stops being
random. What does that imply for a model that calls something "random"?

Notes:
Calling something random is a statement about the observer's knowledge, not
only about the system. A coin flip is governed by classical mechanics; given
initial velocity, spin and height, the outcome is determined, and
Diaconis, Holmes and Montgomery (2007) built a coin-tossing machine that
produces the same face every time. The flip is random only because these
quantities are not measured.

For a model the implication is that its "noise" term collects everything it
does not represent: genuine indeterminacy, measurement error, and unmodelled
signal. These cannot be told apart from the residuals alone; adding a relevant
input variable can turn part of what looked like noise into explained
variation.

--

## Sample Space and Events


<div class="grid-3-2">


<div class="column">


<div class="c-definition">

**Definition (Sample space, event space).**
A set $\Omega = \lbrace \omega\_1, \ldots, \omega\_n\rbrace$ is the **sample
space** of a random experiment if every outcome is associated with exactly one
element $\omega \in \Omega$, an **outcome**.


For finite $\Omega$, every subset $A \subseteq \Omega$ is an **event**; $A$
**occurs** iff the observed $\omega \in A$. All events together,
$\mathcal{P}(\Omega)$, form the **event space**.

</div>


</div>


<div class="column">

![A die's sample space as a set: six outcomes as elements, the observed outcome 6 marked, and the event at least 4 as a shaded subset](/units/math/stochastic/figures/sample-space-anatomy.svg)

</div>


</div>


An outcome is an element; an event is a subset — a *question you can ask*
about the result.

Notes:
"Exactly one" means the outcomes are mutually exclusive (no result maps to two
elements) and exhaustive (every possible result maps to some element). Which
results are distinguished is a modelling decision: for a die, $\lbrace 1,
\ldots, 6\rbrace$ and $\lbrace \text{even}, \text{odd}\rbrace$ are both valid
sample spaces, but the second cannot express the event "a six".

An outcome $\omega$ is an element of $\Omega$; an event is a subset. The
elementary event $\lbrace \omega\rbrace$ is a set containing one outcome and
is not the same object as $\omega$. Probabilities are assigned to events, so
one writes $P(\lbrace \omega\rbrace)$, often abbreviated $P(\omega)$.

The figure is the die panel used for all event types that follow: the roll
showed 6, and since $6 \in \lbrace 4, 5, 6\rbrace$ the event "at least 4"
occurred. For infinite $\Omega$ — the drug dosage below — the event space is a
suitable family of subsets rather than the full power set; this returns with
continuous distributions.

--

## Important Event Types


<div class="img-h-lg">

![Six event types drawn on the sample space of a die: impossible, certain, complementary, elementary, sub-event, incompatible](/units/math/stochastic/figures/event-types.svg)

</div>


Notes:
All six panels use the die, $\Omega = \lbrace 1, \ldots, 6\rbrace$. The
impossible event $\emptyset$ contains no outcome and never occurs; the certain
event $\Omega$ always occurs. The complement $\bar A = \Omega \setminus A$
occurs exactly when $A$ does not. An elementary event contains one outcome.
$A \subseteq B$ means $A$ entails $B$: whenever $A$ occurs, $B$ occurs too.
Incompatible (disjoint) events, $A \cap B = \emptyset$, cannot occur together.

Set operations correspond to logical connectives between the statements the
events express: inclusion is implication, intersection is "and", union is
"or", complement is "not". This correspondence is why identities between events
can be read off Venn diagrams.

--

## Examples


<div class="img-h-md">

![One coin flip with the event heads; two coin flips drawn as a set of four outcomes and as a 2-by-2 grid, both with the event at least one head shaded](/units/math/stochastic/figures/coin-flips.svg)

</div>


The same event, twice: as a subset of $\Omega$, and as cells of the
1st × 2nd grid. The sample space fixes which questions can be asked.

Notes:
For two flips, $\Omega = \lbrace HH, HT, TH, TT\rbrace$. "At least one head"
is $\lbrace HH, HT, TH\rbrace$, "exactly one head" is $\lbrace HT, TH\rbrace$,
and "the first flip is heads" is $\lbrace HH, HT\rbrace$: same sample space,
different questions. If the sample space recorded only the number of heads,
$\lbrace 0, 1, 2\rbrace$, the event "the first flip is heads" could not be
expressed at all, and the three outcomes would not be equally likely
($\tfrac14, \tfrac12, \tfrac14$).

--

## The Event Space Grows Fast


<div class="img-h-lg">

![The eight events of a three-sided die ordered by inclusion, and a table of how the number of events grows as two to the n](/units/math/stochastic/figures/event-lattice.svg)

</div>


For $|\Omega| = n$ the event space has $2^n$ elements — far too many to list,
which is why probability is done by counting, not by enumeration.

Notes:
Each event is determined by an independent in/out choice for each of the $n$
outcomes, so there are $2^n$ events. For three outcomes these are $\emptyset$,
three singletons, three pairs and $\Omega$, ordered by inclusion in the figure.
Already a modest $n = 300$ gives more events than the estimated $10^{80}$ atoms
in the observable universe.

A probability measure on a finite $\Omega$ is nevertheless fixed by only $n$
numbers, the probabilities of the elementary events; additivity gives every
other event. For infinite $\Omega$, in particular $\Omega = \mathbb{R}$, the
full power set contains sets to which no consistent "length" can be assigned
(Vitali sets), which is why a smaller family of events, a $\sigma$-algebra, is
used there.

--

## Not Every Sample Space Is Finite


<div class="img-h-md">

![A dosage axis from zero to infinity with the event 5 to 10 mg, and three of the 5,040 orderings of a seven-team race](/units/math/stochastic/figures/infinite-and-large.svg)

</div>



<div class="takeaway">

Choosing $\Omega$ is a modelling decision: it fixes what counts as an outcome,
and therefore which questions can be asked at all.

</div>


Notes:
A drug dosage modelled as a positive real number gives an uncountable sample
space $\Omega = [0, \infty)$; events are intervals such as $[5, 10]$ mg, and any
single exact value has probability zero under a continuous model. The model
ignores that real dosages are measured with finite precision and administered
in fixed steps; the idealisation is chosen because intervals and densities are
easier to work with than a fine discrete grid.

The race example is finite but large: seven teams can finish in
$7! = 5{,}040$ orders, so the sample space of full rankings has 5,040 outcomes
and $2^{5040}$ events. The same modelling choice — what counts as an outcome —
arises for every attribute of a dataset.

--

## Venn Diagrams

**Venn diagrams** are the graphical representation of events:


<div class="grid-2-1">


<div class="column">


<div class="img-h-md">

![A Venn diagram: the rectangle is the sample space, two circles are events A and B, and the regions A minus B, A intersect B, B minus A and outside both are labelled](/units/math/stochastic/figures/venn-anatomy.svg)

</div>


</div>


<div class="column">

- the **rectangle** is the sample space $\Omega$
- a **circle** is an event $A \subseteq \Omega$
- every **region** is a set — and every set operation is a region you can point at

</div>


</div>


Notes:
Two circles divide the rectangle into four regions: $A \setminus B$,
$A \cap B$, $B \setminus A$ and $\overline{A \cup B}$. These four are
pairwise disjoint and together make up $\Omega$, so every event built from $A$
and $B$ by set operations is a union of some of them; there are $2^4 = 16$ such
events. Three circles give eight regions.

The sizes of the circles carry no meaning in a plain Venn diagram. Once
probabilities are attached and areas are drawn proportional to them, laws such
as $P(A \cup B) = P(A) + P(B) - P(A \cap B)$ become statements about areas.

--

## Important Event Types

**Before each step: which region will light up?**

<div class="viz" data-viz="math/set-operations" data-steps="4"
 data-params='{"sets": 2, "ops": ["A", "notA", "subset", "disjoint"]}'></div>

Notes:
The four steps highlight: the event $A$; its complement
$\bar A = \Omega \setminus A$, everything outside the circle; a sub-event
$B \subseteq A$, drawn as a circle inside $A$; and two disjoint events,
$A \cap B = \emptyset$, drawn as non-overlapping circles.

Disjointness is a property of the sets themselves, fixed before any probability
is assigned. It is often confused with independence, which is a property of the
probabilities; two disjoint events with positive probability are never
independent, since $P(A \cap B) = 0 < P(A)P(B)$.

--

## Algebra of Events

| Law | Union form | Intersection form |
|---|---|---|
| Commutative | $A\cup B = B \cup A$ | $A\cap B = B\cap A$ |
| Associative | $(A\cup B)\cup C = A \cup (B \cup C)$ | $(A\cap B)\cap C = A \cap (B \cap C)$ |
| Distributive | $(A\cup B)\cap C = (A \cap C) \cup (B \cap C)$ | $(A\cap B)\cup C = (A \cup C) \cap (B \cup C)$ |

Events form a set algebra — the same laws you know, but now every identity is
a picture.

--

## Set Operations as Regions

<div class="viz" data-viz="math/set-operations" data-steps="4"
 data-params='{"sets": 3, "ops": ["AuB", "AnB", "AnBnC", "AuBuC"]}'></div>

Notes:
The four steps highlight, with three sets: $A \cup B$ (everything in either
circle), $A \cap B$ (the lens shared by $A$ and $B$, including the part also
in $C$), $A \cap B \cap C$ (the single central region), and
$A \cup B \cup C$ (all seven regions inside the circles). Union enlarges and
intersection shrinks:
$A \cap B \cap C \subseteq A \cap B \subseteq A \cup B \subseteq A \cup B \cup C$.

De Morgan's laws complete the algebra: $\overline{A \cup B} = \bar A \cap \bar B$
and $\overline{A \cap B} = \bar A \cup \bar B$.

--

## Mini-Exercise


<div class="q">

Are $(A\cup B)\cap C$ and $(A\cap B)\cup C$ the same region?

</div>



<div class="fragment">


<div class="img-h-md">

![Two Venn diagrams: (A union B) intersect C is shaded only inside C; (A intersect B) union C is all of C plus the lens of A and B](/units/math/stochastic/figures/venn-distributive.svg)

</div>


**No.** The first lies entirely inside $C$; the second is all of $C$ plus the
lens $A\cap B$. The distributive laws expand them into different expressions.

</div>


Notes:
The outer operation decides. $(A\cup B)\cap C$ is an intersection with $C$,
so it lies inside $C$. $(A\cap B)\cup C$ is a union with $C$, so it contains
$C$. Expanded with the distributive laws:
$(A\cup B)\cap C = (A\cap C)\cup(B\cap C)$ and
$(A\cap B)\cup C = (A\cup C)\cap(B\cup C)$.

Since one is a subset of $C$ and the other a superset, they are equal exactly
when both equal $C$, i.e. when $A\cap B \subseteq C \subseteq A\cup B$. A
frequent error is to move the brackets freely; the associative law allows this
only when both operations are the same.

--

## Takeaway


<div class="takeaway">

An event is a **subset** of the sample space, and combining statements about
outcomes is set algebra: *or* is a union, *and* an intersection, *not* a
complement. Choosing $\Omega$ decides which events exist at all.

</div>


Notes:
Module 1 closes here (course-local slide: the Venn unit ends on its exercise).
The point to carry into Module 3: a probability will be a number attached to
each of these subsets, so the algebra of events is what the rules of
probability are written in.

# Module 2
## Counting

> **Guiding Question:** How do we determine the size of a sample space we could
> never write down?

--

## Why Counting Comes First

If every outcome in a finite sample space is equally likely, then the
probability of an event is a **ratio of counts**:

$$
P(A) = \frac{|A|}{|\Omega|}
$$

So before we can measure probability, we must be able to count $|A|$ and
$|\Omega|$ — often without enumerating them.

Notes:
Motivate combinatorics as the arithmetic of sample spaces, not as a separate
topic. Flag the assumption doing the work here — "equally likely" — which the
axiomatic definition of probability replaces with an axiom system that does not need it.

--

## Basic Principle of Counting


<div class="c-definition">

**Generalised basic principle of counting.** If an experiment consists of $r$
stages, where stage $i$ has $n\_i$ possible outcomes regardless of the earlier
stages, then the whole experiment has

$$
n\_1 \cdot n\_2 \cdots n\_r
$$

possible outcomes.

</div>


**Example.** How many 7-place licence plates, if the first 3 places are letters
(26) and the last 4 are digits (10)?

$$
26^3 \cdot 10^4 = 175{,}760{,}000
$$

Notes:
The phrase "regardless of the earlier stages" is the hidden assumption — it
fails as soon as choices interact (no repeated letters, say), which is exactly
what the four cases below systematise.

--

## Three Questions Decide the Formula


<div class="grid-3">


<div class="column">

### Order?
Does the sequence matter?

matters → **permutation**
(rankings)

does not → **combination**
(committees)

</div>


<div class="column">

### Repetition?
May an element be picked twice?

without — teams of people

with — letters in a word

</div>


<div class="column">

### How many?
Select $k$ of $n$ elements, or arrange all $n$?

</div>


</div>


Notes:
Give students a problem and have them answer these three questions *before*
reaching for a formula. Nearly every counting error is a misread of one of
these three, not an algebra slip.

--

## The Four Basic Cases


<div class="grid-2">


<div class="column">


<div class="card">

**Ordered, without repetition**

$k$-permutation of $n$:

$$\frac{n!}{(n-k)!}$$

From $\lbrace a,b\rbrace $, $k=2$: $ab, ba$

</div>


</div>


<div class="column">


<div class="card">

**Ordered, with repetition**

$$n^k$$

From $\lbrace a,b\rbrace $, $k=2$: $aa, ab, ba, bb$

</div>


</div>


<div class="column">


<div class="card">

**Unordered, without repetition**

$k$-combination of $n$:

$$\binom{n}{k} = \frac{n!}{k! (n-k)!}$$

From $\lbrace a,b\rbrace $, $k=2$: $\lbrace a,b\rbrace $

</div>


</div>


<div class="column">


<div class="card">

**Unordered, with repetition**

$$\binom{n+k-1}{k}$$

From $\lbrace a,b\rbrace $, $k=2$: $\lbrace a,a\rbrace , \lbrace a,b\rbrace , \lbrace b,b\rbrace $

</div>


</div>


</div>


Notes:
2x2 grid — the whole unit in one slide. Keep it visible while working examples;
students should learn to locate a problem in this square rather than recall
four formulas in isolation.

--

## Permutations


<div class="c-definition">

**Definition ($k$-permutation).** An ordered selection of $k$ elements from a
set of $n$ distinct elements without repetition. Counting position by position:
$n$ choices, then $n-1$, …, down to $n-k+1$, giving $\frac{n!}{(n-k)!}$.

</div>


**Example.** A class of 6 men and 4 women is ranked after an exam, no ties.
How many possible rankings? $10! = 3{,}628{,}800$.

Notes:
The stage-by-stage argument *is* the basic counting principle applied with a
shrinking pool — worth making explicit so the formula is derived, not given.

--

## Combinations


<div class="grid-2-1">


<div class="column">

Each $k$-combination corresponds to $k!$ different $k$-permutations — the same
$k$ elements in every possible order. Therefore

$$
\binom{n}{k} = \frac{\text{number of } k\text{-permutations}}{k!}
 = \frac{n!}{k! (n-k)!}
$$

**Example.** A committee of 3 from 20 people:
$\binom{20}{3} = 1140$.

</div>


<div class="column">


<div class="c-note">

Dividing by $k!$ is the standard move for "forgetting" an ordering we counted.

Remember it as *over-count, then correct*.

</div>


</div>


</div>


Notes:
The over-count-then-divide pattern recurs constantly. Ask why we divide by k!
and not by something else — because every unordered selection was counted
exactly k! times, uniformly.

--

## Properties of the Binomial Coefficient


<div class="grid-2">


<div class="column">

$$
\binom{n}{k} = \binom{n}{n-k}
$$

Choosing which $k$ to include is the same as choosing which $n-k$ to leave out.

</div>


<div class="column">

$$
\binom{n}{k} = \binom{n-1}{k-1} + \binom{n-1}{k}
$$

Split by a fixed element $i$: groups **containing** $i$, plus groups **not
containing** $i$.

</div>



</div>


<div class="c-definition">

**Binomial theorem.**
$$
(x+y)^n = \sum\_{k=0}^{n} \binom{n}{k} x^k y^{n-k}
$$

</div>


Notes:
Both identities are proved by counting the same set two ways — the standard
combinatorial proof technique. The binomial theorem's proof is the same idea:
expanding the product gives 2^n terms, and x^k y^(n-k) appears exactly as often
as there are ways to pick which k factors contribute x.

--

## Application: How Many Subsets?

A set with $n$ elements has

$$
\sum\_{k=0}^{n} \binom{n}{k} = 2^n
$$

subsets — sum over all subset sizes.


<div class="c-insight">

**Alternative intuition.** Each element is either in the subset or not: a binary
choice, $n$ times, so $2 \cdot 2 \cdots 2 = 2^n$.

</div>


This is the size of the event space $\mathcal{P}(\Omega)$ from the sample-space unit.

Notes:
Close the loop with the sample-space unit: the 2^n we asserted there is now
derived twice. Ask which of the two arguments they would trust more under
pressure — the binary-choice one generalises better.

--

## Mini-Exercise

From 5 people, how many ways are there to pick a **chair and a deputy**? And
how many ways to pick a **two-person committee**?


<div class="fragment">

Chair and deputy: order matters, $5 \cdot 4 = 20$. Committee: each pair was
counted twice (as $ab$ and $ba$), so $20 / 2! = 10 = \binom{5}{2}$.

</div>


Notes:
One point: the same selection, counted with and without order, differs by the
factor $k!$ — over-count, then correct. Ask which cell of the four-case square
each answer sits in.

--

## Takeaway


<div class="takeaway">

Counting reduces to three questions — **order? repetition? how many?** — and one
habit: when an ordering was counted that should not have been, divide it out.

</div>

# Module 3
## What Is a Probability?

> **Guiding Question:** Every attempt to *define* probability turns out to be
> circular. What do we do instead?

--

## An Intuition: Probability as Area


<div class="grid-2">


<div class="column">


<div class="img-h-lg">

![Forty stones thrown at random into the rectangle Ω; eleven land inside the event A](/units/math/stochastic/figures/probability-area.svg)

</div>


</div>


<div class="column">

Draw the sample space $\Omega$ on the ground, with each event as a region.
Throw a stone at random.


<div class="q">

How likely does it land in $A$?

</div>



<div class="fragment">

$$
P(A) = \frac{\text{area of } A}{\text{area of } \Omega}
$$

provided that

1. the stone always lands in $\Omega$, and
2. every part of $\Omega$ is equally likely.

Probability measures **how much of $\Omega$** an event occupies.

</div>



<div class="fragment c-note">

Assumption 2 is the one we will have to give up.

</div>


</div>


</div>


Notes:
In the figure $A$ covers about 27% of $\Omega$, and 11 of 40 stones (27.5%)
land in it; with more stones the share converges to the area ratio, which is
the frequentist reading on the next slide. Under the two assumptions, $P(A)$
is the area of $A$ divided by the area of $\Omega$. Assumption 1 corresponds to normalisation, $P(\Omega) = 1$.
Assumption 2 makes all elementary events equally likely, which is the Laplace
setting. Dropping assumption 2 means that some parts of $\Omega$ carry more
weight than their area: the stone is thrown with a non-uniform aim. Area is
then replaced by weighted area, and the axioms keep exactly the properties that
any such weighting shares with plain area — non-negativity, total one, and
additivity over disjoint regions.

--

## Two Ways to Read a Probability


<div class="grid-2">


<div class="column">


<div class="card">

**Frequentist**

The probability of an elementary event $a$ is the fraction of repetitions of
the experiment that yield $a$.

*Requires* the experiment to be repeatable.

</div>


</div>


<div class="column">


<div class="card">

**Bayesian**

The probability of $a$ is the degree of certainty that $a$ will happen — even
without conducting the experiment.

*Requires* a stated state of knowledge.

</div>


</div>


</div>


Both interpretations yield the same mathematics. They are mental models for
what the number *means*, not different theories.

Notes:
"The probability that this machine part fails within a year" has a natural
frequentist reading: the fraction of parts of the same type that fail within a
year. "The probability that this patient has the disease" refers to one person
in one state; it has no repetition, so it is read as a degree of belief, or
frequentistically only by placing the patient in a reference class (all
patients with these symptoms), whose choice changes the number.

The frequentist reading assigns probabilities to repeatable events, not to
fixed but unknown quantities such as a model parameter. The Bayesian reading
assigns probabilities to both, which is what makes a prior distribution over a
parameter meaningful. Both readings obey the same axioms, so every theorem
holds under either.

--

## The Classical (Laplace) Definition


<div class="c-definition">

**Definition (Classical / Laplace probability).** If every elementary event in
$\Omega$ is assigned the same probability, then

$$
P(A) = \frac{|A|}{|\Omega|}
 = \frac{\text{number of cases favourable for } A}{\text{number of possible outcomes}}
$$

</div>


An experiment whose configuration and procedure make outcomes equiprobable —
by definition or by construction — is a **Laplace experiment**; its
probabilities need not be estimated, they are implied by the setup.

Notes:
Counting (combinatorics) exists to evaluate $|A|$ and $|\Omega|$ when they are
too large to list. The formula is valid only if the elementary events really are
equally likely, and that depends on the choice of $\Omega$. For the sum of two
dice, $\Omega = \lbrace 2, \ldots, 12\rbrace$ has 11 outcomes but they are not
equiprobable; $P(\text{sum} = 7) = 6/36$, not $1/11$. The Laplace formula
applies to the 36 ordered pairs, not to the 11 sums.

Where no symmetry of the setup justifies equal probabilities — a loaded die, a
click-through rate — the probabilities have to be estimated from data or
specified by a model.

--

## Why That Definition Is Not Enough


<div class="c-warning">

**The circularity.** "Laplace probability" defines probability using
*equiprobability* — that is, using another notion of probability. Strictly
speaking it is a circular definition.

</div>


The frequentist repair — defining probability as the limit of relative
frequencies — fails too: such a limit exists only in mathematical settings,
never in an experiment that can actually be repeated.

**So what do we do?** Stop trying to *define* what probability is, and instead
specify what it must *do*.

Notes:
"Equally likely" already presupposes a notion of probability, so the Laplace
formula cannot serve as its definition. The frequentist definition
$P(A) = \lim\_{n \to \infty} n\_A / n$ has two problems: no experiment is
repeated infinitely often, and the limit is not guaranteed to exist for an
arbitrary sequence of results. The law of large numbers states that relative
frequencies converge, but only with probability one — it presupposes
probability rather than defining it.

The axiomatic approach, due to Kolmogorov (1933), avoids both problems: it
specifies the rules every probability assignment must obey and leaves the
origin of the numbers — symmetry, frequencies, or belief — to the application.

--

<!-- .slide: class="smaller" -->

## The Kolmogorov Axioms


<div class="grid-3-2">


<div class="column">


<div class="c-definition">

**Definition (Probability measure, Kolmogorov 1933).** Let $\Omega$ be a sample
space and $\mathcal{P}(\Omega)$ its event space. A function
$P : \mathcal{P}(\Omega) \to \mathbb{R}$ is a **probability measure** if

| | | |
|---|---|---|
| **I** | $P(A) \geq 0$ | non-negative |
| **II** | $P(\Omega) = 1$ | normalised |
| **III** | $A \cap B = \emptyset \Rightarrow P(A \cup B) = P(A) + P(B)$ | additive |

</div>


</div>


<div class="column">


<div class="c-intuition">

Probability is **one kilogram of sand** spread over $\Omega$; $P(A)$ is the
sand lying in $A$.

- **I** — no region holds negative sand.
- **II** — all the sand lies somewhere in $\Omega$.
- **III** — two regions that do not overlap hold their sand together.

</div>


</div>


</div>


The axioms say how *any* assignment must behave — not which probabilities the
events get. How the sand is spread is the modeller's choice.


<div class="sidenote">

For infinite $\Omega$ the event space is a $\sigma$-algebra and Axiom III holds
for countably many disjoint events — measure theory; nothing in this course
depends on it.

</div>


Notes:
The sand picture is the area picture of the first slide with the uniformity
assumption dropped: area is replaced by mass, and the mass may pile up anywhere.
All three axioms hold for any such distribution of mass — it is never negative,
the total is fixed at one, and the mass in two non-overlapping regions is the
sum of their masses. What the axioms deliberately leave open is the spreading
itself; symmetry (Laplace), frequencies and degrees of belief are three ways to
choose it.

Upper bounds such as $P(A) \leq 1$ are not axioms; they follow from them
(since $P(A) + P(\bar A) = 1$ and $P(\bar A) \geq 0$). On a finite
$\Omega$, a probability measure is completely specified by the values on
elementary events, $p\_\omega \geq 0$ with $\sum\_\omega p\_\omega = 1$;
additivity then gives $P(A) = \sum\_{\omega \in A} p\_\omega$.
Countable additivity — Axiom III for countably many disjoint events — is
needed, for example, for the geometric distribution, whose infinitely many
probabilities must sum to 1.

--

## Probability Space


<div class="c-definition">

**Definition.** Let $\Omega$ be a sample space, $\mathcal{P}(\Omega)$ an event
space, and $P$ a probability measure. The triple
$(\Omega, \mathcal{P}(\Omega), P)$ — also written $(\Omega, P)$ — is a
**probability space**.

</div>



<div class="c-intuition">

Three separate modelling choices: $\Omega$ — **what can happen** (the ground);
$\mathcal{P}(\Omega)$ — **what may be asked** (the regions one may draw);
$P$ — **how likely each answer is** (how the sand is spread).

</div>



<div class="grid-2">


<div class="column">


<div class="card">

### Same $\Omega$, different $P$
A fair and a loaded die share $\Omega = \lbrace 1, \ldots, 6 \rbrace$ but are
two probability spaces.

</div>


</div>


<div class="column">


<div class="card">

### Finite $\Omega$
$P$ is fixed by the elementary events: $p\_\omega \geq 0$,
$\sum\_\omega p\_\omega = 1$, and $P(A) = \sum\_{\omega \in A} p\_\omega$.

</div>


</div>


</div>


Notes:
The three components state three separate modelling choices: $\Omega$ fixes
what counts as an outcome, the event space fixes which questions may be asked,
and $P$ fixes how likely each answer is. A theorem that begins with "let
$(\Omega, \mathcal{P}(\Omega), P)$ be a probability space" holds for every
such choice.

In practice the underlying probability
space is often left implicit and only the distributions of random variables are
written down; it is still assumed to exist.

--

<!-- .slide: class="smaller" -->

## What the Axioms Already Give Us

| Property | Statement | From | Intuitively |
|---|---|---|---|
| **Complement** | $P(\overline{A}) = 1 - P(A)$ | II, III | <span class="intuition">the sand not in $A$ lies in $\overline{A}$</span> |
| **Empty event** | $P(\emptyset) = 0$ | complement, $A = \Omega$ | <span class="intuition">no region, no sand</span> |
| **Bounds** | $0 \leq P(A) \leq 1$ | I, complement | <span class="intuition">no region holds more than all the sand</span> |
| **Monotonicity** | $A \subseteq B \Rightarrow P(A) \leq P(B)$ | I, III | <span class="intuition">a larger region holds at least as much</span> |
| **Inclusion–exclusion** | $P(A \cup B) = P(A) + P(B) - P(A \cap B)$ | III | <span class="intuition">the overlap was weighed twice</span> |
| **Union bound** | $P(A \cup B) \leq P(A) + P(B)$ | I, inclusion–exclusion | <span class="intuition">weighing twice never weighs less</span> |
| **Finite additivity** | $P(A\_1 \cup \ldots \cup A\_p) = \sum\_i P(A\_i)$ for disjoint $A\_i$ | III, repeated | <span class="intuition">disjoint regions add up</span> |

Notes:
Derivations. Complement: $A$ and $\bar A$ are disjoint with union $\Omega$, so
$P(A) + P(\bar A) = P(\Omega) = 1$. Bounds: $P(A) \geq 0$ by Axiom I and
$P(A) = 1 - P(\bar A) \leq 1$. Empty set: $\bar\Omega = \emptyset$, so
$P(\emptyset) = 1 - P(\Omega) = 0$. Monotonicity: for $A \subseteq B$,
$B = A \cup (B \setminus A)$ disjointly, so
$P(B) = P(A) + P(B \setminus A) \geq P(A)$. Inclusion–exclusion: write
$A \cup B = A \cup (B \setminus A)$ and $B = (B \setminus A) \cup (A \cap B)$,
both disjoint; then $P(A \cup B) = P(A) + P(B) - P(A \cap B)$. On the Venn
picture, $P(A) + P(B)$ counts the overlap twice. The union bound (Boole's
inequality) drops the non-negative term $P(A \cap B)$; it extends to any
finite or countable union and is often the only usable estimate when the
overlaps are unknown. Finite additivity follows from Axiom III by induction
over $p$.

Monotonicity transfers logic to numbers: if $A$ entails $B$, $A$ cannot be more
probable than $B$. The conjunction fallacy (Tversky and Kahneman's "Linda
problem") is the empirical finding that people often judge
$P(A \cap B) > P(A)$, which violates it.

--

## Takeaway


<div class="takeaway">

Probability is not defined by counting or by repetition — it is any assignment
of numbers to events that is **non-negative, normalised, and additive**. The
Laplace formula is one such assignment, not the definition.

</div>


Notes:
An axiomatic definition fixes how probabilities must behave and leaves their
source to the modeller: symmetry (Laplace), long-run frequency, or a stated
degree of belief. Any assignment that is non-negative, normalised and additive
is a probability measure, whichever source it comes from, and every theorem
derived from the axioms — total probability, Bayes' theorem, the law of large
numbers — applies to it. This is why frequentist and Bayesian statistics share
one mathematics and differ only in which quantities they treat as random.

--

## Laplace Probabilities in Practice

When all outcomes in $\Omega$ are equally likely, computing $P(A)$ means
**counting twice**: the favourable cases, and the possible ones.

$$
P(A) = \frac{|A|}{|\Omega|}
$$

The whole difficulty is choosing a sample space in which "equally likely" is
actually true.

Notes:
The formula is trivial; the modelling is not. Every error in the examples below
comes from an Ω where outcomes are not equiprobable.

--

## Example: Sum of Two Dice

**What is the probability that two dice sum to 7?**


<div class="grid-2-1">


<div class="column">


<div class="fragment">

- $|\Omega| = 6 \cdot 6 = 36$ ordered pairs
- $E = \lbrace (1,6), (6,1), (2,5), (5,2), (3,4), (4,3)\rbrace $, so $|E| = 6$

$$
P(\text{sum} = 7) = \frac{6}{36} = \frac{1}{6}
$$

</div>


</div>


<div class="column">


<div class="c-warning">

Why ordered pairs?

Because $(1,6)$ and $(6,1)$ are two distinct equally likely outcomes — the
unordered sample space is **not** equiprobable.

</div>


</div>


</div>


Notes:
The classic trap. If a student proposes the 21 unordered pairs, ask them to bet
on "double six" versus "one and six" — the intuition corrects itself fast.

--

## Example: Ordered or Unordered — Both Work

An urn holds **6 white** and **5 black** balls. Three are drawn.
**What is the probability of exactly 1 white and 2 black?**


<div class="grid-2">


<div class="column">


<div class="card">

**Variant 1 — order matters**

$|\Omega| = 11 \cdot 10 \cdot 9 = 990$

Favourable: white-black-black, black-white-black, black-black-white
$= 6\cdot5\cdot4 + 5\cdot6\cdot4 + 5\cdot4\cdot6 = 360$

$$\frac{360}{990} = \frac{4}{11}$$

</div>


</div>


<div class="column">


<div class="card">

**Variant 2 — order ignored**

$|\Omega| = \binom{11}{3} = 165$

Favourable:
$\underbrace{\binom{6}{1}}\_{\text{the white}} \cdot \underbrace{\binom{5}{2}}\_{\text{the blacks}} = 6 \cdot 10 = 60$

$$\frac{60}{165} = \frac{4}{11}$$

</div>


</div>


</div>


Notes:
Same answer, two sample spaces — the point of the slide. Both are legitimate
*because* both are equiprobable: ordered draws are equally likely, and so are
unordered groups. Mixing the two (favourable counted unordered, total counted
ordered) is the error to warn against.

--

## The General Rule


<div class="c-insight">

When selecting $k$ items from $n$, you may count **with** or **without** order —
as long as you are consistent, and as long as the chosen sample space really is
equiprobable.

</div>


Pick whichever counting is easier for the event at hand.

Notes:
Connects straight back to the four cases in the counting unit: the choice of
case is a modelling choice about Ω, not a property of the problem.

--

## Mini-Exercise

The urn again, smaller: **2 white and 2 black** balls, two drawn. What is the
probability of **one of each**? Count without order, then check with order.


<div class="fragment">

Unordered: $\binom{4}{2} = 6$ pairs, $2 \cdot 2 = 4$ mixed, so $4/6 = 2/3$.
Ordered: $4 \cdot 3 = 12$ draws, $2 \cdot 2 + 2 \cdot 2 = 8$ mixed, so
$8/12 = 2/3$ — the same, because both sample spaces are equiprobable.

</div>


Notes:
One point: either counting works if it is used consistently. The common error
to listen for is 4 favourable unordered pairs over 12 ordered draws (1/3).
The earlier ten-couples problem ("five chosen from 10 couples, none a couple",
$\binom{10}{5} 2^5 / \binom{20}{5} \approx 0.52$) belongs on the exercise sheet.

--

## Takeaway


<div class="takeaway">

Laplace's formula — favourable over possible cases — is **one** probability
measure, valid only in a sample space whose outcomes are equally likely. The
formula is trivial; choosing that sample space is the work.

</div>


Notes:
Module 3 closes here (course-local slide: the examples unit ends on its
exercise). Connect back to the axioms: Laplace satisfies them, which is why it
is a probability — not the other way round.

# Module 4
## Conditioning, Independence, Bayes

> **Guiding Question:** A 99%-accurate test says you are sick. Why is that
> *not* a 99% chance of being sick — and what is the correct bookkeeping?

--

## Motivating Example

You roll a 6-sided die twice. **After the first roll you see a 3.** Knowing this, what
is the probability that both rolls sum to 8?


<div class="fragment">


<div class="grid-2">


<div class="column">

- Before the first roll: $\Omega = \lbrace (1,1), (1,2), \ldots, (6,6)\rbrace $, $|\Omega| = 36$
- After seeing the 3, only $\Omega\_{red} = \lbrace (3,1), \ldots, (3,6)\rbrace $ remains
- Outcomes like $(2,4)$ have become **impossible**

</div>


<div class="column">

- The reduced space now carries all the probability: $P(\Omega\_{red}) = 1$
- "Sum is 8" inside it: $E = \lbrace (3,5)\rbrace $

$$P = \tfrac{1}{6}$$

</div>


</div>


</div>


Notes:
Without the information, "sum is 8" is $\lbrace (2,6), (3,5), (4,4), (5,3),
(6,2)\rbrace$, so $P = 5/36 \approx 0.14$. Knowing the first roll is 3 leaves
six equally likely outcomes, of which only $(3,5)$ sums to 8: $P = 1/6
\approx 0.17$. The information raised the probability slightly; other
observations lower it — after a first roll of 1, a sum of 8 is impossible.

Conditioning is not a new kind of probability. It is the old probability
restricted to a smaller sample space, with the outcomes that remain keeping
their relative weights and being rescaled to sum to 1.

--

## Definition


<div class="c-definition">

**Definition (Conditional probability of $A$ under the condition $B$).**
$$
P(A \mid B) = \frac{P(A \cap B)}{P(B)}, \qquad \text{if } P(B) > 0
$$

</div>



<div class="img-h-md">

![Two Venn diagrams: before, A is counted out of all of Omega; after learning that the stone landed in B, everything outside B is ruled out and the overlap of A and B is counted out of B](/units/math/stochastic/figures/venn-conditioning.svg)

</div>


Back to the stone: once it is known to lie in $B$, **$B$ is the whole world**.

Notes:
The figure carries the colour code used from here on: teal is what is counted,
the violet frame is what it is counted out of. Before the information, $A$ is
counted out of $\Omega$; after it, only the part of $A$ inside $B$ counts, and
it is measured against $B$.

In the dice example $P(A \cap B) = 1/36$ and $P(B) = 6/36$, so
$P(A \mid B) = 1/6$; dividing by $P(B)$ is the rescaling of the six remaining
outcomes to total probability 1.

The condition $P(B) > 0$ is necessary because the ratio is otherwise undefined.
Conditioning on events of probability zero, such as a continuous variable
taking an exact value, requires densities instead and is treated with
continuous distributions.

$P(A \mid B)$ and $P(A \cap B)$ are different quantities:
$P(A \cap B) \leq P(A \mid B)$ always, with equality only when
$P(B) = 1$ or $P(A \cap B) = 0$.

The three sliders are areas, the quantities the definition is written in:

be no larger than either event and no smaller than

\approx 0.06$) gives both cells the same height: $A$ takes the same share of
$B$ as of $\Omega$, $P(A \mid B) = P(A)$, and the caption reports that
learning $B$ changes nothing — the case called independence.

Two fair coins are flipped. How likely is $B$ = **both heads**, if we learn …

</div>

**(b) "At least one coin is heads"**

$A = \lbrace hh, ht, th\rbrace$


<div class="fragment">

</div>

## Two Coins, Drawn


<div class="img-h-md">

<div class="fragment c-warning">

Pictures stop at two or three events. **Learn the rule** — it does not run out.

</div>


Notes:
(b) is smaller because the information in (a) is stronger: naming *which* coin
is heads rules out two of the four outcomes, leaving $\lbrace hh, ht\rbrace$,
whereas "at least one is heads" rules out only $tt$, leaving three equally
likely outcomes of which one is $hh$.

A frequent error is to answer $\tfrac12$ in (b) by reasoning "one coin is heads,
the other is heads with probability $\tfrac12$". That argument silently fixes
which coin is known to be heads, which is the information of (a), not of (b).
The figure makes the difference countable: the violet frame holds two outcomes
in (a) and three in (b), and the counted outcome $hh$ is the same.

Venn diagrams and outcome sets are drawable for two, at most three events; a
model with ten binary variables has $2^{10} = 1{,}024$ joint outcomes. The
definition of conditional probability applies unchanged to any number of
events, which is why it, not the picture, is the tool.
The same structure underlies the "boy or girl paradox" (Gardner, 1959): "a
family with two children has at least one boy" gives probability $\tfrac13$
for two boys, "the older child is a boy" gives $\tfrac12$. The answer also
depends on how the information was obtained; the $\tfrac13$ assumes that "at
least one" was the full content of what was learned.

## Total Probability


<div class="c-definition">

**Theorem (Total probability).** Let $E\_1, \ldots, E\_k$ be mutually exclusive
with $\Omega = E\_1 \cup \ldots \cup E\_k$ and $P(E\_i) > 0$. Then for any event
$B$:
$$
P(B) = \sum\_{i=1}^{k} P(E\_i) \cdot P(B \mid E\_i)
$$

</div>


**Proof.** Decompose $B$ along the partition and use additivity:

$$
P(B) = P((E\_1 \cup \ldots \cup E\_k) \cap B)
 = \sum\_{i=1}^{k} P(E\_i \cap B)
 = \sum\_{i=1}^{k} P(E\_i) \cdot P(B \mid E\_i)
$$

Notes:
The proof uses three facts. First, $B = B \cap \Omega = \bigcup\_i (E\_i \cap B)$
because the $E\_i$ cover $\Omega$. Second, the pieces $E\_i \cap B$ are pairwise
disjoint because the $E\_i$ are, so additivity (Axiom III) turns the union into a
sum. Third, $P(E\_i \cap B) = P(E\_i)\\,P(B \mid E\_i)$ by the definition of
conditional probability, which needs $P(E\_i) > 0$.

The theorem computes a probability by cases: in the students-and-exams
example, $P(\text{fail}) = 0.4 \cdot 0.25 + 0.6 \cdot 0.1 = 0.16$. It supplies the
denominator $P(B)$ of Bayes' theorem whenever $P(B)$ is not known directly.
The simplest partition is $\lbrace E, \bar E\rbrace$:
$P(B) = P(E)P(B \mid E) + P(\bar E)P(B \mid \bar E)$.

--

## Total Probability, Drawn


<div class="img-h-lg">

![The sample space cut into three strips E1, E2, E3; the event B is cut into three pieces, one per strip, each with probability P(Ei) times P(B given Ei)](/units/math/stochastic/figures/total-probability.svg)

</div>


$B$ is cut into disjoint pieces, one per $E\_i$; each piece is "first $E\_i$,
then $B$ within $E\_i$" — the product rule.

Notes:
The strips $E\_1, E\_2, E\_3$ are a partition: disjoint and together all of
$\Omega$. Each piece $B \cap E\_i$ has probability
$P(E\_i)\\,P(B \mid E\_i)$ by the product rule, and the pieces add up to $B$ by
additivity. In the students-and-exams example the partition is the course
$\lbrace \text{PML}, \text{DB}\rbrace$ and $B$ = failed:
$P(\text{fail}) = 0.4 \cdot 0.25 + 0.6 \cdot 0.1 = 0.16$ — the sum rule of
the count table, written with conditionals.

## Rules That Follow


<div class="grid-3">


<div class="column">


<div class="card">

### Product rule
$$P(A \cap B) = P(B) \cdot P(A \mid B)$$
$$\phantom{P(A \cap B)} = P(A) \cdot P(B \mid A)$$

</div>


</div>


<div class="column">


<div class="card">

### Complement, same condition
$$P(\overline{A} \mid B) = 1 - P(A \mid B)$$

</div>


</div>


<div class="column">


<div class="c-warning">

**But in general**
$$P(A \mid \overline{B}) \neq 1 - P(A \mid B)$$

</div>


</div>


</div>



<div class="c-insight">

Held fixed at $B$, $\\;P\_B(E) = P(E \mid B)$ for every event $E$ satisfies the
Kolmogorov axioms — conditioning yields a **new probability measure** $P\_B$.

</div>


Notes:
The product rule is the definition of conditional probability multiplied out;
it also holds when $P(B) = 0$ if both sides are read as 0. Its two forms,
set equal and divided by $P(A) > 0$, turn $P(A \mid B)$ into $P(B \mid A)$:
that is Bayes' theorem, which gets its own unit.

Complementing the event under a fixed condition is valid because $P\_B$ is a
probability measure, and $P\_B(\bar A) = 1 - P\_B(A)$ holds for every measure.
Complementing the condition is not valid: $P(A \mid B)$ and
$P(A \mid \bar B)$ belong to two different measures. In the dice example,
$P(\text{sum } 8 \mid \text{first is } 3) = 1/6$, whereas
$P(\text{sum } 8 \mid \text{first is not } 3) = 4/30 = 2/15$, not $5/6$.

That $P\_B$ satisfies the axioms is checked directly: $P(A \cap B)/P(B) \geq 0$;
$P(\Omega \cap B)/P(B) = 1$; and disjoint $E\_1, E\_2$ give disjoint
$E\_1 \cap B, E\_2 \cap B$. Every rule proved for $P$ therefore holds for
$P(\cdot \mid B)$.

The letter $E$ is a placeholder for an arbitrary event; writing the map as
$A \mapsto P(A \mid B)$ is equally correct, but $A$ already names a specific
event in the product rule on this slide.

--

## Conditioning Gives a New Measure


<div class="img-h-md">

![Three copies of B framed as the whole world: a piece of B is never negative, all of B has measure one, and two disjoint pieces of B add up](/units/math/stochastic/figures/conditional-measure.svg)

</div>


Inside $B$, the three axioms hold again — so **every rule proved for $P$
holds for $P\_B$**.

Notes:
Axiom I: $P\_B(E) = P(E \cap B)/P(B)$ is a ratio of a non-negative number and
a positive one. Axiom II: $P\_B(\Omega) = P(\Omega \cap B)/P(B) = P(B)/P(B)
= 1$; also $P\_B(B) = 1$, so after conditioning $B$ is certain. Axiom III: if
$E\_1 \cap E\_2 = \emptyset$, the pieces $E\_1 \cap B$ and $E\_2 \cap B$ are
disjoint too, and additivity of $P$ carries over after dividing by $P(B)$.
Events disjoint from $B$ get $P\_B(E) = 0$.

This licenses the complement rule under a fixed condition,
$P(\bar A \mid B) = 1 - P(A \mid B)$, and every other consequence of the
axioms. It does not license changing the condition: $P\_B$ and $P\_{\bar B}$
are two different measures.

--

## Chain Rule

$$
P(E\_1 \cap E\_2 \cap \ldots \cap E\_n) =
P(E\_1) \cdot P(E\_2 \mid E\_1) \cdot P(E\_3 \mid E\_1 \cap E\_2) \cdots
P(E\_n \mid E\_1 \cap \ldots \cap E\_{n-1})
$$


<div class="img-h-md">

![Four bars drawn to scale: Omega, E1 as half of it, E1 and E2 as three fifths of that, and all three events as half of that, three twentieths of Omega](/units/math/stochastic/figures/chain-rule.svg)

</div>



<div class="c-note">

Each factor keeps a share of what is left. Any joint probability can be written as a chain of conditionals. Choosing a
*good* order — and dropping conditions that do not matter — is exactly what
graphical models will do later.

</div>


Notes:
Proof for three events:
$P(E\_1 \cap E\_2 \cap E\_3) = P(E\_1 \cap E\_2)\\,P(E\_3 \mid E\_1 \cap E\_2)
= P(E\_1)\\,P(E\_2 \mid E\_1)\\,P(E\_3 \mid E\_1 \cap E\_2)$; induction gives the
general case. It requires $P(E\_1 \cap \ldots \cap E\_{n-1}) > 0$.

Any order of the events gives a valid factorisation. The chain rule holds
without assumptions; simplification comes only from conditional independence,
when a factor such as $P(E\_3 \mid E\_1 \cap E\_2)$ equals $P(E\_3 \mid E\_2)$.
For $n$ binary variables the full joint needs $2^n - 1$ numbers; if each factor
depends on at most $k$ earlier variables, at most $n \cdot 2^k$ suffice.
Bayesian networks are built on exactly this combination of an ordering and
dropped conditions.

The figure uses $P(E\_1) = \tfrac12$, $P(E\_2 \mid E\_1) = \tfrac35$ and
$P(E\_3 \mid E\_1 \cap E\_2) = \tfrac12$: each bar is the shaded part of the bar
above it, so the last one is $\tfrac12 \cdot \tfrac35 \cdot \tfrac12 =
\tfrac{3}{20}$ of $\Omega$. Every conditional is measured against what is
left, never against $\Omega$.

Example: drawing two aces in a row from a 52-card deck without replacement has
probability $\tfrac{4}{52} \cdot \tfrac{3}{51} = \tfrac{1}{221}$.

--

## Takeaway


<div class="takeaway">

Conditioning **shrinks the sample space and renormalises**. Everything else —
product rule, total probability, Bayes, the chain rule — is bookkeeping on that
single move.

</div>


--

## Independence


<div class="c-definition">

**Definition (Statistical independence).** Two events $A$ and $B$ are
**independent** iff
$$
P(A \cap B) = P(A) \cdot P(B)
$$

</div>


If additionally $0 < P(B) < 1$, this is equivalent to

$$
P(A \mid B) = P(A) \qquad\text{and}\qquad P(A \mid B) = P(A \mid \overline{B})
$$

Independence means: **learning $B$ changes nothing about $A$.**

Notes:
The conditional form carries the meaning: learning that $B$ occurred leaves the
probability of $A$ unchanged. The product form is the standard definition
because it is symmetric in $A$ and $B$ and remains defined when $P(B) = 0$; an
event of probability 0 or 1 is independent of every event.

Equivalence for $0 < P(B) < 1$: dividing the product form by $P(B)$ gives
$P(A \mid B) = P(A)$. Total probability gives
$P(A) = P(B)P(A \mid B) + P(\bar B)P(A \mid \bar B)$, so $P(A)$ is a weighted
average of the two conditionals, and it equals $P(A \mid B)$ exactly when
$P(A \mid B) = P(A \mid \bar B)$. If $A$ and $B$ are independent, so are $A$
and $\bar B$, $\bar A$ and $B$, and $\bar A$ and $\bar B$.

Example: for two fair dice, "the first shows 6" and "the second shows 6" are
independent, $\tfrac{1}{36} = \tfrac16 \cdot \tfrac16$.

--

## The Classic Confusion


<div class="c-warning">

**Statistical independence does not mean the events are disjoint.**

</div>


Disjoint events with positive probability are about as **dependent** as events
can be: if $A$ occurs, $B$ certainly did not.

$$
A \cap B = \emptyset \Rightarrow P(A \mid B) = 0 \neq P(A)
$$

Notes:
Disjoint events with positive probability exclude each other: the occurrence
of one rules out the other, which is maximal information about it. Formally,
$P(A \cap B) = 0$ while $P(A)P(B) > 0$, so the product form fails. Learning
$B$ moves $P(A)$ to 0, the largest possible change downwards.

The Venn diagram misleads here because non-overlapping circles look
"unrelated". Disjointness is a property of the sets; independence is a
property of the probability measure and can change when the measure changes
while the sets stay the same. The only case in which disjoint events are
independent is when at least one of them has probability 0.

--

## Independence Is About Areas, Not Overlap

<div class="viz" data-viz="math/independence-areas" data-steps="4"
 data-params='{"pA": 0.3, "pB": 0.4, "pAB": 0.12}'></div>

Independent: **knowing $B$ tells nothing about $A$**. $A$ takes the same share
of $B$ as of all of $\Omega$, so its probability stays the same.

Notes:
The steps show the band $A$ with area $P(A) = 0.3$, the band $B$ with area
$P(B) = 0.4$, their intersection with area $P(A \cap B) = 0.12$, and the
comparison with $P(A)P(B) = 0.3 \cdot 0.4 = 0.12$: the events are independent.
Equivalently $P(A \mid B) = 0.12 / 0.4 = 0.3 = P(A)$: $A$ occupies the same
fraction of $B$ as of the whole of $\Omega$.

Independence is an equality between numbers, not a property of the drawing:
the shapes and positions of the regions are irrelevant, only their areas
count. Overlapping regions can be independent, and so can regions that look
strongly entangled.

--

## The Same Picture, Dependent

<div class="viz" data-viz="math/independence-areas" data-steps="4"
 data-params='{"pA": 0.3, "pB": 0.4, "pAB": 0.20, "label": "C"}'></div>

Here $P(A) \cdot P(C) = 0.12$ but $P(A \cap C) = 0.20$: the intersection is
**larger** than independence would predict — $A$ and $C$ occur together more
often than chance.

Notes:
Here $P(A \mid C) = 0.20 / 0.4 = 0.5 > P(A) = 0.3$: learning $C$ raises the
probability of $A$, so $A$ and $C$ are positively dependent. A smaller
intersection, below 0.12, would give negative dependence.

The marginals $P(A) = 0.3$ and $P(C) = 0.4$ are the same as on the previous
slide; only the joint probability $P(A \cap C)$ differs. Marginals therefore
never determine whether events are independent. Given these marginals,
$P(A \cap C)$ can take any value between
$\max(0, P(A) + P(C) - 1) = 0$ and $\min(P(A), P(C)) = 0.3$ (the Fréchet
bounds); independence is the single value $0.12$ in that range. Answering
questions about dependence requires the joint distribution.

--

## More Than Two Events


<div class="c-definition">

Events $A\_1, \ldots, A\_n$ are (mutually) independent iff for **every** subset
of indices $i\_1, \ldots, i\_l$:
$$
P(A\_{i\_1} \cap \ldots \cap A\_{i\_l}) = P(A\_{i\_1}) \cdots P(A\_{i\_l})
$$

</div>



<div class="c-note">

Pairwise independence is **not** enough — every subset must factorise.

</div>


Notes:
Standard counterexample: flip two fair coins; let $A$ = "first is heads",
$B$ = "second is heads", $C$ = "the coins agree". Each has probability
$\tfrac12$, and each pairwise intersection is $\lbrace HH\rbrace$ with
probability $\tfrac14 = \tfrac12 \cdot \tfrac12$, so the three are pairwise
independent. But $P(A \cap B \cap C) = \tfrac14 \neq \tfrac18$: any two
of them determine the third.

For $n$ events the definition imposes $2^n - n - 1$ equations, one for every
subset of at least two events. The converse failure also exists: the triple
product can factorise while a pair does not, so checking only the full
intersection is not enough either. Models that assume features to be
independent given a class (naive Bayes) assume mutual, not merely pairwise,
conditional independence.

--

## Takeaway


<div class="takeaway">

Independence is a statement about **numbers**, not pictures: $P(A \cap B)$
equals the product of the marginals. Disjoint is not independent, and identical
marginals can hide either.

</div>


--

## Conditional Independence


<div class="c-definition">

**Definition.** Events $A$ and $B$ are **conditionally independent given $C$**
(written $A \indep B \mid C$) iff
$$
P(A \cap B \mid C) = P(A \mid C) \cdot P(B \mid C)
$$
equivalently
$$
P(A \mid B \cap C) = P(A \mid C)
$$

</div>


Reading: **once $C$ is known, $B$ carries no further information about $A$.**

Notes:
Math first (P5), but immediately give the reading. The second form is the one
used in practice: it says B becomes redundant in the presence of C.

--

## Dependent, but Independent Given C

Let $P(A) = \tfrac{8}{16}$, $P(B) = \tfrac{3}{16}$, $P(C) = \tfrac{4}{16}$ on a
16-cell sample space.


<div class="grid-2">


<div class="column">


<div class="card bad">

**Unconditionally dependent**

$$P(A \cap B) = \tfrac{1}{16}$$
$$P(A)\cdot P(B) = \tfrac{3}{32}$$

$\tfrac{1}{16} \neq \tfrac{3}{32}$, so $A \nindep B$

</div>


</div>


<div class="column">


<div class="card good">

**Conditionally independent given $C$**

$$P(A \cap B \mid C) = \tfrac{1}{4}$$
$$P(A \mid C)\cdot P(B \mid C) = \tfrac{2}{4}\cdot\tfrac{2}{4} = \tfrac{1}{4}$$

so $A \indep B \mid C$

</div>


</div>


</div>


Also directly: $P(A \mid B \cap C) = \tfrac{1}{2} = P(A \mid C)$.

Notes:
The whole idea in one comparison. Conditioning on C *created* independence that
did not exist before. Ask for a real example: ice-cream sales and drownings are
dependent, but conditionally independent given the temperature.

--

## Why This Matters


<div class="grid-3">


<div class="column">


<div class="card">

**Common cause**

A common cause $C$ can make two effects look related; given $C$, they are
independent.

</div>


</div>


<div class="column">


<div class="card">

**Common effect**

Two independent causes become dependent once their common effect is observed
— *explaining away*.

</div>


</div>


<div class="column">


<div class="card">

**Model size**

Conditional independence lets a joint distribution factorise into small pieces
— naive Bayes and graphical models are built on it.

</div>


</div>



</div>


<div class="c-warning">

Conditional independence neither implies nor is implied by ordinary
independence. Both directions can fail.

</div>


Notes:
The first two cards are the two directions of the takeaway: conditioning on a
common cause *removes* a dependence (ice cream and drownings, given the
temperature); conditioning on a common effect *creates* one (a wet lawn: rain
and the sprinkler, once you know the grass is wet, compete to explain it). Name
the models that rest on the definition without developing them. The warning box
is worth a moment — students routinely assume one form gives the other.

--

## Takeaway


<div class="takeaway">

Conditioning can **create** independence as easily as it destroys it. "Given
what I already know, does this extra fact still tell me anything?" is the
question that makes large probabilistic models tractable.

</div>


--

## Bayes' Theorem — An Intuition First

A test for a rare disease is **99% accurate**: positive for 99% of the sick,
negative for 99% of the healthy. About **1 in 1,000 people** has the disease.

**Your test comes back positive. How likely is it that you are actually sick?**


<div class="fragment">


<div class="c-important">

Only about **9%** — the answer most people miss by a factor of ten.

</div>


</div>


Notes:
The test has sensitivity $P(+ \mid \text{sick}) = 0.99$ and specificity
$P(- \mid \text{healthy}) = 0.99$; the prevalence is $0.001$. The exact
answer is
$P(\text{sick} \mid +) = \dfrac{0.99 \cdot 0.001}{0.99 \cdot 0.001 + 0.01 \cdot 0.999}
= \dfrac{0.00099}{0.01098} \approx 0.090$.

The common intuitive answer is 99%, the test's accuracy. Physicians make the
same error on comparable screening problems (Eddy, 1982, for mammography). The error is called base-rate neglect: the
prevalence, 1 in 1,000, is ignored. Errors of this size occur because false
positives from the large healthy group outnumber true positives from the small
sick group about ten to one.

--

## Why? Count People, Not Percentages

<div class="viz viz-lg" data-viz="math/bayes-natural-frequencies" data-steps="4"
 data-params='{"population": 1000, "prevalence": 0.001, "sensitivity": 0.99, "specificity": 0.99}'></div>

Notes:
The steps show: a population of 1,000; the one person among them who is sick
(prevalence 0.001); the healthy people the test flags, $1\\% \cdot 999 \approx
10$; and only the positives kept, about 11 people of whom one is sick. Hence
$P(\text{sick} \mid +) \approx 1/11 \approx 9\\%$; exactly,
$0.99 / (0.99 + 9.99) \approx 0.090$.

Counting people in a fixed population ("natural frequencies") rather than
multiplying percentages is known to reduce base-rate neglect substantially
(Gigerenzer and Hoffrage, 1995). The computation is the same: restricting the
population to the positives is conditioning on the event "positive".

--

## What Just Happened


<div class="grid-2-1">


<div class="column">

Restricting attention to the people who tested positive is exactly the move
from the conditional-probability definition:

$$
P(A \mid B) = \frac{P(A\cap B)}{P(B)}
$$

The 11 positives are the new sample space $B$; the single sick person among
them is $A \cap B$. The rarity of the disease survives the evidence because
there were so many more healthy people to misclassify.

</div>


<div class="column">


<div class="c-warning">

**The trap**

"99% accurate" describes
$P(\text{positive} \mid \text{sick})$.

You wanted
$P(\text{sick} \mid \text{positive})$.

These are different numbers.

</div>


</div>


</div>


Notes:
Confusing $P(B \mid A)$ with $P(A \mid B)$ is known as the confusion of the
inverse; in court it is called the prosecutor's fallacy, where the probability
of the evidence given innocence is presented as the probability of innocence
given the evidence. When $P(A \cap B) > 0$, the two conditionals agree only if $P(A) = P(B)$, since
$P(A \mid B)\\,P(B) = P(B \mid A)\\,P(A)$.

Bayes' theorem converts one into the other, and the conversion requires the
prior $P(A)$. A test's sensitivity and specificity are properties of the test;
$P(\text{sick} \mid +)$, the positive predictive value, also depends on the
population tested.

--

## Bayes' Theorem — Two Events


<div class="c-definition">

**Theorem (Bayes, 2 events).** Let $(\Omega,\mathcal{P}(\Omega),P)$ be a
probability space and $A, B \in \mathcal{P}(\Omega)$ two events with $P(B) > 0$.
Then:

</div>


<div class="viz eq-explain" data-viz="core/equation-explain" data-steps="4"
 data-params='{"labels": ["posterior — what we believe after", "likelihood — how well A explains B", "prior — belief before the evidence", "evidence — how ordinary B is"]}'>

$$
\eqa{P(A \mid B)} = \frac{\eqb{P(B \mid A)} \cdot \eqc{P(A)}}{\eqd{P(B)}}
$$

</div>

Which of the four was "99% accurate", and which one did the intuition ignore?


<div class="fragment">

"99% accurate" is the **likelihood** $P(+ \mid \text{sick})$; the intuition
ignored the **prior** $P(\text{sick}) = 0.001$.

</div>


Notes:
The four steps highlight in turn the posterior $P(A \mid B)$, the likelihood
$P(B \mid A)$, the prior $P(A)$ and the evidence $P(B)$. For the disease test,
$A$ = sick and $B$ = positive: "99% accurate" is the likelihood
$P(B \mid A) = 0.99$, and the term ignored by intuition is the prior
$P(A) = 0.001$.

The likelihood is a probability of $B$, but it is read as a function of the
hypothesis $A$: it need not sum to 1 over hypotheses
($P(+ \mid \text{sick}) + P(+ \mid \text{healthy}) = 1.00$ here only by
coincidence of the chosen rates). The evidence $P(B)$ does not depend on $A$;
it normalises the posterior. Equivalent odds form:
$\frac{P(A \mid B)}{P(\bar A \mid B)} = \frac{P(B \mid A)}{P(B \mid \bar A)}
\cdot \frac{P(A)}{P(\bar A)}$, i.e. posterior odds = likelihood ratio × prior
odds. Reference: (Sheldon & others 2002).

--

## Proof — Two Events


<div class="grid-2">


<div class="column">

### Intuition


<div class="img-h-md">

![Two Venn diagrams with the overlap of A and B shaded: on the left counted out of B, on the right counted out of A](/units/math/stochastic/figures/venn-bayes.svg)

</div>


One overlap $A \cap B$, measured against two wholes: against $B$ it is
$P(A \mid B)$, against $A$ it is $P(B \mid A)$.

</div>


<div class="column">

### Proof

| step | because |
|---|---|
| $P(A \mid B) = \frac{P(A \cap B)}{P(B)}$ | definition |
| $= \frac{P(A \cap B)}{P(A)} \cdot \frac{P(A)}{P(B)}$ | multiply and divide by $P(A)$ |
| $= \frac{P(B \mid A)\\, P(A)}{P(B)}$ | definition, roles swapped |

Needs $P(A), P(B) > 0$. $\blacksquare$

</div>


</div>


Notes:
The figure shows the same region $A \cap B$ measured against two different
wholes: against $B$ it is $P(A \mid B)$, against $A$ it is $P(B \mid A)$.
Both products with the size of the whole give back the overlap,
$P(A \mid B)P(B) = P(A \cap B) = P(B \mid A)P(A)$; dividing by $P(B)$ is
Bayes' theorem.

The first equality is the definition of $P(A \mid B)$ and needs $P(B) > 0$.
The second multiplies and divides by $P(A)$ and needs $P(A) > 0$; the third
recognises $P(A \cap B)/P(A) = P(B \mid A)$, the definition with the roles
swapped. If $P(A) = 0$, $P(B \mid A)$ is undefined, but $P(A \mid B) = 0$
directly from the definition: a hypothesis with prior probability zero cannot
gain probability from any evidence. This is why a prior should not assign
zero to anything that may be true (Lindley's "Cromwell's rule").

--

## Mini-Exercise


<div class="q">

**A high-risk group.** Same test: positive for **99%** of the sick, for **1%** of the healthy. Now
**1 in 20** is sick. Above or below 9%? Guess, then count 2,000 people.

</div>



<div class="fragment">

- 100 sick → **99** positive; 1,900 healthy → **19** positive.
- 99 of all **118** positives are sick: $P(\text{sick} \mid +) \approx 84\\%$.

</div>



<div class="fragment">

| | everyone | high-risk group |
|---|---|---|
| the test, $P(+ \mid \text{sick})$ / $P(+ \mid \text{healthy})$ | 99% / 1% | 99% / 1% |
| who is tested, $P(\text{sick})$ | 1 in 1,000 | 1 in 20 |
| $P(\text{sick} \mid +)$ | $\approx 9\\%$ | $\approx 84\\%$ |

</div>



<div class="fragment c-insight">

Both answers are right. Same test, same rule — **different people tested**.

</div>


Notes:
2,000 is chosen so that both rates give whole people: 1 in 20 of 2,000 is
100, and 1% of the 1,900 healthy is 19. Only the positives count once the
result is known — 118 people, the new sample space — and 99 of them are sick.
With prevalence 1 in 1,000 the same column held about 1 true positive against
10 false alarms; now true positives outnumber false alarms five to one.

Neither result corrects the other. The posterior depends on the test
(sensitivity, false-alarm rate) and on the population tested (prevalence);
here the test is the same and only the prevalence differs, raising the
positive predictive value from about 9% to about 84%. For the same reason a positive screening result is commonly confirmed by a
second, independent test: the first positive raises the prior for the second.

--

## The Same Answer, by Bayes' Theorem


<div class="q">

Which known number goes where?

</div>


$$
P(\text{sick} \mid +)
= \frac{\overbrace{P(+ \mid \text{sick})}^{\text{likelihood: } 0.99} \cdot \overbrace{P(\text{sick})}^{\text{prior: } 0.05}}{\underbrace{P(+ \mid \text{sick})\\, P(\text{sick})}\_{\text{sick and positive: } 0.99 \cdot 0.05 \\,=\\, 0.0495} + \underbrace{P(+ \mid \text{healthy})\\, P(\text{healthy})}\_{\text{healthy and positive: } 0.01 \cdot 0.95 \\,=\\, 0.0095}}
$$


<div class="fragment">

$$
= \frac{0.0495}{0.0495 + 0.0095} = \frac{0.0495}{0.0590} \approx 0.84
$$

The denominator is the **evidence** $P(+)$: every way to test positive.

</div>



<div class="fragment c-insight">

Times 2,000, the fraction is **99 / 118**. Counting people and the formula
are **one calculation**, written two ways.

</div>


Notes:
The denominator, the evidence $P(+)$, is total probability over the partition
$\lbrace \text{sick}, \text{healthy} \rbrace$: a positive comes either from a
sick person, $P(+ \mid \text{sick})\\,P(\text{sick}) = 0.0495$, or from a
healthy one, $P(+ \mid \text{healthy})\\,P(\text{healthy}) = 0.01 \cdot 0.95 =
0.0095$. The posterior is the first share of the total. In odds form: prior
odds $1 : 19$, likelihood ratio $0.99 / 0.01 = 99$, posterior odds
$99 : 19$, i.e. $99/118 \approx 0.84$.

--

## Bayes' Theorem — Multiple Events


<div class="c-definition">

**Theorem (Bayes, multiple events).** Let $E\_1, \ldots, E\_k$ be mutually
exclusive with $\Omega = E\_1 \cup \ldots \cup E\_k$ and $P(E\_i) > 0$, and let
$B$ be an event with $P(B) > 0$. Then

</div>


<div class="viz eq-explain" data-viz="core/equation-explain" data-steps="5"
 data-params='{"labels": ["posterior of Eᵢ", "likelihood — how well Eᵢ explains B", "prior of Eᵢ", "evidence", "every Eᵢ explains B, weighted by its prior"]}'>

$$
\eqa{P(E\_i \mid B)} = \frac{\eqb{P(B \mid E\_i)} \cdot \eqc{P(E\_i)}}{\eqd{P(B)}}
 = \frac{P(B \mid E\_i) \cdot P(E\_i)}{\eqe{\sum\_{j=1}^{k} P(B \mid E\_j) \cdot P(E\_j)}}
$$

</div>

The denominator is the **total probability** of the evidence.

Notes:
The events $E\_1, \ldots, E\_k$ partition $\Omega$: exactly one of them
occurs. Read as competing explanations of $B$, they are called hypotheses. "Sick vs. healthy" is the case $k = 2$, and the students-and-exams
example (PML vs. DB) is another. The posteriors $P(E\_i \mid B)$ sum to 1 because the
denominator is the sum of all numerators.

The procedure is: compute likelihood × prior for every $E\_i$, then divide
by the total. Since the denominator is the same for all $i$, ranking the
events — choosing the most probable one — needs only the numerators. A
Bayes classifier does exactly this, with the classes as the $E\_i$ and the
observed features as $B$.

--

## Proof — Multiple Events


<div class="grid-2">


<div class="column">

### Intuition


<div class="img-h-md">

![The sample space cut into events E1, E2, E3; the evidence B is cut into three pieces; the piece inside E2 is counted out of all of B](/units/math/stochastic/figures/bayes-partition.svg)

</div>


The events $E\_i$ cut $B$ into pieces. The posterior of $E\_i$ is **its piece out
of all pieces**.

</div>


<div class="column">

### Proof

| step | because |
|---|---|
| $P(E\_i \mid B) = \frac{P(B \mid E\_i)\\, P(E\_i)}{P(B)}$ | Bayes, two events |
| $P(B) = \sum\_j P(B \cap E\_j)$ | additivity |
| $= \sum\_j P(B \mid E\_j)\\, P(E\_j)$ | product rule |

Additivity holds because the $E\_j$ are disjoint and cover $\Omega$. Insert
$P(B)$ into the first line. $\blacksquare$

</div>


</div>


Notes:
The events $E\_j$ are the strips; the evidence $B$ is the ellipse. Each piece
$B \cap E\_j$ has probability $P(E\_j)\\,P(B \mid E\_j)$ (product rule), and the
pieces add up to $P(B)$ (total probability). The posterior of $E\_2$ is its
piece out of the whole ellipse. An event $E\_j$ wins when its piece is large —
because it was plausible beforehand (wide strip), or because it explains $B$
well (much of its strip lies inside $B$), or both.

--

## Takeaway


<div class="takeaway">

Bayes' theorem is the arithmetic of changing your mind: **posterior ∝
likelihood × prior**. Evidence never speaks alone — it is always weighed
against how plausible the hypothesis was to begin with.

</div>


Notes:
$\propto$ means "proportional to, as a function of the hypothesis": the
posterior is the product likelihood × prior, rescaled so that it sums to 1 over
all hypotheses. Two consequences follow. Ignoring the prior gives the base-rate
error (99% instead of 9% for the disease test). The same evidence gives very
different posteriors under different priors (9% at prevalence 1/1,000, 84% at
1/20).

Sequential updating is consistent: the posterior after one piece of evidence
serves as the prior for the next, and if the pieces of evidence are
conditionally independent given the hypothesis, the result equals a single
update on all of them at once.

---
