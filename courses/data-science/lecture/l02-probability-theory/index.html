# Module 5
## Random Variables and Distributions

> **Guiding Question:** We rarely care which outcome occurred, only what it was
> worth. How do we move from outcomes to quantities?

Notes:
Session boundary: the second session starts here. Recall the three-card flow
from the opening (assume → observe → check): Modules 1–4 built the model of
chance for events; Modules 5–7 turn outcomes into quantities, describe a sample
and check a difference.

--

## Why Random Variables?

Three fair coins: what matters is rarely *which* sequence occurred, but the
**number of heads** $Y$.

| $Y$ | outcomes $\omega$ with $Y(\omega) = k$ | count | $P(Y = k)$ |
|---|---|---|---|
| $0$ | TTT | 1 | $\tfrac{1}{8}$ |
| $1$ | HTT · THT · TTH | 3 | $\tfrac{3}{8}$ |
| $2$ | HHT · HTH · THH | 3 | $\tfrac{3}{8}$ |
| $3$ | HHH | 1 | $\tfrac{1}{8}$ |


<div class="c-insight">

$Y$ compresses eight outcomes into four numbers — the probabilities come along.

</div>


Notes:
The eight outcomes are equally likely, $\tfrac18$ each. $Y$ maps them to
$\lbrace 0, 1, 2, 3\rbrace$, and $P(Y = k)$ is the number of sequences with
$k$ heads divided by 8, i.e. $\binom{3}{k} / 8$: 1, 3, 3, 1 sequences. This is
the binomial distribution with $n = 3$, $p = \tfrac12$.

The compression loses information: which coins showed heads, and in which
order. It gains a numerical quantity that can be averaged, compared and
plotted; for example $E[Y] = (0 + 3 + 6 + 3)/8 = 1.5$. Whether the lost
information matters depends on the question: for the number of heads it does
not, for "did the first coin show heads" it does.

--

## Definition


<div class="c-definition">

**Definition (Random variable).** A random variable $X$ maps outcomes to a
measurable range $E$: $X : \Omega \to E$. Its probabilities are inherited from
the underlying probability space:
$$
P(X \in S) = P(\lbrace \omega \in \Omega \mid X(\omega) \in S\rbrace )
$$

</div>



<div class="c-warning">

A random variable is neither random nor a variable — it is a **function** on the
sample space. The randomness lives in $\omega$, not in $X$.

</div>


Notes:
$X$ is a deterministic function: the same outcome $\omega$ always gives the
same value $X(\omega)$. The randomness is in which $\omega$ occurs. The
notation $P(X \in S)$ abbreviates the probability of the event
$X^{-1}(S) = \lbrace \omega : X(\omega) \in S\rbrace$, the preimage of $S$;
for a single value, $P(X = x) = P(\lbrace \omega : X(\omega) = x\rbrace)$.

"Measurable" means that every such preimage is an event, so that $P$ is defined
on it. On a finite $\Omega$ with the power set as event space every function is
measurable. The convention is capital letters for random variables and lower
case for their values: $P(X = x)$.

The resulting assignment $S \mapsto P(X \in S)$ is itself a probability
measure on $E$, the distribution of $X$.

--

## The Function, Drawn

<div class="viz viz-lg" data-viz="math/random-variable-map" data-steps="4"></div>

Notes:
The steps show the eight outcomes of three coin tosses; one arrow from each
outcome to its number of heads; the four values with the count of arrows
arriving at each (1, 3, 3, 1); and the resulting probability mass function
$P(Y = k)$.

Every outcome has exactly one outgoing arrow, which is what makes $Y$ a
function. A value may receive several arrows (the function need not be
injective) or none (it need not be surjective onto $E$; a value with no
preimage has probability 0). The values 1 and 2 are three times as probable as
0 and 3 solely because three outcomes map to each of them; no probability is
assigned to $Y$ directly, it is inherited from the measure on $\Omega$.

--

## Examples

| experiment | sample space $\Omega$ | random variable $X(\omega)$ | values |
|---|---|---|---|
| two coins | $\lbrace HH, HT, TH, TT\rbrace$ | number of heads | $0, 1, 2$ |
| two dice | pairs $\langle n\_1, n\_2\rangle$ | sum $n\_1 + n\_2$ | $2, \ldots, 12$ |
| draw a person | a population | height of the person | an interval of $\mathbb{R}$ |

The same outcome can carry many random variables: one per question asked of it.

Notes:
Two coins: $X$ takes values 0, 1, 2 with probabilities $\tfrac14, \tfrac12,
\tfrac14$. Two dice: the sum takes values 2 to 12; $P(X = 7) = 6/36$ is the
most probable value, $P(X = 2) = P(X = 12) = 1/36$.

People: $\Omega$ is a population and the experiment is drawing one person at
random. Height is then a random variable, and its distribution is the
distribution of heights in the population. A column of a dataset is read the
same way: a function from records to values, whose distribution is that of the
attribute in the population the records were drawn from. Several columns on the
same records are several random variables on the same $\Omega$, which is what
makes a joint distribution of them meaningful.

--

## Discrete and Continuous


<div class="grid-2">


<div class="column">


<div class="card">

**Discrete random variables**

Countable range, usually $E \subseteq \mathbb{N}$.

- number of children of a person
- sum of two dice

</div>


</div>


<div class="column">


<div class="card">

**Continuous random variables**

Real-valued range, $E = \mathbb{R}$.

- height of a person
- horsepower of a car

</div>


</div>


</div>


The distinction decides *how* we may describe the probabilities — with a mass
function or with a density.

Notes:
A discrete random variable takes countably many values (finitely many or
indexed by $\mathbb{N}$); its distribution is fully described by the
probability mass function $p(x) = P(X = x)$, and probabilities of sets are
sums. A continuous random variable has a density $f$ with
$P(a \leq X \leq b) = \int\_a^b f(x)\\,dx$; every single value then has
probability 0, and a density value $f(x)$ is not a probability and can exceed 1.

Real-valued range alone is not what makes a variable continuous: it is the
existence of a density. Mixed cases occur, e.g. daily rainfall, which is
exactly 0 with positive probability and continuous otherwise. Recorded data
are always discrete because of finite measurement precision; a continuous
model is an idealisation chosen for convenience, as with height.

--

## A Random Variable With Infinitely Many Values


<div class="grid-2">


<div class="column">

Flip a biased coin ($P(H) = p$) until the first head; $X$ is the number of
flips needed.

**Geometric distribution**, $X \sim \mathrm{Geom}(p)$:

$$P(X = 1) = p$$
$$P(X = 2) = (1-p)p$$
$$P(X = n) = (1-p)^{n-1} p$$

</div>


<div class="column">

<div class="viz" data-viz="math/distribution-explorer"
 data-params='{"kind": "geometric", "p": 0.5, "n": 10}'></div>

</div>


</div>


Countably infinite range, and the probabilities still sum to 1.

Notes:
The figure shows the geometric distribution for $p = \tfrac12$ up to $n = 10$. $X = n$ means $n - 1$ tails followed by a
head; with independent flips the probability of this sequence is the product
$(1-p)^{n-1} p$.

The probabilities sum to 1 by the geometric series, for $0 < p \leq 1$:
$\sum\_{n=1}^{\infty} (1-p)^{n-1} p = p \cdot \frac{1}{1 - (1-p)} = 1$.
Countable additivity is what allows this infinite sum to be used. The expected
number of flips is $E[X] = 1/p$, e.g. 2 for a fair coin. The distribution is
memoryless: $P(X > m + n \mid X > m) = P(X > n)$, so past tails do not make
a head more likely — the formal reason the gambler's fallacy is a fallacy for
independent trials.

--

## Takeaway


<div class="takeaway">

A random variable is a **function from outcomes to numbers** that carries the
probability measure with it. It lets us stop talking about sample spaces and
start talking about quantities — which is what the rest of the course does.

</div>


--

## Probability Mass Function


<div class="c-definition">

**Definition (PMF).** For a discrete random variable $X$, the **probability
mass function** is
$$
p(a) = P(X = a)
$$

</div>



<div class="c-intuition">

$p(a)$ is how much of the total probability sits exactly on the value $a$.

</div>


What follows from the axioms, with nothing new assumed:

- $p(a) > 0$ for at most countably many values $a$
- $\sum\_i p(a\_i) = 1$ — the masses add up to the whole
- $p$ defines a probability measure on the values: the **distribution** of $X$

Notes:
The PMF is the probability measure transferred from outcomes to values:
$p(a) = P(\\{\omega : X(\omega) = a\\})$. Its properties are consequences of the
axioms, not new assumptions. Non-negativity is inherited directly. The events
$\\{X = a\_i\\}$ are pairwise disjoint and together cover $\Omega$, so countable
additivity gives $\sum\_i p(a\_i) = 1$.

Strictly, $p$ is a function on values; the probability measure it defines is
$P\_X(A) = \sum\_{a\_i \in A} p(a\_i)$ for any set $A$ of values, the
**distribution** of $X$. A value outside the range of $X$ has $p(a) = 0$. The
cumulative distribution function $F(a) = P(X \leq a) = \sum\_{a\_i \leq a} p(a\_i)$
carries the same information as the PMF and is a step function for a discrete
variable.

--

## Example: Sum of Two Dice

<div class="viz" data-viz="math/distribution-explorer"
 data-params='{"kind": "dice-sum"}'></div>

The triangular shape is counting, drawn: six of the
36 outcomes give 7, only one gives 2.

Notes:
The sample space has 36 equally likely **ordered** pairs $(i, j)$. The number
of pairs with sum $s$ is $6 - |s - 7|$ for $s = 2, \dots, 12$, so
$p(s) = (6 - |s - 7|)/36$. The shape is symmetric about 7 because the map
$(i, j) \mapsto (7 - i, 7 - j)$ is a bijection that sends sum $s$ to $14 - s$;
it peaks at 7 because middling sums can be formed in the most ways.

Treating the pairs as unordered (21 outcomes, e.g. $\\{1,2\\}$ counted once) is a
frequent error: the unordered outcomes are not equally likely, since $\\{1,2\\}$
arises from two ordered pairs and $\\{1,1\\}$ from only one.

The sum has $E = 7$ and variance $2 \cdot 35/12 = 35/6 \approx 5.83$. For the
sum of $n$ dice the standard deviation grows like $\sqrt{n}$ while the range
grows like $n$, so the sum concentrates relative to its range — the first
instance of the behaviour described by the law of large numbers and the
central limit theorem.

--

## Expectation


<div class="c-definition">

**Definition (Expected value).**
$$
E[X] = \sum\_i a\_i \cdot p(a\_i)
$$

</div>



<div class="c-intuition">

The **average outcome** if the experiment were repeated infinitely often — the
balance point of the bar chart of $p$.

</div>


| | |
|---|---|
| function of $X$ | $E[g(X)] = \sum\_i g(a\_i) p(a\_i)$ |
| linear transformation | $E[aX + b] = a E[X] + b$ |
| first moment | $\mu = E[X]$; the first *central* moment $E[X - \mu] = 0$ |

Notes:
The frequentist reading is justified by the law of large numbers: the average
of $n$ independent repetitions converges to $E[X]$. The expectation exists only
if $\sum\_i |a\_i| p(a\_i) < \infty$; for heavy-tailed variables the sum can
diverge.

$E[g(X)] = \sum\_i g(a\_i) p(a\_i)$ computes the expectation of $g(X)$ without
first deriving the distribution of $g(X)$. Linearity, $E[aX + b] = aE[X] + b$,
extends to sums: $E[X + Y] = E[X] + E[Y]$ holds for any two random variables,
independent or not.

In general $E[g(X)] \neq g(E[X])$. With $X$ uniform on $\\{-1, 1\\}$ and
$g(x) = x^2$: $E[X^2] = 1$, but $(E[X])^2 = 0$. For convex $g$, Jensen's
inequality gives $E[g(X)] \geq g(E[X])$. The first central moment vanishes
because $E[X - \mu] = E[X] - \mu = 0$.

--

## Variance


<div class="c-definition">

**Definition (Variance).**
$$
\mathrm{Var}(X) = E\big[(X - \mu)^2\big] = E[X^2] - \big(E[X]\big)^2
$$

</div>



<div class="grid-2">


<div class="column">


<div class="card">

### Spread
The second central moment: the expected squared distance from the mean.
Larger variance, larger typical deviation.

</div>


</div>


<div class="column">


<div class="card">

### Scale and unit
$\mathrm{Var}(aX + b) = a^2 \mathrm{Var}(X)$

$\sigma = \sqrt{\mathrm{Var}(X)}$, the **standard deviation**, has the unit of $X$.

</div>


</div>


</div>


Notes:
The computational identity follows from linearity:
$E[(X - \mu)^2] = E[X^2] - 2\mu E[X] + \mu^2 = E[X^2] - \mu^2$. Since the
variance is non-negative, $E[X^2] \geq (E[X])^2$, with equality exactly when
$X$ is constant with probability 1. In floating-point arithmetic the identity
can lose precision through cancellation when the mean is large relative to the
spread; numerical code therefore subtracts the mean first.

$\mathrm{Var}(aX + b) = a^2 \mathrm{Var}(X)$ because
$(aX + b) - (a\mu + b) = a(X - \mu)$: a shift moves the distribution without
changing its spread, and a scaling by $a$ scales $\sigma$ by $|a|$. The
standard deviation is reported because it has the unit of $X$; the variance has
the squared unit (cm² for heights in cm).

Fair die: $E[X] = 3.5$, $E[X^2] = 91/6$, so
$\mathrm{Var}(X) = 91/6 - 12.25 = 35/12 \approx 2.92$ and $\sigma \approx 1.71$.

--

## Takeaway


<div class="takeaway">

A discrete distribution is a PMF; expectation and variance compress it into
**where it sits** and **how much it spreads**.

</div>


--

## Bernoulli and Binomial

| | models | PMF | $E[X]$ | $\mathrm{Var}(X)$ |
|---|---|---|---|---|
| **Bernoulli**$(p)$ | one trial: $X = 1$ success, $X = 0$ failure | $p(x) = p^x (1-p)^{1-x}$ | $p$ | $p(1-p)$ |
| **Binomial** $B(n,p)$ | successes in $n$ independent trials | $p(k) = \binom{n}{k} p^k (1-p)^{n-k}$ | $np$ | $np(1-p)$ |

$\binom{n}{k} = \frac{n!}{k!(n-k)!}$ counts the sequences with $k$ successes;
the PMF multiplies it by the probability of one such sequence — combinatorics
and independence in a single line.

Notes:
Bernoulli moments: $E[X] = 1 \cdot p + 0 \cdot (1 - p) = p$; since $X^2 = X$,
$E[X^2] = p$ and $\mathrm{Var}(X) = p - p^2 = p(1 - p)$, which is largest
($\tfrac{1}{4}$) at $p = \tfrac{1}{2}$ and 0 at $p \in \\{0, 1\\}$.

The binomial count is a sum of $n$ independent Bernoulli$(p)$ variables. A
particular sequence with $k$ successes has probability $p^k (1-p)^{n-k}$ by
independence, and $\binom{n}{k}$ such sequences exist. The PMF sums to 1 by
the binomial theorem, $\sum\_k \binom{n}{k} p^k (1-p)^{n-k} = (p + 1 - p)^n$.
The mean $np$ follows from linearity alone; the variance $np(1-p)$ uses
independence, because only for uncorrelated summands do the variances add.

The model requires independent trials with the same success probability $p$.
If $p$ varies between trials or the trials influence one another, the count is
not binomial.

--

## How the Shape Depends on the Parameters

<div class="viz viz-lg" data-viz="math/distribution-explorer" data-steps="4"
 data-params='{"kind": "binomial", "p": 0.5, "n": 5, "sweep": {"param": "n", "values": [5, 10, 20, 40, 60]}}'></div>

**Predict before each click:** as $n$ grows, does the distribution get wider or
narrower — and what happens to its shape?

Notes:
With $p = 0.5$ the mean is $n/2$ and the standard deviation
$\sqrt{np(1-p)} = \sqrt{n}/2$. For the five values of $n$ shown: $n = 5$:
$\sigma \approx 1.12$; $n = 10$: $1.58$; $n = 20$: $2.24$; $n = 40$: $3.16$;
$n = 60$: $3.87$. Each step shows the next value of $n$.

Two effects occur together. In absolute terms the distribution gets wider,
growing like $\sqrt{n}$. Relative to $n$ it gets narrower: the proportion of
successes $k/n$ has standard deviation $\sqrt{p(1-p)/n}$, falling from
$0.22$ at $n = 5$ to $0.065$ at $n = 60$. The shape also becomes bell-like,
because a binomial is a sum of independent Bernoulli variables and the central
limit theorem applies. For $p = 0.5$ the PMF is symmetric for every $n$; for
other $p$ it is skewed at small $n$ and becomes symmetric only as $n$ grows.

--

## Mini-Exercise

A student guesses all **10** questions of a quiz, each with **4** options.


<div class="q">

How many correct answers should they expect — and is 5 or more likely?

</div>



<div class="fragment">

$B(10, 0.25)$: on average $10 \cdot 0.25 = 2.5$ correct. Five or more is
twice the expectation — unlikely (about 8%).

</div>


Notes:
Model: $X \sim B(10, 0.25)$, so $E[X] = 2.5$ and
$\mathrm{Var}(X) = 10 \cdot 0.25 \cdot 0.75 = 1.875$, $\sigma \approx 1.37$.
Five correct answers lie about $1.8\sigma$ above the mean. The exact tail is
$P(X \geq 5) = \sum\_{k=5}^{10} \binom{10}{k} 0.25^k 0.75^{10-k} \approx 0.078$,
a sum of six PMF values (or $1 - P(X \leq 4)$).

The binomial model assumes that the ten guesses are independent and each
succeeds with the same probability $0.25$. It fails for a real exam taker who
partly knows the material (the success probability then differs between
questions), who can rule out some options (raising $p$ above $0.25$), or when
questions build on each other (dependence).

--

## Takeaway


<div class="takeaway">

A yes/no attribute is a **Bernoulli** variable with one parameter $p$; counting
the yeses in $n$ independent trials gives a **binomial**. Both are counting in
probabilistic clothing — and $p$ is the number data will have to tell us.

</div>


--

## From Mass to Density


<div class="c-definition">

**Definition (PDF).** A continuous random variable $X$ has a **probability
density function** $f$ with
$$
P(b \leq X \leq c) = \int\_b^c f(a)\thinspace da,
\qquad \int\_{-\infty}^{\infty} f(a)\thinspace da = 1
$$

</div>



<div class="c-warning">

$f(a)$ is **not** a probability — it is probability *per unit interval*.
Consequently $f(a) > 1$ is perfectly possible, and $P(X = a) = 0$ for every
single value $a$.

</div>


Notes:
For small $h$, $P(a \leq X \leq a + h) \approx f(a) h$, so $f$ has the unit
"probability per unit of $X$". A density can therefore exceed 1: the uniform
distribution on $[0, 0.5]$ has $f = 2$ on that interval. The probability of a
single value is an integral over an interval of length zero, so
$P(X = a) = 0$; a person being exactly 180.000… cm tall has probability zero.
As a consequence, $\leq$ and $<$ give the same interval probabilities.
Probability zero does not mean impossible: some value is always observed.

The cumulative distribution function $F(a) = P(X \leq a) = \int\_{-\infty}^a f(t) dt$
links the two views; where $f$ is continuous, $f = F'$. Not every random
variable is either discrete or continuous — daily rainfall, for instance, has a
point mass at 0 and a density above it.

--

## Probability Is Area Under the Curve

<div class="viz viz-lg" data-viz="math/distribution-explorer" data-steps="1"
 data-params='{"kind": "normal", "mu": 0, "sigma": 1, "shade": [-1, 1]}'></div>

The shaded region is $P(-1 \leq X \leq 1)$ — the same "probability as area"
intuition from the axioms unit, now with a curve instead of a Venn diagram.

Notes:
In terms of the CDF, $P(b \leq X \leq c) = F(c) - F(b)$. For the standard
normal the shaded area is $P(-1 \leq X \leq 1) \approx 0.683$; within two
standard deviations it is $\approx 0.954$, within three $\approx 0.997$. The
normal CDF has no closed form and is computed numerically (via the error
function or tables).

The total area under any density is 1. This is what fixes the constant in the
normal density: $\int\_{-\infty}^{\infty} e^{-(x-\mu)^2/(2\sigma^2)} dx = \sigma\sqrt{2\pi}$
(the Gaussian integral), so the factor $1/(\sigma\sqrt{2\pi})$ is exactly the
normalisation.

--

## Expectation for Continuous Variables

| | discrete — mass $p$ | continuous — density $f$ |
|---|---|---|
| total | $\sum\_i p(a\_i) = 1$ | $\int\_{-\infty}^{\infty} f(a)\thinspace da = 1$ |
| expectation | $E[X] = \sum\_i a\_i p(a\_i)$ | $E[X] = \int\_{-\infty}^{\infty} a f(a)\thinspace da$ |
| function of $X$ | $E[g(X)] = \sum\_i g(a\_i) p(a\_i)$ | $E[g(X)] = \int\_{-\infty}^{\infty} g(a) f(a)\thinspace da$ |


<div class="c-insight">

Only the sum turns into an integral. The rules are unchanged:
$E[aX + b] = a E[X] + b$ and $\mathrm{Var}(X) = E[(X - \mu)^2]$.

</div>


Notes:
Only the summation becomes an integral; linearity of expectation, the variance
identity $\mathrm{Var}(X) = E[X^2] - (E[X])^2$, and
$\mathrm{Var}(aX + b) = a^2 \mathrm{Var}(X)$ carry over with the same proofs.
In practice the integral runs over the support of $f$, the region where
$f > 0$.

Existence is again a condition: the expectation is defined only if
$\int |a| f(a)\thinspace da < \infty$. The Cauchy distribution,
$f(x) = 1/(\pi(1 + x^2))$, is a standard example of a density without a mean
(and without a variance), even though it is symmetric about 0.

--

## Two Basic Continuous Distributions


<div class="grid-2">


<div class="column">


<div class="card">

### Uniform on $[a,b]$

$$f(x) = \frac{1}{b-a} \text{ for } x \in [a,b]$$

<div class="viz viz-sm" data-viz="math/distribution-explorer"
 data-params='{"kind": "uniform", "a": 0, "b": 1}'></div>

Equal-length intervals are equally likely — the Laplace assumption, continuous.

</div>


</div>


<div class="column">


<div class="card">

### Normal $N(\mu, \sigma^2)$

$$f(x) = \frac{1}{\sigma\sqrt{2\pi}} e^{-\frac{(x-\mu)^2}{2\sigma^2}}$$

<div class="viz viz-sm" data-viz="math/distribution-explorer"
 data-params='{"kind": "normal", "mu": 0, "sigma": 1}'></div>

$E[X] = \mu$, $\mathrm{Var}(X) = \sigma^2$; $N(0,1)$ is the **standard** normal.

</div>


</div>


</div>


Notes:
The figures show $[a, b] = [0, 1]$ and $N(0, 1)$. The uniform density is $1/(b - a)$ on $[a, b]$ and 0 outside, with
$E[X] = (a + b)/2$ and $\mathrm{Var}(X) = (b - a)^2/12$. It is the continuous
counterpart of the Laplace assumption: equal-length subintervals receive equal
probability.

The normal density is symmetric about $\mu$, has its maximum
$1/(\sigma\sqrt{2\pi})$ at $\mu$ and its inflection points at $\mu \pm \sigma$.
Linear transformations preserve normality: if $X \sim N(\mu, \sigma^2)$ then
$aX + b \sim N(a\mu + b, a^2\sigma^2)$. In particular the standardisation
$Z = (X - \mu)/\sigma$ is $N(0, 1)$, which is why a single table of the
standard normal suffices. The notation $N(\mu, \sigma^2)$ uses the variance,
not the standard deviation, as second parameter.

--

## What σ Does to the Shape

<div class="viz viz-lg" data-viz="math/distribution-explorer" data-steps="3"
 data-params='{"kind": "normal", "mu": 0, "sigma": 0.6, "sweep": {"param": "sigma", "values": [0.6, 1, 1.6, 2.4]}}'></div>

The peak falls as the curve widens — the area is always 1.

Notes:
The peak height of $N(\mu, \sigma^2)$ is $1/(\sigma\sqrt{2\pi})$, inversely
proportional to $\sigma$. For the four values shown: $\sigma = 0.6$ gives
$\approx 0.665$, $\sigma = 1$ gives $\approx 0.399$, $\sigma = 1.6$ gives
$\approx 0.249$, $\sigma = 2.4$ gives $\approx 0.166$. Widening by a factor $k$
lowers the peak by the same factor, so the area stays 1.

Independently of $\sigma$, about 68% of the mass lies within $\mu \pm \sigma$:
changing $\sigma$ only rescales the horizontal axis. For $\sigma < 1/\sqrt{2\pi} \approx 0.40$
the peak exceeds 1, another instance of a density larger than 1.

--

## Why the Normal Is Everywhere


<div class="c-insight">

The **central limit theorem**: under mild conditions, the average of $n$
independent observations is approximately normal for large $n$ — whatever the
original distribution was.

</div>


This is why the normal is the default when the true distribution is unknown —
and why a sum of many independent coin flips, the binomial, looks bell-shaped.

Notes:
Precise statement: for independent, identically distributed $X\_1, \dots, X\_n$
with mean $\mu$ and finite variance $\sigma^2$, the standardised mean
$\sqrt{n}(\bar{X}\_n - \mu)/\sigma$ converges in distribution to $N(0, 1)$. The
"mild conditions" are independence and finite variance; versions exist that
relax identical distribution. Without finite variance the theorem fails: the
mean of independent Cauchy variables is again Cauchy, however large $n$.

The mean $\bar{X}\_n$ has variance $\sigma^2/n$, so its standard deviation, the
**standard error**, is $\sigma/\sqrt{n}$. This is the basis of error bars and
confidence intervals computed from a sample.

A binomial $\mathrm{Bin}(n, p)$ is a sum of $n$ independent Bernoulli variables
and is therefore approximately $N(np, np(1 - p))$ for large $n$. The
approximation is poor when $p$ is close to 0 or 1; rules of thumb require both
$np$ and $n(1 - p)$ to be reasonably large (commonly at least 5 or 10).

--

## Other Distributions You Will Meet

| distribution | values | typically models |
|---|---|---|
| **Exponential** | $[0, \infty)$ | time until an event occurs (e.g. the next earthquake) |
| **Gamma** | $[0, \infty)$ | time until $n$ events have occurred |
| **Beta** | $[0, 1]$ | an unknown probability |
| **Dirichlet** | probability vectors | distributions *over* probabilities |


<div class="takeaway">

Continuous distributions replace mass with **density** and sums with
**integrals**. Probability remains area, expectation remains a weighted average,
and the normal is the default shape because of the central limit theorem.

</div>


Notes:
The exponential distribution with rate $\lambda$ has density
$f(x) = \lambda e^{-\lambda x}$ for $x \geq 0$ and mean $1/\lambda$. It is
memoryless, $P(X > s + t \mid X > s) = P(X > t)$, which encodes a constant
event rate. The gamma distribution with integer shape $n$ and rate $\lambda$ is
the distribution of a sum of $n$ independent exponential waiting times, with
mean $n/\lambda$.

The Beta$(\alpha, \beta)$ distribution lives on $[0, 1]$ with mean
$\alpha/(\alpha + \beta)$; $\mathrm{Beta}(1, 1)$ is the uniform distribution.
It is the standard prior for an unknown probability, because a Beta prior
combined with Bernoulli or binomial data yields a Beta posterior. The Dirichlet
distribution generalises the Beta to vectors of probabilities that sum to 1 and
plays the same role for categorical data. None of these four is needed for the
rest of this unit.

--

## More Than One Random Variable

<div class="viz viz-full" data-viz="math/joint-distribution"
 data-params='{"view": "dimensions"}'></div>

A **joint distribution** describes the outcomes of several random variables *at
the same time* — which is what every dataset with more than one column is.

Notes:
The figure shows one variable as a density curve, two as a point cloud with
the contour lines of their joint density, and three as a scatter matrix: every
pair of columns as a cloud, every single column as a histogram on the diagonal.
A scatter matrix shows only the two-dimensional projections; the joint of three
or more variables can no longer be drawn directly.

A table with columns age, income and churn is a sample from a trivariate joint
distribution: each row is one realisation of the vector
$(X\_{\text{age}}, X\_{\text{income}}, X\_{\text{churn}})$, and the joint
distribution assigns probability to combinations of values.

The joint determines every marginal and every conditional distribution. The
converse fails: the marginals alone do not determine the joint, except under
independence, where the joint is the product of the marginals. The size of a
joint grows exponentially: $d$ binary variables need $2^d - 1$ free
probabilities ($d = 30$ already gives more than $10^9$). Any practical model
therefore imposes structure, such as independence or conditional independence
assumptions, to reduce this number.

--

## Joint Mass and Density

| joint PMF (discrete) | joint PDF (continuous) |
|---|---|
| $p\_{X,Y}(a,b) = P(X = a, Y = b)$ | $P((X,Y) \in R) = \iint\_R f\_{X,Y}(a,b)\thinspace da\thinspace db$ |

<div class="viz viz-lg" data-viz="math/joint-distribution"
 data-params='{"view": "mass-density"}'></div>


<div class="c-note">

**From here on** we write $p(a, b, c, \ldots)$ for the joint of
$X\_1, X\_2, X\_3, \ldots$ — a mass or a density, as the variables require.

</div>


Notes:
Left: the joint PMF of the number of boys and girls in a family (the example
that follows), one probability per cell. Right: a joint density drawn as
contour lines; the probability of the region $R$ is the volume under the
density surface above $R$, here computed numerically.

Both joint forms are normalised: $\sum\_a \sum\_b p\_{X,Y}(a, b) = 1$ and
$\iint f\_{X,Y}(a, b)\thinspace da\thinspace db = 1$. A joint may also mix the two kinds, e.g. a
class label and a measurement; then one sums over the discrete and integrates
over the continuous variable.

The convention $p(a, b, c, \ldots)$ is safe because marginalisation,
conditioning and factorisation follow the same rules in both cases; only
summing versus integrating differs. Two caveats apply. For continuous variables
$p$ is a density, so its values are not probabilities and can exceed 1; reading
$p(a, b, c)$ as "the probability of state $a, b, c$" is then shorthand for a
density value. And $p$ is overloaded: $p(a)$ and $p(b)$ denote different
functions, distinguished only by which variable the argument refers to.

--

## Marginalisation


<div class="grid-2">


<div class="column">


<div class="c-definition">

**Marginalisation** eliminates a random variable by summing over all its
states. For $p(x\_1, \ldots, x\_n)$, a **marginal** over a subset is
$$
p(x\_1) = \sum\_{x\_2} \cdots \sum\_{x\_n} p(x\_1, x\_2, \ldots, x\_n)
$$

</div>



<div class="c-intuition">

Forget about a variable, but keep its influence correctly accounted for:
collapse the joint onto the axis of the variable you keep.

</div>


</div>


<div class="column">

<div class="viz viz-lg" data-viz="math/joint-distribution" data-steps="2"
 data-params='{"view": "marginal-density"}'></div>

</div>


</div>


Notes:
The steps project the joint density from before onto its axes: (1) summing
(integrating) every vertical strip gives one point of $p(x)$, (2) summing every
horizontal strip gives $p(y)$. The marginals are computed from the joint, not
assumed; the two bumps of the joint reappear in the marginals, as two peaks in
$p(x)$ and as a peak with a shoulder in $p(y)$.

Marginalisation is the law of total probability applied to random variables:
the events $\\{X\_2 = x\_2\\}$ for all states $x\_2$ partition the sample space, so
$p(x\_1) = \sum\_{x\_2} p(x\_1, x\_2) = \sum\_{x\_2} p(x\_1 \mid x\_2) p(x\_2)$. The
second form shows how the eliminated variable keeps its influence: each
conditional is weighted by how probable that state is. For continuous
variables the sum becomes an integral.

In general, the marginal of any subset of variables is obtained by summing over
all the remaining ones. Done naively, marginalising $n - 1$ variables with $k$
states each takes $k^{n-1}$ terms; factorised models allow the sums to be
rearranged and computed far more cheaply.

--

## Example: Boys and Girls


<div class="grid-figure">


<div class="column">

<div class="viz viz-lg" data-viz="math/joint-distribution" data-steps="2"
 data-params='{"view": "marginal-table"}'></div>

</div>


<div class="column">

Families: 15% have no children, 20% one, 35% two, 30% three. Each child is
a boy or a girl with probability $\tfrac{1}{2}$, independently.

$B$ boys, $G$ girls.


<div class="c-insight">

The margins of the table *are* the marginals — hence the name.

</div>


</div>


</div>


Notes:
The steps sum each row into $p(B)$ on the right and each column into $p(G)$
below; both sum to 1.

Each cell follows from family size times a binomial probability. One child
(20%): one boy or one girl, 10% each. Two children (35%): BB and GG with
probability $\tfrac{1}{4}$ each ($.0875$), one of each with $\tfrac{1}{2}$
($.175$). Three children (30%): 3 boys or 3 girls with $\tfrac{1}{8}$ each
($.0375$), 2+1 in either direction with $\tfrac{3}{8}$ each ($.1125$). The cell
$(B = 1, G = 2) = .1125$ reads: 11.25% of families have one boy and two girls.
Rows and columns sum to the marginals, which are identical for $B$ and $G$ by
symmetry.

$B$ and $G$ are dependent, because family size couples them:
$p(B = 3, G = 3) = 0$, whereas $p(B = 3) p(G = 3) = .0375^2 \approx .0014$.
The covariance is negative: $E[B] = E[G] = 0.9$,
$E[BG] = .175 + 2 \cdot .1125 + 2 \cdot .1125 = .625$, so

## Covariance


<div class="c-definition">

$$
\mathrm{cov}(A, B) = E\big[(A - E[A])(B - E[B])\big]
$$

</div>



<div class="grid-3">


<div class="column">


<div class="card">

$\mathrm{cov} > 0$

$A$ large when $B$ large — positively related

</div>


</div>


<div class="column">


<div class="card">

$\mathrm{cov} < 0$

$A$ large when $B$ small — negatively related

</div>


</div>


<div class="column">


<div class="card">

$\mathrm{cov}(A,A) = \mathrm{Var}(A)$

variance is self-covariance

</div>


</div>



</div>


<div class="c-warning">

Independence implies zero covariance. **The converse is false** — covariance
only detects *linear* association.

</div>


Notes:
Expanding the definition gives the computational form
$\mathrm{cov}(A, B) = E[AB] - E[A]E[B]$. For independent variables
$E[AB] = E[A]E[B]$, hence zero covariance. The converse fails: $X$ uniform on
$[-1, 1]$ and $Y = X^2$ have $E[XY] = E[X^3] = 0$ and $E[X] = 0$, so
$\mathrm{cov}(X, Y) = 0$, although $Y$ is a function of $X$. Methods that rely
on covariance or correlation alone can therefore miss real dependence. An
important exception: for jointly normal variables, zero covariance does imply
independence.

Covariance measures linear association. Its size depends on the units; the
correlation $\rho = \mathrm{cov}(A, B)/(\sigma\_A \sigma\_B)$ removes them and
lies in $[-1, 1]$, with $|\rho| = 1$ exactly when $B$ is a linear function of
$A$. Covariance also governs the variance of a sum:
$\mathrm{Var}(A + B) = \mathrm{Var}(A) + \mathrm{Var}(B) + 2\\,\mathrm{cov}(A, B)$.

--

## Covariance Sees Only One Kind of Structure

<div class="viz viz-lg" data-viz="math/covariance-cloud" data-steps="4"
 data-params='{"rho": 0.7}'></div>

**Predict first:** with $Y = X^2 - 1$, every point is fixed by its $x$. The
covariance?

Notes:
The steps show (1) a cloud of points with correlation $\rho = 0.7$, (2) the two
means as crosshairs, from which deviations are measured, and (3) the four
quadrants: the product $(x - \bar{x})(y - \bar{y})$ is positive in the
upper-right and lower-left quadrants and negative in the other two. The
covariance is the average of these products, so it is large and positive when
most points fall in the positive quadrants. The final step allows changing
$\rho$ and switching to the relation $Y = X^2 - 1$.

For $Y = X^2 - 1$ with $X$ symmetric about 0, each point at $x$ has a mirror
point at $-x$ with the same $y$ and an opposite-signed product, so the products
cancel: $\mathrm{cov}(X, Y) = E[X^3] - E[X]E[X^2] = 0$. The sample value is
close to, not exactly, zero. The dependence is complete — $Y$ is fixed by $X$ —
yet the covariance is about 0. This is why "uncorrelated" and "independent" are
different properties.

--

## Takeaway


<div class="takeaway">

The joint distribution holds everything; **marginalisation** sums a variable
away, **conditioning** restricts, and **covariance** summarises linear
co-variation. Zero covariance is weaker than independence.

</div>

# Module 6
## Describing Data

> **Guiding Question:** The distribution is unknown and all we have is a
> sample. What can we honestly say about it?

--

## We Never Know the Distribution

Up to now we assumed a distribution was given. In practice it is **unknown**,
and we must estimate its properties from data.

| | what it is | its numbers | do we see them? |
|---|---|---|---|
| **Population** | the entire group — all customers, all transactions, all documents | **parameters** $\mu$, $\sigma^2$ | no — the truth we want |
| **Sample** | the observations we actually have | **statistics** $\overline{x}$, $s^2$ | yes — and we estimate the parameters from them |

**Descriptive statistics** summarise a sample, usually while assuming something
about the underlying distribution.

Notes:
Descriptive statistics summarise the observed data; inferential statistics
draw conclusions about the population from them, with quantified uncertainty.
The two vocabularies match: a **parameter** ($\mu$, $\sigma^2$) is a fixed but
unknown property of the population; a **statistic** ($\overline{x}$, $s^2$) is
a function of the sample. Because the sample is random, a statistic is itself
a random variable, with a distribution of its own across possible samples.

The population can be a finite set (all customers of a shop) or a conceptual
one (all future transactions, the process that generates documents). In the
latter case the population parameters are properties of the generating
distribution, e.g. $\mu = E[X]$.

--

## What We Summarise

<div class="viz viz-xl" data-viz="math/summary-aspects"></div>

Univariate statistics describe one random variable; **multivariate** statistics
describe $X\_1, \ldots, X\_d$ together.

Notes:
Each panel changes one aspect of a distribution against the dashed grey
reference: the centre shifts, the spread widens, the shape becomes lopsided
with a long right tail. The $k$-th moment of $X$ is $E[X^k]$; the $k$-th central moment is
$E[(X - \mu)^k]$. The mean is the first moment, the variance the second
central moment. Skewness is the standardised third central moment,
$E[(X - \mu)^3]/\sigma^3$: positive for a long right tail (incomes), negative
for a long left tail, zero for symmetric distributions. The standardised
fourth moment (kurtosis) describes the weight of the tails.

Moment-based summaries are not robust: a single extreme value can move them
arbitrarily far. Quantile-based summaries are: the median for location, the
interquartile range $Q\_3 - Q\_1$ (spread of the middle 50%) for dispersion.
The multivariate counterparts of mean and variance are the mean vector and the
covariance matrix.

--

## Means

| mean | formula | use it for | example |
|---|---|---|---|
| **sample** | $\displaystyle \overline{x} = \frac{1}{n}\sum\_{i=1}^{n} x\_i$ | values that add up | average salary |
| **weighted** | $\displaystyle \overline{x}\_w = \frac{\sum\_i w\_i x\_i}{\sum\_i w\_i}$ | values that count unequally | grade over courses of different credits |
| **geometric** | $\displaystyle \Big(\prod\_{i=1}^{n} x\_i\Big)^{1/n}$ | factors that multiply | +50% then −50%: factor 0.87 per period |
| **harmonic** | $\displaystyle \frac{n}{\sum\_i 1/x\_i}$ | rates over equal amounts | 60 km/h out, 40 back: 48 km/h |
| **trimmed** | average after dropping the $k$ smallest and $k$ largest | robustness on the cheap | judges' scores |

Notes:
The sample mean estimates $E[X]$; it is also the value $c$ that minimises the
sum of squared deviations $\sum\_i (x\_i - c)^2$. Which mean is appropriate
depends on how the quantities combine.

Speeds over equal distances average harmonically: 60 km/h out and 40 km/h back
give $2/(1/60 + 1/40) = 48$ km/h, not 50, because more time is spent at the
lower speed. Growth factors average geometrically: +50% followed by −50% gives
the factor $1.5 \cdot 0.5 = 0.75$, so the average factor is
$\sqrt{0.75} \approx 0.866$ (−13.4% per period), while the arithmetic mean of
the rates, 0%, is wrong. For positive values,
harmonic $\leq$ geometric $\leq$ arithmetic mean, with equality only when all
values are equal; the geometric and harmonic means require positive values.
A trimmed mean with $k$ values dropped at each end tolerates up to $k$
outliers per side; judged sports use it when the highest and lowest score are
discarded. A grade average weighted by course credits is a weighted mean with
the credits as weights.

--

## Median


<div class="c-definition">

The **median** is the middle value of the sorted sample: for odd $n$ the
$\frac{n+1}{2}$-th value, for even $n$ the average of the two middle values.

</div>



<div class="c-intuition">

Half of the values lie below it, half above. Only their **order** counts, not
how far out they lie.

</div>



<div class="marks-yes">

- **Robust** against outliers — one extreme value moves the median by at most
  one position

</div>



<div class="marks-no">

- **Costlier** to compute — it needs sorting or a selection algorithm, not one
  pass with a running sum

</div>



<div class="sidenote">

For binned data, the median is interpolated within its interval from the
cumulative counts, the interval's lower border and width.

</div>


Notes:
The median minimises the sum of absolute deviations $\sum\_i |x\_i - c|$, as the
mean minimises the sum of squares. Its robustness can be quantified by the
breakdown point, the fraction of values that can be made arbitrarily large
before the statistic follows: 50% for the median, 0% for the mean.

Full sorting ($O(n \log n)$) is sufficient but not necessary: selection
algorithms such as quickselect find the median in expected $O(n)$ time. What
the median lacks is the one-pass, constant-memory computation of the mean;
streaming systems therefore use approximate quantiles. For binned data the
median is interpolated as $L + \frac{n/2 - F}{f} \cdot w$, where $L$ is the
lower border of the interval containing the median, $F$ the cumulative count
below it, $f$ the count in it, and $w$ its width; this assumes the values are
spread evenly within the interval.

--

## One Value, Two Very Different Reactions

<div class="viz viz-lg" data-viz="math/robust-center" data-steps="3"></div>

**Commit first:** drag the top salary to the far right. Which marker follows?

Notes:
The steps show (1) the mean as the point where the beam balances, (2) the
median as a position in the sorted order, and (3) the top salary made
draggable. Moving one of $n$ values by $\Delta$ moves the mean by $\Delta/n$,
so the mean follows the dragged value at a seventh of its speed. The median
does not move at all while the dragged value stays above the middle value: it
remains 44 k€.

With the top salary far to the right, the mean lies above six of the seven
salaries, a "typical" value almost nobody earns. Which summary is quoted is
therefore not neutral: an employer advertising pay has an incentive to quote
the mean, an employee representative the median.

## Dispersion


<div class="grid-3-2">


<div class="column">


<div class="c-definition">

**Sample variance** and **standard deviation** of the observed data:
$$s^2 = \frac{1}{n}\sum\_{i=1}^{n}(x\_i - \overline{x})^2, \qquad s = \sqrt{s^2}$$

</div>


</div>


<div class="column">


<div class="c-intuition">

The average squared distance from the centre: how stretched or squeezed the
data is. $s$ brings it back to the unit of the data.

</div>


</div>


</div>



<div class="c-tip">

Computable in **one pass**, $O(n)$, from the running totals $n$, $\sum x\_i$
and $\sum x\_i^2$ — which matters when the data does not fit in memory.

</div>


Notes:
Expanding the square gives
$s^2 = \frac{1}{n}\sum\_i x\_i^2 - \overline{x}^2$, so the counts $n$,
$\sum x\_i$ and $\sum x\_i^2$ suffice. These three totals can be accumulated in
one pass and merged across partitions by simple addition, which is why
streaming and distributed systems can compute variances without holding the
data.

The formula is numerically unstable in floating point when the mean is large
relative to the spread: two large, almost equal numbers are subtracted and the
significant digits cancel (values around $10^9$ with standard deviation 1 lose
essentially all precision in double arithmetic). Welford's algorithm is the
standard numerically stable one-pass alternative; it updates the running mean
and the running sum of squared deviations with each new value.

--

## Why the Denominator Changes


<div class="c-definition">

The **population variance** $\sigma^2$ is the variance over the whole
population. With the true mean $\mu$ unknown, it is estimated by
$$
\hat{\sigma}^2 = \frac{1}{n-1}\sum\_{i=1}^{n}(x\_i - \overline{x})^2
$$

</div>



<div class="c-intuition">

$\overline{x}$ is computed from the same data, so it sits closer to the data
than $\mu$ does: the deviations come out **systematically too small**. Dividing
by $n-1$ instead of $n$ compensates — one degree of freedom was spent on the
mean.

</div>



<div class="sidenote">

Naming is not uniform: many textbooks, and pandas, call the $n-1$ version $s^2$;
NumPy's `var` divides by $n$ unless told otherwise.

</div>


Notes:
Derivation of the correction for i.i.d. data with mean $\mu$ and variance
$\sigma^2$. Algebraically,
$\sum\_i (x\_i - \overline{x})^2 = \sum\_i (x\_i - \mu)^2 - n(\overline{x} - \mu)^2$.
Taking expectations, $E[\sum\_i (x\_i - \mu)^2] = n\sigma^2$ and
$E[(\overline{x} - \mu)^2] = \mathrm{Var}(\overline{x}) = \sigma^2/n$, so
$E[\sum\_i (x\_i - \overline{x})^2] = (n - 1)\sigma^2$. Dividing by $n - 1$
makes the estimator unbiased. The deviations are too small on average because
$\overline{x}$ is, by construction, the value closest to the data in squared
distance.

With $n = 1$ the sample variance is 0 (the point equals its own mean) and the
corrected formula is $0/0$, undefined: one observation carries no information
about spread. If $\mu$ is known, $\frac{1}{n}\sum\_i (x\_i - \mu)^2$ is already
unbiased. Unbiasedness does not carry over to the square root:
$\hat{\sigma}$ underestimates $\sigma$ slightly on average. For large $n$ the
two denominators differ negligibly. In pandas, `var` uses `ddof=1` by default;
in NumPy, `ddof=0`.

--

## Takeaway


<div class="takeaway">

$s^2$ describes **the sample**; $\hat{\sigma}^2$ estimates **the population**.
The $n-1$ is not a convention — it is the price of having estimated the mean
from the same data.

</div>


--

## Quantiles


<div class="c-definition">

The $k$-th $q$-**quantile** is the value $x$ such that $k/q$ of the values are
smaller and $(q-k)/q$ are larger ($0 < k < q$).

</div>



<div class="grid-3">


<div class="column">

### Percentiles
$q = 100$

"the 12th percentile"

</div>


<div class="column">

### Quartiles
$q = 4$

$Q\_1$ = 25th, $Q\_2$ = 50th (= median), $Q\_3$ = 75th percentile

</div>


<div class="column">

### IQR
$$\mathrm{IQR} = Q\_3 - Q\_1$$

the middle half of the data

</div>


</div>


Quantiles summarise **shape and skewness** without assuming a distribution.

Notes:
Quantiles are the distribution-free alternative to moments: no assumption of
symmetry, no sensitivity to tails. The boxplot is their standard graphical form
— minimum, Q1, median, Q3, maximum, with outliers marked separately.

## You Computed a Number. Which Number Did You Want?

Seven salaries gave a sample mean of $\overline{x} = 73.9$ k€.


<div class="q">

What is the probability that the population mean $\mu$ is exactly 73.9 k€?

</div>



<div class="fragment">

Zero. $\overline{x}$ is not $\mu$ — it is one **estimate** of it, computed from
the seven people who happened to be in the sample.

The honest question is not *what is $\mu$* but **how far from $\mu$ can this
number be?**

</div>


Notes:
The question has no useful answer. If uncertainty about $\mu$ is described by
any continuous distribution, the probability of one exact value is zero; in the
frequentist view $\mu$ is a fixed number and carries no probability at all
(it is either 73.9 or not). In both readings, $\overline{x} = \mu$ exactly is
not to be expected: a different sample of seven people would give a different
mean.

The well-posed question concerns the size of the error $\overline{x} - \mu$.
Its answer needs the distribution of $\overline{x}$ across samples, which is
the subject of this unit. With seven values, one of them an outlier, the
error can be large.

--

## Estimator and Estimate


<div class="grid-3-2">


<div class="column">


<div class="c-definition">

**Definition.** An **estimator** is a function of the sample,
$\hat{\theta} = g(X\_1, \ldots, X\_n)$, used to approximate an unknown quantity
$\theta$ of the population. The number it takes on for one particular sample is
an **estimate**.

</div>


</div>


<div class="column">


<div class="c-intuition">

The estimator is the **recipe**, $\overline{X} = \frac{1}{n}\sum\_i X\_i$; the
estimate is what one batch of data cooks from it, $\overline{x} = 73.9$.

</div>


</div>


</div>


The sample is random, so the estimator is a **function of random variables**:
$\hat{\theta}$ is itself a random variable, with a distribution of its own.


<div class="sidenote">

$\overline{x}$, $s^2$ and $\hat{\sigma}^2$ from descriptive statistics are all
estimators — used so far without saying what kind of object they are.

</div>


Notes:
The distinction is the one between a rule and its output. The estimator
$\overline{X} = \frac{1}{n}\sum\_i X\_i$ is written with capital letters because
it is a function of the random variables $X\_1, \ldots, X\_n$; the estimate
$\overline{x}$ is the number obtained by plugging in the observed values. A
statistic inherits randomness from the sample, so properties such as bias and
spread belong to the estimator, not to a single estimate.

Several estimators may target the same $\theta$: the sample mean, the median
and a trimmed mean all estimate the centre of a symmetric population. They
differ in their sampling distributions, and comparing those distributions is
how one estimator is judged better than another.

--

## An Estimator Has a Distribution

<div class="viz viz-lg" data-viz="math/sampling-distribution" data-steps="4"
 data-params='{"shape": "uniform", "n": 5}'></div>

**Predict first:** after a thousand samples, what shape will the lower picture
have — and how wide?

Notes:
The steps show (1) one sample of $n = 5$ draws from the population in the
upper panel, (2) its mean recorded as a single point in the lower panel,
(3) the means of fifty samples, and (4) the means of a thousand samples with a
normal curve and the standard error overlaid. Both panels share the
horizontal axis, so their widths can be compared directly. Afterwards the
population shape and $n$ can be changed.

The populations live on the values 1 to 6. The uniform one is a fair die, with
$\mu = 3.5$ and $\sigma = \sqrt{35/12} \approx 1.71$. For $n = 5$ the means
have standard deviation $1.71/\sqrt{5} \approx 0.76$, less than half the
population's. A frequent wrong prediction is that the means are spread as
widely as the observations.

--

## Three Things the Picture Shows


<div class="marks-step">

- The means pile up **around $\mu$** — the estimator is not systematically off
- The pile is **narrower than the population** — averaging cancels noise
- The pile is **bell-shaped**, even though the population was not

</div>



<div class="c-definition">

**Definition (Sampling distribution).** The distribution of an estimator
$\hat{\theta}$ over all possible samples of size $n$.
$\hat{\theta}$ is **unbiased** if $E[\hat{\theta}] = \theta$.

</div>


Notes:
The three observations are unbiasedness ($E[\overline{X}] = \mu$, by
linearity), the standard error ($\mathrm{Var}(\overline{X}) = \sigma^2/n$, by
independence) and the central limit theorem (approximately normal shape). The
first two hold exactly for every $n$; the third is an approximation that
improves with $n$.

For the sample median the picture differs. In a symmetric population the
median is centred on $\mu$; in a skewed population it targets the population
median, which differs from $\mu$, and is in general not exactly unbiased even
for that. Its spread also shrinks like $1/\sqrt{n}$, and for large $n$ it is
approximately normal, but this follows from a separate asymptotic result, not
from the CLT for sums.

--

## Use the Widget: Change the Population

Set the population to **skewed** and then to **bimodal**, keeping $n = 5$.


<div class="q">

Which of the three observations survive a population that is not symmetric?

</div>



<div class="fragment">

All three. The shape of the sampling distribution stops depending on the shape
of the population as soon as $n$ is more than a handful — which is why one
formula can cover cases we never inspect.

</div>


Notes:
Unbiasedness and the standard error $\sigma/\sqrt{n}$ do not depend on the
population's shape at all; they need only independence and a finite variance.
The bell shape is the approximate part. The bimodal population is the clearest
case: two separate humps, yet the means of five draws already form a single
hump.

How fast the bell shape appears depends on the population. For a symmetric
population, a handful of draws suffices; for a strongly skewed one, the
sampling distribution of the mean stays visibly skewed at small $n$, its
skewness falling like $1/\sqrt{n}$. At $n = 1$ the sampling distribution is the
population itself, and at $n = 2$ the population shape is still clearly
visible. The CLT is a limit statement; "large enough $n$" depends on the
population.

--

## Standard Error


<div class="grid-3-2">


<div class="column">


<div class="c-definition">

**Definition (Standard error).** The standard deviation of an estimator's
sampling distribution. For the sample mean of independent draws:
$$
\mathrm{SE}(\overline{X}) = \frac{\sigma}{\sqrt{n}}
$$

</div>


</div>


<div class="column">


<div class="c-intuition">

How far off a typical **estimate** is — where $\sigma$ says how far apart
typical **observations** are. Both in the unit of the data.

</div>


</div>


</div>



<div class="c-warning">

$\sigma$ and $\mathrm{SE}$ are different quantities. More data does nothing to
$\sigma$ — the world stays as variable as it was — and shrinks $\mathrm{SE}$.

</div>


Notes:
$\sigma/\sqrt{n}$ follows from independence:
$\mathrm{Var}(\overline{X}) = \frac{1}{n^2}\sum\_i \mathrm{Var}(X\_i) = \sigma^2/n$.
For dependent observations (e.g. a time series with positive correlation) the
true standard error is larger, and the formula is overconfident. When sampling
without replacement from a finite population of size $N$, the standard error is
multiplied by $\sqrt{(N - n)/(N - 1)}$, which is negligible for $n \ll N$ and
gives 0 when the whole population is sampled.

In practice $\sigma$ is unknown and replaced by the sample estimate
$\hat{\sigma}$, giving $\hat{\sigma}/\sqrt{n}$. A weather forecast's "±3 °C"
generally mixes both kinds of uncertainty: the inherent variability of the
weather and the forecaster's limited knowledge.

--

## Precision Costs Data

Multiply the data by $k$, and the standard error is multiplied by $1/\sqrt{k}$:


<div class="flow-row">


<div class="stat-card">

### 0.71
2 × the data

</div>


<div class="flow-arrow">

→

</div>


<div class="stat-card">

### ½
4 × the data

</div>


<div class="flow-arrow">

→

</div>


<div class="stat-card">

### ⅕
25 × the data

</div>


<div class="flow-arrow">

→

</div>


<div class="stat-card">

### ⅒
100 × the data

</div>


</div>


The $\sqrt{n}$ is why the last digit of an estimate is so expensive: halving the
error costs four times the data, and a tenfold improvement costs a hundredfold.

Notes:
The table entries are $1/\sqrt{k}$ for $k$ times the data:
$1/\sqrt{2} \approx 0.71$, $1/\sqrt{4} = \tfrac{1}{2}$,
$1/\sqrt{25} = \tfrac{1}{5}$, $1/\sqrt{100} = \tfrac{1}{10}$. Equivalently, the
sample size needed for a target standard error $e$ is $n = (\sigma/e)^2$.

Example: an A/B test comparing two conversion rates of about 5% that should
detect a difference of 0.1 percentage points (at 5% significance and 80%
power) needs roughly $2 \cdot 0.05 \cdot 0.95 \cdot (2.8/0.001)^2 \approx 750{,}000$
users per variant; the factor $2.8 \approx 1.96 + 0.84$ combines the two
normal quantiles. Since precision bought with data is expensive, reducing
$\sigma$ itself — through better measurement or a model that explains part of
the variation — is often the cheaper route.

--

## Two Theorems We Have Already Seen Happen


<div class="c-definition">

For i.i.d. observations with mean $\mu$ and finite variance $\sigma^2$:

| | | |
|---|---|---|
| **Law of large numbers** | $\overline{X}\_n \to \mu \text{ as } n \to \infty$ | <span class="intuition">the pile keeps narrowing onto the truth</span> |
| **Central limit theorem** | $\overline{X}\_n \approx N(\mu, \sigma^2/n) \text{ for large } n$ | <span class="intuition">and we know the *shape* of what is left</span> |

</div>



<div class="c-insight">

The first says the error goes away; the second says how much of it is left after
$n$ observations. Only the second lets us put a number on our ignorance.

</div>


Notes:
Law of large numbers: for i.i.d. observations with finite mean, $\overline{X}\_n$
converges to $\mu$. It states that the error vanishes but not how quickly. The
central limit theorem adds the rate and the shape: the error
$\overline{X}\_n - \mu$ is approximately $N(0, \sigma^2/n)$. Only the second
allows probability statements such as "within $\pm 2\\,\mathrm{SE}$ in about 95%
of samples".

A frequent error is to invoke the LLN where the CLT is needed, e.g. to justify
an error bar. Another is to read the LLN as a balancing law ("after many heads,
tails is due"): the mean converges because the influence of early deviations is
diluted by later observations, not because they are compensated.

--

## From a Number to an Interval

If $\overline{X} \approx N(\mu, \sigma^2/n)$, then for 95% of samples
$\overline{X}$ lands within $1.96\thinsp\mathrm{SE}$ of $\mu$ — and therefore $\mu$
lands within $1.96\thinsp\mathrm{SE}$ of $\overline{X}$.

<div class="viz eq-explain" data-viz="core/equation-explain" data-steps="3"
 data-params='{"labels": ["the estimate — our best single guess", "how confident we insist on being", "how noisy the estimate is"]}'>

$$
\eqa{\overline{x}} \pm \eqb{1.96} \cdot \eqc{\frac{\sigma}{\sqrt{n}}}
$$

</div>

Notes:
The interval follows from the normal approximation:
$P(|\overline{X} - \mu| \leq 1.96\\,\mathrm{SE}) \approx 0.95$, and the event
$|\overline{X} - \mu| \leq 1.96\\,\mathrm{SE}$ is the same as
$\mu \in [\overline{X} - 1.96\\,\mathrm{SE}, \overline{X} + 1.96\\,\mathrm{SE}]$.
The value 1.96 is the 97.5% quantile of $N(0, 1)$; 90% intervals use 1.645,
99% intervals 2.576.

The interval widens with a higher confidence level, with larger $\sigma$, and
with smaller $n$. The formula treats $\sigma$ as known. When $\sigma$ is
replaced by $\hat{\sigma}$, the quantile 1.96 is replaced by a quantile of the
$t$ distribution with $n - 1$ degrees of freedom, which is larger for small
samples (2.262 for $n = 10$) and approaches 1.96 as $n$ grows.

--

## What Does "95% Confident" Mean?

<div class="viz viz-lg" data-viz="math/confidence-intervals" data-steps="4"
 data-params='{"mu": 100, "sigma": 15, "n": 10, "level": 0.95}'></div>

Notes:
The steps show (1) one sample's interval against the fixed true mean, (2)
twenty intervals, (3) all sixty with the coverage count, misses drawn in red,
and (4) controls for the confidence level and $n$. With $\mu = 100$,
$\sigma = 15$ and $n = 10$, the standard error is $15/\sqrt{10} \approx 4.74$
and each 95% interval has half-width $\approx 9.3$; all intervals have the same
width because $\sigma$ is known, and only their centres move.

Of sixty 95% intervals, on average 3 miss $\mu$; the count is itself binomial,
$B(60, 0.05)$, so anything from 0 to about 6 is unremarkable. Changing the
level changes the width and the miss rate; changing $n$ changes the width but
not the miss rate. A missing interval cannot be recognised from the data: it
looks exactly like one that covers $\mu$.

--

## The Sentence Almost Everyone Gets Wrong


<div class="grid-2-3">


<div class="column">


<div class="card muted">

<span class="eyebrow">What it does not mean</span>

"There is a 95% probability that $\mu$ lies in **this** interval."

$\mu$ is a fixed number. It is either in this interval or it is not — there is
no probability left to have.

</div>


</div>


<div class="column">


<div class="c-important">

<span class="eyebrow">What it means</span>

"95% of the intervals produced **by this procedure** contain $\mu$."

The probability is a property of the recipe, evaluated before the data is seen.

</div>


</div>


</div>


Notes:
Before the data are seen, the interval's end points are random variables, and
$P(\mu \in [\overline{X} \pm 1.96\\,\mathrm{SE}]) = 0.95$ is a genuine
probability statement. After the data are plugged in, both end points and
$\mu$ are fixed numbers, and the statement is either true or false. The 95% is
therefore the coverage rate of the procedure under repeated sampling.

A Bayesian credible interval does support the first sentence: it is an
interval to which the posterior distribution of $\mu$, given the observed data,
assigns 95% probability. This requires a prior distribution for $\mu$. For the
mean of normal data with a flat prior, the 95% credible interval coincides
numerically with the 95% confidence interval, although the two statements mean
different things.

--

## Where This Leaves Us


<div class="grid-2-1">


<div class="column">

Two kinds of uncertainty meet in one formula. We can now measure one of them.


<div class="marks-step">

- $\sigma$ — how variable the world is. **Aleatoric.** Unchanged by data.
- $\mathrm{SE} = \sigma/\sqrt{n}$ — how badly we know our own estimate.
 **Epistemic.** Shrinks with data.

</div>


</div>


<div class="column">


<div class="c-insight">

"More data helps" was a slogan.

It is now a rate: $1/\sqrt{n}$.

</div>


</div>


</div>


Notes:
Aleatoric uncertainty is the variability inherent in the data-generating
process; it is described by $\sigma$ and does not shrink with more data.
Epistemic uncertainty is uncertainty due to limited knowledge; for the sample
mean it is the standard error, which shrinks like $1/\sqrt{n}$. A prediction of
a single new observation carries both: its variance is approximately
$\sigma^2 + \sigma^2/n$, so for large $n$ the epistemic part vanishes and the
aleatoric part remains.

The claim that a model is uncertain "because it has not seen enough data"
therefore refers to epistemic uncertainty, and the $1/\sqrt{n}$ rate gives its
order of magnitude.

--

## Mini-Exercise

A shop timed $n = 100$ customers at a counter: $\overline{x} = 180$ s, and past
records give $\sigma = 60$ s. What is the standard error — and how many
customers would halve it?


<div class="fragment">

$\mathrm{SE} = 60/\sqrt{100} = 6$ s, so the 95% interval is about
$180 \pm 12$ s. Halving the SE needs twice the $\sqrt{n}$ — **four times the
data**, $n = 400$. $\sigma = 60$ s does not change: customers stay as variable
as they were; only our knowledge of their average improves.

</div>


Notes:
$\mathrm{SE} = 60/\sqrt{100} = 6$ s. The 95% interval is
$180 \pm 1.96 \cdot 6 = 180 \pm 11.8$, i.e. about $[168, 192]$ s. Halving the
SE requires doubling $\sqrt{n}$, so $n = 400$. In general, a target standard
error $e$ requires $n = (\sigma/e)^2$; for $e = 3$ s this gives $n = 400$.

If $\sigma$ had to be estimated from the same 100 customers, the interval would
use $\hat{\sigma}$ and a $t$ quantile with 99 degrees of freedom ($\approx 1.98$),
practically the same as 1.96 at this sample size. The calculation also assumes
independent customers; customers served in the same queue at the same time can
be correlated, which would make the true standard error larger.

--

## Takeaway


<div class="takeaway">

A statistic is a **random variable**. Its distribution over repeated samples is
the sampling distribution; its spread is the **standard error**, $\sigma/\sqrt{n}$.
A confidence interval reports that spread — and its percentage describes the
**procedure**, not the one interval in front of you.

</div>


Notes:
The three points are: a statistic computed from a sample is a random variable;
its standard error shrinks like $1/\sqrt{n}$; and the confidence level of an
interval is a property of the procedure. They apply to every reported
measurement with an error bar, including an accuracy or error rate estimated
on a test set: an accuracy measured on 1,000 test cases at around 90% has a
standard error of $\sqrt{0.9 \cdot 0.1/1000} \approx 0.95$ percentage points.
A Bayesian treatment answers the same question with a posterior distribution
over the unknown quantity instead of a sampling distribution.

# Module 7
## Hypothesis Testing

> **Guiding Question:** Your new model scores higher than the baseline. How do
> you know the improvement is real?

--

## Motivation: Comparing Two ML Experiments


<div class="grid-2">


<div class="column">


<div class="card">

**Experiment A** — baseline model

accuracy measured over $n\_A$ runs

</div>


</div>


<div class="column">


<div class="card">

**Experiment B** — new architecture

accuracy measured over $n\_B$ runs

</div>


</div>


</div>


**B scored higher. Is the improvement systematic, or just randomness?**


<div class="c-note">

$H\_0$: the two means are equal — $\mu\_A = \mu\_B$
<br>
$H\_1$: they differ — $\mu\_A \neq \mu\_B$

</div>


Notes:
Guiding question of the module, in the students' own working context. Every one
of them has compared two model runs; almost none has asked whether the
difference survives resampling. Keep the example running through the unit.

--

## The Idea


<div class="c-insight">

Compare what we **observed** with what $H\_0$ **predicts**. If the disagreement
is large enough to be implausible under $H\_0$, reject $H\_0$.

</div>


We never prove $H\_1$. We only measure how badly $H\_0$ fails to explain the data.

Notes:
The asymmetry is the hardest idea in the unit. "Fail to reject" is not
"accept". Ask what a court verdict of "not guilty" claims, and what it does not.

--

## Test Statistic and p-Value


<div class="grid-2-1">


<div class="column">

A **test statistic** $T = T(X\_1, \ldots, X\_n)$ compresses the data so that its
distribution **under $H\_0$** is known.

The **p-value** is the probability, under $H\_0$, of observing a statistic at
least as extreme as the one we got.

Small p-value → the data is surprising under $H\_0$.

</div>


<div class="column">


<div class="c-warning">

The p-value is **not** the probability that $H\_0$ is true.

It is $P(|T| \ge |t\_{\text{obs}}| \mid H\_0)$ — a tail probability of the
statistic — not $P(H\_0 \mid \text{data})$.

</div>


</div>


</div>


Notes:
The warning box is the Bayes unit returning: swapping the two conditionals is
the same error as the disease test, now with a career's worth of published
consequences. Make that link explicit — students remember it.

--

## The Rejection Region

<div class="viz viz-lg" data-viz="math/distribution-explorer" data-steps="1"
 data-params='{"kind": "normal", "mu": 0, "sigma": 1, "shade": [1.96, 4]}'></div>

Under $H\_0$ the statistic follows a known distribution. The shaded tail carries
probability $\alpha/2$: if $T$ lands there, we reject.

Notes:
One click shades the tail. Emphasise: α is chosen *before* seeing the data, and
it is the rate of false alarms we are willing to tolerate — a decision, not a
discovery.

--

## Two Ways to Be Wrong


<div class="grid-2">


<div class="column">


<div class="card">

**Type I error** — false alarm

Reject $H\_0$ when it is true.

Probability $\alpha$ (we choose it).

</div>


</div>


<div class="column">


<div class="card">

**Type II error** — miss

Fail to reject $H\_0$ when $H\_1$ holds.

Probability $\beta$; **power** $= 1 - \beta$.

</div>


</div>


</div>


Lowering $\alpha$ raises $\beta$ for a fixed design. To improve both: more
data, less noise, or a **paired** design that cancels shared noise.

Notes:
The trade-off is the practical content of the slide. In an ML context: a strict
α means real improvements get dismissed; a lax α means noise gets published.
Power analysis answers "how many runs do I need", which is the question people
actually have. The paired design is the cheap one in ML: evaluate both models on
the same seeds and test splits, and the split-to-split noise cancels in the
differences.

--

## One Sample: $z$ or $t$?


<div class="grid-2">


<div class="card">

### Known variance — $z$-test
$$Z = \frac{\overline{X} - \mu\_0}{\sigma/\sqrt{n}}$$
Reject (two-sided) if $|Z| > z\_{1-\alpha/2}$.

</div>


<div class="card">

### Unknown variance — $t$-test
$$T = \frac{\overline{X} - \mu\_0}{s/\sqrt{n}}$$
$s$ estimated from the data → **heavier tails** ($t$ with $n-1$ d.f.).

</div>


</div>



<div class="c-note">

$\sigma/\sqrt{n}$ is the **standard error**: the standard deviation of the
sample mean $\overline{X}$. $s = \sqrt{s^2}$ is the sample standard deviation.
Both statistics measure the distance from $\mu\_0$ in standard errors.

</div>


Notes:
The only difference between the two is the denominator. Plugging in an estimate
$s$ for $\sigma$ adds uncertainty, which the $t$ distribution's heavier tails
pay for; with $n \ge 30$ the two are practically the same.

--

## Two Samples: Which $t$?

| Situation | Test | Statistic |
|---|---|---|
| independent runs, equal variances credible | pooled $t$ | $\frac{\overline{X}\_B - \overline{X}\_A}{s\_p \sqrt{1/n\_A + 1/n\_B}}$ |
| independent runs, variances may differ | **Welch's $t$** | $\frac{\overline{X}\_B - \overline{X}\_A}{\sqrt{s\_A^2/n\_A + s\_B^2/n\_B}}$ |
| both models on the **same** seeds or splits | **paired $t$** | $t$-test on the differences $d\_i = x\_{B,i} - x\_{A,i}$ |


<div class="c-tip">

Welch is the default for independent runs. When both models can be run on the
same splits, pair them: the shared noise cancels in $d\_i$.

</div>


Notes:
A table because the three tests differ along the same dimensions. Welch by
default because the equal-variance assumption is rarely justified across
architectures. The paired test is the one ML comparisons usually need and
rarely use: a cross-validation comparison evaluates both models on the same
folds, so the fold results are not independent samples.

--

## Testing Variances


<div class="grid-2">


<div class="column">

**Single variance** (normal model), $\chi^2$ statistic with $n-1$ degrees of
freedom.

*Is run-to-run variability within specification?*

</div>


<div class="column">

**Two variances**, $F = s\_A^2 / s\_B^2$.

If the variances differ, **do not pool** — go back to Welch's $t$ for the means.

</div>


</div>


Notes:
Variance tests matter in ML more than people think: a model that is equally
accurate on average but wildly less stable across seeds is a different product.

--

## Back to the A/B Question — Worked

Ten runs each. A: mean accuracy 80 %, $s\_A = 2$. B: mean 82 %, $s\_B = 1$.

$$
t = \frac{82 - 80}{\sqrt{4/10 + 1/10}} = \frac{2}{0.71} \approx 2.83
$$


<div class="fragment">

Welch's degrees of freedom ≈ 13; the critical value $t\_{0.975} \approx 2.16$.
Since $2.83 > 2.16$, **reject $H\_0$** at $\alpha = 0.05$ ($p \approx 0.014$).

</div>



<div class="fragment c-insight">

Paired on the same ten seeds, with differences of mean 2 and $s\_d = 0.5$:
$t = 2 / (0.5/\sqrt{10}) \approx 12.6$. Pairing buys far more power than more
runs.

</div>


Notes:
The numbers are chosen so the standard error is $\sqrt{0.5} \approx 0.71$.
Welch's d.f.: $0.25 / ((0.16 + 0.01)/9) \approx 13.2$. The paired numbers are
hypothetical — the point is that the per-seed differences vary far less than
either model's accuracies do, because a hard seed is hard for both.

--

## The Recommendation


<div class="grid-3">


<div class="card">

### Default
Welch's two-sample $t$ on the mean difference — or paired $t$ if both ran on
the same splits

</div>


<div class="card">

### Care about stability
$F$-test on $s\_A^2 / s\_B^2$

</div>


<div class="card">

### Normality dubious
Permutation (randomisation) test on the mean difference

</div>


</div>



<div class="takeaway">

Hypothesis testing compares data to a model through a statistic whose null
distribution is known. Known vs. unknown variance changes that distribution
($z$ vs. $t$); the design changes the test (Welch for independent runs, paired
for shared splits).

</div>


Notes:
Close by returning to the opening question with a concrete recommendation — the
module started with a decision they have to make, and ends with the decision
rule. Mention that the permutation test needs no distributional assumption at
all, which is why it is a good fallback when in doubt.

--

## The Churn Shop: Is the Difference Real?

Lecture 01's dashboard, with counts. Over one year:

| | customers | churned | rate |
|---|---|---|---|
| **app users** | 400 | 40 | 10% |
| **no app** | 400 | 60 | 15% |

$H\_0$: both groups churn at the same rate. Pooled rate $\hat{p} = 100/800 = 0.125$.


<div class="fragment">

$$
z = \frac{0.15 - 0.10}{\sqrt{\hat{p}(1-\hat{p})\left(\frac{1}{400} + \frac{1}{400}\right)}}
  = \frac{0.05}{0.023} \approx 2.1 \qquad p \approx 0.03
$$

</div>



<div class="fragment">


<div class="c-insight">

Chance alone would rarely produce a gap this large: at $\alpha = 0.05$ the
difference is **real**. Whether the app *causes* it is a different question —
Lecture 03 draws both answers.

</div>


</div>


Notes:
The running example of the course (a subscription business, introduced in the
Lecture 01 reasoning-cycle exercise), now with numbers. The statistic is the
z-test of this lecture applied to two proportions: a proportion is the mean of a
Bernoulli variable, so its standard error is √(p(1−p)/n), and under H₀ both
groups share one p, estimated from all 800 customers. Exact values: SE ≈ 0.0234,
z ≈ 2.14, two-sided p ≈ 0.033.

Say the limit clearly: the test says the gap is unlikely under "no
difference"; it says nothing about which way the arrow points. Loyal customers
may simply be the ones who install the app.
