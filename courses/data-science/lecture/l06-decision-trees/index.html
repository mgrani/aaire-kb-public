# Module 1
## Trees as Hypotheses

> **Guiding Question:** A linear model hides its reasoning in 200 weights. What
> would a model look like that can be read aloud?

--

## A Tree Is a Sequence of Questions

Each inner node tests one attribute, each branch is an answer, each leaf is a
class.

| Example | Sky | Temperature | Humidity | Wind | **EnjoySport** |
|---|---|---|---|---|---|
| 1 | sunny | warm | normal | strong | yes |
| 2 | sunny | warm | high | strong | yes |
| 3 | rainy | cold | high | strong | **no** |
| 4 | sunny | warm | high | strong | yes |

To classify a new day, start at the root and follow the answers to a leaf.


<div class="c-note">

The tree **is** the hypothesis. Unlike a weight vector, it can be read aloud as
a set of rules — which is why trees are the standard choice when a decision has
to be explained.

</div>


Notes:
Interpretability is the selling point and should be named early. Ask what
"explaining" a linear model with 200 weights would look like by comparison —
this is Lecture 01's KDD criterion "ultimately understandable" returning, and
the failures in its applications module show why it matters.

--

## Construction and Classification


<div class="grid-2">


<div class="card">

### Construction *(recursive)*
If the data is pure enough, make a leaf.
Otherwise: choose a **split criterion**, decompose $D$ into
$D\_1, \ldots, D\_s$, and recurse on each part.

</div>


<div class="card">

### Classification *(recursive)*
If the node is a leaf, return its class.
Otherwise: follow the successor selected by the example's attribute value.

</div>



</div>


<div class="c-important">

The whole learning problem reduces to one question: **which attribute to split
on?** Everything else is bookkeeping.

</div>


Notes:
The template is deliberately abstract — ID3, C4.5 and CART differ only in the
split criterion and the stopping rule. Say that now so the next units read as
variations, not as separate algorithms.

--

## When to Use Them


<div class="grid-2">


<div class="card good">

### Well suited
Attribute-value data; discrete or continuous features; missing values;
a need for an explainable model; no assumption of linearity.

</div>


<div class="card bad">

### Poorly suited
Smooth relationships (a tree approximates a diagonal boundary with a staircase);
many equally relevant features; and — as we will see — stability.

</div>


</div>


--

## Mini-Exercise

Find a tree with a **single test** that classifies the four EnjoySport
examples from the first slide correctly. Is it the only one?


<div class="fragment">


<div class="c-insight">

`Sky` works (sunny → yes, rainy → no) — and so does `Temperature` (warm → yes,
cold → no). Both separate the data perfectly; even the next module's split
criterion scores them equally (0.811 bits each). The data cannot choose: the learner's **inductive
bias**, not the examples, breaks the tie.

</div>


</div>


Notes:
Expect Sky first. Ask for a second answer before revealing — someone finds
Temperature. Humidity fails (example 2 is high and yes, example 3 is high and
no), and Wind is constant. The tie survives the next module's criterion, which
is the point: every learner needs a preference beyond the data.

--

## Takeaway


<div class="takeaway">

A decision tree is a **readable hypothesis** built by recursive splitting. The
only real decision is which attribute to split on next — and the data alone
does not settle it.

</div>


Notes:
The staircase point is worth a sketch on the board: trees split axis-parallel,
so a diagonal boundary costs many splits. That limitation motivates ensembles
at the end of the lecture.

# Module 2
## Choosing a Split

> **Guiding Question:** Every attribute could be split on. What makes one split
> better than another — and how do we measure it?

--

## What Makes a Split Good?

A split is good if the resulting subsets are **purer** than what we started
with — closer to containing a single class.

So we need a number that measures impurity: maximal when the classes are evenly
mixed, zero when a node is pure.

Notes:
Guiding question (P1). Let students propose a measure before showing entropy —
"fraction of the majority class" is the usual proposal, and it is exactly
misclassification error, whose weakness the visualization then shows.

--

## Three Measures

<div class="viz viz-lg" data-viz="ml/impurity-measures" data-steps="4"
 data-params='{"mark": 0.8}'></div>

Notes:
Stepped viz (P6): entropy, then Gini, then misclassification, then a concrete
node at p = 0.8. Ask before the third click how misclassification will compare —
its flatness is the reason it is rarely used as a split criterion, even though
it is what we ultimately care about.

--

## Entropy and Gini


<div class="c-definition">

For a node with class probabilities $P(A\_1), \ldots, P(A\_k)$:
$$
H(\mathcal{A}) = -\sum\_{i=1}^{k} P(A\_i) \log\_2 P(A\_i)
\qquad
G(\mathcal{A}) = 1 - \sum\_{i=1}^{k} P(A\_i)^2
$$
**Entropy** $H$ is measured in bits — the average number of yes/no questions
needed to identify an example's class. **Gini impurity** $G$ is the probability
that two examples drawn at random from the node belong to different classes.

</div>


| | Pure node | Two classes, 50/50 | $k$ equal classes |
|---|---|---|---|
| Entropy $H$ | 0 | 1 bit | $\log\_2 k$ bits |
| Gini $G$ | 0 | 0.5 | $1 - 1/k$ |

Notes:
The "questions needed" reading makes entropy concrete and is worth more than
the formula. It also makes the next slide's subtraction obviously meaningful:
information gain is *questions saved*. Gini is the curve from the previous
slide's second step; CART uses it because it needs no logarithm and ranks
splits almost exactly as entropy does.

--

## Conditional Entropy and Information Gain

After splitting on an attribute $\mathcal{B}$ with outcomes $B\_1, \ldots, B\_s$:

$$
H(\mathcal{A} \mid \mathcal{B}) = \sum\_{j=1}^{s} P(B\_j) \cdot H(\mathcal{A} \mid B\_j)
$$

— the impurity of each part, weighted by how much data lands in it.


<div class="c-important">

$$
\mathrm{Gain}(\mathcal{B}) = H(\mathcal{A}) - H(\mathcal{A} \mid \mathcal{B})
$$
**Information gain** is the impurity removed by the split. Choose the attribute
that maximises it.

</div>


Notes:
The weighting by P(B_j) is what stops a split that isolates one example from
looking good. Ask what would happen without it — a strong argument for reading
formulas as decisions rather than as notation.

--

<!-- .slide: class="smaller" -->

## Worked Example: The Root of PlayTennis

Quinlan's 14 weather days: 9 yes, 5 no, so
$H = -\tfrac{9}{14}\log\_2\tfrac{9}{14} - \tfrac{5}{14}\log\_2\tfrac{5}{14} = 0.940$ bits.
Counts are (yes, no) per value.

| Attribute | Split | $H(\mathcal{A} \mid \mathcal{B})$ | Gain |
|---|---|---|---|
| **Outlook** | sunny (2, 3) · overcast (4, 0) · rain (3, 2) | 0.694 | **0.247** |
| Humidity | high (3, 4) · normal (6, 1) | 0.788 | 0.152 |
| Wind | weak (6, 2) · strong (3, 3) | 0.892 | 0.048 |
| Temperature | hot (2, 2) · mild (4, 2) · cool (3, 1) | 0.911 | 0.029 |


<div class="fragment">


<div class="c-insight">

Outlook wins the root although two of its branches are *more* mixed than the
root (0.971 vs 0.940 bits): its overcast branch is **pure**, so 4 of the 14
days need no further question.

</div>


</div>


Notes:
Recomputed: sunny and rain branches each have H = 0.971, so
H(A | Outlook) = (5/14 + 5/14) · 0.971 = 0.694. Mitchell's textbook prints
0.246 and 0.151 because it rounds the intermediate entropies; exact values
are 0.2467 and 0.1518. Ask before the fragment why Outlook wins with two
mixed branches — the pure overcast branch is the answer. Gini agrees: the
root has G = 0.459 and Outlook again gives the largest reduction (0.116).

--

## Mini-Exercise

A node holds 4 yes and 4 no. A split yields [3 yes, 1 no] and
[1 yes, 3 no]; a 3:1 node has entropy 0.811. What is the information gain?


<div class="fragment">


<div class="c-insight">

Before: $H = 1$ bit. After: both halves hold half the data and have
$H = 0.811$, so $H(\mathcal{A} \mid \mathcal{B}) = 0.811$.
$\mathrm{Gain} = 1 - 0.811 = 0.189$ bits — a split that "looks decent"
removes less than a fifth of a bit.

</div>


</div>


Notes:
The small number is the lesson: intuitively the split "looks decent", but it
buys little. Comparing this with a perfect split (gain = 1) calibrates
expectations.

--

## Takeaway


<div class="takeaway">

Impurity measures how mixed a node is; **information gain is the impurity a
split removes**, weighted by the data it moves. Entropy and Gini agree closely;
misclassification error is too flat to choose between splits.

</div>

# Module 3
## Building the Tree

> **Guiding Question:** ID3 never reconsiders a split. What does that greedy
> choice assume about the world?

--

## ID3


<div class="c-algorithm">

**ID3**(examples $D$, attributes $A$, target)

1. If all examples share one class → return a leaf with that class.
2. If $A$ is empty → return a leaf with the majority class.
3. Otherwise choose $A^{\*} \in A$ with the highest **information gain**.
4. For each value $a$ of $A^{\*}$: if $D\_a$ is empty, add a leaf with the
 majority class of $D$; otherwise add the subtree
 **ID3**($D\_a$, $A \setminus \lbrace A^{\*} \rbrace$, target).

</div>


Greedy and recursive: each split is chosen for immediate gain, and never
reconsidered.

Notes:
Point at step 3 and name it: this is heuristic search from Lecture 04's
principles unit. The hypothesis space of all trees is astronomically large;
ID3 walks one path through it without backtracking.

--

## What ID3 Assumes


<div class="grid-2">


<div class="card">

### Hypothesis space
**All** decision trees over the attributes — so the target function is
certainly in there. No representational bias.

</div>


<div class="card">

### Search bias
It prefers trees that place **high-gain attributes near the root**, and
therefore **shorter trees**. It stops at the first tree that fits.

</div>



</div>


<div class="c-warning">

Two assumptions, not facts. **Short trees generalise** — Occam's razor as an
algorithm. And **a useful attribute shows gain on its own**: for
$y = x\_1 \text{ XOR } x\_2$ on balanced data, each attribute alone has gain 0,
yet together they decide $y$ — greedy search cannot see it.

</div>


Notes:
Force the interpretation (P2, P3): ask why a shorter tree should generalise
better. There is an argument (fewer short trees exist, so fitting the data by
accident is less likely) but it is not airtight, and students should see it as
a defensible choice rather than a fact. The XOR case answers the guiding
question: greedy search assumes that attributes which matter jointly also
matter one at a time. Pruning returns to this (a weak split can enable a
strong one beneath it).

--

## CART


<div class="grid-2">


<div class="card">

### What differs
**Binary** splits only; **Gini** impurity instead of entropy; handles
**regression** by splitting on variance reduction and predicting the mean in
each leaf.

</div>


<div class="card">

### What does not
The template is unchanged: choose a split, decompose, recurse. CART is a
different set of choices inside the same skeleton.

</div>



</div>


<div class="c-note">

Binary splits reduce a defect of multi-way splits: an attribute with many values
(an ID number, in the extreme) achieves high information gain by fragmenting
the data into pure singletons. C4.5 corrects for it with the **gain ratio**,
the gain divided by the entropy of the split itself.

</div>


Notes:
The many-valued-attribute defect is the reason C4.5 introduced gain ratio. It is
a good concrete instance of a metric being gamed by the structure of the data —
a theme students will meet in evaluation and in production systems.

--

## Mini-Exercise

Your dataset has a `customer_id` column, unique for every row. What
information gain does a split on it achieve — and what does the resulting
tree predict for a new customer?


<div class="fragment">


<div class="c-insight">

The **maximum possible**: every branch holds one example, every leaf is pure,
so the gain equals the root's entropy. And for a new customer — nothing: their
id matches no branch. Perfect purity, zero generalisation; hence gain ratio,
or binary splits.

</div>


</div>


Notes:
The cleanest overfitting example in the course, and it arrives before pruning
is introduced, which motivates the next module. If asked: the tree is a
lookup table, one level deep; ID3 would send the unseen id to no branch at
all, so an implementation has to fall back on the root's majority class.

--

## Takeaway


<div class="takeaway">

ID3 is a **greedy, non-backtracking search** whose bias is a preference for
short trees. CART changes the split type and the impurity measure, not the
idea. Both can be fooled by an attribute with too many values.

</div>


---

# Module 4
## Overfitting and Pruning

> **Guiding Question:** A tree can reach 100% training accuracy on any dataset
> without contradictory examples. Why is that a symptom rather than an
> achievement?

--

## A Tree Grown to Purity Is Overfitted

Left alone, ID3 splits until every leaf is pure — memorising the training set,
noise included.

<div class="viz viz-lg" data-viz="ml/bias-variance" data-steps="5"
 data-params='{"degrees": [1, 2, 3, 5, 9, 14]}'></div>

Tree depth plays the role of polynomial degree: more splits, lower training
error, and eventually rising test error.

Notes:
Deliberate reuse of the visualization from the neural-network lecture (P6 and
the spiral): the same phenomenon, a third model family. Students should now
recognise the shape before the caption says it.

--

## Two Places to Intervene


<div class="grid-2">


<div class="card">

### Stopping (pre-pruning)
Halt splitting **during** construction — when a node is small, when gain is
below a threshold, or at a depth limit.

Cheap, but short-sighted: a weak split may enable a strong one beneath it.

</div>


<div class="card">

### Pruning (post-pruning)
Grow the full tree, then **remove** subtrees that do not earn their keep.

More expensive, and generally more reliable.

</div>


</div>


Notes:
The "weak split enabling a strong one" point is the standard argument for
post-pruning, and it is the XOR structure again: neither attribute helps alone.

--

## Reduced Error Pruning


<div class="c-algorithm">

1. Split the data into a **training** and a **validation** set.
2. Grow the full tree on the training set.
3. For each inner node: consider replacing its subtree with a leaf carrying
 the majority class.
4. Keep the replacement if accuracy on the **validation** set does not fall.
5. Repeat until no beneficial replacement remains.

</div>



<div class="c-important">

The decision is made on data the tree was **not** grown on. Pruning against the
training set would remove nothing — every subtree helps there by construction.

</div>


Notes:
This is the hold-out principle from Lecture 04, now used to make a structural
decision rather than to report a number. Ask what happens if the validation set
is small — pruning decisions become noisy, which is why cost-complexity pruning
with cross-validation is preferred in practice.

--

## Mini-Exercise

A tree with 340 leaves scores 100% on training data, 78% on validation.
Pruned to 41 leaves it scores 94% and 89%. Training accuracy fell by six
points — did pruning fail?


<div class="fragment">


<div class="c-insight">

No. The 299 removed leaves fitted noise — examples that are now misclassified,
as intended. Unseen data gained **11 points**, and the tree became small enough
to read. Training accuracy was never the objective.

</div>


</div>


Notes:
Students hesitate here — accepting worse training performance feels like
failure. Naming it as the point of the exercise reinforces that training
error was never the objective.

--

## Takeaway


<div class="takeaway">

An unpruned tree memorises. **Pruning trades training accuracy for
generalisation**, and the trade must be judged on data the tree never saw.

</div>


---

# Module 5
## Ensembles

> **Guiding Question:** Change a few examples and the tree changes completely.
> Can that instability be turned into an advantage?

--

## Why One Learner Falls Short

Three reasons, after Dietterich (2000):


<div class="grid-3">


<div class="card">

### Statistical
Too little data for the hypothesis space: many hypotheses fit equally well, and
small changes in the data pick a very different one.

</div>


<div class="card">

### Computational
The learner cannot search its hypothesis space exhaustively and settles for a
heuristic path — a local optimum.

</div>


<div class="card">

### Representational
The model family cannot express the target at all; a combination of models
may.

</div>



</div>


<div class="c-important">

**Decision trees are the textbook unstable learner** (the statistical reason): change a handful of
examples and a different attribute wins at the root, producing a completely
different tree.

</div>


Notes:
The first reason is what "unstable learner" means: high variance. Instability
is the property that makes ensembles work, so it must be understood
as a fact about trees before bagging looks like anything other than a trick.
Ask why a greedy root choice makes the whole tree fragile.

--

## The Idea


<div class="c-definition">

**Ensemble learning** builds several learners and combines their predictions —
by majority vote for classification, by averaging for regression.

</div>



<div class="grid-3">


<div class="card">

### Bagging
**B**ootstrap **agg**regat**ing** — train on resampled datasets.

</div>


<div class="card">

### Boosting
Train weak learners in sequence, each focusing on the previous one's mistakes.
*Named here; not developed in this course.*

</div>


<div class="card">

### Random forest
Bagging plus randomised attribute selection at every split.

</div>


</div>



<div class="takeaway">

Ensembles exploit instability: **many different models, each better than
chance and wrong in partly independent ways, are right together more often
than any one of them**.

</div>


Notes:
The takeaway is counterintuitive enough to state plainly, and both conditions
matter: a committee of worse-than-chance voters gets *worse* with size, and a
committee of identical voters does not change. Partial independence is what
the next two units engineer deliberately. Boosting (AdaBoost, gradient
boosting) is left to the literature; mention that it reduces bias rather than
variance.

--

## Bootstrap Aggregating


<div class="grid-2-1">


<div class="column">

**The problem.** A group of predictors helps only if they differ — but we have
one algorithm and one dataset, which yield one model.

**The solution.** Manufacture different datasets: draw $n$ examples from $D$
**with replacement**, train a predictor on each sample, and combine them by
vote or average.

</div>


<div class="column">


<div class="c-note">

The learner never changes. Only the data it sees does.

</div>


</div>


</div>


Notes:
Bootstrapping was introduced in Lecture 04 as an error-estimation scheme; here
the same resampling produces model diversity. Same tool, different job — worth
naming as the spiral it is.

--

## What Resampling Actually Does

Each bootstrap sample contains about **63.2%** of the distinct examples of $D$.
The probability that a particular example is *never* drawn in $n$ tries is

$$
\Big(1 - \tfrac{1}{n}\Big)^{n} \xrightarrow[n \to \infty]{} e^{-1} \approx 0.368
$$


<div class="grid-2">


<div class="card good">

### The gain
Each model sees a different two-thirds of the data, so their errors are partly
independent. **Averaging reduces variance** — and therefore overfitting.

</div>


<div class="card">

### The left-out third
The ~36.8% not drawn is the *out-of-bag* sample, usable as a free validation
set for that model.

</div>


</div>


Notes:
The 63.2% is a nice concrete consequence of a limit students can verify. The
out-of-bag idea is practically important: it gives an honest error estimate
without a separate hold-out.

--

## Mini-Exercise

You bag 100 trees, each 70% accurate, and take a majority vote. What accuracy
does the vote reach if all 100 trees are identical — and if their errors are
independent?


<div class="fragment">


<div class="c-insight">

Identical: **70%** — a hundred copies vote unanimously. Independent: the vote
is wrong only if 50 or more trees err at once, which happens with probability
$2.2 \times 10^{-5}$ — about **99.998%**. Both conditions matter: each tree
better than chance (> 50%), and errors that are not shared.

</div>


</div>


Notes:
Exact: P(Bin(100, 0.7) ≥ 51) = 0.99998. Real bootstrap trees sit between the
two extremes, far closer to the identical case, which is why bagging helps
less than the independent number suggests. With 45%-accurate independent trees
the same vote falls to 13% (a tie counted as an error) and to 0 as the
committee grows — "better than chance" is not decoration. Bagging
reduces mainly variance: averaging does not fix an error every tree shares.
The identical case motivates random forests directly: bootstrap samples alone
may not decorrelate trees enough, especially when one attribute dominates.

--

## Takeaway


<div class="takeaway">

Bagging manufactures diversity by **resampling the data**, and averages away
variance. It helps exactly to the extent that the models' errors are
independent — and not at all when they are not.

</div>


--

## Why Bagging Trees Is Not Enough


<div class="grid-2">


<div class="card bad">

### Trees stay similar
If one attribute has much higher gain than the rest, it wins at the root of
**every** bootstrap sample. The trees correlate, and averaging them buys little.

</div>


<div class="card bad">

### And it costs
Interpretability is gone — you can no longer read the model as a set of rules —
while the computation of 100 near-identical trees is largely wasted.

</div>


</div>


Notes:
This answers the identical-trees case of the bagging mini-exercise. Resampling
alone does not guarantee diversity; the dominant attribute defeats it.

--

## The Fix: Randomise the Split Too


<div class="c-algorithm">

**Random forest** (Breiman 2001)

For each of $T$ trees:

1. Draw a bootstrap sample from $D$.
2. Grow a tree — but **at every node**, choose the split from a random subset
 $A' \subset A$ of $m\_A$ attributes rather than from all of them.
3. Do not prune.

Combine by majority vote (classification) or average (regression).

</div>



<div class="c-important">

The dominant attribute is simply **absent** from most nodes' candidate sets, so
other attributes get to define the tree. Diversity is engineered rather than
hoped for.

</div>


Notes:
Step 2 is the entire contribution, and it is one line. Typical m_A is √|A| for
classification. Step 3 is counterintuitive — individual overfitting is
tolerated because averaging handles the variance.

--

## What You Get and What You Give Up


<div class="grid-2">


<div class="card good">

### Gained
Strong accuracy with almost no tuning; out-of-bag error for free; a usable
attribute-importance measure.

</div>


<div class="card bad">

### Lost
The readable single tree. A forest is a **committee**, and no member speaks for
it.

</div>



</div>


<div class="c-warning">

Attribute importance from a forest is not a causal statement. It reports which
attributes the trees found useful for splitting — under this data, this
sampling, this correlation structure.

</div>


Notes:
The warning matters because attribute importance is routinely over-read in
practice, including in published work. It connects back to the "Correlation
Is Not Causation" slide in Lecture 01.

--

## Mini-Exercise

A pruned tree reaches 86% accuracy, a random forest 91%. Which do you deploy
for an internal churn model — and which for automated loan refusals that must
be justified to applicants?


<div class="fragment">


<div class="c-insight">

Churn: the **forest** — five points matter and nobody needs the model
explained. Loans: the **tree**, or a forest inside a documented, auditable
process; a refusal that cannot be explained may be neither acceptable nor

<div class="takeaway">

Random forests **engineer diversity** by randomising the attributes available at
each split, turning unstable trees into a stable committee — at the cost of the
