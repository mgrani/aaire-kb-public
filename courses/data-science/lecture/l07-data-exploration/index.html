# Module 1
## What Kind of Data Is This?

> **Guiding Question:** The file loads and the numbers compute. Why is that not
> yet a reason to trust the average?

--

<!-- .slide: class="smaller" -->

## Four Attribute Types — What the Values Allow

| | type | the values… | meaningful | statistics | examples |
|---|---|---|---|---|---|
| categorical | **nominal** | are names that only distinguish objects | $=$, $\neq$ | mode, entropy, contingency table, $\chi^2$ test | ZIP code, employee ID, eye colour |
| | **ordinal** | carry an order | $<$, $>$ | median, percentiles, rank correlation, sign test | grades, rankings, {good, better, best} |
| numeric | **interval** | have meaningful differences; the zero is arbitrary | $+$, $-$ | mean, standard deviation, Pearson correlation, $t$-test | temperature in °C or °F, calendar dates |
| | **ratio** | have a true zero, so ratios are meaningful | $\times$, $\div$ | geometric mean, harmonic mean, coefficient of variation | length, mass, counts, age, temperature in K |

Each type permits everything the one above it does, plus more.

Notes:
The four scales go back to S. S. Stevens (1946). Nominal and ordinal
attributes are called categorical (qualitative), interval and ratio attributes
numeric (quantitative). The scales form a hierarchy: each permits the
comparisons and statistics of the scales above it in the table, plus its own.
So the mode is meaningful on every scale, the median from ordinal on, the mean
from interval on, and ratios, the geometric mean and the coefficient of
variation only on a ratio scale.

The type is a property of the measurement, not of the storage format: a ZIP
code stored as an integer is still nominal, and a street number is ordinal at
best. Temperature in kelvin, unlike °C, is a ratio scale.

--

<!-- .slide: class="smaller" -->

## Four Attribute Types — What You May Transform

| | type | permissible transformation | example |
|---|---|---|---|
| categorical | **nominal** | any one-to-one relabelling | reassigning employee IDs changes nothing |
| | **ordinal** | any strictly increasing $f$: $x \mapsto f(x)$ | {good, better, best} is as well coded by {1, 2, 3} as by {1, 5, 9} |
| numeric | **interval** | $x \mapsto a x + b$, $a > 0$ | °C and °F differ in zero point and unit |
| | **ratio** | $x \mapsto a x$, $a > 0$ | length in metres or in feet |


<div class="c-intuition">

A statement is **meaningful** on a scale if no permissible transformation can
change its truth. "Twice as long" survives metres → feet; "twice as warm" does
not survive °C → °F.

</div>


Notes:
Each scale is characterised by the transformations that preserve its
information: any one-to-one relabelling for nominal, any strictly increasing
function for ordinal, positive affine maps $x \mapsto ax + b$ ($a > 0$) for
interval (°C to °F), and positive scalings $x \mapsto ax$ for ratio (metres to
feet). The smaller the set of permissible transformations, the more structure
the values carry, and the more statements are meaningful.

The criterion explains the statistics column of the previous table. The mean
of an ordinal attribute is not meaningful because a strictly increasing
recoding (1, 2, 3 to 1, 5, 9) can change which of two groups has the larger
mean; the median's position is preserved by every such recoding. A ratio of
two temperatures in °C changes under the affine map to °F (20 °C / 10 °C = 2,
but 68 °F / 50 °F = 1.36); a ratio of two lengths is the same in metres and
feet.

--

## Why the Type Decides the Method


<div class="marks-no">

- **The classic error:** averaging a nominal attribute. The mean of ZIP codes
  10115 and 81667 is a number, and it is meaningless.
- **The subtle one:** 20 °C is not "twice as warm" as 10 °C — interval scales
  have no true zero, so ratios do not transfer.

</div>



<div class="c-important">

The attribute type determines which **statistics**, which **distance measures**
and which **plots** are permissible. Every method in this course depends on it.

</div>


--

<!-- .slide: class="smaller" -->

## A Table Is a Sample From a Joint Distribution

| | payment | satisfaction | born | income (k€) | returned? |
|---|---|---|---|---|---|
| **column** | $X\_1$ · nominal | $X\_2$ · ordinal | $X\_3$ · interval | $X\_4$ · ratio | $X\_5$ · nominal |
| **draw** $\mathbf{x}\_1$ | card | 4 | 1987 | 52 | yes |
| **draw** $\mathbf{x}\_2$ | invoice | 2 | 1995 | 31 | no |

Each **column** is a random variable **with a measurement scale**; each **row**
is one draw $\mathbf{x}\_i$ from **one joint distribution** $p(x\_1, \ldots, x\_5)$
that nobody has written down.


<div class="q">

A is 180 cm long, B 90 cm. Is A "twice as long"?

</div>



<div class="fragment">

| length recorded as | A | B | what the values support |
|---|---|---|---|
| cm — **ratio** | 180 | 90 | "twice as long" — in inches 70.9 vs 35.4, still ×2 |
| cm above 100 cm — **interval** | 80 | −10 | "90 cm longer"; the ratio −8 means nothing |
| size class 1–3 — **ordinal** | 3 | 1 | "longer"; "three times" means nothing |
| size label — **nominal** | L | S | "different" — nothing more |

</div>


Notes:
The second header row is not data: it names the random variable behind each
column and the scale its values are measured on. A random variable is a
function from the population (customers) to values; the scale states which
relations between those values carry information. A row is one customer drawn
from the population with all attributes recorded at once, a realisation of the
vector $(X\_1, \ldots, X\_5)$. The table as a whole is a sample of $n$ such draws.

A dataset is not the distribution but a sample from it. Every quantity computed
from the table — a mean, a proportion, a correlation — is therefore an
estimate of a property of $p(x\_1, \ldots, x\_5)$. A different sample from the
same distribution would give a different value, and this sample-to-sample
variation is the estimate's error.

The length example keeps the object fixed and changes only the recording. A
ratio scale has a true zero, so ratios survive every change of unit
($x \mapsto ax$, $a > 0$): 180/90 = 70.9/35.4 = 2. Measuring from an arbitrary
reference point, here 100 cm, is an interval scale: the map
$x \mapsto x - 100$ preserves differences (90 cm) but not ratios
(80 / −10 = −8). Size classes keep only the order, and any strictly increasing
recoding of 1, 2, 3 is equally valid. A label keeps only identity. The same
number 3, or the same pair of values, therefore supports different statements
depending on the scale; <a href="/courses/data-science/lecture/l07-data-exploration/">Lecture 07</a> defines the four
scales and the statistics each permits (Stevens 1946).

For the probabilistic reading the scale matters twice: it decides which
summaries of a sample are meaningful, and which distribution family is a
sensible model for the column, taken up in "The Scale Suggests the Model".

--

<!-- .slide: class="smaller" -->

## The Scale Suggests the Model


<div class="q">

Which distribution would you write down for each column — and how many
numbers does it need?

</div>



<div class="fragment">

| attribute | values | scale | a first model | numbers |
|---|---|---|---|---|
| returned? | yes / no | nominal | **Bernoulli**$(p)$ | 1 |
| payment | card, invoice, … ($k$) | nominal | **categorical**$(p\_1, \ldots, p\_k)$ | $k - 1$ |
| satisfaction | 1 – 5 stars | ordinal | categorical (order unused) | 4 |
| orders last month | 0, 1, 2, … | ratio, count | **Poisson**$(\lambda)$ | 1 |
| height | around 170 cm | ratio | **normal**$(\mu, \sigma^2)$ | 2 |
| income | $> 0$, skewed | ratio | **log-normal**: normal on $\log$ income | 2 |
| share of orders returned | $[0, 1]$ | ratio | **Beta**$(\alpha, \beta)$ | 2 |

</div>



<div class="c-warning">

The scale limits the model as it limits the statistics: a normal distribution
for ZIP codes is as meaningless as their mean.

</div>


Notes:
Each entry is a parametric family: a formula with a few parameters instead of
one probability per value. The column "numbers" counts
the parameters of the family: what has to be
estimated from the data, instead of one probability per value. The categorical
distribution assigns $P(X = j) = p\_j$ to each of $k$ values,
with $k - 1$ free parameters because $\sum\_j p\_j = 1$; the Bernoulli is the
case $k = 2$. Naive Bayes classifiers, for example, commonly model each
nominal attribute this way, with one categorical distribution per class.

Ordinal attributes are the hard case. A categorical model ignores the order; a
numeric model (e.g. normal) assumes equal gaps between levels, which the
ordinal scale does not justify. Dedicated ordinal models, such as
cumulative-logit models, use the order without assuming equal gaps. For height a normal model is
only an approximation, since its support is the whole real line, including
negative values that carry negligible probability. Income is positive and right-skewed, so a normal model would put
probability on negative incomes; a log-normal model means that $\log$ income
is normal. ZIP codes are nominal despite consisting of digits.

The Poisson distribution, $P(X = k) = e^{-\lambda} \lambda^k / k!$ for
$k = 0, 1, 2, \ldots$, models the number of events in a fixed period at a
constant rate $\lambda$, which is also its mean and its variance; real counts
often vary more than that (overdispersion), and a negative binomial adds a
second parameter for it. The exponential distribution models the waiting time
between such events. A share in $[0, 1]$ is modelled by a Beta distribution,
the same family that serves as the standard prior for an unknown probability.

--

## What "i.i.d." Claims


<div class="c-definition">

The rows $\mathbf{x}\_1, \ldots, \mathbf{x}\_n$ are **independent and identically
distributed** (i.i.d.) if

| | | |
|---|---|---|
| **independent** | $p(\mathbf{x}\_1, \ldots, \mathbf{x}\_n) = \prod\_{i} p\_i(\mathbf{x}\_i)$ | <span class="intuition">one customer's row tells nothing about another's</span> |
| **identically distributed** | $p\_i = p$ for every row $i$ | <span class="intuition">every row comes from the **same** joint distribution</span> |

</div>



<div class="q">

Which of these datasets break it: daily sales of one shop · two visits by the
same customer · pixels of one image · a survey sent to a random sample?

</div>



<div class="fragment">

Only the random survey is plausibly i.i.d. Time series, repeated measurements
and spatial data all violate it — the arrangement *is* information.

</div>


Notes:
Independence is a statement about rows, not columns: the attributes within a
row may be strongly dependent (income and age, say). Under i.i.d. the
probability of the whole dataset factorises,
$p(\mathcal{D} \mid \theta) = \prod\_{i=1}^n p(x\_i \mid \theta)$, which is the
form every likelihood-based fitting method starts from.

Answer to the question. Daily sales of one shop are autocorrelated (one day
predicts the next) and follow trends and seasons, so they are neither
independent nor identically distributed. Two visits by the same customer are
dependent because they share the person. Neighbouring pixels of one image are
strongly correlated. A survey sent to a random sample yields approximately
independent draws from the population (exactly so for sampling with
replacement; without replacement the dependence is negligible when the
population is large), though non-response can still make it unrepresentative.
Record data is the setting where i.i.d. is at least plausible; graphs, grids
and time series are the settings where it is not. A frequent violation of
"identically distributed" in practice is distribution shift between the data
a model is fitted on and the data it is applied to.

--

## Four Shapes of Data


<div class="grid-4">


<div class="card">

### Record data
Objects × attributes — the familiar table. Rows are *treated as* independent.

</div>


<div class="card">

### Graph data
Objects carry **links** to other objects: web pages, social networks,
citations.

</div>


<div class="card">

### Fields / grids
Objects sit in a **spatial** arrangement: images, sensor lattices, simulations.

</div>


<div class="card">

### Spatio-temporal
Position **and** time: monthly land temperatures, traffic movement, trajectories.

</div>



</div>


<div class="c-note">

The shape decides which methods even apply. A table whose rows are treated as
independent can be shuffled without loss; a grid or a time series cannot — the
arrangement *is* information. Independence of rows is an assumption, not a
property of the file.

</div>


Notes:
Every shape can be flattened into a table, but not without loss: a graph
becomes an edge list whose rows share nodes, an image becomes one row per
pixel whose neighbours are correlated, a time series becomes rows whose order
carries the dynamics. In each case the rows are no longer independent, so
methods that assume independent rows give wrong standard errors and
over-optimistic validation (a random train/test split leaks information
between neighbouring rows). Network science, spatial statistics and
time-series analysis are the methods that model the arrangement instead.

--

## Where Does a Recorded Value Come From?


<div class="q">

A sensor records 22.4 °C. Besides the temperature, what went into that number?

</div>


<div class="viz eq-explain" data-viz="core/equation-explain" data-steps="3"
 data-params='{"labels": ["the true value", "artefact — deterministic, the same every time", "noise — random, mean 0"]}'>

$$
x = \eqa{s} + \eqb{b} + \eqc{\varepsilon}
$$

</div>


<div class="fragment c-note">

A dataset records $x$, never $s$. Every data problem is a claim about the
terms that were added on the way.

</div>


Notes:
The equation is a measurement model: the recorded value $x$ is the quantity of
interest $s$ plus a systematic error $b$ plus a random error $\varepsilon$ with
$E[\varepsilon] = 0$. Noise is aleatoric: repeating the measurement gives a
different $\varepsilon$ each time. An artefact is introduced by the
measurement process itself (a sensor in the sun, a miscalibrated scale, a
logging bug, a resampled image) and gives the same $b$ for every reading taken
through that process. More generally an artefact is any deterministic error
$x = g(s)$: a decimal point shifted (1.85 m recorded as 18.5 m), °F stored as
°C, a wrong conversion in the pipeline. The same $s$ always gives the same
wrong $x$, so repeating the measurement does not reveal it, and it may affect
every row or only those from one source. A third case is a reading that does not follow the
model at all, an outlier. The same decomposition underlies regression later
in the course, where $s$ becomes a function $f(\mathbf{x})$ and $\varepsilon$
the observation noise.

--

## Three Problems on One Axis


<div class="img-h-md">

![Twelve readings of one true value: noise scatters them around it, an artefact shifts all of them by b, a single outlier pulls the mean away](/units/math/stochastic/figures/data-problems.svg)

</div>



<div class="q">

Which of the three problems does collecting more data fix?

</div>



<div class="fragment">

Only **noise**. An artefact shifts every new reading too; an outlier comes
back in the same proportion.

</div>


Notes:
Twelve readings of a true value $s = 20$ °C in each row; the triangle marks
the sample mean. Noise: the readings scatter around $s$ and their mean is
close to it; with $n$ readings the mean's random error shrinks like
$1/\sqrt{n}$ (made precise as the standard error in the statistics module).
Artefact: the same scatter shifted by $b = 2.5$; the mean converges to
$s + b$, not to $s$, so more data makes the estimate more precise but not more
correct. Outlier: one reading of 35 °C (a mistyped value, say) raises the
mean from about 20 to about 21.3, while the median stays near 20.

--

## Each Problem Is a Model Statement

| problem | in the model | more data | what helps |
|---|---|---|---|
| **noise** | $\varepsilon \sim p(\varepsilon)$, $E[\varepsilon] = 0$ | averages it out | model it; average |
| **artefact** | $x = g(s)$, deterministic | does **not** help | calibration, a second instrument, domain knowledge |
| **outlier** | a draw from another $q$ | a share $\pi$ remains | robust statistics, or model $q$: $(1 - \pi)\\,p + \pi\\,q$ |
| **missing** | $M$ = missing, $P(M \mid x)$ | depends on why | ask for the mechanism first |


<div class="c-warning">

None of these can be read off the data alone. Calling a value noise, an
artefact or an outlier is an assumption about how it was generated.

</div>


Notes:
Noise is modelled by a distribution for $\varepsilon$, most often
$\mathcal{N}(0, \sigma^2)$; heavier-tailed choices (Laplace, Student-t) allow
occasional large errors without calling them outliers. An artefact is a bias
and is invisible from within one dataset, because every reading carries it;
it shows only against an external reference (a calibrated instrument, a second
data source, known physical limits: no adult is 18.5 m tall), or once the
source of each value (the scale, the sensor, the clerk) is recorded as an
attribute and the groups can be compared. Outliers are modelled as a mixture: with
probability $1 - \pi$ a reading comes from the model $p$, with probability
$\pi$ from a broad contamination distribution $q$. Fitting the mixture yields,
for each reading, the posterior probability that it is an outlier — Bayes'
theorem with two hypotheses. Missing values are described by a missingness
indicator $M$: missing completely at random (MCAR) if $P(M = 1)$ is a
constant, missing at random (MAR) if it depends only on observed attributes,
missing not at random (MNAR) if it depends on the missing value itself, as
for a sensor that fails in the cold. Only under MCAR is deleting incomplete
rows unbiased.

--

## Mini-Exercise: Stars and Birth Years

A customer table records satisfaction (one to five stars) and year of birth.
Which scale is each — and whose **mean** would you not report?


<div class="fragment">

Satisfaction is **ordinal**: its mean assumes equal gaps between the stars —
report the median. Year of birth is **interval**: the mean year is fine, but
ratios are not ("born twice as late" means nothing); differences such as age
are fine.

</div>


Notes:
Satisfaction in stars is ordinal. The mean treats the gap from one to two
stars as equal to the gap from four to five, which the scale does not
guarantee; the median and the mode use only the order and the labels. Means of
rating scales are nonetheless widely reported in practice, which amounts to
treating the scale as interval.

Year of birth is interval: year 0 is a convention, so "born twice as late" is
meaningless, but the mean year and differences between years are meaningful.
A difference of two interval values, such as an age computed from years of
birth, is on a ratio scale. Payment method is nominal (only counts, shares
and the mode are meaningful); income is ratio, with a true zero, so "twice the
income" is a valid statement.

--

## Mini-Exercise: Three Scales

Patients are weighed on three scales, a third on each. Two record
$X = S + \varepsilon$; the third is miscalibrated and adds exactly 3 kg every
time: $X = S + 3 + \varepsilon$. Does weighing ten times as many patients bring
the mean of $X$ closer to $E[S]$?


<div class="fragment c-insight">

No. $E[X] = E[S] + \tfrac13 \cdot 3 = E[S] + 1$ kg: the mean converges, but to
a value 1 kg too high — an **artefact**. More data shrinks only the noise
$\varepsilon$.

</div>


Notes:
$S$ is the true weight, $\varepsilon$ the random noise with $E[\varepsilon] = 0$,
the same for all three scales. By linearity
$E[X] = E[S] + \tfrac13 \cdot 3 + \tfrac23 \cdot 0 = E[S] + 1$ kg. The sample
mean converges to $E[X]$, so a larger sample makes the estimate more precise
but not more correct. The artefact is detectable once the scale is recorded
as an attribute: the mean per scale then differs by about 3 kg, more than the
noise explains.

--

## Mini-Exercise: A Sensor That Fails in the Cold

Temperature $T$, missingness indicator $M$ (1 = reading missing). The sensor
fails mostly in the cold: $P(M = 1 \mid T)$ is large for low $T$. After
deleting the incomplete rows, does the mean estimate $E[T]$ — or what?


<div class="fragment c-insight">

It estimates $E[T \mid M = 0]$, which is **larger** than $E[T]$: the coldest
days are gone. Only if $M$ is **independent** of $T$ is
$E[T \mid M = 0] = E[T]$ and deletion harmless.

</div>


Notes:
The rows that remain are draws from the conditional distribution
$p(t \mid M = 0)$, not from $p(t)$. By Bayes' theorem,
$p(t \mid M = 0) \propto P(M = 0 \mid t)\\, p(t)$: low temperatures are
down-weighted because they are the ones likely to be missing, so the mean of
the remaining rows overestimates $E[T]$, and more data does not remove the
bias. This is missing not at random (MNAR). If $P(M = 1 \mid t)$ is a
constant, $M$ and $T$ are independent, the weighting is flat and
$p(t \mid M = 0) = p(t)$: missing completely at random (MCAR). The two cases
produce files that look alike; telling them apart requires knowledge of the
mechanism, such as a second thermometer or the sensor's specification.

--

## Takeaway


<div class="takeaway">

A dataset is **$n$ draws from an unknown joint distribution** — and every way
of reading it is an assumption about how it was generated.

</div>


1. **Shape:** only record data can plausibly be read as independent rows.
2. **Table:** columns are random variables, rows are draws from
   $p(x\_1, \ldots, x\_d)$.
3. **Scale:** licenses a column's statistics and suggests its model.
4. **i.i.d.:** lets the rows factorise — to be checked, not presumed.
5. **Recorded value:** truth + artefact + noise. More data removes **noise
   only**; artefacts, outliers and missing values need a model of how they
   arose.

--

## The Churn Shop's Customer Table

| customer | contract | satisfaction | tenure (months) | postcode | churned? |
|---|---|---|---|---|---|
| 1 | monthly | 4 | 3 | 94032 | yes |
| 2 | yearly | — | 27 | 80331 | yes |
| 3 | yearly | 5 | 41 | 94032 | no |
| … | … | … | … | … | … |


<div class="fragment">


<div class="grid-2">


<div class="card">

<span class="eyebrow">Scales</span>

Contract, postcode, churned: nominal. Satisfaction: ordinal. Tenure: ratio. The
mean postcode computes — and means nothing.

</div>


<div class="card bad">

<span class="eyebrow">Why is satisfaction missing?</span>

Customers who left stop answering: 40 of 100 churners gave no rating, 45 of 900
stayers. Drop those rows, and churn falls from **10%** to **6.6%**.

</div>


</div>


</div>


Notes:
The running example as a table: the same subscription business whose app users
churn less (Lecture 01), whose gap was tested (Lecture 02) and predicted
(Lectures 04 and 06). Every earlier lecture used this table without asking what
its columns are.

The missing ratings are the lecture's point in one number. Dropping the rows
with a missing rating leaves 60 churners among 915 customers (60/915 ≈ 6.6%):
the missingness depends on the outcome itself, so the cleaned table is no longer
a sample of the customers. Ask what a plot would have shown first — the share of
missing ratings split by churned yes/no.

# Module 2
## Seeing the Data

> **Guiding Question:** Summary statistics answer the questions you thought to
> ask. What shows you the ones you did not?

--

## Visualization Is Everywhere

Newspaper tables, subway maps, weather charts, stock graphs, a 3-D
reconstruction of an injured knee, demographic bar charts, social-network
layouts.

**What do these have in common?** All of them present data in a form the eye
processes faster than the equivalent numbers.

Notes:
Question-first (P1). Let students name the common property before it is stated;
"you can see it at a glance" is the answer, and the next slide gives the reason.

--

## Why It Works


<div class="grid-3">


<div class="card">

### Bandwidth
Vision is the human sense with the highest data rate — pattern detection runs
in parallel and pre-attentively.

</div>


<div class="card">

### Interaction
A picture is a natural surface for exploring: zoom, filter, select, compare.

</div>


<div class="card">

### Discovery
Visualization surfaces the **unexpected** — the structure nobody thought to
compute a statistic for.

</div>



</div>


<div class="c-important">

Summary statistics answer questions you already asked. A plot lets the data ask
you one — which is exactly what Anscombe's quartet demonstrated.

</div>



<div class="takeaway">

Visualization is not decoration for results; it is an **instrument of
analysis**, and the only one that can show you what you did not think to
measure.

</div>


Notes:
Deliberate callback to L01 and L02 (spiral): the same argument, now with the
tools to act on it. This unit is the hinge between "data does not speak for
itself" and the concrete plot types that follow.

--

## The Boxplot

A **visual summary of a distribution built from quartiles**:


<div class="grid-3">


<div class="card">

### The box
Spans $Q\_1$ to $Q\_3$ — the interquartile range, the middle half of the data.

</div>


<div class="card">

### The line
The **median** inside the box. Its position shows skew.

</div>


<div class="card">

### The whiskers
(Tukey) Reach to the most extreme data points inside
$[Q\_1 - 1.5 \cdot \mathrm{IQR},Q\_3 + 1.5 \cdot \mathrm{IQR}]$. Points
outside are drawn singly as **outliers**.

</div>



</div>


<div class="c-note">

The 1.5 × IQR rule is a **convention**, not a test. It flags candidates for
inspection, not errors for deletion.

</div>


Notes:
Boxplots are built entirely from the quantiles the students defined in Lecture
02 — say so. Their strength is comparison: ten boxplots side by side are
readable where ten histograms are not.

--

## The Histogram


<div class="grid-2">


<div class="card">

### What it shows
The **shape** of a distribution: modality, skew, gaps and clusters that a
boxplot hides entirely.

</div>


<div class="card bad">

### What it hides
Everything depends on the **bin width**. Too wide and structure vanishes; too
narrow and noise looks like structure.

</div>



</div>


<div class="c-warning">

A bimodal distribution and a unimodal one can produce the same boxplot. Always
look at one histogram before trusting a five-number summary.

</div>


--

## Mini-Exercise

Two datasets have the same minimum, $Q\_1$, median, $Q\_3$ and maximum — so the
same boxplot. Must their histograms look alike?


<div class="fragment c-insight">

No. The five numbers fix five points; the mass between them can be arranged
freely — spread evenly inside the box, or piled into two clusters at its
edges. Same quartiles, opposite stories: Anscombe's quartet again.

</div>



<div class="fragment takeaway">

A boxplot compares distributions compactly; a histogram shows their shape.
**Neither alone is sufficient**, and the boxplot's outlier rule is a convention
you may overrule.

</div>


Notes:
If there is a minute left, let one student sketch the two-cluster version on
the board. Some tools draw the whiskers to the minimum and maximum instead of
the Tukey fences; always check which convention a plot uses.

--

## The Scatterplot

An X–Y plot of two dimensions against each other — the standard instrument for
inspecting a **relationship** rather than a distribution.

With more than two dimensions there are four options:


<div class="grid-4">


<div class="card">

### Subsetting
Let the user choose which dimensions to display.

</div>


<div class="card">

### Reduction
Project to fewer dimensions (see preprocessing, and projections later).

</div>


<div class="card">

### Embedding
Map extra dimensions to other channels: colour, size, shape.

</div>


<div class="card">

### Multiple displays
Superimpose, or juxtapose in a **scatterplot matrix**.

</div>


</div>


Notes:
The four options are exhaustive and worth memorising — every high-dimensional
visualization technique is one of them or a combination. Colour and size are
channels with far lower precision than position; use them for secondary
variables.

--

## What a Scatterplot Reveals

Linear association, non-linear structure, clusters, outliers and
heteroscedasticity — most of which no single correlation coefficient reports.


<div class="c-definition">

**Pearson correlation** $r = \dfrac{\mathrm{cov}(X, Y)}{s\_X s\_Y} \in [-1, 1]$:
the covariance measured in units of the two standard deviations. It measures
**linear** association only.

</div>



<div class="c-important">

A correlation of 0 is consistent with a perfect parabola. The scatterplot shows
it; the coefficient does not.

</div>


--

## Tufte's Principle


<div class="grid-2-1">


<div class="column">

**Maximise the data-ink ratio:** every drop of ink on the page should carry
information. Delete anything that does not — heavy gridlines, boxes, redundant
tick marks, decorative fills.

**Range frames** apply the principle to the axes: draw each axis only over the
interval the data actually spans, so the frame itself reports the minimum and
maximum.

</div>


<div class="column">


<div class="c-tip">

The exercise: take a finished chart and ask of each element, *what would I lose
by deleting this?*

</div>


</div>


</div>



<div class="takeaway">

A scatterplot shows the structure a coefficient summarises away. Beyond two
dimensions you must **subset, reduce, embed or juxtapose** — and every mark you
draw should earn its ink.

</div>


Notes:
Tufte's rule is a good design heuristic and an over-applied dogma; note that
some redundancy aids reading under time pressure. The point students should keep
is intentionality: each element defended, not each element removed.

--

## When a Line Is Justified

Connecting points with a line asserts an **order** between them — and often an
interpolation.


<div class="c-definition">

**Data requirement:** one or more quantitative value attributes on a comparable
scale, plus one **ordered** key attribute (usually time).

</div>



<div class="c-warning">

Connecting nominal categories with a line claims an order that does not exist.
The line is a statement, not a decoration.

</div>


Notes:
This is the attribute-types unit paying off immediately: the permissible plot
follows from the scale of the key attribute. Bar charts for nominal, lines for
ordered.

--

## Aspect Ratio Is Not Cosmetic


<div class="grid-2-1">


<div class="column">

Readers compare trends by the **orientation** of the line segments, so the
shape of the plotting area changes what they conclude. The same series looks
flat in a wide frame and dramatic in a tall one.

**Banking to 45°** chooses the aspect ratio so that the segments' average
absolute orientation is 45°: differences in orientation are judged best near
±45° (Cleveland et al. 1988).

</div>


<div class="column">


<div class="card">

### Additional channels
Colour and line type distinguish series — but only for a handful of them.

</div>


</div>


</div>


--

## Multiple Series


<div class="grid-3">


<div class="card">

### Overlaid
Best for comparing a few series directly against each other.

</div>


<div class="card">

### Stacked
Each series is drawn on top of the previous one. Shows the total well — and
makes individual series **hard to read**, since each sits on a moving baseline.

</div>


<div class="card">

### Sorted / small multiples
One panel per series, ordered by some property. Scales to many series where
overlaying fails.

</div>


</div>



<div class="takeaway">

A line asserts order and interpolation; the **aspect ratio** decides what the
reader sees and stacking trades the readability of the parts for the
readability of the whole.

</div>


Notes:
The stacked-plot critique is worth demonstrating: ask students to read the
third band's trend off a stacked chart — they cannot, because the baseline
moves. Small multiples are the usual better answer.

---

# Module 3
## Preprocessing

> **Guiding Question:** Lecture 01 claimed that preprocessing is modelling.
> Which choices made here change what a model can learn?

--

## Aggregation

Combine several objects or attributes into one — customer purchases summarised
by store, by month, by price band.


<div class="grid-2">


<div class="card good">

### Gains
Fewer objects to process; **less variation**, hence more stable estimates; the
natural operation of a data warehouse.

</div>


<div class="card bad">

### Costs
Detail is gone, irreversibly. Effects that exist only within a group become
invisible.

</div>


</div>


Notes:
Aggregation is where Simpson's paradox lives: a trend can reverse when groups
are pooled. Worth one sentence — students will meet it in dashboards long
before they meet it in a statistics course.

--

## Sampling


<div class="grid-2-1">


<div class="column">

Work with a subset of the objects: random sampling with or without replacement,
or **stratified** sampling that preserves group proportions.

Sampling always loses information. The question is whether it loses anything
that matters — a sufficiently large sample retains the overall structure.

</div>


<div class="column">


<div class="c-note">

Sample a sine wave once per period and every sample has the same value: the
reconstruction is a flat line — not merely rougher, but **wrong**.

</div>


</div>


</div>


Notes:
The sine example is aliasing: too sparse a sample does not blur a pattern, it
produces a different one. The same holds for customer data sampled once a
month when the behaviour of interest is weekly.

--

## Scaling and Encoding


<div class="grid-2">


<div class="card">

### Scaling numeric attributes
Min–max: $x' = \dfrac{x - \min}{\max - \min} \in [0, 1]$

Standardisation: $z = \dfrac{x - \bar{x}}{s}$ — mean 0, standard deviation 1

</div>


<div class="card">

### Encoding categorical attributes
**Nominal** → one-hot: one 0/1 column per value, so no false order.

**Ordinal** → ranks $1, 2, 3, \ldots$, which keep the order.

</div>


</div>



<div class="c-warning">

Two customers differ by 1,000 € in income and 30 years in age. Unscaled, their
distance is $\approx 1{,}000$: age is invisible. Standardised ($s = 10{,}000$ €
and $15$ years) the differences are $0.1$ and $2$ — now age dominates.

</div>


Notes:
Scaling is a modelling decision in the sense of this lecture: it decides which
attribute a distance listens to. It matters for every distance-based method
(clustering, nearest neighbours) and for PCA, which would otherwise find "the
direction of income". Encoding nominal values as 1, 2, 3 invents an order and
a distance between categories; one-hot avoids it at the cost of more columns.
Exact numbers: √(1000² + 30²) ≈ 1000.4 and √(0.1² + 2²) ≈ 2.0.

--

## Dimensionality Reduction


<div class="c-definition">

**The curse of dimensionality.** As the number of attributes grows, the data
becomes sparse: distances between points concentrate, neighbourhoods lose
meaning, and the volume to be covered grows exponentially.

</div>



<div class="grid-3">


<div class="card">

### The problem
Many features are irrelevant, noisy or correlated.

</div>


<div class="card">

### The cost
More computation, more parameters, more variance — and weaker distance-based
methods.

</div>


<div class="card">

### The response
**Feature selection** keeps a subset; **feature extraction** builds new
combined dimensions.

</div>


</div>



<div class="takeaway">

Every preprocessing step **trades information for tractability**. The trade is
usually worth it — but it is a modelling decision, and it should be recorded as
one.

</div>


Notes:
Point forward: projections (PCA, MDS) are the formal treatment of feature
extraction, and clustering suffers directly from the curse — and from unscaled
attributes. This unit is the
motivation both later lectures rely on.
