# Module 1
## What a Projection Preserves

> **Guiding Question:** Reducing dimensions must lose information. Which
> information do you choose to keep?

--

## Seeing High-Dimensional Data

A **geometric projection** maps high-dimensional data onto a low-dimensional
space — usually 2-D or 3-D, so that it can be plotted and reasoned about.


<div class="grid-2">


<div class="card">

### Linear projections
$$\mathbf{z} = \mathbf{P} \mathbf{x}$$
A matrix $\mathbf{P}$ maps every point. Distortion is global and predictable,
and each new axis is a weighted sum of the old ones. A *reducing* $\mathbf{P}$ is
not invertible: what it drops cannot be recovered.

</div>


<div class="card">

### Non-linear projections
No single matrix. Methods such as **t-SNE** and **UMAP** keep **local
neighbourhoods** — who is near whom — at the price of global distances. Often
more faithful visually, harder to interpret.

</div>



</div>


<div class="c-important">

**The central question of the chapter:** how do we find the *best* projection —
and by which criterion is one projection better than another?

</div>


Notes:
Guiding question (P1). Every method that follows answers it differently: random
projection says "any projection, with a guarantee", PCA says "the one keeping
most variance", MDS says "the one preserving distances". Naming the criterion is
naming the method.

--

## What Is Necessarily Lost

Reducing dimensions **must** lose information — the question is only which.


<div class="grid-3">


<div class="card">

### Variance
PCA keeps as much of it as a linear map can.

</div>


<div class="card">

### Distances
MDS keeps pairwise distances as faithfully as possible.

</div>


<div class="card">

### Guarantees
Random projection keeps distances within a provable error, cheaply.

</div>


</div>



<div class="takeaway">

A projection is defined by **what it chooses to preserve**. There is no
best-in-general projection, only a best one for a stated criterion.

</div>


--

## The Surprising Result


<div class="c-definition">

**Johnson–Lindenstrauss lemma.** For any $0 < \epsilon < 1$ and $n$ points in
any dimension, a projection onto
$$
d = O\left(\frac{\log n}{\epsilon^{2}}\right)
$$
dimensions exists that preserves all pairwise distances to within a factor
$1 \pm \epsilon$.

</div>



<div class="c-insight">

The target dimension depends on the **number of points** and on the accuracy
wanted — **not on the original dimensionality**. A million-dimensional dataset
and a thousand-dimensional one need the same target dimension.

</div>


Notes:
This is genuinely counterintuitive and worth pausing on. It says high-dimensional
data is "thinner" than it looks: n points span at most n−1 dimensions, and
approximate distances need far fewer.

--

## Construction


<div class="c-algorithm">

1. Draw a $d \times p$ matrix $\mathbf{R}$ with entries sampled independently
 (Gaussian, or $\pm 1$ with equal probability).
2. Project: $\mathbf{z} = \frac{1}{\sqrt{d}} \mathbf{R} \mathbf{x}$.

</div>



<div class="c-note">

With $d$ as in the lemma, such a random $\mathbf{R}$ meets the $1 \pm \epsilon$
bound **with high probability** — the lemma's projection can simply be drawn.

</div>


--

## Properties and Limits


<div class="grid-2">


<div class="card good">

### Properties
No training, no data pass — the matrix does not depend on the data at all.
Extremely fast, trivially applied to new points, and it comes with a bound.

</div>


<div class="card bad">

### Limits
The axes are meaningless, so the result is not interpretable. It preserves
distances, not structure, and works best when $d$ is not too small.

</div>


</div>



<div class="takeaway">

Random projection preserves distances **with a guarantee and without looking at
the data**. Use it when you need speed and a bound; use PCA when you need
meaning.

</div>

# Module 2
## Principal Component Analysis

> **Guiding Question:** PCA keeps the directions of largest variance. When is
> variance the wrong thing to keep?

--

## Which Direction Matters?

A cloud stretched along a diagonal: projected onto the **short** axis it
collapses into a blob; onto the **long** axis its points stay apart.


<div class="c-important">

**PCA's criterion:** the 1st component is the direction of **maximum
variance**; each further one takes the most *remaining* variance, **orthogonal**
to all before it.

</div>



<div class="c-note">

The first $m$ components are the **best $m$-dimensional linear approximation**:
most variance kept = least squared reconstruction error.

</div>



<div class="takeaway">

PCA keeps the directions of highest **variance**. Its assumption — variance is
information — makes it powerful, and makes it fail.

</div>


Notes:
Intuition first (P4). The equivalence in the note is Pythagoras: for centred
data, each point's squared length splits into the part kept by the projection
and the part lost, so maximising one minimises the other. Ask whether "most
variance" always means "most interesting" — it does not: for classification,
the discriminating direction may have small variance. That caveat returns in the
mini-exercise of the algorithm unit.

--

## Covariance Is the Object to Diagonalise

For centred data $\mathbf{X}$, the **covariance matrix**

$$
\mathbf{C} = \frac{1}{n-1} \mathbf{X}^{\top}\mathbf{X}
$$

holds the variance of each attribute on its diagonal and the covariance of each
pair off it.


<div class="grid-2">


<div class="card">

### Large diagonal entry
That attribute varies a lot — potentially informative.

</div>


<div class="card">

### Large off-diagonal entry
Two attributes are **redundant**: one partly predicts the other.

</div>



</div>


<div class="c-important">

The goal: find new axes in which the covariance matrix is **diagonal** — no
redundancy left between components — and order them by variance.

</div>


Notes:
Framing PCA as "remove redundancy, keep variation" makes the covariance matrix
the natural object. It also connects directly to the joint-distribution unit
from Lecture 02, where covariance was introduced.

--

## The Solution


<div class="c-definition">

The directions that diagonalise $\mathbf{C}$ are its **eigenvectors**; the
variance captured by each is the corresponding **eigenvalue**.

Sorting eigenvectors by descending eigenvalue gives the principal components,
and the projection matrix $\mathbf{W}\_m$ holds the top $m$ of them.

</div>



<div class="c-note">

$\mathbf{C}$ is symmetric, so its eigenvectors are orthogonal: the components are
**uncorrelated by construction**. The share of total variance in component $i$
is its **explained variance** $\lambda\_i / \sum\_j \lambda\_j$.

</div>


Notes:
The explained-variance ratio is the practical output students will actually use
— it is what a scree plot shows and how "how many components?" gets answered.

--

## A Two-Attribute Example

Two attributes in the same unit, each with variance 2, covariance 1:

$$
\mathbf{C} = \begin{pmatrix} 2 & 1 \\\ 1 & 2 \end{pmatrix}, \qquad
\mathbf{C}\begin{pmatrix} 1 \\\ 1 \end{pmatrix} = 3\begin{pmatrix} 1 \\\ 1 \end{pmatrix}, \qquad
\mathbf{C}\begin{pmatrix} 1 \\\ -1 \end{pmatrix} = 1\begin{pmatrix} 1 \\\ -1 \end{pmatrix}
$$

| component | direction | eigenvalue | explained variance |
|---|---|---|---|
| PC1 | $(1, 1)/\sqrt{2}$ — "both together" | $\lambda\_1 = 3$ | $3/4 = 75\\%$ |
| PC2 | $(1, -1)/\sqrt{2}$ — "one against the other" | $\lambda\_2 = 1$ | $1/4 = 25\\%$ |


<div class="takeaway">

PCA is the **eigendecomposition of the covariance matrix**: eigenvectors give
the directions, eigenvalues give their importance, and the top ones are kept.

</div>


Notes:
Check by multiplication, no characteristic polynomial needed: C·(1,1) = (3,3),
C·(1,−1) = (1,−1). The eigenvalues sum to the trace, 2 + 2 = 4, which is the
total variance — that is why the shares are 3/4 and 1/4. Keeping only PC1 loses
a quarter of the variance; the positive covariance is what tilts PC1 onto the
diagonal. With covariance 0 both eigenvalues would be 2 and no direction would
be preferred.

--

## The Procedure


<div class="c-algorithm">

1. **Centre** the data; **standardise** it if the units differ.
2. Compute the covariance matrix $\mathbf{C}$.
3. Compute its eigenvectors and eigenvalues.
4. Sort by descending eigenvalue; keep the top $m$.
5. Project: $\mathbf{Z} = \mathbf{X} \mathbf{W}\_m$.

</div>



<div class="c-warning">

**Centring is not optional**: the covariance formula assumes it. **Standardising
is a choice** — make it when units differ. Otherwise an attribute in metres
dominates one in kilometres purely through its **unit**, and PCA reports the
choice of unit as the principal direction.

</div>


Notes:
Also known as the discrete Karhunen–Loève transform. The standardisation trap is
the single most common practical error and worth stating as a rule: always ask
what the units are before running PCA. When all attributes share a unit (pixel
intensities, say), standardising can hurt: it inflates directions that are mostly
noise.

--

## Choosing the Number of Components

A **scree plot** shows eigenvalues in descending order; the usual reading is the
same elbow heuristic as for choosing $k$ in clustering, or a cumulative
explained-variance threshold (80%, 95%).


<div class="grid-2">


<div class="card good">

### Benefits
Removes correlated and noisy directions; speeds up downstream methods; makes
2-D visualisation possible; components are uncorrelated by construction.

</div>


<div class="card bad">

### Drawbacks
Components are **linear combinations of all attributes**, so interpretability is
lost. Only **linear** structure is captured. And variance is assumed to equal
importance — which for classification can be false.

</div>


</div>


--

## Mini-Exercise

You run PCA on the standardised iris data; the first two components explain 96%
of the variance.


<div class="q">

Are these two components therefore good features for telling the species apart?

</div>



<div class="fragment">

**Not necessarily.** 96% says a 2-D picture loses only 4% of the variation. PCA
never saw the labels: it optimises reconstruction, and the species may differ
along a thin, low-variance direction.

</div>



<div class="takeaway fragment">

PCA is centre → covariance → eigendecomposition → keep the top components. It
optimises **reconstruction**, not discrimination; centring is mandatory,
standardising a choice made by the units.

</div>


--

## Points and Variables in One Picture

A **biplot** overlays two things on the same axes:


<div class="grid-2">


<div class="card">

### The objects
Each data point, plotted by its scores on the first two components — an ordinary
scatterplot of the projection.

</div>


<div class="card">

### The variables
Each original attribute drawn as an **arrow**: its loading on the two
components. Direction shows what the attribute contributes to, length shows how
strongly.

</div>


</div>



<div class="c-tip">

A biplot is how you recover interpretability after PCA has destroyed it: the
arrows say what the anonymous components *mean* in terms of the original
attributes.

</div>


Notes:
Worth demonstrating on any two-component PCA: students can immediately name PC1
("overall size") and PC2 ("shape") from the arrow pattern, which no eigenvalue
table conveys.

--

## Reading the Arrows

| arrows | the two attributes are |
|---|---|
| pointing together | positively correlated |
| pointing in opposite directions | negatively correlated |
| at about 90° | roughly uncorrelated |
| long | well represented by the two components |
| short | mostly outside the plotted plane — do not read its angles |


<div class="takeaway">

The biplot answers "what do these axes mean?" by drawing the original attributes
into the projected space — points and variables read together.

</div>


Notes:
The angle reading is exact only for the part of each attribute that lies in the
plane of the first two components; on standardised data with most variance in
two components it approximates the correlation well. A short arrow is the
warning sign: that attribute lives mainly in the discarded components.

--

## The Churn Shop: What Does PC1 Mean?

Four customer attributes: tenure, annual spend, app logins, support tickets.
A biplot of the standardised table might show:


<div class="grid-2">


<div class="card">

<span class="eyebrow">The arrows</span>

Tenure, spend and logins point **together** along PC1; tickets points the
**other way**.

</div>


<div class="card">

<span class="eyebrow">The reading</span>

PC1 is something like **engagement**, and the customers who churned sit at its
low end.

</div>


</div>



<div class="fragment">


<div class="c-warning">

Unstandardised, spend in euros has by far the largest variance, and PC1 is
simply **spend**. Standardising decides what PC1 can mean — Lecture 08's
scaling choice again.

</div>


</div>


Notes:
The running example, one last time; the arrow pattern is illustrative, not
computed from a real table. The name "engagement" is our interpretation of the
arrows, not something PCA found: the method only keeps the direction of largest
variance. Ask whether PC1 is the direction that best separates churners from
stayers — not necessarily: PCA never saw the churn label (variance is not
discrimination, as the map says).

# Module 3
## Beyond Variance

> **Guiding Question:** Some objects have no coordinates — only similarities.
> Can they still be mapped?

--

## A Different Criterion

PCA needs coordinates and preserves **variance**. MDS needs only a
**dissimilarity matrix** and preserves **the distances themselves**.


<div class="c-definition">

Given pairwise dissimilarities $d\_{ij}$, find low-dimensional points
$\mathbf{z}\_1, \ldots, \mathbf{z}\_n$ minimising Kruskal's **stress-1**
$$
S = \sqrt{\frac{\sum\_{i < j}\big(\lVert \mathbf{z}\_i - \mathbf{z}\_j \rVert - d\_{ij}\big)^{2}}{\sum\_{i < j} d\_{ij}^{2}}}
$$

</div>



<div class="c-insight">

This is the projection method for objects that have **no coordinates at all** —
only a dissimilarity: documents, molecules, survey respondents, perceived
similarity ratings turned into distances.

</div>


Notes:
The denominator makes stress-1 scale-free: measuring in metres or kilometres
gives the same value, so it can be compared across datasets (rules of thumb
read 0.05 as good, 0.2 as poor). The distance-matrix-only requirement is the same property that made HAC
applicable to non-vector data. Point at that parallel — it is the second time
this course uses "all I need is a (dis)similarity".

--

## Classical MDS and Its Relatives


<div class="grid-2">


<div class="card">

### Classical (metric) MDS
Solved in closed form by an eigendecomposition of the (double-centred) squared
distance matrix. With Euclidean distances it is **equivalent to PCA**.

</div>


<div class="card">

### Non-metric MDS
Preserves only the **rank order** of distances. Suited to ordinal similarity
data — "A is more like B than like C" — where the numbers are not meaningful.

</div>


</div>


--

## Reading the Result


<div class="grid-2">


<div class="card">

### Stress tells you the cost
A 2-D map of genuinely high-dimensional structure has high stress: the picture
is a compromise, and the number says how big a one.

</div>


<div class="card bad">

### Axes mean nothing
Unlike PCA components, MDS axes have no interpretation — only **relative
positions** carry information. Rotations and reflections are equivalent.

</div>


</div>



<div class="takeaway">

MDS preserves **distances** rather than variance, works from a dissimilarity matrix
alone, and produces a map whose axes are meaningless but whose **neighbourhoods
are faithful** — as far as the stress allows.

</div>


Notes:
The "axes mean nothing" warning matters because students read MDS plots like
scatterplots. Insist that only the pattern of proximity may be interpreted.

--

## The Problem With Matching Words

A document is represented as a vector of term counts — the **term–document
matrix**. Similarity is then the overlap of vocabulary, which fails twice:


<div class="grid-2">


<div class="card bad">

### Synonymy
"car" and "automobile" never match, though the documents are about the same
thing.

</div>


<div class="card bad">

### Polysemy
"bank" matches across finance and rivers, though the documents are unrelated.

</div>



</div>


<div class="c-important">

The vocabulary is the wrong space. We want a space of **concepts**, in which
related terms lie close together.

</div>


Notes:
The two failures are the motivation for every embedding method that followed,
right up to modern language models. Say so — students recognise the problem
statement from tools they use.

--

## The Approach


<div class="c-definition">

Apply a **singular value decomposition** to the term–document matrix
$\mathbf{A}$:
$$
\mathbf{A} \approx \mathbf{U}\_k \boldsymbol{\Sigma}\_k \mathbf{V}\_k^{\top}
$$
and keep the $k$ largest singular values. Documents and terms are both
represented in the resulting $k$-dimensional **latent space**.

</div>



<div class="c-note">

SVD is PCA's underlying machinery applied to a rectangular matrix — the same
"keep the strongest directions" idea, on term–document data (usually without
centring).

</div>


--

## What the Latent Space Buys


<div class="grid-3">


<div class="card">

### Dimension reduction
Thousands of terms collapse to a few hundred latent dimensions.

</div>


<div class="card">

### Synonyms merge
Terms that co-occur with the same contexts end up close together.

</div>


<div class="card">

### Noise drops
Rare, idiosyncratic usage lives in the discarded small singular values.

</div>


</div>



<div class="takeaway">

LSA projects documents and terms into a shared **latent space** via SVD, so that
similarity survives synonymy. It is dimensionality reduction used as a
representation, not just as compression.

</div>


Notes:
Connect forward honestly: modern embeddings solve the same problem with learned,
non-linear, context-sensitive representations — but the objective LSA states is
still recognisable in them.

      const avail = SLIDE_H - used - EDGE;
      if (avail <= 80) return;                       // no room: leave the CSS cap

      let width = Math.min(SLIDE_W - 2 * EDGE, aspect * avail);
      svg.style.maxWidth = Math.floor(width) + "px";

      // The estimate above ignores the figure's own margins and any rounding,
      // so grow first and then pull back until the slide genuinely fits. Two
      // or three passes settle it; the guard stops a pathological loop.
      for (let k = 0; k < 6; k++) {
        const over = sec.scrollHeight - SLIDE_H;
        if (over <= 0) break;
        width -= aspect * (over + 6);
        if (width < 240) { width = 240; svg.style.maxWidth = "240px"; break; }
        svg.style.maxWidth = Math.floor(width) + "px";
      }
    }

    // How much of the canvas the content actually uses. scrollHeight cannot
    // answer this: the theme lays a rendered slide out at the full 720px, so it
    // reads 720 whatever the content is — and reads 0 while the slide is
    // display:none. Measuring the children works in both states.
    function contentHeight(sec) {
      const s = scale();
      let used = 0;
      for (const child of sec.children) {
        if (child.tagName === "ASIDE") continue;
        const h = child.getBoundingClientRect().height;
        if (!h) continue;
        used += h / s + PER_CHILD;
      }
      return used;
    }

    function fit() {
      for (const sec of document.querySelectorAll(".reveal .slides section")) {
        if (sec.querySelector("section")) continue;              // stack wrapper
        if (sec.classList.contains("title-slide")) continue;
        if (sec.classList.contains("module-slide")) continue;
        fitFigure(sec);
        const used = contentHeight(sec);
        // A hidden slide measures 0; leave its class alone rather than
        // centring everything off-screen. It is measured when it becomes
        // current, since fit() runs on every slidechanged.
        if (used === 0) continue;
        sec.classList.remove("v-center");
        if (SLIDE_H - used > MIN_FREE) {
          sec.classList.add("v-center");
          // Child rectangles exclude margins, so a slide whose blocks are
          // generously spaced measures smaller than it lays out. Under
          // .v-center the section is exactly SLIDE_H tall, which makes
          // scrollHeight an exact overflow test — take the centring back if
          // it pushed anything past the bottom edge.
          if (sec.scrollHeight > SLIDE_H) sec.classList.remove("v-center");
        }
      }
    }

    const start = () => {
      fit();
      window.Reveal?.on?.("slidechanged", fit);
      window.Reveal?.on?.("resize", fit);
      setTimeout(fit, 1200);                 // visualizations mount asynchronously
    };
    if (window.Reveal?.isReady?.()) start();
    else window.Reveal?.on("ready", start);
  })();
})();</script></body></html>
