<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="aarrow" markerWidth="11" markerHeight="11" refX="7" refY="3.2" orient="auto">
      <path d="M0 0 L8 3.2 L0 6.4 z" fill="#164374"/>
    </marker>
  </defs>

  <text x="480" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#164374">Agent = LLM + Tools + Memory</text>

  <!-- LLM core -->
  <circle cx="480" cy="300" r="100" fill="#164374"/>
  <text x="480" y="295" text-anchor="middle" font-size="30" fill="#fff" font-weight="700">LLM</text>
  <text x="480" y="325" text-anchor="middle" font-size="16" fill="#cde7ee">reason &amp; plan</text>

  <!-- loop arrows around the core -->
  <g fill="none" stroke="#164374" stroke-width="3">
    <path d="M480 170 A 130 130 0 0 1 610 300" marker-end="url(#aarrow)"/>
    <path d="M610 300 A 130 130 0 0 1 480 430" marker-end="url(#aarrow)"/>
    <path d="M480 430 A 130 130 0 0 1 350 300" marker-end="url(#aarrow)"/>
    <path d="M350 300 A 130 130 0 0 1 480 170" marker-end="url(#aarrow)"/>
  </g>
  <g font-size="15" fill="#0F5F87" font-weight="700" text-anchor="middle">
    <text x="610" y="195">observe</text>
    <text x="640" y="430">act</text>
    <text x="330" y="430">reason</text>
    <text x="330" y="195">plan</text>
  </g>

  <!-- Tools -->
  <rect x="720" y="130" width="200" height="120" rx="12" fill="#0083A1"/>
  <text x="820" y="170" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">Tools</text>
  <text x="820" y="200" text-anchor="middle" font-size="15" fill="#e8f6f9">calculator · search</text>
  <text x="820" y="222" text-anchor="middle" font-size="15" fill="#e8f6f9">code · APIs</text>
  <line x1="718" y1="225" x2="575" y2="270" stroke="#0083A1" stroke-width="3"/>

  <!-- Memory -->
  <rect x="720" y="350" width="200" height="120" rx="12" fill="#2B6054"/>
  <text x="820" y="390" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">Memory</text>
  <text x="820" y="420" text-anchor="middle" font-size="15" fill="#e6f2ee">notes · history</text>
  <text x="820" y="442" text-anchor="middle" font-size="15" fill="#e6f2ee">retrieved knowledge</text>
  <line x1="718" y1="410" x2="575" y2="335" stroke="#2B6054" stroke-width="3"/>

  <!-- Goal in -->
  <rect x="40" y="240" width="180" height="120" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
  <text x="130" y="285" text-anchor="middle" font-size="20" fill="#164374" font-weight="700">Goal</text>
  <text x="130" y="312" text-anchor="middle" font-size="14" fill="#333">a task in</text>
  <text x="130" y="332" text-anchor="middle" font-size="14" fill="#333">natural language</text>
  <line x1="222" y1="300" x2="375" y2="300" stroke="#164374" stroke-width="3" marker-end="url(#aarrow)"/>
</svg>
