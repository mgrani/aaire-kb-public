<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" role="img" aria-labelledby="title desc">
  <title id="title">Agentic search flow</title>
  <desc id="desc">An agent takes a user task and runs an iterative loop of plan, retrieve, check, and refine — calling tools and memory — until it produces an answer.</desc>
  <defs>
    <marker id="arrow-teal" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#0083A1"/>
    </marker>
    <marker id="arrow-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#2B6054"/>
    </marker>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill: #333333; }
      .title-text { font-size: 22px; font-weight: 700; fill: #0083A1; }
      .subtitle { font-size: 13px; font-style: italic; fill: #555555; }
      .box-title { font-size: 15px; font-weight: 700; fill: #0083A1; }
      .green-text { font-size: 13px; font-weight: 600; fill: #2B6054; }
      .caption { font-size: 13px; fill: #555555; }
      .user-label { font-size: 13px; fill: #333333; }
      .cycle-hint { font-size: 11px; font-style: italic; fill: #0083A1; }
    </style>
  </defs>

  <rect width="520" height="280" fill="#ffffff"/>
  <rect x="20" y="18" width="480" height="244" rx="12" fill="#f7f9fb" stroke="#E7E6E6" stroke-width="2"/>

  <text x="260" y="44" text-anchor="middle" class="label title-text">Agentic search</text>
  <text x="260" y="64" text-anchor="middle" class="label subtitle">iterative loop: plan, retrieve, check, refine, answer</text>

  <!-- Tools / memory pill (above retrieve) -->
  <rect x="222" y="78" width="90" height="26" rx="13" fill="#F4F8F5" stroke="#2B6054" stroke-width="2"/>
  <text x="267" y="96" text-anchor="middle" class="label green-text">tools · memory</text>

  <!-- User task (left) -->
  <g fill="none" stroke="#0083A1" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="48" cy="149" r="12"/>
    <path d="M28 187 C31 165, 65 165, 68 187"/>
  </g>
  <text x="48" y="212" text-anchor="middle" class="label user-label">user task</text>

  <!-- Cycle: plan (TL), retrieve (TR), check (BR), refine (BL) -->
  <rect x="110" y="130" width="85" height="38" rx="8" fill="#ffffff" stroke="#0083A1" stroke-width="2"/>
  <text x="152" y="154" text-anchor="middle" class="label box-title">plan</text>

  <rect x="225" y="130" width="85" height="38" rx="8" fill="#ffffff" stroke="#0083A1" stroke-width="2"/>
  <text x="267" y="154" text-anchor="middle" class="label box-title">retrieve</text>

  <rect x="225" y="192" width="85" height="38" rx="8" fill="#ffffff" stroke="#0083A1" stroke-width="2"/>
  <text x="267" y="216" text-anchor="middle" class="label box-title">check</text>

  <rect x="110" y="192" width="85" height="38" rx="8" fill="#ffffff" stroke="#0083A1" stroke-width="2"/>
  <text x="152" y="216" text-anchor="middle" class="label box-title">refine</text>

  <!-- Answer box (right) -->
  <rect x="355" y="192" width="115" height="38" rx="8" fill="#F2FAFC" stroke="#0083A1" stroke-width="2"/>
  <text x="412" y="216" text-anchor="middle" class="label box-title">answer</text>

  <!-- Cycle hint (centered between the four boxes) -->
  <text x="210" y="184" text-anchor="middle" class="label cycle-hint">↻ loop</text>

  <!-- Cycle arrows (clockwise) — land on box edges -->
  <line x1="195" y1="149" x2="225" y2="149" stroke="#0083A1" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <line x1="267" y1="168" x2="267" y2="192" stroke="#0083A1" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <line x1="225" y1="211" x2="195" y2="211" stroke="#0083A1" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <line x1="152" y1="192" x2="152" y2="168" stroke="#0083A1" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- Tools / memory → retrieve (vertical, into top edge) -->
  <line x1="267" y1="104" x2="267" y2="130" stroke="#2B6054" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>

  <!-- User task → plan (horizontal, same baseline as top of cycle) -->
  <line x1="68" y1="149" x2="110" y2="149" stroke="#0083A1" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- Check → answer (horizontal, same baseline as bottom of cycle) -->
  <line x1="310" y1="211" x2="355" y2="211" stroke="#0083A1" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <text x="260" y="252" text-anchor="middle" class="label caption">tools and memory feed the loop; the agent stops when evidence is enough</text>
</svg>
