<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Arial, Helvetica, sans-serif">
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#164374">How the agents are wired together</text>

  <g stroke="#A5A5A5" stroke-width="2.5" fill="none"></g>

  <!-- Panel 1: Centralized (hub & spokes) -->
  <g>
    <text x="120" y="80" text-anchor="middle" font-size="17" fill="#0F5F87" font-weight="700">Centralized</text>
    <g stroke="#A5A5A5" stroke-width="2.5">
      <line x1="120" y1="180" x2="60" y2="130"/>
      <line x1="120" y1="180" x2="180" y2="130"/>
      <line x1="120" y1="180" x2="60" y2="240"/>
      <line x1="120" y1="180" x2="180" y2="240"/>
    </g>
    <circle cx="120" cy="180" r="20" fill="#164374"/>
    <circle cx="60" cy="130" r="13" fill="#0083A1"/>
    <circle cx="180" cy="130" r="13" fill="#0083A1"/>
    <circle cx="60" cy="240" r="13" fill="#0083A1"/>
    <circle cx="180" cy="240" r="13" fill="#0083A1"/>
    <text x="120" y="295" text-anchor="middle" font-size="13" fill="#555">one coordinator</text>
  </g>

  <!-- Panel 2: Decentralized (mesh) -->
  <g>
    <text x="360" y="80" text-anchor="middle" font-size="17" fill="#0F5F87" font-weight="700">Decentralized</text>
    <g stroke="#A5A5A5" stroke-width="2.5">
      <line x1="310" y1="130" x2="410" y2="130"/>
      <line x1="310" y1="130" x2="310" y2="240"/>
      <line x1="410" y1="130" x2="410" y2="240"/>
      <line x1="310" y1="240" x2="410" y2="240"/>
      <line x1="310" y1="130" x2="410" y2="240"/>
      <line x1="410" y1="130" x2="310" y2="240"/>
    </g>
    <circle cx="310" cy="130" r="14" fill="#0083A1"/>
    <circle cx="410" cy="130" r="14" fill="#0083A1"/>
    <circle cx="310" cy="240" r="14" fill="#0083A1"/>
    <circle cx="410" cy="240" r="14" fill="#0083A1"/>
    <text x="360" y="295" text-anchor="middle" font-size="13" fill="#555">peer to peer</text>
  </g>

  <!-- Panel 3: Layered (hierarchy) -->
  <g>
    <text x="600" y="80" text-anchor="middle" font-size="17" fill="#0F5F87" font-weight="700">Layered</text>
    <g stroke="#A5A5A5" stroke-width="2.5">
      <line x1="600" y1="120" x2="555" y2="185"/>
      <line x1="600" y1="120" x2="645" y2="185"/>
      <line x1="555" y1="185" x2="525" y2="245"/>
      <line x1="555" y1="185" x2="585" y2="245"/>
      <line x1="645" y1="185" x2="615" y2="245"/>
      <line x1="645" y1="185" x2="675" y2="245"/>
    </g>
    <circle cx="600" cy="120" r="15" fill="#164374"/>
    <circle cx="555" cy="185" r="12" fill="#0083A1"/>
    <circle cx="645" cy="185" r="12" fill="#0083A1"/>
    <circle cx="525" cy="245" r="10" fill="#6C9A9A"/>
    <circle cx="585" cy="245" r="10" fill="#6C9A9A"/>
    <circle cx="615" cy="245" r="10" fill="#6C9A9A"/>
    <circle cx="675" cy="245" r="10" fill="#6C9A9A"/>
    <text x="600" y="295" text-anchor="middle" font-size="13" fill="#555">hierarchy</text>
  </g>

  <!-- Panel 4: Shared message pool (blackboard) -->
  <g>
    <text x="840" y="80" text-anchor="middle" font-size="17" fill="#0F5F87" font-weight="700">Shared pool</text>
    <rect x="795" y="160" width="90" height="40" rx="6" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="840" y="185" text-anchor="middle" font-size="11" fill="#164374">message pool</text>
    <g stroke="#A5A5A5" stroke-width="2.5">
      <line x1="800" y1="130" x2="815" y2="158"/>
      <line x1="880" y1="130" x2="865" y2="158"/>
      <line x1="800" y1="240" x2="815" y2="202"/>
      <line x1="880" y1="240" x2="865" y2="202"/>
    </g>
    <circle cx="800" cy="130" r="13" fill="#0083A1"/>
    <circle cx="880" cy="130" r="13" fill="#0083A1"/>
    <circle cx="800" cy="240" r="13" fill="#0083A1"/>
    <circle cx="880" cy="240" r="13" fill="#0083A1"/>
    <text x="840" y="295" text-anchor="middle" font-size="13" fill="#555">shared blackboard</text>
  </g>

  <text x="480" y="355" text-anchor="middle" font-size="15" fill="#555">Familiar from human organisations: a manager, a flat team, a hierarchy, or a shared workspace.</text>
</svg>
