<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Arial, Helvetica, sans-serif">
  <rect x="40" y="60" width="880" height="450" rx="16" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#164374">A 2D map of meaning — related words sit close together</text>

  <!-- axes hint -->
  <line x1="70" y1="490" x2="70" y2="90" stroke="#A5A5A5" stroke-width="1.5"/>
  <line x1="70" y1="490" x2="900" y2="490" stroke="#A5A5A5" stroke-width="1.5"/>
  <text x="60" y="100" font-size="13" fill="#888" transform="rotate(-90 60 100)">feature 2</text>
  <text x="860" y="508" font-size="13" fill="#888">feature 1</text>

  <!-- region: water/nature -->
  <ellipse cx="240" cy="190" rx="150" ry="95" fill="#0083A1" opacity="0.12"/>
  <text x="240" y="130" text-anchor="middle" font-size="15" fill="#00799A" font-weight="700">WATER / NATURE</text>
  <g font-size="18" fill="#0F5F87" text-anchor="middle">
    <text x="180" y="190">river</text>
    <text x="285" y="170">stream</text>
    <text x="250" y="235">shore</text>
  </g>

  <!-- region: finance -->
  <ellipse cx="720" cy="360" rx="160" ry="100" fill="#2B6054" opacity="0.12"/>
  <text x="720" y="295" text-anchor="middle" font-size="15" fill="#2B6054" font-weight="700">FINANCE / MONEY</text>
  <g font-size="18" fill="#2B6054" text-anchor="middle">
    <text x="660" y="360">money</text>
    <text x="775" y="345">loan</text>
    <text x="720" y="405">account</text>
  </g>

  <!-- ambiguous word bank between regions -->
  <circle cx="480" cy="280" r="9" fill="#164374"/>
  <text x="480" y="262" text-anchor="middle" font-size="19" fill="#164374" font-weight="700">bank</text>
  <text x="480" y="320" text-anchor="middle" font-size="14" fill="#7c3aed">(ambiguous — which region?)</text>
</svg>
