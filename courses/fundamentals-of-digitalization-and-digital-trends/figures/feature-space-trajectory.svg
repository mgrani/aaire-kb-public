<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="tarrow" markerWidth="11" markerHeight="11" refX="7" refY="3.2" orient="auto">
      <path d="M0 0 L8 3.2 L0 6.4 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="40" y="60" width="880" height="450" rx="16" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#164374">Each layer moves the word through the map — toward the next word</text>

  <!-- regions -->
  <ellipse cx="240" cy="180" rx="150" ry="92" fill="#0083A1" opacity="0.12"/>
  <text x="240" y="125" text-anchor="middle" font-size="15" fill="#00799A" font-weight="700">WATER / NATURE</text>
  <text x="200" y="185" text-anchor="middle" font-size="17" fill="#0F5F87">river</text>
  <text x="295" y="210" text-anchor="middle" font-size="17" fill="#0F5F87">shore</text>

  <ellipse cx="730" cy="370" rx="160" ry="100" fill="#2B6054" opacity="0.12"/>
  <text x="730" y="305" text-anchor="middle" font-size="15" fill="#2B6054" font-weight="700">FINANCE / MONEY</text>
  <text x="780" y="375" text-anchor="middle" font-size="17" fill="#2B6054">money</text>

  <!-- trajectory: input "bank" near nature, walks across layers to finance -->
  <g>
    <path d="M300 220 L420 270" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#tarrow)"/>
    <path d="M450 285 L560 320" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#tarrow)"/>
    <path d="M590 332 L660 352" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#tarrow)"/>
  </g>

  <!-- waypoints -->
  <g>
    <circle cx="290" cy="216" r="8" fill="#A5A5A5"/>
    <text x="290" y="200" text-anchor="middle" font-size="14" fill="#555">layer 0</text>
    <text x="262" y="245" text-anchor="middle" font-size="16" fill="#333" font-weight="700">"bank"</text>

    <circle cx="438" cy="278" r="8" fill="#0083A1"/>
    <text x="438" y="262" text-anchor="middle" font-size="14" fill="#555">layer 1</text>

    <circle cx="578" cy="326" r="8" fill="#00799A"/>
    <text x="578" y="310" text-anchor="middle" font-size="14" fill="#555">layer 2</text>

    <circle cx="678" cy="358" r="11" fill="#164374"/>
    <text x="690" y="343" font-size="14" fill="#555">final</text>
  </g>

  <text x="480" y="500" text-anchor="middle" font-size="15" fill="#555">"deposit money at the …" pushes "bank" into the finance region → predict <tspan font-weight="700" fill="#164374">money</tspan></text>
</svg>
