<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc" font-family="Inter, Arial, Helvetica, sans-serif">
  <title id="title">Lecture 01 argument map</title>
  <desc id="desc">A snaking flow diagram from machine learning and generative AI, through computing with symbols and tools, to LLM-based agents and multi-agent societies, ending at the limits of AI and the human role of understanding and direction.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <style>
      .box  { stroke-width: 2; }
      .m1 { fill: #e8f1f8; stroke: #164374; }
      .m2 { fill: #e6f5f8; stroke: #0083A1; }
      .m3 { fill: #e9f3ef; stroke: #2B6054; }
      .m4 { fill: #f5f3ff; stroke: #7c3aed; }
      .head  { font: 700 16px Inter, Arial, sans-serif; fill: #0f172a; }
      .text  { font: 14px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 12px Inter, Arial, sans-serif; fill: #475569; }
      .step  { font: italic 700 13px Inter, Arial, sans-serif; fill: #6d28d9; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .down  { stroke: #7c3aed; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="1118" height="638" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- ── Row 1 — what the machine is (m1) ── -->
  <g transform="translate(36 64)">
    <rect width="235" height="104" rx="12" class="box m1"/>
    <text x="18" y="30" class="head">Machine learning</text>
    <text x="18" y="56" class="text">learns from data, not rules</text>
    <text x="18" y="80" class="small">Mitchell: improve at T, by P, with E</text>
  </g>
  <g transform="translate(307 64)">
    <rect width="235" height="104" rx="12" class="box m1"/>
    <text x="18" y="30" class="head">A model = approximation</text>
    <text x="18" y="56" class="text">Ŷ = F(X; θ), tuned from a sample</text>
    <text x="18" y="80" class="small">two gaps: representation + estimation</text>
  </g>
  <g transform="translate(578 64)">
    <rect width="235" height="104" rx="12" class="box m1"/>
    <text x="18" y="30" class="head">Generative AI</text>
    <text x="18" y="56" class="text">outputs the raw signal, not a label</text>
    <text x="18" y="80" class="small">self-supervised: predict the next word</text>
  </g>
  <g transform="translate(849 64)">
    <rect width="235" height="104" rx="12" class="box m1"/>
    <text x="18" y="30" class="head">Transformer attention</text>
    <text x="18" y="56" class="text">relate words, add context</text>
    <text x="18" y="80" class="small">next word = walk through meaning</text>
  </g>

  <!-- ── Row 2 — from predicting to acting (m2) ── -->
  <g transform="translate(849 204)">
    <rect width="235" height="104" rx="12" class="box m2"/>
    <text x="18" y="30" class="head">Symbols, not just words</text>
    <text x="18" y="56" class="text">digits, steps, programs</text>
    <text x="18" y="80" class="small">the same next-symbol machine</text>
  </g>
  <g transform="translate(578 204)">
    <rect width="235" height="104" rx="12" class="box m2"/>
    <text x="18" y="30" class="head">More than a parrot</text>
    <text x="18" y="56" class="text">fluent locally, wrong globally</text>
    <text x="18" y="80" class="small">…but we can check the steps</text>
  </g>
  <g transform="translate(307 204)">
    <rect width="235" height="104" rx="12" class="box m2"/>
    <text x="18" y="30" class="head">Offload to tools</text>
    <text x="18" y="56" class="text">know what to compute, delegate it</text>
    <text x="18" y="80" class="small">let the model call a calculator</text>
  </g>

  <!-- ── Row 3 — agents (m3) ── -->
  <g transform="translate(307 344)">
    <rect width="235" height="104" rx="12" class="box m3"/>
    <text x="18" y="30" class="head">Agent = LLM + tools + memory</text>
    <text x="18" y="56" class="text">a loop: observe → decide → act</text>
    <text x="18" y="80" class="small">the LLM as a workflow controller</text>
  </g>
  <g transform="translate(578 344)">
    <rect width="235" height="104" rx="12" class="box m3"/>
    <text x="18" y="30" class="head">RAG → agentic search</text>
    <text x="18" y="56" class="text">ground answers in retrieved sources</text>
    <text x="18" y="80" class="small">loop: search → read → refine</text>
  </g>
  <g transform="translate(849 344)">
    <rect width="235" height="104" rx="12" class="box m3"/>
    <text x="18" y="30" class="head">Multi-agent society</text>
    <text x="18" y="56" class="text">roles · communication · capability</text>
    <text x="18" y="80" class="small">cooperate / debate; solve &amp; simulate</text>
  </g>

  <!-- ── Row 4 — the human (m4) ── -->
  <g transform="translate(849 484)">
    <rect width="235" height="104" rx="12" class="box m4"/>
    <text x="18" y="30" class="head">Real limits</text>
    <text x="18" y="54" class="text">complexity (NP-hard); interface &gt; power;</text>
    <text x="18" y="74" class="text">no single super-brain</text>
    <text x="18" y="96" class="small">+ open multi-agent challenges</text>
  </g>
  <g transform="translate(578 484)">
    <rect width="235" height="104" rx="12" class="box m4"/>
    <text x="18" y="30" class="head">The human directs</text>
    <text x="18" y="56" class="text">understanding becomes scarce</text>
    <text x="18" y="80" class="small">not “can we?” but “what for?”</text>
  </g>

  <!-- ── horizontal arrows ── -->
  <!-- row 1: left → right -->
  <path d="M271 116 H307" class="arrow"/>
  <path d="M813 116 H849" class="arrow"/>
  <path d="M542 116 H578" class="arrow"/>
  <!-- row 2: right → left -->
  <path d="M849 256 H813" class="arrow"/>
  <path d="M578 256 H542" class="arrow"/>
  <!-- row 3: left → right -->
  <path d="M542 396 H578" class="arrow"/>
  <path d="M813 396 H849" class="arrow"/>
  <!-- row 4: right → left -->
  <path d="M849 536 H813" class="arrow"/>

  <!-- ── vertical "module" transitions ── -->
  <path d="M966 168 V204" class="down"/>
  <text x="958" y="190" text-anchor="end" class="step">but is this reasoning?</text>

  <path d="M424 308 V344" class="down"/>
  <text x="438" y="330" class="step">wire it into a loop</text>

  <path d="M966 448 V484" class="down"/>
  <text x="958" y="470" text-anchor="end" class="step">what it still can't do</text>

  <!-- ── through-line caption ── -->
  <text x="560" y="618" text-anchor="middle" class="small">The arc: as raw intelligence becomes a commodity, value moves up — from executing the task to choosing and judging it.</text>
</svg>
