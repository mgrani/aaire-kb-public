<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 624" role="img" aria-labelledby="title desc" font-family="Inter, Arial, Helvetica, sans-serif">
  <title id="title">Lecture 01 argument map</title>
  <desc id="desc">A top-to-bottom flow: from machine learning, generative AI and the transformer, through symbols and tools, to LLM-based agents and multi-agent societies, ending at the limits of AI and the human role of understanding and direction.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-v" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .box  { stroke-width: 2; }
      .m1 { fill: #e8f1f8; stroke: #164374; }
      .m2 { fill: #e6f5f8; stroke: #0083A1; }
      .m3 { fill: #e9f3ef; stroke: #2B6054; }
      .m4 { fill: #f5f3ff; stroke: #7c3aed; }
      .head  { font: 700 16px Inter, Arial, sans-serif; fill: #0f172a; }
      .text  { font: 14px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 12px Inter, Arial, sans-serif; fill: #475569; }
      .step  { font: italic 700 13px Inter, Arial, sans-serif; fill: #6d28d9; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .down  { stroke: #7c3aed; stroke-width: 3; fill: none; marker-end: url(#arrow-v); }
    </style>
  </defs>

  <rect x="1" y="1" width="1118" height="622" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- ── Row 1 — what the machine is (m1) ── -->
  <g transform="translate(70 30)">
    <rect width="300" height="96" rx="12" class="box m1"/>
    <text x="18" y="34" class="head">Machine learning</text>
    <text x="18" y="60" class="text">learns from data, not rules</text>
    <text x="18" y="82" class="small">Mitchell: improve at T, by P, with E</text>
  </g>
  <g transform="translate(410 30)">
    <rect width="300" height="96" rx="12" class="box m1"/>
    <text x="18" y="34" class="head">Generative AI</text>
    <text x="18" y="60" class="text">outputs the raw signal</text>
    <text x="18" y="82" class="small">self-supervised: predict the next word</text>
  </g>
  <g transform="translate(750 30)">
    <rect width="300" height="96" rx="12" class="box m1"/>
    <text x="18" y="34" class="head">Transformer attention</text>
    <text x="18" y="60" class="text">relate words, add context</text>
    <text x="18" y="82" class="small">next word = walk through meaning</text>
  </g>
  <path d="M370 78 H408" class="arrow"/>
  <path d="M710 78 H748" class="arrow"/>

  <!-- ── Row 2 — from predicting to acting (m2) ── -->
  <g transform="translate(240 178)">
    <rect width="300" height="96" rx="12" class="box m2"/>
    <text x="18" y="34" class="head">Symbols &amp; reasoning</text>
    <text x="18" y="60" class="text">digits, steps, programs</text>
    <text x="18" y="82" class="small">fluent, but only approximate</text>
  </g>
  <g transform="translate(580 178)">
    <rect width="300" height="96" rx="12" class="box m2"/>
    <text x="18" y="34" class="head">Offload to tools</text>
    <text x="18" y="60" class="text">delegate the exact work</text>
    <text x="18" y="82" class="small">let the model call a calculator</text>
  </g>
  <path d="M540 226 H578" class="arrow"/>

  <!-- ── Row 3 — agents (m3) ── -->
  <g transform="translate(70 326)">
    <rect width="300" height="96" rx="12" class="box m3"/>
    <text x="18" y="34" class="head">Agent</text>
    <text x="18" y="60" class="text">LLM + tools + memory, in a loop</text>
    <text x="18" y="82" class="small">the wrapper = the harness</text>
  </g>
  <g transform="translate(410 326)">
    <rect width="300" height="96" rx="12" class="box m3"/>
    <text x="18" y="34" class="head">RAG &amp; agentic search</text>
    <text x="18" y="60" class="text">ground answers in sources</text>
    <text x="18" y="82" class="small">search → read → refine</text>
  </g>
  <g transform="translate(750 326)">
    <rect width="300" height="96" rx="12" class="box m3"/>
    <text x="18" y="34" class="head">Multi-agent society</text>
    <text x="18" y="60" class="text">roles · cooperate / debate</text>
    <text x="18" y="82" class="small">solve tasks &amp; simulate worlds</text>
  </g>
  <path d="M370 374 H408" class="arrow"/>
  <path d="M710 374 H748" class="arrow"/>

  <!-- ── Row 4 — the human (m4) ── -->
  <g transform="translate(240 474)">
    <rect width="300" height="96" rx="12" class="box m4"/>
    <text x="18" y="34" class="head">Real limits</text>
    <text x="18" y="60" class="text">complexity; no super-brain</text>
    <text x="18" y="82" class="small">interface beats raw power</text>
  </g>
  <g transform="translate(580 474)">
    <rect width="300" height="96" rx="12" class="box m4"/>
    <text x="18" y="34" class="head">The human directs</text>
    <text x="18" y="60" class="text">understanding becomes scarce</text>
    <text x="18" y="82" class="small">not “can we?” but “what for?”</text>
  </g>
  <path d="M540 522 H578" class="arrow"/>

  <!-- ── module transitions (down) ── -->
  <path d="M560 126 V176" class="down"/>
  <text x="576" y="156" class="step">but is this reasoning?</text>

  <path d="M560 274 V324" class="down"/>
  <text x="576" y="304" class="step">wire it into a loop</text>

  <path d="M560 422 V472" class="down"/>
  <text x="576" y="452" class="step">what it still can't do</text>

  <!-- ── through-line caption ── -->
  <text x="560" y="600" text-anchor="middle" class="small">As raw intelligence becomes a commodity, value moves up — from doing the task to choosing and judging it.</text>
</svg>
