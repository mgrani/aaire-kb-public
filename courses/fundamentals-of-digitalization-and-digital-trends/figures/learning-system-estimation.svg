<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="e-ah" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#164374"/></marker>
    <marker id="e-ahd" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#A5A5A5"/></marker>
  </defs>

  <!-- ── Population → Sample ── -->
  <text x="130" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#164374">Population P</text>
  <text x="130" y="70" text-anchor="middle" font-size="12.5" fill="#777">all possible cases</text>
  <ellipse cx="130" cy="165" rx="100" ry="80" fill="#edf2f7" stroke="#A5A5A5" stroke-width="1.5"/>
  <g fill="#9bb0c4">
    <circle cx="90" cy="130" r="4"/><circle cx="150" cy="120" r="4"/><circle cx="180" cy="160" r="4"/>
    <circle cx="70" cy="180" r="4"/><circle cx="120" cy="200" r="4"/><circle cx="160" cy="205" r="4"/>
    <circle cx="110" cy="160" r="4"/><circle cx="95" cy="215" r="4"/>
  </g>
  <g fill="#164374"><circle cx="150" cy="120" r="5"/><circle cx="120" cy="200" r="5"/><circle cx="110" cy="160" r="5"/></g>

  <line x1="232" y1="165" x2="296" y2="165" stroke="#164374" stroke-width="2.5" marker-end="url(#e-ah)"/>
  <text x="264" y="152" text-anchor="middle" font-size="12.5" fill="#555" font-style="italic">draw a sample</text>

  <rect x="300" y="118" width="170" height="95" rx="10" fill="#fff" stroke="#164374" stroke-width="2"/>
  <text x="385" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#164374">Sample</text>
  <text x="385" y="178" text-anchor="middle" font-size="15" fill="#333">(xᵢ, yᵢ),</text>
  <text x="385" y="198" text-anchor="middle" font-size="14" fill="#333">i = 1 … n</text>

  <!-- estimation-gap bracket -->
  <path d="M30 258 q0 10 10 10 h190 q10 0 10 10 q0 -10 10 -10 h190 q10 0 10 -10" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="250" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Estimation gap: a sample, not all of P</text>

  <!-- ── F → Loss ── -->
  <line x1="470" y1="165" x2="518" y2="165" stroke="#164374" stroke-width="2.5" marker-end="url(#e-ah)"/>
  <text x="494" y="152" text-anchor="middle" font-size="13" fill="#555">xᵢ</text>

  <rect x="520" y="118" width="150" height="95" rx="10" fill="#164374"/>
  <text x="595" y="158" text-anchor="middle" font-size="20" fill="#fff" font-weight="700">F(X; θ)</text>
  <text x="595" y="186" text-anchor="middle" font-size="12.5" fill="#cde7ee">θ = the knobs</text>

  <line x1="670" y1="165" x2="728" y2="165" stroke="#164374" stroke-width="2.5" marker-end="url(#e-ah)"/>
  <text x="699" y="152" text-anchor="middle" font-size="13" fill="#555">ŷᵢ</text>

  <rect x="730" y="118" width="180" height="95" rx="10" fill="#0083A1"/>
  <text x="820" y="152" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">Loss  L(ŷ, y)</text>
  <text x="820" y="180" text-anchor="middle" font-size="13" fill="#e8f6f9">how wrong F is</text>

  <!-- true labels into loss -->
  <path d="M385 213 V 250 H 880 V 215" fill="none" stroke="#A5A5A5" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#e-ahd)"/>
  <text x="560" y="244" text-anchor="middle" font-size="12.5" fill="#555" font-style="italic">true yᵢ (compare against the truth)</text>

  <!-- ── Loss → Optimizer → adjust θ ── -->
  <line x1="820" y1="213" x2="820" y2="318" stroke="#164374" stroke-width="2.5" marker-end="url(#e-ah)"/>

  <rect x="730" y="320" width="180" height="85" rx="10" fill="#2B6054"/>
  <text x="820" y="352" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">Optimizer</text>
  <text x="820" y="378" text-anchor="middle" font-size="13" fill="#e6f2ee">tune θ to cut the loss</text>

  <path d="M730 362 H 595 V 215" fill="none" stroke="#2B6054" stroke-width="2.5" marker-end="url(#e-ah)"/>
  <text x="648" y="380" text-anchor="middle" font-size="13" fill="#2B6054" font-weight="700">adjust θ, repeat</text>

  <!-- argmin caption -->
  <rect x="120" y="430" width="720" height="38" rx="8" fill="#edf2f7"/>
  <text x="480" y="455" text-anchor="middle" font-size="17" fill="#164374">θ* = argmin&#8202;<tspan font-size="12" dy="4">θ</tspan><tspan dy="-4">  Σᵢ  L( F(xᵢ; θ), yᵢ )</tspan>  —  pick the knobs that best fit the sample</text>
</svg>
