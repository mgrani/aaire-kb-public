<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#164374"/></marker>
    <marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#A5A5A5"/></marker>
  </defs>

  <!-- ── Band 1: REAL WORLD ── -->
  <text x="40" y="60" font-size="16" font-weight="700" fill="#2B6054" letter-spacing="0.08em">REAL WORLD — the process we want to approximate</text>
  <g font-size="18" fill="#fff" text-anchor="middle">
    <rect x="100" y="78" width="200" height="68" rx="10" fill="#6C9A9A"/>
    <text x="200" y="108">Object</text>
    <text x="200" y="132" font-size="13" fill="#eef5f4">a real thing (an applicant)</text>

    <rect x="380" y="78" width="200" height="68" rx="10" fill="#164374"/>
    <text x="480" y="108">Real-world process</text>
    <text x="480" y="132" font-size="13" fill="#cde7ee">"will they repay?"</text>

    <rect x="660" y="78" width="200" height="68" rx="10" fill="#2B6054"/>
    <text x="760" y="104">Outcome  Y*</text>
    <text x="760" y="130" font-size="13" fill="#e6f2ee">repaid / defaulted</text>
  </g>
  <g stroke="#164374" stroke-width="2.5" marker-end="url(#ah)">
    <line x1="300" y1="112" x2="378" y2="112"/>
    <line x1="580" y1="112" x2="658" y2="112"/>
  </g>

  <!-- ── vertical modelling connectors ── -->
  <g stroke="#A5A5A5" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ahg)">
    <line x1="200" y1="150" x2="200" y2="296"/>
    <line x1="480" y1="150" x2="480" y2="296"/>
    <line x1="760" y1="150" x2="760" y2="296"/>
  </g>
  <g font-size="12.5" fill="#555" font-style="italic">
    <text x="214" y="200">measure / preprocess —</text>
    <text x="214" y="217">itself a modelling choice</text>
    <text x="494" y="200">F approximates</text>
    <text x="494" y="217">the real process</text>
    <text x="850" y="208" text-anchor="end">we want  Ŷ = Y*</text>
  </g>

  <!-- ── Band 2: MODEL ── -->
  <text x="40" y="405" font-size="16" font-weight="700" fill="#164374" letter-spacing="0.08em">MODEL — an approximation built from data</text>
  <g font-size="18" fill="#fff" text-anchor="middle">
    <rect x="100" y="300" width="200" height="68" rx="10" fill="#0083A1"/>
    <text x="200" y="330">X = data</text>
    <text x="200" y="354" font-size="13" fill="#e8f6f9">income, age, history…</text>

    <rect x="380" y="300" width="200" height="68" rx="10" fill="#164374"/>
    <text x="480" y="330" font-size="19">F&#8202;: Ŷ = F(X; θ)</text>
    <text x="480" y="354" font-size="13" fill="#cde7ee">the learned function</text>

    <rect x="660" y="300" width="200" height="68" rx="10" fill="#2B6054"/>
    <text x="760" y="330">Ŷ  prediction</text>
    <text x="760" y="354" font-size="13" fill="#e6f2ee">estimated repay-chance</text>
  </g>
  <g stroke="#164374" stroke-width="2.5" marker-end="url(#ah)">
    <line x1="300" y1="334" x2="378" y2="334"/>
    <line x1="580" y1="334" x2="658" y2="334"/>
  </g>

  <!-- ── representation-gap bracket ── -->
  <path d="M880 156 q12 0 12 12 v44 q0 12 12 12 q-12 0 -12 12 v44 q0 12 -12 12" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="916" y="224" font-size="13" font-weight="700" fill="#6d28d9" transform="rotate(90 916 224)" text-anchor="middle">Representation gap: reality → model</text>

  <text x="480" y="450" text-anchor="middle" font-size="14" fill="#555">Both the data X and the function F are <tspan font-style="italic">our chosen models</tspan> of a messy reality.</text>
</svg>
