<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="lt-ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 z" fill="#164374"/>
    </marker>
  </defs>

  <!-- ── 1 · Programmatic reasoning: rules + loops ── -->
  <text x="122" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#164374">Programmatic reasoning</text>
  <rect x="12" y="34" width="220" height="168" rx="10" fill="#f7fafc" stroke="#164374" stroke-width="1.5"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
    <text x="26" y="66" fill="#164374">if amount &gt; 100:</text>
    <text x="46" y="88" fill="#0083A1">apply discount</text>
    <line x1="26" y1="104" x2="218" y2="104" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="26" y="128" fill="#164374">for i in 1..n:</text>
    <text x="46" y="150" fill="#0083A1">total += price[i]</text>
  </g>
  <text x="122" y="186" text-anchor="middle" font-size="11.5" fill="#777">explicit if-then rules + loops</text>
  <text x="122" y="226" text-anchor="middle" font-size="12" fill="#2B6054" font-weight="700">exact, provable</text>

  <path d="M236 118 H258" stroke="#164374" stroke-width="2.5" fill="none" marker-end="url(#lt-ar)"/>
  <text x="247" y="108" text-anchor="middle" font-size="11" fill="#555">run</text>

  <!-- ── 2 · Generate traces ── -->
  <text x="377" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#164374">Generate traces</text>
  <rect x="262" y="34" width="230" height="168" rx="10" fill="#f7fafc" stroke="#0083A1" stroke-width="1.5"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#334155">
    <text x="276" y="66">amount=150 → discount ✓</text>
    <text x="276" y="92">amount=40  → full price</text>
    <text x="276" y="118">[20,30,40] → total = 90</text>
    <text x="276" y="144">7 + 8 = 15    13 × 6 = 78</text>
  </g>
  <text x="377" y="186" text-anchor="middle" font-size="11.5" fill="#777">millions of worked examples</text>
  <text x="377" y="226" text-anchor="middle" font-size="12" fill="#777">the rules, shown — not stated</text>

  <path d="M496 118 H520" stroke="#164374" stroke-width="2.5" fill="none" marker-end="url(#lt-ar)"/>
  <text x="508" y="108" text-anchor="middle" font-size="11" fill="#555">train</text>

  <!-- ── 3 · LLM learns the pattern ── -->
  <text x="604" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#164374">LLM learns the pattern</text>
  <rect x="534" y="60" width="140" height="100" rx="16" fill="#164374"/>
  <text x="604" y="112" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">LLM</text>
  <text x="604" y="136" text-anchor="middle" font-size="11.5" fill="#cde7ee">imitates the rules</text>
  <text x="604" y="186" text-anchor="middle" font-size="11.5" fill="#777">approximate, not exact</text>
  <text x="604" y="226" text-anchor="middle" font-size="12" fill="#b45309" font-weight="700">fluent, but not guaranteed</text>

  <path d="M678 118 H712" stroke="#164374" stroke-width="2.5" fill="none" marker-end="url(#lt-ar)"/>
  <text x="695" y="108" text-anchor="middle" font-size="11" fill="#555">ask</text>

  <!-- ── 4 · A user asks ── -->
  <text x="832" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#164374">A user asks</text>
  <!-- person -->
  <circle cx="740" cy="84" r="15" fill="#7c3aed"/>
  <path d="M719 122 a21 18 0 0 1 42 0 z" fill="#7c3aed"/>
  <!-- speech bubble -->
  <rect x="772" y="58" width="176" height="50" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <path d="M772 92 l-12 10 l14 -2 z" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="860" y="80" text-anchor="middle" font-size="13" fill="#6d28d9">Discount for an</text>
  <text x="860" y="98" text-anchor="middle" font-size="13" fill="#6d28d9">order of €150?</text>
  <!-- answer -->
  <text x="724" y="160" font-size="13" fill="#334155">→ LLM: “yes, usually” ✓</text>
  <text x="832" y="226" text-anchor="middle" font-size="12" fill="#777">answers from the learned pattern</text>
</svg>
