<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .box{rx:10;}
      .lbl{fill:#fff;font-weight:700;}
      .sub{fill:#333;}
      .cap{fill:#555;}
    </style>
  </defs>
  <!-- edges -->
  <g stroke="#A5A5A5" stroke-width="3" fill="none">
    <path d="M480 120 L200 220"/>
    <path d="M480 120 L480 220"/>
    <path d="M480 120 L760 220"/>
  </g>

  <!-- root -->
  <rect x="330" y="60" width="300" height="64" rx="12" fill="#164374"/>
  <text x="480" y="100" text-anchor="middle" font-size="28" class="lbl">Machine Learning</text>

  <!-- three subfields -->
  <g>
    <rect x="70" y="220" width="260" height="60" rx="10" fill="#0083A1"/>
    <text x="200" y="258" text-anchor="middle" font-size="23" class="lbl">Supervised</text>
    <text x="200" y="305" text-anchor="middle" font-size="17" class="cap">learn from labelled</text>
    <text x="200" y="328" text-anchor="middle" font-size="17" class="cap">examples (input → label)</text>
  </g>
  <g>
    <rect x="350" y="220" width="260" height="60" rx="10" fill="#00799A"/>
    <text x="480" y="258" text-anchor="middle" font-size="23" class="lbl">Unsupervised</text>
    <text x="480" y="305" text-anchor="middle" font-size="17" class="cap">find structure in</text>
    <text x="480" y="328" text-anchor="middle" font-size="17" class="cap">unlabelled data</text>
  </g>
  <g>
    <rect x="630" y="220" width="260" height="60" rx="10" fill="#2B6054"/>
    <text x="760" y="258" text-anchor="middle" font-size="23" class="lbl">Reinforcement</text>
    <text x="760" y="305" text-anchor="middle" font-size="17" class="cap">learn from reward</text>
    <text x="760" y="328" text-anchor="middle" font-size="17" class="cap">through interaction</text>
  </g>

  <!-- Mitchell T/P/E box -->
  <rect x="170" y="380" width="620" height="130" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
  <text x="480" y="412" text-anchor="middle" font-size="19" fill="#164374" font-weight="700">Mitchell (1997): a program learns from experience E</text>
  <text x="480" y="438" text-anchor="middle" font-size="19" fill="#164374" font-weight="700">w.r.t. tasks T and measure P, if P on T improves with E.</text>
  <g font-size="18" fill="#333">
    <text x="270" y="482" text-anchor="middle"><tspan font-weight="700" fill="#0083A1">T</tspan> — task</text>
    <text x="480" y="482" text-anchor="middle"><tspan font-weight="700" fill="#0083A1">P</tspan> — performance</text>
    <text x="690" y="482" text-anchor="middle"><tspan font-weight="700" fill="#0083A1">E</tspan> — experience</text>
  </g>
</svg>
