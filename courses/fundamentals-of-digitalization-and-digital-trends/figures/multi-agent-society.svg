<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 960 470" font-family="Arial, Helvetica, sans-serif">
  <!-- title removed: it lives on the slide -->

  <!-- communication links -->
  <g stroke="#A5A5A5" stroke-width="2.5">
    <line x1="250" y1="180" x2="480" y2="150"/>
    <line x1="710" y1="180" x2="480" y2="150"/>
    <line x1="250" y1="180" x2="250" y2="380"/>
    <line x1="710" y1="180" x2="710" y2="380"/>
    <line x1="250" y1="380" x2="480" y2="430"/>
    <line x1="710" y1="380" x2="480" y2="430"/>
    <line x1="250" y1="180" x2="710" y2="380"/>
    <line x1="710" y1="180" x2="250" y2="380"/>
    <line x1="480" y1="150" x2="480" y2="430"/>
  </g>

  <!-- agent nodes -->
  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <circle cx="480" cy="150" r="58" fill="#0083A1"/>
      <text x="480" y="146" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">Planner</text>
      <text x="480" y="168" text-anchor="middle" font-size="13" fill="#e8f6f9">agent</text>
    </g>
    <g>
      <circle cx="250" cy="180" r="58" fill="#164374"/>
      <text x="250" y="176" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">Researcher</text>
      <text x="250" y="198" text-anchor="middle" font-size="13" fill="#cde7ee">agent</text>
    </g>
    <g>
      <circle cx="710" cy="180" r="58" fill="#2B6054"/>
      <text x="710" y="176" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">Coder</text>
      <text x="710" y="198" text-anchor="middle" font-size="13" fill="#e6f2ee">agent</text>
    </g>
    <g>
      <circle cx="250" cy="380" r="58" fill="#00799A"/>
      <text x="250" y="376" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">Critic</text>
      <text x="250" y="398" text-anchor="middle" font-size="13" fill="#e8f6f9">agent</text>
    </g>
    <g>
      <circle cx="710" cy="380" r="58" fill="#0F5F87"/>
      <text x="710" y="376" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">Tool-user</text>
      <text x="710" y="398" text-anchor="middle" font-size="13" fill="#cde7ee">agent</text>
    </g>
    <!-- human in the loop -->
    <g>
      <circle cx="480" cy="430" r="60" fill="#fff" stroke="#7c3aed" stroke-width="3"/>
      <circle cx="480" cy="412" r="13" fill="#7c3aed"/>
      <path d="M455 452 a25 22 0 0 1 50 0 z" fill="#7c3aed"/>
      <text x="480" y="500" text-anchor="middle" font-size="16" fill="#6d28d9" font-weight="700">Human</text>
    </g>
  </g>

  <text x="900" y="270" text-anchor="end" font-size="14" fill="#555">roles · communication · coordination</text>
</svg>
