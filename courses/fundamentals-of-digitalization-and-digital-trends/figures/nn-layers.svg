<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="l-ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#164374"/></marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#164374">Inside F: a stack of layers</text>

  <!-- X = input vectors -->
  <g>
    <rect x="40" y="150" width="56" height="120" rx="6" fill="#0083A1"/>
    <g stroke="#fff" stroke-width="1.5"><line x1="40" y1="180" x2="96" y2="180"/><line x1="40" y1="210" x2="96" y2="210"/><line x1="40" y1="240" x2="96" y2="240"/></g>
    <text x="68" y="295" text-anchor="middle" font-size="13" fill="#333">X</text>
    <text x="68" y="313" text-anchor="middle" font-size="11.5" fill="#777">words as vectors</text>
  </g>

  <!-- layers -->
  <g font-size="15" fill="#fff" text-anchor="middle">
    <rect x="150" y="130" width="80" height="160" rx="10" fill="#164374"/>
    <text x="190" y="215" transform="rotate(-90 190 215)">Layer 1</text>

    <rect x="290" y="130" width="80" height="160" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="3"/>
    <text x="330" y="215" transform="rotate(-90 330 215)" fill="#6d28d9" font-weight="700">Layer 2</text>

    <rect x="430" y="130" width="80" height="160" rx="10" fill="#164374"/>
    <text x="470" y="215" transform="rotate(-90 470 215)">Layer 3</text>

    <rect x="630" y="130" width="80" height="160" rx="10" fill="#164374"/>
    <text x="670" y="215" transform="rotate(-90 670 215)">Layer k</text>
  </g>
  <text x="565" y="218" text-anchor="middle" font-size="26" fill="#A5A5A5" font-weight="700">⋯</text>

  <!-- Y -->
  <rect x="800" y="145" width="120" height="130" rx="10" fill="#2B6054"/>
  <text x="860" y="200" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">Ŷ</text>
  <text x="860" y="224" text-anchor="middle" font-size="12" fill="#e6f2ee">next-word</text>
  <text x="860" y="240" text-anchor="middle" font-size="12" fill="#e6f2ee">scores</text>

  <!-- arrows -->
  <g stroke="#164374" stroke-width="2.5" marker-end="url(#l-ah)">
    <line x1="98" y1="210" x2="148" y2="210"/>
    <line x1="232" y1="210" x2="288" y2="210"/>
    <line x1="372" y1="210" x2="428" y2="210"/>
    <line x1="512" y1="210" x2="545" y2="210"/>
    <line x1="588" y1="210" x2="628" y2="210"/>
    <line x1="712" y1="210" x2="798" y2="210"/>
  </g>

  <!-- zoom hint on highlighted layer -->
  <circle cx="330" cy="108" r="14" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <line x1="340" y1="118" x2="352" y2="130" stroke="#7c3aed" stroke-width="3"/>
  <text x="330" y="86" text-anchor="middle" font-size="12.5" fill="#6d28d9" font-weight="700">zoom in → attention</text>

  <!-- caption -->
  <text x="480" y="345" text-anchor="middle" font-size="16" fill="#333">F = L<tspan font-size="11" dy="4">k</tspan><tspan dy="-4"> ∘ ⋯ ∘ L</tspan><tspan font-size="11" dy="4">2</tspan><tspan dy="-4"> ∘ L</tspan><tspan font-size="11" dy="4">1</tspan></text>
  <text x="480" y="372" text-anchor="middle" font-size="14" fill="#555" font-style="italic">each layer reshapes the representation a little</text>
</svg>
