<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="rag-navy" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#164374"/></marker>
    <marker id="rag-teal" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#0083A1"/></marker>
    <marker id="rag-green" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#2B6054"/></marker>
  </defs>

  <!-- ===== lane 1: indexing (offline) ===== -->
  <text x="24" y="24" font-size="15" font-weight="700" fill="#164374">1 · Build the index — offline</text>

  <g font-size="15">
    <rect x="24" y="44" width="168" height="58" rx="9" fill="#eef3f8" stroke="#164374" stroke-width="2"/>
    <text x="108" y="70" text-anchor="middle" font-weight="700" fill="#164374">Documents</text>
    <text x="108" y="90" text-anchor="middle" font-size="12.5" fill="#555">corpus · wiki · PDFs</text>

    <rect x="232" y="44" width="150" height="58" rx="9" fill="#ffffff" stroke="#164374" stroke-width="2"/>
    <text x="307" y="70" text-anchor="middle" font-weight="700" fill="#164374">Chunk</text>
    <text x="307" y="90" text-anchor="middle" font-size="12.5" fill="#555">split into passages</text>

    <rect x="422" y="44" width="150" height="58" rx="9" fill="#ffffff" stroke="#164374" stroke-width="2"/>
    <text x="497" y="70" text-anchor="middle" font-weight="700" fill="#164374">Embed</text>
    <text x="497" y="90" text-anchor="middle" font-size="12.5" fill="#555">encoder → vector</text>
  </g>
  <line x1="192" y1="73" x2="230" y2="73" stroke="#164374" stroke-width="2.5" marker-end="url(#rag-navy)"/>
  <line x1="382" y1="73" x2="420" y2="73" stroke="#164374" stroke-width="2.5" marker-end="url(#rag-navy)"/>
  <line x1="572" y1="73" x2="598" y2="73" stroke="#164374" stroke-width="2.5" marker-end="url(#rag-navy)"/>

  <!-- ===== vector index hub ===== -->
  <rect x="600" y="44" width="176" height="300" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="688" y="72" text-anchor="middle" font-size="16" font-weight="700" fill="#6d28d9">Vector index</text>
  <text x="688" y="92" text-anchor="middle" font-size="12.5" fill="#6d28d9">every chunk as a vector</text>
  <g fill="#7c3aed">
    <circle cx="648" cy="150" r="5"/><circle cx="690" cy="138" r="5"/><circle cx="734" cy="162" r="5"/>
    <circle cx="666" cy="196" r="5"/><circle cx="712" cy="186" r="5"/><circle cx="742" cy="214" r="5"/>
    <circle cx="640" cy="232" r="5"/><circle cx="694" cy="244" r="5"/><circle cx="728" cy="266" r="5"/>
    <circle cx="668" cy="288" r="5"/><circle cx="716" cy="306" r="5"/>
  </g>

  <!-- ===== lane 2: query (online) ===== -->
  <text x="24" y="218" font-size="15" font-weight="700" fill="#0083A1">2 · Answer a question — online</text>

  <g font-size="15">
    <rect x="24" y="236" width="168" height="58" rx="9" fill="#e6f5f8" stroke="#0083A1" stroke-width="2"/>
    <text x="108" y="262" text-anchor="middle" font-weight="700" fill="#0083A1">Question</text>
    <text x="108" y="282" text-anchor="middle" font-size="12.5" fill="#555">user query</text>

    <rect x="232" y="236" width="150" height="58" rx="9" fill="#ffffff" stroke="#0083A1" stroke-width="2"/>
    <text x="307" y="262" text-anchor="middle" font-weight="700" fill="#0083A1">Embed</text>
    <text x="307" y="282" text-anchor="middle" font-size="12.5" fill="#555">same encoder</text>

    <rect x="422" y="236" width="150" height="58" rx="9" fill="#ffffff" stroke="#0083A1" stroke-width="2"/>
    <text x="497" y="262" text-anchor="middle" font-weight="700" fill="#0083A1">Vector search</text>
    <text x="497" y="282" text-anchor="middle" font-size="12.5" fill="#555">k nearest vectors</text>
  </g>
  <line x1="192" y1="265" x2="230" y2="265" stroke="#0083A1" stroke-width="2.5" marker-end="url(#rag-teal)"/>
  <line x1="382" y1="265" x2="420" y2="265" stroke="#0083A1" stroke-width="2.5" marker-end="url(#rag-teal)"/>
  <line x1="572" y1="265" x2="598" y2="265" stroke="#0083A1" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#rag-teal)"/>
  <text x="586" y="252" text-anchor="middle" font-size="11.5" font-style="italic" fill="#0083A1">search</text>

  <!-- ===== retrieve + generate (right) ===== -->
  <g font-size="15">
    <rect x="812" y="44" width="176" height="58" rx="9" fill="#ffffff" stroke="#2B6054" stroke-width="2"/>
    <text x="900" y="68" text-anchor="middle" font-weight="700" fill="#2B6054">Top-k passages</text>
    <text x="900" y="88" text-anchor="middle" font-size="12.5" fill="#555">most similar chunks</text>

    <rect x="812" y="150" width="176" height="62" rx="9" fill="#164374"/>
    <text x="900" y="176" text-anchor="middle" font-weight="700" fill="#ffffff">LLM</text>
    <text x="900" y="196" text-anchor="middle" font-size="12" fill="#cde7ee">prompt = question + passages</text>

    <rect x="812" y="262" width="176" height="58" rx="9" fill="#eaf3ef" stroke="#2B6054" stroke-width="2"/>
    <text x="900" y="286" text-anchor="middle" font-weight="700" fill="#2B6054">Answer</text>
    <text x="900" y="306" text-anchor="middle" font-size="12.5" fill="#555">grounded · with citations</text>
  </g>
  <line x1="776" y1="73" x2="810" y2="73" stroke="#2B6054" stroke-width="2.5" marker-end="url(#rag-green)"/>
  <line x1="900" y1="102" x2="900" y2="148" stroke="#2B6054" stroke-width="2.5" marker-end="url(#rag-green)"/>
  <line x1="900" y1="212" x2="900" y2="260" stroke="#2B6054" stroke-width="2.5" marker-end="url(#rag-green)"/>

  <!-- ===== linguistic-complexity note ===== -->
  <text x="24" y="376" font-size="13.5" fill="#334155">Vector search matches <tspan font-weight="700" fill="#7c3aed">meaning</tspan>, not exact words — it finds passages about the same idea</text>
  <text x="24" y="396" font-size="13.5" fill="#334155">even when they share no keywords (synonyms, paraphrase, other languages).</text>
</svg>
