<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 280" role="img" aria-labelledby="title desc">
  <title id="title">Sparse index versus dense index</title>
  <desc id="desc">Comparison of sparse inverted indexing with dense vector indexing for retrieval.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#164374"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#0083A1"/>
    </marker>
  </defs>

  <rect width="1120" height="280" fill="#ffffff"/>
  <rect x="24" y="22" width="520" height="226" rx="8" fill="#f7f9fb" stroke="#E7E6E6" stroke-width="2"/>
  <rect x="576" y="22" width="520" height="226" rx="8" fill="#f7f9fb" stroke="#E7E6E6" stroke-width="2"/>

  <text x="50" y="58" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#164374">Sparse index</text>
  <text x="602" y="58" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0083A1">Dense index</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#333333">
    <rect x="50" y="90" width="112" height="42" rx="5" fill="#ffffff" stroke="#164374" stroke-width="2"/>
    <text x="106" y="116" text-anchor="middle">query terms</text>
    <line x1="174" y1="111" x2="224" y2="111" stroke="#164374" stroke-width="3" marker-end="url(#arrow-blue)"/>

    <rect x="236" y="70" width="178" height="110" rx="5" fill="#ffffff" stroke="#164374" stroke-width="2"/>
    <text x="325" y="99" text-anchor="middle" font-weight="700">inverted file</text>
    <text x="255" y="127">climate -> d1, d7</text>
    <text x="255" y="151">policy -> d2, d7</text>
    <text x="255" y="171">energy -> d4, d9</text>
    <text x="325" y="206" text-anchor="middle" font-size="16" fill="#164374">lookup + merge: O(k log n)</text>

    <line x1="426" y1="125" x2="464" y2="125" stroke="#164374" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <rect x="474" y="88" width="48" height="74" rx="5" fill="#164374"/>
    <text x="498" y="114" text-anchor="middle" fill="#ffffff" font-weight="700">d7</text>
    <text x="498" y="137" text-anchor="middle" fill="#ffffff" font-weight="700">d1</text>
    <text x="498" y="159" text-anchor="middle" fill="#ffffff" font-weight="700">d2</text>
    <text x="498" y="188" text-anchor="middle" fill="#164374" font-size="16">ranked docs</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#333333">
    <rect x="602" y="90" width="104" height="42" rx="5" fill="#ffffff" stroke="#0083A1" stroke-width="2"/>
    <text x="654" y="116" text-anchor="middle">query text</text>
    <line x1="718" y1="111" x2="762" y2="111" stroke="#0083A1" stroke-width="3" marker-end="url(#arrow-teal)"/>

    <rect x="774" y="80" width="98" height="66" rx="5" fill="#ffffff" stroke="#0083A1" stroke-width="2"/>
    <text x="823" y="108" text-anchor="middle" font-weight="700">encoder</text>
    <text x="823" y="132" text-anchor="middle">q -> v</text>

    <line x1="884" y1="111" x2="918" y2="111" stroke="#0083A1" stroke-width="3" marker-end="url(#arrow-teal)"/>
    <rect x="928" y="72" width="138" height="120" rx="5" fill="#ffffff" stroke="#0083A1" stroke-width="2"/>
    <line x1="944" y1="174" x2="1052" y2="174" stroke="#A5A5A5" stroke-width="1.5"/>
    <line x1="944" y1="174" x2="944" y2="90" stroke="#A5A5A5" stroke-width="1.5"/>
    <text x="1046" y="189" text-anchor="middle" font-size="13" fill="#666666">x</text>
    <text x="936" y="94" text-anchor="end" font-size="13" fill="#666666">y</text>
    <g fill="#0083A1">
      <circle cx="980" cy="145" r="6"/>
      <circle cx="1002" cy="126" r="6"/>
      <circle cx="1028" cy="106" r="6"/>
      <circle cx="960" cy="116" r="6"/>
      <circle cx="1038" cy="155" r="6"/>
    </g>
    <circle cx="1002" cy="126" r="13" fill="none" stroke="#2B6054" stroke-width="3"/>
    <text x="997" y="214" text-anchor="middle" fill="#0083A1" font-size="16">nearest vectors</text>
    <text x="997" y="236" text-anchor="middle" fill="#0083A1" font-size="16">linear scan: O(n)</text>
  </g>
</svg>
