<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 620" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="att-ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 z" fill="#164374"/>
    </marker>
  </defs>

  <!-- ── 1 · INPUT: each word is a vector ── -->
  <text x="20" y="28" font-size="16" font-weight="700" fill="#164374">1 · Input — each word a vector</text>
  <g font-size="15">
    <!-- The -->
    <text x="28" y="62" fill="#777">The</text>
    <text x="150" y="62" fill="#777">( 0.1 , 0.2 )</text>
    <!-- river (strongly attended) -->
    <rect x="18" y="74" width="300" height="26" rx="6" fill="#0083A1" opacity="0.14"/>
    <text x="28" y="92" fill="#0F5F87" font-weight="700">river</text>
    <text x="150" y="92" fill="#0F5F87" font-weight="700">( 0.9 , 0.1 )</text>
    <!-- flows -->
    <text x="28" y="122" fill="#333">flows</text>
    <text x="150" y="122" fill="#333">( 0.4 , 0.3 )</text>
    <!-- to the -->
    <text x="28" y="152" fill="#333">to&#160;the</text>
    <text x="150" y="152" fill="#333">( 0.2 , 0.2 )</text>
    <!-- bank (target) -->
    <rect x="18" y="164" width="300" height="26" rx="6" fill="#164374" opacity="0.12"/>
    <text x="28" y="182" fill="#164374" font-weight="700">bank</text>
    <text x="150" y="182" fill="#164374" font-weight="700">( 0.5 , 0.5 )</text>
    <text x="330" y="182" font-size="12" fill="#164374">← target</text>
  </g>

  <line x1="20" y1="208" x2="410" y2="208" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ── 2 · ATTENTION: a score for EVERY word ── -->
  <text x="20" y="238" font-size="16" font-weight="700" fill="#164374">2 · Attention — a score for every word</text>
  <text x="20" y="258" font-size="12.5" fill="#777">how much should "bank" listen to each?</text>
  <g font-size="14">
    <!-- bars: width = score * 240 -->
    <text x="28" y="290" fill="#555">The</text>
    <rect x="120" y="280" width="12" height="14" rx="3" fill="#A5A5A5"/>
    <text x="372" y="290" fill="#555">0.05</text>

    <text x="28" y="318" fill="#0F5F87" font-weight="700">river</text>
    <rect x="120" y="308" width="132" height="14" rx="3" fill="#0083A1"/>
    <text x="372" y="318" fill="#0F5F87" font-weight="700">0.55</text>

    <text x="28" y="346" fill="#555">flows</text>
    <rect x="120" y="336" width="48" height="14" rx="3" fill="#A5A5A5"/>
    <text x="372" y="346" fill="#555">0.20</text>

    <text x="28" y="374" fill="#555">to&#160;the</text>
    <rect x="120" y="364" width="24" height="14" rx="3" fill="#A5A5A5"/>
    <text x="372" y="374" fill="#555">0.10</text>

    <text x="28" y="402" fill="#555">bank</text>
    <rect x="120" y="392" width="24" height="14" rx="3" fill="#A5A5A5"/>
    <text x="372" y="402" fill="#555">0.10</text>
  </g>

  <line x1="20" y1="430" x2="410" y2="430" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ── 3 · OUTPUT: a new vector for bank ── -->
  <text x="20" y="460" font-size="16" font-weight="700" fill="#164374">3 · Output — a new vector for "bank"</text>
  <text x="20" y="482" font-size="12.5" fill="#777">weighted mix of the inputs by their scores</text>

  <line x1="215" y1="492" x2="215" y2="516" stroke="#164374" stroke-width="2.5" marker-end="url(#att-ar)"/>

  <rect x="70" y="522" width="290" height="66" rx="12" fill="#164374"/>
  <text x="215" y="550" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">bank&#8242; = ( 0.8 , 0.15 )</text>
  <text x="215" y="574" text-anchor="middle" font-size="13" fill="#cde7ee">pulled toward "river" → means riverside</text>
</svg>
