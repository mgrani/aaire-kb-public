<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 z" fill="#164374"/>
    </marker>
  </defs>

  <text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#164374">Attention: relate every word to every other, then build a new concept</text>

  <!-- input words -->
  <g font-size="20" fill="#fff" text-anchor="middle">
    <g>
      <rect x="60" y="110" width="150" height="56" rx="10" fill="#A5A5A5"/>
      <text x="135" y="146">The</text>
    </g>
    <g>
      <rect x="60" y="190" width="150" height="56" rx="10" fill="#0083A1"/>
      <text x="135" y="226">river</text>
    </g>
    <g>
      <rect x="60" y="270" width="150" height="56" rx="10" fill="#A5A5A5"/>
      <text x="135" y="306">flows</text>
    </g>
    <g>
      <rect x="60" y="350" width="150" height="56" rx="10" fill="#0083A1"/>
      <text x="135" y="386">to the</text>
    </g>
    <g>
      <rect x="60" y="430" width="150" height="56" rx="10" fill="#164374"/>
      <text x="135" y="466">bank</text>
    </g>
  </g>

  <!-- similarity edges to "bank": thicker = more related -->
  <g fill="none" stroke="#0083A1">
    <path d="M210 458 C 330 430, 360 250, 470 226" stroke-width="7" opacity="0.9"/>
    <path d="M210 458 C 330 450, 360 330, 470 306" stroke-width="2" opacity="0.4"/>
    <path d="M210 458 C 340 470, 380 410, 470 386" stroke-width="5" opacity="0.8"/>
    <path d="M210 458 C 340 470, 360 150, 470 146" stroke-width="1.5" opacity="0.3"/>
  </g>
  <text x="335" y="525" text-anchor="middle" font-size="15" fill="#555">thick = strongly related (attended to)</text>

  <!-- attended concept -->
  <rect x="470" y="120" width="200" height="300" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="570" y="152" text-anchor="middle" font-size="17" fill="#6d28d9" font-weight="700">attended</text>
  <text x="570" y="174" text-anchor="middle" font-size="17" fill="#6d28d9" font-weight="700">context</text>
  <g font-size="18" fill="#333" text-anchor="middle">
    <text x="570" y="226">river</text>
    <text x="570" y="306">to the</text>
    <text x="570" y="386">bank</text>
  </g>

  <!-- arrow to new concept -->
  <line x1="680" y1="270" x2="745" y2="270" stroke="#164374" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="755" y="225" width="180" height="90" rx="14" fill="#164374"/>
  <text x="845" y="262" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">new concept</text>
  <text x="845" y="290" text-anchor="middle" font-size="16" fill="#cde7ee">"bank = riverside"</text>
</svg>
