<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Same situation, different network models</title>
  <desc id="desc">A bipartite affiliation network on the left and a projected one-mode people network on the right, showing that one social setting can be modeled in different ways.</desc>
  <rect width="1200" height="420" fill="#ffffff"/>

  <text x="600" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111111" font-weight="700">
    Same situation, different network models
  </text>

  <rect x="40" y="60" width="520" height="330" rx="18" fill="#f7f7f7" stroke="#c8c8c8" stroke-width="2"/>
  <rect x="640" y="60" width="520" height="330" rx="18" fill="#f7f7f7" stroke="#c8c8c8" stroke-width="2"/>

  <text x="300" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111111" font-weight="700">
    Affiliation model
  </text>
  <text x="900" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111111" font-weight="700">
    Projected people network
  </text>

  <text x="120" y="145" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#444444" font-weight="700">People</text>
  <text x="360" y="145" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#444444" font-weight="700">Groups</text>

  <!-- Left panel: bipartite affiliation network -->
  <line x1="140" y1="180" x2="380" y2="165" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="140" y1="180" x2="380" y2="255" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="140" y1="240" x2="380" y2="165" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="140" y1="240" x2="380" y2="255" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="140" y1="300" x2="380" y2="165" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="140" y1="300" x2="380" y2="255" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="140" y1="180" x2="380" y2="255" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="140" y1="240" x2="380" y2="165" stroke="#8a8a8a" stroke-width="2"/>

  <circle cx="140" cy="180" r="18" fill="#5c84c7" stroke="#2f4e84" stroke-width="2"/>
  <circle cx="140" cy="240" r="18" fill="#5c84c7" stroke="#2f4e84" stroke-width="2"/>
  <circle cx="140" cy="300" r="18" fill="#5c84c7" stroke="#2f4e84" stroke-width="2"/>

  <rect x="362" y="149" width="36" height="36" rx="6" fill="#dddddd" stroke="#666666" stroke-width="2"/>
  <rect x="362" y="239" width="36" height="36" rx="6" fill="#dddddd" stroke="#666666" stroke-width="2"/>

  <text x="140" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="700">P1</text>
  <text x="140" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="700">P2</text>
  <text x="140" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="700">P3</text>
  <text x="380" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333333" font-weight="700">G1</text>
  <text x="380" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333333" font-weight="700">G2</text>

  <text x="880" y="145" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#444444" font-weight="700">People</text>

  <!-- Right panel: one-mode projection -->
  <line x1="760" y1="185" x2="900" y2="170" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="760" y1="185" x2="1040" y2="185" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="760" y1="185" x2="900" y2="285" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="900" y1="170" x2="1040" y2="185" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="900" y1="170" x2="900" y2="285" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="1040" y1="185" x2="900" y2="285" stroke="#8a8a8a" stroke-width="2"/>

  <circle cx="760" cy="185" r="18" fill="#5c84c7" stroke="#2f4e84" stroke-width="2"/>
  <circle cx="900" cy="170" r="18" fill="#5c84c7" stroke="#2f4e84" stroke-width="2"/>
  <circle cx="1040" cy="185" r="18" fill="#5c84c7" stroke="#2f4e84" stroke-width="2"/>
  <circle cx="900" cy="285" r="18" fill="#5c84c7" stroke="#2f4e84" stroke-width="2"/>

  <text x="760" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="700">P1</text>
  <text x="900" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="700">P2</text>
  <text x="1040" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="700">P3</text>
  <text x="900" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="700">P4</text>

  <text x="880" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#555555">
    Later: affiliation networks, bipartite graphs, and projections
  </text>
</svg>
