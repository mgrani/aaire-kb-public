<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
  </defs>

  <!-- Background bands for layers -->
  <rect x="30" y="30" width="180" height="400" rx="16" fill="#e3f2fd" opacity="0.5"/>
  <rect x="240" y="30" width="220" height="400" rx="16" fill="#bbdefb" opacity="0.5"/>
  <rect x="490" y="30" width="260" height="400" rx="16" fill="#90caf9" opacity="0.5"/>
  <rect x="780" y="30" width="280" height="400" rx="16" fill="#64b5f6" opacity="0.5"/>

  <!-- Layer labels -->
  <text x="120" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565c0">Layer 0</text>
  <text x="120" y="80" text-anchor="middle" font-size="12" fill="#1565c0">Start</text>
  <text x="350" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565c0">Layer 1</text>
  <text x="350" y="80" text-anchor="middle" font-size="12" fill="#1565c0">Friends</text>
  <text x="620" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565c0">Layer 2</text>
  <text x="620" y="80" text-anchor="middle" font-size="12" fill="#1565c0">Friends of friends</text>
  <text x="920" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565c0">Layer 3</text>
  <text x="920" y="80" text-anchor="middle" font-size="12" fill="#1565c0">3 hops away</text>

  <!-- Layer 0: You -->
  <circle cx="120" cy="200" r="28" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
  <text x="120" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="white">You</text>

  <!-- Layer 1: Friends (3 nodes) -->
  <circle cx="310" cy="130" r="22" fill="#42a5f5" stroke="#1e88e5" stroke-width="2"/>
  <text x="310" y="136" text-anchor="middle" font-size="12" fill="white">A</text>
  <circle cx="310" cy="210" r="22" fill="#42a5f5" stroke="#1e88e5" stroke-width="2"/>
  <text x="310" y="216" text-anchor="middle" font-size="12" fill="white">B</text>
  <circle cx="310" cy="290" r="22" fill="#42a5f5" stroke="#1e88e5" stroke-width="2"/>
  <text x="310" y="296" text-anchor="middle" font-size="12" fill="white">C</text>

  <!-- Layer 2: Friends of friends (5 nodes) -->
  <circle cx="570" cy="110" r="18" fill="#90caf9" stroke="#42a5f5" stroke-width="2"/>
  <text x="570" y="115" text-anchor="middle" font-size="11" fill="#0d47a1">D</text>
  <circle cx="570" cy="170" r="18" fill="#90caf9" stroke="#42a5f5" stroke-width="2"/>
  <text x="570" y="175" text-anchor="middle" font-size="11" fill="#0d47a1">E</text>
  <circle cx="570" cy="230" r="18" fill="#90caf9" stroke="#42a5f5" stroke-width="2"/>
  <text x="570" y="235" text-anchor="middle" font-size="11" fill="#0d47a1">F</text>
  <circle cx="570" cy="290" r="18" fill="#90caf9" stroke="#42a5f5" stroke-width="2"/>
  <text x="570" y="295" text-anchor="middle" font-size="11" fill="#0d47a1">G</text>
  <circle cx="570" cy="350" r="18" fill="#90caf9" stroke="#42a5f5" stroke-width="2"/>
  <text x="570" y="355" text-anchor="middle" font-size="11" fill="#0d47a1">H</text>

  <!-- Layer 3: 3 hops (6 nodes) -->
  <circle cx="870" cy="110" r="16" fill="#bbdefb" stroke="#90caf9" stroke-width="2"/>
  <text x="870" y="115" text-anchor="middle" font-size="10" fill="#1565c0">I</text>
  <circle cx="870" cy="165" r="16" fill="#bbdefb" stroke="#90caf9" stroke-width="2"/>
  <text x="870" y="170" text-anchor="middle" font-size="10" fill="#1565c0">J</text>
  <circle cx="870" cy="220" r="16" fill="#bbdefb" stroke="#90caf9" stroke-width="2"/>
  <text x="870" y="225" text-anchor="middle" font-size="10" fill="#1565c0">K</text>
  <circle cx="870" cy="275" r="16" fill="#bbdefb" stroke="#90caf9" stroke-width="2"/>
  <text x="870" y="280" text-anchor="middle" font-size="10" fill="#1565c0">L</text>
  <circle cx="960" cy="140" r="16" fill="#bbdefb" stroke="#90caf9" stroke-width="2"/>
  <text x="960" y="145" text-anchor="middle" font-size="10" fill="#1565c0">M</text>
  <circle cx="960" cy="310" r="16" fill="#bbdefb" stroke="#90caf9" stroke-width="2"/>
  <text x="960" y="315" text-anchor="middle" font-size="10" fill="#1565c0">N</text>

  <!-- Edges: Layer 0 → Layer 1 -->
  <line x1="148" y1="190" x2="288" y2="135" stroke="#888" stroke-width="1.8" marker-end="url(#arrowhead)"/>
  <line x1="148" y1="200" x2="288" y2="210" stroke="#888" stroke-width="1.8" marker-end="url(#arrowhead)"/>
  <line x1="148" y1="210" x2="288" y2="285" stroke="#888" stroke-width="1.8" marker-end="url(#arrowhead)"/>

  <!-- Edges: Layer 1 → Layer 2 -->
  <line x1="332" y1="122" x2="552" y2="114" stroke="#aaa" stroke-width="1.4" marker-end="url(#arrowhead)"/>
  <line x1="332" y1="138" x2="552" y2="166" stroke="#aaa" stroke-width="1.4" marker-end="url(#arrowhead)"/>
  <line x1="332" y1="204" x2="552" y2="174" stroke="#aaa" stroke-width="1.4" marker-end="url(#arrowhead)"/>
  <line x1="332" y1="216" x2="552" y2="228" stroke="#aaa" stroke-width="1.4" marker-end="url(#arrowhead)"/>
  <line x1="332" y1="284" x2="552" y2="292" stroke="#aaa" stroke-width="1.4" marker-end="url(#arrowhead)"/>
  <line x1="332" y1="296" x2="552" y2="346" stroke="#aaa" stroke-width="1.4" marker-end="url(#arrowhead)"/>

  <!-- Edges: Layer 2 → Layer 3 -->
  <line x1="588" y1="106" x2="854" y2="112" stroke="#bbb" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <line x1="588" y1="168" x2="854" y2="166" stroke="#bbb" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <line x1="588" y1="116" x2="944" y2="138" stroke="#bbb" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <line x1="588" y1="232" x2="854" y2="222" stroke="#bbb" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <line x1="588" y1="290" x2="854" y2="276" stroke="#bbb" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <line x1="588" y1="352" x2="944" y2="312" stroke="#bbb" stroke-width="1.2" marker-end="url(#arrowhead)"/>

  <!-- Distance & Queue annotation -->
  <text x="120" y="380" text-anchor="middle" font-size="13" fill="#555">dist = 0</text>
  <rect x="85" y="395" width="70" height="24" rx="4" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="120" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">Q: [You]</text>
  
  <text x="350" y="380" text-anchor="middle" font-size="13" fill="#555">dist = 1</text>
  <rect x="305" y="395" width="90" height="24" rx="4" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="350" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">Q: [A,B,C]</text>

  <text x="620" y="380" text-anchor="middle" font-size="13" fill="#555">dist = 2</text>
  <rect x="555" y="395" width="130" height="24" rx="4" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="620" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">Q: [D,E,F,G,H]</text>

  <text x="920" y="380" text-anchor="middle" font-size="13" fill="#555">dist = 3</text>
  <rect x="840" y="395" width="160" height="24" rx="4" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="920" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">Q: [I,J,K,L,M,N]</text>
</svg>
