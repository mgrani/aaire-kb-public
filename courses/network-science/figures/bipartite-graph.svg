<svg xmlns="http://www.w3.org/2000/svg" width="600" height="430" viewBox="0 0 600 430" role="img" aria-labelledby="title desc">
  <title id="title">Bipartite graph</title>
  <desc id="desc">Two disjoint node sets connected only across the partition, illustrating a bipartite graph.</desc>

  <rect x="20" y="20" width="560" height="390" rx="16" fill="#f7f7f7" stroke="#c8c8c8" stroke-width="2"/>

  <text x="150" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#444444" font-weight="700">Set U</text>
  <text x="450" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#444444" font-weight="700">Set V</text>

  <!-- Edges (U1–U3 × V1–V3 only) -->
  <line x1="150" y1="120" x2="450" y2="120" stroke="#9a9a9a" stroke-width="1.8"/>
  <line x1="150" y1="120" x2="450" y2="230" stroke="#9a9a9a" stroke-width="1.8"/>
  <line x1="150" y1="230" x2="450" y2="120" stroke="#9a9a9a" stroke-width="1.8"/>
  <line x1="150" y1="230" x2="450" y2="230" stroke="#9a9a9a" stroke-width="1.8"/>
  <line x1="150" y1="230" x2="450" y2="340" stroke="#9a9a9a" stroke-width="1.8"/>
  <line x1="150" y1="340" x2="450" y2="230" stroke="#9a9a9a" stroke-width="1.8"/>
  <line x1="150" y1="340" x2="450" y2="340" stroke="#9a9a9a" stroke-width="1.8"/>

  <!-- Set U nodes -->
  <circle cx="150" cy="120" r="24" fill="#5c84c7" stroke="#2f4e84" stroke-width="2"/>
  <circle cx="150" cy="230" r="24" fill="#5c84c7" stroke="#2f4e84" stroke-width="2"/>
  <circle cx="150" cy="340" r="24" fill="#5c84c7" stroke="#2f4e84" stroke-width="2"/>

  <!-- Set V nodes -->
  <circle cx="450" cy="120" r="24" fill="#e2a15d" stroke="#9d5f20" stroke-width="2"/>
  <circle cx="450" cy="230" r="24" fill="#e2a15d" stroke="#9d5f20" stroke-width="2"/>
  <circle cx="450" cy="340" r="24" fill="#e2a15d" stroke="#9d5f20" stroke-width="2"/>

  <!-- Labels -->
  <text x="150" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" font-weight="700">u₁</text>
  <text x="150" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" font-weight="700">u₂</text>
  <text x="150" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" font-weight="700">u₃</text>
  <text x="450" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" font-weight="700">v₁</text>
  <text x="450" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" font-weight="700">v₂</text>
  <text x="450" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" font-weight="700">v₃</text>

  <text x="300" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555">
    Edges only connect nodes across the two sets, never within one set.
  </text>
</svg>
