<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="'Segoe UI', Arial, sans-serif">

  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#263238">Same graph, four notions of "important"</text>

  <!-- ===== Common graph layout (used in 4 panels) =====
       Nodes: 1-7 with positions baseline -->
  <!-- Coordinates of nodes in a panel-local frame; we shift per panel -->
  <!-- node positions inside panel: 1(60,80) 2(150,40) 3(220,90) 4(150,140) 5(60,180) 6(220,180) 7(290,140) -->

  <!-- ============== PANEL 1: DEGREE ============== -->
  <g transform="translate(20,50)">
    <rect x="0" y="0" width="330" height="220" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
    <text x="165" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">Degree</text>
    <text x="165" y="36" text-anchor="middle" font-size="10" fill="#1565c0">how many direct connections</text>

    <line x1="60" y1="100" x2="150" y2="60"  stroke="#90caf9" stroke-width="1.6"/>
    <line x1="60" y1="100" x2="150" y2="160" stroke="#90caf9" stroke-width="1.6"/>
    <line x1="150" y1="60" x2="220" y2="110" stroke="#90caf9" stroke-width="1.6"/>
    <line x1="150" y1="160" x2="220" y2="110" stroke="#90caf9" stroke-width="1.6"/>
    <line x1="150" y1="60" x2="150" y2="160" stroke="#90caf9" stroke-width="1.6"/>
    <line x1="220" y1="110" x2="290" y2="160" stroke="#90caf9" stroke-width="1.6"/>
    <line x1="60" y1="100" x2="60" y2="180"  stroke="#90caf9" stroke-width="1.6"/>

    <!-- highlight node 4 (150,160) and 3 (220,110) — degree = 4 -->
    <circle cx="60"  cy="100" r="11" fill="#90caf9"/>
    <circle cx="150" cy="60"  r="13" fill="#1976d2"/>
    <circle cx="220" cy="110" r="16" fill="#0d47a1" stroke="#000" stroke-width="1.5"/>
    <circle cx="150" cy="160" r="16" fill="#0d47a1" stroke="#000" stroke-width="1.5"/>
    <circle cx="60"  cy="180" r="9"  fill="#90caf9"/>
    <circle cx="290" cy="160" r="9"  fill="#90caf9"/>
    <text x="165" y="208" text-anchor="middle" font-size="10" fill="#0d47a1">node size ∝ degree</text>
  </g>

  <!-- ============== PANEL 2: CLOSENESS ============== -->
  <g transform="translate(370,50)">
    <rect x="0" y="0" width="330" height="220" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4"/>
    <text x="165" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">Closeness</text>
    <text x="165" y="36" text-anchor="middle" font-size="10" fill="#2e7d32">low average distance to all others</text>

    <line x1="60" y1="100" x2="150" y2="60"  stroke="#a5d6a7" stroke-width="1.6"/>
    <line x1="60" y1="100" x2="150" y2="160" stroke="#a5d6a7" stroke-width="1.6"/>
    <line x1="150" y1="60" x2="220" y2="110" stroke="#a5d6a7" stroke-width="1.6"/>
    <line x1="150" y1="160" x2="220" y2="110" stroke="#a5d6a7" stroke-width="1.6"/>
    <line x1="150" y1="60" x2="150" y2="160" stroke="#a5d6a7" stroke-width="1.6"/>
    <line x1="220" y1="110" x2="290" y2="160" stroke="#a5d6a7" stroke-width="1.6"/>
    <line x1="60" y1="100" x2="60" y2="180"  stroke="#a5d6a7" stroke-width="1.6"/>

    <!-- highlight central node 4 (150,160) and 3 (220,110) -->
    <circle cx="60"  cy="100" r="9" fill="#a5d6a7"/>
    <circle cx="150" cy="60"  r="12" fill="#66bb6a"/>
    <circle cx="220" cy="110" r="16" fill="#1b5e20" stroke="#000" stroke-width="1.5"/>
    <circle cx="150" cy="160" r="14" fill="#388e3c"/>
    <circle cx="60"  cy="180" r="9" fill="#a5d6a7"/>
    <circle cx="290" cy="160" r="9" fill="#a5d6a7"/>
    <text x="165" y="208" text-anchor="middle" font-size="10" fill="#1b5e20">closer to center → larger</text>
  </g>

  <!-- ============== PANEL 3: BETWEENNESS ============== -->
  <g transform="translate(20,300)">
    <rect x="0" y="0" width="330" height="220" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.4"/>
    <text x="165" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">Betweenness</text>
    <text x="165" y="36" text-anchor="middle" font-size="10" fill="#ef6c00">how often lies on shortest paths</text>

    <line x1="60" y1="100" x2="150" y2="60"  stroke="#ffcc80" stroke-width="1.6"/>
    <line x1="60" y1="100" x2="150" y2="160" stroke="#ffcc80" stroke-width="1.6"/>
    <line x1="150" y1="60" x2="220" y2="110" stroke="#ffcc80" stroke-width="1.6"/>
    <line x1="150" y1="160" x2="220" y2="110" stroke="#ffcc80" stroke-width="1.6"/>
    <line x1="150" y1="60" x2="150" y2="160" stroke="#ffcc80" stroke-width="1.6"/>
    <!-- bridging edge -->
    <line x1="220" y1="110" x2="290" y2="160" stroke="#bf360c" stroke-width="3.5"/>
    <line x1="60" y1="100" x2="60" y2="180"  stroke="#ffcc80" stroke-width="1.6"/>

    <circle cx="60"  cy="100" r="9" fill="#ffcc80"/>
    <circle cx="150" cy="60"  r="9" fill="#ffcc80"/>
    <circle cx="220" cy="110" r="18" fill="#bf360c" stroke="#000" stroke-width="1.5"/>
    <circle cx="150" cy="160" r="9" fill="#ffcc80"/>
    <circle cx="60"  cy="180" r="9" fill="#ffcc80"/>
    <circle cx="290" cy="160" r="9" fill="#ffcc80"/>
    <text x="165" y="208" text-anchor="middle" font-size="10" fill="#bf360c">bridge node carries all cross-traffic</text>
  </g>

  <!-- ============== PANEL 4: EIGENVECTOR ============== -->
  <g transform="translate(370,300)">
    <rect x="0" y="0" width="330" height="220" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.4"/>
    <text x="165" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a148c">Eigenvector</text>
    <text x="165" y="36" text-anchor="middle" font-size="10" fill="#6a1b9a">connected to other important nodes</text>

    <line x1="60" y1="100" x2="150" y2="60"  stroke="#ce93d8" stroke-width="1.6"/>
    <line x1="60" y1="100" x2="150" y2="160" stroke="#ce93d8" stroke-width="1.6"/>
    <line x1="150" y1="60" x2="220" y2="110" stroke="#ce93d8" stroke-width="1.6"/>
    <line x1="150" y1="160" x2="220" y2="110" stroke="#ce93d8" stroke-width="1.6"/>
    <line x1="150" y1="60" x2="150" y2="160" stroke="#ce93d8" stroke-width="1.6"/>
    <line x1="220" y1="110" x2="290" y2="160" stroke="#ce93d8" stroke-width="1.6"/>
    <line x1="60" y1="100" x2="60" y2="180"  stroke="#ce93d8" stroke-width="1.6"/>

    <!-- nodes inside the dense triangle 2-3-4 boosted -->
    <circle cx="60"  cy="100" r="8"  fill="#ce93d8"/>
    <circle cx="150" cy="60"  r="15" fill="#7b1fa2"/>
    <circle cx="220" cy="110" r="17" fill="#4a148c" stroke="#000" stroke-width="1.5"/>
    <circle cx="150" cy="160" r="15" fill="#7b1fa2"/>
    <circle cx="60"  cy="180" r="7"  fill="#ce93d8"/>
    <circle cx="290" cy="160" r="8"  fill="#ce93d8"/>
    <text x="165" y="208" text-anchor="middle" font-size="10" fill="#4a148c">prestige flows from prestigious neighbors</text>
  </g>
</svg>
