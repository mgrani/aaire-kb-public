<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Accessibility example for closeness centrality</title>
  <desc id="desc">A small road-like network where a central service hub has short paths to most districts, while a peripheral hub has longer paths.</desc>
  <defs>
    <style>
      .edge { stroke: #6b7280; stroke-width: 4; stroke-linecap: round; }
      .node { fill: #e5e7eb; stroke: #374151; stroke-width: 3; }
      .hub { fill: #22c55e; stroke: #166534; stroke-width: 4; }
      .bad { fill: #f59e0b; stroke: #92400e; stroke-width: 4; }
      .label { font: 17px sans-serif; fill: #111827; text-anchor: middle; }
      .note { font: 15px sans-serif; fill: #374151; }
    </style>
  </defs>
  <line x1="170" y1="95" x2="310" y2="150" class="edge"/>
  <line x1="310" y1="150" x2="450" y2="210" class="edge"/>
  <line x1="450" y1="210" x2="590" y2="145" class="edge"/>
  <line x1="590" y1="145" x2="735" y2="90" class="edge"/>
  <line x1="450" y1="210" x2="585" y2="300" class="edge"/>
  <line x1="310" y1="150" x2="235" y2="285" class="edge"/>
  <line x1="235" y1="285" x2="450" y2="210" class="edge"/>
  <line x1="585" y1="300" x2="735" y2="90" class="edge"/>

  <circle cx="170" cy="95" r="28" class="bad"/>
  <circle cx="310" cy="150" r="24" class="node"/>
  <circle cx="450" cy="210" r="32" class="hub"/>
  <circle cx="590" cy="145" r="24" class="node"/>
  <circle cx="735" cy="90" r="24" class="node"/>
  <circle cx="235" cy="285" r="24" class="node"/>
  <circle cx="585" cy="300" r="24" class="node"/>

  <text x="170" y="101" class="label">A</text>
  <text x="310" y="156" class="label">B</text>
  <text x="450" y="216" class="label">C</text>
  <text x="590" y="151" class="label">D</text>
  <text x="735" y="96" class="label">E</text>
  <text x="235" y="291" class="label">F</text>
  <text x="585" y="306" class="label">G</text>

  <text x="450" y="370" class="note" text-anchor="middle">C is a better service hub: short paths to almost every district.</text>
  <text x="450" y="395" class="note" text-anchor="middle">A is connected, but peripheral: average distance is larger.</text>
</svg>
