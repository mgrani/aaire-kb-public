<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" role="img" aria-labelledby="title desc">
  <title id="title">Toy graph for closeness, harmonic centrality, and betweenness</title>
  <desc id="desc">A five-node graph where A connects to B, C, and D, and D connects to E.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7a8494"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="418" height="358" rx="14" fill="#ffffff" stroke="#d8dee8"/>

  <g fill="none" stroke="#8792a2" stroke-width="7" stroke-linecap="round">
    <path d="M185 168 L88 86"/>
    <path d="M185 168 L82 252"/>
    <path d="M185 168 L285 168"/>
    <path d="M285 168 L348 168"/>
  </g>

  <g fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 8">
    <path d="M88 86 C152 90 207 126 285 168"/>
    <path d="M82 252 C152 250 210 210 285 168"/>
    <path d="M185 168 L348 168"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" text-anchor="middle" font-weight="700" filter="url(#shadow)">
    <g>
      <circle cx="185" cy="168" r="34" fill="#22c55e" stroke="#126c38" stroke-width="3"/>
      <text x="185" y="178" font-size="28" fill="#ffffff">A</text>
    </g>
    <g>
      <circle cx="285" cy="168" r="30" fill="#f59e0b" stroke="#9a5d00" stroke-width="3"/>
      <text x="285" y="178" font-size="26" fill="#1f2937">D</text>
    </g>
    <g>
      <circle cx="88" cy="86" r="26" fill="#e5edf7" stroke="#64748b" stroke-width="3"/>
      <text x="88" y="95" font-size="24" fill="#1f2937">B</text>
    </g>
    <g>
      <circle cx="82" cy="252" r="26" fill="#e5edf7" stroke="#64748b" stroke-width="3"/>
      <text x="82" y="261" font-size="24" fill="#1f2937">C</text>
    </g>
    <g>
      <circle cx="348" cy="168" r="26" fill="#e5edf7" stroke="#64748b" stroke-width="3"/>
      <text x="348" y="177" font-size="24" fill="#1f2937">E</text>
    </g>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="16" fill="#334155">
    <text x="185" y="48" text-anchor="middle" font-weight="700">Toy network</text>
    <text x="185" y="71" text-anchor="middle">A is near everyone</text>
    <text x="285" y="226" text-anchor="middle" font-weight="700" fill="#7c4a00">D brokers access to E</text>
    <text x="210" y="315" text-anchor="middle">Edges: AB, AC, AD, DE</text>
  </g>

  <g transform="translate(28 300)" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">
    <circle cx="0" cy="0" r="7" fill="#22c55e"/>
    <text x="14" y="5">high closeness / harmonic</text>
    <circle cx="0" cy="24" r="7" fill="#f59e0b"/>
    <text x="14" y="29">broker on paths to E</text>
  </g>
</svg>
