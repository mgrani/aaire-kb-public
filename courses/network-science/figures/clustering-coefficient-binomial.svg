<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" role="img" aria-labelledby="title desc">
  <title id="title">Clustering coefficient and binomial denominator</title>
  <desc id="desc">A graph around a focal node showing all possible neighbor-neighbor relations, existing relations, and the binomial coefficient k choose 2.</desc>
  <defs>
    <style>
      .title { font: 700 22px Inter, Arial, sans-serif; fill: #0f172a; }
      .head { font: 700 16px Inter, Arial, sans-serif; fill: #0f172a; }
      .text { font: 14px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 12px Inter, Arial, sans-serif; fill: #475569; }
      .possible { stroke: #cbd5e1; stroke-width: 3; stroke-dasharray: 7 7; stroke-linecap: round; }
      .existing { stroke: #16a34a; stroke-width: 5; stroke-linecap: round; }
      .ego { fill: #2563eb; stroke: #1e3a8a; stroke-width: 3; }
      .neighbor { fill: #bfdbfe; stroke: #2563eb; stroke-width: 3; }
      .panel { fill: #ffffff; stroke: #d8dee8; stroke-width: 2; rx: 14; }
      .green { fill: #dcfce7; stroke: #16a34a; }
      .blue { fill: #e0f2fe; stroke: #0284c7; }
    </style>
  </defs>

  <rect x="1" y="1" width="938" height="478" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="470" y="36" text-anchor="middle" class="title">Local clustering coefficient: existing friend ties out of all possible friend ties</text>

  <g transform="translate(35 75)">
    <rect width="415" height="330" class="panel"/>
    <text x="24" y="34" class="head">One focal node with k = 4 neighbors</text>

    <line x1="210" y1="165" x2="110" y2="80" class="existing"/>
    <line x1="210" y1="165" x2="310" y2="80" class="existing"/>
    <line x1="210" y1="165" x2="110" y2="250" class="existing"/>
    <line x1="210" y1="165" x2="310" y2="250" class="existing"/>

    <line x1="110" y1="80" x2="310" y2="80" class="existing"/>
    <line x1="110" y1="80" x2="110" y2="250" class="existing"/>
    <line x1="310" y1="80" x2="310" y2="250" class="possible"/>
    <line x1="110" y1="250" x2="310" y2="250" class="possible"/>
    <line x1="110" y1="80" x2="310" y2="250" class="possible"/>
    <line x1="310" y1="80" x2="110" y2="250" class="existing"/>

    <circle cx="210" cy="165" r="26" class="ego"/>
    <text x="210" y="171" text-anchor="middle" class="head" fill="#ffffff">i</text>
    <circle cx="110" cy="80" r="22" class="neighbor"/>
    <circle cx="310" cy="80" r="22" class="neighbor"/>
    <circle cx="110" cy="250" r="22" class="neighbor"/>
    <circle cx="310" cy="250" r="22" class="neighbor"/>
    <text x="110" y="85" text-anchor="middle" class="head">A</text>
    <text x="310" y="85" text-anchor="middle" class="head">B</text>
    <text x="110" y="255" text-anchor="middle" class="head">C</text>
    <text x="310" y="255" text-anchor="middle" class="head">D</text>

    <text x="35" y="302" class="small">solid green = existing</text>
    <text x="35" y="318" class="small">neighbor-neighbor tie</text>
    <text x="245" y="302" class="small">dashed gray = possible</text>
    <text x="245" y="318" class="small">but missing</text>
  </g>

  <g transform="translate(490 75)">
    <rect width="415" height="330" class="panel"/>
    <text x="24" y="34" class="head">Why the denominator is binomial</text>

    <text x="24" y="70" class="text">Among k neighbors, each possible friend relation</text>
    <text x="24" y="90" class="text">is an unordered pair.</text>

    <rect x="35" y="118" width="70" height="40" class="blue"/>
    <rect x="112" y="118" width="70" height="40" class="blue"/>
    <rect x="189" y="118" width="70" height="40" class="blue"/>
    <rect x="266" y="118" width="70" height="40" class="blue"/>
    <text x="70" y="143" text-anchor="middle" class="head">A</text>
    <text x="147" y="143" text-anchor="middle" class="head">B</text>
    <text x="224" y="143" text-anchor="middle" class="head">C</text>
    <text x="301" y="143" text-anchor="middle" class="head">D</text>

    <text x="24" y="184" class="text">All possible pairs:</text>
    <text x="155" y="184" class="head">AB, AC, AD, BC, BD, CD</text>

    <rect x="24" y="214" width="360" height="72" rx="12" class="green"/>
    <text x="204" y="244" text-anchor="middle" class="head">number of possible pairs</text>
    <text x="204" y="272" text-anchor="middle" class="title">C(4,2) = 4·3 / 2 = 6</text>

    <text x="24" y="315" class="head">Here: 3 existing out of 6 possible</text>
    <text x="285" y="315" class="title">C_i = 3/6 = 0.5</text>
  </g>
</svg>
