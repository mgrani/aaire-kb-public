<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <!-- Left: Weakly connected (directed, not strongly connected) -->
  <rect x="20" y="20" width="440" height="320" rx="16" fill="#fff3e0" opacity="0.4" stroke="#e65100" stroke-width="1.5"/>
  <text x="240" y="55" text-anchor="middle" font-size="16" font-weight="bold" fill="#e65100">Weakly Connected</text>
  <text x="240" y="75" text-anchor="middle" font-size="12" fill="#bf360c">(directed, NOT strongly connected)</text>

  <!-- Nodes -->
  <circle cx="100" cy="180" r="24" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="100" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#bf360c">A</text>
  <circle cx="240" cy="130" r="24" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="240" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#bf360c">B</text>
  <circle cx="240" cy="240" r="24" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="240" y="246" text-anchor="middle" font-size="14" font-weight="bold" fill="#bf360c">C</text>
  <circle cx="380" cy="180" r="24" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="380" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#bf360c">D</text>

  <!-- Directed edges (one-way chain) -->
  <line x1="124" y1="170" x2="216" y2="138" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="264" y1="130" x2="356" y2="172" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="124" y1="192" x2="216" y2="232" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="264" y1="240" x2="356" y2="190" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Label -->
  <text x="240" y="310" text-anchor="middle" font-size="12" fill="#555">A can reach D, but D cannot reach A</text>

  <!-- Right: Strongly connected -->
  <rect x="520" y="20" width="460" height="320" rx="16" fill="#e8f5e9" opacity="0.4" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="750" y="55" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d32">Strongly Connected</text>
  <text x="750" y="75" text-anchor="middle" font-size="12" fill="#1b5e20">(directed, every pair mutually reachable)</text>

  <!-- Nodes -->
  <circle cx="610" cy="180" r="24" fill="#a5d6a7" stroke="#2e7d32" stroke-width="2"/>
  <text x="610" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">A</text>
  <circle cx="750" cy="120" r="24" fill="#a5d6a7" stroke="#2e7d32" stroke-width="2"/>
  <text x="750" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">B</text>
  <circle cx="750" cy="240" r="24" fill="#a5d6a7" stroke="#2e7d32" stroke-width="2"/>
  <text x="750" y="246" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">C</text>
  <circle cx="890" cy="180" r="24" fill="#a5d6a7" stroke="#2e7d32" stroke-width="2"/>
  <text x="890" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">D</text>

  <!-- Directed edges (cycle: A→B→D→C→A, plus B→C) -->
  <line x1="632" y1="168" x2="726" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="774" y1="120" x2="866" y2="170" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="866" y1="192" x2="774" y2="232" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="726" y1="248" x2="634" y2="194" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="750" y1="144" x2="750" y2="216" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Label -->
  <text x="750" y="310" text-anchor="middle" font-size="12" fill="#555">Every node can reach every other node</text>
</svg>
