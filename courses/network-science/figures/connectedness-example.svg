<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" font-family="'Segoe UI', Arial, sans-serif">

  <!-- ══════════════════════════════════════
       TOP: CONNECTED
  ══════════════════════════════════════ -->
  <rect x="12" y="12" width="456" height="256" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="240" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">Connected</text>
  <text x="240" y="58" text-anchor="middle" font-size="11" fill="#2e7d32">A path exists between every pair of nodes</text>

  <!-- Edges -->
  <line x1="82"  y1="148" x2="175" y2="102" stroke="#43a047" stroke-width="2.2"/>
  <line x1="82"  y1="158" x2="175" y2="204" stroke="#43a047" stroke-width="2.2"/>
  <line x1="199" y1="96"  x2="302" y2="96"  stroke="#43a047" stroke-width="2.2"/>
  <line x1="199" y1="210" x2="302" y2="210" stroke="#43a047" stroke-width="2.2"/>
  <line x1="187" y1="118" x2="187" y2="190" stroke="#43a047" stroke-width="2.2"/>
  <line x1="314" y1="104" x2="388" y2="148" stroke="#43a047" stroke-width="2.2"/>
  <line x1="314" y1="202" x2="388" y2="158" stroke="#43a047" stroke-width="2.2"/>

  <!-- Highlighted path A→B→D→F (dashed overlay) -->
  <polyline points="82,148 187,96 314,96 390,153"
    fill="none" stroke="#1b5e20" stroke-width="3.5" stroke-dasharray="7,3"
    stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

  <!-- Nodes -->
  <circle cx="82"  cy="153" r="22" fill="#2e7d32" stroke="#1b5e20" stroke-width="2.5"/>
  <text x="82"  y="159" text-anchor="middle" font-size="14" font-weight="bold" fill="white">A</text>

  <circle cx="187" cy="96"  r="22" fill="#388e3c" stroke="#2e7d32" stroke-width="2"/>
  <text x="187" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="white">B</text>

  <circle cx="187" cy="207" r="22" fill="#388e3c" stroke="#2e7d32" stroke-width="2"/>
  <text x="187" y="213" text-anchor="middle" font-size="14" font-weight="bold" fill="white">C</text>

  <circle cx="314" cy="96"  r="22" fill="#43a047" stroke="#2e7d32" stroke-width="2"/>
  <text x="314" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="white">D</text>

  <circle cx="314" cy="207" r="22" fill="#43a047" stroke="#2e7d32" stroke-width="2"/>
  <text x="314" y="213" text-anchor="middle" font-size="14" font-weight="bold" fill="white">E</text>

  <circle cx="390" cy="153" r="22" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/>
  <text x="390" y="159" text-anchor="middle" font-size="14" font-weight="bold" fill="white">F</text>

  <!-- Caption -->
  <text x="240" y="248" text-anchor="middle" font-size="11" fill="#1b5e20">Path A → B → D → F shown — one connected component</text>

  <!-- ══════════════════════════════════════
       SEPARATOR
  ══════════════════════════════════════ -->
  <line x1="40" y1="278" x2="440" y2="278" stroke="#ccc" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="240" y="293" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">vs.</text>

  <!-- ══════════════════════════════════════
       BOTTOM: DISCONNECTED
  ══════════════════════════════════════ -->
  <rect x="12" y="300" width="456" height="248" rx="14" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
  <text x="240" y="328" text-anchor="middle" font-size="14" font-weight="bold" fill="#b71c1c">Disconnected</text>
  <text x="240" y="346" text-anchor="middle" font-size="11" fill="#c62828">No path exists between the two clusters</text>

  <!-- Component 1 internal edges -->
  <line x1="90"  y1="410" x2="175" y2="376" stroke="#e57373" stroke-width="2.2"/>
  <line x1="90"  y1="422" x2="175" y2="456" stroke="#e57373" stroke-width="2.2"/>

  <!-- Component 2 internal edges -->
  <line x1="300" y1="398" x2="388" y2="366" stroke="#ef9a9a" stroke-width="2.2"/>
  <line x1="300" y1="410" x2="388" y2="454" stroke="#ef9a9a" stroke-width="2.2"/>
  <line x1="394" y1="370" x2="394" y2="450" stroke="#ef9a9a" stroke-width="2.2"/>

  <!-- No-path gap annotation -->
  <line x1="205" y1="416" x2="270" y2="406" stroke="#c62828" stroke-width="1.3" stroke-dasharray="4,3" opacity="0.7"/>
  <text x="238" y="400" text-anchor="middle" font-size="10" fill="#c62828" font-weight="bold">no path</text>

  <!-- Component 1 nodes -->
  <circle cx="88"  cy="416" r="22" fill="#c62828" stroke="#b71c1c" stroke-width="2.5"/>
  <text x="88"  y="422" text-anchor="middle" font-size="14" font-weight="bold" fill="white">A</text>
  <circle cx="178" cy="372" r="22" fill="#e53935" stroke="#c62828" stroke-width="2"/>
  <text x="178" y="378" text-anchor="middle" font-size="14" font-weight="bold" fill="white">B</text>
  <circle cx="178" cy="460" r="22" fill="#e53935" stroke="#c62828" stroke-width="2"/>
  <text x="178" y="466" text-anchor="middle" font-size="14" font-weight="bold" fill="white">C</text>

  <!-- Component 2 nodes -->
  <circle cx="298" cy="404" r="22" fill="#ef5350" stroke="#c62828" stroke-width="2"/>
  <text x="298" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="white">D</text>
  <circle cx="392" cy="362" r="22" fill="#ef9a9a" stroke="#c62828" stroke-width="2"/>
  <text x="392" y="368" text-anchor="middle" font-size="14" font-weight="bold" fill="white">E</text>
  <circle cx="392" cy="458" r="22" fill="#ef9a9a" stroke="#c62828" stroke-width="2"/>
  <text x="392" y="464" text-anchor="middle" font-size="14" font-weight="bold" fill="white">F</text>

  <!-- Component labels -->
  <rect x="50"  y="490" width="152" height="22" rx="6" fill="#ffcdd2" opacity="0.6" stroke="#e57373" stroke-width="1"/>
  <text x="126" y="505" text-anchor="middle" font-size="11" fill="#b71c1c" font-weight="bold">Component 1: {A,B,C}</text>
  <rect x="255" y="490" width="152" height="22" rx="6" fill="#ffcdd2" opacity="0.6" stroke="#e57373" stroke-width="1"/>
  <text x="331" y="505" text-anchor="middle" font-size="11" fill="#b71c1c" font-weight="bold">Component 2: {D,E,F}</text>

  <!-- Caption -->
  <text x="240" y="534" text-anchor="middle" font-size="11" fill="#c62828">A cannot reach D, E, or F — two connected components</text>

</svg>
