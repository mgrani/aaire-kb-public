<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Decentralized search with local information</title>
  <desc id="desc">A source forwards a message using only local choices toward a target across short- and long-range links.</desc>
  <rect width="1200" height="360" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111111">Decentralized search uses local views, not global shortest paths</text>
  <rect x="50" y="70" width="1100" height="240" rx="20" fill="#f7f7f7" stroke="#c8c8c8" stroke-width="2"/>

  <g stroke="#a0a0a0" stroke-width="2">
    <line x1="140" y1="190" x2="250" y2="130"/><line x1="250" y1="130" x2="360" y2="180"/><line x1="360" y1="180" x2="470" y2="120"/><line x1="470" y1="120" x2="600" y2="175"/><line x1="600" y1="175" x2="730" y2="120"/><line x1="730" y1="120" x2="840" y2="180"/><line x1="840" y1="180" x2="970" y2="130"/>
    <line x1="250" y1="130" x2="730" y2="120" stroke="#d0b27b" stroke-dasharray="8 6"/><line x1="360" y1="180" x2="840" y2="180" stroke="#d0b27b" stroke-dasharray="8 6"/>
  </g>
  <g>
    <circle cx="140" cy="190" r="20" fill="#5c84c7" stroke="#2f4e84" stroke-width="2"/>
    <circle cx="250" cy="130" r="20" fill="#d9d9d9" stroke="#7a7a7a" stroke-width="2"/>
    <circle cx="360" cy="180" r="20" fill="#d9d9d9" stroke="#7a7a7a" stroke-width="2"/>
    <circle cx="470" cy="120" r="20" fill="#d9d9d9" stroke="#7a7a7a" stroke-width="2"/>
    <circle cx="600" cy="175" r="20" fill="#d9d9d9" stroke="#7a7a7a" stroke-width="2"/>
    <circle cx="730" cy="120" r="20" fill="#d9d9d9" stroke="#7a7a7a" stroke-width="2"/>
    <circle cx="840" cy="180" r="20" fill="#d9d9d9" stroke="#7a7a7a" stroke-width="2"/>
    <circle cx="970" cy="130" r="20" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/>
  </g>
  <g stroke="#4f8d58" stroke-width="4">
    <line x1="140" y1="190" x2="250" y2="130"/><line x1="250" y1="130" x2="730" y2="120"/><line x1="730" y1="120" x2="840" y2="180"/><line x1="840" y1="180" x2="970" y2="130"/>
  </g>
  <text x="140" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2f4e84">source</text>
  <text x="970" y="165" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#9a3e35">target</text>
  <text x="600" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#555555">Green path is found by local forwarding; dashed links are long-range shortcuts that make local search possible.</text>
</svg>
