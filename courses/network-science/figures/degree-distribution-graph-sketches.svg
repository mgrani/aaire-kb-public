<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">Graph sketches matching two degree distributions</title>
  <desc id="desc">Left panel shows a homogeneous graph with similar degrees. Right panel shows a hub dominated graph with many leaves attached to few central hubs.</desc>
  <defs>
    <style>
      .title { font: 24px sans-serif; font-weight: 700; fill: #202124; }
      .label { font: 16px sans-serif; fill: #444; }
      .edge { stroke: #5f6368; stroke-width: 2; }
      .nodeA { fill: #4c78a8; stroke: #1f3b57; stroke-width: 2; }
      .nodeB { fill: #f58518; stroke: #7a3f00; stroke-width: 2; }
      .hub { fill: #d95f02; stroke: #7a2600; stroke-width: 3; }
    </style>
  </defs>

  <text x="245" y="34" text-anchor="middle" class="title">A: homogeneous</text>
  <text x="735" y="34" text-anchor="middle" class="title">B: hub-dominated</text>

  <!-- Homogeneous sketch -->
  <g transform="translate(40,40)">
    <line x1="130" y1="55" x2="225" y2="70" class="edge"/>
    <line x1="225" y1="70" x2="300" y2="145" class="edge"/>
    <line x1="300" y1="145" x2="270" y2="240" class="edge"/>
    <line x1="270" y1="240" x2="160" y2="250" class="edge"/>
    <line x1="160" y1="250" x2="70" y2="175" class="edge"/>
    <line x1="70" y1="175" x2="130" y2="55" class="edge"/>
    <line x1="130" y1="55" x2="300" y2="145" class="edge"/>
    <line x1="225" y1="70" x2="270" y2="240" class="edge"/>
    <line x1="70" y1="175" x2="225" y2="70" class="edge"/>
    <line x1="160" y1="250" x2="300" y2="145" class="edge"/>
    <circle cx="130" cy="55" r="17" class="nodeA"/>
    <circle cx="225" cy="70" r="17" class="nodeA"/>
    <circle cx="300" cy="145" r="17" class="nodeA"/>
    <circle cx="270" cy="240" r="17" class="nodeA"/>
    <circle cx="160" cy="250" r="17" class="nodeA"/>
    <circle cx="70" cy="175" r="17" class="nodeA"/>
    <text x="190" y="300" text-anchor="middle" class="label">similar degree, no obvious hub</text>
  </g>

  <!-- Hub sketch -->
  <g transform="translate(530,40)">
    <line x1="190" y1="155" x2="70" y2="65" class="edge"/>
    <line x1="190" y1="155" x2="105" y2="125" class="edge"/>
    <line x1="190" y1="155" x2="80" y2="215" class="edge"/>
    <line x1="190" y1="155" x2="160" y2="270" class="edge"/>
    <line x1="190" y1="155" x2="285" y2="70" class="edge"/>
    <line x1="190" y1="155" x2="320" y2="160" class="edge"/>
    <line x1="190" y1="155" x2="285" y2="250" class="edge"/>
    <line x1="285" y1="70" x2="360" y2="55" class="edge"/>
    <line x1="320" y1="160" x2="380" y2="120" class="edge"/>
    <circle cx="190" cy="155" r="28" class="hub"/>
    <circle cx="70" cy="65" r="14" class="nodeB"/>
    <circle cx="105" cy="125" r="14" class="nodeB"/>
    <circle cx="80" cy="215" r="14" class="nodeB"/>
    <circle cx="160" cy="270" r="14" class="nodeB"/>
    <circle cx="285" cy="70" r="16" class="nodeB"/>
    <circle cx="320" cy="160" r="16" class="nodeB"/>
    <circle cx="285" cy="250" r="14" class="nodeB"/>
    <circle cx="360" cy="55" r="12" class="nodeB"/>
    <circle cx="380" cy="120" r="12" class="nodeB"/>
    <text x="220" y="300" text-anchor="middle" class="label">few hubs, many peripheral nodes</text>
  </g>
</svg>
