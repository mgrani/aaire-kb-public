<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Segoe UI', Arial, sans-serif">

  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#263238">Hierarchical clustering: the cutoff is a modeling choice</text>

  <!-- Y axis: similarity / merge distance -->
  <line x1="60" y1="60" x2="60" y2="320" stroke="#90a4ae" stroke-width="1.4"/>
  <text x="32" y="68" font-size="10" fill="#546e7a">distance</text>
  <text x="32" y="320" font-size="10" fill="#546e7a">0</text>

  <!-- 7 leaves at bottom: A B C D E F G -->
  <g font-size="11" font-weight="bold" fill="#37474f" text-anchor="middle">
    <text x="100" y="345">A</text>
    <text x="150" y="345">B</text>
    <text x="200" y="345">C</text>
    <text x="280" y="345">D</text>
    <text x="340" y="345">E</text>
    <text x="430" y="345">F</text>
    <text x="500" y="345">G</text>
  </g>

  <!-- Vertical lines from leaves to first merges -->
  <g stroke="#455a64" stroke-width="1.6" fill="none">
    <!-- merge 1: A,B at y=270 -->
    <line x1="100" y1="330" x2="100" y2="270"/>
    <line x1="150" y1="330" x2="150" y2="270"/>
    <line x1="100" y1="270" x2="150" y2="270"/>
    <!-- merge 2: (AB),C at y=240 -->
    <line x1="125" y1="270" x2="125" y2="240"/>
    <line x1="200" y1="330" x2="200" y2="240"/>
    <line x1="125" y1="240" x2="200" y2="240"/>
    <!-- merge 3: D,E at y=260 -->
    <line x1="280" y1="330" x2="280" y2="260"/>
    <line x1="340" y1="330" x2="340" y2="260"/>
    <line x1="280" y1="260" x2="340" y2="260"/>
    <!-- merge 4: F,G at y=275 -->
    <line x1="430" y1="330" x2="430" y2="275"/>
    <line x1="500" y1="330" x2="500" y2="275"/>
    <line x1="430" y1="275" x2="500" y2="275"/>
    <!-- merge 5: (DE),(FG) at y=190 -->
    <line x1="310" y1="260" x2="310" y2="190"/>
    <line x1="465" y1="275" x2="465" y2="190"/>
    <line x1="310" y1="190" x2="465" y2="190"/>
    <!-- merge 6: (ABC),(DEFG) at y=110 -->
    <line x1="162" y1="240" x2="162" y2="110"/>
    <line x1="387" y1="190" x2="387" y2="110"/>
    <line x1="162" y1="110" x2="387" y2="110"/>
  </g>

  <!-- Cut lines -->
  <line x1="60" y1="220" x2="600" y2="220" stroke="#d32f2f" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="610" y="224" font-size="10" fill="#d32f2f">cut → 4 groups</text>

  <line x1="60" y1="170" x2="600" y2="170" stroke="#1976d2" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="610" y="174" font-size="10" fill="#1976d2">cut → 3 groups</text>

  <line x1="60" y1="90" x2="600" y2="90" stroke="#388e3c" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="610" y="94" font-size="10" fill="#388e3c">cut → 2 groups</text>

  <text x="320" y="375" text-anchor="middle" font-size="10" fill="#546e7a" font-style="italic">Each horizontal cut yields a different clustering — the analyst chooses the level</text>
</svg>
