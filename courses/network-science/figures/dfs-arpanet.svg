<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 560" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <style>
      .node-visited { fill: #455a64; stroke: #263238; stroke-width: 2; }
      .node-active { fill: #e53935; stroke: #b71c1c; stroke-width: 2.5; }
      .node-pending { fill: #cfd8dc; stroke: #90a4ae; stroke-width: 1.5; }
      .lbl-w { font-size: 12px; fill: white; text-anchor: middle; font-weight: bold; }
      .lbl-dk { font-size: 12px; fill: #1a3358; text-anchor: middle; font-weight: bold; }
      .edge-dfs { stroke: #e53935; stroke-width: 3; stroke-linecap: round; }
      .edge-bg { stroke: #ddd; stroke-width: 1.5; }
      .edge-cross { stroke: #fb8c00; stroke-width: 2; stroke-dasharray: 5,3; }
      .edge-back { stroke: #78909c; stroke-width: 1.5; stroke-dasharray: 4,2; }
      .order-bubble { fill: white; stroke: #b71c1c; stroke-width: 1; }
      .order-text { font-size: 10px; fill: #b71c1c; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <!-- Title -->
  <text x="625" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a3358">DFS on ARPANET — starting from UCLA</text>
  <text x="625" y="55" text-anchor="middle" font-size="14" fill="#546e7a">Discovery order assumes neighbors are processed in adjacency-list order.</text>

  <!-- ── Nodes & Traversal ── -->
  <!-- 
    Discovery order:
    0: UCLA
    1: SRI
    2: UCSB
    3: Stanford
    4: UTAH
    5: SDC
    6: RAND
    7: BBN
    8: MIT
    9: Lincoln
    10: CASE
    11: Carnegie
    12: Harvard
  -->

  <!-- Background edges -->
  <line x1="80" y1="275" x2="245" y2="230" class="edge-bg"/> <!-- UCLA-SRI -->
  <line x1="445" y1="280" x2="445" y2="150" class="edge-bg"/> <!-- SDC-UTAH -->
  <line x1="445" y1="410" x2="645" y2="195" class="edge-bg"/> <!-- BBN-MIT -->

  <!-- Non-tree edges (Cross and Back) -->
  <line x1="80" y1="275" x2="245" y2="330" class="edge-back"/> <!-- UCLA-UCSB -->
  <line x1="80" y1="275" x2="245" y2="130" class="edge-back"/> <!-- UCLA-Stanford -->
  <line x1="245" y1="130" x2="245" y2="230" class="edge-back"/> <!-- Stanford-SRI -->
  <line x1="445" y1="410" x2="645" y2="360" class="edge-cross"/> <!-- BBN-Harvard -->
  <line x1="645" y1="195" x2="845" y2="215" class="edge-cross"/> <!-- MIT-Lincoln -->

  <!-- DFS Tree Edges (Highlit) -->
  <line x1="80" y1="275" x2="245" y2="230" class="edge-dfs"/> <!-- UCLA-SRI (1) -->
  <line x1="245" y1="230" x2="245" y2="330" class="edge-dfs"/> <!-- SRI-UCSB (2) -->
  <line x1="245" y1="230" x2="245" y2="130" class="edge-dfs"/> <!-- SRI-Stanford (3) -->
  <line x1="245" y1="230" x2="445" y2="150" class="edge-dfs"/> <!-- SRI-UTAH (4) -->
  <line x1="445" y1="150" x2="445" y2="280" class="edge-dfs"/> <!-- UTAH-SDC (5) -->
  <line x1="445" y1="280" x2="245" y2="430" class="edge-dfs"/> <!-- SDC-RAND (6) -->
  <line x1="245" y1="430" x2="445" y2="410" class="edge-dfs"/> <!-- RAND-BBN (7) -->
  <line x1="445" y1="410" x2="645" y2="195" class="edge-dfs"/> <!-- BBN-MIT (8) -->
  <line x1="645" y1="195" x2="845" y2="215" class="edge-dfs"/> <!-- MIT-Lincoln (9) -->
  <line x1="845" y1="215" x2="1060" y2="295" class="edge-dfs"/> <!-- Lincoln-CASE (10) -->
  <line x1="1060" y1="295" x2="845" y2="380" class="edge-dfs"/> <!-- CASE-Carnegie (11) -->
  <line x1="845" y1="380" x2="645" y2="360" class="edge-dfs"/> <!-- Carnegie-Harvard (12) -->

  <!-- Nodes -->
  <!-- UCLA -->
  <circle cx="80" cy="275" r="30" class="node-visited"/>
  <text x="80" y="279" class="lbl-w">UCLA</text>
  <rect x="95" y="245" width="20" height="14" rx="3" class="order-bubble"/>
  <text x="105" y="256" class="order-text">0</text>

  <!-- SRI -->
  <circle cx="245" cy="230" r="26" class="node-visited"/>
  <text x="245" y="234" class="lbl-w">SRI</text>
  <rect x="260" y="200" width="20" height="14" rx="3" class="order-bubble"/>
  <text x="270" y="211" class="order-text">1</text>

  <!-- UCSB -->
  <circle cx="245" cy="330" r="26" class="node-visited"/>
  <text x="245" y="334" class="lbl-w">UCSB</text>
  <rect x="260" y="300" width="20" height="14" rx="3" class="order-bubble"/>
  <text x="270" y="311" class="order-text">2</text>

  <!-- Stanford -->
  <circle cx="245" cy="130" r="26" class="node-visited"/>
  <text x="245" y="134" class="lbl-w">Stanford</text>
  <rect x="260" y="100" width="20" height="14" rx="3" class="order-bubble"/>
  <text x="270" y="111" class="order-text">3</text>

  <!-- UTAH -->
  <circle cx="445" cy="150" r="24" class="node-visited"/>
  <text x="445" y="154" class="lbl-w">UTAH</text>
  <rect x="460" y="120" width="20" height="14" rx="3" class="order-bubble"/>
  <text x="470" y="131" class="order-text">4</text>

  <!-- SDC -->
  <circle cx="445" cy="280" r="24" class="node-visited"/>
  <text x="445" y="284" class="lbl-w">SDC</text>
  <rect x="460" y="250" width="20" height="14" rx="3" class="order-bubble"/>
  <text x="470" y="261" class="order-text">5</text>

  <!-- RAND -->
  <circle cx="245" cy="430" r="26" class="node-visited"/>
  <text x="245" y="434" class="lbl-w">RAND</text>
  <rect x="260" y="400" width="20" height="14" rx="3" class="order-bubble"/>
  <text x="270" y="411" class="order-text">6</text>

  <!-- BBN -->
  <circle cx="445" cy="410" r="24" class="node-visited"/>
  <text x="445" y="414" class="lbl-w">BBN</text>
  <rect x="460" y="380" width="20" height="14" rx="3" class="order-bubble"/>
  <text x="470" y="391" class="order-text">7</text>

  <!-- MIT -->
  <circle cx="645" cy="195" r="22" class="node-visited"/>
  <text x="645" y="199" class="lbl-w">MIT</text>
  <rect x="660" y="165" width="20" height="14" rx="3" class="order-bubble"/>
  <text x="670" y="176" class="order-text">8</text>

  <!-- Lincoln -->
  <circle cx="845" cy="215" r="22" class="node-visited"/>
  <text x="845" y="219" class="lbl-w">Lincoln</text>
  <rect x="860" y="185" width="20" height="14" rx="3" class="order-bubble"/>
  <text x="870" y="196" class="order-text">9</text>

  <!-- CASE -->
  <circle cx="1060" cy="295" r="24" class="node-visited"/>
  <text x="1060" y="299" class="lbl-w">CASE</text>
  <rect x="1075" y="265" width="20" height="14" rx="3" class="order-bubble"/>
  <text x="1085" y="276" class="order-text">10</text>

  <!-- Carnegie -->
  <circle cx="845" cy="380" r="22" class="node-visited"/>
  <text x="845" y="384" class="lbl-w">Carnegie</text>
  <rect x="860" y="350" width="20" height="14" rx="3" class="order-bubble"/>
  <text x="870" y="361" class="order-text">11</text>

  <!-- Harvard -->
  <circle cx="645" cy="360" r="22" class="node-active"/>
  <text x="645" y="364" class="lbl-w">Harvard</text>
  <rect x="660" y="330" width="20" height="14" rx="3" class="order-bubble"/>
  <text x="670" y="341" class="order-text">12</text>

  <!-- Legend -->
  <g transform="translate(50, 480)">
    <circle cx="0" cy="0" r="8" class="node-visited"/><text x="15" y="4" font-size="11" fill="#444">Visited node</text>
    <circle cx="120" cy="0" r="8" class="node-active"/><text x="135" y="4" font-size="11" fill="#444">Current node</text>
    <line x1="240" y1="0" x2="270" y2="0" class="edge-dfs"/><text x="280" y="4" font-size="11" fill="#444">DFS Tree Edge</text>
    <line x1="400" y1="0" x2="430" y2="0" class="edge-cross"/><text x="440" y="4" font-size="11" fill="#444">Cross-link</text>
    <line x1="530" y1="0" x2="560" y2="0" class="edge-back"/><text x="570" y="4" font-size="11" fill="#444">Back-edge</text>
    <rect x="660" y="-7" width="20" height="14" rx="3" class="order-bubble"/><text x="690" y="4" font-size="11" fill="#444">Discovery Order</text>
  </g>
</svg>
