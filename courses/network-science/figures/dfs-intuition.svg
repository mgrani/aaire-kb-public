<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <style>
      .edge { stroke: #888; stroke-width: 1.8; marker-end: url(#arrowhead); }
      .edge-back { stroke: #ccc; stroke-width: 1.2; stroke-dasharray: 4,3; }
      .node-visited { fill: #455a64; stroke: #263238; stroke-width: 2; }
      .node-current { fill: #e53935; stroke: #b71c1c; stroke-width: 2.5; }
      .node-unvisited { fill: #cfd8dc; stroke: #90a4ae; stroke-width: 2; }
      .lbl-w { fill: white; font-size: 14px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="18" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="550" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#37474f">DFS: Depth-First "Snake-like" Expansion</text>

  <!-- Explored path / Tree structure -->
  <!-- Start (You) -->
  <circle cx="100" cy="200" r="24" class="node-visited"/>
  <text x="100" y="205" class="lbl-w">You</text>

  <!-- Path 1: Down the first branch -->
  <line x1="124" y1="200" x2="276" y2="130" class="edge"/>
  <circle cx="300" cy="130" r="22" class="node-visited"/>
  <text x="300" y="135" class="lbl-w">A</text>

  <line x1="322" y1="130" x2="478" y2="90" class="edge"/>
  <circle cx="500" cy="90" r="22" class="node-visited"/>
  <text x="500" y="95" class="lbl-w">D</text>

  <line x1="522" y1="90" x2="678" y2="70" class="edge"/>
  <circle cx="700" cy="70" r="22" class="node-visited"/>
  <text x="700" y="75" class="lbl-w">I</text>

  <!-- Current active node -->
  <line x1="722" y1="70" x2="878" y2="60" class="edge" stroke="#e53935" stroke-width="2.5"/>
  <circle cx="900" cy="60" r="24" class="node-current"/>
  <text x="900" y="65" class="lbl-w">M</text>
  <text x="900" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#e53935">Active</text>

  <!-- Other branches (unvisited yet) -->
  <line x1="322" y1="130" x2="478" y2="170" class="edge-back"/>
  <circle cx="500" cy="170" r="20" class="node-unvisited"/>
  <text x="500" y="175" text-anchor="middle" font-size="13" fill="#546e7a">E</text>

  <line x1="124" y1="200" x2="276" y2="280" class="edge-back"/>
  <circle cx="300" cy="280" r="22" class="node-unvisited"/>
  <text x="300" y="285" text-anchor="middle" font-size="13" fill="#546e7a">B</text>

  <!-- Stack visualization -->
  <rect x="100" y="320" width="900" height="100" rx="12" fill="#eceff1" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="550" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">DFS Stack (LIFO)</text>

  <!-- Stack items -->
  <g transform="translate(150, 355)">
    <!-- B is waiting from decision point 'You' -->
    <rect x="0" y="0" width="100" height="40" rx="4" fill="#cfd8dc" stroke="#90a4ae"/>
    <text x="50" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#546e7a">B</text>
    
    <!-- E is waiting from decision point 'A' -->
    <rect x="110" y="0" width="100" height="40" rx="4" fill="#cfd8dc" stroke="#90a4ae"/>
    <text x="160" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#546e7a">E</text>

    <!-- M is currently active and thus on top of the stack -->
    <rect x="220" y="0" width="100" height="40" rx="4" fill="#e53935" stroke="#b71c1c"/>
    <text x="270" y="25" class="lbl-w">M</text>
    
    <text x="340" y="25" font-size="18" fill="#37474f" font-weight="bold">&lt;-- Top</text>
    <text x="110" y="-15" font-size="11" fill="#78909c" font-style="italic">Unexplored neighbors waiting in the LIFO fringe</text>
  </g>

  <text x="550" y="440" text-anchor="middle" font-size="12" fill="#546e7a" font-style="italic">DFS follows one path as deep as possible before backtracking to the last node with unexplored neighbors.</text>
</svg>
