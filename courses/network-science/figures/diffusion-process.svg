<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Diffusion process across time</title>
  <desc id="desc">A three-step diffusion process showing activation spreading from one seed to neighbors over time.</desc>
  <rect width="1200" height="340" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111111">Activation snapshots</text>

  <rect x="40" y="70" width="340" height="220" rx="18" fill="#f7f7f7" stroke="#c8c8c8" stroke-width="2"/>
  <rect x="430" y="70" width="340" height="220" rx="18" fill="#f7f7f7" stroke="#c8c8c8" stroke-width="2"/>
  <rect x="820" y="70" width="340" height="220" rx="18" fill="#f7f7f7" stroke="#c8c8c8" stroke-width="2"/>

  <text x="210" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111111">t = 0</text>
  <text x="600" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111111">t = 1</text>
  <text x="990" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111111">t = 2</text>

  <!-- shared geometry -->
  <g stroke="#9a9a9a" stroke-width="2">
    <line x1="140" y1="170" x2="210" y2="130"/><line x1="140" y1="170" x2="210" y2="210"/><line x1="210" y1="130" x2="290" y2="170"/><line x1="210" y1="210" x2="290" y2="170"/><line x1="290" y1="170" x2="340" y2="130"/>
    <line x1="530" y1="170" x2="600" y2="130"/><line x1="530" y1="170" x2="600" y2="210"/><line x1="600" y1="130" x2="680" y2="170"/><line x1="600" y1="210" x2="680" y2="170"/><line x1="680" y1="170" x2="730" y2="130"/>
    <line x1="920" y1="170" x2="990" y2="130"/><line x1="920" y1="170" x2="990" y2="210"/><line x1="990" y1="130" x2="1070" y2="170"/><line x1="990" y1="210" x2="1070" y2="170"/><line x1="1070" y1="170" x2="1120" y2="130"/>
  </g>

  <!-- t0 -->
  <g>
    <circle cx="140" cy="170" r="18" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/>
    <circle cx="210" cy="130" r="18" fill="#d9d9d9" stroke="#7a7a7a" stroke-width="2"/>
    <circle cx="210" cy="210" r="18" fill="#d9d9d9" stroke="#7a7a7a" stroke-width="2"/>
    <circle cx="290" cy="170" r="18" fill="#d9d9d9" stroke="#7a7a7a" stroke-width="2"/>
    <circle cx="340" cy="130" r="18" fill="#d9d9d9" stroke="#7a7a7a" stroke-width="2"/>
  </g>
  <!-- t1 -->
  <g>
    <circle cx="530" cy="170" r="18" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/>
    <circle cx="600" cy="130" r="18" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/>
    <circle cx="600" cy="210" r="18" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/>
    <circle cx="680" cy="170" r="18" fill="#d9d9d9" stroke="#7a7a7a" stroke-width="2"/>
    <circle cx="730" cy="130" r="18" fill="#d9d9d9" stroke="#7a7a7a" stroke-width="2"/>
  </g>
  <!-- t2 -->
  <g>
    <circle cx="920" cy="170" r="18" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/>
    <circle cx="990" cy="130" r="18" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/>
    <circle cx="990" cy="210" r="18" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/>
    <circle cx="1070" cy="170" r="18" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/>
    <circle cx="1120" cy="130" r="18" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/>
  </g>

  <text x="600" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#555555">Red nodes are active; each step spreads activity to reachable neighbors.</text>
</svg>
