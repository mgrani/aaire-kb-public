<svg xmlns="http://www.w3.org/2000/svg" width="630" height="340" viewBox="0 0 630 340" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title">
  <title id="title">Dijkstra's Algorithm Example</title>
  
  <defs>
    <marker id="darr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
    <marker id="darr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d47a1"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="315" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">Dijkstra's Algorithm (Step C)</text>

  <!-- All edges (background) -->
  <line x1="80" y1="200" x2="200" y2="130" stroke="#aaa" stroke-width="2" marker-end="url(#darr)"/>
  <line x1="80" y1="200" x2="200" y2="280" stroke="#aaa" stroke-width="2" marker-end="url(#darr)"/>
  <line x1="200" y1="130" x2="340" y2="130" stroke="#aaa" stroke-width="2" marker-end="url(#darr)"/>
  <line x1="200" y1="280" x2="340" y2="280" stroke="#aaa" stroke-width="2" marker-end="url(#darr)"/>
  <line x1="200" y1="130" x2="200" y2="280" stroke="#aaa" stroke-width="2" marker-end="url(#darr)"/>
  <line x1="340" y1="130" x2="340" y2="280" stroke="#aaa" stroke-width="2" marker-end="url(#darr)"/>

  <!-- Shortest path highlighting up to C -->
  <line x1="80" y1="200" x2="196" y2="134" stroke="#0d47a1" stroke-width="3.5" marker-end="url(#darr-blue)"/>
  <line x1="200" y1="130" x2="336" y2="130" stroke="#0d47a1" stroke-width="3.5" marker-end="url(#darr-blue)"/>

  <!-- Edge weight labels -->
  <!-- S->A: 4 -->
  <rect x="123" y="147" width="24" height="16" rx="4" fill="white" opacity="0.8"/>
  <text x="135" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">4</text>

  <!-- S->B: 8 -->
  <rect x="118" y="230" width="24" height="16" rx="4" fill="white" opacity="0.8"/>
  <text x="130" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">8</text>

  <!-- A->C: 2 -->
  <rect x="258" y="112" width="24" height="16" rx="4" fill="white" opacity="0.8"/>
  <text x="270" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">2</text>

  <!-- B->D: 5 -->
  <rect x="258" y="272" width="24" height="16" rx="4" fill="white" opacity="0.8"/>
  <text x="270" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">5</text>

  <!-- A->B: 3 -->
  <rect x="183" y="196" width="24" height="16" rx="4" fill="white" opacity="0.8"/>
  <text x="195" y="209" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">3</text>

  <!-- C->D: 1 -->
  <rect x="352" y="196" width="24" height="16" rx="4" fill="white" opacity="0.8"/>
  <text x="364" y="209" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">1</text>

  <!-- Nodes -->
  <!-- S: Settled -->
  <circle cx="80" cy="200" r="24" fill="#bbdefb" stroke="#0d47a1" stroke-width="2.5"/>
  <text x="80" y="197" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">S</text>
  <text x="80" y="212" text-anchor="middle" font-size="9" fill="#0d47a1">start</text>

  <!-- A: Settled -->
  <circle cx="200" cy="130" r="24" fill="#bbdefb" stroke="#0d47a1" stroke-width="2.5"/>
  <text x="200" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">A</text>

  <!-- B: Pending Update (Updated to 7 via A) -->
  <circle cx="200" cy="280" r="24" fill="#f5f5f5" stroke="#aaa" stroke-width="2"/>
  <text x="200" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">B</text>

  <!-- C: ACTIVE (Extracting from PQ) -->
  <circle cx="340" cy="130" r="24" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
  <text x="340" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="white">C</text>

  <!-- D: Unvisited -->
  <circle cx="340" cy="280" r="24" fill="#f5f5f5" stroke="#aaa" stroke-width="2"/>
  <text x="340" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">D</text>

  <!-- Distance labels on nodes -->
  <text x="80" y="165" text-anchor="middle" font-size="11" fill="#0d47a1" font-weight="bold">d=0</text>
  <text x="200" y="95" text-anchor="middle" font-size="11" fill="#0d47a1" font-weight="bold">d=4</text>
  <text x="340" y="95" text-anchor="middle" font-size="11" fill="#0d47a1" font-weight="bold">d=6</text>
  
  <text x="200" y="320" text-anchor="middle" font-size="11" fill="#888">d=8 → 7</text>
  <text x="340" y="320" text-anchor="middle" font-size="11" fill="#888">d=∞</text>

  <!-- Priority Queue Representation for Step C -->
  <rect x="430" y="80" width="180" height="230" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="520" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">Priority Queue</text>
  <text x="520" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">(Extracting C)</text>
  
  <!-- The queue boxes (top to bottom) -->
  <!-- Extracting C (Highlight) -->
  <rect x="460" y="145" width="120" height="36" rx="4" fill="#1565c0" stroke="#0d47a1" stroke-width="1"/>
  <text x="520" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="white">C : d=6</text>
  
  <!-- Pending B -->
  <rect x="460" y="195" width="120" height="36" rx="4" fill="#f5f5f5" stroke="#888" stroke-width="1"/>
  <text x="520" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">B : d=7</text>
  
  <!-- Unreached D -->
  <rect x="460" y="245" width="120" height="36" rx="4" fill="#f5f5f5" stroke="#888" stroke-width="1"/>
  <text x="520" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">D : d=∞</text>

</svg>
