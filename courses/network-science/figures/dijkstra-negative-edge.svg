<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Negative edge counterexample for Dijkstra's algorithm</title>
  <desc id="desc">A directed graph with edges A to B weight 2, A to C weight 5, and C to B weight minus 10, showing that Dijkstra settles B too early.</desc>

  <defs>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7a7a7a"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d47a1"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c62828"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">Why Negative Edges Break Dijkstra</text>

  <line x1="120" y1="160" x2="286" y2="160" stroke="#0d47a1" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <line x1="120" y1="160" x2="290" y2="74" stroke="#7a7a7a" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <line x1="320" y1="90" x2="320" y2="126" stroke="#c62828" stroke-width="4" marker-end="url(#arrow-red)"/>

  <rect x="190" y="138" width="28" height="20" rx="5" fill="white"/>
  <text x="204" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">2</text>

  <rect x="200" y="92" width="28" height="20" rx="5" fill="white"/>
  <text x="214" y="107" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">5</text>

  <rect x="334" y="101" width="42" height="20" rx="5" fill="white"/>
  <text x="355" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">-10</text>

  <circle cx="90" cy="160" r="28" fill="#bbdefb" stroke="#0d47a1" stroke-width="2.5"/>
  <text x="90" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">A</text>
  <text x="90" y="120" text-anchor="middle" font-size="12" fill="#0d47a1" font-weight="bold">start</text>

  <circle cx="320" cy="160" r="28" fill="#1565c0" stroke="#0d47a1" stroke-width="2.5"/>
  <text x="320" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="white">B</text>
  <text x="320" y="205" text-anchor="middle" font-size="12" fill="#0d47a1" font-weight="bold">settled first: d=2</text>

  <circle cx="320" cy="60" r="28" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2"/>
  <text x="320" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">C</text>
  <text x="320" y="24" text-anchor="middle" font-size="12" fill="#666">later path starts here</text>

  <rect x="420" y="70" width="250" height="170" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="545" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">What Dijkstra gets wrong</text>
  <text x="445" y="132" font-size="13" fill="#444">1. From A, it sees B with cost 2</text>
  <text x="445" y="156" font-size="13" fill="#444">2. It settles B before exploring C</text>
  <text x="445" y="180" font-size="13" fill="#444">3. But A → C → B costs 5 + (-10) = -5</text>
  <text x="445" y="204" font-size="13" fill="#444">4. So B was not final after all</text>

  <line x1="420" y1="258" x2="670" y2="258" stroke="#ef6c00" stroke-width="1"/>
  <text x="545" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">Negative edges can lower a distance after a node was settled.</text>
</svg>
