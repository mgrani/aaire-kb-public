<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr-or" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e65100"/>
    </marker>
    <marker id="arr-gr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1b5e20"/>
    </marker>
    <marker id="arr-gy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <!-- ══════════════════════════════════════
       WCC 1 — orange panel
       Nodes: A(130,190) B(260,110) C(260,270) D(90,310)
       Cycle A→B→C→A = SCC 1
       D→A (D outside cycle)
  ══════════════════════════════════════ -->
  <rect x="20" y="20" width="390" height="355" rx="16" fill="#fff3e0" stroke="#e65100" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="215" y="48" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">Weakly Connected Component 1</text>

  <!-- SCC 1 halo behind A B C -->
  <ellipse cx="215" cy="190" rx="105" ry="105" fill="#ffe0b2" opacity="0.65" stroke="#fb8c00" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="330" y="105" font-size="11" fill="#e65100" font-style="italic">SCC 1</text>

  <!-- Edges: A→B, B→C, C→A (cycle) -->
  <line x1="148" y1="178" x2="242" y2="122" stroke="#e65100" stroke-width="2.2" marker-end="url(#arr-or)"/>
  <line x1="260" y1="134" x2="260" y2="246" stroke="#e65100" stroke-width="2.2" marker-end="url(#arr-or)"/>
  <line x1="242" y1="274" x2="148" y2="203" stroke="#e65100" stroke-width="2.2" marker-end="url(#arr-or)"/>

  <!-- Edge D→A -->
  <line x1="107" y1="299" x2="122" y2="214" stroke="#e65100" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr-or)"/>

  <!-- Nodes -->
  <circle cx="130" cy="190" r="26" fill="#e65100" stroke="#bf360c" stroke-width="2.5"/>
  <text x="130" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="white">A</text>

  <circle cx="260" cy="110" r="26" fill="#f4511e" stroke="#bf360c" stroke-width="2"/>
  <text x="260" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="white">B</text>

  <circle cx="260" cy="270" r="26" fill="#f4511e" stroke="#bf360c" stroke-width="2"/>
  <text x="260" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="white">C</text>

  <circle cx="90" cy="310" r="26" fill="#ffb74d" stroke="#e65100" stroke-width="2"/>
  <text x="90" y="316" text-anchor="middle" font-size="15" font-weight="bold" fill="white">D</text>

  <text x="215" y="358" text-anchor="middle" font-size="11" fill="#e65100">1 SCC {A,B,C} + trivial SCC {D}</text>

  <!-- ══════════════════════════════════════
       WCC 2 — green panel
       Nodes: E(560,200) F(690,200) G(560,310)
       Bidirectional E⇄F = SCC 2
       G→E (G outside)
  ══════════════════════════════════════ -->
  <rect x="440" y="20" width="340" height="355" rx="16" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="610" y="48" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">Weakly Connected Component 2</text>

  <!-- SCC 2 halo behind E F -->
  <ellipse cx="625" cy="200" rx="100" ry="42" fill="#c8e6c9" opacity="0.8" stroke="#43a047" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="735" y="170" font-size="11" fill="#2e7d32" font-style="italic">SCC 2</text>

  <!-- Edges E→F and F→E (offset so both visible) -->
  <line x1="586" y1="192" x2="664" y2="192" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#arr-gr)"/>
  <line x1="664" y1="210" x2="586" y2="210" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#arr-gr)"/>

  <!-- G→E -->
  <line x1="563" y1="284" x2="563" y2="228" stroke="#2e7d32" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr-gr)"/>

  <!-- Nodes -->
  <circle cx="560" cy="200" r="26" fill="#2e7d32" stroke="#1b5e20" stroke-width="2.5"/>
  <text x="560" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="white">E</text>

  <circle cx="690" cy="200" r="26" fill="#388e3c" stroke="#1b5e20" stroke-width="2"/>
  <text x="690" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="white">F</text>

  <circle cx="560" cy="310" r="26" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/>
  <text x="560" y="316" text-anchor="middle" font-size="15" font-weight="bold" fill="white">G</text>

  <text x="610" y="358" text-anchor="middle" font-size="11" fill="#2e7d32">1 SCC {E,F} + trivial SCC {G}</text>

  <!-- ══════════════════════════════════════
       WCC 3 — grey panel
       Nodes: H(880,195) I(1010,195)
       H→I only — no cycle, 2 trivial SCCs
  ══════════════════════════════════════ -->
  <rect x="800" y="20" width="280" height="355" rx="16" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="940" y="48" text-anchor="middle" font-size="13" font-weight="bold" fill="#616161">Weakly Connected Component 3</text>

  <!-- Edge H→I -->
  <line x1="908" y1="195" x2="982" y2="195" stroke="#555" stroke-width="2.2" marker-end="url(#arr-gy)"/>

  <!-- Nodes -->
  <circle cx="880" cy="195" r="26" fill="#757575" stroke="#424242" stroke-width="2"/>
  <text x="880" y="201" text-anchor="middle" font-size="15" font-weight="bold" fill="white">H</text>

  <circle cx="1010" cy="195" r="26" fill="#9e9e9e" stroke="#424242" stroke-width="2"/>
  <text x="1010" y="201" text-anchor="middle" font-size="15" font-weight="bold" fill="white">I</text>

  <text x="940" y="358" text-anchor="middle" font-size="11" fill="#616161">No cycle → only trivial SCCs {H}, {I}</text>

  <!-- ══════════════════════════════════════
       Legend
  ══════════════════════════════════════ -->
  <rect x="20" y="382" width="1060" height="1" fill="none"/>
</svg>
