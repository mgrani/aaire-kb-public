<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Nyhan et al. (2023) Facebook field experiment: design and outcomes</title>
  <desc id="desc">Schematic of the Nyhan et al. 2023 Nature study. Around 23,000 Facebook users had their feed&#8217;s exposure to like-minded sources reduced by about a third during the 2020 U.S. election. Cross-cutting exposure rose substantially, but measured attitudes, polarization, and false-belief indicators did not change.</desc>
  <rect width="1200" height="470" fill="#ffffff"/>

  <!-- ========== Panel A: Treatment design ========== -->
  <g>
    <rect x="40" y="80" width="350" height="380" rx="12" fill="#f5f5f5" stroke="#90a4ae" stroke-width="1.5"/>
    <text x="215" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#37474f">A. Treatment design</text>

    <!-- Control feed -->
    <text x="215" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#0d47a1">Control: normal feed</text>
    <g>
      <rect x="80" y="148" width="270" height="14" fill="#1976d2" fill-opacity="0.85"/>
      <rect x="80" y="148" width="200" height="14" fill="#1976d2"/>
      <rect x="80" y="168" width="270" height="14" fill="#1976d2" fill-opacity="0.85"/>
      <rect x="80" y="168" width="190" height="14" fill="#1976d2"/>
      <text x="350" y="159" text-anchor="end" font-size="9" fill="white" font-weight="700">like-minded</text>
      <text x="350" y="179" text-anchor="end" font-size="9" fill="white" font-weight="700">~ 50% feed</text>
    </g>

    <!-- Treatment feed -->
    <text x="215" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#bf360c">Treatment: like-minded reduced by ~1/3</text>
    <g>
      <rect x="80" y="233" width="270" height="14" fill="#1976d2" fill-opacity="0.85"/>
      <rect x="80" y="233" width="120" height="14" fill="#1976d2"/>
      <rect x="200" y="233" width="80" height="14" fill="#ff7043"/>
      <rect x="80" y="253" width="270" height="14" fill="#1976d2" fill-opacity="0.85"/>
      <rect x="80" y="253" width="125" height="14" fill="#1976d2"/>
      <rect x="205" y="253" width="75" height="14" fill="#ff7043"/>
      <text x="160" y="278" font-size="10" fill="#37474f"><tspan font-weight="700" fill="#0d47a1">blue</tspan> = like-minded</text>
      <text x="160" y="291" font-size="10" fill="#37474f"><tspan font-weight="700" fill="#bf360c">orange</tspan> = cross-cutting</text>
    </g>

    <!-- Random assignment annotation -->
    <line x1="80" y1="320" x2="350" y2="320" stroke="#90a4ae" stroke-width="0.8" stroke-dasharray="2,3"/>
    <text x="215" y="340" text-anchor="middle" font-size="11" font-weight="700" fill="#37474f">Randomly assigned</text>
    <text x="215" y="356" text-anchor="middle" font-size="10" fill="#455a64">n &#8776; 23,377 users</text>
    <text x="215" y="372" text-anchor="middle" font-size="10" fill="#455a64">Sept&#8211;Dec 2020</text>
    <text x="215" y="392" text-anchor="middle" font-size="10" fill="#455a64" font-style="italic">Randomization isolates a causal</text>
    <text x="215" y="406" text-anchor="middle" font-size="10" fill="#455a64" font-style="italic">effect of feed exposure.</text>

    <!-- Arrow to outcome -->
    <path d="M 350 220 Q 410 220 410 270" stroke="#37474f" stroke-width="2" fill="none"/>
    <polygon points="406,265 414,265 410,275" fill="#37474f"/>
    <text x="395" y="195" font-size="10" font-style="italic" fill="#37474f">causal effect on...</text>
  </g>

  <!-- ========== Panel B: Outcome 1 — exposure (changed) ========== -->
  <g>
    <rect x="420" y="80" width="350" height="380" rx="12" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
    <text x="595" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#1b5e20">B. Exposure: changed</text>

    <!-- Bar comparison: like-minded share -->
    <text x="595" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#33691e">Share of feed that was &#8220;like-minded&#8221;</text>

    <!-- Control bar -->
    <text x="450" y="170" font-size="11" font-weight="600" fill="#37474f">Control</text>
    <rect x="450" y="175" width="280" height="22" fill="#bdbdbd" stroke="#616161" stroke-width="1"/>
    <rect x="450" y="175" width="140" height="22" fill="#0d47a1"/>
    <text x="600" y="191" text-anchor="middle" font-size="10" fill="white" font-weight="700">~ 50%</text>

    <!-- Treatment bar -->
    <text x="450" y="220" font-size="11" font-weight="600" fill="#37474f">Treatment</text>
    <rect x="450" y="225" width="280" height="22" fill="#bdbdbd" stroke="#616161" stroke-width="1"/>
    <rect x="450" y="225" width="93" height="22" fill="#0d47a1"/>
    <text x="500" y="241" text-anchor="middle" font-size="10" fill="white" font-weight="700">~ 33%</text>

    <text x="595" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#1b5e20">&#9660; ~ 1/3 reduction in like-minded share</text>
    <text x="595" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#1b5e20">&#9650; substantial rise in cross-cutting exposure</text>

    <text x="595" y="350" text-anchor="middle" font-size="11" fill="#33691e" font-style="italic">The intervention worked at the exposure layer.</text>
    <text x="595" y="370" text-anchor="middle" font-size="11" fill="#33691e" font-style="italic">Participants now saw measurably more</text>
    <text x="595" y="385" text-anchor="middle" font-size="11" fill="#33691e" font-style="italic">cross-cutting political content.</text>

    <!-- Arrow to next panel -->
    <path d="M 770 270 Q 810 270 810 270" stroke="#37474f" stroke-width="2" fill="none"/>
    <polygon points="804,266 814,270 804,274" fill="#37474f"/>
    <text x="795" y="248" text-anchor="middle" font-size="10" font-style="italic" fill="#37474f">did it move</text>
    <text x="795" y="262" text-anchor="middle" font-size="10" font-style="italic" fill="#37474f">attitudes?</text>
  </g>

  <!-- ========== Panel C: Outcome 2 — attitudes (no change) ========== -->
  <g>
    <rect x="820" y="80" width="340" height="380" rx="12" fill="#fafafa" stroke="#90a4ae" stroke-width="1.5"/>
    <text x="990" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#37474f">C. Attitudes: ~ unchanged</text>

    <text x="990" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#37474f">Effect on measured outcomes</text>

    <!-- Outcome rows with flat-line bars -->
    <g font-size="11" fill="#37474f">
      <!-- Affective polarization -->
      <text x="840" y="170">Affective polarization</text>
      <rect x="840" y="178" width="300" height="14" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
      <line x1="990" y1="178" x2="990" y2="192" stroke="#37474f" stroke-width="1" stroke-dasharray="2,2"/>
      <circle cx="993" cy="185" r="4" fill="#90a4ae" stroke="#37474f" stroke-width="1.2"/>
      <text x="1150" y="190" text-anchor="end" font-size="9" font-style="italic" fill="#607d8b">~ 0</text>

      <!-- Issue polarization -->
      <text x="840" y="220">Issue polarization</text>
      <rect x="840" y="228" width="300" height="14" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
      <line x1="990" y1="228" x2="990" y2="242" stroke="#37474f" stroke-width="1" stroke-dasharray="2,2"/>
      <circle cx="987" cy="235" r="4" fill="#90a4ae" stroke="#37474f" stroke-width="1.2"/>
      <text x="1150" y="240" text-anchor="end" font-size="9" font-style="italic" fill="#607d8b">~ 0</text>

      <!-- Belief in false claims -->
      <text x="840" y="270">Belief in false claims</text>
      <rect x="840" y="278" width="300" height="14" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
      <line x1="990" y1="278" x2="990" y2="292" stroke="#37474f" stroke-width="1" stroke-dasharray="2,2"/>
      <circle cx="996" cy="285" r="4" fill="#90a4ae" stroke="#37474f" stroke-width="1.2"/>
      <text x="1150" y="290" text-anchor="end" font-size="9" font-style="italic" fill="#607d8b">~ 0</text>

      <!-- Knowledge -->
      <text x="840" y="320">Political knowledge</text>
      <rect x="840" y="328" width="300" height="14" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
      <line x1="990" y1="328" x2="990" y2="342" stroke="#37474f" stroke-width="1" stroke-dasharray="2,2"/>
      <circle cx="989" cy="335" r="4" fill="#90a4ae" stroke="#37474f" stroke-width="1.2"/>
      <text x="1150" y="340" text-anchor="end" font-size="9" font-style="italic" fill="#607d8b">~ 0</text>
    </g>
    <text x="990" y="357" text-anchor="middle" font-size="9" fill="#607d8b" font-style="italic">center line = no change relative to control</text>

    <text x="990" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#37474f">Pre-registered estimates: no</text>
    <text x="990" y="406" text-anchor="middle" font-size="11" font-weight="700" fill="#37474f">measurable change in any outcome.</text>
    <text x="990" y="430" text-anchor="middle" font-size="10" fill="#455a64" font-style="italic">Confidence intervals tight around zero.</text>
  </g>

</svg>
