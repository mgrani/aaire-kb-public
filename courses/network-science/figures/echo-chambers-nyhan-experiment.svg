<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Nyhan et al. (2023) Facebook field experiment: exposure changed, attitudes did not</title>
  <desc id="desc">Schematic of the Nyhan et al. 2023 Nature study. Around 23,000 Facebook users were assigned to a treatment that reduced exposure to like-minded sources. Feed composition changed, but measured attitudes and polarization outcomes did not measurably change.</desc>
  <defs>
    <clipPath id="control-feed-bar">
      <rect x="95" y="185" width="420" height="42" rx="5"/>
    </clipPath>
    <clipPath id="treatment-feed-bar">
      <rect x="95" y="278" width="420" height="42" rx="5"/>
    </clipPath>
  </defs>
  <rect width="1200" height="470" fill="#ffffff"/>

  <!-- ========== Panel A: Exposure changed ========== -->
  <g>
    <rect x="40" y="80" width="540" height="380" rx="12" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
    <text x="310" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#1b5e20">A. Exposure: changed</text>
    <text x="310" y="137" text-anchor="middle" font-size="12" font-weight="600" fill="#33691e">Share of Facebook Feed views during treatment period</text>

    <!-- Control feed -->
    <text x="95" y="176" font-size="12" font-weight="700" fill="#37474f">Control feed</text>
    <g>
      <rect x="95" y="185" width="420" height="42" rx="5" fill="#eceff1" stroke="#607d8b" stroke-width="1"/>
      <g clip-path="url(#control-feed-bar)">
        <rect x="95" y="185" width="225.54" height="42" fill="#1976d2"/>
        <rect x="320.54" y="185" width="86.94" height="42" fill="#ff7043"/>
        <rect x="407.48" y="185" width="107.52" height="42" fill="#cfd8dc"/>
      </g>
      <line x1="320.54" y1="185" x2="320.54" y2="227" stroke="#ffffff" stroke-width="1"/>
      <line x1="407.48" y1="185" x2="407.48" y2="227" stroke="#ffffff" stroke-width="1"/>
      <text x="207.77" y="209" text-anchor="middle" font-size="11" fill="white" font-weight="700">53.7%</text>
      <text x="364.01" y="209" text-anchor="middle" font-size="11" fill="white" font-weight="700">20.7%</text>
      <text x="461.24" y="209" text-anchor="middle" font-size="11" fill="#37474f" font-weight="700">25.6%</text>
    </g>

    <!-- Treatment feed -->
    <text x="95" y="269" font-size="12" font-weight="700" fill="#37474f">Treatment feed</text>
    <g>
      <rect x="95" y="278" width="420" height="42" rx="5" fill="#eceff1" stroke="#607d8b" stroke-width="1"/>
      <g clip-path="url(#treatment-feed-bar)">
        <rect x="95" y="278" width="152.04" height="42" fill="#1976d2"/>
        <rect x="247.04" y="278" width="117.18" height="42" fill="#ff7043"/>
        <rect x="364.22" y="278" width="150.78" height="42" fill="#cfd8dc"/>
      </g>
      <line x1="247.04" y1="278" x2="247.04" y2="320" stroke="#ffffff" stroke-width="1"/>
      <line x1="364.22" y1="278" x2="364.22" y2="320" stroke="#ffffff" stroke-width="1"/>
      <text x="171.02" y="302" text-anchor="middle" font-size="11" fill="white" font-weight="700">36.2%</text>
      <text x="305.63" y="302" text-anchor="middle" font-size="11" fill="white" font-weight="700">27.9%</text>
      <text x="439.61" y="302" text-anchor="middle" font-size="11" fill="#37474f" font-weight="700">35.9%</text>
    </g>

    <g font-size="11" fill="#37474f">
      <rect x="95" y="347" width="12" height="12" fill="#1976d2"/>
      <text x="114" y="357">like-minded</text>
      <rect x="222" y="347" width="12" height="12" fill="#ff7043"/>
      <text x="241" y="357">cross-cutting</text>
      <rect x="370" y="347" width="12" height="12" fill="#cfd8dc" stroke="#90a4ae" stroke-width="0.5"/>
      <text x="389" y="357">neither</text>
    </g>

    <text x="310" y="397" text-anchor="middle" font-size="12" font-weight="700" fill="#1b5e20">Like-minded exposure fell by about one-third.</text>
    <text x="310" y="417" text-anchor="middle" font-size="11" fill="#33691e" font-style="italic">Cross-cutting exposure rose, but much of the replacement</text>
    <text x="310" y="433" text-anchor="middle" font-size="11" fill="#33691e" font-style="italic">came from sources classified as neither.</text>

    <!-- Arrow to attitude outcomes -->
    <path d="M 580 270 Q 610 270 620 270" stroke="#37474f" stroke-width="2" fill="none"/>
    <polygon points="614,266 624,270 614,274" fill="#37474f"/>
  </g>

  <!-- ========== Panel B: Attitudes unchanged ========== -->
  <g>
    <rect x="620" y="80" width="540" height="380" rx="12" fill="#fafafa" stroke="#90a4ae" stroke-width="1.5"/>
    <text x="890" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#37474f">B. Attitudes: unchanged</text>
    <text x="890" y="137" text-anchor="middle" font-size="12" font-weight="600" fill="#37474f">Effect on pre-registered measured outcomes</text>

    <g font-size="12" fill="#37474f">
      <!-- Affective polarization -->
      <text x="660" y="178">Affective polarization</text>
      <rect x="660" y="188" width="460" height="18" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
      <line x1="890" y1="188" x2="890" y2="206" stroke="#37474f" stroke-width="1" stroke-dasharray="2,2"/>
      <circle cx="895" cy="197" r="5" fill="#90a4ae" stroke="#37474f" stroke-width="1.2"/>
      <text x="1128" y="202" text-anchor="end" font-size="10" font-style="italic" fill="#607d8b">~ 0</text>

      <!-- Issue polarization -->
      <text x="660" y="235">Issue polarization</text>
      <rect x="660" y="245" width="460" height="18" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
      <line x1="890" y1="245" x2="890" y2="263" stroke="#37474f" stroke-width="1" stroke-dasharray="2,2"/>
      <circle cx="885" cy="254" r="5" fill="#90a4ae" stroke="#37474f" stroke-width="1.2"/>
      <text x="1128" y="259" text-anchor="end" font-size="10" font-style="italic" fill="#607d8b">~ 0</text>

      <!-- Belief in false claims -->
      <text x="660" y="292">Belief in false claims</text>
      <rect x="660" y="302" width="460" height="18" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
      <line x1="890" y1="302" x2="890" y2="320" stroke="#37474f" stroke-width="1" stroke-dasharray="2,2"/>
      <circle cx="900" cy="311" r="5" fill="#90a4ae" stroke="#37474f" stroke-width="1.2"/>
      <text x="1128" y="316" text-anchor="end" font-size="10" font-style="italic" fill="#607d8b">~ 0</text>

      <!-- Knowledge -->
      <text x="660" y="349">Political knowledge</text>
      <rect x="660" y="359" width="460" height="18" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
      <line x1="890" y1="359" x2="890" y2="377" stroke="#37474f" stroke-width="1" stroke-dasharray="2,2"/>
      <circle cx="888" cy="368" r="5" fill="#90a4ae" stroke="#37474f" stroke-width="1.2"/>
      <text x="1128" y="373" text-anchor="end" font-size="10" font-style="italic" fill="#607d8b">~ 0</text>
    </g>

    <text x="890" y="397" text-anchor="middle" font-size="10" fill="#607d8b" font-style="italic">center line = no change relative to control</text>
    <text x="890" y="424" text-anchor="middle" font-size="12" font-weight="700" fill="#37474f">No measurable change in the attitude outcomes.</text>
    <text x="890" y="442" text-anchor="middle" font-size="10" fill="#455a64" font-style="italic">Pre-registered estimates were tightly centered around zero.</text>
  </g>

</svg>
