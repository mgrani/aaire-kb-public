<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Echo-chamber intensity across four platforms (schematic of Cinelli et al. 2021 findings)</title>
  <desc id="desc">Schematic bar chart comparing homophily-driven segregation of user interactions on Gab, Facebook, Twitter, and Reddit. Gab, Facebook, and Twitter show strong clustering by political leaning; Reddit shows much weaker clustering.</desc>
  <rect width="1100" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="550" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#263238">Same homophily idea, four platforms &#8212; very different intensity</text>
  <text x="550" y="54" text-anchor="middle" font-size="12" fill="#546e7a">Cinelli et al. (2021, PNAS): &gt;100M interactions on Facebook, Twitter, Reddit, Gab. Measure: how much a user&#8217;s neighbourhood mirrors their own leaning.</text>

  <!-- Axis -->
  <!-- Bars area: x = 200..1000 (800 wide), bar rows y -->
  <!-- x-axis baseline at y = 410 -->
  <line x1="200" y1="410" x2="1000" y2="410" stroke="#37474f" stroke-width="1.5"/>
  <!-- Tick marks 0..1 -->
  <g font-size="10" fill="#546e7a" text-anchor="middle">
    <line x1="200" y1="410" x2="200" y2="418" stroke="#37474f" stroke-width="1"/>
    <text x="200" y="432">0</text>
    <line x1="360" y1="410" x2="360" y2="418" stroke="#37474f" stroke-width="1"/>
    <text x="360" y="432">0.2</text>
    <line x1="520" y1="410" x2="520" y2="418" stroke="#37474f" stroke-width="1"/>
    <text x="520" y="432">0.4</text>
    <line x1="680" y1="410" x2="680" y2="418" stroke="#37474f" stroke-width="1"/>
    <text x="680" y="432">0.6</text>
    <line x1="840" y1="410" x2="840" y2="418" stroke="#37474f" stroke-width="1"/>
    <text x="840" y="432">0.8</text>
    <line x1="1000" y1="410" x2="1000" y2="418" stroke="#37474f" stroke-width="1"/>
    <text x="1000" y="432">1.0</text>
  </g>
  <text x="600" y="452" text-anchor="middle" font-size="11" font-weight="600" fill="#37474f">Echo-chamber intensity (schematic homophily / segregation index)</text>

  <!-- Chance baseline line -->
  <line x1="400" y1="80" x2="400" y2="410" stroke="#90a4ae" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="400" y="78" text-anchor="middle" font-size="10" fill="#607d8b" font-style="italic">expected under near-random mixing</text>

  <!-- Bar 1: Gab (extreme right) -->
  <g>
    <rect x="200" y="100" width="736" height="46" fill="#b71c1c" fill-opacity="0.80" stroke="#7f0000" stroke-width="1"/>
    <text x="190" y="129" text-anchor="end" font-size="13" font-weight="700" fill="#263238">Gab</text>
    <text x="180" y="143" text-anchor="end" font-size="10" fill="#607d8b">alt-tech, no moderation</text>
    <text x="950" y="128" font-size="13" font-weight="700" fill="#b71c1c">~ 0.92</text>
    <text x="950" y="142" font-size="10" fill="#455a64">single-sided amplification</text>
  </g>

  <!-- Bar 2: Facebook -->
  <g>
    <rect x="200" y="170" width="680" height="46" fill="#1976d2" fill-opacity="0.75" stroke="#0d47a1" stroke-width="1"/>
    <text x="190" y="199" text-anchor="end" font-size="13" font-weight="700" fill="#263238">Facebook</text>
    <text x="180" y="213" text-anchor="end" font-size="10" fill="#607d8b">friend-curated feed</text>
    <text x="894" y="198" font-size="13" font-weight="700" fill="#0d47a1">~ 0.85</text>
    <text x="894" y="212" font-size="10" fill="#455a64">strong leaning clustering</text>
  </g>

  <!-- Bar 3: Twitter -->
  <g>
    <rect x="200" y="240" width="656" height="46" fill="#1565c0" fill-opacity="0.70" stroke="#0d47a1" stroke-width="1"/>
    <text x="190" y="269" text-anchor="end" font-size="13" font-weight="700" fill="#263238">Twitter</text>
    <text x="180" y="283" text-anchor="end" font-size="10" fill="#607d8b">follow + algorithmic feed</text>
    <text x="870" y="268" font-size="13" font-weight="700" fill="#0d47a1">~ 0.82</text>
    <text x="870" y="282" font-size="10" fill="#455a64">retweet bias to like-minded</text>
  </g>

  <!-- Bar 4: Reddit -->
  <g>
    <rect x="200" y="310" width="320" height="46" fill="#ff7043" fill-opacity="0.75" stroke="#bf360c" stroke-width="1"/>
    <text x="190" y="339" text-anchor="end" font-size="13" font-weight="700" fill="#263238">Reddit</text>
    <text x="180" y="353" text-anchor="end" font-size="10" fill="#607d8b">topic-centered subreddits</text>
    <text x="534" y="338" font-size="13" font-weight="700" fill="#bf360c">~ 0.40</text>
    <text x="534" y="352" font-size="10" fill="#455a64">less segregated interaction</text>
  </g>

  <!-- Caveat box -->
  <rect x="60" y="475" width="980" height="35" rx="8" fill="#fff8e1" stroke="#ffb74d" stroke-width="1"/>
  <text x="550" y="497" text-anchor="middle" font-size="11" fill="#5d4037">
    <tspan font-weight="700">Schematic.</tspan> Magnitudes are illustrative; the paper reports leaning-gap distributions, not a single index. The qualitative ranking (Gab &gt; Facebook &#8776; Twitter &#8811; Reddit) matches the paper.
  </text>
</svg>
