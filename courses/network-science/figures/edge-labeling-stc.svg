<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI', Arial, sans-serif">

  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#263238">Strong Triadic Closure as an edge-labeling constraint</text>
  <text x="360" y="42" text-anchor="middle" font-size="11" fill="#546e7a">ℓ : E → {S, W} &#160;·&#160; STC: if ℓ(A,B)=S and ℓ(A,C)=S then edge (B,C) must exist (with any label)</text>

  <!-- Legend -->
  <g transform="translate(20,52)">
    <line x1="0" y1="6" x2="28" y2="6" stroke="#263238" stroke-width="5"/>
    <text x="34" y="10" font-size="10" fill="#455a64">S = strong (thick)</text>
    <line x1="150" y1="6" x2="178" y2="6" stroke="#263238" stroke-width="2"/>
    <text x="184" y="10" font-size="10" fill="#455a64">W = weak (thin)</text>
    <line x1="290" y1="6" x2="318" y2="6" stroke="#bdbdbd" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="324" y="10" font-size="10" fill="#9e9e9e">edge absent from E</text>
  </g>

  <!-- LEFT: violating labeling -->
  <g>
    <rect x="12" y="74" width="336" height="250" rx="12" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
    <text x="180" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">Invalid labeling (STC violated)</text>
    <text x="180" y="112" text-anchor="middle" font-size="10" fill="#c62828">A has two strong ties but the edge (B,C) is not in E</text>

    <!-- edges -->
    <line x1="180" y1="160" x2="110" y2="250" stroke="#b71c1c" stroke-width="5"/>
    <line x1="180" y1="160" x2="250" y2="250" stroke="#b71c1c" stroke-width="5"/>
    <!-- missing edge -->
    <line x1="110" y1="250" x2="250" y2="250" stroke="#bdbdbd" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="180" y="273" text-anchor="middle" font-size="10" fill="#9e9e9e" font-style="italic">not in E</text>

    <text x="125" y="205" font-size="12" font-weight="bold" fill="#b71c1c">S</text>
    <text x="225" y="205" font-size="12" font-weight="bold" fill="#b71c1c">S</text>

    <!-- nodes -->
    <circle cx="180" cy="160" r="20" fill="#c62828" stroke="#7f0000" stroke-width="2"/>
    <text x="180" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="white">A</text>
    <circle cx="110" cy="250" r="20" fill="#ef5350" stroke="#7f0000" stroke-width="2"/>
    <text x="110" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="white">B</text>
    <circle cx="250" cy="250" r="20" fill="#ef5350" stroke="#7f0000" stroke-width="2"/>
    <text x="250" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="white">C</text>

    <text x="180" y="308" text-anchor="middle" font-size="10" fill="#b71c1c">✗ two strong neighbors of A are not connected</text>
  </g>

  <!-- RIGHT: valid labeling -->
  <g>
    <rect x="372" y="74" width="336" height="250" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="540" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">Valid labeling (STC satisfied)</text>
    <text x="540" y="112" text-anchor="middle" font-size="10" fill="#2e7d32">Add edge (B,C) to E — its label can be S or W</text>

    <!-- edges: A-B strong, A-C strong, B-C weak (present) -->
    <line x1="540" y1="160" x2="470" y2="250" stroke="#1b5e20" stroke-width="5"/>
    <line x1="540" y1="160" x2="610" y2="250" stroke="#1b5e20" stroke-width="5"/>
    <line x1="470" y1="250" x2="610" y2="250" stroke="#2e7d32" stroke-width="2"/>

    <text x="485" y="205" font-size="12" font-weight="bold" fill="#1b5e20">S</text>
    <text x="585" y="205" font-size="12" font-weight="bold" fill="#1b5e20">S</text>
    <text x="536" y="268" font-size="12" font-weight="bold" fill="#2e7d32">W</text>

    <circle cx="540" cy="160" r="20" fill="#2e7d32" stroke="#0d3b0c" stroke-width="2"/>
    <text x="540" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="white">A</text>
    <circle cx="470" cy="250" r="20" fill="#66bb6a" stroke="#0d3b0c" stroke-width="2"/>
    <text x="470" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="white">B</text>
    <circle cx="610" cy="250" r="20" fill="#66bb6a" stroke="#0d3b0c" stroke-width="2"/>
    <text x="610" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="white">C</text>

    <text x="540" y="308" text-anchor="middle" font-size="10" fill="#1b5e20">✓ every pair of strong neighbors of A is connected (label irrelevant)</text>
  </g>
</svg>
