<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="'Segoe UI', Arial, sans-serif">

  <!-- LEFT: Embedded -->
  <rect x="12" y="12" width="300" height="296" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="162" y="38" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">Embedded Node</text>
  <text x="162" y="56" text-anchor="middle" font-size="11" fill="#2e7d32">Surrounded by densely connected neighbors</text>

  <!-- dense triangle of neighbors around center -->
  <line x1="162" y1="180" x2="100" y2="120" stroke="#43a047" stroke-width="2"/>
  <line x1="162" y1="180" x2="224" y2="120" stroke="#43a047" stroke-width="2"/>
  <line x1="162" y1="180" x2="100" y2="240" stroke="#43a047" stroke-width="2"/>
  <line x1="162" y1="180" x2="224" y2="240" stroke="#43a047" stroke-width="2"/>
  <line x1="162" y1="180" x2="60"  y2="180" stroke="#43a047" stroke-width="2"/>
  <line x1="162" y1="180" x2="264" y2="180" stroke="#43a047" stroke-width="2"/>
  <!-- neighbor-neighbor edges -->
  <line x1="100" y1="120" x2="224" y2="120" stroke="#66bb6a" stroke-width="1.6"/>
  <line x1="100" y1="240" x2="224" y2="240" stroke="#66bb6a" stroke-width="1.6"/>
  <line x1="100" y1="120" x2="60"  y2="180" stroke="#66bb6a" stroke-width="1.6"/>
  <line x1="60"  y1="180" x2="100" y2="240" stroke="#66bb6a" stroke-width="1.6"/>
  <line x1="224" y1="120" x2="264" y2="180" stroke="#66bb6a" stroke-width="1.6"/>
  <line x1="264" y1="180" x2="224" y2="240" stroke="#66bb6a" stroke-width="1.6"/>

  <circle cx="162" cy="180" r="20" fill="#1b5e20" stroke="#0d3b0c" stroke-width="2.5"/>
  <text x="162" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="white">v</text>
  <circle cx="100" cy="120" r="13" fill="#66bb6a"/>
  <circle cx="224" cy="120" r="13" fill="#66bb6a"/>
  <circle cx="100" cy="240" r="13" fill="#66bb6a"/>
  <circle cx="224" cy="240" r="13" fill="#66bb6a"/>
  <circle cx="60"  cy="180" r="13" fill="#66bb6a"/>
  <circle cx="264" cy="180" r="13" fill="#66bb6a"/>

  <text x="162" y="288" text-anchor="middle" font-size="11" fill="#1b5e20">High clustering coefficient · trust · redundant info</text>

  <!-- RIGHT: Broker -->
  <rect x="328" y="12" width="300" height="296" rx="14" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="478" y="38" text-anchor="middle" font-size="14" font-weight="bold" fill="#bf360c">Broker (Structural Hole)</text>
  <text x="478" y="56" text-anchor="middle" font-size="11" fill="#e65100">Sole link between two otherwise separated groups</text>

  <!-- Left cluster -->
  <line x1="380" y1="120" x2="420" y2="180" stroke="#fb8c00" stroke-width="1.6"/>
  <line x1="380" y1="240" x2="420" y2="180" stroke="#fb8c00" stroke-width="1.6"/>
  <line x1="380" y1="120" x2="380" y2="240" stroke="#fb8c00" stroke-width="1.6"/>
  <circle cx="380" cy="120" r="13" fill="#fb8c00"/>
  <circle cx="380" cy="240" r="13" fill="#fb8c00"/>
  <circle cx="420" cy="180" r="13" fill="#fb8c00"/>

  <!-- Right cluster -->
  <line x1="576" y1="120" x2="536" y2="180" stroke="#fb8c00" stroke-width="1.6"/>
  <line x1="576" y1="240" x2="536" y2="180" stroke="#fb8c00" stroke-width="1.6"/>
  <line x1="576" y1="120" x2="576" y2="240" stroke="#fb8c00" stroke-width="1.6"/>
  <circle cx="576" cy="120" r="13" fill="#fb8c00"/>
  <circle cx="576" cy="240" r="13" fill="#fb8c00"/>
  <circle cx="536" cy="180" r="13" fill="#fb8c00"/>

  <!-- Broker edges -->
  <line x1="420" y1="180" x2="478" y2="180" stroke="#bf360c" stroke-width="3"/>
  <line x1="478" y1="180" x2="536" y2="180" stroke="#bf360c" stroke-width="3"/>

  <circle cx="478" cy="180" r="20" fill="#bf360c" stroke="#5d1500" stroke-width="2.5"/>
  <text x="478" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="white">b</text>

  <text x="478" y="288" text-anchor="middle" font-size="11" fill="#bf360c">Low clustering · high betweenness · novel info</text>
</svg>
