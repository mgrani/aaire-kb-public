<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="'Segoe UI', Arial, sans-serif">
  <!-- ARPANET Synthetic Graph -->
  <defs>
    <style>
      .node-w { fill: #4fc3f7; stroke: #0288d1; stroke-width: 2; }
      .node-e { fill: #ffb74d; stroke: #f57c00; stroke-width: 2; }
      .edge { stroke: #999; stroke-width: 2; }
      .txt { font-size: 14px; font-weight: bold; fill: #333; text-anchor: middle; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="white"/>

  <!-- Edges -->
  <line x1="100" y1="150" x2="200" y2="200" class="edge"/> <!-- UCLA - SRI -->
  <line x1="100" y1="150" x2="100" y2="250" class="edge"/> <!-- UCLA - UCSB -->
  <line x1="100" y1="150" x2="200" y2="80"  class="edge"/> <!-- UCLA - UTAH -->
  
  <line x1="200" y1="200" x2="200" y2="80"  class="edge"/> <!-- SRI - UTAH -->
  <line x1="200" y1="200" x2="400" y2="200" class="edge"/> <!-- SRI - BBN -->
  <line x1="100" y1="250" x2="200" y2="200" class="edge"/> <!-- UCSB - SRI -->
  
  <line x1="200" y1="80"  x2="400" y2="80"  class="edge"/> <!-- UTAH - MIT -->
  
  <line x1="400" y1="200" x2="500" y2="150" class="edge"/> <!-- BBN - HARVARD -->
  <line x1="400" y1="200" x2="400" y2="80"  class="edge"/> <!-- BBN - MIT -->
  <line x1="400" y1="80"  x2="500" y2="150" class="edge"/> <!-- MIT - HARVARD -->

  <!-- Nodes West (Blue) -->
  <circle cx="100" cy="150" r="28" class="node-w"/><text x="100" y="155" class="txt">UCLA</text>
  <circle cx="100" cy="250" r="28" class="node-w"/><text x="100" y="255" class="txt">UCSB</text>
  <circle cx="200" cy="200" r="28" class="node-w"/><text x="200" y="205" class="txt">SRI</text>
  <circle cx="200" cy="80"  r="28" class="node-w"/><text x="200" y="85"  class="txt">UTAH</text>

  <!-- Nodes East (Orange) -->
  <circle cx="400" cy="200" r="28" class="node-e"/><text x="400" y="205" class="txt">BBN</text>
  <circle cx="400" cy="80"  r="28" class="node-e"/><text x="400" y="85"  class="txt">MIT</text>
  <circle cx="500" cy="150" r="28" class="node-e"/><text x="500" y="155" class="txt">HARV</text>

</svg>
