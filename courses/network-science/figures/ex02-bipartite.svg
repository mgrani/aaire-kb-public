<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Bipartite Graph: Students and Courses -->
  <defs>
    <style>
      .node-s { fill: #1565c0; stroke: #0d47a1; stroke-width: 2; }
      .node-c { fill: #4caf50; stroke: #2e7d32; stroke-width: 2; }
      .edge { stroke: #999; stroke-width: 2; }
      .txt { font-size: 14px; font-weight: bold; fill: white; text-anchor: middle; }
      .lbl { font-size: 16px; font-weight: bold; fill: #333; text-anchor: middle; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="white"/>

  <text x="100" y="40" class="lbl">Students</text>
  <text x="300" y="40" class="lbl">Courses</text>

  <!-- Edges -->
  <line x1="100" y1="80" x2="300" y2="80" class="edge"/> <!-- Alice-Math -->
  <line x1="100" y1="80" x2="300" y2="150" class="edge"/> <!-- Alice-CS -->
  <line x1="100" y1="150" x2="300" y2="150" class="edge"/> <!-- Bob-CS -->
  <line x1="100" y1="150" x2="300" y2="220" class="edge"/> <!-- Bob-Physics -->
  <line x1="100" y1="220" x2="300" y2="80" class="edge"/> <!-- Carol-Math -->

  <!-- Students -->
  <circle cx="100" cy="80" r="25" class="node-s"/><text x="100" y="85" class="txt">Alice</text>
  <circle cx="100" cy="150" r="25" class="node-s"/><text x="100" y="155" class="txt">Bob</text>
  <circle cx="100" cy="220" r="25" class="node-s"/><text x="100" y="225" class="txt">Carol</text>

  <!-- Courses -->
  <circle cx="300" cy="80" r="25" class="node-c"/><text x="300" y="85" class="txt">Math</text>
  <circle cx="300" cy="150" r="25" class="node-c"/><text x="300" y="155" class="txt">CS</text>
  <circle cx="300" cy="220" r="25" class="node-c"/><text x="300" y="225" class="txt">Phys</text>
</svg>
