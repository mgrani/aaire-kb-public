<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="'Segoe UI', Arial, sans-serif">
  <!-- 5-node graph A,B,C,D,E -->
  <defs>
    <style>
      .node { fill: #42a5f5; stroke: #1e88e5; stroke-width: 2; }
      .edge { stroke: #aaa; stroke-width: 2; }
      .txt { font-size: 16px; font-weight: bold; fill: white; text-anchor: middle; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="white"/>

  <!-- Edges -->
  <line x1="150" y1="80" x2="250" y2="80" class="edge"/> <!-- A-B -->
  <line x1="150" y1="80" x2="200" y2="160" class="edge"/> <!-- A-C -->
  <line x1="250" y1="80" x2="200" y2="160" class="edge"/> <!-- B-C -->
  <line x1="250" y1="80" x2="330" y2="150" class="edge"/> <!-- B-D -->
  <line x1="330" y1="150" x2="300" y2="240" class="edge"/> <!-- D-E -->

  <!-- Nodes -->
  <circle cx="150" cy="80" r="22" class="node"/><text x="150" y="86" class="txt">A</text>
  <circle cx="250" cy="80" r="22" class="node"/><text x="250" y="86" class="txt">B</text>
  <circle cx="200" cy="160" r="22" class="node"/><text x="200" y="166" class="txt">C</text>
  <circle cx="330" cy="150" r="22" class="node"/><text x="330" y="156" class="txt">D</text>
  <circle cx="300" cy="240" r="22" class="node"/><text x="300" y="246" class="txt">E</text>
</svg>
