<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="'Segoe UI', Arial, sans-serif">
  <!-- BFS Exercise Graph: 8 nodes -->
  <!-- 1-2, 1-3, 2-4, 2-5, 3-6, 4-7, 5-7, 6-8 -->
  <defs>
    <style>
      .node { fill: #ab47bc; stroke: #8e24aa; stroke-width: 2; }
      .edge { stroke: #999; stroke-width: 2; }
      .txt { font-size: 16px; font-weight: bold; fill: white; text-anchor: middle; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="white"/>

  <!-- Edges -->
  <line x1="200" y1="40" x2="120" y2="100" class="edge"/> <!-- 1-2 -->
  <line x1="200" y1="40" x2="280" y2="100" class="edge"/> <!-- 1-3 -->
  
  <line x1="120" y1="100" x2="80"  y2="180" class="edge"/> <!-- 2-4 -->
  <line x1="120" y1="100" x2="160" y2="180" class="edge"/> <!-- 2-5 -->
  
  <line x1="280" y1="100" x2="280" y2="180" class="edge"/> <!-- 3-6 -->

  <line x1="80"  y1="180" x2="120" y2="250" class="edge"/> <!-- 4-7 -->
  <line x1="160" y1="180" x2="120" y2="250" class="edge"/> <!-- 5-7 -->

  <line x1="280" y1="180" x2="280" y2="250" class="edge"/> <!-- 6-8 -->

  <!-- Nodes -->
  <circle cx="200" cy="40" r="20" class="node"/><text x="200" y="46" class="txt">1</text>
  <circle cx="120" cy="100" r="20" class="node"/><text x="120" y="106" class="txt">2</text>
  <circle cx="280" cy="100" r="20" class="node"/><text x="280" y="106" class="txt">3</text>
  
  <circle cx="80"  cy="180" r="20" class="node"/><text x="80" y="186" class="txt">4</text>
  <circle cx="160" cy="180" r="20" class="node"/><text x="160" y="186" class="txt">5</text>
  
  <circle cx="280" cy="180" r="20" class="node"/><text x="280" y="186" class="txt">6</text>
  
  <circle cx="120" cy="250" r="20" class="node"/><text x="120" y="256" class="txt">7</text>
  <circle cx="280" cy="250" r="20" class="node"/><text x="280" y="256" class="txt">8</text>
</svg>
