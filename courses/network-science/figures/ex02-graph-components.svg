<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Components Graph (Directed) -->
  <defs>
    <style>
      .node { fill: #ab47bc; stroke: #8e24aa; stroke-width: 2; }
      .edge { stroke: #666; stroke-width: 2; fill: none; }
      .txt { font-size: 16px; font-weight: bold; fill: white; text-anchor: middle; }
    </style>
    <!-- Arrowhead marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="22" refY="5"
        markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" />
    </marker>
    <!-- Arrowhead marker for curved back-edges -->
    <marker id="arrow-curve" viewBox="0 0 10 10" refX="22" refY="5"
        markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="white"/>

  <!-- Edges -->
  <!-- 1 -> 2 -->
  <line x1="100" y1="150" x2="200" y2="100" class="edge" marker-end="url(#arrow)"/>
  <!-- 2 -> 3 -->
  <line x1="200" y1="100" x2="200" y2="200" class="edge" marker-end="url(#arrow)"/>
  <!-- 3 -> 1 -->
  <line x1="200" y1="200" x2="100" y2="150" class="edge" marker-end="url(#arrow)"/>
  
  <!-- 4 -> 3 -->
  <line x1="300" y1="250" x2="200" y2="200" class="edge" marker-end="url(#arrow)"/>
  
  <!-- 5 -> 6 -->
  <path d="M 400 150 Q 450 120 500 150" class="edge" marker-end="url(#arrow-curve)"/>
  <!-- 6 -> 5 -->
  <path d="M 500 150 Q 450 180 400 150" class="edge" marker-end="url(#arrow-curve)"/>

  <!-- Nodes -->
  <circle cx="100" cy="150" r="20" class="node"/><text x="100" y="156" class="txt">1</text>
  <circle cx="200" cy="100" r="20" class="node"/><text x="200" y="106" class="txt">2</text>
  <circle cx="200" cy="200" r="20" class="node"/><text x="200" y="206" class="txt">3</text>
  
  <circle cx="300" cy="250" r="20" class="node"/><text x="300" y="256" class="txt">4</text>
  
  <circle cx="400" cy="150" r="20" class="node"/><text x="400" y="156" class="txt">5</text>
  <circle cx="500" cy="150" r="20" class="node"/><text x="500" y="156" class="txt">6</text>

</svg>
