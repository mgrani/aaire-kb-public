<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Star Graph -->
  <defs>
    <style>
      .node { fill: #ab47bc; stroke: #8e24aa; stroke-width: 2; }
      .edge { stroke: #999; stroke-width: 2; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="white"/>

  <!-- Edges -->
  <line x1="150" y1="150" x2="150" y2="50" class="edge"/>
  <line x1="150" y1="150" x2="250" y2="150" class="edge"/>
  <line x1="150" y1="150" x2="150" y2="250" class="edge"/>
  <line x1="150" y1="150" x2="50" y2="150" class="edge"/>

  <!-- Nodes -->
  <circle cx="150" cy="150" r="20" class="node"/>
  <circle cx="150" cy="50"  r="20" class="node"/>
  <circle cx="250" cy="150" r="20" class="node"/>
  <circle cx="150" cy="250" r="20" class="node"/>
  <circle cx="50"  cy="150" r="20" class="node"/>
</svg>
