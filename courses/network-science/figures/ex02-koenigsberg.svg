<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Königsberg Multigraph -->
  <defs>
    <style>
      .node { fill: #4caf50; stroke: #2e7d32; stroke-width: 2; }
      .edge { stroke: #555; stroke-width: 3; fill: none; }
      .txt { font-size: 18px; font-weight: bold; fill: white; text-anchor: middle; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="white"/>

  <!-- Edges -->
  <!-- N to I (2 edges) -->
  <path d="M 150 80 Q 100 130 150 180" class="edge"/>
  <path d="M 150 80 Q 200 130 150 180" class="edge"/>

  <!-- S to I (2 edges) -->
  <path d="M 150 280 Q 100 230 150 180" class="edge"/>
  <path d="M 150 280 Q 200 230 150 180" class="edge"/>

  <!-- N to E (1 edge) -->
  <path d="M 150 80 Q 250 80 300 180" class="edge"/>

  <!-- S to E (1 edge) -->
  <path d="M 150 280 Q 250 280 300 180" class="edge"/>

  <!-- I to E (1 edge) -->
  <line x1="150" y1="180" x2="300" y2="180" class="edge"/>

  <!-- Nodes -->
  <circle cx="150" cy="80" r="28" class="node"/><text x="150" y="86" class="txt">N</text>
  <circle cx="150" cy="280" r="28" class="node"/><text x="150" y="286" class="txt">S</text>
  <circle cx="150" cy="180" r="28" class="node"/><text x="150" y="186" class="txt">I</text>
  <circle cx="300" cy="180" r="28" class="node"/><text x="300" y="186" class="txt">E</text>

</svg>
