<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Projected Graph: Students sharing courses -->
  <defs>
    <style>
      .node-s { fill: #1e88e5; stroke: #1565c0; stroke-width: 2; }
      .edge { stroke: #90caf9; stroke-width: 3; }
      .txt { font-size: 14px; font-weight: bold; fill: white; text-anchor: middle; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="white"/>

  <!-- Edges -->
  <line x1="150" y1="80" x2="80" y2="180" class="edge"/> <!-- Alice-Bob (CS) -->
  <line x1="150" y1="80" x2="220" y2="180" class="edge"/> <!-- Alice-Carol (Math) -->

  <!-- Nodes -->
  <circle cx="150" cy="80" r="28" class="node-s"/><text x="150" y="85" class="txt">Alice</text>
  <circle cx="80" cy="180" r="28" class="node-s"/><text x="80" y="185" class="txt">Bob</text>
  <circle cx="220" cy="180" r="28" class="node-s"/><text x="220" y="185" class="txt">Carol</text>
</svg>
