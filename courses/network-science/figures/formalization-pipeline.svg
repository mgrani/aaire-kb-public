<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">From reality to graph model</title>
  <desc id="desc">A pipeline showing how a real-world system is turned into a graph model through choices about nodes, edges, and abstractions.</desc>
  <rect width="1200" height="280" fill="#ffffff"/>

  <text x="600" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111111" font-weight="700">
    From reality to graph model
  </text>

  <rect x="40" y="90" width="180" height="90" rx="16" fill="#f2f2f2" stroke="#bdbdbd" stroke-width="2"/>
  <rect x="270" y="90" width="170" height="90" rx="16" fill="#edf4ff" stroke="#6f8fc5" stroke-width="2"/>
  <rect x="490" y="90" width="170" height="90" rx="16" fill="#edf4ff" stroke="#6f8fc5" stroke-width="2"/>
  <rect x="710" y="90" width="180" height="90" rx="16" fill="#f2f2f2" stroke="#bdbdbd" stroke-width="2"/>
  <rect x="940" y="90" width="220" height="90" rx="16" fill="#f9f4ea" stroke="#c9a76b" stroke-width="2"/>

  <text x="130" y="125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111111" font-weight="700">Real world</text>
  <text x="130" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#444444">social, technical, economic</text>

  <text x="355" y="121" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111111" font-weight="700">Choose nodes</text>
  <text x="355" y="147" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#444444">people, pages, firms, clubs</text>

  <text x="575" y="121" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111111" font-weight="700">Choose edges</text>
  <text x="575" y="147" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#444444">ties, links, flows, affiliations</text>

  <text x="800" y="121" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111111" font-weight="700">Graph model</text>
  <text x="800" y="147" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#444444">directed, weighted, bipartite</text>

  <text x="1050" y="121" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111111" font-weight="700">Analysis</text>
  <text x="1050" y="147" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#444444">paths, centrality, communities</text>

  <line x1="220" y1="135" x2="270" y2="135" stroke="#6f8fc5" stroke-width="4" stroke-linecap="round"/>
  <polygon points="270,135 258,127 258,143" fill="#6f8fc5"/>

  <line x1="440" y1="135" x2="490" y2="135" stroke="#6f8fc5" stroke-width="4" stroke-linecap="round"/>
  <polygon points="490,135 478,127 478,143" fill="#6f8fc5"/>

  <line x1="660" y1="135" x2="710" y2="135" stroke="#6f8fc5" stroke-width="4" stroke-linecap="round"/>
  <polygon points="710,135 698,127 698,143" fill="#6f8fc5"/>

  <line x1="890" y1="135" x2="940" y2="135" stroke="#c9a76b" stroke-width="4" stroke-linecap="round"/>
  <polygon points="940,135 928,127 928,143" fill="#c9a76b"/>

  <text x="600" y="226" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#555555">
    Example: an affiliation setting can become a bipartite graph, or a projection, depending on the question.
  </text>
</svg>
