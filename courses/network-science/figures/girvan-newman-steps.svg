<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="'Segoe UI', Arial, sans-serif">

  <text x="360" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Girvan–Newman: peel the graph at its highest-betweenness edges</text>

  <!-- Helper macro: draw a triangle cluster at (cx, cy) with letters -->
  <!-- LEFT cluster centers and right cluster centers vary per panel -->

  <!-- ============== STEP 0: original ============== -->
  <g transform="translate(0,40)">
    <rect x="10" y="0" width="220" height="220" rx="10" fill="#eceff1" stroke="#607d8b" stroke-width="1.3"/>
    <text x="120" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#37474f">Step 0 — initial graph</text>

    <!-- left cluster: A B C -->
    <line x1="50"  y1="80"  x2="90"  y2="60"  stroke="#607d8b" stroke-width="1.6"/>
    <line x1="50"  y1="80"  x2="90"  y2="120" stroke="#607d8b" stroke-width="1.6"/>
    <line x1="90"  y1="60"  x2="90"  y2="120" stroke="#607d8b" stroke-width="1.6"/>
    <!-- right cluster: D E F -->
    <line x1="190" y1="80"  x2="150" y2="60"  stroke="#607d8b" stroke-width="1.6"/>
    <line x1="190" y1="80"  x2="150" y2="120" stroke="#607d8b" stroke-width="1.6"/>
    <line x1="150" y1="60"  x2="150" y2="120" stroke="#607d8b" stroke-width="1.6"/>
    <!-- bridge -->
    <line x1="90"  y1="120" x2="150" y2="120" stroke="#d32f2f" stroke-width="3.2"/>
    <text x="120" y="142" text-anchor="middle" font-size="9" fill="#d32f2f" font-weight="bold">highest betweenness</text>

    <circle cx="50"  cy="80"  r="11" fill="#90a4ae"/>
    <circle cx="90"  cy="60"  r="11" fill="#90a4ae"/>
    <circle cx="90"  cy="120" r="11" fill="#90a4ae"/>
    <circle cx="150" cy="60"  r="11" fill="#90a4ae"/>
    <circle cx="150" cy="120" r="11" fill="#90a4ae"/>
    <circle cx="190" cy="80"  r="11" fill="#90a4ae"/>

    <!-- extra triangle attached -->
    <line x1="50"  y1="80" x2="40"  y2="180" stroke="#607d8b" stroke-width="1.6"/>
    <line x1="40"  y1="180" x2="80" y2="180" stroke="#607d8b" stroke-width="1.6"/>
    <line x1="80"  y1="180" x2="50" y2="80"  stroke="#607d8b" stroke-width="1.6"/>
    <circle cx="40"  cy="180" r="9" fill="#90a4ae"/>
    <circle cx="80"  cy="180" r="9" fill="#90a4ae"/>
  </g>

  <text x="245" y="155" text-anchor="middle" font-size="22" fill="#888">→</text>

  <!-- ============== STEP 1: bridge removed ============== -->
  <g transform="translate(250,40)">
    <rect x="10" y="0" width="220" height="220" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.3"/>
    <text x="120" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#bf360c">Step 1 — remove top edge</text>

    <line x1="50"  y1="80"  x2="90"  y2="60"  stroke="#f57c00" stroke-width="1.6"/>
    <line x1="50"  y1="80"  x2="90"  y2="120" stroke="#f57c00" stroke-width="1.6"/>
    <line x1="90"  y1="60"  x2="90"  y2="120" stroke="#f57c00" stroke-width="1.6"/>
    <line x1="190" y1="80"  x2="150" y2="60"  stroke="#f57c00" stroke-width="1.6"/>
    <line x1="190" y1="80"  x2="150" y2="120" stroke="#f57c00" stroke-width="1.6"/>
    <line x1="150" y1="60"  x2="150" y2="120" stroke="#f57c00" stroke-width="1.6"/>

    <circle cx="50"  cy="80"  r="11" fill="#fb8c00"/>
    <circle cx="90"  cy="60"  r="11" fill="#fb8c00"/>
    <circle cx="90"  cy="120" r="11" fill="#fb8c00"/>
    <circle cx="150" cy="60"  r="11" fill="#fb8c00"/>
    <circle cx="150" cy="120" r="11" fill="#fb8c00"/>
    <circle cx="190" cy="80"  r="11" fill="#fb8c00"/>

    <!-- triangle still attached on the left via single edge -->
    <line x1="50"  y1="80" x2="40"  y2="180" stroke="#f57c00" stroke-width="1.6"/>
    <line x1="40"  y1="180" x2="80" y2="180" stroke="#f57c00" stroke-width="1.6"/>
    <line x1="80"  y1="180" x2="50" y2="80"  stroke="#f57c00" stroke-width="1.6"/>
    <circle cx="40"  cy="180" r="9" fill="#fb8c00"/>
    <circle cx="80"  cy="180" r="9" fill="#fb8c00"/>

    <text x="120" y="240" text-anchor="middle" font-size="9" fill="#bf360c" font-style="italic">two main clusters revealed</text>
  </g>

  <text x="485" y="155" text-anchor="middle" font-size="22" fill="#888">→</text>

  <!-- ============== STEP 2: triangle isolated ============== -->
  <g transform="translate(490,40)">
    <rect x="10" y="0" width="220" height="220" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
    <text x="120" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">Step 2 — peel the small triangle</text>

    <line x1="50"  y1="80"  x2="90"  y2="60"  stroke="#43a047" stroke-width="1.6"/>
    <line x1="50"  y1="80"  x2="90"  y2="120" stroke="#43a047" stroke-width="1.6"/>
    <line x1="90"  y1="60"  x2="90"  y2="120" stroke="#43a047" stroke-width="1.6"/>
    <line x1="190" y1="80"  x2="150" y2="60"  stroke="#43a047" stroke-width="1.6"/>
    <line x1="190" y1="80"  x2="150" y2="120" stroke="#43a047" stroke-width="1.6"/>
    <line x1="150" y1="60"  x2="150" y2="120" stroke="#43a047" stroke-width="1.6"/>

    <circle cx="50"  cy="80"  r="11" fill="#66bb6a"/>
    <circle cx="90"  cy="60"  r="11" fill="#66bb6a"/>
    <circle cx="90"  cy="120" r="11" fill="#66bb6a"/>
    <circle cx="150" cy="60"  r="11" fill="#66bb6a"/>
    <circle cx="150" cy="120" r="11" fill="#66bb6a"/>
    <circle cx="190" cy="80"  r="11" fill="#66bb6a"/>

    <!-- triangle now isolated -->
    <line x1="40"  y1="180" x2="80" y2="180" stroke="#43a047" stroke-width="1.6"/>
    <line x1="40"  y1="180" x2="60" y2="220" stroke="#43a047" stroke-width="1.6"/>
    <line x1="80"  y1="180" x2="60" y2="220" stroke="#43a047" stroke-width="1.6"/>
    <circle cx="40"  cy="180" r="9" fill="#66bb6a"/>
    <circle cx="80"  cy="180" r="9" fill="#66bb6a"/>
    <circle cx="60"  cy="220" r="9" fill="#66bb6a"/>

    <text x="120" y="248" text-anchor="middle" font-size="9" fill="#1b5e20" font-style="italic">three communities — pick by max modularity Q</text>
  </g>
</svg>
