<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="'Segoe UI', Arial, sans-serif">

  <!-- ══════════════════════════════════════
       LEFT: Component 1  (blue tones)
       Nodes: A, B, C, D — fully connected
  ══════════════════════════════════════ -->
  <rect x="20" y="20" width="440" height="320" rx="16" fill="#e3f2fd" opacity="0.55" stroke="#1565c0" stroke-width="1.5"/>
  <text x="240" y="54" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565c0">Component 1</text>
  <text x="240" y="74" text-anchor="middle" font-size="12" fill="#1976d2">Every node reachable from every other node</text>

  <!-- Edges -->
  <line x1="110" y1="175" x2="232" y2="125" stroke="#90caf9" stroke-width="2.2"/>
  <line x1="110" y1="185" x2="232" y2="243" stroke="#90caf9" stroke-width="2.2"/>
  <line x1="256" y1="120" x2="368" y2="120" stroke="#90caf9" stroke-width="2.2"/>
  <line x1="256" y1="248" x2="368" y2="248" stroke="#90caf9" stroke-width="2.2"/>
  <line x1="244" y1="144" x2="244" y2="224" stroke="#90caf9" stroke-width="2.2"/>
  <line x1="392" y1="128" x2="392" y2="232" stroke="#90caf9" stroke-width="2.2"/>
  <line x1="268" y1="128" x2="376" y2="236" stroke="#90caf9" stroke-width="1.8" stroke-dasharray="5,3" opacity="0.6"/>

  <!-- Nodes -->
  <circle cx="110" cy="180" r="26" fill="#1565c0" stroke="#0d47a1" stroke-width="2.5"/>
  <text x="110" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="white">A</text>

  <circle cx="244" cy="120" r="26" fill="#1976d2" stroke="#1565c0" stroke-width="2"/>
  <text x="244" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="white">B</text>

  <circle cx="244" cy="248" r="26" fill="#1976d2" stroke="#1565c0" stroke-width="2"/>
  <text x="244" y="254" text-anchor="middle" font-size="15" font-weight="bold" fill="white">C</text>

  <circle cx="390" cy="120" r="26" fill="#42a5f5" stroke="#1565c0" stroke-width="2"/>
  <text x="390" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="white">D</text>

  <circle cx="390" cy="248" r="26" fill="#42a5f5" stroke="#1565c0" stroke-width="2"/>
  <text x="390" y="254" text-anchor="middle" font-size="15" font-weight="bold" fill="white">E</text>

  <!-- Caption -->
  <text x="240" y="308" text-anchor="middle" font-size="12" fill="#1565c0">5 nodes, fully internally connected</text>
  <text x="240" y="326" text-anchor="middle" font-size="12" fill="#555">No edge reaches Component 2</text>

  <!-- ══════════════════════════════════════
       Separator / no-connection indicator
  ══════════════════════════════════════ -->
  <line x1="500" y1="100" x2="500" y2="260" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="500" y="92" text-anchor="middle" font-size="11" fill="#aaa">no edges</text>
  <text x="500" y="278" text-anchor="middle" font-size="11" fill="#aaa">between</text>

  <!-- ══════════════════════════════════════
       RIGHT: Component 2  (teal / green tones)
       Nodes: F, G, H — triangle
  ══════════════════════════════════════ -->
  <rect x="540" y="20" width="440" height="320" rx="16" fill="#e8f5e9" opacity="0.55" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="760" y="54" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d32">Component 2</text>
  <text x="760" y="74" text-anchor="middle" font-size="12" fill="#388e3c">Every node reachable from every other node</text>

  <!-- Edges -->
  <line x1="638" y1="242" x2="758" y2="142" stroke="#81c784" stroke-width="2.2"/>
  <line x1="782" y1="142" x2="882" y2="242" stroke="#81c784" stroke-width="2.2"/>
  <line x1="658" y1="254" x2="866" y2="254" stroke="#81c784" stroke-width="2.2"/>

  <!-- Nodes -->
  <circle cx="640" cy="254" r="26" fill="#2e7d32" stroke="#1b5e20" stroke-width="2.5"/>
  <text x="640" y="260" text-anchor="middle" font-size="15" font-weight="bold" fill="white">F</text>

  <circle cx="770" cy="130" r="26" fill="#388e3c" stroke="#2e7d32" stroke-width="2"/>
  <text x="770" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="white">G</text>

  <circle cx="882" cy="254" r="26" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/>
  <text x="882" y="260" text-anchor="middle" font-size="15" font-weight="bold" fill="white">H</text>

  <!-- Caption -->
  <text x="760" y="308" text-anchor="middle" font-size="12" fill="#2e7d32">3 nodes, fully internally connected</text>
  <text x="760" y="326" text-anchor="middle" font-size="12" fill="#555">No edge reaches Component 1</text>

</svg>