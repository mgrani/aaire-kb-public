<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Eulerian path and circuit</title>
  <desc id="desc">Left panel shows an Eulerian path with exactly two odd-degree vertices, right panel shows an Eulerian circuit with all even degrees.</desc>
  <rect width="960" height="540" fill="#fbf8ef"/>
  <g font-family="Aptos, Segoe UI, sans-serif" fill="#213547">
    <text x="240" y="70" font-size="30" font-weight="700" text-anchor="middle">Eulerian Path</text>
    <text x="240" y="105" font-size="22" text-anchor="middle">Exactly two odd-degree vertices</text>
    <text x="720" y="70" font-size="30" font-weight="700" text-anchor="middle">Eulerian Circuit</text>
    <text x="720" y="105" font-size="22" text-anchor="middle">All vertices have even degree</text>
  </g>
  <g fill="none" stroke="#5c6b73" stroke-width="8" stroke-linecap="round">
    <line x1="150" y1="180" x2="330" y2="180"/>
    <line x1="330" y1="180" x2="330" y2="360"/>
    <line x1="330" y1="360" x2="150" y2="360"/>
    <line x1="150" y1="360" x2="150" y2="180"/>
    <line x1="150" y1="180" x2="330" y2="360"/>
    <line x1="610" y1="180" x2="830" y2="180"/>
    <line x1="830" y1="180" x2="830" y2="360"/>
    <line x1="830" y1="360" x2="610" y2="360"/>
    <line x1="610" y1="360" x2="610" y2="180"/>
    <line x1="610" y1="180" x2="720" y2="120"/>
    <line x1="720" y1="120" x2="830" y2="180"/>
    <line x1="830" y1="360" x2="720" y2="420"/>
    <line x1="720" y1="420" x2="610" y2="360"/>
  </g>
  <g fill="#1f3c88" stroke="#17305f" stroke-width="4">
    <circle cx="150" cy="180" r="26"/>
    <circle cx="330" cy="180" r="26"/>
    <circle cx="330" cy="360" r="26"/>
    <circle cx="150" cy="360" r="26"/>
    <circle cx="610" cy="180" r="26"/>
    <circle cx="830" cy="180" r="26"/>
    <circle cx="830" cy="360" r="26"/>
    <circle cx="610" cy="360" r="26"/>
    <circle cx="720" cy="120" r="26"/>
    <circle cx="720" cy="420" r="26"/>
  </g>
  <g font-family="Aptos, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="150" y="187">1</text>
    <text x="330" y="187">3</text>
    <text x="330" y="367">3</text>
    <text x="150" y="367">2</text>
    <text x="610" y="187">2</text>
    <text x="830" y="187">2</text>
    <text x="830" y="367">2</text>
    <text x="610" y="367">2</text>
    <text x="720" y="127">2</text>
    <text x="720" y="427">2</text>
  </g>
  <g font-family="Aptos, Segoe UI, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <text x="240" y="475" fill="#b54708">Odd degrees: 2 endpoints</text>
    <text x="720" y="475" fill="#2b6f3e">Closed walk possible</text>
  </g>
</svg>
