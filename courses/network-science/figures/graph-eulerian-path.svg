<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="title desc">
  <title id="title">Eulerian path</title>
  <desc id="desc">An Eulerian path with exactly two odd-degree vertices.</desc>
  <rect width="480" height="280" fill="transparent"/>
  <g font-family="Aptos, Segoe UI, sans-serif" fill="#213547">
    <text x="240" y="30" font-size="28" font-weight="700" text-anchor="middle">Eulerian Path</text>
    <text x="240" y="60" font-size="18" text-anchor="middle">Exactly two odd-degree vertices</text>
  </g>
  <g fill="none" stroke="#5c6b73" stroke-width="8" stroke-linecap="round">
    <line x1="120" y1="120" x2="360" y2="120"/>
    <line x1="360" y1="120" x2="360" y2="200"/>
    <line x1="360" y1="200" x2="120" y2="200"/>
    <line x1="120" y1="200" x2="120" y2="120"/>
    <line x1="120" y1="120" x2="360" y2="200"/>
  </g>
  <g fill="#1f3c88" stroke="#17305f" stroke-width="4">
    <circle cx="120" cy="120" r="26"/>
    <circle cx="360" cy="120" r="26"/>
    <circle cx="360" cy="200" r="26"/>
    <circle cx="120" cy="200" r="26"/>
  </g>
  <g font-family="Aptos, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="120" y="127">3</text>
    <text x="360" y="127">2</text>
    <text x="360" y="207">3</text>
    <text x="120" y="207">2</text>
  </g>
  <g font-family="Aptos, Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <text x="240" y="265" fill="#b54708">Odd degrees: 2 endpoints</text>
  </g>
</svg>
