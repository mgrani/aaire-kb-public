<svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 600 480" role="img" aria-labelledby="title desc">
  <title id="title">Abstract graph of Königsberg bridges</title>
  <desc id="desc">A multi-graph showing 4 nodes with degrees 3, 5, 3, and 3.</desc>
  <rect width="600" height="480" fill="transparent"/>
  <g fill="none" stroke="#5c6b73" stroke-width="8" stroke-linecap="round">
    <!-- North to Island (2 edges) -->
    <path d="M 300 100 Q 230 170 300 240" />
    <path d="M 300 100 Q 370 170 300 240" />
    <!-- South to Island (2 edges) -->
    <path d="M 300 380 Q 230 310 300 240" />
    <path d="M 300 380 Q 370 310 300 240" />
    <!-- Island to East -->
    <line x1="300" y1="240" x2="450" y2="240" />
    <!-- North to East -->
    <line x1="300" y1="100" x2="450" y2="240" />
    <!-- South to East -->
    <line x1="300" y1="380" x2="450" y2="240" />
  </g>
  <g fill="#1f3c88" stroke="#17305f" stroke-width="4">
    <circle cx="300" cy="100" r="30"/> <!-- North (3) -->
    <circle cx="300" cy="240" r="30"/> <!-- Island (5) -->
    <circle cx="300" cy="380" r="30"/> <!-- South (3) -->
    <circle cx="450" cy="240" r="30"/> <!-- East (3) -->
  </g>
  <g font-family="Aptos, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">
    <!-- Text labels showing the odd degrees -->
    <text x="300" y="108">3</text>
    <text x="300" y="248">5</text>
    <text x="300" y="388">3</text>
    <text x="450" y="248">3</text>
  </g>
</svg>
