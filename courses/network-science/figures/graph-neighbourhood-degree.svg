<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Neighbourhood and degree</title>
  <desc id="desc">A central node v connected to four neighbours, with an elliptical neighbourhood highlight.</desc>
  <g fill="none" stroke="#5c6b73" stroke-width="8" stroke-linecap="round">
    <line x1="480" y1="270" x2="150" y2="150"/>
    <line x1="480" y1="270" x2="810" y2="150"/>
    <line x1="480" y1="270" x2="810" y2="390"/>
    <line x1="480" y1="270" x2="150" y2="390"/>
  </g>
  <ellipse cx="480" cy="270" rx="440" ry="190" fill="#f6d365" fill-opacity="0.22" stroke="#d18a00" stroke-width="5" stroke-dasharray="12 10"/>
  <g font-family="Aptos, Segoe UI, sans-serif" font-size="28" fill="#213547" text-anchor="middle">
    <text x="480" y="60">Neighbourhood N(v) = {a, b, c, d}</text>
    <text x="480" y="510">Degree deg(v) = 4</text>
  </g>
  <g fill="#1f3c88" stroke="#17305f" stroke-width="4">
    <circle cx="480" cy="270" r="34"/>
    <circle cx="150" cy="150" r="28" fill="#5fa8d3"/>
    <circle cx="810" cy="150" r="28" fill="#5fa8d3"/>
    <circle cx="810" cy="390" r="28" fill="#5fa8d3"/>
    <circle cx="150" cy="390" r="28" fill="#5fa8d3"/>
  </g>
  <g font-family="Aptos, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="480" y="280">v</text>
    <text x="150" y="160">a</text>
    <text x="810" y="160">b</text>
    <text x="810" y="400">c</text>
    <text x="150" y="400">d</text>
  </g>
</svg>
