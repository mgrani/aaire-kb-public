<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Graph representations</title>
  <desc id="desc">The same small graph shown as an edge list, adjacency list, and adjacency matrix.</desc>
  <rect width="1200" height="460" fill="#ffffff"/>



  <rect x="40" y="70" width="340" height="330" rx="18" fill="#f7f7f7" stroke="#c8c8c8" stroke-width="2"/>
  <rect x="430" y="70" width="340" height="330" rx="18" fill="#f7f7f7" stroke="#c8c8c8" stroke-width="2"/>
  <rect x="820" y="70" width="340" height="330" rx="18" fill="#f7f7f7" stroke="#c8c8c8" stroke-width="2"/>

  <text x="210" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111111" font-weight="700">Edge list</text>
  <text x="600" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111111" font-weight="700">Adjacency list</text>
  <text x="990" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111111" font-weight="700">Adjacency matrix</text>

  <text x="85" y="150" font-family="Courier New, monospace" font-size="18" fill="#222222">(u1, v1)</text>
  <text x="85" y="180" font-family="Courier New, monospace" font-size="18" fill="#222222">(u1, v2)</text>
  <text x="85" y="210" font-family="Courier New, monospace" font-size="18" fill="#222222">(u2, v2)</text>
  <text x="85" y="240" font-family="Courier New, monospace" font-size="18" fill="#222222">(u3, v1)</text>
  <text x="85" y="270" font-family="Courier New, monospace" font-size="18" fill="#222222">(u3, v2)</text>
  <text x="210" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#555555">Compact and easy to exchange,</text>
  <text x="210" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#555555">but neighbor lookup is slower.</text>

  <text x="475" y="150" font-family="Courier New, monospace" font-size="18" fill="#222222">u1: v1, v2</text>
  <text x="475" y="180" font-family="Courier New, monospace" font-size="18" fill="#222222">u2: v2</text>
  <text x="475" y="210" font-family="Courier New, monospace" font-size="18" fill="#222222">u3: v1, v2</text>
  <text x="475" y="240" font-family="Courier New, monospace" font-size="18" fill="#222222">v1: u1, u3</text>
  <text x="475" y="270" font-family="Courier New, monospace" font-size="18" fill="#222222">v2: u1, u2, u3</text>
  <text x="600" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#555555">Best default for traversal:</text>
  <text x="600" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#555555">neighbors are stored directly.</text>

  <text x="920" y="136" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="#444444">v1</text>
  <text x="960" y="136" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="#444444">v2</text>
  <text x="1000" y="136" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="#444444">v3</text>

  <text x="886" y="172" text-anchor="end" font-family="Courier New, monospace" font-size="16" fill="#444444">v1</text>
  <text x="886" y="212" text-anchor="end" font-family="Courier New, monospace" font-size="16" fill="#444444">v2</text>
  <text x="886" y="252" text-anchor="end" font-family="Courier New, monospace" font-size="16" fill="#444444">v3</text>

  <rect x="900" y="145" width="40" height="40" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/>
  <rect x="940" y="145" width="40" height="40" fill="#dbe7f7" stroke="#9a9a9a" stroke-width="1.5"/>
  <rect x="980" y="145" width="40" height="40" fill="#dbe7f7" stroke="#9a9a9a" stroke-width="1.5"/>

  <rect x="900" y="185" width="40" height="40" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/>
  <rect x="940" y="185" width="40" height="40" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/>
  <rect x="980" y="185" width="40" height="40" fill="#dbe7f7" stroke="#9a9a9a" stroke-width="1.5"/>

  <rect x="900" y="225" width="40" height="40" fill="#dbe7f7" stroke="#9a9a9a" stroke-width="1.5"/>
  <rect x="940" y="225" width="40" height="40" fill="#dbe7f7" stroke="#9a9a9a" stroke-width="1.5"/>
  <rect x="980" y="225" width="40" height="40" fill="#dbe7f7" stroke="#9a9a9a" stroke-width="1.5"/>

  <text x="920" y="172" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="#222222">0</text>
  <text x="960" y="172" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="#222222">1</text>
  <text x="1000" y="172" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="#222222">1</text>
  <text x="920" y="212" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="#222222">0</text>
  <text x="960" y="212" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="#222222">0</text>
  <text x="1000" y="212" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="#222222">1</text>
  <text x="920" y="252" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="#222222">1</text>
  <text x="960" y="252" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="#222222">1</text>
  <text x="1000" y="252" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="#222222">1</text>

  <text x="990" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#555555">Rows and columns are node labels.</text>
  <text x="990" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#555555">Fast lookup, but space-heavy.</text>
</svg>
