<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Why the random-mixing baseline equals the sum of squared class shares</title>
  <desc id="desc">Two side-by-side probability squares. In a 50/50 population, random pairing matches classes 50% of the time; in a 90/10 population, it matches 82% of the time. The diagonal cells, whose areas are the squared class shares, account for all same-class pairings.</desc>
  <rect width="1200" height="480" fill="#ffffff"/>

  <g transform="translate(0,-55)">
  <!-- ================= PANEL A: balanced 50/50 ================= -->
  <g>
    <rect x="30" y="75" width="560" height="445" rx="12" fill="#fafdff" stroke="#90caf9" stroke-width="1.5"/>
    <text x="310" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">Balanced population &#8212; 50% blue, 50% orange</text>

    <!-- Population strip -->
    <text x="60" y="126" font-size="11" font-weight="600" fill="#455a64">Population:</text>
    <g>
      <circle cx="225" cy="121" r="8.5" fill="#1976d2" stroke="#0d47a1" stroke-width="1.2"/>
      <circle cx="246" cy="121" r="8.5" fill="#1976d2" stroke="#0d47a1" stroke-width="1.2"/>
      <circle cx="267" cy="121" r="8.5" fill="#1976d2" stroke="#0d47a1" stroke-width="1.2"/>
      <circle cx="288" cy="121" r="8.5" fill="#1976d2" stroke="#0d47a1" stroke-width="1.2"/>
      <circle cx="309" cy="121" r="8.5" fill="#1976d2" stroke="#0d47a1" stroke-width="1.2"/>
      <circle cx="345" cy="121" r="8.5" fill="#ef6c00" stroke="#bf360c" stroke-width="1.2"/>
      <circle cx="366" cy="121" r="8.5" fill="#ef6c00" stroke="#bf360c" stroke-width="1.2"/>
      <circle cx="387" cy="121" r="8.5" fill="#ef6c00" stroke="#bf360c" stroke-width="1.2"/>
      <circle cx="408" cy="121" r="8.5" fill="#ef6c00" stroke="#bf360c" stroke-width="1.2"/>
      <circle cx="429" cy="121" r="8.5" fill="#ef6c00" stroke="#bf360c" stroke-width="1.2"/>
    </g>
    <text x="495" y="125" font-size="11" fill="#546e7a" font-style="italic">p_blue = p_orange = 0.5</text>

    <text x="310" y="155" text-anchor="middle" font-size="11" fill="#37474f" font-style="italic">Probability square: each cell&#8217;s area = chance of that ordered pair</text>

    <!-- Axis label top -->
    <text x="295" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#37474f">Endpoint 1&#8217;s class</text>
    <text x="237.5" y="192" text-anchor="middle" font-size="10" font-weight="600" fill="#0d47a1">blue &#183; 0.5</text>
    <text x="352.5" y="192" text-anchor="middle" font-size="10" font-weight="600" fill="#bf360c">orange &#183; 0.5</text>

    <!-- Axis label left (rotated) -->
    <g transform="rotate(-90 168 310)">
      <text x="168" y="310" text-anchor="middle" font-size="11" font-weight="700" fill="#37474f">Endpoint 2&#8217;s class</text>
    </g>
    <text x="175" y="257" text-anchor="end" font-size="10" font-weight="600" fill="#0d47a1">blue &#183; 0.5</text>
    <text x="175" y="372" text-anchor="end" font-size="10" font-weight="600" fill="#bf360c">orange &#183; 0.5</text>

    <!-- Cells: square 180..410 x 195..425, split at x=295, y=310 -->
    <!-- TL: blue x blue -->
    <rect x="180" y="195" width="115" height="115" fill="#1976d2" fill-opacity="0.30" stroke="#0d47a1" stroke-width="2.5"/>
    <text x="237.5" y="248" text-anchor="middle" font-size="18" font-weight="700" fill="#0d47a1">0.25</text>
    <text x="237.5" y="268" text-anchor="middle" font-size="10" fill="#0d47a1">0.5 &#215; 0.5</text>

    <!-- TR: orange x blue -->
    <rect x="295" y="195" width="115" height="115" fill="#cfd8dc" fill-opacity="0.55" stroke="#90a4ae" stroke-width="1.2"/>
    <text x="352.5" y="248" text-anchor="middle" font-size="14" font-weight="600" fill="#546e7a">0.25</text>
    <text x="352.5" y="266" text-anchor="middle" font-size="10" fill="#607d8b" font-style="italic">cross-class</text>

    <!-- BL: blue x orange -->
    <rect x="180" y="310" width="115" height="115" fill="#cfd8dc" fill-opacity="0.55" stroke="#90a4ae" stroke-width="1.2"/>
    <text x="237.5" y="363" text-anchor="middle" font-size="14" font-weight="600" fill="#546e7a">0.25</text>
    <text x="237.5" y="381" text-anchor="middle" font-size="10" fill="#607d8b" font-style="italic">cross-class</text>

    <!-- BR: orange x orange -->
    <rect x="295" y="310" width="115" height="115" fill="#ef6c00" fill-opacity="0.30" stroke="#bf360c" stroke-width="2.5"/>
    <text x="352.5" y="363" text-anchor="middle" font-size="18" font-weight="700" fill="#bf360c">0.25</text>
    <text x="352.5" y="383" text-anchor="middle" font-size="10" fill="#bf360c">0.5 &#215; 0.5</text>

    <!-- Diagonal callout -->
    <text x="490" y="220" font-size="11" font-weight="700" fill="#37474f">Same-class pairs</text>
    <text x="490" y="236" font-size="10" fill="#455a64">= diagonal cells</text>
    <text x="490" y="252" font-size="10" fill="#455a64">= 0.5&#178; + 0.5&#178;</text>
    <line x1="488" y1="245" x2="412" y2="247" stroke="#0d47a1" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="488" y1="245" x2="412" y2="372" stroke="#bf360c" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Bottom result -->
    <rect x="80" y="445" width="460" height="60" rx="8" fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>
    <text x="310" y="467" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">Chance same-class rate = 0.5&#178; + 0.5&#178; = 0.50</text>
    <text x="310" y="488" text-anchor="middle" font-size="11" fill="#455a64">Half of all random pairs already match &#8212; before any preference.</text>
  </g>

  <!-- ================= PANEL B: skewed 90/10 ================= -->
  <g>
    <rect x="610" y="75" width="560" height="445" rx="12" fill="#fff9f4" stroke="#ffb74d" stroke-width="1.5"/>
    <text x="890" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#bf360c">Skewed population &#8212; 90% blue, 10% orange</text>

    <!-- Population strip -->
    <text x="640" y="126" font-size="11" font-weight="600" fill="#455a64">Population:</text>
    <g>
      <circle cx="800" cy="121" r="8.5" fill="#1976d2" stroke="#0d47a1" stroke-width="1.2"/>
      <circle cx="821" cy="121" r="8.5" fill="#1976d2" stroke="#0d47a1" stroke-width="1.2"/>
      <circle cx="842" cy="121" r="8.5" fill="#1976d2" stroke="#0d47a1" stroke-width="1.2"/>
      <circle cx="863" cy="121" r="8.5" fill="#1976d2" stroke="#0d47a1" stroke-width="1.2"/>
      <circle cx="884" cy="121" r="8.5" fill="#1976d2" stroke="#0d47a1" stroke-width="1.2"/>
      <circle cx="905" cy="121" r="8.5" fill="#1976d2" stroke="#0d47a1" stroke-width="1.2"/>
      <circle cx="926" cy="121" r="8.5" fill="#1976d2" stroke="#0d47a1" stroke-width="1.2"/>
      <circle cx="947" cy="121" r="8.5" fill="#1976d2" stroke="#0d47a1" stroke-width="1.2"/>
      <circle cx="968" cy="121" r="8.5" fill="#1976d2" stroke="#0d47a1" stroke-width="1.2"/>
      <circle cx="1004" cy="121" r="8.5" fill="#ef6c00" stroke="#bf360c" stroke-width="1.2"/>
    </g>
    <text x="1075" y="125" font-size="11" fill="#546e7a" font-style="italic">p_blue = 0.9, p_orange = 0.1</text>

    <text x="890" y="155" text-anchor="middle" font-size="11" fill="#37474f" font-style="italic">Same square &#8212; but split by the new class shares</text>

    <!-- Axis label top -->
    <text x="875" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#37474f">Endpoint 1&#8217;s class</text>
    <text x="863.5" y="192" text-anchor="middle" font-size="10" font-weight="600" fill="#0d47a1">blue &#183; 0.9</text>
    <text x="978.5" y="192" text-anchor="middle" font-size="9" font-weight="600" fill="#bf360c">0.1</text>

    <!-- Axis label left (rotated) -->
    <g transform="rotate(-90 748 310)">
      <text x="748" y="310" text-anchor="middle" font-size="11" font-weight="700" fill="#37474f">Endpoint 2&#8217;s class</text>
    </g>
    <text x="755" y="302" text-anchor="end" font-size="10" font-weight="600" fill="#0d47a1">blue &#183; 0.9</text>
    <text x="755" y="418" text-anchor="end" font-size="9" font-weight="600" fill="#bf360c">0.1</text>

    <!-- Cells: square 760..990 x 195..425, split at x=967, y=402 (90/10 of 230) -->
    <!-- TL: blue x blue -->
    <rect x="760" y="195" width="207" height="207" fill="#1976d2" fill-opacity="0.30" stroke="#0d47a1" stroke-width="2.5"/>
    <text x="863.5" y="295" text-anchor="middle" font-size="26" font-weight="700" fill="#0d47a1">0.81</text>
    <text x="863.5" y="318" text-anchor="middle" font-size="11" fill="#0d47a1">0.9 &#215; 0.9</text>

    <!-- TR: thin column, cross -->
    <rect x="967" y="195" width="23" height="207" fill="#cfd8dc" fill-opacity="0.55" stroke="#90a4ae" stroke-width="1.2"/>

    <!-- BL: thin row, cross -->
    <rect x="760" y="402" width="207" height="23" fill="#cfd8dc" fill-opacity="0.55" stroke="#90a4ae" stroke-width="1.2"/>

    <!-- BR: tiny square -->
    <rect x="967" y="402" width="23" height="23" fill="#ef6c00" fill-opacity="0.30" stroke="#bf360c" stroke-width="2.5"/>

    <!-- Cross labels -->
    <text x="1020" y="295" font-size="10" font-weight="600" fill="#607d8b">cross 0.09</text>
    <line x1="1018" y1="292" x2="990" y2="292" stroke="#90a4ae" stroke-width="1"/>
    <text x="675" y="395" font-size="10" font-weight="600" fill="#607d8b">cross 0.09</text>
    <line x1="710" y1="392" x2="760" y2="402" stroke="#90a4ae" stroke-width="1"/>

    <!-- Tiny corner annotation -->
    <line x1="990" y1="425" x2="1075" y2="445" stroke="#bf360c" stroke-width="1.2"/>
    <text x="1080" y="448" font-size="10" font-weight="700" fill="#bf360c">orange &#215; orange = 0.01</text>

    <!-- Bottom result -->
    <rect x="660" y="455" width="460" height="60" rx="8" fill="#ffe0b2" stroke="#ffb74d" stroke-width="1"/>
    <text x="890" y="477" text-anchor="middle" font-size="14" font-weight="700" fill="#bf360c">Chance same-class rate = 0.9&#178; + 0.1&#178; = 0.82</text>
    <text x="890" y="498" text-anchor="middle" font-size="11" fill="#455a64">Observing 85% same-class ties barely beats chance &#8212; weak homophily.</text>
  </g>
  </g>
</svg>
