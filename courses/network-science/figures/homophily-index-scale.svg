<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">The homophily index as a fractional position between chance and perfect segregation</title>
  <desc id="desc">A horizontal scale from 0 to 1 marks the same-class tie rate. H_base sits at 0.50 (chance under 50/50 mixing), H_obs sits at 0.89 (observed in the classroom), and r is the fractional distance from H_base to 1, here equal to 0.78.</desc>
  <rect width="1200" height="380" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#263238">How far has the network moved from chance toward perfect segregation?</text>
  <text x="600" y="54" text-anchor="middle" font-size="12" fill="#546e7a">The homophily index r is the fractional position of the observed rate on the &#8220;room above chance&#8221;.</text>

  <!-- ===== Scale ===== -->
  <!-- Bar spans x = 90 .. 1110 (1020 wide), y = 130 (top) to 158 (bottom), 28 tall -->
  <!-- 0 at x=90, H_base=0.50 at x=90+510=600, H_obs=0.89 at x=90+0.89*1020=1000, 1 at x=1110 -->

  <!-- Chance zone: 0 to H_base (gray) -->
  <rect x="90" y="130" width="510" height="28" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
  <!-- Excess: H_base to H_obs (orange) -->
  <rect x="600" y="130" width="400" height="28" fill="#ffb74d" fill-opacity="0.85" stroke="#bf360c" stroke-width="1.2"/>
  <!-- Remaining room: H_obs to 1 (light) -->
  <rect x="1000" y="130" width="110" height="28" fill="#ffe0b2" fill-opacity="0.8" stroke="#bf360c" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Endpoint label 0 -->
  <line x1="90" y1="125" x2="90" y2="170" stroke="#37474f" stroke-width="1.5"/>
  <text x="90" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#37474f">0</text>
  <text x="90" y="206" text-anchor="middle" font-size="10" fill="#607d8b">(impossible &#8212; below chance)</text>

  <!-- H_base tick -->
  <line x1="600" y1="120" x2="600" y2="170" stroke="#0d47a1" stroke-width="2.5"/>
  <circle cx="600" cy="144" r="6" fill="#1976d2" stroke="#0d47a1" stroke-width="1.5"/>
  <text x="600" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1">H_base = 0.50</text>
  <text x="600" y="190" text-anchor="middle" font-size="11" font-weight="600" fill="#0d47a1">chance baseline</text>
  <text x="600" y="206" text-anchor="middle" font-size="10" fill="#37474f">what random pairing alone produces</text>

  <!-- H_obs tick -->
  <line x1="1000" y1="120" x2="1000" y2="170" stroke="#bf360c" stroke-width="2.5"/>
  <circle cx="1000" cy="144" r="6" fill="#ef6c00" stroke="#bf360c" stroke-width="1.5"/>
  <text x="1000" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#bf360c">H_obs = 0.89</text>
  <text x="1000" y="190" text-anchor="middle" font-size="11" font-weight="600" fill="#bf360c">observed in the network</text>
  <text x="1000" y="206" text-anchor="middle" font-size="10" fill="#37474f">17 of 19 ties are within-track</text>

  <!-- Endpoint 1 -->
  <line x1="1110" y1="125" x2="1110" y2="170" stroke="#37474f" stroke-width="1.5"/>
  <text x="1110" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#37474f">1</text>
  <text x="1110" y="206" text-anchor="middle" font-size="10" fill="#607d8b">perfect segregation</text>

  <!-- Bracket: room above chance (H_base to 1) -->
  <path d="M 600 245 L 600 235 L 1110 235 L 1110 245" fill="none" stroke="#37474f" stroke-width="1.2"/>
  <text x="855" y="225" text-anchor="middle" font-size="12" font-weight="600" fill="#37474f">room above chance = 1 &#8722; H_base = 0.50</text>

  <!-- Bracket: observed excess (H_base to H_obs) -->
  <path d="M 600 280 L 600 270 L 1000 270 L 1000 280" fill="none" stroke="#bf360c" stroke-width="1.5"/>
  <text x="800" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#bf360c">excess over chance = H_obs &#8722; H_base = 0.39</text>

  <!-- Result -->
  <rect x="220" y="305" width="760" height="55" rx="10" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="600" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#bf360c">r = excess &#247; room = 0.39 &#247; 0.50 = 0.78</text>
  <text x="600" y="349" text-anchor="middle" font-size="11" fill="#455a64">The network has covered 78% of the way from chance mixing to perfect segregation.</text>
</svg>
