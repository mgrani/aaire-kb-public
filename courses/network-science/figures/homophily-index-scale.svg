<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">One bar with two scales: the observed share H on top and the homophily index r underneath</title>
  <desc id="desc">A single horizontal bar. Its top edge is the H scale (share of within-class ties) from 0 to 1, with the chance baseline H_base and the observed share H_obs marked. Its bottom edge is the r scale (homophily index), which rescales H so that H_base maps to r = 0, H = 1 maps to r = +1, and H = 0 maps to r = -1. The same vertical position is read as H on top and r on the bottom, so H_obs and the observed r sit on one line.</desc>
  <rect width="1200" height="300" fill="#ffffff"/>

  <text x="600" y="34" text-anchor="middle" font-size="13" font-style="italic" fill="#607d8b">one bar, two readings: H along the top, r along the bottom</text>

  <!-- x-positions: H=0/r=-1 -> 130, H_base/r=0 -> 600, H_obs/r=observed -> 967, H=1/r=+1 -> 1070 -->

  <!-- bar zones -->
  <rect x="130" y="104" width="470" height="54" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <rect x="600" y="104" width="367" height="54" fill="#ffb74d" fill-opacity="0.9" stroke="#bf360c" stroke-width="1.2"/>
  <rect x="967" y="104" width="103" height="54" fill="#ffe0b2" fill-opacity="0.7" stroke="#bf360c" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- in-bar zone labels -->
  <text x="365" y="136" text-anchor="middle" font-size="11" font-style="italic" fill="#0284c7">heterophily zone</text>
  <text x="783" y="136" text-anchor="middle" font-size="11" font-style="italic" fill="#7a2e00">excess above chance</text>

  <!-- marker lines spanning both scales -->
  <line x1="130"  y1="90" x2="130"  y2="174" stroke="#37474f" stroke-width="1.5"/>
  <line x1="600"  y1="90" x2="600"  y2="174" stroke="#0d47a1" stroke-width="2.2"/>
  <line x1="967"  y1="90" x2="967"  y2="174" stroke="#bf360c" stroke-width="2.2"/>
  <line x1="1070" y1="90" x2="1070" y2="174" stroke="#37474f" stroke-width="1.5"/>

  <!-- ===== top edge = H scale ===== -->
  <text x="60"   y="98" text-anchor="middle" font-size="22" font-weight="700" fill="#0d47a1">H</text>
  <text x="130"  y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#37474f">H = 0</text>
  <text x="600"  y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1">H_base</text>
  <text x="967"  y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#bf360c">H_obs</text>
  <text x="1070" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#37474f">H = 1</text>

  <!-- ===== bottom edge = r scale ===== -->
  <text x="60"   y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#bf360c">r</text>
  <text x="130"  y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#0284c7">r = &#8722;1</text>
  <text x="600"  y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#37474f">r = 0</text>
  <text x="967"  y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#bf360c">r</text>
  <text x="1070" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#bf360c">r = +1</text>

  <!-- bottom meaning row -->
  <text x="365"  y="210" text-anchor="middle" font-size="11" fill="#0284c7">prefers different</text>
  <text x="600"  y="210" text-anchor="middle" font-size="11" fill="#546e7a">chance / random mixing</text>
  <text x="1070" y="210" text-anchor="end"    font-size="11" fill="#bf360c">perfect segregation</text>

  <!-- ===== formula ===== -->
  <rect x="320" y="232" width="560" height="54" rx="10" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="600" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#bf360c">r = (H_obs &#8722; H_base) / (1 &#8722; H_base)</text>
  <text x="600" y="276" text-anchor="middle" font-size="12" fill="#546e7a">r &lt; 0 when H_obs falls below the chance baseline H_base</text>
</svg>
