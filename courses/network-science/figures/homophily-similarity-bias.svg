<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Homophily as similarity-biased tie formation</title>
  <desc id="desc">Two groups of nodes with many within-group edges and few cross-group edges, illustrating homophily.</desc>
  <rect width="1200" height="360" fill="#ffffff"/>
  <rect x="60" y="70" width="1080" height="240" rx="20" fill="#f7f7f7" stroke="#c8c8c8" stroke-width="2"/>

  <g stroke="#a7a7a7" stroke-width="2">
    <line x1="200" y1="140" x2="260" y2="110"/><line x1="260" y1="110" x2="320" y2="145"/><line x1="200" y1="140" x2="310" y2="210"/><line x1="260" y1="110" x2="310" y2="210"/><line x1="200" y1="140" x2="250" y2="225"/>
    <line x1="840" y1="140" x2="900" y2="110"/><line x1="900" y1="110" x2="960" y2="145"/><line x1="840" y1="140" x2="950" y2="210"/><line x1="900" y1="110" x2="950" y2="210"/><line x1="840" y1="140" x2="890" y2="225"/>
    <line x1="320" y1="145" x2="840" y2="140" stroke="#d0b27b" stroke-dasharray="8 6"/><line x1="250" y1="225" x2="900" y2="110" stroke="#d0b27b" stroke-dasharray="8 6"/>
  </g>

  <g>
    <circle cx="200" cy="140" r="20" fill="#5c84c7" stroke="#2f4e84" stroke-width="2"/>
    <circle cx="260" cy="110" r="20" fill="#5c84c7" stroke="#2f4e84" stroke-width="2"/>
    <circle cx="320" cy="145" r="20" fill="#5c84c7" stroke="#2f4e84" stroke-width="2"/>
    <circle cx="310" cy="210" r="20" fill="#5c84c7" stroke="#2f4e84" stroke-width="2"/>
    <circle cx="250" cy="225" r="20" fill="#5c84c7" stroke="#2f4e84" stroke-width="2"/>

    <circle cx="840" cy="140" r="20" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/>
    <circle cx="900" cy="110" r="20" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/>
    <circle cx="960" cy="145" r="20" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/>
    <circle cx="950" cy="210" r="20" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/>
    <circle cx="890" cy="225" r="20" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/>
  </g>

  <text x="260" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#2f4e84">Group A</text>
  <text x="900" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#9a3e35">Group B</text>
</svg>
