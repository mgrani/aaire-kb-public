<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', Arial, sans-serif">

  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#263238">Zachary's Karate Club — the community-detection benchmark</text>
  <text x="360" y="42" text-anchor="middle" font-size="11" fill="#546e7a">34 members · pre-split friendships · two factions formed around Mr. Hi and the Officer</text>

  <!-- faction halos -->
  <ellipse cx="200" cy="210" rx="170" ry="115" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="6,4"/>
  <ellipse cx="520" cy="210" rx="170" ry="115" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" stroke-dasharray="6,4"/>

  <text x="110" y="110" font-size="12" font-weight="bold" fill="#1565c0" font-style="italic">Faction A (Mr. Hi)</text>
  <text x="530" y="110" font-size="12" font-weight="bold" fill="#e65100" font-style="italic">Faction B (Officer)</text>

  <!-- Faction A edges -->
  <g stroke="#1976d2" stroke-width="1.4">
    <line x1="200" y1="210" x2="140" y2="160"/>
    <line x1="200" y1="210" x2="160" y2="240"/>
    <line x1="200" y1="210" x2="260" y2="160"/>
    <line x1="200" y1="210" x2="250" y2="250"/>
    <line x1="200" y1="210" x2="120" y2="210"/>
    <line x1="200" y1="210" x2="200" y2="280"/>
    <line x1="200" y1="210" x2="170" y2="130"/>
    <line x1="200" y1="210" x2="80" y2="180"/>
    <line x1="140" y1="160" x2="170" y2="130"/>
    <line x1="140" y1="160" x2="80" y2="180"/>
    <line x1="160" y1="240" x2="200" y2="280"/>
    <line x1="160" y1="240" x2="120" y2="210"/>
    <line x1="260" y1="160" x2="250" y2="250"/>
    <line x1="120" y1="210" x2="80" y2="180"/>
    <line x1="260" y1="160" x2="290" y2="200"/>
    <line x1="250" y1="250" x2="290" y2="200"/>
  </g>

  <!-- Faction B edges -->
  <g stroke="#ef6c00" stroke-width="1.4">
    <line x1="520" y1="210" x2="460" y2="160"/>
    <line x1="520" y1="210" x2="480" y2="250"/>
    <line x1="520" y1="210" x2="580" y2="160"/>
    <line x1="520" y1="210" x2="570" y2="250"/>
    <line x1="520" y1="210" x2="620" y2="200"/>
    <line x1="520" y1="210" x2="520" y2="290"/>
    <line x1="520" y1="210" x2="490" y2="130"/>
    <line x1="520" y1="210" x2="640" y2="250"/>
    <line x1="460" y1="160" x2="490" y2="130"/>
    <line x1="460" y1="160" x2="430" y2="200"/>
    <line x1="480" y1="250" x2="520" y2="290"/>
    <line x1="580" y1="160" x2="570" y2="250"/>
    <line x1="580" y1="160" x2="620" y2="200"/>
    <line x1="570" y1="250" x2="640" y2="250"/>
    <line x1="620" y1="200" x2="640" y2="250"/>
    <line x1="430" y1="200" x2="480" y2="250"/>
  </g>

  <!-- Bridge edges (few) -->
  <g stroke="#6a1b9a" stroke-width="2.2">
    <line x1="290" y1="200" x2="430" y2="200"/>
    <line x1="250" y1="250" x2="480" y2="250"/>
  </g>
  <text x="360" y="192" text-anchor="middle" font-size="10" fill="#6a1b9a" font-weight="bold">cross-faction edges</text>

  <!-- Faction A nodes -->
  <g>
    <circle cx="140" cy="160" r="9" fill="#64b5f6" stroke="#0d47a1" stroke-width="1.4"/>
    <circle cx="160" cy="240" r="9" fill="#64b5f6" stroke="#0d47a1" stroke-width="1.4"/>
    <circle cx="260" cy="160" r="9" fill="#64b5f6" stroke="#0d47a1" stroke-width="1.4"/>
    <circle cx="250" cy="250" r="9" fill="#64b5f6" stroke="#0d47a1" stroke-width="1.4"/>
    <circle cx="120" cy="210" r="9" fill="#64b5f6" stroke="#0d47a1" stroke-width="1.4"/>
    <circle cx="200" cy="280" r="9" fill="#64b5f6" stroke="#0d47a1" stroke-width="1.4"/>
    <circle cx="170" cy="130" r="9" fill="#64b5f6" stroke="#0d47a1" stroke-width="1.4"/>
    <circle cx="80"  cy="180" r="9" fill="#64b5f6" stroke="#0d47a1" stroke-width="1.4"/>
    <circle cx="290" cy="200" r="9" fill="#ab47bc" stroke="#4a148c" stroke-width="1.6"/>
    <!-- Mr. Hi -->
    <circle cx="200" cy="210" r="15" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
    <text x="200" y="214" text-anchor="middle" font-size="9" font-weight="bold" fill="white">Mr. Hi</text>
  </g>

  <!-- Faction B nodes -->
  <g>
    <circle cx="460" cy="160" r="9" fill="#ffb74d" stroke="#bf360c" stroke-width="1.4"/>
    <circle cx="480" cy="250" r="9" fill="#ffb74d" stroke="#bf360c" stroke-width="1.4"/>
    <circle cx="580" cy="160" r="9" fill="#ffb74d" stroke="#bf360c" stroke-width="1.4"/>
    <circle cx="570" cy="250" r="9" fill="#ffb74d" stroke="#bf360c" stroke-width="1.4"/>
    <circle cx="620" cy="200" r="9" fill="#ffb74d" stroke="#bf360c" stroke-width="1.4"/>
    <circle cx="520" cy="290" r="9" fill="#ffb74d" stroke="#bf360c" stroke-width="1.4"/>
    <circle cx="490" cy="130" r="9" fill="#ffb74d" stroke="#bf360c" stroke-width="1.4"/>
    <circle cx="640" cy="250" r="9" fill="#ffb74d" stroke="#bf360c" stroke-width="1.4"/>
    <circle cx="430" cy="200" r="9" fill="#ab47bc" stroke="#4a148c" stroke-width="1.6"/>
    <!-- Officer -->
    <circle cx="520" cy="210" r="15" fill="#e65100" stroke="#bf360c" stroke-width="2"/>
    <text x="520" y="214" text-anchor="middle" font-size="8" font-weight="bold" fill="white">Officer</text>
  </g>

  <!-- Legend / footer -->
  <rect x="20" y="330" width="680" height="42" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/>
  <circle cx="38"  cy="348" r="6" fill="#1565c0"/>
  <text x="50"  y="352" font-size="10" fill="#37474f">hub (instructor / admin)</text>
  <circle cx="200" cy="348" r="6" fill="#64b5f6"/>
  <text x="212" y="352" font-size="10" fill="#37474f">regular members</text>
  <circle cx="340" cy="348" r="6" fill="#ab47bc"/>
  <text x="352" y="352" font-size="10" fill="#37474f">ambiguous (on faction boundary)</text>
  <line x1="520" y1="348" x2="548" y2="348" stroke="#6a1b9a" stroke-width="2.2"/>
  <text x="556" y="352" font-size="10" fill="#37474f">cross-faction tie</text>

  <text x="360" y="366" text-anchor="middle" font-size="9" fill="#546e7a" font-style="italic">Schematic — the real Zachary graph has 34 nodes and 78 edges; the split is the documented outcome.</text>
</svg>
