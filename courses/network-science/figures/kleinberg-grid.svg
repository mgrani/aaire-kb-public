<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI', Arial, sans-serif">

  <text x="360" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Kleinberg's grid model — the geometry of navigability</text>
  <text x="360" y="40" text-anchor="middle" font-size="11" fill="#546e7a">Each node has local grid neighbors + one long-range link drawn with P(link to u) ∝ d(v,u)⁻ʳ</text>

  <!-- LEFT: r = 0 (uniform random) -->
  <g transform="translate(10,56)">
    <rect x="0" y="0" width="220" height="264" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="1.3"/>
    <text x="110" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#b71c1c">r = 0 (uniform random)</text>

    <!-- 6x6 grid dots -->
    <g fill="#90a4ae">
      <circle cx="40"  cy="60"  r="4"/><circle cx="70"  cy="60"  r="4"/><circle cx="100" cy="60"  r="4"/><circle cx="130" cy="60"  r="4"/><circle cx="160" cy="60"  r="4"/><circle cx="190" cy="60"  r="4"/>
      <circle cx="40"  cy="90"  r="4"/><circle cx="70"  cy="90"  r="4"/><circle cx="100" cy="90"  r="4"/><circle cx="130" cy="90"  r="4"/><circle cx="160" cy="90"  r="4"/><circle cx="190" cy="90"  r="4"/>
      <circle cx="40"  cy="120" r="4"/><circle cx="70"  cy="120" r="4"/><circle cx="100" cy="120" r="4"/><circle cx="130" cy="120" r="4"/><circle cx="160" cy="120" r="4"/><circle cx="190" cy="120" r="4"/>
      <circle cx="40"  cy="150" r="4"/><circle cx="70"  cy="150" r="4"/><circle cx="100" cy="150" r="4"/><circle cx="130" cy="150" r="4"/><circle cx="160" cy="150" r="4"/><circle cx="190" cy="150" r="4"/>
      <circle cx="40"  cy="180" r="4"/><circle cx="70"  cy="180" r="4"/><circle cx="100" cy="180" r="4"/><circle cx="130" cy="180" r="4"/><circle cx="160" cy="180" r="4"/><circle cx="190" cy="180" r="4"/>
      <circle cx="40"  cy="210" r="4"/><circle cx="70"  cy="210" r="4"/><circle cx="100" cy="210" r="4"/><circle cx="130" cy="210" r="4"/><circle cx="160" cy="210" r="4"/><circle cx="190" cy="210" r="4"/>
    </g>
    <!-- long-range link: uniform random — very long -->
    <circle cx="40" cy="90" r="6" fill="#c62828"/>
    <line x1="40" y1="90" x2="190" y2="210" stroke="#c62828" stroke-width="2"/>
    <circle cx="190" cy="210" r="6" fill="#c62828"/>

    <text x="110" y="240" text-anchor="middle" font-size="9" fill="#b71c1c">short paths exist,</text>
    <text x="110" y="252" text-anchor="middle" font-size="9" fill="#b71c1c">but search is Ω(n²/³)</text>
  </g>

  <!-- MIDDLE: r = 2 (inverse square, d=2) — navigable -->
  <g transform="translate(248,56)">
    <rect x="0" y="0" width="220" height="264" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
    <text x="110" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">r = 2 = d (inverse-square)</text>

    <g fill="#90a4ae">
      <circle cx="40"  cy="60"  r="4"/><circle cx="70"  cy="60"  r="4"/><circle cx="100" cy="60"  r="4"/><circle cx="130" cy="60"  r="4"/><circle cx="160" cy="60"  r="4"/><circle cx="190" cy="60"  r="4"/>
      <circle cx="40"  cy="90"  r="4"/><circle cx="70"  cy="90"  r="4"/><circle cx="100" cy="90"  r="4"/><circle cx="130" cy="90"  r="4"/><circle cx="160" cy="90"  r="4"/><circle cx="190" cy="90"  r="4"/>
      <circle cx="40"  cy="120" r="4"/><circle cx="70"  cy="120" r="4"/><circle cx="100" cy="120" r="4"/><circle cx="130" cy="120" r="4"/><circle cx="160" cy="120" r="4"/><circle cx="190" cy="120" r="4"/>
      <circle cx="40"  cy="150" r="4"/><circle cx="70"  cy="150" r="4"/><circle cx="100" cy="150" r="4"/><circle cx="130" cy="150" r="4"/><circle cx="160" cy="150" r="4"/><circle cx="190" cy="150" r="4"/>
      <circle cx="40"  cy="180" r="4"/><circle cx="70"  cy="180" r="4"/><circle cx="100" cy="180" r="4"/><circle cx="130" cy="180" r="4"/><circle cx="160" cy="180" r="4"/><circle cx="190" cy="180" r="4"/>
      <circle cx="40"  cy="210" r="4"/><circle cx="70"  cy="210" r="4"/><circle cx="100" cy="210" r="4"/><circle cx="130" cy="210" r="4"/><circle cx="160" cy="210" r="4"/><circle cx="190" cy="210" r="4"/>
    </g>
    <!-- long-range link: moderate distance -->
    <circle cx="70" cy="120" r="6" fill="#2e7d32"/>
    <line x1="70" y1="120" x2="160" y2="150" stroke="#2e7d32" stroke-width="2.5"/>
    <circle cx="160" cy="150" r="6" fill="#2e7d32"/>

    <text x="110" y="240" text-anchor="middle" font-size="9" font-weight="bold" fill="#1b5e20">short paths exist</text>
    <text x="110" y="252" text-anchor="middle" font-size="9" font-weight="bold" fill="#1b5e20">AND search is O(log² n)</text>
  </g>

  <!-- RIGHT: r >> d (too local) -->
  <g transform="translate(486,56)">
    <rect x="0" y="0" width="220" height="264" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
    <text x="110" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#bf360c">r ≫ d (too clustered)</text>

    <g fill="#90a4ae">
      <circle cx="40"  cy="60"  r="4"/><circle cx="70"  cy="60"  r="4"/><circle cx="100" cy="60"  r="4"/><circle cx="130" cy="60"  r="4"/><circle cx="160" cy="60"  r="4"/><circle cx="190" cy="60"  r="4"/>
      <circle cx="40"  cy="90"  r="4"/><circle cx="70"  cy="90"  r="4"/><circle cx="100" cy="90"  r="4"/><circle cx="130" cy="90"  r="4"/><circle cx="160" cy="90"  r="4"/><circle cx="190" cy="90"  r="4"/>
      <circle cx="40"  cy="120" r="4"/><circle cx="70"  cy="120" r="4"/><circle cx="100" cy="120" r="4"/><circle cx="130" cy="120" r="4"/><circle cx="160" cy="120" r="4"/><circle cx="190" cy="120" r="4"/>
      <circle cx="40"  cy="150" r="4"/><circle cx="70"  cy="150" r="4"/><circle cx="100" cy="150" r="4"/><circle cx="130" cy="150" r="4"/><circle cx="160" cy="150" r="4"/><circle cx="190" cy="150" r="4"/>
      <circle cx="40"  cy="180" r="4"/><circle cx="70"  cy="180" r="4"/><circle cx="100" cy="180" r="4"/><circle cx="130" cy="180" r="4"/><circle cx="160" cy="180" r="4"/><circle cx="190" cy="180" r="4"/>
      <circle cx="40"  cy="210" r="4"/><circle cx="70"  cy="210" r="4"/><circle cx="100" cy="210" r="4"/><circle cx="130" cy="210" r="4"/><circle cx="160" cy="210" r="4"/><circle cx="190" cy="210" r="4"/>
    </g>
    <!-- long-range link: very short — basically a neighbor -->
    <circle cx="100" cy="120" r="6" fill="#ef6c00"/>
    <line x1="100" y1="120" x2="130" y2="150" stroke="#ef6c00" stroke-width="2"/>
    <circle cx="130" cy="150" r="6" fill="#ef6c00"/>

    <text x="110" y="240" text-anchor="middle" font-size="9" fill="#bf360c">short paths exist,</text>
    <text x="110" y="252" text-anchor="middle" font-size="9" fill="#bf360c">but "shortcuts" are too local</text>
  </g>
</svg>
