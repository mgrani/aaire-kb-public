<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Lecture 03 argument map</title>
  <desc id="desc">A flow diagram connecting network formation, triadic closure, strong triadic closure, structural proxies, local bridges, weak-tie theorem, and empirical studies.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .theory { fill: #e0f2fe; stroke: #0284c7; }
      .proxy { fill: #ecfdf5; stroke: #16a34a; }
      .flow { fill: #fef3c7; stroke: #d97706; }
      .warn { fill: #fff7ed; stroke: #f97316; }
      .emp { fill: #f5f3ff; stroke: #7c3aed; }
      .title { font: 700 24px Inter, Arial, sans-serif; fill: #0f172a; }
      .head { font: 700 17px Inter, Arial, sans-serif; fill: #0f172a; }
      .text { font: 14px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 12px Inter, Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #94a3b8; stroke-width: 2.5; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="1118" height="618" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="560" y="38" text-anchor="middle" class="title">L03 in one picture: from tie formation to measurable weak ties</text>

  <g transform="translate(40 78)">
    <rect width="230" height="104" class="box theory"/>
    <text x="18" y="30" class="head">Network formation</text>
    <text x="18" y="57" class="text">How do ties form?</text>
    <text x="18" y="80" class="small">friends-of-friends often connect</text>
  </g>

  <g transform="translate(330 78)">
    <rect width="230" height="104" class="box theory"/>
    <text x="18" y="30" class="head">Triadic closure</text>
    <text x="18" y="57" class="text">open triads tend to close</text>
    <text x="18" y="80" class="small">but some possible ties never form</text>
  </g>

  <g transform="translate(620 78)">
    <rect width="230" height="104" class="box theory"/>
    <text x="18" y="30" class="head">Strong triadic closure</text>
    <text x="18" y="57" class="text">two strong ties imply closure</text>
    <text x="18" y="80" class="small">requires edge labels: strong/weak</text>
  </g>

  <g transform="translate(890 78)">
    <rect width="190" height="104" class="box warn"/>
    <text x="18" y="30" class="head">Exact labeling</text>
    <text x="18" y="57" class="text">MaxSTC is hard</text>
    <text x="18" y="80" class="small">we need computable proxies</text>
  </g>

  <path d="M270 130 H330" class="arrow"/>
  <path d="M560 130 H620" class="arrow"/>
  <path d="M850 130 H890" class="arrow"/>

  <g transform="translate(145 265)">
    <rect width="260" height="124" class="box proxy"/>
    <text x="18" y="30" class="head">Clustering coefficient</text>
    <text x="18" y="57" class="text">node-level embeddedness</text>
    <text x="18" y="80" class="small">closed neighbor-neighbor ties</text>
    <text x="18" y="103" class="small">out of all possible neighbor pairs</text>
  </g>

  <g transform="translate(455 265)">
    <rect width="260" height="124" class="box proxy"/>
    <text x="18" y="30" class="head">Neighborhood overlap</text>
    <text x="18" y="57" class="text">edge-level embeddedness</text>
    <text x="18" y="80" class="small">shared neighbors indicate strength</text>
    <text x="18" y="103" class="small">zero overlap suggests a local bridge</text>
  </g>

  <path d="M736 182 C640 230 480 230 325 265" class="dash"/>
  <path d="M762 182 C720 228 650 238 610 265" class="dash"/>

  <g transform="translate(50 455)">
    <rect width="250" height="104" class="box flow"/>
    <text x="18" y="30" class="head">Information flow</text>
    <text x="18" y="57" class="text">modeled as bridges</text>
    <text x="18" y="80" class="small">local bridges carry non-redundant info</text>
  </g>

  <g transform="translate(360 455)">
    <rect width="250" height="104" class="box flow"/>
    <text x="18" y="30" class="head">Weak-tie theorem</text>
    <text x="18" y="57" class="text">local bridges must be weak</text>
    <text x="18" y="80" class="small">if STC holds around the endpoint</text>
  </g>

  <g transform="translate(675 455)">
    <rect width="360" height="104" class="box emp"/>
    <text x="18" y="30" class="head">Empirical studies</text>
    <text x="18" y="57" class="text">test whether low-overlap ties are weak</text>
    <text x="18" y="80" class="small">phone calls, Facebook, Twitter: strength vs. overlap</text>
  </g>

  <path d="M455 345 C315 380 215 405 175 455" class="arrow"/>
  <path d="M585 389 C560 425 535 435 500 455" class="arrow"/>
  <path d="M610 507 H675" class="arrow"/>
</svg>
