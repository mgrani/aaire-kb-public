<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260"
     font-family="'Source Sans Pro', Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="qc-cc-title qc-cc-desc">
  <title id="qc-cc-title">Quick Check: clustering coefficient graph</title>
  <desc id="qc-cc-desc">Node B at centre with four neighbours A, C, D, E. Edges among neighbours: A–C and C–D exist; A–D, A–E, C–E, D–E are missing.</desc>

  <!-- Positions:
       B = centre        (170, 130)
       A = top-left      ( 70,  50)
       C = top-right     (270,  50)
       D = bottom-right  (270, 210)
       E = bottom-left   ( 70, 210)
  -->

  <!-- Spoke edges B–neighbour -->
  <line x1="170" y1="130" x2="70"  y2="50"  stroke="#555" stroke-width="2"/>
  <line x1="170" y1="130" x2="270" y2="50"  stroke="#555" stroke-width="2"/>
  <line x1="170" y1="130" x2="270" y2="210" stroke="#555" stroke-width="2"/>
  <line x1="170" y1="130" x2="70"  y2="210" stroke="#555" stroke-width="2"/>

  <!-- Edges among neighbours that EXIST -->
  <line x1="70"  y1="50"  x2="270" y2="50"  stroke="#34a853" stroke-width="2.5"/>
  <line x1="270" y1="50"  x2="270" y2="210" stroke="#34a853" stroke-width="2.5"/>

  <!-- Edges among neighbours that MISSING -->
  <line x1="70"  y1="50"  x2="270" y2="210" stroke="#ccc" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="70"  y1="50"  x2="70"  y2="210" stroke="#ccc" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="270" y1="50"  x2="70"  y2="210" stroke="#ccc" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="270" y1="210" x2="70"  y2="210" stroke="#ccc" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Nodes -->
  <circle cx="170" cy="130" r="22" fill="#fef7e0" stroke="#f9ab00" stroke-width="2.5"/>
  <text x="170" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="#b06000">B</text>

  <circle cx="70"  cy="50"  r="20" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="2"/>
  <text x="70"  y="55"  text-anchor="middle" font-size="15" font-weight="700" fill="#1a5fa8">A</text>

  <circle cx="270" cy="50"  r="20" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="2"/>
  <text x="270" y="55"  text-anchor="middle" font-size="15" font-weight="700" fill="#1a5fa8">C</text>

  <circle cx="270" cy="210" r="20" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="2"/>
  <text x="270" y="215" text-anchor="middle" font-size="15" font-weight="700" fill="#1a5fa8">D</text>

  <circle cx="70"  cy="210" r="20" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="2"/>
  <text x="70"  y="215" text-anchor="middle" font-size="15" font-weight="700" fill="#1a5fa8">E</text>

  <!-- Legend -->
  <line x1="20"  y1="248" x2="50"  y2="248" stroke="#34a853" stroke-width="2.5"/>
  <text x="56"  y="252" font-size="11" fill="#444">edge among neighbours</text>
  <line x1="190" y1="248" x2="220" y2="248" stroke="#ccc" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="226" y="252" font-size="11" fill="#888">missing edge</text>
</svg>
