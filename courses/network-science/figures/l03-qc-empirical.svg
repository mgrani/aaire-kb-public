<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230"
     font-family="'Source Sans Pro', Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="qc-emp-title qc-emp-desc">
  <title id="qc-emp-title">Quick Check: empirical validation — two ego networks</title>
  <desc id="qc-emp-desc">Left: User X with sparse follows to many unconnected accounts (low overlap). Right: User Y inside a dense mutual-follow cluster (high overlap).</desc>

  <!-- ── LEFT: User X — sparse, low overlap ── -->
  <text x="120" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#222">User X (2000 follows)</text>

  <!-- X at centre -->
  <circle cx="120" cy="110" r="20" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="120" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#ea4335">X</text>

  <!-- Sparse spokes — 7 accounts, none connected to each other -->
  <!-- angles roughly spread around: top, top-right, right, bot-right, bot, bot-left, left -->
  <line x1="120" y1="90"  x2="120" y2="30"  stroke="#aaa" stroke-width="1.2"/>
  <line x1="120" y1="95"  x2="180" y2="50"  stroke="#aaa" stroke-width="1.2"/>
  <line x1="138" y1="110" x2="210" y2="90"  stroke="#aaa" stroke-width="1.2"/>
  <line x1="135" y1="125" x2="195" y2="160" stroke="#aaa" stroke-width="1.2"/>
  <line x1="120" y1="130" x2="120" y2="190" stroke="#aaa" stroke-width="1.2"/>
  <line x1="105" y1="125" x2=" 45" y2="160" stroke="#aaa" stroke-width="1.2"/>
  <line x1="102" y1="110" x2=" 30" y2="90"  stroke="#aaa" stroke-width="1.2"/>

  <!-- Account nodes (small, grey) -->
  <circle cx="120" cy="25"  r="10" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
  <circle cx="183" cy="45"  r="10" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
  <circle cx="213" cy="87"  r="10" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
  <circle cx="198" cy="162" r="10" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
  <circle cx="120" cy="193" r="10" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
  <circle cx=" 42" cy="162" r="10" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
  <circle cx=" 27" cy=" 87" r="10" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>

  <text x="120" y="218" text-anchor="middle" font-size="11" fill="#ea4335">low overlap · many weak ties</text>

  <!-- Divider -->
  <line x1="250" y1="15" x2="250" y2="215" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ── RIGHT: User Y — dense cluster, high overlap ── -->
  <text x="380" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#222">User Y (80 follows)</text>

  <!-- Cluster of 6 nodes, mostly all connected -->
  <!-- Positions: roughly hexagon around centre 380,115 -->
  <!-- Y=centre, plus 5 contacts -->
  <defs>
    <!-- reuse nothing, just inline -->
  </defs>

  <!-- All-pairs edges among the 6 cluster members (15 edges) -->
  <!-- Y(380,115), P1(380,45), P2(440,80), P3(440,150), P4(380,185), P5(320,150), P6(320,80) -->
  <!-- Draw all edges first -->
  <!-- Y–Pi -->
  <line x1="380" y1="115" x2="380" y2="47"  stroke="#1a5fa8" stroke-width="1.5" opacity="0.6"/>
  <line x1="380" y1="115" x2="438" y2="82"  stroke="#1a5fa8" stroke-width="1.5" opacity="0.6"/>
  <line x1="380" y1="115" x2="438" y2="148" stroke="#1a5fa8" stroke-width="1.5" opacity="0.6"/>
  <line x1="380" y1="115" x2="380" y2="183" stroke="#1a5fa8" stroke-width="1.5" opacity="0.6"/>
  <line x1="380" y1="115" x2="322" y2="148" stroke="#1a5fa8" stroke-width="1.5" opacity="0.6"/>
  <line x1="380" y1="115" x2="322" y2="82"  stroke="#1a5fa8" stroke-width="1.5" opacity="0.6"/>
  <!-- Pi–Pj (ring + cross) -->
  <line x1="380" y1="47"  x2="438" y2="82"  stroke="#1a5fa8" stroke-width="1.5" opacity="0.5"/>
  <line x1="438" y1="82"  x2="438" y2="148" stroke="#1a5fa8" stroke-width="1.5" opacity="0.5"/>
  <line x1="438" y1="148" x2="380" y2="183" stroke="#1a5fa8" stroke-width="1.5" opacity="0.5"/>
  <line x1="380" y1="183" x2="322" y2="148" stroke="#1a5fa8" stroke-width="1.5" opacity="0.5"/>
  <line x1="322" y1="148" x2="322" y2="82"  stroke="#1a5fa8" stroke-width="1.5" opacity="0.5"/>
  <line x1="322" y1="82"  x2="380" y2="47"  stroke="#1a5fa8" stroke-width="1.5" opacity="0.5"/>
  <!-- diagonals -->
  <line x1="380" y1="47"  x2="438" y2="148" stroke="#1a5fa8" stroke-width="1"   opacity="0.35"/>
  <line x1="380" y1="47"  x2="380" y2="183" stroke="#1a5fa8" stroke-width="1"   opacity="0.35"/>
  <line x1="438" y1="82"  x2="322" y2="148" stroke="#1a5fa8" stroke-width="1"   opacity="0.35"/>
  <line x1="438" y1="82"  x2="322" y2="82"  stroke="#1a5fa8" stroke-width="1"   opacity="0.35"/>

  <!-- Nodes -->
  <circle cx="380" cy="115" r="20" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="380" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#ea4335">Y</text>

  <circle cx="380" cy="47"  r="12" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="1.5"/>
  <circle cx="438" cy="82"  r="12" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="1.5"/>
  <circle cx="438" cy="148" r="12" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="1.5"/>
  <circle cx="380" cy="183" r="12" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="1.5"/>
  <circle cx="322" cy="148" r="12" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="1.5"/>
  <circle cx="322" cy="82"  r="12" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="1.5"/>

  <text x="380" y="218" text-anchor="middle" font-size="11" fill="#1a5fa8">high overlap · clique-like</text>
</svg>
