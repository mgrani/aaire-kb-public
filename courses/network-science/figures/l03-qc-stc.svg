<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220"
     font-family="'Source Sans Pro', Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="qc-stc-title qc-stc-desc">
  <title id="qc-stc-title">Quick Check: STC labeling graph</title>
  <desc id="qc-stc-desc">Four nodes A, B, C, D. Edges: A–B, A–C, A–D, B–C. No other edges.</desc>

  <!-- Nodes positions:
       A = center-left  (100, 110)
       B = top-right    (230,  50)
       C = bottom-right (230, 170)
       D = far-right    (310, 110)
  -->

  <!-- Edges -->
  <line x1="100" y1="110" x2="230" y2="50"  stroke="#555" stroke-width="2"/>
  <line x1="100" y1="110" x2="230" y2="170" stroke="#555" stroke-width="2"/>
  <line x1="100" y1="110" x2="310" y2="110" stroke="#555" stroke-width="2"/>
  <line x1="230" y1="50"  x2="230" y2="170" stroke="#555" stroke-width="2"/>

  <!-- Nodes -->
  <circle cx="100" cy="110" r="22" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="2"/>
  <text x="100" y="115" text-anchor="middle" font-size="16" font-weight="700" fill="#1a5fa8">A</text>

  <circle cx="230" cy="50"  r="22" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="2"/>
  <text x="230" y="55"  text-anchor="middle" font-size="16" font-weight="700" fill="#1a5fa8">B</text>

  <circle cx="230" cy="170" r="22" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="2"/>
  <text x="230" y="175" text-anchor="middle" font-size="16" font-weight="700" fill="#1a5fa8">C</text>

  <circle cx="310" cy="110" r="22" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="2"/>
  <text x="310" y="115" text-anchor="middle" font-size="16" font-weight="700" fill="#1a5fa8">D</text>

  <!-- Missing edges annotation -->
  <line x1="230" y1="50" x2="310" y2="110" stroke="#ccc" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="230" y1="170" x2="310" y2="110" stroke="#ccc" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Legend -->
  <line x1="20" y1="200" x2="50" y2="200" stroke="#555" stroke-width="2"/>
  <text x="56" y="204" font-size="11" fill="#444">edge exists</text>
  <line x1="150" y1="200" x2="180" y2="200" stroke="#ccc" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="186" y="204" font-size="11" fill="#888">edge missing</text>
</svg>
