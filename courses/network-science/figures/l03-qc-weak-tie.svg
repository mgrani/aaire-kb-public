<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200"
     font-family="'Source Sans Pro', Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="qc-wt-title qc-wt-desc">
  <title id="qc-wt-title">Quick Check: weak-tie theorem graph</title>
  <desc id="qc-wt-desc">Three nodes A, B, C. A–B and A–C are both labeled Strong (solid thick). No edge between B and C.</desc>

  <!-- Positions:
       A = centre       (150, 110)
       B = top-left     ( 60,  40)
       C = top-right    (240,  40)
  -->

  <!-- Strong edges (solid thick blue) -->
  <line x1="150" y1="110" x2="60"  y2="40" stroke="#1a5fa8" stroke-width="3"/>
  <line x1="150" y1="110" x2="240" y2="40" stroke="#1a5fa8" stroke-width="3"/>

  <!-- Missing B–C edge -->
  <line x1="60" y1="40" x2="240" y2="40" stroke="#ccc" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Strong labels -->
  <text x="90"  y="68" text-anchor="middle" font-size="11" fill="#1a5fa8" font-style="italic">Strong</text>
  <text x="210" y="68" text-anchor="middle" font-size="11" fill="#1a5fa8" font-style="italic">Strong</text>
  <text x="150" y="32" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">missing</text>

  <!-- Nodes -->
  <circle cx="150" cy="110" r="22" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="2"/>
  <text x="150" y="115" text-anchor="middle" font-size="16" font-weight="700" fill="#1a5fa8">A</text>

  <circle cx="60"  cy="40"  r="20" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="2"/>
  <text x="60"  y="45"  text-anchor="middle" font-size="15" font-weight="700" fill="#1a5fa8">B</text>

  <circle cx="240" cy="40"  r="20" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="2"/>
  <text x="240" y="45"  text-anchor="middle" font-size="15" font-weight="700" fill="#1a5fa8">C</text>

  <!-- STC violation label -->
  <text x="150" y="165" text-anchor="middle" font-size="12" fill="#ea4335" font-weight="600">STC violated: B–C missing</text>

  <!-- Legend -->
  <line x1="30"  y1="188" x2="60"  y2="188" stroke="#1a5fa8" stroke-width="3"/>
  <text x="66"  y="192" font-size="11" fill="#444">Strong tie</text>
  <line x1="160" y1="188" x2="190" y2="188" stroke="#ccc" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="196" y="192" font-size="11" fill="#888">missing</text>
</svg>
