<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220"
     font-family="'Source Sans Pro', Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="qc-wt-title qc-wt-desc">
  <title id="qc-wt-title">Quick Check: weak-tie theorem graph</title>
  <desc id="qc-wt-desc">Four nodes C, A, B, D. Edge A-B is a local bridge. A-C and B-D are strong ties. Missing cross edges C-B and A-D are shown dashed.</desc>

  <!-- Positions:
       C = left-top      ( 60,  60)
       A = left-centre   (130, 120)
       B = right-centre  (210, 120)
       D = right-top     (280,  60)
  -->

  <!-- Existing strong ties -->
  <line x1="130" y1="120" x2="60"  y2="60" stroke="#1a5fa8" stroke-width="3"/>
  <line x1="210" y1="120" x2="280" y2="60" stroke="#1a5fa8" stroke-width="3"/>

  <!-- Local bridge under test -->
  <line x1="130" y1="120" x2="210" y2="120" stroke="#1a5fa8" stroke-width="3.4"/>

  <!-- Missing edges that STC would force if A-B were strong -->
  <line x1="60" y1="60" x2="210" y2="120" stroke="#ccc" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="130" y1="120" x2="280" y2="60" stroke="#ccc" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Labels -->
  <text x="88"  y="82" text-anchor="middle" font-size="11" fill="#1a5fa8" font-style="italic">Strong</text>
  <text x="252" y="82" text-anchor="middle" font-size="11" fill="#1a5fa8" font-style="italic">Strong</text>
  <text x="170" y="111" text-anchor="middle" font-size="11" fill="#1a5fa8" font-style="italic">local bridge</text>
  <text x="170" y="42" text-anchor="middle" font-size="11" fill="#888" font-style="italic">no shared neighbors</text>
  <text x="148" y="77" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">missing</text>
  <text x="212" y="77" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">missing</text>

  <!-- Nodes -->
  <circle cx="130" cy="120" r="22" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="2"/>
  <text x="130" y="125" text-anchor="middle" font-size="16" font-weight="700" fill="#1a5fa8">A</text>

  <circle cx="210" cy="120" r="22" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="2"/>
  <text x="210" y="125" text-anchor="middle" font-size="16" font-weight="700" fill="#1a5fa8">B</text>

  <circle cx="60"  cy="60"  r="20" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="2"/>
  <text x="60"  y="65"  text-anchor="middle" font-size="15" font-weight="700" fill="#1a5fa8">C</text>

  <circle cx="280" cy="60"  r="20" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="2"/>
  <text x="280" y="65"  text-anchor="middle" font-size="15" font-weight="700" fill="#1a5fa8">D</text>

  <!-- Legend -->
  <line x1="38"  y1="198" x2="68"  y2="198" stroke="#1a5fa8" stroke-width="3"/>
  <text x="74"  y="202" font-size="11" fill="#444">Strong tie</text>
  <line x1="172" y1="198" x2="202" y2="198" stroke="#ccc" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="208" y="202" font-size="11" fill="#888">missing edge</text>
</svg>
