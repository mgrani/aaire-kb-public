<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', Arial, sans-serif">

  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#263238">A small workplace: five questions in one picture</text>
  <text x="360" y="44" text-anchor="middle" font-size="11" fill="#546e7a">nodes = employees · thick edges = close contacts · thin edges = acquaintances</text>

  <!-- Weak bridge between clusters -->
  <line x1="260" y1="140" x2="500" y2="100" stroke="#b71c1c" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="380" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#b71c1c">weak, rare contact</text>
  <text x="380" y="115" text-anchor="middle" font-size="10" fill="#b71c1c">(Dia ↔ Fin)</text>

  <!-- Left cluster (team A) -->
  <g>
    <!-- strong edges -->
    <line x1="130" y1="140" x2="200" y2="100" stroke="#1a237e" stroke-width="4"/>
    <line x1="130" y1="140" x2="200" y2="200" stroke="#1a237e" stroke-width="4"/>
    <line x1="200" y1="100" x2="200" y2="200" stroke="#1a237e" stroke-width="4"/>
    <line x1="200" y1="100" x2="260" y2="140" stroke="#1a237e" stroke-width="4"/>
    <line x1="200" y1="200" x2="260" y2="140" stroke="#1a237e" stroke-width="4"/>
    <line x1="130" y1="140" x2="100" y2="220" stroke="#3949ab" stroke-width="3"/>
    <line x1="200" y1="200" x2="100" y2="220" stroke="#3949ab" stroke-width="3"/>

    <circle cx="130" cy="140" r="16" fill="#3949ab" stroke="#1a237e" stroke-width="2"/>
    <text x="130" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Ana</text>
    <circle cx="200" cy="100" r="16" fill="#3949ab" stroke="#1a237e" stroke-width="2"/>
    <text x="200" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Ben</text>
    <circle cx="200" cy="200" r="16" fill="#3949ab" stroke="#1a237e" stroke-width="2"/>
    <text x="200" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Cai</text>
    <circle cx="260" cy="140" r="16" fill="#3949ab" stroke="#1a237e" stroke-width="2"/>
    <text x="260" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Dia</text>
    <circle cx="100" cy="220" r="16" fill="#3949ab" stroke="#1a237e" stroke-width="2"/>
    <text x="100" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Eli</text>

    <text x="175" y="270" text-anchor="middle" font-size="11" fill="#1a237e" font-style="italic">Team A — dense core</text>
  </g>

  <!-- Right cluster (team B) -->
  <g>
    <line x1="500" y1="100" x2="560" y2="140" stroke="#1b5e20" stroke-width="4"/>
    <line x1="500" y1="200" x2="560" y2="140" stroke="#1b5e20" stroke-width="4"/>
    <line x1="500" y1="100" x2="500" y2="200" stroke="#1b5e20" stroke-width="4"/>
    <line x1="560" y1="140" x2="620" y2="200" stroke="#2e7d32" stroke-width="3"/>
    <line x1="500" y1="200" x2="620" y2="200" stroke="#2e7d32" stroke-width="3"/>

    <circle cx="500" cy="100" r="16" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
    <text x="500" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Fin</text>
    <circle cx="500" cy="200" r="16" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
    <text x="500" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Gia</text>
    <circle cx="560" cy="140" r="16" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
    <text x="560" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Hal</text>
    <circle cx="620" cy="200" r="16" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
    <text x="620" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Ivo</text>

    <text x="555" y="270" text-anchor="middle" font-size="11" fill="#1b5e20" font-style="italic">Team B — dense core</text>
  </g>

  <!-- Questions callouts at bottom -->
  <rect x="20" y="298" width="680" height="52" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/>
  <text x="360" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="#37474f">Questions we'd like to answer from this picture</text>
  <text x="30"  y="336" font-size="10" fill="#455a64">① Will Eli and Ben become friends? &#160; ② How do we separate close from distant ties?</text>
  <text x="30"  y="348" font-size="10" fill="#455a64">③ Which single edge controls all information flow between teams? &#160; ④ Where would a rumor spread fastest? &#160; ⑤ Which tie would we cut to isolate a leak?</text>
</svg>
