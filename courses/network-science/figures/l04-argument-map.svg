<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">Lecture 04 argument map</title>
  <desc id="desc">A flow diagram connecting node importance, community definition, modularity maximization, heuristics, and empirical validation.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .role { fill: #e0f2fe; stroke: #0284c7; }
      .obj { fill: #ecfdf5; stroke: #16a34a; }
      .hard { fill: #fff7ed; stroke: #f97316; }
      .algo { fill: #fef3c7; stroke: #d97706; }
      .emp { fill: #f5f3ff; stroke: #7c3aed; }
      .title { font: 700 24px Inter, Arial, sans-serif; fill: #0f172a; }
      .head { font: 700 17px Inter, Arial, sans-serif; fill: #0f172a; }
      .text { font: 14px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 12px Inter, Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="1118" height="598" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="560" y="38" text-anchor="middle" class="title">L04 in one picture: from node importance to community detection</text>

  <g transform="translate(55 80)">
    <rect width="235" height="115" class="box role"/>
    <text x="18" y="31" class="head">Node roles</text>
    <text x="18" y="58" class="text">What does “important” mean?</text>
    <text x="18" y="82" class="small">degree, closeness, harmonic</text>
    <text x="18" y="101" class="small">betweenness, eigenvector, PageRank</text>
  </g>

  <g transform="translate(345 80)">
    <rect width="235" height="115" class="box obj"/>
    <text x="18" y="31" class="head">Group objective</text>
    <text x="18" y="58" class="text">What makes a community?</text>
    <text x="18" y="82" class="small">observed internal density</text>
    <text x="18" y="101" class="small">minus expected random density</text>
  </g>

  <g transform="translate(635 80)">
    <rect width="235" height="115" class="box hard"/>
    <text x="18" y="31" class="head">Modularity maximization</text>
    <text x="18" y="58" class="text">clean objective, hard problem</text>
    <text x="18" y="82" class="small">global optimum is NP-hard</text>
    <text x="18" y="101" class="small">multiple near-optimal partitions</text>
  </g>

  <path d="M290 138 H345" class="arrow"/>
  <path d="M580 138 H635" class="arrow"/>

  <g transform="translate(150 280)">
    <rect width="250" height="120" class="box algo"/>
    <text x="18" y="31" class="head">Divisive heuristic</text>
    <text x="18" y="58" class="text">Girvan–Newman</text>
    <text x="18" y="82" class="small">remove high edge-betweenness edges</text>
    <text x="18" y="101" class="small">didactic, but expensive</text>
  </g>

  <g transform="translate(465 280)">
    <rect width="250" height="120" class="box algo"/>
    <text x="18" y="31" class="head">Agglomerative heuristics</text>
    <text x="18" y="58" class="text">Louvain and Leiden</text>
    <text x="18" y="82" class="small">local moves + aggregation</text>
    <text x="18" y="101" class="small">fast, no pre-given k</text>
  </g>

  <g transform="translate(780 280)">
    <rect width="250" height="120" class="box algo"/>
    <text x="18" y="31" class="head">Alternative partitions</text>
    <text x="18" y="58" class="text">min-cut, spectral, embeddings</text>
    <text x="18" y="82" class="small">different objectives</text>
    <text x="18" y="101" class="small">different assumptions</text>
  </g>

  <path d="M752 195 C610 230 340 235 275 280" class="arrow"/>
  <path d="M752 195 C705 235 640 245 590 280" class="arrow"/>
  <path d="M752 195 C835 230 900 245 905 280" class="arrow"/>

  <g transform="translate(310 465)">
    <rect width="500" height="90" class="box emp"/>
    <text x="18" y="31" class="head">Empirical anchor and validation</text>
    <text x="18" y="58" class="text">Zachary karate club, trade communities, product space</text>
    <text x="18" y="78" class="small">Do detected groups match a meaningful social or economic structure?</text>
  </g>

  <path d="M275 400 C340 445 390 455 420 465" class="arrow"/>
  <path d="M590 400 V465" class="arrow"/>
  <path d="M905 400 C815 445 750 455 700 465" class="arrow"/>
</svg>
