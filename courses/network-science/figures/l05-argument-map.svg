<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">Lecture 05 argument map</title>
  <desc id="desc">A flow diagram connecting homophily measurement, causal mechanisms, social contexts, online closure, Schelling dynamics, and the causal gap.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .obs { fill: #e0f2fe; stroke: #0284c7; }
      .measure { fill: #ecfdf5; stroke: #16a34a; }
      .cause { fill: #fff7ed; stroke: #f97316; }
      .context { fill: #fef3c7; stroke: #d97706; }
      .dynamic { fill: #f5f3ff; stroke: #7c3aed; }
      .gap { fill: #f8fafc; stroke: #64748b; }
      .head { font: 700 17px Inter, Arial, sans-serif; fill: #0f172a; }
      .text { font: 14px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 12px Inter, Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="1118" height="598" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <g transform="translate(55 72)">
    <rect width="235" height="120" class="box obs"/>
    <text x="18" y="31" class="head">Observed pattern</text>
    <text x="18" y="60" class="text">same-track clustering</text>
    <text x="18" y="84" class="small">attributes are visible</text>
    <text x="18" y="103" class="small">but mechanism is hidden</text>
  </g>

  <g transform="translate(345 72)">
    <rect width="235" height="120" class="box measure"/>
    <text x="18" y="31" class="head">Measurement</text>
    <text x="18" y="60" class="text">homophily vs chance</text>
    <text x="18" y="84" class="small">observed same-class ties</text>
    <text x="18" y="103" class="small">minus random-mixing baseline</text>
  </g>

  <g transform="translate(635 72)">
    <rect width="235" height="120" class="box cause"/>
    <text x="18" y="31" class="head">Causal mechanism</text>
    <text x="18" y="60" class="text">selection or socialization?</text>
    <text x="18" y="84" class="small">same snapshot, different stories</text>
    <text x="18" y="103" class="small">needs temporal ordering</text>
  </g>

  <path d="M290 132 H345" class="arrow"/>
  <path d="M580 132 H635" class="arrow"/>

  <g transform="translate(150 280)">
    <rect width="250" height="120" class="box context"/>
    <text x="18" y="31" class="head">Social context</text>
    <text x="18" y="60" class="text">foci and affiliation networks</text>
    <text x="18" y="84" class="small">shared classes, labs, boards</text>
    <text x="18" y="103" class="small">can create ties without preference</text>
  </g>

  <g transform="translate(465 280)">
    <rect width="250" height="120" class="box context"/>
    <text x="18" y="31" class="head">Closure over time</text>
    <text x="18" y="60" class="text">online link formation</text>
    <text x="18" y="84" class="small">triadic, focal, membership closure</text>
    <text x="18" y="103" class="small">observed with timestamps</text>
  </g>

  <g transform="translate(780 280)">
    <rect width="250" height="120" class="box dynamic"/>
    <text x="18" y="31" class="head">Generative dynamics</text>
    <text x="18" y="60" class="text">Schelling segregation</text>
    <text x="18" y="84" class="small">local preferences</text>
    <text x="18" y="103" class="small">can produce sharp global patterns</text>
  </g>

  <path d="M752 192 C620 235 335 235 275 280" class="arrow"/>
  <path d="M752 192 C700 230 630 245 590 280" class="arrow"/>
  <path d="M752 192 C840 230 900 245 905 280" class="arrow"/>

  <g transform="translate(310 465)">
    <rect width="500" height="90" class="box gap"/>
    <text x="18" y="31" class="head">Causal gap</text>
    <text x="18" y="58" class="text">a graph snapshot is not an explanation</text>
    <text x="18" y="78" class="small">use baselines, longitudinal data, social context, and generative models</text>
  </g>

  <path d="M275 400 C340 445 390 455 420 465" class="arrow"/>
  <path d="M590 400 V465" class="arrow"/>
  <path d="M905 400 C815 445 750 455 700 465" class="arrow"/>
</svg>
