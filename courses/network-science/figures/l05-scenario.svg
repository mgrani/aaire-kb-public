<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', Arial, sans-serif">

  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#263238">A small classroom: friendships and attributes</text>
  <text x="360" y="42" text-anchor="middle" font-size="11" fill="#546e7a">circles = students · color = track (blue = STEM, orange = Arts) · lines = friendships</text>

  <!-- Within-STEM edges (left cluster) -->
  <g stroke="#1565c0" stroke-width="2.5">
    <line x1="120" y1="140" x2="180" y2="100"/>
    <line x1="120" y1="140" x2="100" y2="210"/>
    <line x1="180" y1="100" x2="240" y2="140"/>
    <line x1="180" y1="100" x2="100" y2="210"/>
    <line x1="240" y1="140" x2="200" y2="210"/>
    <line x1="100" y1="210" x2="200" y2="210"/>
    <line x1="120" y1="140" x2="200" y2="210"/>
    <line x1="60"  y1="170" x2="120" y2="140"/>
    <line x1="60"  y1="170" x2="100" y2="210"/>
  </g>

  <!-- Within-Arts edges (right cluster) -->
  <g stroke="#e65100" stroke-width="2.5">
    <line x1="480" y1="120" x2="540" y2="100"/>
    <line x1="480" y1="120" x2="500" y2="200"/>
    <line x1="540" y1="100" x2="600" y2="140"/>
    <line x1="540" y1="100" x2="500" y2="200"/>
    <line x1="600" y1="140" x2="580" y2="220"/>
    <line x1="500" y1="200" x2="580" y2="220"/>
    <line x1="600" y1="140" x2="660" y2="180"/>
    <line x1="580" y1="220" x2="660" y2="180"/>
  </g>

  <!-- Cross-track edges (few, thin, grey) -->
  <g stroke="#9e9e9e" stroke-width="1.4" stroke-dasharray="6,4">
    <line x1="240" y1="140" x2="480" y2="120"/>
    <line x1="200" y1="210" x2="500" y2="200"/>
  </g>
  <text x="360" y="155" text-anchor="middle" font-size="10" fill="#757575" font-style="italic">2 cross-track ties</text>

  <!-- STEM nodes (blue) -->
  <g>
    <circle cx="60"  cy="170" r="14" fill="#1976d2" stroke="#0d47a1" stroke-width="2"/>
    <text x="60"  y="175" text-anchor="middle" font-size="9" font-weight="bold" fill="white">S1</text>
    <circle cx="120" cy="140" r="14" fill="#1976d2" stroke="#0d47a1" stroke-width="2"/>
    <text x="120" y="145" text-anchor="middle" font-size="9" font-weight="bold" fill="white">S2</text>
    <circle cx="180" cy="100" r="14" fill="#1976d2" stroke="#0d47a1" stroke-width="2"/>
    <text x="180" y="105" text-anchor="middle" font-size="9" font-weight="bold" fill="white">S3</text>
    <circle cx="240" cy="140" r="14" fill="#1976d2" stroke="#0d47a1" stroke-width="2"/>
    <text x="240" y="145" text-anchor="middle" font-size="9" font-weight="bold" fill="white">S4</text>
    <circle cx="100" cy="210" r="14" fill="#1976d2" stroke="#0d47a1" stroke-width="2"/>
    <text x="100" y="215" text-anchor="middle" font-size="9" font-weight="bold" fill="white">S5</text>
    <circle cx="200" cy="210" r="14" fill="#1976d2" stroke="#0d47a1" stroke-width="2"/>
    <text x="200" y="215" text-anchor="middle" font-size="9" font-weight="bold" fill="white">S6</text>
  </g>

  <!-- Arts nodes (orange) -->
  <g>
    <circle cx="480" cy="120" r="14" fill="#ef6c00" stroke="#bf360c" stroke-width="2"/>
    <text x="480" y="125" text-anchor="middle" font-size="9" font-weight="bold" fill="white">A1</text>
    <circle cx="540" cy="100" r="14" fill="#ef6c00" stroke="#bf360c" stroke-width="2"/>
    <text x="540" y="105" text-anchor="middle" font-size="9" font-weight="bold" fill="white">A2</text>
    <circle cx="600" cy="140" r="14" fill="#ef6c00" stroke="#bf360c" stroke-width="2"/>
    <text x="600" y="145" text-anchor="middle" font-size="9" font-weight="bold" fill="white">A3</text>
    <circle cx="500" cy="200" r="14" fill="#ef6c00" stroke="#bf360c" stroke-width="2"/>
    <text x="500" y="205" text-anchor="middle" font-size="9" font-weight="bold" fill="white">A4</text>
    <circle cx="580" cy="220" r="14" fill="#ef6c00" stroke="#bf360c" stroke-width="2"/>
    <text x="580" y="225" text-anchor="middle" font-size="9" font-weight="bold" fill="white">A5</text>
    <circle cx="660" cy="180" r="14" fill="#ef6c00" stroke="#bf360c" stroke-width="2"/>
    <text x="660" y="185" text-anchor="middle" font-size="9" font-weight="bold" fill="white">A6</text>
  </g>

  <!-- Labels -->
  <text x="145" y="268" text-anchor="middle" font-size="11" fill="#1565c0" font-style="italic">STEM track — 6 students</text>
  <text x="565" y="268" text-anchor="middle" font-size="11" fill="#e65100" font-style="italic">Arts track — 6 students</text>

  <!-- Questions callout -->
  <rect x="20" y="290" width="680" height="78" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/>
  <text x="360" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#37474f">Questions we'd like to answer from this picture</text>
  <text x="30" y="328" font-size="10" fill="#455a64">① Is the within-track clustering more than we'd expect by chance?</text>
  <text x="30" y="342" font-size="10" fill="#455a64">② Did students choose friends from the same track, or did they become more alike after befriending?</text>
  <text x="30" y="356" font-size="10" fill="#455a64">③ Could shared classes (foci) explain the clustering without any personal preference? &#160; ④ Would mild preferences suffice to create this pattern?</text>
</svg>
