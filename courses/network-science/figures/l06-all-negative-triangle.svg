<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">All-negative Cold War triangle</title>
  <desc id="desc">USA, USSR, and China form a triangle with three negative edges after the Sino-Soviet split.</desc>
  <defs>
    <style>
      .neg { stroke: #c62828; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 9 7; }
      .node { fill: #ffffff; stroke: #263238; stroke-width: 2.2; }
      .label { font-size: 16px; font-weight: 800; fill: #263238; text-anchor: middle; dominant-baseline: middle; }
      .sign { font-size: 20px; font-weight: 900; fill: #c62828; text-anchor: middle; dominant-baseline: middle; }
      .head { font-size: 18px; font-weight: 800; fill: #263238; text-anchor: middle; }
      .box { fill: #fff3e0; stroke: #ef6c00; stroke-width: 1.8; }
      .small { font-size: 13px; fill: #455a64; text-anchor: middle; }
    </style>
  </defs>

  <text x="210" y="30" class="head">Post-1969: all-negative triangle</text>

  <line x1="210" y1="78" x2="95" y2="210" class="neg"/>
  <line x1="210" y1="78" x2="325" y2="210" class="neg"/>
  <line x1="95" y1="210" x2="325" y2="210" class="neg"/>

  <text x="145" y="135" class="sign">-</text>
  <text x="275" y="135" class="sign">-</text>
  <text x="210" y="232" class="sign">-</text>

  <circle cx="210" cy="78" r="32" class="node"/>
  <text x="210" y="78" class="label">USA</text>
  <circle cx="95" cy="210" r="34" class="node"/>
  <text x="95" y="202" class="label">USSR</text>
  <circle cx="325" cy="210" r="34" class="node"/>
  <text x="325" y="210" class="label">China</text>

  <rect x="55" y="262" width="310" height="42" rx="8" class="box"/>
  <text x="210" y="279" class="small" font-weight="800" fill="#bf360c">Strong balance: forbidden</text>
  <text x="210" y="297" class="small">Weak balance: allowed as three separate camps</text>
</svg>
