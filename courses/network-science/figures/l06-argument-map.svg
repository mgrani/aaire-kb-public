<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">Lecture 06 argument map</title>
  <desc id="desc">A flow diagram connecting signed edges, balanced triangles, structural and weak balance theorems, empirical signed networks, approximate balance, and the structural gap.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .obs { fill: #e0f2fe; stroke: #0284c7; }
      .local { fill: #ecfdf5; stroke: #16a34a; }
      .theorem { fill: #f5f3ff; stroke: #7c3aed; }
      .weak { fill: #fff7ed; stroke: #f97316; }
      .data { fill: #fef3c7; stroke: #d97706; }
      .gap { fill: #f8fafc; stroke: #64748b; }
      .head { font: 700 17px Inter, Arial, sans-serif; fill: #0f172a; }
      .text { font: 14px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 12px Inter, Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="1118" height="598" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <g transform="translate(55 72)">
    <rect width="235" height="120" class="box obs"/>
    <text x="18" y="31" class="head">New edge type</text>
    <text x="18" y="60" class="text">signed relationships</text>
    <text x="18" y="84" class="small">alliance / rivalry</text>
    <text x="18" y="103" class="small">trust / distrust</text>
  </g>

  <g transform="translate(345 72)">
    <rect width="235" height="120" class="box local"/>
    <text x="18" y="31" class="head">Local constraint</text>
    <text x="18" y="60" class="text">which triangles are stable?</text>
    <text x="18" y="84" class="small">strong: 0 or 2 negative edges</text>
    <text x="18" y="103" class="small">the forbidden type is + + -</text>
  </g>

  <g transform="translate(635 72)">
    <rect width="235" height="120" class="box theorem"/>
    <text x="18" y="31" class="head">Global theorem</text>
    <text x="18" y="60" class="text">strong balance -> 2 camps</text>
    <text x="18" y="84" class="small">+ within camps</text>
    <text x="18" y="103" class="small">- between camps</text>
  </g>

  <path d="M290 132 H345" class="arrow"/>
  <path d="M580 132 H635" class="arrow"/>

  <g transform="translate(130 280)">
    <rect width="250" height="120" class="box weak"/>
    <text x="18" y="31" class="head">Relaxation</text>
    <text x="18" y="60" class="text">weak balance</text>
    <text x="18" y="84" class="small">all-negative triangles allowed</text>
    <text x="18" y="103" class="small">global result: k hostile camps</text>
  </g>

  <g transform="translate(435 280)">
    <rect width="250" height="120" class="box data"/>
    <text x="18" y="31" class="head">Empirical test</text>
    <text x="18" y="60" class="text">signed social-media networks</text>
    <text x="18" y="84" class="small">Epinions, Slashdot, Wikipedia</text>
    <text x="18" y="103" class="small">+ + - strongly underrepresented</text>
  </g>

  <g transform="translate(740 280)">
    <rect width="250" height="120" class="box data"/>
    <text x="18" y="31" class="head">Approximate balance</text>
    <text x="18" y="60" class="text">sparse and noisy graphs</text>
    <text x="18" y="84" class="small">cycle parity, frustration index</text>
    <text x="18" y="103" class="small">signed Laplacian, triangle fraction</text>
  </g>

  <path d="M752 192 C630 235 320 235 255 280" class="arrow"/>
  <path d="M752 192 C675 235 585 245 560 280" class="arrow"/>
  <path d="M752 192 C810 230 860 245 865 280" class="arrow"/>

  <g transform="translate(310 465)">
    <rect width="500" height="90" class="box gap"/>
    <text x="18" y="31" class="head">Structural gap</text>
    <text x="18" y="58" class="text">the clean theorem assumes complete signed graphs</text>
    <text x="18" y="78" class="small">real networks are directed, sparse, missing ties, and only approximately balanced</text>
  </g>

  <path d="M255 400 C335 445 390 455 420 465" class="arrow"/>
  <path d="M560 400 V465" class="arrow"/>
  <path d="M865 400 C805 445 750 455 700 465" class="arrow"/>
</svg>
