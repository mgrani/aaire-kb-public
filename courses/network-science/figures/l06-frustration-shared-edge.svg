<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Frustration index with two unbalanced triangles sharing one edge</title>
  <desc id="desc">Two unbalanced triangles share the same negative edge, so one edge flip fixes both.</desc>
  <defs>
    <style>
      .pos { stroke: #2e7d32; stroke-width: 4; stroke-linecap: round; }
      .neg { stroke: #c62828; stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 8 6; }
      .highlight { stroke: #f9a825; stroke-width: 9; stroke-linecap: round; opacity: 0.45; }
      .tri { fill: #fce4ec; stroke: #c62828; stroke-width: 1.5; opacity: 0.35; }
      .node { fill: #ffffff; stroke: #263238; stroke-width: 2; }
      .label { font-size: 16px; font-weight: 800; fill: #263238; text-anchor: middle; dominant-baseline: middle; }
      .head { font-size: 17px; font-weight: 800; fill: #263238; text-anchor: middle; }
      .note { font-size: 13px; fill: #455a64; text-anchor: middle; }
      .sign { font-size: 17px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <text x="180" y="30" class="head">Before: two bad triangles</text>
  <text x="540" y="30" class="head">Flip one shared edge</text>

  <g transform="translate(0,10)">
    <path d="M180 70 L95 210 L180 260 Z" class="tri"/>
    <path d="M180 70 L265 210 L180 260 Z" class="tri"/>
    <line x1="180" y1="70" x2="180" y2="260" class="highlight"/>
    <line x1="180" y1="70" x2="95" y2="210" class="pos"/>
    <line x1="180" y1="70" x2="265" y2="210" class="pos"/>
    <line x1="95" y1="210" x2="180" y2="260" class="pos"/>
    <line x1="265" y1="210" x2="180" y2="260" class="pos"/>
    <line x1="180" y1="70" x2="180" y2="260" class="neg"/>
    <text x="158" y="165" class="sign" fill="#c62828">-</text>
    <text x="128" y="135" class="sign" fill="#2e7d32">+</text>
    <text x="232" y="135" class="sign" fill="#2e7d32">+</text>
    <text x="130" y="238" class="sign" fill="#2e7d32">+</text>
    <text x="230" y="238" class="sign" fill="#2e7d32">+</text>
    <circle cx="180" cy="70" r="20" class="node"/><text x="180" y="70" class="label">A</text>
    <circle cx="95" cy="210" r="20" class="node"/><text x="95" y="210" class="label">C</text>
    <circle cx="265" cy="210" r="20" class="node"/><text x="265" y="210" class="label">D</text>
    <circle cx="180" cy="260" r="20" class="node"/><text x="180" y="260" class="label">B</text>
    <text x="180" y="305" class="note">A-C-B and A-D-B are both ++-</text>
  </g>

  <g transform="translate(360,10)">
    <line x1="180" y1="70" x2="180" y2="260" class="highlight"/>
    <line x1="180" y1="70" x2="95" y2="210" class="pos"/>
    <line x1="180" y1="70" x2="265" y2="210" class="pos"/>
    <line x1="95" y1="210" x2="180" y2="260" class="pos"/>
    <line x1="265" y1="210" x2="180" y2="260" class="pos"/>
    <line x1="180" y1="70" x2="180" y2="260" class="pos"/>
    <text x="158" y="165" class="sign" fill="#2e7d32">+</text>
    <text x="128" y="135" class="sign" fill="#2e7d32">+</text>
    <text x="232" y="135" class="sign" fill="#2e7d32">+</text>
    <text x="130" y="238" class="sign" fill="#2e7d32">+</text>
    <text x="230" y="238" class="sign" fill="#2e7d32">+</text>
    <circle cx="180" cy="70" r="20" class="node"/><text x="180" y="70" class="label">A</text>
    <circle cx="95" cy="210" r="20" class="node"/><text x="95" y="210" class="label">C</text>
    <circle cx="265" cy="210" r="20" class="node"/><text x="265" y="210" class="label">D</text>
    <circle cx="180" cy="260" r="20" class="node"/><text x="180" y="260" class="label">B</text>
    <text x="180" y="305" class="note">One flip fixes both triangles: F can be 1</text>
  </g>
</svg>
