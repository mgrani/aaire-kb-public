<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Proof sketch for structural balance theorem</title>
  <desc id="desc">Two panels illustrate the proof directions: camps imply balanced triangles, and balanced triangles force a two-camp partition from one reference node.</desc>
  <defs>
    <style>
      .panel { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.5; }
      .campA { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1.8; }
      .campB { fill: #fff3e0; stroke: #ef6c00; stroke-width: 1.8; }
      .node { fill: #ffffff; stroke: #263238; stroke-width: 2; }
      .nodeA { fill: #bbdefb; stroke: #1565c0; stroke-width: 2; }
      .nodeB { fill: #ffe0b2; stroke: #ef6c00; stroke-width: 2; }
      .pivot { fill: #f3e5f5; stroke: #6a1b9a; stroke-width: 2.2; }
      .pos { stroke: #2e7d32; stroke-width: 4; stroke-linecap: round; }
      .neg { stroke: #c62828; stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 8 6; }
      .forced { stroke: #f9a825; stroke-width: 8; stroke-linecap: round; opacity: 0.45; }
      .head { font-size: 16px; font-weight: 800; fill: #263238; text-anchor: middle; }
      .sub { font-size: 12px; fill: #455a64; text-anchor: middle; }
      .label { font-size: 14px; font-weight: 800; fill: #263238; text-anchor: middle; dominant-baseline: middle; }
      .sign { font-size: 17px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; }
      .badge { fill: #f7f9fb; stroke: #b0bec5; stroke-width: 1.2; }
      .small { font-size: 12px; fill: #455a64; }
    </style>
  </defs>

  <rect x="20" y="18" width="325" height="344" rx="10" class="panel"/>
  <rect x="375" y="18" width="325" height="344" rx="10" class="panel"/>

  <text x="182.5" y="46" class="head">1. Camps -> balanced triangles</text>
  <text x="537.5" y="46" class="head">2. Balanced triangles -> camps</text>

  <!-- Direction 1 -->
  <g transform="translate(40,62)">
    <rect x="0" y="28" width="120" height="170" rx="10" class="campA"/>
    <rect x="165" y="28" width="120" height="170" rx="10" class="campB"/>
    <text x="60" y="20" class="sub" fill="#1565c0">camp A</text>
    <text x="225" y="20" class="sub" fill="#ef6c00">camp B</text>

    <line x1="38" y1="82" x2="82" y2="142" class="pos"/>
    <line x1="203" y1="82" x2="247" y2="142" class="pos"/>
    <line x1="82" y1="142" x2="203" y2="82" class="neg"/>
    <line x1="38" y1="82" x2="247" y2="142" class="neg"/>

    <text x="60" y="116" class="sign" fill="#2e7d32">+</text>
    <text x="225" y="116" class="sign" fill="#2e7d32">+</text>
    <text x="144" y="101" class="sign" fill="#c62828">-</text>
    <text x="143" y="151" class="sign" fill="#c62828">-</text>

    <circle cx="38" cy="82" r="17" class="nodeA"/><text x="38" y="82" class="label">a</text>
    <circle cx="82" cy="142" r="17" class="nodeA"/><text x="82" y="142" class="label">b</text>
    <circle cx="203" cy="82" r="17" class="nodeB"/><text x="203" y="82" class="label">c</text>
    <circle cx="247" cy="142" r="17" class="nodeB"/><text x="247" y="142" class="label">d</text>

    <rect x="12" y="214" width="125" height="72" rx="8" class="badge"/>
    <text x="26" y="238" class="small">inside one camp</text>
    <text x="26" y="262" class="small" font-weight="800" fill="#2e7d32">0 negative edges</text>

    <rect x="150" y="214" width="125" height="72" rx="8" class="badge"/>
    <text x="164" y="238" class="small">split 2 + 1</text>
    <text x="164" y="262" class="small" font-weight="800" fill="#2e7d32">2 negative edges</text>
  </g>

  <!-- Direction 2 -->
  <g transform="translate(395,62)">
    <rect x="0" y="42" width="126" height="145" rx="10" class="campA"/>
    <rect x="179" y="42" width="126" height="145" rx="10" class="campB"/>
    <text x="63" y="33" class="sub" fill="#1565c0">friends of v</text>
    <text x="242" y="33" class="sub" fill="#ef6c00">enemies of v</text>

    <line x1="152" y1="54" x2="48" y2="92" class="pos"/>
    <line x1="152" y1="54" x2="80" y2="142" class="pos"/>
    <line x1="152" y1="54" x2="225" y2="92" class="neg"/>
    <line x1="152" y1="54" x2="258" y2="142" class="neg"/>

    <line x1="48" y1="92" x2="80" y2="142" class="forced"/>
    <line x1="225" y1="92" x2="258" y2="142" class="forced"/>
    <line x1="80" y1="142" x2="225" y2="92" class="forced"/>
    <line x1="48" y1="92" x2="80" y2="142" class="pos"/>
    <line x1="225" y1="92" x2="258" y2="142" class="pos"/>
    <line x1="80" y1="142" x2="225" y2="92" class="neg"/>

    <text x="97" y="84" class="sign" fill="#2e7d32">+</text>
    <text x="107" y="108" class="sign" fill="#2e7d32">+</text>
    <text x="198" y="83" class="sign" fill="#c62828">-</text>
    <text x="211" y="110" class="sign" fill="#c62828">-</text>

    <circle cx="152" cy="54" r="19" class="pivot"/><text x="152" y="54" class="label">v</text>
    <circle cx="48" cy="92" r="17" class="nodeA"/><text x="48" y="92" class="label">u</text>
    <circle cx="80" cy="142" r="17" class="nodeA"/><text x="80" y="142" class="label">w</text>
    <circle cx="225" cy="92" r="17" class="nodeB"/><text x="225" y="92" class="label">x</text>
    <circle cx="258" cy="142" r="17" class="nodeB"/><text x="258" y="142" class="label">y</text>

    <rect x="14" y="214" width="277" height="72" rx="8" class="badge"/>
    <text x="28" y="236" class="small">Triangles with v force all remaining signs:</text>
    <text x="28" y="258" class="small" font-weight="800" fill="#455a64">within each side: +</text>
    <text x="28" y="276" class="small" font-weight="800" fill="#455a64">across the two sides: -</text>
  </g>
</svg>
