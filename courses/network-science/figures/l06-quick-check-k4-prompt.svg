<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Signed K4 quick check prompt</title>
  <desc id="desc">A complete signed graph on four nodes with A, B, and C connected positively and D connected negatively to each of them.</desc>
  <defs>
    <style>
      .node { fill: #ffffff; stroke: #263238; stroke-width: 2; }
      .pos { stroke: #2e7d32; stroke-width: 4; stroke-linecap: round; }
      .neg { stroke: #c62828; stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 8 6; }
      .label { font-size: 16px; font-weight: 800; fill: #263238; text-anchor: middle; dominant-baseline: middle; }
      .sign { font-size: 18px; font-weight: 800; dominant-baseline: middle; text-anchor: middle; }
      .small { font-size: 13px; fill: #455a64; text-anchor: middle; }
      .head { font-size: 18px; font-weight: 800; fill: #263238; text-anchor: middle; }
    </style>
  </defs>

  <text x="180" y="32" class="head">Signed complete graph</text>

  <path d="M180 70 L95 210 L265 210 Z" fill="#e8f5e9" opacity="0.75"/>
  <line x1="180" y1="70" x2="95" y2="210" class="pos"/>
  <line x1="180" y1="70" x2="265" y2="210" class="pos"/>
  <line x1="95" y1="210" x2="265" y2="210" class="pos"/>
  <line x1="180" y1="70" x2="180" y2="265" class="neg"/>
  <line x1="95" y1="210" x2="180" y2="265" class="neg"/>
  <line x1="265" y1="210" x2="180" y2="265" class="neg"/>

  <text x="137" y="135" class="sign" fill="#2e7d32">+</text>
  <text x="223" y="135" class="sign" fill="#2e7d32">+</text>
  <text x="180" y="198" class="sign" fill="#2e7d32">+</text>
  <text x="162" y="166" class="sign" fill="#c62828">-</text>
  <text x="128" y="242" class="sign" fill="#c62828">-</text>
  <text x="232" y="242" class="sign" fill="#c62828">-</text>

  <circle cx="180" cy="70" r="22" class="node"/><text x="180" y="70" class="label">A</text>
  <circle cx="95" cy="210" r="22" class="node"/><text x="95" y="210" class="label">B</text>
  <circle cx="265" cy="210" r="22" class="node"/><text x="265" y="210" class="label">C</text>
  <circle cx="180" cy="265" r="22" class="node"/><text x="180" y="265" class="label">D</text>

  <text x="180" y="306" class="small">D is negative to A, B, and C</text>
</svg>
