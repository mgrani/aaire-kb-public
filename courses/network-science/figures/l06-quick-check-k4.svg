<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Signed K4 quick check</title>
  <desc id="desc">A complete signed graph on four nodes before and after the C-D edge flips from negative to positive.</desc>
  <defs>
    <style>
      .node { fill: #ffffff; stroke: #263238; stroke-width: 2; }
      .pos { stroke: #2e7d32; stroke-width: 4; stroke-linecap: round; }
      .neg { stroke: #c62828; stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 8 6; }
      .bad { fill: #fff3e0; stroke: #ef6c00; stroke-width: 2; stroke-dasharray: 6 5; }
      .label { font-size: 16px; font-weight: 700; fill: #263238; text-anchor: middle; dominant-baseline: middle; }
      .sign { font-size: 18px; font-weight: 800; dominant-baseline: middle; text-anchor: middle; }
      .green { fill: #2e7d32; }
      .red { fill: #c62828; }
      .small { font-size: 13px; fill: #455a64; }
      .head { font-size: 17px; font-weight: 800; fill: #263238; text-anchor: middle; }
    </style>
  </defs>

  <text x="180" y="28" class="head">Original: balanced</text>
  <text x="540" y="28" class="head">After C-D flips to +</text>

  <g transform="translate(0,10)">
    <path d="M180 78 L95 215 L265 215 Z" fill="#e8f5e9" opacity="0.75"/>
    <line x1="180" y1="78" x2="95" y2="215" class="pos"/>
    <line x1="180" y1="78" x2="265" y2="215" class="pos"/>
    <line x1="95" y1="215" x2="265" y2="215" class="pos"/>
    <line x1="180" y1="78" x2="180" y2="265" class="neg"/>
    <line x1="95" y1="215" x2="180" y2="265" class="neg"/>
    <line x1="265" y1="215" x2="180" y2="265" class="neg"/>

    <text x="137" y="140" class="sign green">+</text>
    <text x="223" y="140" class="sign green">+</text>
    <text x="180" y="205" class="sign green">+</text>
    <text x="169" y="172" class="sign red">-</text>
    <text x="128" y="244" class="sign red">-</text>
    <text x="232" y="244" class="sign red">-</text>

    <circle cx="180" cy="78" r="20" class="node"/><text x="180" y="78" class="label">A</text>
    <circle cx="95" cy="215" r="20" class="node"/><text x="95" y="215" class="label">B</text>
    <circle cx="265" cy="215" r="20" class="node"/><text x="265" y="215" class="label">C</text>
    <circle cx="180" cy="265" r="20" class="node"/><text x="180" y="265" class="label">D</text>

    <text x="180" y="305" class="small" text-anchor="middle">Camp {A,B,C} versus {D}</text>
  </g>

  <g transform="translate(360,10)">
    <path d="M180 78 L265 215 L180 265 Z" class="bad"/>
    <path d="M95 215 L265 215 L180 265 Z" class="bad"/>
    <line x1="180" y1="78" x2="95" y2="215" class="pos"/>
    <line x1="180" y1="78" x2="265" y2="215" class="pos"/>
    <line x1="95" y1="215" x2="265" y2="215" class="pos"/>
    <line x1="180" y1="78" x2="180" y2="265" class="neg"/>
    <line x1="95" y1="215" x2="180" y2="265" class="neg"/>
    <line x1="265" y1="215" x2="180" y2="265" class="pos"/>

    <text x="137" y="140" class="sign green">+</text>
    <text x="223" y="140" class="sign green">+</text>
    <text x="180" y="205" class="sign green">+</text>
    <text x="169" y="172" class="sign red">-</text>
    <text x="128" y="244" class="sign red">-</text>
    <text x="232" y="244" class="sign green">+</text>

    <circle cx="180" cy="78" r="20" class="node"/><text x="180" y="78" class="label">A</text>
    <circle cx="95" cy="215" r="20" class="node"/><text x="95" y="215" class="label">B</text>
    <circle cx="265" cy="215" r="20" class="node"/><text x="265" y="215" class="label">C</text>
    <circle cx="180" cy="265" r="20" class="node"/><text x="180" y="265" class="label">D</text>

    <text x="180" y="305" class="small" text-anchor="middle">A-C-D and B-C-D now have exactly one - edge</text>
  </g>
</svg>
