<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Cold War signed graph after 1969</title>
  <desc id="desc">A signed graph after the Sino-Soviet split: Western allies remain positive, but USSR and China are now negative to each other.</desc>

  <rect x="12" y="8" width="336" height="300" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="180" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#bf360c">Post-1969 — Sino-Soviet split</text>

  <!-- Within-Western (positive) -->
  <line x1="80" y1="108" x2="180" y2="68" stroke="#2e7d32" stroke-width="3"/>
  <line x1="80" y1="108" x2="180" y2="168" stroke="#2e7d32" stroke-width="3"/>
  <line x1="180" y1="68" x2="180" y2="168" stroke="#2e7d32" stroke-width="3"/>

  <!-- USSR-China now negative -->
  <line x1="280" y1="88" x2="280" y2="168" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="296" y="134" font-size="13" font-weight="bold" fill="#c62828">−</text>
  <text x="296" y="148" font-size="8" fill="#bf360c" font-style="italic">split!</text>

  <!-- Cross-bloc (negative) -->
  <line x1="80"  y1="108" x2="280" y2="88"  stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="80"  y1="108" x2="280" y2="168" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="180" y1="68"  x2="280" y2="88"  stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="180" y1="68"  x2="280" y2="168" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="180" y1="168" x2="280" y2="88"  stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="180" y1="168" x2="280" y2="168" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Edge signs -->
  <text x="120" y="80" font-size="13" font-weight="bold" fill="#2e7d32">+</text>
  <text x="118" y="150" font-size="13" font-weight="bold" fill="#2e7d32">+</text>
  <text x="168" y="124" font-size="13" font-weight="bold" fill="#2e7d32">+</text>

  <!-- Nodes -->
  <circle cx="80"  cy="108" r="18" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
  <text x="80"  y="113" text-anchor="middle" font-size="9" font-weight="bold" fill="white">USA</text>
  <circle cx="180" cy="68"  r="18" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
  <text x="180" y="73" text-anchor="middle" font-size="10" font-weight="bold" fill="white">UK</text>
  <circle cx="180" cy="168" r="18" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
  <text x="180" y="173" text-anchor="middle" font-size="8" font-weight="bold" fill="white">France</text>
  <circle cx="280" cy="88"  r="18" fill="#ef6c00" stroke="#bf360c" stroke-width="2"/>
  <text x="280" y="93" text-anchor="middle" font-size="8" font-weight="bold" fill="white">USSR</text>
  <circle cx="280" cy="168" r="18" fill="#ef6c00" stroke="#bf360c" stroke-width="2"/>
  <text x="280" y="173" text-anchor="middle" font-size="8" font-weight="bold" fill="white">China</text>

  <text x="180" y="246" text-anchor="middle" font-size="10" fill="#bf360c" font-weight="bold">USA-USSR-China is all negative</text>
  <text x="180" y="264" text-anchor="middle" font-size="10" fill="#bf360c">violates strong balance</text>
  <text x="180" y="282" text-anchor="middle" font-size="10" fill="#e65100">but satisfies weak balance</text>
  <text x="180" y="300" text-anchor="middle" font-size="10" fill="#e65100" font-style="italic">{USA,UK,FR} · {USSR} · {China}</text>
</svg>
