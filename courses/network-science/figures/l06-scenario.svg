<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Segoe UI', Arial, sans-serif">

  <text x="360" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Cold War alliances as a signed graph</text>
  <text x="360" y="40" text-anchor="middle" font-size="11" fill="#546e7a">green solid = alliance (+) · red dashed = rivalry (−)</text>

  <!-- ===== LEFT PANEL: Pre-1960 (balanced) ===== -->
  <g transform="translate(0,50)">
    <rect x="12" y="0" width="336" height="310" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="180" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">Pre-1960 — two balanced blocs</text>

    <!-- Western bloc positions: USA(80,100) UK(180,60) France(180,160) -->
    <!-- Eastern bloc: USSR(280,80) China(280,160) -->

    <!-- Within-Western (positive) -->
    <line x1="80" y1="100" x2="180" y2="60" stroke="#2e7d32" stroke-width="3"/>
    <line x1="80" y1="100" x2="180" y2="160" stroke="#2e7d32" stroke-width="3"/>
    <line x1="180" y1="60" x2="180" y2="160" stroke="#2e7d32" stroke-width="3"/>

    <!-- Within-Eastern (positive) -->
    <line x1="280" y1="80" x2="280" y2="160" stroke="#2e7d32" stroke-width="3"/>

    <!-- Cross-bloc (negative) -->
    <line x1="80"  y1="100" x2="280" y2="80"  stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/>
    <line x1="80"  y1="100" x2="280" y2="160" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/>
    <line x1="180" y1="60"  x2="280" y2="80"  stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/>
    <line x1="180" y1="60"  x2="280" y2="160" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/>
    <line x1="180" y1="160" x2="280" y2="80"  stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/>
    <line x1="180" y1="160" x2="280" y2="160" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- edge signs -->
    <text x="120" y="72" font-size="13" font-weight="bold" fill="#2e7d32">+</text>
    <text x="118" y="142" font-size="13" font-weight="bold" fill="#2e7d32">+</text>
    <text x="168" y="116" font-size="13" font-weight="bold" fill="#2e7d32">+</text>
    <text x="270" y="126" font-size="13" font-weight="bold" fill="#2e7d32">+</text>

    <!-- Nodes -->
    <circle cx="80"  cy="100" r="18" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
    <text x="80"  y="105" text-anchor="middle" font-size="9" font-weight="bold" fill="white">USA</text>
    <circle cx="180" cy="60"  r="18" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
    <text x="180" y="65"  text-anchor="middle" font-size="10" font-weight="bold" fill="white">UK</text>
    <circle cx="180" cy="160" r="18" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
    <text x="180" y="165" text-anchor="middle" font-size="8" font-weight="bold" fill="white">France</text>
    <circle cx="280" cy="80"  r="18" fill="#c62828" stroke="#7f0000" stroke-width="2"/>
    <text x="280" y="85"  text-anchor="middle" font-size="8" font-weight="bold" fill="white">USSR</text>
    <circle cx="280" cy="160" r="18" fill="#c62828" stroke="#7f0000" stroke-width="2"/>
    <text x="280" y="165" text-anchor="middle" font-size="8" font-weight="bold" fill="white">China</text>

    <!-- Bloc labels -->
    <rect x="38" y="195" width="180" height="24" rx="6" fill="#bbdefb"/>
    <text x="128" y="212" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">Western Bloc</text>
    <rect x="238" y="195" width="90" height="24" rx="6" fill="#ffcdd2"/>
    <text x="283" y="212" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f0000">Eastern Bloc</text>

    <text x="180" y="250" text-anchor="middle" font-size="10" fill="#1b5e20" font-weight="bold">All 10 triangles are balanced</text>
    <text x="180" y="268" text-anchor="middle" font-size="10" fill="#1b5e20">→ Balance Theorem: exactly 2 camps</text>
    <text x="180" y="296" text-anchor="middle" font-size="10" fill="#1b5e20" font-style="italic">✓ strong structural balance</text>
  </g>

  <!-- ===== RIGHT PANEL: Post-1969 (unbalanced under strong) ===== -->
  <g transform="translate(360,50)">
    <rect x="12" y="0" width="336" height="310" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="180" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#bf360c">Post-1969 — Sino-Soviet split</text>

    <!-- Within-Western (positive) — same positions -->
    <line x1="80" y1="100" x2="180" y2="60" stroke="#2e7d32" stroke-width="3"/>
    <line x1="80" y1="100" x2="180" y2="160" stroke="#2e7d32" stroke-width="3"/>
    <line x1="180" y1="60" x2="180" y2="160" stroke="#2e7d32" stroke-width="3"/>

    <!-- USSR-China now NEGATIVE -->
    <line x1="280" y1="80" x2="280" y2="160" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="296" y="126" font-size="13" font-weight="bold" fill="#c62828">−</text>
    <text x="296" y="140" font-size="8" fill="#bf360c" font-style="italic">split!</text>

    <!-- Cross-bloc (negative) — still all negative -->
    <line x1="80"  y1="100" x2="280" y2="80"  stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/>
    <line x1="80"  y1="100" x2="280" y2="160" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/>
    <line x1="180" y1="60"  x2="280" y2="80"  stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/>
    <line x1="180" y1="60"  x2="280" y2="160" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/>
    <line x1="180" y1="160" x2="280" y2="80"  stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/>
    <line x1="180" y1="160" x2="280" y2="160" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- edge signs -->
    <text x="120" y="72" font-size="13" font-weight="bold" fill="#2e7d32">+</text>
    <text x="118" y="142" font-size="13" font-weight="bold" fill="#2e7d32">+</text>
    <text x="168" y="116" font-size="13" font-weight="bold" fill="#2e7d32">+</text>

    <!-- Nodes -->
    <circle cx="80"  cy="100" r="18" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
    <text x="80"  y="105" text-anchor="middle" font-size="9" font-weight="bold" fill="white">USA</text>
    <circle cx="180" cy="60"  r="18" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
    <text x="180" y="65"  text-anchor="middle" font-size="10" font-weight="bold" fill="white">UK</text>
    <circle cx="180" cy="160" r="18" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
    <text x="180" y="165" text-anchor="middle" font-size="8" font-weight="bold" fill="white">France</text>
    <circle cx="280" cy="80"  r="18" fill="#ef6c00" stroke="#bf360c" stroke-width="2"/>
    <text x="280" y="85"  text-anchor="middle" font-size="8" font-weight="bold" fill="white">USSR</text>
    <circle cx="280" cy="160" r="18" fill="#ef6c00" stroke="#bf360c" stroke-width="2"/>
    <text x="280" y="165" text-anchor="middle" font-size="8" font-weight="bold" fill="white">China</text>

    <!-- Highlighted unbalanced triangle -->
    <text x="180" y="240" text-anchor="middle" font-size="10" fill="#bf360c" font-weight="bold">△ USA–USSR–China: all negative (−−−)</text>
    <text x="180" y="258" text-anchor="middle" font-size="10" fill="#bf360c">→ violates strong balance</text>
    <text x="180" y="276" text-anchor="middle" font-size="10" fill="#e65100">→ but satisfies weak balance (≥3 camps)</text>
    <text x="180" y="296" text-anchor="middle" font-size="10" fill="#e65100" font-style="italic">camps: {USA,UK,FR} · {USSR} · {China}</text>
  </g>
</svg>
