<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Sparse signed cycle with no triangles</title>
  <desc id="desc">A four-node cycle with one negative edge and no diagonals, illustrating that triangles alone are insufficient in sparse signed graphs.</desc>
  <defs>
    <style>
      .pos { stroke: #2e7d32; stroke-width: 4; stroke-linecap: round; }
      .neg { stroke: #c62828; stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 8 6; }
      .missing { stroke: #b0bec5; stroke-width: 2.4; stroke-dasharray: 3 7; opacity: 0.75; }
      .node { fill: #ffffff; stroke: #263238; stroke-width: 2; }
      .label { font-size: 16px; font-weight: 800; fill: #263238; text-anchor: middle; dominant-baseline: middle; }
      .sign { font-size: 18px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; }
      .box { fill: #fff8e1; stroke: #f9a825; stroke-width: 1.8; }
      .small { font-size: 14px; fill: #455a64; }
      .head { font-size: 18px; font-weight: 800; fill: #263238; }
    </style>
  </defs>

  <text x="360" y="30" text-anchor="middle" class="head">Sparse graph: no triangles, but still unbalanced</text>

  <g transform="translate(90,45)">
    <line x1="120" y1="50" x2="330" y2="50" class="pos"/>
    <line x1="330" y1="50" x2="330" y2="210" class="pos"/>
    <line x1="330" y1="210" x2="120" y2="210" class="pos"/>
    <line x1="120" y1="210" x2="120" y2="50" class="neg"/>
    <line x1="120" y1="50" x2="330" y2="210" class="missing"/>
    <line x1="330" y1="50" x2="120" y2="210" class="missing"/>

    <text x="225" y="35" class="sign" fill="#2e7d32">+</text>
    <text x="348" y="130" class="sign" fill="#2e7d32">+</text>
    <text x="225" y="230" class="sign" fill="#2e7d32">+</text>
    <text x="102" y="130" class="sign" fill="#c62828">-</text>

    <circle cx="120" cy="50" r="22" class="node"/><text x="120" y="50" class="label">A</text>
    <circle cx="330" cy="50" r="22" class="node"/><text x="330" y="50" class="label">B</text>
    <circle cx="330" cy="210" r="22" class="node"/><text x="330" y="210" class="label">C</text>
    <circle cx="120" cy="210" r="22" class="node"/><text x="120" y="210" class="label">D</text>
  </g>

  <g transform="translate(500,88)">
    <rect x="0" y="0" width="165" height="150" rx="8" class="box"/>
    <text x="16" y="30" class="small" font-weight="800">Triangle test:</text>
    <text x="16" y="54" class="small">no triangles exist</text>
    <text x="16" y="88" class="small" font-weight="800">Cycle test:</text>
    <text x="16" y="112" class="small">one negative edge</text>
    <text x="16" y="136" class="small" fill="#c62828" font-weight="800">odd -> unbalanced</text>
  </g>
</svg>
