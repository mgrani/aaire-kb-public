<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Weakly balanced three-camp signed graph</title>
  <desc id="desc">Six nodes partitioned into three friendly pairs with negative edges between every pair of camps.</desc>
  <defs>
    <style>
      .pos { stroke: #2e7d32; stroke-width: 4; stroke-linecap: round; }
      .neg { stroke: #c62828; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 7 6; opacity: 0.75; }
      .camp { fill: #f7f9fb; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #263238; stroke-width: 2; }
      .node-label { font-size: 15px; font-weight: 800; fill: #263238; text-anchor: middle; dominant-baseline: middle; }
      .camp-label { font-size: 14px; font-weight: 800; text-anchor: middle; }
      .note { font-size: 13px; fill: #455a64; text-anchor: middle; }
      .sign { font-size: 16px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect x="50" y="65" width="170" height="175" rx="12" class="camp" stroke="#1565c0" fill="#e3f2fd"/>
  <rect x="275" y="65" width="170" height="175" rx="12" class="camp" stroke="#6a1b9a" fill="#f3e5f5"/>
  <rect x="500" y="65" width="170" height="175" rx="12" class="camp" stroke="#ef6c00" fill="#fff3e0"/>

  <text x="135" y="48" class="camp-label" fill="#1565c0">Camp 1</text>
  <text x="360" y="48" class="camp-label" fill="#6a1b9a">Camp 2</text>
  <text x="585" y="48" class="camp-label" fill="#ef6c00">Camp 3</text>

  <!-- cross-camp negative edges -->
  <g>
    <line x1="110" y1="120" x2="335" y2="120" class="neg"/><line x1="110" y1="120" x2="385" y2="185" class="neg"/>
    <line x1="160" y1="185" x2="335" y2="120" class="neg"/><line x1="160" y1="185" x2="385" y2="185" class="neg"/>
    <line x1="335" y1="120" x2="560" y2="120" class="neg"/><line x1="335" y1="120" x2="610" y2="185" class="neg"/>
    <line x1="385" y1="185" x2="560" y2="120" class="neg"/><line x1="385" y1="185" x2="610" y2="185" class="neg"/>
    <line x1="110" y1="120" x2="560" y2="120" class="neg"/><line x1="110" y1="120" x2="610" y2="185" class="neg"/>
    <line x1="160" y1="185" x2="560" y2="120" class="neg"/><line x1="160" y1="185" x2="610" y2="185" class="neg"/>
  </g>

  <!-- within-camp positive edges -->
  <line x1="110" y1="120" x2="160" y2="185" class="pos"/>
  <line x1="335" y1="120" x2="385" y2="185" class="pos"/>
  <line x1="560" y1="120" x2="610" y2="185" class="pos"/>
  <text x="135" y="155" class="sign" fill="#2e7d32">+</text>
  <text x="360" y="155" class="sign" fill="#2e7d32">+</text>
  <text x="585" y="155" class="sign" fill="#2e7d32">+</text>

  <circle cx="110" cy="120" r="20" class="node"/><text x="110" y="120" class="node-label">A</text>
  <circle cx="160" cy="185" r="20" class="node"/><text x="160" y="185" class="node-label">B</text>
  <circle cx="335" cy="120" r="20" class="node"/><text x="335" y="120" class="node-label">C</text>
  <circle cx="385" cy="185" r="20" class="node"/><text x="385" y="185" class="node-label">D</text>
  <circle cx="560" cy="120" r="20" class="node"/><text x="560" y="120" class="node-label">E</text>
  <circle cx="610" cy="185" r="20" class="node"/><text x="610" y="185" class="node-label">F</text>

  <path d="M110 120 L335 120 L560 120 Z" fill="none" stroke="#ef6c00" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="360" y="282" class="note">A-C-E is an all-negative triangle: allowed by weak balance, forbidden by strong balance.</text>
  <text x="360" y="306" class="note">To become strongly balanced, two camps must merge; merging two 2-node camps flips 4 cross edges.</text>
</svg>
