<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">Lecture 07 argument map</title>
  <desc id="desc">A flow diagram connecting Milgram's experiment, small-world distances, Watts-Strogatz, Kleinberg's decentralized search, empirical email chains, the Web, and the navigational gap.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .obs { fill: #e0f2fe; stroke: #0284c7; }
      .exist { fill: #ecfdf5; stroke: #16a34a; }
      .model { fill: #f5f3ff; stroke: #7c3aed; }
      .search { fill: #fff7ed; stroke: #f97316; }
      .emp { fill: #fef3c7; stroke: #d97706; }
      .gap { fill: #f8fafc; stroke: #64748b; }
      .head { font: 700 17px Inter, Arial, sans-serif; fill: #0f172a; }
      .text { font: 14px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 12px Inter, Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="1118" height="598" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <g transform="translate(55 72)">
    <rect width="235" height="120" class="box obs"/>
    <text x="18" y="31" class="head">Empirical puzzle</text>
    <text x="18" y="60" class="text">Milgram letter chains</text>
    <text x="18" y="84" class="small">short completed chains</text>
    <text x="18" y="103" class="small">but many chains fail</text>
  </g>

  <g transform="translate(345 72)">
    <rect width="235" height="120" class="box exist"/>
    <text x="18" y="31" class="head">Existence</text>
    <text x="18" y="60" class="text">short paths in huge graphs</text>
    <text x="18" y="84" class="small">average distance grows like log n</text>
    <text x="18" y="103" class="small">random links shrink path lengths</text>
  </g>

  <g transform="translate(635 72)">
    <rect width="235" height="120" class="box model"/>
    <text x="18" y="31" class="head">Coexistence</text>
    <text x="18" y="60" class="text">Watts-Strogatz model</text>
    <text x="18" y="84" class="small">local clustering remains high</text>
    <text x="18" y="103" class="small">few shortcuts make paths short</text>
  </g>

  <path d="M290 132 H345" class="arrow"/>
  <path d="M580 132 H635" class="arrow"/>

  <g transform="translate(120 280)">
    <rect width="260" height="120" class="box search"/>
    <text x="18" y="31" class="head">Findability</text>
    <text x="18" y="60" class="text">Kleinberg decentralized search</text>
    <text x="18" y="84" class="small">local greedy routing needs geometry</text>
    <text x="18" y="103" class="small">only r = dimension is navigable</text>
  </g>

  <g transform="translate(430 280)">
    <rect width="260" height="120" class="box emp"/>
    <text x="18" y="31" class="head">Empirical anchor</text>
    <text x="18" y="60" class="text">global email experiment</text>
    <text x="18" y="84" class="small">chains fail often</text>
    <text x="18" y="103" class="small">social categories guide routing</text>
  </g>

  <g transform="translate(740 280)">
    <rect width="260" height="120" class="box model"/>
    <text x="18" y="31" class="head">Directed information networks</text>
    <text x="18" y="60" class="text">the Web as a small world</text>
    <text x="18" y="84" class="small">bow-tie structure</text>
    <text x="18" y="103" class="small">navigation depends on direction</text>
  </g>

  <path d="M752 192 C620 235 310 235 250 280" class="arrow"/>
  <path d="M752 192 C665 230 585 245 560 280" class="arrow"/>
  <path d="M752 192 C850 225 920 245 870 280" class="arrow"/>

  <g transform="translate(310 465)">
    <rect width="500" height="90" class="box gap"/>
    <text x="18" y="31" class="head">Navigational gap</text>
    <text x="18" y="58" class="text">short paths can exist without being findable</text>
    <text x="18" y="78" class="small">small-world structure is not enough; local routing needs usable cues</text>
  </g>

  <path d="M250 400 C340 445 390 455 420 465" class="arrow"/>
  <path d="M560 400 V465" class="arrow"/>
  <path d="M870 400 C810 445 750 455 700 465" class="arrow"/>
</svg>
