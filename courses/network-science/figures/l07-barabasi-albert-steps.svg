<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Barabasi-Albert preferential attachment in four steps</title>
  <desc id="desc">Four panels show growth from a small seed graph. New nodes attach preferentially to high-degree nodes, producing hubs and a heavy-tailed degree distribution.</desc>
  <defs>
    <style>
      .panel { fill: #f8fafc; stroke: #cfd8dc; stroke-width: 2; rx: 12; }
      .edge { stroke: #607d8b; stroke-width: 3; stroke-linecap: round; }
      .newedge { stroke: #c2410c; stroke-width: 3.5; stroke-linecap: round; }
      .node { fill: #ffffff; stroke: #263238; stroke-width: 2.5; }
      .hub { fill: #ffedd5; stroke: #c2410c; stroke-width: 4; }
      .newnode { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 3; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; fill: #263238; }
      .small { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; fill: #455a64; }
      .tiny { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #546e7a; }
    </style>
  </defs>

  <rect x="20" y="24" width="210" height="410" class="panel"/>
  <rect x="260" y="24" width="210" height="410" class="panel"/>
  <rect x="500" y="24" width="210" height="410" class="panel"/>
  <rect x="740" y="24" width="200" height="410" class="panel"/>

  <text x="125" y="62" text-anchor="middle" class="label">1. Seed</text>
  <text x="365" y="62" text-anchor="middle" class="label">2. Grow</text>
  <text x="605" y="62" text-anchor="middle" class="label">3. Prefer hubs</text>
  <text x="840" y="62" text-anchor="middle" class="label">4. Hubs emerge</text>

  <!-- Panel 1 -->
  <line x1="95" y1="165" x2="155" y2="165" class="edge"/>
  <line x1="155" y1="165" x2="125" y2="225" class="edge"/>
  <line x1="125" y1="225" x2="95" y2="165" class="edge"/>
  <circle cx="95" cy="165" r="16" class="node"/>
  <circle cx="155" cy="165" r="16" class="node"/>
  <circle cx="125" cy="225" r="16" class="node"/>
  <text x="125" y="332" text-anchor="middle" class="small">start with a small</text>
  <text x="125" y="352" text-anchor="middle" class="small">connected graph</text>

  <!-- Panel 2 -->
  <line x1="350" y1="150" x2="405" y2="175" class="edge"/>
  <line x1="350" y1="150" x2="322" y2="220" class="edge"/>
  <line x1="405" y1="175" x2="322" y2="220" class="edge"/>
  <line x1="350" y1="150" x2="375" y2="270" class="newedge"/>
  <line x1="322" y1="220" x2="375" y2="270" class="newedge"/>
  <circle cx="350" cy="150" r="18" class="hub"/>
  <circle cx="405" cy="175" r="14" class="node"/>
  <circle cx="322" cy="220" r="14" class="node"/>
  <circle cx="375" cy="270" r="15" class="newnode"/>
  <text x="365" y="332" text-anchor="middle" class="small">add one node</text>
  <text x="365" y="352" text-anchor="middle" class="small">and m edges</text>

  <!-- Panel 3 -->
  <line x1="590" y1="135" x2="650" y2="162" class="edge"/>
  <line x1="590" y1="135" x2="545" y2="210" class="edge"/>
  <line x1="590" y1="135" x2="610" y2="250" class="edge"/>
  <line x1="545" y1="210" x2="610" y2="250" class="edge"/>
  <line x1="650" y1="162" x2="610" y2="250" class="edge"/>
  <line x1="590" y1="135" x2="675" y2="285" class="newedge"/>
  <line x1="610" y1="250" x2="675" y2="285" class="newedge"/>
  <circle cx="590" cy="135" r="24" class="hub"/>
  <circle cx="650" cy="162" r="13" class="node"/>
  <circle cx="545" cy="210" r="13" class="node"/>
  <circle cx="610" cy="250" r="17" class="hub"/>
  <circle cx="675" cy="285" r="15" class="newnode"/>
  <text x="605" y="332" text-anchor="middle" class="small">choose endpoints with</text>
  <text x="605" y="352" text-anchor="middle" class="small">probability proportional to degree</text>

  <!-- Panel 4 -->
  <line x1="832" y1="125" x2="885" y2="160" class="edge"/>
  <line x1="832" y1="125" x2="790" y2="188" class="edge"/>
  <line x1="832" y1="125" x2="845" y2="235" class="edge"/>
  <line x1="832" y1="125" x2="900" y2="245" class="edge"/>
  <line x1="832" y1="125" x2="782" y2="280" class="edge"/>
  <line x1="845" y1="235" x2="900" y2="245" class="edge"/>
  <line x1="845" y1="235" x2="782" y2="280" class="edge"/>
  <line x1="845" y1="235" x2="885" y2="325" class="edge"/>
  <line x1="790" y1="188" x2="845" y2="235" class="edge"/>
  <circle cx="832" cy="125" r="30" class="hub"/>
  <circle cx="845" cy="235" r="21" class="hub"/>
  <circle cx="885" cy="160" r="12" class="node"/>
  <circle cx="790" cy="188" r="12" class="node"/>
  <circle cx="900" cy="245" r="12" class="node"/>
  <circle cx="782" cy="280" r="12" class="node"/>
  <circle cx="885" cy="325" r="12" class="node"/>
  <text x="840" y="362" text-anchor="middle" class="small">rich-get-richer growth</text>
  <text x="840" y="382" text-anchor="middle" class="small">creates a heavy tail</text>

  <rect x="86" y="458" width="788" height="52" fill="#fff7ed" stroke="#fed7aa" stroke-width="2" rx="8"/>
  <text x="480" y="481" text-anchor="middle" class="small">Preferential attachment rule: probability of attaching to node v is proportional to its current degree k_v.</text>
  <text x="480" y="501" text-anchor="middle" class="tiny">Nodes that are already well connected become even more likely to receive new edges.</text>
</svg>
