<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-labelledby="title desc">
  <title id="title">Random graph</title>
  <desc id="desc">A random graph with scattered edges, low clustering, and short average path length.</desc>
  <defs>
    <style>
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .edge { stroke: #2f7d3f; stroke-width: 3; fill: none; stroke-linecap: round; opacity: .85; }
      .node { fill: #fff; stroke: #1f2933; stroke-width: 3; }
      .title { font: 700 21px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; text-anchor: middle; }
      .label { font: 700 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; text-anchor: middle; }
      .tag { font: 600 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; text-anchor: middle; }
    </style>
  </defs>

  <rect class="panel" x="10" y="10" width="340" height="220" rx="14" />
  <text class="title" x="180" y="39">Random graph</text>

  <g class="edge">
    <path d="M109 75 L204 68" />
    <path d="M109 75 L78 137" />
    <path d="M204 68 L283 104" />
    <path d="M155 101 L248 159" />
    <path d="M78 137 L171 176" />
    <path d="M283 104 L248 159" />
    <path d="M204 68 L171 176" />
    <path d="M155 101 L109 75" />
    <path d="M248 159 L171 176" />
    <path d="M283 104 L155 101" />
    <path d="M78 137 L248 159" />
    <path d="M68 88 L109 75" />
    <path d="M286 185 L248 159" />
  </g>

  <g>
    <circle class="node" cx="109" cy="75" r="10" />
    <circle class="node" cx="204" cy="68" r="10" />
    <circle class="node" cx="283" cy="104" r="10" />
    <circle class="node" cx="155" cy="101" r="10" />
    <circle class="node" cx="78" cy="137" r="10" />
    <circle class="node" cx="248" cy="159" r="10" />
    <circle class="node" cx="171" cy="176" r="10" />
    <circle class="node" cx="286" cy="185" r="10" />
    <circle class="node" cx="68" cy="88" r="10" />
  </g>

  <text class="label" x="180" y="205">short paths</text>
  <text class="tag" x="180" y="222">but low clustering</text>
</svg>
