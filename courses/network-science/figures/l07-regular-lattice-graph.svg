<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-labelledby="title desc">
  <title id="title">Regular lattice graph</title>
  <desc id="desc">A regular grid-like lattice with local edges, high clustering, and long average path length.</desc>
  <defs>
    <style>
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .edge { stroke: #2f7d3f; stroke-width: 3; fill: none; stroke-linecap: round; }
      .node { fill: #fff; stroke: #1f2933; stroke-width: 3; }
      .title { font: 700 21px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; text-anchor: middle; }
      .label { font: 700 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; text-anchor: middle; }
      .tag { font: 600 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; text-anchor: middle; }
    </style>
  </defs>

  <rect class="panel" x="10" y="10" width="340" height="220" rx="14" />
  <text class="title" x="180" y="39">Regular lattice</text>

  <g class="edge">
    <path d="M107 76 H156 H205 H254" />
    <path d="M107 113 H156 H205 H254" />
    <path d="M107 150 H156 H205 H254" />
    <path d="M107 187 H156 H205 H254" />
    <path d="M107 76 V113 V150 V187" />
    <path d="M156 76 V113 V150 V187" />
    <path d="M205 76 V113 V150 V187" />
    <path d="M254 76 V113 V150 V187" />
    <path d="M107 76 L156 113 L205 150 L254 187" />
    <path d="M156 76 L205 113 L254 150" />
    <path d="M107 113 L156 150 L205 187" />
    <path d="M254 76 L205 113 L156 150 L107 187" />
    <path d="M205 76 L156 113 L107 150" />
    <path d="M254 113 L205 150 L156 187" />
  </g>

  <g>
    <circle class="node" cx="107" cy="76" r="8" />
    <circle class="node" cx="156" cy="76" r="8" />
    <circle class="node" cx="205" cy="76" r="8" />
    <circle class="node" cx="254" cy="76" r="8" />
    <circle class="node" cx="107" cy="113" r="8" />
    <circle class="node" cx="156" cy="113" r="8" />
    <circle class="node" cx="205" cy="113" r="8" />
    <circle class="node" cx="254" cy="113" r="8" />
    <circle class="node" cx="107" cy="150" r="8" />
    <circle class="node" cx="156" cy="150" r="8" />
    <circle class="node" cx="205" cy="150" r="8" />
    <circle class="node" cx="254" cy="150" r="8" />
    <circle class="node" cx="107" cy="187" r="8" />
    <circle class="node" cx="156" cy="187" r="8" />
    <circle class="node" cx="205" cy="187" r="8" />
    <circle class="node" cx="254" cy="187" r="8" />
  </g>

  <text class="label" x="180" y="209">local, regular structure</text>
  <text class="tag" x="180" y="225">high clustering, long paths</text>
</svg>
