<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', Arial, sans-serif">

  <text x="360" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Milgram's small-world experiment (1967)</text>
  <text x="360" y="40" text-anchor="middle" font-size="11" fill="#546e7a">Can a letter reach a stranger in Boston through a chain of personal acquaintances?</text>

  <!-- Chain of people -->
  <!-- Sender (Nebraska) -->
  <circle cx="60" cy="140" r="22" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
  <text x="60" y="135" text-anchor="middle" font-size="9" font-weight="bold" fill="white">sender</text>
  <text x="60" y="148" text-anchor="middle" font-size="8" fill="white">Nebraska</text>

  <!-- Intermediaries -->
  <line x1="82" y1="140" x2="148" y2="140" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="170" cy="140" r="16" fill="#90a4ae" stroke="#546e7a" stroke-width="1.5"/>
  <text x="170" y="144" text-anchor="middle" font-size="9" fill="white">?</text>

  <line x1="186" y1="140" x2="248" y2="140" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="270" cy="140" r="16" fill="#90a4ae" stroke="#546e7a" stroke-width="1.5"/>
  <text x="270" y="144" text-anchor="middle" font-size="9" fill="white">?</text>

  <line x1="286" y1="140" x2="348" y2="140" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="370" cy="140" r="16" fill="#90a4ae" stroke="#546e7a" stroke-width="1.5"/>
  <text x="370" y="144" text-anchor="middle" font-size="9" fill="white">?</text>

  <line x1="386" y1="140" x2="430" y2="140" stroke="#546e7a" stroke-width="2"/>
  <text x="450" y="144" text-anchor="middle" font-size="16" fill="#546e7a">···</text>
  <line x1="470" y1="140" x2="510" y2="140" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="530" cy="140" r="16" fill="#90a4ae" stroke="#546e7a" stroke-width="1.5"/>
  <text x="530" y="144" text-anchor="middle" font-size="9" fill="white">?</text>

  <line x1="546" y1="140" x2="618" y2="140" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- Target (Boston) -->
  <circle cx="640" cy="140" r="22" fill="#c62828" stroke="#7f0000" stroke-width="2"/>
  <text x="640" y="135" text-anchor="middle" font-size="9" font-weight="bold" fill="white">target</text>
  <text x="640" y="148" text-anchor="middle" font-size="8" fill="white">Boston</text>

  <!-- Step count -->
  <text x="350" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#37474f">median ≈ 6 steps</text>
  <text x="350" y="116" text-anchor="middle" font-size="10" fill="#757575">"six degrees of separation"</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#546e7a"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2e7d32"/>
    </marker>
  </defs>

  <!-- Key insight callouts -->
  <rect x="20" y="185" width="680" height="100" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/>
  <text x="360" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#37474f">Questions this experiment raises</text>
  <text x="30"  y="226" font-size="10" fill="#455a64">① Why do short paths exist at all in a network of 200 million people?</text>
  <text x="30"  y="242" font-size="10" fill="#455a64">② How can a network be locally clustered AND have short paths to strangers?</text>
  <text x="30"  y="258" font-size="10" fill="#455a64">③ If short paths exist, can ordinary people find them using only local knowledge?</text>
  <text x="30"  y="274" font-size="10" fill="#455a64">④ Only ~25% of chains arrived. Why did most fail?</text>
</svg>
