<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Four steps in the Watts-Strogatz model</title>
  <desc id="desc">Four panels show the Watts-Strogatz model: place nodes on a regular lattice, connect local neighbors, rewire a few edges, and obtain a small-world graph.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <style>
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.8; }
      .guide { stroke: #e2e8f0; stroke-width: 1.5; fill: none; }
      .local { stroke: #2e7d32; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .rewired { stroke: #ef6c00; stroke-width: 3; fill: none; stroke-linecap: round; stroke-dasharray: 7 5; }
      .old { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-dasharray: 4 5; opacity: 0.7; }
      .node { fill: #ffffff; stroke: #263238; stroke-width: 2; }
      .node-hot { fill: #fff3e0; stroke: #ef6c00; stroke-width: 2.4; }
      .head { font-size: 16px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .text { font-size: 12px; fill: #475569; text-anchor: middle; }
      .metric { font-size: 12px; font-weight: 800; fill: #334155; text-anchor: middle; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="1118" height="498" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <g transform="translate(35 42)">
    <rect width="235" height="390" rx="12" class="panel"/>
    <text x="117.5" y="34" class="head">1. Place nodes</text>
    <text x="117.5" y="55" class="text">arrange n nodes on a lattice</text>
    <g class="guide">
      <path d="M62 117 H117.5 H173" />
      <path d="M62 178 H117.5 H173" />
      <path d="M62 239 H117.5 H173" />
      <path d="M62 117 V178 V239" />
      <path d="M117.5 117 V178 V239" />
      <path d="M173 117 V178 V239" />
    </g>
    <circle cx="62" cy="117" r="9" class="node"/><circle cx="117.5" cy="117" r="9" class="node"/><circle cx="173" cy="117" r="9" class="node"/>
    <circle cx="62" cy="178" r="9" class="node"/><circle cx="117.5" cy="178" r="9" class="node"/><circle cx="173" cy="178" r="9" class="node"/>
    <circle cx="62" cy="239" r="9" class="node"/><circle cx="117.5" cy="239" r="9" class="node"/><circle cx="173" cy="239" r="9" class="node"/>
    <text x="117.5" y="330" class="metric">positions are regular</text>
  </g>

  <path d="M282 237 H325" class="arrow"/>

  <g transform="translate(335 42)">
    <rect width="235" height="390" rx="12" class="panel"/>
    <text x="117.5" y="34" class="head">2. Connect neighbors</text>
    <text x="117.5" y="55" class="text">local edges create clustering</text>
    <g class="local">
      <path d="M62 117 H117.5 H173" /><path d="M62 178 H117.5 H173" /><path d="M62 239 H117.5 H173" />
      <path d="M62 117 V178 V239" /><path d="M117.5 117 V178 V239" /><path d="M173 117 V178 V239" />
      <path d="M62 117 L117.5 178 L173 239" /><path d="M173 117 L117.5 178 L62 239" />
      <path d="M117.5 117 L173 178" /><path d="M62 178 L117.5 239" />
      <path d="M62 178 L117.5 117" /><path d="M117.5 239 L173 178" />
    </g>
    <circle cx="62" cy="117" r="9" class="node"/><circle cx="117.5" cy="117" r="9" class="node"/><circle cx="173" cy="117" r="9" class="node"/>
    <circle cx="62" cy="178" r="9" class="node"/><circle cx="117.5" cy="178" r="9" class="node"/><circle cx="173" cy="178" r="9" class="node"/>
    <circle cx="62" cy="239" r="9" class="node"/><circle cx="117.5" cy="239" r="9" class="node"/><circle cx="173" cy="239" r="9" class="node"/>
    <text x="117.5" y="330" class="metric">high C, long L</text>
  </g>

  <path d="M582 237 H625" class="arrow"/>

  <g transform="translate(635 42)">
    <rect width="235" height="390" rx="12" class="panel"/>
    <text x="117.5" y="34" class="head">3. Rewire with p</text>
    <text x="117.5" y="55" class="text">move a few endpoints randomly</text>
    <g class="local">
      <path d="M62 117 H117.5 H173" /><path d="M62 178 H117.5 H173" /><path d="M62 239 H117.5 H173" />
      <path d="M62 117 V178 V239" /><path d="M117.5 117 V178 V239" /><path d="M173 117 V178 V239" />
      <path d="M62 117 L117.5 178 L173 239" /><path d="M173 117 L117.5 178 L62 239" />
      <path d="M117.5 117 L173 178" /><path d="M62 178 L117.5 239" />
    </g>
    <line x1="62" y1="239" x2="117.5" y2="178" class="old"/>
    <path d="M62 239 C18 160 210 80 173 117" class="rewired"/>
    <circle cx="62" cy="117" r="9" class="node"/><circle cx="117.5" cy="117" r="9" class="node"/><circle cx="173" cy="117" r="9" class="node-hot"/>
    <circle cx="62" cy="178" r="9" class="node"/><circle cx="117.5" cy="178" r="9" class="node"/><circle cx="173" cy="178" r="9" class="node"/>
    <circle cx="62" cy="239" r="9" class="node-hot"/><circle cx="117.5" cy="239" r="9" class="node"/><circle cx="173" cy="239" r="9" class="node"/>
    <text x="117.5" y="330" class="metric">small p creates shortcuts</text>
  </g>

  <path d="M882 237 H925" class="arrow"/>

  <g transform="translate(935 42)">
    <rect width="150" height="390" rx="12" class="panel"/>
    <text x="75" y="34" class="head">4. Result</text>
    <text x="75" y="55" class="text">small-world regime</text>
    <g class="local">
      <path d="M34 128 H75 H116" /><path d="M34 178 H75 H116" /><path d="M34 228 H75 H116" />
      <path d="M34 128 V178 V228" /><path d="M75 128 V178 V228" /><path d="M116 128 V178 V228" />
      <path d="M34 128 L75 178 L116 228" /><path d="M116 128 L75 178 L34 228" />
    </g>
    <path d="M34 228 C0 150 153 83 116 128" class="rewired"/>
    <path d="M34 128 C78 86 140 170 116 228" class="rewired"/>
    <circle cx="34" cy="128" r="8" class="node-hot"/><circle cx="75" cy="128" r="8" class="node"/><circle cx="116" cy="128" r="8" class="node-hot"/>
    <circle cx="34" cy="178" r="8" class="node"/><circle cx="75" cy="178" r="8" class="node"/><circle cx="116" cy="178" r="8" class="node"/>
    <circle cx="34" cy="228" r="8" class="node-hot"/><circle cx="75" cy="228" r="8" class="node"/><circle cx="116" cy="228" r="8" class="node-hot"/>
    <text x="75" y="320" class="metric">high C</text>
    <text x="75" y="340" class="metric">short L</text>
  </g>
</svg>
