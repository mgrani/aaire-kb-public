<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" font-family="Arial, Helvetica, sans-serif">
  <title>Cold seed in five network topologies</title>
  <desc>Five small network sketches showing a cold starting from one red seed node in a line, random graph, small-world graph, scale-free graph, and community graph.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ef6c00"/>
    </marker>
    <style>
      .panel{fill:#fff;stroke:#cfd8dc;stroke-width:1.2}.title{font-size:13px;font-weight:700;fill:#263238}.small{font-size:10px;fill:#455a64}.edge{stroke:#90a4ae;stroke-width:1.6;fill:none}.jump{stroke:#90a4ae;stroke-width:1.5;fill:none;stroke-dasharray:4 3}.spread{stroke:#ef6c00;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.node{fill:#eceff1;stroke:#78909c;stroke-width:1.2}.seed{fill:#c62828;stroke:#7f0000;stroke-width:1.8}.near{fill:#ffe0b2;stroke:#ef6c00;stroke-width:1.5}.commA{fill:#e3f2fd;stroke:#1565c0;stroke-width:1.2}.commB{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.2}
    </style>
  </defs>

  <text x="210" y="24" text-anchor="middle" class="title">Same cold seed, different topology</text>

  <g transform="translate(20,44)">
    <rect class="panel" x="0" y="0" width="380" height="90" rx="8"/>
    <text x="18" y="22" class="title">Line / grid</text>
    <text x="18" y="40" class="small">local wave</text>
    <path class="edge" d="M150 47 L190 47 L230 47 L270 47 L310 47"/>
    <path class="spread" d="M190 47 L223 47"/>
    <circle class="node" cx="150" cy="47" r="12"/><circle class="seed" cx="190" cy="47" r="13"/><circle class="near" cx="230" cy="47" r="12"/><circle class="node" cx="270" cy="47" r="12"/><circle class="node" cx="310" cy="47" r="12"/>
  </g>

  <g transform="translate(20,144)">
    <rect class="panel" x="0" y="0" width="380" height="90" rx="8"/>
    <text x="18" y="22" class="title">Random graph</text>
    <text x="18" y="40" class="small">threshold-like outbreak</text>
    <path class="edge" d="M185 28 L238 38 M185 28 L204 70 M238 38 L300 25 M238 38 L280 68 M204 70 L280 68 M300 25 L330 62 M280 68 L330 62"/>
    <path class="spread" d="M185 28 L231 37"/><path class="spread" d="M238 38 L293 27"/>
    <circle class="seed" cx="185" cy="28" r="12"/><circle class="near" cx="238" cy="38" r="11"/><circle class="near" cx="300" cy="25" r="11"/><circle class="node" cx="204" cy="70" r="11"/><circle class="node" cx="280" cy="68" r="11"/><circle class="node" cx="330" cy="62" r="11"/>
  </g>

  <g transform="translate(20,244)">
    <rect class="panel" x="0" y="0" width="380" height="90" rx="8"/>
    <text x="18" y="22" class="title">Small-world</text>
    <text x="18" y="40" class="small">local spread plus jump</text>
    <path class="edge" d="M168 48 L198 30 L232 30 L262 48 L248 74 L208 74 Z"/>
    <path class="jump" d="M168 48 C225 6 300 18 330 56"/>
    <path class="spread" d="M168 48 L193 33"/><path class="spread" d="M168 48 C225 8 298 20 324 52"/>
    <circle class="seed" cx="168" cy="48" r="12"/><circle class="near" cx="198" cy="30" r="11"/><circle class="node" cx="232" cy="30" r="11"/><circle class="node" cx="262" cy="48" r="11"/><circle class="node" cx="248" cy="74" r="11"/><circle class="node" cx="208" cy="74" r="11"/><circle class="near" cx="330" cy="56" r="11"/>
  </g>

  <g transform="translate(20,344)">
    <rect class="panel" x="0" y="0" width="380" height="90" rx="8"/>
    <text x="18" y="22" class="title">Scale-free</text>
    <text x="18" y="40" class="small">hub dominates</text>
    <path class="edge" d="M242 48 L185 25 M242 48 L198 68 M242 48 L250 20 M242 48 L295 28 M242 48 L320 55 M242 48 L288 75 M185 25 L198 68"/>
    <path class="spread" d="M185 25 L235 45"/><path class="spread" d="M242 48 L291 29"/><path class="spread" d="M242 48 L314 55"/>
    <circle class="seed" cx="185" cy="25" r="11"/><circle class="near" cx="242" cy="48" r="17"/><circle class="node" cx="198" cy="68" r="10"/><circle class="node" cx="250" cy="20" r="10"/><circle class="near" cx="295" cy="28" r="10"/><circle class="near" cx="320" cy="55" r="10"/><circle class="node" cx="288" cy="75" r="10"/>
  </g>

  <g transform="translate(20,444)">
    <rect class="panel" x="0" y="0" width="380" height="90" rx="8"/>
    <text x="18" y="22" class="title">Community graph</text>
    <text x="18" y="40" class="small">fast inside, delayed bridge</text>
    <path class="edge" d="M170 35 L205 28 L225 58 L188 70 Z M170 35 L225 58 M205 28 L188 70"/>
    <path class="edge" d="M285 35 L320 28 L340 58 L302 70 Z M285 35 L340 58 M320 28 L302 70"/>
    <path class="jump" d="M225 58 L285 35"/>
    <path class="spread" d="M170 35 L199 29"/><path class="spread" d="M170 35 L220 56"/>
    <circle class="seed" cx="170" cy="35" r="11"/><circle class="near" cx="205" cy="28" r="10"/><circle class="near" cx="225" cy="58" r="10"/><circle class="commA" cx="188" cy="70" r="10"/>
    <circle class="commB" cx="285" cy="35" r="10"/><circle class="commB" cx="320" cy="28" r="10"/><circle class="commB" cx="340" cy="58" r="10"/><circle class="commB" cx="302" cy="70" r="10"/>
  </g>
</svg>
