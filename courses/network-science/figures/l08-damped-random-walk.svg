<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" font-family="Arial, Helvetica, sans-serif">
  <title>Plain and damped random walks</title>
  <desc>Comparison of a plain random walk drifting to a sink and a damped random walk restarting at the seed.</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#607d8b"/></marker>
    <marker id="h" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1565c0"/></marker>
    <marker id="r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f9a825"/></marker>
    <style>.panel{fill:#fff;stroke:#cfd8dc;stroke-width:1.2}.title{font-size:13px;font-weight:700;fill:#263238;text-anchor:middle}.small{font-size:10px;fill:#455a64;text-anchor:middle}.edge{stroke:#90a4ae;stroke-width:2;fill:none;marker-end:url(#a)}.hot{stroke:#1565c0;stroke-width:3;fill:none;marker-end:url(#h)}.restart{stroke:#f9a825;stroke-width:3;fill:none;marker-end:url(#r);stroke-dasharray:6 4}.node{fill:#eceff1;stroke:#78909c;stroke-width:1.4}.seed{fill:#1565c0;stroke:#0d47a1;stroke-width:2}.mass{fill:#64b5f6;stroke:#1565c0;stroke-width:1.8}.sink{fill:#ef9a9a;stroke:#c62828;stroke-width:1.8}.lw{font-size:11px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}.ld{font-size:11px;font-weight:700;fill:#263238;text-anchor:middle;dominant-baseline:middle}</style>
  </defs>
  <text x="180" y="24" class="title">Link following with and without restart</text>
  <text x="180" y="42" class="small">Q is the original query/seed.</text>
  <g transform="translate(28,70)">
    <rect class="panel" x="0" y="0" width="304" height="270" rx="8"/><text x="152" y="24" class="title">Plain walk</text><text x="152" y="42" class="small">x(t+1) = P x(t)</text>
    <path class="hot" d="M70 140 L125 92"/><path class="hot" d="M155 92 L210 140"/><path class="hot" d="M240 140 L270 140"/><path class="edge" d="M70 140 L125 188"/><path class="edge" d="M155 188 L210 140"/>
    <circle class="node" cx="55" cy="140" r="18"/><text class="ld" x="55" y="140">Q</text><circle class="node" cx="140" cy="84" r="18"/><text class="ld" x="140" y="84">B</text><circle class="node" cx="140" cy="196" r="18"/><text class="ld" x="140" y="196">C</text><circle class="mass" cx="225" cy="140" r="18"/><text class="lw" x="225" y="140">D</text><circle class="sink" cx="284" cy="140" r="18"/><text class="lw" x="284" y="140">S</text>
    <text x="152" y="245" class="small">Mass can drift into a sink/trap.</text>
  </g>
  <g transform="translate(28,382)">
    <rect class="panel" x="0" y="0" width="304" height="270" rx="8"/><text x="152" y="24" class="title">Damped walk</text><text x="152" y="42" class="small">alpha follows links; 1-alpha restarts</text>
    <path class="hot" d="M70 140 L125 92"/><path class="hot" d="M155 92 L210 140"/><path class="edge" d="M240 140 L270 140"/><path class="edge" d="M70 140 L125 188"/><path class="edge" d="M155 188 L210 140"/>
    <path class="restart" d="M225 162 C170 238 90 225 60 163"/><path class="restart" d="M282 162 C220 250 95 236 60 163"/>
    <circle class="seed" cx="55" cy="140" r="20"/><text class="lw" x="55" y="140">Q</text><circle class="mass" cx="140" cy="84" r="17"/><text class="lw" x="140" y="84">B</text><circle class="node" cx="140" cy="196" r="16"/><text class="ld" x="140" y="196">C</text><circle class="mass" cx="225" cy="140" r="16"/><text class="lw" x="225" y="140">D</text><circle class="node" cx="284" cy="140" r="14"/><text class="ld" x="284" y="140">S</text>
    <text x="152" y="245" class="small">Restart keeps mass near x0.</text>
  </g>
</svg>
