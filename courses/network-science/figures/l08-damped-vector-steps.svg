<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" font-family="Arial, Helvetica, sans-serif">
  <title>Damped diffusion vector steps</title>
  <desc>Three-step damped diffusion example with alpha 0.8, restart probability 0.2, and seed vector x0 at A.</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#78909c"/></marker>
    <marker id="h" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1565c0"/></marker>
    <marker id="r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f9a825"/></marker>
    <style>.panel{fill:#fff;stroke:#cfd8dc;stroke-width:1.2}.title{font-size:13px;font-weight:700;fill:#263238;text-anchor:middle}.small{font-size:10px;fill:#455a64;text-anchor:middle}.vec{font-size:10.8px;fill:#263238}.edge{stroke:#90a4ae;stroke-width:2;fill:none;marker-end:url(#a)}.hot{stroke:#1565c0;stroke-width:3;fill:none;marker-end:url(#h)}.restart{stroke:#f9a825;stroke-width:2.8;fill:none;marker-end:url(#r);stroke-dasharray:6 4}.n0{fill:#eceff1;stroke:#78909c;stroke-width:1.3}.n20{fill:#fff3e0;stroke:#f9a825;stroke-width:1.7}.n40{fill:#bbdefb;stroke:#1565c0;stroke-width:1.7}.n80{fill:#1976d2;stroke:#0d47a1;stroke-width:2}.lw{font-size:11px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}.ld{font-size:11px;font-weight:700;fill:#263238;text-anchor:middle;dominant-baseline:middle}</style>
  </defs>
  <text x="180" y="24" class="title">Damped state-vector update</text>
  <text x="180" y="42" class="small">alpha = 0.8, 1-alpha = 0.2, x0 = [1,0,0,0]</text>
  <g transform="translate(28,62)">
    <rect class="panel" x="0" y="0" width="304" height="200" rx="8"/><text x="152" y="22" class="title">t = 0</text>
    <path class="edge" d="M70 92 L120 58"/><path class="edge" d="M70 92 L120 126"/><path class="edge" d="M152 58 L202 92"/><path class="edge" d="M152 126 L202 92"/>
    <circle class="n80" cx="55" cy="92" r="17"/><text class="lw" x="55" y="92">A</text><circle class="n0" cx="136" cy="52" r="17"/><text class="ld" x="136" y="52">B</text><circle class="n0" cx="136" cy="132" r="17"/><text class="ld" x="136" y="132">C</text><circle class="n0" cx="216" cy="92" r="17"/><text class="ld" x="216" y="92">D</text>
    <text x="22" y="170" class="vec">x0 = [1, 0, 0, 0]</text>
  </g>
  <g transform="translate(28,284)">
    <rect class="panel" x="0" y="0" width="304" height="200" rx="8"/><text x="152" y="22" class="title">t = 1</text>
    <path class="hot" d="M70 92 L120 58"/><path class="hot" d="M70 92 L120 126"/><path class="edge" d="M152 58 L202 92"/><path class="edge" d="M152 126 L202 92"/><path class="restart" d="M216 116 C160 185 88 174 60 116"/>
    <circle class="n20" cx="55" cy="92" r="17"/><text class="ld" x="55" y="92">A</text><circle class="n40" cx="136" cy="52" r="17"/><text class="ld" x="136" y="52">B</text><circle class="n40" cx="136" cy="132" r="17"/><text class="ld" x="136" y="132">C</text><circle class="n0" cx="216" cy="92" r="17"/><text class="ld" x="216" y="92">D</text>
    <text x="22" y="170" class="vec">x1 = [0.2, 0.4, 0.4, 0]</text>
  </g>
  <g transform="translate(28,506)">
    <rect class="panel" x="0" y="0" width="304" height="200" rx="8"/><text x="152" y="22" class="title">t = 2</text>
    <path class="hot" d="M70 92 L120 58"/><path class="hot" d="M70 92 L120 126"/><path class="hot" d="M152 58 L202 92"/><path class="hot" d="M152 126 L202 92"/><path class="restart" d="M216 116 C160 185 88 174 60 116"/>
    <circle class="n20" cx="55" cy="92" r="17"/><text class="ld" x="55" y="92">A</text><circle class="n40" cx="136" cy="52" r="15"/><text class="ld" x="136" y="52">B</text><circle class="n40" cx="136" cy="132" r="15"/><text class="ld" x="136" y="132">C</text><circle class="n80" cx="216" cy="92" r="19"/><text class="lw" x="216" y="92">D</text>
    <text x="22" y="170" class="vec">x2 = [0.2, 0.08, 0.08, 0.64]</text>
  </g>
</svg>
