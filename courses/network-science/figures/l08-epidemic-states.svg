<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" font-family="Arial, Helvetica, sans-serif">
  <title>Epidemic model states and transitions</title>
  <desc>Definitions of S, I, and R states and the transition paths for SI, SIS, and SIR models.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#607d8b"/>
    </marker>
    <style>
      .title { font-size: 16px; font-weight: 700; fill: #263238; }
      .small { font-size: 11px; fill: #455a64; }
      .tiny { font-size: 9.8px; fill: #607d8b; }
      .panel { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.2; }
      .s { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2; }
      .i { fill: #ffebee; stroke: #c62828; stroke-width: 2; }
      .r { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; }
      .node-label { font-size: 22px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; fill: #263238; }
      .arrow { stroke: #607d8b; stroke-width: 2.8; fill: none; marker-end: url(#arrow); }
      .model { font-size: 15px; font-weight: 700; fill: #263238; }
    </style>
  </defs>

  <text x="460" y="28" text-anchor="middle" class="title">States and allowed transitions</text>
  <text x="460" y="48" text-anchor="middle" class="small">The model abbreviation tells us which state transitions are allowed.</text>

  <g transform="translate(35,78)">
    <rect class="panel" x="0" y="0" width="260" height="245" rx="8"/>
    <text x="130" y="28" text-anchor="middle" class="title">States</text>
    <circle class="s" cx="62" cy="82" r="30"/><text class="node-label" x="62" y="82">S</text>
    <text x="110" y="76" class="model">Susceptible</text>
    <text x="110" y="94" class="small">can still be infected</text>
    <circle class="i" cx="62" cy="145" r="30"/><text class="node-label" x="62" y="145">I</text>
    <text x="110" y="139" class="model">Infected</text>
    <text x="110" y="157" class="small">currently infectious</text>
    <circle class="r" cx="62" cy="208" r="30"/><text class="node-label" x="62" y="208">R</text>
    <text x="110" y="202" class="model">Recovered/Removed</text>
    <text x="110" y="220" class="small">no longer spreading</text>
  </g>

  <g transform="translate(330,78)">
    <rect class="panel" x="0" y="0" width="555" height="245" rx="8"/>
    <text x="278" y="28" text-anchor="middle" class="title">Allowed transitions</text>

    <text x="45" y="80" class="model">SI</text>
    <circle class="s" cx="125" cy="75" r="24"/><text class="node-label" x="125" y="75">S</text>
    <path class="arrow" d="M152 75 L214 75"/>
    <circle class="i" cx="245" cy="75" r="24"/><text class="node-label" x="245" y="75">I</text>
    <text x="300" y="80" class="small">infection/activation sticks forever</text>

    <text x="45" y="145" class="model">SIS</text>
    <circle class="s" cx="125" cy="140" r="24"/><text class="node-label" x="125" y="140">S</text>
    <path class="arrow" d="M152 140 L214 140"/>
    <circle class="i" cx="245" cy="140" r="24"/><text class="node-label" x="245" y="140">I</text>
    <path class="arrow" d="M245 166 C225 202 145 202 125 166"/>
    <text x="300" y="145" class="small">recovery returns to susceptible</text>

    <text x="45" y="210" class="model">SIR</text>
    <circle class="s" cx="125" cy="205" r="24"/><text class="node-label" x="125" y="205">S</text>
    <path class="arrow" d="M152 205 L214 205"/>
    <circle class="i" cx="245" cy="205" r="24"/><text class="node-label" x="245" y="205">I</text>
    <path class="arrow" d="M273 205 L335 205"/>
    <circle class="r" cx="365" cy="205" r="24"/><text class="node-label" x="365" y="205">R</text>
    <text x="415" y="210" class="small">recovery/removal blocks reinfection</text>
  </g>

  <text x="460" y="342" text-anchor="middle" class="tiny">Bridge from basic diffusion: inactive -> active is SI written in epidemic notation.</text>
</svg>
