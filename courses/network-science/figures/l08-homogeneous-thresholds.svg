  <title
     id="title1">Homogeneous network epidemic thresholds</title>
  <desc
     id="desc1">A homogeneous network sketch where most nodes have similar degree and average degree gives a first epidemic-threshold approximation for SIR and SIS.</desc>
  <style
     id="style1">
