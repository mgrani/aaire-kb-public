<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" font-family="Arial, Helvetica, sans-serif">
  <title>Linear threshold reinforcement over time</title>
  <desc>Three-step linear threshold example showing one active neighbor below threshold, two active neighbors meeting the threshold, and further spread.</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#78909c"/></marker>
    <marker id="g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2e7d32"/></marker>
    <style>.panel{fill:#fff;stroke:#cfd8dc;stroke-width:1.2}.title{font-size:13px;font-weight:700;fill:#263238;text-anchor:middle}.small{font-size:10px;fill:#455a64;text-anchor:middle}.edge{stroke:#90a4ae;stroke-width:2;fill:none;marker-end:url(#a)}.inf{stroke:#2e7d32;stroke-width:3;fill:none;marker-end:url(#g)}.off{fill:#eceff1;stroke:#78909c;stroke-width:1.4}.on{fill:#2e7d32;stroke:#1b5e20;stroke-width:2}.cand{fill:#fff3e0;stroke:#ef6c00;stroke-width:1.8}.bar{fill:#eceff1;stroke:#b0bec5;stroke-width:1}.fill{fill:#2e7d32}.warn{fill:#ef6c00}.lw{font-size:11px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}.ld{font-size:11px;font-weight:700;fill:#263238;text-anchor:middle;dominant-baseline:middle}.tiny{font-size:9.5px;fill:#607d8b;text-anchor:middle}</style>
  </defs>
  <text x="180" y="24" class="title">Threshold theta = 2</text>
  <text x="180" y="42" class="small">Fin activates after enough active-neighbor weight</text>
  <g transform="translate(28,62)">
    <rect class="panel" x="0" y="0" width="304" height="190" rx="8"/><text x="152" y="22" class="title">t = 0</text>
    <path class="inf" d="M76 92 L130 92"/><path class="edge" d="M152 58 L152 74"/><path class="edge" d="M172 92 L222 62"/><path class="edge" d="M172 92 L222 122"/>
    <circle class="on" cx="58" cy="92" r="17"/><text class="lw" x="58" y="92">Dia</text><circle class="off" cx="152" cy="52" r="17"/><text class="ld" x="152" y="52">Ben</text><circle class="cand" cx="152" cy="92" r="19"/><text class="ld" x="152" y="92">Fin</text><circle class="off" cx="242" cy="52" r="17"/><text class="ld" x="242" y="52">Gia</text><circle class="off" cx="242" cy="132" r="17"/><text class="ld" x="242" y="132">Hal</text>
    <rect class="bar" x="92" y="158" width="120" height="12" rx="3"/><rect class="warn" x="92" y="158" width="60" height="12" rx="3"/><text x="152" y="184" class="tiny">1 &lt; theta</text>
  </g>
  <g transform="translate(28,274)">
    <rect class="panel" x="0" y="0" width="304" height="190" rx="8"/><text x="152" y="22" class="title">t = 1</text>
    <path class="inf" d="M76 92 L130 92"/><path class="inf" d="M152 70 L152 74"/><path class="edge" d="M172 92 L222 62"/><path class="edge" d="M172 92 L222 122"/>
    <circle class="on" cx="58" cy="92" r="17"/><text class="lw" x="58" y="92">Dia</text><circle class="on" cx="152" cy="52" r="17"/><text class="lw" x="152" y="52">Ben</text><circle class="on" cx="152" cy="92" r="19"/><text class="lw" x="152" y="92">Fin</text><circle class="off" cx="242" cy="52" r="17"/><text class="ld" x="242" y="52">Gia</text><circle class="off" cx="242" cy="132" r="17"/><text class="ld" x="242" y="132">Hal</text>
    <rect class="bar" x="92" y="158" width="120" height="12" rx="3"/><rect class="fill" x="92" y="158" width="120" height="12" rx="3"/><text x="152" y="184" class="tiny">2 = theta</text>
  </g>
  <g transform="translate(28,486)">
    <rect class="panel" x="0" y="0" width="304" height="190" rx="8"/><text x="152" y="22" class="title">t = 2</text>
    <path class="inf" d="M76 92 L130 92"/><path class="inf" d="M152 70 L152 74"/><path class="inf" d="M172 92 L222 62"/><path class="inf" d="M172 92 L222 122"/>
    <circle class="on" cx="58" cy="92" r="17"/><text class="lw" x="58" y="92">Dia</text><circle class="on" cx="152" cy="52" r="17"/><text class="lw" x="152" y="52">Ben</text><circle class="on" cx="152" cy="92" r="19"/><text class="lw" x="152" y="92">Fin</text><circle class="on" cx="242" cy="52" r="17"/><text class="lw" x="242" y="52">Gia</text><circle class="on" cx="242" cy="132" r="17"/><text class="lw" x="242" y="132">Hal</text>
    <text x="152" y="176" class="tiny">Fin can reinforce others.</text>
  </g>
</svg>
