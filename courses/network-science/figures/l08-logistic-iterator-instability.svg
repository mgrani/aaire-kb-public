<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="Arial, Helvetica, sans-serif">
  <title>Logistic iterator sensitivity</title>
  <desc>Two logistic iterator trajectories with r equals 3.9 and nearly identical starting values diverge after several iterations.</desc>
  <style>
    .title{font-size:16px;font-weight:700;fill:#263238;text-anchor:middle}.small{font-size:11px;fill:#455a64}.axis{stroke:#90a4ae;stroke-width:1.4}.grid{stroke:#eceff1;stroke-width:1}.a{fill:none;stroke:#1565c0;stroke-width:2.8}.b{fill:none;stroke:#c62828;stroke-width:2.8}.dotA{fill:#1565c0}.dotB{fill:#c62828}.label{font-size:11px;font-weight:700}.note{font-size:10px;fill:#607d8b}
  </style>
  <rect width="600" height="330" fill="#fff"/>
  <text x="300" y="25" class="title">Two almost identical starts separate over iterations</text>
  <text x="300" y="44" text-anchor="middle" class="small">Logistic iterator: x(t+1) = 3.9 x(t)(1 - x(t))</text>

  <g transform="translate(0,0)">
    <line class="grid" x1="70" y1="60" x2="520" y2="60"/>
    <line class="grid" x1="70" y1="112.5" x2="520" y2="112.5"/>
    <line class="grid" x1="70" y1="165" x2="520" y2="165"/>
    <line class="grid" x1="70" y1="217.5" x2="520" y2="217.5"/>
    <line class="grid" x1="70" y1="270" x2="520" y2="270"/>
    <line class="axis" x1="70" y1="60" x2="70" y2="270"/>
    <line class="axis" x1="70" y1="270" x2="530" y2="270"/>
    <text x="64" y="64" text-anchor="end" class="note">1.0</text>
    <text x="64" y="169" text-anchor="end" class="note">0.5</text>
    <text x="64" y="274" text-anchor="end" class="note">0</text>
    <text x="530" y="288" text-anchor="end" class="note">iteration t</text>
    <g transform="rotate(-90 27 165)"><text x="27" y="165" text-anchor="middle" class="note">state x(t)</text></g>
  </g>

  <polyline class="a" points="70.0,186.0 92.5,73.4 115.0,220.9 137.5,123.4 160.0,97.4 182.5,150.0 205.0,69.4 227.5,234.9 250.0,155.9 272.5,66.8 295.0,244.4 317.5,182.4 340.0,70.9 362.5,229.8 385.0,143.2 407.5,74.0 430.0,218.9 452.5,119.3 475.0,104.1 497.5,134.1 520.0,83.0"/>
  <polyline class="b" points="70.0,185.8 92.5,73.3 115.0,221.5 137.5,124.5 160.0,95.7 182.5,154.5 205.0,67.3 227.5,242.5 250.0,176.8 272.5,67.9 295.0,240.5 317.5,171.2 340.0,66.0 362.5,247.4 385.0,191.4 407.5,78.2 430.0,205.3 452.5,95.4 475.0,155.3 497.5,67.0 520.0,243.6"/>

  <circle class="dotA" cx="70" cy="186" r="3.5"/><circle class="dotB" cx="70" cy="185.8" r="3.5"/>
  <circle class="dotA" cx="520" cy="83" r="4"/><circle class="dotB" cx="520" cy="243.6" r="4"/>
  <g>
    <line x1="375" y1="302" x2="400" y2="302" stroke="#1565c0" stroke-width="2.8"/>
    <text x="407" y="306" class="label" fill="#1565c0">x0 = 0.400</text>
    <line x1="375" y1="320" x2="400" y2="320" stroke="#c62828" stroke-width="2.8"/>
    <text x="407" y="324" class="label" fill="#c62828">x0 = 0.401</text>
  </g>
  <text x="88" y="306" class="note">The first steps look nearly identical.</text>
  <text x="88" y="324" class="note">Later steps can be qualitatively different.</text>
</svg>
