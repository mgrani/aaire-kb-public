<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" font-family="Arial, Helvetica, sans-serif">
  <title>Random-walk state vector over three steps</title>
  <desc>Three-step random-walk example showing probability mass moving from A to B and C, then recombining at D.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#78909c"/></marker>
    <marker id="hot" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1565c0"/></marker>
    <style>
      .panel{fill:#fff;stroke:#cfd8dc;stroke-width:1.2}.title{font-size:13px;font-weight:700;fill:#263238;text-anchor:middle}.small{font-size:10px;fill:#455a64;text-anchor:middle}.vec{font-size:11px;fill:#263238}.edge{stroke:#90a4ae;stroke-width:2;fill:none;marker-end:url(#arrow)}.hot{stroke:#1565c0;stroke-width:3;fill:none;marker-end:url(#hot)}.n0{fill:#eceff1;stroke:#78909c;stroke-width:1.4}.n50{fill:#64b5f6;stroke:#1565c0;stroke-width:1.8}.n100{fill:#1565c0;stroke:#0d47a1;stroke-width:2}.lw{font-size:11px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}.ld{font-size:11px;font-weight:700;fill:#263238;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <text x="180" y="24" class="title">Graph state and probability vector</text>
  <text x="180" y="42" class="small">node order: A, B, C, D, E</text>
  <g transform="translate(28,62)">
    <rect class="panel" x="0" y="0" width="304" height="190" rx="8"/><text x="152" y="22" class="title">t = 0</text>
    <path class="edge" d="M70 90 L118 55"/><path class="edge" d="M70 90 L118 125"/><path class="edge" d="M148 55 L196 90"/><path class="edge" d="M148 125 L196 90"/><path class="edge" d="M226 90 L260 90"/>
    <circle class="n100" cx="55" cy="90" r="16"/><text class="lw" x="55" y="90">A</text><circle class="n0" cx="135" cy="50" r="16"/><text class="ld" x="135" y="50">B</text><circle class="n0" cx="135" cy="130" r="16"/><text class="ld" x="135" y="130">C</text><circle class="n0" cx="210" cy="90" r="16"/><text class="ld" x="210" y="90">D</text><circle class="n0" cx="270" cy="90" r="16"/><text class="ld" x="270" y="90">E</text>
    <text x="22" y="170" class="vec">x0 = [1, 0, 0, 0, 0]</text>
  </g>
  <g transform="translate(28,274)">
    <rect class="panel" x="0" y="0" width="304" height="190" rx="8"/><text x="152" y="22" class="title">t = 1</text>
    <path class="hot" d="M70 90 L118 55"/><path class="hot" d="M70 90 L118 125"/><path class="edge" d="M148 55 L196 90"/><path class="edge" d="M148 125 L196 90"/><path class="edge" d="M226 90 L260 90"/>
    <text x="86" y="61" class="vec">1/2</text><text x="86" y="128" class="vec">1/2</text>
    <circle class="n0" cx="55" cy="90" r="16"/><text class="ld" x="55" y="90">A</text><circle class="n50" cx="135" cy="50" r="16"/><text class="ld" x="135" y="50">B</text><circle class="n50" cx="135" cy="130" r="16"/><text class="ld" x="135" y="130">C</text><circle class="n0" cx="210" cy="90" r="16"/><text class="ld" x="210" y="90">D</text><circle class="n0" cx="270" cy="90" r="16"/><text class="ld" x="270" y="90">E</text>
    <text x="22" y="170" class="vec">x1 = [0, 1/2, 1/2, 0, 0]</text>
  </g>
  <g transform="translate(28,486)">
    <rect class="panel" x="0" y="0" width="304" height="190" rx="8"/><text x="152" y="22" class="title">t = 2</text>
    <path class="edge" d="M70 90 L118 55"/><path class="edge" d="M70 90 L118 125"/><path class="hot" d="M148 55 L196 90"/><path class="hot" d="M148 125 L196 90"/><path class="edge" d="M226 90 L260 90"/>
    <circle class="n0" cx="55" cy="90" r="16"/><text class="ld" x="55" y="90">A</text><circle class="n0" cx="135" cy="50" r="16"/><text class="ld" x="135" y="50">B</text><circle class="n0" cx="135" cy="130" r="16"/><text class="ld" x="135" y="130">C</text><circle class="n100" cx="210" cy="90" r="16"/><text class="lw" x="210" y="90">D</text><circle class="n0" cx="270" cy="90" r="16"/><text class="ld" x="270" y="90">E</text>
    <text x="22" y="170" class="vec">x2 = [0, 0, 0, 1, 0]</text>
  </g>
</svg>
