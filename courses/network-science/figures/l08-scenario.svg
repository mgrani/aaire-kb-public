<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Segoe UI', Arial, sans-serif">

  <text x="360" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Same network, two processes — opposite outcomes</text>
  <text x="360" y="40" text-anchor="middle" font-size="11" fill="#546e7a">A rumor (simple contagion) crosses the bridge; a tool adoption (complex contagion) does not</text>

  <!-- ===== LEFT: Simple contagion (rumor) ===== -->
  <g transform="translate(0,50)">
    <rect x="12" y="0" width="336" height="310" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="180" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">Simple contagion (rumor)</text>
    <text x="180" y="38" text-anchor="middle" font-size="10" fill="#2e7d32">one hearing suffices → bridge helps</text>

    <!-- Team A edges -->
    <line x1="80" y1="120" x2="140" y2="80" stroke="#90a4ae" stroke-width="3"/>
    <line x1="80" y1="120" x2="140" y2="180" stroke="#90a4ae" stroke-width="3"/>
    <line x1="140" y1="80" x2="140" y2="180" stroke="#90a4ae" stroke-width="3"/>
    <line x1="140" y1="80" x2="200" y2="120" stroke="#90a4ae" stroke-width="3"/>
    <line x1="140" y1="180" x2="200" y2="120" stroke="#90a4ae" stroke-width="3"/>

    <!-- Bridge -->
    <line x1="200" y1="120" x2="260" y2="100" stroke="#2e7d32" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="228" y="96" font-size="9" font-weight="bold" fill="#2e7d32">crosses!</text>

    <!-- Team B edges -->
    <line x1="260" y1="100" x2="260" y2="180" stroke="#90a4ae" stroke-width="3"/>
    <line x1="260" y1="100" x2="310" y2="140" stroke="#90a4ae" stroke-width="3"/>
    <line x1="260" y1="180" x2="310" y2="140" stroke="#90a4ae" stroke-width="3"/>

    <!-- Nodes — Team A all infected (green) -->
    <circle cx="80"  cy="120" r="14" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
    <text x="80"  y="124" text-anchor="middle" font-size="9" font-weight="bold" fill="white">Ana</text>
    <circle cx="140" cy="80"  r="14" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
    <text x="140" y="84"  text-anchor="middle" font-size="9" font-weight="bold" fill="white">Ben</text>
    <circle cx="140" cy="180" r="14" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
    <text x="140" y="184" text-anchor="middle" font-size="9" font-weight="bold" fill="white">Cai</text>
    <circle cx="200" cy="120" r="14" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
    <text x="200" y="124" text-anchor="middle" font-size="9" font-weight="bold" fill="white">Dia</text>

    <!-- Team B also infected via bridge -->
    <circle cx="260" cy="100" r="14" fill="#66bb6a" stroke="#1b5e20" stroke-width="2"/>
    <text x="260" y="104" text-anchor="middle" font-size="9" font-weight="bold" fill="white">Fin</text>
    <circle cx="260" cy="180" r="14" fill="#66bb6a" stroke="#1b5e20" stroke-width="2"/>
    <text x="260" y="184" text-anchor="middle" font-size="9" font-weight="bold" fill="white">Gia</text>
    <circle cx="310" cy="140" r="14" fill="#66bb6a" stroke="#1b5e20" stroke-width="2"/>
    <text x="310" y="144" text-anchor="middle" font-size="9" font-weight="bold" fill="white">Hal</text>

    <text x="180" y="230" text-anchor="middle" font-size="10" fill="#1b5e20" font-weight="bold">✓ rumor reaches everyone</text>
    <text x="180" y="248" text-anchor="middle" font-size="9" fill="#2e7d32">Dia tells Fin; Fin tells Gia and Hal</text>

    <!-- Spread arrow -->
    <text x="180" y="278" text-anchor="middle" font-size="10" fill="#1b5e20">weak ties = accelerators</text>
  </g>

  <!-- ===== RIGHT: Complex contagion (tool) ===== -->
  <g transform="translate(360,50)">
    <rect x="12" y="0" width="336" height="310" rx="10" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
    <text x="180" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#b71c1c">Complex contagion (new tool)</text>
    <text x="180" y="38" text-anchor="middle" font-size="10" fill="#c62828">threshold q = 2 contacts → bridge blocks</text>

    <!-- Team A edges -->
    <line x1="80" y1="120" x2="140" y2="80" stroke="#90a4ae" stroke-width="3"/>
    <line x1="80" y1="120" x2="140" y2="180" stroke="#90a4ae" stroke-width="3"/>
    <line x1="140" y1="80" x2="140" y2="180" stroke="#90a4ae" stroke-width="3"/>
    <line x1="140" y1="80" x2="200" y2="120" stroke="#90a4ae" stroke-width="3"/>
    <line x1="140" y1="180" x2="200" y2="120" stroke="#90a4ae" stroke-width="3"/>

    <!-- Bridge (blocked!) -->
    <line x1="200" y1="120" x2="260" y2="100" stroke="#c62828" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="230" y="96" font-size="9" font-weight="bold" fill="#c62828">blocked!</text>

    <!-- Team B edges -->
    <line x1="260" y1="100" x2="260" y2="180" stroke="#90a4ae" stroke-width="3"/>
    <line x1="260" y1="100" x2="310" y2="140" stroke="#90a4ae" stroke-width="3"/>
    <line x1="260" y1="180" x2="310" y2="140" stroke="#90a4ae" stroke-width="3"/>

    <!-- Team A adopted (red = active) -->
    <circle cx="80"  cy="120" r="14" fill="#c62828" stroke="#7f0000" stroke-width="2"/>
    <text x="80"  y="124" text-anchor="middle" font-size="9" font-weight="bold" fill="white">Ana</text>
    <circle cx="140" cy="80"  r="14" fill="#c62828" stroke="#7f0000" stroke-width="2"/>
    <text x="140" y="84"  text-anchor="middle" font-size="9" font-weight="bold" fill="white">Ben</text>
    <circle cx="140" cy="180" r="14" fill="#c62828" stroke="#7f0000" stroke-width="2"/>
    <text x="140" y="184" text-anchor="middle" font-size="9" font-weight="bold" fill="white">Cai</text>
    <circle cx="200" cy="120" r="14" fill="#c62828" stroke="#7f0000" stroke-width="2"/>
    <text x="200" y="124" text-anchor="middle" font-size="9" font-weight="bold" fill="white">Dia</text>

    <!-- Team B NOT adopted (grey) -->
    <circle cx="260" cy="100" r="14" fill="#bdbdbd" stroke="#757575" stroke-width="2"/>
    <text x="260" y="104" text-anchor="middle" font-size="9" font-weight="bold" fill="white">Fin</text>
    <circle cx="260" cy="180" r="14" fill="#bdbdbd" stroke="#757575" stroke-width="2"/>
    <text x="260" y="184" text-anchor="middle" font-size="9" font-weight="bold" fill="white">Gia</text>
    <circle cx="310" cy="140" r="14" fill="#bdbdbd" stroke="#757575" stroke-width="2"/>
    <text x="310" y="144" text-anchor="middle" font-size="9" font-weight="bold" fill="white">Hal</text>

    <text x="180" y="230" text-anchor="middle" font-size="10" fill="#b71c1c" font-weight="bold">✗ tool stays in Team A</text>
    <text x="180" y="248" text-anchor="middle" font-size="9" fill="#c62828">Fin needs 2 adopters but only Dia uses it</text>

    <text x="180" y="278" text-anchor="middle" font-size="10" fill="#b71c1c">weak ties = barriers</text>
  </g>

  <!-- Bottom note -->
  <rect x="20" y="368" width="680" height="26" rx="6" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/>
  <text x="360" y="386" text-anchor="middle" font-size="10" fill="#455a64">The Dia–Fin bridge helps simple contagion but blocks complex contagion. Structure alone does not determine the outcome — the process matters.</text>
</svg>
