<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Arial, Helvetica, sans-serif">
  <title>SI, SIS, and SIR compared on the same path graph</title>
  <desc>Three panels compare SI, SIS, and SIR dynamics on the same five-node path with B initially infected.</desc>
  <style>
    .panel { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.2; }
    .title { font-size: 14px; font-weight: 700; fill: #263238; }
    .small { font-size: 10.5px; fill: #455a64; }
    .tiny { font-size: 9.5px; fill: #607d8b; }
    .edge { stroke: #90a4ae; stroke-width: 2.4; }
    .s { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1.6; }
    .i { fill: #ffebee; stroke: #c62828; stroke-width: 1.8; }
    .r { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1.8; }
    .label { font-size: 10px; font-weight: 700; fill: #263238; text-anchor: middle; dominant-baseline: middle; }
    .time { font-size: 11px; font-weight: 700; fill: #455a64; text-anchor: end; }
  </style>

  <text x="480" y="28" text-anchor="middle" class="title">Path graph states over time</text>
  <text x="480" y="48" text-anchor="middle" class="small">Path graph A-B-C-D-E, with B infected at t = 0. Colors: S susceptible, I infected, R recovered/removed.</text>

  <!-- Helper pattern drawn manually for each row -->
  <g transform="translate(25,78)">
    <rect class="panel" x="0" y="0" width="292" height="390" rx="8"/>
    <text x="146" y="25" text-anchor="middle" class="title">SI: infection accumulates</text>
    <text x="146" y="43" text-anchor="middle" class="small">S -> I, no recovery</text>

    <g transform="translate(32,75)">
      <text x="0" y="5" class="time">t0</text>
      <line class="edge" x1="35" y1="0" x2="215" y2="0"/>
      <circle class="s" cx="35" cy="0" r="15"/><text class="label" x="35" y="0">A</text>
      <circle class="i" cx="80" cy="0" r="15"/><text class="label" x="80" y="0">B</text>
      <circle class="s" cx="125" cy="0" r="15"/><text class="label" x="125" y="0">C</text>
      <circle class="s" cx="170" cy="0" r="15"/><text class="label" x="170" y="0">D</text>
      <circle class="s" cx="215" cy="0" r="15"/><text class="label" x="215" y="0">E</text>
    </g>
    <g transform="translate(32,135)">
      <text x="0" y="5" class="time">t1</text>
      <line class="edge" x1="35" y1="0" x2="215" y2="0"/>
      <circle class="i" cx="35" cy="0" r="15"/><text class="label" x="35" y="0">A</text>
      <circle class="i" cx="80" cy="0" r="15"/><text class="label" x="80" y="0">B</text>
      <circle class="i" cx="125" cy="0" r="15"/><text class="label" x="125" y="0">C</text>
      <circle class="s" cx="170" cy="0" r="15"/><text class="label" x="170" y="0">D</text>
      <circle class="s" cx="215" cy="0" r="15"/><text class="label" x="215" y="0">E</text>
    </g>
    <g transform="translate(32,195)">
      <text x="0" y="5" class="time">t2</text>
      <line class="edge" x1="35" y1="0" x2="215" y2="0"/>
      <circle class="i" cx="35" cy="0" r="15"/><text class="label" x="35" y="0">A</text>
      <circle class="i" cx="80" cy="0" r="15"/><text class="label" x="80" y="0">B</text>
      <circle class="i" cx="125" cy="0" r="15"/><text class="label" x="125" y="0">C</text>
      <circle class="i" cx="170" cy="0" r="15"/><text class="label" x="170" y="0">D</text>
      <circle class="s" cx="215" cy="0" r="15"/><text class="label" x="215" y="0">E</text>
    </g>
    <g transform="translate(32,255)">
      <text x="0" y="5" class="time">t3</text>
      <line class="edge" x1="35" y1="0" x2="215" y2="0"/>
      <circle class="i" cx="35" cy="0" r="15"/><text class="label" x="35" y="0">A</text>
      <circle class="i" cx="80" cy="0" r="15"/><text class="label" x="80" y="0">B</text>
      <circle class="i" cx="125" cy="0" r="15"/><text class="label" x="125" y="0">C</text>
      <circle class="i" cx="170" cy="0" r="15"/><text class="label" x="170" y="0">D</text>
      <circle class="i" cx="215" cy="0" r="15"/><text class="label" x="215" y="0">E</text>
    </g>
    <text x="146" y="350" text-anchor="middle" class="tiny">Outcome: cumulative reach.</text>
  </g>

  <g transform="translate(334,78)">
    <rect class="panel" x="0" y="0" width="292" height="390" rx="8"/>
    <text x="146" y="25" text-anchor="middle" class="title">SIS: infection can return</text>
    <text x="146" y="43" text-anchor="middle" class="small">S -> I -> S</text>
    <g transform="translate(32,75)">
      <text x="0" y="5" class="time">t0</text><line class="edge" x1="35" y1="0" x2="215" y2="0"/>
      <circle class="s" cx="35" cy="0" r="15"/><text class="label" x="35" y="0">A</text><circle class="i" cx="80" cy="0" r="15"/><text class="label" x="80" y="0">B</text><circle class="s" cx="125" cy="0" r="15"/><text class="label" x="125" y="0">C</text><circle class="s" cx="170" cy="0" r="15"/><text class="label" x="170" y="0">D</text><circle class="s" cx="215" cy="0" r="15"/><text class="label" x="215" y="0">E</text>
    </g>
    <g transform="translate(32,135)">
      <text x="0" y="5" class="time">t1</text><line class="edge" x1="35" y1="0" x2="215" y2="0"/>
      <circle class="i" cx="35" cy="0" r="15"/><text class="label" x="35" y="0">A</text><circle class="s" cx="80" cy="0" r="15"/><text class="label" x="80" y="0">B</text><circle class="i" cx="125" cy="0" r="15"/><text class="label" x="125" y="0">C</text><circle class="s" cx="170" cy="0" r="15"/><text class="label" x="170" y="0">D</text><circle class="s" cx="215" cy="0" r="15"/><text class="label" x="215" y="0">E</text>
    </g>
    <g transform="translate(32,195)">
      <text x="0" y="5" class="time">t2</text><line class="edge" x1="35" y1="0" x2="215" y2="0"/>
      <circle class="s" cx="35" cy="0" r="15"/><text class="label" x="35" y="0">A</text><circle class="i" cx="80" cy="0" r="15"/><text class="label" x="80" y="0">B</text><circle class="s" cx="125" cy="0" r="15"/><text class="label" x="125" y="0">C</text><circle class="i" cx="170" cy="0" r="15"/><text class="label" x="170" y="0">D</text><circle class="s" cx="215" cy="0" r="15"/><text class="label" x="215" y="0">E</text>
    </g>
    <g transform="translate(32,255)">
      <text x="0" y="5" class="time">t3</text><line class="edge" x1="35" y1="0" x2="215" y2="0"/>
      <circle class="i" cx="35" cy="0" r="15"/><text class="label" x="35" y="0">A</text><circle class="s" cx="80" cy="0" r="15"/><text class="label" x="80" y="0">B</text><circle class="i" cx="125" cy="0" r="15"/><text class="label" x="125" y="0">C</text><circle class="s" cx="170" cy="0" r="15"/><text class="label" x="170" y="0">D</text><circle class="i" cx="215" cy="0" r="15"/><text class="label" x="215" y="0">E</text>
    </g>
    <text x="146" y="350" text-anchor="middle" class="tiny">Outcome: persistence or repeated outbreaks.</text>
  </g>

  <g transform="translate(643,78)">
    <rect class="panel" x="0" y="0" width="292" height="390" rx="8"/>
    <text x="146" y="25" text-anchor="middle" class="title">SIR: infection leaves immunity</text>
    <text x="146" y="43" text-anchor="middle" class="small">S -> I -> R</text>
    <g transform="translate(32,75)">
      <text x="0" y="5" class="time">t0</text><line class="edge" x1="35" y1="0" x2="215" y2="0"/>
      <circle class="s" cx="35" cy="0" r="15"/><text class="label" x="35" y="0">A</text><circle class="i" cx="80" cy="0" r="15"/><text class="label" x="80" y="0">B</text><circle class="s" cx="125" cy="0" r="15"/><text class="label" x="125" y="0">C</text><circle class="s" cx="170" cy="0" r="15"/><text class="label" x="170" y="0">D</text><circle class="s" cx="215" cy="0" r="15"/><text class="label" x="215" y="0">E</text>
    </g>
    <g transform="translate(32,135)">
      <text x="0" y="5" class="time">t1</text><line class="edge" x1="35" y1="0" x2="215" y2="0"/>
      <circle class="i" cx="35" cy="0" r="15"/><text class="label" x="35" y="0">A</text><circle class="r" cx="80" cy="0" r="15"/><text class="label" x="80" y="0">B</text><circle class="i" cx="125" cy="0" r="15"/><text class="label" x="125" y="0">C</text><circle class="s" cx="170" cy="0" r="15"/><text class="label" x="170" y="0">D</text><circle class="s" cx="215" cy="0" r="15"/><text class="label" x="215" y="0">E</text>
    </g>
    <g transform="translate(32,195)">
      <text x="0" y="5" class="time">t2</text><line class="edge" x1="35" y1="0" x2="215" y2="0"/>
      <circle class="r" cx="35" cy="0" r="15"/><text class="label" x="35" y="0">A</text><circle class="r" cx="80" cy="0" r="15"/><text class="label" x="80" y="0">B</text><circle class="r" cx="125" cy="0" r="15"/><text class="label" x="125" y="0">C</text><circle class="i" cx="170" cy="0" r="15"/><text class="label" x="170" y="0">D</text><circle class="s" cx="215" cy="0" r="15"/><text class="label" x="215" y="0">E</text>
    </g>
    <g transform="translate(32,255)">
      <text x="0" y="5" class="time">t3</text><line class="edge" x1="35" y1="0" x2="215" y2="0"/>
      <circle class="r" cx="35" cy="0" r="15"/><text class="label" x="35" y="0">A</text><circle class="r" cx="80" cy="0" r="15"/><text class="label" x="80" y="0">B</text><circle class="r" cx="125" cy="0" r="15"/><text class="label" x="125" y="0">C</text><circle class="r" cx="170" cy="0" r="15"/><text class="label" x="170" y="0">D</text><circle class="i" cx="215" cy="0" r="15"/><text class="label" x="215" y="0">E</text>
    </g>
    <text x="146" y="350" text-anchor="middle" class="tiny">Outcome: peak timing and final size.</text>
  </g>
</svg>
