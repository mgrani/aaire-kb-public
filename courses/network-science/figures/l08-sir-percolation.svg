<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 760" font-family="Arial, Helvetica, sans-serif">
  <title>SIR percolation view</title>
  <desc>Three-panel illustration of SIR percolation: original contact graph, sampled open transmission edges, and the reachable outbreak cluster from the seed.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#78909c"/>
    </marker>
    <style>
      .panel{fill:#fff;stroke:#cfd8dc;stroke-width:1.2}.title{font-size:14px;font-weight:700;fill:#263238;text-anchor:middle}.small{font-size:10.5px;fill:#455a64;text-anchor:middle}.edge{stroke:#90a4ae;stroke-width:2;fill:none}.open{stroke:#2e7d32;stroke-width:3;fill:none}.closed{stroke:#b0bec5;stroke-width:2;stroke-dasharray:5 4;fill:none}.reach{stroke:#ef6c00;stroke-width:3;fill:none;marker-end:url(#arrow)}.node{fill:#eceff1;stroke:#78909c;stroke-width:1.4}.seed{fill:#c62828;stroke:#7f0000;stroke-width:2}.hit{fill:#ffe0b2;stroke:#ef6c00;stroke-width:1.8}.miss{fill:#f5f5f5;stroke:#9e9e9e;stroke-width:1.3}.label{font-size:12px;font-weight:700;fill:#263238;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>

  <g transform="translate(20,18)">
    <rect class="panel" x="0" y="0" width="260" height="220" rx="8"/>
    <text x="130" y="24" class="title">1. Contact graph</text>
    <text x="130" y="42" class="small">edges are possible transmission paths</text>
    <path class="edge" d="M68 106 L128 70 L190 104 L160 164 L88 162 Z"/>
    <path class="edge" d="M128 70 L160 164 M68 106 L190 104 M190 104 L222 152"/>
    <circle class="seed" cx="68" cy="106" r="16"/><text class="label" x="68" y="106" fill="#fff">A</text>
    <circle class="node" cx="128" cy="70" r="15"/><text class="label" x="128" y="70">B</text>
    <circle class="node" cx="190" cy="104" r="15"/><text class="label" x="190" y="104">C</text>
    <circle class="node" cx="160" cy="164" r="15"/><text class="label" x="160" y="164">D</text>
    <circle class="node" cx="88" cy="162" r="15"/><text class="label" x="88" y="162">E</text>
    <circle class="node" cx="222" cy="152" r="15"/><text class="label" x="222" y="152">F</text>
  </g>

  <path d="M150 248 L150 278" stroke="#90a4ae" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(20,286)">
    <rect class="panel" x="0" y="0" width="260" height="220" rx="8"/>
    <text x="130" y="24" class="title">2. Keep successful edges</text>
    <text x="130" y="42" class="small">each edge is open with probability T</text>
    <path class="open" d="M68 106 L128 70"/>
    <path class="closed" d="M128 70 L190 104"/>
    <path class="open" d="M190 104 L160 164"/>
    <path class="open" d="M160 164 L88 162"/>
    <path class="closed" d="M88 162 L68 106"/>
    <path class="closed" d="M128 70 L160 164"/>
    <path class="open" d="M68 106 L190 104"/>
    <path class="closed" d="M190 104 L222 152"/>
    <circle class="seed" cx="68" cy="106" r="16"/><text class="label" x="68" y="106" fill="#fff">A</text>
    <circle class="node" cx="128" cy="70" r="15"/><text class="label" x="128" y="70">B</text>
    <circle class="node" cx="190" cy="104" r="15"/><text class="label" x="190" y="104">C</text>
    <circle class="node" cx="160" cy="164" r="15"/><text class="label" x="160" y="164">D</text>
    <circle class="node" cx="88" cy="162" r="15"/><text class="label" x="88" y="162">E</text>
    <circle class="node" cx="222" cy="152" r="15"/><text class="label" x="222" y="152">F</text>
  </g>

  <path d="M150 516 L150 546" stroke="#90a4ae" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(20,554)">
    <rect class="panel" x="0" y="0" width="260" height="220" rx="8"/>
    <text x="130" y="24" class="title">3. Reachable cluster</text>
    <text x="130" y="42" class="small">final outbreak size from seed A</text>
    <path class="reach" d="M68 106 L122 73"/>
    <path class="reach" d="M68 106 L184 104"/>
    <path class="reach" d="M190 104 L163 158"/>
    <path class="reach" d="M160 164 L94 162"/>
    <path class="closed" d="M190 104 L222 152"/>
    <circle class="seed" cx="68" cy="106" r="16"/><text class="label" x="68" y="106" fill="#fff">A</text>
    <circle class="hit" cx="128" cy="70" r="15"/><text class="label" x="128" y="70">B</text>
    <circle class="hit" cx="190" cy="104" r="15"/><text class="label" x="190" y="104">C</text>
    <circle class="hit" cx="160" cy="164" r="15"/><text class="label" x="160" y="164">D</text>
    <circle class="hit" cx="88" cy="162" r="15"/><text class="label" x="88" y="162">E</text>
    <circle class="miss" cx="222" cy="152" r="15"/><text class="label" x="222" y="152">F</text>
    <text x="130" y="198" class="small">A reaches 5 of 6 nodes in this sample.</text>
  </g>
</svg>
