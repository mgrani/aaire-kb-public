<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" font-family="Arial, Helvetica, sans-serif">
  <title>SIR state machine</title>
  <desc>Vertical three-state SIR epidemic state machine showing infection from susceptible to infected and recovery or removal into an absorbing recovered state.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#607d8b"/></marker>
    <style>
      .title{font-size:17px;font-weight:700;fill:#263238;text-anchor:middle}.small{font-size:11px;fill:#455a64;text-anchor:middle}.s{fill:#e3f2fd;stroke:#1565c0;stroke-width:2.4}.i{fill:#ffebee;stroke:#c62828;stroke-width:2.4}.r{fill:#e8f5e9;stroke:#2e7d32;stroke-width:2.4}.label{font-size:30px;font-weight:700;fill:#263238;text-anchor:middle;dominant-baseline:middle}.state{font-size:14px;font-weight:700;fill:#263238;text-anchor:middle}.arrow{stroke:#607d8b;stroke-width:3;fill:none;marker-end:url(#arrow)}.rate{font-size:13px;font-weight:700;fill:#263238;text-anchor:middle}.note{font-size:10.5px;fill:#607d8b;text-anchor:middle}.stay{stroke:#2e7d32;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="160" y="28" class="title">SIR: recovery blocks reinfection</text>
  <text x="160" y="46" class="small">Recovered/removed is absorbing.</text>

  <circle class="s" cx="160" cy="110" r="44"/>
  <text class="label" x="160" y="106">S</text>
  <text class="state" x="160" y="158">Susceptible</text>

  <path class="arrow" d="M160 160 L160 238"/>
  <text class="rate" x="230" y="195">infection</text>
  <text class="note" x="230" y="213">beta over</text>
  <text class="note" x="230" y="229">S-I edges</text>

  <circle class="i" cx="160" cy="292" r="44"/>
  <text class="label" x="160" y="288">I</text>
  <text class="state" x="160" y="340">Infected</text>

  <path class="arrow" d="M160 342 L160 420"/>
  <text class="rate" x="236" y="376">recovery</text>
  <text class="rate" x="236" y="393">or removal</text>
  <text class="note" x="236" y="411">gamma</text>

  <circle class="r" cx="160" cy="474" r="44"/>
  <text class="label" x="160" y="470">R</text>
  <text class="state" x="160" y="522">Recovered/Removed</text>

  <path class="stay" d="M118 489 C66 518 66 580 135 583 C192 586 213 545 190 510"/>
  <text class="note" x="112" y="608">stays R</text>
</svg>
