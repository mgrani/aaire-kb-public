<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" font-family="Arial, Helvetica, sans-serif">
  <title>SIS state machine</title>
  <desc>Vertical two-state SIS epidemic state machine showing infection from susceptible to infected and recovery back to susceptible.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#607d8b"/></marker>
    <style>
      .title{font-size:17px;font-weight:700;fill:#263238;text-anchor:middle}.small{font-size:11px;fill:#455a64;text-anchor:middle}.s{fill:#e3f2fd;stroke:#1565c0;stroke-width:2.4}.i{fill:#ffebee;stroke:#c62828;stroke-width:2.4}.label{font-size:30px;font-weight:700;fill:#263238;text-anchor:middle;dominant-baseline:middle}.state{font-size:14px;font-weight:700;fill:#263238;text-anchor:middle}.arrow{stroke:#607d8b;stroke-width:3;fill:none;marker-end:url(#arrow)}.rate{font-size:13px;font-weight:700;fill:#263238;text-anchor:middle}.note{font-size:10.5px;fill:#607d8b;text-anchor:middle}
    </style>
  </defs>
  <text x="160" y="28" class="title">SIS: infection can return</text>
  <text x="160" y="46" class="small">Recovery does not create immunity.</text>

  <circle class="s" cx="160" cy="125" r="48"/>
  <text class="label" x="160" y="121">S</text>
  <text class="state" x="160" y="174">Susceptible</text>

  <path class="arrow" d="M135 174 C94 226 94 283 135 334"/>
  <text class="rate" x="72" y="252">infection</text>
  <text class="note" x="72" y="270">over S-I edges</text>
  <text class="note" x="72" y="287">beta</text>

  <circle class="i" cx="160" cy="385" r="48"/>
  <text class="label" x="160" y="381">I</text>
  <text class="state" x="160" y="434">Infected</text>

  <path class="arrow" d="M185 334 C226 282 226 226 185 176"/>
  <text class="rate" x="248" y="252">recovery</text>
  <text class="note" x="248" y="270">gamma</text>
</svg>
