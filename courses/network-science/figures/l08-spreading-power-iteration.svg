<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 742" font-family="Arial, Helvetica, sans-serif">
  <title>Why Ax indicates spreading: power iteration toward the leading eigenvector</title>
  <desc>Three stacked panels showing an activity vector on a small graph. Start with equal activity x. One multiplication Ax replaces each node by the sum of its neighbours' activity. Repeated multiplication A^k x amplifies hubs and dense cores and converges to the leading eigenvector, the same power iteration used by PageRank.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#90a4ae"/>
    </marker>
    <style>
      .panel{fill:#fff;stroke:#cfd8dc;stroke-width:1.2}
      .title{font-size:13px;font-weight:700;fill:#263238;text-anchor:middle}
      .sub{font-size:9.5px;fill:#607d8b;text-anchor:middle}
      .edge{stroke:#cfd8dc;stroke-width:2;fill:none}
      .edge2{stroke:#ffcc80;stroke-width:3;fill:none}
      .lab{font-size:11px;font-weight:700;text-anchor:middle;dominant-baseline:central}
      .val{font-size:9px;font-weight:700;fill:#5d4037;text-anchor:middle}
      .note{fill:#fff8e1;stroke:#ffcc80;stroke-width:1.2}
      .ntext{font-size:10px;fill:#5d4037;text-anchor:middle}
    </style>
  </defs>

  <!-- ============ Panel 1: start, equal activity ============ -->
  <g transform="translate(20,16)">
    <rect class="panel" x="0" y="0" width="260" height="190" rx="8"/>
    <text x="130" y="22" class="title">Start: equal activity x</text>
    <text x="130" y="38" class="sub">every node carries the same value</text>
    <g transform="translate(0,8)">
      <path class="edge" d="M132 92 L62 52 M132 92 L62 135 M132 92 L200 58 M132 92 L200 135 M200 58 L200 135 M62 52 L62 135 M62 135 L40 162"/>
      <circle cx="132" cy="92" r="9" fill="#ffe0b2" stroke="#fb8c00" stroke-width="1.6"/><text class="lab" x="132" y="92" fill="#5d4037">H</text><text class="val" x="132" y="113">1</text>
      <circle cx="62" cy="52" r="9" fill="#ffe0b2" stroke="#fb8c00" stroke-width="1.6"/><text class="lab" x="62" y="52" fill="#5d4037">A</text><text class="val" x="62" y="33">1</text>
      <circle cx="62" cy="135" r="9" fill="#ffe0b2" stroke="#fb8c00" stroke-width="1.6"/><text class="lab" x="62" y="135" fill="#5d4037">B</text><text class="val" x="80" y="139">1</text>
      <circle cx="200" cy="58" r="9" fill="#ffe0b2" stroke="#fb8c00" stroke-width="1.6"/><text class="lab" x="200" y="58" fill="#5d4037">C</text><text class="val" x="200" y="39">1</text>
      <circle cx="200" cy="135" r="9" fill="#ffe0b2" stroke="#fb8c00" stroke-width="1.6"/><text class="lab" x="200" y="135" fill="#5d4037">D</text><text class="val" x="200" y="156">1</text>
      <circle cx="40" cy="162" r="9" fill="#ffe0b2" stroke="#fb8c00" stroke-width="1.6"/><text class="lab" x="40" y="162" fill="#5d4037">E</text><text class="val" x="22" y="166">1</text>
    </g>
  </g>

  <path d="M150 210 L150 232" stroke="#90a4ae" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ============ Panel 2: one step Ax = sum of neighbours ============ -->
  <g transform="translate(20,236)">
    <rect class="panel" x="0" y="0" width="260" height="190" rx="8"/>
    <text x="130" y="22" class="title">One step: Ax</text>
    <text x="130" y="38" class="sub">each node &#8592; sum of neighbour activity</text>
    <g transform="translate(0,8)">
      <path class="edge2" d="M132 92 L62 52 M132 92 L62 135 M132 92 L200 58 M132 92 L200 135 M200 58 L200 135 M62 52 L62 135 M62 135 L40 162"/>
      <circle cx="132" cy="92" r="16" fill="#e65100" stroke="#bf360c" stroke-width="1.8"/><text class="lab" x="132" y="92" fill="#fff">H</text><text class="val" x="132" y="120">4</text>
      <circle cx="62" cy="52" r="12" fill="#fb8c00" stroke="#e65100" stroke-width="1.6"/><text class="lab" x="62" y="52" fill="#fff">A</text><text class="val" x="62" y="30">2</text>
      <circle cx="62" cy="135" r="14" fill="#ef6c00" stroke="#bf360c" stroke-width="1.6"/><text class="lab" x="62" y="135" fill="#fff">B</text><text class="val" x="84" y="139">3</text>
      <circle cx="200" cy="58" r="12" fill="#fb8c00" stroke="#e65100" stroke-width="1.6"/><text class="lab" x="200" y="58" fill="#fff">C</text><text class="val" x="200" y="36">2</text>
      <circle cx="200" cy="135" r="12" fill="#fb8c00" stroke="#e65100" stroke-width="1.6"/><text class="lab" x="200" y="135" fill="#fff">D</text><text class="val" x="200" y="159">2</text>
      <circle cx="40" cy="162" r="9" fill="#ffe0b2" stroke="#fb8c00" stroke-width="1.6"/><text class="lab" x="40" y="162" fill="#5d4037">E</text><text class="val" x="20" y="166">1</text>
    </g>
  </g>

  <path d="M150 430 L150 452" stroke="#90a4ae" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ============ Panel 3: repeat, converges to leading eigenvector ============ -->
  <g transform="translate(20,456)">
    <rect class="panel" x="0" y="0" width="260" height="190" rx="8"/>
    <text x="130" y="22" class="title">Repeat: A&#8319;x &#8594; x*</text>
    <text x="130" y="38" class="sub">hub &amp; dense core amplified along walks</text>
    <g transform="translate(0,8)">
      <path class="edge2" d="M132 92 L62 52 M132 92 L62 135 M132 92 L200 58 M132 92 L200 135 M200 58 L200 135 M62 52 L62 135 M62 135 L40 162"/>
      <circle cx="132" cy="92" r="18" fill="#bf360c" stroke="#7f0000" stroke-width="1.8"/><text class="lab" x="132" y="92" fill="#fff">H</text><text class="val" x="132" y="122">9</text>
      <circle cx="62" cy="52" r="15" fill="#e65100" stroke="#bf360c" stroke-width="1.6"/><text class="lab" x="62" y="52" fill="#fff">A</text><text class="val" x="62" y="27">7</text>
      <circle cx="62" cy="135" r="15" fill="#e65100" stroke="#bf360c" stroke-width="1.6"/><text class="lab" x="62" y="135" fill="#fff">B</text><text class="val" x="85" y="139">7</text>
      <circle cx="200" cy="58" r="14" fill="#ef6c00" stroke="#bf360c" stroke-width="1.6"/><text class="lab" x="200" y="58" fill="#fff">C</text><text class="val" x="200" y="32">6</text>
      <circle cx="200" cy="135" r="14" fill="#ef6c00" stroke="#bf360c" stroke-width="1.6"/><text class="lab" x="200" y="135" fill="#fff">D</text><text class="val" x="200" y="161">6</text>
      <circle cx="40" cy="162" r="9" fill="#ffe0b2" stroke="#fb8c00" stroke-width="1.6"/><text class="lab" x="40" y="162" fill="#5d4037">E</text><text class="val" x="20" y="166">3</text>
    </g>
  </g>

  <!-- ============ Note: PageRank is the same power iteration ============ -->
  <g transform="translate(20,658)">
    <rect class="note" x="0" y="0" width="260" height="70" rx="8"/>
    <text x="130" y="22" class="ntext" font-weight="700">A&#8319;x grows like &#955;&#8338;&#8336;&#8339;&#7506; along walks</text>
    <text x="130" y="40" class="ntext">&#955;&#8338;&#8336;&#8339;(A) = how strongly the net amplifies spreading</text>
    <text x="130" y="58" class="ntext">PageRank works the same way: keep multiplying by the link matrix</text>
  </g>
</svg>
