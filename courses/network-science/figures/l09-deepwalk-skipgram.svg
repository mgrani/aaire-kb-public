<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="'Segoe UI', Arial, sans-serif">

  <text x="410" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#263238">
    DeepWalk — Random Walks as "Sentences" for Skip-Gram
  </text>
  <text x="410" y="44" text-anchor="middle" font-size="11" fill="#546e7a">
    node ≈ word · walk ≈ sentence · co-occurrence → embedding
  </text>

  <!-- ============== PANEL 1: GRAPH ============== -->
  <g transform="translate(20,70)">
    <rect x="0" y="0" width="230" height="360" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
    <text x="115" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">1. Random walks</text>
    <text x="115" y="40" text-anchor="middle" font-size="10" fill="#1565c0">length L from each node</text>

    <!-- Graph edges -->
    <g stroke="#90caf9" stroke-width="1.4">
      <line x1="60"  y1="90"  x2="130" y2="110"/>
      <line x1="130" y1="110" x2="190" y2="90"/>
      <line x1="130" y1="110" x2="90"  y2="170"/>
      <line x1="130" y1="110" x2="170" y2="170"/>
      <line x1="90"  y1="170" x2="170" y2="170"/>
      <line x1="90"  y1="170" x2="60"  y2="240"/>
      <line x1="170" y1="170" x2="190" y2="240"/>
      <line x1="60"  y1="240" x2="120" y2="260"/>
      <line x1="120" y1="260" x2="190" y2="240"/>
      <line x1="120" y1="260" x2="120" y2="310"/>
    </g>

    <!-- Highlighted walk: v1 → v2 → v4 → v5 → v7 -->
    <path d="M 60 90 L 130 110 L 90 170 L 170 170 L 190 240"
          fill="none" stroke="#d32f2f" stroke-width="2.4"/>

    <!-- Nodes with labels -->
    <g font-size="9" font-weight="bold" fill="#fff">
      <circle cx="60"  cy="90"  r="11" fill="#d32f2f"/><text x="60"  y="94"  text-anchor="middle">v₁</text>
      <circle cx="130" cy="110" r="11" fill="#d32f2f"/><text x="130" y="114" text-anchor="middle">v₂</text>
      <circle cx="190" cy="90"  r="10" fill="#1976d2"/><text x="190" y="94"  text-anchor="middle">v₃</text>
      <circle cx="90"  cy="170" r="11" fill="#d32f2f"/><text x="90"  y="174" text-anchor="middle">v₄</text>
      <circle cx="170" cy="170" r="11" fill="#d32f2f"/><text x="170" y="174" text-anchor="middle">v₅</text>
      <circle cx="60"  cy="240" r="10" fill="#1976d2"/><text x="60"  y="244" text-anchor="middle">v₆</text>
      <circle cx="190" cy="240" r="11" fill="#d32f2f"/><text x="190" y="244" text-anchor="middle">v₇</text>
      <circle cx="120" cy="260" r="10" fill="#1976d2"/><text x="120" y="264" text-anchor="middle">v₈</text>
      <circle cx="120" cy="310" r="10" fill="#1976d2"/><text x="120" y="314" text-anchor="middle">v₉</text>
    </g>

    <text x="115" y="340" text-anchor="middle" font-size="10" fill="#0d47a1" font-weight="bold">walk: v₁ v₂ v₄ v₅ v₇</text>
    <text x="115" y="354" text-anchor="middle" font-size="9" fill="#1565c0" font-style="italic">repeat γ times per node</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 255 250 L 285 250" stroke="#455a64" stroke-width="2" marker-end="url(#darrow)"/>
  <defs>
    <marker id="darrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#455a64"/>
    </marker>
  </defs>

  <!-- ============== PANEL 2: SKIP-GRAM ============== -->
  <g transform="translate(290,70)">
    <rect x="0" y="0" width="250" height="360" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.4"/>
    <text x="125" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">2. Skip-gram window</text>
    <text x="125" y="40" text-anchor="middle" font-size="10" fill="#ef6c00">context c = 2 around centre</text>

    <!-- Walk as sequence -->
    <g font-size="12" font-weight="bold">
      <rect x="20"  y="70" width="40" height="32" rx="4" fill="#ffe0b2" stroke="#ef6c00"/>
      <text x="40" y="92" text-anchor="middle" fill="#bf360c">v₁</text>
      <rect x="65"  y="70" width="40" height="32" rx="4" fill="#ffe0b2" stroke="#ef6c00"/>
      <text x="85" y="92" text-anchor="middle" fill="#bf360c">v₂</text>
      <rect x="110" y="70" width="40" height="32" rx="4" fill="#ff8a65" stroke="#bf360c" stroke-width="2"/>
      <text x="130" y="92" text-anchor="middle" fill="#bf360c">v₄</text>
      <rect x="155" y="70" width="40" height="32" rx="4" fill="#ffe0b2" stroke="#ef6c00"/>
      <text x="175" y="92" text-anchor="middle" fill="#bf360c">v₅</text>
      <rect x="200" y="70" width="40" height="32" rx="4" fill="#ffe0b2" stroke="#ef6c00"/>
      <text x="220" y="92" text-anchor="middle" fill="#bf360c">v₇</text>
    </g>
    <text x="130" y="120" text-anchor="middle" font-size="10" fill="#bf360c">centre v₄ · context {v₁, v₂, v₅, v₇}</text>

    <!-- Training pairs -->
    <text x="125" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="#bf360c">training pairs (v, context)</text>
    <g font-family="'SFMono-Regular', Consolas, monospace" font-size="10" fill="#4e342e">
      <text x="40" y="180">(v₄, v₁)</text>
      <text x="140" y="180">(v₄, v₂)</text>
      <text x="40" y="200">(v₄, v₅)</text>
      <text x="140" y="200">(v₄, v₇)</text>
    </g>

    <!-- Objective -->
    <rect x="20" y="225" width="210" height="100" rx="6" fill="#fff" stroke="#ef6c00" stroke-dasharray="3,2"/>
    <text x="125" y="245" text-anchor="middle" font-size="10" font-weight="bold" fill="#bf360c">Skip-gram objective</text>
    <text x="125" y="268" text-anchor="middle" font-size="11" fill="#4e342e" font-family="'SFMono-Regular', Consolas, monospace">
      max  Σ log P(u | v)
    </text>
    <text x="125" y="288" text-anchor="middle" font-size="10" fill="#4e342e" font-family="'SFMono-Regular', Consolas, monospace">
      P(u|v) = softmax(z_u · z_v)
    </text>
    <text x="125" y="312" text-anchor="middle" font-size="9" fill="#ef6c00" font-style="italic">
      "co-walking nodes have similar z"
    </text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 545 250 L 575 250" stroke="#455a64" stroke-width="2" marker-end="url(#darrow)"/>

  <!-- ============== PANEL 3: EMBEDDINGS ============== -->
  <g transform="translate(580,70)">
    <rect x="0" y="0" width="220" height="360" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.4"/>
    <text x="110" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a148c">3. Embeddings</text>
    <text x="110" y="40" text-anchor="middle" font-size="10" fill="#6a1b9a">z_v ∈ ℝᵈ, d ≪ |V|</text>

    <!-- Axes -->
    <line x1="30" y1="290" x2="200" y2="290" stroke="#4a148c" stroke-width="1"/>
    <line x1="30" y1="290" x2="30"  y2="80"  stroke="#4a148c" stroke-width="1"/>

    <!-- Red cluster (co-walked nodes) -->
    <g fill="#d32f2f" font-size="8" font-weight="bold">
      <circle cx="75"  cy="130" r="9"/><text x="75"  y="133" text-anchor="middle" fill="#fff">v₁</text>
      <circle cx="95"  cy="145" r="9"/><text x="95"  y="148" text-anchor="middle" fill="#fff">v₂</text>
      <circle cx="85"  cy="160" r="9"/><text x="85"  y="163" text-anchor="middle" fill="#fff">v₄</text>
      <circle cx="105" cy="125" r="9"/><text x="105" y="128" text-anchor="middle" fill="#fff">v₅</text>
      <circle cx="115" cy="150" r="9"/><text x="115" y="153" text-anchor="middle" fill="#fff">v₇</text>
    </g>
    <circle cx="95" cy="142" r="35" fill="none" stroke="#d32f2f" stroke-width="1" stroke-dasharray="3,2"/>

    <!-- Blue cluster -->
    <g fill="#1976d2" font-size="8" font-weight="bold">
      <circle cx="160" cy="220" r="9"/><text x="160" y="223" text-anchor="middle" fill="#fff">v₆</text>
      <circle cx="175" cy="245" r="9"/><text x="175" y="248" text-anchor="middle" fill="#fff">v₈</text>
      <circle cx="155" cy="260" r="9"/><text x="155" y="263" text-anchor="middle" fill="#fff">v₉</text>
      <circle cx="180" cy="205" r="9"/><text x="180" y="208" text-anchor="middle" fill="#fff">v₃</text>
    </g>
    <circle cx="167" cy="232" r="33" fill="none" stroke="#1976d2" stroke-width="1" stroke-dasharray="3,2"/>

    <text x="110" y="320" text-anchor="middle" font-size="10" fill="#4a148c" font-style="italic">co-walked nodes end up</text>
    <text x="110" y="334" text-anchor="middle" font-size="10" fill="#4a148c" font-style="italic">close in the embedding space</text>
    <text x="110" y="350" text-anchor="middle" font-size="9" fill="#6a1b9a">Perozzi et al. 2014</text>
  </g>

</svg>
