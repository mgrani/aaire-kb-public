<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Leiden community detection workflow</title>
  <desc id="desc">Leiden extends Louvain by adding a refinement phase that splits badly connected provisional communities before aggregation.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#607d8b"/>
    </marker>
    <style>
      .title { font-size: 17px; font-weight: 700; fill: #263238; }
      .label { font-size: 13px; font-weight: 700; fill: #263238; }
      .small { font-size: 11px; fill: #455a64; }
      .box { fill: #f8fafc; stroke: #90a4ae; stroke-width: 1.2; rx: 10; }
      .green { fill: #a5d6a7; stroke: #2e7d32; }
      .orange { fill: #ffcc80; stroke: #ef6c00; }
      .blue { fill: #90caf9; stroke: #1565c0; }
      .edge { stroke: #607d8b; stroke-width: 2; }
      .weak { stroke: #b0bec5; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .cut { stroke: #d32f2f; stroke-width: 3; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <text x="410" y="28" text-anchor="middle" class="title">Leiden: Louvain-style moves plus refinement before aggregation</text>

  <g transform="translate(24,58)">
    <rect class="box" x="0" y="0" width="238" height="205"/>
    <text x="119" y="24" text-anchor="middle" class="label">1. Local moving</text>
    <text x="119" y="186" text-anchor="middle" class="small">same greedy ΔQ idea as Louvain</text>

    <line class="edge" x1="56" y1="84" x2="92" y2="62"/>
    <line class="edge" x1="56" y1="84" x2="92" y2="110"/>
    <line class="edge" x1="92" y1="62" x2="92" y2="110"/>
    <line class="weak" x1="112" y1="86" x2="132" y2="86"/>
    <line class="edge" x1="152" y1="62" x2="188" y2="84"/>
    <line class="edge" x1="152" y1="110" x2="188" y2="84"/>
    <line class="edge" x1="152" y1="62" x2="152" y2="110"/>

    <circle class="green" cx="56" cy="84" r="11"/>
    <circle class="green" cx="92" cy="62" r="11"/>
    <circle class="green" cx="92" cy="110" r="11"/>
    <circle class="green" cx="152" cy="62" r="11"/>
    <circle class="green" cx="152" cy="110" r="11"/>
    <circle class="green" cx="188" cy="84" r="11"/>
    <text x="122" y="145" text-anchor="middle" class="small">provisional community may be fragile</text>
  </g>

  <line x1="282" y1="160" x2="328" y2="160" class="edge" marker-end="url(#arrow)"/>

  <g transform="translate(348,58)">
    <rect class="box" x="0" y="0" width="190" height="205"/>
    <text x="95" y="24" text-anchor="middle" class="label">2. Refine</text>
    <text x="95" y="186" text-anchor="middle" class="small">split badly connected parts</text>

    <line class="edge" x1="43" y1="96" x2="74" y2="76"/>
    <line class="edge" x1="43" y1="96" x2="74" y2="116"/>
    <line class="edge" x1="74" y1="76" x2="74" y2="116"/>
    <line class="cut" x1="90" y1="96" x2="106" y2="96"/>
    <line class="edge" x1="122" y1="76" x2="153" y2="96"/>
    <line class="edge" x1="122" y1="116" x2="153" y2="96"/>
    <line class="edge" x1="122" y1="76" x2="122" y2="116"/>

    <circle class="green" cx="43" cy="96" r="11"/>
    <circle class="green" cx="74" cy="76" r="11"/>
    <circle class="green" cx="74" cy="116" r="11"/>
    <circle class="orange" cx="122" cy="76" r="11"/>
    <circle class="orange" cx="122" cy="116" r="11"/>
    <circle class="orange" cx="153" cy="96" r="11"/>
  </g>

  <line x1="560" y1="160" x2="608" y2="160" class="edge" marker-end="url(#arrow)"/>

  <g transform="translate(628,58)">
    <rect class="box" x="0" y="0" width="168" height="205"/>
    <text x="84" y="24" text-anchor="middle" class="label">3. Aggregate</text>
    <text x="84" y="186" text-anchor="middle" class="small">only refined communities collapse</text>

    <circle class="green" cx="54" cy="96" r="30"/>
    <circle class="orange" cx="114" cy="96" r="30"/>
    <line class="weak" x1="84" y1="96" x2="84" y2="96"/>
    <text x="54" y="101" text-anchor="middle" class="label">C1</text>
    <text x="114" y="101" text-anchor="middle" class="label">C2</text>
  </g>

  <g transform="translate(72,300)" font-size="12" fill="#455a64">
    <text x="0" y="0" font-weight="700">Still no pre-given k:</text>
    <text x="114" y="0">Leiden also lets the partition size emerge, but prevents badly connected communities from being aggregated too early.</text>
    <text x="0" y="22">The refinement step gives stronger internal-connectivity guarantees than Louvain while keeping the same scalable compression logic.</text>
  </g>
</svg>
