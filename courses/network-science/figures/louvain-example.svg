<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Louvain community detection workflow</title>
  <desc id="desc">Louvain starts with each node as its own community, greedily moves nodes to neighboring communities when modularity increases, aggregates communities into super-nodes, and repeats.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#607d8b"/>
    </marker>
    <style>
      .title { font-size: 17px; font-weight: 700; fill: #263238; }
      .label { font-size: 13px; font-weight: 700; fill: #263238; }
      .small { font-size: 11px; fill: #455a64; }
      .box { fill: #f8fafc; stroke: #90a4ae; stroke-width: 1.2; rx: 10; }
      .green { fill: #a5d6a7; stroke: #2e7d32; }
      .orange { fill: #ffcc80; stroke: #ef6c00; }
      .blue { fill: #90caf9; stroke: #1565c0; }
      .violet { fill: #ce93d8; stroke: #6a1b9a; }
      .edge { stroke: #607d8b; stroke-width: 2; }
      .weak { stroke: #b0bec5; stroke-width: 1.5; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <text x="410" y="28" text-anchor="middle" class="title">Louvain: local moves + aggregation, repeated until Q stops improving</text>

  <g transform="translate(24,58)">
    <rect class="box" x="0" y="0" width="235" height="205"/>
    <text x="118" y="24" text-anchor="middle" class="label">1. Local moving</text>
    <text x="118" y="186" text-anchor="middle" class="small">try only neighboring communities</text>

    <line class="edge" x1="56" y1="82" x2="96" y2="58"/>
    <line class="edge" x1="56" y1="82" x2="96" y2="110"/>
    <line class="edge" x1="96" y1="58" x2="96" y2="110"/>
    <line class="edge" x1="148" y1="58" x2="188" y2="82"/>
    <line class="edge" x1="148" y1="110" x2="188" y2="82"/>
    <line class="edge" x1="148" y1="58" x2="148" y2="110"/>
    <line class="weak" x1="96" y1="110" x2="148" y2="110"/>

    <circle class="green" cx="56" cy="82" r="12"/>
    <circle class="green" cx="96" cy="58" r="12"/>
    <circle class="blue" cx="96" cy="110" r="12"/>
    <circle class="orange" cx="148" cy="58" r="12"/>
    <circle class="orange" cx="148" cy="110" r="12"/>
    <circle class="orange" cx="188" cy="82" r="12"/>

    <path d="M116,112 C126,132 144,132 154,114" fill="none" stroke="#ef6c00" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="123" y="151" text-anchor="middle" class="small">move if ΔQ &gt; 0</text>
  </g>

  <line x1="280" y1="160" x2="328" y2="160" class="edge" marker-end="url(#arrow)"/>

  <g transform="translate(348,58)">
    <rect class="box" x="0" y="0" width="190" height="205"/>
    <text x="95" y="24" text-anchor="middle" class="label">2. Aggregate</text>
    <text x="95" y="186" text-anchor="middle" class="small">communities become super-nodes</text>

    <circle class="green" cx="63" cy="96" r="36"/>
    <circle class="orange" cx="128" cy="96" r="36"/>
    <line class="weak" x1="99" y1="96" x2="92" y2="96"/>
    <text x="63" y="101" text-anchor="middle" class="label">C1</text>
    <text x="128" y="101" text-anchor="middle" class="label">C2</text>
  </g>

  <line x1="560" y1="160" x2="608" y2="160" class="edge" marker-end="url(#arrow)"/>

  <g transform="translate(628,58)">
    <rect class="box" x="0" y="0" width="168" height="205"/>
    <text x="84" y="24" text-anchor="middle" class="label">3. Repeat</text>
    <text x="84" y="186" text-anchor="middle" class="small">coarser graph, same rule</text>

    <circle class="blue" cx="54" cy="96" r="30"/>
    <circle class="violet" cx="114" cy="96" r="30"/>
    <line class="edge" x1="84" y1="96" x2="84" y2="96"/>
    <text x="54" y="101" text-anchor="middle" class="label">S1</text>
    <text x="114" y="101" text-anchor="middle" class="label">S2</text>
  </g>

  <g transform="translate(72,300)" font-size="12" fill="#455a64">
    <text x="0" y="0" font-weight="700">No pre-given k:</text>
    <text x="92" y="0">the number of communities emerges from accepted modularity-improving moves and later aggregation levels.</text>
    <text x="0" y="22">For a node v, Louvain tests the current communities found among v's neighbors, plus staying where it is.</text>
  </g>
</svg>
