<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-labelledby="title desc">
  <title id="title">Why modularity uses k_i k_j over 2m as expected edge density</title>
  <desc id="desc">A teaching diagram showing observed communities on the left and the configuration-model stub argument for expected edges on the right.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 17px Inter, Arial, sans-serif; fill: #1f2937; }
      .label { font: 700 15px Inter, Arial, sans-serif; fill: #1f2937; }
      .small { font: 13px Inter, Arial, sans-serif; fill: #475569; }
      .tiny { font: 11px Inter, Arial, sans-serif; fill: #475569; }
      .math { font: 700 16px Inter, Arial, sans-serif; fill: #111827; }
      .edge { stroke: #64748b; stroke-width: 4; stroke-linecap: round; }
      .bridge { stroke: #dc2626; stroke-width: 4; stroke-linecap: round; }
      .weak { stroke: #94a3b8; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 6 6; }
      .stub { stroke: #64748b; stroke-width: 4; stroke-linecap: round; }
      .left-node { fill: #38bdf8; stroke: #075985; stroke-width: 3; }
      .right-node { fill: #fbbf24; stroke: #92400e; stroke-width: 3; }
      .community-left { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2.5; stroke-dasharray: 8 7; }
      .community-right { fill: #fef3c7; stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect x="1" y="1" width="818" height="298" rx="14" fill="#ffffff" stroke="#d8dee8"/>
  <text x="410" y="30" text-anchor="middle" class="title">Modularity: observed internal edges minus degree-based expectation</text>

  <g transform="translate(30 62)">
    <text x="160" y="0" text-anchor="middle" class="label">Observed graph + partition</text>
    <rect x="18" y="34" width="126" height="118" rx="14" class="community-left"/>
    <rect x="186" y="34" width="126" height="118" rx="14" class="community-right"/>

    <line x1="60" y1="74" x2="102" y2="74" class="edge"/>
    <line x1="60" y1="74" x2="82" y2="118" class="edge"/>
    <line x1="102" y1="74" x2="82" y2="118" class="edge"/>
    <line x1="228" y1="74" x2="270" y2="74" class="edge"/>
    <line x1="228" y1="74" x2="250" y2="118" class="edge"/>
    <line x1="270" y1="74" x2="250" y2="118" class="edge"/>
    <line x1="82" y1="118" x2="250" y2="118" class="bridge"/>

    <circle cx="60" cy="74" r="15" class="left-node"/>
    <circle cx="102" cy="74" r="15" class="left-node"/>
    <circle cx="82" cy="118" r="15" class="left-node"/>
    <circle cx="228" cy="74" r="15" class="right-node"/>
    <circle cx="270" cy="74" r="15" class="right-node"/>
    <circle cx="250" cy="118" r="15" class="right-node"/>

    <text x="160" y="186" text-anchor="middle" class="small">observed term: A_ij</text>
  </g>

  <line x1="360" y1="162" x2="408" y2="162" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(430 62)">
    <text x="170" y="0" text-anchor="middle" class="label">Expected graph: preserve degrees, rewire stubs</text>

    <circle cx="84" cy="82" r="24" class="left-node"/>
    <text x="84" y="88" text-anchor="middle" class="label">i</text>
    <circle cx="238" cy="82" r="24" class="right-node"/>
    <text x="238" y="88" text-anchor="middle" class="label">j</text>

    <line x1="84" y1="58" x2="84" y2="26" class="stub"/>
    <line x1="62" y1="72" x2="26" y2="54" class="stub"/>
    <line x1="66" y1="100" x2="34" y2="124" class="stub"/>
    <line x1="238" y1="58" x2="238" y2="26" class="stub"/>
    <line x1="260" y1="72" x2="296" y2="54" class="stub"/>

    <text x="84" y="136" text-anchor="middle" class="small">k_i stubs</text>
    <text x="238" y="136" text-anchor="middle" class="small">k_j stubs</text>

    <path d="M112 82 C148 35 176 35 210 82" fill="none" class="weak"/>
    <text x="161" y="51" text-anchor="middle" class="tiny">randomly matched stubs</text>

    <rect x="30" y="154" width="275" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="168" y="176" text-anchor="middle" class="small">2m stubs in the full graph</text>
    <text x="168" y="199" text-anchor="middle" class="math">expected i-j density</text>
    <text x="168" y="219" text-anchor="middle" class="math">k_i k_j / 2m</text>
  </g>
</svg>
