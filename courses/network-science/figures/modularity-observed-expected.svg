<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 540" role="img" aria-labelledby="title desc">
  <title id="title">Configuration-model expectation for an edge between two nodes</title>
  <desc id="desc">A narrow vertical diagram with node i above node j. Their degree stubs point toward each other, and a dashed line with a question mark asks how likely one random stub match is.</desc>
  <defs>
    <style>
      .node-i { fill: #38bdf8; stroke: #075985; stroke-width: 3; }
      .node-j { fill: #fbbf24; stroke: #92400e; stroke-width: 3; }
      .stub-i { stroke: #075985; stroke-width: 5; stroke-linecap: round; }
      .stub-j { stroke: #92400e; stroke-width: 5; stroke-linecap: round; }
      .possible { stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 8 8; }
      .label { font: 700 18px Inter, Arial, sans-serif; fill: #111827; }
      .small { font: 14px Inter, Arial, sans-serif; fill: #475569; }
      .math { font: 700 19px Inter, Arial, sans-serif; fill: #111827; }
      .question { font: 800 36px Inter, Arial, sans-serif; fill: #dc2626; }
    </style>
  </defs>

  <rect x="1" y="1" width="498" height="538" rx="14" fill="#ffffff" stroke="#d8dee8"/>

  <circle cx="250" cy="74" r="34" class="node-i"/>
  <text x="250" y="81" text-anchor="middle" class="label">i</text>
  <text x="334" y="126" text-anchor="middle" class="small">k_i = 3</text>

  <line x1="226" y1="98" x2="158" y2="212" class="stub-i"/>
  <line x1="250" y1="108" x2="250" y2="212" class="stub-i"/>
  <line x1="274" y1="98" x2="342" y2="212" class="stub-i"/>

  <line x1="250" y1="212" x2="250" y2="304" class="possible"/>
  <text x="250" y="270" text-anchor="middle" class="question">?</text>

  <line x1="154" y1="304" x2="218" y2="410" class="stub-j"/>
  <line x1="218" y1="304" x2="238" y2="400" class="stub-j"/>
  <line x1="250" y1="304" x2="250" y2="396" class="stub-j"/>
  <line x1="346" y1="304" x2="282" y2="410" class="stub-j"/>

  <circle cx="250" cy="432" r="34" class="node-j"/>
  <text x="250" y="439" text-anchor="middle" class="label">j</text>
  <text x="334" y="382" text-anchor="middle" class="small">k_j = 4</text>

  <g transform="translate(48 474)">
    <rect x="0" y="0" width="404" height="46" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="202" y="19" text-anchor="middle" class="small">one i-stub hits j with chance k_j / 2m</text>
    <text x="202" y="36" text-anchor="middle" class="math">expected i-j edge: k_i k_j / 2m</text>
  </g>
</svg>
