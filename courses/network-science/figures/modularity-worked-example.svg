<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Worked modularity example with two triangle communities</title>
  <desc id="desc">Two triangle communities connected by one bridge edge. The left community contains A, B, C and the right community contains D, E, F.</desc>
  <defs>
    <style>
      .left-bg { fill: #e0f2fe; stroke: #0284c7; stroke-width: 3; stroke-dasharray: 8 7; }
      .right-bg { fill: #fef3c7; stroke: #d97706; stroke-width: 3; stroke-dasharray: 8 7; }
      .edge { stroke: #4b5563; stroke-width: 4; stroke-linecap: round; }
      .bridge { stroke: #dc2626; stroke-width: 5; stroke-linecap: round; }
      .node-left { fill: #38bdf8; stroke: #075985; stroke-width: 3; }
      .node-right { fill: #fbbf24; stroke: #92400e; stroke-width: 3; }
      .label { font: 22px sans-serif; font-weight: 700; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .text { font: 18px sans-serif; fill: #111827; }
      .small { font: 15px sans-serif; fill: #374151; }
    </style>
  </defs>

  <rect x="70" y="65" width="300" height="260" rx="18" class="left-bg"/>
  <rect x="530" y="65" width="300" height="260" rx="18" class="right-bg"/>

  <line x1="170" y1="125" x2="270" y2="125" class="edge"/>
  <line x1="170" y1="125" x2="220" y2="245" class="edge"/>
  <line x1="270" y1="125" x2="220" y2="245" class="edge"/>

  <line x1="630" y1="125" x2="730" y2="125" class="edge"/>
  <line x1="630" y1="125" x2="680" y2="245" class="edge"/>
  <line x1="730" y1="125" x2="680" y2="245" class="edge"/>

  <line x1="220" y1="245" x2="680" y2="245" class="bridge"/>

  <circle cx="170" cy="125" r="28" class="node-left"/>
  <circle cx="270" cy="125" r="28" class="node-left"/>
  <circle cx="220" cy="245" r="28" class="node-left"/>
  <circle cx="630" cy="125" r="28" class="node-right"/>
  <circle cx="730" cy="125" r="28" class="node-right"/>
  <circle cx="680" cy="245" r="28" class="node-right"/>

  <text x="170" y="125" class="label">A</text>
  <text x="270" y="125" class="label">B</text>
  <text x="220" y="245" class="label">C</text>
  <text x="630" y="125" class="label">D</text>
  <text x="730" y="125" class="label">E</text>
  <text x="680" y="245" class="label">F</text>

  <text x="220" y="355" text-anchor="middle" class="text">Community 1: {A,B,C}</text>
  <text x="680" y="355" text-anchor="middle" class="text">Community 2: {D,E,F}</text>
  <text x="450" y="230" text-anchor="middle" class="small" fill="#dc2626">bridge</text>
  <text x="450" y="395" text-anchor="middle" class="small">m = 7 edges; each community has 3 internal edges and total degree 7</text>
</svg>
