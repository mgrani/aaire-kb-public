<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="'Segoe UI', Arial, sans-serif">



  <!-- Edges from u to N(u) -->
  <g stroke="#7986cb" stroke-width="1.2" stroke-opacity="0.6">
    <line x1="125" y1="285" x2="170" y2="170"/>
    <line x1="125" y1="285" x2="155" y2="215"/>
    <line x1="125" y1="285" x2="285" y2="155"/>
    <line x1="125" y1="285" x2="300" y2="200"/>
    <line x1="125" y1="285" x2="320" y2="155"/>
  </g>

  <!-- Edges from v to N(v) -->
  <g stroke="#26a69a" stroke-width="1.2" stroke-opacity="0.6">
    <line x1="475" y1="285" x2="430" y2="170"/>
    <line x1="475" y1="285" x2="445" y2="215"/>
    <line x1="475" y1="285" x2="285" y2="155"/>
    <line x1="475" y1="285" x2="300" y2="200"/>
    <line x1="475" y1="285" x2="320" y2="155"/>
  </g>

  <!-- Two overlapping circles (Venn) -->
  <circle cx="220" cy="180" r="92" fill="#7986cb" fill-opacity="0.15" stroke="#3949ab" stroke-width="1.5" stroke-dasharray="4,2"/>
  <circle cx="380" cy="180" r="92" fill="#26a69a" fill-opacity="0.15" stroke="#00695c" stroke-width="1.5" stroke-dasharray="4,2"/>

  <text x="155" y="100" font-size="12" font-weight="bold" fill="#283593">N(u)</text>
  <text x="430" y="100" font-size="12" font-weight="bold" fill="#00695c">N(v)</text>

  <!-- Only-u nodes -->
  <circle cx="170" cy="170" r="14" fill="#3949ab"/>
  <text x="170" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="white">x₁</text>
  <circle cx="155" cy="215" r="14" fill="#3949ab"/>
  <text x="155" y="219" text-anchor="middle" font-size="11" font-weight="bold" fill="white">x₂</text>

  <!-- Shared nodes -->
  <circle cx="285" cy="155" r="14" fill="#7e57c2"/>
  <text x="285" y="159" text-anchor="middle" font-size="11" font-weight="bold" fill="white">s₁</text>
  <circle cx="300" cy="200" r="14" fill="#7e57c2"/>
  <text x="300" y="204" text-anchor="middle" font-size="11" font-weight="bold" fill="white">s₂</text>
  <circle cx="320" cy="155" r="14" fill="#7e57c2"/>
  <text x="320" y="159" text-anchor="middle" font-size="11" font-weight="bold" fill="white">s₃</text>

  <!-- Only-v nodes -->
  <circle cx="430" cy="170" r="14" fill="#00695c"/>
  <text x="430" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="white">y₁</text>
  <circle cx="445" cy="215" r="14" fill="#00695c"/>
  <text x="445" y="219" text-anchor="middle" font-size="11" font-weight="bold" fill="white">y₂</text>

  <!-- u and v themselves with edge -->
  <line x1="125" y1="285" x2="475" y2="285" stroke="#37474f" stroke-width="2.5"/>
  <circle cx="125" cy="285" r="20" fill="#3949ab" stroke="#1a237e" stroke-width="2"/>
  <text x="125" y="291" text-anchor="middle" font-size="13" font-weight="bold" fill="white">u</text>
  <circle cx="475" cy="285" r="20" fill="#00695c" stroke="#004d40" stroke-width="2"/>
  <text x="475" y="291" text-anchor="middle" font-size="13" font-weight="bold" fill="white">v</text>

  <!-- Computation -->

</svg>
