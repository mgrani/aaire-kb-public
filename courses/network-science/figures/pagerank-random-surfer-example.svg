<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">PageRank random surfer example</title>
  <desc id="desc">Directed web pages with link-following arrows and a random jump arrow that explains PageRank.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <marker id="jump" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <style>
      .link { stroke: #374151; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .teleport { stroke: #dc2626; stroke-width: 3; fill: none; stroke-dasharray: 8 7; marker-end: url(#jump); }
      .page { fill: #e0f2fe; stroke: #0369a1; stroke-width: 3; rx: 10; }
      .auth { fill: #bbf7d0; stroke: #15803d; stroke-width: 4; rx: 10; }
      .label { font: 18px sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .note { font: 15px sans-serif; fill: #374151; }
    </style>
  </defs>

  <rect x="95" y="90" width="110" height="70" class="page"/>
  <rect x="380" y="65" width="130" height="90" class="auth"/>
  <rect x="685" y="105" width="110" height="70" class="page"/>
  <rect x="240" y="260" width="110" height="70" class="page"/>
  <rect x="555" y="260" width="110" height="70" class="page"/>

  <text x="150" y="125" class="label">page A</text>
  <text x="445" y="110" class="label">authority</text>
  <text x="740" y="140" class="label">page C</text>
  <text x="295" y="295" class="label">page D</text>
  <text x="610" y="295" class="label">page E</text>

  <path d="M205 117 C270 95, 315 95, 380 105" class="link"/>
  <path d="M685 135 C610 120, 570 115, 510 110" class="link"/>
  <path d="M350 285 C405 250, 420 200, 435 155" class="link"/>
  <path d="M555 285 C505 250, 475 205, 455 155" class="link"/>
  <path d="M510 130 C590 180, 620 215, 610 260" class="link"/>
  <path d="M445 65 C385 15, 155 25, 140 90" class="teleport"/>

  <text x="450" y="365" class="note" text-anchor="middle">Follow links with probability alpha; randomly jump with probability 1-alpha.</text>
  <text x="450" y="390" class="note" text-anchor="middle">Power iteration estimates the long-run visit probability of each page.</text>
</svg>
