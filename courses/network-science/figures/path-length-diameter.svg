<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr-pld" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1565c0"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c62828"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e7d32"/>
    </marker>
  </defs>

  <!-- ===== PANEL 1: PATH LENGTH ===== -->
  <rect x="10" y="10" width="440" height="320" rx="14" fill="#f3f8ff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="230" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">Path Length</text>
  <text x="230" y="62" text-anchor="middle" font-size="11" fill="#555">Number of edges in the path</text>

  <!-- Graph edges (background) -->
  <line x1="80" y1="190" x2="180" y2="130" stroke="#ccc" stroke-width="2"/>
  <line x1="180" y1="130" x2="280" y2="130" stroke="#ccc" stroke-width="2"/>
  <line x1="280" y1="130" x2="380" y2="190" stroke="#ccc" stroke-width="2"/>
  <line x1="180" y1="130" x2="230" y2="220" stroke="#ccc" stroke-width="2"/>
  <line x1="280" y1="130" x2="230" y2="220" stroke="#ccc" stroke-width="2"/>
  <line x1="80" y1="190" x2="230" y2="220" stroke="#ccc" stroke-width="2"/>

  <!-- Highlighted path A→B→C→D (length 3) -->
  <line x1="80" y1="190" x2="175" y2="133" stroke="#1565c0" stroke-width="3" marker-end="url(#arr-blue)"/>
  <line x1="180" y1="130" x2="275" y2="130" stroke="#1565c0" stroke-width="3" marker-end="url(#arr-blue)"/>
  <line x1="280" y1="130" x2="375" y2="187" stroke="#1565c0" stroke-width="3" marker-end="url(#arr-blue)"/>

  <!-- Edge length labels -->
  <text x="122" y="152" text-anchor="middle" font-size="11" fill="#1565c0" font-weight="bold">1</text>
  <text x="228" y="122" text-anchor="middle" font-size="11" fill="#1565c0" font-weight="bold">2</text>
  <text x="336" y="152" text-anchor="middle" font-size="11" fill="#1565c0" font-weight="bold">3</text>

  <!-- Nodes -->
  <circle cx="80" cy="190" r="20" fill="#bbdefb" stroke="#1565c0" stroke-width="2.5"/>
  <text x="80" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">A</text>
  <circle cx="180" cy="130" r="20" fill="#bbdefb" stroke="#1565c0" stroke-width="2.5"/>
  <text x="180" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">B</text>
  <circle cx="280" cy="130" r="20" fill="#bbdefb" stroke="#1565c0" stroke-width="2.5"/>
  <text x="280" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">C</text>
  <circle cx="380" cy="190" r="20" fill="#bbdefb" stroke="#1565c0" stroke-width="2.5"/>
  <text x="380" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">D</text>
  <circle cx="230" cy="220" r="20" fill="#e0e0e0" stroke="#aaa" stroke-width="2"/>
  <text x="230" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">E</text>

  <text x="230" y="270" text-anchor="middle" font-size="12" fill="#1565c0">Path A → B → C → D has length 3</text>
  <text x="230" y="290" text-anchor="middle" font-size="11" fill="#555">(3 edges traversed)</text>
  <text x="230" y="312" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">Weighted: length = sum of edge weights</text>

  <!-- ===== PANEL 2: DIAMETER ===== -->
  <rect x="490" y="10" width="460" height="320" rx="14" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
  <text x="720" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#b71c1c">Diameter</text>
  <text x="720" y="62" text-anchor="middle" font-size="11" fill="#555">Longest shortest path in the graph</text>

  <!-- Graph edges (background) -->
  <line x1="560" y1="190" x2="660" y2="120" stroke="#ccc" stroke-width="2"/>
  <line x1="660" y1="120" x2="770" y2="120" stroke="#ccc" stroke-width="2"/>
  <line x1="770" y1="120" x2="880" y2="190" stroke="#ccc" stroke-width="2"/>
  <line x1="660" y1="120" x2="715" y2="230" stroke="#ccc" stroke-width="2"/>
  <line x1="770" y1="120" x2="715" y2="230" stroke="#ccc" stroke-width="2"/>
  <line x1="560" y1="190" x2="715" y2="230" stroke="#ccc" stroke-width="2"/>

  <!-- Shortest path A→B→C→D (the diameter path, length 3) -->
  <line x1="560" y1="190" x2="655" y2="123" stroke="#c62828" stroke-width="3" stroke-dasharray="8,3" marker-end="url(#arr-red)"/>
  <line x1="660" y1="120" x2="765" y2="120" stroke="#c62828" stroke-width="3" stroke-dasharray="8,3" marker-end="url(#arr-red)"/>
  <line x1="770" y1="120" x2="875" y2="187" stroke="#c62828" stroke-width="3" stroke-dasharray="8,3" marker-end="url(#arr-red)"/>

  <!-- Dist labels on diameter path -->
  <text x="602" y="148" text-anchor="middle" font-size="11" fill="#c62828" font-weight="bold">dist=1</text>
  <text x="715" y="110" text-anchor="middle" font-size="11" fill="#c62828" font-weight="bold">dist=2</text>
  <text x="832" y="148" text-anchor="middle" font-size="11" fill="#c62828" font-weight="bold">dist=3</text>

  <!-- Nodes -->
  <circle cx="560" cy="190" r="20" fill="#ffcdd2" stroke="#c62828" stroke-width="2.5"/>
  <text x="560" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">A</text>
  <circle cx="660" cy="120" r="20" fill="#e0e0e0" stroke="#aaa" stroke-width="2"/>
  <text x="660" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">B</text>
  <circle cx="770" cy="120" r="20" fill="#e0e0e0" stroke="#aaa" stroke-width="2"/>
  <text x="770" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">C</text>
  <circle cx="880" cy="190" r="20" fill="#ffcdd2" stroke="#c62828" stroke-width="2.5"/>
  <text x="880" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">D</text>
  <circle cx="715" cy="230" r="20" fill="#e0e0e0" stroke="#aaa" stroke-width="2"/>
  <text x="715" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">E</text>

  <text x="720" y="270" text-anchor="middle" font-size="12" fill="#c62828">diam(G) = dist(A, D) = 3</text>
  <text x="720" y="290" text-anchor="middle" font-size="11" fill="#555">The farthest pair determines the diameter</text>
  <text x="720" y="312" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">In directed graphs, dist(u,v) ≠ dist(v,u) in general</text>
</svg>
