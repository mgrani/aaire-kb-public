<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Redrawn schematic after Hidalgo et al. Figure 1</title>
  <desc id="desc">A two-panel schematic inspired by Hidalgo et al. Figure 1: a clustered product proximity matrix and a product-space network with products grouped by type, node size, and edge proximity.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="718" height="478" rx="14" fill="#ffffff" stroke="#d8dee8"/>
  <text x="360" y="34" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">
    Product space: proximity matrix and network view
  </text>

  <g transform="translate(34 64)">
    <text x="0" y="-14" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">A</text>
    <text x="28" y="-15" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">clustered product proximity matrix</text>
    <rect x="0" y="0" width="230" height="230" fill="#f8fafc" stroke="#cbd5e1"/>

    <g opacity="0.96">
      <rect x="0" y="0" width="54" height="54" fill="#f6c85f"/>
      <rect x="58" y="58" width="44" height="44" fill="#60a5fa"/>
      <rect x="106" y="106" width="58" height="58" fill="#34d399"/>
      <rect x="168" y="168" width="62" height="62" fill="#a78bfa"/>

      <rect x="8" y="68" width="23" height="23" fill="#fde68a"/>
      <rect x="38" y="121" width="30" height="30" fill="#bfdbfe"/>
      <rect x="86" y="14" width="18" height="18" fill="#fdba74"/>
      <rect x="130" y="72" width="24" height="24" fill="#86efac"/>
      <rect x="176" y="37" width="34" height="34" fill="#ddd6fe"/>
      <rect x="30" y="181" width="31" height="31" fill="#bae6fd"/>
      <rect x="83" y="176" width="22" height="22" fill="#bbf7d0"/>
      <rect x="140" y="188" width="20" height="20" fill="#fecaca"/>
    </g>

    <g stroke="#ffffff" stroke-width="1">
      <path d="M0 58 H230 M0 106 H230 M0 168 H230"/>
      <path d="M58 0 V230 M106 0 V230 M168 0 V230"/>
    </g>

    <g font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">
      <text x="115" y="252" text-anchor="middle">products sorted into related blocks</text>
      <text x="-10" y="118" text-anchor="middle" transform="rotate(-90 -10 118)">products</text>
      <text x="115" y="271" text-anchor="middle">brighter blocks = higher proximity</text>
    </g>
  </g>

  <g transform="translate(314 62)">
    <text x="0" y="-12" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">B</text>
    <text x="28" y="-13" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">network representation of the product space</text>

    <g stroke-linecap="round" fill="none">
      <g stroke="#cbd5e1" stroke-width="2" opacity="0.95">
        <path d="M176 142 L220 102 L276 122 L298 176 L260 226 L194 216 L152 178 Z"/>
        <path d="M176 142 L94 84 M152 178 L62 204 M194 216 L126 286 M260 226 L312 304 M298 176 L386 198 M276 122 L374 68 M220 102 L246 42"/>
        <path d="M94 84 L60 52 M94 84 L128 42 M62 204 L30 244 M126 286 L84 330 M312 304 L368 334 M386 198 L420 246 M374 68 L420 34"/>
      </g>
      <g stroke="#60a5fa" stroke-width="3.5" opacity="0.95">
        <path d="M152 178 L276 122 M176 142 L260 226"/>
      </g>
      <g stroke="#f59e0b" stroke-width="5" opacity="0.95">
        <path d="M176 142 L220 102 L276 122 L298 176 L260 226 L194 216 L152 178 Z"/>
      </g>
      <g stroke="#f59e0b" stroke-width="3" opacity="0.75">
        <path d="M220 102 L298 176 M276 122 L194 216"/>
      </g>
    </g>

    <g filter="url(#shadow)" stroke-width="3" font-family="Inter, Arial, sans-serif" font-weight="700" text-anchor="middle">
      <g fill="#22c55e" stroke="#166534">
        <circle cx="176" cy="142" r="18"/>
        <circle cx="220" cy="102" r="23"/>
        <circle cx="276" cy="122" r="20"/>
        <circle cx="298" cy="176" r="24"/>
        <circle cx="260" cy="226" r="19"/>
        <circle cx="194" cy="216" r="21"/>
        <circle cx="152" cy="178" r="18"/>
      </g>
      <g fill="#60a5fa" stroke="#1e40af">
        <circle cx="94" cy="84" r="16"/>
        <circle cx="60" cy="52" r="12"/>
        <circle cx="128" cy="42" r="13"/>
      </g>
      <g fill="#f6c85f" stroke="#92400e">
        <circle cx="62" cy="204" r="15"/>
        <circle cx="30" cy="244" r="11"/>
        <circle cx="126" cy="286" r="14"/>
        <circle cx="84" cy="330" r="11"/>
      </g>
      <g fill="#a78bfa" stroke="#5b21b6">
        <circle cx="312" cy="304" r="13"/>
        <circle cx="368" cy="334" r="10"/>
      </g>
      <g fill="#fb7185" stroke="#9f1239">
        <circle cx="386" cy="198" r="16"/>
        <circle cx="420" cy="246" r="12"/>
      </g>
      <g fill="#94a3b8" stroke="#475569">
        <circle cx="374" cy="68" r="14"/>
        <circle cx="420" cy="34" r="10"/>
        <circle cx="246" cy="42" r="13"/>
      </g>
    </g>

    <g font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">
      <rect x="78" y="348" width="300" height="22" rx="6" fill="#ffffff" opacity="0.9"/>
      <text x="226" y="363" text-anchor="middle" font-weight="700" fill="#166534">dense core: machinery, chemicals, capital-intensive goods</text>
      <text x="65" y="392" text-anchor="middle">peripheral agriculture / raw products</text>
      <text x="376" y="392" text-anchor="middle">other peripheral clusters</text>
    </g>
  </g>

  <g transform="translate(38 402)" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">
    <text x="430" y="-20" font-weight="700">Edge proximity:</text>
    <line x1="430" y1="-6" x2="468" y2="-6" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <text x="476" y="-2">lower</text>
    <line x1="532" y1="-6" x2="570" y2="-6" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round"/>
    <text x="578" y="-2">medium</text>
    <line x1="430" y1="14" x2="468" y2="14" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    <text x="476" y="18">higher</text>
    <text x="0" y="0" font-weight="700">Redrawn teaching schematic after Fig. 1 in Hidalgo et al. (2007).</text>
    <text x="0" y="19">Original Fig. 1: 775 SITC-4 products; node size proportional to world trade; colors follow product classes; link color encodes proximity.</text>
  </g>
</svg>
