<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 620" role="img" aria-labelledby="title desc">
  <title id="title">A grid as a regular graph for Schelling's model</title>
  <desc id="desc">A vertical schematic showing a neighborhood graph mapped downward to a regular grid graph. The grid is still a graph: cells are nodes and adjacency defines edges.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M1,1 L9,1 L5,9 Z" fill="#64748b"/>
    </marker>
    <style>
      .label { font: 700 16px Inter, Arial, sans-serif; fill: #0f172a; }
      .small { font: 12px Inter, Arial, sans-serif; fill: #475569; }
      .edge { stroke: #94a3b8; stroke-width: 3; stroke-linecap: round; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .node-a { fill: #38bdf8; stroke: #075985; stroke-width: 2.5; }
      .node-b { fill: #f97316; stroke: #9a3412; stroke-width: 2.5; }
      .cell { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .cell-a { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .cell-b { fill: #ffedd5; stroke: #f97316; stroke-width: 2; }
    </style>
  </defs>

  <rect x="1" y="1" width="358" height="618" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <g transform="translate(48 42)">
    <text x="132" y="0" text-anchor="middle" class="label">Regular graph</text>
    <text x="132" y="22" text-anchor="middle" class="small">same degree in the interior</text>

    <line x1="60" y1="72" x2="132" y2="72" class="edge"/>
    <line x1="132" y1="72" x2="204" y2="72" class="edge"/>
    <line x1="60" y1="144" x2="132" y2="144" class="edge"/>
    <line x1="132" y1="144" x2="204" y2="144" class="edge"/>
    <line x1="60" y1="216" x2="132" y2="216" class="edge"/>
    <line x1="132" y1="216" x2="204" y2="216" class="edge"/>
    <line x1="60" y1="72" x2="60" y2="144" class="edge"/>
    <line x1="60" y1="144" x2="60" y2="216" class="edge"/>
    <line x1="132" y1="72" x2="132" y2="144" class="edge"/>
    <line x1="132" y1="144" x2="132" y2="216" class="edge"/>
    <line x1="204" y1="72" x2="204" y2="144" class="edge"/>
    <line x1="204" y1="144" x2="204" y2="216" class="edge"/>

    <circle cx="60" cy="72" r="16" class="node-a"/>
    <circle cx="132" cy="72" r="16" class="node-a"/>
    <circle cx="204" cy="72" r="16" class="node-b"/>
    <circle cx="60" cy="144" r="16" class="node-b"/>
    <circle cx="132" cy="144" r="16" class="node-a"/>
    <circle cx="204" cy="144" r="16" class="node-b"/>
    <circle cx="60" cy="216" r="16" class="node-a"/>
    <circle cx="132" cy="216" r="16" class="node-b"/>
    <circle cx="204" cy="216" r="16" class="node-a"/>
  </g>

  <line x1="180" y1="282" x2="180" y2="348" class="arrow"/>
  <text x="180" y="320" text-anchor="middle" class="small">simplify topology</text>

  <g transform="translate(52 392)">
    <text x="128" y="0" text-anchor="middle" class="label">Regular grid graph</text>
    <text x="128" y="22" text-anchor="middle" class="small">same local-rule logic</text>

    <g transform="translate(32 42)">
      <rect x="0" y="0" width="48" height="48" class="cell-a"/>
      <rect x="48" y="0" width="48" height="48" class="cell-a"/>
      <rect x="96" y="0" width="48" height="48" class="cell-b"/>
      <rect x="144" y="0" width="48" height="48" class="cell"/>
      <rect x="0" y="48" width="48" height="48" class="cell-b"/>
      <rect x="48" y="48" width="48" height="48" class="cell-a"/>
      <rect x="96" y="48" width="48" height="48" class="cell-b"/>
      <rect x="144" y="48" width="48" height="48" class="cell-b"/>
      <rect x="0" y="96" width="48" height="48" class="cell-a"/>
      <rect x="48" y="96" width="48" height="48" class="cell"/>
      <rect x="96" y="96" width="48" height="48" class="cell-a"/>
      <rect x="144" y="96" width="48" height="48" class="cell-b"/>
      <rect x="0" y="144" width="48" height="48" class="cell"/>
      <rect x="48" y="144" width="48" height="48" class="cell-a"/>
      <rect x="96" y="144" width="48" height="48" class="cell-b"/>
      <rect x="144" y="144" width="48" height="48" class="cell-a"/>
    </g>

    <text x="128" y="258" text-anchor="middle" class="small">cells = nodes; adjacency = edges</text>
  </g>
</svg>
