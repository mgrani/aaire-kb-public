<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="'Segoe UI', Arial, sans-serif">

  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#263238">Schelling's threshold model — one step</text>
  <text x="360" y="42" text-anchor="middle" font-size="11" fill="#546e7a">Each agent wants at least τ = 3/8 of its neighbors to be same-type. Unhappy agents relocate.</text>

  <!-- LEFT: Before -->
  <g transform="translate(40,60)">
    <text x="120" y="16" text-anchor="middle" font-size="13" font-weight="bold" fill="#37474f">Before move</text>

    <!-- 5x5 grid, cell size 48 -->
    <g>
      <!-- Row 0 -->
      <rect x="0"   y="24" width="48" height="48" fill="#ef6c00" rx="4"/>
      <rect x="48"  y="24" width="48" height="48" fill="#ef6c00" rx="4"/>
      <rect x="96"  y="24" width="48" height="48" fill="#ef6c00" rx="4"/>
      <rect x="144" y="24" width="48" height="48" fill="#ef6c00" rx="4"/>
      <rect x="192" y="24" width="48" height="48" fill="#1976d2" rx="4"/>
      <!-- Row 1 -->
      <rect x="0"   y="72" width="48" height="48" fill="#ef6c00" rx="4"/>
      <rect x="48"  y="72" width="48" height="48" fill="#1976d2" rx="4" stroke="#c62828" stroke-width="2.5"/>
      <text x="72"  y="102" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">unhappy</text>
      <rect x="96"  y="72" width="48" height="48" fill="#ef6c00" rx="4"/>
      <rect x="144" y="72" width="48" height="48" fill="#1976d2" rx="4"/>
      <rect x="192" y="72" width="48" height="48" fill="#ef6c00" rx="4"/>
      <!-- Row 2 -->
      <rect x="0"   y="120" width="48" height="48" fill="#1976d2" rx="4"/>
      <rect x="48"  y="120" width="48" height="48" fill="#ef6c00" rx="4"/>
      <rect x="96"  y="120" width="48" height="48" fill="#ef6c00" rx="4"/>
      <rect x="144" y="120" width="48" height="48" fill="#ef6c00" rx="4"/>
      <rect x="192" y="120" width="48" height="48" fill="#1976d2" rx="4"/>
      <!-- Row 3 -->
      <rect x="0"   y="168" width="48" height="48" fill="#ef6c00" rx="4"/>
      <rect x="48"  y="168" width="48" height="48" fill="#1976d2" rx="4"/>
      <rect x="96"  y="168" width="48" height="48" fill="#ef6c00" rx="4"/>
      <rect x="144" y="168" width="48" height="48" fill="#1976d2" rx="4"/>
      <rect x="192" y="168" width="48" height="48" fill="#ef6c00" rx="4"/>
      <!-- Row 4 -->
      <rect x="0"   y="216" width="48" height="48" fill="#1976d2" rx="4"/>
      <rect x="48"  y="216" width="48" height="48" fill="#ef6c00" rx="4"/>
      <rect x="96"  y="216" width="48" height="48" fill="#1976d2" rx="4"/>
      <rect x="144" y="216" width="48" height="48" fill="#bbdefb" rx="4" stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="5,3"/>
      <text x="168" y="246" text-anchor="middle" font-size="9" fill="#9e9e9e">vacant</text>
      <rect x="192" y="216" width="48" height="48" fill="#1976d2" rx="4"/>
    </g>

    <!-- Arrow showing the unhappy cell's neighborhood -->
    <text x="72" y="116" text-anchor="middle" font-size="8" fill="#c62828">1/8 same</text>
  </g>

  <!-- Arrow -->
  <text x="355" y="195" text-anchor="middle" font-size="28" fill="#888">→</text>
  <text x="355" y="218" text-anchor="middle" font-size="10" fill="#757575">relocate</text>

  <!-- RIGHT: After -->
  <g transform="translate(430,60)">
    <text x="120" y="16" text-anchor="middle" font-size="13" font-weight="bold" fill="#37474f">After move</text>

    <g>
      <!-- Row 0 -->
      <rect x="0"   y="24" width="48" height="48" fill="#ef6c00" rx="4"/>
      <rect x="48"  y="24" width="48" height="48" fill="#ef6c00" rx="4"/>
      <rect x="96"  y="24" width="48" height="48" fill="#ef6c00" rx="4"/>
      <rect x="144" y="24" width="48" height="48" fill="#ef6c00" rx="4"/>
      <rect x="192" y="24" width="48" height="48" fill="#1976d2" rx="4"/>
      <!-- Row 1 -->
      <rect x="0"   y="72" width="48" height="48" fill="#ef6c00" rx="4"/>
      <rect x="48"  y="72" width="48" height="48" fill="#bbdefb" rx="4" stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="5,3"/>
      <text x="72"  y="102" text-anchor="middle" font-size="9" fill="#9e9e9e">vacant</text>
      <rect x="96"  y="72" width="48" height="48" fill="#ef6c00" rx="4"/>
      <rect x="144" y="72" width="48" height="48" fill="#1976d2" rx="4"/>
      <rect x="192" y="72" width="48" height="48" fill="#ef6c00" rx="4"/>
      <!-- Row 2 -->
      <rect x="0"   y="120" width="48" height="48" fill="#1976d2" rx="4"/>
      <rect x="48"  y="120" width="48" height="48" fill="#ef6c00" rx="4"/>
      <rect x="96"  y="120" width="48" height="48" fill="#ef6c00" rx="4"/>
      <rect x="144" y="120" width="48" height="48" fill="#ef6c00" rx="4"/>
      <rect x="192" y="120" width="48" height="48" fill="#1976d2" rx="4"/>
      <!-- Row 3 -->
      <rect x="0"   y="168" width="48" height="48" fill="#ef6c00" rx="4"/>
      <rect x="48"  y="168" width="48" height="48" fill="#1976d2" rx="4"/>
      <rect x="96"  y="168" width="48" height="48" fill="#ef6c00" rx="4"/>
      <rect x="144" y="168" width="48" height="48" fill="#1976d2" rx="4"/>
      <rect x="192" y="168" width="48" height="48" fill="#ef6c00" rx="4"/>
      <!-- Row 4 -->
      <rect x="0"   y="216" width="48" height="48" fill="#1976d2" rx="4"/>
      <rect x="48"  y="216" width="48" height="48" fill="#ef6c00" rx="4"/>
      <rect x="96"  y="216" width="48" height="48" fill="#1976d2" rx="4"/>
      <rect x="144" y="216" width="48" height="48" fill="#e8f5e9" rx="4" stroke="#2e7d32" stroke-width="2.5"/>
      <text x="168" y="246" text-anchor="middle" font-size="9" font-weight="bold" fill="#2e7d32">happy!</text>
      <rect x="192" y="216" width="48" height="48" fill="#1976d2" rx="4"/>
    </g>

    <text x="168" y="260" text-anchor="middle" font-size="8" fill="#2e7d32">3/5 same</text>
  </g>
</svg>
