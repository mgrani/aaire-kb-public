<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Selection, socialization, and contextual correlation</title>
  <desc id="desc">Three causal mechanisms that produce the same observed pattern of similar, connected nodes. Selection: similarity causes the tie. Socialization: the tie causes nodes to become similar. Contextual correlation: a shared context causes both similarity and tie, with no direct causal link between them.</desc>

  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#0d47a1"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#bf360c"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#455a64"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#263238">Three causal mechanisms &#8212; same observed pattern</text>
  <text x="600" y="52" text-anchor="middle" font-size="12" fill="#546e7a">All three produce the cross-sectional fact &#8220;connected nodes are similar.&#8221; Distinguishing them needs temporal data or knowledge of hidden context.</text>

  <!-- ===================== PANEL A: SELECTION ===================== -->
  <g>
    <rect x="20" y="78" width="376" height="465" rx="14" fill="#e8f0fe" stroke="#1976d2" stroke-width="1.5"/>
    <text x="208" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#0d47a1">A. Selection</text>
    <text x="208" y="122" text-anchor="middle" font-size="11" font-style="italic" fill="#37474f">similarity &#8594; tie</text>

    <!-- DAG -->
    <text x="208" y="148" text-anchor="middle" font-size="10" font-weight="600" fill="#546e7a">Causal diagram</text>
    <rect x="55" y="160" width="120" height="40" rx="6" fill="#ffffff" stroke="#0d47a1" stroke-width="1.8"/>
    <text x="115" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#0d47a1">Attribute X</text>
    <text x="115" y="192" text-anchor="middle" font-size="9" fill="#37474f">(similarity)</text>

    <rect x="240" y="160" width="120" height="40" rx="6" fill="#ffffff" stroke="#0d47a1" stroke-width="1.8"/>
    <text x="300" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#0d47a1">Tie</text>
    <text x="300" y="192" text-anchor="middle" font-size="9" fill="#37474f">(edge forms)</text>

    <line x1="175" y1="180" x2="232" y2="180" stroke="#0d47a1" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

    <!-- Network sketch with time -->
    <text x="208" y="240" text-anchor="middle" font-size="10" font-weight="600" fill="#546e7a">What happens over time</text>

    <!-- T1 -->
    <text x="108" y="263" text-anchor="middle" font-size="10" font-weight="700" fill="#37474f">T&#8321;</text>
    <text x="108" y="278" text-anchor="middle" font-size="9" fill="#607d8b">similar, no tie</text>
    <circle cx="80" cy="320" r="18" fill="#1976d2" stroke="#0d47a1" stroke-width="1.8"/>
    <circle cx="140" cy="320" r="18" fill="#1976d2" stroke="#0d47a1" stroke-width="1.8"/>

    <!-- Time arrow -->
    <line x1="175" y1="320" x2="238" y2="320" stroke="#37474f" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,4" marker-end="url(#arrowGray)"/>
    <text x="204" y="312" text-anchor="middle" font-size="9" fill="#37474f">time</text>

    <!-- T2 -->
    <text x="304" y="263" text-anchor="middle" font-size="10" font-weight="700" fill="#37474f">T&#8322;</text>
    <text x="304" y="278" text-anchor="middle" font-size="9" fill="#607d8b">tie now forms</text>
    <circle cx="276" cy="320" r="18" fill="#1976d2" stroke="#0d47a1" stroke-width="1.8"/>
    <circle cx="336" cy="320" r="18" fill="#1976d2" stroke="#0d47a1" stroke-width="1.8"/>
    <line x1="294" y1="320" x2="318" y2="320" stroke="#0d47a1" stroke-width="3"/>

    <!-- Story caption -->
    <rect x="40" y="370" width="336" height="160" rx="8" fill="#ffffff" stroke="#90caf9" stroke-width="1"/>
    <text x="208" y="391" text-anchor="middle" font-size="11" font-weight="700" fill="#0d47a1">Classroom example</text>
    <text x="208" y="412" text-anchor="middle" font-size="11" fill="#263238">Two students are already in</text>
    <text x="208" y="428" text-anchor="middle" font-size="11" fill="#263238">STEM. They meet and become</text>
    <text x="208" y="444" text-anchor="middle" font-size="11" fill="#263238">friends <tspan font-style="italic">because</tspan> they share that</text>
    <text x="208" y="460" text-anchor="middle" font-size="11" fill="#263238">interest.</text>
    <text x="208" y="488" text-anchor="middle" font-size="10" font-weight="600" fill="#37474f">Empirical signature:</text>
    <text x="208" y="505" text-anchor="middle" font-size="10" font-style="italic" fill="#37474f">new ties form preferentially</text>
    <text x="208" y="520" text-anchor="middle" font-size="10" font-style="italic" fill="#37474f">between already-similar people.</text>
  </g>

  <!-- ===================== PANEL B: SOCIALIZATION ===================== -->
  <g>
    <rect x="412" y="78" width="376" height="465" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
    <text x="600" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#bf360c">B. Socialization (influence)</text>
    <text x="600" y="122" text-anchor="middle" font-size="11" font-style="italic" fill="#37474f">tie &#8594; similarity</text>

    <!-- DAG -->
    <text x="600" y="148" text-anchor="middle" font-size="10" font-weight="600" fill="#546e7a">Causal diagram</text>
    <rect x="447" y="160" width="120" height="40" rx="6" fill="#ffffff" stroke="#bf360c" stroke-width="1.8"/>
    <text x="507" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#bf360c">Tie</text>
    <text x="507" y="192" text-anchor="middle" font-size="9" fill="#37474f">(edge exists)</text>

    <rect x="632" y="160" width="120" height="40" rx="6" fill="#ffffff" stroke="#bf360c" stroke-width="1.8"/>
    <text x="692" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#bf360c">Attribute X</text>
    <text x="692" y="192" text-anchor="middle" font-size="9" fill="#37474f">(similarity)</text>

    <line x1="567" y1="180" x2="624" y2="180" stroke="#bf360c" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowOrange)"/>

    <!-- Network sketch with time -->
    <text x="600" y="240" text-anchor="middle" font-size="10" font-weight="600" fill="#546e7a">What happens over time</text>

    <!-- T1 -->
    <text x="500" y="263" text-anchor="middle" font-size="10" font-weight="700" fill="#37474f">T&#8321;</text>
    <text x="500" y="278" text-anchor="middle" font-size="9" fill="#607d8b">tie, but different</text>
    <circle cx="472" cy="320" r="18" fill="#1976d2" stroke="#0d47a1" stroke-width="1.8"/>
    <circle cx="532" cy="320" r="18" fill="#ef6c00" stroke="#bf360c" stroke-width="1.8"/>
    <line x1="490" y1="320" x2="514" y2="320" stroke="#37474f" stroke-width="3"/>

    <!-- Time arrow -->
    <line x1="567" y1="320" x2="630" y2="320" stroke="#37474f" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,4" marker-end="url(#arrowGray)"/>
    <text x="596" y="312" text-anchor="middle" font-size="9" fill="#37474f">influence</text>

    <!-- T2 -->
    <text x="696" y="263" text-anchor="middle" font-size="10" font-weight="700" fill="#37474f">T&#8322;</text>
    <text x="696" y="278" text-anchor="middle" font-size="9" fill="#607d8b">tie + alike</text>
    <circle cx="668" cy="320" r="18" fill="#1976d2" stroke="#0d47a1" stroke-width="1.8"/>
    <circle cx="728" cy="320" r="18" fill="#1976d2" stroke="#0d47a1" stroke-width="1.8"/>
    <line x1="686" y1="320" x2="710" y2="320" stroke="#37474f" stroke-width="3"/>

    <!-- Story caption -->
    <rect x="432" y="370" width="336" height="160" rx="8" fill="#ffffff" stroke="#ffb74d" stroke-width="1"/>
    <text x="600" y="391" text-anchor="middle" font-size="11" font-weight="700" fill="#bf360c">Classroom example</text>
    <text x="600" y="412" text-anchor="middle" font-size="11" fill="#263238">A STEM and an Arts student</text>
    <text x="600" y="428" text-anchor="middle" font-size="11" fill="#263238">become friends. Over months,</text>
    <text x="600" y="444" text-anchor="middle" font-size="11" fill="#263238">the Arts student shifts interests</text>
    <text x="600" y="460" text-anchor="middle" font-size="11" fill="#263238">toward STEM.</text>
    <text x="600" y="488" text-anchor="middle" font-size="10" font-weight="600" fill="#37474f">Empirical signature:</text>
    <text x="600" y="505" text-anchor="middle" font-size="10" font-style="italic" fill="#37474f">attributes change after ties form,</text>
    <text x="600" y="520" text-anchor="middle" font-size="10" font-style="italic" fill="#37474f">in the direction of friend&#8217;s attribute.</text>
  </g>

  <!-- ===================== PANEL C: CONTEXT ===================== -->
  <g>
    <rect x="804" y="78" width="376" height="465" rx="14" fill="#f5f5f5" stroke="#546e7a" stroke-width="1.5"/>
    <text x="992" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#37474f">C. Contextual correlation</text>
    <text x="992" y="122" text-anchor="middle" font-size="11" font-style="italic" fill="#37474f">C &#8594; similarity AND C &#8594; tie</text>

    <!-- DAG: C at top, two arrows down -->
    <text x="992" y="148" text-anchor="middle" font-size="10" font-weight="600" fill="#546e7a">Causal diagram</text>

    <!-- C box -->
    <rect x="922" y="156" width="140" height="40" rx="6" fill="#ffffff" stroke="#546e7a" stroke-width="2"/>
    <text x="992" y="174" text-anchor="middle" font-size="11" font-weight="700" fill="#37474f">Context C</text>
    <text x="992" y="188" text-anchor="middle" font-size="9" fill="#607d8b">e.g., shared lab</text>

    <!-- Attribute X box (left bottom) -->
    <rect x="830" y="220" width="120" height="36" rx="6" fill="#ffffff" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="890" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#0d47a1">Attribute X</text>

    <!-- Tie box (right bottom) -->
    <rect x="1034" y="220" width="120" height="36" rx="6" fill="#ffffff" stroke="#bf360c" stroke-width="1.5"/>
    <text x="1094" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#bf360c">Tie</text>

    <!-- Arrows from C down to X and Tie -->
    <line x1="965" y1="196" x2="905" y2="216" stroke="#546e7a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowGray)"/>
    <line x1="1019" y1="196" x2="1079" y2="216" stroke="#546e7a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowGray)"/>

    <!-- NO direct arrow between X and Tie -->
    <line x1="950" y1="237" x2="1034" y2="237" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="2,3"/>
    <text x="992" y="275" text-anchor="middle" font-size="9" font-style="italic" fill="#90a4ae">no direct arrow between X and Tie</text>

    <!-- Network sketch with shared context -->
    <text x="992" y="305" text-anchor="middle" font-size="10" font-weight="600" fill="#546e7a">What we see in the data</text>

    <!-- Shaded context ellipse -->
    <ellipse cx="992" cy="345" rx="110" ry="36" fill="#cfd8dc" fill-opacity="0.6" stroke="#546e7a" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="992" y="318" text-anchor="middle" font-size="10" font-style="italic" fill="#455a64">shared context</text>
    <circle cx="956" cy="345" r="18" fill="#1976d2" stroke="#0d47a1" stroke-width="1.8"/>
    <circle cx="1028" cy="345" r="18" fill="#1976d2" stroke="#0d47a1" stroke-width="1.8"/>
    <line x1="974" y1="345" x2="1010" y2="345" stroke="#37474f" stroke-width="3"/>

    <!-- Story caption -->
    <rect x="824" y="395" width="336" height="135" rx="8" fill="#ffffff" stroke="#90a4ae" stroke-width="1"/>
    <text x="992" y="416" text-anchor="middle" font-size="11" font-weight="700" fill="#37474f">Classroom example</text>
    <text x="992" y="437" text-anchor="middle" font-size="11" fill="#263238">Two students share a lab.</text>
    <text x="992" y="453" text-anchor="middle" font-size="11" fill="#263238">The lab independently makes</text>
    <text x="992" y="469" text-anchor="middle" font-size="11" fill="#263238">them similar <tspan font-weight="700">and</tspan> brings them together.</text>
    <text x="992" y="494" text-anchor="middle" font-size="10" font-weight="600" fill="#37474f">Empirical signature:</text>
    <text x="992" y="511" text-anchor="middle" font-size="10" font-style="italic" fill="#37474f">association vanishes when</text>
    <text x="992" y="525" text-anchor="middle" font-size="10" font-style="italic" fill="#37474f">conditioning on C.</text>
  </g>
</svg>
