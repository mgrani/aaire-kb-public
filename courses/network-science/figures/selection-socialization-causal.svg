<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Selection versus socialization</title>
  <desc id="desc">Three-panel diagram distinguishing selection, socialization, and contextual correlation.</desc>
  <rect width="1200" height="380" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111111">Why observed similarity can arise in different ways</text>

  <rect x="40" y="70" width="350" height="260" rx="18" fill="#f7f7f7" stroke="#c8c8c8" stroke-width="2"/>
  <rect x="425" y="70" width="350" height="260" rx="18" fill="#f7f7f7" stroke="#c8c8c8" stroke-width="2"/>
  <rect x="810" y="70" width="350" height="260" rx="18" fill="#f7f7f7" stroke="#c8c8c8" stroke-width="2"/>

  <text x="215" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111111">Selection</text>
  <text x="600" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111111">Socialization</text>
  <text x="985" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111111">Context</text>

  <g>
    <circle cx="150" cy="170" r="18" fill="#5c84c7" stroke="#2f4e84" stroke-width="2"/>
    <circle cx="230" cy="140" r="18" fill="#5c84c7" stroke="#2f4e84" stroke-width="2"/>
    <circle cx="310" cy="180" r="18" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/>
    <line x1="150" y1="170" x2="230" y2="140" stroke="#7d9bd0" stroke-width="3"/>
    <text x="215" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#555555">similar actors choose each other</text>
  </g>

  <g>
    <circle cx="535" cy="170" r="18" fill="#5c84c7" stroke="#2f4e84" stroke-width="2"/>
    <circle cx="615" cy="140" r="18" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/>
    <line x1="535" y1="170" x2="615" y2="140" stroke="#8c8c8c" stroke-width="3"/>
    <polygon points="645,145 675,130 675,160" fill="#c07a42"/>
    <text x="600" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#555555">connected actors become more alike</text>
  </g>

  <g>
    <circle cx="920" cy="170" r="18" fill="#5c84c7" stroke="#2f4e84" stroke-width="2"/>
    <circle cx="1000" cy="140" r="18" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/>
    <rect x="1065" y="120" width="48" height="48" rx="8" fill="#dddddd" stroke="#666666" stroke-width="2"/>
    <line x1="1089" y1="168" x2="920" y2="220" stroke="#8c8c8c" stroke-width="2" stroke-dasharray="6 4"/>
    <line x1="1089" y1="168" x2="1000" y2="220" stroke="#8c8c8c" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="1089" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#333333">C</text>
    <text x="985" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#555555">a third factor affects both nodes</text>
  </g>
</svg>
