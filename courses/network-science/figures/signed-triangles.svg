<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="'Segoe UI', Arial, sans-serif">

  <text x="360" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">The four signed triangles</text>
  <text x="360" y="40" text-anchor="middle" font-size="11" fill="#546e7a">green = positive (+) · red dashed = negative (−) · balanced triangles have an even number of − edges</text>

  <!-- Triangle 1: +++ (balanced) -->
  <g transform="translate(20,56)">
    <rect x="0" y="0" width="160" height="190" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
    <text x="80" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">+ + +</text>
    <line x1="80"  y1="50"  x2="40"  y2="130" stroke="#2e7d32" stroke-width="3"/>
    <line x1="80"  y1="50"  x2="120" y2="130" stroke="#2e7d32" stroke-width="3"/>
    <line x1="40"  y1="130" x2="120" y2="130" stroke="#2e7d32" stroke-width="3"/>
    <text x="48"  y="85"  font-size="14" font-weight="bold" fill="#2e7d32">+</text>
    <text x="105" y="85"  font-size="14" font-weight="bold" fill="#2e7d32">+</text>
    <text x="80"  y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">+</text>
    <circle cx="80"  cy="50"  r="10" fill="#66bb6a" stroke="#1b5e20" stroke-width="1.5"/>
    <circle cx="40"  cy="130" r="10" fill="#66bb6a" stroke="#1b5e20" stroke-width="1.5"/>
    <circle cx="120" cy="130" r="10" fill="#66bb6a" stroke="#1b5e20" stroke-width="1.5"/>
    <text x="80" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">✓ balanced</text>
    <text x="80" y="188" text-anchor="middle" font-size="9" fill="#2e7d32">"all friends"</text>
  </g>

  <!-- Triangle 2: ++- (unbalanced) -->
  <g transform="translate(190,56)">
    <rect x="0" y="0" width="160" height="190" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="1.3"/>
    <text x="80" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#b71c1c">+ + −</text>
    <line x1="80"  y1="50"  x2="40"  y2="130" stroke="#2e7d32" stroke-width="3"/>
    <line x1="80"  y1="50"  x2="120" y2="130" stroke="#2e7d32" stroke-width="3"/>
    <line x1="40"  y1="130" x2="120" y2="130" stroke="#c62828" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="48"  y="85"  font-size="14" font-weight="bold" fill="#2e7d32">+</text>
    <text x="105" y="85"  font-size="14" font-weight="bold" fill="#2e7d32">+</text>
    <text x="80"  y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828">−</text>
    <circle cx="80"  cy="50"  r="10" fill="#ef5350" stroke="#7f0000" stroke-width="1.5"/>
    <circle cx="40"  cy="130" r="10" fill="#ef5350" stroke="#7f0000" stroke-width="1.5"/>
    <circle cx="120" cy="130" r="10" fill="#ef5350" stroke="#7f0000" stroke-width="1.5"/>
    <text x="80" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="#b71c1c">✗ unbalanced</text>
    <text x="80" y="188" text-anchor="middle" font-size="9" fill="#c62828">"two friends share an enemy"</text>
  </g>

  <!-- Triangle 3: +-- (balanced) -->
  <g transform="translate(360,56)">
    <rect x="0" y="0" width="160" height="190" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
    <text x="80" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">+ − −</text>
    <line x1="80"  y1="50"  x2="40"  y2="130" stroke="#2e7d32" stroke-width="3"/>
    <line x1="80"  y1="50"  x2="120" y2="130" stroke="#c62828" stroke-width="2.5" stroke-dasharray="6,4"/>
    <line x1="40"  y1="130" x2="120" y2="130" stroke="#c62828" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="48"  y="85"  font-size="14" font-weight="bold" fill="#2e7d32">+</text>
    <text x="105" y="85"  font-size="14" font-weight="bold" fill="#c62828">−</text>
    <text x="80"  y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828">−</text>
    <circle cx="80"  cy="50"  r="10" fill="#66bb6a" stroke="#1b5e20" stroke-width="1.5"/>
    <circle cx="40"  cy="130" r="10" fill="#66bb6a" stroke="#1b5e20" stroke-width="1.5"/>
    <circle cx="120" cy="130" r="10" fill="#ef5350" stroke="#7f0000" stroke-width="1.5"/>
    <text x="80" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">✓ balanced</text>
    <text x="80" y="188" text-anchor="middle" font-size="9" fill="#2e7d32">"enemy of my friend is my enemy"</text>
  </g>

  <!-- Triangle 4: --- (unbalanced under strong, balanced under weak) -->
  <g transform="translate(530,56)">
    <rect x="0" y="0" width="160" height="190" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
    <text x="80" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#bf360c">− − −</text>
    <line x1="80"  y1="50"  x2="40"  y2="130" stroke="#c62828" stroke-width="2.5" stroke-dasharray="6,4"/>
    <line x1="80"  y1="50"  x2="120" y2="130" stroke="#c62828" stroke-width="2.5" stroke-dasharray="6,4"/>
    <line x1="40"  y1="130" x2="120" y2="130" stroke="#c62828" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="48"  y="85"  font-size="14" font-weight="bold" fill="#c62828">−</text>
    <text x="105" y="85"  font-size="14" font-weight="bold" fill="#c62828">−</text>
    <text x="80"  y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828">−</text>
    <circle cx="80"  cy="50"  r="10" fill="#ef5350" stroke="#7f0000" stroke-width="1.5"/>
    <circle cx="40"  cy="130" r="10" fill="#ef5350" stroke="#7f0000" stroke-width="1.5"/>
    <circle cx="120" cy="130" r="10" fill="#ef5350" stroke="#7f0000" stroke-width="1.5"/>
    <text x="80" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="#e65100">✗ strong / ✓ weak</text>
    <text x="80" y="188" text-anchor="middle" font-size="9" fill="#bf360c">"three-way rivalry"</text>
  </g>
</svg>
