<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">SIR infection over time</title>
  <desc id="desc">Well-mixed SIR epidemic curves over time. The susceptible fraction declines, the infected fraction rises to an epidemic peak and then falls, and the recovered fraction accumulates to a final epidemic size below one.</desc>
  <rect width="720" height="330" fill="#ffffff"/>

  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#263238">SIR population curves over time</text>

  <!-- plot area: x 90..660, y 52 (=1) .. 266 (=0) -->
  <line x1="90" y1="52" x2="90" y2="266" stroke="#90a4ae" stroke-width="1.2"/>
  <line x1="90" y1="266" x2="668" y2="266" stroke="#90a4ae" stroke-width="1.2"/>
  <text x="84" y="58" text-anchor="end" font-size="9" fill="#757575">1.0</text>
  <text x="84" y="269" text-anchor="end" font-size="9" fill="#757575">0</text>
  <g transform="rotate(-90 42 160)"><text x="42" y="160" text-anchor="middle" font-size="10" fill="#546e7a">fraction of population</text></g>
  <text x="668" y="284" text-anchor="end" font-size="10" fill="#546e7a">time &#8594;</text>

  <!-- S curve -->
  <polyline points="90,58.1 147,62.3 204,72.8 261,98 318,140 346.5,161 375,182 432,207.2 489,224 546,232.4 603,236.6 660,238.7" fill="none" stroke="#1565c0" stroke-width="2.8"/>
  <!-- I curve -->
  <polyline points="90,263.9 147,261.8 204,255.5 261,240.8 318,219.8 346.5,203 375,207.2 432,219.8 489,236.6 546,249.2 603,257.6 660,261.8" fill="none" stroke="#c62828" stroke-width="2.8"/>
  <!-- R curve -->
  <polyline points="90,266 147,263.9 204,259.7 261,249.2 318,228.2 346.5,224 375,198.8 432,161 489,127.4 546,106.4 603,93.8 660,87.5" fill="none" stroke="#2e7d32" stroke-width="2.8"/>

  <!-- epidemic peak marker -->
  <line x1="346.5" y1="203" x2="346.5" y2="266" stroke="#c62828" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>
  <circle cx="346.5" cy="203" r="3.8" fill="#c62828"/>
  <text x="346.5" y="194" text-anchor="middle" font-size="10" font-weight="bold" fill="#c62828">epidemic peak</text>
  <text x="346.5" y="280" text-anchor="middle" font-size="9" fill="#757575">t&#8202;peak</text>

  <!-- final size annotation -->
  <text x="655" y="74" text-anchor="end" font-size="9.5" font-weight="bold" fill="#2e7d32">final size R(&#8734;)</text>
  <text x="655" y="255" text-anchor="end" font-size="9" fill="#1565c0">S(&#8734;): never infected</text>

  <!-- legend -->
  <g font-size="10">
    <line x1="108" y1="132" x2="134" y2="132" stroke="#1565c0" stroke-width="2.8"/>
    <text x="140" y="136" fill="#0d47a1">S(t) &#8212; susceptible</text>
    <line x1="108" y1="152" x2="134" y2="152" stroke="#c62828" stroke-width="2.8"/>
    <text x="140" y="156" fill="#7f0000">I(t) &#8212; infected</text>
    <line x1="108" y1="172" x2="134" y2="172" stroke="#2e7d32" stroke-width="2.8"/>
    <text x="140" y="176" fill="#1b5e20">R(t) &#8212; recovered</text>
  </g>
</svg>
