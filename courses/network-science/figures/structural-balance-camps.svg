<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Structural balance as two camps</title>
  <desc id="desc">Two internally positive camps with negative ties between them, illustrating balanced signed structure.</desc>
  <rect width="1200" height="360" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111111">Balanced signed structure collapses into camps</text>
  <rect x="50" y="70" width="1100" height="240" rx="20" fill="#f7f7f7" stroke="#c8c8c8" stroke-width="2"/>

  <g stroke="#57a266" stroke-width="3">
    <line x1="180" y1="140" x2="250" y2="110"/><line x1="250" y1="110" x2="320" y2="145"/><line x1="180" y1="140" x2="300" y2="215"/><line x1="250" y1="110" x2="300" y2="215"/><line x1="320" y1="145" x2="300" y2="215"/>
    <line x1="850" y1="140" x2="920" y2="110"/><line x1="920" y1="110" x2="990" y2="145"/><line x1="850" y1="140" x2="970" y2="215"/><line x1="920" y1="110" x2="970" y2="215"/><line x1="990" y1="145" x2="970" y2="215"/>
  </g>
  <g stroke="#c95c54" stroke-width="3" stroke-dasharray="8 6">
    <line x1="320" y1="145" x2="850" y2="140"/><line x1="300" y1="215" x2="920" y2="110"/><line x1="180" y1="140" x2="970" y2="215"/>
  </g>
  <g>
    <circle cx="180" cy="140" r="20" fill="#5c84c7" stroke="#2f4e84" stroke-width="2"/><circle cx="250" cy="110" r="20" fill="#5c84c7" stroke="#2f4e84" stroke-width="2"/><circle cx="320" cy="145" r="20" fill="#5c84c7" stroke="#2f4e84" stroke-width="2"/><circle cx="300" cy="215" r="20" fill="#5c84c7" stroke="#2f4e84" stroke-width="2"/>
    <circle cx="850" cy="140" r="20" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/><circle cx="920" cy="110" r="20" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/><circle cx="990" cy="145" r="20" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/><circle cx="970" cy="215" r="20" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/>
  </g>
  <text x="275" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#2f4e84">positive within camp</text>
  <text x="920" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#9a3e35">negative across camps</text>
</svg>
