<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Temporal snapshots</title>
  <desc id="desc">Three snapshots of the same network changing over time.</desc>
  <rect width="1200" height="340" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111111">Network snapshots at three times</text>
  <rect x="40" y="70" width="340" height="220" rx="18" fill="#f7f7f7" stroke="#c8c8c8" stroke-width="2"/>
  <rect x="430" y="70" width="340" height="220" rx="18" fill="#f7f7f7" stroke="#c8c8c8" stroke-width="2"/>
  <rect x="820" y="70" width="340" height="220" rx="18" fill="#f7f7f7" stroke="#c8c8c8" stroke-width="2"/>
  <text x="210" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111111">t = 1</text>
  <text x="600" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111111">t = 2</text>
  <text x="990" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111111">t = 3</text>

  <g fill="#5c84c7" stroke="#2f4e84" stroke-width="2">
    <circle cx="130" cy="170" r="18"/><circle cx="220" cy="130" r="18"/><circle cx="300" cy="190" r="18"/>
    <circle cx="520" cy="170" r="18"/><circle cx="610" cy="130" r="18"/><circle cx="690" cy="190" r="18"/>
    <circle cx="910" cy="170" r="18"/><circle cx="1000" cy="130" r="18"/><circle cx="1080" cy="190" r="18"/>
  </g>
  <g stroke="#9a9a9a" stroke-width="2">
    <line x1="130" y1="170" x2="220" y2="130"/><line x1="220" y1="130" x2="300" y2="190"/>
    <line x1="520" y1="170" x2="610" y2="130"/><line x1="520" y1="170" x2="690" y2="190"/><line x1="610" y1="130" x2="690" y2="190"/>
    <line x1="910" y1="170" x2="1000" y2="130"/><line x1="1000" y1="130" x2="1080" y2="190"/>
  </g>
  <text x="600" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#555555">A static graph is one slice; temporal networks track when edges appear, disappear, or reorder.</text>
</svg>
