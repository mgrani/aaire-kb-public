<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Threshold cascade</title>
  <desc id="desc">A threshold cascade where adoption depends on the share of active neighbors.</desc>
  <rect width="1200" height="340" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111111">Threshold cascade</text>

  <rect x="50" y="75" width="500" height="220" rx="18" fill="#f7f7f7" stroke="#c8c8c8" stroke-width="2"/>
  <rect x="650" y="75" width="500" height="220" rx="18" fill="#f7f7f7" stroke="#c8c8c8" stroke-width="2"/>
  <text x="300" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111111">Local rule</text>
  <text x="900" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111111">Global result</text>

  <text x="105" y="150" font-family="Courier New, monospace" font-size="20" fill="#222222">activate v if</text>
  <text x="105" y="185" font-family="Courier New, monospace" font-size="24" fill="#222222">active neighbors of v</text>
  <text x="105" y="220" font-family="Courier New, monospace" font-size="24" fill="#222222">---------------------  &gt;= theta</text>
  <text x="105" y="255" font-family="Courier New, monospace" font-size="24" fill="#222222"> total neighbors of v</text>

  <g stroke="#9a9a9a" stroke-width="2">
    <line x1="780" y1="160" x2="860" y2="120"/><line x1="780" y1="160" x2="860" y2="200"/><line x1="860" y1="120" x2="940" y2="160"/><line x1="860" y1="200" x2="940" y2="160"/><line x1="940" y1="160" x2="1020" y2="120"/>
  </g>
  <circle cx="780" cy="160" r="18" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/>
  <circle cx="860" cy="120" r="18" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/>
  <circle cx="860" cy="200" r="18" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/>
  <circle cx="940" cy="160" r="18" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/>
  <circle cx="1020" cy="120" r="18" fill="#d16b5d" stroke="#9a3e35" stroke-width="2"/>

  <text x="900" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#555555">A local adoption threshold can trigger a global cascade.</text>
</svg>
