<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="'Segoe UI', Arial, sans-serif">

  <!-- LEFT: Open triad -->
  <rect x="12" y="12" width="256" height="256" rx="14" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="140" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">Open Triad</text>
  <text x="140" y="58" text-anchor="middle" font-size="11" fill="#bf360c">A–B and A–C exist, B–C does not</text>

  <!-- edges -->
  <line x1="140" y1="100" x2="80"  y2="200" stroke="#ef6c00" stroke-width="2.6"/>
  <line x1="140" y1="100" x2="200" y2="200" stroke="#ef6c00" stroke-width="2.6"/>
  <!-- missing edge -->
  <line x1="80" y1="200" x2="200" y2="200" stroke="#bdbdbd" stroke-width="2.4" stroke-dasharray="5,4"/>
  <text x="140" y="232" text-anchor="middle" font-size="10" fill="#9e9e9e" font-style="italic">missing edge</text>

  <circle cx="140" cy="100" r="22" fill="#ef6c00" stroke="#bf360c" stroke-width="2"/>
  <text x="140" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="white">A</text>
  <circle cx="80"  cy="200" r="22" fill="#ffb74d" stroke="#bf360c" stroke-width="2"/>
  <text x="80"  y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="white">B</text>
  <circle cx="200" cy="200" r="22" fill="#ffb74d" stroke="#bf360c" stroke-width="2"/>
  <text x="200" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="white">C</text>

  <!-- ARROW -->
  <text x="295" y="155" text-anchor="middle" font-size="22" fill="#666">→</text>
  <text x="295" y="175" text-anchor="middle" font-size="9" fill="#888">closure</text>

  <!-- RIGHT: Closed triangle -->
  <rect x="320" y="12" width="228" height="256" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="434" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">Closed Triangle</text>
  <text x="434" y="58" text-anchor="middle" font-size="11" fill="#2e7d32">B–C edge has formed</text>

  <line x1="434" y1="100" x2="374" y2="200" stroke="#2e7d32" stroke-width="2.6"/>
  <line x1="434" y1="100" x2="494" y2="200" stroke="#2e7d32" stroke-width="2.6"/>
  <line x1="374" y1="200" x2="494" y2="200" stroke="#2e7d32" stroke-width="3.2"/>

  <circle cx="434" cy="100" r="22" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
  <text x="434" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="white">A</text>
  <circle cx="374" cy="200" r="22" fill="#43a047" stroke="#1b5e20" stroke-width="2"/>
  <text x="374" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="white">B</text>
  <circle cx="494" cy="200" r="22" fill="#43a047" stroke="#1b5e20" stroke-width="2"/>
  <text x="494" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="white">C</text>

  <text x="434" y="248" text-anchor="middle" font-size="10" fill="#1b5e20" font-style="italic">opportunity · trust · social pressure</text>
</svg>
