<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 360" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr-wpc" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#777"/>
    </marker>
  </defs>

  <!-- ===== PANEL 1: WALK ===== -->
  <rect x="10" y="10" width="310" height="340" rx="14" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="165" y="42" text-anchor="middle" font-size="15" font-weight="bold" fill="#f57f17">Walk</text>
  <text x="165" y="60" text-anchor="middle" font-size="11" fill="#795548">May revisit vertices or edges</text>

  <!-- Background edges (grey) -->
  <line x1="90" y1="150" x2="180" y2="110" stroke="#ccc" stroke-width="2"/>
  <line x1="180" y1="110" x2="250" y2="160" stroke="#ccc" stroke-width="2"/>
  <line x1="180" y1="110" x2="180" y2="210" stroke="#ccc" stroke-width="2"/>
  <line x1="90" y1="150" x2="180" y2="210" stroke="#ccc" stroke-width="2"/>
  <line x1="180" y1="210" x2="250" y2="160" stroke="#ccc" stroke-width="2"/>
  <line x1="90" y1="250" x2="90" y2="150" stroke="#ccc" stroke-width="2"/>
  <line x1="90" y1="250" x2="180" y2="210" stroke="#ccc" stroke-width="2"/>

  <!-- Walk: A→B→C→B→D (highlighted, revisits B) -->
  <polyline points="90,150 180,110 250,160 180,110 180,210" fill="none" stroke="#f9a825" stroke-width="3" stroke-dasharray="6,3" stroke-linejoin="round"/>

  <!-- Step arrows along the walk -->
  <line x1="90" y1="150" x2="175" y2="113" stroke="#f9a825" stroke-width="2.5" marker-end="url(#arr-wpc)"/>
  <line x1="180" y1="110" x2="245" y2="157" stroke="#f9a825" stroke-width="2.5" marker-end="url(#arr-wpc)"/>
  <line x1="250" y1="160" x2="187" y2="113" stroke="#f9a825" stroke-width="2.5" marker-end="url(#arr-wpc)"/>
  <line x1="180" y1="110" x2="180" y2="205" stroke="#f9a825" stroke-width="2.5" marker-end="url(#arr-wpc)"/>

  <!-- Nodes -->
  <circle cx="90" cy="150" r="20" fill="#fff9c4" stroke="#f57f17" stroke-width="2"/>
  <text x="90" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">A</text>
  <circle cx="180" cy="110" r="20" fill="#fff9c4" stroke="#f57f17" stroke-width="2"/>
  <text x="180" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">B</text>
  <circle cx="250" cy="160" r="20" fill="#fff9c4" stroke="#f57f17" stroke-width="2"/>
  <text x="250" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">C</text>
  <circle cx="180" cy="210" r="20" fill="#fff9c4" stroke="#f57f17" stroke-width="2"/>
  <text x="180" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">D</text>
  <circle cx="90" cy="250" r="20" fill="#e0e0e0" stroke="#aaa" stroke-width="2"/>
  <text x="90" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">E</text>

  <!-- Walk sequence label -->
  <text x="165" y="295" text-anchor="middle" font-size="12" fill="#795548">Sequence: A → B → C → B → D</text>
  <text x="165" y="313" text-anchor="middle" font-size="11" fill="#e65100">B is visited twice — valid walk!</text>

  <!-- ===== PANEL 2: PATH ===== -->
  <rect x="355" y="10" width="310" height="340" rx="14" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="510" y="42" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">Path</text>
  <text x="510" y="60" text-anchor="middle" font-size="11" fill="#1565c0">All vertices distinct (simple path)</text>

  <!-- Background edges (grey) -->
  <line x1="435" y1="150" x2="525" y2="110" stroke="#ccc" stroke-width="2"/>
  <line x1="525" y1="110" x2="595" y2="160" stroke="#ccc" stroke-width="2"/>
  <line x1="525" y1="110" x2="525" y2="210" stroke="#ccc" stroke-width="2"/>
  <line x1="435" y1="150" x2="525" y2="210" stroke="#ccc" stroke-width="2"/>
  <line x1="525" y1="210" x2="595" y2="160" stroke="#ccc" stroke-width="2"/>
  <line x1="435" y1="250" x2="435" y2="150" stroke="#ccc" stroke-width="2"/>
  <line x1="435" y1="250" x2="525" y2="210" stroke="#ccc" stroke-width="2"/>

  <!-- Path: A→B→D→C highlighted in blue -->
  <line x1="435" y1="150" x2="520" y2="113" stroke="#1565c0" stroke-width="3" marker-end="url(#arr-wpc)"/>
  <line x1="525" y1="110" x2="525" y2="205" stroke="#1565c0" stroke-width="3" marker-end="url(#arr-wpc)"/>
  <line x1="525" y1="210" x2="590" y2="163" stroke="#1565c0" stroke-width="3" marker-end="url(#arr-wpc)"/>

  <!-- Nodes -->
  <circle cx="435" cy="150" r="20" fill="#bbdefb" stroke="#0d47a1" stroke-width="2.5"/>
  <text x="435" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">A</text>
  <circle cx="525" cy="110" r="20" fill="#bbdefb" stroke="#0d47a1" stroke-width="2.5"/>
  <text x="525" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">B</text>
  <circle cx="595" cy="160" r="20" fill="#bbdefb" stroke="#0d47a1" stroke-width="2.5"/>
  <text x="595" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">C</text>
  <circle cx="525" cy="210" r="20" fill="#bbdefb" stroke="#0d47a1" stroke-width="2.5"/>
  <text x="525" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">D</text>
  <circle cx="435" cy="250" r="20" fill="#e0e0e0" stroke="#aaa" stroke-width="2"/>
  <text x="435" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">E</text>

  <!-- Path label -->
  <text x="510" y="295" text-anchor="middle" font-size="12" fill="#1565c0">Sequence: A → B → D → C</text>
  <text x="510" y="313" text-anchor="middle" font-size="11" fill="#0d47a1">Each vertex appears exactly once</text>

  <!-- ===== PANEL 3: CYCLE ===== -->
  <rect x="700" y="10" width="310" height="340" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="855" y="42" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">Cycle</text>
  <text x="855" y="60" text-anchor="middle" font-size="11" fill="#2e7d32">Closed walk, start = end, no other repeats</text>

  <!-- Background edges -->
  <line x1="780" y1="150" x2="870" y2="110" stroke="#ccc" stroke-width="2"/>
  <line x1="870" y1="110" x2="940" y2="160" stroke="#ccc" stroke-width="2"/>
  <line x1="870" y1="110" x2="870" y2="210" stroke="#ccc" stroke-width="2"/>
  <line x1="780" y1="150" x2="870" y2="210" stroke="#ccc" stroke-width="2"/>
  <line x1="870" y1="210" x2="940" y2="160" stroke="#ccc" stroke-width="2"/>
  <line x1="780" y1="250" x2="780" y2="150" stroke="#ccc" stroke-width="2"/>
  <line x1="780" y1="250" x2="870" y2="210" stroke="#ccc" stroke-width="2"/>

  <!-- Cycle: A→B→D→A highlighted in green -->
  <line x1="780" y1="150" x2="865" y2="113" stroke="#2e7d32" stroke-width="3" marker-end="url(#arr-wpc)"/>
  <line x1="870" y1="110" x2="870" y2="205" stroke="#2e7d32" stroke-width="3" marker-end="url(#arr-wpc)"/>
  <line x1="870" y1="210" x2="785" y2="155" stroke="#2e7d32" stroke-width="3" marker-end="url(#arr-wpc)"/>

  <!-- Nodes -->
  <circle cx="780" cy="150" r="20" fill="#a5d6a7" stroke="#1b5e20" stroke-width="2.5"/>
  <text x="780" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">A</text>
  <circle cx="870" cy="110" r="20" fill="#a5d6a7" stroke="#1b5e20" stroke-width="2.5"/>
  <text x="870" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">B</text>
  <circle cx="940" cy="160" r="20" fill="#e0e0e0" stroke="#aaa" stroke-width="2"/>
  <text x="940" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">C</text>
  <circle cx="870" cy="210" r="20" fill="#a5d6a7" stroke="#1b5e20" stroke-width="2.5"/>
  <text x="870" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">D</text>
  <circle cx="780" cy="250" r="20" fill="#e0e0e0" stroke="#aaa" stroke-width="2"/>
  <text x="780" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">E</text>

  <!-- Cycle label -->
  <text x="855" y="295" text-anchor="middle" font-size="12" fill="#2e7d32">Sequence: A → B → D → A</text>
  <text x="855" y="313" text-anchor="middle" font-size="11" fill="#1b5e20">Returns to start, no repeated intermediate vertex</text>
</svg>
