<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="'Segoe UI', Arial, sans-serif">

  <!-- LEFT: Assumption -->
  <rect x="12" y="12" width="300" height="296" rx="14" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="162" y="38" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">Assume: A–D is strong AND a local bridge</text>
  <text x="162" y="56" text-anchor="middle" font-size="11" fill="#1565c0">A also has strong ties to B and C</text>

  <!-- A center-left, D center-right -->
  <line x1="100" y1="180" x2="240" y2="180" stroke="#0d47a1" stroke-width="3.5"/>
  <text x="170" y="170" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">strong + local bridge?</text>

  <!-- B above A, C below A -->
  <line x1="100" y1="180" x2="60"  y2="100" stroke="#0d47a1" stroke-width="3.2"/>
  <line x1="100" y1="180" x2="60"  y2="260" stroke="#0d47a1" stroke-width="3.2"/>
  <text x="55" y="150" font-size="9" fill="#0d47a1">strong</text>
  <text x="55" y="220" font-size="9" fill="#0d47a1">strong</text>

  <circle cx="100" cy="180" r="22" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
  <text x="100" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="white">A</text>
  <circle cx="240" cy="180" r="22" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
  <text x="240" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="white">D</text>
  <circle cx="60"  cy="100" r="20" fill="#64b5f6" stroke="#0d47a1" stroke-width="2"/>
  <text x="60"  y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="white">B</text>
  <circle cx="60"  cy="260" r="20" fill="#64b5f6" stroke="#0d47a1" stroke-width="2"/>
  <text x="60"  y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="white">C</text>

  <!-- ARROW -->
  <text x="335" y="165" text-anchor="middle" font-size="22" fill="#666">→</text>
  <text x="335" y="183" text-anchor="middle" font-size="9" fill="#888">STC forces</text>

  <!-- RIGHT: Contradiction -->
  <rect x="356" y="12" width="272" height="296" rx="14" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
  <text x="492" y="38" text-anchor="middle" font-size="14" font-weight="bold" fill="#b71c1c">Contradiction</text>
  <text x="492" y="56" text-anchor="middle" font-size="11" fill="#c62828">B and C must connect to D → shared neighbors!</text>

  <!-- A and D -->
  <line x1="430" y1="180" x2="570" y2="180" stroke="#c62828" stroke-width="3.5"/>
  <line x1="430" y1="180" x2="390" y2="100" stroke="#c62828" stroke-width="3.2"/>
  <line x1="430" y1="180" x2="390" y2="260" stroke="#c62828" stroke-width="3.2"/>

  <!-- forced edges -->
  <line x1="390" y1="100" x2="570" y2="180" stroke="#e53935" stroke-width="2.6" stroke-dasharray="6,4"/>
  <line x1="390" y1="260" x2="570" y2="180" stroke="#e53935" stroke-width="2.6" stroke-dasharray="6,4"/>
  <text x="495" y="125" font-size="9" fill="#c62828" font-style="italic">forced by STC</text>
  <text x="495" y="245" font-size="9" fill="#c62828" font-style="italic">forced by STC</text>

  <circle cx="430" cy="180" r="22" fill="#c62828" stroke="#b71c1c" stroke-width="2"/>
  <text x="430" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="white">A</text>
  <circle cx="570" cy="180" r="22" fill="#c62828" stroke="#b71c1c" stroke-width="2"/>
  <text x="570" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="white">D</text>
  <circle cx="390" cy="100" r="20" fill="#ef9a9a" stroke="#b71c1c" stroke-width="2"/>
  <text x="390" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="white">B</text>
  <circle cx="390" cy="260" r="20" fill="#ef9a9a" stroke="#b71c1c" stroke-width="2"/>
  <text x="390" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="white">C</text>

  <text x="492" y="296" text-anchor="middle" font-size="10" fill="#b71c1c">A–D no longer a local bridge — B, C are shared neighbors</text>
</svg>
