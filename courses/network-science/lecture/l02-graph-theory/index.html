# Module 1
## Properties of Networks


<div class="guiding-question">

**Guiding Question:** What properties does a network have? What do we need to describe it?

</div>


Notes:
This is the bridge from Lecture 01 to formal graph theory. Let students brainstorm: number of entities? number of connections? who is connected to whom? are connections directed? do connections have strength? does the network change over time? Collect their answers. Each answer will map to a formal concept.

--

## What Does a Node Mean?

- In a social network: a **person** 
- In the Web: a **page** 
- In a financial network: an **institution** 
- In a transport network: a **city** or **station** 

A node is whatever entity you choose to model. That choice is never neutral — it determines what you can see and what you miss. 

Notes:
Push students: what if you modeled departments instead of people? Or paragraphs instead of web pages? The "right" node definition depends on the question you are asking. This is a modeling decision.

--

## What Does an Edge Mean?

- Friendship: **symmetric** — if A is friends with B, B is friends with A 
- Following on Twitter/X: **asymmetric** — A follows B does not mean B follows A 
- Email: **directed** — sender and receiver are distinct roles 
- Co-authorship: **symmetric** — both contributed to the same paper 

An edge encodes a relationship. But relationships differ: 

- symmetric vs. directed
- strong vs. weak
- binary vs. weighted. 

Notes:
Ask students for more examples. The key insight: the meaning and type of the edge is a modeling choice that affects every analysis downstream.

--

## What About Time?

- Networks **grow**: new people join, new links form 
- Networks **shrink**: people leave, links break 
- Networks **change**: relationships strengthen or weaken 
- The **order** of events matters: who connected to whom first? 

Most real networks are dynamic. A static graph is a snapshot — useful, but incomplete. 

Notes:
This is an important conceptual point. Most of the course will work with static snapshots for simplicity, but students should understand this is always a simplification.

--

## From Properties to Formal Language

We now have a list of properties we need to capture:

| Property | Formal concept |
|----------|---------------|
| Entities | Nodes (vertices) |
| Relationships | Edges (links) |
| Directionality | Directed vs. undirected graphs |
| Strength | Weighted vs. unweighted graphs |
| Structure | Adjacency matrix, degree |
| Time | Temporal / dynamic graphs |

Notes:
This table serves as a roadmap for the rest of the lecture. Each row will be formalized in the coming slides. Graph theory is not arbitrary notation — it is a response to real descriptive needs.

--

## Takeaway


<div class="takeaway">

Describing a network precisely requires answering: 

- What are the nodes? What are the edges? 
- Are they directed? Weighted? 
- Changing over time? 

Graph theory gives us a formal language to answer each of these questions.

</div>


Notes:
Transition to Module 2: now that we know what we need to describe, let us see the formal definitions.

# Module 2
## Graph Models


<div class="guiding-question">

**Guiding Question:** When is a graph model good enough — and what gets lost?

</div>

## Why Graph Theory

We identified properties we need to describe. Now we need precise definitions. Graph theory gives us that language and lets us move from intuition to analysis.

--

## Formal Definition

A graph $G = (V, E)$ consists of:

- a set of **vertices** (nodes) $V$
- a set of **edges** (links) $E \subseteq V \times V$

This compact notation already encodes a modeling choice: what counts as a node, what counts as a relationship. <!-- .element: class="fragment" -->

Notes:
Show the formal definition and ask: what does this notation tell us, and what does it hide? It tells us the structure but not the meaning — we supply the meaning through interpretation.

--

## Undirected Graphs


<div class="c-definition">

**Undirected Graph.** An undirected graph treats relationships as symmetric. An edge $\{u, v\}$ connects two vertices without orientation: $\{u, v\} = \{v, u\}$. Source and target are not distinguished.

</div>



<div class="columns col-2-1 figure-60">


<div class="column">

![Undirected graph example](/aaire-kb-public/courses/network-science/figures/graph-basic-undirected.svg)

</div>


<div class="column">

Edges have no arrows, meaning the relation is symmetric (e.g. friendship).

</div>


</div>


Notes:
This makes the symmetry assumption explicit. It is the formal answer to the "what does an edge mean" question for symmetric relations.

--

## Directed Graphs


<div class="c-definition">

**Directed Graph.** An edge $(u, v) \in E$ has a strict orientation from $u$ to $v$. $(u, v)$ does not imply $(v, u)$. Directions matter whenever the relation is asymmetric (e.g. following, citing).

</div>



<div class="columns col-2-1 figure-60">


<div class="column">

![Directed graph example](/aaire-kb-public/courses/network-science/figures/graph-basic-directed.svg)

</div>


<div class="column">


Edges have arrows indicating direction. The same set of nodes can yield very different models depending on this choice.

</div>


</div>


Notes:
Direction is not decoration; it changes the relation itself. Emphasize that this is a modeling decision with downstream consequences.

--

<!-- .slide: class="figure-100" -->

## Modeling Is a Choice

Before we analyse a graph, we decide how to turn a situation into one.

![Pipeline from reality to graph model](/aaire-kb-public/courses/network-science/figures/formalization-pipeline.svg)

Graph theory gives us a **formal language**, but the first step is still **epistemic**: choose the entities, choose the relations, and decide what abstraction is good enough for the question.

Notes:
Connect the formal definition to the earlier lecture. Mention affiliations: the same setting may become a bipartite graph or a projection depending on what the analysis needs.

--

## Weighted Graph


<div class="c-definition">

**Weighted Graph.** A graph equipped with a weight function $w : E \rightarrow \mathbb{R}$. The weight $w(e)$ lets edges carry strength, cost, length, probability, or capacity.

</div>




<div class="columns col-2-1 figure-60">


<div class="column">

![Weighted directed graph example](/aaire-kb-public/courses/network-science/figures/graph-weighted-directed.svg)

</div>


<div class="column">

Each edge carries a numerical value. The same topological structure can mean vastly different things depending on what the weights encode.

</div>


</div>


Notes:
Ask students what the weight means in a transport network versus an interaction network. The same graph structure can mean different things depending on what the weights encode.

--

<!-- .slide: class="figure-60" -->

## Bipartite Graphs


<div class="c-definition">

**Bipartite Graph.** A graph $G = (U, V, E)$ with two disjoint node sets ($U \cap V = \emptyset$) where all edges connect a node from $U$ to a node from $V$. Edges never connect two nodes within the same set.

</div>



<div class="columns col-2-1 figure-60">


<div class="column">

![Bipartite graph example](/aaire-kb-public/courses/network-science/figures/bipartite-graph.svg)

</div>


<div class="column">

Modelling of different kinds of nodes and limited edges. Useful when tracking relations between two inherently different sets of entities (e.g. students and courses, users and products).

</div>


</div>


Notes:
Keep it simple: two kinds of nodes, edges only across the split. Mention that projections are a later step, not part of the definition itself.

<div class="question">

<div class="fragment">

![Edge list, adjacency list, and adjacency matrix representations](/aaire-kb-public/courses/network-science/figures/graph-representations.svg)

Different representations make different operations easier.

- edge lists are compact and easy to read
- adjacency lists are good for traversal
- adjacency matrices are good for algebraic methods

## Neighbourhood and Degree


<div class="c-definition">

**Neighbourhood.** The neighbourhood $N(v)$ of a node $v$ is the set of all nodes connected to $v$ by an edge.

</div>


<div class="c-definition">

**Degree.** The degree $\deg(v)$ is the number of edges incident to $v$. In simple graphs, $\deg(v) = |N(v)|$.

</div>


![Neighbourhood and degree example](/aaire-kb-public/courses/network-science/figures/graph-neighbourhood-degree.svg)



Notes:
In directed graphs, this splits into in-neighbourhood (in-degree) and out-neighbourhood (out-degree).

# Module 3
## Paths and Distance


<div class="guiding-question">

**Guiding Question:** What does it mean for one node to "reach" another?

</div>


--

<!-- .slide: class="figure-50" -->

## Paths

A path is a sequence of vertices where each consecutive pair is connected by an edge.

![Path example in graph](/aaire-kb-public/courses/network-science/figures/graph-path-example.svg)

> **A path highlighted in a graph.** The colored edges trace a route from a start node to an end node. The path length equals the number of edges traversed.

Notes:
Walk the highlighted path slowly and name the start node, end node, and path length explicitly.

--

<!-- .slide: class="smaller" -->

## Walk, Path, Cycle


<div class="c-definition">

**Walk.** A walk of length $k$ is a sequence $v_0, v_1, \ldots, v_k$ where $(v_{i-1}, v_i) \in E$ for all $i$. Vertices may be repeated.

**Path.** A path is a walk where all vertices are distinct: $v_i \neq v_j$ for $i \neq j$. Also called *simple path*.

**Cycle.** A cycle is a walk $v_0, v_1, \ldots, v_k$ with $v_0 = v_k$ and all intermediate vertices distinct.

</div>


![Walk, path, and cycle examples](/aaire-kb-public/courses/network-science/figures/walk-path-cycle.svg)

**Directed vs. undirected.** In an undirected graph, an edge can be traversed in either direction. In a directed graph, each step must follow the edge direction.

Notes:
Walk through the distinction between walk (may revisit vertices) and path (no revisits). Shortest paths are always simple paths — revisiting a vertex can never shorten a path.

--

<!-- .slide: class="smaller" -->

## Path Length, Shortest Path, Diameter


<div class="c-definition">

**Path length.** The length of a path $v_0, \ldots, v_k$ is $k$ (number of edges). In a weighted graph: $\sum_{i=1}^{k} w(v_{i-1}, v_i)$.

**Shortest path.** $\text{dist}(u, v) = \min\lbrace k \mid \text{path of length } k \text{ from } u \text{ to } v\rbrace$. If no path exists, $\text{dist}(u, v) = \infty$.

**Diameter.** $\text{diam}(G) = \max_{u, v \in V} \text{dist}(u, v)$ — the longest shortest path in the graph.

</div>


![Path length and diameter examples](/aaire-kb-public/courses/network-science/figures/path-length-diameter.svg)

Notes:
In undirected graphs, distance is symmetric. In directed graphs, the shortest path from $u$ to $v$ may differ from $v$ to $u$. In weighted graphs, path length is the sum of weights, not edge count.

--

## Why Paths Matter

- they formalize reachability
- they give us a notion of distance
- they underpin routing, diffusion, and traversal algorithms

--

<!-- .slide: class="figure-60" -->

## A Classical Motivation

The Konigsberg bridges problem is one of the classic entry points into graph theory.

![Konigsberg bridges map](/aaire-kb-public/courses/network-science/figures/Konigsberg_bridges.png)

> **The Seven Bridges of Konigsberg (1736).** Euler asked whether one could walk through the city crossing each bridge exactly once. He proved it impossible — and in doing so, founded graph theory.

Notes:
This is the right moment to distinguish traversing edges from traversing vertices and prepare students for Eulerian versus Hamiltonian ideas.

--

## Eulerian Path and Circuit


<div class="c-definition">

**Eulerian Path.** A walk that traverses every edge of a graph exactly once. It exists if and only if exactly zero or two vertices have an odd degree.

**Eulerian Circuit.** An Eulerian path that starts and ends on the same vertex. It exists if and only if *every* vertex has an even degree.

</div>


![Eulerian path and circuit examples](/aaire-kb-public/courses/network-science/figures/graph-eulerian-concepts.svg)

Notes:
Connecting back to Königsberg: all four land masses had odd degrees (3, 3, 3, 5), violating both conditions.

--

## Takeaway


<div class="takeaway">

Paths turn connectivity into something analyzable: reachability, distance, redundancy, and traversal constraints.

</div>


Notes:
If time permits, ask for a practical interpretation: recommendation chains, routing paths, citation reach, infection spread.

## Mini-Exercise 2.C.1 — Solution

```python
def find_path(graph, start, end, path=[]):
    path = path + [start]
    if start == end: return path
    for node in graph.get(start, []):
        if node not in path:
            # Recursive call on the neighbor
            result = find_path(graph, node, end, path)
            if result is not None: return result
    return None
```
<!-- .element: class="fragment" -->

**Key insight:** DFS explores deep first and finds *any* path. How would we change the approach to guarantee finding the *shortest* path? <!-- .element: class="fragment" -->

Notes:
DFS goes deep first. If we want the shortest path, we need a breadth-first approach — which sets up the next module.

# Module 4
## Breadth-First Search


<div class="guiding-question">

**Guiding Question:** How can we systematically find a node — or the shortest route to it — in a large graph?

</div>


--

## Breadth-First Search

Breadth-first search explores a graph layer by layer, guaranteeing shortest paths in unweighted graphs.


<div class="columns">


<div class="column">


**Algorithm: BFS** <!-- .element: class="fragment" -->

*(Input: Graph $G=(V,E)$, source node $s$)* <!-- .element: class="fragment" -->

1. Initialize a **queue** $Q$ and add $s$ <!-- .element: class="fragment" -->
2. Mark $s$ as **visited** <!-- .element: class="fragment" -->
3. While $Q$ is not empty: <!-- .element: class="fragment" -->
   - Extract current node $u$ from the front of $Q$ <!-- .element: class="fragment" -->
   - For each neighbor $v$ of $u$: if $v$ is **not visited**, mark $v$ as visited and add $v$ to the back of $Q$ <!-- .element: class="fragment" -->


</div>


<div class="column">


**Key Properties:** <!-- .element: class="fragment" -->

- Uses a **FIFO** (First-In, First-Out) queue. <!-- .element: class="fragment" -->
- Discovers nodes strictly layer by layer. <!-- .element: class="fragment" -->
- Runs in $O(|V| + |E|)$ time. <!-- .element: class="fragment" -->
- Useful for shortest paths, components, and reachability. <!-- .element: class="fragment" -->


</div>


</div>


--

## Visual Intuition

![BFS layer-by-layer expansion](/aaire-kb-public/courses/network-science/figures/bfs-layers.svg)

> **BFS layer-by-layer expansion.** Starting from "You" (layer 0), BFS discovers all direct neighbors (layer 1), then all not-yet-visited neighbors of those (layer 2), and so on.

Notes:
Emphasize the layer-by-layer idea. Each layer consists of all nodes not already discovered that have an edge to some node in the previous layer.

--

<div class="columns">


<div class="column">


![BFS on ARPANET starting from UCLA](/aaire-kb-public/courses/network-science/figures/bfs-arpanet.svg)


</div>


<div class="column">


![ARPANET real-world topology](/aaire-kb-public/courses/network-science/figures/graph-internet.png)


</div>


</div>

--

## Complexity

- Queue-based BFS runs in $O(|V| + |E|)$ — each vertex and each edge is visited at most once
- This makes BFS the standard exact method for shortest paths in **unweighted** graphs

**Directed graphs:** BFS works identically — it follows edges in their given direction.

**Weighted graphs:** BFS does **not** give shortest paths when edges have different weights. For weighted shortest paths, use Dijkstra's algorithm.

Notes:
The complexity is linear in the size of the graph, which is optimal. For weighted graphs, the layer-by-layer guarantee breaks because a two-hop path with low weights can be shorter than a one-hop path with a high weight.

--

## Takeaway


<div class="takeaway">

BFS matters because a simple local rule produces exact shortest-path information in unweighted graphs.

</div>


--

## Dijkstra's Algorithm

BFS explores layer by layer. For **weighted** graphs, we use Dijkstra's algorithm.


<div class="columns">


<div class="column">


**Algorithm: Dijkstra**
*(Input: Graph $G=(V,E)$, source $s$, weights $w \ge 0$)*

1. Set distance to $s$ as $0$ and all others as $\infty$.
2. Initialize a **priority queue** $PQ$ with all nodes.
3. While $PQ$ is not empty:
   - Extract node $u$ with the minimum distance.
   - For each neighbor $v$ of $u$:
     - If path through $u$ is shorter: update $v$'s distance.


</div>


<div class="column">


![Dijkstra's algorithm example](/aaire-kb-public/courses/network-science/figures/dijkstra-example.svg)

> **BFS vs. Dijkstra.** BFS explores identical layers. Dijkstra uses a priority queue to always expand the currently cheapest unvisited node. Complexity: $O((|V|+|E|)\log |V|)$.


</div>


</div>


Notes:
Explain why BFS fails on weighted graphs: a two-hop path with low weights can be shorter than a one-hop path with a high weight. Dijkstra's key invariant: when a node is extracted from the priority queue, its distance is finalized. Note the non-negative weight requirement.

--

## Mini-Exercise 2.D.1

Consider our 5-node graph: `adj = {1: [2, 3], 2: [1, 4], 3: [1, 4], 4: [2, 3, 5], 5: [4]}`

def bfs(graph, start):
    distances = {start: 0}
    queue = deque([start])
    while queue:
        current = queue.popleft()
        for neighbor in graph.get(current, []):
            if neighbor not in distances:
                distances[neighbor] = _________________
                queue.________(neighbor)
    return distances
```

--

<!-- .slide: class="smaller" -->

## Mini-Exercise 2.D.1 — Solution

```python
from collections import deque

def bfs(graph, start):
    distances = {start: 0}
    queue = deque([start])
    while queue:
        current = queue.popleft()
        for neighbor in graph.get(current, []):
            if neighbor not in distances:
                distances[neighbor] = distances[current] + 1
                queue.append(neighbor)
    return distances
```
<!-- .element: class="fragment" -->

**Key insight:** Because the queue is FIFO, we always finish layer $k$ before starting layer $k+1$. The first time we see a node, we have found its shortest path. <!-- .element: class="fragment" -->

Notes:
Highlight that replacing queue.append() with pushing to a stack changes this to DFS. The FIFO property of the queue guarantees the shortest path property.

## Connectedness


<div class="c-definition">

**Connected (undirected).** Let $G = (V, E)$ be a graph. $G$ is *connected* if for every pair $u, v \in V$ there exists a path from $u$ to $v$.

</div>


![Connected and disconnected graph examples](/aaire-kb-public/courses/network-science/figures/connectedness-example.svg)

Notes:
The top graph is connected — a path from A to F is highlighted. The bottom graph is disconnected — two separate components with no edges between them.

## Connected Components

Connected components are maximal connected subgraphs.


<div class="c-definition">

**Connected component.** A *connected component* of $G$ is a subgraph $H \subseteq G$ such that:

1. $H$ is **connected** (every pair of vertices in $H$ has a path within $H$), and
2. $H$ is **maximal** — no vertex outside $H$ has a path to any vertex in $H$.

</div>


![Two connected components](/aaire-kb-public/courses/network-science/figures/graph-connected-components.svg)

> Each colored cluster is a maximal connected subgraph — meaning it cannot be extended without losing separation.

Notes:
Stress the word maximal. A component is not just any connected subset; it is one that cannot be extended without losing separation.

--

<!-- .slide: class="smaller" -->

## Connectedness in Directed Graphs

How does connectivity change when edges have direction?


<div class="c-definition">

**Strongly connected.** For every pair $u, v \in V$ there is a directed path from $u$ to $v$ **and** from $v$ to $u$.

**Weakly connected.** The graph is connected when all directed edges are replaced with undirected edges.

</div>


![Comparison of weakly and strongly connected directed graphs](/aaire-kb-public/courses/network-science/figures/connected-vs-strongly-connected.svg)

> **Left:** Weakly connected — $D$ cannot reach $A$ following arrows. **Right:** Strongly connected — every node reaches every other.

Notes:
Can a directed graph be weakly connected but not strongly connected? Yes — e.g. a chain A→B→C. Ask: which type describes the World Wide Web?

--

<!-- .slide: class="figure-85" -->

## Directed Graph Components

A directed graph has **weakly** and **strongly** connected components — reusing the definitions we already know.

![Directed graph with weakly and strongly connected components](/aaire-kb-public/courses/network-science/figures/directed-components-example.svg)

> **3 weakly connected components** (dashed borders). **2 strongly connected components** (shaded halos). Nodes D, G, H, I each form their own trivial SCC.

Notes:
Key insight: every WCC decomposes into one or more SCCs. Ask: why can't D join the SCC {A,B,C}? (No directed path from A,B,C back to D.)

## Giant Components


<div class="c-definition">

**Giant component.** A connected component that is significantly larger than all others, usually containing a macroscopic fraction of all vertices. Appears quite often in real world networks.

</div>


![High school social network giant component](/aaire-kb-public/courses/network-science/figures/social-network-highschool.png)
<span class="figure-credit">Source: Easley & Kleinberg 2010</span>

> The large central structure is the giant component. The small isolated clusters at the edges represent disconnected social groups.

## Takeaway


<div class="takeaway">

Connected components and giant components tell us whether interaction, diffusion, or coordination can happen across the whole graph or only inside local regions.

</div>

Build on your BFS implementation to find connected components:

Notes:
Give students 5 minutes. The key insight is that BFS naturally finds all nodes in a connected component.

## Mini-Exercise 2.E.1 — Solution

**Strategy:** Start from an unvisited node, run BFS to find all reachable nodes. Repeat until all nodes visited.

```python
def find_components(graph):
    visited = set()
    components = []
    for node in graph:
        if node not in visited:
            distances = bfs(graph, node)
            component = set(distances.keys())
            visited |= component
            components.append(component)
    return components

# Test with disconnected graph
graph = {
    "A": ["B"], "B": ["A", "C"], "C": ["B"],   # component 1
    "X": ["Y"], "Y": ["X", "Z"], "Z": ["Y"]    # component 2
}
print(find_components(graph))
# [{'A', 'B', 'C'}, {'X', 'Y', 'Z'}]
```
<!-- .element: class="fragment" -->

Notes:
Highlight how modules build on each other: the bfs function from Module 4 is reused here. Directed graph components require a different algorithm (Kosaraju's or Tarjan's). Removing a node that disconnects the graph is an articulation point (cut vertex).

## Wrap-Up

- **Networks have properties** that demand formal description
- **Graphs** provide a precise model: nodes, edges, weights, direction, time
- **Paths** give us reachability and distance
- **BFS** is a central traversal algorithm with guaranteed shortest paths
- **Dijkstra's** extends BFS to weighted graphs using a priority queue
- **Connectivity** helps us detect structure and giant components

### Reading

Chapter 2 of Easley & Kleinberg (2010) covers graph theory foundations, paths, BFS, and connectivity in detail.

Notes:
Reinforce transfer: these concepts are not isolated definitions. They are the vocabulary that later topics such as centrality, diffusion, communities, and web search will reuse.
