## The Oberseminar


<div class="grid-2-1">


<div class="column">

The entry point for **Bachelor's and Master's theses** at the chair.

- **Topic presentation** — twice a semester (today)
- **Monday sessions** — students present their topic, progress and final results
- **Who attends** — students looking for a topic and students writing their thesis

</div>


<div class="column">


<div class="c-warning">

### No-gos

- theses with companies
- topics outside the defined list or the open themes
- topics unrelated to the chair's research

</div>


</div>


</div>



<div class="takeaway">

Leave today with one topic in mind — and know what to do next.

</div>

## Topics

| | Defined topics | Open topics |
|---|---|---|
| **What** | specified by the chair | your own research question |
| **Areas** | see the list | **Agentic AI**, **Retrieval**, **AI** — nothing else |
| **Platforms** | stated per topic | ideally [OpenWebIndex.eu](https://openwebindex.eu), [ourrs.eu](https://ourrs.eu), [yoars.org](https://yoars.org) |
| **Start** | read the brief | bring a one-page research question |


<div class="c-note">

All defined topics with research questions and approach:
**[aaire.eu/research/thesis-topics](/research/thesis-topics/)**

</div>


Notes:
Selection is not guaranteed. It is based on affinity to the chair — courses
taken, grades and the quality of the discussion or one-pager. For open topics a
topic area is not enough: the one-pager names a concrete research question, why
the student is suited to it, and a plausible evaluation. OUR²S API access:
ourrs.eu/developers, login via B2ACCESS with University of Passau credentials.

## The Exposé


<div class="grid-3-2">


<div class="column">

| Section | Content |
|---|---|
| Motivation | why the problem matters now |
| State of the art | what exists, where it falls short |
| Research questions | at least three, specific and answerable |
| Methodology | data, metrics, baselines, tools |
| Work plan | 3–5 milestones with dates |
| Limitations | constraints and threats to validity |

</div>


<div class="column">


<div class="c-warning">

### Limitations are mandatory

A plan without stated limitations shows the scope is not yet understood.

</div>


A research question, not a project description. Code and data in Git from day
one; writing in English.

</div>


</div>


---

## Next Steps


<div class="marks-num">

1. **Pick** one topic on [/research/thesis-topics/](/research/thesis-topics/) — or an open topic in Agentic AI, Retrieval or AI
2. **Read and learn** — papers and platform docs, until you have an idea of what to do
3. **Come on Monday** at 14:00 with questions; return every 2–3 weeks until the topic fits
4. **Write the exposé** and present it at the Oberseminar
5. **Register** the thesis

</div>



<div class="takeaway">

Your next step is reading: go deep enough into the topic to propose what you want to do.
