Probabilistic Machine Learning

Notes:

# 3.A The Generative Route

--

## Exercise 3.A.1: Counting Parameters

A fraud classifier (two classes) uses four attributes: **payment** (card,
invoice, wallet), **country** (domestic, EU, other), **new device** (yes/no)
and **night** (yes/no).

1. How many free numbers does the full generative model need — the class
   prior and one joint $p(x \mid y)$ per class?
2. How many does naive Bayes need?
3. For $p$ yes/no attributes and $K$ classes, give both counts as formulas.
4. From which $p$ on does the full joint need more than a million numbers
   *per class*?


--

## Exercise 3.A.1: Counting Parameters — Solution


<div class="fragment">

**1. Full model.** Each class needs a table over $3 \cdot 3 \cdot 2 \cdot 2 = 36$
value combinations, of which 35 are free (they sum to 1). Two classes give 70;
the prior $P(\text{fraud})$ adds one: **71**.

**2. Naive Bayes.** Per class one categorical per attribute:
$(3-1) + (3-1) + (2-1) + (2-1) = 6$ free numbers. Two classes give 12, plus the
prior: **13**.

**3. Formulas.** Full: $K(2^p - 1) + (K - 1)$. Naive Bayes: $Kp + (K - 1)$.

**4.** $2^{19} - 1 = 524{,}287$ and $2^{20} - 1 = 1{,}048{,}575$, so from
**$p = 20$** on. The naive count grows linearly: 20 per class.

</div>

# 3.B Naive Bayes by Hand

--

<!-- .slide: class="smaller" -->

## Exercise 3.B.1: Twelve Transactions

Binary attributes: new device $D$, foreign IP $F$, night $N$, high amount $H$ (1 = yes).

| # | $D$ | $F$ | $N$ | $H$ | fraud? | | # | $D$ | $F$ | $N$ | $H$ | fraud? |
|---|---|---|---|---|---|---|---|---|---|---|---|---|
| 1 | 1 | 1 | 1 | 1 | yes | | 7 | 1 | 0 | 0 | 0 | no |
| 2 | 1 | 1 | 0 | 1 | yes | | 8 | 0 | 0 | 0 | 0 | no |
| 3 | 1 | 0 | 1 | 0 | yes | | 9 | 0 | 1 | 0 | 0 | no |
| 4 | 0 | 1 | 1 | 1 | yes | | 10 | 0 | 0 | 0 | 0 | no |
| 5 | 0 | 0 | 0 | 0 | no | | 11 | 1 | 0 | 1 | 0 | no |
| 6 | 0 | 0 | 1 | 0 | no | | 12 | 0 | 0 | 0 | 0 | no |

1. Estimate $P(\text{fraud})$ and $P(x\_j = 1 \mid \text{class})$ for all
   four binary attributes by counting.
2. Compute $P(\text{fraud} \mid x)$ for $x\_1 = (D, F, N, H) = (1, 0, 0, 0)$.
3. Do the same for $x\_2 = (0, 0, 0, 1)$. What goes wrong, and why?
4. Repeat 2 and 3 with Laplace smoothing on the binary attributes (keep the prior
   unsmoothed). Which result changes a lot, which only a little?


--

<!-- .slide: class="smaller" -->

## Exercise 3.B.1: Twelve Transactions — Solution


<div class="fragment">

**1.** $P(\text{fraud}) = 4/12 = 1/3$. Among the 4 frauds, each binary attribute occurs 3
times: $3/4$ for $D, F, N, H$. Among the 8 honest: $D$ $2/8$, $F$ $1/8$,
$N$ $2/8$, $H$ $0/8$.

**2.** Fraud: $\frac{1}{3} \cdot \frac{3}{4} \cdot \frac{1}{4} \cdot \frac{1}{4} \cdot \frac{1}{4} = \frac{1}{256} \approx 0.0039$.
Honest: $\frac{2}{3} \cdot \frac{2}{8} \cdot \frac{7}{8} \cdot \frac{6}{8} \cdot 1 = 0.1094$.
$P(\text{fraud} \mid x\_1) = 0.0039 / (0.0039 + 0.1094) = 1/29 \approx 0.034$.

**3.** Fraud: $\frac{1}{3} \cdot \frac{1}{4} \cdot \frac{1}{4} \cdot \frac{1}{4} \cdot \frac{3}{4} = \frac{1}{256}$.
Honest: $\ldots \cdot P(H{=}1 \mid \text{honest}) = 0$. So
$P(\text{fraud} \mid x\_2) = 1$: a transaction with no attribute at yes except a high
amount is **certain** fraud, because no honest high amount occurred in eight
rows. One zero count vetoes the other three binary attributes, which all speak for honest.

**4.** Smoothed, $(\text{count} + 1)/(n + 2)$: fraud $4/6 = 2/3$ for every binary attribute;
honest $D$ $0.3$, $F$ $0.2$, $N$ $0.3$, $H$ $0.1$.
$x\_1$: fraud $\frac{1}{3} \cdot \frac{2}{3} \cdot (\frac{1}{3})^3 = 0.0082$, honest
$\frac{2}{3} \cdot 0.3 \cdot 0.8 \cdot 0.7 \cdot 0.9 = 0.1008$, so
$P = 0.075$ (from 0.034).
$x\_2$: fraud $0.0082$, honest $\frac{2}{3} \cdot 0.7 \cdot 0.8 \cdot 0.7 \cdot 0.1 = 0.0261$,
so $P \approx 0.24$ (from 1). With 4 and 8 rows the prior of one pseudo-count
per value is not small, so even $x\_1$ moves — smoothing matters most where the
counts are smallest.

</div>

# 3.C Continuous Attributes

--

## Exercise 3.C.1: Gaussian Naive Bayes by Hand

Twelve transactions: the amount as $x = \log\_{10}$ amount in € ($x = 2$ is
100 €) and the binary attribute new device $D$.

| | $x$ | $D = 1$ |
|---|---|---|
| **4 frauds** | 2, 2, 3, 3 | 3 of 4 |
| **8 honest** | 1, 1, 1, 1, 2, 2, 2, 2 | 2 of 8 |

1. Fit a normal per class to $x$: mean and standard deviation (divide by $n$).
2. A new transaction of 316 € ($x = 2.5$), device unknown. Compute
   $p(x \mid \text{fraud})$, $p(x \mid \text{honest})$, their ratio and
   $P(\text{fraud} \mid x)$ with the prior of the table.
3. It came from a new device. Update the posterior with Gaussian naive Bayes.
4. Would the likelihood ratio change if the densities were written over the
   amount in € instead of $\log\_{10}$ amount? Why (not)?


--

## Exercise 3.C.1: Gaussian Naive Bayes by Hand — Solution


<div class="fragment">

**1.** Fraud: $\hat μ = 2.5$, deviations $\pm 0.5$, so $\hat σ = 0.5$. Honest:
$\hat μ = 1.5$, $\hat σ = 0.5$.

**2.** $p(2.5 \mid \text{fraud}) = \frac{1}{0.5\sqrt{2π}}\\, e^{0} = 0.798$;
honest: $z = 2$, so $p(2.5 \mid \text{honest}) = 0.798\\, e^{-2} = 0.108$.
Ratio $e^{2} \approx 7.39$. Prior odds $4 : 8$, posterior odds
$7.39/2 = 3.69$, $P(\text{fraud} \mid x) = 3.69/4.69 \approx 0.79$.

**3.** $\mathrm{LR}\_D = (3/4)/(2/8) = 3$. Posterior odds $3.69 \cdot 3 = 11.1$,
$P \approx 0.92$ — assuming amount and device independent given the class.

**4.** No. Over the amount $a = 10^x$ each density gets the factor
$1/(a \ln 10)$, the same in both classes at the same $a$; it cancels in the
ratio.

</div>




--

## Exercise 3.C.2: A Shared Spread Gives a Threshold

Both classes of 3.C.1 have the same spread, $σ = 0.5$.

1. Show that with equal spreads
   $\log \frac{p(x \mid \text{fraud})}{p(x \mid \text{honest})}$ is linear in
   $x$, and give it for the fitted numbers.
2. With the prior of the table, above which amount does the Bayes decision
   rule decide fraud?
3. The same model at the real base rate $1 : 999$: where is the cut now?
4. Write $P(\text{fraud} \mid x)$ as $1 / (1 + e^{-(wx + b)})$ for the prior of
   the table. Which model of the next lecture has this form?


--

## Exercise 3.C.2: A Shared Spread Gives a Threshold — Solution


<div class="fragment">

**1.** $\log \mathrm{LR}(x) = \frac{(x - μ\_h)^2 - (x - μ\_f)^2}{2σ^2}
= \frac{μ\_f - μ\_h}{σ^2}\\, x - \frac{μ\_f^2 - μ\_h^2}{2σ^2}$: the $x^2$ terms
cancel. Here $\frac{1}{0.25}\\, x - \frac{6.25 - 2.25}{0.5} = 4x - 8$.

**2.** Fraud iff $4x - 8 + \ln\frac{1}{2} > 0$, i.e.
$x > (8 + \ln 2)/4 = 2.17$: above $10^{2.17} \approx 150$ €.

**3.** $x > (8 + \ln 999)/4 = (8 + 6.91)/4 = 3.73$: above about 5,300 €. The
prior moves the cut; the model is unchanged.

**4.** $w = 4$, $b = -8 - \ln 2 \approx -8.69$. A logistic function of a linear
score: logistic regression (<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>)
fits $w$ and $b$ directly, without a model of $x$.

</div>

# 3.D A Posterior and Its Peak

--

## Exercise 3.D.1: Two Analysts, One Campaign

Same data: 60 of 400 converted. Analyst A uses a flat prior $\mathrm{Beta}(1,1)$;
analyst B, from earlier campaigns, uses $\mathrm{Beta}(20, 80)$.

1. Write down both posteriors and their means.
2. How many "pseudo-observations" is B's prior worth? Why do the two analysts
   nearly agree?
3. The data arrived in two batches: 25 of the first 200, 35 of the second 200.
   Show that updating twice gives the same posterior as updating once.
4. What is A's probability that the next user converts?


--

## Exercise 3.D.1: Two Analysts, One Campaign — Solution


<div class="fragment">

1. A: $\mathrm{Beta}(61, 341)$, mean $61/402 \approx 0.152$.
   B: $\mathrm{Beta}(80, 420)$, mean $80/500 = 0.160$.
   95% credible intervals: A $[0.118, 0.188]$, B $[0.129, 0.193]$.
2. $a + b = 100$ pseudo-observations against 400 real ones; B's prior mean 0.2 is
   pulled almost all the way to the data's 0.15.
3. A: $\mathrm{Beta}(1,1) \to \mathrm{Beta}(26, 176) \to \mathrm{Beta}(61, 341)$
   — counts simply add, in any order.
4. The posterior mean, $\approx 0.152$: averaging $\theta$ over the posterior.

</div>




--

## Exercise 3.D.2: Peak, Mean and a Prior's Peak

Returning users, $\theta = P(\text{user returns})$, prior $\mathrm{Beta}(a, b)$,
$h$ of $n$ users return.

1. Maximise $\log p(D \mid \theta) + \log p(\theta)$ and show
   $\hat{\theta}\_{\mathrm{MAP}} = \frac{h + a - 1}{n + a + b - 2}$.
2. **0 of 4** users return. Give the MLE, the MAP under $\mathrm{Beta}(2, 2)$ and
   the posterior mean under $\mathrm{Beta}(2, 2)$. Which one would you report to
   a product manager, and why?
3. The posterior mean under a flat prior is $\frac{h + 1}{n + 2}$. Under which
   prior is the **MAP** equal to it?
4. After 3 of 3 with a flat prior the posterior is $\mathrm{Beta}(4, 1)$, with
   density $4\theta^3$. Compute its central 95% interval.


--

## Exercise 3.D.2: Peak, Mean and a Prior's Peak — Solution


<div class="fragment">

1. $\log p(D \mid \theta) + \log p(\theta) = (h + a - 1)\log\theta + (n - h + b - 1)\log(1-\theta) + \text{const}$.
   Setting the derivative $\frac{h + a - 1}{\theta} - \frac{n - h + b - 1}{1 - \theta}$
   to zero gives the formula — the MLE of a dataset with $a - 1$ extra yeses
   and $b - 1$ extra noes.
2. MLE $0/4 = 0$: "nobody ever returns". MAP $\frac{0 + 1}{4 + 2} = \frac{1}{6} \approx 0.17$.
   Posterior $\mathrm{Beta}(2, 6)$, mean $\frac{2}{8} = 0.25$. Report the
   posterior (mean and interval): four users are too few for a point, and the
   MLE claims certainty the data cannot give.
3. $\frac{h + a - 1}{n + a + b - 2} = \frac{h + 1}{n + 2}$ for all $h, n$ needs
   $a = b = 2$: the MAP under $\mathrm{Beta}(2, 2)$ equals the posterior mean
   under $\mathrm{Beta}(1, 1)$. "Add one yes and one no" can be read either way —
   the Naive Bayes module of <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a> calls it Laplace
   smoothing.
4. The CDF is $\theta^4$, so the interval is
   $[0.025^{1/4}, 0.975^{1/4}] \approx [0.40, 0.99]$ — the peak at 1 lies at the
   edge of it.

</div>




--

## Exercise 3.D.3: Fitting Is Counting

An attribute takes $k$ values. Within one class we observed it $n$ times, value
$v$ exactly $n\_v$ times ($\sum\_v n\_v = n$). Model it as categorical with
parameters $\theta\_1, \ldots, \theta\_k \geq 0$, $\sum\_v \theta\_v = 1$.

1. Write down the log-likelihood $\ell(\theta)$ of the $n$ i.i.d. observations.
2. For $k = 2$, substitute $\theta\_2 = 1 - \theta\_1$ and show that the MLE is
   $\hat{\theta}\_1 = n\_1 / n$ — the $h/n$ of <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>.
3. For general $k$, maximise $\ell$ under the constraint $\sum\_v \theta\_v = 1$
   (Lagrange multiplier) and show $\hat{\theta}\_v = n\_v / n$.
4. Why can naive Bayes fit every attribute's table separately, while a full
   joint $p(x \mid y)$ could not be fitted attribute by attribute?


--

<!-- .slide: class="smaller" -->

## Exercise 3.D.3: Fitting Is Counting — Solution


<div class="fragment">

**1.** Each observation of value $v$ contributes $\theta\_v$:
$$
\ell(\theta) = \sum\_{v=1}^{k} n\_v \log \theta\_v
$$

**2.** $\ell = n\_1 \log \theta\_1 + n\_2 \log(1 - \theta\_1)$. Setting
$\ell'(\theta\_1) = n\_1/\theta\_1 - n\_2/(1 - \theta\_1) = 0$ gives
$n\_1(1 - \theta\_1) = n\_2 \theta\_1$, so $\hat{\theta}\_1 = n\_1/(n\_1 + n\_2) = n\_1/n$.

**3.** $L(\theta, \lambda) = \sum\_v n\_v \log \theta\_v - \lambda(\sum\_v \theta\_v - 1)$.
From $\partial L / \partial \theta\_v = n\_v/\theta\_v - \lambda = 0$ we get
$\theta\_v = n\_v/\lambda$; the constraint gives $\lambda = \sum\_v n\_v = n$, so
$\hat{\theta}\_v = n\_v / n$ — the relative frequency.

**4.** Under the naive assumption the log-likelihood of the table is a **sum**
of one term $\sum\_v n(x\_j = v, y) \log \theta\_{jvy}$ per attribute and class; no
parameter appears in two terms, so each term is maximised on its own — by
counting. A full joint has one parameter per *combination* of values; its
counts are counts of whole rows, and they cannot be split into per-attribute
counts.

</div>




--

## Exercise 3.D.4: Smoothing Is a Prior

A binary attribute was seen $h$ times among $n$ frauds.

1. With a $\mathrm{Beta}(1, 1)$ prior on $\theta = P(x = 1 \mid \text{fraud})$,
   what is the posterior (<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>)? Show that its **mean** is Laplace's
   $(h + 1)/(n + 2)$.
2. What is the posterior's **peak** for $h = 0$? What does that say about
   "keep the peak"?
3. "Add-$\alpha$" smoothing uses $(h + \alpha)/(n + 2\alpha)$. Which prior
   belongs to it? Compute the estimate for $h = 0$, $n = 100$ and
   $\alpha = 0.5, 1, 10$.
4. A merchant category with $k = 10$ values; one category never occurred in
   100 frauds. What does Laplace smoothing give, and which prior is behind it?


--

## Exercise 3.D.4: Smoothing Is a Prior — Solution


<div class="fragment">

**1.** Adding counts: $\mathrm{Beta}(1 + h,\ 1 + n - h)$, with mean
$\frac{1 + h}{(1 + h) + (1 + n - h)} = \frac{h + 1}{n + 2}$.

**2.** The mode of $\mathrm{Beta}(a, b)$ is $\frac{a - 1}{a + b - 2}$; here
$\frac{h}{n} = 0$. Under a flat prior the peak *is* the MLE, so keeping the
peak keeps the zero. Laplace smoothing silently switches to the mean.

**3.** $\mathrm{Beta}(\alpha, \alpha)$: posterior $\mathrm{Beta}(\alpha + h, \alpha + n - h)$,
mean $(h + \alpha)/(n + 2\alpha)$. For $h = 0$, $n = 100$:
$\alpha = 0.5$: $0.5/101 \approx 0.0050$; $\alpha = 1$: $1/102 \approx 0.0098$;
$\alpha = 10$: $10/120 \approx 0.083$. A larger $\alpha$ is a stronger belief
that $\theta$ is near $1/2$ — worth $2\alpha$ imagined observations.

**4.** $(0 + 1)/(100 + 10) = 1/110 \approx 0.0091$ — the posterior mean under a
flat **Dirichlet**$(1, \ldots, 1)$, the Beta for more than two values.

</div>

    const scale = () => window.Reveal?.getScale?.() || 1;

    // Grow the figure until either the width or the free height runs out.
    function fitFigure(sec) {
      const holder = sec.querySelector(".viz:not(.eq-explain)");
      if (!holder) return;
      const svg = holder.querySelector("svg");
      if (!svg || !svg.viewBox || !svg.viewBox.baseVal) return;
      const vb = svg.viewBox.baseVal;
      if (!vb.width || !vb.height) return;
      const aspect = vb.width / vb.height;
      const s = scale();

      // measure the rest of the slide without our own constraint in the way
      svg.style.maxWidth = "";
      let used = 0;
      for (const child of sec.children) {
        if (child.tagName === "ASIDE") continue;
        if (child === holder || child.contains(holder)) continue;
        used += child.getBoundingClientRect().height / s + PER_CHILD;
      }
      const avail = SLIDE_H - used - EDGE;
      if (avail <= 80) return;                       // no room: leave the CSS cap

      let width = Math.min(SLIDE_W - 2 * EDGE, aspect * avail);
      svg.style.maxWidth = Math.floor(width) + "px";

      // The estimate above ignores the figure's own margins and any rounding,
      // so grow first and then pull back until the slide genuinely fits. Two
      // or three passes settle it; the guard stops a pathological loop.
      for (let k = 0; k < 6; k++) {
        const over = sec.scrollHeight - SLIDE_H;
        if (over <= 0) break;
        width -= aspect * (over + 6);
        if (width < 240) { width = 240; svg.style.maxWidth = "240px"; break; }
        svg.style.maxWidth = Math.floor(width) + "px";
      }
    }

    // How much of the canvas the content actually uses. scrollHeight cannot
    // answer this: the theme lays a rendered slide out at the full 720px, so it
    // reads 720 whatever the content is — and reads 0 while the slide is
    // display:none. Measuring the children works in both states.
    function contentHeight(sec) {
      const s = scale();
      let used = 0;
      for (const child of sec.children) {
        if (child.tagName === "ASIDE") continue;
        const h = child.getBoundingClientRect().height;
        if (!h) continue;
        used += h / s + PER_CHILD;
      }
      return used;
    }

    function fit() {
      for (const sec of document.querySelectorAll(".reveal .slides section")) {
        if (sec.querySelector("section")) continue;              // stack wrapper
        if (sec.classList.contains("title-slide")) continue;
        if (sec.classList.contains("module-slide")) continue;
        fitFigure(sec);
        const used = contentHeight(sec);
        // A hidden slide measures 0; leave its class alone rather than
        // centring everything off-screen. It is measured when it becomes
        // current, since fit() runs on every slidechanged.
        if (used === 0) continue;
        sec.classList.remove("v-center");
        if (SLIDE_H - used > MIN_FREE) {
          sec.classList.add("v-center");
          // Child rectangles exclude margins, so a slide whose blocks are
          // generously spaced measures smaller than it lays out. Under
          // .v-center the section is exactly SLIDE_H tall, which makes
          // scrollHeight an exact overflow test — take the centring back if
          // it pushed anything past the bottom edge.
          if (sec.scrollHeight > SLIDE_H) sec.classList.remove("v-center");
        }
      }
    }

    const start = () => {
      fit();
      window.Reveal?.on?.("slidechanged", fit);
      window.Reveal?.on?.("resize", fit);
      setTimeout(fit, 1200);                 // visualizations mount asynchronously
    };
    if (window.Reveal?.isReady?.()) start();
    else window.Reveal?.on("ready", start);
  })();
})();</script></body></html>
