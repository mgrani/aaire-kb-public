<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Lecture 01 argument map</title>
  <desc id="desc">From a bare label to a number, to the sources and locations of uncertainty, to probability as the language and the course programme of one ideal and several shortcuts.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="12" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#64748b"/>
    </marker>
    <style>
      .head { font: 700 17px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .text { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .small { font: 12px Arial, "Helvetica Neue", sans-serif; fill: #475569; }
      .tag { font: 700 11px Arial, "Helvetica Neue", sans-serif; letter-spacing: 0.08em; }
      .arclabel { font: 700 14px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
      .arcsub { font: 12px Arial, "Helvetica Neue", sans-serif; fill: #64748b; }
      .arcnum { font: 700 12px Arial, "Helvetica Neue", sans-serif; }
      .arcname { font: 12.5px Arial, "Helvetica Neue", sans-serif; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="1" y="1" width="1118" height="638" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="50" y="46" class="arclabel" style="font-size:15px">Lecture 01 · argument map</text>
  <path d="M358 134 H406" class="arrow"/>
  <path d="M714 134 H762" class="arrow"/>
  <path d="M916 196 C916 217 204 217 204 238" class="arrow"/>
  <path d="M358 300 H406" class="arrow"/>
  <path d="M714 300 H762" class="arrow"/>
  <path d="M916 362 C916 383 916 383 916 404" class="arrow"/>
  <g transform="translate(50 72)">
    <rect width="308" height="124" rx="12" fill="#e8f6f9" stroke="#0083A1" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#0083A1">WHY PROBABILITY</text>
    <text x="18" y="48" class="head">A label is not enough</text>
    <text x="18" y="73" class="text">three cases, one word: "fraud"</text>
    <text x="18" y="93" class="small">0.98, 0.55, 0.51 hide behind it</text>
  </g>
  <g transform="translate(406 72)">
    <rect width="308" height="124" rx="12" fill="#f0fdf4" stroke="#16803c" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#16803c">WHY PROBABILITY</text>
    <text x="18" y="48" class="head">A number enables decisions</text>
    <text x="18" y="73" class="text">rank, weigh costs, defer</text>
    <text x="18" y="93" class="small">threshold from the costs: p* = 0.1</text>
    <text x="18" y="111" class="small">not 0.5</text>
  </g>
  <g transform="translate(762 72)">
    <rect width="308" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">WHERE FROM</text>
    <text x="18" y="48" class="head">Two sources of uncertainty</text>
    <text x="18" y="73" class="text">noise in the world (aleatoric)</text>
    <text x="18" y="93" class="small">gaps in knowledge (epistemic)</text>
    <text x="18" y="111" class="small">only the second shrinks with data</text>
  </g>
  <g transform="translate(50 238)">
    <rect width="308" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">WHERE IT ENTERS</text>
    <text x="18" y="48" class="head">It enters everywhere</text>
    <text x="18" y="73" class="text">data, model, parameters, loss,</text>
    <text x="18" y="93" class="small">optimisation, evaluation</text>
    <text x="18" y="111" class="small">your models reported none of it</text>
  </g>
  <g transform="translate(406 238)">
    <rect width="308" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">BEYOND TRUE OR FALSE</text>
    <text x="18" y="48" class="head">Prediction is a bet</text>
    <text x="18" y="73" class="text">not proof: induction, abduction</text>
    <text x="18" y="93" class="small">anomaly: absorb it or revise?</text>
    <text x="18" y="111" class="small">Uranus ✓ vs Mercury ✗</text>
  </g>
  <g transform="translate(762 238)">
    <rect width="308" height="124" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#7c3aed">BEYOND TRUE OR FALSE</text>
    <text x="18" y="48" class="head">Probability is the language</text>
    <text x="18" y="73" class="text">represent, combine, update</text>
    <text x="18" y="93" class="small">deciding adds the costs</text>
  </g>
  <g transform="translate(50 404)">
    <rect width="1020" height="124" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#7c3aed">THE ROAD AHEAD</text>
    <text x="18" y="48" class="head">One ideal, several shortcuts</text>
    <text x="18" y="73" class="text">model the joint → condition on the data → read off answers</text>
    <text x="18" y="93" class="small">every method you know takes a shortcut; each lecture names which one, and what it drops</text>
  </g>
  <line x1="50" y1="540" x2="1070" y2="540" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="50" y="582" class="arclabel">Course arc</text>
  <text x="50" y="600" class="arcsub">ideal → shortcuts</text>
  <rect x="168" y="560" width="122" height="52" rx="10" fill="#164374" stroke="#164374" stroke-width="2"/>
  <text x="229" y="581" text-anchor="middle" class="arcnum" fill="#ffffff">L01</text>
  <text x="229" y="600" text-anchor="middle" class="arcname" fill="#ffffff">The ideal</text>
  <rect x="298" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="359" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L02</text>
  <text x="359" y="600" text-anchor="middle" class="arcname" fill="#64748b">The language</text>
  <rect x="428" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="489" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L03</text>
  <text x="489" y="600" text-anchor="middle" class="arcname" fill="#64748b">Keep the peak</text>
  <rect x="558" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="619" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L04</text>
  <text x="619" y="600" text-anchor="middle" class="arcname" fill="#64748b">Assume it apart</text>
  <rect x="688" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="749" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L05</text>
  <text x="749" y="600" text-anchor="middle" class="arcname" fill="#64748b">Graph the joint</text>
  <rect x="818" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="879" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L06</text>
  <text x="879" y="600" text-anchor="middle" class="arcname" fill="#64748b">Keep the loss</text>
  <rect x="948" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1009" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L07</text>
  <text x="1009" y="600" text-anchor="middle" class="arcname" fill="#64748b">No shortcut</text>
</svg>
