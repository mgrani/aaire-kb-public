<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Lecture 02 argument map</title>
  <desc id="desc">One module per box, in lecture order: an introductory counting example, then two strands, events through conditioning, Bayes and independence, and quantities through random variables and joints, which meet at data as a sample and at statistics and estimation.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="12" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#64748b"/>
    </marker>
    <style>
      .head { font: 700 17px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .text { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .small { font: 12px Arial, "Helvetica Neue", sans-serif; fill: #475569; }
      .tag { font: 700 11px Arial, "Helvetica Neue", sans-serif; letter-spacing: 0.08em; }
      .arclabel { font: 700 14px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
      .arcsub { font: 12px Arial, "Helvetica Neue", sans-serif; fill: #64748b; }
      .arcnum { font: 700 12px Arial, "Helvetica Neue", sans-serif; }
      .arcname { font: 12.5px Arial, "Helvetica Neue", sans-serif; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="1" y="1" width="1118" height="638" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="50" y="46" class="arclabel" style="font-size:15px">Lecture 02 · argument map</text>
  <path d="M358 134 H406" class="arrow"/>
  <path d="M714 134 H762" class="arrow"/>
  <path d="M916 196 C916 217 960 217 960 238" class="arrow"/>
  <text x="938" y="211" text-anchor="middle" class="arcsub">condition on evidence</text>
  <path d="M851 300 H803" class="arrow"/>
  <path d="M584 300 H536" class="arrow"/>
  <path d="M916 196 C916 217 160 217 160 238" class="arrow"/>
  <text x="538" y="211" text-anchor="middle" class="arcsub">P carries over to numbers</text>
  <path d="M160 362 C160 383 204 383 204 404" class="arrow"/>
  <text x="182" y="377" text-anchor="middle" class="arcsub">several at once</text>
  <path d="M426 362 C426 383 560 383 560 404" class="arrow"/>
  <text x="493" y="377" text-anchor="middle" class="arcsub">i.i.d. rows</text>
  <path d="M358 466 H406" class="arrow"/>
  <path d="M714 466 H762" class="arrow"/>
  <g transform="translate(50 72)">
    <rect width="308" height="124" rx="12" fill="#e8f6f9" stroke="#0083A1" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#0083A1">INTRO · BY COUNTING</text>
    <text x="18" y="48" class="head">Intuition before definitions</text>
    <text x="18" y="73" class="text">one table of 100 students</text>
    <text x="18" y="93" class="small">joint, marginal, conditional</text>
    <text x="18" y="111" class="small">sum rule, product rule, Bayes</text>
  </g>
  <g transform="translate(406 72)">
    <rect width="308" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">1 · EXPERIMENTS AND EVENTS</text>
    <text x="18" y="48" class="head">What is uncertain?</text>
    <text x="18" y="73" class="text">sample space Ω, events A ⊆ Ω</text>
    <text x="18" y="93" class="small">a question = a set of outcomes</text>
  </g>
  <g transform="translate(762 72)">
    <rect width="308" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">2 · PROBABILITY MEASURE</text>
    <text x="18" y="48" class="head">Quantify uncertainty</text>
    <text x="18" y="73" class="text">a number: P(A) = share of Ω</text>
    <text x="18" y="93" class="small">like area · three axioms</text>
  </g>
  <g transform="translate(50 238)">
    <rect width="219" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">6 · RANDOM VARIABLES</text>
    <text x="18" y="48" class="head">Outcomes to numbers</text>
    <text x="18" y="73" class="text">X : Ω → ℝ inherits P</text>
    <text x="18" y="93" class="small">PMF / PDF, E[X], Var(X)</text>
    <text x="18" y="111" class="small">Bernoulli, binomial, normal</text>
  </g>
  <g transform="translate(317 238)">
    <rect width="219" height="124" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#d97706">5 · INDEPENDENCE</text>
    <text x="18" y="48" class="head">Calculus: no update</text>
    <text x="18" y="73" class="text">P(A | B) = P(A)</text>
    <text x="18" y="93" class="small">B tells nothing about A</text>
    <text x="18" y="111" class="small">keeps models tractable</text>
  </g>
  <g transform="translate(584 238)">
    <rect width="219" height="124" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#7c3aed">4 · BAYES' THEOREM</text>
    <text x="18" y="48" class="head">Calculus: invert</text>
    <text x="18" y="73" class="text">P(A | B) from P(B | A)</text>
    <text x="18" y="93" class="small">likelihood × prior / evidence</text>
    <text x="18" y="111" class="small">"99% accurate" → 9% sick</text>
  </g>
  <g transform="translate(851 238)">
    <rect width="219" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">3 · CONDITIONAL PROB.</text>
    <text x="18" y="48" class="head">Calculus: update</text>
    <text x="18" y="73" class="text">shrink to B, renormalise</text>
    <text x="18" y="93" class="small">product rule</text>
    <text x="18" y="111" class="small">total probability</text>
  </g>
  <g transform="translate(50 404)">
    <rect width="308" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">7 · JOINT DISTRIBUTIONS</text>
    <text x="18" y="48" class="head">Model the joint</text>
    <text x="18" y="73" class="text">P(X, Y): marginalise, condition</text>
    <text x="18" y="93" class="small">the count table, generalised</text>
    <text x="18" y="111" class="small">zero covariance ≠ independence</text>
  </g>
  <g transform="translate(406 404)">
    <rect width="308" height="124" rx="12" fill="#e8f6f9" stroke="#0083A1" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#0083A1">8 · DATA AS A SAMPLE</text>
    <text x="18" y="48" class="head">A table is n draws</text>
    <text x="18" y="73" class="text">the scale suggests the model</text>
    <text x="18" y="93" class="small">recorded = truth + artefact + noise</text>
    <text x="18" y="111" class="small">outliers, missing values</text>
  </g>
  <g transform="translate(762 404)">
    <rect width="308" height="124" rx="12" fill="#f0fdf4" stroke="#16803c" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#16803c">9 · STATISTICS · ESTIMATION</text>
    <text x="18" y="48" class="head">What data says, how surely</text>
    <text x="18" y="73" class="text">estimator → SE = σ/√n</text>
    <text x="18" y="93" class="small">confidence interval: a procedure</text>
    <text x="18" y="111" class="small">more data: a rate, 1/√n</text>
  </g>
  <line x1="50" y1="540" x2="1070" y2="540" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="50" y="582" class="arclabel">Course arc</text>
  <text x="50" y="600" class="arcsub">ideal → shortcuts</text>
  <rect x="168" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="229" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L01</text>
  <text x="229" y="600" text-anchor="middle" class="arcname" fill="#64748b">The ideal</text>
  <rect x="298" y="560" width="122" height="52" rx="10" fill="#164374" stroke="#164374" stroke-width="2"/>
  <text x="359" y="581" text-anchor="middle" class="arcnum" fill="#ffffff">L02</text>
  <text x="359" y="600" text-anchor="middle" class="arcname" fill="#ffffff">The language</text>
  <rect x="428" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="489" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L03</text>
  <text x="489" y="600" text-anchor="middle" class="arcname" fill="#64748b">Apart · peak</text>
  <rect x="558" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="619" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L04</text>
  <text x="619" y="600" text-anchor="middle" class="arcname" fill="#64748b">Only p(y | x)</text>
  <rect x="688" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="749" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L05</text>
  <text x="749" y="600" text-anchor="middle" class="arcname" fill="#64748b">Graph the joint</text>
  <rect x="818" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="879" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L06</text>
  <text x="879" y="600" text-anchor="middle" class="arcname" fill="#64748b">Keep the loss</text>
  <rect x="948" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1009" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L07</text>
  <text x="1009" y="600" text-anchor="middle" class="arcname" fill="#64748b">No shortcut</text>
</svg>
