<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Lecture 03 argument map</title>
  <desc id="desc">Three kinds of classifier — rules, a model of p(y given x), a model of p(x, y) — then the explosion of the class-conditional joint and the two ways out: naive Bayes (independence, fitting by counting), whose evidence adds up in log-odds and returns to a probability through the sigmoid, unless correlated evidence is counted twice; and a normal per class for continuous attributes, whose covariance — diagonal, full or shared — gives Gaussian naive Bayes, a quadratic (QDA) or a linear (LDA) boundary; then fitting their parameters: Bayes' theorem for a parameter, row by row, is counting; the share is the posterior's peak (MLE), +1 its mean, and the peak drops how sure we are. The decision on the posterior follows in Lecture 06.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="12" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#64748b"/>
    </marker>
    <style>
      .head { font: 700 17px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .text { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .small { font: 12px Arial, "Helvetica Neue", sans-serif; fill: #475569; }
      .tag { font: 700 11px Arial, "Helvetica Neue", sans-serif; letter-spacing: 0.08em; }
      .arclabel { font: 700 14px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
      .arcsub { font: 12px Arial, "Helvetica Neue", sans-serif; fill: #64748b; }
      .arcnum { font: 700 12px Arial, "Helvetica Neue", sans-serif; }
      .arcname { font: 12.5px Arial, "Helvetica Neue", sans-serif; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="1" y="1" width="1118" height="638" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="50" y="46" class="arclabel" style="font-size:15px">Lecture 03 · argument map</text>
  <path d="M269 134 H317" class="arrow"/>
  <path d="M536 134 H584" class="arrow"/>
  <text x="560" y="128" text-anchor="middle" class="arcsub">structure</text>
  <path d="M426 196 C426 217 160 217 160 238" class="arrow"/>
  <text x="293" y="211" text-anchor="middle" class="arcsub">a family</text>
  <path d="M803 134 H851" class="arrow"/>
  <path d="M694 196 C694 217 426 217 426 238" class="arrow"/>
  <text x="560" y="211" text-anchor="middle" class="arcsub">why counting?</text>
  <path d="M960 196 C960 217 960 217 960 238" class="arrow"/>
  <path d="M269 300 H317" class="arrow"/>
  <path d="M536 300 H584" class="arrow"/>
  <path d="M160 362 C160 383 160 383 160 404" class="arrow"/>
  <path d="M694 362 C694 383 694 383 694 404" class="arrow"/>
  <path d="M960 362 C960 383 960 383 960 404" class="arrow"/>
  <g transform="translate(50 72)">
    <rect width="219" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">THREE KINDS OF CLASSIFIER</text>
    <text x="18" y="48" class="head">Three kinds of classifier</text>
    <text x="18" y="73" class="text">rules · P(y | x) · p(x, y)</text>
    <text x="18" y="93" class="small">only the joint can generate data</text>
    <text x="18" y="111" class="small">and keeps the 1/1000 prior explicit</text>
  </g>
  <g transform="translate(317 72)">
    <rect width="219" height="124" rx="12" fill="#fff1f1" stroke="#dc2626" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#dc2626">CURSE OF DIMENSIONALITY</text>
    <text x="18" y="48" class="head">The joint explodes</text>
    <text x="18" y="73" class="text">the table is a sample: mᵖ cells</text>
    <text x="18" y="93" class="small">2³⁰ − 1 numbers per class</text>
    <text x="18" y="111" class="small">100 frauds to fill them</text>
  </g>
  <g transform="translate(584 72)">
    <rect width="219" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">NAIVE BAYES</text>
    <text x="18" y="48" class="head">Naive Bayes</text>
    <text x="18" y="73" class="text">p(x|y) = p(x₁|y) · p(x₂|y) ⋯</text>
    <text x="18" y="93" class="small">attributes independent given y</text>
    <text x="18" y="111" class="small">fitting = counting · 0 vetoes</text>
  </g>
  <g transform="translate(851 72)">
    <rect width="219" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">ODDS AND LOG-ODDS</text>
    <text x="18" y="48" class="head">Evidence adds up</text>
    <text x="18" y="73" class="text">log prior odds + Σ log LR</text>
    <text x="18" y="93" class="small">σ(s) turns it back into P</text>
    <text x="18" y="111" class="small">a linear score · no underflow</text>
  </g>
  <g transform="translate(50 238)">
    <rect width="219" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">CONTINUOUS ATTRIBUTES</text>
    <text x="18" y="48" class="head">A normal per class</text>
    <text x="18" y="73" class="text">Σ sets the boundary</text>
    <text x="18" y="93" class="small">diagonal: Gaussian NB · full: QDA</text>
    <text x="18" y="111" class="small">shared: LDA · 2 patterns: mixture</text>
  </g>
  <g transform="translate(317 238)">
    <rect width="219" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">FITTING THE PARAMETERS</text>
    <text x="18" y="48" class="head">Bayes for θ</text>
    <text x="18" y="73" class="text">row by row: add a count</text>
    <text x="18" y="93" class="small">share = peak (MLE) · +1 = mean</text>
    <text x="18" y="111" class="small">MAP: a prior's peak</text>
  </g>
  <g transform="translate(584 238)">
    <rect width="219" height="124" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#d97706">WHAT IS DROPPED</text>
    <text x="18" y="48" class="head">What a peak drops</text>
    <text x="18" y="73" class="text">how sure we are about θ</text>
    <text x="18" y="93" class="small">fine with 1,000 rows</text>
    <text x="18" y="111" class="small">wrong with 3</text>
  </g>
  <g transform="translate(851 238)">
    <rect width="219" height="124" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#d97706">WHAT IS DROPPED</text>
    <text x="18" y="48" class="head">What naive Bayes drops</text>
    <text x="18" y="73" class="text">attributes dependent given y</text>
    <text x="18" y="93" class="small">evidence counted twice</text>
    <text x="18" y="111" class="small">probabilities over-confident</text>
  </g>
  <g transform="translate(50 404)">
    <rect width="1020" height="124" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#7c3aed">TAKEAWAY</text>
    <text x="18" y="48" class="head">A classifier from probability — two assumptions and a peak</text>
    <text x="18" y="73" class="text">independence or a family makes the joint affordable; Bayes' theorem gives the posterior — and fits the parameters</text>
    <text x="18" y="93" class="small">L04: discriminative models, fitted by the same peak · L05: exactly the independences you claim · L06: deciding on a class</text>
  </g>
  <line x1="50" y1="540" x2="1070" y2="540" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="50" y="582" class="arclabel">Course arc</text>
  <text x="50" y="600" class="arcsub">ideal → shortcuts</text>
  <rect x="168" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="229" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L01</text>
  <text x="229" y="600" text-anchor="middle" class="arcname" fill="#64748b">The ideal</text>
  <rect x="298" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="359" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L02</text>
  <text x="359" y="600" text-anchor="middle" class="arcname" fill="#64748b">The language</text>
  <rect x="428" y="560" width="122" height="52" rx="10" fill="#164374" stroke="#164374" stroke-width="2"/>
  <text x="489" y="581" text-anchor="middle" class="arcnum" fill="#ffffff">L03</text>
  <text x="489" y="600" text-anchor="middle" class="arcname" fill="#ffffff">Apart · peak</text>
  <rect x="558" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="619" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L04</text>
  <text x="619" y="600" text-anchor="middle" class="arcname" fill="#64748b">Only p(y | x)</text>
  <rect x="688" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="749" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L05</text>
  <text x="749" y="600" text-anchor="middle" class="arcname" fill="#64748b">Graph the joint</text>
  <rect x="818" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="879" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L06</text>
  <text x="879" y="600" text-anchor="middle" class="arcname" fill="#64748b">Keep the loss</text>
  <rect x="948" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1009" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L07</text>
  <text x="1009" y="600" text-anchor="middle" class="arcname" fill="#64748b">No shortcut</text>
</svg>
