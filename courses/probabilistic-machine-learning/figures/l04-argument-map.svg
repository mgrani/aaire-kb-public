<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Lecture 04 argument map</title>
  <desc id="desc">The posterior over a parameter and its peak (maximum likelihood, MAP), then classical linear regression, least squares read as a Gaussian likelihood, logistic regression as the Bernoulli twin that models only p(y given x), the comparison with naive Bayes, and when a score is a probability.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="12" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#64748b"/>
    </marker>
    <style>
      .head { font: 700 17px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .text { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .small { font: 12px Arial, "Helvetica Neue", sans-serif; fill: #475569; }
      .tag { font: 700 11px Arial, "Helvetica Neue", sans-serif; letter-spacing: 0.08em; }
      .arclabel { font: 700 14px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
      .arcsub { font: 12px Arial, "Helvetica Neue", sans-serif; fill: #64748b; }
      .arcnum { font: 700 12px Arial, "Helvetica Neue", sans-serif; }
      .arcname { font: 12.5px Arial, "Helvetica Neue", sans-serif; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="1" y="1" width="1118" height="638" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="50" y="46" class="arclabel" style="font-size:15px">Lecture 04 · argument map</text>
  <path d="M160 196 C160 217 160 217 160 238" class="arrow"/>
  <path d="M269 134 H317" class="arrow"/>
  <path d="M536 134 H584" class="arrow"/>
  <path d="M803 134 H851" class="arrow"/>
  <path d="M960 196 C960 217 426 217 426 238" class="arrow"/>
  <path d="M536 300 H584" class="arrow"/>
  <path d="M960 196 C960 217 960 217 960 238" class="arrow"/>
  <path d="M960 362 C960 383 960 383 960 404" class="arrow"/>
  <path d="M694 362 C694 383 694 383 694 404" class="arrow"/>
  <path d="M160 362 C160 383 160 383 160 404" class="arrow"/>
  <g transform="translate(50 72)">
    <rect width="219" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">FITTING</text>
    <text x="18" y="48" class="head">Posterior and peak</text>
    <text x="18" y="73" class="text">Beta prior + counts</text>
    <text x="18" y="93" class="small">counting = MLE · +1 = mean</text>
    <text x="18" y="111" class="small">MAP: a prior's peak</text>
  </g>
  <g transform="translate(317 72)">
    <rect width="219" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">CLASSICAL REGRESSION</text>
    <text x="18" y="48" class="head">Linear regression</text>
    <text x="18" y="73" class="text">minimise squared error</text>
    <text x="18" y="93" class="small">closed form · LMS</text>
    <text x="18" y="111" class="small">Gauss–Markov: no distribution</text>
  </g>
  <g transform="translate(584 72)">
    <rect width="219" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">PROBABILISTIC</text>
    <text x="18" y="48" class="head">As a likelihood</text>
    <text x="18" y="73" class="text">Gaussian ⇒ squared error</text>
    <text x="18" y="93" class="small">σ̂² divides by n: biased low</text>
    <text x="18" y="111" class="small">same band at the villa</text>
  </g>
  <g transform="translate(851 72)">
    <rect width="219" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">LOGISTIC REGRESSION</text>
    <text x="18" y="48" class="head">Logistic regression</text>
    <text x="18" y="73" class="text">Bernoulli ⇒ cross-entropy</text>
    <text x="18" y="93" class="small">gradient: error × feature</text>
    <text x="18" y="111" class="small">separable: the peak runs away</text>
  </g>
  <g transform="translate(50 238)">
    <rect width="219" height="124" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#d97706">WHAT IS DROPPED</text>
    <text x="18" y="48" class="head">What a peak drops</text>
    <text x="18" y="73" class="text">how sure we are about θ</text>
    <text x="18" y="93" class="small">fine with 1,000 users</text>
    <text x="18" y="111" class="small">wrong with 3 flips</text>
  </g>
  <g transform="translate(317 238)">
    <rect width="219" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">GEN. VS. DISCR.</text>
    <text x="18" y="48" class="head">NB vs. LR</text>
    <text x="18" y="73" class="text">the same linear log-odds</text>
    <text x="18" y="93" class="small">NB: few data, missing fields</text>
    <text x="18" y="111" class="small">LR: more data, lower error</text>
  </g>
  <g transform="translate(584 238)">
    <rect width="219" height="124" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#d97706">WHAT IS DROPPED</text>
    <text x="18" y="48" class="head">Only p(y | x)</text>
    <text x="18" y="73" class="text">x is never modelled</text>
    <text x="18" y="93" class="small">no warning for unusual inputs</text>
    <text x="18" y="111" class="small">the villa, as classification</text>
  </g>
  <g transform="translate(851 238)">
    <rect width="219" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">SCORE AS PROBABILITY</text>
    <text x="18" y="48" class="head">Calibration</text>
    <text x="18" y="73" class="text">MLE: right on average</text>
    <text x="18" y="93" class="small">rebalanced: fix by prior odds</text>
    <text x="18" y="111" class="small">weight decay = Gaussian prior</text>
  </g>
  <g transform="translate(50 404)">
    <rect width="1020" height="124" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#7c3aed">TAKEAWAY</text>
    <text x="18" y="48" class="head">Every loss so far is a likelihood</text>
    <text x="18" y="73" class="text">the loss states the noise model, the penalty is a prior, the fit is a peak</text>
    <text x="18" y="93" class="small">squared ↔ Gaussian · cross-entropy ↔ Bernoulli · weight decay ↔ prior · L06: losses that are not</text>
  </g>
  <line x1="50" y1="540" x2="1070" y2="540" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="50" y="582" class="arclabel">Course arc</text>
  <text x="50" y="600" class="arcsub">ideal → shortcuts</text>
  <rect x="168" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="229" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L01</text>
  <text x="229" y="600" text-anchor="middle" class="arcname" fill="#64748b">The ideal</text>
  <rect x="298" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="359" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L02</text>
  <text x="359" y="600" text-anchor="middle" class="arcname" fill="#64748b">The language</text>
  <rect x="428" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="489" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L03</text>
  <text x="489" y="600" text-anchor="middle" class="arcname" fill="#64748b">Assume it apart</text>
  <rect x="558" y="560" width="122" height="52" rx="10" fill="#164374" stroke="#164374" stroke-width="2"/>
  <text x="619" y="581" text-anchor="middle" class="arcnum" fill="#ffffff">L04</text>
  <text x="619" y="600" text-anchor="middle" class="arcname" fill="#ffffff">Peak · p(y | x)</text>
  <rect x="688" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="749" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L05</text>
  <text x="749" y="600" text-anchor="middle" class="arcname" fill="#64748b">Graph the joint</text>
  <rect x="818" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="879" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L06</text>
  <text x="879" y="600" text-anchor="middle" class="arcname" fill="#64748b">Keep the loss</text>
  <rect x="948" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1009" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L07</text>
  <text x="1009" y="600" text-anchor="middle" class="arcname" fill="#64748b">No shortcut</text>
</svg>
