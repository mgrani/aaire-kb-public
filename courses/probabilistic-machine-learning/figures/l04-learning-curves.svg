<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="l04-learning-curves-title l04-learning-curves-desc">
  <title id="l04-learning-curves-title">Schematic learning curves: naive Bayes and logistic regression</title>
  <desc id="l04-learning-curves-desc">Test error against the number of training examples on a log scale. The naive Bayes curve falls quickly and levels off at a higher error; the logistic regression curve falls slowly, crosses it, and levels off lower. Schematic, after Ng and Jordan (2002).</desc>
  <defs>
    <marker id="l04-learning-curves-arr" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#64748b"/>
    </marker>
    <pattern id="l04-learning-curves-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#e8f6f9"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#0083A1" stroke-width="4"/>
    </pattern>
    <style>
      .sym { font: italic 700 24px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .symsm { font: italic 700 20px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .sub { font: italic 700 15px Arial, "Helvetica Neue", sans-serif; }
      .lab { font: 16px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .labb { font: 700 16px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .small { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #64748b; }
      .head { font: 700 18px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
      .tag { font: 700 12px Arial, "Helvetica Neue", sans-serif; letter-spacing: 0.08em; }
      .math { font: italic 17px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#l04-learning-curves-arr); }
      .edge { stroke: #64748b; stroke-width: 3; fill: none; }
    </style>
  </defs>
  <rect width="720" height="380" fill="#ffffff"/>
  <line x1="90" y1="300" x2="690" y2="300" stroke="#64748b" stroke-width="2"/>
  <line x1="90" y1="300" x2="90" y2="40" stroke="#64748b" stroke-width="2"/>
  <text x="390.0" y="334.0" text-anchor="middle" class="lab">training examples (log scale)</text>
  <text transform="translate(60 170.0) rotate(-90)" text-anchor="middle" class="lab">test error</text>
