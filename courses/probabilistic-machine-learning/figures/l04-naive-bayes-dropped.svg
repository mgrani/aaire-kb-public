<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="l04-naive-bayes-dropped-title l04-naive-bayes-dropped-desc">
  <title id="l04-naive-bayes-dropped-title">Naive Bayes as a graph with the dropped dependence</title>
  <desc id="l04-naive-bayes-dropped-desc">The class node (fraud?) points to every attribute node: new device, foreign IP, night, and further flags. No arrows between attributes: given the class they are assumed independent. A dashed amber line between new device and foreign IP marks the dependence the model drops.</desc>
  <defs>
    <marker id="l04-naive-bayes-dropped-arr" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#64748b"/>
    </marker>
    <pattern id="l04-naive-bayes-dropped-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#e8f6f9"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#0083A1" stroke-width="4"/>
    </pattern>
    <style>
      .sym { font: italic 700 24px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .symsm { font: italic 700 20px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .sub { font: italic 700 15px Arial, "Helvetica Neue", sans-serif; }
      .lab { font: 16px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .labb { font: 700 16px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .small { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #64748b; }
      .head { font: 700 18px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
      .tag { font: 700 12px Arial, "Helvetica Neue", sans-serif; letter-spacing: 0.08em; }
      .math { font: italic 17px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#l04-naive-bayes-dropped-arr); }
      .edge { stroke: #64748b; stroke-width: 3; fill: none; }
    </style>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <circle cx="380.0" cy="70.0" r="34" fill="#edf2f7" stroke="#164374" stroke-width="2.5"/>
  <text x="380.0" y="78.0" text-anchor="middle" class="sym" fill="#0f172a">y</text>
  <text x="430.0" y="48.0" text-anchor="start" class="labb">fraud?</text>
  <circle cx="110.0" cy="215.0" r="30" fill="#bfe5ee" stroke="#0083A1" stroke-width="2.5"/>
  <text x="110.0" y="223.0" text-anchor="middle" class="sym" fill="#0f172a">x<tspan class="sub" dy="6">1</tspan></text>
  <path d="M348.3 87.0 L139.1 199.4" class="arrow"/>
  <text x="110.0" y="271.0" text-anchor="middle" class="lab">new device</text>
  <circle cx="290.0" cy="215.0" r="30" fill="#bfe5ee" stroke="#0083A1" stroke-width="2.5"/>
  <text x="290.0" y="223.0" text-anchor="middle" class="sym" fill="#0f172a">x<tspan class="sub" dy="6">2</tspan></text>
  <path d="M361.0 100.6 L307.4 187.0" class="arrow"/>
  <text x="290.0" y="271.0" text-anchor="middle" class="lab">foreign IP</text>
  <circle cx="470.0" cy="215.0" r="30" fill="#bfe5ee" stroke="#0083A1" stroke-width="2.5"/>
  <text x="470.0" y="223.0" text-anchor="middle" class="sym" fill="#0f172a">x<tspan class="sub" dy="6">3</tspan></text>
  <path d="M399.0 100.6 L452.6 187.0" class="arrow"/>
  <text x="470.0" y="271.0" text-anchor="middle" class="lab">night</text>
  <circle cx="650.0" cy="215.0" r="30" fill="#bfe5ee" stroke="#0083A1" stroke-width="2.5"/>
  <text x="650.0" y="223.0" text-anchor="middle" class="sym" fill="#0f172a">x<tspan class="sub" dy="6">p</tspan></text>
  <path d="M411.7 87.0 L620.9 199.4" class="arrow"/>
  <text x="650.0" y="271.0" text-anchor="middle" class="lab">…</text>
  <path d="M140.0 221.0 Q200.0 249.0 260.0 221.0" stroke="#d97706" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
  <text x="200.0" y="307.0" text-anchor="middle" class="labb" style="fill:#d97706">dropped: they arrive together</text>
  <text x="200.0" y="325.0" text-anchor="middle" class="small">(account take-over)</text>
</svg>
