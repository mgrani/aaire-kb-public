<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Lecture 05 argument map</title>
  <desc id="desc">Graphing the joint, what arrows and missing arrows claim, reading independence with d-separation, plate notation, and whether the graph can be queried and learned; the shortcut drops the dependences not drawn.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="12" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#64748b"/>
    </marker>
    <style>
      .head { font: 700 17px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .text { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .small { font: 12px Arial, "Helvetica Neue", sans-serif; fill: #475569; }
      .tag { font: 700 11px Arial, "Helvetica Neue", sans-serif; letter-spacing: 0.08em; }
      .arclabel { font: 700 14px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
      .arcsub { font: 12px Arial, "Helvetica Neue", sans-serif; fill: #64748b; }
      .arcnum { font: 700 12px Arial, "Helvetica Neue", sans-serif; }
      .arcname { font: 12.5px Arial, "Helvetica Neue", sans-serif; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="1" y="1" width="1118" height="638" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="50" y="46" class="arclabel" style="font-size:15px">Lecture 05 · argument map</text>
  <path d="M358 134 H406" class="arrow"/>
  <path d="M714 134 H762" class="arrow"/>
  <path d="M916 196 C916 217 204 217 204 238" class="arrow"/>
  <path d="M358 300 H406" class="arrow"/>
  <path d="M714 300 H762" class="arrow"/>
  <path d="M916 362 C916 383 916 383 916 404" class="arrow"/>
  <g transform="translate(50 72)">
    <rect width="308" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">MODULE 1</text>
    <text x="18" y="48" class="head">Graph the joint</text>
    <text x="18" y="73" class="text">background knowledge → factorisation</text>
    <text x="18" y="93" class="small">wet grass: 8 numbers, not 15</text>
    <text x="18" y="111" class="small">explaining away: effects couple causes</text>
  </g>
  <g transform="translate(406 72)">
    <rect width="308" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">MODULE 2</text>
    <text x="18" y="48" class="head">What an arrow claims</text>
    <text x="18" y="73" class="text">a DAG + one table per node</text>
    <text x="18" y="93" class="small">an arrow permits a dependence</text>
    <text x="18" y="111" class="small">a missing arrow claims an independence</text>
  </g>
  <g transform="translate(762 72)">
    <rect width="308" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">MODULE 3</text>
    <text x="18" y="48" class="head">Reading independence</text>
    <text x="18" y="73" class="text">chains, forks: blocked by the middle</text>
    <text x="18" y="93" class="small">colliders: opened by observing it</text>
    <text x="18" y="111" class="small">arrows are not causes</text>
  </g>
  <g transform="translate(50 238)">
    <rect width="308" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">MODULE 4</text>
    <text x="18" y="48" class="head">Plate notation</text>
    <text x="18" y="73" class="text">repeated structure, drawn once</text>
    <text x="18" y="93" class="small">i.i.d. given what sits outside</text>
    <text x="18" y="111" class="small">outside the plate: what is learned</text>
  </g>
  <g transform="translate(406 238)">
    <rect width="308" height="124" rx="12" fill="#fff1f1" stroke="#dc2626" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#dc2626">MODULE 5</text>
    <text x="18" y="48" class="head">Can we compute with it?</text>
    <text x="18" y="73" class="text">the graph's shape sets the cost</text>
    <text x="18" y="93" class="small">chain: 116 steps · lattice: 2¹⁰⁰</text>
    <text x="18" y="111" class="small">learning: counts = MLE, +1 = Beta mean</text>
  </g>
  <g transform="translate(762 238)">
    <rect width="308" height="124" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#d97706">WHAT IS DROPPED</text>
    <text x="18" y="48" class="head">Shortcut 4: graph the joint</text>
    <text x="18" y="73" class="text">every missing edge is a claim</text>
    <text x="18" y="93" class="small">dropped: the dependences not drawn</text>
    <text x="18" y="111" class="small">and exact inference, if dense</text>
  </g>
  <g transform="translate(50 404)">
    <rect width="1020" height="124" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#7c3aed">TAKEAWAY</text>
    <text x="18" y="48" class="head">Writable is not queryable</text>
    <text x="18" y="73" class="text">the graph makes the joint small enough to write down; its shape decides whether conditioning is affordable</text>
    <text x="18" y="93" class="small">model the joint ✓ · condition on the data: exactly, approximately, or not at all</text>
  </g>
  <line x1="50" y1="540" x2="1070" y2="540" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="50" y="582" class="arclabel">Course arc</text>
  <text x="50" y="600" class="arcsub">ideal → shortcuts</text>
  <rect x="168" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="229" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L01</text>
  <text x="229" y="600" text-anchor="middle" class="arcname" fill="#64748b">The ideal</text>
  <rect x="298" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="359" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L02</text>
  <text x="359" y="600" text-anchor="middle" class="arcname" fill="#64748b">The language</text>
  <rect x="428" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="489" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L03</text>
  <text x="489" y="600" text-anchor="middle" class="arcname" fill="#64748b">Keep the peak</text>
  <rect x="558" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="619" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L04</text>
  <text x="619" y="600" text-anchor="middle" class="arcname" fill="#64748b">Assume it apart</text>
  <rect x="688" y="560" width="122" height="52" rx="10" fill="#164374" stroke="#164374" stroke-width="2"/>
  <text x="749" y="581" text-anchor="middle" class="arcnum" fill="#ffffff">L05</text>
  <text x="749" y="600" text-anchor="middle" class="arcname" fill="#ffffff">Graph the joint</text>
  <rect x="818" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="879" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L06</text>
  <text x="879" y="600" text-anchor="middle" class="arcname" fill="#64748b">Keep the loss</text>
  <rect x="948" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1009" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L07</text>
  <text x="1009" y="600" text-anchor="middle" class="arcname" fill="#64748b">No shortcut</text>
</svg>
