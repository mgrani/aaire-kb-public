<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" role="img" aria-labelledby="l05-ci-grid-title l05-ci-grid-desc">
  <title id="l05-ci-grid-title">Sixteen equally likely cells: A, B and C</title>
  <desc id="l05-ci-grid-desc">A 4 by 4 grid. A is the left half (8 cells). C is the 2 by 2 block in the middle of rows 2 and 3. B is three cells in row 2, columns 2 to 4. A and B share one cell, which lies inside C.</desc>
  <defs>
    <marker id="l05-ci-grid-arr" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#64748b"/>
    </marker>
    <pattern id="l05-ci-grid-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#e8f6f9"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#0083A1" stroke-width="4"/>
    </pattern>
    <style>
      .sym { font: italic 700 24px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .symsm { font: italic 700 20px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .sub { font: italic 700 15px Arial, "Helvetica Neue", sans-serif; }
      .lab { font: 16px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .labb { font: 700 16px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .small { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #64748b; }
      .head { font: 700 18px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
      .tag { font: 700 12px Arial, "Helvetica Neue", sans-serif; letter-spacing: 0.08em; }
      .math { font: italic 17px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#l05-ci-grid-arr); }
      .edge { stroke: #64748b; stroke-width: 3; fill: none; }
    </style>
  </defs>
  <rect width="560" height="350" fill="#ffffff"/>
  <rect x="40" y="40" width="72" height="72" fill="#edf2f7" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="112" y="40" width="72" height="72" fill="#edf2f7" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="184" y="40" width="72" height="72" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="256" y="40" width="72" height="72" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="112" width="72" height="72" fill="#edf2f7" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="112" y="112" width="72" height="72" fill="#edf2f7" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="124" y="124" width="48" height="48" rx="6" fill="url(#l05-ci-grid-hatch)" stroke="#0083A1" stroke-width="2"/>
  <rect x="184" y="112" width="72" height="72" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="196" y="124" width="48" height="48" rx="6" fill="url(#l05-ci-grid-hatch)" stroke="#0083A1" stroke-width="2"/>
  <rect x="256" y="112" width="72" height="72" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="268" y="124" width="48" height="48" rx="6" fill="url(#l05-ci-grid-hatch)" stroke="#0083A1" stroke-width="2"/>
  <rect x="40" y="184" width="72" height="72" fill="#edf2f7" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="112" y="184" width="72" height="72" fill="#edf2f7" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="184" y="184" width="72" height="72" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="256" y="184" width="72" height="72" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="256" width="72" height="72" fill="#edf2f7" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="112" y="256" width="72" height="72" fill="#edf2f7" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="184" y="256" width="72" height="72" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="256" y="256" width="72" height="72" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="40" width="144" height="288" fill="none" stroke="#164374" stroke-width="3"/>
  <rect x="108" y="108" width="152" height="152" rx="8" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="10 6"/>
  <text x="112.0" y="28.0" text-anchor="middle" class="labb" style="fill:#164374">A</text>
  <text x="206.0" y="286.0" text-anchor="middle" class="labb" style="fill:#7c3aed">C</text>
  <rect x="378" y="48" width="26" height="26" rx="4" fill="#edf2f7" stroke="#164374" stroke-width="2.5"/>
  <text x="418.0" y="67.0" text-anchor="start" class="lab"><tspan class="labb">A</tspan>  8 of 16 cells</text>
  <rect x="378" y="86" width="26" height="26" rx="4" fill="url(#l05-ci-grid-hatch)" stroke="#0083A1" stroke-width="2.5"/>
  <text x="418.0" y="105.0" text-anchor="start" class="lab"><tspan class="labb">B</tspan>  3 of 16 cells</text>
  <rect x="378" y="124" width="26" height="26" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="418.0" y="143.0" text-anchor="start" class="lab"><tspan class="labb">C</tspan>  4 of 16 cells</text>
</svg>
