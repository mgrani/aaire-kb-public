<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="l05-fraud-network-title l05-fraud-network-desc">
  <title id="l05-fraud-network-title">A small fraud network</title>
  <desc id="l05-fraud-network-desc">Travel V and account take-over A are root nodes. Both point to foreign IP F. Take-over A also points to new device D and to customer complaint C.</desc>
  <defs>
    <marker id="l05-fraud-network-arr" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#64748b"/>
    </marker>
    <pattern id="l05-fraud-network-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#e8f6f9"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#0083A1" stroke-width="4"/>
    </pattern>
    <style>
      .sym { font: italic 700 24px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .symsm { font: italic 700 20px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .sub { font: italic 700 15px Arial, "Helvetica Neue", sans-serif; }
      .lab { font: 16px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .labb { font: 700 16px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .small { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #64748b; }
      .head { font: 700 18px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
      .tag { font: 700 12px Arial, "Helvetica Neue", sans-serif; letter-spacing: 0.08em; }
      .math { font: italic 17px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#l05-fraud-network-arr); }
      .edge { stroke: #64748b; stroke-width: 3; fill: none; }
    </style>
  </defs>
  <rect width="640" height="320" fill="#ffffff"/>
  <circle cx="120.0" cy="80.0" r="30" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="120.0" y="88.0" text-anchor="middle" class="sym" fill="#0f172a">V</text>
  <circle cx="380.0" cy="80.0" r="30" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="380.0" y="88.0" text-anchor="middle" class="sym" fill="#0f172a">A</text>
  <circle cx="200.0" cy="230.0" r="30" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="200.0" y="238.0" text-anchor="middle" class="sym" fill="#0f172a">F</text>
  <circle cx="380.0" cy="230.0" r="30" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="380.0" y="238.0" text-anchor="middle" class="sym" fill="#0f172a">D</text>
  <circle cx="560.0" cy="230.0" r="30" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="560.0" y="238.0" text-anchor="middle" class="sym" fill="#0f172a">C</text>
  <path d="M135.1 108.2 L184.5 200.9" class="arrow"/>
  <path d="M355.4 100.5 L225.4 208.9" class="arrow"/>
  <path d="M380.0 112.0 L380.0 197.0" class="arrow"/>
  <path d="M404.6 100.5 L534.6 208.9" class="arrow"/>
  <text x="120.0" y="36.0" text-anchor="middle" class="labb">customer travels</text>
  <text x="380.0" y="36.0" text-anchor="middle" class="labb">account taken over</text>
  <text x="200.0" y="290.0" text-anchor="middle" class="labb">foreign IP</text>
  <text x="380.0" y="290.0" text-anchor="middle" class="labb">new device</text>
  <text x="560.0" y="290.0" text-anchor="middle" class="labb">complaint</text>
</svg>
