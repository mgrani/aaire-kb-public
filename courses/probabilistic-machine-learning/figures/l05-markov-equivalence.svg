<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="l05-markov-equivalence-title l05-markov-equivalence-desc">
  <title id="l05-markov-equivalence-title">Markov equivalence: arrows are not causes</title>
  <desc id="l05-markov-equivalence-desc">Four small graphs. The chain a to c to b, the reversed chain b to c to a, and the fork with c as the common cause all claim the same independences: a and b are independent given c. Data cannot tell them apart. The collider a to c from b claims something different and can be told apart.</desc>
  <defs>
    <marker id="l05-markov-equivalence-arr" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#64748b"/>
    </marker>
    <pattern id="l05-markov-equivalence-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#e8f6f9"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#0083A1" stroke-width="4"/>
    </pattern>
    <style>
      .sym { font: italic 700 24px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .symsm { font: italic 700 20px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .sub { font: italic 700 15px Arial, "Helvetica Neue", sans-serif; }
      .lab { font: 16px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .labb { font: 700 16px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .small { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #64748b; }
      .head { font: 700 18px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
      .tag { font: 700 12px Arial, "Helvetica Neue", sans-serif; letter-spacing: 0.08em; }
      .math { font: italic 17px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#l05-markov-equivalence-arr); }
      .edge { stroke: #64748b; stroke-width: 3; fill: none; }
    </style>
  </defs>
  <rect width="960" height="300" fill="#ffffff"/>
  <rect x="15.0" y="58.0" width="215.0" height="160.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="50.5" cy="110.0" r="22" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="50.5" y="118.0" text-anchor="middle" class="symsm" fill="#0f172a">a</text>
  <circle cx="122.5" cy="110.0" r="22" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="122.5" y="118.0" text-anchor="middle" class="symsm" fill="#0f172a">c</text>
  <circle cx="194.5" cy="110.0" r="22" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="194.5" y="118.0" text-anchor="middle" class="symsm" fill="#0f172a">b</text>
  <path d="M74.5 110.0 L97.5 110.0" class="arrow"/>
  <path d="M146.5 110.0 L169.5 110.0" class="arrow"/>
  <rect x="248.0" y="58.0" width="215.0" height="160.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="283.5" cy="110.0" r="22" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="283.5" y="118.0" text-anchor="middle" class="symsm" fill="#0f172a">a</text>
  <circle cx="355.5" cy="110.0" r="22" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="355.5" y="118.0" text-anchor="middle" class="symsm" fill="#0f172a">c</text>
  <circle cx="427.5" cy="110.0" r="22" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="427.5" y="118.0" text-anchor="middle" class="symsm" fill="#0f172a">b</text>
  <path d="M403.5 110.0 L380.5 110.0" class="arrow"/>
  <path d="M331.5 110.0 L308.5 110.0" class="arrow"/>
  <rect x="481.0" y="58.0" width="215.0" height="160.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="516.5" cy="172.0" r="22" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="516.5" y="180.0" text-anchor="middle" class="symsm" fill="#0f172a">a</text>
  <circle cx="588.5" cy="110.0" r="22" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="588.5" y="118.0" text-anchor="middle" class="symsm" fill="#0f172a">c</text>
  <circle cx="660.5" cy="172.0" r="22" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="660.5" y="180.0" text-anchor="middle" class="symsm" fill="#0f172a">b</text>
  <path d="M570.3 125.7 L535.4 155.7" class="arrow"/>
  <path d="M606.7 125.7 L641.6 155.7" class="arrow"/>
  <rect x="736.0" y="58.0" width="215.0" height="160.0" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <circle cx="771.5" cy="110.0" r="22" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="771.5" y="118.0" text-anchor="middle" class="symsm" fill="#0f172a">a</text>
  <circle cx="843.5" cy="172.0" r="22" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="843.5" y="180.0" text-anchor="middle" class="symsm" fill="#0f172a">c</text>
  <circle cx="915.5" cy="110.0" r="22" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="915.5" y="118.0" text-anchor="middle" class="symsm" fill="#0f172a">b</text>
  <path d="M789.7 125.7 L824.6 155.7" class="arrow"/>
  <path d="M897.3 125.7 L862.4 155.7" class="arrow"/>
  <text x="355.5" y="36.0" text-anchor="middle" class="labb" style="fill:#7c3aed">same claim: a, b independent given c</text>
  <path d="M20 46 V40 H691 V46" stroke="#7c3aed" stroke-width="2" fill="none"/>
  <text x="843.5" y="36.0" text-anchor="middle" class="labb" style="fill:#d97706">different claim</text>
  <text x="355.5" y="252.0" text-anchor="middle" class="lab">data cannot tell these three apart</text>
  <text x="355.5" y="276.0" text-anchor="middle" class="small">the direction of the arrows is not in the data</text>
  <text x="843.5" y="252.0" text-anchor="middle" class="lab">a, b independent;</text>
  <text x="843.5" y="276.0" text-anchor="middle" class="lab">dependent given c</text>
</svg>
