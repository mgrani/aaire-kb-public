<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-labelledby="l05-pixel-lattice-title l05-pixel-lattice-desc">
  <title id="l05-pixel-lattice-title">A pixel lattice as a Markov network</title>
  <desc id="l05-pixel-lattice-desc">Twenty pixel nodes on a 4 by 5 lattice, dark or light, forming a simple shape. Undirected edges join horizontal and vertical neighbours. One edge is highlighted: its potential prefers the two pixels to agree.</desc>
