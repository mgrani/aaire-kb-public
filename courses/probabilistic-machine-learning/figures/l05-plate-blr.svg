<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" role="img" aria-labelledby="l05-plate-blr-title l05-plate-blr-desc">
  <title id="l05-plate-blr-title">Plate diagram of Bayesian linear regression</title>
  <desc id="l05-plate-blr-desc">A fixed hyperparameter tau points to the weight vector w, which sits outside a plate over N observations. Inside the plate, the fixed input x_i and the weights point to the observed target y_i. The noise variance sigma squared is a fixed dot pointing to y_i.</desc>
  <defs>
    <marker id="l05-plate-blr-arr" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#64748b"/>
    </marker>
    <pattern id="l05-plate-blr-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#e8f6f9"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#0083A1" stroke-width="4"/>
    </pattern>
    <style>
      .sym { font: italic 700 24px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .symsm { font: italic 700 20px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .sub { font: italic 700 15px Arial, "Helvetica Neue", sans-serif; }
      .lab { font: 16px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .labb { font: 700 16px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .small { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #64748b; }
      .head { font: 700 18px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
      .tag { font: 700 12px Arial, "Helvetica Neue", sans-serif; letter-spacing: 0.08em; }
      .math { font: italic 17px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#l05-plate-blr-arr); }
      .edge { stroke: #64748b; stroke-width: 3; fill: none; }
    </style>
  </defs>
  <rect width="620" height="330" fill="#ffffff"/>
  <circle cx="90.0" cy="90.0" r="7" fill="#0f172a"/>
  <text x="90.0" y="70.0" text-anchor="middle" class="symsm">τ</text>
  <circle cx="250.0" cy="90.0" r="30" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="250.0" y="98.0" text-anchor="middle" class="sym" fill="#0f172a">w</text>
  <rect x="330.0" y="30.0" width="260.0" height="260.0" rx="12" fill="none" stroke="#164374" stroke-width="2"/>
  <text x="578.0" y="278.0" text-anchor="end" class="symsm" style="fill:#164374">N</text>
  <circle cx="410.0" cy="215.0" r="7" fill="#0f172a"/>
  <text x="410" y="250" text-anchor="middle" class="symsm">x<tspan class="sub" dy="6">i</tspan></text>
  <circle cx="500.0" cy="140.0" r="30" fill="#bfe5ee" stroke="#0083A1" stroke-width="2.5"/>
  <text x="500.0" y="148.0" text-anchor="middle" class="sym" fill="#0f172a">y<tspan class="sub" dy="6">i</tspan></text>
  <circle cx="540.0" cy="60.0" r="7" fill="#0f172a"/>
  <text x="526.0" y="52.0" text-anchor="end" class="symsm">σ²</text>
  <path d="M99.0 90.0 L217.0 90.0" class="arrow"/>
  <path d="M281.4 96.3 L467.6 133.5" class="arrow"/>
  <path d="M416.9 209.2 L474.6 161.1" class="arrow"/>
  <path d="M536.0 68.0 L514.8 110.5" class="arrow"/>
  <text x="90.0" y="130.0" text-anchor="middle" class="small">prior strength</text>
  <text x="250.0" y="150.0" text-anchor="middle" class="small">weights</text>
  <text x="410.0" y="275.0" text-anchor="middle" class="small">input (given)</text>
  <text x="500.0" y="196.0" text-anchor="middle" class="small">target</text>
</svg>
