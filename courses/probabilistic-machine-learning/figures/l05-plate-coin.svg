<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="l05-plate-coin-title l05-plate-coin-desc">
  <title id="l05-plate-coin-title">Plate diagram of the Beta–Bernoulli model</title>
  <desc id="l05-plate-coin-desc">The fixed hyperparameters a and b point to the parameter theta outside a plate. Inside a plate over N users, theta points to the observed answer x_i.</desc>
  <defs>
    <marker id="l05-plate-coin-arr" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#64748b"/>
    </marker>
    <pattern id="l05-plate-coin-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#e8f6f9"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#0083A1" stroke-width="4"/>
    </pattern>
    <style>
      .sym { font: italic 700 24px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .symsm { font: italic 700 20px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .sub { font: italic 700 15px Arial, "Helvetica Neue", sans-serif; }
      .lab { font: 16px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .labb { font: 700 16px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .small { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #64748b; }
      .head { font: 700 18px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
      .tag { font: 700 12px Arial, "Helvetica Neue", sans-serif; letter-spacing: 0.08em; }
      .math { font: italic 17px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#l05-plate-coin-arr); }
      .edge { stroke: #64748b; stroke-width: 3; fill: none; }
    </style>
  </defs>
  <rect width="480" height="300" fill="#ffffff"/>
  <circle cx="60.0" cy="150.0" r="7" fill="#0f172a"/>
  <text x="60.0" y="128.0" text-anchor="middle" class="symsm">a, b</text>
  <circle cx="180.0" cy="150.0" r="30" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="180.0" y="158.0" text-anchor="middle" class="sym" fill="#0f172a">θ</text>
  <rect x="260.0" y="60.0" width="190.0" height="180.0" rx="12" fill="none" stroke="#164374" stroke-width="2"/>
  <text x="438.0" y="228.0" text-anchor="end" class="symsm" style="fill:#164374">N</text>
  <circle cx="345.0" cy="150.0" r="30" fill="#bfe5ee" stroke="#0083A1" stroke-width="2.5"/>
  <text x="345.0" y="158.0" text-anchor="middle" class="sym" fill="#0f172a">x<tspan class="sub" dy="6">i</tspan></text>
  <path d="M69.0 150.0 L147.0 150.0" class="arrow"/>
  <path d="M212.0 150.0 L312.0 150.0" class="arrow"/>
  <text x="180.0" y="212.0" text-anchor="middle" class="small">P(user returns)</text>
  <text x="345.0" y="212.0" text-anchor="middle" class="small">user i returned?</text>
  <text x="60.0" y="190.0" text-anchor="middle" class="small">prior</text>
</svg>
