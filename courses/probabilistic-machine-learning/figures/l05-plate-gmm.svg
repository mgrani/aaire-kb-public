<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" role="img" aria-labelledby="l05-plate-gmm-title l05-plate-gmm-desc">
  <title id="l05-plate-gmm-title">Plate diagram of a Gaussian mixture</title>
  <desc id="l05-plate-gmm-desc">A fixed hyperparameter alpha points to the mixing weights pi. Pi points to the latent label z_i inside a plate over N. z_i points to the observed x_i in the same plate. A second plate over K holds the component means mu_k and covariances Sigma_k, which point to x_i.</desc>
  <defs>
    <marker id="l05-plate-gmm-arr" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#64748b"/>
    </marker>
    <pattern id="l05-plate-gmm-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#e8f6f9"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#0083A1" stroke-width="4"/>
    </pattern>
    <style>
      .sym { font: italic 700 24px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .symsm { font: italic 700 20px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .sub { font: italic 700 15px Arial, "Helvetica Neue", sans-serif; }
      .lab { font: 16px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .labb { font: 700 16px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .small { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #64748b; }
      .head { font: 700 18px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
      .tag { font: 700 12px Arial, "Helvetica Neue", sans-serif; letter-spacing: 0.08em; }
      .math { font: italic 17px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#l05-plate-gmm-arr); }
      .edge { stroke: #64748b; stroke-width: 3; fill: none; }
    </style>
  </defs>
  <rect width="640" height="350" fill="#ffffff"/>
  <circle cx="60.0" cy="90.0" r="7" fill="#0f172a"/>
  <text x="60.0" y="70.0" text-anchor="middle" class="symsm">α</text>
  <circle cx="175.0" cy="90.0" r="30" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="175.0" y="98.0" text-anchor="middle" class="sym" fill="#0f172a">π</text>
  <rect x="250.0" y="30.0" width="180.0" height="290.0" rx="12" fill="none" stroke="#164374" stroke-width="2"/>
  <text x="418.0" y="308.0" text-anchor="end" class="symsm" style="fill:#164374">N</text>
  <circle cx="340.0" cy="90.0" r="30" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="340.0" y="98.0" text-anchor="middle" class="sym" fill="#0f172a">z<tspan class="sub" dy="6">i</tspan></text>
  <circle cx="340.0" cy="230.0" r="30" fill="#bfe5ee" stroke="#0083A1" stroke-width="2.5"/>
  <text x="340.0" y="238.0" text-anchor="middle" class="sym" fill="#0f172a">x<tspan class="sub" dy="6">i</tspan></text>
  <rect x="470.0" y="150.0" width="150.0" height="170.0" rx="12" fill="none" stroke="#164374" stroke-width="2"/>
  <text x="608.0" y="308.0" text-anchor="end" class="symsm" style="fill:#164374">K</text>
  <circle cx="545.0" cy="195.0" r="30" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="545.0" y="203.0" text-anchor="middle" class="sym" fill="#0f172a">μ<tspan class="sub" dy="6">k</tspan></text>
  <circle cx="545.0" cy="265.0" r="30" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="545.0" y="273.0" text-anchor="middle" class="sym" fill="#0f172a">Σ<tspan class="sub" dy="6">k</tspan></text>
  <path d="M69.0 90.0 L142.0 90.0" class="arrow"/>
  <path d="M207.0 90.0 L307.0 90.0" class="arrow"/>
  <path d="M340.0 122.0 L340.0 197.0" class="arrow"/>
  <path d="M513.5 200.4 L372.5 224.4" class="arrow"/>
  <path d="M513.5 259.6 L372.5 235.6" class="arrow"/>
</svg>
