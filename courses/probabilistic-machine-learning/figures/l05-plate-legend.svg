<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 190" role="img" aria-labelledby="l05-plate-legend-title l05-plate-legend-desc">
  <title id="l05-plate-legend-title">Conventions of a model diagram</title>
  <desc id="l05-plate-legend-desc">Five conventions: a shaded circle is an observed variable; an open circle is a latent variable or parameter; a small solid dot is a fixed hyperparameter; an arrow means the child is conditioned on the parent; a rectangle with N in its corner repeats its content N times.</desc>
  <defs>
    <marker id="l05-plate-legend-arr" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#64748b"/>
    </marker>
    <pattern id="l05-plate-legend-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#e8f6f9"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#0083A1" stroke-width="4"/>
    </pattern>
    <style>
      .sym { font: italic 700 24px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .symsm { font: italic 700 20px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .sub { font: italic 700 15px Arial, "Helvetica Neue", sans-serif; }
      .lab { font: 16px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .labb { font: 700 16px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .small { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #64748b; }
      .head { font: 700 18px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
      .tag { font: 700 12px Arial, "Helvetica Neue", sans-serif; letter-spacing: 0.08em; }
      .math { font: italic 17px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#l05-plate-legend-arr); }
      .edge { stroke: #64748b; stroke-width: 3; fill: none; }
    </style>
  </defs>
  <rect width="960" height="190" fill="#ffffff"/>
  <circle cx="95.0" cy="78.0" r="30" fill="#bfe5ee" stroke="#0083A1" stroke-width="2.5"/>
  <text x="95.0" y="86.0" text-anchor="middle" class="sym" fill="#0f172a">x</text>
  <circle cx="285.0" cy="78.0" r="30" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="285.0" y="86.0" text-anchor="middle" class="sym" fill="#0f172a">θ</text>
  <circle cx="475.0" cy="78.0" r="7" fill="#0f172a"/>
  <path d="M605 78 L722 78" class="arrow"/>
  <rect x="785.0" y="30.0" width="140.0" height="96.0" rx="12" fill="none" stroke="#164374" stroke-width="2"/>
  <text x="913.0" y="114.0" text-anchor="end" class="symsm" style="fill:#164374">N</text>
  <text x="95.0" y="152.0" text-anchor="middle" class="labb">shaded</text>
  <text x="95.0" y="174.0" text-anchor="middle" class="small">observed: in the data</text>
  <text x="285.0" y="152.0" text-anchor="middle" class="labb">open</text>
  <text x="285.0" y="174.0" text-anchor="middle" class="small">latent or parameter</text>
  <text x="475.0" y="152.0" text-anchor="middle" class="labb">solid dot</text>
  <text x="475.0" y="174.0" text-anchor="middle" class="small">fixed, not inferred</text>
  <text x="665.0" y="152.0" text-anchor="middle" class="labb">arrow</text>
  <text x="665.0" y="174.0" text-anchor="middle" class="small">child conditioned on parent</text>
  <text x="855.0" y="152.0" text-anchor="middle" class="labb">plate</text>
  <text x="855.0" y="174.0" text-anchor="middle" class="small">repeat N times</text>
</svg>
