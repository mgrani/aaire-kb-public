<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="l05-three-patterns-title l05-three-patterns-desc">
  <title id="l05-three-patterns-title">Chain, fork and collider</title>
  <desc id="l05-three-patterns-desc">Three panels. Chain: a to c to b. Fork: c points to a and to b. Collider: a and b point to c. In the chain and the fork, a and b are dependent but independent given c. In the collider, a and b are independent but dependent given c.</desc>
  <defs>
    <marker id="l05-three-patterns-arr" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#64748b"/>
    </marker>
    <pattern id="l05-three-patterns-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#e8f6f9"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#0083A1" stroke-width="4"/>
    </pattern>
    <style>
      .sym { font: italic 700 24px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .symsm { font: italic 700 20px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .sub { font: italic 700 15px Arial, "Helvetica Neue", sans-serif; }
      .lab { font: 16px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .labb { font: 700 16px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .small { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #64748b; }
      .head { font: 700 18px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
      .tag { font: 700 12px Arial, "Helvetica Neue", sans-serif; letter-spacing: 0.08em; }
      .math { font: italic 17px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#l05-three-patterns-arr); }
      .edge { stroke: #64748b; stroke-width: 3; fill: none; }
    </style>
  </defs>
  <rect width="960" height="330" fill="#ffffff"/>
  <rect x="15.0" y="10.0" width="300.0" height="310.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="33.0" y="36.0" text-anchor="start" class="tag" style="fill:#164374">CHAIN</text>
  <circle cx="70.0" cy="130.0" r="26" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="70.0" y="138.0" text-anchor="middle" class="sym" fill="#0f172a">a</text>
  <circle cx="165.0" cy="130.0" r="26" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="165.0" y="138.0" text-anchor="middle" class="sym" fill="#0f172a">c</text>
  <circle cx="260.0" cy="130.0" r="26" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="260.0" y="138.0" text-anchor="middle" class="sym" fill="#0f172a">b</text>
  <path d="M98.0 130.0 L136.0 130.0" class="arrow"/>
  <path d="M193.0 130.0 L231.0 130.0" class="arrow"/>
  <text x="33.0" y="250.0" text-anchor="start" class="lab">a, b:</text>
  <text x="85.0" y="250.0" text-anchor="start" class="labb">dependent</text>
  <text x="33.0" y="276.0" text-anchor="start" class="lab">given c:</text>
  <text x="103.0" y="276.0" text-anchor="start" class="labb">independent</text>
  <text x="33.0" y="304.0" text-anchor="start" class="labb" style="fill:#16803c">observing c blocks the path</text>
  <rect x="330.0" y="10.0" width="300.0" height="310.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="348.0" y="36.0" text-anchor="start" class="tag" style="fill:#164374">FORK · COMMON CAUSE</text>
  <circle cx="385.0" cy="170.0" r="26" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="385.0" y="178.0" text-anchor="middle" class="sym" fill="#0f172a">a</text>
  <circle cx="480.0" cy="90.0" r="26" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="480.0" y="98.0" text-anchor="middle" class="sym" fill="#0f172a">c</text>
  <circle cx="575.0" cy="170.0" r="26" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="575.0" y="178.0" text-anchor="middle" class="sym" fill="#0f172a">b</text>
  <path d="M458.6 108.0 L407.2 151.3" class="arrow"/>
  <path d="M501.4 108.0 L552.8 151.3" class="arrow"/>
  <text x="348.0" y="250.0" text-anchor="start" class="lab">a, b:</text>
  <text x="400.0" y="250.0" text-anchor="start" class="labb">dependent</text>
  <text x="348.0" y="276.0" text-anchor="start" class="lab">given c:</text>
  <text x="418.0" y="276.0" text-anchor="start" class="labb">independent</text>
  <text x="348.0" y="304.0" text-anchor="start" class="labb" style="fill:#16803c">observing c blocks the path</text>
  <rect x="645.0" y="10.0" width="300.0" height="310.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="663.0" y="36.0" text-anchor="start" class="tag" style="fill:#164374">COLLIDER · COMMON EFFECT</text>
  <circle cx="700.0" cy="90.0" r="26" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="700.0" y="98.0" text-anchor="middle" class="sym" fill="#0f172a">a</text>
  <circle cx="795.0" cy="170.0" r="26" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="795.0" y="178.0" text-anchor="middle" class="sym" fill="#0f172a">c</text>
  <circle cx="890.0" cy="90.0" r="26" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="890.0" y="98.0" text-anchor="middle" class="sym" fill="#0f172a">b</text>
  <path d="M721.4 108.0 L772.8 151.3" class="arrow"/>
  <path d="M868.6 108.0 L817.2 151.3" class="arrow"/>
  <text x="663.0" y="250.0" text-anchor="start" class="lab">a, b:</text>
  <text x="715.0" y="250.0" text-anchor="start" class="labb">independent</text>
  <text x="663.0" y="276.0" text-anchor="start" class="lab">given c:</text>
  <text x="733.0" y="276.0" text-anchor="start" class="labb">dependent</text>
  <text x="663.0" y="304.0" text-anchor="start" class="labb" style="fill:#d97706">observing c opens the path</text>
</svg>
