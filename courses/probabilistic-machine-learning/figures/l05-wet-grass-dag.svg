<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" role="img" aria-labelledby="l05-wet-grass-dag-title l05-wet-grass-dag-desc">
  <title id="l05-wet-grass-dag-title">The wet-grass belief network</title>
  <desc id="l05-wet-grass-dag-desc">Rain R points to Jack's grass J and to Tracey's grass T; the sprinkler S points to Tracey's grass T. Each node carries one conditional table given its parents: p(R), p(S), p(J | R), p(T | R, S).</desc>
  <defs>
    <marker id="l05-wet-grass-dag-arr" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#64748b"/>
    </marker>
    <pattern id="l05-wet-grass-dag-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#e8f6f9"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#0083A1" stroke-width="4"/>
    </pattern>
    <style>
      .sym { font: italic 700 24px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .symsm { font: italic 700 20px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .sub { font: italic 700 15px Arial, "Helvetica Neue", sans-serif; }
      .lab { font: 16px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .labb { font: 700 16px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .small { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #64748b; }
      .head { font: 700 18px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
      .tag { font: 700 12px Arial, "Helvetica Neue", sans-serif; letter-spacing: 0.08em; }
      .math { font: italic 17px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#l05-wet-grass-dag-arr); }
      .edge { stroke: #64748b; stroke-width: 3; fill: none; }
    </style>
  </defs>
  <rect width="700" height="380" fill="#ffffff"/>
  <circle cx="230.0" cy="80.0" r="30" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="230.0" y="88.0" text-anchor="middle" class="sym" fill="#0f172a">R</text>
  <circle cx="470.0" cy="80.0" r="30" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="470.0" y="88.0" text-anchor="middle" class="sym" fill="#0f172a">S</text>
  <circle cx="110.0" cy="260.0" r="30" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="110.0" y="268.0" text-anchor="middle" class="sym" fill="#0f172a">J</text>
  <circle cx="350.0" cy="260.0" r="30" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
  <text x="350.0" y="268.0" text-anchor="middle" class="sym" fill="#0f172a">T</text>
  <path d="M212.2 106.6 L128.3 232.5" class="arrow"/>
  <path d="M247.8 106.6 L331.7 232.5" class="arrow"/>
  <path d="M452.2 106.6 L368.3 232.5" class="arrow"/>
  <text x="230.0" y="36.0" text-anchor="middle" class="labb">rain</text>
  <text x="470.0" y="36.0" text-anchor="middle" class="labb">Tracey's sprinkler</text>
  <text x="110.0" y="318.0" text-anchor="middle" class="labb">Jack's grass wet</text>
  <text x="350.0" y="318.0" text-anchor="middle" class="labb">Tracey's grass wet</text>
  <text x="188.0" y="86.0" text-anchor="end" class="math" style="fill:#164374">p(R)</text>
  <text x="512.0" y="86.0" text-anchor="start" class="math" style="fill:#164374">p(S)</text>
  <text x="110.0" y="352.0" text-anchor="middle" class="math" style="fill:#164374">p(J | R)</text>
  <text x="350.0" y="352.0" text-anchor="middle" class="math" style="fill:#164374">p(T | R, S)</text>
  <rect x="520.0" y="168.0" width="160.0" height="176.0" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
  <text x="600.0" y="194.0" text-anchor="middle" class="tag" style="fill:#164374">numbers needed</text>
  <text x="538.0" y="222.0" text-anchor="start" class="math">p(R)</text>
  <text x="662.0" y="222.0" text-anchor="end" class="labb">1</text>
  <text x="538.0" y="246.0" text-anchor="start" class="math">p(S)</text>
  <text x="662.0" y="246.0" text-anchor="end" class="labb">1</text>
  <text x="538.0" y="270.0" text-anchor="start" class="math">p(J | R)</text>
  <text x="662.0" y="270.0" text-anchor="end" class="labb">2</text>
  <text x="538.0" y="294.0" text-anchor="start" class="math">p(T | R, S)</text>
  <text x="662.0" y="294.0" text-anchor="end" class="labb">4</text>
  <line x1="538" y1="306" x2="662" y2="306" stroke="#164374" stroke-width="1.5"/>
  <text x="538.0" y="330.0" text-anchor="start" class="labb">total</text>
  <text x="662.0" y="330.0" text-anchor="end" class="labb">8</text>
  <text x="600.0" y="364.0" text-anchor="middle" class="small">full joint: 15</text>
</svg>
