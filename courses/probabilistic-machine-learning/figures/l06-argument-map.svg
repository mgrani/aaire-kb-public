<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Lecture 06 argument map</title>
  <desc id="desc">Measuring a rare class, error bars on metrics, decisions from calibrated scores and costs, and empirical risk minimisation as the shortcut that keeps the loss and drops the probabilities.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="12" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#64748b"/>
    </marker>
    <style>
      .head { font: 700 17px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .text { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .small { font: 12px Arial, "Helvetica Neue", sans-serif; fill: #475569; }
      .tag { font: 700 11px Arial, "Helvetica Neue", sans-serif; letter-spacing: 0.08em; }
      .arclabel { font: 700 14px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
      .arcsub { font: 12px Arial, "Helvetica Neue", sans-serif; fill: #64748b; }
      .arcnum { font: 700 12px Arial, "Helvetica Neue", sans-serif; }
      .arcname { font: 12.5px Arial, "Helvetica Neue", sans-serif; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="1" y="1" width="1118" height="638" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="50" y="46" class="arclabel" style="font-size:15px">Lecture 06 · argument map</text>
  <path d="M358 134 H406" class="arrow"/>
  <path d="M714 134 H762" class="arrow"/>
  <path d="M916 196 C916 217 496 217 496 238" class="arrow"/>
  <path d="M536 300 H584" class="arrow"/>
  <path d="M827 362 C827 383 827 383 827 404" class="arrow"/>
  <g transform="translate(50 72)">
    <rect width="308" height="124" rx="12" fill="#fff1f1" stroke="#dc2626" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#dc2626">MODULE 1</text>
    <text x="18" y="48" class="head">What are we measuring?</text>
    <text x="18" y="73" class="text">99.9% accuracy, zero frauds caught</text>
    <text x="18" y="93" class="small">L02's useful flag loses on accuracy</text>
    <text x="18" y="111" class="small">Bayes error: the aleatoric floor</text>
  </g>
  <g transform="translate(406 72)">
    <rect width="308" height="124" rx="12" fill="#e8f6f9" stroke="#0083A1" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#0083A1">MODULE 2</text>
    <text x="18" y="48" class="head">Numbers with error bars</text>
    <text x="18" y="73" class="text">a metric is a proportion: SE (L02)</text>
    <text x="18" y="93" class="small">10 test frauds → recall ± 0.19</text>
    <text x="18" y="111" class="small">Beta posterior when counts are small</text>
  </g>
  <g transform="translate(762 72)">
    <rect width="308" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">MODULE 3</text>
    <text x="18" y="48" class="head">From scores to decisions</text>
    <text x="18" y="73" class="text">check if p &gt; c_FP / (c_FP + c_FN)</text>
    <text x="18" y="93" class="small">the loan threshold of L01, for fraud</text>
    <text x="18" y="111" class="small">score probabilities: log-loss, Brier</text>
  </g>
  <g transform="translate(50 238)">
    <rect width="486" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">MODULE 4</text>
    <text x="18" y="48" class="head">Risk vs empirical risk</text>
    <text x="18" y="73" class="text">we want the expected loss on the world</text>
    <text x="18" y="93" class="small">we can compute the average loss on the sample</text>
    <text x="18" y="111" class="small">the gap between them grows with capacity</text>
  </g>
  <g transform="translate(584 238)">
    <rect width="486" height="124" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#d97706">WHAT IS DROPPED</text>
    <text x="18" y="48" class="head">Shortcut: keep the loss</text>
    <text x="18" y="73" class="text">minimise the average loss on the sample</text>
    <text x="18" y="93" class="small">MLE = ERM when the loss is −log p(y | x)</text>
    <text x="18" y="111" class="small">dropped: every probability (hinge, 0/1 loss)</text>
  </g>
  <g transform="translate(50 404)">
    <rect width="1020" height="124" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#7c3aed">TAKEAWAY</text>
    <text x="18" y="48" class="head">A loss without a probability cannot say how sure it is</text>
    <text x="18" y="73" class="text">regularisers (penalties or priors) control the gap; error bars measure it; calibration buys the probabilities back</text>
    <text x="18" y="93" class="small">the floor is set by the world · the error bar by the rare cases · the threshold by the costs</text>
  </g>
  <line x1="50" y1="540" x2="1070" y2="540" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="50" y="582" class="arclabel">Course arc</text>
  <text x="50" y="600" class="arcsub">ideal → shortcuts</text>
  <rect x="168" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="229" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L01</text>
  <text x="229" y="600" text-anchor="middle" class="arcname" fill="#64748b">The ideal</text>
  <rect x="298" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="359" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L02</text>
  <text x="359" y="600" text-anchor="middle" class="arcname" fill="#64748b">The language</text>
  <rect x="428" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="489" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L03</text>
  <text x="489" y="600" text-anchor="middle" class="arcname" fill="#64748b">Keep the peak</text>
  <rect x="558" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="619" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L04</text>
  <text x="619" y="600" text-anchor="middle" class="arcname" fill="#64748b">Assume it apart</text>
  <rect x="688" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="749" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L05</text>
  <text x="749" y="600" text-anchor="middle" class="arcname" fill="#64748b">Graph the joint</text>
  <rect x="818" y="560" width="122" height="52" rx="10" fill="#164374" stroke="#164374" stroke-width="2"/>
  <text x="879" y="581" text-anchor="middle" class="arcnum" fill="#ffffff">L06</text>
  <text x="879" y="600" text-anchor="middle" class="arcname" fill="#ffffff">Keep the loss</text>
  <rect x="948" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1009" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L07</text>
  <text x="1009" y="600" text-anchor="middle" class="arcname" fill="#64748b">No shortcut</text>
</svg>
