<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Lecture 07 argument map</title>
  <desc id="desc">From k-means hard assignments to Gaussian mixtures with EM (a partial shortcut) and to Bayesian linear regression, whose predictive variance splits into a noise and a parameter term.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="12" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#64748b"/>
    </marker>
    <style>
      .head { font: 700 17px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .text { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #334155; }
      .small { font: 12px Arial, "Helvetica Neue", sans-serif; fill: #475569; }
      .tag { font: 700 11px Arial, "Helvetica Neue", sans-serif; letter-spacing: 0.08em; }
      .arclabel { font: 700 14px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
      .arcsub { font: 12px Arial, "Helvetica Neue", sans-serif; fill: #64748b; }
      .arcnum { font: 700 12px Arial, "Helvetica Neue", sans-serif; }
      .arcname { font: 12.5px Arial, "Helvetica Neue", sans-serif; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="1" y="1" width="1118" height="638" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="50" y="46" class="arclabel" style="font-size:15px">Lecture 07 · argument map</text>
  <path d="M358 134 H406" class="arrow"/>
  <path d="M714 134 H762" class="arrow"/>
  <path d="M560 196 C560 217 204 217 204 238" class="arrow"/>
  <path d="M916 196 C916 217 560 217 560 238" class="arrow"/>
  <path d="M916 196 C916 217 916 217 916 238" class="arrow"/>
  <path d="M204 362 C204 383 204 383 204 404" class="arrow"/>
  <path d="M560 362 C560 383 560 383 560 404" class="arrow"/>
  <path d="M916 362 C916 383 916 383 916 404" class="arrow"/>
  <g transform="translate(50 72)">
    <rect width="308" height="124" rx="12" fill="#edf2f7" stroke="#164374" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#164374">MODULE 1</text>
    <text x="18" y="48" class="head">Hard assignments (recap)</text>
    <text x="18" y="73" class="text">k-means: one cluster per point</text>
    <text x="18" y="93" class="small">a point between two loses its doubt</text>
  </g>
  <g transform="translate(406 72)">
    <rect width="308" height="124" rx="12" fill="#f0fdf4" stroke="#16803c" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#16803c">MODULE 2 · PARTIAL</text>
    <text x="18" y="48" class="head">Mixtures and EM</text>
    <text x="18" y="73" class="text">the label as a latent variable</text>
    <text x="18" y="93" class="small">E-step: Bayes for every point</text>
    <text x="18" y="111" class="small">M-step: ML with soft counts</text>
  </g>
  <g transform="translate(762 72)">
    <rect width="308" height="124" rx="12" fill="#f0fdf4" stroke="#16803c" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#16803c">MODULE 3 · NO SHORTCUT</text>
    <text x="18" y="48" class="head">Bayesian regression</text>
    <text x="18" y="73" class="text">a posterior over the weights</text>
    <text x="18" y="93" class="small">var = σ² + x*ᵀ S_N x*</text>
    <text x="18" y="111" class="small">villa: 40 and 191 → 195 k€ sd</text>
  </g>
  <g transform="translate(50 238)">
    <rect width="308" height="124" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#d97706">WHAT IS DROPPED</text>
    <text x="18" y="48" class="head">What is still dropped</text>
    <text x="18" y="73" class="text">EM: a peak for π, μ, σ</text>
    <text x="18" y="93" class="small">collapse; K by held-out likelihood</text>
    <text x="18" y="111" class="small">regression: a wrong model family</text>
  </g>
  <g transform="translate(406 238)">
    <rect width="308" height="124" rx="12" fill="#e8f6f9" stroke="#0083A1" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#0083A1">PAYOFF</text>
    <text x="18" y="48" class="head">Aleatoric: the σ² term</text>
    <text x="18" y="73" class="text">noise: stays when data is added</text>
    <text x="18" y="93" class="small">L01, the identical patients</text>
  </g>
  <g transform="translate(762 238)">
    <rect width="308" height="124" rx="12" fill="#e8f6f9" stroke="#0083A1" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#0083A1">PAYOFF</text>
    <text x="18" y="48" class="head">Epistemic: x*ᵀ S_N x*</text>
    <text x="18" y="73" class="text">parameters: shrink where data is</text>
    <text x="18" y="93" class="small">L01, the 600 m² villa: 191 → 13 k€</text>
    <text x="18" y="111" class="small">ten villas buy €0.3M of credit</text>
  </g>
  <g transform="translate(50 404)">
    <rect width="1020" height="124" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="18" y="24" class="tag" fill="#7c3aed">TAKEAWAY</text>
    <text x="18" y="48" class="head">No shortcut — at the price of computation</text>
    <text x="18" y="73" class="text">model the joint, including what is hidden; condition on the data; keep the posterior where it is affordable</text>
    <text x="18" y="93" class="small">closed form here (conjugacy); elsewhere sampling or approximation · no posterior sees a wrong model</text>
  </g>
  <line x1="50" y1="540" x2="1070" y2="540" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="50" y="582" class="arclabel">Course arc</text>
  <text x="50" y="600" class="arcsub">ideal → shortcuts</text>
  <rect x="168" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="229" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L01</text>
  <text x="229" y="600" text-anchor="middle" class="arcname" fill="#64748b">The ideal</text>
  <rect x="298" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="359" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L02</text>
  <text x="359" y="600" text-anchor="middle" class="arcname" fill="#64748b">The language</text>
  <rect x="428" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="489" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L03</text>
  <text x="489" y="600" text-anchor="middle" class="arcname" fill="#64748b">Keep the peak</text>
  <rect x="558" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="619" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L04</text>
  <text x="619" y="600" text-anchor="middle" class="arcname" fill="#64748b">Assume it apart</text>
  <rect x="688" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="749" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L05</text>
  <text x="749" y="600" text-anchor="middle" class="arcname" fill="#64748b">Graph the joint</text>
  <rect x="818" y="560" width="122" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="879" y="581" text-anchor="middle" class="arcnum" fill="#64748b">L06</text>
  <text x="879" y="600" text-anchor="middle" class="arcname" fill="#64748b">Keep the loss</text>
  <rect x="948" y="560" width="122" height="52" rx="10" fill="#164374" stroke="#164374" stroke-width="2"/>
  <text x="1009" y="581" text-anchor="middle" class="arcnum" fill="#ffffff">L07</text>
  <text x="1009" y="600" text-anchor="middle" class="arcname" fill="#ffffff">No shortcut</text>
</svg>
