# Why Probability?


<div class="guiding-question">

**Guiding Question:** Two models both say "fraud". What would you need to know
before acting on either — and why does a label not tell you?

</div>


--

## Machine Learning Gives Us Predictions

<div class="viz viz-lg" data-viz="ml/transaction-stream" data-steps="2"
 data-params='{"mode": "labels"}'></div>


<div class="fragment">


<div class="q">

Are the three flagged transactions equally suspicious?

</div>


</div>



<div class="fragment">


<div class="q">

Would you block all three cards?

</div>


</div>



<div class="fragment">


<div class="q">

What would you need to know to treat them differently?

</div>


</div>


Notes:
Stepped visual, then discussion stepper. Click 1: the model stamps every
transaction — five legitimate, three fraud. Click 2: the legitimate ones recede
and the three flagged cases stand alone. Pause here: a €1,299 electronics order,
twelve gift cards, and a hotel booking are obviously *different situations*, yet
the model's output for them is one identical word.

Then reveal the questions one at a time and let the room answer before the next
appears. Students should feel that a label gives them nothing to separate a
near-certain case from a coin flip. Do not name the missing element — the next
slide lets them discover it.

--

## The Same Batch, With a Number Attached

<div class="viz viz-lg" data-viz="ml/transaction-stream" data-steps="2"
 data-params='{"mode": "scores"}'></div>


<div class="q">

What can you do now that you could not do a minute ago?

</div>


Notes:
Identical picture, identical batch — one click adds the number and the bar, and
the three cases that were indistinguishable separate: 0.98 against 0.55 and
0.51. Let students list what they can now do before revealing the cards (P2).
Typical answers: rank them, act on the electronics order, send the other two to
a person, ask why the model is unsure. Every answer is an action a bare label
could not support — the number is not a nicer prediction, it is a **different
kind of information**.

--

## What a Number Lets Us Do

| The number lets us | What that means for this batch |
|---|---|
| **Compare and rank** | separate the €1,299 order from the two borderline cases — and compare two models that would both just say "fraud" |
| **Weigh consequences** | set the threshold from the cost of a missed fraud against the cost of an annoyed customer |
| **Defer deliberately** | send 0.55 and 0.51 to a human ask whether more data would move them |
| **Combine and communicate** | merge evidence from several signals report *how sure* we are, not only what we think |


<div class="fragment">


<div class="c-important">

**We need to model uncertainty** — and we need to be able to **reason with it**.

</div>


</div>


Notes:
The four cards generalise the room's answers; the reveal is the module's
central message and should be spoken, not read. Both halves matter:
representing uncertainty is the easy part, doing something principled with it
is the course.

--

## From Prediction to Managed Uncertainty


<div class="flow-row">


<div class="stat-card s-navy">

### Predict
a label or a value

</div>


<div class="flow-arrow">

→

</div>


<div class="stat-card s-teal">

### Quantify
how sure we are

</div>


<div class="flow-arrow">

→

</div>


<div class="stat-card s-teal">

### Model
represent it explicitly

</div>


<div class="flow-arrow">

→

</div>


<div class="stat-card s-violet">

### Reason
combine, compare, update

</div>


<div class="flow-arrow">

→

</div>


<div class="stat-card s-violet">

### Manage
act, defer, or gather data

</div>


</div>



<div class="q">

And once we want to manage it — **where does the uncertainty actually come from?**

</div>



<div class="c-insight">

Probabilistic machine learning is not a different way of producing predictions.
It is a **language for reasoning about predictions that are not certain**.

</div>


Notes:
Bridge slide. Read the six cards as one sentence, left to right. The last card
is the transition: before we can manage uncertainty we need to know what causes
it — and the answer turns out to matter for what we can do about it.

--

## Mini-Exercise

A loan model gives three applicants a **default probability** of **0.05**,
**0.35** and **0.45**.


<div class="grid-2">


<div class="card bad">

<span class="eyebrow">Cost of accepting a defaulter</span>

### €8,000
the loan is not repaid

</div>


<div class="card muted">

<span class="eyebrow">Cost of rejecting a good applicant</span>

### €500
the margin we would have earned

</div>


</div>


1. Which applicants does the rule "reject if $p > 0.5$" reject?
2. **Weigh each option by how likely its bad outcome is.** What is the expected
 cost of *accepting* each applicant, and of *rejecting* each?
3. At which probability do the two expected costs balance?

--

## Mini-Exercise — Solution


<div class="fragment">

Weigh each outcome by its probability:
$ \mathbb{E}[\text{accept}] = p \cdot 8{,}000 $ against
$ \mathbb{E}[\text{reject}] = (1-p) \cdot 500$.

| | $p$ | Accept | Reject | Cheaper by | Decision |
|---|---|---|---|---|---|
| A | 0.05 | €400 | €475 | 1.2× | accept — *only just* |
| B | 0.35 | €2,800 | €325 | 8.6× | reject, clearly |
| C | 0.45 | €3,600 | €275 | 13× | reject, overwhelmingly |

**Break-even:** $p \cdot 8{,}000 = (1-p) \cdot 500 \Rightarrow
p^{*} = \frac{500}{8{,}500} \approx 0.059$

</div>


Notes:
Fragment the solution. Work the first row aloud: 5% of €8,000 is €400, and 95%
of €500 is €475 — so accepting is cheaper, but barely. Then let the break-even
line land: it is the whole answer to "how do I weight?".

--

## What the Threshold Tells Us


<div class="grid-2">


<div class="card bad">

<span class="eyebrow">The intuitive rule</span>

### reject if $p > 0.5$
rejects **nobody** here — every applicant is below it, including one whose
default risk is nine times the bank's break-even

</div>


<div class="card good">

<span class="eyebrow">The rule the costs imply</span>

### reject if $p > 0.059$
because a default costs **16×** what a lost customer does

</div>


</div>



<div class="c-important">

The threshold comes from the **costs**, not from the probability. 0.5 is only
the right cut-off when both mistakes are equally expensive — which they almost
never are.

</div>



<div class="marks-step">

- **B and C are not close calls**: rejecting is 8.6× and 13× cheaper.
- **A is the only borderline case** — €400 against €475, and $p = 0.05$ sits just
 under $p^{*} = 0.059$. This is where a second signal is worth buying.

</div>


Notes:
This slide answers the question students actually have — "where does the
threshold come from?" — and corrects the intuition that 0.5 is neutral. Ask what
happens to p* if the bank's margin doubles (p* rises to 0.111, so it accepts
more risk), and what happens if the loan is ten times larger (p* falls to
0.006). The model output never changed only the costs did.

The borderline case is A, not the 0.35 one: an absolute gap of a few hundred
euros means nothing without the scale — what matters is the ratio.

--

## Takeaway


<div class="takeaway">

A prediction without a measure of its uncertainty cannot be compared, weighed
against consequences, or handed to a human at the right moment. **Modelling
uncertainty and reasoning with it** is what turns a prediction into a decision.

</div>


---

<!-- .slide: class="module-slide" -->

# Where Uncertainty Comes From


<div class="guiding-question">

**Guiding Question:** The model says 0.55. Is that because the world is noisy,
or because the model has not learned enough — and would more data help?

</div>


--

## Two Reasons to Be Unsure

The model says 0.55. Before asking how to *represent* that, ask why it is not
0.99.


<div class="fragment">


<div class="q">

**Is the transaction itself ambiguous** — would a perfect model, with all the
data in the world, still be unsure?

</div>


</div>



<div class="fragment">


<div class="q">

**Or has the model simply not seen enough cases like this one?**

</div>


</div>



<div class="fragment">


<div class="q">

**Would collecting more data help — and could *any* amount of data remove the
doubt entirely?**

</div>


</div>


Notes:
Discussion stepper. Hold the two possibilities apart on the board: "the world
is noisy" versus "we have not learned enough". Students usually reach the
reducible/irreducible distinction themselves once the third question lands.

--

## Two Examples


<div class="grid-2">


<div class="card">

<span class="eyebrow">Example A · an ambiguous observation</span>

Two patients with **identical** records — same age, same symptoms, same test
results. One recovers, one does not.


<div class="marks-no">

- Would more patients like these help? Never.

</div>


</div>


<div class="card">

<span class="eyebrow">Example B · an unfamiliar case</span>

A house-price model trained on flats of 40–120 m² is asked about a **600 m²
villa**. It has no examples anywhere near it.


<div class="marks-yes">

- Would ten villas in the training data help? Completely.

</div>


</div>


</div>



<div class="q">

Which uncertainty can be reduced, and which is part of the problem itself?

</div>


Notes:
Let students classify before the next slide. Push on Example A: "would a better
model help?" — no, unless it sees *more attributes* the noise is relative to
the information available. That nuance is the honest version of "inherent".

--

## The Distinction — Then the Names

| | Where it comes from | More data? | Our example |
|---|---|---|---|
| **Uncertainty in the problem** | the outcome genuinely varies given what we observe | <span class="no">✗</span> never | identical patients, different outcomes |
| **Uncertainty in our knowledge** | we have not seen enough to pin the model down | <span class="yes">✓</span> yes | the 600 m² villa |


<div class="fragment">


<div class="grid-2">


<div class="card">

### Aleatoric
*from* alea, *dice* — noise in the world

</div>


<div class="card">

### Epistemic
*from* episteme, *knowledge* — ignorance in the model

</div>


</div>


</div>


Notes:
The names arrive last, on a click, after the distinction has been made in plain
words (intuition before terminology). Students who can only recite the Greek
have learned nothing; students who can sort new cases into the two columns have
learned the concept.

--

## Why the Distinction Matters

| If the uncertainty is… | The right response | The expensive mistake |
|---|---|---|
| **in our knowledge** (epistemic) | collect data where the model is thin defer to a human who knows more | accepting it as inherent and never improving |
| **in the problem** (aleatoric) | model the noise set a policy for the ambiguous cases | buying more data that cannot help |

A model that can tell the two apart can report that it is **out of its depth**,
not merely unsure.


<div class="c-important">

A probabilistic model can represent **both** kinds of uncertainty — and can
often tell you which one it is facing. That is why the distinction is worth a
name.

</div>


--

## Takeaway


<div class="takeaway">

Uncertainty has two sources: **noise in the world** and **gaps in our
knowledge**. Only the second shrinks with data, and a decision — collect more,
defer, act — depends on knowing which one you face.

</div>


Notes:
This is the consequence slide the terminology was for. It is also the bridge
out: we now know uncertainty matters and comes in kinds — but we still have no
systematic way to write it down, combine it or update it. That is the next
module.

---

# Beyond True or False


<div class="guiding-question">

**Guiding Question:** A proof either holds or it does not. A learned prediction
is never a proof — so what kind of conclusion is it, and how strong is it?

</div>


--

## Three Modes of Reasoning

| | From | To | What it guarantees |
|---|---|---|---|
| **Deduction** *(logic)* | premises | what **must** follow | certain — but adds no new content |
| **Induction** *(statistics)* | observed patterns | a **regularity**, a hypothesis | nothing — content-adding, not guaranteed |
| **Abduction** *(probability)* | observations | the **best available explanation** | nothing — only comparable against rivals |

Machine learning lives in the bottom two rows.

Notes:
Three modes, one criterion to compare them: what does each guarantee, and what
does it buy? Deduction guarantees everything and discovers nothing induction
and abduction discover and guarantee nothing. Data science lives in the latter
two, which is why validation is a permanent obligation.

--

## The Scientific Reasoning Cycle

The three modes are not alternatives — they take turns.

**Example: gravity.**


<div class="grid-3">


<div class="card">

### Deduction
From the theory: all objects of equal mass fall at the same rate everywhere on
earth.

</div>


<div class="card">

### Induction
Design an experiment, measure fall times at several locations, compute means
and standard deviations.

</div>


<div class="card">

### Abduction
Times agree at one location but vary between locations. **Best explanation:**
distance from earth's mass centre.

</div>



</div>


<div class="c-insight">

The cycle turns: the abduced explanation becomes the next theory to deduce
from. A data-science project runs the same loop, usually several times.

</div>


Notes:
Have students place a machine-learning project in the cycle: choosing a model
family is deduction from assumptions, fitting is induction, and diagnosing why
it fails on a subgroup is abduction. The loop is the honest picture of the
workflow, unlike the tidy pipeline diagrams.

--

## Mini-Exercise

A dashboard shows that customers who use the mobile app churn **less** than
those who do not.


<div class="marks-num">

- What would a purely **inductive** reading conclude?
- Give two different **abductive** explanations.
- What **deduction** would let you distinguish them?

</div>



<div class="fragment">


<div class="grid-3">


<div class="card">

<span class="eyebrow">Induction</span>

"App use reduces churn" — a regularity read straight off the data.

</div>


<div class="card">

<span class="eyebrow">Abduction</span>

The app causes loyalty — *or* loyal customers install the app. Same
correlation, opposite causal direction.

</div>


<div class="card">

<span class="eyebrow">Deduction</span>

If the app causes loyalty, randomly prompting a subgroup to install it should
lower their churn — an experiment deduced from the hypothesis.

</div>


</div>


</div>


Notes:
Question and solution share a slide: the three prompts stay visible while the
answers appear, so students can check each answer against the question that
produced it. One click reveals all three.

The exercise rehearses the whole cycle in a business setting and previews the
correlation/causation problem. The key move is 3: a hypothesis earns its keep
by predicting something checkable that its rival does not.

--

## Beyond True or False

| | Classical reasoning | Probabilistic reasoning |
|---|---|---|
| **Conclusions** | follow, or do not | are supported to *degrees* |
| **Evidence** | premises, taken as given | may be partial or noisy |
| **Certainty** | the conclusion is certain | the conclusion may stay uncertain |
| **New information** | can only add premises | can *change* what we believe |


<div class="c-insight">

Classical logic asks *whether* a conclusion follows. Probabilistic reasoning
also asks **how strongly the evidence supports each possible conclusion**.

</div>


Notes:
Connect to the three modes of reasoning just seen: deduction is the left card;
induction and abduction live on the right, and they are the modes machine
learning actually performs. A learned prediction is never a theorem — it is an
inference from evidence, and its strength is the thing we want to write down.

--

## What the Language Has to Do

We now know that uncertainty matters and that it has different sources. What we
still lack is a **systematic way** to:


<div class="marks-num">

- **Represent** — say how much we believe each possibility
- **Combine** — put several uncertain pieces of information together
- **Update** — change our beliefs when new evidence arrives
- **Decide** — act on beliefs that are not certainties

</div>



<div class="fragment">


<div class="c-important">

**Probability provides that language.** The formal material that follows exists
because each of these four operations turns out to have exactly one consistent
set of rules.

</div>


</div>


--

## Takeaway


<div class="takeaway">

Machine-learning predictions are inferences from evidence, not derivations from
premises. **Probability is the calculus of such inferences** — which is why the
next lecture is about it, and why it will feel like an answer rather than a
prerequisite.

</div>


Notes:
The reveal is the pivot of the whole introduction: the mathematics is now the
solution to a problem the room has already felt. Say explicitly that "exactly
one consistent set of rules" is a real theorem (Cox), not a slogan — but leave
it there.

# What Probabilistic ML Enables


<div class="guiding-question">

**Guiding Question:** Which questions about a machine-learning system will you
be able to answer after this course that you cannot answer today?

</div>


--

## After This Course, You Will Be Able to Ask — and Answer


<div class="grid-2">


<div class="column">

<span class="eyebrow">About a prediction</span>


<div class="marks-ask">

- How certain is it, and should I trust it?
- When should the model refuse to decide?
- What alternatives are plausible?

</div>


<span class="eyebrow">About the data</span>


<div class="marks-ask">

- When would more data help?
- When is uncertainty unavoidable?
- What does this data actually justify?

</div>


</div>


<div class="column">

<span class="eyebrow">About learning</span>


<div class="marks-ask">

- How should belief change when evidence arrives?
- How do I combine prior knowledge with observations?
- How do I compare competing explanations?

</div>


<span class="eyebrow">About the methods</span>


<div class="marks-ask">

- Why do the common methods work, and under which assumptions?
- When should I expect them to fail?
- What is my model assuming without telling me?

</div>


</div>


</div>


Notes:
Utility before curriculum structure. These are not learning objectives to be
graded they are the questions the students should recognise as *theirs* by the
end. Ask which of them they can answer today — usually none with confidence.

--

## What Changes Compared to Traditional Machine Learning


<div class="grid-1-2">


<div class="card muted">

<span class="eyebrow">Traditional ML asks</span>

### What is the prediction?

</div>


<div class="c-important">

<span class="eyebrow">Probabilistic ML also asks</span>


<div class="marks-ask">

- **How certain** is it?
- **What alternatives** are plausible?
- **Why** are we uncertain?
- **How does new evidence** change what we believe?
- **What decision** follows from this?
- **What can and cannot** be inferred from this information?

</div>


</div>


</div>


--

## Takeaway


<div class="takeaway">

Probabilistic machine learning does not replace prediction. It **surrounds every
prediction with the questions a decision needs answered** — and gives one
language in which all of them can be asked.

</div>


Notes:
Closing frame for the motivation half of the lecture. The right-hand card is the
course in six questions; each later lecture answers one or two of them, which
the roadmap at the end will make explicit.

# How Machines Learn


<div class="guiding-question">

**Guiding Question:** Nobody writes the rule. So what exactly is a machine
given, what does it build, and where does uncertainty get in?

</div>


--

## Learning From Answers

A radiologist has labelled ten thousand scans. A bank has ten years of loans and
knows which ones defaulted. In both cases **every example carries its answer**.

<div class="viz viz-lg" data-viz="ml/learning-paradigms" data-steps="1"
     data-params='{"kind": "supervised"}'></div>


<div class="q">

What information does the learner receive during training?

</div>


Notes:
Ask before the click: what exactly does the learner see? The answer — an input
*and* the output we wanted — is what makes this the easiest setting, and the
most expensive one, because somebody had to produce every label.

Good examples to name: image classification, medical diagnosis, house prices.
The last one previews regression: the "answer" need not be a class.

--

## Learning Without Answers

Now the same bank wants to know **what kinds of customer it has**. Nobody has
ever written down the list — the categories are what we are looking for.

<div class="viz viz-lg" data-viz="ml/learning-paradigms" data-steps="1"
     data-params='{"kind": "unsupervised"}'></div>


<div class="q">

What can we learn when nobody tells us the correct answer?

</div>


Notes:
Let the room answer first: groups of similar customers, the few dimensions that
carry most of the variation, what is unusual. Name clustering, dimensionality
reduction, latent structure — but only after they have said it.

The honest difficulty to flag: without an answer key there is no unambiguous
notion of "correct", so evaluation becomes a genuine problem. That returns in
the clustering lecture.

--

## Learning by Acting

A robot has to cross a room. Nobody can label the correct motor command for
every situation it might find itself in — and it only discovers whether a move
was good **after making it**.

<div class="viz viz-lg" data-viz="ml/learning-paradigms" data-steps="2"
     data-params='{"kind": "reinforcement"}'></div>


<div class="q">

How can a learner improve when it must act in order to find out whether the
action was any good?

</div>


Notes:
Step 1 draws action and consequence; step 2 closes the loop back into the
agent's behaviour. Only now name the vocabulary: **agent**, **environment**,
**action**, **reward**.

The point that distinguishes this from supervised learning: the feedback says
how good the outcome was, not what the right action would have been — and it
may arrive long after the action that caused it.

--

## Same Goal, Different Information

<div class="viz viz-lg" data-viz="ml/learning-paradigms" data-steps="3"
     data-params='{"kind": "compare"}'></div>


<div class="fragment">


<div class="c-important">

The paradigms differ in **what the learner is given** and **what feedback it
gets** — not in what we ultimately want from it.

</div>


</div>


Notes:
Reveal one row per click, so the comparison is assembled from the three
examples the students have just seen rather than presented as a taxonomy.

Ask which paradigm a spam filter uses (supervised), a recommender trained on
clicks (arguably all three), a game engine (reinforcement). The boundaries are
softer than the table suggests, and saying so is more honest than a clean
three-way split.

--

## What Is Common to All Three?


<div class="grid-2">


<div class="card">

### Nobody wrote the rule
The mapping from situation to answer is **too complex or too implicit** to
specify by hand.

</div>


<div class="card">

### Examples exist
There is data — or experience — in which the desired behaviour is
demonstrated, even if it was never described.

</div>


</div>



<div class="q">

So what replaces the rule that nobody wrote?

</div>


Notes:
This is the bridge to the next slide. Hold the question: in all three
paradigms, something is derived from data that a developer would otherwise
have had to write down. That "something" is the model — and comparing the two
ways of getting it is the next slide.

--

## Two Ways to Get Behaviour

<div class="viz viz-lg" data-viz="ml/programming-vs-learning" data-steps="3"></div>

Notes:
Three clicks. First the programming pipeline: the developer holds knowledge
about the environment and writes it down as rules. Second the learning
pipeline: the environment produces data, and an algorithm derives the model.
Third — the point of the slide — **both arrive at the same destination**: a
situation neither the developer nor the learner has seen.

Ask between clicks two and three: what is the same in both rows? The
environment on the left, and the demand on the right.

--

## What Actually Changed


<div class="grid-2">


<div class="card muted">

<span class="eyebrow">Traditional programming</span>

The developer's **knowledge becomes rules**. Deduction: rules plus input give
the output.

*The assumptions are visible — they are in the code.*

</div>


<div class="c-important">

<span class="eyebrow">Machine learning</span>

The environment's **data becomes a model**. Induction: examples plus a learning
procedure give a rule.

*The assumptions are still there — but now they are in the data, the model
family and the objective.*

</div>


</div>



<div class="c-warning">

The rules do not disappear when nobody writes them. They become **harder to
inspect** — which is why the rest of this lecture is about making every part of
that pipeline explicit.

</div>


Notes:
Deliberate callback to the three modes of reasoning: programming is deductive,
learning is inductive. Students who saw that module will recognise the shape,
and the guarantee that came with each.

The warning is the honest framing of the trade and sets up the design questions
at the end of the module.

--

## What Would It Mean for a Machine to Learn?

Before any definition — three questions you would have to answer about *any*
system before you could say it had learned anything:


<div class="marks-ask">

- What is it supposed to get better at?
- What does it get to look at while getting better?
- How would we know whether it improved?

</div>



<div class="fragment">


<div class="grid-3">


<div class="card">

### Task $T$
what the system should learn to do

</div>


<div class="card">

### Experience $E$
what it learns from

</div>


<div class="card">

### Performance $P$
how we decide it improved

## Chess


<div class="grid-1-2">


<div class="card">

### ♟
A program that plays, loses, and plays again — millions of times against

<div class="column">


<div class="marks-step">

- **Task** — play chess well
- **Experience** — games played against itself, and positions from expert play
- **Performance** — fraction of games won; rating against other engines

</div>


</div>

Notes:

*generated by the system itself*. No one labelled the good moves — the outcome

<div class="grid-1-2">


<div class="card">

### ¶
A model shown enormous quantities of text, asked only to continue it.

<div class="column">

- **Experience** — a very large corpus of text, then human feedback

## What Would We Ideally Like to Know?

<div class="viz viz-lg" data-viz="ml/learning-system" data-steps="0"
     data-params='{"mode": "build"}'></div>


<div class="q">

There is some real process that turns a situation into an outcome. Why can we
not simply write it down?

</div>


Notes:
Only the real-world band is drawn: an object or situation $o$, the true process
$γ$, the outcome $y$. Let the room answer the question — the process is
unknown, or too complex, or not accessible to us at all. That inaccessibility
is the reason everything that follows exists.

Notation, kept from the source: **$γ$ is the ideal target function** on
real-world objects.

## From the Real World to a Model of It

<div class="viz viz-lg" data-viz="ml/learning-system" data-steps="2"
     data-params='{"mode": "build"}'></div>

## Two Worlds, One Correspondence


<div class="c-important">

$$
γ(o) \;\rightsquigarrow\; h_Θ\big(α(o)\big) \;\equiv\; h_Θ(x)
$$

</div>



<div class="grid-3">


<div class="card">

### $γ$
the **real process** — unknown, and not ours to write down

</div>


<div class="card">

### $α$
the **representation** — what we chose to measure

</div>


<div class="card">

### $h_Θ$
the **model** — our approximation, with parameters $Θ$

</div>


</div>


We never learn the world. We build a **model world** and approximate the
process inside it.

Notes:
Two clicks: first the measurement — the **model-formation function $α$** turns
an object into features $x = α(o)$ — then the model $h_Θ$ and its prediction.

Be precise about the notation, because it is easy to garble: $γ$ is the real
process, **$α$ is the representation**, $h_Θ$ is the model and $Θ$ are its
parameters. $α$ is *not* the parameters.

The relation on the fragment is the heart of the module: two worlds, and a
correspondence between them that is only ever approximate. Most practical
failures are failures of $α$ — the features did not carry what $γ$ depends on.

## Closing the Loop

<div class="viz viz-lg" data-viz="ml/learning-system" data-steps="4"
     data-params='{"mode": "build"}'></div>

Notes:
Two more clicks complete the figure. Click 3 adds the **loss**, which is the
first thing on the slide that compares the model world with the real one: it
needs $ŷ$ *and* the outcome $y$ we actually wanted. Click 4 adds the
**optimiser**, which changes the **parameters $Θ$** — and the loop closes.

Read it aloud once as a sentence: measure the situation, predict, compare with
what happened, adjust, repeat. Every method in this course fills these boxes
differently.

what we measure

<div class="flow-arrow">

→

## Training Is Not Using

<div class="viz viz-lg" data-viz="ml/learning-system" data-steps="1"
     data-params='{"mode": "inference"}'></div>


<div class="q">

Which of these boxes still exist when the system is actually deployed?

</div>


Notes:
One click dims everything the training loop needed. What remains is a single
path: a new situation, measured, through the model, to a prediction — with $Θ$
now fixed.

Ask the question before clicking. Students routinely assume the loss is
somehow still "checking" the model in production; it is not, because in
production nobody tells us $y$. That gap — no answers after deployment — is
what monitoring and the evaluation methodology have to work around.

--

## The Loop Around the Loop

Data, model, loss and optimiser describe **what runs**. They say nothing about
how anybody decided on them.


<div class="grid-2">


<div class="card">

<span class="eyebrow">Inner loop · the learning system</span>

data → model → prediction → loss → optimiser → updated parameters

*runs thousands of times per minute, automatically*

</div>


<div class="c-important">

<span class="eyebrow">Outer loop · the development process</span>

collect → represent → split → train → validate → diagnose → revise → evaluate → deploy → monitor

*runs a handful of times per project, and every step is a human decision*

</div>


</div>


Notes:
The distinction is the point of the slide. The inner loop is an optimisation;
the outer loop is engineering and scientific method. A student who only ever
sees the inner loop concludes that machine learning is "fitting", which is the
part a library already does for them.

--

## What the Outer Loop Decides


<div class="grid-3">


<div class="card">

<span class="eyebrow">Before training</span>


<div class="marks-step">

- what to collect, and from where
- how to clean and represent it
- how to split train / validation / test

</div>


</div>


<div class="card">

<span class="eyebrow">While developing</span>


<div class="marks-step">

- which model family, which hyperparameters
- which errors to look at, and why they happen
- what to change next

</div>


</div>


<div class="card">

<span class="eyebrow">After training</span>


<div class="marks-step">

- is it good enough, and by whose measure
- does it hold up on data it has never seen
- is it still holding up next month

</div>


</div>


</div>



<div class="c-insight">

Machine learning is **experimental**: you make choices, then test whether they
worked. Measured performance is *evidence* about future performance — never a
guarantee of it.

</div>


Notes:
The insight is the bridge to probability. Every number produced by this outer
loop is an estimate from a finite sample: a validation score is a measurement
with error bars, not a property of the model.

Ask what happens when the test set has been consulted fifty times during
development — it stops being held out, and the estimate stops being honest.

--

## The Same System, Read for Uncertainty

<div class="viz viz-lg" data-viz="ml/learning-system" data-steps="7"
     data-params='{"mode": "uncertainty"}'></div>

Notes:
The same figure the module has been building, now read a second way. One click
per source, each highlighting the box it lives in:

1. **the world** — identical situations, different outcomes (aleatoric)
2. **the data** — noisy measurement, missing values, an unrepresentative sample
3. **the model** — the family may not contain the truth
4. **the parameters** — too few examples to pin them down (epistemic; this is
   the one more data reduces)
5. **the objective** — the loss is a *design choice*; it may not capture the
   task
6. **the optimisation** — stochastic steps, initialisation, approximate solutions
7. **the evaluation** — a finite test set, and a future that may differ

Ask before each click: where would *you* look next?

--

## Two Distinctions Worth Keeping Straight


<div class="grid-2">


<div class="card">

<span class="eyebrow">Uncertainty *in* the loss</span>

The quantities entering the loss are uncertain: $y$ is noisy, the sample is
finite. The loss itself is an ordinary function.

</div>


<div class="card">

<span class="eyebrow">Uncertainty *about* the loss</span>

Whether this objective represents the task at all. That is a modelling
judgement, not a random variable.

</div>


</div>



<div class="c-warning">

Do not say "the loss is random". Say what is uncertain: the data it is computed
from, or our confidence that it is the right objective.

</div>



<div class="fragment">


<div class="c-important">

Uncertainty is not a property of the final prediction. It **enters throughout
the system** — and probabilistic machine learning is the language for
representing and reasoning about it at every one of these places.

</div>


</div>


Notes:
The first pair matters because students conflate them and then write things
that are false. The closing statement is the return to the course's opening
claim, now with a system diagram behind it rather than a fraud example.

--

## Designing the Learning Problem

Before any model is chosen, four things have to be decided — and each of them
is a claim about the world.


<div class="grid-2">


<div class="card">

<span class="eyebrow">The task</span>


<div class="marks-ask">

- What should the system predict or decide?
- What is one unit of prediction?
- What counts as success?

</div>


</div>


<div class="card">

<span class="eyebrow">The data</span>


<div class="marks-ask">

- Which observations represent the problem?
- How were the examples sampled?
- Will future cases look like these?

</div>


</div>


<div class="card">

<span class="eyebrow">The representation $α$</span>


<div class="marks-ask">

- What are the inputs, concretely?
- Which features are available — and which are merely convenient?
- What is lost in the measurement?

</div>


</div>


<div class="card">

<span class="eyebrow">The target</span>


<div class="marks-ask">

- What is $γ$, in words a domain expert would accept?
- Is the label we have the thing we care about, or a proxy for it?

</div>


</div>


</div>


Notes:
Every box is a modelling decision that the mathematics will later take for
granted. The proxy question in the last box is the one with the most
consequences in practice: "did the patient have a disease" versus "was the
patient diagnosed", "is this content good" versus "was it clicked".

--

## Designing the System


<div class="grid-2">


<div class="card">

<span class="eyebrow">Model and objective</span>


<div class="marks-ask">

- What does the model family assume, and how flexible is it?
- Does minimising this loss correspond to what we actually want?

</div>


</div>


<div class="card">

<span class="eyebrow">Learning</span>


<div class="marks-ask">

- Which procedure searches the parameters?
- How sensitive is the result to initialisation and randomness?

</div>


</div>


</div>

## Designing the System — Evaluation


<div class="grid-2">


<div class="card">

<span class="eyebrow">Evaluation and generalisation</span>


<div class="marks-ask">

- Which metric matters, and which data is held out?
- How uncertain is the estimate of performance?
- What happens when the environment changes?

</div>


<div class="card">

<div class="marks-ask">

- Which uncertainty must be represented explicitly?
- Is the prediction informing a decision — and what do the errors cost?

</div>

## The Programme, in Three Moves

Every method in this course is the same three moves, in the language you are
about to learn:


<div class="grid-3">


<div class="card">

### Model the joint
Write down what the world would have to be like to produce what we observed —
the data *and* the unknowns together.

</div>


<div class="card">

### Condition on the data
Inference is conditioning: fix what was observed, and let the rules of
probability say what follows for the rest.

</div>


<div class="card">

### Read off answers
Predictions, uncertainties and decisions are all quantities computed from that
one conditioned model.

</div>


</div>



<div class="c-note">

Every one of these words — joint, condition, inference — gets a precise meaning
in Lecture 02. They appear here only so that you recognise them when they
return.

</div>

    // reads 720 whatever the content is — and reads 0 while the slide is
    // display:none. Measuring the children works in both states.
    function contentHeight(sec) {
      const s = scale();
      let used = 0;
      for (const child of sec.children) {
        if (child.tagName === "ASIDE") continue;
        const h = child.getBoundingClientRect().height;
        if (!h) continue;
        used += h / s + PER_CHILD;
      }
      return used;
    }

    function fit() {
      for (const sec of document.querySelectorAll(".reveal .slides section")) {
        if (sec.querySelector("section")) continue;              // stack wrapper
        if (sec.classList.contains("title-slide")) continue;
        if (sec.classList.contains("module-slide")) continue;
        fitFigure(sec);
        const used = contentHeight(sec);
        // A hidden slide measures 0; leave its class alone rather than
        // centring everything off-screen. It is measured when it becomes
        // current, since fit() runs on every slidechanged.
        if (used === 0) continue;
        sec.classList.remove("v-center");
        if (SLIDE_H - used > MIN_FREE) {
          sec.classList.add("v-center");
          // Child rectangles exclude margins, so a slide whose blocks are
          // generously spaced measures smaller than it lays out. Under
          // .v-center the section is exactly SLIDE_H tall, which makes
          // scrollHeight an exact overflow test — take the centring back if
          // it pushed anything past the bottom edge.
          if (sec.scrollHeight > SLIDE_H) sec.classList.remove("v-center");
        }
      }
    }

    const start = () => {
      fit();
      window.Reveal?.on?.("slidechanged", fit);
      window.Reveal?.on?.("resize", fit);
      setTimeout(fit, 1200);                 // visualizations mount asynchronously
    };
    if (window.Reveal?.isReady?.()) start();
    else window.Reveal?.on("ready", start);
  })();
})();</script></body></html>
