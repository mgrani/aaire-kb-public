# Module 4
## Data, Statistics and a Parameter

> **Guiding Question:** A model has a parameter nobody told us, and all we have
> is a table. What does the table say about the parameter — and how sure may we
> be?

Notes:
Three steps, in this order: what data is (attribute types, and a table as a
sample from a joint), what we compute from it (statistics, estimators and their
error), and what it says about a parameter (the Beta–Bernoulli posterior). The
module ends where Lecture 03 begins: the peak of that posterior is maximum
likelihood.

If time is short, drop the descriptive units (means, median, variance) — the
sampling unit recalls what it needs.

--

## Four Attribute Types


<div class="grid-4">


<div class="card">

### Nominal
*categorical, qualitative*

Labels only: eye colour, ZIP code, ID.

Meaningful: $=$, $\neq$

</div>


<div class="card">

### Ordinal
*categorical, qualitative*

Ordered labels: grades, rankings, "small/medium/large".

Meaningful: $<$, $>$

</div>


<div class="card">

### Interval
*numeric, quantitative*

Differences are meaningful, the zero point is arbitrary: temperature in °C, calendar dates.

Meaningful: $+$, $-$

</div>


<div class="card">

### Ratio
*numeric, quantitative*

A true zero, so ratios are meaningful: length, mass, counts, duration.

Meaningful: $\times$, $\div$

</div>


</div>


Notes:
The four types form a hierarchy: each level permits everything the previous one
does, plus more. The type is a property of the *measurement*, not of the storage
format — which is why a ZIP code stored as an integer is still nominal.

--

## Why the Type Decides the Method


<div class="grid-2">


<div class="card bad">

### The classic error
Averaging a nominal attribute. The mean of ZIP codes 10115 and 81667 is a
number, and it is meaningless.

</div>


<div class="card">

### The subtle one
20 °C is not "twice as warm" as 10 °C — interval scales have no true zero, so
ratios do not transfer.

</div>



</div>


<div class="c-important">

The attribute type determines which **statistics**, which **distance measures**
and which **plots** are permissible. Every method in this course depends on it.

</div>


--

## Mini-Exercise

A customer table records satisfaction (one to five stars) and year of birth.
Which scale is each — and whose **mean** would you not report?


<div class="fragment">

Satisfaction is **ordinal**: its mean assumes equal gaps between the stars —
report the median. Year of birth is **interval**: the mean year is fine, but
ratios are not ("born twice as late" means nothing); differences such as age
are fine.

</div>


Notes:
Solution on the same slide, click-gated. The two columns come back when a table is
read as a sample from a joint distribution; payment method (nominal: only
counting) and income (ratio: a true zero) complete the set if there is time.

--

## Takeaway


<div class="takeaway">

An attribute's **scale of measurement** licenses the operations you may perform
on it. Choosing a statistic before checking the scale is the most common
silent error in data analysis.

</div>


--

## A Table Is a Sample From a Joint Distribution

| customer | payment | satisfaction | born | income (k€) | returned? |
|---|---|---|---|---|---|
| 1 | card | 4 | 1987 | 52 | yes |
| 2 | invoice | 2 | 1995 | 31 | no |
| 3 | card | 5 | 1979 | 78 | no |
| … | … | … | … | … | … |


<div class="grid-2">


<div class="card">

### Each column is a random variable
$X\_{\text{payment}}, X\_{\text{satisf.}}, \ldots$ — a function from customers to
values, exactly as a random variable was defined.

</div>


<div class="card">

### Each row is one draw
The whole table is $n$ draws from one joint distribution
$p(x\_1, \ldots, x\_d)$ that nobody has written down.

</div>


</div>


Notes:
Satisfaction and year of birth are the columns of the attribute-type
mini-exercise — deliberately. There they were classified by scale; here they
become random variables. Say the
sentence that makes the rest of the course possible: *a dataset is not the
distribution, it is a sample from it.* Everything we compute from the table is
therefore an estimate, and an estimate comes with an error.

--

## The Scale Suggests the Model

| attribute | scale | a first model |
|---|---|---|
| returned? | nominal, two values | **Bernoulli**$(p)$ — one parameter |
| payment | nominal, $k$ values | **categorical**$(p\_1, \ldots, p\_k)$, $\sum\_j p\_j = 1$ |
| satisfaction | ordinal | categorical — the order is not used, or an ordinal model |
| born | interval | normal, on a restricted range |
| income | ratio, positive, skewed | log-normal, or normal on $\log$ income |


<div class="c-warning">

The scale limits the model as it limits the statistics: a normal distribution
for ZIP codes is as meaningless as their mean.

</div>


Notes:
Not a catalogue to memorise — a habit: before choosing a distribution, check what
the scale permits. The categorical distribution is the Bernoulli with more than
two values; it is the distribution naive Bayes uses for every nominal
attribute. Satisfaction is the honest hard case: treating it as categorical
throws the order away, treating it as numeric invents equal gaps.

--

## What "i.i.d." Claims

The standard reading of a table rests on one assumption: the rows are
**independent and identically distributed**.


<div class="grid-2">


<div class="card">

### Independent
One customer's row tells us nothing about another's.

</div>


<div class="card">

### Identically distributed
Every row comes from the **same** joint distribution.

</div>


</div>



<div class="q">

Which of these datasets break it: daily sales of one shop · two visits by the
same customer · pixels of one image · a survey sent to a random sample?

</div>



<div class="fragment">

Only the random survey is plausibly i.i.d. Time series, repeated measurements
and spatial data all violate it — the arrangement *is* information.

</div>


Notes:
The i.i.d. assumption is what turns "the table" into "a sample", and it is what
lets a likelihood factorise into a product over rows — the step every fitting
method takes. Link back to
the shapes of data: record data is the case where i.i.d. is at least plausible;
graphs, grids and time series are the cases where it is not.

--

## Takeaway


<div class="takeaway">

A dataset is **$n$ draws from an unknown joint distribution**: columns are random
variables, rows are draws, and the scale of each column suggests its model.
Reading a table this way rests on an assumption — **i.i.d.** — that should be
checked, not presumed.

</div>


--

## Bernoulli and Binomial


<div class="grid-2">


<div class="column">


<div class="card">

**Bernoulli$(p)$** — one trial

$X = 1$ success, $X = 0$ failure

$$E[X] = p, \quad \mathrm{Var}(X) = p(1-p)$$

</div>


</div>


<div class="column">


<div class="card">

**Binomial $B(n,p)$** — $n$ independent trials

$$p(k) = \binom{n}{k} p^k (1-p)^{n-k}$$

$$E[X] = np, \quad \mathrm{Var}(X) = np(1-p)$$

</div>


</div>


</div>


$\binom{n}{k} = \frac{n!}{k!\\,(n-k)!}$ counts the sequences with $k$ successes;
the PMF multiplies it by the probability of one such sequence — combinatorics
and independence in a single line.

Notes:
Point at where each ingredient comes from: the binomial coefficient counts the
ways to place k successes among n trials, the product p^k(1−p)^(n−k) comes from
independence. Nothing here is new machinery, which is exactly the message.

--

## How the Shape Depends on the Parameters

<div class="viz viz-lg" data-viz="math/distribution-explorer" data-steps="4"
 data-params='{"kind": "binomial", "p": 0.5, "n": 5, "sweep": {"param": "n", "values": [5, 10, 20, 40, 60]}}'></div>

**Predict before each click:** as $n$ grows, does the distribution get wider or
narrower — and what happens to its shape?

Notes:
Predict-then-check (P6). Two things happen at once: the spread in absolute terms
grows (√n) while the shape becomes symmetric and bell-like. The second
observation is the central limit theorem at work — a sum of many independent
coin flips. Name it as an observation; the theorem itself is stated with the
normal distribution.

--

## Mini-Exercise

A student guesses all **10** questions of a quiz, each with **4** options.


<div class="q">

How many correct answers should they expect — and is 5 or more likely?

</div>



<div class="fragment">

$B(10, 0.25)$: on average $10 \cdot 0.25 = 2.5$ correct. Five or more is
twice the expectation — unlikely (about 8%).

</div>


Notes:
Two minutes: the expectation is head arithmetic, the second half only asks for
a judgement. If someone wants the exact tail, it is P(X ≥ 5) ≈ 0.078 — a sum over
six PMF values, not one. The modelling point matters more than the number: the
binomial needs independent guesses with a constant success probability; ask
when that would fail in a real exam.

--

## Takeaway


<div class="takeaway">

A yes/no attribute is a **Bernoulli** variable with one parameter $p$; counting
the yeses in $n$ independent trials gives a **binomial**. Both are counting in
probabilistic clothing — and $p$ is the number data will have to tell us.

</div>


--

## We Never Know the Distribution

Up to now we assumed a distribution was given. In practice it is **unknown**,
and we must estimate its properties from data.


<div class="grid-2">


<div class="column">


<div class="card">

**Population**

The entire group — all humans on earth, all transactions, all documents.

Its properties ($\mu$, $\sigma^2$) are the truth we cannot observe.

</div>


</div>


<div class="column">


<div class="card">

**Sample**

The observations we actually have.

Its properties ($\overline{x}$, $s^2$) are what we compute; estimates of the
population's ($\overline{x}$, $\hat{\sigma}^2$) are built from them.

</div>


</div>


</div>


**Descriptive statistics** summarise a sample, usually while assuming something
about the underlying distribution.

Notes:
This slide is the hinge of the whole module: everything before it was
deduction from a model, everything after is inference from data. The
population/sample distinction is exactly the gap that statistics manages.

--

## What We Summarise


<div class="grid-3">


<div class="column">

### Central tendency
1st order moment

sample mean, median

</div>


<div class="column">

### Dispersion
2nd central moment

variance, standard deviation, interquartile range

</div>


<div class="column">

### Shape
3rd central moment

skewness — or, without moments, quantiles

</div>


</div>


Univariate statistics describe one random variable; **multivariate** statistics
describe $X\_1, \ldots, X\_d$ together.

Notes:
The moment ordering gives a clean mental index: where is it, how spread, how
lopsided. Each has a robust and a non-robust representative: the median against
the mean for location, the interquartile range against the standard deviation
for spread.

--

## Means


<div class="grid-2">


<div class="column">

**Sample mean**
$$\overline{x} = \frac{1}{n}\sum\_{i=1}^{n} x\_i$$

**Weighted mean**
$$\overline{x}\_w = \frac{\sum\_i w\_i x\_i}{\sum\_i w\_i}$$

</div>


<div class="column">

**Geometric mean** — for rates and ratios
$$\Big(\prod\_i x\_i\Big)^{1/n}$$

**Harmonic mean** — for averaging rates
$$\frac{n}{\sum\_i 1/x\_i}$$

</div>


</div>


**Trimmed mean:** drop the $k$ smallest and largest values, then average — a
cheap way to buy robustness.

Notes:
The sample mean estimates E[X]. Ask when the arithmetic mean is simply wrong:
average speed over equal distances (harmonic), average growth rate
(geometric). Choosing the mean is a modelling decision, not a formality.

--

## Median


<div class="c-definition">

The **median** is the middle value of the sorted sample: for odd $n$ the
$\frac{n+1}{2}$-th value, for even $n$ the average of the two middle values.

</div>



<div class="grid-2">


<div class="column">


<div class="card good">

**Robust** against outliers — one extreme value moves the median by at most one
position

</div>


</div>


<div class="column">


<div class="c-warning">

**Costlier** to compute: requires sorting, or an interval approximation over
binned data

</div>


</div>


</div>


For binned data, the median is interpolated within its interval from the
cumulative counts, the interval's lower border and width.

Notes:
The mean-versus-median contrast is the first robustness discussion of the
course, and it returns in clustering (k-means vs. k-medoids) and in evaluation.
Ask which one a salary report should quote, and why the answer is political.

--

## One Value, Two Very Different Reactions

<div class="viz viz-lg" data-viz="math/robust-center" data-steps="3"></div>

**Commit first:** drag the top salary to the far right. Which marker follows?

Notes:
Manipulable widget (P6 tier 3) with the prediction taken first, as the policy
requires. The mean is drawn as the fulcrum the beam balances on, so the drag is
visibly a lever: one value far out has to be balanced by everything else.

Drag it all the way and stop. The mean is now above six of the seven salaries —
a "typical" value that almost nobody earns. The median has not moved at
all — it is still 44 k€. Then ask the political question: which number goes in the recruitment
advert, and which one in the union's press release?

--

## Mini-Exercise

Salaries in a small firm (in k€): 38, 41, 42, 44, 45, 47, 260.

Compute the mean and the median. Which number should appear in a recruitment ad,
and which one describes a typical employee?

--

## Mini-Exercise — Solution


<div class="fragment">

Mean $\approx 73.9$, median $= 44$.

The single large value pulls the mean above **every** salary except one. The
median describes the typical employee; the mean describes the payroll divided by
headcount. Both are correct — they answer different questions.

</div>


Notes:
The punchline: neither number is wrong, but only one is honest as a summary of
"typical". This is the first appearance of the idea that a statistic encodes a
question.

--

## Dispersion

**Dispersion** describes how stretched or squeezed the data is around its
centre.


<div class="grid-2">


<div class="column">


<div class="card">

**Sample variance** — the variance *of the observed data*
$$s^2 = \frac{1}{n}\sum\_{i=1}^{n}(x\_i - \overline{x})^2$$

**Standard deviation** $s = \sqrt{s^2}$, in the unit of the data.

</div>


</div>


<div class="column">


<div class="c-tip">

Computable in **one pass** over the data, $O(n)$, using
$$\sum x\_i^2 \text{ and } \sum x\_i$$
— which matters when the data does not fit in memory.

</div>


</div>


</div>


Notes:
The one-pass remark is the data-engineering link: streaming aggregations rely on
it. Mention the numerical-stability caveat if the group is advanced.

--

## Why the Denominator Changes


<div class="c-definition">

The **population variance** $\sigma^2$ is the variance over the whole
population. If the true mean $\mu$ is unknown, we must estimate it — and using
$\overline{x}$ in its place makes the deviations systematically too small.

$$
\hat{\sigma}^2 = \frac{1}{n-1}\sum\_{i=1}^{n}(x\_i - \overline{x})^2
$$

</div>



<div class="c-note">

Dividing by $n-1$ compensates: one degree of freedom was spent estimating the
mean from the same data.

Naming is not uniform: many textbooks, and pandas, call the $n-1$ version $s^2$;
NumPy's `var` divides by $n$ unless told otherwise.

</div>


Notes:
Do not derive the correction; give the intuition. A good probe: with n = 1, the
sample variance is 0 (the point equals its own mean) — clearly not an estimate
of population spread, and the corrected formula refuses to answer at all.

--

## Takeaway


<div class="takeaway">

$s^2$ describes **the sample**; $\hat{\sigma}^2$ estimates **the population**.
The $n-1$ is not a convention — it is the price of having estimated the mean
from the same data.

</div>


--

## You Computed a Number. Which Number Did You Want?

Seven salaries gave a sample mean of $\overline{x} = 73.9$ k€.


<div class="q">

What is the probability that the population mean $\mu$ is exactly 73.9 k€?

</div>



<div class="fragment">

Zero. $\overline{x}$ is not $\mu$ — it is one **estimate** of it, computed from
the seven people who happened to be in the sample.

The honest question is not *what is $\mu$* but **how far from $\mu$ can this
number be?**

</div>


Notes:
Open on the gap, not on a definition (P1, P4). Most students will answer with a
number or hedge; the point is that the question is malformed. Everything in this
unit exists to replace "μ = 73.9" with "μ = 73.9 ± something", and to say where
the something comes from.

--

## Estimator and Estimate


<div class="c-definition">

**Definition.** An **estimator** is a function of the sample —
$\hat{\theta} = g(X\_1, \ldots, X\_n)$ — used to approximate an unknown quantity
$\theta$ of the population. The number it takes on for one particular sample is
an **estimate**.

</div>


The sample is random, so the estimator is a **function of random variables**:
$\hat{\theta}$ is itself a random variable, with a distribution of its own.


<div class="c-note">

$\overline{x}$, $s^2$ and $\hat{\sigma}^2$ from descriptive statistics are all
estimators. We used them without saying what kind of object they are.

</div>


Notes:
Math first (P5) — this is a second pass over objects the students already
compute. The load-bearing sentence is the middle one: a statistic inherits
randomness from the sample. Everything else follows from taking that seriously.

--

## An Estimator Has a Distribution

<div class="viz viz-lg" data-viz="math/sampling-distribution" data-steps="4"
 data-params='{"shape": "uniform", "n": 5}'></div>

**Predict first:** after a thousand samples, what shape will the lower picture
have — and how wide?

Notes:
Stepped visualization (P6 tier 2 with tier-3 controls). One click per step: draw
one sample; record its mean; fifty samples; a thousand, with the normal curve
and the standard error. Both pictures share the x-axis, so "the means are more
tightly packed than the population" is something students see rather than
something we assert. Collect predictions before the third click — the common
guess is that the spread stays the same.

--

## Three Things the Picture Shows


<div class="marks-step">

- The means pile up **around $\mu$** — the estimator is not systematically off
- The pile is **narrower than the population** — averaging cancels noise
- The pile is **bell-shaped**, even though the population was not

</div>



<div class="c-definition">

**Definition (Sampling distribution).** The distribution of an estimator
$\hat{\theta}$ over all possible samples of size $n$.
$\hat{\theta}$ is **unbiased** if $E[\hat{\theta}] = \theta$.

</div>


Notes:
The three observations are, in order: unbiasedness, the standard error, and the
central limit theorem — named on the next slides. Naming them here would be
faster and worse. Ask which of the three would still hold for the *median*
(the first two do; the third does too, but that needs a different argument).

--

## Use the Widget: Change the Population

Set the population to **skewed** and then to **bimodal**, keeping $n = 5$.


<div class="q">

Which of the three observations survive a population that is not symmetric?

</div>



<div class="fragment">

All three. The shape of the sampling distribution stops depending on the shape
of the population as soon as $n$ is more than a handful — which is why one
formula can cover cases we never inspect.

</div>


Notes:
Tier-3 exploration, with the prediction committed first as the policy requires.
The bimodal population is the persuasive one: two separate humps, and the means
of five draws still form a single bell. Push n to 2 to show where it breaks
down — the claim is asymptotic, not magic.

--

## Standard Error


<div class="c-definition">

**Definition (Standard error).** The standard deviation of an estimator's
sampling distribution. For the sample mean of independent draws:
$$
\mathrm{SE}(\overline{X}) = \frac{\sigma}{\sqrt{n}}
$$

</div>


It is measured in the unit of the data and answers "how far off is a typical
estimate", where $\sigma$ answers "how far apart are typical *observations*".


<div class="c-warning">

$\sigma$ and $\mathrm{SE}$ are different quantities. More data does nothing to
$\sigma$ — the world stays as variable as it was — and shrinks $\mathrm{SE}$.

</div>


Notes:
The warning is the most valuable line in the unit: σ is the variability of the
world (aleatoric uncertainty), SE is our ignorance about the estimate (epistemic
uncertainty) — the two words return at the end of the unit. Ask which one a weather
forecast's "±3 °C" refers to; the answer is usually both, mixed.

--

## Precision Costs Data

| Multiply the data by… | …and the standard error is multiplied by |
|---|---|
| 2 | 0.71 |
| **4** | **½** |
| 25 | ⅕ |
| **100** | **⅒** |

The $\sqrt{n}$ is why the last digit of an estimate is so expensive: halving the
error costs four times the data, and a tenfold improvement costs a hundredfold.

Notes:
The economics of data collection in one line, and a sanity check students can
apply to any claim about "more data". Ask what this implies for an A/B test that
wants to detect a 0.1% difference. It also foreshadows why we later care about
better *models* rather than only bigger *samples*.

--

## Two Theorems We Have Already Seen Happen


<div class="grid-2">


<div class="column">


<div class="c-insight">

**Law of large numbers**

$\overline{X}\_n \to \mu$ as $n \to \infty$.

The estimate converges on the truth — the pile keeps narrowing.

</div>


</div>


<div class="column">


<div class="c-insight">

**Central limit theorem**

$\overline{X}\_n$ is approximately
$N(\mu, \sigma^2/n)$ for large $n$.

And we know the *shape* of what is left.

</div>


</div>


</div>


The first says the error goes away; the second says how much of it is left after
$n$ observations. Only the second lets us put a number on our ignorance.

Notes:
Deliberate spiral (P7): the CLT was stated in the continuous-distributions unit
and was visible in the binomial sweep. Here it acquires a job. Emphasise the
division of labour between the two theorems — students routinely quote the LLN
where they need the CLT.

--

## From a Number to an Interval

If $\overline{X} \approx N(\mu, \sigma^2/n)$, then for 95% of samples
$\overline{X}$ lands within $1.96\thinsp\mathrm{SE}$ of $\mu$ — and therefore $\mu$
lands within $1.96\thinsp\mathrm{SE}$ of $\overline{X}$.

<div class="viz eq-explain" data-viz="core/equation-explain" data-steps="3"
 data-params='{"labels": ["the estimate — our best single guess", "how confident we insist on being", "how noisy the estimate is"]}'>

$$
\eqa{\overline{x}} \pm \eqb{1.96} \cdot \eqc{\frac{\sigma}{\sqrt{n}}}
$$

</div>

Notes:
Math-first-then-meaning (P5), legitimate because the picture came first. Walk the
three parts and ask what each one would have to do to make the interval wider.
σ is treated as known here; the correction for an estimated σ (the t
distribution) is a refinement, not a different idea.

--

## What Does "95% Confident" Mean?

<div class="viz viz-lg" data-viz="math/confidence-intervals" data-steps="4"
 data-params='{"mu": 100, "sigma": 15, "n": 10, "level": 0.95}'></div>

Notes:
Stepped, then manipulable. One interval; twenty; sixty with the coverage tally;
then the invitation to change the level and n. Ask before the third click how
many of sixty intervals should miss. The red rows are the whole argument: the
misses look exactly like the hits from the inside.

--

## The Sentence Almost Everyone Gets Wrong


<div class="grid-2">


<div class="column">


<div class="card muted">

<span class="eyebrow">What it does not mean</span>

"There is a 95% probability that $\mu$ lies in **this** interval."

$\mu$ is a fixed number. It is either in this interval or it is not — there is
no probability left to have.

</div>


</div>


<div class="column">


<div class="c-important">

<span class="eyebrow">What it means</span>

"95% of the intervals produced **by this procedure** contain $\mu$."

The probability is a property of the recipe, evaluated before the data is seen.

</div>


</div>


</div>


Notes:
This is the distinction the picture just made — the rows are the procedure, one
row is your data. Expect resistance: the wrong reading is the useful-sounding
one. Note also that a Bayesian credible interval *does* license the first
sentence, at the price of requiring a prior — a forward pointer, not a
dependency.

--

## Where This Leaves Us


<div class="grid-2-1">


<div class="column">

Two kinds of uncertainty meet in one formula. We can now measure one of them.


<div class="marks-step">

- $\sigma$ — how variable the world is. **Aleatoric.** Unchanged by data.
- $\mathrm{SE} = \sigma/\sqrt{n}$ — how badly we know our own estimate.
 **Epistemic.** Shrinks with data.

</div>


</div>


<div class="column">


<div class="c-note">

"More data helps" was a slogan.

It is now a rate: $1/\sqrt{n}$.

</div>


</div>


</div>


Notes:
If the course has already named the two kinds of uncertainty, close that loop
here; if not, the two bullets introduce the words. This is the slide to point back to
whenever a later lecture claims a model is uncertain "because it has not seen
enough" — that claim has a magnitude, and this is where it comes from.

--

## Mini-Exercise

A shop timed $n = 100$ customers at a counter: $\overline{x} = 180$ s, and past
records give $\sigma = 60$ s. What is the standard error — and how many
customers would halve it?


<div class="fragment">

$\mathrm{SE} = 60/\sqrt{100} = 6$ s, so the 95% interval is about
$180 \pm 12$ s. Halving the SE needs twice the $\sqrt{n}$ — **four times the
data**, $n = 400$. $\sigma = 60$ s does not change: customers stay as variable
as they were; only our knowledge of their average improves.

</div>


Notes:
Solution on the same slide, click-gated. The second part is the one that
transfers: the √n law is the answer to nearly every "how much data do we need"
question a student will be asked. The interval is 180 ± 1.96 · 6 ≈ [168, 192] s.
If time allows, ask what would change if σ had to be estimated too.

--

## Takeaway


<div class="takeaway">

A statistic is a **random variable**. Its distribution over repeated samples is
the sampling distribution; its spread is the **standard error**, $\sigma/\sqrt{n}$.
A confidence interval reports that spread — and its percentage describes the
**procedure**, not the one interval in front of you.

</div>


Notes:
Stabilise three things: statistic-as-random-variable, the 1/√n rate, and the
procedure reading of confidence. All three return whenever a measured number —
an accuracy, an error rate — is reported with an error bar, and a Bayesian
treatment gives the same question a different, more directly stated answer.

--

## An Unknown Number, Ten Observations

A new feature went live. Of the first **10 users**, **3 came back**.


<div class="q">

What is $p$, the probability that a user comes back — and how sure are we?

</div>



<div class="fragment">


<div class="grid-2">


<div class="card">

<span class="eyebrow">What the last unit can say</span>

$\hat{p} = 0.3$, standard error $\approx 0.14$, a 95% interval of roughly
$[0.02, 0.58]$ — about the *procedure*, not about $p$.

</div>


<div class="c-important">

<span class="eyebrow">What we would like to say</span>

"$p$ is probably between 0.1 and 0.6, most likely around 0.3" — a statement
**about $p$**.

</div>


</div>


</div>


Notes:
Pick up the tension the confidence-interval unit left: the useful-sounding
sentence was forbidden, because μ (here p) was not random. This unit takes the
other road: if we are uncertain about p, describe that uncertainty with a
distribution — exactly as we describe any other unknown.

The frequentist numbers: SE = √(0.3·0.7/10) ≈ 0.145, so 0.3 ± 1.96·0.145. Note
in passing that the normal approximation is poor at n = 10; that is one more
reason to want something else.

--

## Conditioning on the Data — for a Parameter

Treat the unknown $p$ as a random variable $\theta$ and apply **Bayes' theorem**,
with $\theta$ in place of the hypothesis and the data $D$ as the evidence:

<div class="viz eq-explain" data-viz="core/equation-explain" data-steps="4"
 data-params='{"labels": ["posterior — belief about θ after the data", "likelihood — how probable the data is for each θ", "prior — belief about θ before", "evidence — normalises, does not depend on θ"]}'>

$$
\eqa{p(\theta \mid D)} = \frac{\eqb{p(D \mid \theta)} \cdot \eqc{p(\theta)}}{\eqd{p(D)}}
$$

</div>

For i.i.d. yes/no data with $h$ yeses in $n$ trials:
$p(D \mid \theta) = \theta^{h} (1-\theta)^{n-h}$ — read as a function of
$\theta$, with the data fixed.

Notes:
The same four parts as the disease test, one level up: the hypothesis is now a
number, so the prior and posterior are densities over [0, 1] instead of two
probabilities. The likelihood is the Bernoulli model from the data module,
multiplied over rows — the i.i.d. assumption doing its job. Say explicitly that
the likelihood is *not* a distribution over θ; Lecture 03 builds on that
distinction.

--

## A Prior That Behaves Like Counts


<div class="c-definition">

**Beta prior.** $p(\theta) \propto \theta^{a-1}(1-\theta)^{b-1}$ on $[0, 1]$,
written $\mathrm{Beta}(a, b)$. $\mathrm{Beta}(1,1)$ is flat: every $p$ equally
plausible.

</div>


Multiply by the likelihood $\theta^{h}(1-\theta)^{n-h}$:

$$
p(\theta \mid D) \propto \theta^{a+h-1}(1-\theta)^{b+n-h-1}
\quad\Longrightarrow\quad
\theta \mid D \sim \mathrm{Beta}(a + h,\enspace  b + n - h)
$$


<div class="c-insight">

The update is **adding counts**: $a$ and $b$ act like yeses and noes seen before
the data. A prior whose posterior stays in the same family is called
**conjugate**.

</div>


Notes:
No integral needed — the exponents simply add. That is the whole reason for the
Beta: it makes the posterior computable by hand. The pseudo-count reading is
the one to stabilise, because it makes the next two slides predictable: a
prior worth 2 observations is swamped by 1,000 real ones.

--

## Watching the Posterior Form

<div class="viz viz-lg" data-viz="math/bayes-updating" data-steps="10"
 data-params='{"prior": [1, 1], "observations": [0, 1, 0, 0, 1, 0, 0, 0, 1, 0], "symbols": ["✓", "✗"], "names": ["yes", "no"], "xLabel": "θ = P(user returns)"}'></div>

**Predict before each click:** which way does the curve move after a ✗ — and
does it get narrower every time?

Notes:
One observation per click, flat prior. Stop after the first ✗ and after the
first ✓ and ask what the curve now says. Two things to see: each observation
moves the peak toward what was observed, and the curve narrows with every
observation regardless of direction — the narrowing is the epistemic
uncertainty shrinking, as promised in Lecture 01. After ten: Beta(4, 8).

--

## What the Posterior Gives You

After 3 of 10, with a flat prior: $\theta \mid D \sim \mathrm{Beta}(4, 8)$.

| question | answer | from |
|---|---|---|
| most plausible $p$ | $0.30 = h/n$ | the peak (mode) |
| best guess on average | $0.33$ | the posterior mean $\frac{a+h}{a+b+n}$ |
| where is $p$, 95%? | $[0.11,\ 0.61]$ | a **credible interval** |
| after 1,000 users, 300 back | $[0.27,\ 0.33]$ | same model, more data |


<div class="c-note">

The peak under a flat prior is exactly $h/n$. **Lecture 03** keeps only this peak
and calls it maximum likelihood — the first shortcut of the course.

</div>


Notes:
Every row is read off the same distribution — Lecture 01's third move. The
credible interval licenses the sentence the confidence interval forbade: "p lies
in [0.11, 0.61] with probability 0.95", given the prior. The last row is the
1/√n law again: the posterior standard deviation falls from 0.13 to 0.015.

--

## How Much Does the Prior Matter?

Two analysts: one with a flat prior $\mathrm{Beta}(1,1)$, one convinced that
$p$ is near a half, $\mathrm{Beta}(10,10)$.

| data | flat prior | "near a half" prior |
|---|---|---|
| 3 of 10 | mean 0.33 | mean 0.43 |
| 300 of 1,000 | mean 0.30 | mean 0.30 |


<div class="c-important">

With little data the prior matters; with enough data the analysts **agree**.
A prior is a stated assumption — it can be argued with, and it washes out.

</div>


Notes:
The usual objection to Bayesian methods is that the prior is subjective. The
answer has two halves, both on the slide: the prior is written down, so it can
be criticised like any other modelling choice, and its influence is worth a+b
pseudo-observations — 20 here — which data overwhelms. Where data is scarce the
prior matters, and then it *should*: it is the only information there is.

--

## Mini-Exercise

Prior $\mathrm{Beta}(2, 2)$. Of 10 users, **8** come back.


<div class="q">

Is the posterior mean above or below $0.8$ — and why?

</div>



<div class="fragment">

**Below.** The posterior is $\mathrm{Beta}(2+8,\ 2+2) = \mathrm{Beta}(10, 4)$,
mean $10/14 \approx 0.71$. The prior counts two yeses and two noes, so it
pulls towards $0.5$ — and the pull fades as data grows.

</div>


Notes:
One question, answerable from the pseudo-count reading alone; the numbers are
for checking. The peak is 9/12 = 0.75, also below 0.8. The transferable point:
a prior acts like regularisation, shrinking an estimate towards a default —
exactly how Lecture 03 reads weight decay.

--

## Two Ways to Answer "Where Is p?"


<div class="grid-2">


<div class="card">

<span class="eyebrow">Frequentist</span>

### $p$ is fixed; the data is random

The confidence interval is a **procedure** that catches $p$ in 95% of samples.
About this one interval, no probability statement is allowed.

*Needs:* nothing but the sampling model.

</div>


<div class="card">

<span class="eyebrow">Bayesian</span>

### the data is fixed; $p$ is uncertain

Condition on the sample and get a distribution **over $p$**: "$p$ lies in
this interval with probability 0.95" becomes a true sentence.

*Needs:* a **prior** — what we believed about $p$ before the data.

</div>


</div>



<div class="c-insight">

The axioms are the same; the question is not. The rest of the course mostly
takes the second road — and Lecture 03 starts with its cheapest version: keep
only the peak.

</div>


Notes:
This is the place where "both interpretations yield the same mathematics" (the
axioms unit) stops being the whole story: the mathematics agrees, but the two
schools assign probabilities to different things, and so they answer different
questions. Do not stage a war; state the trade. The frequentist interval needs
no prior and makes a weaker statement; the Bayesian interval makes the
statement everyone wanted and pays with a prior.

With a flat prior and plenty of data the two intervals nearly coincide
numerically (compare [0.27, 0.33] with 0.3 ± 1.96·0.0145) — worth one sentence,
because students will notice and suspect a trick.

--

## Takeaway


<div class="takeaway">

An unknown parameter is just another unknown: give it a **prior**, condition on
the data, and the **posterior** says what the data justifies — as a peak, a mean
and an interval. For yes/no data with a Beta prior the update is **adding
counts**, and the prior's influence fades as data grows.

</div>

      // so grow first and then pull back until the slide genuinely fits. Two
      // or three passes settle it; the guard stops a pathological loop.
      for (let k = 0; k < 6; k++) {
        const over = sec.scrollHeight - SLIDE_H;
        if (over <= 0) break;
        width -= aspect * (over + 6);
        if (width < 240) { width = 240; svg.style.maxWidth = "240px"; break; }
        svg.style.maxWidth = Math.floor(width) + "px";
      }
    }

    // How much of the canvas the content actually uses. scrollHeight cannot
    // answer this: the theme lays a rendered slide out at the full 720px, so it
    // reads 720 whatever the content is — and reads 0 while the slide is
    // display:none. Measuring the children works in both states.
    function contentHeight(sec) {
      const s = scale();
      let used = 0;
      for (const child of sec.children) {
        if (child.tagName === "ASIDE") continue;
        const h = child.getBoundingClientRect().height;
        if (!h) continue;
        used += h / s + PER_CHILD;
      }
      return used;
    }

    function fit() {
      for (const sec of document.querySelectorAll(".reveal .slides section")) {
        if (sec.querySelector("section")) continue;              // stack wrapper
        if (sec.classList.contains("title-slide")) continue;
        if (sec.classList.contains("module-slide")) continue;
        fitFigure(sec);
        const used = contentHeight(sec);
        // A hidden slide measures 0; leave its class alone rather than
        // centring everything off-screen. It is measured when it becomes
        // current, since fit() runs on every slidechanged.
        if (used === 0) continue;
        sec.classList.remove("v-center");
        if (SLIDE_H - used > MIN_FREE) {
          sec.classList.add("v-center");
          // Child rectangles exclude margins, so a slide whose blocks are
          // generously spaced measures smaller than it lays out. Under
          // .v-center the section is exactly SLIDE_H tall, which makes
          // scrollHeight an exact overflow test — take the centring back if
          // it pushed anything past the bottom edge.
          if (sec.scrollHeight > SLIDE_H) sec.classList.remove("v-center");
        }
      }
    }

    const start = () => {
      fit();
      window.Reveal?.on?.("slidechanged", fit);
      window.Reveal?.on?.("resize", fit);
      setTimeout(fit, 1200);                 // visualizations mount asynchronously
    };
    if (window.Reveal?.isReady?.()) start();
    else window.Reveal?.on("ready", start);
  })();
})();</script></body></html>
