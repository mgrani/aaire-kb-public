Notes:
Five modules. Three kinds of classifier: a rule maps $x$ to a class without
any probability; a discriminative classifier models $P(y \mid x; θ)$ only; a
generative classifier models $P(y)$ and $p(x \mid y)$, obtains the posterior
by Bayes' theorem and can generate data. The curse of dimensionality: read as
a sample, the training table cannot fill a full $p(x \mid y)$, whose cells multiply with every attribute
(the curse of dimensionality), so the model must be restricted — by a simpler
structure, by parametric families, or both. Naive Bayes: conditional
independence of the attributes given the class, which reduces the number of
parameters from $2^p - 1$ to $p$ per class for $p$ binary attributes; fitting
is counting, and a count of zero vetoes all other evidence unless it is
smoothed. Continuous attributes: a density per class, of which Bayes' theorem
needs only the ratio; Gaussian naive Bayes; one Gaussian per class keeps the
correlations at a cost quadratic in $p$; a shared covariance makes the
boundary linear, the logistic form of <a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>; a class
with two patterns needs a mixture (<a href="/courses/probabilistic-machine-learning/lecture/l07-probabilistic-algorithms/">Lecture 07</a>).
Deciding on a class: the most probable class minimises the error rate (the
Bayes decision rule); unequal costs move the threshold on the posterior to
$c\_{FP}/(c\_{FP} + c\_{FN})$; for a generative model prior and costs meet in one
threshold on the likelihood ratio.

Three choices are independent of each other: what to model (generative or
discriminative), how to fit its parameters, and how to decide on a class. This
lecture fits by counting and by class means and spreads;
<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a> opens by showing what these estimates are (the
peak of a posterior over the parameter, the maximum likelihood estimate; +1
smoothing is its mean) and then fits discriminative models the same way. Fraud
detection (base rate 1 in 1,000, red flags and the amount) is the running
example.

<div class="column">

| | PML | DB | total |
|---|---|---|---|
| **fail** | 10 | 6 | 16 |
| **pass** | 30 | 54 | 84 |
| **total** | 40 | 60 | 100 |

</div>


<div class="column middle">

$$
P(\text{PML} \mid \text{fail})
= \frac{P(\text{fail} \mid \text{PML})\\, P(\text{PML})}{P(\text{fail})}
= \frac{10}{16}
$$


<div class="c-insight">

**One** hypothesis, **one** piece of evidence: Bayes' theorem reads the table
backwards.

</div>


</div>


</div>



<div class="fragment q">

Now the hypothesis is a **class** — fraud or honest — and the evidence a whole
**transaction**. What changes?

</div>


Notes:
The count table of <a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a> is a joint
distribution of two variables, course and result, given as counts. Bayes'
theorem read it backwards: the prior $P(\text{PML}) = 40/100$, the likelihood
$P(\text{fail} \mid \text{PML}) = 10/40$, the evidence
$P(\text{fail}) = 16/100$, so $P(\text{PML} \mid \text{fail}) = 10/16 \approx 0.63$.

A generative classifier is exactly this computation with the course replaced by
the class $y$ and the exam result by an attribute vector $x = (x\_1, \ldots, x\_p)$:
the class prior $P(y)$ and the class-conditional distribution $p(x \mid y)$ are
estimated from a labelled table and combined by Bayes' theorem.

## From One Attribute to Many


<div class="q-list">


<div class="fragment">

**Many variables at once.** Amount, country, hour, device — how do they
combine into one probability per class?

</div>


<div class="fragment">

**Dependent variables.** Does a new device make a foreign IP more likely?

</div>


<div class="fragment">

**Numbers, not yes/no.** What is the probability of *1,250.00 €*?

</div>


<div class="fragment">

**Probabilities at all?** A rule *if amount > 1k € and new device, then fraud*
also classifies.

</div>


</div>


Notes:
The four questions are the extensions this lecture takes up. Several
variables: $p(x \mid y)$ is a joint distribution over all attributes, with one
number per combination of values ($2^{30} - 1$ per class for 30 binary flags).
Dependence: the joint is not determined by its margins, so each dependence is
a number of its own; naive Bayes assumes them away. Numbers: a continuous
attribute has a density, not a probability per value, so it needs bins or a
parametric family. Probabilities at all: a rule maps $x$ to a class without any
distribution (a discriminant function); logistic regression models
$p(y \mid x)$ only (<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>); the generative route models
$p(x, y)$.

--

## Today: Generative Classifiers and the Bayes Decision Rule

| question | module | the answer, in short |
|---|---|---|
| Probabilities at all? | **Three Kinds of Classifier** | a rule gives a class; a model of $p(x, y)$ gives $P(y \mid x)$, $p(x)$ and new data — if the joint can be estimated |
| Many variables at once? | **The Curse of Dimensionality** | the joint explodes; two ways out — simpler structure, a family |
| Dependent variables? | **Naive Bayes** | assume them independent given the class: one small table each |
| Numbers, not yes/no? | **Continuous Attributes** | a density per class; one Gaussian keeps the dependences |
| Which class, then? | **Deciding on a Class** | the most probable one — or a threshold set by costs and prior |

Notes:
The rows follow the questions of the previous slide, with the decision added:
a posterior is not yet an action. Two assumptions make the joint estimable,
the two ways out of the curse of dimensionality. Conditional independence given the class
is the shortcut "assume it apart" of <a href="/courses/probabilistic-machine-learning/lecture/l01-introduction/">Lecture 01</a>'s table: it
replaces $p(x \mid y)$ by $\prod\_j p(x\_j \mid y)$ and discards the dependences
between attributes. A parametric family replaces a table of counts by a
formula with few parameters, a normal for an amount; one normal per class
keeps the dependences at a cost that grows quadratically, not exponentially,
with the number of attributes, but it cannot follow a class with several
patterns.

A generative classifier as such requires neither assumption; they are what
makes it affordable. How the parameters are fitted — by counting, by class
means and spreads — is a choice of its own, made in the same way for
discriminative models; <a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a> opens with it. The
decision is a third, separate choice: the Bayes decision rule for equal costs,
a threshold from the costs otherwise.

Running example: fraud detection with a base rate of 1 in 1,000 (prior odds
1 : 999), a handful of binary red flags and the amount.

## Argument Map


<div class="img-h-xl">

![Argument map for Lecture 03: three kinds of classifier, the exploding joint and its two ways out — naive Bayes and a density per class — then the Bayes decision rule with costs and the prior](/courses/probabilistic-machine-learning/figures/l03-argument-map.svg)

</div>


Notes:
The map follows the five modules. Of the three kinds of classifier, only the
generative one models $p(y)$ and $p(x \mid y)$; it converts with Bayes' theorem,
keeps the 1/1,000 prior explicit and can generate data. Its problem is the
joint: read as a sample, the table puts almost no data into each of the $m^p$
cells ($2^{30} - 1$ numbers per class for 30 binary flags, against 100 frauds).
There are two ways out. Structure: naive Bayes assumes the flags independent
given the class, so fitting becomes counting; it drops the dependences between
flags, so correlated evidence is counted twice and the probabilities are
over-confident. A family: a density per class for each number, Gaussian naive
Bayes, or one Gaussian per class, which keeps the correlations at a cost
quadratic in the number of attributes; a shared covariance makes the boundary
linear, and a class with two patterns needs a mixture. The Bayes decision rule
turns the posterior into a class: the most probable class makes the fewest
errors, unequal costs move the threshold, and prior and costs enter as one
threshold on the likelihood ratio, so both change without refitting.

What the counts and class means were — the peak of a posterior over the
parameter, the maximum likelihood estimate — opens
<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">L04</a>, which fits discriminative models the same
way; <a href="/courses/probabilistic-machine-learning/lecture/l05-bayesian-networks/">L05</a> states exactly which independences
a model assumes. The course-arc strip places the lecture after the language of
probability (<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">L02</a>).

# Three Kinds of Classifier


<div class="guiding-question">

**Guiding Question:** A rule, a model of $P(y \mid x)$, a model of how the
data arise — what can each one tell us about a transaction, and what does the
most informative one cost?

</div>

## Data and Hypothesis as Random Variables


<div class="grid-2">


<div class="column">

| amount | distance | … | fraud? |
|---|---|---|---|
| 49.90 € | 3 km | … | no |
| 1,250 € | 900 km | … | **yes** |
| $X\_1$ | $X\_2$ | … | $Y$ |

</div>


<div class="column">


<div class="c-definition">

- **Data** $x = (x\_1, \ldots, x\_p)$: the values of the attributes
  $X\_1, \ldots, X\_p$ — what we observe.
- **Hypothesis** $y$: the value of the class variable $Y$ — what we want to
  know.
- **Decision:** the posterior $P(y \mid x)$.

</div>


</div>


</div>



<div class="fragment q">

The student table had hypothesis $A$ = "PML" and evidence $B$ = "fail".
Which of the two is the data, which the hypothesis?

</div>


Notes:
This fixes the notation for the rest of the course. Each column of a labelled
table is a random variable, as in <a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>;
the attribute columns are $X\_1, \ldots, X\_p$ and the label column is $Y$. A row
is one realisation $(x, y)$ of the vector $(X\_1, \ldots, X\_p, Y)$, and the
table is a sample of $n$ such draws.

The names follow the reading of Bayes' theorem: $y$ is the hypothesis (which
class), $x$ the data (what was observed about the case). The count table of
<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a> has the course as the hypothesis, $y$, and the
exam result as the data, $x$: $P(\text{PML} \mid \text{fail})$ is
$P(y \mid x)$. The textbook letters vary (Bishop: $\mathbf{x}$ and $t$ or
$\mathcal{C}\_k$; MacKay: $D$ and $H$); in machine learning $x$ and $y$ are
standard. Capital letters denote the random variables, small letters their
values; $x$ is a vector whenever there is more than one attribute. In general
statements the attributes are numbered, $x\_1, \ldots, x\_p$; in the examples
they are indexed by name, $x\_\text{amt}$ for the amount and $x\_\text{dist}$ for
the distance.

--

## Parameters $θ$


<div class="c-definition">

A **model** is a family of distributions $p(\\,\cdot\\,; θ)$. The
**parameters** $θ$ pick one member; training sets them.

</div>



<div class="grid-2">


<div class="card">

### Read the notation

$p(x \mid y; θ)$ — the probability of data $x$, **given** the hypothesis $y$,
**for** the parameter value $θ$.

The bar conditions on a random variable, the semicolon fixes a parameter.

</div>


<div class="card">

### Example

Fraud share: $P(Y = \text{fraud}; θ) = π$, one number.

Log amount per class ~ normal: $μ\_\text{f}, σ\_\text{f}$ and $μ\_\text{h}, σ\_\text{h}$.

Together: $θ = (π, μ\_\text{f}, σ\_\text{f}, μ\_\text{h}, σ\_\text{h})$.

</div>


</div>


Notes:
<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a> wrote a parametric family as
$p(x \mid θ)$. From here on the parameters are separated by a semicolon,
$p(x; θ)$ and $p(x \mid y; θ)$, so that the bar is reserved for conditioning
on random variables of the model (data and hypothesis). The two notations
mean the same density; the semicolon says that $θ$ is treated as a fixed,
unknown number, not as a random variable.

$θ$ always stands for all parameters of the model; its components get names of
their own — $π$ for the class share (Bishop's notation), $μ$ and $σ$ per class
for a normal. A model with a single parameter, such as the Bernoulli model of
<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>, writes $θ$ for that one number.
The amount is modelled on a log scale, as the module on continuous attributes
shows: amounts are skewed, their logarithms close to normal.

The bar returns for $θ$ once $θ$ gets a distribution of its own: a prior
$p(θ)$ and a posterior $p(θ \mid D)$ over the parameters given the training
data $D$, as in <a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>. Every model in this
course has parameters in this sense — the thresholds of a rule, the weights of
logistic regression, the means and spreads of class distributions.

--

## Rule-Based Classifier


<div class="grid-2-3">


<div class="column">


<div class="c-definition">

A **rule-based classifier**: rules "if $C\_k(x)$ then $c\_k$" plus a default
class. The **rules are the parameters** $θ$.

</div>



<div class="card small">

**Example:** $x\_\text{amt} > a$ and $x\_\text{dist} > b$ → fraud, else honest;
$θ = (a, b)$. **Training:** the fewest errors on the $n$ rows,
$$
\hat θ = \arg\min\_θ\\, \textstyle\sum\_{i=1}^{n} \mathbb{1}[\hat y\_i \neq y\_i]
$$

- $y\_i$: label of row $i$; $\hat y\_i = \text{rule}(x\_i; θ)$: the rule's class
- $\mathbb{1}[\cdot]$: 1 if true, else 0 — the sum counts errors
- $\arg\min\_θ$: the $θ$ with the fewest; $\hat θ$: the fitted $θ$

</div>


</div>


<div class="column middle">

<div class="viz" data-viz="ml/learning-system" data-steps="0"
     data-params='{"mode": "approaches", "reading": 1}'></div>

</div>


</div>


Notes:
The learning system of the introductory lecture with a rule learner in the
model box. The features are the attributes $x$; the model computes
$\text{rule}(x; θ)$; the prediction is a class; the loss counts errors on the
training rows (the 0/1 loss, $\mathbb{1}[\hat y\_i \neq y\_i]$ with
$\hat y\_i = \text{rule}(x\_i; θ)$), and the optimiser searches over $θ$. The
parameters of a rule set are its structure and its thresholds: which
attributes the conditions test, the cut points $a, b$, the class of each rule
and their order (first match wins). For a fixed form, as in the example, only
the thresholds are free; a rule learner (RIPPER, CN2) or a decision tree (CART,
C4.5) also chooses the conditions, greedily, because the number of possible
rule sets grows combinatorially. A decision tree is a rule set whose
conditions are the paths from the root to the leaves.

No component of the system represents a probability: there is nothing to
condition on, nothing to marginalise and no prior to change. The 0/1 loss is
piecewise constant in $θ$, so it is minimised by search over candidate
thresholds, not by gradients.

--

## Rules From Data

<div class="viz viz-lg" data-viz="ml/generative-2d" data-steps="2"
 data-params='{"view": "rule"}'></div>


<div class="q">

Which transaction is the rule surest about — A, B or C?

</div>


Notes:
The data are 98 labelled transactions with two attributes, the amount
$x\_\text{amt}$ and the distance from the card holder's home $x\_\text{dist}$
(both on log axes); fraud is
over-represented (a third) so that it is visible. The rule is learned from the
table: among all rules of the form "amount $> a$ and distance $> b$ → fraud",
the thresholds $(a, b)$ with the fewest training errors are chosen by trying
every split between neighbouring values — the rule and the training criterion
of the previous slide. The learned box has 5 training errors.

The rule assigns the same class to every point in its box. The only number it
can attach is the share of fraud among the training rows in the box, the same
for A (at the corner) and B (deep inside). C is a transaction unlike any row in
the table; the rule classifies it as honest without any indication that the
answer is unsupported.

--

## What a Rule Can Not Say


<div class="grid-2">


<div class="column">


<div class="marks-no">

- **How sure.** One share for the whole box — A and B alike.
- **Honestly.** The share is measured on the rows that chose the box:
  optimistic, 100% for a box searched until pure.
- **Under a new base rate.** The training mix is baked into the thresholds.
- **That an input is strange.** No model of $x$: C gets an answer like any other.

</div>


</div>


<div class="column">


<div class="card">

### Examples

- **Fraud rule engines:** "amount > 1k € and new device → block".
- **Decision trees:** rules learned by splitting, one class per leaf.

</div>



<div class="c-insight">

A rule is a **discriminant function**: $x \mapsto$ a class. No distribution
is modelled.

</div>


</div>


</div>


Notes:
A discriminant function maps an input directly to a class (Bishop, *Pattern
Recognition and Machine Learning*, §1.5.4, distinguishes it from the two
probabilistic approaches that follow). Rule sets and decision trees are the
standard examples; a support vector machine is another.

The leaf or box share is a relative frequency $\hat P(y \mid x \in R)$ for the
region $R$, not $P(y \mid x)$: it is constant over $R$, and because $R$ was
selected to make the share extreme, the training share overstates the share on
new data (selection bias; the same effect makes a fully grown decision tree
report 100% in every leaf). Calibrating such scores needs held-out data
(a held-out set, not the training rows). Thresholds learned on a sample with one base rate
encode that base rate; under a different one they are no longer optimal, and
nothing in the rule says how to adjust them. Since no distribution over $x$ is
represented, the rule cannot measure how typical an input is or handle a
missing attribute other than by ad hoc defaults.

--

## The Joint Distribution $p(x\_1, \ldots, x\_p, y)$

A **probabilistic** classifier starts from the joint distribution of data and
hypothesis. Every question is read off it:


<div class="grid-2">


<div class="column middle">

<div class="viz" data-viz="ml/joint-class-attribute" data-steps="3"
 data-params='{"prior": 0.2, "observed": 3}'></div>

</div>


<div class="column middle small">

| question | read off the joint |
|---|---|
| Is this transaction fraud? | $P(y \mid x) = p(x, y) \\,/\\, p(x)$ |
| How does fraud look? | $p(x \mid y) = p(x, y) \\,/\\, P(y)$ |
| How common is fraud? | $P(y) = \sum\_x p(x, y)$ |
| How unusual is this transaction? | $p(x) = \sum\_y p(x, y)$ |
| The distance is missing — now? | sum $x\_\text{dist}$ out, then condition |

</div>


</div>



<div class="c-insight">

The joint is the course's ideal: model everything, then condition.

</div>


Notes:
All quantities are obtained by the two operations of
<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>: conditioning (divide
by a margin) and marginalisation (sum, or integrate, over the variables that
are not asked about). For continuous attributes the sums over $x$ are
integrals and the probabilities densities.

The heatmap is the joint $p(y, x)$ of the class and one attribute (the amount,
five bins), with a fraud share of 20% so that the fraud row is visible. Steps:
the cells of the joint; the margins (prior $P(y)$ as row sums, evidence $p(x)$
as column sums); the fraud row against its total, the likelihood
$p(x \mid \text{fraud})$; one column against its total, the posterior
$P(y \mid x)$. For 200–1k €: $p(\text{fraud}, x) = 0.2 \cdot 0.30 = 0.06$ and
$p(\text{honest}, x) = 0.8 \cdot 0.10 = 0.08$, so
$P(\text{fraud} \mid x) = 0.06/0.14 \approx 0.43$.

The joint therefore contains strictly more than the decision needs. The two
probabilistic classifiers differ in how much of it they model: the
discriminative classifier only the column shares, $P(y \mid x)$, as a function
of $x$; the generative classifier the whole picture, factorised as
$p(x \mid y)\\, P(y)$.

--

## Discriminative Classifier


<div class="grid-2-3">


<div class="column">


<div class="c-definition">

A **discriminative classifier** models only $P(y \mid x; θ)$ — nothing about
which $x$ occur.

</div>



<div class="card small">

**Example:** logistic regression, 3 numbers:

$$
\begin{aligned}
z &= θ\_0 + θ\_\text{amt} \log x\_\text{amt} + θ\_\text{dist} \log x\_\text{dist}
\\\ P(\text{fraud} \mid x; θ) &= σ(z) = 1 / (1 + e^{-z})
\end{aligned}
$$

**Training:** the most probable labels,
$$
\hat θ = \arg\max\_θ\\, \textstyle\sum\_{i=1}^{n} \log P(y\_i \mid x\_i; θ)
$$

$x\_i$ stands only right of the bar: given, never modelled.

</div>


</div>


<div class="column middle">

<div class="viz" data-viz="ml/learning-system" data-steps="0"
     data-params='{"mode": "approaches", "reading": 2}'></div>

</div>


</div>


Notes:
A discriminative classifier is a family $P(y \mid x; θ)$ of distributions over
the classes, one for every input. It is not a table of the joint read by
columns: it is a function of $x$ with a fixed, small number of parameters,
which assigns a probability to inputs it has never seen. Logistic regression
uses a linear score $z$ of the attributes passed through the logistic function
$σ$, which maps any number to $(0, 1)$; $z$ itself is the log-odds,
$z = \log \frac{P(\text{fraud} \mid x)}{P(\text{honest} \mid x)}$. A neural
network with a softmax output layer uses a learned score. The
attributes enter on the log scale, as in the figures.

The learning system of the introductory lecture with a discriminative model in
the model box: the prediction is a distribution over the classes, from which a
class is chosen; the loss is the negative log-probability of the observed
label, $-\log P(y\_i \mid x\_i; θ)$, the cross-entropy, and training maximises
$\sum\_i \log P(y\_i \mid x\_i; θ)$, the probability of the training labels given
the training attributes (maximum likelihood, made precise in
<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>). The features enter only as the
condition: the model is evaluated at the observed $x$ and makes no statement
about which $x$ occur, so $p(x)$, $p(x \mid y)$ and the prior cannot be
recovered and Bayes' theorem cannot be applied to it. A change of base rate
must be corrected from outside
(<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>).

## $P(y \mid x)$ From Data

<div class="viz viz-lg" data-viz="ml/generative-2d" data-steps="1"
 data-params='{"view": "discriminative"}'></div>


<div class="q">

Compare with the rule: what is new for A and B — and what is still missing for
C?

</div>


Notes:
The 98 transactions of the rule, now with a logistic regression fitted to them
by maximum likelihood (Newton's method):
$\hat θ = (-11.5,\ 2.2,\ 3.7)$ on $\log\_{10}$ amount and $\log\_{10}$ distance.
The colour is $P(\text{fraud} \mid x; \hat θ)$ for every $x$, the violet line
the 0.5 boundary — a straight line, because the score is linear in the
attributes. Three numbers replace the box's two thresholds.

The weights are not probabilities. They act on the score
$z = -11.5 + 2.2 \log\_{10} x\_\text{amt} + 3.7 \log\_{10} x\_\text{dist}$, the
log-odds of fraud, which can be any number; the curve on the right, $σ(z)$,
turns it into a probability. Read on the odds, a weight is a factor: ten
times the amount adds 2.2 to $z$ and multiplies the odds of fraud by
$e^{2.2} \approx 9$, ten times the distance by $e^{3.7} \approx 40$. How much
that changes the probability depends on where on the curve a transaction
sits: near $z = 0$ (A) a step moves the probability a lot, far out (B) hardly
at all. A weight's size also depends on the scale of its attribute, so it
measures importance only for attributes on comparable scales.

A gets 39%, B 99.5%: the model is graded where the rule was flat (94% for
both). C, at 3.5k € and 1.6 km, gets 6% fraud — a confident "honest" for an
input unlike any training row, without any warning, because the model has no
$p(x)$ to tell it so. The fit has 7 training errors against the rule's 5:
logistic regression maximises the probability of the labels, not the number of
correct decisions, and its boundary is a straight line where the rule's is a
corner.

## Generative Classifier


<div class="grid-2-3">


<div class="column">


<div class="c-definition">

A **generative classifier** models how the data arise — $p(x \mid y; θ)$
and $P(y; θ)$ — and obtains $P(y \mid x)$ by Bayes' theorem.

</div>



<div class="card small">

**Example:** a normal per class and the fraud share, 11 numbers:

$$
\begin{aligned}
p(x \mid y; θ) &= \mathcal{N}\big((\log x\_\text{amt}, \log x\_\text{dist});\ μ\_y, Σ\_y\big)
\\\ P(\text{fraud}; θ) &= π
\end{aligned}
$$

**Training:** the most probable rows,
$$
\hat θ = \arg\max\_θ\\, \textstyle\sum\_{i=1}^{n} \big[\log p(x\_i \mid y\_i; θ) + \log P(y\_i; θ)\big]
$$

$x\_i$ is scored too: modelled, not only given.

</div>


</div>


<div class="column middle">

<div class="viz" data-viz="ml/learning-system" data-steps="1"
     data-params='{"mode": "approaches", "reading": 3}'></div>

</div>


</div>


Notes:
The learning system with a generative model in the model box: the model is
the joint $p(x, y; θ)$; the prediction $P(y \mid x)$ follows by Bayes' theorem;
the loss under maximum likelihood is
$-\log p(x, y; θ) = -\log p(x \mid y; θ) - \log P(y; θ)$, which scores the
features as well as the label, so the features box is part of what is fitted.
The second step runs the model without input: from the parameters to a sampled
data point.

In the example $μ\_y$ is the mean of the class in (log amount, log distance) and
$Σ\_y$ its covariance matrix — two spreads and a correlation, introduced
properly in the module on continuous attributes. The maximisation has a closed
form: per class the mean vector, spreads and correlation of its rows, and
$\hat π$ the share of fraud rows, 35 of 98. Parameter count: $2 \cdot (2 + 2 + 1) + 1 = 11$, against 3 for
logistic regression and 2 for the rule — the price of modelling $x$.

--

## $p(x \mid y)$ From Data

<div class="viz viz-lg" data-viz="ml/generative-2d" data-steps="3"
 data-params='{"view": "generative", "prior": 0.36}'></div>


<div class="q">

Set $P(\text{fraud})$ to 0.1%. What happens to the boundary — and why can the
rule not do this?

</div>


Notes:
Each class has its own distribution over both attributes, a two-dimensional
normal in (log amount, log distance) fitted to the class's rows of the same
98 transactions: two means, two spreads and a correlation per class. The prior
starts at the training share, 36%. Bayes' theorem combines them for every
point, $P(\text{fraud} \mid x) = p(x \mid \text{fraud})P(\text{fraud}) \\,/\\,
\sum\_{y'} p(x \mid y') P(y')$, which the large panel shows; the violet line is
where the posterior is 0.5.

Step 3 adds the rule (dashed), greys out the region where $p(x)$ is tiny and
marks A, B and C: 57%, 99.8% and 0.0% — and C lies in the grey region. There
the posterior is still defined, but $p(x)$ says that no training data supports
it; this is the warning neither the rule nor logistic regression can give.

Lowering the prior shrinks the fraud region: the likelihoods are unchanged, only
the factor $P(\text{fraud})$ moves, so the model can be carried to a setting
with a different base rate without refitting. At 1 in 1,000 the boundary
retreats to where the likelihood ratio exceeds 999. The sliders move the fraud
mean and the correlation within the fraud class; the button draws transactions
from the model.

## Generating Data

**Generating** is sampling from the model: draw $y \sim P(y)$, then
$x \sim p(x \mid y)$ — here $y$ = spam, $x$ = the words of a mail.

<div class="viz viz-xl" data-viz="ml/generate-text" data-steps="8"></div>


<div class="q">

Which mail reads like a real one — and what does naive Bayes leave out?

</div>


Notes:
Sampling follows the factorisation $p(x, y) = p(x \mid y)P(y)$ from left to
right: first the class, then the attributes given the class; the figure fixes
the class to spam, and the attributes are the words of the mail. Both models
share one vocabulary of 13 words, listed once in the middle of the chart:
naive Bayes' probabilities to the left, the language model's to the right, on
the same scale. Each step draws one word in both mails (top) and shows the
distribution over the vocabulary it was drawn from (bottom). Naive Bayes draws every word from the same
$p(\text{word} \mid \text{spam})$: each word is typical of spam, the sequence
is not a sentence — the dependences between words are exactly what the naive
assumption (next module) drops. The language model draws each word from
$p(x\_t \mid x\_1, \ldots, x\_{t-1})$, the chain rule of probability, so the
candidates change with the context: after "won" only "a" is possible, after
"a" only "free" or "prize". Its bars are peaked where naive Bayes' bars are
flat. Both models are toys with hand-set
probabilities, and the toy language model conditions only on the previous
word; a real one conditions on the whole context with one shared neural
network and is fitted by maximum likelihood (cross-entropy on the next token).
"Sample again" draws two new mails.

Drawing a missing attribute from $p(x\_j \mid x\_{-j}, y)$, the conditional given
the observed attributes, fills in part of a data point. Neither a rule nor a
model of $P(y \mid x)$ can generate: generating needs a model of $x$. Whether a
model can generate is a property of *what* it models, not of *how* its
parameters are fitted. Each factor of a language model, taken alone, is a
classifier over the vocabulary; the product of all factors is the generative
model.

| | rule | discriminative | generative |
|---|---|---|---|
| models | $x \mapsto$ class | $P(y \mid x; θ)$ | $p(x \mid y; θ)\\, P(y; θ)$ |
| fitted here | 2 thresholds | 3 weights | 11 numbers |
| A, just inside the box | fraud, 94% | 39% | 57% |
| B, deep inside | fraud, 94% | 99.5% | 99.8% |
| C, unlike any row | honest, <span class="no">no warning</span> | 6%, <span class="no">no warning</span> | 0.0%, <span class="yes">p(x) tiny</span> |
| new base rate | <span class="no">✗</span> refit | correct from outside | <span class="yes">✓</span> swap $P(y)$ |
| missing field | <span class="no">✗</span> ad hoc | <span class="no">✗</span> ad hoc | <span class="yes">✓</span> sum it out |
| generate data | <span class="no">✗</span> | <span class="no">✗</span> | <span class="yes">✓</span> |
| examples | decision tree | logistic regression | naive Bayes, language model |


<div class="c-warning">

The price of the right column: a distribution over **all** attributes, per
class.

</div>


Notes:
All three were fitted to the same 98 transactions. The rule gives A and B the
same box share; logistic regression and the generative model grade them. For
C, unlike any training row, the rule and logistic regression answer without
any indication that the answer is unsupported; the generative model's answer
is just as confident (0.0% fraud) but comes with $p(x)$, which says that no
data lie there.

New base rate: the posterior odds are the prior odds times the likelihood
ratio, so a generative model only replaces $P(y)$, provided the class-conditional
distributions are the same in both settings. A discriminative model absorbs
the training base rate into its parameters; it can be corrected by
multiplying its odds by the ratio of new to old prior odds, which requires
knowing the training base rate. A rule has to be re-learned.

Missing attributes: $p(x\_{\text{obs}} \mid y) = \sum\_{x\_{\text{mis}}} p(x\_{\text{obs}}, x\_{\text{mis}} \mid y)$.
Without a model of $x$ the alternatives are imputation or a separate model per
pattern of missing fields.

The comparison of accuracy, which favours the discriminative classifier with
much data and the generative one with little, follows in
<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>.

# The Curse of Dimensionality


<div class="guiding-question">

**Guiding Question:** A generative classifier needs $p(x \mid y)$ over all
attributes at once. How many numbers is that — and how can a model get by
with fewer?

</div>


--

## Bayes' Theorem With Two Red Flags

Two flags at once: $D$ = new device, $F$ = foreign IP.

$$
\eqa{P(\text{fraud} \mid D \cap F)} = \frac{\eqb{P(D \cap F \mid \text{fraud})} \cdot \eqc{P(\text{fraud})}}{\eqd{\sum\_{y} P(D \cap F \mid y)\\, P(y)}}
$$

Nothing in the theorem changes. New is the evidence: a **conjunction**
$D \cap F$, whose likelihood is needed for every class $y$.


<div class="q">

Among 100 frauds, 60 show $D$ and 70 show $F$. How many show **both**?

</div>


Notes:
This is Bayes' theorem for multiple events of
<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a> with the classes as the
partition and the evidence $B = D \cap F$. Nothing in the theorem changes; the
difficulty is entirely in the likelihood of the conjunction, which is needed
for every class: the denominator sums $P(D \cap F \mid y)\\, P(y)$ over fraud
and honest. (A conjunction on the other side, $P(E\_i \cap E\_k \mid B)$ for two
classes, is zero: classes are disjoint. Several events enter a classifier as
several pieces of evidence.)

--

## The Joint of Two Flags

<div class="viz viz-xl" data-viz="ml/two-flags" data-steps="4"
 data-params='{"view": "overlap"}'></div>


<div class="fragment c-insight">

**Not fixed by the parts:** 30 to 60 all fit both rates, so
$P(D \cap F \mid y)$ is a number of its own. The product
$0.60 \cdot 0.70 = 0.42$ assumes $D$ and $F$ **independent given the class** —
naive Bayes.

</div>


Notes:
The bounds, read off the bars: $F$ needs 70 of the 100 frauds and only 40
lack $D$, so at least 30 frauds show both; and no more than the 60 frauds with
$D$ can. In general, for probabilities $a$ and $b$ the intersection lies in
$[\max(0, a + b - 1), \min(a, b)]$ (Fréchet bounds), here $[0.30, 0.60]$.
Every value in between is a different joint with the same two margins; the
two rates fix two numbers, the joint of two flags has three.

The positions of $F$ mean different dependences. At 42 the share of $F$ is the
same with and without $D$ (70% each): independence given the class, the only
case in which the product is right. In the running example 55 frauds show
both: 92% of the frauds with a new device come from a foreign IP, but only
38% of the others ($15/40$). An account take-over brings both flags at once,
so they are positively dependent among frauds. Among honest transactions the
figures are 0.10, 0.05 and 0.04 for both instead of the product 0.005; both
values return in <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>.

--

## One Number per Flag Pattern


<div class="q">

A third flag, *night*: how many groups now — and how many frauds in each?

</div>


<div class="viz viz-xl" data-viz="ml/two-flags" data-steps="5"
 data-params='{"view": "patterns"}'></div>


<div class="fragment c-insight">

Every flag **doubles** the patterns — $p$ flags, $2^p$ patterns, $2^p - 1$
numbers per class — and **halves** the frauds behind each: at 7 flags, 73 of
128 patterns are **empty**.

</div>


Notes:
The rows nest: each bar of a row splits into the two bars below it, flag
present on the left, absent on the right. Row 2 is the four groups of the
previous slide (55, 5, 15, 25). The probabilities of all patterns of a class
sum to 1, so one of them is determined by the others: $2^p$ patterns give
$2^p - 1$ free numbers per class, and the two classes need them separately.

Exactly, with the chain rule,
$P(E\_1 \cap \ldots \cap E\_p \mid y) = P(E\_1 \mid y)\\, P(E\_2 \mid E\_1, y)
\cdots P(E\_p \mid E\_1, \ldots, E\_{p-1}, y)$: each later factor conditions on
more flags, so it is estimated only from the rows that match all of them —
one row of the figure further down. Dropping the conditioning flags in every
factor gives $\prod\_j P(E\_j \mid y)$, which is exact iff the flags are
conditionally independent given the class (naive Bayes).

The flags after $D$ and $F$ are illustrative (drawn with a fixed seed, with
night, a new payee and a VPN more frequent in an account take-over). In this
sample the first patterns become empty at 4 flags (2 of 16), then 7 of 32,
24 of 64 and 73 of 128. An empty pattern has count 0, so its estimate is 0
— the problem the next slides scale up to 30 flags. On average the frauds per
pattern halve with every flag ($100 / 2^p$); the honest class has a thousand
times more rows and therefore, on average, about ten more flags ($2^{10}
\approx 1{,}000$) before the same happens.

--

## The Training Table Is a Sample

| amount (€) | country | hour | new device? | … 30 flags | fraud? |
|---|---|---|---|---|---|
| 49.90 | DE | 14 | no | … | no |
| 1,250.00 | BR | 3 | yes | … | **yes** |
| 12.50 | DE | 19 | no | … | no |

Each column is a **random variable** $X\_j$, each row one **draw** from
$p(x, y)$. The fraud rows are draws from $p(x \mid \text{fraud})$.


<div class="q">

Estimate $p(x \mid \text{fraud})$ by counting: of 100 frauds, how many look
**exactly** like the next transaction?

</div>



<div class="fragment c-warning">

Almost always **none**. Counting needs examples of every combination of values.

</div>


Notes:
This is the reading of a table set up in
<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>: a column is a random
variable, a row is one realisation of the vector $(X\_1, \ldots, X\_d, Y)$, and
the table is $n$ draws from a joint distribution nobody has written down.
Restricting to the rows with $y = \text{fraud}$ is conditioning on the class,
so those rows are a sample from $p(x \mid \text{fraud})$.

Estimating a distribution without any assumption about its form means
counting: the estimate of $p(x \mid \text{fraud})$ for a particular vector $x$
is the share of fraud rows equal to $x$ in every attribute. A continuous
attribute such as the amount makes exact repeats practically impossible; even
after binning it, the number of value combinations grows multiplicatively with
every column, as the next two slides count.

--

<div class="c-insight">

Almost every cell of the table is **empty**. Its count is 0, so its maximum
likelihood estimate is 0 — every fraud that looks slightly new becomes
"impossible".

</div>


Notes:
A joint distribution over 30 binary variables has $2^{30} = 1{,}073{,}741{,}824$
cells; since they sum to 1, $2^{30} - 1 = 1{,}073{,}741{,}823$ are free
parameters, per class. With 100 fraud cases at most 100 cells have a non-zero
count, so at least 99.99999% of the cells have MLE exactly 0, and any fraud
pattern not seen in training receives $p(x \mid \text{fraud}) = 0$ and
therefore $P(\text{fraud} \mid x) = 0$ (or an undefined $0/0$ if the pattern
was not seen among honest transactions either).

A share computed from a tiny count is an extreme value, here multiplied across
a billion cells; naive Bayes meets the same zero in a single cell, and
<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a> names the estimate behind it. More data does not solve it: filling the table reliably would need far
more frauds than cells. The general pattern, and the two ways to reduce the
number of parameters, follow on the next two slides.

--

## The Curse of Dimensionality

| attributes | value combinations (10 values each) | frauds per combination (100 frauds) |
|---|---|---|
| 1 | 10 | 10 |
| 2 | 100 | 1 |
| 3 | 1,000 | 0.1 |
| 30 | $10^{30}$ | $10^{-28}$ |


<div class="c-insight">

Every attribute **multiplies** the cells and **divides** the data per cell.
Counting needs data in every cell — a full joint over many attributes can
never be estimated by counting.

</div>


Notes:
With $p$ attributes of $m$ values each, the joint has $m^p$ cells, and $n$
observations put on average $n / m^p$ observations into each. Already at three
attributes with ten values the average cell holds 0.1 frauds, so most cells
are empty and their counts estimate 0. The name "curse of dimensionality"
(Bellman) covers this exponential growth of the space with the number of
dimensions; it affects every method that relies on having nearby examples, not
only counting. Continuous attributes make it worse: without binning every
value is its own cell.

The required amount of data grows exponentially in $p$, while real datasets
grow by collecting more rows, not by an exponential factor per added
attribute. Adding attributes therefore makes an unrestricted estimate worse,
not better, unless the model is restricted.

--

## Two Ways Out


<div class="grid-2">


<div class="card">

### ① Simplify the structure

**Assumption on the data:** attributes **independent given the class** — one
small table each, not one huge joint.

30 flags: **30** numbers per class, not $2^{30} - 1$.

<span class="eyebrow">naive Bayes — today; graphs — <a href="/courses/probabilistic-machine-learning/lecture/l05-bayesian-networks/">Lecture 05</a></span>

</div>


<div class="card">

### ② Use a parametric family

**Assumption on the model:** a **formula with few parameters** instead of a
table of counts.

amount given fraud ~ log-normal$(\mu, \sigma)$: **2** numbers, not 100 bins.

<span class="eyebrow"><a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>; a normal per class — today</span>

</div>


</div>



<div class="c-warning">

Both are **assumptions**. They make the model estimable — and wrong wherever
the world disagrees with them.

</div>


Notes:
The two ways reduce the number of parameters at different places. Structure:
conditional independence factorises $p(x \mid y) = \prod\_j p(x\_j \mid y)$, so
the parameter count grows linearly in the number of attributes instead of
exponentially; a Bayesian network keeps selected dependences and still
factorises. Parametric families: each factor is described by a family with a
fixed small number of parameters (Bernoulli for a flag, categorical for the
country, normal or log-normal for an amount), so a continuous attribute needs
no bins at all.

Naive Bayes uses both: independent attributes given the class, each with a
small family. The resulting estimates are stable from little data, but
correlated attributes are counted twice and a misfitting family distorts the
likelihood ratio. The naive Bayes module takes the first cost up; continuous
attributes (<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>) the second, and
show that a family alone — one Gaussian per class — already turns the
exponential count into a quadratic one.

--

## Assumptions on the Data and on the Model

<div class="viz viz-xl" data-viz="ml/learning-system" data-steps="2"
 data-params='{"mode": "assumptions"}'></div>

Notes:
The figure is the learning system of
<a href="/courses/probabilistic-machine-learning/lecture/l01-introduction/">Lecture 01</a>, in
this lecture's notation: the model box computes $p(x, y; \theta)$. Both ways
out restrict that joint, but they restrict different things. Simpler
structure is a claim about how the data arise: which attributes depend on
each other once the class is known. It holds or fails in the world, and the
data can show it — among frauds 92% of the new-device cases come from a
foreign IP against 38% of the others, so the independence of naive Bayes
fails there. A parametric family is a choice of the model: the shape each
distribution may take (Bernoulli for a flag, a normal for a log amount) and
with it the number of parameters $\theta$. It is wrong when the shape is,
for example one normal for a class with two fraud patterns.

The two choices are independent of each other. Naive Bayes with counted
tables simplifies the structure only; one full Gaussian per class uses a
family only and keeps every dependence; Gaussian naive Bayes does both
(<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>). A graphical model
(<a href="/courses/probabilistic-machine-learning/lecture/l05-bayesian-networks/">Lecture 05</a>) simplifies the structure less
drastically, keeping selected dependences.

## Mini-Exercise

A fraud model uses only **three** yes/no flags.


<div class="q">

How many numbers does the generative model need — both classes and the class
prior together?

</div>



<div class="fragment">

**15.** Each class needs a full table over $2^3 = 8$ flag patterns: 7 free
numbers (they sum to 1). Two classes give 14, and $P(\text{fraud})$ adds one.

</div>


Notes:
Each class needs a full distribution over the $2^3 = 8$ flag patterns, which
has $8 - 1 = 7$ free numbers because the probabilities sum to 1. Two classes give
14; the class prior $P(\text{fraud})$ adds one more ($P(\text{honest}) =
1 - P(\text{fraud})$ is determined). Total: 15. Typical miscounts are 16
(counting both class probabilities) and 17 (counting all 8 cells per class).

General formula for $K$ classes and $p$ binary attributes:
$K(2^p - 1) + (K - 1)$. Under the naive assumption it becomes $Kp + (K - 1)$, for
the example $2 \cdot 3 + 1 = 7$.

--

## Takeaway


<div class="takeaway">

The generative route models **how the data arises** — $p(y)$ and $p(x \mid y)$ —
and converts with Bayes. Counting that joint needs data in every combination
of values, which **explodes** with the number of attributes. The way out is an
assumption: **simpler structure**, **parametric families**, or both.

</div>

# Naive Bayes


<div class="guiding-question">

**Guiding Question:** Its central assumption is almost always false, and it
classifies well anyway. How can both be true?

## Conditional Independence


<div class="c-definition">

**Definition.** $A$ and $B$ are **conditionally independent given $C$**,
written $A \indep B \mid C$, iff
$$
P(A \cap B \mid C) = P(A \mid C) \cdot P(B \mid C)
\quad\Longleftrightarrow\quad
P(A \mid B \cap C) = P(A \mid C)
$$

</div>


Reading: **once $C$ is known, $B$ tells us nothing more about $A$.**


<div class="q">

Among frauds only: does a new device make a foreign IP more likely?

</div>


Notes:
The two forms are equivalent whenever $P(B \cap C) > 0$: dividing
$P(A \cap B \mid C) = P(A \mid C) P(B \mid C)$ by $P(B \mid C)$ gives
$P(A \mid B \cap C) = P(A \mid C)$. The relation is symmetric in $A$ and $B$.
For random variables it must hold for every combination of values, and the
condition is evaluated separately within each value of $C$.

Conditional and marginal independence are different properties; neither
implies the other. Two flags can be dependent overall because both are more
frequent among frauds, yet independent within each class; conversely,
conditioning can create a dependence between independent causes
(<a href="/courses/probabilistic-machine-learning/lecture/l05-bayesian-networks/">Lecture 05</a> treats both cases with a counted
example).

Answer to the question: in an account take-over the attacker typically uses
both a new device and a foreign IP, so among frauds the two flags are positively
dependent. With the figures used later in this module, $P(F \mid D, \text{fraud})
= 0.55 / 0.60 \approx 0.92$, compared with $P(F \mid \text{fraud}) = 0.70$.
This is the dependence that naive Bayes assumes away.

--

<div class="column">

![Naive Bayes as a graph: the class points to every attribute, no arrows between attributes](/courses/probabilistic-machine-learning/figures/l03-naive-bayes-star.svg)

</div>


<div class="column">


<div class="c-important">

Assume the attributes are **independent given the class**:
$$
p(x\_1, \ldots, x\_p \mid y) = \prod\_{j=1}^{p} p(x\_j \mid y)
$$

</div>


| flags | full joint, per class | naive |
|---|---|---|
| 3 | 7 | 3 |
| 30 | 1,073,741,823 | 30 |

</div>


</div>



<div class="c-warning">

**Shortcut 1 — assume it apart.** Dropped: every dependence *within* a class.

</div>


Notes:
In the graph the class $y$ points to every attribute and no arrow joins two
attributes. Read as a Bayesian network
(<a href="/courses/probabilistic-machine-learning/lecture/l05-bayesian-networks/">Lecture 05</a>), each missing arrow is an
independence claim: every attribute is independent of all others given the
class. The attributes are still dependent marginally, through the class.

Parameter count: with the assumption, $p(x \mid y)$ needs one Bernoulli
parameter per binary flag and class, $p$ numbers instead of $2^p - 1$. For a
categorical attribute with $k\_j$ values the count is $k\_j - 1$ per class. The
three-flag example drops from 15 numbers to $2 \cdot 3 + 1 = 7$; for 30 flags
from about $2.1 \cdot 10^9$ to 61.

The model is still generative, since it specifies $p(y)$ and $p(x \mid y)$ and
can generate transactions. What it drops is every dependence between attributes
within a class (shortcut 1 of the course roadmap). The assumption is almost
never exactly true; whether it matters depends on the task, as the last slides
of the module show.

<div class="viz viz-lg" data-viz="ml/joint-two-attributes" data-steps="3"
 data-params='{"rho": 0.7}'></div>


<div class="grid-2">


<div class="column">

**Predict:** set the correlation to 0. What happens to the two pictures?

</div>


<div class="column">


<div class="fragment">

They become **identical**. Naive Bayes is exact exactly when the attributes are
independent **within** each class.

</div>

Notes:
The full object is a cube, class × $x\_1$ × $x\_2$; the figure shows its two
class slices. Left: the true class-conditional joint $p(x\_1, x\_2 \mid y)$ on a
$5 \times 5$ grid, $5^2 - 1 = 24$ numbers per class, and $5^p - 1$ for $p$
attributes. Its two margins, $p(x\_1 \mid y)$ and $p(x\_2 \mid y)$, need
$2 \cdot 4 = 8$. Right: the product of the margins, which is what naive Bayes
stores. A product of margins is always axis-aligned — the same picture as the

Two dependences must be kept apart. Within a class, a tilted blob means $x\_1$
and $x\_2$ are correlated given $y$; this is what naive Bayes drops. Across
classes, the two blobs sit in different corners, so over all transactions
$x\_1$ and $x\_2$ are dependent even when $\rho = 0$ — through the class, which
naive Bayes keeps. Conditional independence given $y$ does not imply
independence overall.

What naive Bayes stores are the margins $p(x\_j \mid y)$: one-dimensional
distributions, one per attribute and class. How each is estimated is the next
question.

## A Distribution per Attribute and Class


<div class="q">

Naive Bayes needs $p(x\_j \mid \text{fraud})$ and $p(x\_j \mid \text{honest})$
for each attribute **on its own**. How would you estimate them for these four?

</div>



<div class="fragment">

| attribute $x\_j$ | values | model for $p(x\_j \mid y)$ | fitted from the class's rows by | numbers per class |
|---|---|---|---|---|
| new device | yes / no | Bernoulli$(\theta\_y)$ | the share of *yes* | 1 |
| country | $k$ countries | categorical | the share of each country | $k - 1$ |
| logins, last hour | 0, 1, 2, … | a **table** of the values — or **Poisson**$(\lambda\_y)$ | the share of each value — or the **mean** count | one per value — or 1 |
| amount | positive, skewed | **normal** on the log amount | mean and spread of $\log x$ | 2 |

</div>



<div class="fragment c-insight">

Naive Bayes fixes the **structure** (way out ①). Each factor still needs a
model: a **table**, fitted by counting, or a **family** with few parameters
(way out ②). Both are fitted per class, in one pass over the rows.

</div>


Notes:
The naive assumption leaves $p$ one-dimensional distributions per class, and
for each the scale of the attribute suggests a model, as in "The Scale Suggests
the Model" of <a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>. For a nominal
attribute the table is the family: a Bernoulli for a flag, a categorical for a
country, both fitted by relative frequencies. Naive Bayes over flags and
categories is therefore fitted by counting alone, the case taken up next.

A count attribute can be treated either way. As a table, every observed value
gets its share: many parameters, and a value never seen among frauds (twelve
logins) gets probability 0 — the problem of
"One Zero Vetoes Everything" below. As a Poisson, one rate per class
describes all values, and its maximum likelihood estimate is the mean count of
the class; twelve logins keep a small positive probability. The price is the
shape: a Poisson has variance equal to its mean, which real counts often
exceed.

A continuous attribute has no table at all without bins. A normal per class
on the log amount gives Gaussian naive Bayes, the subject of
<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>. The factors may be mixed
freely, Bernoulli for some attributes, Poisson or normal for others, because
under the naive assumption each factor is estimated on its own. Text
classifiers use the same idea with word counts (multinomial naive Bayes).
All of these maximum likelihood estimates are closed-form summaries of the
class's rows — shares, means, spreads — so no optimiser is needed.

--

## Fitting Is Counting

$$
\hat{P}(y) = \frac{n(y)}{n}
\qquad
\hat{P}(x\_j = v \mid y) = \frac{n(x\_j = v,\ y)}{n(y)}
$$


<div class="grid-2">


<div class="card">

### One small table per attribute
For flags and categories, each factor is a **table**: a categorical — for a
yes/no flag, a Bernoulli.

</div>


<div class="card">

### Estimated by its share
$P(\text{new device} \mid \text{fraud})$: of the 100 frauds, how many came
from a new device? 60, so $0.6$.

</div>


</div>



<div class="c-insight">

Naive Bayes over tables is fitted in **one pass**, by counting — no optimiser.
Why a share is the right estimate — and when it is not — is <a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>.

</div>


Notes:
Derivation. Under the naive assumption the log-likelihood of a labelled table
is
$\sum\_i \log P(y\_i) + \sum\_i \sum\_j \log p(x\_{ij} \mid y\_i)$.
Grouping terms by attribute $j$ and class $y$ gives one term
$\sum\_v n(x\_j = v, y) \log \theta\_{jvy}$ per attribute and class, plus one term
for the class prior. No parameter appears in two terms, so each is maximised
separately, and each is the log-likelihood of a categorical distribution whose
maximum likelihood estimate is the relative frequency (derived for two values
as $h/n$ in <a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>; for $k$ values with a
Lagrange multiplier). The categorical distribution was introduced in
<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a> as the distribution for a
nominal attribute.

The independence assumption is what makes the MLE a closed-form count: with a
full joint the parameters are per combination of values, and the counts would
be of entire rows. Logistic regression, by contrast, has no closed-form MLE and
is fitted iteratively. Every estimated number in naive Bayes is a peak of a
likelihood, so shortcut 2, keep the peak, is taken in addition to shortcut 1;
<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a> makes this precise.

--

## The Classifier

$$
P(y \mid x\_1, \ldots, x\_p) = \frac{P(y) \prod\_{j} p(x\_j \mid y)}{\sum\_{y'} P(y') \prod\_{j} p(x\_j \mid y')}
$$

For two classes, divide the two posteriors — the normaliser cancels:

$$
\underbrace{\frac{P(\text{fraud} \mid x)}{P(\text{honest} \mid x)}}\_{\text{posterior odds}}
= \underbrace{\frac{P(\text{fraud})}{P(\text{honest})}}\_{\text{prior odds}}
\cdot \prod\_{j=1}^{p} \underbrace{\frac{p(x\_j \mid \text{fraud})}{p(x\_j \mid \text{honest})}}\_{\text{likelihood ratio } \mathrm{LR}\_j}
$$


<div class="c-note">

Every observed attribute **multiplies the odds** by its likelihood ratio: above
1 it speaks for fraud, below 1 against.

</div>


Notes:
The first line is Bayes' theorem with the naive product in place of
$p(x \mid y)$; the denominator is the law of total probability. In the ratio of
two posteriors the denominator cancels, which gives the odds form: posterior
odds = prior odds × product of likelihood ratios. Odds and their relation to
probabilities, $P = \text{odds}/(1 + \text{odds})$, were introduced with Bayes'
theorem in <a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>.

Each attribute contributes one factor $\mathrm{LR}\_j$. A ratio above 1 raises
the odds of fraud, below 1 lowers them, and exactly 1 means the attribute is
uninformative. Because multiplication is commutative, the order in which
evidence arrives does not matter. An observed absent flag also contributes a
factor, $(1 - p\_{j,\text{fraud}})/(1 - p\_{j,\text{honest}})$, which is usually
below 1 for a red flag. For more than two classes, odds relative to one
reference class play the same role.

--

<!-- .slide: class="smaller" -->

## Likelihood Ratios From Counts

The training table: 100,000 transactions, **100** fraud and **99,900** honest.


<div class="q">

A new device shows up in **60** frauds — and in **9,990** honest transactions.
How strong is it as evidence for fraud?

</div>



<div class="fragment">

| flag | frauds with it | $P(\text{flag} \mid \text{fraud})$ | honest with it | $P(\text{flag} \mid \text{honest})$ | likelihood ratio |
|---|---|---|---|---|---|
| new device | 60 of 100 | 0.60 | 9,990 of 99,900 | 0.10 | 0.60 / 0.10 = **6** |
| foreign IP | 70 of 100 | 0.70 | 4,995 of 99,900 | 0.05 | 0.70 / 0.05 = **14** |
| night | 50 of 100 | 0.50 | 19,980 of 99,900 | 0.20 | 0.50 / 0.20 = **2.5** |

</div>



<div class="fragment c-insight">

Strength is a ratio of **shares**, not of counts: a new device is **6 times as
common** among frauds — although 9,990 of its 10,050 transactions are honest.

</div>


Notes:
Each share is the fitted factor of "Fitting Is Counting":
$\hat P(x\_j = \text{yes} \mid y) = n(x\_j = \text{yes}, y) / n(y)$, counted
within the class. The likelihood ratio divides the two shares of one flag,
$\mathrm{LR}\_j = P(x\_j \mid \text{fraud}) / P(x\_j \mid \text{honest})$, and
says how many times more common the observation is among frauds than among
honest transactions. Arithmetic: $60/100 = 0.60$ and $9{,}990/99{,}900 = 0.10$,
so $\mathrm{LR} = 6$; $0.70/0.05 = 14$; $0.50/0.20 = 2.5$.

The ratio measures the evidence, not the answer. Of the $60 + 9{,}990 =
10{,}050$ transactions with a new device only 60 are fraud, so
$P(\text{fraud} \mid \text{new device}) = 60/10{,}050 \approx 0.6\\%$: the
evidence multiplies the odds by 6, from $1 : 999$ to $6 : 999$, and the rare
class stays rare. A flag observed absent has its own ratio, for the new device
$(1 - 0.60)/(1 - 0.10) \approx 0.44$, which speaks against fraud.

--

## Three Red Flags

Prior odds $100 : 99{,}900 = 1 : 999$. Likelihood ratios: new device **6**,
foreign IP **14**, night **2.5**.


<div class="q">

A transaction shows all three flags. Is it more likely fraud than not?

</div>



<div class="fragment">

$$
\text{odds} = \frac{1}{999} \cdot 6 \cdot 14 \cdot 2.5 = \frac{210}{999}
\quad\Longrightarrow\quad
P(\text{fraud} \mid x) = \frac{210}{1{,}209} \approx 17\\%
$$


<div class="c-warning">

Three red flags, each one strong — and still **mostly honest**. The base rate
of <a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>, once more.

</div>


</div>


Notes:
The odds form of the classifier: prior odds times one likelihood ratio per
observed flag. The product of the ratios is 210, and the posterior odds are
$210 : 999$, so $P(\text{fraud} \mid x) = 210/(210 + 999) = 0.174$.

The answer is no: the transaction is still more likely honest. A combined
likelihood ratio of 210 is strong evidence, but the prior odds of 1 : 999 are
stronger; the posterior exceeds 50% only when the combined ratio exceeds 999.
This is the base-rate effect of
<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>. Intuitive judgements
that call such a transaction "clearly fraud" neglect the base rate.

The model in this example contains exactly these three flags, all observed
present, so only the three ratios enter. In a model with more flags, every flag
observed absent contributes its own factor; for night that factor would be
$(1 - 0.5)/(1 - 0.2) = 0.625$.

--

<!-- .slide: class="smaller" -->

## Evidence Adds Up

Take the logarithm of the odds form: the **product** of ratios becomes a **sum**.

$$
\log \frac{P(\text{fraud} \mid x)}{P(\text{honest} \mid x)}
= \log \frac{P(\text{fraud})}{P(\text{honest})} + \sum\_{j} \log \mathrm{LR}\_j
$$


<div class="grid-3-2">


<div class="column">

<div class="viz viz-lg" data-viz="ml/gm-log-odds-staircase" data-steps="3"
 data-params='{"prior": [1, 999], "factors": [{"lr": 6, "label": "new device"}, {"lr": 14, "label": "foreign IP"}, {"lr": 2.5, "label": "night"}]}'></div>

</div>


<div class="column middle">

**Predict before each click:** which flag moves the probability most?


<div class="fragment">

| evidence | odds | log-odds | $P$ |
|---|---|---|---|
| base rate | $1 : 999$ | $-6.91$ | 0.1% |
| new device | $\times 6$ | $+1.79$ | 0.6% |
| foreign IP | $\times 14$ | $+2.64$ | 7.8% |
| night | $\times 2.5$ | $+0.92$ | 17.4% |
| **sum** | $210 : 999$ | $\mathbf{-1.56}$ | **17.4%** |

</div>


</div>


</div>


Notes:
The table is the equation term by term, in natural logarithms: the rounded
terms add to $-6.91 + 1.79 + 2.64 + 0.92 = -1.56$, and
$P = 1/(1 + e^{1.56}) = 0.174$. The base of the logarithm only rescales the
axis; the figure labels it in probabilities.

On a log-odds axis each likelihood ratio is a step of fixed height $\log
\mathrm{LR}\_j$, independent of the current position: the log-odds are the sum
of the log prior odds and the log likelihood ratios.

Step 1 (new device): odds $6/999$, probability 0.6%. Step 2 (foreign IP): odds
$84/999$, probability 7.8%. Step 3 (night): odds $210/999$, probability 17.4%.
The foreign IP has the largest ratio and therefore the largest step; night is
the weakest of the three, although it moves the probability more in absolute
terms than the first flag did, because probability is not linear in log-odds.

A sum of per-attribute contributions plus a constant is a linear score. For
binary attributes the naive Bayes log-odds are exactly linear in $x$, the same
functional form as logistic regression
(<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>); the two differ in how
the weights are estimated
(<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>).

--

## One Zero Vetoes Everything

A new flag: **payment to a crypto exchange**. Among the 100 frauds it never
occurred.


<div class="grid-2-1">


<div class="column">

$$
\hat{P}(\text{crypto} \mid \text{fraud}) = \frac{0}{100} = 0
$$

A transaction with this flag gets posterior odds **exactly 0** — whatever the
other thirty flags say. One unseen value vetoes all other evidence.

</div>


<div class="c-danger">

<span class="eyebrow">Counting, fails</span>

"Not seen in 100 frauds" became "impossible for a fraud" — a share of a small
count, read as certainty.

</div>


</div>


Notes:
This is the zero-frequency problem. The MLE of a count of 0 is the probability
0, and a single factor of 0 makes the whole product 0, so the posterior odds of
fraud are 0 regardless of all other likelihood ratios. If a value has count 0 in
both classes, the posterior is the undefined $0/0$.

The cause is that a relative frequency of a small count is an extreme value;
<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a> shows the same failure on a coin
(three heads in three flips give $\hat\theta = 1$) and names the estimate. With 100 frauds, any flag with a true rate below about 1% is likely to
have count 0 (for a true rate of 1% the probability of no occurrence in 100 is
$0.99^{100} = 0.37$). In a log-odds implementation the zero appears as
$\log 0 = -\infty$. Standard repairs add pseudo-counts (next slide) or replace
zeros by a small floor value; the first has a probabilistic justification.

--

## Laplace Smoothing

**Laplace smoothing** pretends each of the $k\_j$ values was seen **once more**:

$$
\hat{P}(x\_j = v \mid y) = \frac{n(x\_j = v,\ y) + 1}{n(y) + k\_j}
$$

For a yes/no flag ($k\_j = 2$) this is $\frac{h + 1}{n + 2}$.

| count among 100 frauds | share | smoothed |
|---|---|---|
| 0 | 0 | $1/102 \approx 0.010$ |
| 60 | 0.60 | $61/102 \approx 0.598$ |


<div class="c-insight">

Where the count is large, nothing changes; where it is 0, the veto is gone.
Why **+1**, and not +5? <a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>: smoothing is a **prior**.

</div>


Notes:
The pseudo-counts are added to every value of the attribute, so the smoothed
estimates still sum to 1 over the $k\_j$ values: $n(y) + k\_j$ in the denominator
balances one extra count per value. On well-populated cells the change is
negligible (0.60 vs 0.598); on empty cells it replaces 0 by $1/102 \approx
0.0098$, so no single factor can force the product to 0.

Add-$\alpha$ smoothing, $(h + \alpha)/(n + 2\alpha)$ for a flag, generalises the
rule to $\alpha$ imagined occurrences per value; larger $\alpha$ pulls every
estimate more strongly towards one half. The choice $\alpha = 1$ is a convention
(Laplace's rule of succession). <a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a> derives it:
$(h + 1)/(n + 2)$ is the posterior mean of the flag probability under a flat
Beta$(1, 1)$ prior (<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>), and
add-$\alpha$ is the posterior mean under Beta$(\alpha, \alpha)$; for $k\_j > 2$
values the flat Dirichlet plays the same role.

--

## Counting Evidence Twice


<div class="grid-2">


<div class="column">

![Naive Bayes with the dropped dependence between new device and foreign IP](/courses/probabilistic-machine-learning/figures/l03-naive-bayes-dropped.svg)

</div>


<div class="column">

In an account take-over, a new device and a foreign IP **arrive together**.
Suppose both appear on 55% of frauds and 4% of honest transactions:

| | ratio for the pair | $P(\text{fraud})$ with night |
|---|---|---|
| naive Bayes | $6 \cdot 14 = 84$ | 17.4% |
| the real pair | $0.55 / 0.04 \approx 14$ | 3.3% |

</div>


</div>



<div class="c-warning">

Correlated flags are **counted twice**, so naive Bayes is **over-confident**.
Its ranking of transactions often survives; its probabilities do not.

</div>


Notes:
The dashed edge in the figure is the dependence between new device and foreign
IP that naive Bayes omits. Naive Bayes multiplies both likelihood ratios as if
they were independent pieces of evidence, $6 \cdot 14 = 84$. The pair's actual
likelihood ratio is $P(D, F \mid \text{fraud}) / P(D, F \mid \text{honest}) =
0.55/0.04 = 13.75$. With night added, the posterior odds are
$13.75 \cdot 2.5 / 999 = 34.4/999$, so $P(\text{fraud} \mid x) = 3.3\\%$ instead
of 17.4%. Under independence within the classes the pair would occur on
$0.6 \cdot 0.7 = 42\\%$ of frauds and $0.1 \cdot 0.05 = 0.5\\%$ of honest
transactions; the assumed 4% among honest ones is eight times that, which is
where the error comes from.

Correlated attributes therefore push naive Bayes posteriors towards 0 and 1:
the probabilities are not calibrated
(<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>). Classification by arg max
depends only on which side of the decision threshold the posterior falls, so it
can remain correct even when the probabilities are badly off. Domingos and
Pazzani (1997, Machine Learning 29) show that naive Bayes can be optimal under
zero–one loss in many cases where the independence assumption is violated,
which is why it classifies well despite a false assumption.

The word salad of <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a> (Generating
Data) is the same assumption seen from the generating side: words drawn
independently given the class are each typical of spam, but the dependences
that make a sentence are gone — the same dependences whose absence counts
correlated evidence twice.

--

## Mini-Exercise

A bug feeds the **foreign-IP** flag into the model twice.


<div class="q">

Does the fraud probability of our three-flag transaction go up, down, or stay
— and what does that say about correlated attributes?

</div>



<div class="fragment">

**Up — from 17% to about 75%.** The odds get a second factor 14:
$2{,}940 : 999$. Naive Bayes cannot tell a copy from new evidence; a strongly
correlated attribute is almost a copy.

</div>


Notes:
Answer: up. The duplicated flag contributes its likelihood ratio twice, so the
odds become $210 \cdot 14 / 999 = 2940/999$ and
$P(\text{fraud} \mid x) = 2940/3939 = 0.746$, from 17%.

The true information content is unchanged, since a copy of an attribute carries
no new evidence: the correct likelihood ratio of the pair (flag, copy) is just
the ratio of the flag, 14. Naive Bayes cannot detect duplication, because the
model has no parameter for the relation between attributes. A duplicate is the
limiting case of perfect correlation; strongly correlated attributes act as
partial copies. Real feature sets contain them routinely: the same information
coded twice, features derived from others, and indicators that are near-functions
of each other. Removing redundant attributes, or a model that captures the
dependence (a Bayesian network, <a href="/courses/probabilistic-machine-learning/lecture/l05-bayesian-networks/">Lecture 05</a>), avoids
the double counting.

--

## Takeaway


<div class="takeaway">

Naive Bayes **assumes the joint apart** — attributes independent given the
class — and fits every factor by **counting**, smoothed by pseudo-counts so no
zero can veto. It is cheap, needs little data and ranks well. Its
probabilities are over-confident wherever attributes move together.

</div>


---
