# Continuous Attributes


<div class="guiding-question">

**Guiding Question:** An amount of 1,250 € has probability zero. How does a
number enter Bayes' theorem — and what does a model of many numbers cost?

</div>


--

## A Density per Class

<div class="viz viz-lg" data-viz="ml/class-densities" data-steps="2"
 data-params='{"view": "fit", "query": 1250}'></div>


<div class="q">

What is the probability that a fraud is **exactly** 1,250.00 €?

</div>


Notes:
The histograms are the amounts of the training table, 100 frauds and 1,000
honest transactions (a sample of the honest ones), each class normalised to a
density so that both are visible. On a logarithmic axis the amounts of each
class are close to normal: the amount itself is log-normal, the second way
out of <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>. Step 1 fits one normal per
class to $\log\_{10}$ amount, with the class's mean and standard deviation as
parameters: honest $\hat μ = 1.55$ (median 35 €), $\hat σ = 0.45$; fraud
$\hat μ = 2.6$ (median 400 €), $\hat σ = 0.40$. Two numbers replace a
histogram's bins.

Answer to the question: zero. The amount is a continuous random variable, and
every single value has probability 0
(<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>); the curve is a
density, probability per unit of $x$. What Bayes' theorem needs is the ratio
of the two densities at the observed value (step 2): at 1,250 € the fraud
curve is about 190 times higher than the honest one.

--

## Bayes' Theorem With Densities


<div class="c-definition">

For a continuous attribute, $p(x \mid y; θ)$ is a **density** — probability per
unit of $x$. Bayes' theorem holds with densities:
$$
P(y \mid x) = \frac{p(x \mid y; θ)\\, P(y)}{\sum\_{y'} p(x \mid y'; θ)\\, P(y')}
$$

</div>



<div class="grid-2">


<div class="column">

**Why it works.** An interval $[x, x + Δ]$ has probability
$≈ p(x \mid y)\\,Δ$ in each class; the $Δ$ cancels.

</div>


<div class="column">

**Normal per class**, $θ\_y = (μ\_y, σ\_y)$:
$$
p(x \mid y; θ) = \tfrac{1}{σ\_y \sqrt{2π}}\\, e^{-(x - μ\_y)^2 / 2σ\_y^2}
$$

</div>


</div>



<div class="fragment">

At 1,250 €: likelihood ratio $0.46 / 0.0024 ≈ 190$. With prior odds $1 : 999$,
$P(\text{fraud} \mid x) = 190 / 1{,}189 ≈ 16\\%$.

</div>


Notes:
The limit argument: $P(x \le X \le x + Δ \mid y) = p(x \mid y)\\,Δ + o(Δ)$, so
$P(y \mid x \le X \le x + Δ) \to p(x \mid y) P(y) / \sum\_{y'} p(x \mid y')
P(y')$ as $Δ \to 0$. The conditional on the event $X = x$, which has
probability zero, is defined by this limit. The likelihood ratio of a
continuous attribute is therefore a ratio of densities, and it depends on the
observed value.

Numbers: $x = \log\_{10} 1{,}250 = 3.10$. Fraud: $z = (3.10 - 2.6)/0.40 = 1.24$,
density $0.46$. Honest: $z = (3.10 - 1.55)/0.45 = 3.44$, density $0.0024$.
Ratio $191$, posterior odds $191 : 999$, $P = 0.16$. The densities are taken
over $\log\_{10}$ amount; over the amount itself both carry the same factor
$1/(x \ln 10)$, which cancels in the ratio, so the scale on which the density
is written does not change the posterior.

The class's sample mean and standard deviation are the natural estimates
(<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>); they are the maximum
likelihood estimates of $μ\_y$ and $σ\_y$ (with divisor $n$ for $σ$, a
difference that vanishes for 100 rows), as <a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>
derives for a single parameter.

--

## Gaussian Naive Bayes

Naive Bayes with a **family per attribute** — a normal for each number, a
Bernoulli for each flag — all independent given the class:

$$
p(x \mid y; θ) = \prod\_{\text{numbers } j} \mathcal{N}(x\_j;\ μ\_{jy}, σ\_{jy}^2)
\cdot \prod\_{\text{flags } j} θ\_{jy}^{x\_j} (1 - θ\_{jy})^{1 - x\_j}
$$

| attribute of the transaction | fitted per class | likelihood ratio |
|---|---|---|
| amount 1,250 € | mean and spread of log amount | ≈ 190 |
| new device: yes | share of rows with the flag | 6 |
| **both** | | $190 \cdot 6 = 1{,}140$ |


<div class="fragment c-insight">

Posterior odds $1{,}140 : 999$, so **53%** fraud. Fitting is still one pass over
the table: a mean and a spread per number and class, a share per flag and class.

</div>


Notes:
The naive assumption of <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>
does not depend on the type of the attributes: each factor $p(x\_j \mid y)$ can
come from its own family, normal (or log-normal) for amounts and durations,
Bernoulli for flags, categorical for the country. The classifier and its odds
form are unchanged; every attribute contributes its own likelihood ratio, for
a number the ratio of two normal densities at the observed value. The model
with only normal factors is called Gaussian naive Bayes (scikit-learn
`GaussianNB`).

Parameter count: two numbers per continuous attribute and class (mean and
variance), one per binary flag and class. In log-odds form a normal factor
contributes
$\log(σ\_{jh}/σ\_{jf}) - (x\_j - μ\_{jf})^2/2σ\_{jf}^2 + (x\_j - μ\_{jh})^2/2σ\_{jh}^2$,
a quadratic function of $x\_j$; with equal variances in both classes the
quadratic terms cancel and the contribution is linear in $x\_j$. With unequal
variances the ratio eventually falls again on the side of the narrower class:
for the amount, $σ\_\text{fraud} < σ\_\text{honest}$, the likelihood ratio peaks
at about 3.5 million € and decreases beyond — far outside the data, where
$p(x)$ is negligible anyway.

Numbers: $191 \cdot 6 = 1{,}149$; posterior odds $1{,}149 : 999$,
$P = 1{,}149/2{,}148 = 0.53$. The amount alone gave 16%, the device flag alone
$6/1{,}005 = 0.6\\%$.

--

## One Gaussian per Class

<div class="viz viz-lg" data-viz="ml/generative-2d" data-steps="2"
 data-params='{"view": "fit"}'></div>


<div class="q">

In fraud, amount and distance rise together. Which ellipses can follow the
tilt — and what does one covariance for both classes do to the boundary?

</div>


Notes:
The 98 labelled transactions of <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>,
now with a normal fitted to each class's rows; the ellipses are the 1σ and 2σ
contours, the violet line is where the fitted posterior is 0.5 (the prior is
the training share of fraud), and the tinted region is decided as fraud.

Step 0, naive: amount and distance independent within each class, so each
class gets a diagonal covariance and its ellipses stay upright; the model is
the two-attribute version of the previous slide. Step 1, full: one covariance
per class, which keeps the within-class correlation (0.78 in fraud in this sample); the
fraud ellipse tilts with its cloud and the boundary bends with it. Step 2,
shared: one covariance for both classes, estimated from all rows (the pooled
within-class covariance); both ellipses have the same shape and the boundary
is a straight line. The choice control returns to any of the three.

--

## The Multivariate Normal


<div class="grid-2-1">


<div class="column">

$$
\mathcal{N}(x;\ μ, Σ) = \frac{1}{(2π)^{p/2} \sqrt{\det Σ}}
\exp\\!\Big(-\tfrac12 (x - μ)^\top Σ^{-1} (x - μ)\Big)
$$

$$
Σ = \begin{pmatrix} σ\_1^2 & ρ\\, σ\_1 σ\_2 \\\ ρ\\, σ\_1 σ\_2 & σ\_2^2 \end{pmatrix}
$$

</div>


<div class="c-definition">

The **covariance matrix** $Σ$: spreads on the diagonal, covariances off it.

</div>


</div>


| model of $p(x \mid y)$ for $p$ numbers | numbers per class | $p = 30$ |
|---|---|---|
| counts, 10 bins per attribute | $10^p - 1$ | $10^{30}$ |
| Gaussian naive Bayes | $2p$ | 60 |
| one Gaussian per class | $p + p(p + 1)/2$ | 495 |


<div class="c-insight">

The family alone defeats the explosion: **quadratic** in $p$, not exponential —
and the correlations stay in the model.

</div>


Notes:
In one dimension the formula is the normal density of
<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>. The exponent is
minus one half of the squared Mahalanobis distance of $x$ from $μ$; its level
sets are the ellipses of the previous slide. The off-diagonal entries are the
covariances of <a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>,
$\mathrm{cov}(X\_1, X\_2) = ρ σ\_1 σ\_2$. $Σ$ is symmetric and must be positive
definite; with fewer rows than attributes in a class its estimate is singular,
which is one reason to share or to restrict it.

Counts: a mean vector has $p$ entries, a symmetric $p \times p$ matrix
$p(p + 1)/2$ free ones ($p$ variances and $p(p - 1)/2$ covariances). For
$p = 30$: $30 + 465 = 495$ per class. Binning instead needs a full joint over
$10^{30}$ cells (<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>). Gaussian naive
Bayes is the special case of a diagonal $Σ$; a shared $Σ$ needs $p$ numbers
per class plus $p(p + 1)/2$ once.

The price of the family is its shape: one ellipse per class, symmetric, with
a single peak. Where the data are shaped differently, the model is wrong in a
way no amount of data repairs (the last slide of the module).

--

## A Shared Covariance Gives a Linear Boundary

With the **same** $Σ$ in both classes, the quadratic terms cancel in the
log-odds:

$$
\log \frac{P(\text{fraud} \mid x)}{P(\text{honest} \mid x)}
= \underbrace{(μ\_\text{f} - μ\_\text{h})^\top Σ^{-1}}\_{w^\top}\\, x + b
\qquad\Longrightarrow\qquad
P(\text{fraud} \mid x) = \frac{1}{1 + e^{-(w^\top x + b)}}
$$

- **One $Σ$ per class:** a quadratic boundary — *quadratic discriminant analysis*.
- **Shared $Σ$:** a straight boundary — *linear discriminant analysis*.
- **Diagonal $Σ$ per class:** Gaussian naive Bayes, quadratic as well.


<div class="c-insight">

A logistic function of a linear score: the form that logistic regression
(<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>) fits **directly**,
without modelling $x$.

</div>


Notes:
Derivation. $\log \mathcal{N}(x; μ, Σ) = -\tfrac12 x^\top Σ^{-1} x + μ^\top
Σ^{-1} x - \tfrac12 μ^\top Σ^{-1} μ + \text{const}$, where the constant
depends on $Σ$ only. In the difference of the two classes' logs the term
$x^\top Σ^{-1} x$ and the constant cancel when $Σ$ is shared, leaving
$w = Σ^{-1}(μ\_\text{f} - μ\_\text{h})$ and
$b = \tfrac12 μ\_\text{h}^\top Σ^{-1} μ\_\text{h} - \tfrac12 μ\_\text{f}^\top
Σ^{-1} μ\_\text{f} + \log \frac{P(\text{fraud})}{P(\text{honest})}$. The prior
enters only the offset $b$: changing the base rate shifts the line parallel to
itself. With a separate $Σ$ per class the quadratic term
$-\tfrac12 x^\top (Σ\_\text{f}^{-1} - Σ\_\text{h}^{-1}) x$ remains, and the
boundary is a conic section (ellipse, parabola or hyperbola).

Posterior odds $e^{a}$ correspond to the probability $1/(1 + e^{-a})$, the
logistic (sigmoid) function. This is Bishop, *Pattern Recognition and Machine
Learning*, §4.2.1. Logistic regression fits $w$ and $b$ directly by maximising
the likelihood of the labels; linear discriminant analysis obtains them from
the class means, the shared covariance and the prior. The two estimates differ
whenever the Gaussian assumption is wrong, the same contrast as naive Bayes
against logistic regression for flags
(<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>).

--

## When One Gaussian Is Not Enough

<div class="viz viz-lg" data-viz="ml/generative-2d" data-steps="1"
 data-params='{"view": "fit", "fraud": "two"}'></div>


<div class="q">

Fraud comes in two patterns. Where does a single normal put its mean — and
what does that do to the boundary?

</div>


Notes:
Two kinds of fraud in one class: card testing, where stolen card data are
tried with small amounts (around 9 €) far from the card holder's home, and
large purchases (around 900 €) close to home with a stolen card. One normal
for the fraud class has its mean between the two patterns, at an amount and
distance where almost no fraud occurs, and a wide, tilted ellipse that spreads
probability over the empty space between them. Its density is too low in both
patterns and too high in the gap; the boundary follows the ellipse, not the
data.

Step 1 fits a mixture of two normals for fraud,
$p(x \mid \text{fraud}) = π\_1 \mathcal{N}(x; μ\_1, Σ\_1) + π\_2 \mathcal{N}(x;
μ\_2, Σ\_2)$, with $π\_k$ the shares of the patterns. Here each row's pattern is
known to the figure and the mixture is fitted pattern by pattern, by means and
covariances. In real data the pattern is not recorded: it is a hidden
variable, and fitting the mixture without it is the EM algorithm of
<a href="/courses/probabilistic-machine-learning/lecture/l07-probabilistic-algorithms/">Lecture 07</a>. A model shape that is wrong
does not improve with more rows; only a richer family does.

Ten numeric attributes, two classes.


<div class="q">

How many numbers does Gaussian naive Bayes need — and one full Gaussian per
class? Count the prior too.

</div>



<div class="fragment">

**41 and 131.** Naive: $10 + 10 = 20$ per class, $2 \cdot 20 + 1$. Full:
$10 + 55 = 65$ per class, $2 \cdot 65 + 1$.

</div>


Notes:
Gaussian naive Bayes: per class 10 means and 10 variances, 20 numbers; two
classes 40; the prior $P(\text{fraud})$ one more: 41. One Gaussian per class:
10 means and a symmetric $10 \times 10$ covariance matrix with
$10 \cdot 11/2 = 55$ free entries, 65 per class, 130 for both, 131 with the
prior. A shared covariance needs $2 \cdot 10 + 55 + 1 = 76$. Binned into 10
values each, the full joint would need $10^{10} - 1$ per class.

--

## Takeaway


<div class="takeaway">

A number enters through a **density** per class; Bayes' theorem needs only the
ratio of the two densities. **Gaussian naive Bayes** fits a mean and a spread
per attribute and class; **one Gaussian per class** keeps the correlations at
a quadratic, not exponential, cost; a **shared covariance** makes the boundary
linear. One Gaussian cannot follow a class with two patterns — a **mixture**
can.

</div>

# Deciding on a Class


<div class="guiding-question">

**Guiding Question:** The model says 17% fraud. Block, check or let it
through — and who decides where the line is?

</div>


--

## Decision Regions and Their Errors

<div class="viz viz-lg" data-viz="ml/class-densities" data-steps="3"
 data-params='{"view": "decide", "prior": 0.1, "cut": 1000}'></div>


<div class="q">

Flag every transaction above the cut. Where should the cut go to make the
fewest errors?

</div>


Notes:
The model of the previous module, one normal per class over $\log\_{10}$
amount, with a fraud share of 10% so that the fraud curve is visible. Each
curve is $p(x, y) = p(x \mid y)\\, P(y)$: how much of all transactions belongs
to that class at that amount; the area under each curve is its prior. A cut
splits the axis into two **decision regions**, pass below and flag above. The
frauds below the cut are passed (orange area), the honest transactions above
it are flagged (navy area); the error rate is the sum of the two areas.

Step 1: a cut at 1,000 € passes 84 of 100 frauds per 1,000 transactions and
flags 0.6 honest ones, 85 errors per 1,000. Step 2: between the cut and the
point where the curves cross, the fraud curve lies above the honest one, so
every transaction there is more often fraud than not and is passed anyway;
that wedge (red) is avoidable. Step 3: the cut at the crossing, about 300 €,
makes 38 + 18 = 56 errors per 1,000, the minimum. At the crossing
$p(x \mid \text{fraud}) P(\text{fraud}) = p(x \mid \text{honest}) P(\text{honest})$,
which is $P(\text{fraud} \mid x) = 0.5$. The slider and the button "best cut"
repeat the experiment for other priors.

--

## Two Kinds of Error

The best cut of the last slide, about 300 €, per 1,000 transactions (100 of them
fraud):

| | is fraud | is honest |
|---|---|---|
| **flag** (decide fraud) | 62 — true positive | **18 — false positive**: type I error, a false alarm |
| **pass** (decide honest) | **38 — false negative**: type II error, a missed fraud | 882 — true negative |


<div class="q">

Move the cut to 1,000 €. What happens to the two errors?

</div>



<div class="fragment c-insight">

False alarms fall to 0.6, missed frauds rise to 84: moving the cut **trades one
error for the other**. The Bayes rule minimises their **sum**; costs, next,
weigh them.

</div>


Notes:
"Positive" means flagged as fraud, the class searched for; "true" and "false"
say whether the decision was right. The numbers follow from the two normals of
the previous slide at the cut $\log\_{10} 301$: $100 \cdot 0.381 = 38$ frauds
lie below it, $900 \cdot 0.020 = 18$ honest transactions above it. As rates
within each true class, the false positive rate is $18/900 = 2\\%$ and the
false negative rate $38/100 = 38\\%$; one minus the latter, 62%, is the share
of frauds caught (recall, in <a href="/courses/probabilistic-machine-learning/lecture/l06-evaluation-and-risk/">Lecture 06</a>).

The names type I and type II come from statistical testing. Read the decision
as a test of the null hypothesis $H\_0$: "the transaction is honest". A type I
error rejects $H\_0$ although it is true (an honest transaction flagged); its
probability is the significance level $\alpha$ of a test. A type II error keeps
$H\_0$ although it is false (a fraud let through); its probability is $\beta$,
and $1 - \beta$ is the power. For a given model, $\alpha$ and $\beta$ move in
opposite directions with the cut: at 100 € the false alarms rise to 143 and
the missed frauds fall to 7 (150 errors); at 1,000 € they are 0.6 and 84
(85 errors). Only better attributes, which separate the two curves further,
lower both at once.

--

## The Bayes Decision Rule


<div class="c-definition">

The **Bayes decision rule** decides the most probable class:
$$
\hat y(x) = \arg\max\_y P(y \mid x) = \arg\max\_y p(x \mid y)\\, P(y)
$$
No other rule on the same attributes makes fewer errors.

</div>



<div class="grid-2">


<div class="card">

### Why it errs least
At each $x$, deciding $\hat y$ is wrong with probability $1 - P(\hat y \mid x)$ —
smallest for the most probable class. Best at every $x$ is best on average.

</div>


<div class="card">

### Two classes, as odds
Decide fraud iff $P(\text{fraud} \mid x) > 0.5$, i.e.
$$
\mathrm{LR}(x) > \frac{P(\text{honest})}{P(\text{fraud})} = 999
$$

</div>


</div>


Notes:
The error rate of a rule $\hat y$ is
$P(\text{error}) = \int \big(1 - P(\hat y(x) \mid x)\big)\\, p(x)\\, dx$. The
integrand is non-negative and depends on the rule only through the class it
picks at $x$, so the integral is smallest when every integrand is smallest,
which is the class with the largest posterior. Since $p(x)$ does not depend on
$y$, the largest posterior is the largest $p(x \mid y) P(y)$: the higher curve
of the previous slide. The regions where each class is decided are the
decision regions; the boundary between them is where the posteriors are equal.
The same rule holds for any number of classes.

What remains is the area under the lower curve everywhere, the overlap of the
classes. It is the Bayes error of
<a href="/courses/probabilistic-machine-learning/lecture/l06-evaluation-and-risk/">Lecture 06</a>: the lowest error any
classifier can reach with these attributes, a property of the data, not of the
model. The rule is also called the MAP decision (maximum a posteriori class).
It should not be confused with MAP *estimation*
(<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>), which picks the most probable
parameter value given the training data; both maximise a posterior, over
different unknowns.

Odds form, from <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>: the
posterior odds are the prior odds times the likelihood ratio, and they exceed
1 iff $\mathrm{LR}(x) > P(\text{honest})/P(\text{fraud})$. At the base rate of
1 in 1,000 the three red flags (ratio 210) and the amount of 1,250 € (190) each
fall short; amount and new device together (1,140) pass it.

--

## Unequal Costs

| | is fraud | is honest |
|---|---|---|
| **check it** (a text to the customer) | 0 | €5 ($c\_{FP}$, false positive) |
| **let it through** | €500 ($c\_{FN}$, false negative) | 0 |


<div class="q">

With $p = P(\text{fraud} \mid x)$, at which $p$ is checking the cheaper action?

</div>



<div class="fragment">

$$
\underbrace{(1 - p)\\, c\_{FP}}\_{\text{check}} < \underbrace{p\\, c\_{FN}}\_{\text{let through}}
\quad\Longleftrightarrow\quad
p > p^{\*} = \frac{c\_{FP}}{c\_{FP} + c\_{FN}} = \frac{5}{505} \approx 1\\%
$$


<div class="c-insight">

<a href="/courses/probabilistic-machine-learning/lecture/l01-introduction/">Lecture 01</a>'s loan threshold, for fraud. The
three-flag transaction (17%) is not more likely fraud than not — and well worth
a check.

</div>


</div>


Notes:
The table is a cost matrix: the cost of each action in each true state. The
expected cost of an action is its cost in each state weighted by the
posterior: checking costs $c\_{FP}$ when the transaction is honest, letting it
through costs $c\_{FN}$ when it is fraud. The cheaper action is chosen at every
$x$; with zero cost for correct actions the rule is $p > c\_{FP}/(c\_{FP} +
c\_{FN})$. Only the ratio of the costs matters. Equal costs give $p^\* = 0.5$,
the Bayes decision rule of the previous slide, which therefore minimises the
expected cost exactly when both errors cost the same.

In general, with actions $a$ and costs $c(a, y)$, the rule chooses
$\arg\min\_a \sum\_y c(a, y)\\, P(y \mid x)$, the action with the smallest
expected cost (the Bayes risk at $x$). A third action, deferring to a human,
adds a band of posteriors around the threshold in which neither automatic
action is cheap enough (<a href="/courses/probabilistic-machine-learning/lecture/l01-introduction/">Lecture 01</a>).

The three-flag transaction of
<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a> has posterior 17%:
checking costs 0.83 × €5 = €4.15 in expectation, letting it through
0.17 × €500 = €85. The threshold applies to a calibrated probability;
the naive Bayes posterior is over-confident where flags are correlated, so the
threshold is applied to a number that may be too high
(<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>).

--

## Costs and Prior in One Threshold

<div class="viz viz-lg" data-viz="ml/class-densities" data-steps="2"
 data-params='{"view": "decide", "costs": true, "prior": 0.1}'></div>

$$
\text{check iff}\quad \mathrm{LR}(x) > \frac{c\_{FP}}{c\_{FN}} \cdot \frac{P(\text{honest})}{P(\text{fraud})}
$$


<div class="q">

**Predict before the last click:** fraud becomes 100 times rarer. Where does
the cut go?

</div>


Notes:
In odds form the rule $p > c\_{FP}/(c\_{FP} + c\_{FN})$ reads: posterior odds
$> c\_{FP}/c\_{FN}$, and with posterior odds = prior odds × likelihood ratio,
$\mathrm{LR}(x) > (c\_{FP}/c\_{FN}) \cdot P(\text{honest})/P(\text{fraud})$. The
costs and the prior enter only as this product; the model's part, the
likelihood ratio, is untouched. In the figure each curve is weighted by the
cost of misclassifying its class, $c\_{FN}\\, p(x, \text{fraud})$ and
$c\_{FP}\\, p(x, \text{honest})$, and the best cut is where the weighted curves
cross.

Step 0: fraud share 10%, equal costs: threshold on the ratio 9, cut at about
300 €. Step 1: a missed fraud costs €500, a check €5: the fraud curve grows a
hundredfold, the threshold on the ratio falls to $0.09$ and the cut moves to
about 49 €, flagging more than a third of the honest transactions — at a fraud
share of 10% that is the cheaper policy. Step 2: fraud share 0.1%: the threshold is
$0.01 \cdot 999 \approx 10$ again and the cut returns to about 314 €. A class
that is 100 times rarer and 100 times costlier to miss gets the same
boundary. At the real base rate with equal costs the cut would lie at about
3,000 €.

A generative model changes both factors without refitting: a new base rate
replaces $P(y)$, new costs replace $c\_{FP}/c\_{FN}$. A discriminative model can
take new costs the same way, and a new base rate by correcting its odds
(<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>); a rule has to be learned
again. How the threshold trades recall against precision, and how its cost
curve looks, is <a href="/courses/probabilistic-machine-learning/lecture/l06-evaluation-and-risk/">Lecture 06</a>.

--

## Mini-Exercise

A transaction has likelihood ratio **20**; prior odds $1 : 999$.


<div class="q">

Is it fraud under the Bayes decision rule? Is it worth a €5 check against a
€500 loss?

</div>



<div class="fragment">

**No, and yes.** $20 < 999$: $P(\text{fraud} \mid x) = 20/1{,}019 ≈ 2\\%$. The
check pays above $1\\%$: on the ratio, above $999 \cdot 5/500 ≈ 10$.

</div>


Notes:
Posterior odds $20 : 999$, probability $20/1{,}019 = 0.0196$. Under the Bayes
decision rule (equal costs) fraud would need a ratio above 999. With
$c\_{FP}$ = €5 and $c\_{FN}$ = €500 the threshold on the posterior is
$5/505 = 0.0099$, on the likelihood ratio $(5/500) \cdot 999 = 9.99$; the
ratio 20 exceeds it. Expected costs: checking 0.98 × €5 = €4.90,
letting it through 0.0196 × €500 = €9.80.

--

## Takeaway


<div class="takeaway">

Deciding the **most probable class** gives the fewest errors — the **Bayes
decision rule**; what remains is the overlap of the classes. **Unequal costs**
move the threshold on the posterior to $c\_{FP}/(c\_{FP} + c\_{FN})$. For a
generative model costs and **prior** meet in one threshold on the likelihood
