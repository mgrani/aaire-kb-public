## Counting Evidence Twice

The transaction $x = (1, 1, 1, 0)$ — new device, foreign IP, at night, not to
a crypto exchange — got **17%** fraud. But device and IP **arrive together**:
both appear on **55%** of frauds (account take-over) and **4%** of honest
transactions (travel, VPNs).


<div class="q">

Use the real pair instead of the product of its two shares: what happens to the 17%?

</div>



<div class="fragment">

| score = prior · **device and IP** · night · no crypto | $y$ = fraud | $y$ = honest | $P(\text{fraud} \mid x)$ |
|---|---|---|---|
| naive: product of two shares | $0.001 \cdot \mathbf{0.60 \cdot 0.70} \cdot 0.50 \cdot 1$ $= 0.00021$ | $0.999 \cdot \mathbf{0.10 \cdot 0.05} \cdot 0.20 \cdot 0.9999$ $\approx 0.00100$ | **17.4%** |
| the real pair: $\hat P(x\_\text{dev} {=} 1, x\_\text{IP} {=} 1 \mid y)$ | $0.001 \cdot \mathbf{0.55} \cdot 0.50 \cdot 1$ $= 0.000275$ | $0.999 \cdot \mathbf{0.04} \cdot 0.20 \cdot 0.9999$ $\approx 0.00799$ | **3.3%** |

Why the product: if the IP ignored the device, the 10% of honest
transactions with a new device would show a foreign IP as often as all
honest ones do, 5% — and 5% of 10% is 0.5%.

</div>



<div class="fragment c-warning">

The product makes the pair **eight times too rare** among honest
transactions: the IP mostly repeats the device.
Correlated attributes are **counted twice**; naive Bayes is **over-confident**.

</div>


Notes:
The transaction and its naive scores are those of "Classifying One
Transaction": prior, the shares of the four binary attributes (Counts to Shares,
unsmoothed), 0.00021 against 0.000999, 17.4%. Only the device–IP factor
changes; night (0.50 against 0.20) and no crypto exchange (1 against 0.9999)
stay. Real: $P(\text{fraud} \mid x) = 0.000275 / (0.000275 + 0.00799) =
0.000275 / 0.008266 = 3.3\\%$.

The product is the chain rule with the condition dropped:
$P(x\_\text{dev} = 1, x\_\text{IP} = 1 \mid y) = P(x\_\text{dev} = 1 \mid y) \cdot
P(x\_\text{IP} = 1 \mid x\_\text{dev} = 1, y)$ always holds, and conditional
independence replaces the second factor by $P(x\_\text{IP} = 1 \mid y)$. In
counts for the honest class: 9,990 of 99,900 have a new device; if 5% of
them came from a foreign IP, about 500 would show both, 0.5%. The real 4% is
about 3,996, so $P(x\_\text{IP} = 1 \mid x\_\text{dev} = 1, \text{honest})
\approx 3{,}996 / 9{,}990 = 0.40$ — eight times the 5% the product assumes.
The same reasoning gives the fraud column: 70% of the 60 frauds with a new
device, 42.

Both classes are affected, in different measure. Among frauds the pair is a
little more common than the product says (55% against 42%); among honest
transactions it is eight times more common (4% against 0.5%), because travel
and VPN use also bring both binary attributes at once. The naive model thus makes the pair
look much rarer among honest transactions than it is, and the posterior too
high. Correlated attributes push naive Bayes posteriors towards 0 and 1: the
probabilities are not calibrated
(<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>). In the odds form of
<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a> the same error reads: naive Bayes
multiplies the likelihood ratios $6 \cdot 14 = 84$, while the pair's ratio is
$0.55/0.04 \approx 14$.

Classification by arg max depends only on which side of the decision
threshold the posterior falls, so it can remain correct even when the
probabilities are badly off. Domingos and Pazzani (1997, Machine Learning 29)
show that naive Bayes can be optimal under zero–one loss in many cases where
the independence assumption is violated, which is why it classifies well
despite a false assumption.

The word salad of <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a> (Generating
Data) is the same assumption seen from the generating side: words drawn
independently given the class are each typical of spam, but the dependences
that make a sentence are gone — the same dependences whose absence counts
correlated evidence twice.

--

<!-- .slide: class="smaller" -->

## Counting Evidence Twice, Formally


<div class="c-definition">

The **chain rule** always holds:
$P(x\_\text{dev}, x\_\text{IP} \mid y) = P(x\_\text{dev} \mid y) \cdot P(x\_\text{IP} \mid x\_\text{dev}, y)$.
Naive Bayes replaces $P(x\_\text{IP} \mid x\_\text{dev}, y)$ by
$P(x\_\text{IP} \mid y)$, so the score of class $y$ is off by the **factor**
$$
c\_y = \frac{P(x\_\text{IP} \mid y)}{P(x\_\text{IP} \mid x\_\text{dev}, y)}.
$$

</div>



<div class="fragment c-important">

**Proposition.** The naive posterior is exact iff
$c\_\text{fraud} = c\_\text{honest}$: the normaliser cancels a factor common to
both scores. Otherwise the fraud score is off **relative to** the honest one
by $c\_\text{fraud} / c\_\text{honest}$.

</div>



<div class="fragment">

Our pair: $c\_\text{fraud} = \dfrac{0.70}{0.55 / 0.60} = 0.76$,
$\quad c\_\text{honest} = \dfrac{0.05}{0.04 / 0.10} = \dfrac{1}{8}$,
$\quad \dfrac{c\_\text{fraud}}{c\_\text{honest}} \approx 6.1$ — the 17.4% instead of 3.3%.

</div>



<div class="fragment c-insight">

**Counted twice** means: given the device, the IP tells the classes apart far
less than on its own, yet the product uses its full strength. A **copy**
tells them apart not at all: $P(x\_\text{IP} \mid x\_\text{IP}, y) = 1$.

</div>


Notes:
Proof of the proposition. Write $s\_y$ for the score with the true pair
factor, $\hat P(y) \cdot P(x\_\text{dev}, x\_\text{IP} \mid y) \cdot \ldots$;
the naive score is $c\_y s\_y$. The naive posterior is
$c\_\text{f} s\_\text{f} / (c\_\text{f} s\_\text{f} + c\_\text{h} s\_\text{h})$;
dividing numerator and denominator by $c\_\text{h}$ shows that it depends on the
factors only through $c\_\text{f} / c\_\text{h}$, and equals the true posterior
$s\_\text{f} / (s\_\text{f} + s\_\text{h})$ exactly when that ratio is 1. Check
with the numbers: the true score ratio is $0.000275 / 0.00799 = 0.0344$, times
6.1 gives $0.210 = 0.00021 / 0.000999$, the naive ratio.

The arithmetic: $P(x\_\text{IP} = 1 \mid x\_\text{dev} = 1, \text{fraud}) =
0.55 / 0.60 = 0.92$ (of the frauds with a new device, 92% also have a foreign
IP) and $P(x\_\text{IP} = 1 \mid x\_\text{dev} = 1, \text{honest}) = 0.04 / 0.10
= 0.40$. On its own the foreign IP separates the classes by
$0.70 / 0.05 = 14$; given the new device only by $0.92 / 0.40 = 2.3$. The
naive model multiplies by 14, about 6.1 times too much. For a copy of the IP
attribute both conditional shares are 1, the copy should separate by
$1 / 1 = 1$ and the naive model multiplies by 14 again: the Mini-Exercise.

For $p$ attributes the chain rule gives
$P(x \mid y) = \prod\_j P(x\_j \mid x\_1, \ldots, x\_{j-1}, y)$, and the factor is
$c\_y = \prod\_j P(x\_j \mid y) / P(x\_j \mid x\_1, \ldots, x\_{j-1}, y)$.
Conditional independence makes every term 1, so it is sufficient for an exact
posterior, but not necessary: equal factors in both classes suffice, and for
the decision only the side of the threshold matters (Domingos and Pazzani
1997). Redundant binary attributes that point to the same class make
$c\_\text{fraud} / c\_\text{honest}$ move the posterior further in that direction,
towards 0 or 1: over-confidence. In the odds form of
<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>, $c\_\text{fraud} / c\_\text{honest}$
is the ratio of the likelihood ratio used, 14, to the one that applies given
the device, 2.3.

--

## Mini-Exercise

A bug feeds the **foreign-IP** binary attribute into the model twice.


<div class="q">

Does the fraud probability of our transaction go up, down, or stay
— and what does that say about correlated attributes?

</div>



<div class="fragment">

**Up — from 17% to about 75%.** Both scores get the factor once more:
$0.00021 \cdot 0.70 = 0.000147$ against $0.000999 \cdot 0.05 \approx 0.00005$.
Naive Bayes cannot tell a copy from new evidence; a strongly correlated
attribute is almost a copy.

</div>


Notes:
Answer: up. The duplicated binary attribute contributes its factor twice in each class:
the scores become $0.000147$ and $0.0000499$, so
$P(\text{fraud} \mid x) = 0.000147/0.000197 = 0.746$, from 17%.

The true information content is unchanged, since a copy of an attribute carries
no new evidence: given the attribute, the copy is certain in both classes, so its
correct factor is 1. Naive Bayes cannot detect duplication, because the
model has no parameter for the relation between attributes. A duplicate is the
limiting case of perfect correlation; strongly correlated attributes act as
partial copies. Real feature sets contain them routinely: the same information
coded twice, features derived from others, and indicators that are near-functions
of each other. Removing redundant attributes, or a model that captures the
dependence (a Bayesian network, <a href="/courses/probabilistic-machine-learning/lecture/l05-bayesian-networks/">Lecture 05</a>), avoids
the double counting.

--

## Takeaway


<div class="takeaway">

Naive Bayes **assumes the joint apart** — attributes independent given the
class — and fits every factor by **counting**, smoothed by pseudo-counts so no
zero can veto. It is cheap, needs little data and ranks well. Its
probabilities are over-confident wherever attributes move together.

</div>


---

# Odds and Log-Odds


<div class="guiding-question">

**Guiding Question:** Three attributes at yes give 17% fraud. How much did each one
contribute — and why do practitioners add instead of multiply?

</div>


--

## Compare, Don't Normalise

Bayes' theorem for the transaction of "Classifying One Transaction":

$$
P(\text{fraud} \mid x)
= \frac{\text{score}(\text{fraud})}{\underbrace{\text{score}(\text{fraud}) + \text{score}(\text{honest})}\_{\text{normaliser: the total } p(x)}}
= \frac{0.00021}{0.00021 + 0.000999} \approx 17\\%
$$


<div class="q">

To decide *fraud or not*, do we need the normaliser?

</div>



<div class="fragment">

No. Both posteriors share it, so in their **ratio** it cancels — the
**posterior odds**:
$$
\frac{P(\text{fraud} \mid x)}{P(\text{honest} \mid x)}
= \frac{\text{score}(\text{fraud})}{\text{score}(\text{honest})}
= \frac{0.00021}{0.000999} = \frac{210}{999}
$$

</div>



<div class="fragment c-note">

Odds above 1: fraud is the more probable class. Back to a probability:
$P = 210 / (210 + 999) = 17\\%$.

</div>


Notes:
Odds and their relation to probabilities were introduced with Bayes' theorem
in <a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>: odds
$o = P/(1 - P)$, and $P = o/(1 + o)$. For two classes
$P(\text{honest} \mid x) = 1 - P(\text{fraud} \mid x)$, so the posterior odds
of fraud are exactly the odds of this formula.

The crypto-exchange binary attribute of that transaction, observed absent, contributes
the ratio $1 / 0.9999 \approx 1.0001$, invisible at this precision; the odds
below use the three binary attributes.

Dividing the two posteriors removes the denominator of Bayes' theorem,
$p(x) = \sum\_y P(y) \prod\_j p(x\_j \mid y)$, which needs every class. The odds
need only the two scores, and the decision "the more probable class" of
<a href="/courses/probabilistic-machine-learning/lecture/l06-evaluation-and-risk/">Lecture 06</a> needs only whether the odds
exceed 1. For more than two classes, odds relative to one reference class play
the same role.

--

<!-- .slide: class="smaller" -->

## The Odds Form

Split each score into its factors and divide them **pairwise**:

$$
\underbrace{\frac{P(\text{fraud} \mid x)}{P(\text{honest} \mid x)}}\_{\text{posterior odds}}
= \underbrace{\frac{P(\text{fraud})}{P(\text{honest})}}\_{\text{prior odds}}
\cdot \prod\_{j=1}^{p} \underbrace{\frac{p(x\_j \mid \text{fraud})}{p(x\_j \mid \text{honest})}}\_{\text{likelihood ratio } \mathrm{LR}\_j}
$$


<div class="grid-2">


<div class="column">

| observed | $\hat P(x\_j \mid \text{fraud})$ | $\hat P(x\_j \mid \text{honest})$ | $\mathrm{LR}\_j$ |
|---|---|---|---|
| $x\_\text{dev} = 1$ | 0.60 | 0.10 | **6** |
| $x\_\text{IP} = 1$ | 0.70 | 0.05 | **14** |
| $x\_\text{night} = 1$ | 0.50 | 0.20 | **2.5** |

</div>


<div class="column middle fragment">

$$
\frac{1}{999} \cdot 6 \cdot 14 \cdot 2.5 = \frac{210}{999}
$$
The same odds, **one factor per binary attribute**: above 1 for fraud, below 1 against.


<div class="c-insight">

Strength is a ratio of **shares**: $x\_\text{dev} = 1$ is 6 times as common
among frauds, though 9,990 of its 10,050 rows are honest.

</div>


</div>


</div>


Notes:
The prior odds are $0.001/0.999 = 1 : 999$, and each likelihood ratio divides
the two fitted shares of "Counts to Shares"
(<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>): $0.60/0.10 = 6$,
$0.70/0.05 = 14$, $0.50/0.20 = 2.5$. A ratio says how many times more common
the observation is among frauds than among honest transactions; exactly 1
means the attribute is uninformative. Because multiplication is commutative,
the order in which evidence arrives does not matter.

The ratio measures the evidence, not the answer. Of the $60 + 9{,}990 =
10{,}050$ training transactions with a new device only 60 are fraud, so
$P(\text{fraud} \mid \text{new device}) = 60/10{,}050 \approx 0.6\\%$: the
evidence multiplies the odds by 6, from $1 : 999$ to $6 : 999$, and the rare
class stays rare. The posterior exceeds 50% only when the combined ratio
exceeds 999. A binary attribute observed absent has its own ratio, the ratio of the shares
of *no*: for the new device $(1 - 0.60)/(1 - 0.10) \approx 0.44$, which speaks
against fraud.

The odds form holds for any generative classifier, $\mathrm{posterior\ odds} =
\mathrm{prior\ odds} \cdot p(x \mid \text{fraud}) / p(x \mid \text{honest})$;
the naive assumption is what splits the one likelihood ratio into a product of
one ratio per attribute.

--

<!-- .slide: class="smaller" -->

## Log-Odds and the Sigmoid


<div class="c-definition">

**Definition.** For a probability $P \in (0, 1)$, the **odds** $o$ and the
**log-odds** (*logit*) $s$:
$$
o = \frac{P}{1 - P} \in (0, \infty)
\qquad
s = \operatorname{logit}(P) = \log \frac{P}{1 - P} \in \mathbb{R}
$$

</div>



<div class="grid-2">


<div class="column">


<div class="q">

Given $s$, what is $P$? Solve for it:

</div>

$$
\begin{aligned}
e^{s} &= \frac{P}{1 - P}
\\\ e^{s} - e^{s} P &= P
\\\ e^{s} &= P\\,(1 + e^{s})
\\\ P &= \frac{e^{s}}{1 + e^{s}} = \frac{1}{1 + e^{-s}} = σ(s)
\end{aligned}
$$

</div>


<div class="column middle fragment">


<div class="c-insight">

The **sigmoid** $σ(s) = \frac{1}{1 + e^{-s}}$ is no modelling choice: it is
the **exact inverse** of the logit. Log-odds and probability carry the same
information.

</div>


| $P$ | 0.001 | 0.1 | 0.5 | 0.9 | 0.999 |
|---|---|---|---|---|---|
| odds | $\frac{1}{999}$ | $\frac{1}{9}$ | 1 | 9 | 999 |
| $s$ | $-6.91$ | $-2.20$ | 0 | $+2.20$ | $+6.91$ |

</div>


</div>


Notes:
The odds were introduced with Bayes' theorem in
<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>; the log-odds add one
step, the (natural) logarithm, which maps the odds from $(0, \infty)$ onto the
whole real line. Odds of 1 become 0, odds above 1 positive, odds below 1
negative; reciprocal odds have opposite log-odds,
$\operatorname{logit}(1 - P) = -\operatorname{logit}(P)$, which is the
symmetry of the table, and correspondingly $σ(-s) = 1 - σ(s)$.

The derivation solves $s = \log(P/(1 - P))$ for $P$: exponentiate,
$e^{s}(1 - P) = P$, so $P(1 + e^{s}) = e^{s}$ and $P = e^{s}/(1 + e^{s})$;
dividing numerator and denominator by $e^{s}$ gives $1/(1 + e^{-s})$. The
sigmoid is therefore not a modelling choice here but the exact conversion from
log-odds back to a probability. Near $P = 0.5$ the logit is close to linear,
$s \approx 4(P - 0.5)$; towards 0 and 1 it grows without bound, which is why
rare-event probabilities such as the base rate sit far out on the log-odds
axis. The name logit and the sigmoid return in logistic regression
(<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>), where $s$ is a linear
score of the attributes.

--

<!-- .slide: class="smaller" -->

## The Log-Odds of the Posterior


<div class="q">

The logit takes one probability $P$ and $1 - P$. How does a sum of many log
ratios fit into it?

</div>



<div class="fragment">

Two classes $y \in \\{0, 1\\}$, attributes $x = (x\_1, \ldots, x\_p)$. Take
$P = P(y{=}1 \mid x)$; then $1 - P = P(y{=}0 \mid x)$, and the logit is the
log **posterior odds**:
$$
\begin{aligned}
\operatorname{logit} P(y{=}1 \mid x)
&= \log \frac{P(y{=}1 \mid x)}{P(y{=}0 \mid x)}
\\\ &= \log \frac{p(x \mid y{=}1)\\, P(y{=}1) \\,/\\, p(x)}{p(x \mid y{=}0)\\, P(y{=}0) \\,/\\, p(x)}
&& \text{Bayes' theorem, for each class}
\\\ &= \log \frac{P(y{=}1)}{P(y{=}0)} + \log \frac{p(x \mid y{=}1)}{p(x \mid y{=}0)}
&& p(x) \text{ cancels; log of a product — always}
\\\ &= \log \frac{P(y{=}1)}{P(y{=}0)} + \sum\_{j=1}^{p} \log \frac{p(x\_j \mid y{=}1)}{p(x\_j \mid y{=}0)}
&& \text{naive: } x\_j \text{ independent given } y
\end{aligned}
$$

</div>



<div class="fragment c-insight">

So $P(y{=}1 \mid x) = σ\big(\log \text{prior odds} + \sum\_j \log \mathrm{LR}\_j\big)$.
The sigmoid needs only **two classes**; the **sum over attributes** needs the
naive assumption.

</div>


Notes:
In the running example $y = 1$ is fraud and $y = 0$ honest. The first line is
the definition of the logit with $P = P(y{=}1 \mid x)$: with two classes the
complement is the other class. The second line
writes each posterior by Bayes' theorem, $P(y \mid x) = p(x \mid y)\\, P(y) /
p(x)$, with the same normaliser $p(x)$ in both classes. The third line is
Bayes' theorem in odds form: $p(x)$ cancels in the ratio, and the log of the
product of two ratios is the sum of their logs, so log posterior odds = log
prior odds + the log of one likelihood ratio, for any model of
$p(x \mid y)$ — a full joint, a Gaussian per class, anything. The fourth line
uses the naive assumption,
$p(x \mid y) = \prod\_j p(x\_j \mid y)$: the log of a product of ratios is a sum
of logs, one term per attribute. Without the assumption the third line still
holds, but its likelihood ratio does not split; that is the case of
"Counting Evidence Twice", where the pair $x\_\text{dev}, x\_\text{IP}$ needs
its joint ratio $0.55/0.04$.

For more than two classes the complement is no longer one class. Then the
log-odds of each class against a reference class are used, and the sigmoid is
replaced by its multi-class generalisation, the softmax.

--

<!-- .slide: class="smaller" -->

## The Three Binary Attributes in Log-Odds


<div class="grid-2">


<div class="column">

<div class="viz viz-full" data-viz="ml/log-odds-sigmoid" data-steps="2"></div>

</div>


<div class="column middle">


<div class="q">

$x = (x\_\text{dev}, x\_\text{IP}, x\_\text{night}) = (1, 1, 1)$. What are the
log posterior odds, fraud against honest — and $P(\text{fraud} \mid x)$?

</div>



<div class="fragment">

$$
\begin{aligned}
s = \log \tfrac{P(\text{fraud} \mid x)}{P(\text{honest} \mid x)}
&= \underbrace{\log \tfrac{1}{999}}\_{\text{prior}} + \underbrace{\log 6}\_{x\_\text{dev}} + \underbrace{\log 14}\_{x\_\text{IP}} + \underbrace{\log 2.5}\_{x\_\text{night}}
\\\ &= -6.91 + 1.79 + 2.64 + 0.92 = -1.56
\\\ \text{odds} &= e^{s} = 0.21 = \tfrac{210}{999}
\\\ P(\text{fraud} \mid x) &= \frac{\text{odds}}{1 + \text{odds}} = \frac{1}{1 + e^{-s}} = 17.4\\%
\end{aligned}
$$

</div>


</div>


</div>



<div class="fragment c-insight">

The log of a product is a **sum**: the log-odds add one term per factor, and
the sigmoid turns the sum back into $P(\text{fraud} \mid x)$. The base rate
sits on the flat tail at $-6.91$; three attributes at yes lift it to $-1.56$.

</div>


Notes:
Three steps, each the inverse of a step that led to the sum. The log-odds are
the natural logarithm of the posterior odds; the logarithm of the odds form
makes them a sum,
$\ln(1/999) = -6.91$, $\ln 6 = 1.79$, $\ln 14 = 2.64$, $\ln 2.5 = 0.92$, in
all $-1.56$. Exponentiating undoes the logarithm: $e^{-1.56} = 0.21$, the odds
$210/999$. The odds give the probability as in
<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>, $P = o/(1 + o)$; with
$o = e^{s}$, dividing numerator and denominator by $e^{s}$ gives
$1/(1 + e^{-s})$.

The figure shows the whole map from log-odds to probability. It is symmetric
around $s = 0$ ($σ(-s) = 1 - σ(s)$), nearly linear between about $-2$ and $+2$
(12% to 88%), and flat at the ends: the base rate sits at $s = -6.91$, where
a whole unit of log-odds changes the probability by only a fraction of a
percent. The same function returns as the link of logistic regression
(<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>), where $s$ is a
linear score of the attributes.

--

<!-- .slide: class="smaller" -->

## Evidence Adds Up

In log-odds, every binary attribute is **one term** of the sum — a step of fixed height,
whatever came before:

$$
s = \log \frac{P(\text{fraud})}{P(\text{honest})} + \sum\_{j} \log \mathrm{LR}\_j,
\qquad
P(\text{fraud} \mid x) = σ(s)
$$


<div class="grid-3-2">


<div class="column">

<div class="viz viz-lg" data-viz="ml/gm-log-odds-staircase" data-steps="3"
 data-params='{"prior": [1, 999], "factors": [{"lr": 6, "label": "new device"}, {"lr": 14, "label": "foreign IP"}, {"lr": 2.5, "label": "night"}]}'></div>

</div>


<div class="column middle">

**Predict before each click:** which binary attribute moves the probability most?


<div class="fragment">

| evidence | odds | log-odds | $P$ |
|---|---|---|---|
| base rate | $1 : 999$ | $-6.91$ | 0.1% |
| new device | $\times 6$ | $+1.79$ | 0.6% |
| foreign IP | $\times 14$ | $+2.64$ | 7.8% |
| night | $\times 2.5$ | $+0.92$ | 17.4% |
| **sum** | $210 : 999$ | $\mathbf{-1.56}$ | **17.4%** |

</div>


</div>


</div>


Notes:
The table is the equation term by term, in natural logarithms: the rounded
terms add to $-6.91 + 1.79 + 2.64 + 0.92 = -1.56$, and
$P = σ(-1.56) = 1/(1 + e^{1.56}) = 0.174$, the sigmoid of "Log-Odds and the
Sigmoid". Each row of the table converts its running sum the same way: $-6.91 \to 0.1\\%$, $-5.12 \to 0.6\\%$,
$-2.48 \to 7.8\\%$, $-1.56 \to 17.4\\%$. The base of the logarithm only rescales the
axis; the figure labels it in probabilities.

On a log-odds axis each likelihood ratio is a step of fixed height $\log
\mathrm{LR}\_j$, independent of the current position: the log-odds are the sum
of the log prior odds and the log likelihood ratios.

Step 1 (new device): odds $6/999$, probability 0.6%. Step 2 (foreign IP): odds
$84/999$, probability 7.8%. Step 3 (night): odds $210/999$, probability 17.4%.
The foreign IP has the largest ratio and therefore the largest step; night is
the weakest of the three, although it moves the probability more in absolute
terms than the first binary attribute did, because probability is not linear in log-odds.

--

## Why Work in Log-Odds


<div class="grid-2">


<div class="card">

### A scorecard
Each binary attribute adds **fixed points** — new device $+1.8$, foreign IP $+2.6$, night
$+0.9$ — whatever came before. A sign says for or against.

</div>


<div class="card">

### One axis
Prior, evidence and — in Lecture 06 — **costs** are terms on the same
axis. A decision threshold is one number on it.

</div>


<div class="card">

### A linear score
$\sum\_j w\_j x\_j + b$: for binary attributes the log-odds are linear in $x$ — the
form **logistic regression** fits directly.

</div>


<div class="card">

### Numbers a computer can hold
1,000 words at $10^{-4}$ each: the product $10^{-4000}$ is **0** in floating
point; the sum of logs, $-9{,}210$, is not.

</div>


</div>


Notes:
Scorecard: the points are the natural logarithms of the likelihood ratios
($\ln 6 = 1.79$, $\ln 14 = 2.64$, $\ln 2.5 = 0.92$). A ratio above 1 gives
positive points, below 1 negative ones, 1 none. Credit scorecards are built
in exactly this form, usually with the logarithm rescaled to integer points.

One axis: the Bayes decision rule of
<a href="/courses/probabilistic-machine-learning/lecture/l06-evaluation-and-risk/">Lecture 06</a> decides fraud when the posterior
odds exceed $c\_{FP}/c\_{FN}$; in log-odds, evidence $\sum\_j \log \mathrm{LR}\_j$
is compared with $\log(c\_{FP}/c\_{FN}) - \log(\text{prior odds})$. A new base
rate or new costs shift the threshold; the evidence terms stay.

Linear score: a binary attribute contributes $\log \mathrm{LR}\_j^{\text{yes}}$ when
present and $\log \mathrm{LR}\_j^{\text{no}}$ when absent, i.e.
$w\_j x\_j + c\_j$ with $w\_j = \log \mathrm{LR}\_j^{\text{yes}} - \log
\mathrm{LR}\_j^{\text{no}}$. Summed over the binary attributes, with the prior in the
constant, the naive Bayes log-odds are exactly linear in $x$: the functional
form of logistic regression (<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>);
the two differ in how the weights are estimated
(<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>).

Underflow: the smallest positive double is about $4.9 \cdot 10^{-324}$, so a
product of a thousand factors of $10^{-4}$ — a text classifier over a long
mail — rounds to 0 in both classes, and the posterior becomes $0/0$. The sum
of logarithms, $1{,}000 \cdot \ln 10^{-4} = -9{,}210.3$, is an ordinary
number. Implementations therefore always work with log-probabilities and
convert back with the log-sum-exp trick when a probability is needed.

--

## Mini-Exercise

A transaction comes from a **known** device, $x\_\text{dev} = 0$:
$\hat P(x\_\text{dev} = 0 \mid \text{fraud}) = 0.40$,
$\hat P(x\_\text{dev} = 0 \mid \text{honest}) = 0.90$.


<div class="q">

Does this step the log-odds up or down — and by more or less than the $+1.8$
of $x\_\text{dev} = 1$?

</div>



<div class="fragment">

**Down, and by less.** The ratio is $0.40/0.90 \approx 0.44 < 1$, so the step
is $\ln 0.44 \approx -0.81$. An absent binary attribute is evidence too — weak evidence
against.

</div>


Notes:
Answer: the likelihood ratio of the observation "no new device" is
$P(\text{no} \mid \text{fraud}) / P(\text{no} \mid \text{honest}) =
0.40/0.90 = 0.444$, below 1, so it speaks against fraud; $\ln 0.444 = -0.81$.
Its size is less than half of the $+1.79$ of a present new device: most
honest transactions and many frauds come from a known device, so its absence
says little. Every observed attribute enters the sum, present or absent; only
an unobserved attribute is left out (its factor is 1, its log 0).

--

## Takeaway


<div class="takeaway">

For two classes, **compare** instead of normalising: posterior odds = prior
odds × one **likelihood ratio** per attribute. In **log-odds** the evidence
**adds up** — a scorecard, one axis for prior, evidence and costs, a linear
score, and sums a computer can hold.

</div>

# Continuous Attributes


<div class="guiding-question">

**Guiding Question:** An amount of 1,250 € has probability zero. How does a
number enter Bayes' theorem — and what does a model of many numbers cost?

</div>


--

## A Density per Class

<div class="viz viz-lg" data-viz="ml/class-densities" data-steps="2"
 data-params='{"view": "fit", "query": 1250}'></div>


<div class="q">

What is the probability that a fraud is **exactly** 1,250.00 €?

</div>


Notes:
The histograms are the amounts of the training table, 100 frauds and 1,000
honest transactions (a sample of the honest ones), each class normalised to a
density so that both are visible. On a logarithmic axis the amounts of each
class are close to normal: the amount itself is log-normal, the second way
out of <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>. Step 1 fits one normal per
class to $\log\_{10}$ amount, with the class's mean and standard deviation as
parameters: honest $\hat μ = 1.55$ (median 35 €), $\hat σ = 0.45$; fraud
$\hat μ = 2.6$ (median 400 €), $\hat σ = 0.40$. Two numbers replace a
histogram's bins.

Answer to the question: zero. The amount is a continuous random variable, and
every single value has probability 0
(<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>); the curve is a
density, probability per unit of $x$. What Bayes' theorem needs is the ratio
of the two densities at the observed value (step 2): at 1,250 € the fraud
curve is about 190 times higher than the honest one.

--

<!-- .slide: class="smaller" -->

## Bayes' Theorem With Densities


<div class="c-definition">

For a continuous attribute, $p(x \mid y; θ)$ is a **density**. Bayes' theorem
is unchanged:
$$
P(y \mid x) = \frac{p(x \mid y; θ)\\, P(y)}{\sum\_{y'} p(x \mid y'; θ)\\, P(y')}
$$

</div>



<div class="grid-2">


<div class="column">

**Normal per class** on $x = \log\_{10}$ amount, $θ\_y = (μ\_y, σ\_y)$:
$$
p(x \mid y; θ) = \mathcal{N}(x;\ μ\_y, σ\_y^2) = \tfrac{1}{σ\_y \sqrt{2π}}\\, e^{-(x - μ\_y)^2 / 2σ\_y^2}
$$

</div>


<div class="column">

Fitted from each class's rows:

| class $y$ | $\hat μ\_y$ | $\hat σ\_y$ | median amount |
|---|---|---|---|
| fraud | 2.60 | 0.40 | 400 € |
| honest | 1.55 | 0.45 | 35 € |

</div>


</div>



<div class="fragment">

At 1,250 €, $x = \log\_{10} 1{,}250 = 3.10$:
$$
p(3.10 \mid \text{fraud}) = \mathcal{N}(3.10;\ 2.60, 0.40^2) = 0.46
\qquad
p(3.10 \mid \text{honest}) = \mathcal{N}(3.10;\ 1.55, 0.45^2) = 0.0024
$$
Prior odds times the likelihood ratio $0.46/0.0024 ≈ 190$:
$\\;\frac{1}{999} \cdot 190 = \frac{190}{999}$, so
$P(\text{fraud} \mid x) = \frac{190}{190 + 999} ≈ 16\\%$.

</div>


Notes:
As since Lecture 02, $p$ stands for a PMF or a density alike, and Bayes'
theorem reads the same for both. For reference, the limit argument behind it:
$P(x \le X \le x + Δ \mid y) = p(x \mid y)\\,Δ + o(Δ)$, so
$P(y \mid x \le X \le x + Δ) \to p(x \mid y) P(y) / \sum\_{y'} p(x \mid y')
P(y')$ as $Δ \to 0$. The conditional on the event $X = x$, which has
probability zero, is defined by this limit. The likelihood ratio of a
continuous attribute is therefore a ratio of densities, and it depends on the
observed value.

Numbers: $x = \log\_{10} 1{,}250 = 3.10$. Fraud: $z = (3.10 - 2.6)/0.40 = 1.24$,
density $0.46$. Honest: $z = (3.10 - 1.55)/0.45 = 3.44$, density $0.0024$.
Ratio $191$, posterior odds $191 : 999$, $P = 0.16$. The densities are taken
over $\log\_{10}$ amount; over the amount itself both carry the same factor
$1/(x \ln 10)$, which cancels in the ratio, so the scale on which the density
is written does not change the posterior.

The class's sample mean and standard deviation are the natural estimates
(<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>); they are the maximum
likelihood estimates of $μ\_y$ and $σ\_y$ (with divisor $n$ for $σ$, a
difference that vanishes for 100 rows), as <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Fitting the Parameters</a>
derives for a single parameter.

--

## Gaussian Naive Bayes

Naive Bayes with a **family per attribute** — a normal for each continuous attribute, a
Bernoulli for each binary one — all independent given the class:

$$
p(x \mid y; θ) = \prod\_{\text{continuous } j} \mathcal{N}(x\_j;\ μ\_{jy}, σ\_{jy}^2)
\cdot \prod\_{\text{binary } j} θ\_{jy}^{x\_j} (1 - θ\_{jy})^{1 - x\_j}
$$

| attribute of the transaction | fitted per class | likelihood ratio |
|---|---|---|
| amount 1,250 € | mean and spread of log amount | ≈ 190 |
| new device: yes | share of rows with the binary attribute | 6 |


<div class="fragment">

Prior odds times one ratio per attribute:
$\\;\frac{1}{999} \cdot 190 \cdot 6 = \frac{1{,}140}{999}$, so
$P(\text{fraud} \mid x) = \frac{1{,}140}{1{,}140 + 999} ≈ \mathbf{53\\%}$.
Fitting is still one pass over the table.

</div>


Notes:
The naive assumption of <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>
does not depend on the type of the attributes: each factor $p(x\_j \mid y)$ can
come from its own family, normal (or log-normal) for amounts and durations,
Bernoulli for binary attributes, categorical for the country. The classifier and its odds
form are unchanged; every attribute contributes its own likelihood ratio, for
a continuous attribute the ratio of two normal densities at the observed value. The model
with only normal factors is called Gaussian naive Bayes (scikit-learn
`GaussianNB`).

Parameter count: two numbers per continuous attribute and class (mean and
variance), one per binary attribute and class. In log-odds form a normal factor
contributes
$\log(σ\_{jh}/σ\_{jf}) - (x\_j - μ\_{jf})^2/2σ\_{jf}^2 + (x\_j - μ\_{jh})^2/2σ\_{jh}^2$,
a quadratic function of $x\_j$; with equal variances in both classes the
quadratic terms cancel and the contribution is linear in $x\_j$. With unequal
variances the ratio eventually falls again on the side of the narrower class:
for the amount, $σ\_\text{f} < σ\_\text{h}$, the likelihood ratio peaks
at about 3.5 million € and decreases beyond — far outside the data, where
$p(x)$ is negligible anyway.

Fitting: a mean and a spread per continuous attribute and class, a share per binary attribute and
class, all in one pass over the table.

Numbers: $191 \cdot 6 = 1{,}149$; posterior odds $1{,}149 : 999$,
$P = 1{,}149/2{,}148 = 0.53$. The amount alone gave 16%, the device attribute alone
$6/1{,}005 = 0.6\\%$.

--

## Multivariate perspective on Naive Bayes 

<div class="viz viz-xl" data-viz="ml/mvn-covariance" data-steps="1"></div>


<div class="q">

Gaussian naive Bayes gives the frauds two independent normals, one for the
amount, one for the distance. Written as **one** normal over the vector $x$,
what does its covariance matrix look like — and what do the data say?

</div>


Notes:
The 35 frauds of the training table of
<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>, in base-10 logarithms;
the ellipses are the 1σ and 2σ contours of the normal with the fitted means
(2.55 and 2.24, about 357 € and 173 km) and spreads (0.45 and 0.47).

Step 0, $ρ = 0$: the matrix is diagonal, the ellipse upright, and the 2-D
density is exactly the product of the two 1-D normals of "Gaussian Naive
Bayes". Step 1, the fitted $ρ = 0.78$: the off-diagonal entries become the
covariance $ρ σ\_1 σ\_2 = 0.78 \cdot 0.45 \cdot 0.47 = 0.17$, and the ellipse
tilts with the cloud — large amounts come with large distances. A negative
$ρ$ (slider) tilts it the other way. The upright ellipse misses the tilt the

now for continuous attributes.

<!-- .slide: class="smaller" -->

## The Multivariate Normal


<div class="c-definition">

**Definition.** For $x, μ \in \mathbb{R}^p$ and a $p \times p$ **covariance
matrix** $Σ$:
$$
\mathcal{N}(x;\ μ, Σ) = \frac{1}{(2π)^{p/2} \sqrt{\det Σ}}
\exp\\!\Big(-\tfrac12 (x - μ)^\top Σ^{-1} (x - μ)\Big)
$$

</div>


For $p = 2$, the frauds:
$$
x = \begin{pmatrix} \log \text{amount} \\\ \log \text{distance} \end{pmatrix}
\qquad
μ\_\text{f} = \begin{pmatrix} 2.55 \\\ 2.24 \end{pmatrix}
\qquad
Σ = \begin{pmatrix} σ\_1^2 & ρ\\, σ\_1 σ\_2 \\\ ρ\\, σ\_1 σ\_2 & σ\_2^2 \end{pmatrix},
\quad
Σ\_\text{f} = \begin{pmatrix} 0.45^2 & 0.17 \\\ 0.17 & 0.47^2 \end{pmatrix}
$$


<div class="fragment c-insight">

**Diagonal $Σ$** ($ρ = 0$): the density factorises,
$\mathcal{N}(x; μ, Σ) = \prod\_j \mathcal{N}(x\_j; μ\_j, σ\_j^2)$ — independent
attributes, i.e. Gaussian naive Bayes. Off-diagonal entries are the
dependences it drops.

</div>


Notes:
$μ$ has one mean per attribute, $Σ$ the squared spreads on its diagonal and the
covariances of <a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a> off it,
$\mathrm{cov}(X\_1, X\_2) = ρ σ\_1 σ\_2$. The fraud values: $0.78 \cdot 0.45
\cdot 0.47 = 0.17$. The honest class has $μ\_\text{h} = (1.65, 1.07)$ (about
44 € at 12 km), spreads 0.45 and 0.54 and correlation 0.27.

In one dimension the formula is the normal density of
<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>, with
$(x - μ)^\top Σ^{-1} (x - μ) = (x - μ)^2/σ^2$. In general the exponent is
minus one half of the squared Mahalanobis distance of $x$ from $μ$; its level
sets are the ellipses of the figure. For a diagonal $Σ$, $Σ^{-1}$ is diagonal
with entries $1/σ\_j^2$ and $\det Σ = \prod\_j σ\_j^2$, so the exponent is the sum
$\sum\_j (x\_j - μ\_j)^2/σ\_j^2$ and the density is the product of $p$ normals.
For normal distributions, uncorrelated means independent; in general it does
not. $Σ$ is symmetric and must be positive definite; with fewer rows than
attributes in a class its estimate is singular, which is one reason to share
or to restrict it.

--

<!-- .slide: class="smaller" -->

## Two Normals, One per Class

<div class="viz viz-lg" data-viz="ml/generative-2d" data-params='{"view": "generative", "startStep": 2, "prior": 0.33}'></div>


<div class="grid-2">


<div class="c-definition">

**Model.** The class, then $x$ from **its class's normal**:
$$
y \sim P(y), \qquad x \mid y \sim \mathcal{N}(μ\_y, Σ\_y)
$$
$θ = \big(P(\text{fraud}),\ μ\_\text{f}, Σ\_\text{f},\ μ\_\text{h}, Σ\_\text{h}\big)$

</div>


<div class="c-important">

**Classifier.** Bayes' theorem with the two densities:
$$
P(\text{fraud} \mid x) = \frac{\mathcal{N}(x;\ μ\_\text{f}, Σ\_\text{f})\\, P(\text{fraud})}{\sum\_{y} \mathcal{N}(x;\ μ\_y, Σ\_y)\\, P(y)}
$$

</div>


</div>


Notes:
The figure is the generative classifier of
<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>, now with its densities
named: left the two class-conditional normals $p(x \mid \text{honest})$ and
$p(x \mid \text{fraud})$ as heat maps, the prior between them, right the
posterior for every $x$ with its 0.5 boundary (violet). The prior is set to
the training share of fraud, 35 of 105, as in the fitted models of the next
slides; the slider changes it. "Draw 20 transactions" runs the model forwards:
a class from $P(y)$, then a point from that class's normal.

Fitted to the 98 transactions, in base-10 logarithms: fraud
$μ\_\text{f} = (2.55, 2.24)$ (about 357 € at 173 km), spreads 0.45 and 0.47,
correlation 0.78; honest $μ\_\text{h} = (1.65, 1.07)$ (about 44 € at 12 km),
spreads 0.45 and 0.54, correlation 0.27. Each class's mean vector and
covariance matrix are the mean and the covariance of its rows, the
two-dimensional counterpart of "Bayes' Theorem With Densities"; the prior is
the class share. The classifier is the one-attribute one with the univariate
normal replaced by the multivariate one: the normaliser
$\sum\_y \mathcal{N}(x; μ\_y, Σ\_y) P(y)$ is $p(x)$, the density of the
transaction under the whole model.

The open choice is $Σ\_y$: diagonal (Gaussian naive Bayes), full per class, or
one shared by both classes. The next slides count its parameters and show the
boundary each choice gives.

--

## Quadratic, Not Exponential


<div class="q">

For $p = 30$ continuous attributes, how many parameters does one Gaussian per class need —
compared to counting in bins?

</div>



<div class="fragment">

| model of $p(x \mid y)$ for $p$ continuous attributes | numbers per class | $p = 2$ | $p = 30$ |
|---|---|---|---|
| counts, 10 bins per attribute | $10^p - 1$ | 99 | $10^{30}$ |
| Gaussian naive Bayes | $2p$ | 4 | 60 |
| one Gaussian per class | $p + p(p + 1)/2$ | 5 | 495 |

</div>



<div class="fragment c-insight">

The family alone defeats the explosion: **quadratic** in $p$, not exponential —
and the correlations stay in the model.

</div>


Notes:
Counts: a mean vector has $p$ entries, a symmetric $p \times p$ matrix
$p(p + 1)/2$ free ones ($p$ variances and $p(p - 1)/2$ covariances). For
$p = 2$: 2 means, 2 spreads, 1 covariance, 5 numbers, as in the example. For
$p = 30$: $30 + 465 = 495$ per class. Binning instead needs a full joint over
$10^{30}$ cells (<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>). Gaussian naive
Bayes is the special case of a diagonal $Σ$; a shared $Σ$ needs $p$ numbers
per class plus $p(p + 1)/2$ once.

The price of the family is its shape: one ellipse per class, symmetric, with
a single peak. Where the data are shaped differently, the model is wrong in a
way no amount of data repairs (the last slide of the module).

--

<!-- .slide: class="smaller" -->

## The Log-Odds of Two Normals


<div class="q">

One attribute $x$, a normal per class. What does its log likelihood ratio look
like as a function of $x$?

</div>



<div class="grid-2 fragment">


<div class="column">

The log of a normal is a **quadratic** in $x$ — take the log, expand the square:

$$
\begin{aligned}
\mathcal{N}(x;\ μ, σ^2) &= \frac{1}{σ\sqrt{2π}}\\, e^{-(x - μ)^2 / 2σ^2}
\\\ \log \mathcal{N}(x;\ μ, σ^2) &= -\frac{(x - μ)^2}{2σ^2} - \log\big(σ\sqrt{2π}\big)
\\\ &= -\frac{x^2}{2σ^2} + \frac{μ}{σ^2}\\, x - \frac{μ^2}{2σ^2} - \log\big(σ\sqrt{2π}\big)
\end{aligned}
$$

</div>


<div class="column">

Name the coefficients per class $y$; the difference keeps the form:

$$
\begin{aligned}
\log \mathcal{N}(x;\ μ\_y, σ\_y^2) &= a\_y x^2 + w\_y x + c\_y,
\quad a\_y = -\tfrac{1}{2σ\_y^2},\ \ w\_y = \tfrac{μ\_y}{σ\_y^2}
\\\ \log \frac{\mathcal{N}(x;\ μ\_\text{f}, σ\_\text{f}^2)}{\mathcal{N}(x;\ μ\_\text{h}, σ\_\text{h}^2)}
&= \underbrace{(a\_\text{f} - a\_\text{h})}\_{a}\\, x^2 + \underbrace{(w\_\text{f} - w\_\text{h})}\_{w}\\, x + \underbrace{(c\_\text{f} - c\_\text{h})}\_{c}
\end{aligned}
$$

</div>


</div>



<div class="grid-2">


<div class="fragment c-example">

Log amount, fitted $2.60, 0.40$ (fraud), $1.55, 0.45$ (honest):
$a = -0.66$, $w = 8.60$, $c = -15.08$. At $x = 3.10$:
$-0.66 \cdot 3.10^2 + 8.60 \cdot 3.10 - 15.08 = 5.27$, and
$e^{5.27} ≈ 190$ — the likelihood ratio of the densities, as a log.

</div>


<div class="fragment c-insight">

The $x^2$ term comes from the square in the exponent. It **cancels** when both
classes have the same spread ($a = 0$): the log-odds are then **linear** in $x$.

</div>


</div>


Notes:
The per-class coefficients are read off the expanded log density:
$a\_y = -1/2σ\_y^2$, $w\_y = μ\_y/σ\_y^2$ and
$c\_y = -μ\_y^2/2σ\_y^2 - \log(σ\_y\sqrt{2π})$. Their differences give
$a = 1/2σ\_\text{h}^2 - 1/2σ\_\text{f}^2$, $w = μ\_\text{f}/σ\_\text{f}^2 -
μ\_\text{h}/σ\_\text{h}^2$ and the constant $c = μ\_\text{h}^2/2σ\_\text{h}^2 -
μ\_\text{f}^2/2σ\_\text{f}^2 + \log(σ\_\text{h}/σ\_\text{f})$; the $\sqrt{2π}$
cancels in the difference.
Arithmetic for the amount: $a = 1/(2 \cdot 0.45^2) - 1/(2 \cdot 0.40^2) =
2.469 - 3.125 = -0.656$; $w = 2.60/0.16 - 1.55/0.2025 = 16.25 - 7.654 = 8.596$;
$c = 5.932 - 21.125 + 0.118 = -15.075$. At $x = 3.10$: $-6.303 + 26.647 -
15.075 = 5.269$, $e^{5.269} = 194$; the densities themselves are $0.4566$ and
$0.002352$, ratio 194, which "Bayes' Theorem With Densities" rounds to
$0.46 / 0.0024 ≈ 190$.

$a < 0$ because fraud has the smaller spread: far out on either side the
narrower normal falls faster, so the ratio peaks and decreases again (at
$x = -w/2a = 6.55$, about 3.5 million €, far outside the data). Added to the
log prior odds, this is the log-odds of a one-attribute classifier; the
decision boundary $a x^2 + w x + c + \log \text{prior odds} = 0$ has up to two
roots, so the region decided as fraud can be an interval.

--

## A Diagonal Covariance per Class


<div class="grid-3-2">


<div class="column">

<div class="viz viz-full" data-viz="ml/generative-2d" data-params='{"view": "fit", "model": "naive", "resample": true}'></div>

</div>


<div class="column middle">


<div class="q">

Each class its own **diagonal** $Σ$. Can upright ellipses follow the fraud
tilt?

</div>



<div class="fragment">

No. One log ratio of two normals per attribute, each in $x\_j$ alone:

$$
\begin{aligned}
\text{log-odds} &= \log \text{prior odds}
\\\ &\quad + \textstyle\sum\_j \big(a\_j x\_j^2 + w\_j x\_j + c\_j\big)
\end{aligned}
$$

</div>


</div>


</div>



<div class="fragment c-note">

**Gaussian naive Bayes**: the boundary bends where the spreads differ
($a\_j \neq 0$), never with the tilt — no term $x\_1 x\_2$. **Replace 10 rows**:
where the transactions are, the boundary barely moves — each of its 4 numbers
per class is an average over the whole class.

</div>


Notes:
The 98 labelled transactions of <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>,
now with a normal fitted to each class's rows; the ellipses are the 1σ and 2σ
contours, the violet line is where the fitted posterior is 0.5 (the prior is
the training share of fraud), and the tinted region is decided as fraud. The
choice control switches to the other two covariance models of the next slides.

Naive: amount and distance independent within each class, so each class gets
a diagonal covariance and its ellipses stay upright; the model is the
two-attribute version of "Gaussian Naive Bayes".

The button "Replace 10 rows" swaps ten random rows for fresh draws from the
same two classes (ringed) and refits; the dashed line is the boundary of the
original table; the figure shows the fitted covariance matrices of both
classes (in squared $\log\_{10}$ units), with the off-diagonal entries fixed at 0.
The naive boundary moves little where the transactions lie: a mean or a
variance is an average over all rows of a class, so ten changed rows of 98
shift it by a fraction of its spread. Far from the data the boundary can swing
visibly, but almost no transaction falls there. Measured on transactions drawn
from the same two classes, averaged over 200 random replacements of 10 rows,
0.5% change their decision (full $Σ$ per class 0.8%, shared $Σ$ 0.5%); with 30
rows replaced, 0.8% (1.2%, 0.9%). With two attributes the models need 4 and 5
numbers per class, the shared one 2 per class plus 3 once; with 30 attributes the full model's 495 per
class rest on the same rows, and its estimates become far less stable.
"Original table" restores the start. Each attribute contributes
$\log \mathcal{N}(x\_j; μ\_{j,\text{f}}, σ\_{j,\text{f}}^2) - \log
\mathcal{N}(x\_j; μ\_{j,\text{h}}, σ\_{j,\text{h}}^2) = a\_j x\_j^2 + w\_j x\_j + c\_j$,
with $a\_j$, $w\_j$ and $c\_j$ as in "The Log-Odds of Two Normals", computed from
attribute $j$'s means and spreads. There is no term
$x\_1 x\_2$, which is what a tilt would need. With equal spreads in both classes
$a\_j = 0$ and the naive boundary is a straight line as well.

## One Covariance per Class: A Curved Boundary


<div class="grid-3-2">


<div class="column">

<div class="viz viz-full" data-viz="ml/generative-2d" data-params='{"view": "fit", "model": "full"}'></div>

</div>


<div class="column middle">

A full $Σ$ per class keeps the correlation: the fraud ellipse **tilts** with
its cloud. The log-odds keep a quadratic term, now with $x\_1 x\_2$:
$$
\begin{aligned}
\text{log-odds} &= x^\top A\\, x + w^\top x + b
\\\ A &= -\tfrac12 \big(Σ\_\text{f}^{-1} - Σ\_\text{h}^{-1}\big)
\end{aligned}
$$

</div>


</div>



<div class="c-note">

A **quadratic** boundary — **quadratic discriminant analysis** (QDA). Five
numbers per class here: 2 means, 2 spreads, 1 correlation.

</div>


Notes:
One covariance per class, estimated from the class's rows, keeps the
within-class correlation (0.78 in fraud in this sample). Derivation:
$\log \mathcal{N}(x; μ, Σ) = -\tfrac12 x^\top Σ^{-1} x + μ^\top Σ^{-1} x -
\tfrac12 μ^\top Σ^{-1} μ - \tfrac12 \log \det Σ + \text{const}$. In the
difference of the two classes the quadratic forms do not cancel when the
covariances differ, so the boundary $\\{x : \text{log-odds} = 0\\}$ is a conic
section (ellipse, parabola or hyperbola), with
$w = Σ\_\text{f}^{-1} μ\_\text{f} - Σ\_\text{h}^{-1} μ\_\text{h}$. The price is a
covariance matrix per class, $p(p + 1)/2$ numbers each, estimated from that
class's rows only — for 100 frauds and 30 attributes, 465 numbers from 100
rows, which is not estimable without restriction.

--

## A Shared Covariance Gives a Linear Boundary


<div class="grid-3-2">


<div class="column">

<div class="viz viz-full" data-viz="ml/generative-2d" data-params='{"view": "fit", "model": "shared"}'></div>

</div>


<div class="column middle">

One $Σ$ for both classes, from all rows: both ellipses have the **same
shape**, and the quadratic term cancels:
$$
\text{log-odds} = \underbrace{(μ\_\text{f} - μ\_\text{h})^\top Σ^{-1}}\_{w^\top}\\, x + b
$$

</div>


</div>



<div class="c-insight">

A straight boundary — **linear discriminant analysis** (LDA). Its posterior
$1/(1 + e^{-(w^\top x + b)})$ is the form logistic regression
(<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>) fits **directly**,
without modelling $x$.

</div>


Notes:
One covariance for both classes, estimated from all rows (the pooled
within-class covariance); both ellipses have the same shape and the boundary
is a straight line.

Derivation. With $Σ$ shared, the term $x^\top Σ^{-1} x$ and the
$\log \det Σ$ constant cancel in the difference of the two classes' logs,
leaving $w = Σ^{-1}(μ\_\text{f} - μ\_\text{h})$ and
$b = \tfrac12 μ\_\text{h}^\top Σ^{-1} μ\_\text{h} - \tfrac12 μ\_\text{f}^\top
Σ^{-1} μ\_\text{f} + \log \frac{P(\text{fraud})}{P(\text{honest})}$. The prior
enters only the offset $b$: changing the base rate shifts the line parallel to
itself. The three cases side by side: a diagonal $Σ$ per class (Gaussian naive
Bayes) and a full $Σ$ per class (QDA) give quadratic boundaries, a shared $Σ$
(LDA) a linear one.

Posterior odds $e^{a}$ correspond to the probability $1/(1 + e^{-a})$, the
logistic (sigmoid) function of "Evidence Adds Up"
(<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>). This is Bishop, *Pattern
Recognition and Machine Learning*, §4.2.1. Logistic regression fits $w$ and
$b$ directly by maximising the likelihood of the labels; linear discriminant
analysis obtains them from the class means, the shared covariance and the
prior. The two estimates differ whenever the Gaussian assumption is wrong, the
same contrast as naive Bayes against logistic regression for binary attributes
(<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>).

--

## Three Covariance Models

Every model has a mean vector $μ\_y$ per class (2 numbers) and the prior
$P(\text{fraud})$ (1 number); they differ only in the covariance matrices.
$σ\_{12} = ρ\\, σ\_1 σ\_2$ is the covariance of the two attributes.

| model | covariance matrices | entries | parameters, $p = 2$ | $p = 30$ | boundary |
|---|---|---|---|---|---|
| Gaussian naive Bayes | $Σ\_y = \begin{pmatrix} σ\_{1y}^2 & 0 \\\ 0 & σ\_{2y}^2 \end{pmatrix}$, one per class | 2 per class | $2 \cdot (2 + 2) + 1 = 9$ | 121 | curved, no tilt |
| QDA | $Σ\_y = \begin{pmatrix} σ\_{1y}^2 & σ\_{12,y} \\\ σ\_{12,y} & σ\_{2y}^2 \end{pmatrix}$, one per class | 3 per class | $2 \cdot (2 + 3) + 1 = 11$ | 991 | quadratic |
| LDA | $Σ = \begin{pmatrix} σ\_1^2 & σ\_{12} \\\ σ\_{12} & σ\_2^2 \end{pmatrix}$, shared | 3 once | $2 \cdot 2 + 3 + 1 = 8$ | 526 | straight |


<div class="fragment c-insight">

QDA is the general case; the other two **restrict** it. Naive Bayes sets the
off-diagonal entries to 0, LDA sets $Σ\_\text{f} = Σ\_\text{h}$. Fewer numbers,
a simpler boundary, less data needed — and less of the data's shape kept.

</div>


Notes:
Counts in general, for $p$ continuous attributes and two classes: every model
has $2p$ means and 1 prior. Gaussian naive Bayes adds $p$ variances per class,
$2p + 2p + 1 = 4p + 1$; QDA adds $p(p + 1)/2$ entries per class ($p$ variances,
$p(p - 1)/2$ covariances), $2p + p(p + 1) + 1$; LDA adds them once,
$2p + p(p + 1)/2 + 1$. For $p = 30$: $121$, $60 + 930 + 1 = 991$ and
$60 + 465 + 1 = 526$. The matrices are symmetric, so $σ\_{12}$ appears twice but
counts once. The fitted values for the 98 transactions are shown in the figure
of the previous three slides.

The three models are nested: a diagonal $Σ$ per class and a shared full $Σ$
are both special cases of a full $Σ$ per class. Both restrictions together, one
shared diagonal $Σ$, give naive Bayes with equal spreads in both classes, whose
log-odds are linear as well ($a\_j = 0$). Which to use is a bias–variance
choice: QDA needs $p(p + 1)/2$ covariance entries per class from that class's
rows alone (465 for $p = 30$, from 100 frauds), LDA estimates one $Σ$ from all
rows, naive Bayes only $p$ spreads per class. With few rows in the rare class,
the restricted models are often better despite their wrong assumption — the
same trade as naive Bayes for binary attributes.

--

## When One Gaussian Is Not Enough

<div class="viz viz-lg" data-viz="ml/generative-2d" data-steps="1"
 data-params='{"view": "fit", "fraud": "two"}'></div>


<div class="q">

Fraud comes in two patterns. Where does a single normal put its mean — and
what does that do to the boundary?

</div>


Notes:
Two kinds of fraud in one class: card testing, where stolen card data are
tried with small amounts (around 9 €) far from the card holder's home, and
large purchases (around 900 €) close to home with a stolen card. One normal
for the fraud class has its mean between the two patterns, at an amount and
distance where almost no fraud occurs, and a wide, tilted ellipse that spreads
probability over the empty space between them. Its density is too low in both
patterns and too high in the gap; the boundary follows the ellipse, not the
data.

Step 1 fits a mixture of two normals for fraud,
$p(x \mid \text{fraud}) = π\_1 \mathcal{N}(x; μ\_1, Σ\_1) + π\_2 \mathcal{N}(x;
μ\_2, Σ\_2)$, with $π\_k$ the shares of the patterns. Here each row's pattern is
known to the figure and the mixture is fitted pattern by pattern, by means and
covariances. In real data the pattern is not recorded: it is a hidden
variable, and fitting the mixture without it is the EM algorithm of
<a href="/courses/probabilistic-machine-learning/lecture/l07-probabilistic-algorithms/">Lecture 07</a>. A model shape that is wrong
does not improve with more rows; only a richer family does.

--

## Mini-Exercise

Ten numeric attributes, two classes.


<div class="q">

How many numbers does Gaussian naive Bayes need — and one full Gaussian per
class? Count the prior too.

</div>



<div class="fragment">

**41 and 131.** Naive: $10 + 10 = 20$ per class, $2 \cdot 20 + 1$. Full:
$10 + 55 = 65$ per class, $2 \cdot 65 + 1$.

</div>


Notes:
Gaussian naive Bayes: per class 10 means and 10 variances, 20 numbers; two
classes 40; the prior $P(\text{fraud})$ one more: 41. One Gaussian per class:
10 means and a symmetric $10 \times 10$ covariance matrix with
$10 \cdot 11/2 = 55$ free entries, 65 per class, 130 for both, 131 with the
prior. A shared covariance needs $2 \cdot 10 + 55 + 1 = 76$. Binned into 10
values each, the full joint would need $10^{10} - 1$ per class.

--

## Takeaway


<div class="takeaway">

A continuous attribute enters through a **density** per class; Bayes' theorem needs only the
ratio of the two densities. **Gaussian naive Bayes** fits a mean and a spread
per attribute and class; **one Gaussian per class** keeps the correlations at
a quadratic, not exponential, cost; a **shared covariance** makes the boundary
linear. One Gaussian cannot follow a class with two patterns — a **mixture**
can.

</div>

# Fitting the Parameters: Posterior, MLE and MAP


<div class="guiding-question">

**Guiding Question:** Naive Bayes fitted itself by counting, and a count of
zero vetoed everything. Why is counting the right update — and what does a
share drop that a posterior keeps?

</div>


--

## From a Known to an Unknown Parameter


<div class="q">

The classifier treated $θ$ as known. Can Bayes' theorem also estimate $θ$?

</div>



<div class="fragment">


<div class="grid-2-3">


<div class="card muted">

<span class="eyebrow">Classify: parameter fixed</span>

$$
P(y \mid x; θ) \propto p(x \mid y; θ)\\; P(y; θ)
$$

Unknown: $y$. Evidence: one transaction $x$.

</div>


<div class="c-important">

<span class="eyebrow">Learn: parameter unknown</span>

$$
p(θ \mid D) \propto p(D \mid θ)\\; p(θ)
$$

Unknown: $θ$. Evidence: the training data $D$.

</div>


</div>


</div>



<div class="fragment c-insight">

Same theorem, $θ$ as the hypothesis: it needs a **prior** $p(θ)$, and the
semicolon becomes a bar. For $θ = P(x\_\text{dev} = 1 \mid \text{fraud})$ the
data are the fraud rows' device attributes $d\_1, \ldots, d\_n$ — read one at a time.

</div>


Notes:
"Parameters $θ$" in <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>
wrote $p(x \mid y; θ)$ with a semicolon, $θ$ a fixed unknown number, and
announced that the bar returns once $θ$ gets a distribution of its own; this is
that step. The classifiers so far plug the fitted shares, means and spreads
into Bayes' theorem as if they were the true $θ$. Learning treats $θ$ as the
unknown instead: the prior $p(θ)$ states what is believed about $θ$ before any
data, the likelihood $p(D \mid θ)$ is the probability of the training data
under the model, now read as a function of $θ$, and the posterior
$p(θ \mid D)$ is the belief about $θ$ after the data.

Which data inform which parameter follows from the model. $θ = P(x\_\text{dev} =
1 \mid \text{fraud})$ is a parameter of $p(x \mid \text{fraud})$, so only the
fraud rows carry information about it, and of those only the device attribute. The
observations are therefore $d\_i = x\_{i,\text{dev}}$, the device attribute of the
$i$-th fraud row, and $D = (d\_1, \ldots, d\_n)$ with $n = 100$. Each of the nine
parameters of "Counts to Shares" is learned from its own part of the table in
the same way.

--

## One Fraud Row at a Time


<div class="q">

No data yet: every $θ = P(x\_\text{dev} = 1 \mid \text{fraud})$ is equally
plausible. A fraud from a new device arrives: which $θ$ gain, and how much?

</div>



<div class="grid-3-2">


<div class="column">

<div class="viz viz-full" data-viz="math/bayes-updating" data-steps="6"
 data-params='{"mode": "factor", "observations": [1, 1, 0, 1, 0, 1], "symbols": ["✓", "✗"], "names": ["new device", "other device"], "xLabel": "θ = P(new device | fraud)"}'></div>

</div>


<div class="column middle">


<div class="fragment">

Each $θ$ is multiplied by the probability of the row: $θ$ or $1 - θ$.

After $h$ new and $m$ other devices: $θ^{h} (1 - θ)^{m}$.

</div>



<div class="fragment c-insight">

The exponents **are the counts**; each belief (prior) is the start for the next row (posterior).

</div>


</div>


</div>


Notes:
The figure: grey is the belief before the row, the dotted teal line the factor
of the row (right axis), navy the belief after it, rescaled to area 1. A new
device multiplies by $θ$, so values of $θ$ near 1 gain most and $θ = 0$ is ruled
out; another device multiplies by $1 - θ$ and rules out $θ = 1$. The six rows
end at $θ^4 (1 - θ)^2$, peaked at $4/6$.

The curve does not narrow at every row: a row that contradicts the current
belief can widen it (after ✓ ✓ the ✗ moves the peak from 1 to 2/3 and widens
the curve). Only on average over the possible rows does the spread decrease;
the overall narrowing is the epistemic uncertainty shrinking
(<a href="/courses/probabilistic-machine-learning/lecture/l01-introduction/">Lecture 01</a>).

The belief after $h$ new and $m$ other devices among $n = h + m$ frauds is
$θ^h (1 - θ)^m$, whose peak is the count share $h/n$ and whose mean is
Laplace's $(h + 1)/(n + 2)$: 61/102 for the 60 of 100 frauds of "Counts to
Shares". A 101st fraud from a new device turns $θ^{60}(1 - θ)^{40}$ into
$θ^{61}(1 - θ)^{40}$, so nothing has to be counted again. A multiplication does
not depend on the order of its factors, so the order of the rows does not
matter either. A deployed model can learn from each newly labelled transaction
without keeping the training table: per binary attribute and class it stores two counts.

--

<!-- .slide: class="smaller" -->

## Prior, Likelihood and Posterior, Row by Row

<div class="viz eq-explain" data-viz="core/equation-explain" data-steps="4"
 data-params='{"labels": ["posterior — belief about θ after d₁, …, dᵢ", "likelihood of dᵢ — θ if dᵢ = 1, 1 − θ if dᵢ = 0", "prior for dᵢ — the posterior after dᵢ₋₁", "evidence — normalises, does not depend on θ"]}'>

$$
\eqa{p(θ \mid d\_1, \ldots, d\_i)} = \frac{\eqb{p(d\_i \mid θ)} \cdot \eqc{p(θ \mid d\_1, \ldots, d\_{i-1})}}{\eqd{p(d\_i \mid d\_1, \ldots, d\_{i-1})}}
$$

</div>


<div class="c-definition fragment">

- **Data:** $D = (d\_1, \ldots, d\_n)$; here $d\_i = x\_{i,\text{dev}} \in \\{0, 1\\}$,
  the device attribute of the $i$-th fraud row.
- **Model:** each $d\_i$ is **Bernoulli**,
  $p(d\_i \mid θ) = θ^{d\_i} (1 - θ)^{1 - d\_i}$.
- **Assumption:** the rows are **i.i.d. given $θ$**,
  $p(d\_i \mid θ, d\_1, \ldots, d\_{i-1}) = p(d\_i \mid θ)$.

</div>


Notes:
This is Bayes' theorem of <a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>
with the parameter $θ$ in place of the hypothesis and one row as the evidence:
**sequential Bayesian updating**. The prior and posterior here are
distributions over a parameter, not the class prior $P(y)$ and class posterior
$P(y \mid x)$ of the classifier: the same theorem, a different unknown. The
prior for row $i$ is the posterior after the rows before it; for row 1 it is
the flat prior of the start. The likelihood is read as a function of $θ$ with
the row fixed: $θ$ for $d\_i = 1$, $1 - θ$ for $d\_i = 0$, the factor drawn on
the previous slide.

Derivation. By Bayes' theorem on all $i$ rows,
$p(θ \mid d\_1, \ldots, d\_i) \propto p(d\_1, \ldots, d\_i \mid θ)\\, p(θ)$. The
chain rule splits the likelihood into
$p(d\_i \mid θ, d\_1, \ldots, d\_{i-1}) \cdot p(d\_1, \ldots, d\_{i-1} \mid θ)$.
Independence given $θ$ drops the earlier rows from the first factor, and the
second factor times $p(θ)$ is, up to a constant, the posterior after $i - 1$
rows. Applied to all $n$ rows: $p(θ \mid D) \propto p(θ) \prod\_i p(d\_i \mid θ)$,
the same as one update on all the data, in any order.

The evidence $p(d\_i \mid d\_1, \ldots, d\_{i-1}) = \int\_0^1 p(d\_i \mid θ)\\,
p(θ \mid d\_1, \ldots, d\_{i-1})\\, dθ$ does not depend on $θ$ and only rescales
the curve to area 1. It is the probability of the next row given the earlier
ones, the posterior predictive; for $d\_i = 1$ it is the mean of the current
belief, the probability that the next fraud comes from a new device.

Independent given $θ$ is not independent: once $θ$ is known, an earlier row
says nothing about the next, but without knowing $θ$ every row shifts the
belief about $θ$ and with it the expectation for the next row; this dependence
is what learning uses. Identically distributed: every row has the same $θ$. The
condition is violated by duplicated rows or several transactions of one fraud
case, which would be counted as separate evidence
(<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>). It is the same kind of
assumption as the naive one, about rows given $θ$ instead of attributes given
the class.

--

## Why the Update Is Counting


<div class="grid-2">


<div class="card">

### Sequential updating
Holds for **any** model of the rows. Needs Bayes' theorem and rows
**conditionally independent given $θ$**. Gives: the posterior after row $i$ is
the prior for row $i + 1$.

</div>


<div class="card fragment">

### Counting
Holds for the **Bernoulli** model. Its likelihood depends on the rows only
through the counts, and the belief keeps its form $θ^{h} (1 - θ)^{m}$: a row
adds 1 to $h$ or $m$.

</div>


</div>



<div class="fragment c-example">

60 of 100 frauds from a new device give $θ^{60} (1 - θ)^{40}$; the 101st,
$θ^{61} (1 - θ)^{40}$. A normal amount keeps $n$, $\sum x$, $\sum x^2$ instead.

</div>


Notes:
The two principles are independent. Sequential updating follows from Bayes'
theorem and conditional independence alone; it holds for any likelihood, also
one for which the belief has no closed form and must be kept as a whole curve.
That the update reduces to counting follows from the Bernoulli likelihood. The
likelihood of all $n$ rows is
$\prod\_i θ^{d\_i} (1 - θ)^{1 - d\_i} = θ^{h} (1 - θ)^{m}$ with
$h = \sum\_i d\_i$ and $m = n - h$: the order of the rows and everything but
the two counts drop out. And because the flat prior, and every belief of the
form $θ^{h} (1 - θ)^{m}$, multiplied by $θ$ or $1 - θ$ stays of that form, the
belief is described by two numbers at every step. The next two slides name
both facts: the curve is a Beta distribution, a prior whose posterior stays of
its form is conjugate, and the counts are a sufficient statistic.

For a categorical attribute with $k$ values the same holds with $k$ counts.
For a normal attribute the sufficient statistics are $n$, $\sum x$ and
$\sum x^2$, from which mean and spread follow; the fitted normals of
<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a> can therefore also be updated
row by row.

--

## A Prior That Behaves Like Counts


<div class="c-definition">

**Beta prior.** $p(\theta) \propto \theta^{a-1}(1-\theta)^{b-1}$ on $[0, 1]$,
written $\mathrm{Beta}(a, b)$. $\mathrm{Beta}(1,1)$ is flat: every $\theta$
equally plausible.

</div>


Multiply by the likelihood $\theta^{h}(1-\theta)^{m}$ of $h$ ones and $m$ zeros:

$$
p(\theta \mid D) \propto \theta^{a+h-1}(1-\theta)^{b+m-1}
\quad\Longrightarrow\quad
\theta \mid D \sim \mathrm{Beta}(a + h,\enspace  b + m)
$$


<div class="c-insight">

The update is **adding counts**: $a$ and $b$ act like ones and zeros seen
before the data. The flat start of the fraud rows is $\mathrm{Beta}(1, 1)$, its
belief $θ^{h}(1 - θ)^{m}$ is $\mathrm{Beta}(h + 1,\ m + 1)$.

</div>


Notes:
The normalising constant of $\mathrm{Beta}(a, b)$ is
$B(a, b) = \Gamma(a)\Gamma(b)/\Gamma(a + b)$, but it never has to be computed
for the update: prior and likelihood are both of the form
$\theta^{\cdot}(1 - \theta)^{\cdot}$, so their product is again of that form
and the exponents add. The posterior is identified by its shape alone.

The parameters act as pseudo-counts: $\mathrm{Beta}(a, b)$ behaves like
$a - 1$ ones and $b - 1$ zeros already seen in terms of the peak, or $a$ and
$b$ in terms of the mean $a/(a + b)$. A prior with $a + b = 2$ is outweighed by
1,000 real observations. Conjugate priors exist for other likelihoods too,
e.g. the Dirichlet for categorical data and the normal for the mean of normal
data with known variance.

--

<!-- .slide: class="smaller" -->

## Conjugate Prior and Sufficient Statistic


<div class="c-definition">

- A family of priors is **conjugate** to a likelihood if, for every data set,
  the posterior lies in the same family.
- A statistic $T(D)$ is **sufficient** for $\theta$ if the likelihood depends
  on the data only through it: $p(D \mid \theta) = g\big(T(D), \theta\big)\\, k(D)$.

</div>



<div class="fragment c-important">

**Theorem.** For $n$ Bernoulli observations with $h$ ones and $m = n - h$
zeros, $T(D) = (h, m)$ is sufficient, and the Beta family is conjugate:
$\mathrm{Beta}(a, b) \to \mathrm{Beta}(a + h,\ b + m)$.

</div>



<div class="fragment">

| the fraud rows, informally | formally |
|---|---|
| every $θ$ equally plausible | prior $\mathrm{Beta}(1, 1)$ |
| belief $θ^{h} (1 - θ)^{m}$; a row adds 1 to $h$ or $m$ | posterior $\mathrm{Beta}(h + 1,\ m + 1)$, conjugate |
| the counts are all the data contribute | $(h, m)$ is sufficient |

</div>


Notes:
Proof of the theorem. The likelihood of $n$ independent Bernoulli observations
is $p(D \mid \theta) = \prod\_i \theta^{d\_i} (1 - \theta)^{1 - d\_i} =
\theta^{h} (1 - \theta)^{m}$, so $g(T, \theta) = \theta^{h}(1 - \theta)^{m}$ and
$k(D) = 1$: $(h, m)$ is sufficient. Multiplied by a $\mathrm{Beta}(a, b)$
density, $\theta^{a-1}(1 - \theta)^{b-1}$, it gives
$\theta^{a+h-1}(1 - \theta)^{b+m-1}$, the shape of $\mathrm{Beta}(a + h, b + m)$;
the normalising constant follows from the shape. One observation adds 1 to $a$
or $b$, which is the sequential update of "One Fraud Row at a Time".

The factorisation criterion $p(D \mid \theta) = g(T(D), \theta)\\, k(D)$ is the
Fisher–Neyman factorisation theorem; equivalently, the posterior depends on the
data only through $T(D)$, for every prior. Sufficiency is a property of the
likelihood; conjugacy is a property of a prior family relative to a likelihood.
They go together here: a fixed number of sufficient statistics is what lets a
conjugate family describe every posterior with a fixed number of parameters.
Other conjugate pairs: Dirichlet and categorical (sufficient: the $k$ counts),
normal and the mean of a normal with known variance (sufficient: $n$ and
$\sum\_i d\_i$).

The table collects the previous slides: the flat prior is $\mathrm{Beta}(1, 1)$;
the belief $\theta^{h}(1 - \theta)^{m}$ after $h$ new and $m$ other devices
among the fraud rows is $\mathrm{Beta}(h + 1, m + 1)$; its peak $h/(h + m)$ is
the count share, its mean $(h + 1)/(n + 2)$ the Laplace estimate of
<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Naive Bayes</a>.

## An Unknown Number, Ten Observations

With 100 frauds the belief is narrow. With few rows, *how sure* matters: a new
feature went live, and of the first **10 users**, **3 came back**.


<div class="q">

What is $p$, the probability that a user comes back — and how sure are we?

</div>



<div class="fragment">


<div class="grid-2-3">


<div class="card muted">

<span class="eyebrow">What a confidence interval can say</span>

$\hat{p} = 0.3$, standard error $\approx 0.14$, a 95% interval of roughly
$[0.02, 0.58]$ — about the *procedure*, not about $p$.

</div>


<div class="c-important">

<span class="eyebrow">What the posterior can say</span>

"$p$ is probably between 0.1 and 0.6, most likely around 0.3" — a statement
**about $p$**.

</div>


</div>


</div>


Notes:
The frequentist numbers: $\hat{p} = 3/10 = 0.3$,
$\mathrm{SE} = \sqrt{0.3 \cdot 0.7/10} \approx 0.145$, and the normal-approximation
(Wald) interval $0.3 \pm 1.96 \cdot 0.145 = [0.016, 0.584]$. The normal
approximation is poor at $n = 10$: the binomial is discrete and, for $p$ away
from 0.5, skewed, and the Wald interval is known to cover less often than its
nominal 95% for small $n$. With 0 of 10 it would even give the degenerate
interval $[0, 0]$ — the confidence-interval version of the zero veto.

The confidence interval forbids the sentence "p lies in this interval with
probability 0.95", because $p$ is treated as a fixed number. The posterior
describes the uncertainty about $p$ with a probability distribution, as for
any other unknown quantity; the sentence then becomes a valid statement about
that distribution. The posterior after 3 of 10 under a flat prior is
$\mathrm{Beta}(4, 8)$; the next slide reads it.

--

## What the Posterior Gives You

After 3 of 10, with a flat prior: $\theta \mid D \sim \mathrm{Beta}(4, 8)$.

| question | answer | from |
|---|---|---|
| most plausible $p$ | $0.30 = h/n$ | the peak (mode) |
| best guess on average | $0.33$ | the posterior mean $\frac{a+h}{a+b+n}$ |
| where is $p$, 95%? | $[0.11,\ 0.61]$ | a **credible interval** |
| after 1,000 users, 300 back | $[0.27,\ 0.33]$ | same model, more data |


<div class="c-note">

The peak under a flat prior is exactly $h/n$. **<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Keep the peak</a>** keeps only this peak
and calls it maximum likelihood — shortcut 2 of the course.

</div>


Notes:
All rows follow from $\mathrm{Beta}(4, 8)$. Mode: $(a - 1)/(a + b - 2) = 3/10$.
Mean: $4/12 \approx 0.33$; it lies to the right of the mode because the
posterior is right-skewed. The 95% interval is the equal-tailed one, from the
2.5% and 97.5% quantiles: $[0.109, 0.610]$. It supports the statement "$p$
lies in $[0.11, 0.61]$ with probability 0.95", given the prior and the model.
A highest-density interval, the shortest interval with 95% probability, is a
common alternative and differs slightly for skewed posteriors.

With 300 of 1,000 the posterior is $\mathrm{Beta}(301, 701)$, interval
$[0.272, 0.329]$. The posterior standard deviation falls from 0.131 to 0.0145,
a factor of about 9 for 100 times the data, close to the $1/\sqrt{n}$ law.
Under a flat prior the posterior is proportional to the likelihood, so the
mode equals the maximum-likelihood estimate $h/n$. For the fraud device attribute,
60 of 100, the posterior $\mathrm{Beta}(61, 41)$ has the 95% interval
$[0.50, 0.69]$.

## How Much Does the Prior Matter?

Two analysts: one with a flat prior $\mathrm{Beta}(1,1)$, one convinced that
$p$ is near a half, $\mathrm{Beta}(10,10)$.

<div class="viz viz-xl" data-viz="math/prior-washout" data-steps="1"
 data-params='{"priors": [[1, 1], [10, 10]], "datasets": [[3, 10], [300, 1000]], "xLabel": "θ = P(user returns)"}'></div>


<div class="c-important">

With little data the prior matters; with enough data the analysts **agree**.
A prior is a stated assumption — it can be argued with, and it washes out.

</div>


Notes:
Step 0 shows the posteriors after 3 of 10, step 1 adds 300 of 1,000; each
panel has its own height scale. "Near a half" prior: $\mathrm{Beta}(10 + 3, 10 + 7) = \mathrm{Beta}(13, 17)$,
mean $13/30 \approx 0.43$; with 300 of 1,000, $\mathrm{Beta}(310, 710)$, mean
$310/1020 \approx 0.304$. Flat prior: means $4/12 \approx 0.33$ and
$301/1002 \approx 0.300$.

The posterior mean is a weighted average of prior mean and observed
proportion: $\frac{a + h}{a + b + n} = \frac{a + b}{a + b + n} \cdot \frac{a}{a + b} + \frac{n}{a + b + n} \cdot \frac{h}{n}$.
The prior's weight is $(a + b)/(a + b + n)$: for $\mathrm{Beta}(10, 10)$ it is
$20/30$ with 10 observations and $20/1020 \approx 2\\%$ with 1,000. The prior is
an explicit modelling assumption that can be criticised like any other. Where
data are scarce its influence is large, and it is then the only additional
information available. A prior that assigns zero density to some region can
never be corrected there by data.

## Mini-Exercise

Prior $\mathrm{Beta}(2, 2)$. Of 10 users, **8** come back.


<div class="q">

Is the posterior mean above or below $0.8$ — and why?

</div>



<div class="fragment">

**Below.** The posterior is $\mathrm{Beta}(2+8,\ 2+2) = \mathrm{Beta}(10, 4)$,
mean $10/14 \approx 0.71$. The prior counts two ones and two zeros, so it
pulls towards $0.5$ — and the pull fades as data grows.

</div>


Notes:
The posterior is $\mathrm{Beta}(10, 4)$ with mean $10/14 \approx 0.714$ and
mode $9/12 = 0.75$, both below the observed $0.8$. The weighted-average form
gives the reason: the mean is
$\frac{4}{14} \cdot 0.5 + \frac{10}{14} \cdot 0.8 \approx 0.714$, a compromise
between the prior mean 0.5 (weight $4/14$) and the data (weight $10/14$). With
80 of 100 the mean would be $82/104 \approx 0.79$.

Pulling an estimate towards a default value is called shrinkage. The same
effect appears as regularisation in model fitting: a prior centred on zero
weights corresponds to a penalty on large weights, which is how
<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a> reads weight decay.
