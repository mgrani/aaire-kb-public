Notes:
Three modules. Generative classifiers: a classifier obtained from Bayes'
theorem by modelling $P(y)$ and $p(x \mid y)$, in contrast to a discriminative
model of $P(y \mid x)$; read as a sample, the training table cannot fill a full
$p(x \mid y)$, whose cells multiply with every attribute (the curse of
dimensionality), so the model must be restricted — by a simpler structure, by
parametric families, or both. Naive Bayes: conditional independence of the
attributes given the class, which reduces the number of parameters from
$2^p - 1$ to $p$ per class for $p$ binary attributes; fitting is counting, and a
count of zero vetoes all other evidence unless it is smoothed. Fitting the
parameters: Bayes' theorem applied to a parameter gives a posterior over it —
for yes/no data with a Beta prior, by adding counts
(<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>). On that posterior, counting
was its peak, the maximum likelihood estimate (MLE); smoothing its mean under a
flat prior; and a prior's peak is the MAP estimate. The posterior can be drawn,
so the spread a point estimate discards is visible.

Three choices are independent of each other: what to model (generative or
discriminative), how to fit its parameters (MLE, MAP or the whole posterior),
and how to decide on a class. MLE and MAP apply equally to logistic regression
in <a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>, which treats linear and logistic regression as
models of a conditional distribution and compares logistic regression with
naive Bayes. Fraud detection (base rate 1 in 1,000, binary red flags) is the
running example.

<div class="column">


<div class="q">

Replace the course by a **class** — fraud or honest — and the exam result by
a transaction's **attributes**. What do we get?

</div>



<div class="fragment c-insight">

A **classifier**: $P(\text{fraud} \mid x)$ from how often each class occurs and

Notes:
The count table of <a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a> is a joint
distribution of two variables, course and result, given as counts. Bayes'
theorem read it backwards: the prior $P(\text{PML}) = 40/100$, the likelihood
$P(\text{fail} \mid \text{PML}) = 10/40$, the evidence
$P(\text{fail}) = 16/100$, so $P(\text{PML} \mid \text{fail}) = 10/16 \approx 0.63$.

A generative classifier is exactly this computation with the course replaced by
the class $y$ and the exam result by an attribute vector $x$: the class prior
$P(y)$ and the class-conditional distribution $p(x \mid y)$ are estimated from
a labelled table and combined by Bayes' theorem. With one binary attribute the
table has four cells and counting is reliable; with thirty attributes it has
over a billion cells per class, which is the problem of this lecture.

| **Keep the peak** | the most probable parameter — MLE or MAP | how sure we are about it | every count · a coin |

Notes:
The shortcut table of <a href="/courses/probabilistic-machine-learning/lecture/l01-introduction/">Lecture 01</a> lists the approximations the
course makes to the ideal of carrying full distributions. This lecture covers
the first two, in the order a classifier needs them. Assume it apart replaces a
joint distribution by a product of smaller factors under an independence
assumption and discards the dependences between the factors. Keep the peak
replaces the posterior over a parameter by its most probable value (MLE with a
flat prior, MAP otherwise) and discards the uncertainty about that value.

Naive Bayes takes both: the joint $p(x \mid y)$ is replaced by a product of
factors $p(x\_j \mid y)$, and each factor is estimated by a relative frequency,
which the last module identifies as a peak. A generative classifier as such
requires neither shortcut: independence is what makes the joint affordable, and
the peak is what turns fitting into counting. How the parameters are fitted is
a choice of its own, made in the same way for discriminative models.

Running example: fraud detection with a base rate of 1 in 1,000 (prior odds
1 : 999) and a handful of binary red flags.

counted twice and the probabilities are over-confident. A count of zero vetoes

on the data gives a posterior; counting was its peak, the maximum likelihood

# Generative Classifiers


<div class="guiding-question">

**Guiding Question:** A classifier needs $P(\text{fraud} \mid x)$. Bayes'
theorem builds it from how fraud *looks* — what would it take to model that, and
why does nobody do it in full?

</div>


--

## Two Routes to the Same Posterior

A labelled table of transactions supports **both** routes to
$P(\text{fraud} \mid x)$, where $x$ is the vector of red flags:


<div class="grid-2">


<div class="card">

<span class="eyebrow">Discriminative — <a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a></span>

### Model $p(y \mid x)$ directly

A score for each $x$, as logistic regression will give (<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>). Nothing
is said about how $x$ arises.

</div>


<div class="card">

<span class="eyebrow">Generative — today</span>

### Model $p(y)$ and $p(x \mid y)$

How does a *fraudulent* transaction look, and how an honest one? Then convert
with Bayes.

</div>


</div>


$$
\eqa{P(y \mid x)} = \frac{\eqb{p(x \mid y)} \cdot \eqc{P(y)}}{\eqd{\sum\_{y'} p(x \mid y') P(y')}}
$$

Notes:
This is Bayes' theorem of <a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>
with the hypothesis replaced by a class $y$ and the evidence by a whole
attribute vector $x$; the colour slots are the same (posterior, likelihood,
prior, normaliser). The denominator is the law of total probability over the
classes, $p(x) = \sum\_{y'} p(x \mid y') P(y')$. For classification only the
arg max over $y$ matters, so the denominator can be ignored for decisions; it is
needed for calibrated probabilities.

Both routes are estimable from the same labelled table. The discriminative
route fits $p(y \mid x)$ directly, as logistic regression does
(<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>); the generative route
fits $P(y)$ and $p(x \mid y)$ and derives $P(y \mid x)$. The generative route is
a modelling choice, not a necessity imposed by the data. It models more than
classification needs, namely the full joint $p(x, y) = p(x \mid y)P(y)$.

--

## The Generative Route, Drawn

<div class="viz viz-lg" data-viz="ml/joint-class-attribute" data-steps="3"
 data-params='{"prior": 0.2, "observed": 3}'></div>


<div class="grid-2">


<div class="column">

**Before the last click:** a transaction of 200–1k €. More likely fraud?

</div>


<div class="column">


<div class="fragment">

No: $6\\% / 14\\% \approx 43\\%$. A discriminative model learns **only these
column shares**; a generative one the whole picture.

</div>


</div>


</div>


Notes:
The heatmap is the joint $p(y, x)$ of the class and one attribute, the amount
in five bins, with a fraud share of 20% instead of 1 in 1,000 so that the fraud
row is visible (the slider sets it). It is the count table of
<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a> with colour instead of counts.
Steps: the joint cells; the row sums (prior $P(y)$) and the column sums
(evidence $p(x)$); the fraud row measured against its own total, the
likelihood $p(x \mid \text{fraud})$; one column measured against its own total,
the posterior $P(y \mid x)$.

For 200–1k €: $p(\text{fraud}, x) = 0.2 \cdot 0.30 = 0.06$ and
$p(\text{honest}, x) = 0.8 \cdot 0.10 = 0.08$, so
$P(\text{fraud} \mid x) = 0.06/0.14 \approx 0.43$. At the real base rate of
1 in 1,000 the same column gives $0.0003/0.1002 \approx 0.3\\%$: the likelihood
row is unchanged, only the prior margin moved.

A generative model estimates the whole picture — the prior margin and each
class's row — and obtains every column share from it. A discriminative model
estimates only the column shares $P(y \mid x)$; it never represents how the
amounts are distributed, which is why it cannot report $p(x)$ or swap in a new
prior.

--

## Why Model How Fraud Looks?


<div class="q">

A discriminative model — logistic regression (<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>) — gives
$P(\text{fraud} \mid x)$ directly. What can a model of $p(x \mid y)$ do that it
cannot?

</div>



<div class="fragment">


<div class="marks-yes">

- **Keep the prior explicit.** The 1 in 1,000 of <a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a> is a separate
  factor: a new market with 1 in 200 changes $P(y)$, not the whole model.
- **Handle a missing field.** An attribute nobody observed can be summed out of
  $p(x \mid y)$.
- **Notice the strange.** A transaction with tiny $p(x)$ under *both* classes
  is unlike anything seen — a score alone cannot say so.

</div>



<div class="c-warning">

The price: $p(x \mid y)$ is a **joint distribution over all attributes**, one
per class.

</div>


</div>


Notes:
All three capabilities follow from having the joint $p(x, y)$.

Explicit prior: the posterior odds are the prior odds times the likelihood
ratio, so a change of base rate (1 in 1,000 to 1 in 200) only replaces $P(y)$
while $p(x \mid y)$ stays valid, provided the class-conditional distributions do
not change between the settings. A discriminative model absorbs the training
base rate into its parameters and must be corrected afterwards.

Missing attributes: $p(x\_{\text{obs}} \mid y) = \sum\_{x\_{\text{mis}}} p(x\_{\text{obs}}, x\_{\text{mis}} \mid y)$
by marginalisation; under the naive assumption the missing factor simply drops
out of the product. A model of $p(y \mid x)$ has no principled way to do this
without a model of $x$.

Novelty: $p(x) = \sum\_y p(x \mid y) P(y)$ measures how typical a transaction is.
A small $p(x)$ flags an input unlike the training data (outlier or
distribution shift), which $p(y \mid x)$ alone cannot detect because it is
normalised for every $x$.

The cost is a full distribution over all attributes per class. These three
points are compared concretely in
<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>.

--

## Bayes' Theorem With Two Red Flags

Two flags at once, $D$ = new device and $F$ = foreign IP: the evidence is a
**conjunction** of events.

$$
\eqa{P(\text{fraud} \mid D \cap F)} = \frac{\eqb{P(D \cap F \mid \text{fraud})} \cdot \eqc{P(\text{fraud})}}{\eqd{\sum\_{y} P(D \cap F \mid y)\\, P(y)}}
$$


<div class="grid-2">


<div class="column">


<div class="q">

Among frauds, 60% show $D$ and 70% show $F$. How many show **both**?

</div>


</div>


<div class="column">


<div class="fragment">

1. **Not fixed by the parts.** Anything from 30% to 60% fits; the data say 55%.
   $P(D \cap F \mid y)$ is a number of its own.
2. **One number per combination.** $p$ flags: $2^p - 1$ per class.
3. **Ever rarer.** Each added flag shrinks the count behind the conjunction.

</div>


</div>


</div>



<div class="fragment c-insight">

Multiplying the parts, $0.60 \cdot 0.70 = 0.42$, is correct only if $D$ and $F$
are **independent given the class** — the assumption of **naive Bayes**.

</div>


Notes:
This is Bayes' theorem for multiple events of
<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a> with the classes as the
partition and the evidence $B = D \cap F$. Nothing in the theorem changes; the
difficulty is entirely in the likelihood of the conjunction. (A conjunction on
the other side, $P(E\_i \cap E\_k \mid B)$ for two classes, is zero: classes
are disjoint. Several events enter a classifier as several pieces of evidence.)

The bounds: for probabilities $a = 0.60$ and $b = 0.70$ the intersection lies
in $[\max(0, a + b - 1), \min(a, b)] = [0.30, 0.60]$ (Fréchet bounds). The lower
end is the most "avoiding" overlap, the upper end has every $D$-fraud also
showing $F$. The single-flag rates therefore do not determine
$P(D \cap F \mid \text{fraud})$; it must be estimated separately. In the
running example it is 0.55 among frauds and 0.04 among honest transactions,
the figures used again in <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>.

The general form: for flags $E\_1, \ldots, E\_p$, the likelihood
$P(E\_1 \cap \ldots \cap E\_p \mid y)$ is needed for every combination of
present and absent flags, $2^p$ patterns with $2^p - 1$ free numbers per class.
The chain rule writes it exactly as
$P(E\_1 \mid y)\\, P(E\_2 \mid E\_1, y) \cdots P(E\_p \mid E\_1, \ldots, E\_{p-1}, y)$;
each later factor conditions on more events, so it is estimated from fewer
rows. Dropping the conditioning events in every factor gives the product
$\prod\_j P(E\_j \mid y)$, which is exact iff the flags are conditionally
independent given the class. With $D$ and $F$ the product gives 0.42 instead
of 0.55 among frauds and $0.10 \cdot 0.05 = 0.005$ instead of 0.04 among
honest transactions.

--

## The Training Table Is a Sample

| amount (€) | country | hour | new device? | … 30 flags | fraud? |
|---|---|---|---|---|---|
| 49.90 | DE | 14 | no | … | no |
| 1,250.00 | BR | 3 | yes | … | **yes** |
| 12.50 | DE | 19 | no | … | no |

Each column is a **random variable** $X\_j$, each row one **draw** from
$p(x, y)$. The fraud rows are draws from $p(x \mid \text{fraud})$.


<div class="q">

Estimate $p(x \mid \text{fraud})$ by counting: of 100 frauds, how many look
**exactly** like the next transaction?

</div>



<div class="fragment c-warning">

Almost always **none**. Counting needs examples of every combination of values.

</div>


Notes:
This is the reading of a table set up in
<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>: a column is a random
variable, a row is one realisation of the vector $(X\_1, \ldots, X\_d, Y)$, and
the table is $n$ draws from a joint distribution nobody has written down.
Restricting to the rows with $y = \text{fraud}$ is conditioning on the class,
so those rows are a sample from $p(x \mid \text{fraud})$.

Estimating a distribution without any assumption about its form means
counting: the estimate of $p(x \mid \text{fraud})$ for a particular vector $x$
is the share of fraud rows equal to $x$ in every attribute. A continuous
attribute such as the amount makes exact repeats practically impossible; even
after binning it, the number of value combinations grows multiplicatively with
every column, as the next two slides count.

--

## The Joint Explodes


<div class="flow-row">


<div class="stat-card concept">

### 30
yes/no red flags per transaction

</div>


<div class="flow-arrow">

→

</div>


<div class="stat-card fails">

### $2^{30} - 1$
≈ 1.07 billion numbers for $p(x \mid \text{fraud})$ alone

</div>


<div class="flow-arrow">

→

</div>


<div class="stat-card evidence">

### 100
frauds among 100,000 transactions to estimate them

</div>


</div>



<div class="c-insight">

Almost every cell of the table is **empty**. Its count is 0, so its maximum
likelihood estimate is 0 — every fraud that looks slightly new becomes
"impossible".

</div>


Notes:
A joint distribution over 30 binary variables has $2^{30} = 1{,}073{,}741{,}824$
cells; since they sum to 1, $2^{30} - 1 = 1{,}073{,}741{,}823$ are free
parameters, per class. With 100 fraud cases at most 100 cells have a non-zero
count, so at least 99.99999% of the cells have MLE exactly 0, and any fraud
pattern not seen in training receives $p(x \mid \text{fraud}) = 0$ and
therefore $P(\text{fraud} \mid x) = 0$ (or an undefined $0/0$ if the pattern
was not seen among honest transactions either).

A share computed from a tiny count is an extreme value, here multiplied across
a billion cells; naive Bayes meets the same zero in a single cell, and
<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a> names the estimate behind it. More data does not solve it: filling the table reliably would need far
more frauds than cells. The general pattern, and the two ways to reduce the
number of parameters, follow on the next two slides.

--

## The Curse of Dimensionality

| attributes | value combinations (10 values each) | frauds per combination (100 frauds) |
|---|---|---|
| 1 | 10 | 10 |
| 2 | 100 | 1 |
| 3 | 1,000 | 0.1 |
| 30 | $10^{30}$ | $10^{-28}$ |


<div class="c-insight">

Every attribute **multiplies** the cells and **divides** the data per cell.
Counting needs data in every cell — a full joint over many attributes can
never be estimated by counting.

</div>


Notes:
With $p$ attributes of $m$ values each, the joint has $m^p$ cells, and $n$
observations put on average $n / m^p$ observations into each. Already at three
attributes with ten values the average cell holds 0.1 frauds, so most cells
are empty and their counts estimate 0. The name "curse of dimensionality"
(Bellman) covers this exponential growth of the space with the number of
dimensions; it affects every method that relies on having nearby examples, not
only counting. Continuous attributes make it worse: without binning every
value is its own cell.

The required amount of data grows exponentially in $p$, while real datasets
grow by collecting more rows, not by an exponential factor per added
attribute. Adding attributes therefore makes an unrestricted estimate worse,
not better, unless the model is restricted.

--

## Two Ways Out


<div class="grid-2">


<div class="card">

### Simplify the structure

Assume attributes are **independent given the class**: one small table per
attribute instead of one huge joint.

30 flags: **30** numbers per class, not $2^{30} - 1$.

<span class="eyebrow">naive Bayes — today; graphs — <a href="/courses/probabilistic-machine-learning/lecture/l05-bayesian-networks/">Lecture 05</a></span>

</div>


<div class="card">

### Use a parametric family

Replace a table of counts by a **formula with few parameters**.

amount given fraud ~ log-normal$(\mu, \sigma)$: **2** numbers, not 100 bins.

<span class="eyebrow"><a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a></span>

</div>


</div>



<div class="c-warning">

Both are **assumptions**. They make the model estimable — and wrong wherever
the world disagrees with them.

</div>


Notes:
The two ways reduce the number of parameters at different places. Structure:
conditional independence factorises $p(x \mid y) = \prod\_j p(x\_j \mid y)$, so
the parameter count grows linearly in the number of attributes instead of
exponentially; a Bayesian network keeps selected dependences and still
factorises. Parametric families: each factor is described by a family with a
fixed small number of parameters (Bernoulli for a flag, categorical for the
country, normal or log-normal for an amount), so a continuous attribute needs
no bins at all.

Naive Bayes uses both: independent attributes given the class, each with a
small family. The resulting estimates are stable from little data, but
correlated attributes are counted twice and a misfitting family distorts the
likelihood ratio; both costs are taken up in the naive Bayes module.

--

## Mini-Exercise

A fraud model uses only **three** yes/no flags.


<div class="q">

How many numbers does the generative model need — both classes and the class
prior together?

</div>



<div class="fragment">

**15.** Each class needs a full table over $2^3 = 8$ flag patterns: 7 free
numbers (they sum to 1). Two classes give 14, and $P(\text{fraud})$ adds one.

</div>


Notes:
Each class needs a full distribution over the $2^3 = 8$ flag patterns, which
has $8 - 1 = 7$ free numbers because the probabilities sum to 1. Two classes give
14; the class prior $P(\text{fraud})$ adds one more ($P(\text{honest}) =
1 - P(\text{fraud})$ is determined). Total: 15. Typical miscounts are 16
(counting both class probabilities) and 17 (counting all 8 cells per class).

General formula for $K$ classes and $p$ binary attributes:
$K(2^p - 1) + (K - 1)$. Under the naive assumption it becomes $Kp + (K - 1)$, for
the example $2 \cdot 3 + 1 = 7$.

--

## Takeaway


<div class="takeaway">

The generative route models **how the data arises** — $p(y)$ and $p(x \mid y)$ —
and converts with Bayes. Counting that joint needs data in every combination
of values, which **explodes** with the number of attributes. The way out is an
assumption: **simpler structure**, **parametric families**, or both.

</div>


---

# Naive Bayes


<div class="guiding-question">

**Guiding Question:** Its central assumption is almost always false, and it
classifies well anyway. How can both be true?

</div>


--

## Conditional Independence


<div class="c-definition">

**Definition.** $A$ and $B$ are **conditionally independent given $C$**,
written $A \indep B \mid C$, iff
$$
P(A \cap B \mid C) = P(A \mid C) \cdot P(B \mid C)
\quad\Longleftrightarrow\quad
P(A \mid B \cap C) = P(A \mid C)
$$

</div>


Reading: **once $C$ is known, $B$ tells us nothing more about $A$.**


<div class="q">

Among frauds only: does a new device make a foreign IP more likely?

</div>


Notes:
The two forms are equivalent whenever $P(B \cap C) > 0$: dividing
$P(A \cap B \mid C) = P(A \mid C) P(B \mid C)$ by $P(B \mid C)$ gives
$P(A \mid B \cap C) = P(A \mid C)$. The relation is symmetric in $A$ and $B$.
For random variables it must hold for every combination of values, and the
condition is evaluated separately within each value of $C$.

Conditional and marginal independence are different properties; neither
implies the other. Two flags can be dependent overall because both are more
frequent among frauds, yet independent within each class; conversely,
conditioning can create a dependence between independent causes
(<a href="/courses/probabilistic-machine-learning/lecture/l05-bayesian-networks/">Lecture 05</a> treats both cases with a counted
example).

Answer to the question: in an account take-over the attacker typically uses
both a new device and a foreign IP, so among frauds the two flags are positively
dependent. With the figures used later in this module, $P(F \mid D, \text{fraud})
= 0.55 / 0.60 \approx 0.92$, compared with $P(F \mid \text{fraud}) = 0.70$.
This is the dependence that naive Bayes assumes away.

--

## The Naive Assumption


<div class="grid-2">


<div class="column">

![Naive Bayes as a graph: the class points to every attribute, no arrows between attributes](/courses/probabilistic-machine-learning/figures/l03-naive-bayes-star.svg)

</div>


<div class="column">


<div class="c-important">

Assume the attributes are **independent given the class**:
$$
p(x\_1, \ldots, x\_p \mid y) = \prod\_{j=1}^{p} p(x\_j \mid y)
$$

</div>


| flags | full joint, per class | naive |
|---|---|---|
| 3 | 7 | 3 |
| 30 | 1,073,741,823 | 30 |

</div>


</div>



<div class="c-warning">

**Shortcut 2 — assume it apart.** Dropped: every dependence *within* a class.

</div>


Notes:
In the graph the class $y$ points to every attribute and no arrow joins two
attributes. Read as a Bayesian network
(<a href="/courses/probabilistic-machine-learning/lecture/l05-bayesian-networks/">Lecture 05</a>), each missing arrow is an
independence claim: every attribute is independent of all others given the
class. The attributes are still dependent marginally, through the class.

Parameter count: with the assumption, $p(x \mid y)$ needs one Bernoulli
parameter per binary flag and class, $p$ numbers instead of $2^p - 1$. For a
categorical attribute with $k\_j$ values the count is $k\_j - 1$ per class. The
three-flag example drops from 15 numbers to $2 \cdot 3 + 1 = 7$; for 30 flags
from about $2.1 \cdot 10^9$ to 61.

The model is still generative, since it specifies $p(y)$ and $p(x \mid y)$ and
can generate transactions. What it drops is every dependence between attributes
within a class (shortcut 2 of the course roadmap). The assumption is almost
never exactly true; whether it matters depends on the task, as the last slides
of the module show.

--

## Assuming It Apart, Drawn

<div class="viz viz-lg" data-viz="ml/joint-two-attributes" data-steps="3"
 data-params='{"rho": 0.7}'></div>


<div class="grid-2">


<div class="column">

**Predict:** set the correlation to 0. What happens to the two pictures?

</div>


<div class="column">


<div class="fragment">

They become **identical**. Naive Bayes is exact exactly when the attributes are
independent **within** each class.

</div>


</div>


</div>


Notes:
The full object is a cube, class × $x\_1$ × $x\_2$; the figure shows its two
class slices. Left: the true class-conditional joint $p(x\_1, x\_2 \mid y)$ on a
$5 \times 5$ grid, $5^2 - 1 = 24$ numbers per class, and $5^p - 1$ for $p$
attributes. Its two margins, $p(x\_1 \mid y)$ and $p(x\_2 \mid y)$, need
$2 \cdot 4 = 8$. Right: the product of the margins, which is what naive Bayes
stores. A product of margins is always axis-aligned — the same picture as the
independence rectangle of
<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a> — so it cannot
represent a tilt. The share of probability mass placed differently from the
true joint (the total variation distance) is shown per class.

Two dependences must be kept apart. Within a class, a tilted blob means $x\_1$
and $x\_2$ are correlated given $y$; this is what naive Bayes drops. Across
classes, the two blobs sit in different corners, so over all transactions
$x\_1$ and $x\_2$ are dependent even when $\rho = 0$ — through the class, which
naive Bayes keeps. Conditional independence given $y$ does not imply
independence overall.

--

## Fitting Is Counting

$$
\hat{P}(y) = \frac{n(y)}{n}
\qquad
\hat{P}(x\_j = v \mid y) = \frac{n(x\_j = v,\ y)}{n(y)}
$$


<div class="grid-2">


<div class="card">

### One small table per attribute
Each attribute, within one class, is a **categorical** variable — for a
yes/no flag, a Bernoulli (<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>).

</div>


<div class="card">

### Estimated by its share
$P(\text{new device} \mid \text{fraud})$: of the 100 frauds, how many came
from a new device? 60, so $0.6$.

</div>


</div>



<div class="c-insight">

Naive Bayes is fitted in **one pass over the table**, with no optimiser. Why a
share is the right estimate — and when it is not — is the last module.

</div>


Notes:
Derivation. Under the naive assumption the log-likelihood of a labelled table
is
$\sum\_i \log P(y\_i) + \sum\_i \sum\_j \log p(x\_{ij} \mid y\_i)$.
Grouping terms by attribute $j$ and class $y$ gives one term
$\sum\_v n(x\_j = v, y) \log \theta\_{jvy}$ per attribute and class, plus one term
for the class prior. No parameter appears in two terms, so each is maximised
separately, and each is the log-likelihood of a categorical distribution whose
maximum likelihood estimate is the relative frequency (derived for two values
as $h/n$ in <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>; for $k$ values with a
Lagrange multiplier). The categorical distribution was introduced in
<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a> as the distribution for a
nominal attribute.

The independence assumption is what makes the MLE a closed-form count: with a
full joint the parameters are per combination of values, and the counts would
be of entire rows. Logistic regression, by contrast, has no closed-form MLE and
is fitted iteratively. Every estimated number in naive Bayes is a peak of a
likelihood, so shortcut 1 is taken in addition to shortcut 2; the last module
makes this precise.

--

## The Classifier

$$
P(y \mid x\_1, \ldots, x\_p) = \frac{P(y) \prod\_{j} p(x\_j \mid y)}{\sum\_{y'} P(y') \prod\_{j} p(x\_j \mid y')}
$$

For two classes, divide the two posteriors — the normaliser cancels:

$$
\underbrace{\frac{P(\text{fraud} \mid x)}{P(\text{honest} \mid x)}}\_{\text{posterior odds}}
= \underbrace{\frac{P(\text{fraud})}{P(\text{honest})}}\_{\text{prior odds}}
\cdot \prod\_{j=1}^{p} \underbrace{\frac{p(x\_j \mid \text{fraud})}{p(x\_j \mid \text{honest})}}\_{\text{likelihood ratio } \mathrm{LR}\_j}
$$


<div class="c-note">

Every observed attribute **multiplies the odds** by its likelihood ratio: above
1 it speaks for fraud, below 1 against.

</div>


Notes:
The first line is Bayes' theorem with the naive product in place of
$p(x \mid y)$; the denominator is the law of total probability. In the ratio of
two posteriors the denominator cancels, which gives the odds form: posterior
odds = prior odds × product of likelihood ratios. Odds and their relation to
probabilities, $P = \text{odds}/(1 + \text{odds})$, were introduced with Bayes'
theorem in <a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>.

Each attribute contributes one factor $\mathrm{LR}\_j$. A ratio above 1 raises
the odds of fraud, below 1 lowers them, and exactly 1 means the attribute is
uninformative. Because multiplication is commutative, the order in which
evidence arrives does not matter. An observed absent flag also contributes a
factor, $(1 - p\_{j,\text{fraud}})/(1 - p\_{j,\text{honest}})$, which is usually
below 1 for a red flag. For more than two classes, odds relative to one
reference class play the same role.

--

## Three Red Flags

100,000 transactions, 100 of them fraud: prior odds $1 : 999$.

| flag | among frauds | among honest | likelihood ratio |
|---|---|---|---|
| new device | 60% | 10% | 6 |
| foreign IP | 70% | 5% | 14 |
| night | 50% | 20% | 2.5 |


<div class="q">

A transaction shows all three flags. Is it more likely fraud than not?

</div>



<div class="fragment">

$$
\text{odds} = \frac{1}{999} \cdot 6 \cdot 14 \cdot 2.5 = \frac{210}{999}
\quad\Longrightarrow\quad
P(\text{fraud} \mid x) = \frac{210}{1{,}209} \approx 17\\%
$$


<div class="c-warning">

Three red flags, each one strong — and still **mostly honest**. The base rate
of <a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>, once more.

</div>


</div>


Notes:
Arithmetic: $0.6/0.1 = 6$, $0.7/0.05 = 14$, $0.5/0.2 = 2.5$; the product is 210,
and the posterior odds are $210 : 999$, so
$P(\text{fraud} \mid x) = 210/(210 + 999) = 0.174$.

The answer is no: the transaction is still more likely honest. A combined
likelihood ratio of 210 is strong evidence, but the prior odds of 1 : 999 are
stronger; the posterior exceeds 50% only when the combined ratio exceeds 999.
This is the base-rate effect of
<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>. Intuitive judgements
that call such a transaction "clearly fraud" neglect the base rate.

The model in this example contains exactly these three flags, all observed
present, so only the three ratios enter. In a model with more flags, every flag
observed absent contributes its own factor; for night that factor would be
$(1 - 0.5)/(1 - 0.2) = 0.625$.

--

## Evidence Adds Up

<div class="viz viz-lg" data-viz="ml/gm-log-odds-staircase" data-steps="3"
 data-params='{"prior": [1, 999], "factors": [{"lr": 6, "label": "new device"}, {"lr": 14, "label": "foreign IP"}, {"lr": 2.5, "label": "night"}]}'></div>

**Predict before each click:** which flag moves the probability most?

Notes:
On a log-odds axis each likelihood ratio is a step of fixed height $\log
\mathrm{LR}\_j$, independent of the current position: the log-odds are the sum
of the log prior odds and the log likelihood ratios. Natural logarithms:
prior $\log(1/999) = -6.91$; steps $\log 6 = 1.79$, $\log 14 = 2.64$,
$\log 2.5 = 0.92$.

Step 1 (new device): odds $6/999$, probability 0.6%. Step 2 (foreign IP): odds
$84/999$, probability 7.8%. Step 3 (night): odds $210/999$, probability 17.4%.
The foreign IP has the largest ratio and therefore the largest step; night is
the weakest of the three, although it moves the probability more in absolute
terms than the first flag did, because probability is not linear in log-odds.

A sum of per-attribute contributions plus a constant is a linear score. For
binary attributes the naive Bayes log-odds are exactly linear in $x$, the same
functional form as logistic regression
(<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>); the two differ in how
the weights are estimated
(<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>).

--

## One Zero Vetoes Everything

A new flag: **payment to a crypto exchange**. Among the 100 frauds it never
occurred.


<div class="grid-2-1">


<div class="column">

$$
\hat{P}(\text{crypto} \mid \text{fraud}) = \frac{0}{100} = 0
$$

A transaction with this flag gets posterior odds **exactly 0** — whatever the
other thirty flags say. One unseen value vetoes all other evidence.

</div>


<div class="c-danger">

<span class="eyebrow">Counting, fails</span>

"Not seen in 100 frauds" became "impossible for a fraud" — a share of a small
count, read as certainty.

</div>


</div>


Notes:
This is the zero-frequency problem. The MLE of a count of 0 is the probability
0, and a single factor of 0 makes the whole product 0, so the posterior odds of
fraud are 0 regardless of all other likelihood ratios. If a value has count 0 in
both classes, the posterior is the undefined $0/0$.

The cause is that a relative frequency of a small count is an extreme value;
<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a> shows the same failure on a coin
(three heads in three flips give $\hat\theta = 1$) and names the estimate. With 100 frauds, any flag with a true rate below about 1% is likely to
have count 0 (for a true rate of 1% the probability of no occurrence in 100 is
$0.99^{100} = 0.37$). In a log-odds implementation the zero appears as
$\log 0 = -\infty$. Standard repairs add pseudo-counts (next slide) or replace
zeros by a small floor value; the first has a probabilistic justification.

--

## Laplace Smoothing

**Laplace smoothing** pretends each of the $k\_j$ values was seen **once more**:

$$
\hat{P}(x\_j = v \mid y) = \frac{n(x\_j = v,\ y) + 1}{n(y) + k\_j}
$$

For a yes/no flag ($k\_j = 2$) this is $\frac{h + 1}{n + 2}$.

| count among 100 frauds | share | smoothed |
|---|---|---|
| 0 | 0 | $1/102 \approx 0.010$ |
| 60 | 0.60 | $61/102 \approx 0.598$ |


<div class="c-insight">

Where the count is large, nothing changes; where it is 0, the veto is gone.
Why **+1**, and not +5? The next module: smoothing is a **prior**.

</div>


Notes:
The pseudo-counts are added to every value of the attribute, so the smoothed
estimates still sum to 1 over the $k\_j$ values: $n(y) + k\_j$ in the denominator
balances one extra count per value. On well-populated cells the change is
negligible (0.60 vs 0.598); on empty cells it replaces 0 by $1/102 \approx
0.0098$, so no single factor can force the product to 0.

Add-$\alpha$ smoothing, $(h + \alpha)/(n + 2\alpha)$ for a flag, generalises the
rule to $\alpha$ imagined occurrences per value; larger $\alpha$ pulls every
estimate more strongly towards one half. The choice $\alpha = 1$ is a convention
(Laplace's rule of succession). The next module derives it:
$(h + 1)/(n + 2)$ is the posterior mean of the flag probability under a flat
Beta$(1, 1)$ prior (<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>), and
add-$\alpha$ is the posterior mean under Beta$(\alpha, \alpha)$; for $k\_j > 2$
values the flat Dirichlet plays the same role.

--

## Counting Evidence Twice


<div class="grid-2">


<div class="column">

![Naive Bayes with the dropped dependence between new device and foreign IP](/courses/probabilistic-machine-learning/figures/l03-naive-bayes-dropped.svg)

</div>


<div class="column">

In an account take-over, a new device and a foreign IP **arrive together**.
Suppose both appear on 55% of frauds and 4% of honest transactions:

| | ratio for the pair | $P(\text{fraud})$ with night |
|---|---|---|
| naive Bayes | $6 \cdot 14 = 84$ | 17.4% |
| the real pair | $0.55 / 0.04 \approx 14$ | 3.3% |

</div>


</div>



<div class="c-warning">

Correlated flags are **counted twice**, so naive Bayes is **over-confident**.
Its ranking of transactions often survives; its probabilities do not.

</div>


Notes:
The dashed edge in the figure is the dependence between new device and foreign
IP that naive Bayes omits. Naive Bayes multiplies both likelihood ratios as if
they were independent pieces of evidence, $6 \cdot 14 = 84$. The pair's actual
likelihood ratio is $P(D, F \mid \text{fraud}) / P(D, F \mid \text{honest}) =
0.55/0.04 = 13.75$. With night added, the posterior odds are
$13.75 \cdot 2.5 / 999 = 34.4/999$, so $P(\text{fraud} \mid x) = 3.3\\%$ instead
of 17.4%. Under independence within the classes the pair would occur on
$0.6 \cdot 0.7 = 42\\%$ of frauds and $0.1 \cdot 0.05 = 0.5\\%$ of honest
transactions; the assumed 4% among honest ones is eight times that, which is
where the error comes from.

Correlated attributes therefore push naive Bayes posteriors towards 0 and 1:
the probabilities are not calibrated
(<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>). Classification by arg max
depends only on which side of the decision threshold the posterior falls, so it
can remain correct even when the probabilities are badly off. Domingos and
Pazzani (1997, Machine Learning 29) show that naive Bayes can be optimal under
zero–one loss in many cases where the independence assumption is violated,
which is why it classifies well despite a false assumption.

--

## Mini-Exercise

A bug feeds the **foreign-IP** flag into the model twice.


<div class="q">

Does the fraud probability of our three-flag transaction go up, down, or stay
— and what does that say about correlated attributes?

</div>



<div class="fragment">

**Up — from 17% to about 75%.** The odds get a second factor 14:
$2{,}940 : 999$. Naive Bayes cannot tell a copy from new evidence; a strongly
correlated attribute is almost a copy.

</div>


Notes:
Answer: up. The duplicated flag contributes its likelihood ratio twice, so the
odds become $210 \cdot 14 / 999 = 2940/999$ and
$P(\text{fraud} \mid x) = 2940/3939 = 0.746$, from 17%.

The true information content is unchanged, since a copy of an attribute carries
no new evidence: the correct likelihood ratio of the pair (flag, copy) is just
the ratio of the flag, 14. Naive Bayes cannot detect duplication, because the
model has no parameter for the relation between attributes. A duplicate is the
limiting case of perfect correlation; strongly correlated attributes act as
partial copies. Real feature sets contain them routinely: the same information
coded twice, features derived from others, and indicators that are near-functions
of each other. Removing redundant attributes, or a model that captures the
dependence (a Bayesian network, <a href="/courses/probabilistic-machine-learning/lecture/l05-bayesian-networks/">Lecture 05</a>), avoids
the double counting.

--

## Takeaway


<div class="takeaway">

Naive Bayes **assumes the joint apart** — attributes independent given the
class — and fits every factor by **counting**, smoothed by pseudo-counts so no
zero can veto. It is cheap, needs little data and ranks well. Its
probabilities are over-confident wherever attributes move together.

</div>

# Fitting the Parameters: Posterior, MLE and MAP


<div class="guiding-question">

**Guiding Question:** Naive Bayes fitted itself by counting, and a count of
zero vetoed everything. What was counting, really — and what does a prior
change?

</div>


--

## An Unknown Number, Ten Observations

A new feature went live. Of the first **10 users**, **3 came back**.


<div class="q">

What is $p$, the probability that a user comes back — and how sure are we?

</div>



<div class="fragment">


<div class="grid-2-3">


<div class="card muted">

<span class="eyebrow">What the last unit can say</span>

$\hat{p} = 0.3$, standard error $\approx 0.14$, a 95% interval of roughly
$[0.02, 0.58]$ — about the *procedure*, not about $p$.

</div>


<div class="c-important">

<span class="eyebrow">What we would like to say</span>

"$p$ is probably between 0.1 and 0.6, most likely around 0.3" — a statement
**about $p$**.

</div>


</div>


</div>


Notes:
The frequentist numbers: $\hat{p} = 3/10 = 0.3$,
$\mathrm{SE} = \sqrt{0.3 \cdot 0.7/10} \approx 0.145$, and the normal-approximation
(Wald) interval $0.3 \pm 1.96 \cdot 0.145 = [0.016, 0.584]$. The normal
approximation is poor at $n = 10$: the binomial is discrete and, for $p$ away
from 0.5, skewed, and the Wald interval is known to cover less often than its
nominal 95% for small $n$. With 0 of 10 it would even give the degenerate
interval $[0, 0]$.

The confidence interval forbids the sentence "p lies in this interval with
probability 0.95", because $p$ is treated as a fixed number. The Bayesian
alternative describes the uncertainty about $p$ with a probability
distribution, as for any other unknown quantity; the sentence then becomes a
valid statement about that distribution.

--

## Conditioning on the Data — for a Parameter

Treat the unknown $p$ as a random variable $\theta$ and apply **Bayes' theorem**,
with $\theta$ in place of the hypothesis and the data $D$ as the evidence:

<div class="viz eq-explain" data-viz="core/equation-explain" data-steps="4"
 data-params='{"labels": ["posterior — belief about θ after the data", "likelihood — how probable the data is for each θ", "prior — belief about θ before", "evidence — normalises, does not depend on θ"]}'>

$$
\eqa{p(\theta \mid D)} = \frac{\eqb{p(D \mid \theta)} \cdot \eqc{p(\theta)}}{\eqd{p(D)}}
$$

</div>

For i.i.d. yes/no data with $h$ yeses in $n$ trials:
$p(D \mid \theta) = \theta^{h} (1-\theta)^{n-h}$ — read as a function of
$\theta$, with the data fixed.

Notes:
The structure is that of Bayes' theorem for events, with the hypothesis
replaced by a number $\theta \in [0, 1]$: prior and posterior are densities
over $[0, 1]$ instead of two probabilities. The evidence is
$p(D) = \int\_0^1 p(D \mid \theta) p(\theta) d\theta$, the marginal probability
of the data; it does not depend on $\theta$ and only normalises.

The likelihood is the Bernoulli PMF multiplied over the $n$ rows, which is
where the i.i.d. assumption enters. Only the counts $h$ and $n - h$ matter,
not the order of the observations. The binomial coefficient is absent because
$D$ is one specific sequence; including it would change nothing, since it
cancels in the normalisation. As a function of $\theta$ the likelihood is not
a probability distribution: $\int\_0^1 \theta^h (1 - \theta)^{n-h} d\theta$ is
not 1 in general. <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a> builds on this
distinction.

--

## A Prior That Behaves Like Counts


<div class="c-definition">

**Beta prior.** $p(\theta) \propto \theta^{a-1}(1-\theta)^{b-1}$ on $[0, 1]$,
written $\mathrm{Beta}(a, b)$. $\mathrm{Beta}(1,1)$ is flat: every $p$ equally
plausible.

</div>


Multiply by the likelihood $\theta^{h}(1-\theta)^{n-h}$:

$$
p(\theta \mid D) \propto \theta^{a+h-1}(1-\theta)^{b+n-h-1}
\quad\Longrightarrow\quad
\theta \mid D \sim \mathrm{Beta}(a + h,\enspace  b + n - h)
$$


<div class="c-insight">

The update is **adding counts**: $a$ and $b$ act like yeses and noes seen before
the data. A prior whose posterior stays in the same family is called
**conjugate**.

</div>


Notes:
The normalising constant of $\mathrm{Beta}(a, b)$ is
$B(a, b) = \Gamma(a)\Gamma(b)/\Gamma(a + b)$, but it never has to be computed
for the update: prior and likelihood are both of the form
$\theta^{\cdot}(1 - \theta)^{\cdot}$, so their product is again of that form
and the exponents add. The posterior is identified by its shape alone.

The parameters act as pseudo-counts: $\mathrm{Beta}(a, b)$ behaves like
$a - 1$ yeses and $b - 1$ noes already seen in terms of the peak, or $a$ and
$b$ in terms of the mean $a/(a + b)$. A prior with $a + b = 2$ is outweighed by
1,000 real observations. Conjugate priors exist for other likelihoods too,
e.g. the Dirichlet for categorical data and the normal for the mean of normal
data with known variance.

--

## Watching the Posterior Form

<div class="viz viz-lg" data-viz="math/bayes-updating" data-steps="10"
 data-params='{"prior": [1, 1], "observations": [0, 1, 0, 0, 1, 0, 0, 0, 1, 0], "symbols": ["✓", "✗"], "names": ["yes", "no"], "xLabel": "θ = P(user returns)"}'></div>

**Predict before each click:** which way does the curve move after a ✗ — and
does it get narrower every time?

Notes:
Step 0 shows the flat prior; each further step adds one observation of the
sequence ✗ ✓ ✗ ✗ ✓ ✗ ✗ ✗ ✓ ✗. After the first ✗ the posterior is
$\mathrm{Beta}(1, 2)$, density $2(1 - \theta)$, highest at $\theta = 0$ and
ruling out only $\theta = 1$. After the first ✓ it is $\mathrm{Beta}(2, 2)$,
peaked at 0.5. Every ✗ moves the peak left and every ✓ moves it right. After
all ten: $\mathrm{Beta}(4, 8)$, peak 0.3, mean 0.33.

The curve does **not** narrow at every step. Its standard deviation falls from
0.289 (flat) to 0.138 after nine observations, but the ninth observation, a ✓
after five ✗ in the last six, raises it slightly to 0.139, because the data
then look less one-sided. In general an observation that contradicts the
current belief can widen the posterior; only on average over possible
observations does the posterior variance decrease. The overall narrowing is
the epistemic uncertainty shrinking, as described in
<a href="/courses/probabilistic-machine-learning/lecture/l01-introduction/">Lecture 01</a>.

--

## What the Posterior Gives You

After 3 of 10, with a flat prior: $\theta \mid D \sim \mathrm{Beta}(4, 8)$.

| question | answer | from |
|---|---|---|
| most plausible $p$ | $0.30 = h/n$ | the peak (mode) |
| best guess on average | $0.33$ | the posterior mean $\frac{a+h}{a+b+n}$ |
| where is $p$, 95%? | $[0.11,\ 0.61]$ | a **credible interval** |
| after 1,000 users, 300 back | $[0.27,\ 0.33]$ | same model, more data |


<div class="c-note">

The peak under a flat prior is exactly $h/n$. **<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>** keeps only this peak
and calls it maximum likelihood — the first shortcut of the course.

</div>


Notes:
All rows follow from $\mathrm{Beta}(4, 8)$. Mode: $(a - 1)/(a + b - 2) = 3/10$.
Mean: $4/12 \approx 0.33$; it lies to the right of the mode because the
posterior is right-skewed. The 95% interval is the equal-tailed one, from the
2.5% and 97.5% quantiles: $[0.109, 0.610]$. It supports the statement "$p$
lies in $[0.11, 0.61]$ with probability 0.95", given the prior and the model.
A highest-density interval, the shortest interval with 95% probability, is a
common alternative and differs slightly for skewed posteriors.

With 300 of 1,000 the posterior is $\mathrm{Beta}(301, 701)$, interval
$[0.272, 0.329]$. The posterior standard deviation falls from 0.131 to 0.0145,
a factor of about 9 for 100 times the data, close to the $1/\sqrt{n}$ law.
Under a flat prior the posterior is proportional to the likelihood, so the
mode equals the maximum-likelihood estimate $h/n$.

--

## How Much Does the Prior Matter?

Two analysts: one with a flat prior $\mathrm{Beta}(1,1)$, one convinced that
$p$ is near a half, $\mathrm{Beta}(10,10)$.

<div class="viz viz-xl" data-viz="math/prior-washout" data-steps="1"
 data-params='{"priors": [[1, 1], [10, 10]], "datasets": [[3, 10], [300, 1000]], "xLabel": "θ = P(user returns)"}'></div>


<div class="c-important">

With little data the prior matters; with enough data the analysts **agree**.
A prior is a stated assumption — it can be argued with, and it washes out.

</div>


Notes:
Step 0 shows the posteriors after 3 of 10, step 1 adds 300 of 1,000; each
panel has its own height scale. "Near a half" prior: $\mathrm{Beta}(10 + 3, 10 + 7) = \mathrm{Beta}(13, 17)$,
mean $13/30 \approx 0.43$; with 300 of 1,000, $\mathrm{Beta}(310, 710)$, mean
$310/1020 \approx 0.304$. Flat prior: means $4/12 \approx 0.33$ and
$301/1002 \approx 0.300$.

The posterior mean is a weighted average of prior mean and observed
proportion: $\frac{a + h}{a + b + n} = \frac{a + b}{a + b + n} \cdot \frac{a}{a + b} + \frac{n}{a + b + n} \cdot \frac{h}{n}$.
The prior's weight is $(a + b)/(a + b + n)$: for $\mathrm{Beta}(10, 10)$ it is
$20/30$ with 10 observations and $20/1020 \approx 2\\%$ with 1,000. The prior is
an explicit modelling assumption that can be criticised like any other. Where
data are scarce its influence is large, and it is then the only additional
information available. A prior that assigns zero density to some region can
never be corrected there by data.

## Mini-Exercise

Prior $\mathrm{Beta}(2, 2)$. Of 10 users, **8** come back.


<div class="q">

Is the posterior mean above or below $0.8$ — and why?

</div>



<div class="fragment">

**Below.** The posterior is $\mathrm{Beta}(2+8,\ 2+2) = \mathrm{Beta}(10, 4)$,
mean $10/14 \approx 0.71$. The prior counts two yeses and two noes, so it
pulls towards $0.5$ — and the pull fades as data grows.

</div>


Notes:
The posterior is $\mathrm{Beta}(10, 4)$ with mean $10/14 \approx 0.714$ and
mode $9/12 = 0.75$, both below the observed $0.8$. The weighted-average form
gives the reason: the mean is
$\frac{4}{14} \cdot 0.5 + \frac{10}{14} \cdot 0.8 \approx 0.714$, a compromise
between the prior mean 0.5 (weight $4/14$) and the data (weight $10/14$). With
80 of 100 the mean would be $82/104 \approx 0.79$.

Pulling an estimate towards a default value is called shrinkage. The same
effect appears as regularisation in model fitting: a prior centred on zero
weights corresponds to a penalty on large weights, which is how
<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a> reads weight decay.

--

## Two Ways to Answer "Where Is p?"

| | random | the 95% interval | needs |
|---|---|---|---|
| **Frequentist** | the data; $p$ is fixed | a **procedure** that catches $p$ in 95% of samples — about this one interval, no probability statement | nothing but the sampling model |
| **Bayesian** | $p$; the data is fixed | "$p$ lies in this interval with probability 0.95" — a true sentence about $p$ | a **prior**: what we believed about $p$ before the data |


<div class="c-insight">

The axioms are the same; the question is not. The rest of the course mostly
takes the second road — and <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a> starts with its cheapest version: keep
only the peak.

</div>


Notes:
Both schools use the same probability axioms but assign probabilities to
different things. Frequentist statistics assigns them only to repeatable
random events, here the data; a parameter is fixed, so statements about it are
statements about procedures (coverage, error rates). Bayesian statistics
assigns probabilities to any uncertain quantity, including a parameter, and
conditions on the observed data. The confidence interval needs no prior and
makes the weaker, procedural statement; the credible interval makes the direct
statement about $p$ and requires a prior.

With a flat prior and much data the two nearly coincide numerically: for 300
of 1,000 the credible interval is $[0.272, 0.329]$ and the Wald interval
$0.3 \pm 1.96 \cdot 0.0145 = [0.272, 0.328]$. This follows from the
Bernstein–von Mises theorem: for large $n$ the posterior is approximately
normal around the maximum-likelihood estimate with the same spread as its
sampling distribution. For small $n$, or an informative prior, the two
intervals differ, as for 3 of 10.

--

## Takeaway


<div class="takeaway">

An unknown parameter is just another unknown: give it a **prior**, condition on
the data, and the **posterior** says what the data justifies — as a peak, a mean
and an interval. For yes/no data with a Beta prior the update is **adding
counts**, and the prior's influence fades as data grows.

</div>


--

## What Was Counting, Really?


<div class="q">

Naive Bayes set $P(\text{new device} \mid \text{fraud}) = 60/100$ and
$P(\text{crypto} \mid \text{fraud}) = 0/100$. Which principle produces these
numbers — and which one would have avoided the 0?

</div>



<div class="fragment">

The share is the parameter value under which the observed data are **most
probable**: the **maximum likelihood estimate**. Smoothing used a prior and
took the posterior **mean**.

</div>



<div class="fragment c-note">

Both are readings of the posterior over the parameter just built — one its
peak, one its mean.

</div>


Notes:
A flag within one class is a Bernoulli variable with unknown parameter
$\theta = P(\text{flag} \mid y)$. For $h$ occurrences among $n$ cases of the
class, the probability of the observed data is $\theta^h (1 - \theta)^{n - h}$,
largest at $\theta = h/n$: the share. For $h = 0$ the maximum is at
$\theta = 0$, which is the zero-frequency problem. Laplace smoothing replaced
the share by $(h + 1)/(n + 2)$, the mean of the posterior under a flat prior.
Both readings are taken on the returning-users example of
<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>, where the whole posterior is
known and can be plotted.

--

<div class="column">

</div>


<div class="column middle">

- **peak** $0.30 = h/n$ — the share
- **mean** $0.33$ — the smoothed value
- **95% interval** $[0.11, 0.61]$


<div class="c-insight">

Naive Bayes kept only the **peak**. What does that drop — and why does almost
everyone do it?

</div>

Notes:
The posterior of <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>: 3 of 10 users
return, flat prior Beta(1, 1), so the posterior is Beta(1 + 3, 1 + 7) =
Beta(4, 8). Its three summaries: the mode $(a-1)/(a+b-2) = 3/10 = 0.30$, which
equals $h/n$ because the prior is flat; the mean $a/(a+b) = 4/12 = 0.33$, which
is Laplace's $(h + 1)/(n + 2)$; the central 95% interval $[0.109, 0.610]$ from
the Beta quantiles. The standard deviation is 0.13.

The peak (navy in the plot) is the only one of the three that can be found
without the normaliser, by maximising; mean and interval (amber) need the whole
distribution. Fitting by least squares or by cross-entropy is exactly this kind
of peak: least squares is the MLE under Gaussian noise, cross-entropy is the
negative log-likelihood of a Bernoulli or categorical output, and adding weight
decay turns either into a MAP estimate (<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>).

## The Likelihood, Read Along the Other Axis


<div class="c-definition">

The **likelihood** is the probability of the observed data, read as a function
of the **parameter** with the data held fixed: $L(\theta) = p(D \mid \theta)$.
The **maximum likelihood estimate** is its peak,
$\hat{\theta}\_{\mathrm{ML}} = \arg\max\_{\theta} p(D \mid \theta)$.

</div>



<div class="grid-2">


<div class="card">

### <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>, 3 of 10 users
$$p(\theta \mid D) \propto \theta^{3}(1-\theta)^{7} \cdot 1$$
With a **flat prior** the posterior *is* the normalised likelihood — so its peak
$h/n = 0.3$ is the maximum likelihood estimate.

</div>


<div class="card">

### Not a distribution over $\theta$
$$\int\_0^1 \theta^{3}(1-\theta)^{7} \mathrm{d}\theta = \frac{1}{1320}$$
The likelihood is a probability over **data**. Read along $\theta$ it need not
integrate to 1 — only the posterior does.

</div>


</div>


Notes:
With a flat prior $p(\theta) = 1$ on $[0, 1]$, Bayes' theorem gives
$p(\theta \mid D) = p(D \mid \theta) / p(D)$: the posterior is the likelihood
divided by a constant, so both have the same shape and the same arg max. The MLE
is therefore the MAP under a flat prior. With any other prior the two peaks
differ.

The normaliser here is $\int\_0^1 \theta^3 (1-\theta)^7 \\, d\theta = B(4, 8) =
3!\\,7!/11! = 1/1320$, the Beta function that turns the likelihood into the
Beta(4, 8) density. That the integral is not 1 shows that the likelihood is not
a density over $\theta$: it is a probability of the data for each fixed
$\theta$, and summed over all possible datasets it gives 1, not integrated over
$\theta$. A common error is to read "the likelihood of $\theta = 0.3$" as "the
probability that $\theta = 0.3$"; only the posterior supports the second
statement, and only after a prior has been chosen. The likelihood is also
defined only up to a constant factor in $\theta$ (for example the binomial
coefficient $\binom{10}{3}$ when only the count is recorded), which changes
neither its peak nor the posterior.

--

## Deriving $h/n$ Without a Posterior

The i.i.d. assumption of <a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a> lets the likelihood factorise over rows; the
logarithm turns the product into a sum without moving the peak:

$$
\ell(\theta) = \log \prod\_{i=1}^{n} \theta^{y\_i}(1-\theta)^{1-y\_i}
= h \log \theta + (n-h)\log(1-\theta)
$$

$$
\frac{d\ell}{d\theta} = \frac{h}{\theta} - \frac{n-h}{1-\theta} = 0
\quad\Longrightarrow\quad
\hat{\theta}\_{\mathrm{ML}} = \frac{h}{n}
$$


<div class="c-insight">

Last week's peak, found by **setting a derivative to zero** — no prior, no
normaliser, no integral. The recipe works unchanged for a million parameters,
where nobody can draw the posterior.

</div>


Notes:
Steps of the derivation. Under the i.i.d. assumption
$p(D \mid \theta) = \prod\_i \theta^{y\_i}(1-\theta)^{1-y\_i} = \theta^h (1-\theta)^{n-h}$
with $h = \sum\_i y\_i$, so the data enter only through the count $h$ (a
sufficient statistic). Taking the logarithm is allowed because $\log$ is
strictly increasing, so it does not move the arg max; it also avoids numerical
underflow of a product of many small probabilities and makes the derivative a
sum of per-row terms. Solving $h/\theta = (n-h)/(1-\theta)$ gives
$h(1-\theta) = (n-h)\theta$, i.e. $\theta = h/n$. The second derivative
$-h/\theta^2 - (n-h)/(1-\theta)^2$ is negative, so this is a maximum. For
$h = 0$ or $h = n$ the maximum lies on the boundary ($\theta = 0$ or $1$), where
the derivative is not zero; the formula $h/n$ still holds.

The reason the peak is used in practice: it replaces integration (the
normaliser $p(D)$) by optimisation. For models with many parameters there is no
closed form, and the maximum is found numerically, typically by gradient
methods on the negative log-likelihood.

--

## The Peak Can Lie

Three flips, **three heads**. Maximum likelihood: $\hat{\theta}\_{\mathrm{ML}} = 3/3 = 1$.

<div class="viz viz-lg" data-viz="ml/posterior-readings" data-steps="2"
 data-params='{"posterior": [4, 1], "prior": [1, 1], "xLabel": "θ = P(heads)", "title": "Flat prior (dashed), 3 heads: posterior Beta(4, 1)", "peakName": "peak (MLE)"}'></div>


<div class="q">

Predict before the second click: where do the posterior mean and the 95%
interval lie?

</div>


Notes:
Step 1 marks the peak of Beta(4, 1) at $\theta = 1$: the MLE $3/3$ assigns
probability 0 to tails, a claim no finite number of heads can justify. Step 2
adds the posterior mean and the central 95% interval. Beta(4, 1) has density
$4\theta^3$ and CDF $\theta^4$, so the mean is $4/5 = 0.8$ and the 2.5% and
97.5% quantiles are $0.025^{1/4} = 0.398$ and $0.975^{1/4} = 0.994$. The
posterior therefore says "probably above one half, possibly well below 1",
whereas the peak says "never tails".

The data and the model are not at fault; the information loss comes from
reducing a skewed posterior to its mode. For a posterior with its mode on the
boundary of the parameter space, the mode is an extreme point of the
distribution and a poor summary. This is the zero-frequency problem of naive
Bayes on a coin: there a count of 0 gave an estimated probability of exactly 0.

--

## A Prior's Peak: MAP

Keep the prior, and still take only the peak — the **maximum a posteriori**
estimate. With a $\mathrm{Beta}(a, b)$ prior, the same derivative gives

$$
\hat{\theta}\_{\mathrm{MAP}} = \arg\max\_{\theta} p(D \mid \theta) p(\theta)
= \frac{h + a - 1}{n + a + b - 2}
$$

| prior | data | MLE $h/n$ | MAP | posterior mean |
|---|---|---|---|---|
| $\mathrm{Beta}(1,1)$ flat | 3 of 3 | 1 | 1 | 0.80 |
| $\mathrm{Beta}(2,2)$ | 3 of 3 | 1 | **0.80** | 0.71 |
| $\mathrm{Beta}(2,2)$ | 8 of 10 (<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>) | 0.80 | **0.75** | 0.71 |


<div class="c-note">

The prior shifts the peak as if $a-1$ yeses and $b-1$ noes had been seen before
the data — a **flat** prior shifts nothing. MAP pulls 3 of 3 back to 0.8 — and still
reports one number.

</div>


Notes:
Derivation: the log-posterior is, up to a constant,
$(h + a - 1)\log\theta + (n - h + b - 1)\log(1 - \theta)$, the log-likelihood of a
dataset with $a - 1$ extra successes and $b - 1$ extra failures. Its maximum is
therefore $(h + a - 1)/(n + a + b - 2)$, valid when both exponents
$h + a - 1$ and $n - h + b - 1$ are non-negative and not both zero (for
$a, b < 1$ and few data the posterior density is unbounded at the boundary).
Beta(1, 1) adds nothing and MAP equals MLE.

Rows of the table. Beta(2, 2) with 3 of 3 gives posterior Beta(5, 2): mode
$4/5 = 0.80$, mean $5/7 = 0.71$. Beta(2, 2) with 8 of 10 gives Beta(10, 4):
mode $9/12 = 0.75$, mean $10/14 = 0.71$; this is the mini-exercise of
<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>.

The posterior mean $(a + h)/(a + b + n)$ is a different point from the MAP
$(a + h - 1)/(a + b + n - 2)$; they coincide only for a symmetric posterior
($a + h = b + n - h$). MAP is not invariant under reparametrisation (the mode of
a density changes when $\theta$ is transformed), the MLE is. Penalised fitting
of weights, such as ridge regression or weight decay, is MAP with a Gaussian
prior (<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>).

--

## Why Everyone Keeps the Peak


<div class="grid-2-1">


<div class="column">

| | the whole posterior | only the peak |
|---|---|---|
| **needs** | the normaliser $p(D)$ — an integral over $\theta$ | a derivative |
| **in 1 dimension** | a Beta table | $h/n$ |
| **in a million** | an integral nobody can compute exactly | gradient descent |
| **costs** | computation | the **spread** |

</div>


<div class="c-note">

With **1,000 users** the posterior is $\mathrm{Beta}(301, 701)$: standard
deviation $0.015$. The peak is nearly everything there is to know.

</div>


</div>


Notes:
The full posterior needs $p(D) = \int p(D \mid \theta) p(\theta)\\,d\theta$. In
one dimension with a conjugate prior this is a known Beta function; in general
it is an integral over all parameters, which has no closed form for most models
and grows intractable with dimension. The peak needs only the unnormalised
log-posterior and its gradient.

Numbers for the note: Beta(301, 701) has standard deviation
$\sqrt{ab/((a+b)^2(a+b+1))} = 0.0145$ and central 95% interval
$[0.272, 0.329]$ (<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>). With $n$
observations the posterior standard deviation shrinks roughly as
$\sqrt{\theta(1-\theta)/n}$, so with enough data the posterior concentrates
around the peak and the peak is an adequate summary.

The approximation fails where the data say little: small samples, many
parameters relative to data, and predictions far from the observed inputs. The
last case persists even with large datasets; Bayesian linear regression
(<a href="/courses/probabilistic-machine-learning/lecture/l07-probabilistic-algorithms/">Lecture 07</a>) shows predictive
uncertainty growing away from the data, which a point estimate of the weights
cannot express.

--

## Mini-Exercise

Two analysts both report $\hat{\theta} = 0.3$. One saw **3 of 10** users return,
the other **300 of 1,000**.


<div class="q">

What does the reported number hide — and which estimate would you bet on?

</div>



<div class="fragment">

The **spread**. The posteriors of <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>: $[0.11, 0.61]$ after 10 users,
$[0.27, 0.33]$ after 1,000 — the same peak, an interval nine times wider. Bet
on the second; a point estimate cannot tell you to.

</div>


Notes:
Answer: the point estimate hides the spread. 3 of 10 with a flat prior gives
Beta(4, 8), 95% interval $[0.11, 0.61]$, standard deviation 0.13; 300 of 1,000
gives Beta(301, 701), interval $[0.27, 0.33]$, standard deviation 0.015. The
interval widths are 0.50 and 0.057, a ratio of about 9, close to the factor
$\sqrt{1000/10} = 10$ expected from a spread shrinking as $1/\sqrt{n}$.

The two estimates agree in value but not in reliability, so the 1,000-user
estimate is the one to rely on. The number 0.3 alone cannot distinguish the two
cases; reporting $n$ or an interval alongside the estimate restores the missing
information.

--

## Three Choices, Made Separately

| choice | options | decides |
|---|---|---|
| **what to model** | generative: $p(y)$, $p(x \mid y)$ · discriminative: $p(y \mid x)$ | which distribution is learned |
| **how to fit $\theta$** | MLE · MAP · keep the whole posterior | which parameters we keep |
| **how to decide** | most probable class · a threshold from the costs | what we do with $P(y \mid x)$ |


<div class="c-warning">

**Two different "MAP"s.** MAP *estimation* picks the most probable
**parameter** given the training data. The MAP *decision* picks the most
probable **class** for one input, $\arg\max\_y P(y \mid x)$.

</div>


Notes:
The three choices can be combined freely. Naive Bayes is generative; fitted by
counting it is the MLE, with Laplace smoothing the posterior mean under a flat
prior, and with a Beta$(a, b)$ prior and the mode it is MAP. Logistic regression
(<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>) is discriminative;
fitted by minimising cross-entropy it is the MLE, with an L2 penalty the MAP
estimate under a Gaussian prior. Either model can keep its whole posterior over
parameters instead (Bayesian logistic regression, Bayesian naive Bayes), at the
cost of an integral.

The decision is a third, separate step. The MAP decision rule
$\arg\max\_y P(y \mid x)$ minimises the error rate; with unequal costs of errors
the threshold moves (<a href="/courses/probabilistic-machine-learning/lecture/l06-evaluation-and-risk/">Lecture 06</a>). The
"maximum likelihood decision" $\arg\max\_y p(x \mid y)$ ignores the class prior;
for rare classes it is the base-rate error of
<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>. The name clash between
MAP estimation and the MAP decision is common in textbooks; both maximise a
posterior, but over different unknowns.

--

## Takeaway


<div class="takeaway">

**Shortcut 1 — keep the peak.** Maximum likelihood (flat prior) and MAP (with a
prior) keep the posterior's most probable point; naive Bayes' counting was the
first. It is cheap — a derivative instead of an integral — and harmless with
plenty of data. It drops the **spread**, and it is a choice of its own:
generative or discriminative, every model is fitted this way.

</div>
