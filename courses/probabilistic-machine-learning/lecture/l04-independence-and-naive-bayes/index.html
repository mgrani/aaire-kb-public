# The Generative Route


<div class="guiding-question">

**Guiding Question:** Logistic regression never asked what a fraudulent
transaction *looks like*. What would it take to model that — and why does
nobody do it in full?

</div>


--

## Two Routes to the Same Posterior

A labelled table of transactions supports **both** routes to
$P(\text{fraud} \mid x)$, where $x$ is the vector of red flags:


<div class="grid-2">


<div class="card">

<span class="eyebrow">Discriminative — Lecture 03</span>

### Model $p(y \mid x)$ directly

Logistic regression: a score for each $x$. Nothing is said about how $x$
arises.

</div>


<div class="card">

<span class="eyebrow">Generative — today</span>

### Model $p(y)$ and $p(x \mid y)$

How does a *fraudulent* transaction look, and how an honest one? Then convert
with Bayes.

</div>


</div>


$$
\eqa{P(y \mid x)} = \frac{\eqb{p(x \mid y)} \cdot \eqc{P(y)}}{\eqd{\sum\_{y'} p(x \mid y') P(y')}}
$$

Notes:
Math first on the second pass: the students know Bayes' theorem from L02; the
only new thing is that the "hypothesis" is now a class and the "evidence" a
whole attribute vector. The colour slots are those of L02 (posterior,
likelihood, prior, normaliser).

Correct a misconception before it forms: the generative route is not forced on
us by the data. A labelled table estimates p(y | x) just as directly — Lecture
03 did exactly that. The generative route is a *choice*: model each class
separately, then convert.

--

## Why Model How Fraud Looks?


<div class="q">

Logistic regression already gives $P(\text{fraud} \mid x)$. What can a model of
$p(x \mid y)$ do that it cannot?

</div>



<div class="fragment">


<div class="marks-yes">

- **Keep the prior explicit.** The 1 in 1,000 of Lecture 02 is a separate
  factor: a new market with 1 in 200 changes $P(y)$, not the whole model.
- **Handle a missing field.** An attribute nobody observed can be summed out of
  $p(x \mid y)$.
- **Notice the strange.** A transaction with tiny $p(x)$ under *both* classes
  is unlike anything seen — a score alone cannot say so.

</div>



<div class="c-warning">

The price: $p(x \mid y)$ is a **joint distribution over all attributes**, one
per class.

</div>


</div>


Notes:
Let the room answer before the click; students with an ML background usually
name "missing values" and sometimes "the prior". The novelty point is the one
they rarely name, and it is exactly what "only what you need" dropped in
Lecture 03.

Each of the three items returns in Module 3 as a concrete comparison. Here they
only motivate paying the price on the next slide.

## Takeaway


<div class="takeaway">

The generative route models **how the data arises** — $p(y)$ and $p(x \mid y)$ —
and converts with Bayes. It keeps the prior explicit and can answer questions
about $x$ itself, but it must pay for a **joint over all attributes**, which
explodes.

</div>

# Naive Bayes: Assume It Apart


<div class="guiding-question">

**Guiding Question:** Its central assumption is almost always false, and it
classifies well anyway. How can both be true?

</div>


--

## Conditional Independence


<div class="c-definition">

**Definition.** $A$ and $B$ are **conditionally independent given $C$**,
written $A \indep B \mid C$, iff
$$
P(A \cap B \mid C) = P(A \mid C) \cdot P(B \mid C)
\quad\Longleftrightarrow\quad
P(A \mid B \cap C) = P(A \mid C)
$$

</div>


Reading: **once $C$ is known, $B$ tells us nothing more about $A$.**


<div class="q">

Among frauds only: does a new device make a foreign IP more likely?

</div>


Notes:
Math first, then the reading (P5). This is the definition naive Bayes rests on,
so it comes before naive Bayes (the old order taught it a module later). The
full treatment — a counted example, and the case where conditioning *creates*
dependence — opens Lecture 05, where it becomes the language of graphs.

Leave the question open. Most students will say "yes, account take-overs bring
both" — which is exactly the dependence naive Bayes will assume away, and the
subject of "Counting Evidence Twice" at the end of the module.

--

<div class="column">

</div>


<div class="column">


<div class="c-important">

Assume the attributes are **independent given the class**:
$$
p(x\_1, \ldots, x\_p \mid y) = \prod\_{j=1}^{p} p(x\_j \mid y)
$$

</div>


| flags | full joint, per class | naive |
|---|---|---|
| 3 | 7 | 3 |
| 30 | 1,073,741,823 | 30 |

</div>


</div>



<div class="c-warning">

</div>


Notes:
The graph is a preview of Lecture 05, where a missing arrow will be read as an

## Fitting Is Counting

$$
\hat{P}(y) = \frac{n(y)}{n}
\qquad
\hat{P}(x\_j = v \mid y) = \frac{n(x\_j = v,\ y)}{n(y)}
$$


<div class="grid-2">


<div class="card">

### Lecture 02
Each attribute, within one class, is a **categorical** variable — for a
yes/no flag, a Bernoulli.

</div>


<div class="card">

### Lecture 03
Its maximum likelihood estimate is the **relative frequency** — the same
derivation as $h/n$ for the coin.

</div>


</div>



<div class="c-insight">

Naive Bayes is fitted in one pass over the table, with no optimiser — and every
number it uses is a **peak**. Shortcut 1 is taken as well.

</div>


Notes:
Math first: show the two formulas and ask what principle produces them before
revealing the cards verbally. The answer the course has prepared: the
categorical distribution was introduced in L02 as "the distribution naive Bayes
uses for every nominal attribute", and L03 derived that the MLE of a Bernoulli
is h/n. Under the naive assumption the likelihood splits into one categorical
per attribute and class, so each is maximised separately — by counting.

This is worth a sentence: the independence assumption is what makes the MLE a
closed-form count. Logistic regression has no closed form.

--

## The Classifier

$$
P(y \mid x\_1, \ldots, x\_p) = \frac{P(y) \prod\_{j} p(x\_j \mid y)}{\sum\_{y'} P(y') \prod\_{j} p(x\_j \mid y')}
$$

For two classes, divide the two posteriors — the normaliser cancels:

$$
\underbrace{\frac{P(\text{fraud} \mid x)}{P(\text{honest} \mid x)}}\_{\text{posterior odds}}
= \underbrace{\frac{P(\text{fraud})}{P(\text{honest})}}\_{\text{prior odds}}
\cdot \prod\_{j=1}^{p} \underbrace{\frac{p(x\_j \mid \text{fraud})}{p(x\_j \mid \text{honest})}}\_{\text{likelihood ratio } \mathrm{LR}\_j}
$$


<div class="c-note">

Every observed attribute **multiplies the odds** by its likelihood ratio: above
1 it speaks for fraud, below 1 against.

</div>


Notes:
The first line is Bayes with the naive product, and the denominator is total
probability — nothing new, only assembled. The odds form is what makes the
method readable: each flag is one factor, and the order in which they arrive
does not matter. Odds were introduced with Bayes in L02.

--

## Three Red Flags

100,000 transactions, 100 of them fraud: prior odds $1 : 999$.

| flag | among frauds | among honest | likelihood ratio |
|---|---|---|---|
| new device | 60% | 10% | 6 |
| foreign IP | 70% | 5% | 14 |
| night | 50% | 20% | 2.5 |


<div class="q">

A transaction shows all three flags. Is it more likely fraud than not?

</div>



<div class="fragment">

$$
\text{odds} = \frac{1}{999} \cdot 6 \cdot 14 \cdot 2.5 = \frac{210}{999}
\quad\Longrightarrow\quad
P(\text{fraud} \mid x) = \frac{210}{1{,}209} \approx 17\\%
$$


<div class="c-warning">

Three red flags, each one strong — and still **mostly honest**. The base rate
of Lecture 02, once more.

</div>


</div>


Notes:
Let the room guess first; most will say "clearly fraud". The model here has
exactly these three flags, all of them present, so only the three ratios
enter. With a flag observed *absent* its factor would be (1 − 0.5)/(1 − 0.2) =
0.625 for night, for example — worth mentioning if someone asks.

Numbers: 0.6/0.1 = 6, 0.7/0.05 = 14, 0.5/0.2 = 2.5; 6 · 14 · 2.5 = 210;
210/(210 + 999) = 0.1737.

--

## Evidence Adds Up

 data-params='{"prior": [1, 999], "factors": [{"lr": 6, "label": "new device"}, {"lr": 14, "label": "foreign IP"}, {"lr": 2.5, "label": "night"}]}'></div>

**Predict before each click:** which flag moves the probability most?

Notes:
Stepped: one click per flag. On a log-odds axis every likelihood ratio is a

So the evidence *adds*. Stop after the foreign IP (7.8%) and ask what the

## One Zero Vetoes Everything

A new flag: **payment to a crypto exchange**. Among the 100 frauds it never
occurred.


<div class="grid-2-1">


<div class="column">

$$
\hat{P}(\text{crypto} \mid \text{fraud}) = \frac{0}{100} = 0
$$

A transaction with this flag gets posterior odds **exactly 0** — whatever the
other thirty flags say. One unseen value vetoes all other evidence.

</div>


<div class="c-danger">

<span class="eyebrow">Keep the peak, fails</span>

"Not seen in 100 frauds" became "impossible for a fraud" — the three heads in
three flips of Lecture 03, in a single cell.

</div>


</div>


Notes:
The zero-frequency problem, in the course's language: an MLE on a small count
is extreme. With 100 frauds, many plausible fraud patterns have count zero.
Ask for a repair before the next slide — "add one" usually comes up. The next
slide shows that "add one" is not a hack.

## Smoothing Is a Prior

**Laplace smoothing** adds one pseudo-count to every value of attribute $j$
($k\_j$ values):

$$
\hat{P}(x\_j = v \mid y) = \frac{n(x\_j = v,\ y) + 1}{n(y) + k\_j}
$$

For a yes/no flag ($k\_j = 2$) this is $\frac{h + 1}{n + 2}$ — the **posterior
mean** $\frac{a + h}{a + b + n}$ of Lecture 02 under the flat prior
$\mathrm{Beta}(1, 1)$. For $k\_j > 2$ values, the flat Dirichlet does the same.

| count among 100 frauds | MLE (peak) | smoothed (mean) |
|---|---|---|
| 0 | 0 | $1/102 \approx 0.010$ |
| 60 | 0.60 | $61/102 \approx 0.598$ |


<div class="c-insight">

Under the flat prior the peak of 0 of 100 is still 0. Smoothing quietly
**leaves the peak for the mean** — exactly where the peak was wrong.

</div>


Notes:
This is the most satisfying tie of the lecture: a folklore trick of naive
Bayes is the posterior mean the students computed in L02 (after 3 of 10 with a
flat prior: mean 4/12 = 0.33). The Dirichlet is the Beta for more than two
values; it needs only the name here.

The table shows why nobody notices the switch on well-populated cells (0.60 vs
0.598) and why it matters on empty ones. Larger pseudo-counts mean a stronger
prior, as in L02's "near a half" analyst.

--

## Counting Evidence Twice


<div class="grid-2">


<div class="column">

![Naive Bayes with the dropped dependence between new device and foreign IP](/courses/probabilistic-machine-learning/figures/l04-naive-bayes-dropped.svg)

</div>


<div class="column">

In an account take-over, a new device and a foreign IP **arrive together**.
Suppose both appear on 55% of frauds and 4% of honest transactions:

| | ratio for the pair | $P(\text{fraud})$ with night |
|---|---|---|
| naive Bayes | $6 \cdot 14 = 84$ | 17.4% |
| the real pair | $0.55 / 0.04 \approx 14$ | 3.3% |

</div>


</div>



<div class="c-warning">

Correlated flags are **counted twice**, so naive Bayes is **over-confident**.
Its ranking of transactions often survives; its probabilities do not.

</div>


Notes:
Answer the question left open on the first slide. The dropped edge is drawn
dashed: naive Bayes multiplies both ratios as if they were separate witnesses,
though they largely report the same event. With the pair's own ratio 13.75,
the posterior odds are 13.75 · 2.5/999 = 34.4/999, i.e. 3.3% instead of 17.4%.

The consequence connects to Lecture 03's calibration: naive Bayes scores push
towards 0 and 1 and are not calibrated. That argmax decisions often survive
anyway is the classic explanation of why naive Bayes classifies well
(Domingos & Pazzani, 1997) — the answer to the module's guiding question.

--

## Mini-Exercise

A bug feeds the **foreign-IP** flag into the model twice.


<div class="q">

Does the fraud probability of our three-flag transaction go up, down, or stay
— and what does that say about correlated attributes?

</div>



<div class="fragment">

**Up — from 17% to about 75%.** The odds get a second factor 14:
$2{,}940 : 999$. Naive Bayes cannot tell a copy from new evidence; a strongly
correlated attribute is almost a copy.

</div>


Notes:
One question, answerable qualitatively in seconds; the number is for checking
(2940/3939 = 0.746). The bug is the extreme case of the previous slide: perfect
correlation. Real feature sets contain near-copies all the time — the same
information coded twice, derived features, one-hot groups.

--

## Takeaway


<div class="takeaway">

Naive Bayes **assumes the joint apart** — attributes independent given the
class — and **keeps the peak** of every count; smoothed, it keeps the Beta
posterior *mean* instead. It is cheap, needs little data and ranks well. Its
probabilities are over-confident wherever attributes move together.

</div>

# Generative vs Discriminative


<div class="guiding-question">

**Guiding Question:** Naive Bayes and logistic regression see the same fraud
table. Which would you trust with 50 labelled frauds — and which with 50,000?

</div>


--

## The Same Line, Fitted Twice

Take the logarithm of the naive-Bayes odds. For yes/no flags
$x\_j \in \lbrace 0, 1 \rbrace$ with $\theta\_{jy} = P(x\_j = 1 \mid y)$:

$$
\log \frac{P(\text{fraud} \mid x)}{P(\text{honest} \mid x)} = w\_0 + \sum\_{j=1}^{p} w\_j x\_j,
\qquad
w\_j = \log \frac{\theta\_{j1}}{\theta\_{j0}} - \log \frac{1 - \theta\_{j1}}{1 - \theta\_{j0}}
$$


<div class="q">

Where have you seen a log-odds that is linear in $x$?

</div>



<div class="fragment">


<div class="c-insight">

**Logistic regression** (Lecture 03): $P(\text{fraud} \mid x) = \sigma(w\_0 + w^\top x)$.
Same family of classifiers — naive Bayes sets the weights by **counting**, one
attribute at a time; logistic regression by **maximising
$\sum\_i \log p(y\_i \mid x\_i)$**, all weights jointly.

</div>


</div>


Notes:
Math first (P5). The derivation is two lines and belongs on the exercise sheet:
log p(x_j | y) = x_j log θ_jy + (1 − x_j) log(1 − θ_jy), so each flag
contributes a constant plus x_j times a weight; the constants and the log
prior odds collect in w_0. With the fraud numbers, w for the new device is
log 6 − log(0.4/0.9) ≈ 1.79 + 0.81 = 2.60.

The consequence of "jointly": logistic regression sees that the new device
and the foreign IP arrive together and splits the credit between them. Naive
Bayes cannot; each weight is estimated as if its flag were alone. That is the
double counting of Module 2, now visible in the weights.

--

## Two Ways to a Classifier

| | naive Bayes — generative | logistic regression — discriminative |
|---|---|---|
| models | $P(y)$ and $p(x \mid y)$ | $P(y \mid x)$ only |
| fitted by | counting (joint likelihood) | iterative optimisation (conditional likelihood) |
| correlated flags | counted twice | credit shared |
| a missing field | drop its factor | needs a value |
| an unusual $x$ | low $p(x)$: can be flagged | still a confident score |
| a new base rate | change $P(y)$ | refit or correct the intercept |
| drops | dependences between attributes | everything about $x$ |

Notes:
A table because the two are compared along shared dimensions. Walk it row by
row and let students predict each cell for logistic regression before
showing it, if time allows. The last row is the course arc: each model is
placed by what it drops. "Correct the intercept": in logistic regression the
base rate sits inside w_0, so a new base rate shifts w_0 by the log of the
ratio of prior odds — possible, but not visible in the model as a separate
factor.

--

## Few Data, Many Data


<div class="grid-2-1">


<div class="column">

![Schematic learning curves: naive Bayes levels off early at a higher error, logistic regression later at a lower one](/courses/probabilistic-machine-learning/figures/l04-learning-curves.svg)

</div>


<div class="column">

**Few labelled frauds:** naive Bayes. Its assumption acts like a strong prior —
little to estimate, so it settles fast.

**Many labelled frauds:** logistic regression. It pays for fewer assumptions
with data, and ends lower.

</div>


</div>



<div class="c-note">

Shown empirically and in theory by Ng & Jordan (2002). A wrong assumption costs
accuracy in the limit and buys it early — the prior of Lecture 02, again.

</div>


Notes:
The figure is schematic — say so. Ng & Jordan (NIPS 2002, "On discriminative vs.
generative classifiers") show that naive Bayes approaches its asymptotic error
with a number of examples logarithmic in the number of attributes, logistic
regression with a number linear in it; the discriminative asymptote is never
worse. On many real datasets the curves cross.

Answer the module's guiding question: with 50 labelled frauds, trust naive
Bayes' ranking; with 50,000, logistic regression. And the general point:
an assumption is information. When it is roughly right it substitutes for
data; when it is wrong it caps what data can do.

--

## Mini-Exercise

Our three-flag transaction arrives **without the IP field** — the logging
failed.


<div class="q">

What does naive Bayes do with it — and what does logistic regression do?

</div>



<div class="fragment">

**Naive Bayes** drops the factor: $\sum\_v p(x\_{\text{IP}} = v \mid y) = 1$, so
the odds become $6 \cdot 2.5 : 999$ — about **1.5%**. **Logistic regression**
has no model of $x$: it needs *some* value for $x\_{\text{IP}}$, so someone must
impute one, or train a second model without the field.

</div>


Notes:
The generative advantage in its most practical form. Marginalising a missing
attribute out of a product of per-attribute factors is summing one factor over
its values, which gives 1. The number: 15/1014 ≈ 0.0148. Compare with 17% when
the IP was present and foreign: the missing field matters, and naive Bayes
reports that honestly instead of guessing it.

--

## Takeaway


<div class="takeaway">

Naive Bayes and logistic regression draw **the same kind of line**; they differ
in what they model. The generative model pays with assumptions about $x$ and
gets answers about $x$; the discriminative one pays with data.

</div>
