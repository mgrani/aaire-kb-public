# Probabilistic Machine Learning
## Lecture 04: Discriminative Models: Linear and Logistic Regression

Prof. Dr. Michael Granitzer

<!-- 2026-10-06: swapped with the former Lecture 04. The classical account moved
from the backup into Classical Linear Regression; the one-slide regression recap was dropped. -->

Notes:
Classical Linear Regression covers the residual sum of squares, the closed
form, $R^2$, basis functions, the LMS update, gradient descent and the
Gauss–Markov theorem. Probabilistic Linear Regression shows that squared error is the negative
log-likelihood of Gaussian noise of fixed width, so the least-squares fit is the
maximum-likelihood estimate (keep the peak, <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>), and that
$\hat\sigma^2\_{\mathrm{ML}} = \mathrm{RSS}/n$ is biased low. Logistic Regression replaces the
Gaussian by a Bernoulli: logistic regression, cross-entropy as negative
log-likelihood, and no finite maximum on separable data. Both models are
discriminative — shortcut 3, model only $p(y \mid x)$. Generative vs. Discriminative Models shows that for
yes/no attributes naive Bayes (<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>) has the same linear log-odds
and differs only in how the weights are fitted. Calibration answers when a score is
a probability (<a href="/courses/probabilistic-machine-learning/lecture/l01-introduction/">Lecture 01</a>): calibration, what maximum likelihood guarantees,
the correction for rebalanced training, and penalties as priors.

Running examples: house prices for 20 flats of 40–120 m² and the 600 m² villa of
<a href="/courses/probabilistic-machine-learning/lecture/l01-introduction/">Lecture 01</a> (regression); fraud with a base rate of 1 in 1,000 and
the yes/no flags of <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a> (classification).

--

## Where We Left Off

<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a> built a classifier from probability and took two shortcuts on the way:

| Shortcut | Instead of the ideal | What is dropped |
|---|---|---|
| **Keep the peak** | the most probable parameter (MLE, MAP) | the spread: how sure we are |
| **Assume it apart** | factorise the joint — naive Bayes | the dependences between attributes |


<div class="grid-2-1">


<div class="column">

Today we meet the methods you know from earlier courses — linear and logistic
regression — and read them as **probability models**. They never model the
inputs:

$$
p(y \mid x) \quad\text{instead of}\quad p(x, y) = p(y) \cdot p(x \mid y)
$$

</div>


<div class="c-insight">

<span class="eyebrow">Shortcut 3</span>

**Only what you need:** model the label given the inputs — *discriminative*.

</div>


</div>


Notes:
Naive Bayes models the joint $p(x, y) = p(y)\\,p(x \mid y)$ and makes it
tractable by assuming the attributes independent given the class. A
discriminative model avoids the problem in another way: it parametrises
$p(y \mid x)$ directly, so no distribution over the inputs is needed and no
assumption about their dependences is made. The price is that the model says
nothing about $x$ itself — how typical an input is, how to average over a missing
attribute, how to generate an example.

Both routes target the same quantity, $p(y \mid x) = p(y)\\,p(x \mid y)/p(x)$.
The generative route computes it from the joint by Bayes' theorem; the
discriminative route fits it as a function of $x$. Linear regression is
discriminative in the same sense: it models the price given the floor area and
never the distribution of floor areas. Running examples: fraud with a base rate
of 1 in 1,000 and a few yes/no red flags, and the house prices (flats of
40–120 m², the 600 m² villa) of <a href="/courses/probabilistic-machine-learning/lecture/l01-introduction/">Lecture 01</a>.


--

</div>


Notes:
Boxes of the map. Classical Linear Regression: squared error, closed form, LMS and Gauss–Markov,

the villa as at a flat. Logistic Regression: Bernoulli labels imply cross-entropy; the
gradient is error × feature as in LMS; on separable data the maximum-likelihood
estimate does not exist. Generative vs. Discriminative Models: naive Bayes and logistic regression share the
linear log-odds; naive Bayes is better with few data and handles missing fields,
logistic regression reaches lower error with more data. "What is dropped":
the inputs are never modelled, so unusual inputs raise no warning. Calibration:
maximum likelihood is calibrated only on average, rebalanced scores are repaired
with prior odds, weight decay is a Gaussian prior (MAP).

Takeaway box: the loss states the noise model, the penalty is a prior, the fit

# Classical Linear Regression


<div class="guiding-question">

**Guiding Question:** You have fitted lines by least squares many times. What
exactly is the method, and what justifies it?

</div>


Notes:
The units of this module are shared with the Data Science course and give the
classical, distribution-free account. Two of its results return later in the
lecture. The LMS update $w\_i \leftarrow w\_i + \eta e x\_i$ (error × feature) has
the same form as the gradient of the logistic log-likelihood, with the
prediction passed through a sigmoid. The Gauss–Markov theorem justifies least
squares under weak conditions — zero-mean, uncorrelated errors of equal
variance, no normality — but yields only a point estimate. The probabilistic
account of Probabilistic Linear Regression assumes Gaussian noise and in exchange gives a full
distribution $p(y \mid x)$: a noise-variance estimate, a predictive band, and
assumptions that can be checked on the residuals.

--

## Classification versus Regression


<div class="grid-2">


<div class="column">


<div class="card">

### Classification
$Y$ is a finite set of labels.

*Will this customer default — yes or no?*

</div>


</div>


<div class="column">


<div class="card">

### Regression
$Y = \mathbb{R}$, the target is a quantity.

*What credit line should this customer receive?*

</div>


</div>


</div>


The learning machinery is the same; only the shape of $Y$ — and therefore the
loss — changes.

Notes:
The distinction is fixed by the target set $Y$, not by the inputs: the same
customer record supports a classification task (default, yes or no) and a
regression task (credit line in euros). The usual losses follow from $Y$: 0/1
error or cross-entropy for a finite $Y$, squared or absolute error for
$Y = \mathbb{R}$. Ordinal targets (ratings 1–5) and counts lie in between;
treating them as unordered classes ignores their order, treating them as real
numbers ignores their discreteness.

--

## The Model


<div class="c-definition">

**Linear regression** predicts the target as a weighted sum of the features:

$$
h\_{\mathbf{w}}(\mathbf{x}) = w\_0 + w\_1 x\_1 + \ldots + w\_p x\_p
= \mathbf{w}^{\top}\mathbf{x}
$$

with $x\_0 = 1$ absorbing the intercept.

</div>


The hypothesis space is $\mathbb{R}^{p+1}$: one hypothesis per weight vector.

Notes:
Absorbing the intercept means prepending a constant feature $x\_0 = 1$ to every
input, so that $w\_0$ is handled like any other weight and the design matrix
$\mathbf{X}$ has a column of ones. The hypothesis space
$\lbrace h\_{\mathbf{w}} : \mathbf{w} \in \mathbb{R}^{p+1} \rbrace$ is continuous and
finite-dimensional, so the best hypothesis is found by calculus — setting the
gradient of the objective to zero — rather than by enumeration.

A weight $w\_j$ is the change of the prediction per unit change of $x\_j$ with all
other features held fixed. Its size depends on the unit of $x\_j$: weights of
features on different scales are not directly comparable, and a large weight
does not by itself mean an important feature.

--

## The Objective: Residual Sum of Squares

$$
\hat{\mathbf{w}} = \arg\min\_{\mathbf{w} \in \mathbb{R}^{p+1}} \mathrm{RSS}(\mathbf{w}),
\qquad
\mathrm{RSS}(\mathbf{w}) = \sum\_{i=1}^{n}\big(y\_i - \mathbf{w}^{\top}\mathbf{x}\_i\big)^2
$$


<div class="c-note">

RSS measures **effectiveness** — how good the predictions are. Do not confuse
it with **efficiency**, which is about runtime and computational effort.

</div>


Notes:
$\mathrm{RSS}/n$ is the mean squared error and $\sqrt{\mathrm{RSS}/n}$ the
root-mean-square error, which is in the unit of the target. Squaring makes the
objective differentiable everywhere and convex in $\mathbf{w}$ — a quadratic
with a unique minimum when $\mathbf{X}^{\top}\mathbf{X}$ is invertible — and
weights large residuals disproportionately: a residual twice as large costs four
times as much, so a single outlier can move the fit considerably.

Effectiveness and efficiency are independent: a model can be accurate and slow
to fit, or fast and inaccurate. Calling an accurate model "efficient" is a
common misuse of the term.

--

## One Feature: The Closed Form

For a single feature the minimiser can be written down directly:


<div class="grid-2">


<div class="column">


<div class="card">

### Slope
$$\hat{w}\_1 = \frac{\sum\_i (x\_i - \overline{x})(y\_i - \overline{y})}{\sum\_i (x\_i - \overline{x})^2}$$

The covariance of $x$ and $y$ over the variance of $x$.

</div>


</div>


<div class="column">


<div class="card">

### Intercept
$$\hat{w}\_0 = \overline{y} - \hat{w}\_1 \overline{x}$$

The fitted line passes through the point of means.

</div>


</div>


</div>


Notes:
Derivation. Setting
$\partial\mathrm{RSS}/\partial w\_0 = -2\sum\_i (y\_i - w\_0 - w\_1 x\_i) = 0$ gives
$w\_0 = \overline{y} - w\_1\overline{x}$. Substituting this into
$\partial\mathrm{RSS}/\partial w\_1 = -2\sum\_i x\_i (y\_i - w\_0 - w\_1 x\_i) = 0$
gives the slope formula. Dividing numerator and denominator by $n - 1$ shows
$\hat{w}\_1 = \mathrm{cov}(x, y)/\mathrm{var}(x) = r\_{xy}\\, s\_y / s\_x$, with
$r\_{xy}$ the correlation coefficient; the slope is undefined when all $x\_i$ are
equal.

Consequences: the residuals sum to zero, and the line passes through
$(\overline{x}, \overline{y})$. Regressing $x$ on $y$ gives a different line,
because least squares measures errors vertically, in $y$ only; the two lines
coincide only when $\lvert r\_{xy} \rvert = 1$.

--

## How Much Variance Is Explained?


<div class="c-definition">

$$
\mathrm{TSS} = \mathrm{ESS} + \mathrm{RSS},
\qquad
R^2 = \frac{\mathrm{ESS}}{\mathrm{TSS}} = 1 - \frac{\mathrm{RSS}}{\mathrm{TSS}}
$$
where TSS is the total, ESS the explained and RSS the residual sum of squares
(the split holds for a least-squares fit with an intercept).

</div>


$R^2$ is the fraction of the target's variation the model accounts for: 0 means
no better than predicting the mean, 1 means an exact fit.


<div class="c-warning">

**Training** $R^2$ never decreases when a feature is added, however useless the
feature. A high training $R^2$ is not evidence that a model generalises —
test $R^2$ and adjusted $R^2$ can and do fall.

</div>


Notes:
Definitions: $\mathrm{TSS} = \sum\_i (y\_i - \overline{y})^2$,
$\mathrm{ESS} = \sum\_i (\hat{y}\_i - \overline{y})^2$,
$\mathrm{RSS} = \sum\_i (y\_i - \hat{y}\_i)^2$. The split holds because, with an
intercept, the residuals sum to zero and are orthogonal to the fitted values, so
the cross term vanishes. For a single feature, $R^2 = r\_{xy}^2$.

Without an intercept, or on test data, $1 - \mathrm{RSS}/\mathrm{TSS}$ can be
negative: the model is then worse than predicting the mean. Training $R^2$
cannot fall when a feature is added, because the larger model contains the
smaller one (set the new weight to 0), so its minimal RSS is at most as large.
Adjusted $R^2 = 1 - (1 - R^2)\\,\frac{n - 1}{n - p - 1}$ charges for each of the
$p$ features and falls when a feature reduces RSS by less than a random feature
would on average.

--

## Higher Dimensions

With $p$ features the same objective in matrix form,

$$
\hat{\mathbf{w}} = (\mathbf{X}^{\top}\mathbf{X})^{-1}\mathbf{X}^{\top}\mathbf{y}
$$

gives the optimum in one step whenever $\mathbf{X}^{\top}\mathbf{X}$ is
invertible.


<div class="c-note">

Invertibility fails when features are linearly dependent or when $p > n$ —
more unknowns than equations. Both are common in practice; regularisation is
the standard remedy.

</div>


Notes:
Derivation: $\mathrm{RSS}(\mathbf{w}) = \lVert \mathbf{y} - \mathbf{X}\mathbf{w} \rVert^2$
has gradient $-2\mathbf{X}^{\top}(\mathbf{y} - \mathbf{X}\mathbf{w})$; setting it to
zero gives the normal equations
$\mathbf{X}^{\top}\mathbf{X}\\,\mathbf{w} = \mathbf{X}^{\top}\mathbf{y}$, with
$\mathbf{X}$ of size $n \times (p+1)$ including the column of ones.
$\mathbf{X}^{\top}\mathbf{X}$ is invertible exactly when the columns of
$\mathbf{X}$ are linearly independent, which requires $n \ge p + 1$.

When it is singular the normal equations still have solutions, but infinitely
many; the pseudo-inverse selects the one of minimal norm. Strongly correlated
features leave the matrix invertible but ill-conditioned, and the weights become
unstable. Numerical software solves the system by QR or Cholesky decomposition
instead of forming the inverse. Ridge regression replaces
$\mathbf{X}^{\top}\mathbf{X}$ by $\mathbf{X}^{\top}\mathbf{X} + \lambda\mathbf{I}$,
which is invertible for every $\lambda > 0$. $p > n$ is the normal situation in
genomics and text, where features outnumber examples.

--

## Takeaway


<div class="takeaway">

Linear regression fits a weighted sum by minimising squared residuals. Its
solution is built from **covariance over variance**, and $R^2$ reports how much
variation it explains — not whether it will generalise.

</div>


--

## Linear in the Parameters, Not in the Features


<div class="c-important">

A model is **linear** when it is linear in the **weights** $\mathbf{w}$. The
features may be arbitrary transformations of the input.

</div>



<div class="grid-3">


<div class="column">


<div class="card">

### Plain
$$h(\mathbf{x}) = w\_0 + w\_1 x$$
a straight line

</div>


</div>


<div class="column">


<div class="card">

### Polynomial
$$h(\mathbf{x}) = w\_0 + w\_1 x + w\_2 x^2$$
a curve — still a *linear model*

</div>


</div>


<div class="column">


<div class="card">

### Basis functions
$$h(\mathbf{x}) = \sum\_j w\_j \phi\_j(\mathbf{x})$$
any fixed feature map $\phi$

</div>


</div>


</div>



<div class="c-note">

What *linear* forbids: a transformation that has to be learned from the data.
The feature map is fixed before fitting; only the weights are learned.

</div>


Notes:
Linearity in the weights is what makes RSS a quadratic function of $\mathbf{w}$
and keeps the normal equations valid: with a feature map $\phi$, the design
matrix simply has entries $\Phi\_{ij} = \phi\_j(\mathbf{x}\_i)$. Fixed maps include
polynomials, interactions $x\_1 x\_2$, $\log x$, indicator variables for
categories, periodic terms $\sin(2\pi t / T)$ with known period $T$, and radial
basis functions with fixed centres.

Not expressible in this way: models whose transformation has parameters fitted
to the data, such as $w\_1 \sin(w\_2 x)$ with a learned frequency $w\_2$, radial
basis functions with learned centres, or the hidden layers of a neural network.
Such models are non-linear in their parameters; their losses are in general
non-convex and have no closed-form minimiser.

--

## Consequences


<div class="grid-2">


<div class="column">


<div class="card">

### The good
The closed-form solution and all statistical guarantees carry over unchanged.

</div>


</div>


<div class="column">


<div class="card">

### The catch
The feature map is a **modelling decision**. Choose too rich a basis and the
model overfits; too poor and it underfits.

</div>


</div>



</div>


<div class="c-insight">

Increasing the polynomial degree turns a dial on the bias–variance axis.

</div>


Notes:
What carries over is everything that holds for a linear model in
$\phi(\mathbf{x})$: the closed form, the projection geometry, and the
Gauss–Markov guarantee, provided the model is correctly specified in the chosen
basis. Choosing the basis is choosing the hypothesis space — the inductive bias
stated explicitly.

Too rich a basis has low bias and high variance; with as many basis functions as
data points the fit interpolates the training data. Too poor a basis has high
bias: no amount of data lets a straight line fit a sine. Raw polynomial features
$x, x^2, \dots, x^k$ are strongly correlated and make $\mathbf{X}^{\top}\mathbf{X}$
ill-conditioned at high degree; rescaling $x$ to $[-1, 1]$ or using orthogonal
polynomials mitigates this.

--

## Turning the Capacity Dial

Linear in the parameters, any basis in the features: a polynomial of degree $k$
is still "linear regression" — and $k$ is a dial.

<div class="viz viz-lg" data-viz="ml/bias-variance" data-steps="5"
 data-params='{"degrees": [1, 2, 3, 5, 9, 14]}'></div>

Notes:
A polynomial of degree $k$ is linear regression on the basis
$(1, x, \dots, x^k)$, so the closed form applies at every degree. The
visualisation fits 12 noisy samples of $\sin(2\pi x)$ (noise standard deviation
0.18) and reports the root-mean-square error on these points and on a second
sample at the same inputs with fresh noise. For degrees 1, 2, 3, 5, 9, 14 the
training error is 0.551, 0.546, 0.198, 0.150, 0.086, 0.015 and the test error
0.487, 0.492, 0.171, 0.162, 0.206, 0.214.

Training error never rises with the degree, because each model contains the
previous one. Test error is lowest at degree 5 and cannot fall much below the
noise level 0.18. Degree 14 has 15 coefficients for 12 points: $\mathbf{X}^{\top}\mathbf{X}$
is singular and infinitely many polynomials pass (almost) through the data.
Because the test inputs coincide with the training inputs, the rise in test
error understates the overfitting; between the data points the high-degree
curves swing far from the sine. Each degree is fitted by keeping the peak of a
Gaussian likelihood. A penalty $\lambda\lVert\mathbf{w}\rVert^2$ — a Gaussian
prior on $\mathbf{w}$ — reduces capacity without lowering the degree.


--

## Fitting $h$ by Repeated Correction


<div class="c-algorithm">

**LMS (least mean squares)**

1. Initialise the weights $w$.
2. Pick a training example $(\mathbf{x}, y)$ from the training set $D$.
3. Compute the prediction $h\_w(\mathbf{x})$ and the error $e = y - h\_w(\mathbf{x})$.
4. Update every weight: $w\_i \leftarrow w\_i + \eta e x\_i$.
5. Repeat 2–4 until the error on $D$ stops decreasing.

</div>


Notes:
The update is a gradient step on the squared error of a single example. With
$e = y - \mathbf{w}^{\top}\mathbf{x}$ and $E = \tfrac12 e^2$,
$\partial E / \partial w\_i = -e\\,x\_i$, so
$w\_i \leftarrow w\_i - \eta\\,\partial E / \partial w\_i = w\_i + \eta e x\_i$. Each
weight moves in the direction that reduces this example's error, in proportion
to its feature value. The rule is also called the Widrow–Hoff or delta rule.

Examples are usually visited in random order; one pass over $D$ is an epoch.
With a constant $\eta$ the weights do not settle exactly at the least-squares
solution but keep fluctuating around it, because every step follows a single
noisy example; a decreasing learning rate or averaging of the iterates makes
them converge.

--

## What the Update Rule Encodes


<div class="grid-3">


<div class="column">


<div class="card">

### Direction
The sign of $e$ decides whether the prediction goes up or down.

</div>


</div>


<div class="column">


<div class="card">

### Attribution
The factor $x\_i$ gives each feature credit proportional to its value.

</div>


</div>


<div class="column">


<div class="card">

### Step size
The learning rate $\eta$ trades speed against stability.

</div>


</div>



</div>


<div class="c-note">

Too large an $\eta$ oscillates or diverges; too small an $\eta$ converges
slowly. It is a hyperparameter — chosen, not learned.

</div>


Notes:
Direction: if $e > 0$ the prediction was too low, and every weight with
$x\_i > 0$ increases. Attribution: a feature with $x\_i = 0$ receives no update
from that example, and features on large numeric scales receive large updates —
one reason features are standardised before gradient-based fitting.

Step size: one update changes this example's prediction by
$\eta e \lVert \mathbf{x} \rVert^2$, so the new error is
$e\\,(1 - \eta \lVert \mathbf{x} \rVert^2)$. The update overshoots the target when
$\eta\lVert\mathbf{x}\rVert^2 > 1$ and enlarges the error when
$\eta\lVert\mathbf{x}\rVert^2 > 2$; normalised LMS divides the step by
$\lVert \mathbf{x} \rVert^2$ for this reason. The learning rate does not appear
in the training loss and cannot be fitted by minimising it; it is chosen by
comparing runs, typically on validation data.

--

## Two Ways to the Same Minimum


<div class="grid-2">


<div class="column">


<div class="card">

### Direct (closed form)
$$\hat{\mathbf{w}} = (\mathbf{X}^{\top}\mathbf{X})^{-1}\mathbf{X}^{\top}\mathbf{y}$$

Exact, one step. Requires forming and inverting a $(p{+}1)\times(p{+}1)$
matrix — costly for large $p$, impossible when it is singular.

</div>


</div>


<div class="column">


<div class="card">

### Iterative (gradient descent)
$$\mathbf{w} \leftarrow \mathbf{w} - \eta \nabla \mathrm{RSS}(\mathbf{w})$$

Approximate, many steps. Scales to large $p$ and $n$, works when the direct
solution does not exist, and extends to models with no closed form at all.

</div>


</div>



</div>


<div class="c-note">

The iterative rule is exactly the **LMS algorithm**: its update
$w\_i \leftarrow w\_i + \eta e x\_i$ *is* a gradient step on RSS, taken per example
instead of per dataset (the factor 2 is absorbed into $\eta$).

</div>


Notes:
Costs: forming $\mathbf{X}^{\top}\mathbf{X}$ takes $O(np^2)$ operations and solving
the $(p+1) \times (p+1)$ system $O(p^3)$; one full gradient step takes $O(np)$.
The gradient is $\nabla\mathrm{RSS}(\mathbf{w}) = -2\mathbf{X}^{\top}(\mathbf{y} - \mathbf{X}\mathbf{w})$:
a full-batch step sums error × feature over all examples, while LMS uses one
example per update (stochastic gradient descent).

Because RSS is convex, gradient descent with a small enough learning rate
approaches the minimum that the closed form computes. When
$\mathbf{X}^{\top}\mathbf{X}$ is singular the minimum is not unique; started at
$\mathbf{w} = 0$, gradient descent converges to the minimum-norm solution.
Logistic regression and neural networks have no closed-form minimiser, so the
iterative method is the general one and the closed form the special case.

--

## Watching Gradient Descent Work

<div class="viz viz-lg" data-viz="ml/gradient-descent" data-steps="6"
 data-params='{"eta": 0.25, "start": -2.6}'></div>

Notes:
The curve is a one-parameter stand-in for RSS, $L(w) = w^2 + 0.4w + 1$, with its
minimum at $w = -0.2$. A step is $w \leftarrow w - \eta(2w + 0.4)$, so the
distance to the minimum is multiplied by $1 - 2\eta$ in every step. With
$\eta = 0.25$ the factor is 0.5: starting at $w = -2.6$ (distance 2.4), the
distance halves with each step and is 0.0375 after six steps ($w \approx -0.24$).

The steps shrink although $\eta$ is constant: the step length is
$\eta \lvert L'(w) \rvert$, and the gradient is proportional to the distance from
the minimum. Steps are therefore largest far from the minimum, where the slope
is steepest.

--

## The Learning Rate Decides Everything

<div class="viz viz-lg" data-viz="ml/gradient-descent" data-steps="6"
 data-params='{"eta": 0.9, "start": -2.6, "compare": 0.05}'></div>

Teal: $\eta = 0.9$ — overshoots and oscillates across the minimum.
Red: $\eta = 0.05$ — stable, but slow: after six steps it has covered about
half the distance.


<div class="c-warning">

The learning rate is a **hyperparameter**: it is chosen, not learned, and both
failure modes are silent — one looks unstable, the other looks converged.

</div>


Notes:
On the same loss the distance to the minimum is multiplied by $1 - 2\eta$ per
step. For $\eta = 0.9$ the factor is $-0.8$: every step jumps across the minimum
and removes only 20% of the remaining distance, so after six steps
$0.8^6 \approx 26\\%$ of it remains. For $\eta = 0.05$ the factor is 0.9, leaving
$0.9^6 \approx 53\\%$ — the "about half" on the slide. The iteration diverges for
$\eta > 1$, where $\lvert 1 - 2\eta \rvert > 1$, and $\eta = 0.5$ reaches the
minimum in a single step.

In general, gradient descent on a quadratic with Hessian $\mathbf{H}$ is stable
only for $\eta < 2/\lambda\_{\max}(\mathbf{H})$; here $\mathbf{H} = 2$. The slow
run is the harder failure to detect: over a short window its loss curve
flattens like that of a converged run, whereas the oscillation of a too-large
$\eta$ is visible in the parameter trace.

--

## Takeaway


<div class="takeaway">

Use the **closed form** when the matrix is small and well-conditioned; use
**gradient descent** when it is not — and for most models beyond linear
regression, no closed form exists at all.

</div>


--

## The Question Nobody Asks

We minimised the *squared* residuals. Why squares — why not absolute
deviations, or fourth powers?

Notes:
Squared error has several independent justifications. It is differentiable and
gives a closed form. Its minimiser is a mean: the constant minimising expected
squared deviation is the mean, the one minimising expected absolute deviation is
the median, so least squares estimates the conditional mean of $y$. Under the
conditions of the Gauss–Markov theorem it gives the linear unbiased estimator of
smallest variance, and under Gaussian noise it is the maximum-likelihood
criterion. Absolute deviations give least-absolute-deviation regression, which
estimates the conditional median and is less sensitive to outliers; higher even
powers weight large residuals even more strongly and make the fit more
sensitive to them.

--

## Geometric View


<div class="grid-2-1">


<div class="column">

The predictions $\mathbf{X}\mathbf{w}$ live in the **column space** of
$\mathbf{X}$ — everything the features can express. The observed
$\mathbf{y}$ generally does not.

Least squares picks the point of that space **closest to $\mathbf{y}$ in
Euclidean distance**: the orthogonal projection. The residual is perpendicular
to every feature.

</div>


<div class="card">

### Consequence
The residual carries no remaining linear information about the features.

</div>


</div>


Notes:
The normal equations $\mathbf{X}^{\top}(\mathbf{y} - \mathbf{X}\hat{\mathbf{w}}) = \mathbf{0}$
state exactly that the residual vector is orthogonal to every column of
$\mathbf{X}$. The fitted values are $\hat{\mathbf{y}} = \mathbf{H}\mathbf{y}$ with
the hat matrix $\mathbf{H} = \mathbf{X}(\mathbf{X}^{\top}\mathbf{X})^{-1}\mathbf{X}^{\top}$,
the orthogonal projection onto the column space. Pythagoras on
$\mathbf{y} = \hat{\mathbf{y}} + \mathbf{e}$, after centring, gives
TSS = ESS + RSS.

Adding a feature enlarges the column space, so the closest point can only get
closer and RSS cannot increase. "No remaining linear information" means that the
residuals are uncorrelated with each feature in the sample; a non-linear pattern
of the residuals against a feature remains possible and indicates a
misspecified model.

--

## The Gauss–Markov Theorem


<div class="c-definition">

**Gauss–Markov (informal).** Among all estimators that are

- **linear** in the observed outputs $(y\_1, \ldots, y\_n)$, and
- **unbiased**,

the least-squares estimator has the **lowest variance**. It is the *Best Linear
Unbiased Estimator* — BLUE.

</div>



<div class="grid-3">


<div class="card">

### Best
lowest variance among the candidates

</div>


<div class="card">

### Linear
a linear function of the observations

</div>


<div class="card">

### Unbiased
right on average over repeated samples

</div>


</div>


Notes:
Formal statement: for $\mathbf{y} = \mathbf{X}\mathbf{w} + \boldsymbol{\varepsilon}$
with $\mathbf{X}$ fixed and of full column rank, $\mathbb{E}[\boldsymbol{\varepsilon}] = \mathbf{0}$
and $\mathrm{Cov}(\boldsymbol{\varepsilon}) = \sigma^2\mathbf{I}$, every linear
unbiased estimator $\tilde{\mathbf{w}} = \mathbf{C}\mathbf{y}$ has a covariance
exceeding $\mathrm{Cov}(\hat{\mathbf{w}}\_{\mathrm{OLS}}) = \sigma^2(\mathbf{X}^{\top}\mathbf{X})^{-1}$
by a positive semi-definite matrix. Hence every linear combination
$\mathbf{c}^{\top}\mathbf{w}$, including each single weight and each
prediction, is estimated with the smallest variance by OLS.

The theorem says nothing about non-linear or biased estimators. Mean squared
error is $\text{bias}^2 + \text{variance}$, so a biased estimator can be better:
for ridge regression there always exists a $\lambda > 0$ whose weights have a
smaller mean squared error than OLS (Hoerl & Kennard, 1970). This does not
contradict the theorem, which ranks only unbiased linear estimators.

--

## What This Buys, and What It Costs


<div class="grid-2">


<div class="card good">

### The payoff
Minimising RSS yields optimal statistical properties under **mild
assumptions** — no normality needed, only a correctly specified linear model,
linearly independent features, and zero-mean, uncorrelated errors of constant
variance.

</div>


<div class="card bad">

### The price
Alternatives — absolute error, Huber loss — are **more robust to outliers** but
give up the BLUE guarantee.

</div>


</div>



<div class="takeaway">

Squared error is not an arbitrary convenience: it is the loss whose minimiser
is the best linear unbiased estimator. Departing from it is legitimate — but it
is a trade, and you should be able to name what you traded.

</div>


Notes:
The assumptions in full: the model is linear in the parameters and correctly
specified; the features are linearly independent; the errors have mean zero,
equal variance and are uncorrelated. Normality is not required for BLUE; it is
required for exact $t$- and $F$-tests and intervals in small samples. With
unequal variances OLS remains unbiased but is no longer best; weighted least
squares with weights $1/\sigma\_i^2$ restores optimality.

Robust losses trade efficiency under ideal conditions for stability under
outliers. The Huber loss is quadratic for small residuals and linear for large
ones; absolute error is linear throughout. Their minimisers are not linear in
$\mathbf{y}$, so the theorem does not cover them. The same trade appears in
descriptive statistics: the mean minimises squared deviations and is pulled by
outliers, the median minimises absolute deviations and is not.

# Probabilistic Linear Regression


<div class="guiding-question">

**Guiding Question:** You have minimised squared error many times. What did
that choice assume about the world — and what does it leave out?

</div>


--

## The Same Model, Told Differently


<div class="grid-2">


<div class="card">

### Classical account
Choose the line that **minimises squared error**:
$$\hat{\mathbf{w}} = \arg\min\_{\mathbf{w}} \sum\_{i} (y\_i - \mathbf{w}^{\top}\mathbf{x}\_i)^2$$

</div>


<div class="card">

### Probabilistic account
State how a price **arises** for a given flat:
$$y = \mathbf{w}^{\top}\mathbf{x} + \varepsilon, \qquad \varepsilon \sim \mathcal{N}(0, \sigma^{2})$$
then keep the peak of the likelihood.

</div>


</div>



<div class="q">

Do the two accounts give the same $\hat{\mathbf{w}}$ — and if so, what did the
classical account assume without saying it?

</div>


Notes:
The two accounts give the same $\hat{\mathbf{w}}$: the Gaussian log-likelihood is
a constant minus $\mathrm{RSS}/(2\sigma^2)$ (derivation below). What the
classical account assumed without saying it is a noise model: errors that are
Gaussian, of the same width at every $x$, and independent between rows. The
probabilistic account states these assumptions as a model of how $y$ arises
given $\mathbf{x}$, and returns more than $\hat{\mathbf{w}}$: an estimate of
$\sigma^2$, a predictive distribution for a new $y$, and assumptions that can be
checked on the residuals. Gauss–Markov justifies the same $\hat{\mathbf{w}}$ under
weaker conditions (no normality) but provides no distribution for $y$.

--

## A Distribution at Every $x$

<div class="viz viz-lg" data-viz="ml/conditional-gaussian" data-steps="2"
 data-params='{"view": "bells"}'></div>

A **conditional distribution** $p(y \mid x) = \mathcal{N}(\mathbf{w}^{\top}\mathbf{x}, \sigma^2)$:
one bell per $x$, **equally wide**. Nothing about how $x$ arises.

Notes:
Data: 20 flats of 41–120 m². Fit: $\hat{y} \approx 1.4 + 3.44\\,x$ (k€, m²), with
$\hat\sigma\_{\mathrm{ML}} \approx 16.0$ k€. Step 1 shows the fitted line, step 2
Gaussian bells at 50, 80 and 110 m², all with standard deviation $\hat\sigma$.
Reading one bell: an 80 m² flat has a predicted mean of about 276 k€, and 95% of
such prices lie within $\pm 1.96\\,\hat\sigma \approx \pm 31$ k€.

The line is the conditional mean $\mathbb{E}[y \mid x]$; the bell is the
conditional distribution, and the loss is the exponent of the bell (next slide).
The model contains no distribution over $x$: it never represents which floor
areas are typical, so it cannot recognise that a 600 m² villa lies far outside
its data. This is shortcut 3, model only $p(y \mid x)$, named in
<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>.

--

## The Derivation

With $p(y\_i \mid \mathbf{x}\_i, \mathbf{w}) = \mathcal{N}(y\_i \mid \mathbf{w}^{\top}\mathbf{x}\_i, \sigma^{2})$ and i.i.d. rows:

$$
\ell(\mathbf{w}) = \sum\_{i=1}^{n} \log \frac{1}{\sqrt{2\pi\sigma^{2}}}
\exp\left(-\frac{(y\_i - \mathbf{w}^{\top}\mathbf{x}\_i)^{2}}{2\sigma^{2}}\right)
= \underbrace{-\frac{n}{2}\log(2\pi\sigma^{2})}\_{\text{no } \mathbf{w}} - \frac{1}{2\sigma^{2}} \mathrm{RSS}(\mathbf{w})
$$


<div class="c-important">

Maximising the Gaussian log-likelihood **is** minimising RSS:
$\hat{\mathbf{w}}\_{\mathrm{ML}} = \hat{\mathbf{w}}\_{\mathrm{OLS}}$. Squared error is
the exponent of the bell.

</div>


Notes:
The first term does not depend on $\mathbf{w}$ and $1/(2\sigma^2) > 0$, so for
every fixed $\sigma^2$ the arg max of $\ell$ over $\mathbf{w}$ is the arg min of
RSS. The value of $\sigma^2$ therefore does not affect $\hat{\mathbf{w}}$; it is
estimated afterwards from the residuals. The i.i.d. assumption is what turns the
joint likelihood into a product and the log-likelihood into a sum over rows.

The equivalence is specific to Gaussian noise with one shared variance. With
observation-specific variances $\sigma\_i^2$ the likelihood leads to weighted
least squares, $\sum\_i (y\_i - \mathbf{w}^{\top}\mathbf{x}\_i)^2 / \sigma\_i^2$; with
Laplace noise it leads to least absolute deviations.

--

## What Squared Error Assumed

| the noise model says | squared error silently assumes | check on the residuals |
|---|---|---|
| $\varepsilon$ has mean 0 | the line is the right shape | no pattern against $x$ |
| one $\sigma$ for every $x$ | **homoscedastic** noise | no fan shape |
| rows independent | i.i.d. (<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>) | no pattern in time or space |
| $\varepsilon$ Gaussian | thin tails: large errors are rare | no heavy tails, few outliers |


<div class="c-insight">

Choosing a loss and choosing a noise model are **one decision**. Squared error
⇔ Gaussian noise; absolute error ⇔ Laplace noise — heavier tails, so a large
residual is less surprising and an outlier pulls the fit less.

</div>


Notes:
Each row turns a property of the loss into a checkable statement about the
data. Residuals plotted against the fitted values or against each feature
should show no trend (mean 0, right shape) and constant spread
(homoscedasticity); residuals in collection order or by location should show no
correlation (independence); a normal Q–Q plot of the residuals reveals heavy
tails.

Laplace row: the density $\frac{1}{2b} e^{-\lvert\varepsilon\rvert/b}$ gives
$-\log p = \lvert\varepsilon\rvert / b + \log(2b)$, so its maximum-likelihood fit
minimises the sum of absolute residuals. The derivative with respect to a
residual is bounded ($\pm 1/b$), whereas for the Gaussian it grows linearly with
the residual — the reason an outlier pulls an absolute-error fit less. A
violated row does not always spoil $\hat{\mathbf{w}}$: with non-Gaussian or
unequal-variance noise of mean zero, least squares is still unbiased; the
intervals fail first.

--

## The Peak of $\sigma^2$

The same likelihood also has a peak in $\sigma^2$:

$$
\frac{\partial \ell}{\partial \sigma^{2}} = -\frac{n}{2\sigma^{2}} + \frac{\mathrm{RSS}}{2\sigma^{4}} = 0
\quad\Longrightarrow\quad
\hat{\sigma}^{2}\_{\mathrm{ML}} = \frac{\mathrm{RSS}}{n}
$$


<div class="q">

Which of <a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>'s two variances is this — and is it too small or too large?

</div>



<div class="fragment">


<div class="c-warning">

The **$1/n$** one. The line was fitted to the same data, so residuals are
smaller than the true errors: $\hat{\sigma}^2\_{\mathrm{ML}}$ is **biased low**.
The unbiased version divides by $n - p$ for $p$ fitted weights. Houses: $n = 20$,
$p = 2$, RSS $\approx 5{,}097$ → $\hat{\sigma} \approx 16.0$ instead of $16.8$ k€.

</div>


</div>


Notes:
Answer: the $1/n$ variance, which is biased low. The residuals come from a line
fitted to the same data, and the fit absorbs part of the noise. For $p$ fitted
weights the residual vector lies in an $(n - p)$-dimensional subspace, so
$\mathbb{E}[\mathrm{RSS}] = (n - p)\sigma^2$ and
$\mathbb{E}[\hat\sigma^2\_{\mathrm{ML}}] = \frac{n - p}{n}\sigma^2$. The $n - 1$ of
<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a> is the case $p = 1$, a single estimated mean.

Houses: $5{,}097 / 20 \approx 254.8$ gives $\hat\sigma \approx 16.0$ k€;
$5{,}097 / 18 \approx 283.2$ gives 16.8 k€. The bias is 10% of the variance for
$n = 20$, $p = 2$, and 40% for $n = 5$, $p = 2$. It always points the same way:
taking the peak in $\sigma^2$ jointly with $\mathbf{w}$
(<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>) makes the model look less noisy than the process that
generated the data.

--

## The Villa Again

<div class="viz viz-lg" data-viz="ml/conditional-gaussian" data-steps="2"
 data-params='{"view": "villa"}'></div>


<div class="q">

The band is as narrow at the villa as at a flat. Is the model as sure?

</div>



<div class="fragment">

No: $\pm 31$ k€ is only the noise $\hat{\sigma}$. The uncertainty about
$\mathbf{w}$ — dropped with the peak — grows off the data: $\pm 153$ k€ at the
villa (<a href="/courses/probabilistic-machine-learning/lecture/l07-probabilistic-algorithms/">Lecture 07</a>).

</div>


Notes:
Step 0: the fit and the plug-in band $\hat{y} \pm 1.96\\,\hat\sigma = \pm 31$ k€,
which treats $\hat{\mathbf{w}}$ as exact. Step 1: the villa of
<a href="/courses/probabilistic-machine-learning/lecture/l01-introduction/">Lecture 01</a> at 600 m², predicted at about 2,064 k€ with the same
$\pm 31$ k€. Step 2: the band that also counts the uncertainty about the two
weights, half-width
$1.96\\,\hat\sigma\sqrt{1 + 1/n + (x - \overline{x})^2 / \sum\_i (x\_i - \overline{x})^2}$:
$\pm 32$ k€ at 80 m², $\pm 153$ k€ at 600 m².

The term $(x - \overline{x})^2$ makes the variance grow quadratically with the
distance from the mean floor area. This is epistemic uncertainty, which data
near 600 m² would reduce — the spread that keeping the peak drops
(<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>). The band here uses $\hat\sigma\_{\mathrm{ML}}$ and 1.96; the
textbook prediction interval uses the unbiased estimate and a $t$-quantile with
$n - 2$ degrees of freedom and is slightly wider. Both assume the straight line
holds up to 600 m²; whether villas follow the price per m² of flats is a
question about the model that no band computed from flats can answer.

--

## Mini-Exercise

The residuals of your house-price model fan out: about $\pm 10$ k€ for 40 m²
flats, $\pm 60$ k€ for 120 m² flats.


<div class="q">

Which assumption fails — and which output of the model can you no longer trust?

</div>



<div class="fragment">

**One $\sigma$ for every $x$** (homoscedasticity). The line may still be fine,
but the **band** is not: a single $\hat{\sigma}$ is too wide for small flats and
too narrow for large ones.

</div>


Notes:
A fan shape violates homoscedasticity. The line can still be adequate:
$\hat{\mathbf{w}}$ remains unbiased, but it is no longer the minimum-variance
linear unbiased estimator, since Gauss–Markov requires equal variances. The
single $\hat\sigma$ averages the spreads, so the band is too wide for small
flats and too narrow for large ones, and the standard errors of the weights are
unreliable as well.

Remedies state a different noise model: $\sigma$ as a function of $x$ (here
roughly proportional to the floor area), fitted by weighted least squares with
weights $1/\sigma^2(x)$; or a model for $\log y$, where noise proportional to
the price becomes additive noise of constant variance.

--

## Takeaway


<div class="takeaway">

Least squares **is** maximum likelihood under Gaussian noise: the loss states
the noise model, and the model is a distribution $p(y \mid x)$. It is also a
**peak**: $\hat{\sigma}^2$ divides by $n$, and the band is as narrow at the villa
as at a flat — the uncertainty about $\mathbf{w}$ was dropped.

</div>

# Logistic Regression


<div class="guiding-question">

**Guiding Question:** <a href="/courses/probabilistic-machine-learning/lecture/l01-introduction/">Lecture 01</a>'s fraud model said 0.55. Where does such a
number come from — and what does the model refuse to know?

</div>


--

## Why Not Regress on 0/1?

Code fraud as $y = 1$, legitimate as $y = 0$, and fit the line of probabilistic linear regression.


<div class="fragment">


<div class="grid-2">


<div class="card bad">

### Squared error punishes being right
A transaction far on the correct side has a large residual, so least squares
drags the boundary towards cases it already classifies correctly.

</div>


<div class="card bad">

### The output is not a probability
$\mathbf{w}^{\top}\mathbf{x}$ can be $17$ or $-40$. The Gaussian bell of
the regression model puts mass on every real $y$ — for a label that is 0 or 1.

</div>


</div>



<div class="c-important">

Keep the linear score, change what it models: the **log-odds**, and a noise
model that produces 0s and 1s.

</div>


</div>


Notes:
Least squares on 0/1 labels (the linear probability model) fails for two
reasons. The loss: a fraud with score 3 has residual $-2$ and squared error 4,
although it is classified correctly; minimising RSS reduces such residuals, so
points far on the correct side tilt the boundary. The output: the linear score
is unbounded and cannot be read as a probability, and the Gaussian noise model
assigns density to every real $y$ although only 0 and 1 occur. A 0/1 label also
has variance $h(1 - h)$, which depends on $\mathbf{x}$ and contradicts the single
$\sigma$ of the Gaussian model. Replacing the Gaussian by a Bernoulli and
modelling the log-odds linearly removes both problems.

--

## Log-Odds Are Linear

$$
\ln \frac{P(y = 1 \mid \mathbf{x})}{1 - P(y = 1 \mid \mathbf{x})} = \mathbf{w}^{\top}\mathbf{x}
\qquad\Longleftrightarrow\qquad
P(y = 1 \mid \mathbf{x}) = \sigma(\mathbf{w}^{\top}\mathbf{x}) = \frac{1}{1 + e^{-\mathbf{w}^{\top}\mathbf{x}}}
$$

| read the weights as | fraud example |
|---|---|
| the intercept: the log-odds when every feature is 0 | no features at all: $w\_0 = \ln \frac{1}{999} \approx -6.9$, the base rate 1 in 1,000 |
| a weight: what one unit of a feature **adds** to the log-odds | "new device" with $w = \ln 6 \approx 1.8$: odds $\times 6$ |
| the boundary: where $\mathbf{w}^{\top}\mathbf{x} = 0$ | score $0.5$ — still a straight line |

Notes:
The sigmoid $\sigma(z) = 1/(1 + e^{-z})$ is the inverse of the logit
$\ln \frac{p}{1 - p}$; the model therefore states that the log-odds are linear in
$\mathbf{x}$. Intercept: with no features the maximum-likelihood fit sets
$\sigma(w\_0)$ to the fraction of positives, $1/1000$, so
$w\_0 = \ln(1/999) \approx -6.91$ — the estimate $h/n$ of
<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a> on the log-odds scale.

Weights: one unit more of $x\_j$ adds $w\_j$ to the log-odds and multiplies the
odds by $e^{w\_j}$. Odds are not probabilities: multiplying the odds by 6 moves
$P$ from 0.10% to 0.60% at the base rate, but from 0.5 to 0.86 at odds 1. The
boundary $\mathbf{w}^{\top}\mathbf{x} = 0$ is a hyperplane; another threshold
than 0.5 shifts it in parallel. Adding log-odds is the arithmetic of multiplying
likelihood ratios in Bayes' theorem (<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>), which naive
Bayes uses (<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>).

--

## Where Does Cross-Entropy Come From?

$$
L(\mathbf{w}) = -\sum\_{i=1}^{n} \Big[ y\_i \ln h\_i + (1-y\_i)\ln(1-h\_i) \Big],
\qquad h\_i = \sigma(\mathbf{w}^{\top}\mathbf{x}\_i)
$$


<div class="q">

You have minimised this loss many times. Which noise model does it state?

</div>



<div class="fragment">

Given $\mathbf{x}$, the label is a **Bernoulli** draw with bias $h$:
$P(y\_i \mid \mathbf{x}\_i, \mathbf{w}) = h\_i^{y\_i}(1-h\_i)^{1-y\_i}$. With i.i.d. rows,

$$
\ell(\mathbf{w}) = \sum\_{i=1}^{n} \Big[ y\_i \ln h\_i + (1-y\_i)\ln(1-h\_i) \Big] = -L(\mathbf{w})
$$


<div class="c-important">

Cross-entropy **is** the Bernoulli negative log-likelihood — <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>'s coin,
biased by $\mathbf{x}$. How $\mathbf{x}$ arises is never said.

</div>


</div>


Notes:
Answer: a Bernoulli noise model. Given $\mathbf{x}\_i$, the label is a draw
$y\_i \sim \mathrm{Bernoulli}(h\_i)$ with $h\_i = \sigma(\mathbf{w}^{\top}\mathbf{x}\_i)$;
$h\_i^{y\_i}(1 - h\_i)^{1 - y\_i}$ is a compact way of writing $h\_i$ for $y\_i = 1$
and $1 - h\_i$ for $y\_i = 0$. Taking logs and summing over i.i.d. rows gives
$\ell(\mathbf{w}) = -L(\mathbf{w})$. It is the derivation of the coin estimate
$h/n$ in <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>, with the single bias $\theta$ replaced by a bias
$h(\mathbf{x})$ for every row.

The name: $-[y \ln h + (1 - y)\ln(1 - h)]$ is the cross-entropy between the
observed label distribution (all mass on $y$) and the predicted one. The model is
conditional: it describes $y$ given $\mathbf{x}$ and contains no distribution
from which a transaction $\mathbf{x}$ could be generated.

--

## The Same Update Again

With $\sigma' = \sigma(1 - \sigma)$, the gradient of the log-likelihood is

$$
\frac{\partial \ell}{\partial \mathbf{w}} = \sum\_{i=1}^{n} (y\_i - h\_i)\mathbf{x}\_i
$$

| model | noise | loss | gradient of $\ell$ |
|---|---|---|---|
| linear regression | Gaussian | squared error | $\frac{1}{\sigma^2}\sum\_i (y\_i - \mathbf{w}^{\top}\mathbf{x}\_i)\mathbf{x}\_i$ |
| logistic regression | Bernoulli | cross-entropy | $\sum\_i (y\_i - \sigma(\mathbf{w}^{\top}\mathbf{x}\_i))\mathbf{x}\_i$ |


<div class="c-note">

Error × feature — the LMS update with a sigmoid in the prediction; no closed
form, so iterate. A fraud scored $0.01$ costs $-\ln 0.01 \approx 4.6$, scored
$0.99$ only $0.01$: confident mistakes dominate.

</div>


Notes:
Derivation for one row, using $\sigma'(z) = \sigma(z)(1 - \sigma(z))$:
$\frac{\partial}{\partial \mathbf{w}}[y \ln h + (1 - y)\ln(1 - h)]
= \left(\frac{y}{h} - \frac{1 - y}{1 - h}\right) h(1 - h)\\,\mathbf{x} = (y - h)\\,\mathbf{x}$.
Both gradients in the table are error × feature; the per-example ascent step
$\mathbf{w} \leftarrow \mathbf{w} + \eta\\,(y - h)\\,\mathbf{x}$ is the LMS rule
with the prediction $\sigma(\mathbf{w}^{\top}\mathbf{x})$.

Setting the logistic gradient to zero gives equations that are non-linear in
$\mathbf{w}$, so there is no closed form. The negative log-likelihood is convex,
so gradient methods or Newton's method (iteratively reweighted least squares)
find the global optimum whenever one exists. Per-example loss: a fraud scored
0.01 costs $-\ln 0.01 \approx 4.61$, scored 0.99 costs $-\ln 0.99 \approx 0.01$;
the cost grows without bound as a confident score approaches the wrong label.

--

## When the Peak Runs Away

<div class="viz viz-lg" data-viz="ml/logistic-runaway" data-steps="5"></div>


<div class="q">

Every fraud scores above every legitimate case. Where is the peak of the
likelihood?

</div>



<div class="fragment">

**Nowhere.** The likelihood keeps rising as the slope grows; the scores harden
to 0 and 1 — three heads in three flips. A prior's peak (MAP) is finite.

</div>


Notes:
Data: one risk signal, six legitimate cases at $x \le 0.2$ and four frauds at
$x \ge 0.6$, perfectly separated. Gradient ascent with step size 0.05 from
$\mathbf{w} = 0$; steps 1–4 show the curve after 10, 100, 1,000 and 10,000
steps, with slope 1.4, 3.6, 8.3, 17.8 and log-likelihood $-2.68$, $-1.04$,
$-0.36$, $-0.06$. The log-likelihood is bounded above by 0 and approaches it only
as the slope tends to infinity, so no finite maximiser exists; the optimiser
behaves correctly. Step 5: a Gaussian prior $\mathcal{N}(0, 1)$ on the slope
(intercept unpenalised); the MAP estimate converges to slope 1.4 and stays there.

The same holds in any dimension: if a hyperplane separates the classes, scaling
its weights up raises the likelihood indefinitely. $n$ points in general
position are always separable when $n \le p + 1$, so separation is common with
many features and few positives. Libraries usually penalise by default —
scikit-learn's LogisticRegression applies an L2 penalty unless told otherwise;
<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a> reads that penalty as a prior.

--

## Shortcut 3: Model Only $p(y \mid \mathbf{x})$

Linear and logistic regression are **discriminative**: a model of $y$ given
$\mathbf{x}$, none of $\mathbf{x}$.


<div class="grid-2">


<div class="card bad">

### What is dropped: $p(\mathbf{x})$
- a transaction unlike any seen still gets a confident score
- a missing field cannot be averaged out — it must be filled in
- no way to simulate a plausible transaction

</div>


<div class="card good">

### What is gained
- no assumptions about how features are distributed — where, with hundreds
  of features, most modelling errors hide
- every parameter serves the decision

</div>


</div>



<div class="c-note">

<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a> took the other route: model the joint $p(\mathbf{x}, y)$ and
condition — **generative**. Generative vs. Discriminative Models compares the two.

</div>


Notes:
A discriminative model specifies $p(y \mid \mathbf{x})$ and nothing about
$p(\mathbf{x})$. Consequences: an input unlike any training example still
receives a score, with no indication that it is unusual — the classification
counterpart of the villa; a missing attribute cannot be marginalised out, since
that requires a distribution for it given the observed ones; and the model
cannot generate examples.

Gains: no assumptions about how the features are distributed or how they depend
on each other, which is where a generative model with many features makes most
of its modelling errors; and all parameters are fitted to the conditional
likelihood, the quantity a decision uses. Given enough data, discriminative
classifiers usually reach lower error than generative ones whose input model is
misspecified (<a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a>). The roadmap names this shortcut "only
what you need".

--

## Mini-Exercise

Your fraud model scores **0.97** for a transfer 50 times larger than any in its
training data.


<div class="q">

Should you trust the 0.97 — and could the model itself warn you?

</div>



<div class="fragment">

Not blindly: the linear log-odds simply **extrapolate**, like the line at the
villa. And no — the model has **no $p(\mathbf{x})$**, so nothing in it can see
that the amount is unusual. That needs a model of $\mathbf{x}$ or a separate
check.

</div>


Notes:
The 0.97 should not be taken at face value. The log-odds are linear in the
amount, so a transfer 50 times larger than any seen pushes the score towards 0
or 1 by extrapolation, not by evidence; no training data supports the shape of
the model in that region. The model cannot warn: detecting an unusual input
needs a model of $p(\mathbf{x})$ — a density estimate, a range check on the
inputs, or a generative classifier. The uncertainty involved is epistemic
(<a href="/courses/probabilistic-machine-learning/lecture/l01-introduction/">Lecture 01</a>): it comes from missing data in this region of input
space, and training examples with similar amounts would reduce it.

--

## Takeaway


<div class="takeaway">

Logistic regression is probabilistic linear regression with Bernoulli noise: linear log-odds,
cross-entropy as the negative log-likelihood, error × feature as the gradient.
It **keeps the peak** — which runs away on separable data — and **models only
$p(y \mid \mathbf{x})$**: it never learns what a normal transaction looks like.

</div>

# Generative vs. Discriminative Models


<div class="guiding-question">

**Guiding Question:** Naive Bayes and logistic regression see the same fraud
table. Which would you trust with 50 labelled frauds — and which with 50,000?

</div>


--

## The Same Line, Fitted Twice

Take the logarithm of the naive-Bayes odds. For yes/no flags
$x\_j \in \lbrace 0, 1 \rbrace$ with $\theta\_{jy} = P(x\_j = 1 \mid y)$:

$$
\log \frac{P(\text{fraud} \mid x)}{P(\text{honest} \mid x)} = w\_0 + \sum\_{j=1}^{p} w\_j x\_j,
\qquad
w\_j = \log \frac{\theta\_{j1}}{\theta\_{j0}} - \log \frac{1 - \theta\_{j1}}{1 - \theta\_{j0}}
$$


<div class="q">

Where have you seen a log-odds that is linear in $x$?

</div>



<div class="fragment">


<div class="c-insight">

**Logistic regression** (previous module): $P(\text{fraud} \mid x) = \sigma(w\_0 + w^\top x)$.
Same family of classifiers — naive Bayes sets the weights by **counting**, one
attribute at a time; logistic regression by **maximising
$\sum\_i \log p(y\_i \mid x\_i)$**, all weights jointly.

</div>


</div>


Notes:
Derivation: for a yes/no flag,
$\log p(x\_j \mid y) = x\_j \log\theta\_{jy} + (1 - x\_j)\log(1 - \theta\_{jy})
= \log(1 - \theta\_{jy}) + x\_j \log\frac{\theta\_{jy}}{1 - \theta\_{jy}}$. The
naive-Bayes log-odds is the log prior odds plus the difference of these terms
between $y = 1$ and $y = 0$. The constants collect in
$w\_0 = \log\frac{P(\text{fraud})}{P(\text{honest})} + \sum\_j \log\frac{1 - \theta\_{j1}}{1 - \theta\_{j0}}$;
the coefficients of $x\_j$ are the $w\_j$ on the slide.

New device, $\theta\_{j1} = 0.6$, $\theta\_{j0} = 0.1$:
$w\_j = \log 6 - \log(0.4/0.9) \approx 1.79 + 0.81 = 2.60$. The weight exceeds
$\log 6$ because the absence of the flag is also evidence: honest transactions
lack it more often. Naive Bayes estimates each $\theta\_{jy}$ by counting,
attribute by attribute; logistic regression maximises the conditional
likelihood over all weights jointly. When two flags are correlated — new device
and foreign IP arrive together in an account take-over — logistic regression
splits the credit between them, while naive Bayes gives each its full weight:
the double counting of <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>.

--

## Two Ways to a Classifier

| | naive Bayes — generative | logistic regression — discriminative |
|---|---|---|
| models | $P(y)$ and $p(x \mid y)$ | $P(y \mid x)$ only |
| fitted by | counting (joint likelihood) | iterative optimisation (conditional likelihood) |
| correlated flags | counted twice | credit shared |
| a missing field | drop its factor | needs a value |
| an unusual $x$ | low $p(x)$: can be flagged | still a confident score |
| a new base rate | change $P(y)$ | refit or correct the intercept |
| drops | dependences between attributes | everything about $x$ |

Notes:
Fitting: naive Bayes maximises the joint likelihood
$\prod\_i P(y\_i)\\,p(\mathbf{x}\_i \mid y\_i)$, whose maximiser is a set of relative
frequencies; logistic regression maximises the conditional likelihood
$\prod\_i P(y\_i \mid \mathbf{x}\_i)$, which has no closed-form maximiser. Missing
field: in a product of per-attribute factors the missing factor sums to 1 over
its values and drops out. Unusual $\mathbf{x}$: naive Bayes yields
$p(\mathbf{x}) = \sum\_y P(y)\\,p(\mathbf{x} \mid y)$, so a low value flags an
input unlike the training data — judged under the independence assumption,
which can misjudge how unusual a combination is.

New base rate: in naive Bayes only $P(y)$ changes. In logistic regression the
base rate is part of $w\_0$; a change of prior odds from $o$ to $o'$ shifts $w\_0$
by $\log(o'/o)$, valid if $p(\mathbf{x} \mid y)$ is unchanged. Last row: each
model is characterised by what it leaves out.

--

## Few Data, Many Data


<div class="grid-2-1">


<div class="column">

![Schematic learning curves: naive Bayes levels off early at a higher error, logistic regression later at a lower one](/courses/probabilistic-machine-learning/figures/l04-learning-curves.svg)

</div>


<div class="column">

**Few labelled frauds:** naive Bayes. Its assumption acts like a strong prior —
little to estimate, so it settles fast.

**Many labelled frauds:** logistic regression. It pays for fewer assumptions
with data, and ends lower.

</div>


</div>



<div class="c-note">

Shown empirically and in theory by Ng & Jordan (2002). A wrong assumption costs
accuracy in the limit and buys it early — the prior of <a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>, again.

</div>


Notes:
The figure is schematic, not measured. Ng & Jordan (NIPS 2002, "On
discriminative vs. generative classifiers") compare naive Bayes with logistic
regression: naive Bayes approaches its asymptotic error with a number of
examples logarithmic in the number of attributes, logistic regression needs a
number linear in it, and the asymptotic error of logistic regression is never
higher. On many real datasets the learning curves cross.

Answer to the module's question: with 50 labelled frauds naive Bayes is the
safer choice, with 50,000 logistic regression. An assumption is information:
when roughly right it substitutes for data, when wrong it limits the error that
any amount of data can reach.

--

## Mini-Exercise

Our three-flag transaction arrives **without the IP field** — the logging
failed.


<div class="q">

What does naive Bayes do with it — and what does logistic regression do?

</div>



<div class="fragment">

**Naive Bayes** drops the factor: $\sum\_v p(x\_{\text{IP}} = v \mid y) = 1$, so
the odds become $6 \cdot 2.5 : 999$ — about **1.5%**. **Logistic regression**
has no model of $x$: it needs *some* value for $x\_{\text{IP}}$, so someone must
impute one, or train a second model without the field.

</div>


Notes:
Naive Bayes marginalises the missing attribute: for each class,
$\sum\_v p(x\_{\text{IP}} = v \mid y) = 1$, so the IP factor disappears and the
likelihood ratios 6 (new device) and 2.5 (night) remain. Odds
$\frac{1}{999} \cdot 6 \cdot 2.5 = 15/999$, probability $15/1014 \approx 1.5\\%$.
With a foreign IP the odds were $210/999$, i.e. 17.4%; with a domestic IP the
ratio is $0.3/0.95 \approx 0.32$ and the probability about 0.5%. The 1.5% is the
average of the two cases, weighted by how likely each IP value is given the
other flags: the missing value is accounted for, not guessed.

Logistic regression has a weight for $x\_{\text{IP}}$ but no distribution for it.
It needs an imputed value, which commits to a guess, or a second model trained
without the field.

--

## Takeaway


<div class="takeaway">

Naive Bayes and logistic regression draw **the same kind of line**; they differ
in what they model. The generative model pays with assumptions about $x$ and
gets answers about $x$; the discriminative one pays with data.

</div>


| lecture | shortcut | what is dropped |
|---|---|---|
| <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a> | keep the peak | how sure we are |
| <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a> | assume it apart | every dependence between attributes |
| <a href="/courses/probabilistic-machine-learning/lecture/l04-linear-models/">Lecture 04</a> | only $p(y \mid x)$ | every question about $x$ |

Naive Bayes is a graph with one hub. **<a href="/courses/probabilistic-machine-learning/lecture/l05-bayesian-networks/">Lecture 05</a>** draws the others — and
keeps exactly the dependences we claim.

Notes:
The table lists the three shortcuts from the full Bayesian treatment so far.
Keep the peak replaces the posterior over parameters by its maximum; assume it
apart replaces the joint distribution of the attributes by a product of
per-attribute factors; only $p(y \mid x)$ replaces the joint $p(x, y)$ by the
conditional. Naive Bayes is the simplest directed graphical model: a class node
with an arrow to each attribute and no arrows between attributes. Graphical
models (<a href="/courses/probabilistic-machine-learning/lecture/l05-bayesian-networks/">Lecture 05</a>) allow any chosen set of arrows, so each independence
assumption becomes an explicit statement about specific variables rather than a
blanket assumption over all attribute pairs.

# Calibration


<div class="guiding-question">

**Guiding Question:** <a href="/courses/probabilistic-machine-learning/lecture/l01-introduction/">Lecture 01</a> promised to say when a model's output earns the
name "probability". When does it — and what breaks it?

</div>


--

## When Is 0.7 a Probability?


<div class="grid-figure">


<div class="column">

<div class="viz viz-lg" data-viz="ml/reliability-diagram" data-steps="2"
 data-params='{"series": ["calibrated", "overconfident"]}'></div>

</div>


<div class="column middle">


<div class="c-definition">

A score is **calibrated** if, among all cases scored $s$, a fraction $s$ is
positive. A **reliability diagram** plots that fraction against $s$.

</div>


**Predict before click 2:** a model whose log-odds are twice too large — above
or below the diagonal at high scores?

</div>


</div>


Notes:
Step 0: the diagonal, where score equals observed frequency. Step 1: a
calibrated model; its points scatter around the diagonal because each bin holds
finitely many cases. Step 2: a model whose log-odds are twice the correct ones.
Its scores are too extreme: below the diagonal at high scores, above it at low
ones. A reported 0.9 has log-odds $\ln 9 \approx 2.20$; halving gives
$\ln 3 \approx 1.10$, a true frequency of 0.75. Symmetrically, 0.1 is really 0.25.

Naive Bayes is over-confident in this way when attributes are correlated,
because correlated evidence is counted twice (<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>). A
cost-based threshold such as $p^\* = 0.1$ in <a href="/courses/probabilistic-machine-learning/lecture/l01-introduction/">Lecture 01</a> gives the
cost-optimal decision only if the score is the actual probability. Calibration
and ranking are separate properties: a model can rank perfectly and be badly
calibrated, or be calibrated and rank poorly.

--

## What Maximum Likelihood Guarantees

At the peak, the gradient for the intercept ($x\_0 = 1$) is zero:

$$
\sum\_{i=1}^{n} (y\_i - h\_i) = 0
\quad\Longrightarrow\quad
\frac{1}{n}\sum\_{i=1}^{n} h\_i = \frac{1}{n}\sum\_{i=1}^{n} y\_i
$$


<div class="q">

What does this equation promise — and what does it not?

</div>



<div class="fragment">

| promised | not promised |
|---|---|
| **average** score = training fraud rate: *calibration in the large* | each score right — needs log-odds truly linear in $\mathbf{x}$ |
| on the **training** distribution | after a base-rate shift, or **rebalancing** |
| | that it **separates**: the base rate for everyone is calibrated — and useless |

</div>


Notes:
The equation is the intercept component of the gradient
$\sum\_i (y\_i - h\_i)\mathbf{x}\_i$, which vanishes at the maximum. It requires an
unpenalised intercept and an attained maximum. For a yes/no feature the same
argument applied to its weight gives a second guarantee: among the training
cases with that feature, the mean score equals the fraction of positives.

Per-score calibration needs a correctly specified model — log-odds truly linear
in the features — which is rarely exact; logistic regression is often close in
practice, which explains its reputation for calibrated probabilities. All
guarantees refer to the training distribution; a changed base rate or
rebalanced training breaks them. A constant score equal to the base rate is
perfectly calibrated and useless for separating the classes. Separation —
ranking frauds above legitimate cases — is measured in
<a href="/courses/probabilistic-machine-learning/lecture/l06-evaluation-and-risk/">Lecture 06</a>.

--

## Rebalanced Training


<div class="grid-figure">


<div class="column">

<div class="viz viz-lg" data-viz="ml/reliability-diagram" data-steps="1"
 data-params='{"series": ["rebalanced"], "highlight": 0.9}'></div>

</div>


<div class="column middle">

Fraud is 1 in 1,000, so practitioners **undersample** legitimate cases to
50/50. The model learns odds for a world where fraud is common.


<div class="c-important">

Bayes in odds form:
$$
\text{real odds} = \text{model odds} \times \frac{1/999}{1}
$$
Score $0.9$: odds $9 \to 9/999$, about **0.9%**.

</div>


</div>


</div>


Notes:
On real traffic the rebalanced model's points lie close to the floor: a score of
0.9 corresponds to a fraud frequency of about 0.9% (odds $9/999$, probability
$9/1008 \approx 0.89\\%$).

Why the correction works: undersampling legitimate cases changes the class
prior but not $p(\mathbf{x} \mid y)$, provided legitimate cases are dropped at
random. The model's odds are therefore the likelihood ratio times the training
prior odds, and the real odds are obtained by exchanging the prior:
real odds = model odds × real prior odds / training prior odds, here
$(1/999)/1$. This is Bayes' theorem in odds form
(<a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a>), and the same base-rate effect that made a "99%
accurate" flag mean 9% there. A threshold of 0.5 on the raw score corresponds to
a real fraud probability of 0.1%, so almost every case it blocks is legitimate.

--

## Regularisation Is a Prior

$$
\min\_{\mathbf{w}} \mathrm{RSS}(\mathbf{w}) + \lambda \lVert \mathbf{w} \rVert^2
$$


<div class="q">

You know this as ridge regression or weight decay. Which prior's peak is it?

</div>



<div class="fragment">

MAP from <a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a> with $\mathbf{w} \sim \mathcal{N}(0, \tau^2 \mathbf{I})$:
$\log p(\mathbf{w} \mid D) = -\frac{\mathrm{RSS}}{2\sigma^2} - \frac{\lVert \mathbf{w} \rVert^2}{2\tau^2} + \text{const}$,
so $\lambda = \sigma^2 / \tau^2$.

| penalty | prior on $\mathbf{w}$ | what its peak does |
|---|---|---|
| $\lambda \lVert \mathbf{w} \rVert^2$ | Gaussian | shrinks; keeps separable data finite |
| $\lambda \lVert \mathbf{w} \rVert\_1$ | Laplace | exact zeros — a property of the **peak** (the kink at 0); the posterior mean has none |

</div>


Notes:
Multiplying the log-posterior by $-2\sigma^2$ gives
$\mathrm{RSS} + \frac{\sigma^2}{\tau^2}\lVert\mathbf{w}\rVert^2$, so
$\lambda = \sigma^2/\tau^2$: noisy data (large $\sigma^2$) or a tight prior
(small $\tau^2$) means more shrinkage, and $\tau^2 \to \infty$ recovers least
squares. This is the Beta(2, 2) exercise of <a href="/courses/probabilistic-machine-learning/lecture/l02-probability-and-statistics/">Lecture 02</a> one level up:
there the prior pulled the peak from 0.8 to 0.75, here the Gaussian prior pulls
the weights towards 0. For logistic regression the same prior gives
cross-entropy $+ \lVert\mathbf{w}\rVert^2/(2\tau^2)$ — the finite peak of the
runaway example. The intercept is usually left unpenalised, so calibration in
the large survives.

L1: the Laplace log-density $-\lvert w \rvert / b$ has a corner at 0. At a corner
the peak can sit exactly at 0 for a whole range of data, which produces exact
zeros. The posterior mean averages over the posterior and is never exactly 0.

--

## Mini-Exercise

A fraud model trained on a **50/50** sample is used on real traffic, where
fraud is **1 in 1,000**. It outputs **0.5** and **0.8**.


<div class="q">

What are the real fraud probabilities?

</div>



<div class="fragment">

Multiply the odds by $1/999$. Score 0.5: odds $1 \to 1/999$, about **0.1%** —
the base rate itself. Score 0.8: odds $4 \to 4/999$, about **0.4%**.

</div>


Notes:
Rule: multiply the model odds by $1/999$. Score 0.5: odds 1, real odds $1/999$,
probability $1/1000 = 0.100\\%$ — the base rate itself. Score 0.8: odds 4, real
odds $4/999$, probability $4/1003 \approx 0.399\\%$. A score of 0.5 on a balanced
training sample means "nothing unusual" on real traffic: the model's evidence
is neutral, and the base rate decides.

--

## Takeaway


<div class="takeaway">

A score is a probability when it is **calibrated** — checkable on a reliability
diagram, not by accuracy. Maximum likelihood guarantees it only on average and
only on the training distribution; **rebalancing** breaks it, and the prior odds
repair it. **Regularisation is a prior**, and a penalised fit is a MAP estimate.

</div>


---

## Every Loss So Far Is a Likelihood

So far — <a href="/courses/probabilistic-machine-learning/lecture/l06-evaluation-and-risk/">Lecture 06</a> meets losses that are not.

| you minimised | it is $-\log$ of | the fit is |
|---|---|---|
| squared error | Gaussian noise around $\mathbf{w}^{\top}\mathbf{x}$ | the peak (MLE) |
| cross-entropy | Bernoulli labels with bias $\sigma(\mathbf{w}^{\top}\mathbf{x})$ | the peak (MLE) |
| $+ \lambda \lVert \mathbf{w} \rVert^2$ | a Gaussian prior on $\mathbf{w}$ | a prior's peak (MAP) |
| $+ \lambda \lVert \mathbf{w} \rVert\_1$ | a Laplace prior on $\mathbf{w}$ | a prior's peak (MAP) |


<div class="grid-2">


<div class="card">

### Dropped: the spread
how sure we are about $\mathbf{w}$ — **<a href="/courses/probabilistic-machine-learning/lecture/l07-probabilistic-algorithms/">Lecture 07</a>** keeps it

</div>


<div class="card">

### Dropped: $p(\mathbf{x})$
what a normal input looks like — **<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>** modelled it, naive Bayes

</div>


</div>


Notes:
Each row identifies an objective with a probability model. Minimising squared
error maximises a Gaussian likelihood of fixed variance; minimising
cross-entropy maximises a Bernoulli likelihood; adding
$\lambda\lVert\mathbf{w}\rVert^2$ adds $-\log$ of a Gaussian prior
$\mathcal{N}(0, \tau^2\mathbf{I})$, with $\lambda = \sigma^2/\tau^2$ in regression;
adding $\lambda\lVert\mathbf{w}\rVert\_1$ adds $-\log$ of a Laplace prior. In
every row the result is a single point: the peak of the likelihood (MLE) or of
the posterior (MAP).

"So far" is literal. Not every loss is a negative log-likelihood: the hinge
loss of support vector machines is not $-\log p(y \mid \mathbf{x})$ of any
model, because $e^{-\text{loss}}$ summed over the two labels depends on the
score and cannot be normalised without changing the minimiser. Minimising such a
loss directly, with no probability model behind it, is the shortcut of
<a href="/courses/probabilistic-machine-learning/lecture/l06-evaluation-and-risk/">Lecture 06</a>.

The cards name what the two shortcuts of this lecture leave out. The spread of
$\mathbf{w}$ is what widens the band at the villa from ±31 k€ to ±153 k€;
<a href="/courses/probabilistic-machine-learning/lecture/l07-probabilistic-algorithms/">Lecture 07</a> keeps it. $p(\mathbf{x})$ is what would flag a
transfer unlike any seen; naive Bayes (<a href="/courses/probabilistic-machine-learning/lecture/l03-naive-bayes/">Lecture 03</a>) models it.
