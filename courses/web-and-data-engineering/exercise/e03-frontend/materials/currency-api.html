<!DOCTYPE html>
<html>

  <head>
    <title>Currency calculation</title>
    <meta charset="UTF-8">
  </head>

  <body>
    <input type="number" id="inVal" value="0" data-old="" />
    <select id="inCur"></select>
    &rAarr;
    <!-- Folgepfeil -->
    <output id="outVal">0</output>
    <select id="outCur"></select>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
		
      // Initialize input/output variables
      var data = {
        'inCur': 'EUR',
        'outCur': 'EUR',
        'inVal': 0,
        'outVal': 0
      }

      // Initialize rates empty
      var rates = {};

      // Function to add options to the dropdown
      function addOption(value) {
        if ($('#inCur option[value=' + value + ']').length == 0) {
          $('#inCur').append('<option value="' + value + '">' + value + '</option>');
          $('#outCur').append('<option value="' + value + '">' + value + '</option>');
        }
      }

      // Get data from cookie if cookie is set. See https://developer.mozilla.org/en-US/docs/Web/API/document/cookie
      var cookie = document.cookie.replace(/(?:(?:^|.*;\s*)currency\s*\=\s*([^;]*).*$)|^.*$/, "$1")
      if (cookie !== "") {
        try {
          data = JSON.parse(cookie)
          addOption(data.inCur)
          addOption(data.outCur)
          $('#inCur').val(data.inCur);
          $('#outCur').val(data.outCur);
          $('#inVal').val(data.inVal);
          $('#outVal').val(data.outVal.toFixed(2));
        } catch (error) {
          // Errorneous cookie data; reset cookie
          console.error(error);
          document.cookie = 'currency=; Max-Age=0';
        }
      }

      // Use calculated results
      function processResult(result) {
        console.log(result);

        // Set in varibale
        data.outVal = result;

        // Set output value
        $('#outVal').val(data.outVal.toFixed(2));

        // Set cookie
        document.cookie = "currency=" + JSON.stringify({
          inVal: data.inVal,
          outVal: data.outVal,
          inCur: data.inCur,
          outCur: data.outCur
        }) + "; expires=Fri, 31 Dec 9999 23:59:59 GMT"
      }

      function triggerCalculation() {
        calculate(processResult);
      }

      // Populate rates
      function populateRates(currency, result) {
        addOption(currency)
        rates[currency] = {};
        for (var target in result.rates) {
          addOption(target)
          rates[currency][target] = result.rates[target];
        }
      }

      // Calculate results
      function calculate(callback) {
        data.inVal = parseFloat($('#inVal').val());
        data.outVal = 0;
        data.inCur = $('#inCur').val();
        data.outCur = $('#outCur').val();

        // if we didn't give a number and the inVal is NaN
        if (Number.isNaN(data.inVal)) {
          return callback(0)
        }

        // no calculation needed if source and target currency are equal
        if (data.inCur === data.outCur) {
          return callback(data.inVal)
        }

        // if rate is available, calculate result
        if (rates[data.inCur] && rates[data.inCur][data.outCur]) {
          return callback(data.inVal * rates[data.inCur][data.outCur]);
        }

        // obtain not yet available rates for seleceted currency and calculate result
        //$.getJSON('https://api.exchangeratesapi.io/latest?base=' + data.inCur + "&symbols="+data.outCur, function(result) {
        $.getJSON('https://api.exchangerate.host/latest?base=' + data.inCur + "&symbols="+data.outCur, function(result) {
          console.log(result);
          // populate rates with obtained result
          populateRates(data.inCur, result);
          return callback(data.inVal * rates[data.inCur][data.outCur]);
        });
      }

      // obtain EUR rates from API
      //$.getJSON('https://api.exchangeratesapi.io/latest?symbols=USD,CHF', function(result) {
      $.getJSON('https://api.exchangerate.host/latest?symbols=USD,CHF', function(result) {
        // populate rates with obtained result
        populateRates('EUR', result);
      });

      // bind listeners to input elements
      $('#inVal').on('input', triggerCalculation);
      $('#outCur').change(triggerCalculation);
      $('#inCur').change(triggerCalculation);

    </script>
  </body>

</html>
