<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vorlage: Barrierefreies Formular</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 2rem auto;
        padding: 2rem;
        line-height: 1.6;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 1rem;
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Barrierefreies HTML-Formular</h1>
      <p>Ergänzen Sie die fehlenden Elemente und Attribute.</p>
    </header>

    <form action="/search" 1 method="GET">
      <label for="query">Suchbegriff</label>
      <input
        id="query"
        name="query"
        type="text"
        required
        placeholder="z.B. Laptop"
      />

      <label for="category">Kategorie</label>
      <select id="category" name="category">
        <option value="">Alle</option>
        <option value="electronics">Elektronik</option>
        <option value="clothing">Kleidung</option>
        <option value="books">Buecher</option>
      </select>

      <input type="checkbox" id="available" name="available" value="true" />
      <label for="available">Nur verfuegbare Produkte</label>

      <button type="submit">Suchen</button>
    </form>
  </body>
</html>
