<!DOCTYPE html>
<html>
    <head lang="en">
        <meta charset="UTF-8">
        <title>WebEngineering 2022 - Blatt 05</title>
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    </head>
    <body>
        <div class="container">
            <div class="jumbotron">
                <h3>Web Engineering 2022 W&auml;hrungsrechner</h3>
                <div class="container">
                    <form class="form-horizontal" role="form" method="post" action="currency">
                        <div class="row">
                            <div class="form-group col-sm-4">
                                <div class="input-group">
                                    <input type="number" step="any" class="form-control" name="value">
                                </div><!-- /input-group -->
                            </div><!-- /.col-sm-2 -->
                            <div class="form-group col-sm-2">
                                <div class="input-group">
                                    <select class="form-control" name="from">
                                        <option value="eur" selected="selected">EUR</option>
                                        <option value="usd">USD</option>
                                        <option value="chf">CHF</option>
                                    </select>
                                </div><!-- /input-group -->
                            </div><!-- /.col-sm-2 -->
                            <div class="form-group col-sm-2">
                                <div class="input-group">
                                    <select class="form-control" name="to">
                                        <option value="eur" selected="selected">EUR</option>
                                        <option value="usd">USD</option>
                                        <option value="chf">CHF</option>
                                    </select>
                                </div><!-- /input-group -->
                            </div><!-- /.col-sm-2 -->
                            <div class="form-group col-sm-2">
                                <div class="input-group">
                                    <input type="submit" class="btn btn-info" value="Umrechnen">
                                </div><!-- /input-group -->
                            </div><!-- /.col-sm-2 -->
                        </div><!-- /.row -->
                        <div class="row">
                            <a class="form-group col-sm-12" href="/api.html">
                                Javascript
                            </a>
                        </div>
                    </form>
                </div><!-- /.container -->
            </div>

        </div><!-- /.container -->
    </body>

</html>
