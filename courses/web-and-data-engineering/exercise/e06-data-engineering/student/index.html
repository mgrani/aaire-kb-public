## Übung 6.D.1: MapReduce Reducer analysieren

```python
import sys
current_word = None
current_count = 0
for line in sys.stdin:
    line = line.strip()
    word, count = line.split('\t', 1)
    try:
        count = int(count)
    except ValueError:
        continue
    if current_word == word:
        current_count += count
    else:
        if current_word:
            print('%s\t%s' % (current_word, current_count))
        current_count = count
        current_word = word
if current_word == word:
    print('%s\t%s' % (current_word, current_count))
```

a) Was macht dieser Code? Erklären Sie die Logik.
b) Warum muss die Eingabe **sortiert nach Wort** sein, damit der Code korrekt funktioniert?
c) Was ist die Ausgabe für die Eingabe (sortiert): `Hallo\t1`, `Hallo\t1`, `Welt\t2`?
