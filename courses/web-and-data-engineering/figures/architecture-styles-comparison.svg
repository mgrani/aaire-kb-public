<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" font-family="'Source Sans Pro', Helvetica, Arial, sans-serif">

  <!-- === N-Tier === -->
  <rect x="30" y="10" width="320" height="220" rx="10" fill="#f0f4fb" stroke="#1a5fa8" stroke-width="2"/>
  <rect x="30" y="10" width="320" height="40" rx="10" fill="#1a5fa8"/>
  <rect x="30" y="30" width="320" height="20" fill="#1a5fa8"/>
  <text x="190" y="36" text-anchor="middle" font-weight="700" font-size="15" fill="#ffffff">N-Tier</text>

  <!-- Tier boxes stacked -->
  <rect x="80" y="68" width="220" height="34" rx="6" fill="#ffffff" stroke="#1a5fa8" stroke-width="1.5"/>
  <text x="190" y="90" text-anchor="middle" font-size="13" fill="#222">Präsentation</text>
  <line x1="190" y1="102" x2="190" y2="118" stroke="#1a5fa8" stroke-width="1.5" marker-end="url(#arr2)"/>
  <rect x="80" y="120" width="220" height="34" rx="6" fill="#ffffff" stroke="#1a5fa8" stroke-width="1.5"/>
  <text x="190" y="142" text-anchor="middle" font-size="13" fill="#222">Geschäftslogik</text>
  <line x1="190" y1="154" x2="190" y2="170" stroke="#1a5fa8" stroke-width="1.5" marker-end="url(#arr2)"/>
  <rect x="80" y="172" width="220" height="34" rx="6" fill="#ffffff" stroke="#1a5fa8" stroke-width="1.5"/>
  <text x="190" y="194" text-anchor="middle" font-size="13" fill="#222">Persistenz</text>

  <!-- Labels -->
  <text x="190" y="248" text-anchor="middle" font-size="12" fill="#555">synchron · sequentiell</text>
  <text x="190" y="264" text-anchor="middle" font-size="11" fill="#888">klassische Web-Apps</text>

  <!-- === Event-Driven === -->
  <rect x="390" y="10" width="320" height="220" rx="10" fill="#fffbf0" stroke="#f9ab00" stroke-width="2"/>
  <rect x="390" y="10" width="320" height="40" rx="10" fill="#f9ab00"/>
  <rect x="390" y="30" width="320" height="20" fill="#f9ab00"/>
  <text x="550" y="36" text-anchor="middle" font-weight="700" font-size="15" fill="#ffffff">Event-Driven</text>

  <!-- Producer → Broker → Consumers -->
  <rect x="420" y="68" width="100" height="34" rx="6" fill="#ffffff" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="470" y="90" text-anchor="middle" font-size="12" fill="#222">Producer</text>

  <rect x="490" y="130" width="120" height="34" rx="6" fill="#f9ab00" stroke="#e69900" stroke-width="1.5"/>
  <text x="550" y="152" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">Broker</text>

  <rect x="570" y="68" width="100" height="34" rx="6" fill="#ffffff" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="620" y="90" text-anchor="middle" font-size="12" fill="#222">Consumer A</text>

  <rect x="570" y="175" width="100" height="34" rx="6" fill="#ffffff" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="620" y="197" text-anchor="middle" font-size="12" fill="#222">Consumer B</text>

  <!-- Arrows -->
  <line x1="470" y1="102" x2="520" y2="130" stroke="#f9ab00" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="570" y1="147" x2="572" y2="85" stroke="#f9ab00" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="570" y1="155" x2="572" y2="175" stroke="#f9ab00" stroke-width="1.5" marker-end="url(#arr3)"/>

  <text x="550" y="248" text-anchor="middle" font-size="12" fill="#555">asynchron · locker gekoppelt</text>
  <text x="550" y="264" text-anchor="middle" font-size="11" fill="#888">Streaming · Pipelines</text>

  <!-- === Microservices === -->
  <rect x="750" y="10" width="320" height="220" rx="10" fill="#f0faf3" stroke="#34a853" stroke-width="2"/>
  <rect x="750" y="10" width="320" height="40" rx="10" fill="#34a853"/>
  <rect x="750" y="30" width="320" height="20" fill="#34a853"/>
  <text x="910" y="36" text-anchor="middle" font-weight="700" font-size="15" fill="#ffffff">Microservices</text>

  <!-- API Gateway + 3 services -->
  <rect x="830" y="62" width="160" height="32" rx="6" fill="#34a853" stroke="#2d8f47" stroke-width="1.5"/>
  <text x="910" y="82" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">API Gateway</text>

  <line x1="840" y1="94" x2="800" y2="120" stroke="#34a853" stroke-width="1.5" marker-end="url(#arr4)"/>
  <line x1="910" y1="94" x2="910" y2="120" stroke="#34a853" stroke-width="1.5" marker-end="url(#arr4)"/>
  <line x1="975" y1="94" x2="1020" y2="120" stroke="#34a853" stroke-width="1.5" marker-end="url(#arr4)"/>

  <rect x="760" y="122" width="90" height="52" rx="6" fill="#ffffff" stroke="#34a853" stroke-width="1.5"/>
  <text x="805" y="144" text-anchor="middle" font-size="11" fill="#222">User</text>
  <text x="805" y="160" text-anchor="middle" font-size="11" fill="#555">Service</text>
  <text x="805" y="175" text-anchor="middle" font-size="9" fill="#888">eigene DB</text>

  <rect x="865" y="122" width="90" height="52" rx="6" fill="#ffffff" stroke="#34a853" stroke-width="1.5"/>
  <text x="910" y="144" text-anchor="middle" font-size="11" fill="#222">Order</text>
  <text x="910" y="160" text-anchor="middle" font-size="11" fill="#555">Service</text>
  <text x="910" y="175" text-anchor="middle" font-size="9" fill="#888">eigene DB</text>

  <rect x="970" y="122" width="90" height="52" rx="6" fill="#ffffff" stroke="#34a853" stroke-width="1.5"/>
  <text x="1015" y="144" text-anchor="middle" font-size="11" fill="#222">Product</text>
  <text x="1015" y="160" text-anchor="middle" font-size="11" fill="#555">Service</text>
  <text x="1015" y="175" text-anchor="middle" font-size="9" fill="#888">eigene DB</text>

  <text x="910" y="248" text-anchor="middle" font-size="12" fill="#555">autonom · unabhängig deploybar</text>
  <text x="910" y="264" text-anchor="middle" font-size="11" fill="#888">große, evolvierende Plattformen</text>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="arr2" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#1a5fa8"/>
    </marker>
    <marker id="arr3" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#f9ab00"/>
    </marker>
    <marker id="arr4" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#34a853"/>
    </marker>
  </defs>

</svg>
