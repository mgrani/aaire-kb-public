<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#1f4e79"/>
    </marker>
    <marker id="arr-red" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#9f3129"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#1b5e20"/>
    </marker>
  </defs>

  <!-- Client & Server headers -->
  <rect x="30" y="20" width="150" height="38" rx="8" fill="#eaf2ff" stroke="#4a89dc"/>
  <text x="105" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79">Client</text>

  <rect x="580" y="20" width="150" height="38" rx="8" fill="#fdecea" stroke="#e06a5f"/>
  <text x="655" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#9f3129">Server</text>

  <!-- Lifelines -->
  <line x1="105" y1="58" x2="105" y2="280" stroke="#9bb6d1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="655" y1="58" x2="655" y2="280" stroke="#e6a39b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Activation 1: POST → 202 -->
  <rect x="651" y="82" width="8" height="34" fill="#fdecea" stroke="#9f3129" stroke-width="1"/>

  <!-- 1. POST -->
  <text x="380" y="74" text-anchor="middle" font-size="13" fill="#1f4e79" font-weight="700">POST /exports</text>
  <line x1="105" y1="82" x2="651" y2="82" stroke="#1f4e79" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- 2. 202 -->
  <text x="380" y="108" text-anchor="middle" font-size="13" fill="#9f3129" font-weight="700">202 Accepted  ·  Location: /jobs/4711</text>
  <line x1="651" y1="116" x2="109" y2="116" stroke="#9f3129" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Activation 2: poll 1 -->
  <rect x="651" y="160" width="8" height="34" fill="#fdecea" stroke="#9f3129" stroke-width="1"/>

  <!-- 3. GET poll -->
  <text x="380" y="152" text-anchor="middle" font-size="13" fill="#1f4e79" font-weight="700">GET /jobs/4711  (Polling)</text>
  <line x1="105" y1="160" x2="651" y2="160" stroke="#1f4e79" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- 4. 200 running -->
  <text x="380" y="186" text-anchor="middle" font-size="13" fill="#9f3129" font-weight="700">200 OK  ·  {"status":"running"}</text>
  <line x1="651" y1="194" x2="109" y2="194" stroke="#9f3129" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Activation 3: final poll -->
  <rect x="651" y="232" width="8" height="34" fill="#fdecea" stroke="#9f3129" stroke-width="1"/>

  <!-- 5. GET poll again -->
  <text x="380" y="224" text-anchor="middle" font-size="13" fill="#1f4e79" font-weight="700">GET /jobs/4711  (erneut)</text>
  <line x1="105" y1="232" x2="651" y2="232" stroke="#1f4e79" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- 6. 303 See Other -->
  <text x="380" y="258" text-anchor="middle" font-size="13" fill="#1b5e20" font-weight="700">303 See Other  ·  Location: /exports/report.pdf</text>
  <line x1="651" y1="266" x2="109" y2="266" stroke="#1b5e20" stroke-width="2" marker-end="url(#arr-green)"/>
</svg>
