<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">async/await mit zwei Fetch-Requests: sequenziell vs. parallel</title>
  <desc id="desc">Zwei Timelines vergleichen sequenzielle awaits mit Promise.all. In beiden Fällen ist der Main Thread während der Wartezeit nicht blockiert — er verarbeitet andere Browser-Events wie Klicks und Rendering. Sequenziell entstehen zwei Wartephasen nacheinander, parallel nur eine.</desc>

  <defs>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#4b5563"/>
    </marker>
  </defs>

  <g id="background">
    <rect width="960" height="540" fill="#ffffff"/>
    <rect x="20" y="20" width="920" height="500" rx="20" fill="#f8fafc" stroke="#d7dee7"/>
    <text x="480" y="50" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827">async / await mit zwei Fetch-Requests</text>
  </g>

  <g id="legend" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151">
    <rect x="60" y="64" width="14" height="14" rx="2" fill="#ef6c00"/>
    <text x="80" y="76">unsere async-Funktion (JS)</text>

    <rect x="270" y="64" width="14" height="14" rx="2" fill="#188038"/>
    <text x="290" y="76">andere Browser-Events (Klick, Render, Animation)</text>

    <rect x="600" y="64" width="14" height="14" rx="2" fill="#1a73e8"/>
    <text x="620" y="76">Netzwerk-Request (Browser-API, läuft außerhalb)</text>
  </g>

  <!-- ============ SEQUENZIELL ============ -->
  <g id="sequential">
    <rect x="40" y="100" width="880" height="190" rx="14" fill="#ffffff" stroke="#e5e7eb"/>

    <text x="56" y="124" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#b3261e">Sequenziell — zwei await-Aufrufe nacheinander</text>
    <text x="56" y="142" font-family="Menlo, Consolas, monospace" font-size="12" fill="#374151">const a = await fetch(urlA);   const b = await fetch(urlB);</text>

    <!-- Lane labels -->
    <text x="190" y="180" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#374151">Main Thread</text>
    <text x="190" y="210" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#374151">fetch A</text>
    <text x="190" y="240" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#374151">fetch B</text>

    <!-- Lane backgrounds -->
    <rect x="200" y="166" width="660" height="20" rx="4" fill="#f3f4f6"/>
    <rect x="200" y="196" width="660" height="20" rx="4" fill="#f3f4f6"/>
    <rect x="200" y="226" width="660" height="20" rx="4" fill="#f3f4f6"/>

    <!-- Main Thread: own JS in orange -->
    <rect x="200" y="166" width="32" height="20" rx="3" fill="#ef6c00"/>
    <rect x="466" y="166" width="32" height="20" rx="3" fill="#ef6c00"/>
    <rect x="732" y="166" width="32" height="20" rx="3" fill="#ef6c00"/>

    <!-- Main Thread: other events during await A -->
    <rect x="252" y="166" width="44" height="20" rx="3" fill="#188038"/>
    <text x="274" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#ffffff">click</text>
    <rect x="328" y="166" width="48" height="20" rx="3" fill="#188038"/>
    <text x="352" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#ffffff">render</text>
    <rect x="400" y="166" width="44" height="20" rx="3" fill="#188038"/>
    <text x="422" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#ffffff">click</text>

    <!-- Main Thread: other events during await B -->
    <rect x="518" y="166" width="48" height="20" rx="3" fill="#188038"/>
    <text x="542" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#ffffff">render</text>
    <rect x="592" y="166" width="44" height="20" rx="3" fill="#188038"/>
    <text x="614" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#ffffff">click</text>
    <rect x="660" y="166" width="48" height="20" rx="3" fill="#188038"/>
    <text x="684" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#ffffff">render</text>

    <!-- Network bars -->
    <rect x="232" y="196" width="234" height="20" rx="4" fill="#1a73e8"/>
    <text x="349" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">Netzwerk A unterwegs</text>
    <rect x="498" y="226" width="234" height="20" rx="4" fill="#1a73e8"/>
    <text x="615" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">Netzwerk B unterwegs</text>

    <!-- Brackets above await spans -->
    <line x1="232" y1="158" x2="466" y2="158" stroke="#9ca3af" stroke-width="1"/>
    <line x1="232" y1="156" x2="232" y2="162" stroke="#9ca3af" stroke-width="1"/>
    <line x1="466" y1="156" x2="466" y2="162" stroke="#9ca3af" stroke-width="1"/>
    <text x="349" y="153" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#4b5563" font-style="italic">await A — eigene Funktion pausiert</text>

    <line x1="498" y1="158" x2="732" y2="158" stroke="#9ca3af" stroke-width="1"/>
    <line x1="498" y1="156" x2="498" y2="162" stroke="#9ca3af" stroke-width="1"/>
    <line x1="732" y1="156" x2="732" y2="162" stroke="#9ca3af" stroke-width="1"/>
    <text x="615" y="153" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#4b5563" font-style="italic">await B — eigene Funktion pausiert</text>

    <!-- Time axis -->
    <line x1="200" y1="270" x2="860" y2="270" stroke="#9ca3af" stroke-width="1" marker-end="url(#arrow-gray)"/>
    <text x="868" y="274" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4b5563">t</text>
    <text x="764" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#b3261e">Gesamtdauer ≈ t_A + t_B</text>
  </g>

  <!-- ============ PARALLEL ============ -->
  <g id="parallel">
    <rect x="40" y="305" width="880" height="190" rx="14" fill="#ffffff" stroke="#e5e7eb"/>

    <text x="56" y="329" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#188038">Parallel — Promise.all wartet auf beide gleichzeitig</text>
    <text x="56" y="347" font-family="Menlo, Consolas, monospace" font-size="12" fill="#374151">const [a, b] = await Promise.all([fetch(urlA), fetch(urlB)]);</text>

    <!-- Lane labels -->
    <text x="190" y="385" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#374151">Main Thread</text>
    <text x="190" y="415" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#374151">fetch A</text>
    <text x="190" y="445" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#374151">fetch B</text>

    <!-- Lane backgrounds -->
    <rect x="200" y="371" width="660" height="20" rx="4" fill="#f3f4f6"/>
    <rect x="200" y="401" width="660" height="20" rx="4" fill="#f3f4f6"/>
    <rect x="200" y="431" width="660" height="20" rx="4" fill="#f3f4f6"/>

    <!-- Main Thread: own JS -->
    <rect x="200" y="371" width="32" height="20" rx="3" fill="#ef6c00"/>
    <rect x="466" y="371" width="32" height="20" rx="3" fill="#ef6c00"/>

    <!-- Main Thread: other events during the single await -->
    <rect x="252" y="371" width="44" height="20" rx="3" fill="#188038"/>
    <text x="274" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#ffffff">click</text>
    <rect x="328" y="371" width="48" height="20" rx="3" fill="#188038"/>
    <text x="352" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#ffffff">render</text>
    <rect x="400" y="371" width="44" height="20" rx="3" fill="#188038"/>
    <text x="422" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#ffffff">click</text>

    <!-- Network A and B run in parallel -->
    <rect x="232" y="401" width="234" height="20" rx="4" fill="#1a73e8"/>
    <text x="349" y="415" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">Netzwerk A unterwegs</text>
    <rect x="232" y="431" width="234" height="20" rx="4" fill="#1a73e8"/>
    <text x="349" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">Netzwerk B unterwegs</text>

    <!-- Bracket -->
    <line x1="232" y1="363" x2="466" y2="363" stroke="#9ca3af" stroke-width="1"/>
    <line x1="232" y1="361" x2="232" y2="367" stroke="#9ca3af" stroke-width="1"/>
    <line x1="466" y1="361" x2="466" y2="367" stroke="#9ca3af" stroke-width="1"/>
    <text x="349" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#4b5563" font-style="italic">await Promise.all — eigene Funktion pausiert</text>

    <!-- Saved time bracket: from end of parallel to end of sequential -->
    <line x1="498" y1="460" x2="732" y2="460" stroke="#188038" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="498" y1="455" x2="498" y2="465" stroke="#188038" stroke-width="1.5"/>
    <line x1="732" y1="455" x2="732" y2="465" stroke="#188038" stroke-width="1.5"/>
    <text x="615" y="475" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#188038">eingesparte Wartezeit gegenüber sequenziell</text>

    <!-- Time axis -->
    <line x1="200" y1="492" x2="860" y2="492" stroke="#9ca3af" stroke-width="1" marker-end="url(#arrow-gray)"/>
    <text x="868" y="496" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4b5563">t</text>
  </g>

  <!-- ============ TAKEAWAY ============ -->
  <g id="takeaway" font-family="Arial, Helvetica, sans-serif">
    <text x="480" y="513" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Async-Vorteil: Main Thread bleibt während await frei für UI-Events. Promise.all spart zusätzlich die zweite Wartephase.</text>
  </g>
</svg>
