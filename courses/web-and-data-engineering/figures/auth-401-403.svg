<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#1f4e79"/>
    </marker>
    <marker id="arr-red" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#9f3129"/>
    </marker>
  </defs>

  <!-- Client & Server headers -->
  <rect x="30" y="20" width="150" height="38" rx="8" fill="#eaf2ff" stroke="#4a89dc"/>
  <text x="105" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79">Client</text>

  <rect x="580" y="20" width="150" height="38" rx="8" fill="#fdecea" stroke="#e06a5f"/>
  <text x="655" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#9f3129">Server</text>

  <!-- Lifelines -->
  <line x1="105" y1="58" x2="105" y2="235" stroke="#9bb6d1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="655" y1="58" x2="655" y2="235" stroke="#e6a39b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Activation bar 1: 401 cycle -->
  <rect x="651" y="84" width="8" height="34" fill="#fdecea" stroke="#9f3129" stroke-width="1"/>

  <!-- Step 1: GET /admin -->
  <text x="380" y="76" text-anchor="middle" font-size="13" fill="#1f4e79" font-weight="700">GET /admin</text>
  <line x1="105" y1="84" x2="651" y2="84" stroke="#1f4e79" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Step 2: 401 -->
  <text x="380" y="110" text-anchor="middle" font-size="13" fill="#9f3129" font-weight="700">401 Unauthorized  ·  WWW-Authenticate: Bearer</text>
  <line x1="651" y1="118" x2="109" y2="118" stroke="#9f3129" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Activation bar 2: 403 cycle -->
  <rect x="651" y="164" width="8" height="34" fill="#fdecea" stroke="#9f3129" stroke-width="1"/>

  <!-- Step 3: GET with Bearer -->
  <text x="380" y="156" text-anchor="middle" font-size="13" fill="#1f4e79" font-weight="700">GET /admin  ·  Authorization: Bearer &lt;token&gt;</text>
  <line x1="105" y1="164" x2="651" y2="164" stroke="#1f4e79" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Step 4: 403 -->
  <text x="380" y="190" text-anchor="middle" font-size="13" fill="#9f3129" font-weight="700">403 Forbidden  ·  authentifiziert, aber nicht autorisiert</text>
  <line x1="651" y1="198" x2="109" y2="198" stroke="#9f3129" stroke-width="2" marker-end="url(#arr-red)"/>
</svg>
