<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">Backpressure und Checkpointing in Stream-Systemen</title>
  <desc id="desc">Oben: Backpressure-Mechanismus — Consumer signalisiert Producer, langsamer zu senden. Unten: Checkpoint-basierte Exactly-Once-Semantik — periodische Snapshots des Verarbeitungszustands.</desc>
  <rect width="1000" height="440" fill="#ffffff"/>

  <defs>
    <marker id="ba" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="ra" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea4335"/>
    </marker>
  </defs>

  <!-- BACKPRESSURE SECTION -->
  <text x="500" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111111">Backpressure</text>
  <text x="500" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666">Was passiert, wenn der Consumer langsamer ist als der Producer?</text>

  <!-- Producer -->
  <rect x="50" y="70" width="180" height="60" rx="10" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="140" y="95" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#c5221f">Producer</text>
  <text x="140" y="115" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">10.000 Events/s</text>

  <!-- Events flowing -->
  <g fill="#ea4335">
    <rect x="250" y="85" width="12" height="12" rx="2"/>
    <rect x="270" y="85" width="12" height="12" rx="2"/>
    <rect x="290" y="85" width="12" height="12" rx="2"/>
    <rect x="310" y="85" width="12" height="12" rx="2"/>
    <rect x="330" y="85" width="12" height="12" rx="2"/>
    <rect x="350" y="85" width="12" height="12" rx="2"/>
  </g>
  <line x1="230" y1="92" x2="370" y2="92" stroke="#666" stroke-width="1.5" marker-end="url(#ba)"/>

  <!-- Buffer (Kafka) -->
  <rect x="380" y="70" width="200" height="60" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="480" y="95" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#e37400">Buffer (Kafka)</text>
  <!-- Buffer fill indicator -->
  <rect x="395" y="108" width="170" height="12" rx="4" fill="#fff3cd" stroke="#f9ab00" stroke-width="1"/>
  <rect x="395" y="108" width="140" height="12" rx="4" fill="#f9ab00"/>
  <text x="480" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" fill="#fff">82% voll</text>

  <!-- Events flowing to consumer (slower) -->
  <g fill="#34a853" opacity="0.6">
    <rect x="600" y="85" width="12" height="12" rx="2"/>
    <rect x="625" y="85" width="12" height="12" rx="2"/>
  </g>
  <line x1="580" y1="92" x2="660" y2="92" stroke="#666" stroke-width="1.5" marker-end="url(#ba)"/>

  <!-- Consumer -->
  <rect x="670" y="70" width="180" height="60" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="760" y="95" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1e8e3e">Consumer (Flink)</text>
  <text x="760" y="115" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">2.000 Events/s</text>

  <!-- Backpressure signal -->
  <path d="M 670,130 C 600,165 300,165 230,130" fill="none" stroke="#ea4335" stroke-width="2.5" stroke-dasharray="8 4" marker-end="url(#ra)"/>
  <rect x="370" y="145" width="220" height="24" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="480" y="162" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#c5221f">Backpressure: Langsamer senden!</text>

  <!-- Result annotation -->
  <text x="900" y="95" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666">Ohne BP:</text>
  <text x="900" y="110" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ea4335">OOM / Datenverlust</text>
  <text x="900" y="130" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666">Mit BP:</text>
  <text x="900" y="145" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#34a853">Kontrollierte Drosselung</text>

  <!-- DIVIDER -->
  <line x1="30" y1="195" x2="970" y2="195" stroke="#eee" stroke-width="2"/>

  <!-- CHECKPOINT SECTION -->
  <text x="500" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111111">Exactly-Once via Checkpointing</text>
  <text x="500" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666">Wie garantiert Flink, dass jedes Event genau einmal verarbeitet wird?</text>

  <!-- Timeline -->
  <line x1="60" y1="310" x2="940" y2="310" stroke="#aaa" stroke-width="2" marker-end="url(#ba)"/>
  <text x="950" y="315" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#999">Zeit</text>

  <!-- Events on timeline -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="10">
    <rect x="100" y="298" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
    <text x="115" y="314" text-anchor="middle" fill="#1a73e8">E1</text>

    <rect x="160" y="298" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
    <text x="175" y="314" text-anchor="middle" fill="#1a73e8">E2</text>

    <rect x="220" y="298" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
    <text x="235" y="314" text-anchor="middle" fill="#1a73e8">E3</text>
  </g>

  <!-- Checkpoint 1 -->
  <line x1="300" y1="270" x2="300" y2="340" stroke="#34a853" stroke-width="2.5"/>
  <rect x="265" y="260" width="70" height="22" rx="6" fill="#34a853"/>
  <text x="300" y="276" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#fff">CP-1</text>
  <text x="300" y="355" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#34a853">State: {count: 3}</text>

  <!-- More events -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="10">
    <rect x="350" y="298" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
    <text x="365" y="314" text-anchor="middle" fill="#1a73e8">E4</text>

    <rect x="410" y="298" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
    <text x="425" y="314" text-anchor="middle" fill="#1a73e8">E5</text>

    <!-- Failed event -->
    <rect x="500" y="298" width="30" height="24" rx="4" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
    <text x="515" y="314" text-anchor="middle" fill="#c5221f">E6</text>
    <text x="515" y="290" text-anchor="middle" font-size="18" fill="#ea4335">✗</text>
    <text x="515" y="370" text-anchor="middle" font-size="9" fill="#ea4335">Ausfall!</text>
  </g>

  <!-- Recovery arrow -->
  <path d="M 530,340 C 560,380 620,400 660,370 C 700,340 680,290 640,290" fill="none" stroke="#ea4335" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="630" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#ea4335">Recovery: Zurück zu CP-1</text>

  <!-- Replayed events -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="10">
    <rect x="660" y="298" width="30" height="24" rx="4" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
    <text x="675" y="314" text-anchor="middle" fill="#1e8e3e">E4</text>
    <text x="675" y="290" text-anchor="middle" font-size="9" fill="#34a853">replay</text>

    <rect x="720" y="298" width="30" height="24" rx="4" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
    <text x="735" y="314" text-anchor="middle" fill="#1e8e3e">E5</text>

    <rect x="780" y="298" width="30" height="24" rx="4" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
    <text x="795" y="314" text-anchor="middle" fill="#1e8e3e">E6</text>
  </g>

  <!-- Checkpoint 2 -->
  <line x1="850" y1="270" x2="850" y2="340" stroke="#34a853" stroke-width="2.5"/>
  <rect x="815" y="260" width="70" height="22" rx="6" fill="#34a853"/>
  <text x="850" y="276" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#fff">CP-2</text>
  <text x="850" y="355" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#34a853">State: {count: 6}</text>

  <!-- Key insight -->
  <rect x="60" y="395" width="880" height="30" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="500" y="415" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#1e8e3e">Ergebnis: Jedes Event wird genau einmal gezählt — auch nach einem Ausfall. Checkpoints + Kafka-Replay = Exactly-Once-Semantik.</text>
</svg>