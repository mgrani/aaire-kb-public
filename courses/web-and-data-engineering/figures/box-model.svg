<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">

  <!-- Margin -->
  <rect x="2" y="2" width="756" height="266" rx="5" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/>
  <text x="380" y="24" text-anchor="middle" font-size="13" fill="#b06000" font-weight="700" letter-spacing="1">MARGIN</text>
  <text x="380" y="254" text-anchor="middle" font-size="13" fill="#b06000" font-weight="700" letter-spacing="1">MARGIN</text>
  <text x="18" y="138" text-anchor="middle" font-size="13" fill="#b06000" font-weight="700" letter-spacing="1" transform="rotate(-90 18 138)">MARGIN</text>
  <text x="742" y="138" text-anchor="middle" font-size="13" fill="#b06000" font-weight="700" letter-spacing="1" transform="rotate(90 742 138)">MARGIN</text>

  <!-- Border -->
  <rect x="48" y="40" width="664" height="190" rx="4" fill="#fce8e6" stroke="#ea4335" stroke-width="2.5"/>
  <text x="380" y="57" text-anchor="middle" font-size="13" fill="#b71c1c" font-weight="700" letter-spacing="1">BORDER</text>
  <text x="380" y="224" text-anchor="middle" font-size="13" fill="#b71c1c" font-weight="700" letter-spacing="1">BORDER</text>
  <text x="62" y="138" text-anchor="middle" font-size="13" fill="#b71c1c" font-weight="700" letter-spacing="1" transform="rotate(-90 62 138)">BORDER</text>
  <text x="698" y="138" text-anchor="middle" font-size="13" fill="#b71c1c" font-weight="700" letter-spacing="1" transform="rotate(90 698 138)">BORDER</text>

  <!-- Padding -->
  <rect x="92" y="72" width="576" height="126" rx="4" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="380" y="89" text-anchor="middle" font-size="13" fill="#1565c0" font-weight="700" letter-spacing="1">PADDING</text>
  <text x="380" y="193" text-anchor="middle" font-size="13" fill="#1565c0" font-weight="700" letter-spacing="1">PADDING</text>
  <text x="107" y="138" text-anchor="middle" font-size="13" fill="#1565c0" font-weight="700" letter-spacing="1" transform="rotate(-90 107 138)">PADDING</text>
  <text x="653" y="138" text-anchor="middle" font-size="13" fill="#1565c0" font-weight="700" letter-spacing="1" transform="rotate(90 653 138)">PADDING</text>

  <!-- Content -->
  <rect x="148" y="100" width="464" height="70" rx="4" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="380" y="130" text-anchor="middle" font-size="16" fill="#1b5e20" font-weight="700">CONTENT</text>
  <text x="380" y="153" text-anchor="middle" font-size="12" fill="#1b5e20">width × height</text>

</svg>
