<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <!-- Start -->
  <rect x="270" y="10" width="180" height="36" rx="18" fill="#4285f4" stroke="none"/>
  <text x="360" y="33" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">Browser sendet Request</text>

  <!-- Decision: Cache vorhanden? -->
  <polygon points="360,70 460,115 360,160 260,115" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="360" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#b07800">Cache</text>
  <text x="360" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#b07800">vorhanden?</text>

  <!-- No cache → Request to server -->
  <line x1="260" y1="115" x2="80" y2="115" stroke="#888" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="170" y="108" text-anchor="middle" font-size="11" fill="#888">nein</text>
  <rect x="10" y="95" width="140" height="40" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="80" y="120" text-anchor="middle" font-size="12" fill="#c62828">Request an Server</text>

  <!-- Server response -->
  <line x1="80" y1="135" x2="80" y2="190" stroke="#888" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <rect x="10" y="190" width="140" height="50" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="80" y="212" text-anchor="middle" font-size="11" fill="#1b5e20">200 OK</text>
  <text x="80" y="228" text-anchor="middle" font-size="11" fill="#1b5e20">+ Daten + Cache-Header</text>

  <!-- Yes → Decision: max-age abgelaufen? -->
  <line x1="360" y1="160" x2="360" y2="195" stroke="#888" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="370" y="180" font-size="11" fill="#888">ja</text>

  <polygon points="360,195 470,245 360,295 250,245" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="360" y="239" text-anchor="middle" font-size="12" font-weight="600" fill="#b07800">max-age</text>
  <text x="360" y="255" text-anchor="middle" font-size="12" font-weight="600" fill="#b07800">abgelaufen?</text>

  <!-- Not expired → Use cache -->
  <line x1="250" y1="245" x2="80" y2="320" stroke="#34a853" stroke-width="2" marker-end="url(#arrowGr)"/>
  <text x="145" y="270" font-size="11" fill="#34a853" font-weight="600">nein</text>
  <rect x="10" y="300" width="140" height="45" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="80" y="318" text-anchor="middle" font-size="12" fill="#1b5e20" font-weight="600">Cache nutzen</text>
  <text x="80" y="335" text-anchor="middle" font-size="10" fill="#1b5e20">kein Request nötig!</text>

  <!-- Expired → Validate with ETag -->
  <line x1="470" y1="245" x2="560" y2="245" stroke="#888" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="510" y="238" font-size="11" fill="#888">ja</text>

  <rect x="560" y="220" width="150" height="50" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="635" y="240" text-anchor="middle" font-size="11" fill="#1565c0">Validierungsrequest</text>
  <text x="635" y="258" text-anchor="middle" font-size="10" font-family="monospace" fill="#666">If-None-Match: ETag</text>

  <!-- Decision: Modified? -->
  <line x1="635" y1="270" x2="635" y2="310" stroke="#888" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <polygon points="635,310 710,345 635,380 560,345" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="635" y="342" text-anchor="middle" font-size="11" font-weight="600" fill="#b07800">Geändert?</text>

  <!-- Not modified -->
  <line x1="560" y1="345" x2="440" y2="345" stroke="#34a853" stroke-width="2" marker-end="url(#arrowGr)"/>
  <text x="500" y="338" font-size="11" fill="#34a853" font-weight="600">nein</text>
  <rect x="310" y="325" width="130" height="45" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="375" y="343" text-anchor="middle" font-size="11" fill="#1b5e20" font-weight="600">304 Not Modified</text>
  <text x="375" y="360" text-anchor="middle" font-size="10" fill="#1b5e20">Cache weiter nutzen</text>

  <!-- Modified -->
  <line x1="635" y1="380" x2="635" y2="420" stroke="#ea4335" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="645" y="400" font-size="11" fill="#ea4335">ja</text>
  <rect x="560" y="420" width="150" height="30" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="635" y="440" text-anchor="middle" font-size="11" fill="#c62828">200 OK + neue Daten</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#888"/>
    </marker>
    <marker id="arrowGr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#34a853"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ea4335"/>
    </marker>
  </defs>
</svg>
