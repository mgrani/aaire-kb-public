<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="Arial, Helvetica, sans-serif">
  <defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#1f4e79"/></marker></defs>
  <rect x="30" y="18" width="160" height="38" rx="8" fill="#eaf2ff" stroke="#4a89dc" stroke-width="2"/><text x="110" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79">Browser</text>
  <rect x="570" y="18" width="160" height="38" rx="8" fill="#fdecea" stroke="#e06a5f" stroke-width="2"/><text x="650" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#9f3129">Server</text>
  <line x1="190" y1="88" x2="560" y2="88" stroke="#1f4e79" stroke-width="3" marker-end="url(#arr)"/>
  <text x="375" y="76" text-anchor="middle" font-size="13" fill="#1f4e79">1. GET /products/42</text>
  <line x1="560" y1="118" x2="190" y2="118" stroke="#9f3129" stroke-width="3" marker-end="url(#arr)"/>
  <text x="375" y="110" text-anchor="middle" font-size="13" fill="#9f3129">200 OK, ETag: "p42-v1", Cache-Control: no-cache</text>
  <line x1="190" y1="172" x2="560" y2="172" stroke="#1f4e79" stroke-width="3" marker-end="url(#arr)"/>
  <text x="375" y="160" text-anchor="middle" font-size="13" fill="#1f4e79">2. GET /products/42, If-None-Match: "p42-v1"</text>
  <line x1="560" y1="202" x2="190" y2="202" stroke="#9f3129" stroke-width="3" marker-end="url(#arr)"/>
  <text x="375" y="194" text-anchor="middle" font-size="13" fill="#9f3129">304 Not Modified</text>
  <rect x="150" y="226" width="460" height="34" rx="8" fill="#eef8ee" stroke="#6ea66e"/>
  <text x="380" y="247" text-anchor="middle" font-size="12" fill="#2f6b2f">Der Browser verwendet den bereits gespeicherten Body weiter.</text>
</svg>
