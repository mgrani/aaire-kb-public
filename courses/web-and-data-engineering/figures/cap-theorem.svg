<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <text x="210" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#333">CAP-Theorem (Brewer, 2000)</text>

  <!-- Triangle -->
  <polygon points="210,55 50,280 370,280" fill="none" stroke="#999" stroke-width="2"/>

  <!-- Colored regions -->
  <!-- CP region (left) -->
  <polygon points="210,55 50,280 210,280" fill="#e8f0fe" fill-opacity="0.4"/>
  <!-- AP region (right) -->
  <polygon points="210,55 370,280 210,280" fill="#e6f4ea" fill-opacity="0.4"/>
  <!-- CA region (bottom) -->
  <polygon points="50,280 370,280 210,200" fill="#fff3cd" fill-opacity="0.4"/>

  <!-- Vertex labels -->
  <circle cx="210" cy="50" r="30" fill="#4285f4"/>
  <text x="210" y="48" text-anchor="middle" font-size="14" font-weight="700" fill="white">C</text>
  <text x="210" y="62" text-anchor="middle" font-size="8" fill="white">Consistency</text>

  <circle cx="50" cy="285" r="30" fill="#34a853"/>
  <text x="50" y="283" text-anchor="middle" font-size="14" font-weight="700" fill="white">A</text>
  <text x="50" y="297" text-anchor="middle" font-size="8" fill="white">Availability</text>

  <circle cx="370" cy="285" r="30" fill="#f9ab00"/>
  <text x="370" y="283" text-anchor="middle" font-size="14" font-weight="700" fill="white">P</text>
  <text x="370" y="297" text-anchor="middle" font-size="8" fill="white">Partition Tol.</text>

  <!-- Edge labels -->
  <text x="115" y="155" text-anchor="middle" font-size="10" font-weight="700" fill="#4285f4" transform="rotate(-55,115,155)">CP</text>
  <text x="305" y="155" text-anchor="middle" font-size="10" font-weight="700" fill="#1b5e20" transform="rotate(55,305,155)">AP</text>
  <text x="210" y="270" text-anchor="middle" font-size="10" font-weight="700" fill="#b06000">CA</text>

  <!-- System examples -->
  <rect x="20" y="140" width="95" height="55" rx="4" fill="white" stroke="#4285f4" stroke-width="1.2"/>
  <text x="67" y="156" text-anchor="middle" font-size="8" font-weight="700" fill="#1565c0">CP-Systeme</text>
  <text x="67" y="170" text-anchor="middle" font-size="8" fill="#555">HBase</text>
  <text x="67" y="182" text-anchor="middle" font-size="8" fill="#555">MongoDB, ZooKeeper</text>

  <rect x="305" y="140" width="95" height="55" rx="4" fill="white" stroke="#34a853" stroke-width="1.2"/>
  <text x="352" y="156" text-anchor="middle" font-size="8" font-weight="700" fill="#1b5e20">AP-Systeme</text>
  <text x="352" y="170" text-anchor="middle" font-size="8" fill="#555">Cassandra</text>
  <text x="352" y="182" text-anchor="middle" font-size="8" fill="#555">CouchDB, DynamoDB</text>

  <rect x="160" y="215" width="100" height="42" rx="4" fill="white" stroke="#f9ab00" stroke-width="1.2"/>
  <text x="210" y="231" text-anchor="middle" font-size="8" font-weight="700" fill="#b06000">CA (nur lokal)</text>
  <text x="210" y="245" text-anchor="middle" font-size="8" fill="#555">Klassische RDBMS</text>

  <!-- Bottom note -->
  <text x="210" y="330" text-anchor="middle" font-size="9" fill="#b71c1c" font-weight="600">P ist in der Praxis unvermeidlich → Wahl zwischen C und A</text>
</svg>
