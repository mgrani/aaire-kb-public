<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">3-Tier-Architektur in der Cloud</title>
  <desc id="desc">Cloud-Deployment mit drei Subnetzen: Public Subnet (Load Balancer, Web Tier), Private Subnet (App Tier, Cache), Isolated Subnet (Datenbank mit Primary und Replica). Auto Scaling und Security Groups zwischen den Tiers.</desc>
  <rect width="1000" height="540" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111111">3-Tier in der Cloud</text>

  <!-- Internet / Users -->
  <g transform="translate(60, 55)">
    <rect x="0" y="0" width="120" height="40" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
    <text x="60" y="26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#333">Internet</text>
  </g>
  <!-- Arrow down -->
  <line x1="120" y1="95" x2="120" y2="130" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- VPC Container -->
  <rect x="30" y="125" width="940" height="400" rx="14" fill="none" stroke="#4285f4" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="500" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#4285f4">VPC (Virtual Private Cloud)</text>

  <!-- PUBLIC SUBNET -->
  <rect x="50" y="160" width="280" height="345" rx="12" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="190" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1a73e8">Public Subnet</text>

  <!-- Load Balancer -->
  <rect x="80" y="200" width="220" height="50" rx="8" fill="#ffffff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="190" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#333">Load Balancer (L7)</text>
  <text x="190" y="244" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666">SSL-Terminierung</text>

  <!-- Web Tier instances -->
  <rect x="75" y="270" width="105" height="65" rx="8" fill="#ffffff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="127" y="295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#333">Web 1</text>
  <text x="127" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666">Nginx / Next.js</text>

  <rect x="200" y="270" width="105" height="65" rx="8" fill="#ffffff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="252" y="295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#333">Web 2</text>
  <text x="252" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666">Nginx / Next.js</text>

  <!-- Auto Scaling badge -->
  <rect x="100" y="345" width="180" height="24" rx="12" fill="#4285f4"/>
  <text x="190" y="362" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#fff">Auto Scaling Group</text>

  <!-- Security Group label -->
  <rect x="90" y="388" width="200" height="22" rx="6" fill="none" stroke="#ea4335" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="190" y="404" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ea4335">Security Group: Port 80/443</text>

  <!-- PRIVATE SUBNET -->
  <rect x="370" y="160" width="280" height="345" rx="12" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="510" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1e8e3e">Private Subnet</text>

  <!-- App Tier instances -->
  <rect x="395" y="200" width="105" height="65" rx="8" fill="#ffffff" stroke="#34a853" stroke-width="1.5"/>
  <text x="447" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#333">App 1</text>
  <text x="447" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666">Spring Boot</text>

  <rect x="520" y="200" width="105" height="65" rx="8" fill="#ffffff" stroke="#34a853" stroke-width="1.5"/>
  <text x="572" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#333">App 2</text>
  <text x="572" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666">Spring Boot</text>

  <!-- Auto Scaling badge -->
  <rect x="420" y="278" width="180" height="24" rx="12" fill="#34a853"/>
  <text x="510" y="295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#fff">Auto Scaling Group</text>

  <!-- Cache -->
  <rect x="400" y="320" width="220" height="50" rx="8" fill="#ffffff" stroke="#34a853" stroke-width="1.5"/>
  <text x="510" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#333">Cache (Redis)</text>
  <text x="510" y="360" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666">In-Memory, Sessions</text>

  <!-- Security Group label -->
  <rect x="410" y="388" width="200" height="22" rx="6" fill="none" stroke="#ea4335" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="510" y="404" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ea4335">Security Group: Port 8080</text>

  <!-- Message Queue -->
  <rect x="400" y="420" width="220" height="45" rx="8" fill="#ffffff" stroke="#34a853" stroke-width="1.5"/>
  <text x="510" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#333">Message Queue (SQS)</text>
  <text x="510" y="458" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666">Async Tasks → Worker</text>

  <!-- ISOLATED SUBNET -->
  <rect x="690" y="160" width="260" height="345" rx="12" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="820" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#e37400">Isolated Subnet</text>

  <!-- DB Primary -->
  <rect x="715" y="210" width="210" height="70" rx="8" fill="#ffffff" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="820" y="237" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#333">DB Primary</text>
  <text x="820" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">PostgreSQL (RDS)</text>
  <text x="820" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#999">Read + Write</text>

  <!-- DB Replica -->
  <rect x="715" y="300" width="210" height="70" rx="8" fill="#ffffff" stroke="#f9ab00" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="820" y="327" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#333">DB Replica</text>
  <text x="820" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">PostgreSQL (Read Replica)</text>
  <text x="820" y="360" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#999">Read-only</text>

  <!-- Replication arrow -->
  <line x1="820" y1="280" x2="820" y2="300" stroke="#f9ab00" stroke-width="1.5" marker-end="url(#arrowhead-yellow)"/>
  <defs>
    <marker id="arrowhead-yellow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f9ab00"/>
    </marker>
  </defs>
  <text x="850" y="294" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#e37400">Replication</text>

  <!-- Security Group label -->
  <rect x="730" y="388" width="180" height="22" rx="6" fill="none" stroke="#ea4335" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="820" y="404" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ea4335">Security Group: Port 5432</text>

  <!-- No Internet badge -->
  <rect x="745" y="430" width="150" height="22" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1"/>
  <text x="820" y="446" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#ea4335">Kein Internetzugang</text>

  <!-- Arrows between subnets -->
  <line x1="330" y1="290" x2="370" y2="290" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="650" y1="245" x2="715" y2="245" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>