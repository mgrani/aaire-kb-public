<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#1f4e79"/>
    </marker>
    <marker id="arr-red" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#9f3129"/>
    </marker>
  </defs>

  <!-- Client header -->
  <rect x="30" y="20" width="150" height="38" rx="8" fill="#eaf2ff" stroke="#4a89dc" stroke-width="2"/>
  <text x="105" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79">Client</text>

  <!-- Server header -->
  <rect x="580" y="20" width="150" height="38" rx="8" fill="#fdecea" stroke="#e06a5f" stroke-width="2"/>
  <text x="655" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#9f3129">Server</text>

  <!-- Lifelines (dashed vertical, UML convention) -->
  <line x1="105" y1="58" x2="105" y2="245" stroke="#9bb6d1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="655" y1="58" x2="655" y2="245" stroke="#e6a39b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Server activation bar (UML convention: object is "active" while processing) -->
  <rect x="651" y="115" width="8" height="70" fill="#fdecea" stroke="#9f3129" stroke-width="1"/>

  <!-- Request: label above the arrow -->
  <text x="378" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">GET /products/42</text>
  <text x="378" y="108" text-anchor="middle" font-size="11" fill="#425466" font-family="Menlo, Consolas, monospace">Accept: text/html, application/json;q=0.9</text>
  <line x1="105" y1="115" x2="651" y2="115" stroke="#1f4e79" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Response: label above the arrow -->
  <text x="378" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#9f3129">200 OK</text>
  <text x="378" y="176" text-anchor="middle" font-size="11" fill="#6d4c48" font-family="Menlo, Consolas, monospace">Content-Type: text/html</text>
  <line x1="651" y1="185" x2="109" y2="185" stroke="#9f3129" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Bottom note -->
  <rect x="52" y="220" width="656" height="32" rx="6" fill="#fff7e0" stroke="#d6ae47"/>
  <text x="380" y="240" text-anchor="middle" font-size="12" fill="#7a5b00">Der Client nennt Präferenzen, der Server wählt eine gemeinsame Repräsentation.</text>
</svg>
