<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#1f4e79"/>
    </marker>
  </defs>
  <rect x="30" y="20" width="150" height="38" rx="8" fill="#eaf2ff" stroke="#4a89dc" stroke-width="2"/>
  <text x="105" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79">Client</text>
  <rect x="580" y="20" width="150" height="38" rx="8" fill="#fdecea" stroke="#e06a5f" stroke-width="2"/>
  <text x="655" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#9f3129">Server</text>
  <line x1="180" y1="92" x2="565" y2="92" stroke="#1f4e79" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="188" y="66" width="335" height="52" rx="8" fill="#f6f9fc" stroke="#9bb6d1"/>
  <text x="356" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">GET /products/42</text>
  <text x="356" y="104" text-anchor="middle" font-size="12" fill="#425466">Accept: text/html, application/json;q=0.9</text>
  <line x1="565" y1="168" x2="180" y2="168" stroke="#9f3129" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="236" y="142" width="290" height="52" rx="8" fill="#fff6f5" stroke="#e6a39b"/>
  <text x="381" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#9f3129">200 OK</text>
  <text x="381" y="180" text-anchor="middle" font-size="12" fill="#6d4c48">Content-Type: text/html</text>
  <rect x="52" y="208" width="656" height="26" rx="6" fill="#fff7e0" stroke="#d6ae47"/>
  <text x="380" y="226" text-anchor="middle" font-size="12" fill="#7a5b00">Der Client nennt Präferenzen, der Server wählt eine gemeinsame Repräsentation.</text>
</svg>
