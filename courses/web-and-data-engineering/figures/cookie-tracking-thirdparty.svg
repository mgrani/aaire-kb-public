<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 500" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#1565c0"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#1b5e20"/></marker>
    <marker id="aw" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#b06000"/></marker>
  </defs>

  <!-- Phase divider -->
  <line x1="5" y1="245" x2="375" y2="245" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- ===================== PHASE 1 ===================== -->
  <text x="190" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#333">① Erstkontakt — Besuch auf news.example</text>

  <!-- Actors -->
  <rect x="10" y="26" width="90" height="26" rx="5" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="55" y="43" text-anchor="middle" font-size="10" font-weight="700" fill="#1565c0">Browser</text>
  <rect x="135" y="26" width="110" height="26" rx="5" fill="#fff3cd" stroke="#f9ab00" stroke-width="2"/>
  <text x="190" y="43" text-anchor="middle" font-size="10" font-weight="700" fill="#b06000">news.example</text>
  <rect x="280" y="26" width="90" height="26" rx="5" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="325" y="43" text-anchor="middle" font-size="10" font-weight="700" fill="#b71c1c">tracker.ad.net</text>

  <!-- Lifelines -->
  <line x1="55" y1="52" x2="55" y2="235" stroke="#9bb6d1" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="190" y1="52" x2="190" y2="235" stroke="#e6c07b" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="325" y1="52" x2="325" y2="235" stroke="#e6a39b" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- 1. GET news.example -->
  <text x="122" y="66" text-anchor="middle" font-size="9" fill="#1565c0" font-weight="700">GET /article</text>
  <line x1="55" y1="74" x2="186" y2="74" stroke="#1565c0" stroke-width="1.8" marker-end="url(#ab)"/>

  <!-- 2. HTML response with embedded pixel -->
  <text x="122" y="92" text-anchor="middle" font-size="9" fill="#b06000" font-weight="700">200 OK · HTML</text>
  <line x1="186" y1="100" x2="59" y2="100" stroke="#b06000" stroke-width="1.8" marker-end="url(#aw)"/>
  <rect x="12" y="108" width="246" height="20" rx="3" fill="#fffaf0" stroke="#e6c07b" stroke-width="1"/>
  <text x="18" y="121" font-size="8" font-family="Menlo, Consolas, monospace" fill="#555">&lt;img src="https://tracker.ad.net/pixel"&gt;</text>

  <!-- 3. GET tracker pixel (no cookie yet) -->
  <text x="190" y="146" text-anchor="middle" font-size="9" fill="#1565c0" font-weight="700">GET /pixel  (kein Cookie)</text>
  <line x1="55" y1="154" x2="321" y2="154" stroke="#1565c0" stroke-width="1.8" marker-end="url(#ab)"/>

  <!-- 4. Set-Cookie response -->
  <text x="190" y="172" text-anchor="middle" font-size="9" fill="#1b5e20" font-weight="700">200 OK · 1×1-Pixel</text>
  <line x1="321" y1="180" x2="59" y2="180" stroke="#1b5e20" stroke-width="1.8" marker-end="url(#ag)"/>
  <rect x="12" y="188" width="356" height="22" rx="3" fill="#f6fbf6" stroke="#a5d6a7" stroke-width="1"/>
  <text x="18" y="202" font-size="9" font-family="Menlo, Consolas, monospace" fill="#1b5e20">Set-Cookie: tid=u42; Domain=tracker.ad.net; SameSite=None; Secure</text>

  <!-- Cookie stored badge -->
  <rect x="60" y="216" width="260" height="20" rx="4" fill="#e6f4ea" stroke="#34a853"/>
  <text x="190" y="230" text-anchor="middle" font-size="9" fill="#1b5e20" font-weight="700">💾 Browser speichert Cookie für Domain tracker.ad.net</text>

  <!-- ===================== PHASE 2 ===================== -->
  <text x="190" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#333">② Späterer Besuch auf shop.example</text>

  <!-- Actors -->
  <rect x="10" y="272" width="90" height="26" rx="5" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="55" y="289" text-anchor="middle" font-size="10" font-weight="700" fill="#1565c0">Browser</text>
  <rect x="135" y="272" width="110" height="26" rx="5" fill="#fff3cd" stroke="#f9ab00" stroke-width="2"/>
  <text x="190" y="289" text-anchor="middle" font-size="10" font-weight="700" fill="#b06000">shop.example</text>
  <rect x="280" y="272" width="90" height="26" rx="5" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="325" y="289" text-anchor="middle" font-size="10" font-weight="700" fill="#b71c1c">tracker.ad.net</text>

  <!-- Lifelines -->
  <line x1="55" y1="298" x2="55" y2="490" stroke="#9bb6d1" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="190" y1="298" x2="190" y2="490" stroke="#e6c07b" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="325" y1="298" x2="325" y2="490" stroke="#e6a39b" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- 1. GET shop.example -->
  <text x="122" y="312" text-anchor="middle" font-size="9" fill="#1565c0" font-weight="700">GET /products</text>
  <line x1="55" y1="320" x2="186" y2="320" stroke="#1565c0" stroke-width="1.8" marker-end="url(#ab)"/>

  <!-- 2. HTML response with same pixel -->
  <text x="122" y="338" text-anchor="middle" font-size="9" fill="#b06000" font-weight="700">200 OK · HTML</text>
  <line x1="186" y1="346" x2="59" y2="346" stroke="#b06000" stroke-width="1.8" marker-end="url(#aw)"/>
  <rect x="12" y="354" width="246" height="20" rx="3" fill="#fffaf0" stroke="#e6c07b" stroke-width="1"/>
  <text x="18" y="367" font-size="8" font-family="Menlo, Consolas, monospace" fill="#555">&lt;img src="https://tracker.ad.net/pixel"&gt;  (selbe Domain!)</text>

  <!-- 3. GET tracker pixel WITH cookie -->
  <text x="190" y="392" text-anchor="middle" font-size="9" fill="#1565c0" font-weight="700">GET /pixel</text>
  <line x1="55" y1="400" x2="321" y2="400" stroke="#1565c0" stroke-width="1.8" marker-end="url(#ab)"/>
  <rect x="12" y="408" width="356" height="22" rx="3" fill="#f0f6ff" stroke="#9bb6d1" stroke-width="1"/>
  <text x="18" y="422" font-size="9" font-family="Menlo, Consolas, monospace" fill="#1565c0">Cookie: tid=u42  ← Browser sendet automatisch (gleiche Domain)</text>

  <!-- 4. Tracker recognizes -->
  <text x="190" y="448" text-anchor="middle" font-size="9" fill="#1b5e20" font-weight="700">200 OK · 1×1-Pixel</text>
  <line x1="321" y1="456" x2="59" y2="456" stroke="#1b5e20" stroke-width="1.8" marker-end="url(#ag)"/>

  <!-- Recognition badge -->
  <rect x="20" y="468" width="340" height="22" rx="4" fill="#fce8e6" stroke="#ea4335"/>
  <text x="190" y="483" text-anchor="middle" font-size="9" fill="#b71c1c" font-weight="700">🎯 Tracker erkennt: tid=u42 war auf news.example UND shop.example</text>
</svg>
