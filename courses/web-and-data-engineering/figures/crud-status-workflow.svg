<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="Arial, Helvetica, sans-serif">
  <rect x="30" y="24" width="700" height="42" rx="8" fill="#eef5ff" stroke="#7da7d9"/><text x="380" y="50" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e79">Typische Zustandsänderungen und passende Responses</text>
  <rect x="40" y="90" width="160" height="52" rx="8" fill="#eaf2ff" stroke="#4a89dc"/><text x="120" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">POST /products</text><text x="120" y="130" text-anchor="middle" font-size="12" fill="#425466">201 Created + Location</text>
  <rect x="220" y="90" width="160" height="52" rx="8" fill="#eaf2ff" stroke="#4a89dc"/><text x="300" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">PUT /products/42</text><text x="300" y="130" text-anchor="middle" font-size="12" fill="#425466">200 OK oder 204</text>
  <rect x="400" y="90" width="160" height="52" rx="8" fill="#eaf2ff" stroke="#4a89dc"/><text x="480" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">PATCH /products/42</text><text x="480" y="130" text-anchor="middle" font-size="12" fill="#425466">200 OK oder 204</text>
  <rect x="580" y="90" width="140" height="52" rx="8" fill="#eaf2ff" stroke="#4a89dc"/><text x="650" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">DELETE /products/42</text><text x="650" y="130" text-anchor="middle" font-size="12" fill="#425466">204 No Content</text>
  <rect x="40" y="176" width="680" height="64" rx="8" fill="#fff7e0" stroke="#d6ae47"/><text x="380" y="201" text-anchor="middle" font-size="13" fill="#7a5b00">POST erzeugt typischerweise eine neue Ressource, PUT/PATCH ändern eine vorhandene, DELETE entfernt sie.</text><text x="380" y="223" text-anchor="middle" font-size="13" fill="#7a5b00">Der Statuscode soll den fachlichen Effekt ausdrücken, nicht nur „irgendwie Erfolg“.</text>
</svg>
