<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Data Lake vs. Data Warehouse vs. Data Lakehouse</title>
  <desc id="desc">Vergleich dreier Datenspeicher-Paradigmen: Data Lake (Schema-on-Read, Rohdaten), Data Warehouse (Schema-on-Write, strukturiert), Data Lakehouse (Kombination beider Ansätze).</desc>
  <rect width="1100" height="520" fill="#ffffff"/>

  <text x="550" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111111">Data Lake vs. Data Warehouse vs. Data Lakehouse</text>

  <!-- DATA LAKE -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="320" height="420" rx="16" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
    <text x="160" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1a73e8">Data Lake</text>

    <!-- Icon: water waves -->
    <path d="M80,70 Q110,55 140,70 Q170,85 200,70 Q230,55 260,70" fill="none" stroke="#4285f4" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M80,85 Q110,70 140,85 Q170,100 200,85 Q230,70 260,85" fill="none" stroke="#4285f4" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- Data types -->
    <text x="160" y="125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#333333">Datenformate</text>
    <g transform="translate(30, 140)">
      <rect x="0" y="0" width="80" height="28" rx="6" fill="#ffffff" stroke="#aecbfa" stroke-width="1.5"/>
      <text x="40" y="19" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">JSON</text>
      <rect x="90" y="0" width="80" height="28" rx="6" fill="#ffffff" stroke="#aecbfa" stroke-width="1.5"/>
      <text x="130" y="19" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">CSV</text>
      <rect x="180" y="0" width="80" height="28" rx="6" fill="#ffffff" stroke="#aecbfa" stroke-width="1.5"/>
      <text x="220" y="19" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">Parquet</text>
      <rect x="0" y="36" width="80" height="28" rx="6" fill="#ffffff" stroke="#aecbfa" stroke-width="1.5"/>
      <text x="40" y="55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">Bilder</text>
      <rect x="90" y="36" width="80" height="28" rx="6" fill="#ffffff" stroke="#aecbfa" stroke-width="1.5"/>
      <text x="130" y="55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">Logs</text>
      <rect x="180" y="36" width="80" height="28" rx="6" fill="#ffffff" stroke="#aecbfa" stroke-width="1.5"/>
      <text x="220" y="55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">Audio</text>
    </g>

    <!-- Properties -->
    <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333333">
      <text x="20" y="260" font-weight="700">Schema-on-Read</text>
      <text x="20" y="280" font-size="12" fill="#555">Schema wird erst beim Lesen angewendet</text>
      <text x="20" y="310" font-weight="700">Rohdaten</text>
      <text x="20" y="330" font-size="12" fill="#555">Alle Daten, unbereinigt gespeichert</text>
      <text x="20" y="360" font-weight="700">Einsatz</text>
      <text x="20" y="380" font-size="12" fill="#555">Explorative Analysen, ML-Pipelines</text>
    </g>

    <!-- Tech -->
    <g transform="translate(20, 395)">
      <rect x="0" y="0" width="55" height="22" rx="4" fill="#4285f4"/>
      <text x="27" y="15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#fff">S3</text>
      <rect x="62" y="0" width="55" height="22" rx="4" fill="#4285f4"/>
      <text x="89" y="15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#fff">HDFS</text>
      <rect x="124" y="0" width="75" height="22" rx="4" fill="#4285f4"/>
      <text x="161" y="15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#fff">Delta Lake</text>
    </g>
  </g>

  <!-- DATA WAREHOUSE -->
  <g transform="translate(390, 60)">
    <rect x="0" y="0" width="320" height="420" rx="16" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
    <text x="160" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1e8e3e">Data Warehouse</text>

    <!-- Icon: structured table -->
    <g transform="translate(80, 55)">
      <rect x="0" y="0" width="160" height="40" rx="4" fill="#ffffff" stroke="#34a853" stroke-width="1.5"/>
      <line x1="53" y1="0" x2="53" y2="40" stroke="#34a853" stroke-width="1"/>
      <line x1="106" y1="0" x2="106" y2="40" stroke="#34a853" stroke-width="1"/>
      <line x1="0" y1="20" x2="160" y2="20" stroke="#34a853" stroke-width="1"/>
      <text x="26" y="15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#333">id</text>
      <text x="79" y="15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#333">name</text>
      <text x="133" y="15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#333">amount</text>
      <text x="26" y="35" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#555">1</text>
      <text x="79" y="35" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#555">Order A</text>
      <text x="133" y="35" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#555">€ 49,90</text>
    </g>

    <!-- Data format -->
    <text x="160" y="125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#333333">Datenformate</text>
    <g transform="translate(30, 140)">
      <rect x="0" y="0" width="120" height="28" rx="6" fill="#ffffff" stroke="#a8dab5" stroke-width="1.5"/>
      <text x="60" y="19" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">Strukturiert (SQL)</text>
      <rect x="130" y="0" width="130" height="28" rx="6" fill="#ffffff" stroke="#a8dab5" stroke-width="1.5"/>
      <text x="195" y="19" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">Star/Snowflake</text>
      <rect x="0" y="36" width="260" height="28" rx="6" fill="#ffffff" stroke="#a8dab5" stroke-width="1.5"/>
      <text x="130" y="55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">Festes Schema, aufbereitet</text>
    </g>

    <!-- Properties -->
    <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333333">
      <text x="20" y="260" font-weight="700">Schema-on-Write</text>
      <text x="20" y="280" font-size="12" fill="#555">Schema wird beim Schreiben erzwungen</text>
      <text x="20" y="310" font-weight="700">Aufbereitete Daten</text>
      <text x="20" y="330" font-size="12" fill="#555">Bereinigt, transformiert, konsistent</text>
      <text x="20" y="360" font-weight="700">Einsatz</text>
      <text x="20" y="380" font-size="12" fill="#555">BI-Reporting, analytische Abfragen</text>
    </g>

    <!-- Tech -->
    <g transform="translate(20, 395)">
      <rect x="0" y="0" width="72" height="22" rx="4" fill="#34a853"/>
      <text x="36" y="15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#fff">BigQuery</text>
      <rect x="79" y="0" width="72" height="22" rx="4" fill="#34a853"/>
      <text x="115" y="15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#fff">Redshift</text>
      <rect x="158" y="0" width="82" height="22" rx="4" fill="#34a853"/>
      <text x="199" y="15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#fff">Snowflake</text>
    </g>
  </g>

  <!-- DATA LAKEHOUSE -->
  <g transform="translate(750, 60)">
    <rect x="0" y="0" width="320" height="420" rx="16" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
    <text x="160" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e37400">Data Lakehouse</text>

    <!-- Icon: combined -->
    <g transform="translate(80, 55)">
      <path d="M0,30 Q40,10 80,30 Q120,50 160,30" fill="none" stroke="#f9ab00" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="30" y="5" width="100" height="24" rx="4" fill="#ffffff" stroke="#f9ab00" stroke-width="1.5"/>
      <line x1="63" y1="5" x2="63" y2="29" stroke="#f9ab00" stroke-width="1"/>
      <line x1="96" y1="5" x2="96" y2="29" stroke="#f9ab00" stroke-width="1"/>
      <line x1="30" y1="17" x2="130" y2="17" stroke="#f9ab00" stroke-width="1"/>
    </g>

    <text x="160" y="125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#333333">Kombination</text>
    <g transform="translate(20, 140)">
      <rect x="0" y="0" width="280" height="28" rx="6" fill="#ffffff" stroke="#f5d58a" stroke-width="1.5"/>
      <text x="140" y="19" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">Offene Formate + Warehouse-Funktionen</text>
      <rect x="0" y="36" width="280" height="28" rx="6" fill="#ffffff" stroke="#f5d58a" stroke-width="1.5"/>
      <text x="140" y="55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">ACID-Transaktionen auf Data-Lake-Storage</text>
    </g>

    <!-- Properties -->
    <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333333">
      <text x="20" y="260" font-weight="700">Schema-on-Read + Write</text>
      <text x="20" y="280" font-size="12" fill="#555">Flexibel, aber mit Governance</text>
      <text x="20" y="310" font-weight="700">Roh- und aufbereitete Daten</text>
      <text x="20" y="330" font-size="12" fill="#555">Medallion-Architektur (Bronze/Silver/Gold)</text>
      <text x="20" y="360" font-weight="700">Einsatz</text>
      <text x="20" y="380" font-size="12" fill="#555">ML + BI in einer Plattform</text>
    </g>

    <!-- Tech -->
    <g transform="translate(20, 395)">
      <rect x="0" y="0" width="80" height="22" rx="4" fill="#f9ab00"/>
      <text x="40" y="15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#fff">Delta Lake</text>
      <rect x="87" y="0" width="80" height="22" rx="4" fill="#f9ab00"/>
      <text x="127" y="15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#fff">Iceberg</text>
      <rect x="174" y="0" width="80" height="22" rx="4" fill="#f9ab00"/>
      <text x="214" y="15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#fff">Hudi</text>
    </g>
  </g>

  <!-- Arrows between -->
  <text x="375" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#999999">→</text>
  <text x="735" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#999999">→</text>
  <text x="375" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#999999">Evolution</text>
  <text x="735" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#999999">Konvergenz</text>

  <text x="550" y="505" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#888888">Trend: Data Lakehouse vereint Flexibilität des Data Lake mit der Struktur des Data Warehouse</text>
</svg>