<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" font-family="'Source Sans Pro', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-head" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="160" y="25" text-anchor="middle" font-size="16" font-weight="700" fill="#202124">Batch-Verarbeitung</text>

  <!-- ══ Sources ══ -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="200" height="60" rx="6" fill="#f5f5f5" stroke="#dadce0" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="100" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#3c4043">Datenquellen</text>
    <text x="100" y="45" text-anchor="middle" font-size="10" fill="#70757a">Web-Logs · DB-Export · APIs</text>
  </g>

  <line x1="160" y1="110" x2="160" y2="132" stroke="#dadce0" stroke-width="2" marker-end="url(#arrow-head)"/>

  <!-- ══ Ingestion ══ -->
  <g transform="translate(85, 135)">
    <rect x="0" y="0" width="150" height="50" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="75" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#174ea6">Ingestion</text>
    <text x="75" y="38" text-anchor="middle" font-size="10" fill="#1b5fa8">(Airflow / Zeitgesteuert)</text>
  </g>

  <line x1="160" y1="185" x2="160" y2="207" stroke="#dadce0" stroke-width="2" marker-end="url(#arrow-head)"/>

  <!-- ══ Data Lake (Storage) ══ -->
  <g transform="translate(60, 210)">
    <rect x="0" y="0" width="200" height="60" rx="6" fill="#fffef0" stroke="#f9ab00" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="100" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#b06000">Data Lake</text>
    <text x="100" y="45" text-anchor="middle" font-size="10" fill="#7d4f00">Persistent Storage (Rohdaten)</text>
  </g>

  <line x1="160" y1="270" x2="160" y2="292" stroke="#dadce0" stroke-width="2" marker-end="url(#arrow-head)"/>

  <!-- ══ Transformation ══ -->
  <g transform="translate(40, 295)">
    <rect x="0" y="0" width="240" height="60" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="120" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#174ea6">Transformation (Batch Job)</text>
    <text x="120" y="45" text-anchor="middle" font-size="10" fill="#1b5fa8">Spark / dbt (Bereinigen · Aggregieren)</text>
  </g>

  <line x1="160" y1="355" x2="160" y2="377" stroke="#dadce0" stroke-width="2" marker-end="url(#arrow-head)"/>

  <!-- ══ Data Warehouse ══ -->
  <g transform="translate(60, 380)">
    <rect x="0" y="0" width="200" height="60" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="100" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#c5221f">Data Warehouse</text>
    <text x="100" y="45" text-anchor="middle" font-size="10" fill="#8d1c1c">Strukturierte analytische Daten</text>
  </g>

  <line x1="160" y1="440" x2="160" y2="462" stroke="#dadce0" stroke-width="2" marker-end="url(#arrow-head)"/>

  <!-- ══ UI / Dashboard ══ -->
  <g transform="translate(85, 465)">
    <rect x="0" y="0" width="150" height="45" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="75" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#137333">BI-Dashboard</text>
    <text x="75" y="35" text-anchor="middle" font-size="9" fill="#188038">Analytische Abfragen</text>
  </g>

</svg>
