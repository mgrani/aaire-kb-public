<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="'Source Sans Pro', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-head" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#5f6368"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title / Label -->
  <text x="440" y="25" text-anchor="middle" font-size="16" font-weight="700" fill="#202124">Kappa-Architektur</text>

  <!-- ══ Input Section ══ -->
  <rect x="20" y="80" width="100" height="60" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#4a148c">Neue Daten</text>
  <text x="70" y="125" text-anchor="middle" font-size="11" fill="#7b1fa2">(Events)</text>

  <line x1="120" y1="110" x2="160" y2="110" stroke="#dadce0" stroke-width="2" marker-end="url(#arrow-head)"/>

  <!-- ══ Unified Event Log (Centerpiece) ══ -->
  <g transform="translate(170, 60)">
    <rect x="0" y="0" width="220" height="200" rx="10" fill="#fffef0" stroke="#f9ab00" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="110" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#b06000">Unified Event Log</text>
    <text x="110" y="50" text-anchor="middle" font-size="11" fill="#b06000">(Persistent &amp; Immutable)</text>

    <!-- Stack of events -->
    <rect x="30" y="70" width="160" height="20" rx="3" fill="#ffffff" stroke="#f9ab00" stroke-width="1"/>
    <rect x="30" y="95" width="160" height="20" rx="3" fill="#ffffff" stroke="#f9ab00" stroke-width="1"/>
    <rect x="30" y="120" width="160" height="20" rx="3" fill="#ffffff" stroke="#f9ab00" stroke-width="1"/>
    <text x="110" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#222">Kafka / Distributed Log</text>
    <text x="110" y="180" text-anchor="middle" font-size="10" fill="#666">Speichert alle historischen Events</text>
  </g>

  <line x1="390" y1="160" x2="440" y2="160" stroke="#1a73e8" stroke-width="2.5" marker-end="url(#arrow-head)"/>

  <!-- ══ Stream Processing Layer ══ -->
  <g transform="translate(450, 110)">
    <rect x="0" y="0" width="240" height="100" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="120" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#174ea6">Stream Processor</text>
    <text x="120" y="55" text-anchor="middle" font-size="11" font-weight="600" fill="#222">Einzige Verarbeitungslogik</text>
    <text x="120" y="75" text-anchor="middle" font-size="10" fill="#444">Flink / Kafka Streams / Spark Streaming</text>
  </g>

  <line x1="690" y1="160" x2="740" y2="160" stroke="#34a853" stroke-width="2.5" marker-end="url(#arrow-head)"/>

  <!-- ══ Serving Section ══ -->
  <g transform="translate(750, 110)">
    <rect x="0" y="0" width="110" height="100" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="55" y="45" text-anchor="middle" font-size="14" font-weight="700" fill="#137333">Serving</text>
    <text x="55" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="#222">API</text>
  </g>

  <!-- Replay Loop -->
  <path d="M 570,210 C 570,280 280,280 280,260" fill="none" stroke="#d93025" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-head)"/>
  <text x="425" y="295" text-anchor="middle" font-size="12" font-weight="700" fill="#d93025">Replay</text>
  <text x="425" y="310" text-anchor="middle" font-size="10" fill="#d93025">(Neuberechnung bei Logik-Änderung)</text>

  <!-- Benefit tag -->
  <text x="600" y="70" text-anchor="middle" font-size="11" fill="#188038" font-weight="700">✓ Eine einzige Code-Basis</text>

</svg>
