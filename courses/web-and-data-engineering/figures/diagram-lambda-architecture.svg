<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="'Source Sans Pro', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-head" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#5f6368"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title / Label -->
  <text x="440" y="25" text-anchor="middle" font-size="16" font-weight="700" fill="#202124">Lambda-Architektur</text>

  <!-- ══ Input Section ══ -->
  <rect x="20" y="140" width="100" height="60" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#4a148c">Neue Daten</text>
  <text x="70" y="185" text-anchor="middle" font-size="11" fill="#7b1fa2">(Events)</text>

  <!-- Fork arrows -->
  <path d="M 120,170 L 160,170 L 220,90" fill="none" stroke="#dadce0" stroke-width="2" marker-end="url(#arrow-head)"/>
  <path d="M 120,170 L 160,170 L 220,250" fill="none" stroke="#dadce0" stroke-width="2" marker-end="url(#arrow-head)"/>

  <!-- ══ Batch Layer (Top) ══ -->
  <g transform="translate(230, 40)">
    <rect x="0" y="0" width="420" height="100" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="210" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#174ea6">Batch Layer</text>
    
    <!-- Sub-components -->
    <rect x="20" y="45" width="160" height="40" rx="5" fill="#fff" stroke="#1a73e8" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="100" y="70" text-anchor="middle" font-size="11" font-weight="600" fill="#1a73e8">Master Dataset (Raw Data)</text>
    
    <line x1="180" y1="65" x2="230" y2="65" stroke="#1a73e8" stroke-width="1.5" marker-end="url(#arrow-head)"/>
    
    <rect x="240" y="45" width="160" height="40" rx="5" fill="#fff" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="320" y="70" text-anchor="middle" font-size="11" font-weight="600" fill="#1a73e8">Batch Views (pre-computed)</text>
  </g>

  <!-- ══ Speed Layer (Bottom) ══ -->
  <g transform="translate(230, 200)">
    <rect x="0" y="0" width="420" height="100" rx="10" fill="#fffef0" stroke="#f9ab00" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="210" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#b06000">Speed Layer</text>
    
    <rect x="40" y="45" width="340" height="40" rx="5" fill="#fff" stroke="#f9ab00" stroke-width="1.5"/>
    <text x="210" y="70" text-anchor="middle" font-size="11" font-weight="600" fill="#b06000">Echtzeit-Verarbeitung (In-Memory Incremental)</text>
  </g>

  <!-- ══ Serving Layer (Right) ══ -->
  <g transform="translate(680, 120)">
    <rect x="0" y="0" width="160" height="100" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="80" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#137333">Serving Layer</text>
    <text x="80" y="70" text-anchor="middle" font-size="12" font-weight="600" fill="#222">Merge Query</text>
    <text x="80" y="85" text-anchor="middle" font-size="10" fill="#555">(Batch + Real-time)</text>
  </g>

  <!-- Final Join arrows -->
  <path d="M 650,90 L 690,135" fill="none" stroke="#dadce0" stroke-width="2" marker-end="url(#arrow-head)"/>
  <path d="M 650,250 L 690,205" fill="none" stroke="#dadce0" stroke-width="2" marker-end="url(#arrow-head)"/>

  <!-- Legend / Challenges -->
  <text x="230" y="160" font-size="10" fill="#d93025" font-weight="700">⚠ Doppelte Codebasis nötig (Batch + Stream)</text>
  <text x="440" y="330" text-anchor="middle" font-size="11" fill="#5f6368">Kombiniert historische Korrektheit mit minimaler Latenz</text>

</svg>
