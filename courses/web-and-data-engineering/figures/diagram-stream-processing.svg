<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" font-family="'Source Sans Pro', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-head" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#5f6368"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="160" y="25" text-anchor="middle" font-size="16" font-weight="700" fill="#202124">Stream-Verarbeitung</text>

  <!-- ══ Producers / Sources ══ -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="200" height="60" rx="6" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="100" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#4a148c">Producers</text>
    <text x="100" y="45" text-anchor="middle" font-size="10" fill="#6a329f">Web-App · Mobile App · IoT</text>
  </g>

  <line x1="160" y1="110" x2="160" y2="132" stroke="#dadce0" stroke-width="2" marker-end="url(#arrow-head)"/>

  <!-- Event stream dots -->
  <circle cx="160" cy="118" r="3" fill="#9c27b0" />
  <circle cx="160" cy="126" r="3" fill="#9c27b0" />

  <!-- ══ Message Broker ══ -->
  <g transform="translate(60, 135)">
    <rect x="0" y="0" width="200" height="80" rx="6" fill="#fffef0" stroke="#f9ab00" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#b06000">Message Broker</text>
    <text x="100" y="48" text-anchor="middle" font-size="11" font-weight="600" fill="#5f6368">Apache Kafka / Pulsar</text>
    
    <!-- Horizontal bars for log-like structure -->
    <rect x="20" y="58" width="160" height="12" fill="#fff" stroke="#f9ab00" stroke-width="0.5"/>
    <rect x="50" y="61" width="100" height="6" fill="#f9ab00" rx="1"/>
  </g>

  <line x1="160" y1="215" x2="160" y2="237" stroke="#dadce0" stroke-width="2" marker-end="url(#arrow-head)"/>

  <!-- ══ Stream Processor ══ -->
  <g transform="translate(40, 240)">
    <rect x="0" y="0" width="240" height="80" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="120" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#174ea6">Stream Processor</text>
    <text x="120" y="52" text-anchor="middle" font-size="11" font-weight="600" fill="#202124">Apache Flink / Kafka Streams</text>
    <text x="120" y="70" text-anchor="middle" font-size="10" fill="#5f6368">Filter · Aggregation · Enrichment</text>
  </g>

  <line x1="160" y1="320" x2="160" y2="342" stroke="#dadce0" stroke-width="2" marker-end="url(#arrow-head)"/>

  <!-- ══ Sinks / Output ══ -->
  <g transform="translate(60, 345)">
    <rect x="0" y="0" width="200" height="100" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="100" y="25" text-anchor="middle" font-size="12" font-weight="700" fill="#137333">Sinks / Consumers</text>
    
    <rect x="20" y="40" width="160" height="50" rx="4" fill="#fff" stroke="#34a853" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="40" y="58" font-size="10" fill="#222">· Dashboard (Live)</text>
    <text x="40" y="72" font-size="10" fill="#222">· Alerting System</text>
    <text x="40" y="86" font-size="10" fill="#222">· Search Engine / DB</text>
  </g>

  <!-- Latenz Tag -->
  <rect x="210" y="460" width="90" height="25" rx="5" fill="#fce8e6" stroke="#ea4335" stroke-width="1"/>
  <text x="255" y="477" text-anchor="middle" font-size="10" font-weight="700" fill="#c5221f">Latenz: &lt; 1s</text>

  <path d="M 160,445 L 160,500" fill="none" stroke="#dadce0" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-head)"/>
</svg>
