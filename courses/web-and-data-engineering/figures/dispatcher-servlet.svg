<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#1565c0"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#b71c1c"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#1b5e20"/></marker>
    <marker id="ap" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#6a1b9a"/></marker>
  </defs>

  <text x="380" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#333">Spring MVC: DispatcherServlet-Ablauf</text>

  <!-- Client -->
  <rect x="10" y="100" width="100" height="50" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="60" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#1565c0">Client</text>
  <text x="60" y="138" text-anchor="middle" font-size="9" fill="#555">HTTP Request</text>

  <!-- DispatcherServlet -->
  <rect x="160" y="70" width="150" height="130" rx="8" fill="#fff3cd" stroke="#f9ab00" stroke-width="2.5"/>
  <rect x="160" y="70" width="150" height="24" rx="8" fill="#f9ab00"/>
  <text x="235" y="87" text-anchor="middle" font-size="11" font-weight="700" fill="white">DispatcherServlet</text>
  <text x="235" y="110" text-anchor="middle" font-size="9" fill="#b06000">Front Controller</text>
  <text x="235" y="125" text-anchor="middle" font-size="9" fill="#b06000">Empfängt alle</text>
  <text x="235" y="138" text-anchor="middle" font-size="9" fill="#b06000">HTTP Requests</text>

  <!-- HandlerMapping -->
  <rect x="370" y="40" width="140" height="40" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="440" y="56" text-anchor="middle" font-size="10" font-weight="700" fill="#1565c0">HandlerMapping</text>
  <text x="440" y="72" text-anchor="middle" font-size="8" fill="#555">URL → Controller</text>

  <!-- Controller -->
  <rect x="370" y="100" width="140" height="50" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="440" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#1b5e20">Controller</text>
  <text x="440" y="138" text-anchor="middle" font-size="9" fill="#555">@GetMapping, @PostMapping</text>

  <!-- Model -->
  <rect x="560" y="100" width="90" height="50" rx="6" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="605" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#6a1b9a">Model</text>
  <text x="605" y="138" text-anchor="middle" font-size="9" fill="#555">Daten (POJOs)</text>

  <!-- ViewResolver -->
  <rect x="370" y="170" width="140" height="40" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="440" y="186" text-anchor="middle" font-size="10" font-weight="700" fill="#b71c1c">ViewResolver</text>
  <text x="440" y="202" text-anchor="middle" font-size="8" fill="#555">Name → Template</text>

  <!-- View -->
  <rect x="560" y="170" width="90" height="50" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="605" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#b71c1c">View</text>
  <text x="605" y="208" text-anchor="middle" font-size="9" fill="#555">Thymeleaf/JSP</text>

  <!-- Response -->
  <rect x="660" y="170" width="90" height="50" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="705" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#1b5e20">Response</text>
  <text x="705" y="208" text-anchor="middle" font-size="9" fill="#555">HTML / JSON</text>

  <!-- Numbered arrows -->
  <!-- ① Client → Dispatcher -->
  <line x1="115" y1="125" x2="154" y2="125" stroke="#1565c0" stroke-width="2" marker-end="url(#ab)"/>
  <text x="134" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="#1565c0">①</text>

  <!-- ② Dispatcher → HandlerMapping -->
  <line x1="310" y1="85" x2="364" y2="65" stroke="#1565c0" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="340" y="68" text-anchor="middle" font-size="10" font-weight="700" fill="#1565c0">②</text>

  <!-- ③ Dispatcher → Controller -->
  <line x1="315" y1="125" x2="364" y2="125" stroke="#1b5e20" stroke-width="2" marker-end="url(#ag)"/>
  <text x="340" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="#1b5e20">③</text>

  <!-- ④ Controller → Model -->
  <line x1="515" y1="125" x2="554" y2="125" stroke="#6a1b9a" stroke-width="1.5" marker-end="url(#ap)"/>
  <text x="534" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="#6a1b9a">④</text>

  <!-- ⑤ Dispatcher → ViewResolver -->
  <line x1="310" y1="180" x2="364" y2="185" stroke="#b71c1c" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="335" y="178" text-anchor="middle" font-size="10" font-weight="700" fill="#b71c1c">⑤</text>

  <!-- ⑥ View + Model → Response -->
  <line x1="655" y1="195" x2="654" y2="195" stroke="#1b5e20" stroke-width="1.5"/>
  <line x1="605" y1="155" x2="605" y2="164" stroke="#6a1b9a" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="655" y1="195" x2="654" y2="195" stroke="#1b5e20" stroke-width="2" marker-end="url(#ag)"/>

  <!-- Step labels -->
  <rect x="10" y="230" width="740" height="40" rx="4" fill="#f9f9f9" stroke="#ddd"/>
  <text x="20" y="248" font-size="9" fill="#1565c0" font-weight="600">① Request empfangen</text>
  <text x="160" y="248" font-size="9" fill="#1565c0" font-weight="600">② Controller suchen</text>
  <text x="300" y="248" font-size="9" fill="#1b5e20" font-weight="600">③ Controller aufrufen</text>
  <text x="440" y="248" font-size="9" fill="#6a1b9a" font-weight="600">④ Model füllen</text>
  <text x="555" y="248" font-size="9" fill="#b71c1c" font-weight="600">⑤ View auflösen</text>
  <text x="670" y="248" font-size="9" fill="#1b5e20" font-weight="600">⑥ Response</text>
  <text x="20" y="262" font-size="8" fill="#888">→ DispatcherServlet</text>
  <text x="160" y="262" font-size="8" fill="#888">→ HandlerMapping</text>
  <text x="300" y="262" font-size="8" fill="#888">→ @Controller Methode</text>
  <text x="440" y="262" font-size="8" fill="#888">→ POJOs + DTOs</text>
  <text x="555" y="262" font-size="8" fill="#888">→ ViewResolver</text>
  <text x="670" y="262" font-size="8" fill="#888">→ HTML/JSON</text>
</svg>
