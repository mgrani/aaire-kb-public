<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 210" font-family="'Source Sans Pro', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ds-fwd" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#1a5fa8"/>
    </marker>
    <marker id="ds-bwd" markerWidth="7" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <polygon points="7 0, 0 3, 7 6" fill="#ea4335"/>
    </marker>
    <marker id="ds-rep" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#34a853"/>
    </marker>
  </defs>

  <!-- ══ Clients (stacked) ══ -->
  <rect x="10" y="55" width="90" height="38" rx="6" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="1.5"/>
  <text x="55" y="79" text-anchor="middle" font-size="12" font-weight="600" fill="#222">Client 1</text>
  <rect x="10" y="100" width="90" height="38" rx="6" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="1.5"/>
  <text x="55" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#222">Client 2</text>
  <rect x="10" y="145" width="90" height="38" rx="6" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="1.5"/>
  <text x="55" y="169" text-anchor="middle" font-size="12" font-weight="600" fill="#aaa">Client N</text>

  <!-- Clients → LB -->
  <line x1="100" y1="74" x2="180" y2="105" stroke="#1a5fa8" stroke-width="1.5" marker-end="url(#ds-fwd)"/>
  <line x1="100" y1="119" x2="180" y2="115" stroke="#1a5fa8" stroke-width="1.5" marker-end="url(#ds-fwd)"/>
  <line x1="100" y1="164" x2="180" y2="125" stroke="#1a5fa8" stroke-width="1.5" marker-end="url(#ds-fwd)"/>

  <!-- ══ Load Balancer ══ -->
  <rect x="183" y="88" width="120" height="50" rx="8" fill="#1a5fa8" stroke="#0d3d6e" stroke-width="2"/>
  <text x="243" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Load</text>
  <text x="243" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Balancer</text>

  <!-- LB → Servers -->
  <line x1="303" y1="100" x2="355" y2="55" stroke="#1a5fa8" stroke-width="1.5" marker-end="url(#ds-fwd)"/>
  <line x1="303" y1="113" x2="355" y2="113" stroke="#1a5fa8" stroke-width="1.5" marker-end="url(#ds-fwd)"/>
  <line x1="303" y1="126" x2="355" y2="168" stroke="#1a5fa8" stroke-width="1.5" marker-end="url(#ds-fwd)"/>

  <!-- ══ Servers ══ -->
  <rect x="358" y="28" width="110" height="48" rx="7" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="413" y="49" text-anchor="middle" font-size="12" font-weight="600" fill="#222">Server 1</text>
  <text x="413" y="65" text-anchor="middle" font-size="10" fill="#555">App Instance</text>

  <rect x="358" y="89" width="110" height="48" rx="7" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="413" y="110" text-anchor="middle" font-size="12" font-weight="600" fill="#222">Server 2</text>
  <text x="413" y="126" text-anchor="middle" font-size="10" fill="#555">App Instance</text>

  <rect x="358" y="150" width="110" height="48" rx="7" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="413" y="171" text-anchor="middle" font-size="12" font-weight="600" fill="#aaa">Server N</text>
  <text x="413" y="187" text-anchor="middle" font-size="10" fill="#bbb">App Instance</text>

  <!-- Servers → DB Primary -->
  <line x1="468" y1="52" x2="560" y2="80" stroke="#34a853" stroke-width="1.5" marker-end="url(#ds-fwd)"/>
  <line x1="468" y1="113" x2="560" y2="105" stroke="#34a853" stroke-width="1.5" marker-end="url(#ds-fwd)"/>
  <line x1="468" y1="174" x2="560" y2="130" stroke="#34a853" stroke-width="1.5" marker-end="url(#ds-fwd)"/>

  <!-- ══ DB Primary ══ -->
  <rect x="563" y="70" width="130" height="60" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="2.5"/>
  <text x="628" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#222">DB Primary</text>
  <text x="628" y="113" text-anchor="middle" font-size="10" fill="#666">Lesen + Schreiben</text>

  <!-- DB Primary ↔ DB Replica -->
  <line x1="693" y1="100" x2="718" y2="100" stroke="#ea4335" stroke-width="2"
        marker-start="url(#ds-bwd)" marker-end="url(#ds-rep)"/>
  <text x="705" y="92" text-anchor="middle" font-size="9" fill="#888">Replikation</text>

  <!-- ══ DB Replica ══ -->
  <rect x="720" y="70" width="88" height="60" rx="8" fill="#fff3f3" stroke="#ea4335" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="764" y="94" text-anchor="middle" font-size="11" font-weight="600" fill="#555">DB</text>
  <text x="764" y="110" text-anchor="middle" font-size="11" font-weight="600" fill="#555">Replica</text>
  <text x="764" y="126" text-anchor="middle" font-size="9" fill="#888">nur lesen</text>

  <!-- Challenge labels -->
  <text x="410" y="210" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">Neue Herausforderungen: Netzwerklatenz · Partielle Ausfälle · Datenkonsistenz · Koordination</text>
</svg>
