<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#1f4e79"/>
    </marker>
    <marker id="arr-red" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#9f3129"/>
    </marker>
  </defs>

  <!-- Client & Server headers -->
  <rect x="30" y="20" width="150" height="38" rx="8" fill="#eaf2ff" stroke="#4a89dc"/>
  <text x="105" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79">Client</text>

  <rect x="580" y="20" width="150" height="38" rx="8" fill="#fdecea" stroke="#e06a5f"/>
  <text x="655" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#9f3129">Server</text>

  <!-- Lifelines -->
  <line x1="105" y1="58" x2="105" y2="225" stroke="#9bb6d1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="655" y1="58" x2="655" y2="225" stroke="#e6a39b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Server activation bar -->
  <rect x="651" y="88" width="8" height="54" fill="#fdecea" stroke="#9f3129" stroke-width="1"/>

  <!-- Request -->
  <text x="380" y="80" text-anchor="middle" font-size="13" fill="#1f4e79" font-weight="700">POST /orders {"quantity": 0}</text>
  <line x1="105" y1="88" x2="651" y2="88" stroke="#1f4e79" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Response -->
  <text x="380" y="134" text-anchor="middle" font-size="13" fill="#9f3129" font-weight="700">400 Bad Request  ·  Content-Type: application/json</text>
  <line x1="651" y1="142" x2="109" y2="142" stroke="#9f3129" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Error body detail -->
  <rect x="220" y="160" width="320" height="56" rx="8" fill="#fff6f5" stroke="#e6a39b"/>
  <text x="380" y="182" text-anchor="middle" font-size="12" fill="#6d4c48">{"error":{"type":"validation_error",</text>
  <text x="380" y="200" text-anchor="middle" font-size="12" fill="#6d4c48">"message":"quantity must be &gt;= 1"}}</text>
</svg>
