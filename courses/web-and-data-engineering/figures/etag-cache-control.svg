<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#1565c0"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#1b5e20"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#ea4335"/></marker>
  </defs>

  <!-- Phase divider -->
  <line x1="378" y1="5" x2="378" y2="325" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- ===================== PHASE 1 ===================== -->
  <text x="190" y="18" text-anchor="middle" font-size="13" font-weight="700" fill="#333">① Erste Anfrage</text>

  <!-- Browser & Server headers -->
  <rect x="20" y="28" width="80" height="28" rx="5" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="60" y="46" text-anchor="middle" font-size="11" font-weight="700" fill="#1565c0">Browser</text>
  <rect x="280" y="28" width="80" height="28" rx="5" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="320" y="46" text-anchor="middle" font-size="11" font-weight="700" fill="#b71c1c">Server</text>

  <!-- Lifelines -->
  <line x1="60" y1="56" x2="60" y2="310" stroke="#9bb6d1" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="320" y1="56" x2="320" y2="310" stroke="#e6a39b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Request arrow -->
  <text x="190" y="72" text-anchor="middle" font-size="10" fill="#1565c0" font-weight="700">GET /api/products/42</text>
  <line x1="60" y1="80" x2="316" y2="80" stroke="#1565c0" stroke-width="2" marker-end="url(#ab)"/>

  <!-- Server activation bar -->
  <rect x="316" y="80" width="8" height="42" fill="#fce8e6" stroke="#ea4335" stroke-width="1"/>

  <!-- Response arrow -->
  <text x="190" y="116" text-anchor="middle" font-size="10" fill="#1b5e20" font-weight="700">200 OK</text>
  <line x1="316" y1="124" x2="64" y2="124" stroke="#1b5e20" stroke-width="2" marker-end="url(#ag)"/>

  <!-- Response headers detail -->
  <rect x="62" y="133" width="256" height="50" rx="4" fill="#f6fbf6" stroke="#a5d6a7" stroke-width="1"/>
  <text x="70" y="149" font-size="10" font-family="Menlo, Consolas, monospace" fill="#333">ETag: "f7e3a1b2"</text>
  <text x="70" y="163" font-size="10" font-family="Menlo, Consolas, monospace" fill="#333">Cache-Control: max-age=300</text>
  <text x="70" y="177" font-size="10" font-family="Menlo, Consolas, monospace" fill="#888">{...Produktdaten, Preis: 79.99...}</text>

  <!-- Cache stored badge -->
  <rect x="20" y="208" width="200" height="26" rx="4" fill="#e6f4ea" stroke="#34a853"/>
  <text x="120" y="225" text-anchor="middle" font-size="10" fill="#1b5e20" font-weight="700">💾 Im Browser-Cache gespeichert</text>

  <!-- Max-age countdown -->
  <rect x="20" y="240" width="200" height="26" rx="4" fill="#fff3cd" stroke="#f9ab00"/>
  <text x="120" y="257" text-anchor="middle" font-size="10" fill="#b06000" font-weight="700">⏰ Gültig für 300 Sekunden</text>

  <!-- ===================== PHASE 2 ===================== -->
  <text x="565" y="18" text-anchor="middle" font-size="13" font-weight="700" fill="#333">② Validierung nach Ablauf</text>

  <!-- Time passed warning -->
  <rect x="395" y="28" width="345" height="24" rx="4" fill="#fff3cd" stroke="#f9ab00"/>
  <text x="568" y="44" text-anchor="middle" font-size="10" font-weight="700" fill="#b06000">⏰ max-age abgelaufen — Browser muss validieren</text>

  <!-- Browser & Server -->
  <rect x="395" y="60" width="80" height="28" rx="5" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="435" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#1565c0">Browser</text>
  <rect x="660" y="60" width="80" height="28" rx="5" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="700" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#b71c1c">Server</text>

  <!-- Lifelines -->
  <line x1="435" y1="88" x2="435" y2="310" stroke="#9bb6d1" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="700" y1="88" x2="700" y2="310" stroke="#e6a39b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Conditional GET arrow -->
  <text x="567" y="104" text-anchor="middle" font-size="10" fill="#1565c0" font-weight="700">GET /api/products/42  (conditional)</text>
  <line x1="435" y1="112" x2="696" y2="112" stroke="#1565c0" stroke-width="2" marker-end="url(#ab)"/>

  <!-- Conditional GET header detail -->
  <rect x="437" y="121" width="261" height="22" rx="4" fill="#f0f6ff" stroke="#9bb6d1" stroke-width="1"/>
  <text x="445" y="136" font-size="10" font-family="Menlo, Consolas, monospace" fill="#555">If-None-Match: "f7e3a1b2"</text>

  <!-- Server activation bar (covers both possible response times) -->
  <rect x="696" y="112" width="8" height="120" fill="#fce8e6" stroke="#ea4335" stroke-width="1"/>

  <!-- alt label -->
  <text x="453" y="160" font-size="9" fill="#888" font-style="italic" font-weight="700">[alt]</text>

  <!-- 304 Branch -->
  <text x="567" y="174" text-anchor="middle" font-size="10" fill="#1b5e20" font-weight="700">304 Not Modified  ·  unverändert</text>
  <line x1="696" y1="182" x2="439" y2="182" stroke="#1b5e20" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="437" y="191" width="261" height="32" rx="4" fill="#e6f4ea" stroke="#a5d6a7" stroke-width="1"/>
  <text x="445" y="206" font-size="9" fill="#1b5e20">kein Body — Cache bleibt gültig</text>
  <text x="445" y="218" font-size="9" fill="#1b5e20" font-style="italic">→ spart Bandbreite, neue max-age startet</text>

  <!-- OR separator -->
  <text x="567" y="240" text-anchor="middle" font-size="9" fill="#888" font-style="italic">— oder, falls Ressource geändert —</text>

  <!-- 200 Branch -->
  <text x="567" y="256" text-anchor="middle" font-size="10" fill="#b71c1c" font-weight="700">200 OK  ·  geändert</text>
  <line x1="696" y1="264" x2="439" y2="264" stroke="#ea4335" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="437" y="273" width="261" height="32" rx="4" fill="#fce8e6" stroke="#e6a39b" stroke-width="1"/>
  <text x="445" y="288" font-size="9" fill="#b71c1c">neuer ETag, neuer Body</text>
  <text x="445" y="300" font-size="9" fill="#b71c1c" font-style="italic">→ Cache aktualisieren</text>
</svg>
