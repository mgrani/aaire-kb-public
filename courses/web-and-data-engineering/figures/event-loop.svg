<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <!-- Call Stack -->
  <rect x="30" y="30" width="180" height="160" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="120" y="55" text-anchor="middle" font-size="14" font-weight="600" fill="#1565c0">Call Stack</text>
  <!-- Stack frames -->
  <rect x="45" y="68" width="150" height="28" rx="4" fill="#4285f4" opacity="0.15" stroke="#4285f4" stroke-width="1"/>
  <text x="120" y="87" text-anchor="middle" font-size="11" fill="#333">handleClick()</text>
  <rect x="45" y="100" width="150" height="28" rx="4" fill="#4285f4" opacity="0.1" stroke="#4285f4" stroke-width="1"/>
  <text x="120" y="119" text-anchor="middle" font-size="11" fill="#333">updateDOM()</text>
  <rect x="45" y="132" width="150" height="28" rx="4" fill="#4285f4" opacity="0.05" stroke="#4285f4" stroke-width="1"/>
  <text x="120" y="151" text-anchor="middle" font-size="11" fill="#999">— leer —</text>
  <text x="120" y="180" text-anchor="middle" font-size="10" fill="#666">Synchrone Ausführung</text>

  <!-- Web APIs -->
  <rect x="260" y="30" width="180" height="160" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="350" y="55" text-anchor="middle" font-size="14" font-weight="600" fill="#c62828">Web APIs</text>
  <text x="350" y="80" text-anchor="middle" font-size="12" fill="#555">fetch()</text>
  <text x="350" y="100" text-anchor="middle" font-size="12" fill="#555">setTimeout()</text>
  <text x="350" y="120" text-anchor="middle" font-size="12" fill="#555">DOM Events</text>
  <text x="350" y="140" text-anchor="middle" font-size="12" fill="#555">WebSocket</text>
  <text x="350" y="180" text-anchor="middle" font-size="10" fill="#666">Laufen im Hintergrund</text>

  <!-- Task Queue -->
  <rect x="490" y="30" width="180" height="160" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="580" y="55" text-anchor="middle" font-size="14" font-weight="600" fill="#1b5e20">Task Queue</text>
  <!-- Queue items -->
  <rect x="505" y="70" width="150" height="24" rx="4" fill="#34a853" opacity="0.15" stroke="#34a853" stroke-width="1"/>
  <text x="580" y="87" text-anchor="middle" font-size="11" fill="#333">onClick callback</text>
  <rect x="505" y="98" width="150" height="24" rx="4" fill="#34a853" opacity="0.1" stroke="#34a853" stroke-width="1"/>
  <text x="580" y="115" text-anchor="middle" font-size="11" fill="#333">fetch .then()</text>
  <rect x="505" y="126" width="150" height="24" rx="4" fill="#34a853" opacity="0.05" stroke="#34a853" stroke-width="1"/>
  <text x="580" y="143" text-anchor="middle" font-size="11" fill="#333">setTimeout cb</text>
  <text x="580" y="180" text-anchor="middle" font-size="10" fill="#666">Warten auf Ausführung</text>

  <!-- Event Loop (center circle) -->
  <circle cx="350" cy="300" r="55" fill="#fef7e0" stroke="#f9ab00" stroke-width="3"/>
  <text x="350" y="295" text-anchor="middle" font-size="13" font-weight="600" fill="#b07800">Event</text>
  <text x="350" y="313" text-anchor="middle" font-size="13" font-weight="600" fill="#b07800">Loop</text>

  <!-- Arrows -->
  <!-- Call Stack → Web APIs (async call) -->
  <path d="M210 110 L260 110" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="235" y="103" text-anchor="middle" font-size="9" fill="#888">async</text>

  <!-- Web APIs → Task Queue (callback ready) -->
  <path d="M440 110 L490 110" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="465" y="103" text-anchor="middle" font-size="9" fill="#888">done</text>

  <!-- Event Loop arrows -->
  <!-- Queue → Event Loop -->
  <path d="M530 190 Q 530 300 405 300" fill="none" stroke="#f9ab00" stroke-width="2" marker-end="url(#arrowGold)"/>

  <!-- Event Loop → Call Stack -->
  <path d="M295 300 Q 120 300 120 190" fill="none" stroke="#f9ab00" stroke-width="2" marker-end="url(#arrowGold)"/>

  <!-- Label on Event Loop path -->
  <text x="170" y="268" font-size="10" fill="#b07800" transform="rotate(-40, 170, 268)">Stack leer? → nächster Task</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#888"/>
    </marker>
    <marker id="arrowGold" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#f9ab00"/>
    </marker>
  </defs>
</svg>
