<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">MVC im Frontend</title>
  <desc id="desc">Model View Controller Architektur: Nutzerinteraktion geht an den Controller, der das Model aktualisiert. Die View rendert Daten aus dem Model.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1a73e8"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#188038"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#e37400"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="920" height="520" fill="#ffffff"/>
  <rect x="28" y="28" width="864" height="464" rx="24" fill="#f8fafc" stroke="#d7dee7"/>

  <text x="460" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111827">MVC: Model - View - Controller</text>
  <text x="460" y="101" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">Interaktion wird kontrolliert, Zustand liegt im Model, Darstellung liegt in der View.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="190" width="190" height="120" rx="18" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/>
    <text x="175" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1a73e8">View</text>
    <text x="175" y="258" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">rendert UI</text>
    <text x="175" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">Buttons, Formulare, DOM</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="365" y="125" width="190" height="120" rx="18" fill="#e6f4ea" stroke="#188038" stroke-width="3"/>
    <text x="460" y="165" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#188038">Controller</text>
    <text x="460" y="193" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">verarbeitet Aktionen</text>
    <text x="460" y="217" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">Click, Submit, Route</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="650" y="190" width="190" height="120" rx="18" fill="#fff3e0" stroke="#e37400" stroke-width="3"/>
    <text x="745" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#e37400">Model</text>
    <text x="745" y="258" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">hält Zustand</text>
    <text x="745" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">Daten, Regeln, API-State</text>
  </g>

  <path d="M270 225 C315 180 320 172 360 172" fill="none" stroke="#1a73e8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="304" y="188" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1a73e8">User Event</text>

  <path d="M555 182 C610 185 618 210 646 230" fill="none" stroke="#188038" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="602" y="188" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#188038">ändert Zustand</text>

  <path d="M650 278 C540 385 380 385 270 278" fill="none" stroke="#e37400" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="460" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e37400">Model-Daten aktualisieren View</text>

  <rect x="158" y="408" width="604" height="48" rx="14" fill="#111827"/>
  <text x="460" y="438" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Typisch: Backbone, ältere AngularJS-Apps, serverseitige MVC-Frameworks</text>
</svg>
