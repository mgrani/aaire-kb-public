<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">MVP im Frontend</title>
  <desc id="desc">Model View Presenter Architektur: Eine passive View kommuniziert mit dem Presenter. Der Presenter enthält UI-Logik und greift auf das Model zu.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1a73e8"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#188038"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#e37400"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="920" height="520" fill="#ffffff"/>
  <rect x="28" y="28" width="864" height="464" rx="24" fill="#f8fafc" stroke="#d7dee7"/>

  <text x="460" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111827">MVP: Model - View - Presenter</text>
  <text x="460" y="101" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">Die View bleibt passiv; fast alle UI-Entscheidungen liegen im Presenter.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="200" width="190" height="120" rx="18" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/>
    <text x="175" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1a73e8">View</text>
    <text x="175" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">passive Oberfläche</text>
    <text x="175" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">delegiert an Presenter</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="365" y="160" width="190" height="160" rx="18" fill="#e6f4ea" stroke="#188038" stroke-width="3"/>
    <text x="460" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#188038">Presenter</text>
    <text x="460" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">UI-Logik und Vermittlung</text>
    <text x="460" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">validiert, formatiert, koordiniert</text>
    <rect x="398" y="278" width="124" height="26" rx="13" fill="#ffffff" stroke="#9ad3a7"/>
    <text x="460" y="296" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#188038">gut testbar</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="650" y="200" width="190" height="120" rx="18" fill="#fff3e0" stroke="#e37400" stroke-width="3"/>
    <text x="745" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#e37400">Model</text>
    <text x="745" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">Daten und Regeln</text>
    <text x="745" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">Domain, Services, API</text>
  </g>

  <path d="M270 238 C312 205 326 202 362 210" fill="none" stroke="#1a73e8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="310" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1a73e8">Events</text>

  <path d="M365 282 C325 305 310 310 274 292" fill="none" stroke="#188038" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="320" y="327" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#188038">View-Update</text>

  <path d="M555 222 C598 205 615 205 646 234" fill="none" stroke="#188038" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M650 284 C608 315 590 315 555 275" fill="none" stroke="#e37400" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="602" y="333" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e37400">Daten zurück</text>

  <rect x="180" y="408" width="560" height="48" rx="14" fill="#111827"/>
  <text x="460" y="438" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Typisch: GWT, testorientierte UI-Architekturen, Android historisch</text>
</svg>
