<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">MVVM im Frontend</title>
  <desc id="desc">Model View ViewModel Architektur: Die View bindet deklarativ an ein ViewModel. Das ViewModel hält präsentationsnahen Zustand und synchronisiert mit dem Model.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1a73e8"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#188038"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#e37400"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="920" height="520" fill="#ffffff"/>
  <rect x="28" y="28" width="864" height="464" rx="24" fill="#f8fafc" stroke="#d7dee7"/>

  <text x="460" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111827">MVVM: Model - View - ViewModel</text>
  <text x="460" y="101" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">Die View bindet deklarativ an präsentationsnahen Zustand im ViewModel.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="200" width="190" height="120" rx="18" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/>
    <text x="175" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1a73e8">View</text>
    <text x="175" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">deklaratives Template</text>
    <text x="175" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">bindet an Zustand</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="350" y="160" width="220" height="160" rx="18" fill="#e6f4ea" stroke="#188038" stroke-width="3"/>
    <text x="460" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#188038">ViewModel</text>
    <text x="460" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">präsentationsnaher Zustand</text>
    <text x="460" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">Computed Values, Commands</text>
    <rect x="385" y="278" width="150" height="26" rx="13" fill="#ffffff" stroke="#9ad3a7"/>
    <text x="460" y="296" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#188038">reaktive Bindings</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="650" y="200" width="190" height="120" rx="18" fill="#fff3e0" stroke="#e37400" stroke-width="3"/>
    <text x="745" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#e37400">Model</text>
    <text x="745" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">Domain-Zustand</text>
    <text x="745" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">Daten, API, Regeln</text>
  </g>

  <path d="M270 235 C308 200 318 195 346 210" fill="none" stroke="#1a73e8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M350 285 C308 315 296 318 270 292" fill="none" stroke="#188038" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="307" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#188038">Two-way / reactive Binding</text>

  <path d="M570 226 C612 206 624 207 647 235" fill="none" stroke="#188038" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M650 285 C610 315 596 315 570 276" fill="none" stroke="#e37400" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="610" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e37400">Domain-Daten</text>

  <rect x="186" y="408" width="548" height="48" rx="14" fill="#111827"/>
  <text x="460" y="438" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Typisch: Knockout, Vue, Angular mit reaktiven Bindings</text>
</svg>
