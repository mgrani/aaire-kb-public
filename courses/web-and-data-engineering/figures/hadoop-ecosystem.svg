<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <text x="380" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#333">Hadoop Ökosystem</text>

  <!-- Application Layer -->
  <rect x="30" y="40" width="700" height="70" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <rect x="30" y="40" width="700" height="22" rx="6" fill="#4285f4"/>
  <text x="380" y="56" text-anchor="middle" font-size="11" font-weight="700" fill="white">Anwendungen / Frameworks</text>

  <!-- App boxes -->
  <rect x="45" y="72" width="85" height="28" rx="4" fill="white" stroke="#4285f4" stroke-width="1.2"/>
  <text x="87" y="90" text-anchor="middle" font-size="9" font-weight="600" fill="#1565c0">MapReduce</text>

  <rect x="140" y="72" width="85" height="28" rx="4" fill="white" stroke="#4285f4" stroke-width="1.2"/>
  <text x="182" y="90" text-anchor="middle" font-size="9" font-weight="600" fill="#1565c0">Apache Spark</text>

  <rect x="235" y="72" width="65" height="28" rx="4" fill="white" stroke="#4285f4" stroke-width="1.2"/>
  <text x="267" y="90" text-anchor="middle" font-size="9" font-weight="600" fill="#1565c0">Hive</text>

  <rect x="310" y="72" width="55" height="28" rx="4" fill="white" stroke="#4285f4" stroke-width="1.2"/>
  <text x="337" y="90" text-anchor="middle" font-size="9" font-weight="600" fill="#1565c0">Pig</text>

  <rect x="375" y="72" width="65" height="28" rx="4" fill="white" stroke="#4285f4" stroke-width="1.2"/>
  <text x="407" y="90" text-anchor="middle" font-size="9" font-weight="600" fill="#1565c0">Storm</text>

  <rect x="450" y="72" width="70" height="28" rx="4" fill="white" stroke="#4285f4" stroke-width="1.2"/>
  <text x="485" y="90" text-anchor="middle" font-size="9" font-weight="600" fill="#1565c0">Giraph</text>

  <rect x="530" y="72" width="70" height="28" rx="4" fill="white" stroke="#4285f4" stroke-width="1.2"/>
  <text x="565" y="90" text-anchor="middle" font-size="9" font-weight="600" fill="#1565c0">HBase</text>

  <rect x="610" y="72" width="105" height="28" rx="4" fill="white" stroke="#4285f4" stroke-width="1.2"/>
  <text x="662" y="90" text-anchor="middle" font-size="9" font-weight="600" fill="#1565c0">Mahout / MLlib</text>

  <!-- Labels under app boxes -->
  <text x="87" y="115" text-anchor="middle" font-size="7" fill="#888">Batch</text>
  <text x="182" y="115" text-anchor="middle" font-size="7" fill="#888">In-Memory</text>
  <text x="267" y="115" text-anchor="middle" font-size="7" fill="#888">SQL</text>
  <text x="337" y="115" text-anchor="middle" font-size="7" fill="#888">Scripting</text>
  <text x="407" y="115" text-anchor="middle" font-size="7" fill="#888">Streaming</text>
  <text x="485" y="115" text-anchor="middle" font-size="7" fill="#888">Graph</text>
  <text x="565" y="115" text-anchor="middle" font-size="7" fill="#888">NoSQL</text>
  <text x="662" y="115" text-anchor="middle" font-size="7" fill="#888">Machine Learning</text>

  <!-- YARN Layer -->
  <rect x="30" y="125" width="700" height="55" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <rect x="30" y="125" width="700" height="22" rx="6" fill="#34a853"/>
  <text x="380" y="141" text-anchor="middle" font-size="11" font-weight="700" fill="white">YARN — Yet Another Resource Negotiator</text>
  <text x="200" y="165" text-anchor="middle" font-size="9" fill="#1b5e20" font-weight="600">ResourceManager</text>
  <text x="380" y="165" text-anchor="middle" font-size="9" fill="#1b5e20" font-weight="600">NodeManager</text>
  <text x="560" y="165" text-anchor="middle" font-size="9" fill="#1b5e20" font-weight="600">ApplicationMaster</text>

  <!-- HDFS Layer -->
  <rect x="30" y="190" width="700" height="55" rx="6" fill="#fff3cd" stroke="#f9ab00" stroke-width="2"/>
  <rect x="30" y="190" width="700" height="22" rx="6" fill="#f9ab00"/>
  <text x="380" y="206" text-anchor="middle" font-size="11" font-weight="700" fill="white">HDFS — Hadoop Distributed File System</text>
  <text x="200" y="230" text-anchor="middle" font-size="9" fill="#b06000" font-weight="600">NameNode (Metadaten)</text>
  <text x="380" y="230" text-anchor="middle" font-size="9" fill="#b06000" font-weight="600">DataNodes (Chunks)</text>
  <text x="560" y="230" text-anchor="middle" font-size="9" fill="#b06000" font-weight="600">Replikation (3×)</text>

  <!-- Coordination -->
  <rect x="30" y="255" width="340" height="50" rx="6" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <rect x="30" y="255" width="340" height="20" rx="6" fill="#9c27b0"/>
  <text x="200" y="269" text-anchor="middle" font-size="10" font-weight="700" fill="white">Koordination &amp; Workflow</text>
  <text x="100" y="291" text-anchor="middle" font-size="9" fill="#6a1b9a" font-weight="600">ZooKeeper</text>
  <text x="200" y="291" text-anchor="middle" font-size="9" fill="#6a1b9a" font-weight="600">Oozie</text>
  <text x="300" y="291" text-anchor="middle" font-size="9" fill="#6a1b9a" font-weight="600">Ambari</text>

  <!-- Ingestion -->
  <rect x="390" y="255" width="340" height="50" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <rect x="390" y="255" width="340" height="20" rx="6" fill="#ea4335"/>
  <text x="560" y="269" text-anchor="middle" font-size="10" font-weight="700" fill="white">Daten-Ingestion</text>
  <text x="450" y="291" text-anchor="middle" font-size="9" fill="#b71c1c" font-weight="600">Flume</text>
  <text x="530" y="291" text-anchor="middle" font-size="9" fill="#b71c1c" font-weight="600">Sqoop</text>
  <text x="610" y="291" text-anchor="middle" font-size="9" fill="#b71c1c" font-weight="600">Kafka</text>
  <text x="680" y="291" text-anchor="middle" font-size="9" fill="#b71c1c" font-weight="600">NiFi</text>
</svg>
