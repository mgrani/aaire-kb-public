<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ha" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="hb" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4285f4"/>
    </marker>
    <marker id="hr" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34a853"/>
    </marker>
  </defs>

  <text x="310" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#333">HDFS — Hadoop Distributed File System</text>

  <!-- Client -->
  <rect x="10" y="60" width="90" height="50" rx="6" fill="#f9f9f9" stroke="#999" stroke-width="1.5"/>
  <text x="55" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Client</text>
  <text x="55" y="98" text-anchor="middle" font-size="8" fill="#555">Lesen/Schreiben</text>

  <!-- NameNode -->
  <rect x="200" y="40" width="160" height="80" rx="6" fill="#fff3cd" stroke="#f9ab00" stroke-width="2.5"/>
  <rect x="200" y="40" width="160" height="22" rx="6" fill="#f9ab00"/>
  <text x="280" y="56" text-anchor="middle" font-size="11" font-weight="700" fill="white">NameNode</text>
  <text x="280" y="78" text-anchor="middle" font-size="9" fill="#b06000" font-weight="600">Metadaten:</text>
  <text x="280" y="92" text-anchor="middle" font-size="8" fill="#555">Datei → Chunk-Liste</text>
  <text x="280" y="104" text-anchor="middle" font-size="8" fill="#555">Chunk → DataNode-Zuordnung</text>

  <!-- Arrows Client ↔ NameNode -->
  <line x1="104" y1="75" x2="195" y2="70" stroke="#4285f4" stroke-width="1.5" marker-end="url(#hb)"/>
  <text x="150" y="65" text-anchor="middle" font-size="7" fill="#4285f4">① Metadaten</text>

  <!-- Rack 1 -->
  <rect x="30" y="145" width="175" height="145" rx="6" fill="#f0f7ff" stroke="#4285f4" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="117" y="162" text-anchor="middle" font-size="9" font-weight="600" fill="#1565c0">Rack 1</text>

  <rect x="45" y="172" width="65" height="50" rx="4" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="77" y="190" text-anchor="middle" font-size="9" font-weight="600" fill="#1565c0">DN 1</text>
  <rect x="52" y="200" width="22" height="14" rx="2" fill="#4285f4"/><text x="63" y="210" text-anchor="middle" font-size="7" fill="white">C1</text>
  <rect x="78" y="200" width="22" height="14" rx="2" fill="#34a853"/><text x="89" y="210" text-anchor="middle" font-size="7" fill="white">C3</text>

  <rect x="125" y="172" width="65" height="50" rx="4" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="157" y="190" text-anchor="middle" font-size="9" font-weight="600" fill="#1565c0">DN 2</text>
  <rect x="132" y="200" width="22" height="14" rx="2" fill="#4285f4"/><text x="143" y="210" text-anchor="middle" font-size="7" fill="white">C1</text>
  <rect x="158" y="200" width="22" height="14" rx="2" fill="#f9ab00"/><text x="169" y="210" text-anchor="middle" font-size="7" fill="white">C2</text>

  <!-- Rack 2 -->
  <rect x="230" y="145" width="175" height="145" rx="6" fill="#f0fff4" stroke="#34a853" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="317" y="162" text-anchor="middle" font-size="9" font-weight="600" fill="#1b5e20">Rack 2</text>

  <rect x="245" y="172" width="65" height="50" rx="4" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="277" y="190" text-anchor="middle" font-size="9" font-weight="600" fill="#1b5e20">DN 3</text>
  <rect x="252" y="200" width="22" height="14" rx="2" fill="#f9ab00"/><text x="263" y="210" text-anchor="middle" font-size="7" fill="white">C2</text>
  <rect x="278" y="200" width="22" height="14" rx="2" fill="#34a853"/><text x="289" y="210" text-anchor="middle" font-size="7" fill="white">C3</text>

  <rect x="325" y="172" width="65" height="50" rx="4" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="357" y="190" text-anchor="middle" font-size="9" font-weight="600" fill="#1b5e20">DN 4</text>
  <rect x="332" y="200" width="22" height="14" rx="2" fill="#4285f4"/><text x="343" y="210" text-anchor="middle" font-size="7" fill="white">C1</text>
  <rect x="358" y="200" width="22" height="14" rx="2" fill="#34a853"/><text x="369" y="210" text-anchor="middle" font-size="7" fill="white">C3</text>

  <!-- Client → DataNode arrows -->
  <line x1="55" y1="114" x2="70" y2="167" stroke="#666" stroke-width="1.2" marker-end="url(#ha)"/>
  <text x="35" y="142" font-size="7" fill="#666">② Daten</text>

  <!-- Replication arrows between racks -->
  <path d="M 190 240 Q 210 260 230 240" fill="none" stroke="#34a853" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#hr)"/>
  <text x="210" y="265" text-anchor="middle" font-size="7" fill="#1b5e20">Replikation</text>

  <!-- Legend -->
  <rect x="430" y="145" width="180" height="145" rx="6" fill="#f9f9f9" stroke="#ddd" stroke-width="1.5"/>
  <text x="520" y="165" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Eigenschaften</text>
  <text x="445" y="185" font-size="8" fill="#555">• Chunks: 64–128 MB</text>
  <text x="445" y="200" font-size="8" fill="#555">• Replikation: 3× Standard</text>
  <text x="445" y="215" font-size="8" fill="#555">• Rack-Awareness: mind. 2 Racks</text>
  <text x="445" y="230" font-size="8" fill="#555">• Write-Once, Read-Many</text>
  <text x="445" y="245" font-size="8" fill="#555">• Data Locality für Map-Tasks</text>

  <rect x="448" y="260" width="14" height="10" rx="2" fill="#4285f4"/>
  <text x="470" y="269" font-size="7" fill="#555">Chunk 1</text>
  <rect x="510" y="260" width="14" height="10" rx="2" fill="#f9ab00"/>
  <text x="532" y="269" font-size="7" fill="#555">Chunk 2</text>
  <rect x="572" y="260" width="14" height="10" rx="2" fill="#34a853"/>
  <text x="594" y="269" font-size="7" fill="#555">Chunk 3</text>
</svg>
