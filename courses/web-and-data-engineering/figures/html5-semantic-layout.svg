<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <defs>
    <style>
      .bg { fill: #fffaf3; }
      .page { fill: #ffffff; stroke: #1f2937; stroke-width: 4; }
      .header { fill: #e8f0fe; stroke: #1a5fa8; stroke-width: 4; }
      .nav { fill: #f0fdf4; stroke: #059669; stroke-width: 4; }
      .main { fill: #fff7ed; stroke: #d97706; stroke-width: 4; }
      .article { fill: #fdf2f8; stroke: #be185d; stroke-width: 4; }
      .aside { fill: #f3f4f6; stroke: #4b5563; stroke-width: 4; }
      .footer { fill: #ede9fe; stroke: #7c3aed; stroke-width: 4; }
      .label { font-family: Arial, Helvetica, sans-serif; fill: #111827; font-size: 26px; font-weight: 700; }
      .small { font-family: Arial, Helvetica, sans-serif; fill: #374151; font-size: 20px; }
      .hint { font-family: Arial, Helvetica, sans-serif; fill: #6b7280; font-size: 18px; }
      .arrow { stroke: #94a3b8; stroke-width: 4; stroke-dasharray: 10 8; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="780" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" class="label" font-size="30">Semantische HTML-Seite</text>

  <rect x="120" y="80" width="960" height="620" rx="18" class="page"/>

  <rect x="150" y="110" width="900" height="95" rx="12" class="header"/>
  <text x="190" y="168" class="label">header</text>
  <text x="320" y="168" class="small">Logo / Titel / Einleitung</text>

  <rect x="150" y="225" width="240" height="250" rx="12" class="nav"/>
  <text x="188" y="280" class="label">nav</text>
  <text x="188" y="320" class="small">Start</text>
  <text x="188" y="352" class="small">Produkte</text>
  <text x="188" y="384" class="small">Kontakt</text>
  <text x="188" y="432" class="hint">Navigation</text>

  <rect x="415" y="225" width="355" height="250" rx="12" class="main"/>
  <text x="455" y="280" class="label">main</text>
  <rect x="450" y="305" width="285" height="110" rx="10" class="article"/>
  <text x="475" y="350" class="label" font-size="24">article</text>
  <text x="475" y="386" class="small">Produkttext / Beitrag</text>

  <rect x="790" y="225" width="260" height="250" rx="12" class="aside"/>
  <text x="830" y="280" class="label">aside</text>
  <text x="830" y="320" class="small">Sidebar</text>
  <text x="830" y="352" class="small">Hinweise</text>
  <text x="830" y="384" class="small">Related content</text>

  <rect x="150" y="500" width="900" height="130" rx="12" class="footer"/>
  <text x="190" y="575" class="label">footer</text>
  <text x="320" y="575" class="small">Impressum / Copyright / Kontakt</text>

  <path class="arrow" d="M720 110 C720 70, 540 70, 540 110" />
  <path class="arrow" d="M270 225 C270 205, 270 205, 270 205" />
  <path class="arrow" d="M592 225 C592 205, 592 205, 592 205" />
  <path class="arrow" d="M920 225 C920 205, 920 205, 920 205" />
</svg>
