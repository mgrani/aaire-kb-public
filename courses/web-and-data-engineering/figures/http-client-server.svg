<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#1565c0"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#1b5e20"/>
    </marker>
  </defs>

  <!-- CLIENT -->
  <text x="100" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#1565c0">Client (Browser)</text>
  <rect x="10" y="28" width="180" height="220" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <rect x="25" y="42" width="150" height="108" rx="4" fill="white" stroke="#ccc"/>
  <rect x="25" y="42" width="150" height="18" rx="4" fill="#eee" stroke="#ccc"/>
  <circle cx="38" cy="51" r="3.5" fill="#ea4335"/>
  <circle cx="49" cy="51" r="3.5" fill="#f9ab00"/>
  <circle cx="60" cy="51" r="3.5" fill="#34a853"/>
  <rect x="70" y="46" width="96" height="10" rx="5" fill="white" stroke="#aaa"/>
  <text x="118" y="54" text-anchor="middle" font-size="7" fill="#888">shop.example.com/products/42</text>
  <text x="100" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#333">Funkkopfhörer</text>
  <text x="100" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#c62828">€ 79,99</text>
  <rect x="55" y="120" width="90" height="22" rx="11" fill="#4285f4"/>
  <text x="100" y="135" text-anchor="middle" font-size="10" fill="white">In den Warenkorb</text>
  <text x="100" y="168" text-anchor="middle" font-size="10" fill="#888">⚡ Netzwerk-Tab</text>
  <rect x="25" y="176" width="150" height="14" rx="2" fill="white" stroke="#ccc"/>
  <text x="32" y="186" font-size="8" fill="#4285f4">GET /api/products/42  200 ✓</text>

  <!-- SERVER -->
  <text x="660" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#b71c1c">Server</text>
  <rect x="570" y="28" width="180" height="220" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <rect x="588" y="50" width="144" height="30" rx="4" fill="white" stroke="#ea4335"/>
  <text x="660" y="69" text-anchor="middle" font-size="11" fill="#555">API Router</text>
  <rect x="588" y="90" width="144" height="30" rx="4" fill="white" stroke="#ea4335"/>
  <text x="660" y="109" text-anchor="middle" font-size="11" fill="#555">Geschäftslogik</text>
  <rect x="588" y="130" width="144" height="30" rx="4" fill="white" stroke="#ea4335"/>
  <text x="660" y="149" text-anchor="middle" font-size="11" fill="#555">Datenbank</text>
  <rect x="588" y="170" width="144" height="30" rx="4" fill="white" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="660" y="189" text-anchor="middle" font-size="11" fill="#555">Cache (Redis)</text>

  <!-- REQUEST arrow -->
  <line x1="196" y1="100" x2="564" y2="90" stroke="#1565c0" stroke-width="2.5" marker-end="url(#ab)"/>

  <!-- REQUEST box -->
  <rect x="222" y="50" width="314" height="64" rx="5" fill="white" stroke="#4285f4" stroke-width="1.5"/>
  <rect x="222" y="50" width="314" height="18" rx="5" fill="#4285f4"/>
  <text x="379" y="63" text-anchor="middle" font-size="11" font-weight="700" fill="white">↑ REQUEST</text>
  <text x="234" y="82" font-size="10" font-family="monospace" fill="#1565c0" font-weight="600">GET /api/products/42 HTTP/1.1</text>
  <text x="234" y="96" font-size="10" font-family="monospace" fill="#555">Host: shop.example.com</text>
  <text x="234" y="108" font-size="10" font-family="monospace" fill="#555">Accept: application/json</text>

  <!-- RESPONSE arrow -->
  <line x1="564" y1="185" x2="196" y2="195" stroke="#1b5e20" stroke-width="2.5" marker-end="url(#ag)"/>

  <!-- RESPONSE box -->
  <rect x="222" y="148" width="314" height="82" rx="5" fill="white" stroke="#34a853" stroke-width="1.5"/>
  <rect x="222" y="148" width="314" height="18" rx="5" fill="#34a853"/>
  <text x="379" y="161" text-anchor="middle" font-size="11" font-weight="700" fill="white">↓ RESPONSE</text>
  <text x="234" y="182" font-size="10" font-family="monospace" fill="#1b5e20" font-weight="600">HTTP/1.1 200 OK</text>
  <text x="234" y="196" font-size="10" font-family="monospace" fill="#555">Content-Type: application/json</text>
  <text x="234" y="210" font-size="10" font-family="monospace" fill="#555">Cache-Control: max-age=300</text>
  <text x="234" y="224" font-size="10" font-family="monospace" fill="#888">{"id":42, "name":"Funkkopfhörer"}</text>

  <!-- Infrastructure note -->
  <text x="379" y="268" text-anchor="middle" font-size="10" fill="#bbb">Dazwischen: DNS · CDN/WAF · Load Balancer</text>
</svg>
