<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Anatomie eines HTTP Request-Response-Zyklus</title>
  <desc id="desc">Detaillierte Darstellung eines HTTP Request (Methode, URI, Headers, Body) und Response (Statuscode, Headers, Body) mit Annotationen zu jedem Bestandteil.</desc>
  <rect width="1100" height="500" fill="#ffffff"/>

  <text x="550" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111111">Anatomie: HTTP Request und Response</text>

  <!-- REQUEST SIDE -->
  <rect x="30" y="55" width="500" height="420" rx="14" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="280" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1a73e8">↑ REQUEST</text>

  <!-- Request Line -->
  <rect x="50" y="95" width="460" height="45" rx="8" fill="#ffffff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="60" y="115" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#1a73e8">POST</text>
  <text x="105" y="115" font-family="'Courier New', monospace" font-size="14" fill="#333">/api/orders</text>
  <text x="250" y="115" font-family="'Courier New', monospace" font-size="14" fill="#888">HTTP/1.1</text>
  <text x="60" y="133" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666">Methode          URI (Ressource)          Version</text>

  <!-- Bracket annotation -->
  <text x="460" y="125" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#4285f4">← Startzeile</text>

  <!-- Headers -->
  <rect x="50" y="150" width="460" height="140" rx="8" fill="#ffffff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="460" y="170" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#4285f4">← Headers</text>

  <g font-family="'Courier New', monospace" font-size="12">
    <text x="65" y="175" fill="#333"><tspan font-weight="700" fill="#1a73e8">Host:</tspan> shop.example.com</text>
    <text x="65" y="197" fill="#333"><tspan font-weight="700" fill="#1a73e8">Content-Type:</tspan> application/json</text>
    <text x="65" y="219" fill="#333"><tspan font-weight="700" fill="#1a73e8">Authorization:</tspan> Bearer eyJhbGci...</text>
    <text x="65" y="241" fill="#333"><tspan font-weight="700" fill="#1a73e8">Accept:</tspan> application/json</text>
    <text x="65" y="263" fill="#333"><tspan font-weight="700" fill="#1a73e8">Idempotency-Key:</tspan> 7f3a-b2c1</text>
  </g>

  <!-- Annotations for headers -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#888">
    <text x="350" y="175">Zielserver</text>
    <text x="350" y="197">Format des Body</text>
    <text x="350" y="219">Authentifizierung</text>
    <text x="350" y="241">Gewünschtes Format</text>
    <text x="350" y="263">Schutz vor Doppel-Send</text>
  </g>

  <!-- Blank line -->
  <line x1="50" y1="298" x2="510" y2="298" stroke="#ddd" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="280" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#999">Leerzeile (trennt Header von Body)</text>

  <!-- Body -->
  <rect x="50" y="320" width="460" height="80" rx="8" fill="#ffffff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="460" y="340" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#4285f4">← Body</text>
  <text x="65" y="355" font-family="'Courier New', monospace" font-size="12" fill="#333">{"product_id": 42, "quantity": 2}</text>
  <text x="65" y="385" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#888">Nur bei POST, PUT, PATCH — nicht bei GET, DELETE</text>

  <!-- Arrow -->
  <g transform="translate(540, 220)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#666" stroke-width="3"/>
    <polygon points="30,-6 42,0 30,6" fill="#666"/>
    <text x="21" y="20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">Netzwerk</text>
  </g>

  <!-- RESPONSE SIDE -->
  <rect x="590" y="55" width="490" height="420" rx="14" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="835" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1e8e3e">↓ RESPONSE</text>

  <!-- Status Line -->
  <rect x="610" y="95" width="450" height="45" rx="8" fill="#ffffff" stroke="#34a853" stroke-width="1.5"/>
  <text x="620" y="115" font-family="'Courier New', monospace" font-size="14" fill="#888">HTTP/1.1</text>
  <text x="710" y="115" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#1e8e3e">201</text>
  <text x="745" y="115" font-family="'Courier New', monospace" font-size="14" fill="#333">Created</text>
  <text x="620" y="133" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666">Version         Code     Reason Phrase</text>

  <text x="1010" y="125" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#34a853">Statuszeile →</text>

  <!-- Response Headers -->
  <rect x="610" y="150" width="450" height="140" rx="8" fill="#ffffff" stroke="#34a853" stroke-width="1.5"/>
  <text x="1010" y="170" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#34a853">Headers →</text>

  <g font-family="'Courier New', monospace" font-size="12">
    <text x="625" y="175" fill="#333"><tspan font-weight="700" fill="#1e8e3e">Content-Type:</tspan> application/json</text>
    <text x="625" y="197" fill="#333"><tspan font-weight="700" fill="#1e8e3e">Location:</tspan> /api/orders/789</text>
    <text x="625" y="219" fill="#333"><tspan font-weight="700" fill="#1e8e3e">Cache-Control:</tspan> no-store</text>
    <text x="625" y="241" fill="#333"><tspan font-weight="700" fill="#1e8e3e">ETag:</tspan> "e5f7a3b1"</text>
    <text x="625" y="263" fill="#333"><tspan font-weight="700" fill="#1e8e3e">X-Request-Id:</tspan> req-9f8e7d6c</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#888">
    <text x="900" y="175">Format des Body</text>
    <text x="900" y="197">URI der neuen Ressource</text>
    <text x="900" y="219">Nicht cachen!</text>
    <text x="900" y="241">Fingerprint für Validierung</text>
    <text x="900" y="263">Debugging / Tracing</text>
  </g>

  <!-- Blank line -->
  <line x1="610" y1="298" x2="1060" y2="298" stroke="#ddd" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Response Body -->
  <rect x="610" y="320" width="450" height="80" rx="8" fill="#ffffff" stroke="#34a853" stroke-width="1.5"/>
  <text x="1010" y="340" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#34a853">Body →</text>
  <g font-family="'Courier New', monospace" font-size="12" fill="#333">
    <text x="625" y="355">{"id": 789, "status": "pending",</text>
    <text x="625" y="372"> "total": 159.98,</text>
    <text x="625" y="389"> "created_at": "2026-04-04T10:30:00Z"}</text>
  </g>

  <!-- Status code color legend -->
  <g transform="translate(590, 425)">
    <rect x="0" y="0" width="50" height="18" rx="4" fill="#e6f4ea" stroke="#34a853" stroke-width="1"/>
    <text x="25" y="13" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#1e8e3e">2xx</text>
    <text x="55" y="13" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666">Erfolg</text>

    <rect x="110" y="0" width="50" height="18" rx="4" fill="#e8f0fe" stroke="#4285f4" stroke-width="1"/>
    <text x="135" y="13" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#1a73e8">3xx</text>
    <text x="165" y="13" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666">Redirect</text>

    <rect x="240" y="0" width="50" height="18" rx="4" fill="#fef7e0" stroke="#f9ab00" stroke-width="1"/>
    <text x="265" y="13" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#e37400">4xx</text>
    <text x="295" y="13" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666">Client-Fehler</text>

    <rect x="380" y="0" width="50" height="18" rx="4" fill="#fce8e6" stroke="#ea4335" stroke-width="1"/>
    <text x="405" y="13" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#c5221f">5xx</text>
    <text x="435" y="13" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666">Server-Fehler</text>
  </g>
</svg>