<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <!-- Client -->
  <rect x="20" y="60" width="180" height="300" rx="12" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="110" y="45" text-anchor="middle" font-size="16" font-weight="600" fill="#1565c0">Client (Browser)</text>

  <!-- Browser window mockup -->
  <rect x="35" y="80" width="150" height="100" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <rect x="35" y="80" width="150" height="16" rx="4" fill="#eee" stroke="#ccc" stroke-width="1"/>
  <circle cx="47" cy="88" r="3" fill="#ea4335"/>
  <circle cx="57" cy="88" r="3" fill="#f9ab00"/>
  <circle cx="67" cy="88" r="3" fill="#34a853"/>
  <text x="110" y="88" text-anchor="middle" font-size="7" fill="#888">shop.example.com/products/42</text>
  <text x="110" y="120" text-anchor="middle" font-size="11" fill="#333">Funkkopfhörer</text>
  <text x="110" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="#e63946">€ 79,99</text>
  <rect x="65" y="150" width="90" height="22" rx="4" fill="#4285f4"/>
  <text x="110" y="165" text-anchor="middle" font-size="10" fill="#fff">In den Warenkorb</text>

  <!-- Server -->
  <rect x="600" y="60" width="180" height="300" rx="12" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="690" y="45" text-anchor="middle" font-size="16" font-weight="600" fill="#c62828">Server</text>

  <!-- Server internals -->
  <rect x="620" y="85" width="140" height="35" rx="4" fill="#fff" stroke="#ea4335" stroke-width="1"/>
  <text x="690" y="107" text-anchor="middle" font-size="11" fill="#555">API Router</text>
  <rect x="620" y="130" width="140" height="35" rx="4" fill="#fff" stroke="#ea4335" stroke-width="1"/>
  <text x="690" y="152" text-anchor="middle" font-size="11" fill="#555">Geschäftslogik</text>
  <rect x="620" y="175" width="140" height="35" rx="4" fill="#fff" stroke="#ea4335" stroke-width="1"/>
  <text x="690" y="197" text-anchor="middle" font-size="11" fill="#555">Datenbank</text>

  <!-- Request arrow -->
  <path d="M200 160 L595 100" fill="none" stroke="#4285f4" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- Request box -->
  <rect x="270" y="55" width="260" height="85" rx="6" fill="#fff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="280" y="73" font-size="12" font-weight="600" fill="#4285f4">REQUEST</text>
  <text x="280" y="90" font-size="10" font-family="monospace" fill="#333">GET /api/products/42 HTTP/1.1</text>
  <text x="280" y="104" font-size="10" font-family="monospace" fill="#666">Host: shop.example.com</text>
  <text x="280" y="118" font-size="10" font-family="monospace" fill="#666">Accept: application/json</text>
  <text x="280" y="132" font-size="10" font-family="monospace" fill="#666">Cookie: session=abc123</text>

  <!-- Response arrow -->
  <path d="M595 260 L200 320" fill="none" stroke="#34a853" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- Response box -->
  <rect x="270" y="240" width="260" height="120" rx="6" fill="#fff" stroke="#34a853" stroke-width="1.5"/>
  <text x="280" y="258" font-size="12" font-weight="600" fill="#34a853">RESPONSE</text>
  <text x="280" y="275" font-size="10" font-family="monospace" fill="#333">HTTP/1.1 200 OK</text>
  <text x="280" y="289" font-size="10" font-family="monospace" fill="#666">Content-Type: application/json</text>
  <text x="280" y="303" font-size="10" font-family="monospace" fill="#666">Cache-Control: max-age=300</text>
  <text x="280" y="317" font-size="10" font-family="monospace" fill="#666">ETag: "f7e3a1b2"</text>
  <text x="280" y="335" font-size="10" font-family="monospace" fill="#888">{"id":42, "name":"Kopfhörer",</text>
  <text x="280" y="349" font-size="10" font-family="monospace" fill="#888"> "price":79.99}</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7" fill="#4285f4"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7" fill="#34a853"/>
    </marker>
  </defs>
</svg>
