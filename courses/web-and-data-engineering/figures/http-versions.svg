<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ag" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0,0 7,2.5 0,5" fill="#666"/></marker>
    <marker id="ab" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0,0 7,2.5 0,5" fill="#1565c0"/></marker>
    <marker id="agr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0,0 7,2.5 0,5" fill="#1b5e20"/></marker>
  </defs>

  <!-- Panel backgrounds -->
  <rect x="2" y="2" width="242" height="306" rx="6" fill="#f9f9f9" stroke="#ccc" stroke-width="1.5"/>
  <rect x="260" y="2" width="238" height="306" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <rect x="514" y="2" width="244" height="306" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>

  <!-- Panel headers -->
  <rect x="2" y="2" width="242" height="34" rx="6" fill="#555"/>
  <text x="123" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="white">HTTP/1.1</text>
  <text x="123" y="48" text-anchor="middle" font-size="10" fill="#888">Sequentiell · TCP</text>

  <rect x="260" y="2" width="238" height="34" rx="6" fill="#4285f4"/>
  <text x="379" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="white">HTTP/2</text>
  <text x="379" y="48" text-anchor="middle" font-size="10" fill="#1565c0">Multiplexing · TCP</text>

  <rect x="514" y="2" width="244" height="34" rx="6" fill="#34a853"/>
  <text x="636" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="white">HTTP/3</text>
  <text x="636" y="48" text-anchor="middle" font-size="10" fill="#1b5e20">QUIC · UDP · 0-RTT</text>

  <!-- Column labels -->
  <text x="42" y="66" text-anchor="middle" font-size="9" font-weight="600" fill="#666">Browser</text>
  <text x="202" y="66" text-anchor="middle" font-size="9" font-weight="600" fill="#666">Server</text>
  <text x="299" y="66" text-anchor="middle" font-size="9" font-weight="600" fill="#1565c0">Browser</text>
  <text x="459" y="66" text-anchor="middle" font-size="9" font-weight="600" fill="#1565c0">Server</text>
  <text x="554" y="66" text-anchor="middle" font-size="9" font-weight="600" fill="#1b5e20">Browser</text>
  <text x="716" y="66" text-anchor="middle" font-size="9" font-weight="600" fill="#1b5e20">Server</text>

  <!-- Timeline lines -->
  <line x1="42"  y1="70" x2="42"  y2="278" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="202" y1="70" x2="202" y2="278" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="299" y1="70" x2="299" y2="278" stroke="#4285f4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="459" y1="70" x2="459" y2="278" stroke="#4285f4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="554" y1="70" x2="554" y2="278" stroke="#34a853" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="716" y1="70" x2="716" y2="278" stroke="#34a853" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- HTTP/1.1: Sequential -->
  <line x1="42"  y1="88"  x2="196" y2="88"  stroke="#555" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="122" y="84" text-anchor="middle" font-size="8" fill="#333">GET /style.css</text>
  <line x1="202" y1="104" x2="48"  y2="104" stroke="#888" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="122" y="117" text-anchor="middle" font-size="8" fill="#666">200 OK</text>

  <!-- Wait indicator 1 -->
  <rect x="14" y="108" width="22" height="28" rx="3" fill="#fff3cd" stroke="#f9ab00"/>
  <text x="25" y="127" text-anchor="middle" font-size="9" fill="#b06000">⏳</text>

  <line x1="42"  y1="140" x2="196" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="122" y="136" text-anchor="middle" font-size="8" fill="#333">GET /app.js</text>
  <line x1="202" y1="156" x2="48"  y2="156" stroke="#888" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="122" y="169" text-anchor="middle" font-size="8" fill="#666">200 OK</text>

  <!-- Wait indicator 2 -->
  <rect x="14" y="160" width="22" height="28" rx="3" fill="#fff3cd" stroke="#f9ab00"/>
  <text x="25" y="179" text-anchor="middle" font-size="9" fill="#b06000">⏳</text>

  <line x1="42"  y1="192" x2="196" y2="192" stroke="#555" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="122" y="188" text-anchor="middle" font-size="8" fill="#333">GET /logo.png</text>
  <line x1="202" y1="208" x2="48"  y2="208" stroke="#888" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="122" y="221" text-anchor="middle" font-size="8" fill="#666">200 OK</text>

  <rect x="20" y="240" width="205" height="30" rx="4" fill="#fce8e6" stroke="#ea4335"/>
  <text x="122" y="254" text-anchor="middle" font-size="9" font-weight="600" fill="#c62828">Head-of-Line Blocking</text>
  <text x="122" y="265" text-anchor="middle" font-size="8" fill="#888">jeder Request wartet auf den vorigen</text>

  <!-- HTTP/2: Parallel streams -->
  <line x1="299" y1="88"  x2="453" y2="88"  stroke="#1565c0" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="376" y="84" text-anchor="middle" font-size="8" fill="#1565c0">Stream 1: GET /style.css</text>
  <line x1="299" y1="102" x2="453" y2="102" stroke="#1565c0" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="376" y="115" text-anchor="middle" font-size="8" fill="#1565c0">Stream 2: GET /app.js</text>
  <line x1="299" y1="116" x2="453" y2="116" stroke="#1565c0" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="376" y="129" text-anchor="middle" font-size="8" fill="#1565c0">Stream 3: GET /logo.png</text>

  <line x1="459" y1="155" x2="305" y2="155" stroke="#4285f4" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="459" y1="167" x2="305" y2="167" stroke="#4285f4" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="459" y1="179" x2="305" y2="179" stroke="#4285f4" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="382" y="164" text-anchor="middle" font-size="8" fill="#4285f4">200 Responses (parallel)</text>

  <rect x="271" y="205" width="216" height="22" rx="3" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="379" y="219" text-anchor="middle" font-size="9" fill="#1565c0">HPACK Header-Kompression</text>

  <rect x="271" y="240" width="216" height="30" rx="4" fill="#e6f4ea" stroke="#34a853"/>
  <text x="379" y="254" text-anchor="middle" font-size="9" font-weight="600" fill="#1b5e20">Kein Head-of-Line Blocking</text>
  <text x="379" y="265" text-anchor="middle" font-size="8" fill="#555">1 TCP · N parallele Streams</text>

  <!-- HTTP/3: QUIC -->
  <rect x="522" y="72" width="186" height="22" rx="3" fill="#e6f4ea" stroke="#34a853"/>
  <text x="615" y="87" text-anchor="middle" font-size="9" font-weight="700" fill="#1b5e20">0-RTT: sofortiger Start</text>

  <line x1="554" y1="106" x2="710" y2="106" stroke="#1b5e20" stroke-width="1.5" marker-end="url(#agr)"/>
  <text x="632" y="102" text-anchor="middle" font-size="8" fill="#1b5e20">GET /style.css</text>
  <line x1="554" y1="118" x2="710" y2="118" stroke="#1b5e20" stroke-width="1.5" marker-end="url(#agr)"/>
  <text x="632" y="131" text-anchor="middle" font-size="8" fill="#1b5e20">GET /app.js</text>
  <line x1="554" y1="130" x2="710" y2="130" stroke="#1b5e20" stroke-width="1.5" marker-end="url(#agr)"/>

  <line x1="716" y1="155" x2="560" y2="155" stroke="#34a853" stroke-width="1.5" marker-end="url(#agr)"/>
  <line x1="716" y1="165" x2="560" y2="165" stroke="#34a853" stroke-width="1.5" marker-end="url(#agr)"/>
  <line x1="716" y1="175" x2="560" y2="175" stroke="#34a853" stroke-width="1.5" marker-end="url(#agr)"/>
  <text x="638" y="164" text-anchor="middle" font-size="8" fill="#34a853">200 Responses</text>

  <rect x="522" y="205" width="186" height="22" rx="3" fill="#e6f4ea" stroke="#34a853"/>
  <text x="615" y="219" text-anchor="middle" font-size="9" fill="#1b5e20">QUIC über UDP (kein TCP)</text>

  <rect x="522" y="240" width="186" height="30" rx="4" fill="#e6f4ea" stroke="#34a853"/>
  <text x="615" y="254" text-anchor="middle" font-size="9" font-weight="600" fill="#1b5e20">Kein Head-of-Line Blocking</text>
  <text x="615" y="265" text-anchor="middle" font-size="8" fill="#555">UDP · paketverlusttolerant</text>
</svg>
