<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" font-family="Source Sans Pro, Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="jpa-title jpa-desc">
  <title id="jpa-title">JPA Object-Relational Mapping</title>
  <desc id="jpa-desc">Links: Java-Klasse mit JPA-Annotationen (@Entity, @Id, @ManyToOne). Rechts: zugehörige Datenbanktabelle PRODUCT mit Spalten ID, NAME, PRICE, CAT_ID. Pfeile zeigen automatisches Mapping und JPQL-Abfragen.</desc>
  <defs>
    <marker id="ja" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#666"/></marker>
  </defs>

  <text x="310" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#333">JPA: Object-Relational Mapping</text>

  <!-- Java Object side -->
  <rect x="10" y="40" width="250" height="210" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <rect x="10" y="40" width="250" height="24" rx="8" fill="#4285f4"/>
  <text x="135" y="57" text-anchor="middle" font-size="11" font-weight="700" fill="white">Java-Klasse (@Entity)</text>

  <text x="25" y="82" font-size="10" font-weight="700" fill="#1565c0" font-family="monospace">@Entity</text>
  <text x="25" y="98" font-size="10" fill="#555" font-family="monospace">public class Product {</text>

  <text x="35" y="118" font-size="9" fill="#6a1b9a" font-family="monospace">@Id @GeneratedValue</text>
  <text x="35" y="132" font-size="9" fill="#555" font-family="monospace">private Long id;</text>

  <text x="35" y="152" font-size="9" fill="#555" font-family="monospace">private String name;</text>

  <text x="35" y="172" font-size="9" fill="#555" font-family="monospace">private double price;</text>

  <text x="35" y="195" font-size="9" fill="#6a1b9a" font-family="monospace">@ManyToOne</text>
  <text x="35" y="209" font-size="9" fill="#555" font-family="monospace">private Category cat;</text>

  <text x="25" y="230" font-size="10" fill="#555" font-family="monospace">}</text>

  <!-- Arrow area -->
  <text x="310" y="90" text-anchor="middle" font-size="9" font-weight="600" fill="#333">JPA / Hibernate</text>
  <line x1="270" y1="130" x2="348" y2="130" stroke="#666" stroke-width="2" marker-end="url(#ja)"/>
  <text x="310" y="120" text-anchor="middle" font-size="8" fill="#555">automatisches</text>
  <text x="310" y="145" text-anchor="middle" font-size="8" fill="#555">Mapping</text>

  <line x1="348" y1="190" x2="270" y2="190" stroke="#666" stroke-width="2" marker-end="url(#ja)"/>
  <text x="310" y="180" text-anchor="middle" font-size="8" fill="#555">Abfragen</text>
  <text x="310" y="205" text-anchor="middle" font-size="8" fill="#555">(JPQL / Criteria)</text>

  <!-- Database Table side -->
  <rect x="360" y="40" width="250" height="210" rx="8" fill="#fff3cd" stroke="#f9ab00" stroke-width="2"/>
  <rect x="360" y="40" width="250" height="24" rx="8" fill="#f9ab00"/>
  <text x="485" y="57" text-anchor="middle" font-size="11" font-weight="700" fill="white">Datenbank-Tabelle</text>

  <!-- Table header -->
  <rect x="375" y="75" width="220" height="20" rx="3" fill="#f9ab00" fill-opacity="0.3"/>
  <text x="405" y="89" font-size="9" font-weight="700" fill="#b06000">PRODUCT</text>

  <!-- Table columns -->
  <rect x="375" y="98" width="220" height="18" rx="0" fill="white" stroke="#ddd"/>
  <text x="385" y="111" font-size="8" fill="#555">ID</text>
  <text x="445" y="111" font-size="8" fill="#555">BIGINT (PK, AUTO)</text>

  <rect x="375" y="118" width="220" height="18" rx="0" fill="#fafafa" stroke="#ddd"/>
  <text x="385" y="131" font-size="8" fill="#555">NAME</text>
  <text x="445" y="131" font-size="8" fill="#555">VARCHAR(255)</text>

  <rect x="375" y="138" width="220" height="18" rx="0" fill="white" stroke="#ddd"/>
  <text x="385" y="151" font-size="8" fill="#555">PRICE</text>
  <text x="445" y="151" font-size="8" fill="#555">DOUBLE</text>

  <rect x="375" y="158" width="220" height="18" rx="0" fill="#fafafa" stroke="#ddd"/>
  <text x="385" y="171" font-size="8" fill="#555">CAT_ID</text>
  <text x="445" y="171" font-size="8" fill="#555">BIGINT (FK → CATEGORY)</text>

  <!-- Benefits -->
  <text x="385" y="200" font-size="9" fill="#1b5e20" font-weight="600">Vorteile ORM:</text>
  <text x="385" y="215" font-size="8" fill="#555">• Kein SQL-Code im Java</text>
  <text x="385" y="228" font-size="8" fill="#555">• Schema aus Klassen generierbar</text>
  <text x="385" y="241" font-size="8" fill="#555">• Automatisches Caching (L1/L2)</text>

  <!-- Annotations legend -->
  <text x="310" y="270" text-anchor="middle" font-size="8" fill="#888" font-style="italic">@Entity, @Id, @ManyToOne, @OneToMany, @Column — JPA-Annotationen steuern das Mapping</text>
</svg>
