<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ka" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#666"/></marker>
    <marker id="kf" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#b71c1c"/></marker>
  </defs>

  <text x="380" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#333">KDD-Prozess (Knowledge Discovery in Databases)</text>

  <!-- Step 1: Raw Data -->
  <rect x="10" y="45" width="100" height="55" rx="6" fill="#f9f9f9" stroke="#999" stroke-width="1.5"/>
  <text x="60" y="65" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Rohdaten</text>
  <text x="60" y="80" text-anchor="middle" font-size="8" fill="#555">DB, Dateien,</text>
  <text x="60" y="92" text-anchor="middle" font-size="8" fill="#555">Logs, APIs</text>

  <!-- Step 2: Selection -->
  <rect x="140" y="45" width="100" height="55" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="190" y="65" text-anchor="middle" font-size="10" font-weight="700" fill="#1565c0">Selection</text>
  <text x="190" y="80" text-anchor="middle" font-size="8" fill="#555">Relevante Daten</text>
  <text x="190" y="92" text-anchor="middle" font-size="8" fill="#555">auswählen</text>

  <!-- Step 3: Preprocessing -->
  <rect x="270" y="45" width="100" height="55" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="320" y="62" text-anchor="middle" font-size="10" font-weight="700" fill="#1b5e20">Preprocessing</text>
  <text x="320" y="80" text-anchor="middle" font-size="8" fill="#555">Bereinigen,</text>
  <text x="320" y="92" text-anchor="middle" font-size="8" fill="#555">Normalisieren</text>

  <!-- Step 4: Transformation -->
  <rect x="400" y="45" width="100" height="55" rx="6" fill="#fff3cd" stroke="#f9ab00" stroke-width="2"/>
  <text x="450" y="62" text-anchor="middle" font-size="10" font-weight="700" fill="#b06000">Trans-</text>
  <text x="450" y="76" text-anchor="middle" font-size="10" font-weight="700" fill="#b06000">formation</text>
  <text x="450" y="92" text-anchor="middle" font-size="8" fill="#555">Features ableiten</text>

  <!-- Step 5: Data Mining -->
  <rect x="530" y="45" width="100" height="55" rx="6" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2.5"/>
  <text x="580" y="65" text-anchor="middle" font-size="10" font-weight="700" fill="#6a1b9a">Data Mining</text>
  <text x="580" y="80" text-anchor="middle" font-size="8" fill="#555">Muster finden</text>
  <text x="580" y="92" text-anchor="middle" font-size="8" fill="#555">Algorithmen</text>

  <!-- Step 6: Interpretation / Knowledge -->
  <rect x="660" y="45" width="90" height="55" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="705" y="62" text-anchor="middle" font-size="10" font-weight="700" fill="#1b5e20">Interpretation</text>
  <text x="705" y="80" text-anchor="middle" font-size="8" fill="#555">→ Wissen</text>
  <text x="705" y="92" text-anchor="middle" font-size="8" fill="#555">Validieren</text>

  <!-- Forward arrows -->
  <line x1="114" y1="72" x2="135" y2="72" stroke="#666" stroke-width="1.5" marker-end="url(#ka)"/>
  <line x1="244" y1="72" x2="265" y2="72" stroke="#666" stroke-width="1.5" marker-end="url(#ka)"/>
  <line x1="374" y1="72" x2="395" y2="72" stroke="#666" stroke-width="1.5" marker-end="url(#ka)"/>
  <line x1="504" y1="72" x2="525" y2="72" stroke="#666" stroke-width="1.5" marker-end="url(#ka)"/>
  <line x1="634" y1="72" x2="655" y2="72" stroke="#666" stroke-width="1.5" marker-end="url(#ka)"/>

  <!-- Feedback loop -->
  <path d="M 660 105 Q 660 150 380 155 Q 140 160 140 105" fill="none" stroke="#b71c1c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#kf)"/>
  <text x="380" y="170" text-anchor="middle" font-size="9" fill="#b71c1c" font-weight="600">Iterativer Prozess — Erkenntnisse führen zu Überarbeitung früherer Schritte</text>

  <!-- Bottom annotations -->
  <rect x="10" y="185" width="740" height="3" rx="1" fill="#eee"/>
  <text x="60" y="198" text-anchor="middle" font-size="7" fill="#888">Datenquellen</text>
  <text x="190" y="198" text-anchor="middle" font-size="7" fill="#888">Zieldaten</text>
  <text x="320" y="198" text-anchor="middle" font-size="7" fill="#888">Bereinigte Daten</text>
  <text x="450" y="198" text-anchor="middle" font-size="7" fill="#888">Transformierte Daten</text>
  <text x="580" y="198" text-anchor="middle" font-size="7" fill="#888">Muster / Modelle</text>
  <text x="705" y="198" text-anchor="middle" font-size="7" fill="#888">Wissen</text>
</svg>
