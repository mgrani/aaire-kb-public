<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="lka" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#666"/></marker>
    <marker id="lkd" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#b71c1c"/></marker>
  </defs>

  <!-- Lambda Architecture (top half) -->
  <text x="380" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#333">Lambda- vs. Kappa-Architektur</text>

  <rect x="5" y="32" width="370" height="140" rx="6" fill="#f9f9f9" stroke="#ddd" stroke-width="1.5"/>
  <text x="190" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Lambda-Architektur</text>

  <!-- Lambda: Source -->
  <rect x="15" y="65" width="65" height="35" rx="4" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="47" y="82" text-anchor="middle" font-size="8" font-weight="600" fill="#6a1b9a">Daten-</text>
  <text x="47" y="93" text-anchor="middle" font-size="8" font-weight="600" fill="#6a1b9a">quellen</text>

  <!-- Lambda: Batch Layer -->
  <rect x="105" y="58" width="100" height="30" rx="4" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="155" y="77" text-anchor="middle" font-size="9" font-weight="700" fill="#1565c0">Batch Layer</text>

  <!-- Lambda: Speed Layer -->
  <rect x="105" y="95" width="100" height="30" rx="4" fill="#fff3cd" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="155" y="114" text-anchor="middle" font-size="9" font-weight="700" fill="#b06000">Speed Layer</text>

  <!-- Lambda: Serving -->
  <rect x="230" y="70" width="80" height="50" rx="4" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="270" y="92" text-anchor="middle" font-size="9" font-weight="700" fill="#1b5e20">Serving</text>
  <text x="270" y="108" text-anchor="middle" font-size="8" fill="#555">Merge</text>

  <!-- Lambda: Query -->
  <rect x="330" y="78" width="35" height="30" rx="4" fill="white" stroke="#999"/>
  <text x="347" y="97" text-anchor="middle" font-size="8" fill="#555">API</text>

  <!-- Lambda arrows -->
  <line x1="84" y1="77" x2="100" y2="73" stroke="#666" stroke-width="1.2" marker-end="url(#lka)"/>
  <line x1="84" y1="87" x2="100" y2="107" stroke="#666" stroke-width="1.2" marker-end="url(#lka)"/>
  <line x1="209" y1="73" x2="225" y2="85" stroke="#666" stroke-width="1.2" marker-end="url(#lka)"/>
  <line x1="209" y1="110" x2="225" y2="102" stroke="#666" stroke-width="1.2" marker-end="url(#lka)"/>
  <line x1="314" y1="95" x2="325" y2="93" stroke="#666" stroke-width="1.2" marker-end="url(#lka)"/>

  <!-- Lambda labels -->
  <text x="155" y="142" text-anchor="middle" font-size="8" fill="#1565c0">Spark / Hadoop (exakt, verzögert)</text>
  <text x="155" y="155" text-anchor="middle" font-size="8" fill="#b06000">Flink / Kafka (schnell, approximiert)</text>
  <text x="155" y="167" text-anchor="middle" font-size="8" fill="#b71c1c" font-weight="600">⚠ Doppelte Codebasis!</text>

  <!-- Kappa Architecture (right half) -->
  <rect x="385" y="32" width="370" height="140" rx="6" fill="#f9f9f9" stroke="#ddd" stroke-width="1.5"/>
  <text x="570" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Kappa-Architektur</text>

  <!-- Kappa: Source -->
  <rect x="395" y="75" width="65" height="35" rx="4" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="427" y="92" text-anchor="middle" font-size="8" font-weight="600" fill="#6a1b9a">Daten-</text>
  <text x="427" y="103" text-anchor="middle" font-size="8" font-weight="600" fill="#6a1b9a">quellen</text>

  <!-- Kappa: Event Log -->
  <rect x="485" y="68" width="90" height="50" rx="4" fill="#fff3cd" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="530" y="87" text-anchor="middle" font-size="9" font-weight="700" fill="#b06000">Event Log</text>
  <text x="530" y="101" text-anchor="middle" font-size="8" fill="#555">Kafka</text>
  <text x="530" y="112" text-anchor="middle" font-size="8" fill="#555">(persistent)</text>

  <!-- Kappa: Stream Processor -->
  <rect x="600" y="62" width="80" height="38" rx="4" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="640" y="79" text-anchor="middle" font-size="9" font-weight="700" fill="#1565c0">Stream</text>
  <text x="640" y="92" text-anchor="middle" font-size="9" font-weight="700" fill="#1565c0">Processor</text>

  <!-- Kappa: Serving -->
  <rect x="705" y="68" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="725" y="87" text-anchor="middle" font-size="8" font-weight="700" fill="#1b5e20">API</text>

  <!-- Kappa: Replay arrow -->
  <path d="M 600 104 Q 560 130 530 122" fill="none" stroke="#b71c1c" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#lkd)"/>
  <text x="562" y="135" text-anchor="middle" font-size="7" fill="#b71c1c">Replay</text>

  <!-- Kappa arrows -->
  <line x1="464" y1="92" x2="480" y2="92" stroke="#666" stroke-width="1.2" marker-end="url(#lka)"/>
  <line x1="579" y1="87" x2="595" y2="82" stroke="#666" stroke-width="1.2" marker-end="url(#lka)"/>
  <line x1="684" y1="82" x2="700" y2="82" stroke="#666" stroke-width="1.2" marker-end="url(#lka)"/>

  <!-- Kappa labels -->
  <text x="570" y="148" text-anchor="middle" font-size="8" fill="#1565c0">Eine Codebasis für alles</text>
  <text x="570" y="161" text-anchor="middle" font-size="8" fill="#555">Replay bei Logik-Änderungen</text>

  <!-- Comparison table -->
  <rect x="30" y="185" width="700" height="145" rx="6" fill="white" stroke="#ddd" stroke-width="1.5"/>

  <!-- Table header -->
  <rect x="30" y="185" width="700" height="22" rx="6" fill="#333"/>
  <text x="150" y="200" text-anchor="middle" font-size="10" font-weight="700" fill="white">Aspekt</text>
  <text x="380" y="200" text-anchor="middle" font-size="10" font-weight="700" fill="white">Lambda</text>
  <text x="600" y="200" text-anchor="middle" font-size="10" font-weight="700" fill="white">Kappa</text>

  <!-- Separator lines -->
  <line x1="260" y1="185" x2="260" y2="330" stroke="#ddd"/>
  <line x1="490" y1="185" x2="490" y2="330" stroke="#ddd"/>
  <line x1="30" y1="230" x2="730" y2="230" stroke="#eee"/>
  <line x1="30" y1="255" x2="730" y2="255" stroke="#eee"/>
  <line x1="30" y1="280" x2="730" y2="280" stroke="#eee"/>
  <line x1="30" y1="305" x2="730" y2="305" stroke="#eee"/>

  <!-- Row 1 -->
  <text x="150" y="222" text-anchor="middle" font-size="9" fill="#333">Verarbeitungspfade</text>
  <text x="380" y="222" text-anchor="middle" font-size="9" fill="#555">Zwei (Batch + Stream)</text>
  <text x="600" y="222" text-anchor="middle" font-size="9" fill="#555">Einer (nur Stream)</text>

  <!-- Row 2 -->
  <text x="150" y="247" text-anchor="middle" font-size="9" fill="#333">Codebasis</text>
  <text x="380" y="247" text-anchor="middle" font-size="9" fill="#b71c1c">Doppelt</text>
  <text x="600" y="247" text-anchor="middle" font-size="9" fill="#1b5e20">Einfach</text>

  <!-- Row 3 -->
  <text x="150" y="272" text-anchor="middle" font-size="9" fill="#333">Historische Daten</text>
  <text x="380" y="272" text-anchor="middle" font-size="9" fill="#555">Batch Layer</text>
  <text x="600" y="272" text-anchor="middle" font-size="9" fill="#555">Replay aus Event-Log</text>

  <!-- Row 4 -->
  <text x="150" y="297" text-anchor="middle" font-size="9" fill="#333">Betriebsaufwand</text>
  <text x="380" y="297" text-anchor="middle" font-size="9" fill="#b71c1c">Hoch</text>
  <text x="600" y="297" text-anchor="middle" font-size="9" fill="#1b5e20">Geringer</text>

  <!-- Row 5 -->
  <text x="150" y="322" text-anchor="middle" font-size="9" fill="#333">Genauigkeit (historisch)</text>
  <text x="380" y="322" text-anchor="middle" font-size="9" fill="#1b5e20">Exakt</text>
  <text x="600" y="322" text-anchor="middle" font-size="9" fill="#555">Abhängig von Log-Tiefe</text>
</svg>
