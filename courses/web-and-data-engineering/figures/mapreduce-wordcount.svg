<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ma" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#666"/></marker>
  </defs>

  <text x="380" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#333">MapReduce: Word Count Beispiel</text>

  <!-- Input -->
  <rect x="10" y="40" width="110" height="70" rx="6" fill="#f9f9f9" stroke="#999" stroke-width="1.5"/>
  <text x="65" y="58" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Input (HDFS)</text>
  <rect x="20" y="65" width="90" height="16" rx="3" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="65" y="77" text-anchor="middle" font-size="8" fill="#1565c0">"hello world hello"</text>
  <rect x="20" y="84" width="90" height="16" rx="3" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="65" y="96" text-anchor="middle" font-size="8" fill="#1565c0">"world foo hello"</text>

  <!-- Map Phase -->
  <rect x="160" y="35" width="140" height="115" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <rect x="160" y="35" width="140" height="22" rx="6" fill="#4285f4"/>
  <text x="230" y="51" text-anchor="middle" font-size="11" font-weight="700" fill="white">Map Phase</text>

  <text x="175" y="72" font-size="9" font-weight="600" fill="#1565c0">Mapper 1:</text>
  <text x="175" y="85" font-size="8" fill="#555">(hello, 1)</text>
  <text x="175" y="96" font-size="8" fill="#555">(world, 1)</text>
  <text x="175" y="107" font-size="8" fill="#555">(hello, 1)</text>

  <text x="175" y="122" font-size="9" font-weight="600" fill="#1565c0">Mapper 2:</text>
  <text x="175" y="135" font-size="8" fill="#555">(world, 1) (foo, 1) (hello, 1)</text>

  <!-- Shuffle & Sort -->
  <rect x="340" y="35" width="150" height="115" rx="6" fill="#fff3cd" stroke="#f9ab00" stroke-width="2"/>
  <rect x="340" y="35" width="150" height="22" rx="6" fill="#f9ab00"/>
  <text x="415" y="51" text-anchor="middle" font-size="11" font-weight="700" fill="white">Shuffle &amp; Sort</text>

  <text x="355" y="75" font-size="9" fill="#b06000" font-weight="600">Gruppiert nach Key:</text>
  <text x="355" y="92" font-size="9" fill="#555">foo:    [1]</text>
  <text x="355" y="107" font-size="9" fill="#555">hello:  [1, 1, 1]</text>
  <text x="355" y="122" font-size="9" fill="#555">world:  [1, 1]</text>

  <!-- Reduce Phase -->
  <rect x="530" y="35" width="110" height="115" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <rect x="530" y="35" width="110" height="22" rx="6" fill="#34a853"/>
  <text x="585" y="51" text-anchor="middle" font-size="11" font-weight="700" fill="white">Reduce</text>

  <text x="545" y="75" font-size="9" fill="#1b5e20" font-weight="600">sum(values):</text>
  <text x="545" y="92" font-size="9" fill="#555">foo  → 1</text>
  <text x="545" y="107" font-size="9" fill="#555">hello → 3</text>
  <text x="545" y="122" font-size="9" fill="#555">world → 2</text>

  <!-- Output -->
  <rect x="670" y="50" width="80" height="85" rx="6" fill="#f9f9f9" stroke="#999" stroke-width="1.5"/>
  <text x="710" y="68" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Output</text>
  <text x="710" y="88" text-anchor="middle" font-size="9" fill="#555">foo: 1</text>
  <text x="710" y="103" text-anchor="middle" font-size="9" fill="#555">hello: 3</text>
  <text x="710" y="118" text-anchor="middle" font-size="9" fill="#555">world: 2</text>

  <!-- Arrows -->
  <line x1="124" y1="80" x2="155" y2="80" stroke="#666" stroke-width="1.5" marker-end="url(#ma)"/>
  <line x1="304" y1="80" x2="335" y2="80" stroke="#666" stroke-width="1.5" marker-end="url(#ma)"/>
  <line x1="494" y1="80" x2="525" y2="80" stroke="#666" stroke-width="1.5" marker-end="url(#ma)"/>
  <line x1="644" y1="80" x2="665" y2="80" stroke="#666" stroke-width="1.5" marker-end="url(#ma)"/>

  <!-- Pseudo-code at bottom -->
  <rect x="10" y="170" width="360" height="100" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1.5"/>
  <text x="25" y="190" font-size="10" font-weight="700" fill="#333">map(key, value):</text>
  <text x="35" y="206" font-size="9" fill="#555" font-family="monospace">for word in value.split():</text>
  <text x="45" y="220" font-size="9" fill="#555" font-family="monospace">emit(word, 1)</text>
  <text x="25" y="242" font-size="10" font-weight="700" fill="#333">reduce(key, values):</text>
  <text x="35" y="258" font-size="9" fill="#555" font-family="monospace">emit(key, sum(values))</text>

  <!-- Key principles -->
  <rect x="390" y="170" width="360" height="100" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="405" y="190" font-size="10" font-weight="700" fill="#1b5e20">Effizienz-Prinzipien:</text>
  <text x="405" y="210" font-size="9" fill="#555">1. Data Locality — Map läuft auf dem Chunk-Node</text>
  <text x="405" y="226" font-size="9" fill="#555">2. Streaming — Sequenzielles Lesen, keine Seeks</text>
  <text x="405" y="242" font-size="9" fill="#555">3. Parallelisierung — alle Mapper gleichzeitig</text>
  <text x="405" y="258" font-size="9" fill="#555">4. Fehlertoleranz — Tasks automatisch neu starten</text>
</svg>
