<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">Speicherhierarchie — Geschwindigkeit vs. Kapazität</title>
  <desc id="desc">Pyramide der Speicherhierarchie: CPU-Register (schnellst, kleinste Kapazität) oben, über L1/L2/L3 Cache, RAM, SSD, HDD bis Netzwerk (langsamste, größte Kapazität) unten. Links Zugriffszeit, rechts Kapazität.</desc>
  <rect width="900" height="480" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111111">Speicherhierarchie</text>
  <text x="450" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#666666">Je näher an der CPU, desto schneller — aber kleiner</text>

  <!-- Left axis label -->
  <text x="30" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#555555" transform="rotate(-90 30 280)">← schneller</text>

  <!-- Right axis label -->
  <text x="870" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#555555" transform="rotate(90 870 280)">← größer</text>

  <!-- Pyramid layers (top to bottom, narrower to wider) -->
  <!-- Layer 0: CPU-Register -->
  <polygon points="450,80 520,140 380,140" fill="#1a73e8" stroke="#1558b0" stroke-width="1.5"/>
  <text x="450" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Register</text>

  <!-- Layer 1: L1/L2/L3 Cache -->
  <polygon points="380,140 520,140 570,200 330,200" fill="#4285f4" stroke="#2a6ae0" stroke-width="1.5"/>
  <text x="450" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff">L1 / L2 / L3 Cache</text>

  <!-- Layer 2: RAM -->
  <polygon points="330,200 570,200 630,260 270,260" fill="#669df6" stroke="#4285f4" stroke-width="1.5"/>
  <text x="450" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff">RAM</text>

  <!-- Layer 3: SSD -->
  <polygon points="270,260 630,260 700,320 200,320" fill="#aecbfa" stroke="#669df6" stroke-width="1.5"/>
  <text x="450" y="298" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1a3d6e">SSD</text>

  <!-- Layer 4: HDD -->
  <polygon points="200,320 700,320 760,380 140,380" fill="#d2e3fc" stroke="#aecbfa" stroke-width="1.5"/>
  <text x="450" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1a3d6e">HDD</text>

  <!-- Layer 5: Netzwerk -->
  <polygon points="140,380 760,380 810,440 90,440" fill="#e8f0fe" stroke="#d2e3fc" stroke-width="1.5"/>
  <text x="450" y="418" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1a3d6e">Netzwerk (LAN / Internet)</text>

  <!-- Left annotations: Access time -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333333" text-anchor="end">
    <text x="370" y="126">&lt; 1 ns</text>
    <text x="320" y="178">1 – 10 ns</text>
    <text x="260" y="238">50 – 100 ns</text>
    <text x="190" y="298">10 – 100 µs</text>
    <text x="130" y="358">1 – 10 ms</text>
    <text x="80" y="418">0,1 – 200 ms</text>
  </g>

  <!-- Right annotations: Capacity -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333333" text-anchor="start">
    <text x="530" y="126">Bytes</text>
    <text x="580" y="178">KB – MB</text>
    <text x="640" y="238">GB</text>
    <text x="710" y="298">TB</text>
    <text x="770" y="358">TB</text>
    <text x="820" y="418">∞</text>
  </g>

  <!-- Legend -->
  <text x="100" y="468" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#888888">Zugriffszeit</text>
  <text x="750" y="468" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#888888">Kapazität</text>
</svg>