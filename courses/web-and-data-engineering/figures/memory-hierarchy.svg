<svg xmlns="http://www.w3.org/2000/svg" width="600" height="290" viewBox="0 0 600 290" role="img" aria-labelledby="title desc">
  <title id="title">Speicherhierarchie</title>
  <desc id="desc">Pyramide der Speicherhierarchie: Register oben (schnellst, kleinste Kapazität), gefolgt von L1/L2/L3-Cache, RAM, SSD, HDD und Netzwerk unten (langsamste, größte Kapazität). Links Zugriffszeit, rechts Kapazität.</desc>
  <rect width="600" height="290" fill="#ffffff"/>

  <!-- Axis labels -->
  <text x="20" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#666666" transform="rotate(-90 20 144)">← schneller</text>
  <text x="580" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#666666" transform="rotate(90 580 144)">← größer</text>

  <!-- Pyramid layers — uniform slope (constant 38px per layer) -->
  <!-- L0: Register -->
  <polygon points="300,20 338,58 262,58" fill="#1a73e8" stroke="#1558b0" stroke-width="1"/>
  <text x="300" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Register</text>

  <!-- L1: Cache -->
  <polygon points="262,58 338,58 376,96 224,96" fill="#4285f4" stroke="#2a6ae0" stroke-width="1"/>
  <text x="300" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff">L1 / L2 / L3 Cache</text>

  <!-- L2: RAM -->
  <polygon points="224,96 376,96 414,134 186,134" fill="#669df6" stroke="#4285f4" stroke-width="1"/>
  <text x="300" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff">RAM</text>

  <!-- L3: SSD -->
  <polygon points="186,134 414,134 452,172 148,172" fill="#aecbfa" stroke="#669df6" stroke-width="1"/>
  <text x="300" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1a3d6e">SSD</text>

  <!-- L4: HDD -->
  <polygon points="148,172 452,172 490,210 110,210" fill="#d2e3fc" stroke="#aecbfa" stroke-width="1"/>
  <text x="300" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1a3d6e">HDD</text>

  <!-- L5: Netzwerk -->
  <polygon points="110,210 490,210 528,248 72,248" fill="#e8f0fe" stroke="#d2e3fc" stroke-width="1"/>
  <text x="300" y="234" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1a3d6e">Netzwerk</text>

  <!-- Left annotations: Access time -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333" text-anchor="end">
    <text x="255" y="51">&lt; 1 ns</text>
    <text x="217" y="86">1 – 10 ns</text>
    <text x="179" y="124">50 – 100 ns</text>
    <text x="141" y="162">10 – 100 µs</text>
    <text x="103" y="200">1 – 10 ms</text>
    <text x="65" y="238">≥ 10 ms</text>
  </g>

  <!-- Right annotations: Capacity -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333" text-anchor="start">
    <text x="345" y="51">Bytes</text>
    <text x="383" y="86">KB – MB</text>
    <text x="421" y="124">GB</text>
    <text x="459" y="162">TB</text>
    <text x="497" y="200">TB – PB</text>
    <text x="535" y="238">∞</text>
  </g>

  <!-- Footer labels -->
  <text x="72" y="270" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#888888">Zugriffszeit</text>
  <text x="528" y="270" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#888888">Kapazität</text>
</svg>
