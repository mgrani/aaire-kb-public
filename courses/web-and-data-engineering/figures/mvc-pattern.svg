<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pa" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#666"/></marker>
    <marker id="pb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#4285f4"/></marker>
    <marker id="pg" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#34a853"/></marker>
    <marker id="pp" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#9c27b0"/></marker>
  </defs>

  <text x="310" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#333">MVC vs. MVP vs. MVVM</text>

  <!-- MVC -->
  <rect x="10" y="38" width="190" height="230" rx="8" fill="#f9f9f9" stroke="#ddd" stroke-width="1.5"/>
  <rect x="10" y="38" width="190" height="22" rx="8" fill="#4285f4"/>
  <text x="105" y="54" text-anchor="middle" font-size="11" font-weight="700" fill="white">MVC</text>

  <rect x="65" y="72" width="90" height="30" rx="5" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="110" y="91" text-anchor="middle" font-size="10" font-weight="700" fill="#1b5e20">Controller</text>

  <rect x="25" y="145" width="70" height="30" rx="5" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="60" y="164" text-anchor="middle" font-size="10" font-weight="700" fill="#1565c0">View</text>

  <rect x="120" y="145" width="70" height="30" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="155" y="164" text-anchor="middle" font-size="10" font-weight="700" fill="#6a1b9a">Model</text>

  <!-- MVC arrows -->
  <line x1="95" y1="105" x2="70" y2="140" stroke="#34a853" stroke-width="1.2" marker-end="url(#pg)"/>
  <line x1="125" y1="105" x2="145" y2="140" stroke="#34a853" stroke-width="1.2" marker-end="url(#pg)"/>
  <line x1="140" y1="145" x2="80" y2="145" stroke="#9c27b0" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#pp)"/>

  <text x="105" y="195" text-anchor="middle" font-size="8" fill="#555">Controller vermittelt</text>
  <text x="105" y="207" text-anchor="middle" font-size="8" fill="#555">Model aktualisiert View</text>
  <text x="105" y="225" text-anchor="middle" font-size="8" fill="#1b5e20" font-weight="600">Spring MVC</text>
  <text x="105" y="240" text-anchor="middle" font-size="8" fill="#555">Server-side Rendering</text>
  <text x="105" y="255" text-anchor="middle" font-size="8" fill="#555">Web-Anwendungen</text>

  <!-- MVP -->
  <rect x="215" y="38" width="190" height="230" rx="8" fill="#f9f9f9" stroke="#ddd" stroke-width="1.5"/>
  <rect x="215" y="38" width="190" height="22" rx="8" fill="#34a853"/>
  <text x="310" y="54" text-anchor="middle" font-size="11" font-weight="700" fill="white">MVP</text>

  <rect x="270" y="72" width="90" height="30" rx="5" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="315" y="91" text-anchor="middle" font-size="10" font-weight="700" fill="#1b5e20">Presenter</text>

  <rect x="230" y="145" width="70" height="30" rx="5" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="265" y="164" text-anchor="middle" font-size="10" font-weight="700" fill="#1565c0">View</text>

  <rect x="325" y="145" width="70" height="30" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="360" y="164" text-anchor="middle" font-size="10" font-weight="700" fill="#6a1b9a">Model</text>

  <!-- MVP arrows -->
  <line x1="300" y1="105" x2="275" y2="140" stroke="#34a853" stroke-width="1.2" marker-end="url(#pg)"/>
  <line x1="330" y1="105" x2="350" y2="140" stroke="#34a853" stroke-width="1.2" marker-end="url(#pg)"/>
  <line x1="275" y1="140" x2="295" y2="105" stroke="#4285f4" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#pb)"/>

  <text x="310" y="195" text-anchor="middle" font-size="8" fill="#555">Presenter kennt View-Interface</text>
  <text x="310" y="207" text-anchor="middle" font-size="8" fill="#555">View ist passiv (kein Model-Zugriff)</text>
  <text x="310" y="225" text-anchor="middle" font-size="8" fill="#1b5e20" font-weight="600">Android (legacy), GWT</text>
  <text x="310" y="240" text-anchor="middle" font-size="8" fill="#555">Gut testbar</text>
  <text x="310" y="255" text-anchor="middle" font-size="8" fill="#555">View-Interface mockbar</text>

  <!-- MVVM -->
  <rect x="420" y="38" width="190" height="230" rx="8" fill="#f9f9f9" stroke="#ddd" stroke-width="1.5"/>
  <rect x="420" y="38" width="190" height="22" rx="8" fill="#9c27b0"/>
  <text x="515" y="54" text-anchor="middle" font-size="11" font-weight="700" fill="white">MVVM</text>

  <rect x="465" y="72" width="100" height="30" rx="5" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="515" y="91" text-anchor="middle" font-size="10" font-weight="700" fill="#1b5e20">ViewModel</text>

  <rect x="435" y="145" width="70" height="30" rx="5" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="470" y="164" text-anchor="middle" font-size="10" font-weight="700" fill="#1565c0">View</text>

  <rect x="530" y="145" width="70" height="30" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="565" y="164" text-anchor="middle" font-size="10" font-weight="700" fill="#6a1b9a">Model</text>

  <!-- MVVM arrows -->
  <line x1="535" y1="105" x2="555" y2="140" stroke="#34a853" stroke-width="1.2" marker-end="url(#pg)"/>
  <path d="M 470 140 L 490 115 L 510 115" fill="none" stroke="#4285f4" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="495" y="130" text-anchor="middle" font-size="7" fill="#4285f4">Data Binding</text>

  <text x="515" y="195" text-anchor="middle" font-size="8" fill="#555">View bindet an ViewModel</text>
  <text x="515" y="207" text-anchor="middle" font-size="8" fill="#555">Automatische UI-Updates</text>
  <text x="515" y="225" text-anchor="middle" font-size="8" fill="#1b5e20" font-weight="600">React, Angular, SwiftUI</text>
  <text x="515" y="240" text-anchor="middle" font-size="8" fill="#555">Two-Way Data Binding</text>
  <text x="515" y="255" text-anchor="middle" font-size="8" fill="#555">SPA-Architekturen</text>
</svg>
