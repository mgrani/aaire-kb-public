<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" role="img" aria-labelledby="title desc">
  <title id="title">Produktdetailseite — Desktop-Layout</title>
  <desc id="desc">Schematische Desktop-Ansicht der Produktdetailseite: links das Produktbild, rechts die Produktinformation mit Titel, Preis und Kaufbutton. CSS Grid mit grid-template-areas: "image info".</desc>

  <defs>
    <filter id="shadow-d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="480" height="260" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="240" y="22" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Desktop: zwei Bereiche nebeneinander</text>

    <!-- Container -->
    <rect x="20" y="36" width="440" height="190" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow-d)"/>

    <!-- image area (left) -->
    <rect x="40" y="56" width="170" height="150" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/>
    <circle cx="125" cy="106" r="28" fill="#ffffff" stroke="#1a73e8" stroke-width="3"/>
    <path d="M90 165 H160" stroke="#1a73e8" stroke-width="5" stroke-linecap="round"/>
    <text x="125" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#1a73e8">image</text>

    <!-- info area (right) -->
    <rect x="230" y="56" width="210" height="150" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/>
    <text x="335" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#c25b00">Funkkopfhörer</text>
    <text x="335" y="110" text-anchor="middle" font-size="13" fill="#374151">79,99 €</text>
    <rect x="295" y="130" width="80" height="26" rx="6" fill="#ef6c00"/>
    <text x="335" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Kaufen</text>
    <text x="335" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#ef6c00">info</text>

    <!-- Caption -->
    <text x="240" y="247" text-anchor="middle" font-size="13" font-family="Menlo, Consolas, monospace" fill="#374151">grid-template-areas: "image info"</text>
  </g>
</svg>
