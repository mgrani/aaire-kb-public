<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Produktdetailseite als responsives Grid</title>
  <desc id="desc">Schematische Darstellung einer Produktdetailseite: auf dem Desktop steht das Produktbild links und die Produktinformation rechts; auf mobilen Geräten werden beide Bereiche untereinander dargestellt.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="960" height="420" fill="#ffffff"/>

  <g id="desktop-layout" font-family="Arial, Helvetica, sans-serif">
    <text x="250" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Desktop: zwei Bereiche nebeneinander</text>
    <rect x="50" y="70" width="400" height="250" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>

    <rect x="78" y="100" width="155" height="190" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/>
    <circle cx="155" cy="166" r="34" fill="#ffffff" stroke="#1a73e8" stroke-width="3"/>
    <path d="M120 235 H190" stroke="#1a73e8" stroke-width="6" stroke-linecap="round"/>
    <text x="155" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#1a73e8">image</text>

    <rect x="255" y="100" width="165" height="190" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/>
    <text x="338" y="137" text-anchor="middle" font-size="18" font-weight="700" fill="#c25b00">Funkkopfhörer</text>
    <text x="338" y="166" text-anchor="middle" font-size="16" fill="#374151">79,99 €</text>
    <rect x="292" y="195" width="92" height="32" rx="8" fill="#ef6c00"/>
    <text x="338" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Kaufen</text>
    <text x="338" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#ef6c00">info</text>

    <text x="250" y="365" text-anchor="middle" font-size="15" fill="#374151">grid-template-areas: "image info"</text>
  </g>

  <g id="mobile-layout" font-family="Arial, Helvetica, sans-serif">
    <text x="710" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Mobile: Bereiche untereinander</text>
    <rect x="600" y="70" width="220" height="300" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>

    <rect x="630" y="100" width="160" height="105" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/>
    <circle cx="710" cy="145" r="24" fill="#ffffff" stroke="#1a73e8" stroke-width="3"/>
    <text x="710" y="229" text-anchor="middle" font-size="14" font-weight="700" fill="#1a73e8">image</text>

    <rect x="630" y="245" width="160" height="95" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/>
    <text x="710" y="275" text-anchor="middle" font-size="16" font-weight="700" fill="#c25b00">Funkkopfhörer</text>
    <text x="710" y="301" text-anchor="middle" font-size="14" fill="#374151">79,99 €</text>
    <rect x="672" y="315" width="76" height="20" rx="6" fill="#ef6c00"/>
    <text x="710" y="385" text-anchor="middle" font-size="15" fill="#374151">"image" / "info"</text>
  </g>
</svg>
