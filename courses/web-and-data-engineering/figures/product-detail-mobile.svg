<svg xmlns="http://www.w3.org/2000/svg" width="280" height="380" viewBox="0 0 280 380" role="img" aria-labelledby="title desc">
  <title id="title">Produktdetailseite — Mobile-Layout</title>
  <desc id="desc">Schematische Mobile-Ansicht der Produktdetailseite: das Produktbild oben, darunter die Produktinformation mit Titel, Preis und Kaufbutton. CSS Grid mit grid-template-areas: "image" / "info".</desc>

  <defs>
    <filter id="shadow-m" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="280" height="380" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="140" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Mobile: Bereiche untereinander</text>

    <!-- Phone-shaped container -->
    <rect x="40" y="36" width="200" height="310" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow-m)"/>

    <!-- image area (top) -->
    <rect x="60" y="56" width="160" height="120" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/>
    <circle cx="140" cy="105" r="26" fill="#ffffff" stroke="#1a73e8" stroke-width="3"/>
    <path d="M105 145 H175" stroke="#1a73e8" stroke-width="5" stroke-linecap="round"/>
    <text x="140" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#1a73e8">image</text>

    <!-- info area (bottom) -->
    <rect x="60" y="190" width="160" height="140" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/>
    <text x="140" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#c25b00">Funkkopfhörer</text>
    <text x="140" y="244" text-anchor="middle" font-size="13" fill="#374151">79,99 €</text>
    <rect x="100" y="260" width="80" height="26" rx="6" fill="#ef6c00"/>
    <text x="140" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Kaufen</text>
    <text x="140" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#ef6c00">info</text>

    <!-- Caption -->
    <text x="140" y="367" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#374151">"image" / "info"</text>
  </g>
</svg>
