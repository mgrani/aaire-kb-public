<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="qa" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="qf" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b71c1c"/>
    </marker>
  </defs>

  <text x="210" y="18" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Quality Gates in der Pipeline</text>

  <!-- Pipeline stages -->
  <rect x="10" y="35" width="90" height="40" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="55" y="59" text-anchor="middle" font-size="10" font-weight="700" fill="#1565c0">Ingestion</text>

  <rect x="115" y="35" width="90" height="40" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="160" y="52" text-anchor="middle" font-size="10" font-weight="700" fill="#1b5e20">Trans-</text>
  <text x="160" y="66" text-anchor="middle" font-size="10" font-weight="700" fill="#1b5e20">formation</text>

  <rect x="220" y="35" width="90" height="40" rx="6" fill="#fff3cd" stroke="#f9ab00" stroke-width="2"/>
  <text x="265" y="52" text-anchor="middle" font-size="10" font-weight="700" fill="#b06000">Aggre-</text>
  <text x="265" y="66" text-anchor="middle" font-size="10" font-weight="700" fill="#b06000">gation</text>

  <rect x="325" y="35" width="85" height="40" rx="6" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="367" y="59" text-anchor="middle" font-size="10" font-weight="700" fill="#6a1b9a">Serving</text>

  <!-- Arrows between stages -->
  <line x1="104" y1="55" x2="110" y2="55" stroke="#666" stroke-width="1.5" marker-end="url(#qa)"/>
  <line x1="209" y1="55" x2="215" y2="55" stroke="#666" stroke-width="1.5" marker-end="url(#qa)"/>
  <line x1="314" y1="55" x2="320" y2="55" stroke="#666" stroke-width="1.5" marker-end="url(#qa)"/>

  <!-- Gate symbols (shields) -->
  <rect x="30" y="82" width="50" height="22" rx="3" fill="#4285f4"/>
  <text x="55" y="97" text-anchor="middle" font-size="8" font-weight="700" fill="white">Gate 1</text>
  <rect x="135" y="82" width="50" height="22" rx="3" fill="#34a853"/>
  <text x="160" y="97" text-anchor="middle" font-size="8" font-weight="700" fill="white">Gate 2</text>
  <rect x="240" y="82" width="50" height="22" rx="3" fill="#f9ab00"/>
  <text x="265" y="97" text-anchor="middle" font-size="8" font-weight="700" fill="white">Gate 3</text>
  <rect x="342" y="82" width="50" height="22" rx="3" fill="#9c27b0"/>
  <text x="367" y="97" text-anchor="middle" font-size="8" font-weight="700" fill="white">Gate 4</text>

  <!-- Gate details -->
  <text x="55" y="120" text-anchor="middle" font-size="8" fill="#1565c0" font-weight="600">Schema</text>
  <text x="55" y="132" text-anchor="middle" font-size="8" fill="#555">Vollständigkeit</text>
  <text x="55" y="144" text-anchor="middle" font-size="8" fill="#555">Format-Check</text>

  <text x="160" y="120" text-anchor="middle" font-size="8" fill="#1b5e20" font-weight="600">Integrität</text>
  <text x="160" y="132" text-anchor="middle" font-size="8" fill="#555">Wertebereiche</text>
  <text x="160" y="144" text-anchor="middle" font-size="8" fill="#555">Referenzen</text>

  <text x="265" y="120" text-anchor="middle" font-size="8" fill="#b06000" font-weight="600">Plausibilität</text>
  <text x="265" y="132" text-anchor="middle" font-size="8" fill="#555">Ausreißer</text>
  <text x="265" y="144" text-anchor="middle" font-size="8" fill="#555">Stat. Bounds</text>

  <text x="367" y="120" text-anchor="middle" font-size="8" fill="#6a1b9a" font-weight="600">Freshness</text>
  <text x="367" y="132" text-anchor="middle" font-size="8" fill="#555">SLA-Check</text>
  <text x="367" y="144" text-anchor="middle" font-size="8" fill="#555">Monitoring</text>

  <!-- Failure strategies -->
  <rect x="10" y="165" width="400" height="105" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <rect x="10" y="165" width="400" height="20" rx="6" fill="#ea4335"/>
  <text x="210" y="179" text-anchor="middle" font-size="10" font-weight="700" fill="white">Bei Qualitätsverstößen</text>

  <rect x="25" y="195" width="85" height="32" rx="4" fill="white" stroke="#ea4335" stroke-width="1"/>
  <text x="67" y="208" text-anchor="middle" font-size="9" font-weight="700" fill="#b71c1c">Quarantäne</text>
  <text x="67" y="220" text-anchor="middle" font-size="7" fill="#555">Isolieren</text>

  <rect x="120" y="195" width="65" height="32" rx="4" fill="white" stroke="#ea4335" stroke-width="1"/>
  <text x="152" y="208" text-anchor="middle" font-size="9" font-weight="700" fill="#b71c1c">Abort</text>
  <text x="152" y="220" text-anchor="middle" font-size="7" fill="#555">Stoppen</text>

  <rect x="195" y="195" width="65" height="32" rx="4" fill="white" stroke="#ea4335" stroke-width="1"/>
  <text x="227" y="208" text-anchor="middle" font-size="9" font-weight="700" fill="#b71c1c">Alert</text>
  <text x="227" y="220" text-anchor="middle" font-size="7" fill="#555">Warnen</text>

  <rect x="270" y="195" width="75" height="32" rx="4" fill="white" stroke="#ea4335" stroke-width="1"/>
  <text x="307" y="208" text-anchor="middle" font-size="9" font-weight="700" fill="#b71c1c">Auto-Fix</text>
  <text x="307" y="220" text-anchor="middle" font-size="7" fill="#555">Korrigieren</text>

  <text x="210" y="252" text-anchor="middle" font-size="8" fill="#888" font-style="italic">Die Wahl der Strategie hängt vom Business-Kontext ab</text>
</svg>
