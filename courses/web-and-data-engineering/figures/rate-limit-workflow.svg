<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#1f4e79"/>
    </marker>
    <marker id="arr-red" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#9f3129"/>
    </marker>
  </defs>

  <!-- Client & API headers -->
  <rect x="30" y="20" width="150" height="38" rx="8" fill="#eaf2ff" stroke="#4a89dc"/>
  <text x="105" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79">Client</text>

  <rect x="580" y="20" width="150" height="38" rx="8" fill="#fdecea" stroke="#e06a5f"/>
  <text x="655" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#9f3129">API</text>

  <!-- Lifelines -->
  <line x1="105" y1="58" x2="105" y2="205" stroke="#9bb6d1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="655" y1="58" x2="655" y2="205" stroke="#e6a39b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Activation bar (covers all 3 requests + the 429 response) -->
  <rect x="651" y="82" width="8" height="112" fill="#fdecea" stroke="#9f3129" stroke-width="1"/>

  <!-- Step 1 -->
  <text x="380" y="74" text-anchor="middle" font-size="13" fill="#1f4e79" font-weight="700">GET /search?q=http</text>
  <line x1="105" y1="82" x2="651" y2="82" stroke="#1f4e79" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Step 2 -->
  <text x="380" y="108" text-anchor="middle" font-size="13" fill="#1f4e79" font-weight="700">GET /search?q=rest</text>
  <line x1="105" y1="116" x2="651" y2="116" stroke="#1f4e79" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Step 3 -->
  <text x="380" y="142" text-anchor="middle" font-size="13" fill="#1f4e79" font-weight="700">GET /search?q=cache</text>
  <line x1="105" y1="150" x2="651" y2="150" stroke="#1f4e79" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- 429 response -->
  <text x="380" y="186" text-anchor="middle" font-size="13" fill="#9f3129" font-weight="700">429 Too Many Requests  ·  Retry-After: 30</text>
  <line x1="651" y1="194" x2="109" y2="194" stroke="#9f3129" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Bottom note -->
  <rect x="215" y="216" width="330" height="24" rx="6" fill="#fff7e0" stroke="#d6ae47"/>
  <text x="380" y="233" text-anchor="middle" font-size="12" fill="#7a5b00">Client wartet und versucht es später erneut.</text>
</svg>
