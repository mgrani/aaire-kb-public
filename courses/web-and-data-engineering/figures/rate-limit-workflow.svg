<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="Arial, Helvetica, sans-serif">
  <defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#1f4e79"/></marker></defs>
  <rect x="30" y="20" width="150" height="38" rx="8" fill="#eaf2ff" stroke="#4a89dc"/><text x="105" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79">Client</text>
  <rect x="580" y="20" width="150" height="38" rx="8" fill="#fdecea" stroke="#e06a5f"/><text x="655" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#9f3129">API</text>
  <line x1="180" y1="82" x2="565" y2="82" stroke="#1f4e79" stroke-width="3" marker-end="url(#arr)"/><text x="372" y="72" text-anchor="middle" font-size="13" fill="#1f4e79">GET /search?q=http</text>
  <line x1="180" y1="116" x2="565" y2="116" stroke="#1f4e79" stroke-width="3" marker-end="url(#arr)"/><text x="372" y="106" text-anchor="middle" font-size="13" fill="#1f4e79">GET /search?q=rest</text>
  <line x1="180" y1="150" x2="565" y2="150" stroke="#1f4e79" stroke-width="3" marker-end="url(#arr)"/><text x="372" y="140" text-anchor="middle" font-size="13" fill="#1f4e79">GET /search?q=cache</text>
  <line x1="565" y1="194" x2="180" y2="194" stroke="#9f3129" stroke-width="3" marker-end="url(#arr)"/><text x="372" y="184" text-anchor="middle" font-size="13" fill="#9f3129">429 Too Many Requests, Retry-After: 30</text>
  <rect x="215" y="212" width="330" height="24" rx="6" fill="#fff7e0" stroke="#d6ae47"/><text x="380" y="229" text-anchor="middle" font-size="12" fill="#7a5b00">Client wartet und versucht es später erneut.</text>
