<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#1f4e79"/>
    </marker>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#9f3129"/>
    </marker>
  </defs>

  <!-- Browser & Server headers -->
  <rect x="30" y="15" width="140" height="32" rx="6" fill="#eaf2ff" stroke="#4a89dc" stroke-width="2"/>
  <text x="100" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">Browser</text>

  <rect x="590" y="15" width="140" height="32" rx="6" fill="#fdecea" stroke="#e06a5f" stroke-width="2"/>
  <text x="660" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#9f3129">Server</text>

  <!-- Lifelines -->
  <line x1="100" y1="47" x2="100" y2="260" stroke="#9bb6d1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="660" y1="47" x2="660" y2="260" stroke="#e6a39b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ===== 1. POST ===== -->
  <text x="380" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#1f4e79">1. POST /checkout</text>
  <line x1="100" y1="76" x2="656" y2="76" stroke="#1f4e79" stroke-width="2" marker-end="url(#ab)"/>

  <!-- POST body detail -->
  <rect x="106" y="84" width="548" height="20" rx="4" fill="#f0f6ff" stroke="#9bb6d1" stroke-width="1"/>
  <text x="115" y="98" font-size="11" font-family="Menlo, Consolas, monospace" fill="#555">Content-Type: application/x-www-form-urlencoded · {…Bestelldaten…}</text>

  <!-- Server activation 1 -->
  <rect x="656" y="76" width="8" height="42" fill="#fdecea" stroke="#9f3129" stroke-width="1"/>

  <!-- ===== 2. 303 See Other ===== -->
  <text x="380" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#9f3129">2. 303 See Other</text>
  <line x1="656" y1="132" x2="104" y2="132" stroke="#9f3129" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 303 detail -->
  <rect x="106" y="140" width="548" height="20" rx="4" fill="#fff8f7" stroke="#e6a39b" stroke-width="1"/>
  <text x="115" y="154" font-size="11" font-family="Menlo, Consolas, monospace" fill="#555">Location: /orders/789</text>

  <!-- Browser auto-follow note -->
  <text x="100" y="176" text-anchor="middle" font-size="9" fill="#6b7280" font-style="italic">Browser folgt automatisch — als GET</text>

  <!-- ===== 3. GET (auto-follow) ===== -->
  <text x="380" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#1f4e79">3. GET /orders/789</text>
  <line x1="100" y1="204" x2="656" y2="204" stroke="#1f4e79" stroke-width="2" marker-end="url(#ab)"/>

  <!-- Server activation 2 -->
  <rect x="656" y="204" width="8" height="32" fill="#fdecea" stroke="#9f3129" stroke-width="1"/>

  <!-- ===== 4. 200 OK ===== -->
  <text x="380" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#1b5e20">4. 200 OK  ·  Bestellbestätigung</text>
  <line x1="656" y1="238" x2="104" y2="238" stroke="#1b5e20" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Bottom note -->
  <rect x="100" y="252" width="560" height="22" rx="5" fill="#fff7e0" stroke="#d6ae47"/>
  <text x="380" y="267" text-anchor="middle" font-size="11" fill="#7a5b00">Status-Variante: 301/308 = permanent · 302/307 = temporär · 303 = nach POST per GET fortsetzen</text>
</svg>
