  <title
     id="title">Browser Rendering Pipeline</title>
  <desc
     id="desc">Die Rendering-Pipeline: HTML erzeugt DOM, CSS erzeugt CSSOM, beide werden zum Render Tree kombiniert. Danach folgen Layout und Paint. Der Nutzer sieht und beruehrt Pixel. Interaktionen werden als Events in die Queue gelegt. JavaScript laeuft im Main Thread und greift ueber Browser Web APIs auf DOM und CSSOM zu.</desc>
