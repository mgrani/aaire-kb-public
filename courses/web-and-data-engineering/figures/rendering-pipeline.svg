  <title
     id="title">Browser Rendering Pipeline</title>
  <desc
     id="desc">Die Rendering-Pipeline: HTML-Parsing erzeugt DOM, CSS-Parsing erzeugt CSSOM, beide werden zum Render Tree kombiniert. Dann folgen Layout, Paint und Composite. JavaScript kann DOM und CSSOM ändern und löst Reflow aus.</desc>
