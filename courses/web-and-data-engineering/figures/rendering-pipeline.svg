<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
  <title id="title">Browser Rendering Pipeline</title>
  <desc id="desc">Die Rendering-Pipeline: HTML-Parsing erzeugt DOM, CSS-Parsing erzeugt CSSOM, beide werden zum Render Tree kombiniert. Dann folgen Layout, Paint und Composite. JavaScript kann DOM und CSSOM ändern und löst Reflow aus.</desc>
  <rect width="1100" height="420" fill="#ffffff"/>

  <text x="550" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111111">Rendering-Pipeline des Browsers</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea4335"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4285f4"/>
    </marker>
  </defs>

  <!-- Row 1: HTML → DOM -->
  <rect x="40" y="60" width="130" height="55" rx="10" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="105" y="84" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#c5221f">HTML</text>
  <text x="105" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">Parsen</text>

  <line x1="170" y1="87" x2="210" y2="87" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="210" y="60" width="130" height="55" rx="10" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="275" y="84" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#c5221f">DOM</text>
  <text x="275" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">Dokumentstruktur</text>

  <!-- Row 2: CSS → CSSOM -->
  <rect x="40" y="140" width="130" height="55" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="105" y="164" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1a73e8">CSS</text>
  <text x="105" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">Parsen</text>

  <line x1="170" y1="167" x2="210" y2="167" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="210" y="140" width="130" height="55" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="275" y="164" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1a73e8">CSSOM</text>
  <text x="275" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">Berechnete Styles</text>

  <!-- Merge arrows to Render Tree -->
  <line x1="340" y1="87" x2="430" y2="120" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="167" x2="430" y2="140" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Render Tree -->
  <rect x="430" y="100" width="140" height="55" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="500" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1e8e3e">Render Tree</text>
  <text x="500" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">Sichtbare Elemente</text>

  <line x1="570" y1="127" x2="620" y2="127" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layout -->
  <rect x="620" y="100" width="130" height="55" rx="10" fill="#f3e8fd" stroke="#9334e6" stroke-width="2"/>
  <text x="685" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#7627bb">Layout</text>
  <text x="685" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">Positionen + Größen</text>

  <line x1="750" y1="127" x2="790" y2="127" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Paint -->
  <rect x="790" y="100" width="120" height="55" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="850" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#e37400">Paint</text>
  <text x="850" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">Pixel zeichnen</text>

  <line x1="910" y1="127" x2="950" y2="127" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Composite -->
  <rect x="950" y="100" width="130" height="55" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="1015" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1e8e3e">Composite</text>
  <text x="1015" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">Schichten mischen</text>

  <!-- JavaScript box -->
  <rect x="200" y="240" width="480" height="55" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="440" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#e37400">JavaScript</text>
  <text x="440" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">DOM ändern · Styles ändern · Events verarbeiten</text>

  <!-- JS → DOM arrow -->
  <line x1="310" y1="240" x2="285" y2="115" stroke="#ea4335" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrow-red)"/>
  <text x="270" y="192" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ea4335">DOM ändern</text>

  <!-- JS → CSSOM arrow -->
  <line x1="370" y1="240" x2="310" y2="195" stroke="#4285f4" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrow-blue)"/>
  <text x="360" y="220" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#4285f4">Styles ändern</text>

  <!-- Reflow arrow from JS back to Layout -->
  <path d="M 680 267 L 750 267 L 750 155" fill="none" stroke="#ea4335" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrow-red)"/>
  <text x="762" y="220" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#ea4335">Reflow!</text>

  <!-- Cost indicators -->
  <g transform="translate(40, 330)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#333">Kosten einer Änderung durch JavaScript:</text>

    <rect x="0" y="15" width="320" height="30" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
    <text x="10" y="35" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#c5221f">DOM-Struktur ändern</text>
    <text x="200" y="35" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#c5221f">→ Render Tree + Layout + Paint + Composite</text>

    <rect x="0" y="50" width="320" height="30" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
    <text x="10" y="70" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#1a73e8">Nur Styles ändern (Farbe)</text>
    <text x="200" y="70" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1a73e8">→ Paint + Composite</text>

    <rect x="370" y="15" width="310" height="30" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
    <text x="380" y="35" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#1e8e3e">transform / opacity ändern</text>
    <text x="560" y="35" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1e8e3e">→ nur Composite (GPU)</text>

    <!-- Cost labels -->
    <text x="730" y="35" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#34a853">billig</text>
    <text x="730" y="70" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#c5221f">teuer</text>

    <!-- Arrow indicating cost -->
    <line x1="750" y1="40" x2="750" y2="65" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
</svg>