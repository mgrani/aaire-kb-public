<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <title id="title">REST-Ressourcenhierarchie eines Online-Shops</title>
  <desc id="desc">Baumdiagramm der REST-Ressourcen: Root API → Products (Collection → Einzelressource → Reviews), Users, Orders, Cart. Jeder Knoten zeigt URI und HTTP-Methoden.</desc>
  <rect width="1000" height="460" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111111">REST-Ressourcenhierarchie: Online-Shop</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#aaa"/>
    </marker>
  </defs>

  <!-- Root -->
  <rect x="420" y="55" width="160" height="40" rx="8" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  <text x="500" y="80" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#333">/api</text>

  <!-- Lines from root -->
  <line x1="440" y1="95" x2="130" y2="140" stroke="#aaa" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="480" y1="95" x2="400" y2="140" stroke="#aaa" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="520" y1="95" x2="620" y2="140" stroke="#aaa" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="560" y1="95" x2="860" y2="140" stroke="#aaa" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- PRODUCTS Collection -->
  <g transform="translate(30, 140)">
    <rect x="0" y="0" width="200" height="55" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
    <text x="100" y="22" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#1a73e8">/products</text>
    <text x="100" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">Collection — GET, POST</text>
  </g>

  <!-- Line to single product -->
  <line x1="130" y1="195" x2="130" y2="230" stroke="#aaa" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Single Product -->
  <g transform="translate(30, 230)">
    <rect x="0" y="0" width="200" height="55" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
    <text x="100" y="22" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#1a73e8">/products/{id}</text>
    <text x="100" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">Einzeln — GET, PUT, DELETE</text>
  </g>

  <!-- Line to reviews -->
  <line x1="130" y1="285" x2="130" y2="320" stroke="#aaa" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Reviews Sub-Collection -->
  <g transform="translate(10, 320)">
    <rect x="0" y="0" width="240" height="55" rx="10" fill="#d2e3fc" stroke="#4285f4" stroke-width="1.5"/>
    <text x="120" y="22" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#1a73e8">/products/{id}/reviews</text>
    <text x="120" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">Sub-Collection — GET, POST</text>
  </g>

  <!-- Line to single review -->
  <line x1="130" y1="375" x2="130" y2="400" stroke="#aaa" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Single Review -->
  <g transform="translate(5, 400)">
    <rect x="0" y="0" width="250" height="42" rx="8" fill="#d2e3fc" stroke="#4285f4" stroke-width="1.5"/>
    <text x="125" y="18" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#1a73e8">/products/{id}/reviews/{rid}</text>
    <text x="125" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666">Sub-Ressource — GET, PUT, DELETE</text>
  </g>

  <!-- USERS Collection -->
  <g transform="translate(300, 140)">
    <rect x="0" y="0" width="200" height="55" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
    <text x="100" y="22" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#1e8e3e">/users</text>
    <text x="100" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">Collection — GET, POST</text>
  </g>

  <line x1="400" y1="195" x2="400" y2="230" stroke="#aaa" stroke-width="1.5" marker-end="url(#ar)"/>

  <g transform="translate(300, 230)">
    <rect x="0" y="0" width="200" height="55" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
    <text x="100" y="22" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#1e8e3e">/users/{id}</text>
    <text x="100" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">Einzeln — GET, PUT, DELETE</text>
  </g>

  <line x1="400" y1="285" x2="400" y2="320" stroke="#aaa" stroke-width="1.5" marker-end="url(#ar)"/>

  <g transform="translate(290, 320)">
    <rect x="0" y="0" width="220" height="55" rx="10" fill="#c8e6c9" stroke="#34a853" stroke-width="1.5"/>
    <text x="110" y="22" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#1e8e3e">/users/{id}/orders</text>
    <text x="110" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">Bestellungen — GET</text>
  </g>

  <!-- ORDERS Collection -->
  <g transform="translate(560, 140)">
    <rect x="0" y="0" width="200" height="55" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
    <text x="100" y="22" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#e37400">/orders</text>
    <text x="100" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">Collection — GET, POST</text>
  </g>

  <line x1="660" y1="195" x2="660" y2="230" stroke="#aaa" stroke-width="1.5" marker-end="url(#ar)"/>

  <g transform="translate(560, 230)">
    <rect x="0" y="0" width="200" height="55" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
    <text x="100" y="22" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#e37400">/orders/{id}</text>
    <text x="100" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">Einzeln — GET</text>
  </g>

  <line x1="660" y1="285" x2="660" y2="320" stroke="#aaa" stroke-width="1.5" marker-end="url(#ar)"/>

  <g transform="translate(535, 320)">
    <rect x="0" y="0" width="250" height="55" rx="10" fill="#fef0cc" stroke="#f9ab00" stroke-width="1.5"/>
    <text x="125" y="22" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#e37400">/orders/{id}/cancellations</text>
    <text x="125" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">Aktion als Ressource — POST</text>
  </g>

  <!-- CART Singleton -->
  <g transform="translate(810, 140)">
    <rect x="0" y="0" width="160" height="55" rx="10" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
    <text x="80" y="22" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#c5221f">/cart</text>
    <text x="80" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">Singleton — GET, PUT</text>
  </g>

  <line x1="890" y1="195" x2="890" y2="230" stroke="#aaa" stroke-width="1.5" marker-end="url(#ar)"/>

  <g transform="translate(790, 230)">
    <rect x="0" y="0" width="200" height="55" rx="10" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
    <text x="100" y="22" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#c5221f">/cart/items/{id}</text>
    <text x="100" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">Item — GET, PUT, DELETE</text>
  </g>

  <!-- Legend -->
  <g transform="translate(30, 55)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#888">Substantive, keine Verben — HTTP-Methoden drücken die Aktion aus</text>
  </g>
</svg>