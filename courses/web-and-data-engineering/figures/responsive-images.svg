<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <rect width="1200" height="360" fill="#fff8ef"/>
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#222">Responsive Images</text>
  <rect x="60" y="90" width="280" height="200" rx="18" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="4"/>
  <rect x="460" y="90" width="280" height="200" rx="18" fill="#f0fdf4" stroke="#059669" stroke-width="4"/>
  <rect x="860" y="90" width="280" height="200" rx="18" fill="#fff7ed" stroke="#d97706" stroke-width="4"/>
  <text x="200" y="135" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#111">img src</text>
  <text x="200" y="170" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#333">fallback</text>
  <text x="200" y="205" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#333">one image</text>
  <text x="600" y="135" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#111">srcset + sizes</text>
  <text x="600" y="170" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#333">same content,</text>
  <text x="600" y="195" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#333">different resolutions</text>
  <text x="1000" y="135" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#111">picture</text>
  <text x="1000" y="170" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#333">art direction</text>
  <text x="1000" y="195" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#333">different crops</text>
  <text x="600" y="330" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#555">MDN details: srcset / sizes for resolution switching, picture for art direction</text>
</svg>
