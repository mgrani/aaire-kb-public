<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <!-- RPC Side -->
  <rect x="10" y="10" width="380" height="380" rx="10" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="200" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#c62828">RPC-Stil</text>
  <text x="200" y="58" text-anchor="middle" font-size="12" fill="#888">Aktions-orientiert</text>

  <!-- RPC endpoints -->
  <rect x="30" y="75" width="340" height="30" rx="4" fill="#fff" stroke="#ea4335" stroke-width="1"/>
  <text x="45" y="95" font-size="12" font-family="monospace" fill="#ea4335" font-weight="600">POST</text>
  <text x="95" y="95" font-size="12" font-family="monospace" fill="#555">/createUser</text>
  <rect x="280" y="80" width="80" height="20" rx="3" fill="#ea4335" opacity="0.1"/>
  <text x="320" y="94" text-anchor="middle" font-size="9" fill="#c62828">alles POST</text>

  <rect x="30" y="110" width="340" height="30" rx="4" fill="#fff" stroke="#ea4335" stroke-width="1"/>
  <text x="45" y="130" font-size="12" font-family="monospace" fill="#ea4335" font-weight="600">POST</text>
  <text x="95" y="130" font-size="12" font-family="monospace" fill="#555">/getUser</text>

  <rect x="30" y="145" width="340" height="30" rx="4" fill="#fff" stroke="#ea4335" stroke-width="1"/>
  <text x="45" y="165" font-size="12" font-family="monospace" fill="#ea4335" font-weight="600">POST</text>
  <text x="95" y="165" font-size="12" font-family="monospace" fill="#555">/updateUser</text>

  <rect x="30" y="180" width="340" height="30" rx="4" fill="#fff" stroke="#ea4335" stroke-width="1"/>
  <text x="45" y="200" font-size="12" font-family="monospace" fill="#ea4335" font-weight="600">POST</text>
  <text x="95" y="200" font-size="12" font-family="monospace" fill="#555">/deleteUser</text>

  <!-- RPC problems -->
  <line x1="30" y1="230" x2="370" y2="230" stroke="#ea4335" stroke-width="1" opacity="0.3"/>
  <text x="40" y="255" font-size="12" fill="#c62828">✗ CDN kann nichts cachen</text>
  <text x="40" y="278" font-size="12" fill="#c62828">✗ Monitoring sieht nur POST</text>
  <text x="40" y="301" font-size="12" fill="#c62828">✗ WAF kann nicht filtern</text>
  <text x="40" y="324" font-size="12" fill="#c62828">✗ Client muss Doku lesen</text>
  <text x="40" y="347" font-size="12" fill="#c62828">✗ Jeder Endpunkt ist eine Funktion</text>

  <!-- REST Side -->
  <rect x="410" y="10" width="380" height="380" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="600" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1b5e20">REST-Stil</text>
  <text x="600" y="58" text-anchor="middle" font-size="12" fill="#888">Ressourcen-orientiert</text>

  <!-- REST endpoints -->
  <rect x="430" y="75" width="340" height="30" rx="4" fill="#fff" stroke="#34a853" stroke-width="1"/>
  <text x="445" y="95" font-size="12" font-family="monospace" fill="#34a853" font-weight="600">POST</text>
  <text x="500" y="95" font-size="12" font-family="monospace" fill="#555">/users</text>
  <text x="680" y="95" font-size="10" fill="#888">→ anlegen</text>

  <rect x="430" y="110" width="340" height="30" rx="4" fill="#fff" stroke="#4285f4" stroke-width="1"/>
  <text x="445" y="130" font-size="12" font-family="monospace" fill="#4285f4" font-weight="600">GET</text>
  <text x="492" y="130" font-size="12" font-family="monospace" fill="#555">/users/42</text>
  <text x="680" y="130" font-size="10" fill="#888">→ lesen</text>

  <rect x="430" y="145" width="340" height="30" rx="4" fill="#fff" stroke="#f9ab00" stroke-width="1"/>
  <text x="445" y="165" font-size="12" font-family="monospace" fill="#b07800" font-weight="600">PUT</text>
  <text x="492" y="165" font-size="12" font-family="monospace" fill="#555">/users/42</text>
  <text x="680" y="165" font-size="10" fill="#888">→ ersetzen</text>

  <rect x="430" y="180" width="340" height="30" rx="4" fill="#fff" stroke="#ea4335" stroke-width="1"/>
  <text x="445" y="200" font-size="12" font-family="monospace" fill="#ea4335" font-weight="600">DELETE</text>
  <text x="510" y="200" font-size="12" font-family="monospace" fill="#555">/users/42</text>
  <text x="680" y="200" font-size="10" fill="#888">→ löschen</text>

  <!-- REST advantages -->
  <line x1="430" y1="230" x2="770" y2="230" stroke="#34a853" stroke-width="1" opacity="0.3"/>
  <text x="440" y="255" font-size="12" fill="#1b5e20">✓ GET ist cachebar (CDN)</text>
  <text x="440" y="278" font-size="12" fill="#1b5e20">✓ Methoden in Audit-Logs sichtbar</text>
  <text x="440" y="301" font-size="12" fill="#1b5e20">✓ WAF erkennt DELETE, POST</text>
  <text x="440" y="324" font-size="12" fill="#1b5e20">✓ Verhalten ist vorhersagbar</text>
  <text x="440" y="347" font-size="12" fill="#1b5e20">✓ Jeder Endpunkt ist eine Ressource</text>

  <!-- VS divider -->
  <circle cx="400" cy="200" r="22" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="400" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#333">vs.</text>
</svg>
