<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <text x="260" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#333">Scaling Up vs. Scaling Out</text>

  <!-- Scale Up (left) -->
  <rect x="10" y="35" width="240" height="190" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <rect x="10" y="35" width="240" height="24" rx="8" fill="#4285f4"/>
  <text x="130" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="white">Vertical Scaling (Scale Up)</text>

  <!-- Small server -->
  <rect x="30" y="75" width="50" height="35" rx="4" fill="white" stroke="#4285f4" stroke-width="1.2"/>
  <text x="55" y="90" text-anchor="middle" font-size="8" fill="#1565c0">2 CPU</text>
  <text x="55" y="101" text-anchor="middle" font-size="8" fill="#555">16 GB</text>

  <!-- Arrow -->
  <text x="100" y="95" text-anchor="middle" font-size="16" fill="#4285f4">→</text>

  <!-- Big server -->
  <rect x="115" y="65" width="80" height="55" rx="4" fill="white" stroke="#4285f4" stroke-width="2"/>
  <text x="155" y="85" text-anchor="middle" font-size="9" font-weight="600" fill="#1565c0">64 CPU</text>
  <text x="155" y="100" text-anchor="middle" font-size="9" fill="#555">2 TB RAM</text>
  <text x="155" y="113" text-anchor="middle" font-size="8" fill="#b71c1c">10.000 $/Mo</text>

  <!-- Pros/Cons Scale Up -->
  <text x="25" y="140" font-size="9" fill="#1b5e20">+ Einfach (ACID funktioniert)</text>
  <text x="25" y="155" font-size="9" fill="#1b5e20">+ Keine verteilte Koordination</text>
  <text x="25" y="175" font-size="9" fill="#b71c1c">− Hardware-Maximum erreicht</text>
  <text x="25" y="190" font-size="9" fill="#b71c1c">− Kosten steigen überproportional</text>
  <text x="25" y="210" font-size="9" fill="#555" font-style="italic">Typisch: RDBMS, DWH</text>

  <!-- Scale Out (right) -->
  <rect x="270" y="35" width="240" height="190" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <rect x="270" y="35" width="240" height="24" rx="8" fill="#34a853"/>
  <text x="390" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="white">Horizontal Scaling (Scale Out)</text>

  <!-- Multiple small servers -->
  <rect x="290" y="70" width="40" height="25" rx="3" fill="white" stroke="#34a853" stroke-width="1.2"/>
  <text x="310" y="87" text-anchor="middle" font-size="7" fill="#1b5e20">Node 1</text>
  <rect x="338" y="70" width="40" height="25" rx="3" fill="white" stroke="#34a853" stroke-width="1.2"/>
  <text x="358" y="87" text-anchor="middle" font-size="7" fill="#1b5e20">Node 2</text>
  <rect x="386" y="70" width="40" height="25" rx="3" fill="white" stroke="#34a853" stroke-width="1.2"/>
  <text x="406" y="87" text-anchor="middle" font-size="7" fill="#1b5e20">Node 3</text>
  <rect x="434" y="70" width="40" height="25" rx="3" fill="white" stroke="#34a853" stroke-width="1.2"/>
  <text x="454" y="87" text-anchor="middle" font-size="7" fill="#1b5e20">Node 4</text>

  <rect x="290" y="100" width="40" height="25" rx="3" fill="white" stroke="#34a853" stroke-width="1.2"/>
  <text x="310" y="117" text-anchor="middle" font-size="7" fill="#1b5e20">Node 5</text>
  <rect x="338" y="100" width="40" height="25" rx="3" fill="white" stroke="#34a853" stroke-width="1.2"/>
  <text x="358" y="117" text-anchor="middle" font-size="7" fill="#1b5e20">Node 6</text>
  <text x="420" y="117" text-anchor="middle" font-size="11" fill="#1b5e20">… N</text>
  <text x="390" y="140" text-anchor="middle" font-size="8" fill="#555">je 100 $/Mo</text>

  <!-- Pros/Cons Scale Out -->
  <text x="285" y="158" font-size="9" fill="#1b5e20">+ Linear skalierbar</text>
  <text x="285" y="173" font-size="9" fill="#1b5e20">+ Ausfalltoleranz durch Redundanz</text>
  <text x="285" y="193" font-size="9" fill="#b71c1c">− Verteilte Koordination nötig</text>
  <text x="285" y="208" font-size="9" fill="#b71c1c">− CAP-Theorem: C vs. A</text>
  <text x="285" y="218" font-size="9" fill="#555" font-style="italic">Typisch: HDFS, Spark, Cassandra</text>
</svg>
