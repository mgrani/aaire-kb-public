<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="title desc">
  <title id="title">Script-Ladestrategien: normal, async, defer</title>
  <desc id="desc">Drei Zeitachsen zeigen, wie script-Tags mit und ohne async/defer das HTML-Parsing und die Script-Ausführung beeinflussen.</desc>
  <rect width="900" height="380" fill="#ffffff"/>

  <text x="450" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111111">Script-Ladestrategien</text>

  <!-- Legend -->
  <g transform="translate(250, 45)">
    <rect x="0" y="0" width="60" height="14" rx="3" fill="#fce8e6" stroke="#ea4335" stroke-width="1"/>
    <text x="68" y="12" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">HTML-Parsing</text>
    <rect x="160" y="0" width="60" height="14" rx="3" fill="#e8f0fe" stroke="#4285f4" stroke-width="1"/>
    <text x="228" y="12" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">Script laden</text>
    <rect x="320" y="0" width="60" height="14" rx="3" fill="#fef7e0" stroke="#f9ab00" stroke-width="1"/>
    <text x="388" y="12" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">Script ausführen</text>
  </g>

  <!-- === NORMAL (no attribute) === -->
  <text x="30" y="105" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#333">&lt;script&gt;</text>
  <text x="30" y="122" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#999">(normal)</text>

  <!-- HTML parsing -->
  <rect x="130" y="90" width="180" height="26" rx="5" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="220" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c5221f">Parsing</text>

  <!-- Blocked: script download -->
  <rect x="310" y="90" width="120" height="26" rx="5" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="370" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1a73e8">Laden</text>

  <!-- Blocked: script execute -->
  <rect x="430" y="90" width="80" height="26" rx="5" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="470" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#e37400">Ausführen</text>

  <!-- HTML parsing continues -->
  <rect x="510" y="90" width="250" height="26" rx="5" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="635" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c5221f">Parsing (fortgesetzt)</text>

  <!-- Block indicator -->
  <rect x="310" y="120" width="200" height="18" rx="4" fill="#fce8e6"/>
  <text x="410" y="134" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#ea4335">Parsing blockiert!</text>

  <!-- === ASYNC === -->
  <text x="30" y="200" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#333">async</text>

  <!-- HTML parsing (continuous until script ready) -->
  <rect x="130" y="185" width="300" height="26" rx="5" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="280" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c5221f">Parsing</text>

  <!-- Script download (parallel) -->
  <rect x="310" y="215" width="120" height="26" rx="5" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="370" y="233" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1a73e8">Laden (parallel)</text>

  <!-- Script execute (interrupts) -->
  <rect x="430" y="185" width="80" height="26" rx="5" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="470" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#e37400">Ausf.</text>

  <!-- HTML parsing continues -->
  <rect x="510" y="185" width="250" height="26" rx="5" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="635" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c5221f">Parsing (fortgesetzt)</text>

  <!-- Info -->
  <text x="310" y="260" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#888">Reihenfolge nicht garantiert!</text>

  <!-- === DEFER === -->
  <text x="30" y="305" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#333">defer</text>

  <!-- HTML parsing (continuous, full) -->
  <rect x="130" y="290" width="490" height="26" rx="5" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="375" y="308" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c5221f">Parsing (nicht blockiert)</text>

  <!-- Script download (parallel) -->
  <rect x="310" y="320" width="120" height="26" rx="5" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="370" y="338" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1a73e8">Laden (parallel)</text>

  <!-- DOMContentLoaded marker -->
  <line x1="620" y1="285" x2="620" y2="350" stroke="#34a853" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="625" y="283" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#34a853">DOM ready</text>

  <!-- Script execute (after DOM ready) -->
  <rect x="625" y="290" width="120" height="26" rx="5" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="685" y="308" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#e37400">Ausführen</text>

  <!-- Recommendation -->
  <rect x="625" y="325" width="200" height="22" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="725" y="341" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1e8e3e">Empfehlung: fast immer defer</text>

  <!-- Time arrow -->
  <line x1="130" y1="370" x2="820" y2="370" stroke="#ccc" stroke-width="1.5" marker-end="url(#arr-t)"/>
  <defs>
    <marker id="arr-t" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ccc"/>
    </marker>
  </defs>
  <text x="830" y="374" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#999">Zeit</text>
</svg>