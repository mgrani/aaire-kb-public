<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#1565c0"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#1b5e20"/></marker>
    <marker id="a3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#b71c1c"/></marker>
  </defs>

  <!-- Title -->
  <text x="380" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#333">Servlet-Lebenszyklus</text>

  <!-- Phase boxes -->
  <rect x="10" y="40" width="140" height="55" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="80" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#1565c0">① init()</text>
  <text x="80" y="76" text-anchor="middle" font-size="9" fill="#555">Einmalig beim Laden</text>
  <text x="80" y="88" text-anchor="middle" font-size="9" fill="#555">Konfiguration lesen</text>

  <rect x="200" y="40" width="180" height="55" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="290" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#1b5e20">② service() → doXXX()</text>
  <text x="290" y="76" text-anchor="middle" font-size="9" fill="#555">Pro Request, mehrere Threads</text>
  <text x="290" y="88" text-anchor="middle" font-size="9" fill="#555">doGet(), doPost(), doPut()...</text>

  <rect x="430" y="40" width="140" height="55" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="500" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#b71c1c">③ destroy()</text>
  <text x="500" y="76" text-anchor="middle" font-size="9" fill="#555">Einmalig beim Entladen</text>
  <text x="500" y="88" text-anchor="middle" font-size="9" fill="#555">Ressourcen freigeben</text>

  <!-- Container box -->
  <rect x="610" y="35" width="140" height="65" rx="8" fill="#fff3cd" stroke="#f9ab00" stroke-width="2"/>
  <text x="680" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="#b06000">Servlet Container</text>
  <text x="680" y="74" text-anchor="middle" font-size="9" fill="#666">Tomcat / Jetty</text>
  <text x="680" y="88" text-anchor="middle" font-size="9" fill="#666">Verwaltet Lifecycle</text>

  <!-- Arrows between phases -->
  <line x1="155" y1="67" x2="194" y2="67" stroke="#1565c0" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="385" y1="67" x2="424" y2="67" stroke="#1b5e20" stroke-width="2" marker-end="url(#a2)"/>

  <!-- Loop arrow for service -->
  <path d="M 290 100 Q 290 130 340 130 Q 380 130 380 100" fill="none" stroke="#34a853" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="335" y="145" text-anchor="middle" font-size="8" fill="#1b5e20">wiederholt (pro Request)</text>

  <!-- Thread pool illustration -->
  <rect x="10" y="160" width="560" height="85" rx="6" fill="#f9f9f9" stroke="#ddd" stroke-width="1.5"/>
  <text x="20" y="178" font-size="10" font-weight="700" fill="#333">Thread-Pool im Container:</text>

  <!-- Thread boxes -->
  <rect x="20" y="188" width="120" height="44" rx="4" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="80" y="206" text-anchor="middle" font-size="9" fill="#1565c0" font-weight="600">Thread 1</text>
  <text x="80" y="220" text-anchor="middle" font-size="8" fill="#555">GET /products/42</text>

  <rect x="155" y="188" width="120" height="44" rx="4" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="215" y="206" text-anchor="middle" font-size="9" fill="#1565c0" font-weight="600">Thread 2</text>
  <text x="215" y="220" text-anchor="middle" font-size="8" fill="#555">POST /orders</text>

  <rect x="290" y="188" width="120" height="44" rx="4" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="350" y="206" text-anchor="middle" font-size="9" fill="#1565c0" font-weight="600">Thread 3</text>
  <text x="350" y="220" text-anchor="middle" font-size="8" fill="#555">GET /cart</text>

  <rect x="425" y="188" width="130" height="44" rx="4" fill="#fff3cd" stroke="#f9ab00"/>
  <text x="490" y="206" text-anchor="middle" font-size="9" fill="#b06000" font-weight="600">⚠️ Gleiche Instanz!</text>
  <text x="490" y="220" text-anchor="middle" font-size="8" fill="#666">Instanzvariablen geteilt</text>

  <!-- Container manages arrow -->
  <line x1="610" y1="85" x2="575" y2="67" stroke="#f9ab00" stroke-width="1.5" stroke-dasharray="4,3"/>
</svg>
