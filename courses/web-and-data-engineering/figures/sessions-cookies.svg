<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-request" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#165bb5"/>
    </marker>
    <marker id="arrow-response" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#b6362d"/>
    </marker>
  </defs>

  <!-- Client and Server -->
  <rect x="24" y="18" width="144" height="42" rx="8" fill="#eaf2ff" stroke="#4a89dc" stroke-width="2"/>
  <text x="96" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#165bb5">Client</text>

  <rect x="592" y="18" width="144" height="42" rx="8" fill="#fdecea" stroke="#e06a5f" stroke-width="2"/>
  <text x="664" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#b6362d">Server</text>

  <!-- Timeline lines -->
  <line x1="96" y1="68" x2="96" y2="300" stroke="#4a89dc" stroke-width="2.5" stroke-dasharray="6,4"/>
  <line x1="664" y1="68" x2="664" y2="300" stroke="#e06a5f" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Step 1: POST /login -->
  <rect x="130" y="84" width="228" height="38" rx="7" fill="#eaf2ff" stroke="#4a89dc" stroke-width="1.5"/>
  <text x="244" y="100" text-anchor="middle" font-size="12" fill="#165bb5" font-weight="700">1. POST /login</text>
  <text x="244" y="115" text-anchor="middle" font-size="10" fill="#4c627a">username + password</text>
  <line x1="364" y1="103" x2="626" y2="103" stroke="#165bb5" stroke-width="3" marker-end="url(#arrow-request)"/>

  <!-- Step 2: 200 OK + Set-Cookie -->
  <line x1="626" y1="150" x2="134" y2="150" stroke="#b6362d" stroke-width="3" marker-end="url(#arrow-response)"/>
  <rect x="372" y="128" width="270" height="46" rx="7" fill="#fdecea" stroke="#e06a5f" stroke-width="1.5"/>
  <text x="507" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#b6362d">2. 200 OK + Set-Cookie</text>
  <text x="507" y="160" font-size="10" font-family="monospace" fill="#6c4f4d" text-anchor="middle">session=abc123; HttpOnly; Secure</text>
  <text x="507" y="171" font-size="10" font-family="monospace" fill="#6c4f4d" text-anchor="middle">SameSite=Strict</text>

  <!-- Step 3: Cookie stored -->
  <rect x="30" y="186" width="220" height="40" rx="7" fill="#eef8ee" stroke="#5b9a5f" stroke-width="1.5"/>
  <text x="140" y="203" text-anchor="middle" font-size="12" fill="#2e6f3a" font-weight="700">3. Cookie im Browser gespeichert</text>
  <text x="140" y="218" text-anchor="middle" font-size="10" fill="#4f6651">Client speichert nur die Session-ID</text>

  <!-- Step 4: Authenticated GET -->
  <rect x="128" y="240" width="252" height="40" rx="7" fill="#eaf2ff" stroke="#4a89dc" stroke-width="1.5"/>
  <text x="254" y="257" text-anchor="middle" font-size="12" fill="#165bb5" font-weight="700">4. GET /api/cart</text>
  <text x="254" y="272" font-size="10" font-family="monospace" fill="#4c627a" text-anchor="middle">Cookie: session=abc123</text>
  <line x1="386" y1="258" x2="626" y2="258" stroke="#165bb5" stroke-width="3" marker-end="url(#arrow-request)"/>

  <!-- Server session check note -->
  <rect x="430" y="198" width="266" height="40" rx="7" fill="#fff4dc" stroke="#d8a53a" stroke-width="1.5"/>
  <text x="563" y="215" text-anchor="middle" font-size="12" fill="#9a6b00" font-weight="700">Server validiert Session-ID</text>
  <text x="563" y="230" text-anchor="middle" font-size="10" fill="#7a6334">Lookup in Session-Store, DB oder Cache</text>

  <!-- Step 5: Response with cart -->
  <line x1="626" y1="292" x2="134" y2="292" stroke="#b6362d" stroke-width="3" marker-end="url(#arrow-response)"/>
  <rect x="432" y="270" width="228" height="38" rx="7" fill="#fdecea" stroke="#e06a5f" stroke-width="1.5"/>
  <text x="546" y="286" text-anchor="middle" font-size="12" fill="#b6362d" font-weight="700">5. 200 OK</text>
  <text x="546" y="301" text-anchor="middle" font-size="10" fill="#6c4f4d">Warenkorb-Daten fur diesen Nutzer</text>
</svg>
