<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#1565c0"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#b71c1c"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#1b5e20"/></marker>
  </defs>

  <!-- Client and Server -->
  <rect x="10" y="10" width="130" height="38" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="75" y="34" text-anchor="middle" font-size="13" font-weight="700" fill="#1565c0">Client</text>

  <rect x="560" y="10" width="130" height="38" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="625" y="34" text-anchor="middle" font-size="13" font-weight="700" fill="#b71c1c">Server</text>

  <!-- Timeline lines -->
  <line x1="75" y1="50" x2="75" y2="272" stroke="#4285f4" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="625" y1="50" x2="625" y2="272" stroke="#ea4335" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Step 1: POST /login -->
  <rect x="85" y="58" width="200" height="26" rx="4" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="185" y="70" text-anchor="middle" font-size="10" fill="#1565c0" font-weight="600">POST /login</text>
  <text x="185" y="78" text-anchor="middle" font-size="8.5" fill="#666">username + password</text>
  <line x1="290" y1="71" x2="554" y2="71" stroke="#1565c0" stroke-width="2" marker-end="url(#ab)"/>

  <!-- Step 2: 200 OK + Set-Cookie -->
  <rect x="310" y="105" width="310" height="52" rx="4" fill="#fce8e6" stroke="#ea4335"/>
  <text x="465" y="120" text-anchor="middle" font-size="10" font-weight="700" fill="#b71c1c">200 OK + Set-Cookie</text>
  <text x="465" y="134" font-size="9" font-family="monospace" fill="#555" text-anchor="middle">session=abc123; HttpOnly</text>
  <text x="465" y="148" font-size="9" font-family="monospace" fill="#555" text-anchor="middle">Secure; SameSite=Strict</text>
  <line x1="554" y1="115" x2="86" y2="115" stroke="#b71c1c" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Step 3: Cookie stored -->
  <rect x="10" y="170" width="185" height="28" rx="4" fill="#e6f4ea" stroke="#34a853"/>
  <text x="102" y="187" text-anchor="middle" font-size="10" fill="#1b5e20" font-weight="600">🍪 Cookie gespeichert (Browser)</text>

  <!-- Step 4: Authenticated GET -->
  <rect x="85" y="212" width="260" height="28" rx="4" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="215" y="224" text-anchor="middle" font-size="10" fill="#1565c0" font-weight="600">GET /api/cart</text>
  <text x="215" y="234" font-size="9" font-family="monospace" fill="#555" text-anchor="middle">Cookie: session=abc123</text>
  <line x1="350" y1="226" x2="554" y2="226" stroke="#1565c0" stroke-width="2" marker-end="url(#ab)"/>

  <!-- Server session check note -->
  <rect x="414" y="170" width="275" height="28" rx="4" fill="#fff3cd" stroke="#f9ab00"/>
  <text x="551" y="188" text-anchor="middle" font-size="9" fill="#b06000">🗄️ Server prüft session in DB/Cache</text>

  <!-- Step 5: Response with cart -->
  <rect x="426" y="252" width="200" height="26" rx="4" fill="#fce8e6" stroke="#ea4335"/>
  <text x="526" y="269" text-anchor="middle" font-size="10" fill="#b71c1c" font-weight="600">200 OK (Warenkorb-Daten)</text>
  <line x1="554" y1="265" x2="86" y2="265" stroke="#b71c1c" stroke-width="2" marker-end="url(#ar)"/>
</svg>
