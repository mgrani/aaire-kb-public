<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <!-- Title -->
  <text x="380" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#333">Spring Web Application Stack</text>

  <!-- Client -->
  <rect x="10" y="120" width="120" height="70" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="70" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#1565c0">Client</text>
  <text x="70" y="165" text-anchor="middle" font-size="9" fill="#555">Browser / App</text>
  <text x="70" y="178" text-anchor="middle" font-size="9" fill="#555">HTTP Request</text>

  <!-- Arrow client → server -->
  <line x1="135" y1="155" x2="175" y2="155" stroke="#4285f4" stroke-width="2" marker-end="url(#a1)"/>
  <defs><marker id="a1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#4285f4"/></marker></defs>

  <!-- Web Layer -->
  <rect x="185" y="38" width="170" height="72" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <rect x="185" y="38" width="170" height="22" rx="6" fill="#4285f4"/>
  <text x="270" y="54" text-anchor="middle" font-size="11" font-weight="700" fill="white">Web Layer</text>
  <text x="270" y="74" text-anchor="middle" font-size="10" fill="#1565c0" font-weight="600">DispatcherServlet</text>
  <text x="270" y="90" text-anchor="middle" font-size="10" fill="#555">@Controller / @RestController</text>
  <text x="270" y="102" text-anchor="middle" font-size="9" fill="#888">View (Thymeleaf / JSON)</text>

  <!-- Service Layer -->
  <rect x="185" y="122" width="170" height="66" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <rect x="185" y="122" width="170" height="22" rx="6" fill="#34a853"/>
  <text x="270" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="white">Service Layer</text>
  <text x="270" y="158" text-anchor="middle" font-size="10" fill="#1b5e20" font-weight="600">@Service</text>
  <text x="270" y="174" text-anchor="middle" font-size="10" fill="#555">Geschäftslogik, Validierung</text>
  <text x="270" y="183" text-anchor="middle" font-size="9" fill="#888">DTO — Data Transfer Objects</text>

  <!-- Data Access Layer -->
  <rect x="185" y="200" width="170" height="66" rx="6" fill="#fff3cd" stroke="#f9ab00" stroke-width="2"/>
  <rect x="185" y="200" width="170" height="22" rx="6" fill="#f9ab00"/>
  <text x="270" y="216" text-anchor="middle" font-size="11" font-weight="700" fill="white">Data Access Layer</text>
  <text x="270" y="236" text-anchor="middle" font-size="10" fill="#b06000" font-weight="600">@Repository</text>
  <text x="270" y="252" text-anchor="middle" font-size="10" fill="#555">JPA Entities, Spring Data</text>
  <text x="270" y="261" text-anchor="middle" font-size="9" fill="#888">DAO — Data Access Objects</text>

  <!-- Database -->
  <rect x="185" y="278" width="170" height="28" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="270" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="#b71c1c">Datenbank (SQL)</text>

  <!-- Vertical arrows between layers -->
  <line x1="270" y1="112" x2="270" y2="118" stroke="#666" stroke-width="1.5"/>
  <line x1="270" y1="190" x2="270" y2="196" stroke="#666" stroke-width="1.5"/>
  <line x1="270" y1="268" x2="270" y2="274" stroke="#666" stroke-width="1.5"/>

  <!-- Cross-cutting concerns -->
  <rect x="400" y="38" width="160" height="228" rx="6" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <rect x="400" y="38" width="160" height="22" rx="6" fill="#9c27b0"/>
  <text x="480" y="54" text-anchor="middle" font-size="11" font-weight="700" fill="white">Cross-Cutting (AOP)</text>

  <text x="480" y="80" text-anchor="middle" font-size="10" fill="#6a1b9a" font-weight="600">@PreAuthorize</text>
  <text x="480" y="95" text-anchor="middle" font-size="9" fill="#555">Security / Authentifizierung</text>

  <text x="480" y="120" text-anchor="middle" font-size="10" fill="#6a1b9a" font-weight="600">@Transactional</text>
  <text x="480" y="135" text-anchor="middle" font-size="9" fill="#555">Transaktionsmanagement</text>

  <text x="480" y="160" text-anchor="middle" font-size="10" fill="#6a1b9a" font-weight="600">@Around / Logging</text>
  <text x="480" y="175" text-anchor="middle" font-size="9" fill="#555">Performance, Audit</text>

  <text x="480" y="200" text-anchor="middle" font-size="10" fill="#6a1b9a" font-weight="600">@ExceptionHandler</text>
  <text x="480" y="215" text-anchor="middle" font-size="9" fill="#555">Fehlerbehandlung</text>

  <text x="480" y="245" text-anchor="middle" font-size="9" fill="#888">Spring AOP schneidet</text>
  <text x="480" y="258" text-anchor="middle" font-size="9" fill="#888">quer durch alle Schichten</text>

  <!-- IoC Container -->
  <rect x="600" y="38" width="150" height="228" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <rect x="600" y="38" width="150" height="22" rx="6" fill="#2e7d32"/>
  <text x="675" y="54" text-anchor="middle" font-size="11" font-weight="700" fill="white">IoC Container</text>

  <text x="675" y="80" text-anchor="middle" font-size="10" fill="#1b5e20" font-weight="600">ApplicationContext</text>
  <text x="675" y="100" text-anchor="middle" font-size="9" fill="#555">Erzeugt Beans</text>
  <text x="675" y="115" text-anchor="middle" font-size="9" fill="#555">Injiziert Dependencies</text>
  <text x="675" y="130" text-anchor="middle" font-size="9" fill="#555">Verwaltet Lebenszyklus</text>

  <text x="675" y="160" text-anchor="middle" font-size="9" fill="#1b5e20" font-weight="600">Konfiguration via:</text>
  <text x="675" y="178" text-anchor="middle" font-size="9" fill="#555">• Java Annotations</text>
  <text x="675" y="193" text-anchor="middle" font-size="9" fill="#555">• application.properties</text>
  <text x="675" y="208" text-anchor="middle" font-size="9" fill="#555">• XML (legacy)</text>

  <text x="675" y="240" text-anchor="middle" font-size="9" fill="#1b5e20" font-weight="600">Hollywood Prinzip:</text>
  <text x="675" y="255" text-anchor="middle" font-size="9" fill="#555">"Don't call us,</text>
  <text x="675" y="268" text-anchor="middle" font-size="9" fill="#555"> we call you!"</text>
</svg>
