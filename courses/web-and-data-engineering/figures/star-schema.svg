<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <text x="250" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#333">Star Schema</text>

  <!-- Fact table (center) -->
  <rect x="165" y="130" width="170" height="120" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="2.5"/>
  <rect x="165" y="130" width="170" height="22" rx="6" fill="#4285f4"/>
  <text x="250" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="white">fact_sales</text>
  <text x="180" y="167" font-size="9" fill="#555">sale_id (PK)</text>
  <text x="180" y="181" font-size="9" fill="#1565c0" font-weight="600">product_id (FK)</text>
  <text x="180" y="195" font-size="9" fill="#1565c0" font-weight="600">customer_id (FK)</text>
  <text x="180" y="209" font-size="9" fill="#1565c0" font-weight="600">time_id (FK)</text>
  <text x="180" y="223" font-size="9" fill="#1565c0" font-weight="600">store_id (FK)</text>
  <text x="180" y="237" font-size="9" fill="#555">amount, quantity</text>

  <!-- dim_product (top-left) -->
  <rect x="10" y="30" width="130" height="80" rx="5" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <rect x="10" y="30" width="130" height="20" rx="5" fill="#34a853"/>
  <text x="75" y="44" text-anchor="middle" font-size="10" font-weight="700" fill="white">dim_product</text>
  <text x="20" y="63" font-size="8" fill="#555">product_id (PK)</text>
  <text x="20" y="75" font-size="8" fill="#555">name, category</text>
  <text x="20" y="87" font-size="8" fill="#555">brand, price</text>
  <text x="20" y="99" font-size="8" fill="#555">supplier</text>

  <!-- dim_customer (top-right) -->
  <rect x="360" y="30" width="130" height="80" rx="5" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <rect x="360" y="30" width="130" height="20" rx="5" fill="#34a853"/>
  <text x="425" y="44" text-anchor="middle" font-size="10" font-weight="700" fill="white">dim_customer</text>
  <text x="370" y="63" font-size="8" fill="#555">customer_id (PK)</text>
  <text x="370" y="75" font-size="8" fill="#555">name, email</text>
  <text x="370" y="87" font-size="8" fill="#555">segment</text>
  <text x="370" y="99" font-size="8" fill="#555">region, city</text>

  <!-- dim_time (bottom-left) -->
  <rect x="10" y="270" width="130" height="80" rx="5" fill="#fff3cd" stroke="#f9ab00" stroke-width="1.5"/>
  <rect x="10" y="270" width="130" height="20" rx="5" fill="#f9ab00"/>
  <text x="75" y="284" text-anchor="middle" font-size="10" font-weight="700" fill="white">dim_time</text>
  <text x="20" y="303" font-size="8" fill="#555">time_id (PK)</text>
  <text x="20" y="315" font-size="8" fill="#555">date, month, quarter</text>
  <text x="20" y="327" font-size="8" fill="#555">year, weekday</text>
  <text x="20" y="339" font-size="8" fill="#555">is_holiday</text>

  <!-- dim_store (bottom-right) -->
  <rect x="360" y="270" width="130" height="80" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <rect x="360" y="270" width="130" height="20" rx="5" fill="#9c27b0"/>
  <text x="425" y="284" text-anchor="middle" font-size="10" font-weight="700" fill="white">dim_store</text>
  <text x="370" y="303" font-size="8" fill="#555">store_id (PK)</text>
  <text x="370" y="315" font-size="8" fill="#555">name, address</text>
  <text x="370" y="327" font-size="8" fill="#555">city, region</text>
  <text x="370" y="339" font-size="8" fill="#555">manager</text>

  <!-- Lines from dimensions to fact -->
  <line x1="140" y1="90" x2="175" y2="145" stroke="#34a853" stroke-width="1.5"/>
  <line x1="360" y1="90" x2="325" y2="145" stroke="#34a853" stroke-width="1.5"/>
  <line x1="140" y1="290" x2="175" y2="240" stroke="#f9ab00" stroke-width="1.5"/>
  <line x1="360" y1="290" x2="325" y2="240" stroke="#9c27b0" stroke-width="1.5"/>

  <!-- Legend -->
  <text x="250" y="370" text-anchor="middle" font-size="9" fill="#888" font-style="italic">Faktentabelle (Mitte) verbunden mit Dimensionstabellen (Punkte des Sterns)</text>
</svg>
