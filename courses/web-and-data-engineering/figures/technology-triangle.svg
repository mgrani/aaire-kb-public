<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Technologie-Dreieck des Webs</title>
  <desc id="desc">Reduzierte Darstellung des Zusammenspiels von HTML, CSS und JavaScript. HTML steht für Inhalt, CSS für Layout und JavaScript für Interaktion.</desc>

  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1a73e8"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ef6c00"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="28" y="28" width="904" height="484" rx="26" fill="#f8fafc" stroke="#d7dee7"/>

  <g filter="url(#shadow)">
    <rect x="330" y="76" width="300" height="132" rx="22" fill="#fdecea" stroke="#d93025" stroke-width="3"/>
    <text x="480" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#b3261e">HTML</text>
    <text x="480" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7a1f19">Inhalt und Semantik</text>
    <text x="480" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">Was ist auf der Seite?</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="78" y="344" width="286" height="132" rx="22" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/>
    <text x="221" y="386" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1a73e8">CSS</text>
    <text x="221" y="418" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1557b0">Layout und Darstellung</text>
    <text x="221" y="446" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">Wie sieht es aus?</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="596" y="344" width="286" height="132" rx="22" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/>
    <text x="739" y="386" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#ef6c00">JavaScript</text>
    <text x="739" y="418" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#c25b00">Interaktion und Zustand</text>
    <text x="739" y="446" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">Was passiert?</text>
  </g>

  <path d="M380 218 L292 332" fill="none" stroke="#1a73e8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="285" y="266" transform="rotate(-52 285 266)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1a73e8">CSS stylt HTML</text>

  <path d="M580 218 L668 332" fill="none" stroke="#ef6c00" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="675" y="266" transform="rotate(52 675 266)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ef6c00">JS nutzt DOM</text>

  <path d="M584 410 L376 410" fill="none" stroke="#ef6c00" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arrow-orange)"/>
  <text x="480" y="398" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ef6c00">JS setzt Klassen und Styles</text>
</svg>
