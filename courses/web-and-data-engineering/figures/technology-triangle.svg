<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">Das Technologie-Dreieck des Webs</title>
  <desc id="desc">HTML (Struktur), CSS (Darstellung) und JavaScript (Verhalten) als Dreieck mit ihren Verantwortungen und Abhängigkeitsrichtungen. JS kann DOM und CSSOM ändern, CSS reagiert auf HTML-Zustände, HTML funktioniert allein.</desc>
  <rect width="900" height="480" fill="#ffffff"/>

  <text x="450" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111111">Das Technologie-Dreieck des Webs</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- HTML node (top) -->
  <g transform="translate(350, 65)">
    <rect x="0" y="0" width="200" height="100" rx="14" fill="#fce8e6" stroke="#ea4335" stroke-width="2.5"/>
    <text x="100" y="35" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#c5221f">HTML</text>
    <text x="100" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#666">Struktur + Semantik</text>
    <text x="100" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#888">Was existiert?</text>
    <text x="100" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#34a853">funktioniert allein</text>
  </g>

  <!-- CSS node (bottom-left) -->
  <g transform="translate(100, 300)">
    <rect x="0" y="0" width="200" height="100" rx="14" fill="#e8f0fe" stroke="#4285f4" stroke-width="2.5"/>
    <text x="100" y="35" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1a73e8">CSS</text>
    <text x="100" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#666">Darstellung + Layout</text>
    <text x="100" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#888">Wie sieht es aus?</text>
    <text x="100" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#888">braucht HTML als Ziel</text>
  </g>

  <!-- JavaScript node (bottom-right) -->
  <g transform="translate(600, 300)">
    <rect x="0" y="0" width="200" height="100" rx="14" fill="#fef7e0" stroke="#f9ab00" stroke-width="2.5"/>
    <text x="100" y="35" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#e37400">JavaScript</text>
    <text x="100" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#666">Verhalten + Zustand</text>
    <text x="100" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#888">Was passiert?</text>
    <text x="100" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#888">braucht DOM (aus HTML)</text>
  </g>

  <!-- Connection: HTML → CSS (CSS selects HTML elements) -->
  <line x1="370" y1="165" x2="250" y2="300" stroke="#4285f4" stroke-width="2" marker-end="url(#arr)"/>
  <text x="260" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4285f4" transform="rotate(-30 260 230)">Selektoren matchen DOM</text>

  <!-- Connection: HTML → JS (JS reads DOM) -->
  <line x1="530" y1="165" x2="650" y2="300" stroke="#f9ab00" stroke-width="2" marker-end="url(#arr)"/>
  <text x="640" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#e37400" transform="rotate(30 640 230)">liest + ändert DOM</text>

  <!-- Connection: JS → CSS (JS triggers CSS) -->
  <line x1="600" y1="350" x2="300" y2="350" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
  <text x="450" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666">triggert Klassen / Styles</text>

  <!-- Decision flow at bottom -->
  <g transform="translate(100, 430)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#333">Entscheidungsregel:</text>
    <rect x="170" y="-16" width="180" height="24" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1"/>
    <text x="260" y="2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c5221f">Kann HTML das nativ?</text>
    <text x="365" y="2" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#666">→</text>
    <rect x="380" y="-16" width="210" height="24" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1"/>
    <text x="485" y="2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1a73e8">Kann CSS auf Zustand reagieren?</text>
    <text x="605" y="2" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#666">→</text>
    <rect x="620" y="-16" width="190" height="24" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1"/>
    <text x="715" y="2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#e37400">Neuer Zustand nötig → JS</text>
  </g>
</svg>