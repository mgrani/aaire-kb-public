<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#1565c0"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#b71c1c"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#1b5e20"/></marker>
  </defs>

  <!-- Client and Server header boxes -->
  <rect x="10" y="10" width="140" height="40" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="80" y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#1565c0">Client</text>

  <rect x="550" y="10" width="140" height="40" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="620" y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#b71c1c">Server</text>

  <!-- Timeline vertical lines -->
  <line x1="80" y1="52" x2="80" y2="345" stroke="#4285f4" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="620" y1="52" x2="620" y2="345" stroke="#ea4335" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Server activation bars (server is busy during these intervals) -->
  <rect x="617" y="76" width="6" height="46" fill="#fce8e6" stroke="#b71c1c" stroke-width="1"/>
  <rect x="617" y="212" width="6" height="42" fill="#fce8e6" stroke="#b71c1c" stroke-width="1"/>
  <rect x="617" y="311" width="6" height="32" fill="#fce8e6" stroke="#b71c1c" stroke-width="1"/>

  <!-- Step 1: ClientHello -->
  <rect x="90" y="62" width="200" height="28" rx="4" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="190" y="74" text-anchor="middle" font-size="10" fill="#1565c0" font-weight="600">ClientHello</text>
  <text x="190" y="84" text-anchor="middle" font-size="8.5" fill="#666">TLS-Version, Cipher Suites, Random</text>
  <line x1="295" y1="76" x2="610" y2="76" stroke="#1565c0" stroke-width="2" marker-end="url(#ab)"/>

  <!-- Step 2: ServerHello + Certificate -->
  <rect x="408" y="108" width="210" height="28" rx="4" fill="#fce8e6" stroke="#ea4335"/>
  <text x="513" y="120" text-anchor="middle" font-size="10" fill="#b71c1c" font-weight="600">ServerHello + Zertifikat</text>
  <text x="513" y="130" text-anchor="middle" font-size="8.5" fill="#666">gewählte Cipher, CA-Zertifikat</text>
  <line x1="610" y1="122" x2="90" y2="122" stroke="#b71c1c" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Step 3: Certificate verification (client only) -->
  <rect x="10" y="150" width="200" height="30" rx="4" fill="#fff3cd" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="110" y="165" text-anchor="middle" font-size="10" fill="#b06000" font-weight="600">🔍 Zertifikat prüfen</text>
  <text x="110" y="176" text-anchor="middle" font-size="8.5" fill="#888">CA-Kette · Ablaufdatum · Domain</text>

  <!-- Step 4: Key Exchange -->
  <rect x="90" y="198" width="200" height="28" rx="4" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="190" y="210" text-anchor="middle" font-size="10" fill="#1565c0" font-weight="600">Key Exchange</text>
  <text x="190" y="220" text-anchor="middle" font-size="8.5" fill="#666">mit Server-Public-Key verschlüsselt</text>
  <line x1="295" y1="212" x2="610" y2="212" stroke="#1565c0" stroke-width="2" marker-end="url(#ab)"/>

  <!-- Step 5: Symmetric key established (both sides) -->
  <rect x="130" y="254" width="440" height="28" rx="4" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="350" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#1b5e20">🔑 Symmetrischer Sitzungsschlüssel vereinbart</text>

  <!-- Step 6: Encrypted Request -->
  <rect x="90" y="298" width="200" height="26" rx="4" fill="#e6f4ea" stroke="#34a853"/>
  <text x="190" y="315" text-anchor="middle" font-size="10" fill="#1b5e20" font-weight="600">🔒 Verschlüsselter HTTP-Request</text>
  <line x1="295" y1="311" x2="610" y2="311" stroke="#1b5e20" stroke-width="2" marker-end="url(#ag)"/>

  <!-- Step 7: Encrypted Response -->
  <rect x="410" y="330" width="200" height="26" rx="4" fill="#e6f4ea" stroke="#34a853"/>
  <text x="510" y="347" text-anchor="middle" font-size="10" fill="#1b5e20" font-weight="600">🔒 Verschlüsselte HTTP-Response</text>
  <line x1="610" y1="343" x2="90" y2="343" stroke="#1b5e20" stroke-width="2" marker-end="url(#ag)"/>

  <!-- Step labels on left margin -->
  <text x="5" y="80" font-size="9" font-weight="700" fill="#4285f4">①</text>
  <text x="5" y="125" font-size="9" font-weight="700" fill="#b71c1c">②</text>
  <text x="5" y="168" font-size="9" font-weight="700" fill="#b06000">③</text>
  <text x="5" y="215" font-size="9" font-weight="700" fill="#4285f4">④</text>
  <text x="5" y="272" font-size="9" font-weight="700" fill="#1b5e20">⑤</text>
  <text x="5" y="315" font-size="9" font-weight="700" fill="#1b5e20">⑥</text>
</svg>
