<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 255" font-family="'Source Sans Pro', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="vn-fwd" viewBox="0 0 10 10" markerWidth="9" markerHeight="9"
            refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a5fa8"/>
    </marker>
    <marker id="vn-bwd" viewBox="0 0 10 10" markerWidth="9" markerHeight="9"
            refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f9ab00"/>
    </marker>
    <marker id="vn-bus" viewBox="0 0 10 10" markerWidth="10" markerHeight="10"
            refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f9ab00"/>
    </marker>
    <marker id="vn-io" viewBox="0 0 10 10" markerWidth="8" markerHeight="8"
            refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
    <marker id="vn-iobwd" viewBox="0 0 10 10" markerWidth="8" markerHeight="8"
            refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
  </defs>

  <!-- ══ Input ══ -->
  <rect x="8" y="98" width="82" height="52" rx="7" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="49" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#222">Eingabe</text>
  <text x="49" y="138" text-anchor="middle" font-size="10" fill="#666">Input</text>
  <line x1="90" y1="124" x2="108" y2="124" stroke="#1a5fa8" stroke-width="2" marker-end="url(#vn-fwd)"/>

  <!-- ══ CPU outer box ══ -->
  <rect x="113" y="18" width="280" height="218" rx="10" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="2.5"/>
  <text x="253" y="42" text-anchor="middle" font-size="12" font-weight="700" fill="#1a5fa8">Central Processing Unit (CPU)</text>

  <!-- CU -->
  <rect x="133" y="55" width="112" height="48" rx="6" fill="#ffffff" stroke="#1a5fa8" stroke-width="1.5"/>
  <text x="189" y="75" text-anchor="middle" font-size="12" fill="#222" font-weight="600">Steuerwerk</text>
  <text x="189" y="91" text-anchor="middle" font-size="10" fill="#777">Control Unit</text>

  <!-- ALU -->
  <rect x="258" y="55" width="112" height="48" rx="6" fill="#ffffff" stroke="#1a5fa8" stroke-width="1.5"/>
  <text x="314" y="75" text-anchor="middle" font-size="12" fill="#222" font-weight="600">Rechenwerk</text>
  <text x="314" y="91" text-anchor="middle" font-size="10" fill="#777">ALU</text>

  <!-- Registers -->
  <rect x="196" y="155" width="112" height="48" rx="6" fill="#ffffff" stroke="#1a5fa8" stroke-width="1.5"/>
  <text x="252" y="175" text-anchor="middle" font-size="12" fill="#222" font-weight="600">Register</text>
  <text x="252" y="191" text-anchor="middle" font-size="10" fill="#777">Zwischenspeicher</text>

  <!-- Internal: CU ↔ ALU -->
  <line x1="245" y1="79" x2="258" y2="79" stroke="#1a5fa8" stroke-width="1.5" marker-start="url(#vn-fwd)" marker-end="url(#vn-fwd)"/>

  <!-- Internal: CU → REG -->
  <line x1="189" y1="103" x2="220" y2="155" stroke="#1a5fa8" stroke-width="1.5" marker-start="url(#vn-fwd)" marker-end="url(#vn-fwd)"/>

  <!-- Internal: ALU → REG -->
  <line x1="314" y1="103" x2="285" y2="155" stroke="#1a5fa8" stroke-width="1.5" marker-start="url(#vn-fwd)" marker-end="url(#vn-fwd)"/>

  <!-- ══ System Bus ══ -->
  <line x1="393" y1="80" x2="542" y2="80" stroke="#f9ab00" stroke-width="3"
        marker-start="url(#vn-bwd)" marker-end="url(#vn-bus)"/>
  <text x="468" y="73" text-anchor="middle" font-size="10" fill="#b07800" font-weight="600">System Bus</text>

  <!-- ══ Output ══ -->
  <line x1="393" y1="124" x2="411" y2="124" stroke="#1a5fa8" stroke-width="2" marker-end="url(#vn-fwd)"/>
  <rect x="416" y="98" width="82" height="52" rx="7" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="457" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#222">Ausgabe</text>
  <text x="457" y="138" text-anchor="middle" font-size="10" fill="#666">Output</text>

  <!-- ══ RAM ══ -->
  <rect x="547" y="20" width="155" height="90" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2.5"/>
  <text x="624" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#222">Hauptspeicher</text>
  <text x="624" y="67" text-anchor="middle" font-size="11" fill="#555">RAM</text>
  <text x="624" y="84" text-anchor="middle" font-size="10" fill="#888">Programm + Daten (flüchtig)</text>

  <!-- RAM ↔ Storage (I/O) -->
  <line x1="590" y1="110" x2="567" y2="158" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"
        marker-start="url(#vn-iobwd)" marker-end="url(#vn-io)"/>
  <text x="562" y="147" text-anchor="end" font-size="9" fill="#999">I/O</text>

  <!-- RAM ↔ Network (I/O) -->
  <line x1="660" y1="110" x2="683" y2="158" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"
        marker-start="url(#vn-iobwd)" marker-end="url(#vn-io)"/>
  <text x="690" y="147" font-size="9" fill="#999">I/O</text>

  <!-- ══ Storage ══ -->
  <rect x="520" y="163" width="118" height="55" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="579" y="186" text-anchor="middle" font-size="12" font-weight="600" fill="#222">Storage</text>
  <text x="579" y="203" text-anchor="middle" font-size="10" fill="#777">SSD / HDD</text>
  <text x="579" y="217" text-anchor="middle" font-size="9" fill="#999">persistent</text>

  <!-- ══ Network ══ -->
  <rect x="652" y="163" width="118" height="55" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="711" y="186" text-anchor="middle" font-size="12" font-weight="600" fill="#222">Netzwerk</text>
  <text x="711" y="203" text-anchor="middle" font-size="10" fill="#777">Netzwerk-I/O</text>
  <text x="711" y="217" text-anchor="middle" font-size="9" fill="#999">Kommunikation</text>

  <!-- Principle label -->
  <text x="440" y="248" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">Software verwaltet letztlich vier Ressourcen: CPU · RAM · Storage · Netzwerk</text>
</svg>
