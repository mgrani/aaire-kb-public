<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" font-family="'Source Sans Pro', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-fwd" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#1a5fa8"/>
    </marker>
    <marker id="a-dash" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#aaaaaa"/>
    </marker>
  </defs>

  <!-- ══ ROW 1: Internet-facing chain ══ -->

  <!-- Nutzer -->
  <rect x="10" y="22" width="90" height="55" rx="7" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="2"/>
  <text x="55" y="46" text-anchor="middle" font-size="12" font-weight="700" fill="#222">Nutzer</text>
  <text x="55" y="63" text-anchor="middle" font-size="10" fill="#555">Browser / App</text>

  <line x1="100" y1="49" x2="118" y2="49" stroke="#1a5fa8" stroke-width="2" marker-end="url(#a-fwd)"/>

  <!-- DNS -->
  <rect x="120" y="22" width="90" height="55" rx="7" fill="#f5f5f5" stroke="#888" stroke-width="1.5"/>
  <text x="165" y="46" text-anchor="middle" font-size="12" font-weight="700" fill="#222">DNS</text>
  <text x="165" y="63" text-anchor="middle" font-size="10" fill="#666">Namensauflösung</text>

  <line x1="210" y1="49" x2="228" y2="49" stroke="#1a5fa8" stroke-width="2" marker-end="url(#a-fwd)"/>

  <!-- CDN -->
  <rect x="230" y="22" width="90" height="55" rx="7" fill="#f5f5f5" stroke="#888" stroke-width="1.5"/>
  <text x="275" y="46" text-anchor="middle" font-size="12" font-weight="700" fill="#222">CDN</text>
  <text x="275" y="63" text-anchor="middle" font-size="10" fill="#666">Edge Cache</text>

  <line x1="320" y1="49" x2="338" y2="49" stroke="#1a5fa8" stroke-width="2" marker-end="url(#a-fwd)"/>

  <!-- WAF -->
  <rect x="340" y="22" width="90" height="55" rx="7" fill="#f5f5f5" stroke="#888" stroke-width="1.5"/>
  <text x="385" y="46" text-anchor="middle" font-size="12" font-weight="700" fill="#222">WAF</text>
  <text x="385" y="63" text-anchor="middle" font-size="10" fill="#666">Firewall</text>

  <line x1="430" y1="49" x2="448" y2="49" stroke="#1a5fa8" stroke-width="2" marker-end="url(#a-fwd)"/>

  <!-- Load Balancer -->
  <rect x="450" y="22" width="110" height="55" rx="7" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="2"/>
  <text x="505" y="46" text-anchor="middle" font-size="12" font-weight="700" fill="#222">Load</text>
  <text x="505" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#222">Balancer</text>

  <!-- LB → Web Tier (down) -->
  <line x1="505" y1="77" x2="505" y2="108" stroke="#1a5fa8" stroke-width="2" marker-end="url(#a-fwd)"/>

  <!-- ══ ROW 2: Application Tiers ══ -->

  <!-- Web Tier -->
  <rect x="390" y="110" width="230" height="58" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2.5"/>
  <text x="505" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#222">Web Tier</text>
  <text x="505" y="153" text-anchor="middle" font-size="11" fill="#444">Präsentationsschicht · SSR / SPA</text>

  <!-- Web Tier → App Tier (down) -->
  <line x1="505" y1="168" x2="505" y2="198" stroke="#1a5fa8" stroke-width="2" marker-end="url(#a-fwd)"/>

  <!-- App Tier -->
  <rect x="370" y="200" width="270" height="58" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2.5"/>
  <text x="505" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#222">App Tier</text>
  <text x="505" y="243" text-anchor="middle" font-size="11" fill="#444">Geschäftslogik · Services · Validierung</text>

  <!-- ══ ROW 3: Data & Async ══ -->

  <!-- App → Cache -->
  <line x1="420" y1="258" x2="310" y2="285" stroke="#f9ab00" stroke-width="1.8" marker-end="url(#a-fwd)"/>

  <!-- App → DB -->
  <line x1="505" y1="258" x2="505" y2="285" stroke="#f9ab00" stroke-width="1.8" marker-end="url(#a-fwd)"/>

  <!-- App → Queue (dashed) -->
  <line x1="590" y1="258" x2="700" y2="285" stroke="#aaa" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#a-dash)"/>

  <!-- Cache -->
  <rect x="215" y="288" width="130" height="50" rx="6" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="1.5"/>
  <text x="280" y="309" text-anchor="middle" font-size="12" font-weight="600" fill="#222">Cache</text>
  <text x="280" y="327" text-anchor="middle" font-size="10" fill="#666">Redis · In-Memory</text>

  <!-- DB -->
  <rect x="435" y="288" width="140" height="50" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="505" y="309" text-anchor="middle" font-size="12" font-weight="600" fill="#222">Datenbank</text>
  <text x="505" y="327" text-anchor="middle" font-size="10" fill="#666">PostgreSQL · NoSQL</text>

  <!-- Message Queue -->
  <rect x="660" y="288" width="130" height="50" rx="6" fill="#f5f5f5" stroke="#888" stroke-width="1.5"/>
  <text x="725" y="309" text-anchor="middle" font-size="12" font-weight="600" fill="#222">Queue</text>
  <text x="725" y="327" text-anchor="middle" font-size="10" fill="#666">Kafka · RabbitMQ</text>

  <!-- Queue → Worker -->
  <line x1="790" y1="313" x2="820" y2="313" stroke="#aaa" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#a-dash)"/>

  <!-- Worker -->
  <rect x="822" y="288" width="140" height="50" rx="6" fill="#f5f5f5" stroke="#888" stroke-width="1.5"/>
  <text x="892" y="309" text-anchor="middle" font-size="12" font-weight="600" fill="#222">Worker</text>
  <text x="892" y="327" text-anchor="middle" font-size="10" fill="#666">E-Mail · PDF · Sync</text>

  <!-- Legend: async dashes -->
  <line x1="700" y1="270" x2="715" y2="270" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="718" y="274" font-size="10" fill="#999">asynchron</text>
</svg>
