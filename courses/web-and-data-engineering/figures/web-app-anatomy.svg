<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 295"
     font-family="'Source Sans Pro', Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="waa-title waa-desc">
  <title id="waa-title">Anatomie einer modernen Web-Anwendung</title>
  <desc id="waa-desc">Schlangenförmiges Diagramm. Zeile 1 links nach rechts: Nutzer, DNS, CDN, WAF, Load Balancer, Reverse Proxy. Zeile 2 rechts nach links: Web Tier zu App Tier. Zeile 3 Fan-out: App Tier zu Cache, Datenbank, Queue und Worker (asynchron).</desc>

  <defs>
    <marker id="a-fwd" viewBox="0 0 10 10" markerWidth="9" markerHeight="9"
            refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a5fa8"/>
    </marker>
    <marker id="a-app" viewBox="0 0 10 10" markerWidth="9" markerHeight="9"
            refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f9ab00"/>
    </marker>
    <marker id="a-dash" viewBox="0 0 10 10" markerWidth="8" markerHeight="8"
            refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#aaaaaa"/>
    </marker>
  </defs>

  <!-- ══ ROW 1: Internet-facing chain, left → right (y=18, h=50, mid=43) ══ -->
  <!-- Box width=130, gap=17, start x=10 -->

  <!-- Nutzer: x=10–140 -->
  <rect x="10"  y="18" width="130" height="50" rx="7" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="2"/>
  <text x="75"  y="40" text-anchor="middle" font-size="12" font-weight="700" fill="#222">Nutzer</text>
  <text x="75"  y="57" text-anchor="middle" font-size="10" fill="#555">Browser / App</text>
  <line x1="141" y1="43" x2="155" y2="43" stroke="#1a5fa8" stroke-width="2" marker-end="url(#a-fwd)"/>

  <!-- DNS: x=157–287 -->
  <rect x="157" y="18" width="130" height="50" rx="7" fill="#f5f5f5" stroke="#888" stroke-width="1.5"/>
  <text x="222" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="#222">DNS</text>
  <text x="222" y="57" text-anchor="middle" font-size="10" fill="#666">Namensauflösung</text>
  <line x1="288" y1="43" x2="302" y2="43" stroke="#1a5fa8" stroke-width="2" marker-end="url(#a-fwd)"/>

  <!-- CDN: x=304–434 -->
  <rect x="304" y="18" width="130" height="50" rx="7" fill="#f5f5f5" stroke="#888" stroke-width="1.5"/>
  <text x="369" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="#222">CDN</text>
  <text x="369" y="57" text-anchor="middle" font-size="10" fill="#666">Edge Cache</text>
  <line x1="435" y1="43" x2="449" y2="43" stroke="#1a5fa8" stroke-width="2" marker-end="url(#a-fwd)"/>

  <!-- WAF: x=451–581 -->
  <rect x="451" y="18" width="130" height="50" rx="7" fill="#f5f5f5" stroke="#888" stroke-width="1.5"/>
  <text x="516" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="#222">WAF</text>
  <text x="516" y="57" text-anchor="middle" font-size="10" fill="#666">Web App Firewall</text>
  <line x1="582" y1="43" x2="596" y2="43" stroke="#1a5fa8" stroke-width="2" marker-end="url(#a-fwd)"/>

  <!-- Load Balancer: x=598–728 -->
  <rect x="598" y="18" width="130" height="50" rx="7" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="2"/>
  <text x="663" y="37" text-anchor="middle" font-size="12" font-weight="700" fill="#222">Load</text>
  <text x="663" y="53" text-anchor="middle" font-size="12" font-weight="700" fill="#222">Balancer</text>
  <line x1="729" y1="43" x2="743" y2="43" stroke="#1a5fa8" stroke-width="2" marker-end="url(#a-fwd)"/>

  <!-- Reverse Proxy: x=745–905 -->
  <rect x="745" y="18" width="160" height="50" rx="7" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="2"/>
  <text x="825" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="#222">Reverse Proxy</text>
  <text x="825" y="57" text-anchor="middle" font-size="10" fill="#555">nginx · HAProxy · Envoy</text>

  <!-- Serpentine turn: right edge of RP → outer margin → down → enter Web Tier from right -->
  <path d="M 906 43 L 950 43 L 950 141 L 942 141"
        fill="none" stroke="#1a5fa8" stroke-width="2" marker-end="url(#a-fwd)"/>

  <!-- ══ ROW 2: Application Tiers, right → left (y=115, h=52, mid=141) ══ -->

  <!-- Web Tier: x=720–940 -->
  <rect x="720" y="115" width="220" height="52" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2.5"/>
  <text x="830" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#222">Web Tier</text>
  <text x="830" y="156" text-anchor="middle" font-size="10" fill="#444">SSR / SPA · Präsentation</text>

  <!-- Web Tier → App Tier (left-pointing) -->
  <line x1="719" y1="141" x2="432" y2="141" stroke="#1a5fa8" stroke-width="2" marker-end="url(#a-fwd)"/>

  <!-- App Tier: x=200–430 -->
  <rect x="200" y="115" width="230" height="52" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2.5"/>
  <text x="315" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#222">App Tier</text>
  <text x="315" y="156" text-anchor="middle" font-size="10" fill="#444">Geschäftslogik · Services</text>

  <!-- ══ ROW 3: Data & Async fan-out (y=228, h=48) ══ -->

  <!-- App Tier → Cache (solid, left-down) -->
  <line x1="265" y1="168" x2="88"  y2="226" stroke="#f9ab00" stroke-width="1.8" marker-end="url(#a-app)"/>

  <!-- App Tier → DB (solid, down) -->
  <line x1="315" y1="168" x2="268" y2="226" stroke="#f9ab00" stroke-width="1.8" marker-end="url(#a-app)"/>

  <!-- App Tier → Queue (async / dashed, right-down) -->
  <line x1="365" y1="168" x2="453" y2="226"
        stroke="#aaa" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#a-dash)"/>

  <!-- Cache: x=10–160 -->
  <rect x="10"  y="228" width="150" height="48" rx="6" fill="#e8f0fe" stroke="#1a5fa8" stroke-width="1.5"/>
  <text x="85"  y="249" text-anchor="middle" font-size="12" font-weight="600" fill="#222">Cache</text>
  <text x="85"  y="267" text-anchor="middle" font-size="10" fill="#666">Redis · In-Memory</text>

  <!-- DB: x=178–348 -->
  <rect x="178" y="228" width="170" height="48" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="263" y="249" text-anchor="middle" font-size="12" font-weight="600" fill="#222">Datenbank</text>
  <text x="263" y="267" text-anchor="middle" font-size="10" fill="#666">PostgreSQL · NoSQL</text>

  <!-- Queue: x=378–528 -->
  <rect x="378" y="228" width="150" height="48" rx="6" fill="#f5f5f5" stroke="#888" stroke-width="1.5"/>
  <text x="453" y="249" text-anchor="middle" font-size="12" font-weight="600" fill="#222">Queue</text>
  <text x="453" y="267" text-anchor="middle" font-size="10" fill="#666">Kafka · RabbitMQ</text>

  <!-- Queue → Worker (async) -->
  <line x1="529" y1="252" x2="547" y2="252"
        stroke="#aaa" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#a-dash)"/>

  <!-- Worker: x=549–709 -->
  <rect x="549" y="228" width="160" height="48" rx="6" fill="#f5f5f5" stroke="#888" stroke-width="1.5"/>
  <text x="629" y="249" text-anchor="middle" font-size="12" font-weight="600" fill="#222">Worker</text>
  <text x="629" y="267" text-anchor="middle" font-size="10" fill="#666">E-Mail · PDF · Sync</text>

  <!-- Legend -->
  <line x1="755" y1="258" x2="775" y2="258" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="779" y="262" font-size="10" fill="#999">asynchron</text>
</svg>
