<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" font-family="'Source Sans Pro', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1a5fa8"/>
    </marker>
  </defs>

  <!-- horizontal backbone line -->
  <line x1="65" y1="60" x2="1135" y2="60" stroke="#dddddd" stroke-width="2"/>

  <!-- === PHASE 1: Dokumente === -->
  <rect x="65" y="15" width="160" height="90" rx="8" fill="#f0f4fb" stroke="#1a5fa8" stroke-width="2"/>
  <text x="145" y="44" text-anchor="middle" font-weight="700" font-size="15" fill="#111">Dokumente</text>
  <text x="145" y="63" text-anchor="middle" font-size="12" fill="#777">1989–1994</text>
  <line x1="145" y1="75" x2="145" y2="88" stroke="#bbbbbb" stroke-width="1"/>
  <text x="145" y="99" text-anchor="middle" font-size="11" fill="#1a5fa8">Protokolle &amp; Adressen</text>

  <!-- arrow 1→2 -->
  <line x1="226" y1="60" x2="275" y2="60" stroke="#1a5fa8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- === PHASE 2: Anwendungen === -->
  <rect x="280" y="15" width="160" height="90" rx="8" fill="#f0f4fb" stroke="#1a5fa8" stroke-width="2"/>
  <text x="360" y="44" text-anchor="middle" font-weight="700" font-size="15" fill="#111">Anwendungen</text>
  <text x="360" y="63" text-anchor="middle" font-size="12" fill="#777">1995–2001</text>
  <line x1="360" y1="75" x2="360" y2="88" stroke="#bbbbbb" stroke-width="1"/>
  <text x="360" y="99" text-anchor="middle" font-size="11" fill="#1a5fa8">Architektur &amp; Zustand</text>

  <!-- arrow 2→3 -->
  <line x1="441" y1="60" x2="490" y2="60" stroke="#1a5fa8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- === PHASE 3: Plattformen === -->
  <rect x="495" y="15" width="160" height="90" rx="8" fill="#f0f4fb" stroke="#1a5fa8" stroke-width="2"/>
  <text x="575" y="44" text-anchor="middle" font-weight="700" font-size="15" fill="#111">Plattformen</text>
  <text x="575" y="63" text-anchor="middle" font-size="12" fill="#777">2004–2012</text>
  <line x1="575" y1="75" x2="575" y2="88" stroke="#bbbbbb" stroke-width="1"/>
  <text x="575" y="99" text-anchor="middle" font-size="11" fill="#1a5fa8">Skalierung &amp; Teams</text>

  <!-- arrow 3→4 -->
  <line x1="656" y1="60" x2="705" y2="60" stroke="#1a5fa8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- === PHASE 4: Datengetrieben === -->
  <rect x="710" y="15" width="160" height="90" rx="8" fill="#f0f4fb" stroke="#1a5fa8" stroke-width="2"/>
  <text x="790" y="44" text-anchor="middle" font-weight="700" font-size="15" fill="#111">Datengetrieben</text>
  <text x="790" y="63" text-anchor="middle" font-size="12" fill="#777">2010er</text>
  <line x1="790" y1="75" x2="790" y2="88" stroke="#bbbbbb" stroke-width="1"/>
  <text x="790" y="99" text-anchor="middle" font-size="11" fill="#1a5fa8">Pipelines &amp; Qualität</text>

  <!-- arrow 4→5 -->
  <line x1="871" y1="60" x2="920" y2="60" stroke="#1a5fa8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- === PHASE 5: Agentenbasiert (highlighted) === -->
  <rect x="925" y="15" width="160" height="90" rx="8" fill="#222222" stroke="#222222" stroke-width="2"/>
  <text x="1005" y="44" text-anchor="middle" font-weight="700" font-size="15" fill="#ffffff">Agentenbasiert</text>
  <text x="1005" y="63" text-anchor="middle" font-size="12" fill="#aaaaaa">heute</text>
  <line x1="1005" y1="75" x2="1005" y2="88" stroke="#666666" stroke-width="1"/>
  <text x="1005" y="99" text-anchor="middle" font-size="11" fill="#cccccc">Robustheit &amp; Aufsicht</text>

  <!-- "jede Phase erzeugt ein neues Engineering-Problem" label -->
  <text x="600" y="165" text-anchor="middle" font-size="12" fill="#999999" font-style="italic">Jeder Paradigmenwechsel erzeugt neue Engineering-Probleme — und neue Anforderungen an Web-Systeme.</text>
</svg>
