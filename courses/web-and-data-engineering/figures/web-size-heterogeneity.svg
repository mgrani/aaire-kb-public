<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380"
     font-family="'Source Sans Pro', Helvetica, Arial, sans-serif">

  <!-- Background -->
  <rect width="1200" height="380" fill="#f8f9fc"/>

  <!-- ══ Title ══ -->
  <text x="600" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a2e">
    Das Web heute: Skala und Heterogenität
  </text>

  <!-- ══ Stat Cards (y=33..118, h=85) ══
       4 cards × 280px + 3 gaps × 16px + left margin 12px = 1184 + right margin 16px = 1200 -->

  <!-- Card 1 — total websites -->
  <rect x="12"  y="33" width="280" height="85" rx="7" fill="#ffffff" stroke="#dce3f0" stroke-width="1.5"/>
  <text x="152" y="74"  text-anchor="middle" font-size="24" font-weight="800" fill="#1a5fa8">≈ 1,1 Mrd.</text>
  <text x="152" y="92"  text-anchor="middle" font-size="11.5" fill="#555">Websites weltweit</text>
  <text x="152" y="110" text-anchor="middle" font-size="10"   fill="#bbb">Internet Live Stats, 2024</text>

  <!-- Card 2 — HTTP Archive crawl size -->
  <rect x="308" y="33" width="280" height="85" rx="7" fill="#ffffff" stroke="#dce3f0" stroke-width="1.5"/>
  <text x="448" y="74"  text-anchor="middle" font-size="24" font-weight="800" fill="#1a5fa8">16,9 Mio.</text>
  <text x="448" y="92"  text-anchor="middle" font-size="11.5" fill="#555">analysierte Sites (HTTP Archive)</text>
  <text x="448" y="110" text-anchor="middle" font-size="10"   fill="#bbb">Web Almanac 2024</text>

  <!-- Card 3 — median page weight -->
  <rect x="604" y="33" width="280" height="85" rx="7" fill="#ffffff" stroke="#dce3f0" stroke-width="1.5"/>
  <text x="744" y="74"  text-anchor="middle" font-size="24" font-weight="800" fill="#e07b29">2,6 MB</text>
  <text x="744" y="92"  text-anchor="middle" font-size="11.5" fill="#555">Median Desktop (71 HTTP-Requests)</text>
  <text x="744" y="110" text-anchor="middle" font-size="10"   fill="#bbb">Web Almanac 2024</text>

  <!-- Card 4 — CMS diversity -->
  <rect x="900" y="33" width="288" height="85" rx="7" fill="#ffffff" stroke="#dce3f0" stroke-width="1.5"/>
  <text x="1044" y="74"  text-anchor="middle" font-size="24" font-weight="800" fill="#2a8a4e">249 Plattformen</text>
  <text x="1044" y="92"  text-anchor="middle" font-size="11.5" fill="#555">erkannte CMS · 51 % aller Sites</text>
  <text x="1044" y="110" text-anchor="middle" font-size="10"   fill="#bbb">Web Almanac 2024</text>

  <!-- Section divider -->
  <line x1="20" y1="128" x2="1180" y2="128" stroke="#dce3f0" stroke-width="1"/>

  <!-- ══ LEFT CHART — Web Server Technologies ══
       Labels right-aligned at x=148; bars from x=155 to max x=555 (400px = 100 %) -->

  <text x="300" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Web-Server Technologien (W3Techs 2024)</text>

  <!-- Row spacing: baseline y = 168, 200, 232, 264, 296, 328; bar top = baseline−14, h=20 -->

  <!-- Nginx 32.8 % → 131px -->
  <text x="148" y="168" text-anchor="end" font-size="12" fill="#333">Nginx</text>
  <rect x="155" y="154" width="131" height="20" rx="3" fill="#1a5fa8"/>
  <text x="292" y="168" font-size="11" fill="#1a5fa8" font-weight="600"> 32,8 %</text>

  <!-- Cloudflare 27.3 % → 109px -->
  <text x="148" y="200" text-anchor="end" font-size="12" fill="#333">Cloudflare</text>
  <rect x="155" y="186" width="109" height="20" rx="3" fill="#1a5fa8" opacity="0.78"/>
  <text x="270" y="200" font-size="11" fill="#1a5fa8" font-weight="600"> 27,3 %</text>

  <!-- Apache 23.9 % → 96px -->
  <text x="148" y="232" text-anchor="end" font-size="12" fill="#333">Apache</text>
  <rect x="155" y="218" width="96" height="20" rx="3" fill="#1a5fa8" opacity="0.60"/>
  <text x="257" y="232" font-size="11" fill="#1a5fa8" font-weight="600"> 23,9 %</text>

  <!-- LiteSpeed 15.2 % → 61px -->
  <text x="148" y="264" text-anchor="end" font-size="12" fill="#333">LiteSpeed</text>
  <rect x="155" y="250" width="61" height="20" rx="3" fill="#1a5fa8" opacity="0.40"/>
  <text x="223" y="264" font-size="11" fill="#888"> 15,2 %</text>

  <!-- Node.js 6.0 % → 24px -->
  <text x="148" y="296" text-anchor="end" font-size="12" fill="#333">Node.js</text>
  <rect x="155" y="282" width="24" height="20" rx="3" fill="#1a5fa8" opacity="0.27"/>
  <text x="186" y="296" font-size="11" fill="#aaa"> 6,0 %</text>

  <!-- MS-IIS 3.4 % → 14px -->
  <text x="148" y="328" text-anchor="end" font-size="12" fill="#333">MS-IIS</text>
  <rect x="155" y="314" width="14" height="20" rx="3" fill="#1a5fa8" opacity="0.17"/>
  <text x="176" y="328" font-size="11" fill="#ccc"> 3,4 %</text>

  <!-- Scale axis — left chart (0 % – 50 %, step = 100px at 400px/100 %) -->
  <line x1="155" y1="344" x2="555" y2="344" stroke="#dce3f0" stroke-width="1"/>
  <line x1="155" y1="341" x2="155" y2="347" stroke="#bbb" stroke-width="1"/>
  <text x="155" y="358" text-anchor="middle" font-size="10" fill="#bbb">0 %</text>
  <line x1="255" y1="341" x2="255" y2="347" stroke="#bbb" stroke-width="1"/>
  <text x="255" y="358" text-anchor="middle" font-size="10" fill="#bbb">25 %</text>
  <line x1="355" y1="341" x2="355" y2="347" stroke="#bbb" stroke-width="1"/>
  <text x="355" y="358" text-anchor="middle" font-size="10" fill="#bbb">50 %</text>

  <!-- ══ RIGHT CHART — Content Languages ══
       Labels right-aligned at x=765; bars from x=772; scale: 50 % = 370px (x=772..1142) -->

  <text x="895" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Sprachen der Web-Inhalte (W3Techs 2024)</text>

  <!-- English 49.5 % → 366px  (49.5/50 × 370) -->
  <text x="765" y="168" text-anchor="end" font-size="12" fill="#333">Englisch</text>
  <rect x="772" y="154" width="366" height="20" rx="3" fill="#e07b29"/>
  <text x="1145" y="168" font-size="11" fill="#e07b29" font-weight="600"> 49,5 %</text>

  <!-- Spanish 6.0 % → 44px -->
  <text x="765" y="200" text-anchor="end" font-size="12" fill="#333">Spanisch</text>
  <rect x="772" y="186" width="44" height="20" rx="3" fill="#e07b29" opacity="0.65"/>
  <text x="823" y="200" font-size="11" fill="#e07b29" font-weight="600"> 6,0 %</text>

  <!-- German 6.0 % → 44px -->
  <text x="765" y="232" text-anchor="end" font-size="12" fill="#333">Deutsch</text>
  <rect x="772" y="218" width="44" height="20" rx="3" fill="#e07b29" opacity="0.65"/>
  <text x="823" y="232" font-size="11" fill="#e07b29" font-weight="600"> 6,0 %</text>

  <!-- Japanese 5.0 % → 37px -->
  <text x="765" y="264" text-anchor="end" font-size="12" fill="#333">Japanisch</text>
  <rect x="772" y="250" width="37" height="20" rx="3" fill="#e07b29" opacity="0.50"/>
  <text x="816" y="264" font-size="11" fill="#aaa"> 5,0 %</text>

  <!-- French 4.5 % → 33px -->
  <text x="765" y="296" text-anchor="end" font-size="12" fill="#333">Französisch</text>
  <rect x="772" y="282" width="33" height="20" rx="3" fill="#e07b29" opacity="0.42"/>
  <text x="812" y="296" font-size="11" fill="#aaa"> 4,5 %</text>

  <!-- Other ≈ 29 % (150+ languages) → 215px -->
  <text x="765" y="328" text-anchor="end" font-size="12" fill="#333">Andere (150+)</text>
  <rect x="772" y="314" width="215" height="20" rx="3" fill="#6b7280" opacity="0.42"/>
  <text x="994" y="328" font-size="11" fill="#6b7280"> ~29 %</text>

  <!-- Scale axis — right chart (0 % – 50 %, 370px range) -->
  <line x1="772" y1="344" x2="1142" y2="344" stroke="#dce3f0" stroke-width="1"/>
  <line x1="772"  y1="341" x2="772"  y2="347" stroke="#bbb" stroke-width="1"/>
  <text x="772"  y="358" text-anchor="middle" font-size="10" fill="#bbb">0 %</text>
  <line x1="957"  y1="341" x2="957"  y2="347" stroke="#bbb" stroke-width="1"/>
  <text x="957"  y="358" text-anchor="middle" font-size="10" fill="#bbb">25 %</text>
  <line x1="1142" y1="341" x2="1142" y2="347" stroke="#bbb" stroke-width="1"/>
  <text x="1142" y="358" text-anchor="middle" font-size="10" fill="#bbb">50 %</text>

  <!-- Vertical divider between charts -->
  <line x1="603" y1="130" x2="603" y2="355" stroke="#dce3f0" stroke-width="1.5" stroke-dasharray="5 3"/>

  <!-- Source note -->
  <text x="600" y="373" text-anchor="middle" font-size="10" fill="#bbb">
    Quellen: HTTP Archive Web Almanac 2024 (Viscomi et al., Nov. 2024) · W3Techs 2024 · Internet Live Stats 2024.
    Daten beziehen sich auf öffentlich erreichbare Websites.
  </text>

</svg>
