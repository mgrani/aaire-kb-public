<rect width="1360" height="1000" fill="#ffffff"/>
<text x="24" y="32" class="ttl">OURS / OWI — platform architecture</text>
<text x="24" y="50" class="sub">Trust zones rather than a deployment map. Arrows are request-time unless labelled otherwise.</text>
<rect x="24" y="64" width="990" height="104" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="40" y="86" class="band">People</text>
<text x="40" y="102" class="bandsub">browsers and API clients — nothing below the edge is internet-reachable</text>
<rect x="24" y="190" width="990" height="178" rx="14" fill="#eef4fb" stroke="#93b4d4" stroke-width="1.5"/>
<text x="40" y="212" class="band">Public edge</text>
<text x="40" y="228" class="bandsub">TLS ingress · one origin per UI · human auth via the gateway</text>
<rect x="24" y="400" width="990" height="140" rx="14" fill="#eaf5ef" stroke="#7fb99a" stroke-width="1.5"/>
<text x="40" y="422" class="band">Platform core</text>
<text x="40" y="438" class="bandsub">owns all cross-service logic and the only database</text>
<text x="560" y="488" text-anchor="middle" class="s">YOARS v1 (yoars-api, yoars-nest, matrix-bridge, portal) retired 2026-09-25</text>
<rect x="24" y="562" width="990" height="140" rx="14" fill="#fdf3e7" stroke="#e0b070" stroke-width="1.5"/>
<text x="40" y="584" class="band">Substrate</text>
<text x="40" y="600" class="bandsub">cluster-internal — never browser-reachable</text>
<rect x="24" y="724" width="990" height="140" rx="14" fill="#fdeef0" stroke="#dda0aa" stroke-width="1.5"/>
<text x="40" y="746" class="band">External</text>
<text x="40" y="762" class="bandsub">batch-time, except identity</text>
<rect x="48" y="110" width="210" height="42" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
