<text x="141.0" y="260" text-anchor="middle" class="t" style="fill:#0f172a">ours-web-ui</text>
<text x="141.0" y="278" text-anchor="middle" class="s">OURS search</text>
<rect x="448" y="236" width="186" height="76" rx="8" fill="#ffffff" stroke="#7e22ce" stroke-width="1.6"/>
<text x="541.0" y="260" text-anchor="middle" class="t" style="fill:#0f172a">owi-dashboard</text>
<text x="541.0" y="278" text-anchor="middle" class="s">SolidStart SSR + SPA</text>
<text x="541.0" y="291" text-anchor="middle" class="s">openwebindex.eu</text>
<rect x="648" y="236" width="150" height="76" rx="8" fill="#ffffff" stroke="#355F8E" stroke-width="1.6"/>
<text x="723.0" y="260" text-anchor="middle" class="t" style="fill:#0f172a">admin-ui</text>
<text x="723.0" y="278" text-anchor="middle" class="s">operator</text>
<rect x="826" y="236" width="162" height="76" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
<text x="907.0" y="260" text-anchor="middle" class="t" style="fill:#0f172a">ours-yoars-gateway</text>
<text x="907.0" y="278" text-anchor="middle" class="s">human auth</text>
<rect x="48" y="446" width="300" height="76" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
<text x="198.0" y="470" text-anchor="middle" class="t" style="fill:#0f172a">ours-api</text>
<text x="198.0" y="488" text-anchor="middle" class="s">REST + jobs + CronJobs</text>
<text x="198.0" y="501" text-anchor="middle" class="s">the only writer of the database</text>
<line x1="723" y1="312" x2="348" y2="470" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="48" y="608" width="226" height="76" rx="8" fill="#fffdf7" stroke="#b45309" stroke-width="1.6"/>
<text x="161.0" y="632" text-anchor="middle" class="t" style="fill:#0f172a">owilix</text>
<text x="161.0" y="650" text-anchor="middle" class="s">ours-owi-mirror-http</text>
<text x="161.0" y="663" text-anchor="middle" class="s">NO caller authentication</text>
<rect x="292" y="608" width="196" height="76" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
<text x="390.0" y="632" text-anchor="middle" class="t" style="fill:#0f172a">Garage S3</text>
<text x="390.0" y="650" text-anchor="middle" class="s">ours-object-store · 100 TiB</text>
<rect x="506" y="608" width="186" height="76" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
<text x="599.0" y="632" text-anchor="middle" class="t" style="fill:#0f172a">Citus / Postgres</text>
<text x="599.0" y="650" text-anchor="middle" class="s">one Alembic chain (ours-api)</text>
<rect x="710" y="608" width="130" height="76" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
<text x="775.0" y="632" text-anchor="middle" class="t" style="fill:#0f172a">Vespa</text>
<text x="775.0" y="650" text-anchor="middle" class="s">search</text>
<rect x="858" y="608" width="130" height="76" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
<text x="923.0" y="632" text-anchor="middle" class="t" style="fill:#0f172a">Redis</text>
<text x="923.0" y="650" text-anchor="middle" class="s">streams</text>
<rect x="48" y="770" width="226" height="76" rx="8" fill="#fffafb" stroke="#9f1239" stroke-width="1.6"/>
<text x="161.0" y="794" text-anchor="middle" class="t" style="fill:#0f172a">LEXIS</text>
<text x="161.0" y="812" text-anchor="middle" class="s">DDI + iRODS · device token</text>
<text x="161.0" y="825" text-anchor="middle" class="s">batch-time only</text>
<rect x="292" y="770" width="246" height="76" rx="8" fill="#ffffff" stroke="#c2708a" stroke-width="1.6"/>
<text x="415.0" y="794" text-anchor="middle" class="t" style="fill:#64748b">Datacenter object stores</text>
<text x="415.0" y="812" text-anchor="middle" class="s">it4i · lrz · csc · nordlink</text>
<text x="415.0" y="825" text-anchor="middle" class="s">M5f — credentials pending</text>
<rect x="556" y="770" width="200" height="76" rx="8" fill="#ffffff" stroke="#c2708a" stroke-width="1.6"/>
<text x="656.0" y="794" text-anchor="middle" class="t" style="fill:#64748b">SERCI, OURS, YOARS</text>
<text x="656.0" y="812" text-anchor="middle" class="s">linked, not integrated</text>
<rect x="774" y="770" width="214" height="76" rx="8" fill="#ffffff" stroke="#9f1239" stroke-width="1.6"/>
<text x="881.0" y="794" text-anchor="middle" class="t" style="fill:#0f172a">Keycloak</text>
<text x="881.0" y="812" text-anchor="middle" class="s">OIDC identity</text>
<line x1="141" y1="152" x2="141" y2="236" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="541" y1="152" x2="541" y2="236" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="383" y1="152" x2="700" y2="236" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="812,152 812,392 348,478" fill="none" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="808" y="200" text-anchor="end" class="lbl" style="fill:#475569">dev key → ours-api</text>
<line x1="141" y1="312" x2="141" y2="336" stroke="#0f766e" stroke-width="1.6"/>
<line x1="541" y1="312" x2="541" y2="336" stroke="#0f766e" stroke-width="1.6"/>
<line x1="723" y1="312" x2="723" y2="336" stroke="#0f766e" stroke-width="1.6"/>
<line x1="141" y1="336" x2="907" y2="336" stroke="#0f766e" stroke-width="1.6"/>
<line x1="907" y1="336" x2="907" y2="312" stroke="#0f766e" stroke-width="1.6" marker-end="url(#a)"/>
<text x="430" y="352" text-anchor="middle" class="lbl" style="fill:#0f766e">ojg_session — identity always re-verified server-side at /api/auth/me, never trusted from the cookie</text>
<line x1="541" y1="312" x2="300" y2="446" stroke="#7e22ce" stroke-width="1.6" marker-end="url(#a)"/>
<text x="455" y="392" text-anchor="end" class="lbl" style="fill:#7e22ce">ONE door: path allowlist + service token</text>
<line x1="141" y1="312" x2="150" y2="446" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="150" y1="522" x2="150" y2="608" stroke="#b45309" stroke-width="1.6" marker-end="url(#a)"/>
<text x="120" y="570" text-anchor="end" class="lbl" style="fill:#b45309">admin token</text>
<line x1="230" y1="522" x2="380" y2="608" stroke="#b45309" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="300" y1="522" x2="590" y2="608" stroke="#b45309" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="330" y1="522" x2="770" y2="608" stroke="#b45309" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="120" y1="684" x2="120" y2="770" stroke="#9f1239" stroke-width="1.6" marker-end="url(#a)"/>
<text x="210" y="730" text-anchor="start" class="lbl" style="fill:#9f1239">nightly catalog + mirror pull</text>
<line x1="274" y1="646" x2="292" y2="646" stroke="#b45309" stroke-width="1.6" marker-end="url(#a)"/>
<text x="283" y="636" text-anchor="middle" class="lbl" style="fill:#b45309">owi-up (s3a)</text>
<line x1="907" y1="312" x2="907" y2="322" stroke="#9f1239" stroke-width="1.6"/>
<line x1="907" y1="322" x2="1016" y2="322" stroke="#9f1239" stroke-width="1.6"/>
<line x1="1016" y1="322" x2="1016" y2="808" stroke="#9f1239" stroke-width="1.6"/>
<line x1="1016" y1="808" x2="988" y2="808" stroke="#9f1239" stroke-width="1.6" marker-end="url(#a)"/>
<text x="1008" y="560" text-anchor="end" class="lbl" style="fill:#9f1239">OIDC</text>
<rect x="1044" y="64" width="292" height="800" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1060" y="90" class="band">Rules the picture encodes</text>
<circle cx="1070" cy="114" r="10" fill="#355F8E"/>
<text x="1070" y="118" text-anchor="middle" class="num">1</text>
<text x="1088" y="118" class="rh">owilix has no caller auth at all</text>
<text x="1088" y="133" class="rb">and runs under one shared identity, so</text>
<text x="1088" y="146" class="rb">it stays cluster-internal and per-user</text>
<text x="1088" y="159" class="rb">authorisation can never be delegated</text>
<text x="1088" y="172" class="rb">to it.</text>
<circle cx="1070" cy="208" r="10" fill="#355F8E"/>
<text x="1070" y="212" text-anchor="middle" class="num">2</text>
<text x="1088" y="212" class="rh">The dashboard talks only to ours-api</text>
<text x="1088" y="227" class="rb">never owilix, never Garage. One proxy</text>
<text x="1088" y="240" class="rb">route behind a path allowlist — not</text>
<text x="1088" y="253" class="rb">one forward per resource, which is how</text>
<text x="1088" y="266" class="rb">the retired dashboard grew 159 of</text>
<text x="1088" y="279" class="rb">them.</text>
<circle cx="1070" cy="315" r="10" fill="#355F8E"/>
<text x="1070" y="319" text-anchor="middle" class="num">3</text>
<text x="1088" y="319" class="rh">No request waits on LEXIS</text>
<text x="1088" y="334" class="rb">catalog metadata is snapshotted</text>
<text x="1088" y="347" class="rb">nightly; repository listings are</text>
<text x="1088" y="360" class="rb">served stale-while-revalidate behind a</text>
<text x="1088" y="373" class="rb">reclaimable single-flight lease.</text>
<circle cx="1070" cy="409" r="10" fill="#355F8E"/>
<text x="1070" y="413" text-anchor="middle" class="num">4</text>
<text x="1088" y="413" class="rh">ours-api is the only writer</text>
<text x="1088" y="428" class="rb">of the database. The UIs and the</text>
<text x="1088" y="441" class="rb">gateway own no schema — their coupling</text>
<text x="1088" y="454" class="rb">is an HTTP contract.</text>
<circle cx="1070" cy="490" r="10" fill="#355F8E"/>
<text x="1070" y="494" text-anchor="middle" class="num">5</text>
<text x="1088" y="494" class="rh">Metadata and bytes are different</text>
<text x="1088" y="509" class="rb">LEXIS says what exists; the S3 mirror</text>
<text x="1088" y="522" class="rb">decides what can be explored.</text>
<text x="1088" y="535" class="rb">Catalogued-but-not-mirrored is normal,</text>
<text x="1088" y="548" class="rb">not an error.</text>
<circle cx="1070" cy="584" r="10" fill="#355F8E"/>
<text x="1070" y="588" text-anchor="middle" class="num">6</text>
<text x="1088" y="588" class="rh">Two statistics units never mix</text>
<text x="1088" y="603" class="rb">catalog counts collections, legacy</text>
<text x="1088" y="616" class="rb">counts WARC files. Provenance sits</text>
<text x="1088" y="629" class="rb">in the rollup key so they cannot be</text>
<text x="1088" y="642" class="rb">summed.</text>
<text x="24" y="944" class="sub">The LEXIS edge is batch-time only — a page load never waits on it.</text>
<text x="24" y="962" class="sub">owi-dashboard is a rebuild of openwebindex.eu; the retired Flask backend is gone.</text>
<text x="24" y="980" class="sub">2026-09-29 (YOARS v1 retired; yoars, called yoars2 until 09-27, lives in yoars-main) · wording owned by docs/current/component_relationship.md · component status in docs/current/owi_dashboard.md</text>
</svg>