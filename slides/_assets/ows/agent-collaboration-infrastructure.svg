<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Why agents need collaboration infrastructure</title>
  <desc id="desc">Several agents connect through a collaboration layer that shares sources, skills, workflows, knowledge nuggets, and provenance before using open retrieval infrastructure.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#0083A1"/>
    </marker>
    <marker id="arrow-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#2B6054"/>
    </marker>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill: #333333; }
      .muted { fill: #555555; }
      .blue { fill: #0083A1; }
      .navy { fill: #164374; }
      .green { fill: #2B6054; }
      .orange { fill: #D4782A; }
      .small { font-size: 16px; }
      .tiny { font-size: 14px; }
      .head { font-size: 21px; font-weight: 700; }
      .box { fill: #ffffff; stroke: #E7E6E6; stroke-width: 2; }
      .soft { fill: #f7f9fb; stroke: #E7E6E6; stroke-width: 2; }
    </style>
  </defs>

  <rect width="920" height="360" fill="#ffffff"/>

  <text x="144" y="34" text-anchor="middle" class="label head navy">without sharing</text>
  <text x="460" y="34" text-anchor="middle" class="label head blue">collaboration layer</text>
  <text x="770" y="34" text-anchor="middle" class="label head green">open retrieval stack</text>

  <rect x="30" y="58" width="230" height="244" rx="10" class="soft"/>
  <rect x="328" y="58" width="264" height="244" rx="10" fill="#F2FAFC" stroke="#B8DDE5" stroke-width="2"/>
  <rect x="660" y="58" width="230" height="244" rx="10" fill="#F4F8F5" stroke="#B9D2CA" stroke-width="2"/>

  <g transform="translate(63 90)">
    <rect x="0" y="0" width="72" height="46" rx="8" class="box"/>
    <circle cx="20" cy="18" r="8" fill="none" stroke="#164374" stroke-width="3"/>
    <path d="M7 38 C10 28, 30 28, 33 38" fill="none" stroke="#164374" stroke-width="3" stroke-linecap="round"/>
    <text x="52" y="29" text-anchor="middle" class="label tiny navy">A1</text>
  </g>
  <g transform="translate(146 139)">
    <rect x="0" y="0" width="72" height="46" rx="8" class="box"/>
    <circle cx="20" cy="18" r="8" fill="none" stroke="#164374" stroke-width="3"/>
    <path d="M7 38 C10 28, 30 28, 33 38" fill="none" stroke="#164374" stroke-width="3" stroke-linecap="round"/>
    <text x="52" y="29" text-anchor="middle" class="label tiny navy">A2</text>
  </g>
  <g transform="translate(67 195)">
    <rect x="0" y="0" width="72" height="46" rx="8" class="box"/>
    <circle cx="20" cy="18" r="8" fill="none" stroke="#164374" stroke-width="3"/>
    <path d="M7 38 C10 28, 30 28, 33 38" fill="none" stroke="#164374" stroke-width="3" stroke-linecap="round"/>
    <text x="52" y="29" text-anchor="middle" class="label tiny navy">A3</text>
  </g>

  <path d="M135 113 C178 85, 218 86, 232 111" fill="none" stroke="#A5A5A5" stroke-width="3" stroke-dasharray="7 6"/>
  <path d="M218 162 C238 180, 238 205, 140 218" fill="none" stroke="#A5A5A5" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="145" y="271" text-anchor="middle" class="label small muted">duplicated source discovery</text>
  <text x="145" y="292" text-anchor="middle" class="label small muted">local workflows, weak provenance</text>

  <g transform="translate(358 84)">
    <rect x="0" y="0" width="204" height="42" rx="7" fill="#ffffff" stroke="#0083A1" stroke-width="2"/>
    <text x="102" y="27" text-anchor="middle" class="label small blue">source registry</text>
  </g>
  <g transform="translate(358 136)">
    <rect x="0" y="0" width="204" height="42" rx="7" fill="#ffffff" stroke="#0083A1" stroke-width="2"/>
    <text x="102" y="27" text-anchor="middle" class="label small blue">skills and tools</text>
  </g>
  <g transform="translate(358 188)">
    <rect x="0" y="0" width="204" height="42" rx="7" fill="#ffffff" stroke="#0083A1" stroke-width="2"/>
    <text x="102" y="27" text-anchor="middle" class="label small blue">workflow traces</text>
  </g>
  <g transform="translate(358 240)">
    <rect x="0" y="0" width="204" height="42" rx="7" fill="#ffffff" stroke="#0083A1" stroke-width="2"/>
    <text x="102" y="27" text-anchor="middle" class="label small blue">nuggets + provenance</text>
  </g>

  <line x1="260" y1="178" x2="319" y2="178" stroke="#0083A1" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="290" y="159" text-anchor="middle" class="label tiny blue">publish</text>
  <text x="290" y="198" text-anchor="middle" class="label tiny blue">reuse</text>

  <g transform="translate(690 87)">
    <rect x="0" y="0" width="170" height="50" rx="8" fill="#ffffff" stroke="#2B6054" stroke-width="2"/>
    <text x="85" y="31" text-anchor="middle" class="label small green">OWI slices</text>
  </g>
  <g transform="translate(690 154)">
    <rect x="0" y="0" width="170" height="50" rx="8" fill="#ffffff" stroke="#2B6054" stroke-width="2"/>
    <text x="85" y="31" text-anchor="middle" class="label small green">OUR2S retrieval</text>
  </g>
  <g transform="translate(690 221)">
    <rect x="0" y="0" width="170" height="50" rx="8" fill="#ffffff" stroke="#2B6054" stroke-width="2"/>
    <text x="85" y="31" text-anchor="middle" class="label small green">external tools</text>
  </g>

  <path d="M592 126 C623 110, 641 107, 681 112" fill="none" stroke="#2B6054" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M592 178 C625 178, 642 178, 681 178" fill="none" stroke="#2B6054" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M592 230 C623 246, 641 250, 681 247" fill="none" stroke="#2B6054" stroke-width="4" marker-end="url(#arrow-green)"/>

  <path d="M690 72 C590 28, 408 28, 260 73" fill="none" stroke="#D4782A" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-blue)"/>
  <text x="476" y="329" text-anchor="middle" class="label small orange">shared context turns one-off agent searches into reusable infrastructure</text>
</svg>
