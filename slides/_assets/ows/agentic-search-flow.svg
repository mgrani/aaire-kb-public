<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" role="img" aria-labelledby="title desc">
  <title id="title">Agentic search flow</title>
  <desc id="desc">A user gives a task to an agent, which plans, retrieves, evaluates evidence, calls tools, and synthesizes an answer.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#0083A1"/>
    </marker>
    <marker id="arrow-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#2B6054"/>
    </marker>
  </defs>
  <rect width="520" height="280" fill="#ffffff"/>
  <rect x="24" y="22" width="472" height="236" rx="10" fill="#f7f9fb" stroke="#E7E6E6" stroke-width="2"/>
  <text x="260" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0083A1">Agentic search</text>

  <g fill="none" stroke="#0083A1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="62" cy="91" r="14"/>
    <path d="M36 140 C39 115, 85 115, 88 140"/>
  </g>
  <text x="62" y="162" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333333">user task</text>
  <line x1="90" y1="130" x2="126" y2="130" stroke="#0083A1" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="132" y="105" width="78" height="50" rx="7" fill="#ffffff" stroke="#0083A1" stroke-width="2"/>
  <text x="171" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0083A1">plan</text>

  <rect x="236" y="78" width="92" height="50" rx="7" fill="#ffffff" stroke="#0083A1" stroke-width="2"/>
  <text x="282" y="109" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0083A1">retrieve</text>

  <rect x="374" y="105" width="78" height="50" rx="7" fill="#ffffff" stroke="#0083A1" stroke-width="2"/>
  <text x="413" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0083A1">check</text>

  <rect x="236" y="180" width="92" height="50" rx="7" fill="#ffffff" stroke="#0083A1" stroke-width="2"/>
  <text x="282" y="211" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0083A1">answer</text>

  <line x1="210" y1="122" x2="224" y2="116" stroke="#0083A1" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="328" y1="113" x2="362" y2="124" stroke="#0083A1" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="413" y1="155" x2="330" y2="192" stroke="#0083A1" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M374 151 C312 176, 240 174, 186 156" fill="none" stroke="#0083A1" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <path d="M236 209 C164 222, 108 190, 91 143" fill="none" stroke="#0083A1" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M324 82 C390 42, 472 70, 470 132" fill="none" stroke="#2B6054" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-green)"/>
  <text x="390" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2B6054">tools / sources</text>

  <text x="282" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#555555">iterative evidence loop</text>
</svg>
