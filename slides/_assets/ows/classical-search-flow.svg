<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" role="img" aria-labelledby="title desc">
  <title id="title">Classical search flow</title>
  <desc id="desc">A user submits one query to a stateless search engine, receives a ranked list of documents, and must reformulate manually to refine.</desc>
  <defs>
    <marker id="arrow-navy" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#164374"/>
    </marker>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill: #333333; }
      .title-text { font-size: 22px; font-weight: 700; fill: #164374; }
      .subtitle { font-size: 13px; font-style: italic; fill: #555555; }
      .box-title { font-size: 17px; font-weight: 700; fill: #164374; }
      .box-sub { font-size: 13px; fill: #555555; }
      .arrow-label { font-size: 12px; fill: #164374; }
      .caption { font-size: 13px; fill: #555555; }
      .user-label { font-size: 14px; fill: #333333; }
    </style>
  </defs>

  <rect width="520" height="280" fill="#ffffff"/>
  <rect x="20" y="18" width="480" height="244" rx="12" fill="#f7f9fb" stroke="#E7E6E6" stroke-width="2"/>

  <text x="260" y="46" text-anchor="middle" class="label title-text">Classical search</text>
  <text x="260" y="66" text-anchor="middle" class="label subtitle">stateless: one query in, one ranked list out</text>

  <!-- User -->
  <g fill="none" stroke="#164374" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="65" cy="128" r="14"/>
    <path d="M40 172 C44 145, 86 145, 90 172"/>
  </g>
  <text x="65" y="200" text-anchor="middle" class="label user-label">user</text>

  <!-- Search engine -->
  <rect x="120" y="115" width="140" height="70" rx="8" fill="#ffffff" stroke="#164374" stroke-width="2"/>
  <text x="190" y="142" text-anchor="middle" class="label box-title">search engine</text>
  <text x="190" y="164" text-anchor="middle" class="label box-sub">match · rank · return</text>

  <!-- Ranked results -->
  <rect x="305" y="98" width="130" height="104" rx="8" fill="#ffffff" stroke="#164374" stroke-width="2"/>
  <text x="370" y="123" text-anchor="middle" class="label" font-size="15" font-weight="700" fill="#164374">ranked results</text>
  <line x1="320" y1="144" x2="420" y2="144" stroke="#A5A5A5" stroke-width="3"/>
  <line x1="320" y1="160" x2="406" y2="160" stroke="#A5A5A5" stroke-width="3"/>
  <line x1="320" y1="176" x2="414" y2="176" stroke="#A5A5A5" stroke-width="3"/>
  <line x1="320" y1="192" x2="392" y2="192" stroke="#A5A5A5" stroke-width="3"/>

  <!-- User → Engine -->
  <line x1="84" y1="150" x2="114" y2="150" stroke="#164374" stroke-width="3" marker-end="url(#arrow-navy)"/>
  <text x="99" y="142" text-anchor="middle" class="label arrow-label">query</text>

  <!-- Engine → Results -->
  <line x1="262" y1="150" x2="299" y2="150" stroke="#164374" stroke-width="3" marker-end="url(#arrow-navy)"/>

  <!-- Dashed manual reformulation -->
  <path d="M340 208 C260 246, 130 240, 90 184" fill="none" stroke="#164374" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-navy)"/>
  <text x="220" y="244" text-anchor="middle" class="label caption">user reformulates query manually</text>
</svg>
