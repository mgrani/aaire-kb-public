<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" role="img" aria-labelledby="title desc">
  <title id="title">Classical search flow</title>
  <desc id="desc">A user submits one query to a search engine, receives ranked results, and reformulates manually.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#164374"/>
    </marker>
  </defs>
  <rect width="520" height="280" fill="#ffffff"/>
  <rect x="24" y="22" width="472" height="236" rx="10" fill="#f7f9fb" stroke="#E7E6E6" stroke-width="2"/>
  <text x="260" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#164374">Classical search</text>

  <g fill="none" stroke="#164374" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="86" cy="102" r="18"/>
    <path d="M52 168 C56 135, 116 135, 120 168"/>
  </g>
  <text x="86" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#333333">user</text>

  <rect x="160" y="102" width="130" height="72" rx="7" fill="#ffffff" stroke="#164374" stroke-width="2"/>
  <text x="225" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#164374">query</text>
  <text x="225" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#555555">one request</text>

  <rect x="360" y="88" width="108" height="100" rx="7" fill="#ffffff" stroke="#164374" stroke-width="2"/>
  <text x="414" y="116" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#164374">ranked</text>
  <text x="414" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#164374">results</text>
  <line x1="385" y1="158" x2="444" y2="158" stroke="#A5A5A5" stroke-width="3"/>
  <line x1="385" y1="172" x2="432" y2="172" stroke="#A5A5A5" stroke-width="3"/>

  <line x1="122" y1="138" x2="150" y2="138" stroke="#164374" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="292" y1="138" x2="348" y2="138" stroke="#164374" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M388 204 C300 236, 184 230, 118 176" fill="none" stroke="#164374" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="260" y="242" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#555555">manual reformulation</text>
</svg>
