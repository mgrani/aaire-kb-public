<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Embedding analogy reasoning example</title>
  <desc id="desc">A vector diagram showing king minus man plus woman approximately equals queen.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#164374"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0083A1"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2B6054"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="52" y="44" width="856" height="410" rx="10" fill="#f7f9fb" stroke="#E7E6E6" stroke-width="2"/>

  <line x1="110" y1="405" x2="850" y2="405" stroke="#A5A5A5" stroke-width="2"/>
  <line x1="110" y1="405" x2="110" y2="90" stroke="#A5A5A5" stroke-width="2"/>
  <text x="842" y="432" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#666666">gender</text>
  <text x="72" y="92" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#666666" transform="rotate(-90 72 92)">royalty</text>

  <g filter="url(#soft-shadow)">
    <circle cx="270" cy="300" r="14" fill="#164374"/>
    <rect x="220" y="316" width="100" height="44" rx="6" fill="#164374"/>
    <text x="270" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#ffffff">man</text>

    <circle cx="690" cy="300" r="14" fill="#0083A1"/>
    <rect x="628" y="316" width="124" height="44" rx="6" fill="#0083A1"/>
    <text x="690" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#ffffff">woman</text>

    <circle cx="270" cy="135" r="14" fill="#164374"/>
    <rect x="220" y="74" width="100" height="44" rx="6" fill="#164374"/>
    <text x="270" y="104" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#ffffff">king</text>

    <circle cx="690" cy="135" r="14" fill="#0083A1"/>
    <rect x="628" y="74" width="124" height="44" rx="6" fill="#0083A1"/>
    <text x="690" y="104" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#ffffff">queen</text>
  </g>

  <line x1="270" y1="286" x2="270" y2="154" stroke="#164374" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <line x1="690" y1="286" x2="690" y2="154" stroke="#0083A1" stroke-width="5" marker-end="url(#arrow-teal)"/>
  <line x1="292" y1="300" x2="668" y2="300" stroke="#2B6054" stroke-width="4" stroke-dasharray="11 9" marker-end="url(#arrow-green)"/>
  <line x1="292" y1="135" x2="668" y2="135" stroke="#2B6054" stroke-width="4" stroke-dasharray="11 9" marker-end="url(#arrow-green)"/>

  <text x="333" y="274" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#2B6054">same relation</text>
  <text x="333" y="118" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#2B6054">same relation</text>

  <rect x="120" y="465" width="720" height="52" rx="8" fill="#ffffff" stroke="#E7E6E6" stroke-width="2"/>
  <text x="480" y="500" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#164374">
    vector(king) - vector(man) + vector(woman) &#8776; vector(queen)
  </text>
</svg>
