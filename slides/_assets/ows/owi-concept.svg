<svg xmlns="http://www.w3.org/2000/svg" width="960" height="248" viewBox="0 0 960 248" role="img" aria-labelledby="owi-title owi-desc">
  <title id="owi-title">The Open Web Index — Concept</title>
  <desc id="owi-desc">Pipeline diagram: The Web is crawled and indexed by the OWI Infrastructure, sliced into domain-specific OWI Slices, and used by downstream Search, Analytics, and AI applications. A dual wedge below shows data volume decreasing and value increasing through the pipeline.</desc>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#999"/>
    </marker>
    <!-- SIZE wedge: heavy navy left → fades right -->
    <linearGradient id="sizeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#164374" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#164374" stop-opacity="0.04"/>
    </linearGradient>
    <!-- UTILITY wedge: fades left → heavy teal right -->
    <linearGradient id="utilGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0083A1" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0083A1" stop-opacity="0.32"/>
    </linearGradient>
  </defs>

  <!-- ══════════════════════════════════════════
       PIPELINE BOXES  (uniform: y=15 h=115)
  ════════════════════════════════════════════ -->

  <!-- Box 1 · The Web -->
  <rect x="8" y="15" width="170" height="115" rx="10"
        fill="#ebf1f8" stroke="#164374" stroke-width="1.5"/>
  <text x="93" y="43" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#164374">The Web</text>
  <text x="93" y="62" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="10" fill="#555">Documents · Images</text>
  <text x="93" y="76" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="10" fill="#555">Multimedia · Structured Data</text>

  <!-- Arrow 1 -->
  <line x1="178" y1="73" x2="207" y2="73"
        stroke="#aaa" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="193" y="62" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="9" fill="#bbb">crawl &amp;</text>
  <text x="193" y="73" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="9" fill="#bbb">index</text>

  <!-- Box 2 · OWI Infrastructure -->
  <rect x="210" y="15" width="170" height="115" rx="10"
        fill="#e4eef8" stroke="#164374" stroke-width="1.5"/>
  <text x="295" y="42" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#164374">OWI</text>
  <text x="295" y="59" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#164374">Infrastructure</text>
  <text x="295" y="77" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="10" fill="#555">HPC · AI Factories</text>
  <text x="295" y="91" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="10" fill="#555">Crawl → Preprocess → Index</text>

  <!-- Arrow 2 -->
  <line x1="380" y1="73" x2="409" y2="73"
        stroke="#aaa" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="395" y="62" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="9" fill="#bbb">slice &amp;</text>
  <text x="395" y="73" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="9" fill="#bbb">distribute</text>

  <!-- Box 3 · OWI Slices -->
  <rect x="412" y="15" width="170" height="115" rx="10"
        fill="#dce8f4" stroke="#164374" stroke-width="1.5"/>
  <text x="497" y="38" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#164374">OWI Slices</text>
  <!-- 2 × 2 sub-boxes -->
  <rect x="422" y="47" width="72" height="32" rx="5"
        fill="#fff" stroke="#164374" stroke-width="1"/>
  <text x="458" y="67" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#164374">Topical</text>
  <rect x="500" y="47" width="72" height="32" rx="5"
        fill="#fff" stroke="#164374" stroke-width="1"/>
  <text x="536" y="67" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#164374">Language</text>
  <rect x="422" y="83" width="72" height="32" rx="5"
        fill="#fff" stroke="#164374" stroke-width="1"/>
  <text x="458" y="103" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#164374">Temporal</text>
  <rect x="500" y="83" width="72" height="32" rx="5"
        fill="#fff" stroke="#164374" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="536" y="103" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="14" fill="#bbb">…</text>

  <!-- Arrow 3 -->
  <line x1="582" y1="73" x2="611" y2="73"
        stroke="#aaa" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="597" y="67" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="9" fill="#bbb">power</text>

  <!-- ══════════════════════════════════════════
       DOWNSTREAM APPLICATIONS  (3 stacked, y=15..130)
  ════════════════════════════════════════════ -->

  <text x="779" y="12" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="10" fill="#888" font-style="italic">Downstream Applications</text>

  <rect x="614" y="17" width="332" height="34" rx="7"
        fill="#e0f2f8" stroke="#0083A1" stroke-width="1.5"/>
  <text x="780" y="39" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#0083A1">Search Engines</text>

  <rect x="614" y="54" width="332" height="34" rx="7"
        fill="#e3eeec" stroke="#2B6054" stroke-width="1.5"/>
  <text x="780" y="76" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#2B6054">Analytics &amp; Statistics</text>

  <rect x="614" y="91" width="332" height="34" rx="7"
        fill="#ebf1f8" stroke="#164374" stroke-width="1.5"/>
  <text x="780" y="113" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#164374">AI &amp; Language Models</text>

  <!-- ══════════════════════════════════════════
       DUAL WEDGE  — forms a perfect rectangle
       Rectangle: x 8..952, y 144..224  (height 80)
       Shared diagonal: (8,214) → (952,154)
  ════════════════════════════════════════════ -->

  <!-- SIZE wedge  · left-heavy (70px) → right-thin (10px) -->
  <polygon points="8,144  952,144  952,154  8,214" fill="url(#sizeGrad)"/>

  <!-- UTILITY wedge  · left-thin (10px) → right-heavy (70px) -->
  <polygon points="8,214  952,154  952,224  8,224" fill="url(#utilGrad)"/>

  <!-- SIZE label — inside fat left region -->
  <text x="24" y="177" font-family="Arial,sans-serif" font-size="9" font-weight="600"
        fill="#164374" opacity="0.80">DATA VOLUME</text>
  <text x="24" y="189" font-family="Arial,sans-serif" font-size="8"
        fill="#164374" opacity="0.65">decreases  ⟶</text>

  <!-- UTILITY label — inside fat right region -->
  <text x="940" y="200" text-anchor="end" font-family="Arial,sans-serif" font-size="9" font-weight="600"
        fill="#0083A1" opacity="0.80">VALUE &amp; UTILITY</text>
  <text x="940" y="212" text-anchor="end" font-family="Arial,sans-serif" font-size="8"
        fill="#0083A1" opacity="0.65">⟵  increases</text>

  <!-- ══════════════════════════════════════════
       SCALE LABELS  (at box centres below wedge)
  ════════════════════════════════════════════ -->

  <line x1="93"  y1="224" x2="93"  y2="230" stroke="#ccc" stroke-width="1"/>
  <text x="93"  y="241" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="9" fill="#999">Exabytes</text>

  <line x1="295" y1="224" x2="295" y2="230" stroke="#ccc" stroke-width="1"/>
  <text x="295" y="241" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="9" fill="#999">Petabytes</text>

  <line x1="497" y1="224" x2="497" y2="230" stroke="#ccc" stroke-width="1"/>
  <text x="497" y="241" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="9" fill="#999">Terabytes</text>

  <line x1="780" y1="224" x2="780" y2="230" stroke="#ccc" stroke-width="1"/>
  <text x="780" y="241" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="9" fill="#999">Gigabytes</text>

</svg>
