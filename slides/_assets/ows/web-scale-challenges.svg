<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330"
     font-family="'Source Sans Pro', Helvetica, Arial, sans-serif">

  <defs>
    <!-- clip paths give each panel rounded corners while keeping a sharp header/body boundary -->
    <clipPath id="cp1"><rect x="15"  y="28" width="382" height="262" rx="7"/></clipPath>
    <clipPath id="cp2"><rect x="409" y="28" width="382" height="262" rx="7"/></clipPath>
    <clipPath id="cp3"><rect x="803" y="28" width="382" height="262" rx="7"/></clipPath>
  </defs>

  <!-- ── background ── -->
  <rect width="1200" height="330" fill="#f4f6fa"/>

  <!-- ── title ── -->
  <text x="600" y="20" text-anchor="middle"
        font-size="13" font-weight="700" letter-spacing="1.5" fill="#44475a">
    THE WEB: VOLUME, VELOCITY, VARIETY
  </text>
  <text x="600" y="31" text-anchor="middle"
        font-size="9.5" fill="#7a7f8d">
    Careful: domains, sites, pages, and indexed documents are different units
  </text>

  <!-- ════════════════════════════════════════════════════
       PANEL 1 — VOLUME  (x=15..397)
       ════════════════════════════════════════════════════ -->
  <g clip-path="url(#cp1)">
    <rect x="15"  y="28" width="382" height="262" fill="#ffffff"/>
    <rect x="15"  y="28" width="382" height="42"  fill="#1a5fa8"/>
  </g>
  <rect x="15" y="28" width="382" height="262" rx="7"
        fill="none" stroke="#c8d4e8" stroke-width="1.5"/>

  <text x="206" y="54" text-anchor="middle"
        font-size="14" font-weight="700" letter-spacing="2.5" fill="#ffffff">VOLUME</text>

  <!-- primary stat -->
  <text x="206" y="100" text-anchor="middle"
        font-size="36" font-weight="800" fill="#1a5fa8">1.15 Billion</text>
  <text x="206" y="118" text-anchor="middle"
        font-size="12.5" fill="#555">Netcraft site responses</text>
  <text x="206" y="132" text-anchor="middle"
        font-size="10.5" fill="#aaa">272.6 M domains · Dec 2024 Netcraft survey</text>

  <line x1="45" y1="145" x2="367" y2="145" stroke="#eaeef5" stroke-width="1"/>

  <!-- secondary stats -->
  <text x="206" y="167" text-anchor="middle"
        font-size="22" font-weight="700" fill="#1a5fa8">Top 0.1%–1% of sites</text>
  <text x="206" y="182" text-anchor="middle"
        font-size="12" fill="#666">may account for roughly half of all pages</text>
  <text x="206" y="195" text-anchor="middle"
        font-size="10.5" fill="#aaa">heavy-tail intuition from large web graph studies</text>

  <text x="206" y="218" text-anchor="middle"
        font-size="22" font-weight="700" fill="#1a5fa8">~ 400 Billion</text>
  <text x="206" y="233" text-anchor="middle"
        font-size="12" fill="#666">documents in Google’s search index</text>
  <text x="206" y="246" text-anchor="middle"
        font-size="10.5" fill="#aaa">2020 figure cited in US v. Google testimony</text>

  <!-- takeaway -->
  <rect x="25" y="256" width="362" height="26" rx="4" fill="#eef2fa"/>
  <text x="206" y="273" text-anchor="middle"
        font-size="11" font-style="italic" fill="#1a5fa8">
    Sites ≠ domains ≠ pages; use exact counts cautiously
  </text>

  <!-- ════════════════════════════════════════════════════
       PANEL 2 — VELOCITY  (x=409..791)
       ════════════════════════════════════════════════════ -->
  <g clip-path="url(#cp2)">
    <rect x="409" y="28" width="382" height="262" fill="#ffffff"/>
    <rect x="409" y="28" width="382" height="42"  fill="#d4621a"/>
  </g>
  <rect x="409" y="28" width="382" height="262" rx="7"
        fill="none" stroke="#e8c8aa" stroke-width="1.5"/>

  <text x="600" y="54" text-anchor="middle"
        font-size="14" font-weight="700" letter-spacing="2.5" fill="#ffffff">VELOCITY</text>

  <!-- primary stat -->
  <text x="600" y="100" text-anchor="middle"
        font-size="36" font-weight="800" fill="#d4621a">+8.6 M / month</text>
  <text x="600" y="118" text-anchor="middle"
        font-size="12.5" fill="#555">monthly net change in Netcraft site responses</text>
  <text x="600" y="132" text-anchor="middle"
        font-size="10.5" fill="#aaa">Dec 2024 versus Nov 2024 Netcraft survey</text>

  <line x1="439" y1="145" x2="761" y2="145" stroke="#eaeef5" stroke-width="1"/>

  <!-- secondary stats -->
  <text x="600" y="167" text-anchor="middle"
        font-size="22" font-weight="700" fill="#d4621a">~ 3.2 / second</text>
  <text x="600" y="182" text-anchor="middle"
        font-size="12" fill="#666">same monthly net change, averaged across December</text>

  <text x="600" y="218" text-anchor="middle"
        font-size="22" font-weight="700" fill="#d4621a">149 ZB (global)</text>
  <text x="600" y="233" text-anchor="middle"
        font-size="12" fill="#666">all digital data created / copied worldwide in 2024</text>
  <text x="600" y="246" text-anchor="middle"
        font-size="10.5" fill="#aaa">IDC / Statista global datasphere estimate</text>

  <!-- takeaway -->
  <rect x="419" y="256" width="362" height="26" rx="4" fill="#fdf0e6"/>
  <text x="600" y="273" text-anchor="middle"
        font-size="11" font-style="italic" fill="#d4621a">
    The web changes constantly; crawling is continuous, not one-off
  </text>

  <!-- ════════════════════════════════════════════════════
       PANEL 3 — VARIETY  (x=803..1185)
       ════════════════════════════════════════════════════ -->
  <g clip-path="url(#cp3)">
    <rect x="803" y="28" width="382" height="262" fill="#ffffff"/>
    <rect x="803" y="28" width="382" height="42"  fill="#2a7a44"/>
  </g>
  <rect x="803" y="28" width="382" height="262" rx="7"
        fill="none" stroke="#acd4bc" stroke-width="1.5"/>

  <text x="994" y="54" text-anchor="middle"
        font-size="14" font-weight="700" letter-spacing="2.5" fill="#ffffff">VARIETY</text>

  <!-- primary stat -->
  <text x="994" y="100" text-anchor="middle"
        font-size="31" font-weight="800" fill="#2a7a44">150+ observed content languages</text>
  <text x="994" y="118" text-anchor="middle"
        font-size="12.5" fill="#555">observed across websites</text>
  <text x="994" y="132" text-anchor="middle"
        font-size="10.5" fill="#aaa">W3Techs usage survey</text>

  <line x1="833" y1="145" x2="1155" y2="145" stroke="#eaeef5" stroke-width="1"/>

  <!-- secondary stats -->
  <text x="994" y="167" text-anchor="middle"
        font-size="22" font-weight="700" fill="#2a7a44">249 CMS Platforms</text>
  <text x="994" y="182" text-anchor="middle"
        font-size="12" fill="#666">CMS platforms identified in the HTTP Archive dataset</text>
  <text x="994" y="195" text-anchor="middle"
        font-size="10.5" fill="#aaa">HTTP Archive Web Almanac 2024 (Wappalyzer-based)</text>

  <text x="994" y="220" text-anchor="middle"
        font-size="14" font-weight="600" fill="#2a7a44">HTML · PDF · JSON-LD · media · APIs</text>
  <text x="994" y="236" text-anchor="middle"
        font-size="12" fill="#666">content types to parse and process</text>

  <!-- takeaway -->
  <rect x="813" y="256" width="362" height="26" rx="4" fill="#e8f4ec"/>
  <text x="994" y="273" text-anchor="middle"
        font-size="11" font-style="italic" fill="#2a7a44">
    HTML · PDFs · JS apps · schemas · media · APIs
  </text>

  <!-- ── source note ── -->
  <text x="600" y="307" text-anchor="middle"
        font-size="9.5" fill="#a0a7b4">
    Sources: Netcraft Web Server Survey Dec 2024 · large web graph studies (heavy-tail intuition) ·
  </text>
  <text x="600" y="319" text-anchor="middle"
        font-size="9.5" fill="#a0a7b4">
    US v. Google testimony on ~400B documents (2020 figure) · HTTP Archive Web Almanac 2024 · W3Techs · IDC/Statista
  </text>

</svg>
