<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">SOURCE agent layer over OURRS and external sources</title>
  <desc id="desc">A human scripts workflows for an agent. The agent searches and verifies through OURRS over the Open Web Index, and also interacts with external web and social media sources.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#003399" />
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#00a7b5" />
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#5b677a" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#003399" flood-opacity="0.14" />
    </filter>
    <style>
      .box { fill: #fff; stroke: #d5deef; stroke-width: 2.5; filter: url(#shadow); }
      .box-blue { fill: #edf3ff; stroke: #003399; }
      .box-teal { fill: #e9fbfd; stroke: #00a7b5; }
      .box-soft { fill: #f7f9fc; stroke: #bfc9d9; }
      .label { font: 700 30px Arial, Helvetica, sans-serif; fill: #003399; }
      .small { font: 500 21px Arial, Helvetica, sans-serif; fill: #2e3d58; }
      .tiny { font: 500 18px Arial, Helvetica, sans-serif; fill: #5b677a; }
      .arrow-blue { stroke: #003399; stroke-width: 5; fill: none; marker-end: url(#arrow-blue); }
      .arrow-teal { stroke: #00a7b5; stroke-width: 5; fill: none; marker-end: url(#arrow-teal); }
      .arrow-gray { stroke: #5b677a; stroke-width: 4; fill: none; marker-end: url(#arrow-gray); stroke-dasharray: 10 9; }
      .icon { fill: none; stroke: #003399; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .icon-teal { fill: none; stroke: #00a7b5; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="34" y="28" width="1212" height="664" rx="28" fill="#fbfcff" stroke="#e6ecf6" stroke-width="2" />

  <rect class="box box-soft" x="74" y="98" width="230" height="190" rx="22" />
  <circle cx="189" cy="155" r="34" fill="#edf3ff" stroke="#003399" stroke-width="5" />
  <path class="icon" d="M132 247c16-42 98-42 114 0" />
  <text class="label" x="189" y="326" text-anchor="middle">Human analyst</text>
  <text class="tiny" x="189" y="356" text-anchor="middle">defines goals</text>
  <text class="tiny" x="189" y="382" text-anchor="middle">reviews outputs</text>

  <rect class="box box-blue" x="444" y="84" width="392" height="238" rx="24" />
  <rect x="516" y="126" width="248" height="68" rx="16" fill="#fff" stroke="#003399" stroke-width="4" />
  <circle cx="564" cy="160" r="14" fill="#00a7b5" />
  <circle cx="640" cy="160" r="14" fill="#00a7b5" />
  <circle cx="716" cy="160" r="14" fill="#00a7b5" />
  <path class="icon" d="M564 194v38 M640 194v38 M716 194v38 M520 232h240" />
  <text class="label" x="640" y="276" text-anchor="middle">SOURCE Agent Layer</text>
  <text class="small" x="640" y="309" text-anchor="middle">plans, queries, verifies, reports</text>

  <rect class="box box-teal" x="936" y="90" width="270" height="180" rx="22" />
  <text class="label" x="1071" y="146" text-anchor="middle">OURRS</text>
  <text class="small" x="1071" y="184" text-anchor="middle">OWI search API</text>
  <text class="small" x="1071" y="216" text-anchor="middle">retrieval + evidence</text>

  <rect class="box box-soft" x="936" y="382" width="270" height="190" rx="22" />
  <text class="label" x="1071" y="440" text-anchor="middle">Other sources</text>
  <text class="small" x="1071" y="480" text-anchor="middle">web domains</text>
  <text class="small" x="1071" y="512" text-anchor="middle">social media</text>
  <text class="small" x="1071" y="544" text-anchor="middle">fact-checks</text>

  <rect class="box box-soft" x="420" y="430" width="440" height="160" rx="22" />
  <text class="label" x="640" y="486" text-anchor="middle">Scripted workflows</text>
  <text class="small" x="640" y="526" text-anchor="middle">crawl triggers · checks · reports</text>
  <text class="tiny" x="640" y="558" text-anchor="middle">repeatable human-in-the-loop analysis</text>

  <path class="arrow-blue" d="M306 178 C352 178 380 178 432 178" />
  <text class="tiny" x="368" y="158" text-anchor="middle">task</text>

  <path class="arrow-gray" d="M432 246 C378 276 350 318 304 354" />
  <text class="tiny" x="354" y="304" text-anchor="middle">results</text>

  <path class="arrow-teal" d="M838 164 C876 164 894 164 924 164" />
  <text class="tiny" x="882" y="143" text-anchor="middle">search</text>

  <path class="arrow-teal" d="M924 216 C884 250 870 278 834 290" />
  <text class="tiny" x="884" y="270" text-anchor="middle">verify</text>

  <path class="arrow-blue" d="M834 280 C902 334 920 388 932 464" />
  <text class="tiny" x="900" y="366" text-anchor="middle">collect</text>

  <path class="arrow-gray" d="M938 528 C880 574 814 600 746 586" />
  <text class="tiny" x="844" y="604" text-anchor="middle">signals</text>

  <path class="arrow-blue" d="M304 420 C350 460 376 486 408 508" />
  <text class="tiny" x="360" y="470" text-anchor="middle">scripts</text>

  <path class="arrow-blue" d="M640 430 L640 336" />
  <text class="tiny" x="688" y="386" text-anchor="middle">automation</text>
</svg>
