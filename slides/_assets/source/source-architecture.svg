<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#555"/>
    </marker>
    <marker id="arr-sm" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#777"/>
    </marker>
  </defs>

  <rect width="960" height="680" fill="#ffffff"/>

  <!-- ===== TITLE ===== -->
  <text x="480" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">SOURCE — Technical Architecture &amp; Data Flow</text>

  <!-- ===== DATA SOURCES ===== -->
  <text x="480" y="38" text-anchor="middle" font-size="7.5" fill="#bbb" letter-spacing="1.5">DATA SOURCES</text>

  <!-- Open Web Index -->
  <rect x="28" y="43" width="195" height="60" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2"/>
  <text x="125" y="67" text-anchor="middle" font-size="10" font-weight="bold" fill="#222">Open Web Index</text>
  <text x="125" y="82" text-anchor="middle" font-size="8" fill="#666">OpenWebSearch.eu</text>
  <text x="125" y="95" text-anchor="middle" font-size="8" fill="#666">2 Billion+ indexed pages</text>

  <!-- Social Media -->
  <rect x="238" y="43" width="195" height="60" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2"/>
  <text x="335" y="67" text-anchor="middle" font-size="10" font-weight="bold" fill="#222">Social Media</text>
  <text x="335" y="82" text-anchor="middle" font-size="8" fill="#666">Telegram · Mastodon</text>
  <text x="335" y="95" text-anchor="middle" font-size="8" fill="#666">Platform APIs</text>

  <!-- News Sites -->
  <rect x="448" y="43" width="195" height="60" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2"/>
  <text x="545" y="67" text-anchor="middle" font-size="10" font-weight="bold" fill="#222">News Sites</text>
  <text x="545" y="82" text-anchor="middle" font-size="8" fill="#666">Online news outlets</text>
  <text x="545" y="95" text-anchor="middle" font-size="8" fill="#666">RSS · HTML · sitemaps</text>

  <!-- Multimedia -->
  <rect x="658" y="43" width="274" height="60" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2"/>
  <text x="795" y="67" text-anchor="middle" font-size="10" font-weight="bold" fill="#222">Multimedia</text>
  <text x="795" y="82" text-anchor="middle" font-size="8" fill="#666">Images · Video · Audio</text>
  <text x="795" y="95" text-anchor="middle" font-size="8" fill="#666">Embedded in web pages</text>

  <!-- Arrow label -->
  <text x="480" y="120" text-anchor="middle" font-size="7.5" fill="#999" font-style="italic">HTTP · RSS · platform APIs · media streams</text>

  <!-- Arrows: Sources → Module D (straight vertical) -->
  <line x1="125" y1="103" x2="125" y2="133" stroke="#bbb" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="335" y1="103" x2="335" y2="133" stroke="#bbb" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="545" y1="103" x2="545" y2="133" stroke="#bbb" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="795" y1="103" x2="795" y2="133" stroke="#bbb" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ===== MODULE D: COLLECTION & INFRASTRUCTURE ===== -->
  <text x="480" y="130" text-anchor="middle" font-size="7.5" fill="#bbb" letter-spacing="1">MODULE D — COLLECTION &amp; INFRASTRUCTURE (LRZ / BADW)</text>
  <rect x="28" y="135" width="904" height="86" rx="4" fill="#2a2a2a" stroke="#111" stroke-width="1.5"/>

  <!-- OWLer sub-box -->
  <rect x="40" y="146" width="237" height="64" rx="3" fill="#3c3c3c" stroke="#555" stroke-width="1"/>
  <text x="158" y="166" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">OWLer Crawler</text>
  <text x="158" y="181" text-anchor="middle" font-size="8" fill="#bbb">100M URLs/day · 4 HPC sites</text>
  <text x="158" y="196" text-anchor="middle" font-size="7.5" fill="#888">dedup · normalise · extract</text>

  <!-- Internal arrow OWLer → iRODS -->
  <line x1="277" y1="178" x2="291" y2="178" stroke="#777" stroke-width="1" marker-end="url(#arr-sm)"/>

  <!-- iRODS sub-box -->
  <rect x="292" y="146" width="237" height="64" rx="3" fill="#3c3c3c" stroke="#555" stroke-width="1"/>
  <text x="410" y="166" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">iRODS Storage</text>
  <text x="410" y="181" text-anchor="middle" font-size="8" fill="#bbb">Federated · multi-site · versioned</text>
  <text x="410" y="196" text-anchor="middle" font-size="7.5" fill="#888">raw HTML · JSON · media blobs</text>

  <!-- Internal arrow iRODS → LEXIS -->
  <line x1="529" y1="178" x2="543" y2="178" stroke="#777" stroke-width="1" marker-end="url(#arr-sm)"/>

  <!-- LEXIS sub-box -->
  <rect x="544" y="146" width="376" height="64" rx="3" fill="#3c3c3c" stroke="#555" stroke-width="1"/>
  <text x="732" y="166" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">LEXIS HPC Orchestration · HammerHAI AI Factory</text>
  <text x="732" y="181" text-anchor="middle" font-size="8" fill="#bbb">Workflow scheduling · GPU compute · job dispatch</text>
  <text x="732" y="196" text-anchor="middle" font-size="7.5" fill="#888">Scalable across additional data centres</text>

  <!-- Arrows: Module D → Module A and Module B -->
  <!-- Module A center x = 28 + 440/2 = 248 -->
  <!-- Module B center x = 492 + 440/2 = 712 -->
  <text x="140" y="237" text-anchor="middle" font-size="7.5" fill="#999" font-style="italic">preprocessed text</text>
  <text x="140" y="247" text-anchor="middle" font-size="7.5" fill="#999" font-style="italic">+ metadata</text>
  <text x="820" y="237" text-anchor="middle" font-size="7.5" fill="#999" font-style="italic">preprocessed text</text>
  <text x="820" y="247" text-anchor="middle" font-size="7.5" fill="#999" font-style="italic">+ metadata</text>
  <line x1="248" y1="221" x2="248" y2="253" stroke="#bbb" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="712" y1="221" x2="712" y2="253" stroke="#bbb" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ===== MODULE A: PROVENANCE ===== -->
  <rect x="28" y="255" width="440" height="130" rx="4" fill="#1a1a1a" stroke="#000" stroke-width="1.5"/>
  <text x="248" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Module A — Provenance Analysis  (Uni Passau)</text>
  <!-- items: name column x=45, description column x=200 -->
  <text x="45" y="293" font-size="8.5" font-weight="bold" fill="#dddddd">① Fingerprinting</text>
  <text x="200" y="293" font-size="8" fill="#777">ISO 24138:2024 · SimHash · near-dup detection</text>
  <text x="45" y="308" font-size="8.5" font-weight="bold" fill="#dddddd">② Temporal Diffusion</text>
  <text x="200" y="308" font-size="8" fill="#777">Timeline · coordinated spreading detection</text>
  <text x="45" y="323" font-size="8.5" font-weight="bold" fill="#dddddd">③ Actor Attribution</text>
  <text x="200" y="323" font-size="8" fill="#777">Metadata · interaction graphs · bot patterns</text>
  <text x="45" y="338" font-size="8.5" font-weight="bold" fill="#dddddd">④ Stylometric Profiler</text>
  <text x="200" y="338" font-size="8" fill="#777">ResiliPipe · PAN tasks · authorship signals</text>
  <text x="45" y="353" font-size="8.5" font-weight="bold" fill="#dddddd">⑤ Diffusion Graph</text>
  <text x="200" y="353" font-size="8" fill="#777">Graph DB · spreading paths · amplification</text>
  <!-- output label -->
  <text x="248" y="371" text-anchor="middle" font-size="7.5" fill="#555" font-style="italic">→ provenance scores · actor profiles · diffusion traces</text>

  <!-- ===== MODULE B: CONTENT ===== -->
  <rect x="492" y="255" width="440" height="130" rx="4" fill="#1a1a1a" stroke="#000" stroke-width="1.5"/>
  <text x="712" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Module B — Content Analysis  (Uni Kassel)</text>
  <!-- items: name x=509, description x=664 -->
  <text x="509" y="293" font-size="8.5" font-weight="bold" fill="#dddddd">① Pre-filter</text>
  <text x="664" y="293" font-size="8" fill="#777">High-recall bloom/LSH · stream processing</text>
  <text x="509" y="308" font-size="8.5" font-weight="bold" fill="#dddddd">② AI-Gen Detector</text>
  <text x="664" y="308" font-size="8" fill="#777">LLM classifier · watermark detection · benchmarks</text>
  <text x="509" y="323" font-size="8.5" font-weight="bold" fill="#dddddd">③ Watermark Verifier</text>
  <text x="664" y="323" font-size="8" fill="#777">Content integrity · crypto provenance marks</text>
  <text x="509" y="338" font-size="8.5" font-weight="bold" fill="#dddddd">④ Fact-check Agent</text>
  <text x="664" y="338" font-size="8" fill="#777">RAG pipeline · KG · claim verification</text>
  <text x="509" y="353" font-size="8.5" font-weight="bold" fill="#dddddd">⑤ Linguistic Analyzer</text>
  <text x="664" y="353" font-size="8" fill="#777">Rhetoric · argumentation · framing patterns</text>
  <text x="712" y="371" text-anchor="middle" font-size="7.5" fill="#555" font-style="italic">→ content labels · AI-gen probability · fact-check verdicts</text>

  <!-- Bus: Modules A+B → SOURCE DB -->
  <!-- Module A/B bottom: y=385 -->
  <line x1="248" y1="385" x2="248" y2="403" stroke="#aaa" stroke-width="1.2"/>
  <line x1="712" y1="385" x2="712" y2="403" stroke="#aaa" stroke-width="1.2"/>
  <line x1="248" y1="403" x2="712" y2="403" stroke="#aaa" stroke-width="1.2"/>
  <line x1="480" y1="403" x2="480" y2="413" stroke="#aaa" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- bus flow labels -->
  <text x="200" y="400" text-anchor="middle" font-size="7" fill="#888" font-style="italic">prov. indicators</text>
  <text x="760" y="400" text-anchor="middle" font-size="7" fill="#888" font-style="italic">content signals</text>

  <!-- ===== SOURCE DATABASE / KNOWLEDGE GRAPH ===== -->
  <rect x="128" y="415" width="704" height="73" rx="4" fill="#050505" stroke="#000" stroke-width="2"/>
  <text x="480" y="440" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff" letter-spacing="0.5">SOURCE DATABASE  /  KNOWLEDGE GRAPH</text>
  <text x="480" y="457" text-anchor="middle" font-size="8.5" fill="#aaaaaa">Articles · Claims · Actors · Sources · Provenance chains · Disinformation indicators</text>
  <text x="480" y="473" text-anchor="middle" font-size="8" fill="#555555">Open access · SPARQL endpoint · REST API · RDF/JSON-LD · bulk export</text>

  <!-- Arrow label -->
  <text x="480" y="504" text-anchor="middle" font-size="7.5" fill="#999" font-style="italic">structured queries · open data · dashboard feeds</text>

  <!-- Arrows: SOURCE DB → Access layer (straight vertical from each access center) -->
  <!-- API center x=184, Dashboard center x=480, Export center x=776 -->
  <line x1="184" y1="488" x2="184" y2="518" stroke="#bbb" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="480" y1="488" x2="480" y2="518" stroke="#bbb" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="776" y1="488" x2="776" y2="518" stroke="#bbb" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ===== ACCESS LAYER ===== -->
  <!-- REST / SPARQL API -->
  <rect x="78" y="520" width="212" height="62" rx="4" fill="#363636" stroke="#222" stroke-width="1.2"/>
  <text x="184" y="542" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">REST / SPARQL API</text>
  <text x="184" y="557" text-anchor="middle" font-size="8" fill="#bbb">Programmatic access</text>
  <text x="184" y="571" text-anchor="middle" font-size="8" fill="#888">query · filter · subscribe</text>

  <!-- Web Dashboard -->
  <rect x="374" y="520" width="212" height="62" rx="4" fill="#363636" stroke="#222" stroke-width="1.2"/>
  <text x="480" y="542" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">Web Dashboard</text>
  <text x="480" y="557" text-anchor="middle" font-size="8" fill="#bbb">Interactive exploration</text>
  <text x="480" y="571" text-anchor="middle" font-size="8" fill="#888">Module E · Alliance4Europe</text>

  <!-- Open Data Export -->
  <rect x="670" y="520" width="212" height="62" rx="4" fill="#363636" stroke="#222" stroke-width="1.2"/>
  <text x="776" y="542" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">Open Data Export</text>
  <text x="776" y="557" text-anchor="middle" font-size="8" fill="#bbb">RDF · JSON-LD · CSV</text>
  <text x="776" y="571" text-anchor="middle" font-size="8" fill="#888">bulk download · data dumps</text>

  <!-- Arrows: Access → Beneficiaries -->
  <line x1="184" y1="582" x2="184" y2="606" stroke="#bbb" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="480" y1="582" x2="480" y2="606" stroke="#bbb" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="776" y1="582" x2="776" y2="606" stroke="#bbb" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ===== BENEFICIARIES ===== -->
  <!-- Fact-checkers & Journalists -->
  <rect x="48" y="608" width="272" height="55" rx="4" fill="#f2f2f2" stroke="#c8c8c8" stroke-width="1.2"/>
  <text x="184" y="632" text-anchor="middle" font-size="10" font-weight="bold" fill="#222">Fact-checkers &amp; Journalists</text>
  <text x="184" y="648" text-anchor="middle" font-size="8" fill="#666">DBKF · EUvsDisinfo · CDN (130+ analysts)</text>

  <!-- Researchers -->
  <rect x="344" y="608" width="272" height="55" rx="4" fill="#f2f2f2" stroke="#c8c8c8" stroke-width="1.2"/>
  <text x="480" y="632" text-anchor="middle" font-size="10" font-weight="bold" fill="#222">Researchers &amp; Academia</text>
  <text x="480" y="648" text-anchor="middle" font-size="8" fill="#666">Open benchmarks · datasets · APIs</text>

  <!-- Civil Society -->
  <rect x="640" y="608" width="272" height="55" rx="4" fill="#f2f2f2" stroke="#c8c8c8" stroke-width="1.2"/>
  <text x="776" y="632" text-anchor="middle" font-size="10" font-weight="bold" fill="#222">Civil Society &amp; NGOs</text>
  <text x="776" y="648" text-anchor="middle" font-size="8" fill="#666">Awareness tools · expert studies</text>

</svg>
