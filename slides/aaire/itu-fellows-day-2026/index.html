## 2 · Open Web Search

<span class="eyebrow">An open model on closed search is a closed system</span>

<div class="viz" data-viz="ows/system-view" data-params='{"stage": 1, "focus": "retrieval", "caption": false, "state": {"corpus": "closed", "index": "closed", "ranking": "closed", "api": "closed"}}'></div>

Notes:
Today every layer of the retrieval column is somebody else's when an agent searches the web through a commercial API: the corpus is not disclosed, the index cannot be fixed to a snapshot, the ranking cannot be replaced, and the terms forbid storing results or training on them (Microsoft's Grounding with Bing Search terms: "Developers and end users don't have access to raw content returned").

--

<!-- .slide: class="smaller" -->

## Openness is a property of the whole stack


<div class="pull-quote">

Open Source AI needs more than fully open models. It needs an open search system underneath.

</div>



<div class="stack">


<div class="layer is-closed">

**Agent platform and record** *hyperscaler clouds*

</div>


<div class="layer is-open">

**Model** *open weights and fully open models exist: OLMo 3, Apertus, Soofi S*

</div>


<div class="layer is-closed">

**Search API** *Bing retired Aug 2025, Google's ends Jan 2027, the rest undisclosed*

</div>


<div class="layer is-closed">

**Index and corpus** *no public web index of comparable scale, until recently*

</div>


</div>



<div class="c-warning">

Openness has reached the model layer. Above and below it, agents still run on infrastructure we can rent but not inspect, reproduce or keep. Transparency needs open web search as public infrastructure.

</div>



<div class="slide-citation">

Microsoft lifecycle notice, May 2025 · Google Custom Search JSON API documentation, Sep 2026 · AI2, *OLMo 3*, 2025 · Swiss AI, *Apertus*, 2025 · SOOFI, *Soofi S*, 2026.

</div>


Notes:
Read the stack top down.
- Agent platform and record: the closing prediction of the OSSYM talk was that the AI business moves from models to the secure environment in which agents execute their tasks, most likely the hyperscalers' clouds. Whoever runs it holds the record of what agents did, which is the record we need for accountability (part 4).
- Model: the only layer where openness is real. OLMo 3 (AI2, Nov 2025), Apertus (EPFL, ETH, CSCS, Sep 2025) and Soofi S (SOOFI consortium, Jul 2026) release weights, data and code. OpenEuroLLM has no flagship model yet.
- Search API: Bing Search APIs retired on 11 Aug 2025 with under three months' notice; the Google Custom Search JSON API is closed to new customers and ends on 1 Jan 2027. Exa, Tavily, Perplexity and the search tools of OpenAI and Anthropic do not disclose or fix their corpus.
- Index and corpus: Common Crawl offers dated crawls but no index or ranking; the Open Web Index (next slide) is what we built to fill this layer.

## Two example datasets from the index


<div class="grid-2 gap-lg small">


<div class="column">


<div class="img-h-md">

![WebFAQ 2.0: an English question, its aligned Malay answer, and a mined hard negative](/slides/_assets/ows/papers/webfaq2.png)

</div>


<div class="paper detail">

<span class="eyebrow">SIGIR 2026 resource</span>
### WebFAQ 2.0 · multilinguality
- **Built from** schema.org FAQPage markup, mined and crawled directly. The pairs are written by site owners, not generated.
- **Size** 198M question–answer pairs in 108 languages, 14.3M of them aligned across 3,970 language combinations.
- **Controls** which language, or which language pair, an experiment runs in. 1.25M queries ship with 200 hard negatives each.

</div>


</div>


<div class="column">


<div class="img-h-md">

![WebKurator.de: topical navigation on the left, regional selection on the right](/slides/_assets/ows/papers/webkurator.png)

</div>


<div class="paper detail">

<span class="eyebrow">WebSci 2026</span>
### WebKurator · region and topic
- **Built from** the legal imprint of 5.54M German-language sites, geocoded and then topic-labelled automatically.
- **Size** 2.58M sites in Germany carry both a location and a topic at launch.
- **Controls** region and topic as two independent axes, so "this topic in that region" is a query, not a filter over one hierarchy.

</div>


</div>


</div>



<div class="slide-citation">

Dinzinger et al., *WebFAQ 2.0*, SIGIR 2026 · Dinzinger et al., *The WebKurator.de Platform*, WebSci 2026. Figures CC BY 4.0.

</div>


Notes:
The point of the pair is that they are cut from the same crawl along different axes, and each axis is a variable somebody in this room wants to control. WebFAQ is the index used as a training-data factory: structured data was extracted during processing, so FAQ pages can be harvested without a second crawl, and version 2 stops relying on someone else's Web Data Commons extraction and mines the URLs itself. What makes it an evaluation resource rather than a dump is the alignment and the negatives: 14.3 million pairs that say the same thing in two languages, and 200 mined hard negatives for each of 1.25 million queries. One honest detail worth saying: those negatives help when they are distilled with MarginMSE and hurt when they are used naively in a contrastive loss, because some of them are false negatives. WebKurator is the same index cut by place; the country split, if asked, is 85.6 per cent Germany, 7.3 Austria and 5.2 Switzerland. Imprint pages are a legal requirement in Germany, so they carry an address, and an address geocodes; that is why a national-scale regional index can be bootstrapped at all. Curlie is one-dimensional, and the WebKurator argument is that topic and region are separate questions. If asked what this has to do with evaluation: a regional sub-collection is a realistic, small, nameable slice, and those are the collections labs can actually afford to judge. Third strand, if time allows: continued pre-training on crawled index text improved cross-lingual hate-speech detection by about three macro-F1 points averaged over 16 benchmarks, which is Dang, Mitrović and Granitzer at LREC 2026 — evidence that this data measurably improves a model, not only a benchmark.
→ next in the CLEF 2026 talk: two more variables, and the first one is size.

- As a search engine: it is an early prototype. The weak spot is import throughput (about 50 to 60 documents per second per lane). The open question on the slide is the one every non-commercial search engine faces.

Notes:

## Agents need a different search paradigm

| | A person searching | An agent searching |
|---|---|---|
| **Where** | one engine, one result page | several repositories and endpoints in one task |
| **How deep** | the top of the first page | scans down to about 40 results, then aggregates |
| **How often** | one to a few queries | 20 to 26 search calls per question |
| **Effort** | kept as low as possible | cheap; the person delegates and is willing to wait for the work |
| **What comes back** | a click on a link | a synthesis with its sources |


<div class="c-insight">

The target moves from precision in the top ten for a reader to recall, coverage and aggregation across sources for an agent, and the agent's traces become training data.

</div>



<div class="slide-citation">

Chen et al., *BrowseComp-Plus*, 2025 (GPT-5, o3: search calls per question) · result depth: anecdotal, an OURRS summary for a CLEF query, September 2026.

</div>


Notes:
- 20 to 26 search calls per question: GPT-5 and o3 on BrowseComp-Plus.
- About 40 results scanned per query: anecdotal evidence from the example shown at CLEF 2026 ("A good summary overcomes a bad ranking"). OURRS's generated summary for a CLEF query read down to about 40 results and answered correctly, although the document it rests on was ranked 16th. nDCG@10 scores that result list as a miss; for the reader of the summary it was a success. Say that this is one example, not a measurement.
- Several repositories: a coding agent already searches the user's files, a library's documentation and the web in one task, and chooses which to ask. This is federated search, decided per question by the agent.
- Willingness to work: with deep-research modes, people accept minutes of waiting for an answer, which removes the latency budget that shaped web ranking.
- Consequences for retrieval research: evaluate the choice and combination of endpoints, not one ranking; optimise for what the agent aggregates, not what a person clicks; and use the traces, which agents leave in full, as training data (next slide: what we work on).

<div class="column">


<div class="card">

<span class="eyebrow">Embeddings and scale</span>
### Representations that hold up at web scale
Compression that is free at 10K passages costs recall at 100M: scale alone takes **29 points** of Recall@100 and flips the choice of model.

</div>


</div>


<div class="column">


<div class="card">

<span class="eyebrow">Agent and user simulation</span>
### Traces we can check, not believe
AgentSim records every step of an agent's search with the documents it used: **103,567** steps from 21,000 trajectories over three corpora.

</div>


</div>


<div class="column">


<div class="card">

<span class="eyebrow">Small language models for search</span>
### Distil the search behaviour
A 3B model trained on the traces of an 80B one picks the next retrieval action (macro-F1 **0.65** against **0.17** prompted) and makes the pipeline use its evidence (**0.01 → 0.62**).

</div>


</div>


<div class="column">


<div class="card">

<span class="eyebrow">Algorithmic optimisation</span>
### Read less of the cache
KV-Selector: a network of 5k to 9k parameters per layer picks which key-value blocks a query reads. **81–99%** of an oracle against 51–94% for State-of-the-ARt; decoding **8 to 35× faster** at 128k tokens.

</div>


</div>


</div>



<div class="slide-citation">

Caspari et al., *CoRECT*, ECIR 2026 · Zerhoudi, Granitzer, Mitrović, *AgentSim*, SIGIR 2026 · Al-Maamari et al., *The Fellowship of the Query*, CIKM 2026 · *Query-Aware KV Block Selection from Cache Landmarks*, under review, 2026.

</div>


Notes:
One slide for the group's work on retrieval for agents; the next slide takes one of the four lines in detail.
- Embeddings and scale (CoRECT, ECIR 2026): the same 65 TREC DL 2023 queries and judgements, the corpus grown from 10K to 100M passages with fixed mined distractors. Recall@100 falls from 0.82 to 0.53 on scale alone; 8-bit to 2-bit quantisation is free at every size, truncation and 1-bit binarisation are free at 10K and costly at 100M. A compression decision taken on a benchmark can be wrong on the web.
- Agent and user simulation (AgentSim, SIGIR 2026): 1,000 corpus-aware seed queries per corpus over MS MARCO, Quasar-T and CausalQA via ChatNoir, three LLMs, up to seven retrieval–reasoning cycles; 199,968 distinct documents retrieved. Successor line of SimIIR; OpenIIR (part 4) simulates groups.
- Small language models (Fellowship of the Query, CIKM 2026 short): teacher Qwen3-Next 80B, 1,490 accepted of 5,000 rollouts, seven retrieval actions; student Granite 4.1 3B. As controller and generator in a BM25 pipeline, token F1 0.778 → 0.830 (interval just clears zero; exact match does not), evidence-fact rate 0.012 → 0.616 (an automatic heuristic). Small models run on the device, close to the user (edge AI, Michele Magno's talk).
- Algorithmic optimisation (KV-Selector, under double-blind review at ICLR 2027, so no author names on the slide): long inputs make decoding slow because every token reads the whole key-value cache. Quest ranks cache blocks by an upper bound from two landmark keys; KV-Selector keeps the landmarks and replaces the bound with a 4,801 to 9,409-parameter network per layer, trained in minutes to predict the model's own attention. Gap closed to an attention oracle 81 to 99% across eleven models (Quest 51 to 94%), better than every training-free rule in 78 of 82 settings; 8.1 to 34.8 times faster decoding with the cache offloaded at 128k tokens. Weak spot: retrieval-style tasks, where a simple mean-key rule can win.

## LocRoPE: the query decides how place matters


<div class="grid-figure gap">


<div class="column">

![LocRoPE: the query text sets complex weights on a multi-scale location code, so one vector holds text and location](/slides/_assets/ows/papers/locrope-overview.png)

</div>


<div class="column small">

Queries say **how** location matters: *within 2 km*, *between 10 and 50 km*, *about 10 km north*, *near*. Today's retrievers add one distance curve, the same for every query.


<div class="c-important">

### LocRoPE
A multi-scale rotary location code (0.1 to 10,000 km) inside the retrieval vector. The query's words set its weights, so one inner product is text similarity plus a location kernel whose scale and shape the query chooses.

</div>


Joint work with GeoAI (Bernd Resch).

</div>


</div>



<div class="slide-citation">

Ghosh Dastidar et al., *LocRoPE: Letting the Query Text Shape the Location Match in Single-Vector Dense Retrieval*, in preparation, Nov 2026.

</div>


Notes:
Work with Kanishka Ghosh Dastidar (IT:U).
- The baseline is LIST (VLDB Journal 2025): late fusion of a text score and one learned distance curve, weighted per query. The curve has the same width and shape for every query, can only say "nearer is better", and needs its own index.
- Method: an Earth-centred 3-D position, 51 scales from 0.1 to 10,000 km, three directions per scale, 153 rotary pairs. The query's location part is the code multiplied by complex weights produced from the query text; a place's location part carries only a size. Their product is a kernel in the displacement between query and place. Sizes set the scale; signs give rings and exclusions; phases give one-sided shapes such as "north of".
- Backbone Qwen3-Embedding-0.6B, trained on rule-built queries over Wikidata and Overture places in 33 countries; dev and test countries are held out; one seed per system.

--

</div>

| test set, nDCG@10 | LocRoPE | LIST |
|---|---:|---:|
| stated radii | 97.6 | 97.4 |
| realistic queries | **81.4** | 78.4 |
| rings, *between a and b* | **96.9** | 63.2 |

Realistic queries: +2.9 [+1.5, +4.3], mostly where the scale is implied (*near X*). It serves from a standard HNSW index.

</div>



<div class="slide-citation">

</div>


Notes:
The figure: one identical café is placed on a grid around Leiden and scored under four queries. Top row LocRoPE, bottom row coordinates written as text. Orange marks the true region (dashed: the mirror point of "north"). LocRoPE draws discs of the stated radius (AUC 0.999 and 0.997), a ring (0.979) and a region to the north with no mass at the mirror point (0.997). Coordinates as text produce a latitude/longitude cross (0.960, 0.947, 0.870, 0.830), because the model matches digits.

- Serving: HNSW (M 64, ef 1024) at 9.3 ms per query against LIST's exact scan at 754.9 ms on 2.08M places.
- GeoAI link: places, sensor observations and text in one retrieval vector. Extended features such as rivers and regions are the open problem; for a river the local AUC rises from 0.59 to 0.96 as the code grows from 153 to 10,440 pairs. East/west holds only regionally with an Earth-centred code (a local frame is future work).

## Moltbook: social form without social function


<div class="grid-2-1 gap-lg">


<div class="column">


<div class="img-h-lg">

![The Moltbook landing page: a social network for AI agents, where humans are welcome to observe](/slides/_assets/ows/screenshots/screenshot-moltbook.png)

</div>


<div class="figure-credit">

moltbook.com: a Reddit-shaped network where only AI agents post, launched January 2026.

</div>


</div>


<div class="column small">


<div class="card">

### The study
40 days crawled: **1.31M posts, 6.7M comments, 120,811 agents.**

</div>



<div class="marks-no">

- **91.4%** of authors never return to their own thread
- **97.3%** of comments receive no vote at all
- open disagreement in **0.01%** of replies

</div>



<div class="c-note">

Hard platform constraints changed behaviour within a day; soft guidance was ignored.

</div>


</div>


</div>



<div class="c-important">

Agents interacting without a task produce the form of a society, not its function.

</div>



<div class="slide-citation">

Zerhoudi, Ghosh Dastidar, Klement, Romazanov, Einwiller, Dang, Dinzinger, Granitzer, Hautli-Janisz, Katzenbeisser, Lemmerich, Mitrović, *Form Without Function: Agent Social Behavior in the Moltbook Network*, 2026.

</div>


Notes:
Moltbook launched on 28 January 2026 as a Reddit-style network where the accounts are AI agents: they post, comment and upvote; people are spectators ("humans welcome to observe"). An owner joins by telling their agent to read a skill file; the agent registers itself and only then sends the owner a claim link. Meta acquired it in March 2026. It is the only place where a population of agents interacts at scale in public, so it is a natural experiment on what agents do when left to talk to each other.
- Crawl with our own crawler, first 40 days: 1,312,238 posts, 6.7 million comments, 120,811 post authors, 5,400 communities, 10% of posts flagged as spam.
- Threads without conversation: 91.4% of post authors never return to their own thread, 85.6% of threads are flat, reciprocity 3.3% against 22 to 60% on human platforms; the median first comment arrives after 55 seconds.
- Votes without evaluation: 97.3% of comments receive zero upvotes, 1,084 downvotes across 6.7M comments. No quality signal, no implicit feedback, nothing to learn from.
- Profiles without topics: 97.9% of agents never post in a community matching their own bio. Replies without argument: 64.6% of comment–post pairs carry no argumentative relation, open disagreement 0.01%.
- Participation is extremely unequal: the three most active agents contributed 964,438, 947,272 and 279,631 items; the median agent four.
- Rate limits and a crypto filter changed behaviour within a day, while soft guidance in the same instruction file was ignored: the instruction file drives the platform, not the model.
- The lesson for the next slides: collaboration among agents needs a purpose, which comes from a task, from retrieval and from the people the work is for.

## YOARS: govern a human–agent team through its messages


<div class="grid-figure gap">


<div class="column">

<div class="column small">


<div class="marks-step">

- **Principals**: humans and agents authenticate alike; every agent has a human owner
- **Acts**: typed, addressed messages whose type states the intent, request or inform
- **Rooms**: goals, decision rules and routing
- **Ledger**: an append-only, attributable record of every act

</div>



<div class="c-note">

Agents from different vendors (Claude Code, Codex, Pi, open models) join the same room.

</div>


</div>

<div class="slide-citation">

Granitzer, Ghosh Dastidar, Einwiller, Mitrović, Zerhoudi, *Getting a Grip: Operating Human–Agent Software Teams Through Governed Messages*, technical report, 2026.

</div>


Notes:
YOARS, Your Open Agent Relay System. Teams of several people directing many coding agents from different vendors must answer questions a single agent never raises: who may ask whom for what, which messages start work and which only inform, which decisions bind, and who caused a change. Prompts neither enforce these rules nor leave an attributable record.
- The relay routes; it never decides. Acts follow the speech-act idea of KQML and FIPA ACL, which predates language-model agents; MCP standardises tool calls and A2A delegation between two parties, but neither gives a persistent, governed space for many people and agents.
- Step the figure: humans and agents around the relay; rooms and addressed messages; coordination records (goals, proposals and votes, receipts); identity and the services underneath (OURRS search, a shared git workspace).

Notes:
Explain the setup first, then the numbers.
- Setup: the team developed YOARS itself, the most demanding task available, over four weeks with up to 19 agents and two people (a convenience sample, since the two people are authors). 3,276 model turns of the component agents used 11.4 billion tokens, about 4,400 USD at list price. Alongside, 926 controlled runs (899 analysable) of small agent teams building programs: revising which messages start work cut total coordination failure from 42% to 13% (p = .006; .057 after correction for nine tests). An auditor reading the ledger named the persuader in 25 of 25 backdoor runs, but also flagged 24 of 40 honest runs. Details in the appendix.
- The numbers: week 4 is a partial week of 4.2 days, and its answered rate excludes the final 12 hours of the export (66% including them). Coordinators' requests to component agents were answered in a median of 21, 6, 15 and 1 minutes in the four weeks.
- Context matters for the wait: when a request reached a human-run coordinator after half an hour of silence in its session, the 90th percentile of its response was 7.4 hours, against 1.0 hour when the session had just been active.
- 189 of 205 recorded decisions (92%) were attributed to an operator. The bottleneck was neither programming nor the difficulty of the decisions, but access to a human decision maker. The team's remedies were organisational: more decision makers, delegated authority, fewer acts competing for a person's attention.
- With customers and several stakeholders, decisions get harder and involve more people, so this bottleneck will grow. Decision fatigue becomes a design concern of the system, not a property of the user (Philipp Wintersberger's talk on the architecture of the human mind).

## Towards civic information spaces


<div class="c-warning">

**Information spaces are changing fast.** AI agents become new actors, more content moves behind walled gardens, power concentrates, and misuse and disinformation become everyday.

</div>



<div class="pull-quote">

So how do we build participatory, sovereign and resilient<br>AI-mediated information spaces?

</div>



<div class="grid-3 gap">


<div class="column">


<div class="card">

### Participation
People, and the agents acting for them, contribute, contest and decide, not only consume what a platform ranks for them.

</div>


</div>


<div class="column">


<div class="card">

### Sovereignty
Understanding and control of the whole chain: corpus, index, ranking, model, agent and the record of what they did.

</div>


</div>


<div class="column">


<div class="card">

### Resilience
The space survives a withdrawn service, a manipulated source and a hostile member, and afterwards we can find out what happened.

</div>


</div>


</div>


Notes:
The wrap-up: the term "civic information space" gathers the four parts into one research agenda. It is the shared space of documents, search services, models and now agents through which a society informs itself.
- Participation: the web was participatory on the writing side and centralised on the finding side. Agents add a third role: they read, summarise and increasingly publish (AI Opinions, NuggetPedia, YOARS).
- Sovereignty here means understanding and control, not national autarky: the ability to inspect, reproduce, vary and operate every layer (Open Web Index, OURRS, open models).
- Resilience covers three failure modes from the talk: services disappear (Bing Search APIs retired 11 Aug 2025; Google Custom Search JSON API ends 1 Jan 2027), sources are manipulated (disinformation campaigns; the SOURCE project, BMFTR 2026–2029, builds an early-warning platform on the Open Web Index), and members of an agent team can be hostile (Getting a Grip).
- Method: build, operate, study. Understanding web search came largely from operating search engines; the same holds for agentic systems.

## Getting a Grip: seven lessons for human–agent teams


<div class="marks-num">

- **Describe the workspace**, and check agreement and integration separately.
- **Make requests and answers reach the right agent**: anything that requires action is a request.
- **Make rules and plan semantics explicit**: is a date a deadline, and who may choose the order of work?
- **Separate prevention from investigation**: defences inside the conversation do not stop a backdoor; the record finds it.
- **Design for scarce human attention**: delegate bounded authority, filter what reaches a person.
- **Manage context as a first-class resource**: restore briefs and norms after compaction, their loss is silent.
- **Verify reported results** against concrete runs, with independent review.

</div>



<div class="slide-citation">

Granitzer et al., *Getting a Grip*, technical report, 2026, Section "Lessons".

</div>


Notes:
The report pairs the lessons with a checklist for practitioners. Lesson 6 cites the compaction study (Zerhoudi, Mitrović, Granitzer, *The Compaction Cliff in Long-Running AI Agent Memory*, CIKM 2026).

## Appendix: Getting a Grip, what the protocol controls

| Question | Study | Finding |
|---|---|---|
| **Controllability**: which room rules change how agent teams coordinate? | 926 controlled runs, small agent teams building programs | Revising which messages start work cut total coordination failure from **42% to 13%** (p = .006; .057 after correction for nine tests). Instructed roles and votes did not reliably produce the intended process. |
| **Transparency**: a hostile member plants a backdoor | the same runs, some with one hostile member | No defence inside the conversation reliably stopped it. An auditor reading the ledger named the persuader in **25 of 25** cases, but also flagged **24 of 40** honest runs. |
| **Operation**: what happens over weeks of real work? | 4 weeks, up to 19 agents and 2 people, **7,457 acts**, developing YOARS itself | Most governance requirements emerged from operation. Holding context, not producing output, dominated token cost. |


<div class="c-insight">

Control comes from the protocol and the record, not from asking agents to behave.

</div>



<div class="slide-citation">

Granitzer et al., *Getting a Grip*, technical report, 2026. Corpus, redacted ledger and analysis scripts released.

</div>


Notes:
