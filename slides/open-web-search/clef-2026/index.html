## Beyond Open Models: Building Open Web Search Infrastructure for AI Agents

Michael Granitzer  
Chair of Data Science, University of Passau, Germany  
IT:U Interdisciplinary Transformation University Linz, Austria  
Coordinator OpenWebSearch.EU


<div class="center">

CLEF 2026 · Keynote · 22 September 2026

</div>



<div class="title-funding">

<small>Funded by</small>
![European Commission](/slides/_assets/ows/logo-eu-flag.svg)
![BMFTR](/slides/_assets/ows/logo-bmftr.svg)
![BMLEH](/slides/_assets/ows/logo-bmleh.svg)
<img class="logo-sm" src="/slides/_assets/ows/logo-stmwi-bayern.png" alt="StMWi Bayern">

</div>


Notes:

Open-source language models are becoming increasingly capable and accessible. Yet an open model does not by itself create an open information-access system. When models and agents depend on proprietary search services, researchers cannot inspect or modify the underlying corpus, indexing process, retrieval system, or usage data. This talk therefore advances four hypotheses about the infrastructure required for transparent research on future search systems.  First, openness must extend below the model layer. OpenWebSearch.EU is a European research initiative developing distributed infrastructure for crawling, processing, and indexing the web. One of its central outcomes is the Open Web Index: an openly accessible web index that supports search services as well as bulk access to data for independent experimentation. On top of this index, OURRS provides a web search engine through which researchers, applications, and agents can retrieve information using an open and inspectable infrastructure.  Second, corpus scale and complexity must be treated as scientific variables rather than merely engineering constraints. As collections grow, retrieval systems encounter more plausible distractors, duplication, multilingual content, and conflicting evidence. These changes affect effectiveness, efficiency, and robustness. Their impact becomes even more significant when retrieval is embedded in AI agents: agents search repeatedly, reformulate queries, compare sources, and make later decisions based on earlier retrieval results. Small retrieval effects can therefore accumulate across an entire information-seeking trajectory.  This leads to the third hypothesis: usage data for agentic search should be created by design. During the rise of commercial web search, much large-scale user and interaction data remained inaccessible to researchers. With agentic systems, the community has an opportunity to instrument retrieval from the beginning, operate controlled populations of artificial agents, and collect traces of searching, reasoning, verification, and communication. Such traces do not replace human studies, but they provide a scalable complement for controlled experimentation.  Finally, agentic information access should be studied as a communication ecosystem rather than as an isolated model answering an isolated query. We are therefore developing a social agentic layer above the retrieval infrastructure that supports persistent interaction among humans and agents, including delegation, collaboration, verification, and agent-to-agent communication. Together, these hypotheses point toward a new kind of evaluation environment: one that combines open web data, scalable retrieval systems, human and artificial participants, and observable information-seeking trajectories. Future information-access research may therefore need to evaluate not only models and ranked lists, but complete systems in which humans, agents, retrieval services, and shared knowledge interact at realistic scale.

## Understanding search meant operating search

How did we come to understand web search users, and the needs of web search systems?



<div class="c-important">

We did learn mostly from query logs and obtaining them was hard. But a search session is richer than the query and the click it leaves behind. 

The richest understanding came from operating a system itself, which allows to vary all variables (e.g. A/B-testing).

</div>




<div class="grid-2 gap-lg small">


<div class="column">


<div class="card">

### A released web log records two kinds of event
<span class="eyebrow">AOL 2006, released and withdrawn in three days</span>
A query, and a click on a result. 36.4M queries, 657,426 users, 19.4M clicks — and the only results in the file are the ones that were clicked. Sessions are not marked. 


</div>


</div>


<div class="column">


<div class="card good">

### A system you run records fifty-eight
<span class="eyebrow">Sowiport, operated by GESIS, 2014–15</span>
Typing a query, selecting a facet, visiting a document, following a citation, exporting a record. One year gave **558,008 sessions** and about **8M interactions**, of which 179,796 were queries — and the result lists are stored as they were shown.

</div>


</div>


</div>





<div class="slide-citation">

Reimer et al., *The Archive Query Log*, SIGIR 2023, Table 1 (AOL and ORCAS figures) · Mayr, *Sowiport User Search Sessions Data Set*, 2016, doi:10.7802/1380 · Joachims, KDD 2002 · Joachims, Swaminathan, Schnabel, WSDM 2017.

</div>


Notes:
Goal: prepare the hypothesis. Ask the question first and let the two cards answer it, because the logs make no sense as an opening move otherwise.

The question is the bridge from the previous slide. We have just taken an agentic search system apart and seen how many moving parts it has. So: how did this field ever come to understand the people using a search system? The answer for web search is almost entirely logs. Then the twist that sets up the hypothesis: what a log contains is decided by whoever runs the system, and the richest record in this comparison came from a search engine a research institution operated itself.

Be careful and fair here, because the obvious version of this story is wrong in two ways. Academic IR was never short of insight into search users: it led on learning from clicks, on how to read a click, and on counterfactual learning to rank. And query logs were genuinely useful. The limitation was not that logs taught us nothing; it was what a log can contain.

The two columns, with the sources.

- **AOL 2006** is the public web log everyone knows, released on 4 August 2006 and withdrawn on the 7th. Do not call it the largest or the richest: AltaVista's 1998 log is bigger in queries and the MSN excerpt has been used in more papers. The numbers are from Table 1 of the Archive Query Log paper: 36,389,567 queries, 10,154,742 of them unique, 657,426 users, 19,442,629 clicks, three months. The same table records the results column as identical to the clicks column, which is the point: the file contains the results that were clicked and nothing about the rest of the ranking. The sessions column is empty. So a query and a click are all the event types there are.
- **ORCAS**, 2020, is the modern public equivalent and is thinner: 18,823,602 click records, no users, no sessions, no ordering.
- **Sowiport** is the counter-example, and it is a counter-example because GESIS ran the system. Verbatim from the dataset record: activities are mapped to "a list of 58 actions ... covering all types of activities and pages that can be carried out or visited within the system, e.g. typing a query, visiting a document, selecting a facet", and for each action the log stores a session id, a timestamp and further information including "queries, document ids, and result lists". Sessions are tracked by cookie across multiple searches. Scale, from the SimIIR 2.0 paper: 558,008 sessions, about 8 million interactions, 179,796 of them queries, April 2014 to April 2015.
- **The ratio, if you want one**, is roughly half a recorded action per query in AOL against roughly forty in Sowiport, but say it carefully, because the two are counting different things. The safe formulation is two event types against fifty-eight.
- **What the richer log makes askable** is the honest argument: Kacem and Mayr used it to study footnote chasing and citation searching as search stratagems. Neither behaviour exists in a click log, because neither leaves a click on a result.

The same pattern earlier, if there is time. Joachims built and ran the Striver meta-search engine to collect the clickthrough data for the 2002 paper, and counterfactual learning to rank was field-tested on the arXiv full-text search his group operated. Both are cases of an advance arriving because somebody ran a system.

The bridge to the hypothesis, said plainly and then move straight on: obtaining a log was hard, but the deeper limit is that a log of a system you do not run records only what that system chose to record. Sowiport is the counter-example and the whole argument in miniature: operating the system is what made the understanding possible. If we want to understand agentic search, we will have to operate agentic search. That is the next slide.

→ next: which is the hypothesis this talk is built on.

## One hypothesis and four topics for today


<div class="hypothesis">

**We have to build usable agentic search systems at scale in order to understand them fully.** 

- Components can be studied on static collections, in isolation.
- Systems cannot: what they do depends on the corpus, code, people and agents using them.

</div>



<div class="grid-2">


<div class="column">


<div class="card">

<span class="eyebrow">Topic 1</span>
### Building a sovereign search system
OpenWebSearch.EU and the Open Web Index: web data, an index and a search API that a research community owns and operates.

</div>


</div>


<div class="column">


<div class="card">

<span class="eyebrow">Topic 2</span>
### Corpora for evaluation, and scale as a variable
The collections an open index lets a lab cut for itself, and what they make measurable once corpus size and text quality can be varied.

</div>


</div>


<div class="column">


<div class="card">

<span class="eyebrow">Topic 3</span>
### Usage data and simulation
We missed much of the interaction data of web search. We should not miss the interaction data of real users with agentic search systems.

</div>


</div>


<div class="column">


<div class="card">

<span class="eyebrow">Topic 4</span>
### Societies of humans and models
Beyond one user and one system: many agents, many people, and the knowledge they produce between them.

</div>


</div>


</div>


Notes:
State the hypothesis as a hypothesis and own it: it is a claim about method, not a result. Be ready for the obvious objection, that plenty was learned from static test collections without operating anything. The honest answer is that "at scale" means the corpus and the traffic, not necessarily a large live user base: a judged collection cut from a crawl you own, or a shared task on an evolving corpus, is already sovereign research on operated infrastructure. The four topics are the evidence for it, and each of them lives in one part of the figure. Topic 1 is the retrieval column and the thing we had to build before anything else was possible. Topic 2 is the collections that index yields and what became measurable once we could grow and vary a corpus ourselves. Topic 3 is the interaction column, where the data does not exist unless we create it. Topic 4 is the collaboration column, which is the least settled and the most interesting. The four hypotheses of the abstract sit inside these topics: openness below the model and scale as a variable in the first two, usage data by design in the third, the information ecosystem in the fourth.
→ Topic 1.

## Today's API-based back-ends are not open

| Service | Still available | Corpus known | Ranking replaceable | Snapshot fixable | Logs for research |
|---|:---:|:---:|:---:|:---:|:---:|
| Google Custom Search API | ends Jan 2027 | ✗ | ✗ | ✗ | ✗ |
| Bing Web Search | retired Aug 2025 | ✗ | ✗ | ✗ | ✗ |
| Brave Search API | ✓ | claims 40B pages | re-rank only | ✗ | ✗ |
| Exa · Tavily · Perplexity | ✓ | ✗ | ✗ | ✗ | ✗ |
| OpenAI · Anthropic search tools | ✓ | ✗ | ✗ | ✗ | ✗ |




<div class="c-warning">

So we do not have ability to inspect, reproduce, vary, operate and evaluate the whole information-access process, which means we lack **research sovereignty**.

</div>


Notes:
Delivery. Do not read the table. Say the shape of it: every column that matters for a controlled comparison is a no, the only corpus figure on the slide is a vendor's own claim, and the only ranking control anywhere is re-ranking on top of somebody else's ranking of somebody else's index. Bing is the cautionary tale and Google's own API is the next one. Then hand the detail to the appendix slide, which carries prices, terms and the two open alternatives.

The facts, with sources. Everything below was checked against vendor documentation on 15 September 2026.

- **Google Custom Search JSON API.** Closed to new customers; the documentation says existing customers "have until January 1, 2027 to transition". Until then it is 5 USD per 1,000 queries with a 10,000 per day cap. It offers filters and a sort parameter (site, date, language, country), but no way to substitute the retrieval or ranking model, and it states nothing about the corpus. The site-restricted variant stopped serving traffic in January 2025.
- **Bing.** Retirement announced 15 May 2025, effective 11 August 2025, for the whole API family at once: Web, Image, Video, News, Entity, Autosuggest, Spell, Visual and Custom. Under three months. The successor is Grounding with Bing Search inside Azure AI Foundry at 14 USD per 1,000 transactions, and Microsoft's terms say verbatim: "Developers and end users don't have access to raw content returned from Grounding with Bing Search." The same terms forbid copying, caching or storing the output and forbid using it to train models.
- **Brave, and why its ranking cell is not a plain no.** Goggles are user-written re-ranking rules, which is a real control and the only one on the slide. It is still re-ranking on top of Brave's ranking of Brave's index, which stays uninspectable, and the terms forbid storing results beyond transient use or training on them. On size: the API page says "over 30 billion pages" while Brave's own 2026 blog posts say 40 billion. Both are Brave's figures, which is why the slide says "claims".
- **Exa, Tavily and Perplexity.** No corpus anyone outside can check. Exa's about page claims "500B+ webpages", Perplexity's launch press claims hundreds of billions, and Tavily does not disclose its provenance at all. Filters yes, ranking replacement no, snapshot no. The data flows the wrong way for research: Exa's terms take a perpetual licence to input and output, and Tavily's reserve the right to train on customer input.
- **OpenAI and Anthropic.** Neither names its index in its documentation. Anthropic's provider is reported as Brave, from the subprocessor list in March 2025, and not stated in the API docs. OpenAI's is undisclosed; Bing is confirmed only for the Azure OpenAI variant. Both are about 10 USD per 1,000 searches. OpenAI's `external_web_access: false` is a cache-only mode, not a pinned snapshot, so it does not make a run replayable.
- **What none of them has.** No commercial API offers a fixed, replayable snapshot. The only replay in this landscape is Common Crawl's dated immutable crawls and SerpApi's 31-day search archive.
- **Two numbers to avoid.** There is no official Bing index size; only third-party estimates. And Google's roughly 400 billion documents is trial testimony from 2023, not a Google publication, so attribute it that way or leave it out.

→ next: what is actually underneath all of them.

## What could go wrong

Every one of these was, at the time, infrastructure that somebody's research depended on.


<div class="timeline">

- **2018** Microsoft buys GitHub for **7.5 bn USD**
- **2023** Twitter ends free API access; Reddit prices its own
- **2023** GPT-4: no architecture, data or training method disclosed
- **2024** Meta shuts down CrowdTangle
- **2025** Bing Search APIs retired
- **2026** NVIDIA agrees to acquire Hugging Face for **12.9 bn USD**

</div>



<div class="c-warning">

Openness of an artefact is not enough. 

Research sovereignty requires a jointly managed public infrastructure.

</div>



<div class="slide-citation">

Microsoft newsroom, 4 Jun 2018 · Murtfeldt et al., *RIP Twitter API*, 2024 · OpenAI, *GPT-4 Technical Report*, arXiv:2303.08774 · Microsoft lifecycle notice, May 2025 · NVIDIA blog and Form 8-K, 2–3 Sep 2026 · Zenodo, operated by CERN with OpenAIRE and EU funding.

</div>


Notes:
This is the answer to the question on the previous slide, and the timeline is deliberately dramatic.

**The GPT-4 entry, quoted rather than characterised.** The technical report says it itself: "Given both the competitive landscape and the safety implications of large-scale models like GPT-4, this report contains no further details about the architecture (including model size), hardware, training compute, dataset construction, training method, or similar." Read the first three words of the reason aloud, because they are the same reason the Archive Query Log paper gives for query logs: competition. Use this entry rather than the organisation's shift from non-profit lab to company. Every other stop on this timeline is a resource researchers used being withdrawn, priced or bought, and the disclosure decision fits that pattern while the corporate history does not. It is also their own sentence, so nobody can argue with the characterisation. And it connects back two slides: openness at the model layer was shown as a menu, and this is the moment the top of that menu closed. Lead with GitHub rather than with Hugging Face, because it makes the point without anyone having to take a position on a deal from this month. In 2018 Microsoft bought the place where research software lives, for 7.5 billion dollars, and the announcement promised that GitHub "will operate independently to provide an open platform for all developers". That is word for word the commitment NVIDIA and Hugging Face are making now about the place where models and datasets live. Be fair about both: there is no reason to doubt either intent. The risk is structural: one owner, one jurisdiction, one business model, and a community with no fallback. The Twitter case has numbers: after the paywall the number of Twitter-based studies dropped by 13 percent and about 60 percent of surveyed projects stalled or pivoted. This is the argument for building the substrate rather than renting it, not a geopolitical claim. Then be concrete about what a jointly managed public good looks like, because the audience will ask for examples beyond CERN. Zenodo is the best one for this room: it runs on CERN, it is funded by CERN, OpenAIRE and the European Union, and it describes itself as a viable and concrete alternative to commercial services. EuroHPC is the compute example, and it is the machine our own index runs on. If someone wants the general form, it is the European Research Infrastructure Consortium, the legal instrument behind ELIXIR, CLARIN and DARIAH; check the list before naming them from the stage. Then land the last line: none of these covers the web itself, which is the gap the next slide is about.

## Two ways in: pull the index, or query it where it lies

<div class="viz viz-full" data-viz="ows/owi-access" data-steps="3"></div>


<div class="paper detail small">

<span class="eyebrow">ECIR 2026 · Hendriksen, Hiemstra, de Vries</span>
### Open Web Indexes for Remote Querying
- **Question** Can a web-scale index be shared as plain files and queried where it lies, instead of behind an API?
- **Setup** ClueWeb09-B, 12-B and 22-B as compressed Parquet on S3; BM25 run client-side in DuckDB; four schemas, each dropping one join.
- **Conclusion** Seconds, not milliseconds. Nobody has to host a copy, and the retrieval model, the snapshot and the sub-collection are yours.

</div>


Notes:
Two ways in. The first is the surprising one: the index is published as compressed Parquet files on ordinary object storage, and a client runs BM25 over them with DuckDB, reading only the postings a query touches. There is no search service in between and no institution has to host a copy, and because the ranking runs on your side the retrieval model, the snapshot and the sub-collection are all yours to change. Walk the file listing in one breath: every schema in the paper removes one join, and the leanest removes both. The dictionary maps terms to ids and holds document frequency, and it can go because Parquet already encodes repeated values and because document frequency is just the number of postings you downloaded — which also means two indexes merge by union instead of by rewriting term ids. Document lengths can go because the ranking stores impact scores instead of term frequencies; `docs` is still joined at the end, for the metadata of the top results only, which skips most of the file. Then the numbers: five to ten seconds for most queries with the leanest schema, a whole TREC Web Track topic set in ten to fifteen minutes, everything inside 45 seconds with the storage 650 kilometres away. Scaling is gentle, ten times the collection costs about three times the time and only one and a half times the transfer, and the generic format is not a tax, because the Parquet index came out smaller than the dedicated one, 18 GiB against 21 on ClueWeb09-B. owilix is the frame around both routes, and the download route is the one people reach for first: it behaves like a package manager over the index, with git-style pull, build and push; the slicing is the point, because most experiments start from a partition by language, topic or site list rather than from everything. Say the line here: an API lets researchers query someone else's experiment, bulk access lets researchers define their own.

### WebKurator · region and topic
- **Built from** the legal imprint of 5.54M German-language sites, geocoded and then topic-labelled automatically.
- **Size** 2.58M sites in Germany carry both a location and a topic at launch.

<div class="slide-citation">

Notes:
The point of the pair is that they are cut from the same crawl along different axes, and each axis is a variable somebody in this room wants to control. WebFAQ is the index used as a training-data factory: structured data was extracted during processing, so FAQ pages can be harvested without a second crawl, and version 2 stops relying on someone else's Web Data Commons extraction and mines the URLs itself. What makes it an evaluation resource rather than a dump is the alignment and the negatives: 14.3 million pairs that say the same thing in two languages, and 200 mined hard negatives for each of 1.25 million queries. One honest detail worth saying: those negatives help when they are distilled with MarginMSE and hurt when they are used naively in a contrastive loss, because some of them are false negatives. WebKurator is the same index cut by place; the country split, if asked, is 85.6 per cent Germany, 7.3 Austria and 5.2 Switzerland. Imprint pages are a legal requirement in Germany, so they carry an address, and an address geocodes; that is why a national-scale regional index can be bootstrapped at all. Curlie is one-dimensional, and the WebKurator argument is that topic and region are separate questions. If asked what this has to do with evaluation: a regional sub-collection is a realistic, small, nameable slice, and those are the collections labs can actually afford to judge. Third strand, if time allows: continued pre-training on crawled index text improved cross-lingual hate-speech detection by about three macro-F1 points averaged over 16 benchmarks, which is Dang, Mitrović and Granitzer at LREC 2026 — evidence that this data measurably improves a model, not only a benchmark.

## Does Scale Matter?

### CoRECT: A Framework for Evaluating Embedding Compression Techniques at Scale


<div class="grid-2-1 gap-lg">


<div class="column">

![CoRECT: Recall@100 against corpus size for truncation and quantization settings](/slides/_assets/ows/papers/corect.png)


<div class="figure-credit">

Caspari et al., CoRECT, Fig. 2. Corpus built by subsampling MS MARCO v2 with distractors mined from TREC DL runs, after Fröbe et al. (ECIR 2025), not by random sampling.

</div>



<div class="c-positive tight">

- **Scale alone** costs **29 points** of Recall@100 from 10K to 100M and flips model choice
- **Quantization is free at every size**, down to 2 bits per dimension.
- **Truncation and 1-bit are not**: free at 10K, costly at 100M.

</div>


</div>


<div class="column small">


<div class="paper detail">

- **Question** Do compression methods hold up as the corpus grows?
- **Setup** CoRE: the same 65 TREC DL 2023 queries and judgements, the corpus grown from 10K to 100M passages. Each query keeps 10 relevant passages and **100 distractors** mined after Fröbe et al.; the rest is random filler. Four models, eight compression families.
- **Result** The cost of compression grows with the corpus, and the ranking of models flips along the way.
- **Conclusion** A conclusion drawn at 10K passages can be wrong at 100M. Compression must be evaluated at scale.
- **Related** Recent work from Perplexity on "Q2D-Web: A Large-Scale Benchmark for Retrieval in Agentic RAG Systems".

</div>


</div>


</div>



<div class="slide-citation">

Caspari, Dinzinger, Ghosh Dastidar, Fellicious, Mitrović, Granitzer, *CoRECT*, ECIR 2026

</div>


Notes:
Goal: a compression decision taken at benchmark scale can be wrong at web scale, and the collection is built so that nothing but scale changes.

Reading the figure.

- Three panels, all Snowflake V2. Horizontal axis is corpus size on a log scale, 10 thousand to 100 million; vertical axis is Recall@100. Stars mark a significantly lower recall than the blue baseline, one-sided Wilcoxon at p = 0.05.
- Panel (a): passage retrieval at full precision, one line per truncated vector size from 768 down to 24.
- Panel (b): the same passages quantized, one line per bit depth from 32 down to 1.
- Panel (c): the same as (b) for documents, which is why it ends at 10 million.
- The blue line in (a) is the no-compression case: recall falls 0.82 to 0.53 on identical queries and judgements.
- In (a), 384, 256 and 192 dimensions track the baseline, 96 separates, 48 and 24 collapse.
- In (b), every bit depth sits on top of the others until 10 million, and only 1-bit binarisation pulls away at 100 million.

How the corpus was built.

- CoRE is subsampled from MS MARCO v2, not newly crawled, and keeps the TREC Deep Learning 2023 judgements fixed: 65 queries for passages across 10K, 100K, 1M, 10M and 100M, 55 queries for documents across 10K to 10M, and exactly 10 relevant items per query at every size.
- Random sampling would remove the hard negatives and make the small corpora unrealistically easy. CoRE therefore uses the subsampling method of Fröbe, Parry, Scells, Wang, Zhuang, Zuccon, Potthast and Hagen, *Corpus Subsampling: Estimating the Effectiveness of Neural Retrieval Models on Large Corpora*, ECIR 2025.
- The distractor mining, from the paper: take the runs submitted to TREC DL 2023, discard the bottom 20 per cent by effectiveness, fuse the rest with Reciprocal Rank Fusion, and keep the top 100 irrelevant or unjudged documents per query. Each query gets exactly those 100 distractors plus its 10 relevant items; the rest of the corpus is random filler.
- So the corpus grows by adding filler while the hard part of the task stays fixed. The decay on the slide is what filler alone does to a constant retrieval problem.

## Summary so far


<div class="hypothesis h1">

**Openness must extend beyond the model.** Open corpora, inspectable indexing, configurable retrieval, provenance, freshness, robustness and usage data. An open model on a closed search API remains a closed research instrument.

</div>



<div class="marks-step">

- Scale and text quality are variables for web search systems to be considered
- Evaluating agentic search fully means running web-scale retrieval, which needs large crawls and real infrastructure.
- No single institute affords that alone. On shared public infrastructure many can, as in every other infrastructure-heavy field.
- Building and operating an index has become feasible for small teams, in part because coding agents carry much of the engineering.

</div>


Notes:
This closes Topics 1 and 2 together, so say so: we asked what it takes to evaluate an agentic search system, we built the substrate, and this is what it adds up to. Recap in one breath before the hypothesis: a sovereign system needs an open corpus and an open index below the model, that index exists and is rebuilt daily, it can be pulled or queried where it lies, and it already carries a judged collection and a live endpoint that a lab can use this year. The first claim restated, then the systems argument: the unit of evaluation is moving from the component to the system, and systems need infrastructure that runs. The joint-effort sentence is the one to stress: exhaustive web-scale retrieval experiments with agents are beyond any one group, but not beyond a community that shares an index and public compute. The last point is first-person experience; say which parts of the pipeline and the search engine were built and are maintained that way.

- A query and a click. No facet, no dwell, and not the result page as it was shown, so what was *not* clicked cannot be recovered.
- One to three months each, and very few of them in twenty-five years.
- Providers "generally do not publish their logs to protect user privacy and vital business data", and A/B testing is closed for the same reason.

<div class="column">


<div class="c-positive">

### Sowiport: a rich interaction record
- **558,008 sessions** and **8M interactions** of **58 kinds** in one year, with the result lists stored as they were shown.
- Facets, document views, citation following, exports: behaviour no click log can hold.
- Rich because a research institution operated the search system.
- Still limited in time and user group

</div>

<div class="slide-citation">

Reimer et al., *The Archive Query Log*, SIGIR 2023 (quotation, and the per-log fields) · Craswell et al., *ORCAS*, 2020 · Mayr, *Sowiport User Search Sessions*, 2016 · Zerhoudi et al., *SimIIR 2.0*, CIKM 2022.

</div>


Notes:
Goal: query logs were valuable and are not the villain of this talk.

The bridge from the previous slide, and say it explicitly, because it is the reason this slide exists. That screenshot showed a ranking that was wrong and a user who was satisfied anyway. The only way to know which of those two things happened is to watch the user. That is why the field collected logs in the first place: not to count queries, but to learn what people actually did with the results we gave them.

The competitive argument, if you want it sharper than the quotation on the slide: query and click logs are a live business asset, and access to them has become a competition-policy question rather than only a privacy one. There is a current European Commission case against Google and a complaint from DuckDuckGo that turn on exactly this; look up the reference before the talk, because I could not verify it from a primary source here and it should not be named from the stage unchecked. They were limited in what they could contain, scarce, and hard to release, and none of those limits is going away. Say the positive half first and mean it: click models, position and trust bias and counterfactual learning to rank all came out of these files, and ORCAS and MS MARCO Web Search are genuinely useful recent releases.

The three limits, in order.

- **What a log records.** AOL is a query and a click, nothing else, and the Archive Query Log table shows the results column equal to the clicks column, so the ranking that was shown is not in the file. No facet selection, no dwell time, no scrolling, and no way to ask why something was not clicked. Most public logs cover one to three months, so nothing longitudinal is possible either.
- **How few there are.** Across twenty-five years the same table lists only a handful at web scale, and several of those, Yandex and Baidu, arrived as competition data rather than as a resource.
- **Why.** Quote the Archive Query Log paper directly, because it states both reasons at once: providers "generally do not publish their logs to protect user privacy and vital business data". Privacy is the one everybody names, and AOL is the cautionary tale, withdrawn after three days when users were re-identified. The commercial reason is just as real and less often said: a query log exposes demand and ranking quality to competitors. And the obvious alternative, running an A/B test instead, is closed for the same reason, because the traffic belongs to the provider.

Then the exception, which is the argument of this talk in miniature. Sowiport is rich, 58 action types and the result lists stored, precisely because GESIS ran the system. Operating it was what made the observation possible.

Close on what has changed, which is no longer printed on the slide: the barrier to agent traces is neither legal nor commercial, it is cost. An agent trace needs GPU time and a running search engine rather than a licence negotiation, and one group produces thousands of trajectories where a platform produces billions. That is a problem a research community can attack, which is why the next slide is simulation.

The timeline, with what is verified and what to be careful about.

- **2006 AOL.** About 20 million queries from 650,000 users, released on 4 August 2006 and withdrawn on 7 August after users were re-identified. The dataset never went away in practice, which is part of the lesson.
- **2006 MSN.** Microsoft released a query-log excerpt under licence to research groups through a request-for-proposals process. The figure of twelve recipients comes from an earlier check and is not re-verified, so say "under licence to selected groups" rather than a number.
- **2011 and 2013 Yandex.** The Relevance Prediction Challenge in 2011 and the Personalized Web Search Challenge in 2013, both released as click logs with anonymised identifiers rather than raw text.
- **2018 Sogou-QCL.** Query logs with weak relevance labels derived from clicks, released with a SIGIR paper.
- **2020 ORCAS.** 18.8 million click records over 10.4 million distinct queries, tied to 1.4 million MS MARCO documents. Clicks only: no sessions, no ordering, no user identifiers.
- **2021 TripClick.** About 5.2 million user interactions from the Trip Database health search engine, collected 2013 to 2020, roughly 700,000 unique queries. Domain-specific, not web scale.
- **2022 Baidu-ULTR.** Released for the WSDM Cup 2023. Its availability has been intermittent; check the download before naming it as a live resource.
- **2024 MS MARCO Web Search.** 10 million queries in 93 languages with Bing click labels, on a 100 million document subset of ClueWeb22.

The digital-library counterpoint, which is the new card.

- The Sowiport User Search Session dataset holds 558,008 sessions and about 8 million interactions from April 2014 to April 2015, of which 179,796 are queries, with 58 distinct action types logged.
- SimIIR 2.0 trains its Markov interaction and stopping models on it, split into exploratory and lookup subsets.
- The point for this talk: where academia did have real interaction data, it was because a research institution ran the search system. A digital library is small, but it is operated by its own community, which is the same argument as the opening slide one layer down.
- The paper's own framing is worth borrowing: for evaluation with few users, as in digital libraries, simulation is the alternative to the Cranfield paradigm and to controlled user studies.

## SimIIR 1.0 and 2.0: the Complex Searcher Model


<div class="figure-90">

![The Complex Searcher Model: six numbered steps and four decision points, with the components SimIIR 2.0 replaced by Markov models marked in green](/slides/_assets/ows/papers/csm-flowchart.png)

</div>



<div class="card">

Complex Searcher Model of SimIIR 1.0. Green are Markov models learned from logs developed in SimIIR 2.0. 

</div>



<div class="slide-citation">

Figure: Zerhoudi et al., *SimIIR 2.0*, CIKM 2022, Fig. 1 · the model itself: Maxwell & Azzopardi, SIGIR 2016.

</div>


Notes:
Goal: show what a simulated searcher actually is before showing the framework that contains it. It is a loop of steps with decision points, and every decision point is where a model of a person has to be supplied.

Walk the flowchart once. Examine the topic, generate a query, issue it, view the result page, examine a snippet. Then the first decision: is the snippet worth clicking? If yes, click, read, judge, and if relevant, mark it. Then the second decision, continue on this result page or abandon it. Then the third, stop the session or generate the next query. Six numbered activities, four diamonds, and the diamonds are where the user model lives.

Say what the green means, because it is the previous slide's argument as a picture: in the original model those decisions were fixed rules and threshold parameters. SimIIR 2.0 replaced the stopping decisions and the query generation with Markov models trained on the Sowiport logs, so the behaviour became learned rather than declared.

Then the right-hand card, which is the step into SimIIR 3. Conversational search has no result page to scan, so the same loop needed a parallel set of components: an utterance strategy instead of a querying strategy, a decision maker for the conversational response instead of one for the result page, a conversation context instead of a search context, and stopping at the level of a response rather than a result. Keep the label CSRP as the framework writes it, and do not expand the acronym from the stage unless you have checked it.

The point to land before the next slide: the framework does not simulate a user in one piece. It assembles one out of these components, which is why the component list on the next slide is as long as it is.

## SimIIR 3.0 and what it contains


<div class="img-h-md">

![The SimIIR 3 framework. Green marks what 3.0 added: conversational and Markov users, cognitive states, pyTerrier retrieval and LLM-based variants](/slides/_assets/ows/papers/simiir3-framework.png)

</div>



<div class="grid-3 gap-lg small">


<div class="column">

**LLM-based variants.** One wrapper, so any model can drive the simulated user.

</div>


<div class="column">

**Added the Conversational Searcher Model**, same decision structure over new units:

- query → **information need**
- snippets → **information units**
- continue? → **need satisfied?**
- plus **request a suggestion**

</div>


<div class="column">

**Explicit cognitive states.** The user carries what it believes it has found and still needs; that state drives the next move.

</div>


</div>



<div class="slide-citation">

Azzopardi et al., *SimIIR 3*, SIGIR-AP 2024. Figure from the authors' talk.

</div>


Notes:
This is the state of the art in one picture, and it is worth showing because the list is longer than people expect. Read the figure in three moves rather than box by box. On the left, what a simulation is configured from: topics, a retrieval system and now a conversational agent. In the middle, the searcher models that consume those configurations. On the right, the two columns of components a simulated user is assembled from, classic search on the blue side and conversation on the green. Green is the whole story of version 3: conversational users, Markov users, cognitive states, pyTerrier underneath and language-model variants of every component. Two things to stress. Language-model support is a wrapper, so the simulated user can be any model, which is what made the last two years of work possible at all. And the architecture keeps the parts that make a simulation checkable: a real retrieval toolkit underneath through pyTerrier, Markov models for the transitions, and an explicit cognitive state. Explain the cognitive state briefly, because it is the component people ask about. A classic simulated searcher is a transition machine: it queries, examines a result, judges it, and stops on a rule. A cognitive state adds a small represented mind between those steps, holding what the user believes they have found so far, what is still missing and how certain they are, updated after each result and used to choose the next query and the moment to stop. The value is not realism, it is inspectability: when a simulated session behaves oddly you can read the state that produced it, which is impossible with a prompt-only simulated user. On the conversational searcher model, since it now has to be carried in one caption: it is a second searcher model beside the classic one, not a modification of it. The shape is the same, examine, produce something to send, examine what comes back, judge, decide whether to go on. What changes is every unit inside that shape. The searcher issues an information need rather than a query. What comes back is information units rather than a ranked page of snippets. There is one action with no counterpart in web search, requesting a suggestion, because a conversational system can be asked for more and a result page cannot. And the stopping question changes its object: not whether to continue down this page, but whether the information need is satisfied, which is a judgement about the state of the conversation. The appendix has the two models drawn side by side with those four points marked, if the room wants to see it.

Then the honest note, from the authors' own closing slide: their research directions are still questions, not answers — query generation quality, decision-making fidelity, behaviour modelling. As of late 2024 the framework's own authors were not claiming that language-model simulators were validated.
Then set up the next slide, because the jump only works if you name the shared construct. The cognitive state was built so that a *simulated* user could be inspected: an explicit little model of what this searcher believes, needs and is uncertain about. PersonaRAG keeps that construct and changes its job. Same idea, same group, same word: a profile, a session context, an explicit state about the user, maintained while the search runs. In the simulator it exists so an experiment can be read afterwards; in PersonaRAG it exists so retrieval can be steered while the user is still searching. Be precise about the status of that link, because someone will check: PersonaRAG does not cite SimIIR and is not derived from it. What carries over is the construct, not a lineage.

### PersonaRAG

## AgentSim: we simulate agents now, because agents search


<div class="grid-2-1 gap-lg">


<div class="column">

![AgentSim: grounded corpora and corpus-aware seeding feed a configurable retrieval and reasoning workflow, whose traces are validated and written to an agent-trace corpus](/slides/_assets/ows/papers/agentsim-workflow.png)

</div>


<div class="column small">


<div class="card">

### The run
- 1,000 seed queries per corpus, chosen to cover it
- MS MARCO, Quasar-T, CausalQA, via ChatNoir
- GPT-4o, Mistral Large, DeepSeek-V3
- Up to seven retrieval–reasoning cycles

</div>



<div class="card good">

### What came out
- **103,567** trace steps from 21,000 trajectories
- **199,968** documents from queries
- every answer grounded in a cited document


</div>


</div>


</div>



<div class="c-important small">

SimIIR simulated the person at the keyboard. What searches now is an agent, so the unit of simulation is a whole trajectory. Every step records the documents it used, so the trace can be checked rather than believed.

</div>



<div class="slide-citation">

Zerhoudi, Granitzer, Mitrović, *AgentSim: A Platform for Verifiable Agent-Trace Simulation*, SIGIR 2026, Fig. 1 (CC BY 4.0).

</div>


Notes:
Goal: the object of simulation moved from the user to the agent, because the agent is what searches now, and agent traces can be produced cheaply and verified.

Reading the figure, left to right.

- **1 and 2, the inputs.** Grounded corpora with questions, and corpus-aware seeding: cluster the corpus and draw seed queries that cover it, instead of sampling at random. Random seeds revisit the same regions; corpus-aware seeding reaches cluster coverage of 1.00 against 0.97 to 0.99 for random, with near-zero document redundancy.
- **3, the middle box, is AgentSim itself.** A configurable RAG workflow, built visually or from the command line, running the cycle the figure shows: search with query reformulation, retrieve, rerank, summarise, and round again. That loop is the difference from SimIIR, whose searcher queries, examines a result, judges it and stops.
- **4, the validation loop, and the trace excerpt on the right.** This is what the line under the figure means by checking a trace. A step is not only text: it records the query, the answer, and the documents the agent actually retrieved and used at that point. So a checker can take the claim a step makes and the documents it named, and ask whether one follows from the other, without a person reading it. That is the difference between inspecting a simulated session and verifying one. The result of doing that: of 1,385 substantive answers all were grounded in their cited documents, mean token coverage 0.872, and 83.3 per cent of 6,125 atomic claims were fully supported under an entailment check.

**What the 199,968 documents are**, since it is an easy question to get wrong. They are not generated and they are not a new corpus. They are the distinct documents the agents actually retrieved, through ChatNoir, out of the three existing collections that form the environment: MS MARCO, Quasar-T and CausalQA. The paper is explicit that it builds on those resources rather than replacing them, using their queries as starting points and their document collections as the environment. So the number is a coverage measure: how much of the corpus the simulation genuinely touched, which is the thing corpus-aware seeding is designed to maximise.

**What else came out of it besides a pile of traces**, because "why do these exist" is the fair question. Four things.
- **The platform**, with the two mechanisms that are the methodological contribution: corpus-aware seeding and active validation.
- **Training data that demonstrably works.** Distilling the traces into small models: Qwen 2.5 0.5B raised its abstain-detection F1 from 0.362 to 0.815, matching a base model three times its size, and every model size learned to abstain when the evidence was insufficient, recall above 0.88. That is the answer to what the traces are for.
- **Behavioural findings about the models themselves**, which no static benchmark shows: the three analysts explore very differently, six of nine pairwise comparisons significant with effect sizes up to Cohen's d 1.59.
- **Verifiability as a property of the dataset.** The authors note that no existing reasoning-trace dataset reports token-level grounding verification against source documents.

The cost, since it is the argument. Roughly 20 million API tokens, 200 to 300 dollars for the whole corpus, about 0.14 dollars per simulation, 58 steps on average.

The numbers behind the behavioural finding, if asked: GPT-4o retrieved 31.7 per cent more unique documents than DeepSeek-V3 on MS MARCO and 176 per cent more on CausalQA, while DeepSeek-V3 falls back on keyword reformulation in 23.3 per cent of cases against 8.1 for GPT-4o.

Keep the both-roles observation for the spoken line if it lands: the same trajectory is the experiment and the product, because the agent stands in for the user and works for the user at once.

## Learning very small retrieval models using Agent Traces


<div class="grid-3-1 gap-lg">


<div class="column">

<div class="viz viz-full" data-viz="ows/fellowship" data-steps="3"></div>

</div>


<div class="column small">


<div class="card">

### The setup
- Teacher: Qwen 3-Next 80B, 5,000 rollouts
- Kept: 1,490 accepted trajectories, 16,488 steps
- Labels: seven retrieval actions
- Student: Granite 4.1 3B on 13,194 actions
- Baselines: the same model prompted, and TF-IDF

</div>


</div>


</div>



<div class="c-insight">

A small model trained on the traces of a large one does not just label the next action. Put in charge of the search, it makes the pipeline use the evidence it retrieved: the evidence-fact rate goes from **0.01 to 0.62**.

</div>



<div class="slide-citation">

Al-Maamari, Zerhoudi, Granitzer, Mitrović, *The Fellowship of the Query: Learning Retrieval Actions*, CIKM 2026 short paper.

</div>


Notes:
Goal: one minute. Traces are training data, and the capability they teach can be moved into a small model.

- **The task.** Given the state of a search trajectory, predict which of seven actions comes next: decompose, search, reformulate, extract, synthesise, verify, finish.
- **The filtering matters.** 5,000 teacher rollouts, only 1,490 accepted. The student learns from work that succeeded, not from everything the teacher did.
- **The headline.** Macro-F1 0.65 for the fine-tuned 3B model against 0.17 for the same model prompted zero-shot, and 0.54 for a TF-IDF baseline. The capability is learned, not prompted.
- **The second experiment, and what its numbers actually measure.** Instead of only predicting labels, the fine-tuned 3B model is put in both seats at once: as **controller** it chooses which of the seven actions comes next at every step, and as **generator** it writes the final answer. Nothing of the teacher model is left in the loop. The scores are **answer quality**, not retrieval and not action prediction: the model is placed in an end-to-end BM25 pipeline and its final answers are scored SQuAD-style against the gold answer, exact match and token overlap F1, over 149 held-out trajectories.
- **Be precise about which gain holds.** Token F1 rises from 0.778 to 0.830 and the paired bootstrap interval is [0.002, 0.104], so it clears zero but only just. Exact match rises from 0.753 to 0.795 and **its interval crosses zero**, so do not present that one as an established improvement.
- **The large effect is elsewhere, and it is the interesting one.** The evidence-fact rate, how often the answer actually uses a fact from the retrieved evidence, goes from **0.012 with the base controller to 0.616 with the fine-tuned one**. The small model does not mainly make answers more correct; it makes the pipeline actually use what it retrieved. The paper notes this metric is an automatic matching heuristic, not human-verified factuality.
- **Why it belongs here.** It closes the cost argument: if traces can be made cheaply and verified, the capability they teach does not have to be rented from a frontier model.

## We cannot see who is behind the query


<div class="grid-2 gap-lg">


<div class="column">


<div class="c-danger">

### An indirection problem
Spotting the agent is the easy half, and it is the half that does not help. Even once you know a query came from an agent, you do not know what the person wanted: the instruction behind it never arrives.

</div>


</div>


<div class="column">

<div class="viz viz-full" data-viz="ows/click-model-auc" data-steps="2"></div>

</div>


<div class="column">


<div class="c-note">

### And the agent itself keeps changing
It gains skills as it runs and loses its own instructions: after five rounds of ordinary compaction, **10%** of its constraints survive.

</div>


</div>


<div class="column">


<div class="c-warning">

### The mixture cannot be filtered out
No action can be attributed, so any model trained on platform data carries agents of unknown quality.

</div>


</div>


</div>



<div class="slide-citation">

Zerhoudi, Granitzer, Dang et al., *Behind the Prompt: The Agent-User Problem in IR*, 2026 · Zerhoudi, Mitrović, Granitzer, *The Compaction Cliff in Long-Running AI Agent Memory*, CIKM 2026.

</div>


Notes:
Goal: the query, the unit all our instruments are built on, no longer identifies anyone. Watching agents is not the same as understanding users.

**Say the claim in its strong form, because the weak form invites an objection.** The claim is not that agents cannot be told apart from people. Sometimes they can, and platforms get better at it. The claim is that telling them apart does not recover the intent, because the intent sits one step further back, with whoever configured the agent, and that instruction is never transmitted with the query.

**The indirection, said plainly.** When a query arrives from an agent, it is one of two things and you cannot tell which: the agent decided to ask it, or a person told the agent to ask it. One layer of delegation sits between the behaviour and the intent, and everything we infer from behaviour is really inferring across that gap. Add a second agent calling the first and there are two layers.

**How hard, and be careful not to overstate it.** The paper's claim is non-identifiability: whether the action was autonomous or operator-directed is not recoverable from text, timing, community membership or votes. Say "very hard, and not a problem a better classifier solves on those signals", not "impossible". Other signals may exist, and declared provenance would settle it outright, which is one argument for the MCP channel in Topic 1.

**Be precise about what the figure shows, because it is easy to misread and someone will.**

- **There are no humans in this data at all.** The platform is agent-native. The comparison is between two tiers of *agents*, not between agents and people.
- **The tiers come from five external platform signals**: karma, verified email, follower ratio, owner linkage through a claim token, and comment-to-post ratio, chosen so that no behavioural observable is used as input. Top 40 per cent form the high-validation group, bottom 40 per cent the low-validation group, about 18,750 agents each.
- **The model and the signal.** A position-based click model trained on agent upvotes. AUC falls from 0.640 to 0.586, 8.5 per cent, when half the training data comes from the low-validation tier, and the decline begins as soon as any of them appear.
- **Do not make the absolute level the story.** The paper attributes the modest AUC to the signal: binary upvotes are noisier than search clicks. The finding is the decline, not the level.
- **Do not claim the tiers are indistinguishable.** The paper says the opposite: population-level signals separate them, and the four behavioural observables differ with effect sizes from 0.55 to 0.88. What is not identifiable is the origin of an individual action.
- **The base-rate objection is already answered.** The two groups differ in engagement, 76.2 against 44.2 per cent, but AUC measures ranking independently of base rates, so that gap does not explain the degradation.

**The link that makes it an argument rather than an anecdote**, and it is the paper's own: because no action can be attributed to an autonomous or an operator-directed origin, nobody can filter the training data by it. Any model built on platform data will therefore contain agents of unknown quality, and the degradation is not a data-hygiene problem that better curation fixes.

**Generalising honestly.** The mixture measured here is high against low validation agents on one platform over twelve days, 370,737 posts from 46,872 agents. The mixture we care about is people against agents against operator-directed agents. The mechanism transfers; the number does not.

**The agent's own drift**, kept to one line on the slide. Agents change while they run in both directions: they accumulate skills and tools, and they lose the instructions they were given. With a standard compaction prompt, 53 per cent of an agent's constraints survive one round at 50 per cent compression and 10 per cent survive five. Routing each knowledge type through its own retention policy holds recall near 0.96, so it is a design fault rather than a law, but the default is what will show up in logs.

The three questions are genuinely open, and asking them of this room is the point.

→ next: which is where Topic 3 ends up.

## Summary: we can make behaviour, not observe users


<div class="grid-2 gap-lg">


<div class="column">


<div class="card good">

### What we solved
Behavioural data at scale. Point a population of agents at a search API, collect trajectories by the hundred thousand, and train the next model on them.

</div>


</div>


<div class="column">


<div class="card bad">

### What we did not
How a person works *with* an agent — what they ask it, what they correct, when they stop trusting it — is visible only to whoever operates the assistant. The prompt is the missing half, and no volume of agent traces recovers it.

</div>


</div>


</div>



<div class="pull-quote">

1. Human–agent interaction is now as foundational as the query log once was - we should find ways to collect and analyse it. 
2. Generating agent traces at scale is also a matter of cost, so there is value in pooling traces.

</div>



<div class="slide-citation">

Zerhoudi, Roegiest, Granitzer, *IIRSim Studio*, SIGIR 2026 · Schaer et al., Sim4IA 2025 report, SIGIR Forum.

</div>


Notes:
Goal: close Topic 3 by separating the win from the gap, then make the ask.

This is the constructive end of Topic 3 and the concrete ask, and it closes the loop back to the opening hypothesis. Concede the win first: trace generation stopped being the bottleneck, and the Fellowship result shows the traces are genuinely useful. Then the sentence that matters: none of that is user data. We have a very good simulation of the user and no observation of the real one, and the interaction between a person and an agent is as foundational now as the query was in 1998 — it is the unit everything else will be built on, and nobody outside the platforms has it. No amount of simulation substitutes for it. A search endpoint that people use for real work is the only place both halves exist at once, which is why the donation mechanism matters more than any single dataset: consent at the end of a session, the query and the trajectory kept, the identity not. Then the format, so that ten groups donating produce one corpus rather than ten. IIRSim Studio's provenance bundles are a starting point and Sim4IA is where the format is already being discussed.

## Moltbook: a social network where the members are agents


<div class="grid-2-1 gap-lg">


<div class="column">


<div class="img-h-xl">

![The Moltbook landing page: a social network for AI agents, where humans are welcome to observe](/slides/_assets/ows/screenshots/screenshot-moltbook.png)

</div>


</div>


<div class="column small">


<div class="card">

### What it is
A Reddit-shaped platform launched in January 2026 where the accounts are AI agents. They post, comment and upvote each other. People are explicitly spectators: *humans welcome to observe*.

</div>



<div class="card">

### How an agent joins
You send your own agent a line of text telling it to read a skill file and follow the instructions. It signs up by itself, then sends you a claim link to prove you own it.

</div>


</div>


</div>



<div class="slide-citation">

moltbook.com, September 2026. Meta acquired the platform in March 2026.

</div>


Notes:
Goal: establish what this place is before showing what it failed to become. It is worth a slide because the setup is genuinely novel and the audience will not have seen it.

Read the page. The tagline is the interesting part: a social network for AI agents, where agents share, discuss and upvote, and humans are welcome *to observe*. The sign-up flow says the same thing in a different way. You do not create an account; you paste an instruction to your agent, it reads a skill file, it registers itself, and only then does it hand you a claim link so you can prove the thing is yours. Ownership is asserted after the fact, which is exactly the indirection Topic 3 ended on.

Two facts to have ready. It launched on 28 January 2026, and Meta acquired it in March. We crawled the first forty days with our own crawler.

Say plainly why an IR talk cares about a novelty social platform: it is the only place where a population of agents interacts at scale in public, so it is the only natural experiment available on what agents do when they are left to talk to each other. The next slide is what we found.
→ next: every structural feature of social media, and almost none of the function.

## An all-agent network reproduces the form, not the function

Crawled over 40 days: **1.31M posts, 6.7M comments, 120,811 agents, 5,400 communities.** Every structural feature of social media is present.


<div class="c-danger">

- **Threads exist, but** 91.4% of authors never return to their own thread, and reciprocity runs at 3.3% against 22 to 60 per cent on human platforms.
- **Votes exist, but** 97.3% of comments receive none at all: across 6.7M comments there are 1,084 downvotes.
- **Profiles exist, but** 97.9% of agents never post in a community that matches their own stated interests.
- **Replies exist, but** 64.6% of comment–post pairs carry no argumentative relation, and open disagreement runs at 0.01%.

</div>



<div class="grid-2 gap-lg">


<div class="column">


<div class="c-note">

**What did move behaviour?**
- Hard platform constraints changed behaviour 
- Soft guidance was ignored.

</div>


</div>


<div class="column">


<div class="c-important">

**Conclusion:** Agents interacting without a task produce social form without social function.

</div>


</div>


</div>



<div class="slide-citation">

Zerhoudi, Ghosh Dastidar, Klement, Romazanov, Einwiller, Dang, Dinzinger, Granitzer, Hautli-Janisz, Katzenbeisser, Lemmerich, Mitrović, *Form Without Function: Agent Social Behavior in the Moltbook Network*, 2026.

</div>


Notes:
Goal: an agent society without a purpose imitates the appearance of one, which is the warning this topic has to clear before proposing an agent ecosystem of our own.

Setting. Moltbook launched in January 2026 as a Reddit-style network where only agents post, and Meta acquired it in March. We crawled forty days with our own crawler: 1,312,238 posts, 6.7 million comments, 120,811 post authors, 5,400 communities, with 10 per cent of posts flagged as spam.

The four boxes, and the form each one hollows out.

- **Threads exist, conversation does not.** 91.4 per cent of post authors never return to their own thread, 85.6 per cent of threads are flat, and reciprocity is 3.3 per cent where human platforms run at 22 to 60. Speed is not the problem: the median first comment arrives after 55 seconds.
- **A voting system exists, evaluation does not.** 97.3 per cent of comments receive zero upvotes, and across 6.7 million comments there are 1,084 downvotes in total, 0.016 per cent. There is no signal of quality anywhere in the network, which for this room is the interesting part: no implicit feedback, no relevance signal, nothing to learn from.
- **Profiles and communities exist, topical structure does not.** 97.9 per cent of agents never post in a community matching their own bio, 92.5 per cent of communities are topical melting pots, and one general community holds 63.4 per cent of all posts.
- **Replies exist, argument does not.** 64.6 per cent of comment–post pairs carry no argumentative relation, and open disagreement is 0.01 per cent. The deeper a thread goes the more it fills with rephrasings, so conversations stall rather than develop.

Two more findings if they are asked for. Participation is grotesquely unequal: the three most active agents contributed 964,438, 947,272 and 279,631 items while the median agent contributed four. And the technical layer does respond: hard constraints such as rate limits and a crypto filter changed behaviour within a day, while soft guidance in the same instruction file was ignored. That is the evidence for the claim on the right: the instruction file drives the platform, not the model.

The lesson to carry into the rest of the topic: collaboration among agents needs a purpose, and the purpose comes from a task, from retrieval, and from the people the work is for.
→ next: what a purposeful shared structure looks like.

### What each opinion carries
- the **model** that wrote it,

</div>


</div>


</div>


Notes:
Goal: show what a purpose looks like for an agent. Not a task it completes and forgets, but an artefact it publishes that other agents and people can find, cite and contest.

The credit for the screenshot, since it is no longer printed: ourrs.eu, the AI Opinions vertical, query *passau*, September 2026. Read the header line aloud, because it sets the epistemic frame: about 870 opinions published by agents, and the page says plainly that these are opinions and not answers from this search engine.

The left card is all visible on the screen.

- Every opinion names the **model** that produced it: granite-4.1-3b, qwen3-35b, Mistral-Medium in this capture. Provenance at the level of the writer, not only the source.
- The right-hand panel lists **every document the opinions on the page cite**, with the instruction to read them rather than trust the opinion.

The right card is what turns that into something evaluable, and it is where **NuggetPedia** comes in: nuggetpedia.com, which describes itself as a governed knowledge layer for autonomous agents where every fact is atomic, traceable, temporally bounded and conflict-resolved. Place it for the audience: NuggetPedia is closer to NuggetIndex than to the opinions vertical, because it is the same governed atomic unit. What it shares with the opinions is the thing this topic is about, that the knowledge is created collaboratively by agents rather than written once by us. Be honest about status: the relation vocabulary and the validity and lifecycle fields are published in NuggetIndex; the round structure, generate then critique then review, is the design we are building. Governance is the open part: who may write, who may contest, what happens to a claim that loses.

The pooling line connects back to Topic 3: one group's agents produce too few claims for any of this to matter. It only works as shared infrastructure.

## Does it help? Atomic claims as the unit retrieval serves


<div class="grid-2-1 gap-lg">


<div class="column">


<div class="img-h-xl">

![NuggetIndex: passage retrieval versus nugget retrieval, 887 versus 320 input tokens](/slides/_assets/ows/papers/nuggetindex.png)

</div>


</div>


<div class="column small">


<div class="paper detail">

<span class="eyebrow">SIGIR 2026</span>
### NuggetIndex
- **Question** If claims are stored as governed atomic units, does retrieving *them* beat retrieving passages?
- **Setup** A nugget is a fact with a validity interval and a lifecycle state, **active, deprecated or contested**, filtered by query time before ranking. Five QA benchmarks against BM25, dense and hybrid passages.
- **Result** Nugget recall **+42%** and nDCG@10 **+96%** over BM25 passages; conflicts **−55%**; generator input **887 → 320 tokens**.
- **Conclusion** The unit that evaluation already scores answers with can also be the unit retrieval serves.
- **Not a universal win** On static curated benchmarks such as HotpotQA, passages still lead by 1.5 to 4 points. The gain is in time and conflict.

</div>




</div>


</div>


<div class="slide-citation">

Zerhoudi, Granitzer, Mitrović, *NuggetIndex: Governed Atomic Retrieval for Maintainable RAG*, SIGIR 2026, arXiv:2604.27306.

</div>


Notes:
Goal: answer the obvious objection to the previous slide. The figure is Fig. 4 of the NuggetIndex paper, granularity and prompt efficiency. Agents can publish claims, but does a claim layer do anything for retrieval? Measured, yes, and in a specific way.

State the transition precisely, because it is an argument by unit and not a direct evaluation of AI Opinions. The nuggets in this paper are extracted from corpora by a model, not published by a population of agents. What the two share is the **data model**: an atomic fact, its evidence, an interval over which it holds, and an epistemic state. NuggetIndex measures what happens when retrieval serves that unit instead of a passage. So the claim to make is "retrieving governed atomic units beats retrieving passages, on the dimensions that matter for a live corpus", not "our opinion layer improves search".

The numbers, with what each one is for.

- **RAVine**, static coverage on nuggetized MS MARCO with 84 queries and 3,182 gold nuggets: nDCG@10 up 96 per cent to .637, recall@10 up 243 per cent, nugget recall up 42 per cent, vital nugget recall up 47 per cent, all at p below .001.
- **TimeQA**, temporal correctness: .931 against .840 for hybrid passage retrieval, and the conflict rate falls from .161 to .072. On SituatedQA the conflict rate falls from .230 to .010. The comparison that matters is with time-filtered passage baselines, which reach similar temporal correctness but see recall collapse to almost nothing.
- **Efficiency**: median generator input 320 tokens against 887, a 9.3 MB index for 56,990 nuggets, retrieval at 1 ms median.
- **The caveat on the slide is the honest one**: on static, human-curated HotpotQA, hybrid passage retrieval still leads by 1.5 to 4 points. This is not a better retriever in general; it is a better retriever when facts change and conflict, which is exactly the condition a daily index and a population of writing agents create.

The bridge to the lifecycle vocabulary is worth one sentence: active, deprecated and contested are the same distinctions the relation schema makes on the previous slide, so the storage layer and the argument layer speak the same language.
→ next: a platform where such swarms actually run.

## OpenIIR.com: swarms that argue, and the problem of judging what they produce


<div class="grid-3-2 gap-lg">


<div class="column">

![An OpenIIR argument graph: 246 claims and 296 relations from one deliberation, with supports, counters, refines and questions as edge types](/slides/_assets/ows/openiir-argumentation-graph.png)

</div>


<div class="column small">


<div class="card">

### What it runs
Populations of persona-driven agents in deliberative panels, on social platforms and through recommender feeds, with producers and detectors that co-evolve. Local-first, containerised, deterministic replay.

</div>



<div class="card bad">

### What we cannot yet score
A swarm does not return an answer, it returns a graph: **246 claims, 296 relations** from one deliberation.

Final-answer accuracy misses all of it, so how to judge? Per claim? Per edge? Per trajectory? Against whose judgement?

</div>


</div>


</div>



<div class="c-important">

Trajectories, not answers. Populations, not users. Drift, not snapshots. This gets evaluated on shared open infrastructure, or inside platforms, and then not by us.

</div>



<div class="slide-citation">

Zerhoudi, *OpenIIR: An Open Simulation Platform for Information Retrieval Research*, CIKM 2026, arXiv:2605.09321 · successor to SimIIR 2.0 (CIKM 2022) and SimIIR 3 (SIGIR-AP 2024). Screenshot from an OpenIIR run.

</div>


Notes:
Goal: close the arc, and hand the room the open problem rather than a solution.

Read the picture first. One deliberation among persona-driven agents produced 246 claims joined by 296 relations, and the legend gives the vocabulary: supports in green, counters in red, refines and questions dashed. This is the claim layer of the previous slide, produced rather than designed.

Then the honest part, which is why this slide ends the talk rather than a result slide.

- **The output is not an answer.** Scoring the final response of a swarm throws away the structure that the swarm exists to produce, and the structure is where the interesting behaviour is: which claims attracted counters, which were refined into agreement, which were never questioned.
- **There is no ground truth for a graph.** We can judge a document against a topic. Nobody knows yet what it means for an argument graph to be correct, or even what the unit of judgement is: the individual claim, the edge, the path, or the trajectory that produced it.
- **The measures we have do not transfer.** Precision and recall assume a fixed set of relevant items. A deliberation has no such set, and it changes as it runs.
- **The honest framing for this room** is that these are open questions we find interesting and are starting to work on, not a programme CLEF must adopt. Several parts already have a home here: LongEval for drift, WOWS for open web search, Sim4IA for simulation. What we can offer is the index, OURRS instances and a trace format, and what we want back is a conversation about what would make this evaluable.

Then the last line, which is the talk's argument in one sentence: complex human–agent systems will be evaluated somewhere. The only question is whether the community can do it on infrastructure it controls.
→ conclusion.

## Appendix: in an agent, small retrieval effects compound


<div class="grid-figure gap">


<div class="column">

<div class="viz viz-lg" data-viz="ows/trajectory-compounding" data-steps="3"></div>

</div>


<div class="column small">


<div class="c-definition small">

**What the curve compares.** Suppose a change to the retriever alters the outcome of one search step with probability **ε**, and that steps are independent. After **k** steps the share of trajectories in which at least one step came out differently is **1 − (1 − ε)ᵏ**. The dashed line marks where that reaches half.

</div>



<div class="paper">

<span class="eyebrow">BrowseComp-Plus, 2025</span>
### The multiplier is real
GPT-5 and o3 issue **20–26 search calls** on a hard question, where open models issue fewer than two. A better retriever saves one to three of them.

</div>


</div>


</div>



<div class="slide-citation">

Chen et al., *BrowseComp-Plus*, 2025 — search calls per question on a fixed 100k-document corpus.

</div>


Notes:
Goal: a per-step effect too small to matter on a ranked list decides the majority of agent runs. The figure is arithmetic, not measurement, so say what is being compared before showing it.

- **What ε is.** The probability that one retrieval step comes out differently because of the change being evaluated: a different ranker, a compressed index, a noisier corpus. It is a per-step effect, the kind an offline evaluation would report as a small delta and dismiss.
- **What the y axis is.** Not accuracy, and not how often the agent gets the answer right. It is the share of trajectories in which at least one step was affected, which is the share of runs where the comparison could have gone differently at all.
- **The assumption, stated out loud.** Steps are treated as independent, so the share of untouched trajectories is (1 − ε) multiplied by itself k times. Real trajectories are correlated: a bad result early sends the agent somewhere else, which makes the true effect larger, not smaller. So take the curve as the optimistic bound and say so.
- **What "half the trajectories" means and why it is the interesting point.** It is the trajectory length at which a coin flip decides whether your change touched the run. Below it, most runs are identical whatever you did; above it, most runs differ somewhere. At one per cent per step that crossing is at 69 steps, at two per cent it is 35, at five per cent it is 14.
- **Where real agents sit on this curve.** On BrowseComp-Plus, GPT-5 and o3 issue 20 to 26 search calls for one hard question, while open models issue fewer than two. At 23 calls, a two per cent per-step effect has touched 37 per cent of trajectories and a five per cent effect has touched 69 per cent. That is the multiplier: the same delta that looks negligible on a ranked list decides the majority of agent runs.
- **The consequence for evaluation.** A comparison done one query at a time cannot see this, because the compounding lives in the trajectory. This is why the interaction column of the system figure needs an evaluation of its own.

<div class="grid-2 gap-lg small">


<div class="column">


<div class="c-positive">

Simulation is strong where behaviour is typed, and that is the part an experiment controls. It is good enough to build on.

</div>


</div>


<div class="column">


<div class="c-warning">

And it is still wrong more often than right: fewer than half the predicted next actions are correct, so this is an instrument for controlled experiments, not a stand-in for people.

</div>


</div>


</div>


Notes:
Goal: place the honest boundary before scaling any of it up. Simulation is strong on what people type and weak on what they feel, and the only published comparison against real sessions gets fewer than half its next actions right.

How to read the table. Each row is a thing a simulated session has to produce, ordered by distance from the keyboard: queries are typed and therefore logged, stopping is a decision that has to be inferred, satisfaction is internal and can only be asked about. The third column is deliberately the evidence rather than an opinion, so every claim in the middle column has a paper behind it.

Row by row.

- **Queries and next actions.** CACSM is the only published comparison of one of our simulators against held-out human sessions, which is why it is the number to quote rather than a claim of realism. Adding a cognitive user model lifts next-action accuracy from 0.3683 to 0.4772 on the Sowiport sessions and from 0.3150 to 0.4609 on AOL. Say the second half out loud: on plain query and click prediction a simple probabilistic baseline still wins, and do not quote its stop-prediction numbers, which are degenerate at 1.0.
- **Evidence selection and stopping.** This is where human sessions are needed, and where the ceiling shows: SearchLab's 480 sessions and UXLab's eight-person pilot are what a single group can run. Hold that number in mind against the hundred thousand simulated steps on the next slide, because the asymmetry is the pooling argument.
- **Satisfaction, trust and effort.** Beyond the Click does not collect new human data; it infers cognitive state from behaviour already logged, over 50,942 sessions, and the gain is largest where click signals are weakest. Treat it as how far inference gets without asking people, which is further than expected and still not far enough. The caution, if pressed: a shuffled-label control beats the cognitive labels in three of twelve cells, so part of the gain is regularisation.

The line to land before moving on: this is good enough to build on, which is why the next step was to point the same machinery at agents rather than at people.
