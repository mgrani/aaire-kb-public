## Appendix: robustness on noisy web text


<div class="grid-2 gap-lg">


<div class="column">


<div class="img-h-sm">

![The Synthetic Noise dataset: a relevant passage placed at the start, middle or end of padding taken either from its own source page or from an unrelated one](/slides/_assets/ows/papers/noisy-setup.png)

</div>


</div>


<div class="column small">


<div class="paper detail">

- **Setup** 41,371 MS MARCO passages, padded with real web text. 3 positions × 6 lengths × 2 context types = **36 sub-corpora**, six models.
- **Result** At least **33 nDCG@10 points** lost across every model, 50 for GTE Qwen2. Arctic M: **79.6 → 4.3**.
- **Conclusion** Position and unrelated context dominate. Chunking recovers only part.

</div>


</div>


</div>



<div class="grid-2 gap figure-80">


<div class="column">

![Arctic M: nDCG@10 as the relevant passage is buried in web text](/slides/_assets/ows/papers/noisy-arctic.png)

</div>


<div class="column">

![GTE Qwen2 1.5B: the same experiment](/slides/_assets/ows/papers/noisy-qwen.png)

</div>


</div>



<div class="slide-citation">

Dinzinger, Caspari, Ghosh Dastidar, Mitrović, Granitzer, *Investigating the Robustness of Embedding Models on Noisy Input Texts*, WOWS 2025 · Caspari et al., *When Is Complex Chunking Worth It?*, CIKM 2026.

</div>


Notes:
Goal: benchmark passages are clean and web pages are not, and that difference costs more retrieval quality than most compression or model choices.

Reading the figures.

- Two charts, the same experiment on two models: Arctic M above, GTE Qwen2 1.5B below.
- Each chart splits into In-Domain on the left and Out-of-Domain on the right, meaning the padding text is topically related to the passage or not.
- Within each half the horizontal axis is how much padding was added, 100, 300 or 500 tokens, and the three bars are where the relevant passage sits: start, middle, end.
- The red dashed line is the model's score on the clean passages, 79.64 for Arctic M. Every bar is a fall from that line.
- Left half: with related padding the bars stay near the line, so length alone is survivable.
- Right half: with unrelated padding everything drops, and further the more padding there is.
- Within a group, start is always tallest. Arctic M at 500 tokens out of domain: 46.5 at the start, 6.4 in the middle, 4.3 at the end.

How the collection was built.

- 41,371 MS MARCO passages are the core. The dataset gives the source URL of each passage, so the surrounding page can be scraped and used as real padding rather than generated filler.
- 36 sub-corpora come from varying three things: document length, the position of the relevant passage, and whether the padding is topically related. In-Domain padding comes from the passage's own page, Out-of-Domain from an unrelated one.
- The dilution is the point: at 100 tokens of padding the relevant passage is still 68 per cent of the document, at 300 it is 24 per cent, at 500 it is 14 per cent, and in the longest setting roughly 98 per cent of the input is irrelevant.
- Six models, from BGE small at 33 million parameters to GTE Qwen2 at 7 billion. Size does not rescue anyone.
- The paper's own summary: a drop of at least 33 nDCG@10 points across all models, at least 50 for GTE Qwen2 1.5B at 500 tokens.
- Chunking recovers part of the loss, and the companion CIKM 2026 study finds no strategy that wins across models, corpus sizes and metrics.
- Why it belongs in a talk about infrastructure: the experiment needs real crawled pages with their boilerplate, which an owned index supplies and a cleaned benchmark cannot.

## Appendix: the conversational searcher model, beside the classic one


<div class="grid-3-2 gap-lg">


<div class="column">


<div class="img-h-xl">

![The two searcher models side by side, with the four points where the conversational loop departs from the classic one marked](/slides/_assets/ows/papers/searcher-models-annotated.png)

</div>


</div>


<div class="column small">


<div class="card">

### Same shape, four changes
1. **A information need, not a query.** The searcher generates and issues an *information need* rather then a query.
2. **An action with no counterpart.** It can **request a suggestion**. A result page cannot be asked for more.
3. **Stopping changes its object.** Not "continue on this SERP" but *is the information need satisfied*: a judgement about the conversation, not about a page.
4. **The unit consumed is an information space**, not a ranked document.

</div>


</div>


</div>



<div class="slide-citation">

Conversational searcher model after Azzopardi et al., *SimIIR 3*, SIGIR-AP 2024.

</div>


Notes:
Goal: answer the obvious question about the previous slide. If a simulated searcher is a loop of decisions over a result page, what happens when there is no result page?

Read the two panels as one shape. Both start the same way: examine the topic, then produce something to send to the system. On the left that is a query; on the right it is an information need. Both then examine what comes back, judge whether it is attractive, consume it if it is relevant, and decide whether to continue or stop.

Then the differences, which are the interesting part.

- **The unit changes.** Snippets and documents become information units, and "consume document" becomes "consume information space".
- **A new action appears that has no counterpart in web search**: *request an info unit suggestion*. A conversational system can be asked for more, which a result page cannot, so the loop gains a branch the left-hand model does not have.
- **The stopping question changes.** On the left it is "continue on this SERP" and "stop the session". On the right it is "is the information need satisfied", which is a judgement about the state of the conversation rather than about a page.

The point for the framework: the decision structure is similar enough to share an architecture and different enough that the components cannot be reused unchanged. That is exactly why SimIIR 3 has two parallel component columns rather than one, which is the next slide.
