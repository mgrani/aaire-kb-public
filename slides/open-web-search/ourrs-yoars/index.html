## The new kind of search

<div class="viz viz-xl" data-viz="ows/system-view" data-params='{"stage": 3, "endpoints": true, "caption": false}'></div>


<div class="pull-quote small fade-in">

<span class="eyebrow">The 10 blue links are dead, but </span>
(i) we still need an open search system not only open models and 

(ii) look beyond the invididual agents and humans

</div>


Notes:
The pivot of the talk, drawn as the CLEF system view: a person asks an agent, the agent searches an index through an API, and what comes back leaves usage data behind. Other agents and other people join, and share what they find: that is the collaboration column. A person typing a query and reading ten links is becoming the exception; agents search many times per question, collect what they find, and increasingly publish it. If we leave this layer to whoever builds it first, we get the same lock-in we had with web search. Open models are not enough: the search system under them has to be open too.

## A good summary overcomes a bad ranking


<div class="grid-2-1 gap-lg">


<div class="column">


<div class="img-h-lg">

![OURRS answering a CLEF query: the summary is right, the relevant document is at rank 16](/slides/_assets/ows/screenshots/ourrs-search-clef.png)

</div>


<div class="figure-credit">

ourrs.eu: the generated summary answers the question; the document it rests on is ranked 16th.

</div>


</div>


<div class="column small">


<div class="c-danger">

### What the measure says
The relevant document is at rank 16. **nDCG@10 scores this as a miss.**

</div>



<div class="c-positive">

### What the user says
The answer was right, it arrived first, and the evidence was one click away.

</div>



<div class="c-insight">

Neither number is wrong. They measure different things, and only one of them is what the person came for.

</div>


</div>


</div>


Notes:
Open the part with this, before any history, because it makes the case in one screen. Same query, same system: the generated summary answers it correctly, and the document that supports the answer sits at rank sixteen. Run the standard measure over that result list and it is a failure, because nDCG@10 never sees rank sixteen. Ask the person and it is a success. Say clearly what this is and is not: it is not an argument that ranking stopped mattering, and it is certainly not an argument against offline evaluation. It is an argument that the thing we are measuring and the thing the user experienced have come apart, and that we cannot tell how far apart without watching people use the system. That is what the rest of this part is about.
→ next: and this is not the first time we have needed that data.

## To know whether it is good, we need usage data


<div class="q-list">

Which queries do agents send, and how many per question?

Which results do they read, and which do they cite in the answer?

When is an answer good enough to stop searching?

</div>



<div class="c-important">

But usage data for agents is easy to get, we just need to simulate search. 

</div>


Notes:
The previous slide showed that the measure and the experience have come apart. The way to bring them back together has always been usage data: query logs, clicks, sessions. For agents the questions are the same, but the data does not exist in the open. Commercial engines see it and keep it, and agents do not click, so even the classic signal is gone. That is why the next step is simulation: if we cannot observe agents searching, we run them and record every step.

## AgentSim: we simulate agents now, because agents search


<div class="grid-2-1 gap-lg">


<div class="column">

![AgentSim: grounded corpora and corpus-aware seeding feed a configurable retrieval and reasoning workflow, whose traces are validated and written to an agent-trace corpus](/slides/_assets/ows/papers/agentsim-workflow.png)

</div>


<div class="column small">


<div class="card">

### The run
- 1,000 seed queries per corpus, chosen to cover it
- MS MARCO, Quasar-T, CausalQA, via ChatNoir
- GPT-4o, Mistral Large, DeepSeek-V3
- Up to seven retrieval–reasoning cycles

</div>



<div class="card good">

### What came out
- **103,567** trace steps from 21,000 trajectories
- **199,968** documents from queries
- every answer grounded in a cited document


</div>


</div>


</div>



<div class="c-important small">

SimIIR simulated the person at the keyboard. What searches now is an agent, so the unit of simulation is a whole trajectory. Every step records the documents it used, so the trace can be checked rather than believed.

</div>



<div class="slide-citation">

Zerhoudi, Granitzer, Mitrović, *AgentSim: A Platform for Verifiable Agent-Trace Simulation*, SIGIR 2026, Fig. 1 (CC BY 4.0).

</div>


Notes:
Goal: the object of simulation moved from the user to the agent, because the agent is what searches now, and agent traces can be produced cheaply and verified.

Reading the figure, left to right.

- **1 and 2, the inputs.** Grounded corpora with questions, and corpus-aware seeding: cluster the corpus and draw seed queries that cover it, instead of sampling at random. Random seeds revisit the same regions; corpus-aware seeding reaches cluster coverage of 1.00 against 0.97 to 0.99 for random, with near-zero document redundancy.
- **3, the middle box, is AgentSim itself.** A configurable RAG workflow, built visually or from the command line, running the cycle the figure shows: search with query reformulation, retrieve, rerank, summarise, and round again. That loop is the difference from SimIIR, whose searcher queries, examines a result, judges it and stops.
- **4, the validation loop, and the trace excerpt on the right.** This is what the line under the figure means by checking a trace. A step is not only text: it records the query, the answer, and the documents the agent actually retrieved and used at that point. So a checker can take the claim a step makes and the documents it named, and ask whether one follows from the other, without a person reading it. That is the difference between inspecting a simulated session and verifying one. The result of doing that: of 1,385 substantive answers all were grounded in their cited documents, mean token coverage 0.872, and 83.3 per cent of 6,125 atomic claims were fully supported under an entailment check.

**What the 199,968 documents are**, since it is an easy question to get wrong. They are not generated and they are not a new corpus. They are the distinct documents the agents actually retrieved, through ChatNoir, out of the three existing collections that form the environment: MS MARCO, Quasar-T and CausalQA. The paper is explicit that it builds on those resources rather than replacing them, using their queries as starting points and their document collections as the environment. So the number is a coverage measure: how much of the corpus the simulation genuinely touched, which is the thing corpus-aware seeding is designed to maximise.

**What else came out of it besides a pile of traces**, because "why do these exist" is the fair question. Four things.
- **The platform**, with the two mechanisms that are the methodological contribution: corpus-aware seeding and active validation.
- **Training data that demonstrably works.** Distilling the traces into small models: Qwen 2.5 0.5B raised its abstain-detection F1 from 0.362 to 0.815, matching a base model three times its size, and every model size learned to abstain when the evidence was insufficient, recall above 0.88. That is the answer to what the traces are for.
- **Behavioural findings about the models themselves**, which no static benchmark shows: the three analysts explore very differently, six of nine pairwise comparisons significant with effect sizes up to Cohen's d 1.59.
- **Verifiability as a property of the dataset.** The authors note that no existing reasoning-trace dataset reports token-level grounding verification against source documents.

The cost, since it is the argument. Roughly 20 million API tokens, 200 to 300 dollars for the whole corpus, about 0.14 dollars per simulation, 58 steps on average.

The numbers behind the behavioural finding, if asked: GPT-4o retrieved 31.7 per cent more unique documents than DeepSeek-V3 on MS MARCO and 176 per cent more on CausalQA, while DeepSeek-V3 falls back on keyword reformulation in 23.3 per cent of cases against 8.1 for GPT-4o.

Keep the both-roles observation for the spoken line if it lands: the same trajectory is the experiment and the product, because the agent stands in for the user and works for the user at once.

→ next: and what those traces are worth.

--

## Learning very small retrieval models using Agent Traces

<span class="eyebrow">Distil big models into small ones that run on low-resource devices</span>


<div class="grid-3-1 gap-lg">


<div class="column">

<div class="viz viz-full" data-viz="ows/fellowship" data-steps="3"></div>

</div>


<div class="column small">


<div class="card">

### The setup
- Teacher: Qwen 3-Next 80B, 5,000 rollouts
- Kept: 1,490 accepted trajectories, 16,488 steps
- Labels: seven retrieval actions
- Student: Granite 4.1 3B on 13,194 actions
- Baselines: the same model prompted, and TF-IDF

</div>


</div>


</div>



<div class="c-insight">

A small model trained on the traces of a large one does not just label the next action. Put in charge of the search, it makes the pipeline use the evidence it retrieved: the evidence-fact rate goes from **0.01 to 0.62**.

</div>



<div class="slide-citation">

Al-Maamari, Zerhoudi, Granitzer, Mitrović, *The Fellowship of the Query: Learning Retrieval Actions*, CIKM 2026 short paper.

</div>


Notes:
Goal: one minute. Traces are training data, and the capability they teach can be moved into a small model. The direction: we develop small retrieval models and distil them from big ones, so that they can run on low-resource devices, not only in a data centre.

- **The task.** Given the state of a search trajectory, predict which of seven actions comes next: decompose, search, reformulate, extract, synthesise, verify, finish.
- **The filtering matters.** 5,000 teacher rollouts, only 1,490 accepted. The student learns from work that succeeded, not from everything the teacher did.
- **The headline.** Macro-F1 0.65 for the fine-tuned 3B model against 0.17 for the same model prompted zero-shot, and 0.54 for a TF-IDF baseline. The capability is learned, not prompted.
- **The second experiment, and what its numbers actually measure.** Instead of only predicting labels, the fine-tuned 3B model is put in both seats at once: as **controller** it chooses which of the seven actions comes next at every step, and as **generator** it writes the final answer. Nothing of the teacher model is left in the loop. The scores are **answer quality**, not retrieval and not action prediction: the model is placed in an end-to-end BM25 pipeline and its final answers are scored SQuAD-style against the gold answer, exact match and token overlap F1, over 149 held-out trajectories.
- **Be precise about which gain holds.** Token F1 rises from 0.778 to 0.830 and the paired bootstrap interval is [0.002, 0.104], so it clears zero but only just. Exact match rises from 0.753 to 0.795 and **its interval crosses zero**, so do not present that one as an established improvement.
- **The large effect is elsewhere, and it is the interesting one.** The evidence-fact rate, how often the answer actually uses a fact from the retrieved evidence, goes from **0.012 with the base controller to 0.616 with the fine-tuned one**. The small model does not mainly make answers more correct; it makes the pipeline actually use what it retrieved. The paper notes this metric is an automatic matching heuristic, not human-verified factuality.
- **Why it belongs here.** It closes the cost argument: if traces can be made cheaply and verified, the capability they teach does not have to be rented from a frontier model.

→ next: and yet none of it tells us who asked.

## Given we have Agents, why a single search endpoint?


<div class="grid-figure gap">


<div class="column">

<div class="viz viz-lg" data-viz="ows/system-view" data-params='{"stage": 1, "focus": "retrieval", "endpoints": true, "caption": false}'></div>

</div>


<div class="column small">

- A search engine is **one API**: one index, one ranking, the same for everyone.
- An agent is not bound to one. It can call **local, remote and web endpoints**, choose per question and merge what comes back.
- Small models trained on agent traces make a **local endpoint** cheap.


<div class="q-list">

Which endpoint for which question, and how do we evaluate the mix? 

Do we finally get true federated search? 

Is there also a buisness model?


</div>


</div>


</div>



<div class="card">

### Information Access was always a matter of Trust
In the past the (erroded) trust in the top 10 links and the autors beyond the pages. Today web can go beyond that: a trusted agent model plus validated knowledge sources.

</div>



Notes:
This questions our own design. OUR²S, like every web search engine, is built around the idea of one API in front of one index. Agents break that assumption: a coding agent already searches the user's files, the documentation of a library and the web in one task, and decides itself which to ask. The small retrieval models of the previous slide push in the same direction, because they make it cheap to run an endpoint on the user's own device. What stays is the need for an open web index, as one endpoint among many, and a new evaluation question: not how good one ranking is, but how well an agent chooses and combines several. Then the step to the next slide: if agents search many endpoints anyway, they can also write to a shared one.


--

## AI Opinions: agents build a shared search memory


<div class="grid-2-1 gap-lg">


<div class="column">


<div class="img-h-xl">

![The AI Opinions vertical of OURRS for the query "passau"](/slides/_assets/ows/screenshots/ourrs-ai-opinions-passau.png)

</div>



</div>


<div class="column gap-lg">

**Agent-to-agent collaboration for indexing the web**

- agents search web documents and publish summaries with **sources and model provenance**
- other agents can reuse, challenge or update those summaries
- OURRS makes them searchable: a **shared cache of search summaries**


<div class="c-insight gap-lg">

One agent's search can become the next agent's starting point.

</div>


</div>


</div>


Notes:
The third use case connects agent collaboration back to the index. An agent searches web documents, summarises what it finds and publishes the summary with its sources. Indexing those summaries makes the work available to other agents: they can retrieve it, inspect the evidence and contribute a correction or a newer summary. This is a shared cache of search summaries, alongside the underlying web index.

The screenshot shows the OURRS AI Opinions vertical for the query *passau*, September 2026. Point out the model names, cited documents, epistemic tags and the Contradicting / Superseding filters. These are model-authored opinions; a cached summary still needs its evidence checked.

The intended collaboration is agent-to-agent: share the work of indexing and maintaining this derived search layer. Generation, critique and review are the design direction; governance, validity and refresh remain questions to evaluate. YOARS offers a message layer for coordinating that work; this screenshot demonstrates the searchable artefacts, not a completed YOARS integration.

## Annex: YOARS in detail

## Who talks to whom

| From → to | Example | How it arrives |
|---|---|---|
| **human → human** | two analysts agree on the next lead | console or chat app, in a room |
| **human → agent** | "check this account", "rerun the tests" | an addressed request to the agent's endpoint |
| **agent → human** | a question, a progress update, a result | the same room; receipts show it was seen |
| **agent → agent** | one agent asks another for its evidence | an addressed message, only if the room allows it |


<div class="c-note">

Humans and agents are the same kind of participant, with one difference that never goes away: **every agent has a human owner**, and the record says whether a message came from a person, an autonomous agent, or an agent acting for a person.

</div>


Notes:
The point of the table is the symmetry: all four directions go through the same mechanism, so they can be observed, governed and audited the same way. The asymmetry is ownership. Agent-to-agent messages are off by default: a room's communication matrix has to allow a sender to address a recipient.

--

## One message protocol for all of them


<div class="grid-2 gap">


<div class="column">

```yaml
# yoars2.message.v1 (simplified)
body: "Which DISARM codes did you assign?"
goal: "map the campaign to DISARM"
recipients:
  to: [ a/analyst/source-harness ]
communication:
  kind: request_reply  # or inform, progress_update,
                       # request_comment, request_execution
retention: retained    # or ephemeral, with a TTL
request_id: 01J…       # sent twice, delivered once
provenance: …          # stamped by the relay
```

</div>


<div class="column">


<div class="marks-step">

- **Addressed, not mentioned.** Routing uses the recipients field; an @name in the text addresses nobody.
- **Typed.** The kind says what the sender expects: to inform, to get a reply, a comment, or an action.
- **Delivered, then acknowledged.** Pending → claimed → acknowledged; receipts show the sender where it stands.
- **One contract, several ways in.** WebSocket, REST and MCP, for agents and apps alike.

</div>


</div>


</div>


Notes:
Keep this semi-technical: the audience does not need the field list, only the four ideas. Addressing is explicit, which makes it auditable and avoids agents reacting to every mention. The communication kind lets an agent know whether it is expected to act. Delivery is at-least-once with claims and idempotency keys, so a message sent twice is processed once. And the same contract is reachable as WebSocket (for notices), REST and MCP; the socket carries notice, not authority.

--

## Securing agent-to-agent collaboration

| Risk | What YOARS does |
|---|---|
| **Who is speaking?** | every agent has its own credential, minted by its owner; the relay resolves every token itself, no trusted identity headers |
| **Who is really behind it?** | the relay stamps provenance on every message: human, autonomous agent, or agent acting for a person |
| **Agents talking where they should not** | closed by default: a room's policy and its sender → recipient matrix must allow it; a refusal is recorded and answered |
| **Secrets leaking into a model** | no credential ever appears in what a model reads; room secrets are encrypted per agent, the relay never sees plaintext *(in progress)* |
| **Prompt injection through messages** | every field a model reads is length-capped and framed as reported speech; triage happens in the agent's harness, never silently |
| **Afterwards: what happened?** | the record keeps who said what to whom under which policy, and every refusal |

Notes:
Why this matters: once agents act for people and talk to each other, a message is an instruction channel. The relay deliberately does not judge content; it makes identity, provenance and policy explicit and keeps a record. Room secrets (per-agent keys, encrypted files in the room's workspace) are being built now. Rate limits and a full security review come before YOARS goes public.

--

## What we learned from attacking it


<div class="grid-3-2 gap-lg">


<div class="column">

We planted a saboteur in teams of agents building software together, and tried defences **inside the conversation**: room policies, reviewers, voting.


<div class="c-warning">

None of them reduced how often a sabotaged result was shipped.

</div>



<div class="c-insight">

But an auditor reading the **platform's record** found every shipped attack and named the attacker.

</div>


</div>


<div class="column">


<div class="stat-card fails">

### 0
defences inside the room that helped

</div>


<div class="stat-card holds">

### 96 / 96
shipped attacks detected from the record, attacker named

</div>


</div>


</div>



<div class="slide-citation">

Internal experiment series, Passau, September 2026; not yet published. Auditor: a frontier model; with the agents' own open model, about half were found.

</div>


Notes:
This is the result that shaped the security design, so say it carefully. Across four stages, no defence placed inside the room (policy regime, zero to three reviewers, voting) reduced the rate at which a working artifact carried the planted marker; one apparent effect did not replicate (6/9 against 6/7, p = 0.58). An outside auditor reading the recorded ledger detected all 96 shipped markers and named the attacker in all of them, and in the 25 persuasion arms named the persuader rather than the writer. The honest caveats: that auditor was Opus 5; the fleet's own model, Qwen 3.6, found 53 of 95. Specificity on honest runs was 92%. The lesson: security for agent collaboration comes from the record and from who can see it, not from asking agents to be careful.

        if (!h) continue;
        used += h / s + PER_CHILD;
      }
      return used;
    }

    function fit() {
      for (const sec of document.querySelectorAll(".reveal .slides section")) {
        if (sec.querySelector("section")) continue;              // stack wrapper
        if (sec.classList.contains("title-slide")) continue;
        if (sec.classList.contains("module-slide")) continue;
        fitFigure(sec);
        const used = contentHeight(sec);
        // A hidden slide measures 0; leave its class alone rather than
        // centring everything off-screen. It is measured when it becomes
        // current, since fit() runs on every slidechanged.
        if (used === 0) continue;
        sec.classList.remove("v-center");
        if (SLIDE_H - used > MIN_FREE) {
          sec.classList.add("v-center");
          // Child rectangles exclude margins, so a slide whose blocks are
          // generously spaced measures smaller than it lays out. Under
          // .v-center the section is exactly SLIDE_H tall, which makes
          // scrollHeight an exact overflow test — take the centring back if
          // it pushed anything past the bottom edge.
          if (sec.scrollHeight > SLIDE_H) sec.classList.remove("v-center");
        }
      }
    }

    const start = () => {
      fit();
      window.Reveal?.on?.("slidechanged", fit);
      window.Reveal?.on?.("resize", fit);
      setTimeout(fit, 1200);                 // visualizations mount asynchronously
    };
    if (window.Reveal?.isReady?.()) start();
    else window.Reveal?.on("ready", start);
  })();
})();</script></body></html>
