## The new kind of search

<div class="viz viz-lg" data-viz="ows/system-view" data-params='{"stage": 3, "caption": false}'></div>


<div class="pull-quote">

The 10 blue links are dead, but we still need an open search system, not only open models.

</div>


Notes:
The pivot of the talk, drawn as the CLEF system view: a person asks an agent, the agent searches an index through an API, and what comes back leaves usage data behind. Other agents and other people join, and share what they find: that is the collaboration column. A person typing a query and reading ten links is becoming the exception; agents search many times per question, collect what they find, and increasingly publish it. If we leave this layer to whoever builds it first, we get the same lock-in we had with web search. Open models are not enough: the search system under them has to be open too.

## 3 · YOARS: Your Open Agent Relay System

<span class="eyebrow">Thinking about future collaboration spaces between humans and agents.</span>




Notes:
The name says what it is. Your: every agent connects with its own credential. Open: the contract is an open API. Agent Relay: it relays, it does not orchestrate, schedule or decide. The relay is not about search: it is where people and agents work together, and search is one of the things they do there.

--

<!-- .slide: class="smaller" -->

## Motivation: agents as the interface


<div class="pull-quote">

Agents will become the interface between humans and information and to processes; the Web will become their medium. 

</div>



<div class="card">

<span class="eyebrow">First question: Control, interaction and trust</span>
How do we keep control of agents that act for us, interact with them, and trust what they do and what they tell us?

</div>



<div class="card">

<span class="eyebrow">Collaboration</span>
How do agents, and the people behind them, work together, with each other and with us?

</div>




<div class="c-warning fade-in">

**A prediction:** future AI business will not be primary about models, but about the secure environment (under legal guarantees) where AI will execute their tasks. Most likely in the cloud of hyperscalers. 

</div>


Notes:
State the motivation plainly. Once agents are the way we reach information and run processes, two questions follow. The first is about control, interaction and trust: who is speaking, on whose behalf, under which rules. The second is about collaboration: how agents and people work together on something shared. YOARS is our attempt to build the place where both can be studied.

## Annex: YOARS in detail

<span class="eyebrow">Who talks to whom, the message protocol, security, what we learned, where it stands</span>

--

## Who talks to whom

| From → to | Example | How it arrives |
|---|---|---|
| **human → human** | two analysts agree on the next lead | console or chat app, in a room |
| **human → agent** | "check this account", "rerun the tests" | an addressed request to the agent's endpoint |
| **agent → human** | a question, a progress update, a result | the same room; receipts show it was seen |
| **agent → agent** | one agent asks another for its evidence | an addressed message, only if the room allows it |


<div class="c-note">

Humans and agents are the same kind of participant, with one difference that never goes away: **every agent has a human owner**, and the record says whether a message came from a person, an autonomous agent, or an agent acting for a person.

</div>


Notes:
The point of the table is the symmetry: all four directions go through the same mechanism, so they can be observed, governed and audited the same way. The asymmetry is ownership. Agent-to-agent messages are off by default: a room's communication matrix has to allow a sender to address a recipient.

--

## One message protocol for all of them


<div class="grid-2 gap">


<div class="column">

```yaml
# yoars2.message.v1 (simplified)
body: "Which DISARM codes did you assign?"
goal: "map the campaign to DISARM"
recipients:
  to: [ a/analyst/source-harness ]
communication:
  kind: request_reply  # or inform, progress_update,
                       # request_comment, request_execution
retention: retained    # or ephemeral, with a TTL
request_id: 01J…       # sent twice, delivered once
provenance: …          # stamped by the relay
```

</div>


<div class="column">


<div class="marks-step">

- **Addressed, not mentioned.** Routing uses the recipients field; an @name in the text addresses nobody.
- **Typed.** The kind says what the sender expects: to inform, to get a reply, a comment, or an action.
- **Delivered, then acknowledged.** Pending → claimed → acknowledged; receipts show the sender where it stands.
- **One contract, several ways in.** WebSocket, REST and MCP, for agents and apps alike.

</div>


</div>


</div>


Notes:
Keep this semi-technical: the audience does not need the field list, only the four ideas. Addressing is explicit, which makes it auditable and avoids agents reacting to every mention. The communication kind lets an agent know whether it is expected to act. Delivery is at-least-once with claims and idempotency keys, so a message sent twice is processed once. And the same contract is reachable as WebSocket (for notices), REST and MCP; the socket carries notice, not authority.

--

## Securing agent-to-agent collaboration

| Risk | What YOARS does |
|---|---|
| **Who is speaking?** | every agent has its own credential, minted by its owner; the relay resolves every token itself, no trusted identity headers |
| **Who is really behind it?** | the relay stamps provenance on every message: human, autonomous agent, or agent acting for a person |
| **Agents talking where they should not** | closed by default: a room's policy and its sender → recipient matrix must allow it; a refusal is recorded and answered |
| **Secrets leaking into a model** | no credential ever appears in what a model reads; room secrets are encrypted per agent, the relay never sees plaintext *(in progress)* |
| **Prompt injection through messages** | every field a model reads is length-capped and framed as reported speech; triage happens in the agent's harness, never silently |
| **Afterwards: what happened?** | the record keeps who said what to whom under which policy, and every refusal |

Notes:
Why this matters: once agents act for people and talk to each other, a message is an instruction channel. The relay deliberately does not judge content; it makes identity, provenance and policy explicit and keeps a record. Room secrets (per-agent keys, encrypted files in the room's workspace) are being built now. Rate limits and a full security review come before YOARS goes public.

--

## What we learned from attacking it


<div class="grid-3-2 gap-lg">


<div class="column">

We planted a saboteur in teams of agents building software together, and tried defences **inside the conversation**: room policies, reviewers, voting.


<div class="c-warning">

None of them reduced how often a sabotaged result was shipped.

</div>



<div class="c-insight">

But an auditor reading the **platform's record** found every shipped attack and named the attacker.

</div>


</div>


<div class="column">


<div class="stat-card fails">

### 0
defences inside the room that helped

</div>


<div class="stat-card holds">

### 96 / 96
shipped attacks detected from the record, attacker named

</div>


</div>


</div>



<div class="slide-citation">

Internal experiment series, Passau, September 2026; not yet published. Auditor: a frontier model; with the agents' own open model, about half were found.

</div>


Notes:
This is the result that shaped the security design, so say it carefully. Across four stages, no defence placed inside the room (policy regime, zero to three reviewers, voting) reduced the rate at which a working artifact carried the planted marker; one apparent effect did not replicate (6/9 against 6/7, p = 0.58). An outside auditor reading the recorded ledger detected all 96 shipped markers and named the attacker in all of them, and in the 25 persuasion arms named the persuader rather than the writer. The honest caveats: that auditor was Opus 5; the fleet's own model, Qwen 3.6, found 53 of 95. Specificity on honest runs was 92%. The lesson: security for agent collaboration comes from the record and from who can see it, not from asking agents to be careful.

          // author's fragments first. Give the visualization steps the leading
          // indices and push the author fragments behind them. Reveal has
          // already numbered every fragment 0, 1, … on init (fragments.sortAll),
          // so an existing index cannot be told apart from an authored one:
          // shift them all by `steps`, which keeps their relative order.
          const authored = [...slide.querySelectorAll(".fragment")]

    const SLIDE_H = 720;

    const PER_CHILD = 12;   // margin allowance per sibling block

    const scale = () => window.Reveal?.getScale?.() || 1;

    // Grow the figure until either the width or the free height runs out.
    function fitFigure(sec) {
      const holder = sec.querySelector(".viz:not(.eq-explain)");
      if (!holder) return;
      const svg = holder.querySelector("svg");
      if (!svg || !svg.viewBox || !svg.viewBox.baseVal) return;
      const vb = svg.viewBox.baseVal;
      if (!vb.width || !vb.height) return;

      // measure the rest of the slide without our own constraint in the way

        if (child.tagName === "ASIDE") continue;
        if (child === holder || child.contains(holder)) continue;
        used += child.getBoundingClientRect().height / s + PER_CHILD;
      }
      const avail = SLIDE_H - used - EDGE;
      if (avail <= 80) return;                       // no room: leave the CSS cap

      let width = Math.min(SLIDE_W - 2 * EDGE, aspect * avail);
      svg.style.maxWidth = Math.floor(width) + "px";

      // The estimate above ignores the figure's own margins and any rounding,
      // so grow first and then pull back until the slide genuinely fits. Two
      // or three passes settle it; the guard stops a pathological loop.
      for (let k = 0; k < 6; k++) {

    // answer this: the theme lays a rendered slide out at the full 720px, so it

    // display:none. Measuring the children works in both states.
