## OpenWebSearch.eu as a Data Source for AI

Prof. Dr. Michael Granitzer  
Chair of Data Science, University of Passau  
Coordinator OpenWebSearch.eu


<div>

TPC26 Satellite Event · Garching · 2026-06-02

</div>


Notes:
The talk is not mainly about OpenWebSearch.eu. It uses OWSEU as a concrete infrastructure example for a larger argument: the web is becoming a reusable data layer for AI systems — for training, retrieval memory, agent actions, and behavioral traces.

---

## Web Search & Web Data -  a Critical Infrastructure


<div class="grid-2-1 gap-lg">


<div class="column">


- A **critical infrastructure** for society — and now for AI — comparable to satellite navigation
- A **market oligopoly**: a handful of gatekeepers (Google, Microsoft, Baidu, …) control access to the web

### Consequences

- **Reduced user choice**
- **Dependence in the information space** 
- **Smaller researches and innnovators are locked out**



</div>


<div class="column">


![Search engine market share](../../_assets/ows/search-engine-market-share.jpg)


</div>


</div>



<div class="takeaway">

How to enable researchers, innovators and smaller companies to utilise the web as **data resource** for training and fine-tuning AI systems and to develop **AI-based Search Systems** without massive investments in infrastructure?

</div>


Notes:
Motivation: web search is critical infrastructure, but it is run as an oligopoly. For this talk the angle is not sovereignty for its own sake — it is access to the web as a scientific and operational *data resource*. If only a few players can read the web at scale, only a few can build on it.

---

## OpenWebSearch.eu 


<div class="c-info center">

Building an **Open Index of the Web** and an open infrastructure that lowers the cost for researchers, innovators, and companies to tap the web for **search, analytics, and AI**.

</div>



<div class="grid-2 gap-lg">


<div class="column">

1. **Open technology stack** — open pipelines for crawling, preprocessing, indexing
2. **Resource provision** — a network of providers on EuroHPC / AI Factories

4. **Bootstrapping the ecosystem** — third-party calls, community, use-cases

## The Goal: An Open Web Index


A **web index** is the data structure behind every search engine — fast, query-based access and ranking over web documents.


<div class="c-info">

**Our proposition:** a collaboratively created, **open and transparent** web index, running on Europe's HPC centres and AI Factories.

</div>



<div class="figure-100">

![Open Web Index concept](../../_assets/ows/owi-concept.svg)

</div>


Notes:
The goal is not to clone a commercial search engine, but to build shared, open infrastructure: an index anyone can reuse for datasets, retrieval, agents, and evaluation — on public European compute.

---

## Building the Index


<div class="grid-2 gap-lg">


<div class="column small">



### Federated HPC Workflow

- Continuous Crawling on Cloud Partitions
- Daily Batch HPC Workflows: WARC processing · indexing · semantic enrichment, running
- Runs federated at **LRZ** (Garching) · **IT4I** (Ostrava) · **CSC** (Helsinki)
 

### Federated storage


- Object Storage for Crawl Data
- File Storage for Index Provivions


### Orchestration

- LEXIS (Apache Airflow)  orchestrates jobs across schedulers
- stages data transfers, aligns daily output across all centers




</div>


<div class="column">


![LEXIS Airflow orchestration across HPC sites](../../_assets/ows/owi-lexis-orchestration.png)


<div class="figure-credit">

LEXIS / Apache Airflow: federated OWI pipeline orchestration

</div>



</div>


</div>


Notes:
Fast slide — HPC is the infrastructure backbone. The pipeline runs daily: crawl → WARC processing → indexing → semantic enrichment (embeddings). Each stage has a different bottleneck (network, I/O, memory/CPU, GPU). LEXIS (built on Apache Airflow) orchestrates the federated workflow across LRZ, IT4I, CSC, and CERN — handling job scheduling, data staging via DDI/iRODS, and aligning output. Federated storage means data and compute can meet at whichever site has capacity. The result: 1,507 TB crawled, 35 TB indexed, 884 GB dense embeddings — reusable public infrastructure.

## Search becomes the memory layer

What lives in the weights, and what stays retrievable?

Notes:
This is the conceptual pivot of the talk. Search is no longer only a human-facing interface — it becomes the memory layer of AI systems.

---

## Search as Memory: Parametric vs. Non-Parametric

### Retrieval-Augmented Generation (RAG)

<div class="grid-2 gap-lg">


<div class="column">


Search for context relevant documents. Usually as Vector search, to cover linguistic and semantic diversity.

**RAG splits memory in two**

- **parametric:**, i.e. model capabilties
- **non-parametric:**, i.e. knowledge


</div>


<div class="column">


![Agent memory architecture](../../_assets/ows/agent-memory-components.svg)


</div>


</div>


<div class="c-positive">

RAG is essential for freshness, domain specific adaption and data privacy, but requires scalable and efficient **search infrastructures** in an AI system

</div>




<div class="slide-citation">

Lewis et al. 2020, Retrieval-Augmented Generation (arXiv:2005.11401); parametric vs. non-parametric memory, Mallen et al. 2023.

</div>


Notes:
Large models and large retrieval systems solve different problems. A memory manager decides what reaches the bounded context: relevance, lifecycle, provenance, privacy, compression. Retrieval memory must be compact, refreshable, and measurable.

---

## Web-Scale Vector Memory Has a Cost

The Open Web Index provides **embeddings** for retrieval on selected web documents, but increases compute and storage significantly. 



<div class="grid-2 gap-lg">



<div class="column">


### Why compression matters

- Compute is managable / scalable
- But embeddings are **expensive to store and serve** <span class="sidenote">($O(n)$ for exact queries)</span>
- compression trades index size against retrieval quality
- Quantisation wins:  results hold recall while compressing **16–32×**


<div class="c-insight">

The memory layer must be cheap enough for **scaling search** .

</div>



</div>


<div class="column">


![Compression ratio vs. retrieval quality](../../_assets/ows/corect-jinav3-ndcg10-pareto.png)


</div>


</div>



<div class="slide-citation">

Own work — **CoRECT**: Controlled Retrieval Evaluation of Compression Techniques (Jina v3, Recall@100 vs. compression ratio). arXiv:2510.19340 · padas-lab-de.github.io/CoRECT

</div>


Notes:
This is where our own contribution grounds the argument. The Pareto plot shows several compression families: at 16–32× compression, recall stays close to the uncompressed baseline. The point is not a single best method — it is that serving cost, refresh rate, and latency are first-order for a web-scale memory layer, and they are tractable.

Retrieval moves into a control loop — and needs actions and traces.

Notes:
Section break. We move from single-hop RAG to retrieval that an agent actively controls, and then to the data agents need to learn that control.

## Agentic Search: Retrieval in a Control Loop


<div class="grid-2 fit gap-lg">


<div class="column">


![Classical search flow](../../_assets/ows/classical-search-flow.svg)


</div>


<div class="column">


![Agentic search flow](../../_assets/ows/agentic-search-flow.svg)


</div>


</div>



<div class="c-info">

Agents do not just **consume** search results — they **control** retrieval: plan, inspect evidence, call tools, reformulate, synthesize with provenance.

</div>



<div class="slide-citation">

Related paradigms: ReAct (arXiv:2210.03629); Toolformer (arXiv:2302.04761); Self-RAG — adaptive, self-reflective retrieval (arXiv:2310.11511).

</div>


Notes:
RAG becomes multi-hop and interactive. ReAct interleaves reasoning and acting; Toolformer learns to call tools; Self-RAG learns *when* to retrieve and to critique its own evidence. The common thread: the agent decides when evidence is sufficient.

<div class="c-insight">

How much knowledge must sit in **weights** vs. **external memory**? Externalising it → **smaller model + fresher, controllable knowledge** — trading latency & more loops for flexibility, control. *Where to invest resources?*

</div>



<div class="slide-citation">

Memory roles after CoALA: working · episodic · semantic · procedural (Sumers et al. 2023, arXiv:2309.02427).

</div>


Notes:
The system view of agentic search. Build it up in three steps: (0) the plain input → model → output pipeline; (1) open the model — parameters encode language understanding, abstraction, reasoning, and knowledge; (2) add the agentic loop — a user-facing API drives a context interface and a tool interface over external memory (knowledge, interactions, sessions). The dashed arrow is the thesis: move knowledge out of the weights into external memory. External memory maps onto agent memory types (CoALA): knowledge ≈ semantic, interactions ≈ episodic, sessions ≈ working; the in-weight abilities are procedural. Discussion: externalising knowledge shrinks the model and makes knowledge fresh, inspectable, and controllable, at the cost of retrieval latency and more interaction loops — a resource-allocation and engineering trade-off, not a settled answer.

<div class="eyebrow">

Open challenges in agentic search — our work

<div class="grid-2 gap-lg">


<div class="column middle">

**How should retrieval adapt to the user?**

**PersonaRAG** — user-centric agents personalise retrieval → higher answer quality (BLEU) than CoT and vanilla RAG across TriviaQA, WebQ, NQ.

<div class="grid-2 gap-lg fade-in">


<div class="column middle">

**How to structure knowledge so agents find it?**

**NuggetIndex** — distil documents into atomic **"nuggets"**: 887 → 320 tokens, far less noise, facts kept for grounding.

<span class="sidenote">Own work — nugget-level indexing for agent knowledge</span>

</div>


<div class="column middle">

<img src="../../_assets/ows/nuggetindex-efficiency.png" alt="NuggetIndex — documents distilled to atomic facts" style="max-height:208px;width:auto;display:block;margin:0 auto"/>

</div>


</div>


Notes:
Two challenges beyond the data itself, one per row (second row fades in). PersonaRAG (Zerhoudi & Granitzer 2024): retrieval is a personalisation problem — user-centric agents adapt what is retrieved and lift answer quality over Chain-of-Thought and vanilla RAG. NuggetIndex: how should knowledge be structured so an agent can search it efficiently? Distil documents into atomic factual nuggets — fewer tokens, less noise, facts preserved for grounding.

<div class="eyebrow">

Open challenges in agentic search — our work

<div class="grid-2 gap-lg">


<div class="column middle">

**Where do grounded agent traces come from?**

**AgentSim** — simulates RAG agents to generate synthetic, **document-grounded** reasoning traces for training & evaluation.

<span class="sidenote">AgentSim, Agent-Trace Corpus · arXiv:2604.26653</span>

<div class="column middle">

|---|---|

| corpora | MS MARCO · Quasar-T · CausalQA |

<div class="grid-2 gap-lg fade-in">

**How to evaluate without costly user studies?**

**UXSim** — grounds an adaptive LLM agent with classical simulators → accurate, **explainable** user-search simulation.

<span class="sidenote">Zerhoudi & Granitzer, CIKM '25 · arXiv:2602.24241</span>

</div>


<div class="column middle">


| Approach | Grounded | Flexible |
|---|:---:|:---:|

| LLM agent | — | ✓ |
| **UXSim (hybrid)** | ✓ | ✓ |


</div>


</div>


Notes:
The other two challenges, one per row (second row fades in). AgentSim: where do grounded behavioural traces come from? It generates synthetic, verifiable RAG-agent traces — 103k+ steps across three IR corpora, 100% grounding on substantive answers. UXSim: how to evaluate interactive search without expensive user studies? It grounds an adaptive LLM agent with classical simulators, giving accurate and explainable user simulation.
