## Disinformation is a campaign, not a post


<div class="grid-1-2 gap-lg">


<div class="column middle">

![](/slides/_assets/source/web/marionetten.webp)

</div>


<div class="column">

A single false post is easy to check and cheap to replace. What does the damage is the **campaign** behind it:

- the same story, slightly changed, on many sites and channels
- accounts that amplify each other, across platforms
- timing that follows a plan, not the news


<div class="pull-quote">

To counter a campaign you have to see the pattern, and describe it in a language others can act on.

</div>


</div>


</div>


Notes:
This is why SOURCE is built as a chain and not as a single classifier. Seeing the pattern needs broad data and provenance; describing it needs a shared vocabulary, which is where DISARM comes in later.

## From the open web to the analyst, and back

<div class="viz viz-full" data-viz="source/chain" data-steps="4"></div>

Notes:
Build it in five clicks.
- **Sources.** The Open Web Index crawls the web every day. Social-media crawlers add Bluesky, Telegram and more. And people contribute: tips, links, their own findings.
- **Analysis and indexing.** Every item is looked at twice: who posted it and how it spread (actor analysis), and what it is (content analysis: AI-generated, manipulative, wrong). Web pages and social-media posts are then indexed, with both results attached, into the OURRS search service (ourrs.eu), which people and agents can query. User contributions are analysed but not indexed.
- **Services next to the index.** The SOURCE campaign analysis looks for patterns, networks and trends across the whole index. Reverse image search is a separate service.
- **The harness.** On top sits the SOURCE harness, an AI research assistant with an LLM agent at its core. It does not only use the index: it connects to the social-media platforms directly and automates analysis there, read-only. It speaks DISARM/DISRUPT, the shared framework for describing and countering influence operations, and it is shaped with the Alliance4Europe analyst community.
- **Analysts and the loop.** Analysts work with the harness. What they find goes back into the system as contributions, so the next search starts from more.
- **Institutions.** The logos show who works where; the LRZ carries all of it.

--

## What is a harness?


<div class="grid-2 gap-lg">


<div class="column">

A language model on its own can only write text. A **harness** is everything around it that turns it into a useful and safe assistant:

- the **tools** it may use: search, a browser, DISARM
- the **rules** it must follow, and a guard that enforces them
- a **memory**: the research wiki it keeps
- a **person** who decides, reviews and approves


<div class="c-note">

Think of the model as the engine, and the harness as the car around it: steering, brakes, and a driver.

</div>


</div>


<div class="column">


<div class="stack">


<div class="layer is-active">

**Analyst** *SOURCE Desk, in the browser*

</div>


<div class="layer">

**Agent** *an open-weight model on university servers*

</div>


<div class="layer">

**Tools** *search · read-only browser · DISARM · wiki*

</div>


<div class="layer">

**Evidence** *every page read is kept as proof*

</div>


</div>


</div>


</div>


Notes:
Keep it non-technical. The model is Qwen 3.6 (35B), an open-weight model hosted by the University of Passau, so no investigation data goes to a commercial AI provider. The harness runs on the analyst's own computer, in a container, under the analyst's own accounts. We operate no harness on anybody's behalf.

## DISARM / DISRUPT: a shared language for influence operations


<div class="grid-2-1 gap-lg">


<div class="column">

**DISARM** is an open framework that describes disinformation campaigns the way cybersecurity describes attacks:

- **Red**: what the attacker does, in phases, tactics and techniques ("create fake accounts", "amplify with bots", …)
- **Blue**: what defenders can do against each technique

The harness ships DISARM as data and tools: look a technique up, find the countermeasures against it, and find **past incidents** that showed the same pattern.


<div class="c-note">

**DISRUPT**, Alliance4Europe's successor to DISARM, adds the operational side: a community toolbox of measures to stop an operation, from preparing evidence to disruption and mitigation.

</div>


</div>


<div class="column">


<div class="stat-card evidence">

### 391
techniques in 16 tactics

</div>


<div class="stat-card evidence">

### 140
countermeasures

</div>


<div class="stat-card evidence">

### 129
documented incidents

</div>


</div>


</div>



<div class="slide-citation">

DISARM Foundation, DISARMframeworks (CC BY-SA 4.0) · Alliance4Europe, *DISRUPT Framework*, alliance4europe.eu/counter-disinfo/disruption-framework

</div>


Notes:
The point for a non-technical audience: a finding that says "this looks like technique T0119.002" can be understood and acted on by any team that uses DISARM, in any country. That is what makes an analysis shareable. DISRUPT is the successor of DISARM, maintained with the Alliance4Europe community; the prototype currently ships the DISARM data, and Alliance4Europe's analysts will review the guiding questions the harness asks before it picks a technique.

## Design rules of the prototype

<span class="eyebrow">Built into the harness today; to be discussed and agreed with the community</span>


<div class="grid-2 gap-lg">


<div class="column">


<div class="marks-yes">

- **Every claim cites a capture.** A check refuses wiki pages that do not.
- **DISARM codes come from the DISARM tools**, never from the model's memory.
- **Runs as you, on your machine.** What it collects stays there.
- **New skills need a human.** The agent proposes; only the analyst approves.

</div>


</div>


<div class="column">


<div class="marks-no">

- **No posting, liking, following or messaging.** The browser is read-only.
- **No passwords.** The analyst logs in by hand; the agent never sees credentials.
- **No bulk scraping.** A reading pace per platform: at least 8 s between pages, 400 a day.
- **No attribution by resemblance.** Looking like a known incident is not proof.

</div>


</div>


</div>



<div class="slide-citation">

SOURCE harness: agent brief (spec/brief.md), README, design decisions D1, D7, D32 (yoars, lane SOURCE, September 2026)

</div>


Notes:
Where each rule comes from: "every claim cites a capture", "a DISARM code comes from a DISARM tool", "a resemblance is not an attribution" and "only the researcher approves a skill" are in the agent brief (spec/brief.md). The read-only browser, logging in by hand, the reading budget (8 s between pages, 60 an hour, 400 a day) and "nobody operates it on your behalf" are in the README; the fail-closed tool guard is decision D7, skills approved by people D32. Some are enforced in code (guard, browser, budget, wiki lint), others are instructions to the agent. They are our proposal; the community should agree on them.

## Does it help? A first internal test


<div class="grid-3-2 gap-lg">


<div class="column">

An automated benchmark: DISARM documents example incidents with quoted source reporting. We gave the agent **62 of these descriptions**, with the technique codes removed, and asked which techniques each one shows.

| Model (open weights) | Exact technique | Technique family |
|---|:---:|:---:|
| Gemma 4 31B | 0.33 | 0.42 |
| Qwen 3.6 35B | 0.29 | 0.36 |
| Qwen3-Next 80B | 0.21 | 0.27 |

<span class="sidenote">Micro F1 against 309 gold codes, 26 September 2026.</span>

<div class="column">


<div class="stat-card holds">

### 0
invented codes, in every run

</div>



<div class="c-warning">

Preliminary, not yet validated by analysts. About a third right is a **helper**, not a judge; the guiding questions go to experts next, then we measure again.

</div>


</div>
