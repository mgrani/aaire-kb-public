## SOURCE

### Scalable, Open and Comprehensive Recognition of Disinformation Campaigns on the Web

Prof. Dr. Michael Granitzer  
Chair of Data Science, University of Passau

---

<!-- .slide: class="module-slide" -->

## 1. Overview

--

## SOURCE At A Glance

<p class="lead"><span class="accent">SOURCE</span> builds an open European infrastructure for detecting and analysing disinformation campaigns across web and social-media content.</p>

<div class="stat-grid small">
  <div class="stat-card">
    <h3>Core idea</h3>
    <p>Collect large-scale digital traces, analyse them with AI, and publish potential disinformation artefacts in an open database.</p>
  </div>
  <div class="stat-card">
    <h3>Infrastructure base</h3>
    <p>Extend <strong>OpenWebSearch.eu</strong> and the <strong>Open Web Index</strong> instead of depending on closed search and platform APIs.</p>
  </div>
  <div class="stat-card">
    <h3>Project structure</h3>
    <p>Five linked modules: provenance analysis, content analysis, dissemination, infrastructure, and operational use cases.</p>
  </div>
  <div class="stat-card">
    <h3>Expected result</h3>
    <p>Open data, open interfaces, reproducible workflows, and practical support for researchers, analysts, and fact-checking communities.</p>
  </div>
</div>

--

## High-Level Architecture

<div class="columns">
  <div class="column col-3">

- **Collect** web and social-media traces at scale
- **Enrich** artefacts with content signals and provenance metadata
- **Link** related content via similarity, timing, actors, and diffusion patterns
- **Expose** results through open interfaces, data services, and analyst-facing tools


<div class="soft-panel small">

SOURCE combines content-based and provenance-based evidence. The project is not just about detecting false claims, but about tracing coordinated campaigns.

</div>


  </div>

![](../../_assets/source/source-layer-cake.svg)

</div>

## 3. Goals Uni Passau

--

## Goals From The Proposal

<div class="stat-grid small">
  <div class="stat-card">
    <h3>Crawling extension</h3>
    <p>Expand the existing OpenWebSearch setup toward relevant social-media and campaign-oriented sources.</p>
  </div>
  <div class="stat-card">
    <h3>Similarity tracking</h3>
    <p>Develop scalable similarity-preserving hashing and chunking to link reused and modified content.</p>
  </div>
  <div class="stat-card">
    <h3>Provenance analysis</h3>
    <p>Model temporal diffusion, origin traces, coordination patterns, and actor networks behind campaigns.</p>
  </div>
  <div class="stat-card">
    <h3>Infrastructure integration</h3>
    <p>Operationalise the methods in shared HPC workflows, storage systems, and interoperable interfaces.</p>
  </div>
</div>

--

## Uni Passau Focus In SOURCE

<div class="columns">
  <div class="column col-3">

- extend **OWS** from web indexing to web-plus-social-media monitoring
- connect artefacts through **text similarity**, **image similarity**, and **diffusion signals**
- shift from single-item analysis to **campaign reconstruction**
- support open, reproducible, and reusable workflows for other partners


<div class="c-orange small">

The proposal already defines crawling, provenance, and infrastructure work. A practical extension is to add an explicit <strong>agent layer</strong> that automates parts of the disinformation analysis process.

</div>


  </div>
  <div class="column col-2 middle">

![](../../_assets/source/source-steckbrief-illustration-16-9.svg)

  </div>
</div>

--

## Additional Goal: Agent Layer

<div class="stat-grid small">
  <div class="stat-card">
    <h3>Collection agents</h3>
    <p>Monitor sources, trigger focused crawls, and collect supporting evidence around suspicious artefacts or narratives.</p>
  </div>
  <div class="stat-card">
    <h3>Analysis agents</h3>
    <p>Summarise provenance signals, compare near-duplicate text and images, and prepare candidate explanations for analysts.</p>
  </div>
  <div class="stat-card">
    <h3>Verification agents</h3>
    <p>Cross-check claims against known sources, prior items, and campaign patterns to prioritise artefacts for human review.</p>
  </div>
  <div class="stat-card">
    <h3>Workflow agents</h3>
    <p>Orchestrate pipelines across retrieval, hashing, graph construction, and reporting to reduce analyst overhead.</p>
  </div>
</div>


<div class="c-info small">

This agent layer fits naturally on top of OWS + OURRS + SOURCE infrastructure and turns the platform into an active analysis environment.

</div>

## 4. Next Steps

--

## Next Step 1: Crawling Data Sources

<div class="columns">
  <div class="column">

### Candidate sources

- Telegram
- Bluesky
- Instagram
- campaign-related web domains and media mirrors
- cross-platform link targets and repost chains

  </div>
  <div class="column">

### Questions

- Which sources are technically feasible and legally robust?
- Where do we have the highest value for provenance reconstruction?
- Which data can be collected continuously, not only ad hoc?
- How do we align source collection with OWS infrastructure and storage?

  </div>
</div>

--

## Next Step 2: Image Hashes For Provenance Tracking

<div class="columns">
  <div class="column col-3">

- create similarity-preserving hashes for images and image variants
- detect reposts, crops, overlays, and small manipulations
- connect images across platforms and across web pages
- use image-level links as additional provenance evidence in campaign graphs


<div class="c-green small">

Image hashing complements text-based provenance and is especially important for memes, screenshots, and reused visual assets in coordinated campaigns.

</div>


  </div>
  <div class="column col-2 middle">

![](../../_assets/source/source-steckbrief-illustration.svg)

  </div>
</div>

--

## Next Step 3: Agentic Disinformation Workflow

<div class="columns">
  <div class="column">

### Pipeline

1. detect suspicious content or narratives  
2. expand evidence through search and crawling  
3. link text and images via similarity and provenance  
4. reconstruct diffusion and actor patterns  
5. prepare analyst-facing reports and prioritised alerts

  </div>
  <div class="column">

### Outcome

- faster triage
- better cross-platform evidence collection
- reproducible analysis chains
- human-in-the-loop validation instead of black-box automation


<div class="c-info small">

The target is not a fully automatic truth machine, but an open workflow that helps analysts trace campaigns more efficiently and transparently.

</div>


  </div>
</div>
