<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 368" role="img">
<title>Bayes over a partition: the piece of B inside event E2, out of all of B</title>
<style>
  .t { font: 17px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
  .s { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #475569; }
  .h { font: 700 18px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
  .sym { font: 22px "Times New Roman", serif; fill: #164374; }
  .dot { font: 700 15px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
</style>
<rect x="0" y="0" width="800" height="368" fill="#ffffff"/>
<clipPath id="pc1"><ellipse cx="400" cy="160" rx="270" ry="80"/></clipPath>
<rect x="60" y="40" width="680" height="240" rx="12" fill="#f8fafc" stroke="#164374" stroke-width="2.5"/>
<text x="724" y="68" class="sym" text-anchor="end" >Ω</text>
<rect x="300" y="40" width="170" height="240" fill="#cdeaf1" clip-path="url(#pc1)"/>
<ellipse cx="400" cy="160" rx="270" ry="80" fill="none" stroke="#7c3aed" stroke-width="4.5"/>
<line x1="300" y1="40" x2="300" y2="280" stroke="#164374" stroke-width="2.5"/>
<line x1="470" y1="40" x2="470" y2="280" stroke="#164374" stroke-width="2.5"/>
<text x="180.0" y="30" class="h" text-anchor="middle" style="font-size:20px">E₁</text>
<text x="180.0" y="166" class="t" text-anchor="middle" >B ∩ E₁</text>
<text x="180.0" y="268" class="s" text-anchor="middle" >P(E₁) · P(B | E₁)</text>
<text x="385.0" y="30" class="h" text-anchor="middle" style="font-size:20px">E₂</text>
<text x="385.0" y="166" class="t" text-anchor="middle" >B ∩ E₂</text>
<text x="385.0" y="268" class="s" text-anchor="middle" >P(E₂) · P(B | E₂)</text>
<text x="605.0" y="30" class="h" text-anchor="middle" style="font-size:20px">E₃</text>
<text x="605.0" y="166" class="t" text-anchor="middle" >B ∩ E₃</text>
<text x="605.0" y="268" class="s" text-anchor="middle" >P(E₃) · P(B | E₃)</text>
<text x="150" y="108" class="h" text-anchor="middle" style="fill:#7c3aed;font-size:22px">B</text>
<text x="400" y="318" class="t" text-anchor="middle" style="font-size:18px">P(E₂ | B) = piece E₂ ∩ B / all of B = P(E₂) · P(B | E₂) / Σ<tspan baseline-shift="sub" font-size="70%">j</tspan> P(E<tspan baseline-shift="sub" font-size="70%">j</tspan>) · P(B | E<tspan baseline-shift="sub" font-size="70%">j</tspan>)</text>
<rect x="300" y="338" width="22" height="18" fill="#cdeaf1" stroke="#0083A1"/>
<text x="330" y="352" class="s" text-anchor="start" >counted</text>
<rect x="410" y="338" width="22" height="18" fill="none" stroke="#7c3aed" stroke-width="3"/>
<text x="440" y="352" class="s" text-anchor="start" >out of</text>
</svg>
