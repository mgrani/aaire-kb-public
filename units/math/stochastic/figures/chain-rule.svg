<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 372" role="img">
<title>The chain rule drawn to scale: each conditional keeps a share of what is left</title>
<style>
  .t { font: 17px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
  .s { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #475569; }
  .h { font: 700 18px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
  .sym { font: 22px "Times New Roman", serif; fill: #164374; }
  .dot { font: 700 15px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
</style>
<rect x="0" y="0" width="820" height="372" fill="#ffffff"/>
<text x="174" y="66" class="h" text-anchor="end" style="font-size:17px">Ω</text>
<rect x="190" y="40" width="220.0" height="40" fill="#cdeaf1" stroke="#0083A1" stroke-width="2"/>
<rect x="190" y="40" width="440" height="40" fill="none" stroke="#7c3aed" stroke-width="3.5"/>
<text x="644" y="66" class="t" text-anchor="start" >keep P(E₁) = 1/2</text>
<path d="M190 80 L190 120 M410.0 80 L410.0 120" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="174" y="146" class="h" text-anchor="end" style="font-size:17px">E₁</text>
<rect x="190" y="120" width="132.0" height="40" fill="#cdeaf1" stroke="#0083A1" stroke-width="2"/>
<rect x="190" y="120" width="220.0" height="40" fill="none" stroke="#7c3aed" stroke-width="3.5"/>
<text x="424.0" y="146" class="t" text-anchor="start" >keep P(E₂ | E₁) = 3/5</text>
<path d="M190 160 L190 200 M322.0 160 L322.0 200" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="174" y="226" class="h" text-anchor="end" style="font-size:17px">E₁ ∩ E₂</text>
<rect x="190" y="200" width="66.0" height="40" fill="#cdeaf1" stroke="#0083A1" stroke-width="2"/>
<rect x="190" y="200" width="132.0" height="40" fill="none" stroke="#7c3aed" stroke-width="3.5"/>
<text x="336.0" y="226" class="t" text-anchor="start" >keep P(E₃ | E₁ ∩ E₂) = 1/2</text>
<path d="M190 240 L190 280 M256.0 240 L256.0 280" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="174" y="306" class="h" text-anchor="end" style="font-size:17px">E₁ ∩ E₂ ∩ E₃</text>
<rect x="190" y="280" width="66.0" height="40" fill="#cdeaf1" stroke="#0083A1" stroke-width="3"/>
<text x="270.0" y="306" class="t" text-anchor="start" >= 1/2 · 3/5 · 1/2 = 3/20 of Ω</text>
<rect x="320" y="342" width="22" height="18" fill="#cdeaf1" stroke="#0083A1"/>
<text x="350" y="356" class="s" text-anchor="start" >counted</text>
<rect x="430" y="342" width="22" height="18" fill="none" stroke="#7c3aed" stroke-width="3"/>
<text x="460" y="356" class="s" text-anchor="start" >out of</text>
</svg>
