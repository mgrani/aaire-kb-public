<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" role="img">
<title>Sample spaces of one and two coin flips, with an event shaded</title>
<style>
  .t { font: 17px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
  .s { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #475569; }
  .h { font: 700 18px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
  .sym { font: 22px "Times New Roman", serif; fill: #164374; }
  .dot { font: 700 15px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
</style>
<rect x="0" y="0" width="960" height="290" fill="#ffffff"/>
<text x="190" y="32" class="h" text-anchor="middle" >One coin flip</text>
<rect x="40" y="50" width="300" height="130" rx="10" fill="#f8fafc" stroke="#164374" stroke-width="2"/>
<text x="326" y="74" class="sym" text-anchor="end" >Ω</text>
<rect x="70" y="80" width="90" height="80" rx="20" fill="#cdeaf1" stroke="#0083A1" stroke-width="2.5"/>
<text x="78" y="98" class="h" text-anchor="start" style="fill:#0083A1;font-size:15px">E</text>
<circle cx="115" cy="125" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="115" y="132" class="dot" text-anchor="middle" style="font-size:20px">H</text>
<circle cx="255" cy="125" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="255" y="132" class="dot" text-anchor="middle" style="font-size:20px">T</text>
<text x="190" y="212" class="t" text-anchor="middle" >E = {H}: "heads"</text>
<text x="190" y="238" class="s" text-anchor="middle" >all events: ∅, {H}, {T}, {H, T}</text>
<text x="650" y="32" class="h" text-anchor="middle" >Two coin flips</text>
<text x="510" y="150" class="s" text-anchor="middle" transform="rotate(-90 510 150)">1st</text>
<text x="650" y="50" class="s" text-anchor="middle" >2nd</text>
<text x="542" y="111.0" class="dot" text-anchor="middle" >H</text>
<rect x="560" y="60" width="90" height="90" fill="#cdeaf1" stroke="#164374" stroke-width="2"/>
<text x="605.0" y="111.0" class="dot" text-anchor="middle" style="font-size:18px">HH</text>
<rect x="650" y="60" width="90" height="90" fill="#cdeaf1" stroke="#164374" stroke-width="2"/>
<text x="695.0" y="111.0" class="dot" text-anchor="middle" style="font-size:18px">HT</text>
<text x="542" y="201.0" class="dot" text-anchor="middle" >T</text>
<rect x="560" y="150" width="90" height="90" fill="#cdeaf1" stroke="#164374" stroke-width="2"/>
<text x="605.0" y="201.0" class="dot" text-anchor="middle" style="font-size:18px">TH</text>
<rect x="650" y="150" width="90" height="90" fill="#f8fafc" stroke="#164374" stroke-width="2"/>
<text x="695.0" y="201.0" class="dot" text-anchor="middle" style="font-size:18px">TT</text>
<text x="605.0" y="262" class="dot" text-anchor="middle" >H</text>
<text x="695.0" y="262" class="dot" text-anchor="middle" >T</text>
<rect x="770" y="70" width="22" height="22" fill="#cdeaf1" stroke="#164374"/>
<text x="800" y="87" class="t" text-anchor="start" >"at least one head"</text>
<text x="800" y="110" class="s" text-anchor="start" >= {HH, HT, TH}</text>
<text x="770" y="170" class="t" text-anchor="start" >4 outcomes</text>
<text x="770" y="194" class="s" text-anchor="start" >2⁴ = 16 possible events</text>
</svg>
