<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" role="img">
<title>Sample spaces of one and two coin flips, as sets and as a grid, with an event shaded</title>
<style>
  .t { font: 17px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
  .s { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #475569; }
  .h { font: 700 18px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
  .sym { font: 22px "Times New Roman", serif; fill: #164374; }
  .dot { font: 700 15px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
</style>
<rect x="0" y="0" width="960" height="310" fill="#ffffff"/>
<text x="140" y="32" class="h" text-anchor="middle" >One coin flip</text>
<rect x="20" y="60" width="240" height="130" rx="10" fill="#f8fafc" stroke="#164374" stroke-width="2"/>
<text x="246" y="86" class="sym" text-anchor="end" >Ω</text>
<rect x="51" y="94" width="68" height="68" rx="27.200000000000003" fill="#cdeaf1" stroke="#0083A1" stroke-width="2.5"/>
<circle cx="85" cy="128" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="85" y="135" class="dot" text-anchor="middle" style="font-size:20px">H</text>
<circle cx="195" cy="128" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="195" y="135" class="dot" text-anchor="middle" style="font-size:20px">T</text>
<text x="140" y="222" class="t" text-anchor="middle" >E = {H}: "heads"</text>
<text x="140" y="246" class="s" text-anchor="middle" >events: ∅, {H}, {T}, {H, T}</text>
<text x="440.0" y="32" class="h" text-anchor="middle" >Two coin flips: the set</text>
<rect x="300" y="46" width="280" height="190" rx="10" fill="#f8fafc" stroke="#164374" stroke-width="2"/>
<text x="566" y="72" class="sym" text-anchor="end" >Ω</text>
<path d="M383.6 74 H496.4 A25.6 25.6 0 0 1 522 99.6 V128.4 A25.6 25.6 0 0 1 496.4 154 H483.6 A25.6 25.6 0 0 0 458 179.6 V192.4 A25.6 25.6 0 0 1 432.4 218 H383.6 A25.6 25.6 0 0 1 358 192.4 V99.6 A25.6 25.6 0 0 1 383.6 74 Z" fill="#cdeaf1" stroke="#0083A1" stroke-width="2.5"/>
<g><circle cx="390" cy="106" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="390" y="112" class="dot" text-anchor="middle" style="font-size:16px">HH</text></g>
<g><circle cx="490" cy="106" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="490" y="112" class="dot" text-anchor="middle" style="font-size:16px">HT</text></g>
<g><circle cx="390" cy="186" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="390" y="192" class="dot" text-anchor="middle" style="font-size:16px">TH</text></g>
<g><circle cx="490" cy="186" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="490" y="192" class="dot" text-anchor="middle" style="font-size:16px">TT</text></g>
<text x="440" y="266" class="t" text-anchor="middle" >E = {HH, HT, TH}: "at least one head"</text>
<text x="440" y="290" class="s" text-anchor="middle" >4 outcomes, 2⁴ = 16 events</text>
<text x="780" y="32" class="h" text-anchor="middle" >… as a grid: 1st × 2nd</text>
<text x="650" y="150" class="s" text-anchor="middle" transform="rotate(-90 650 150)">1st</text>
<text x="674" y="111.0" class="dot" text-anchor="middle" >H</text>
<rect x="690" y="60" width="90" height="90" fill="#cdeaf1" stroke="#164374" stroke-width="2"/>
<text x="735.0" y="111.0" class="dot" text-anchor="middle" style="font-size:18px">HH</text>
<rect x="780" y="60" width="90" height="90" fill="#cdeaf1" stroke="#164374" stroke-width="2"/>
<text x="825.0" y="111.0" class="dot" text-anchor="middle" style="font-size:18px">HT</text>
<text x="674" y="201.0" class="dot" text-anchor="middle" >T</text>
<rect x="690" y="150" width="90" height="90" fill="#cdeaf1" stroke="#164374" stroke-width="2"/>
<text x="735.0" y="201.0" class="dot" text-anchor="middle" style="font-size:18px">TH</text>
<rect x="780" y="150" width="90" height="90" fill="#f8fafc" stroke="#164374" stroke-width="2"/>
<text x="825.0" y="201.0" class="dot" text-anchor="middle" style="font-size:18px">TT</text>
<text x="735.0" y="262" class="dot" text-anchor="middle" >H</text>
<text x="825.0" y="262" class="dot" text-anchor="middle" >T</text>
<text x="780" y="50" class="s" text-anchor="middle" >2nd</text>
<text x="882" y="80" class="sym" text-anchor="start" >Ω</text>
<path d="M690 60 H870 V150 H780 V240 H690 Z" fill="none" stroke="#0083A1" stroke-width="3.5"/>
<text x="780" y="290" class="s" text-anchor="middle" >same outcomes, arranged by flip</text>
</svg>
