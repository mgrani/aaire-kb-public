<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img">
<title>Conditioning on B gives a new probability measure: the three axioms hold inside B</title>
<style>
  .t { font: 17px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
  .s { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #475569; }
  .h { font: 700 18px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
  .sym { font: 22px "Times New Roman", serif; fill: #164374; }
  .dot { font: 700 15px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
</style>
<rect x="0" y="0" width="900" height="330" fill="#ffffff"/>
<clipPath id="cwi"><circle cx="130" cy="150" r="95"/></clipPath>
<circle cx="130" cy="150" r="95" fill="#f8fafc"/>
<circle cx="130" cy="150" r="0" fill="none"/><rect x="130" y="0" width="300" height="400" fill="#cdeaf1" stroke="#0083A1" stroke-width="2" clip-path="url(#cwi)"/>
<text x="175" y="158" class="h" text-anchor="middle" style="fill:#0083A1;font-size:17px">E ∩ B</text>
<circle cx="130" cy="150" r="95" fill="none" stroke="#7c3aed" stroke-width="4.5"/>
<text x="212" y="72" class="h" text-anchor="middle" style="fill:#164374;font-size:20px">B</text>
<text x="130" y="285" class="t" text-anchor="middle" >Axiom I:  P<tspan baseline-shift="sub" font-size="70%">B</tspan>(E) ≥ 0</text>
<text x="130" y="308" class="s" text-anchor="middle" >a piece of B is never negative</text>
<clipPath id="cwii"><circle cx="430" cy="150" r="95"/></clipPath>
<circle cx="430" cy="150" r="95" fill="#f8fafc"/>
<circle cx="430" cy="150" r="95" fill="#cdeaf1"/>
<text x="430" y="158" class="h" text-anchor="middle" style="fill:#0083A1;font-size:17px">Ω ∩ B = B</text>
<circle cx="430" cy="150" r="95" fill="none" stroke="#7c3aed" stroke-width="4.5"/>
<text x="512" y="72" class="h" text-anchor="middle" style="fill:#164374;font-size:20px">B</text>
<text x="430" y="285" class="t" text-anchor="middle" >Axiom II:  P<tspan baseline-shift="sub" font-size="70%">B</tspan>(Ω) = 1</text>
<text x="430" y="308" class="s" text-anchor="middle" >all of B is the whole world</text>
<clipPath id="cwiii"><circle cx="730" cy="150" r="95"/></clipPath>
<circle cx="730" cy="150" r="95" fill="#f8fafc"/>
<rect x="0" y="0" width="730" height="150" fill="#cdeaf1" stroke="#0083A1" stroke-width="2" clip-path="url(#cwiii)"/><rect x="730" y="150" width="300" height="300" fill="#cdeaf1" stroke="#0083A1" stroke-width="2" clip-path="url(#cwiii)"/>
<text x="690" y="120" class="h" text-anchor="middle" style="fill:#0083A1;font-size:17px">E₁</text>

<text x="772" y="200" class="h" text-anchor="middle" style="fill:#0083A1;font-size:17px">E₂</text>
<circle cx="730" cy="150" r="95" fill="none" stroke="#7c3aed" stroke-width="4.5"/>
<text x="812" y="72" class="h" text-anchor="middle" style="fill:#164374;font-size:20px">B</text>
<text x="730" y="285" class="t" text-anchor="middle" >Axiom III:  P<tspan baseline-shift="sub" font-size="70%">B</tspan>(E₁ ∪ E₂) = P<tspan baseline-shift="sub" font-size="70%">B</tspan>(E₁) + P<tspan baseline-shift="sub" font-size="70%">B</tspan>(E₂)</text>
<text x="730" y="308" class="s" text-anchor="middle" >disjoint pieces of B add up</text>
<text x="450" y="22" class="s" text-anchor="middle" >P<tspan baseline-shift="sub" font-size="70%">B</tspan>(E) = P(E ∩ B) / P(B): every event E is measured by its piece inside B</text>
</svg>
