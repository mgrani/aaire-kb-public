<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img">
<title>The eight events of a three-sided die ordered by inclusion, and how the count grows</title>
<style>
  .t { font: 17px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
  .s { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #475569; }
  .h { font: 700 18px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
  .sym { font: 22px "Times New Roman", serif; fill: #164374; }
  .dot { font: 700 15px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
</style>
<rect x="0" y="0" width="960" height="390" fill="#ffffff"/>
<line x1="300.0" y1="332" x2="150.0" y2="268" stroke="#94a3b8" stroke-width="2"/>
<line x1="300.0" y1="332" x2="300.0" y2="268" stroke="#94a3b8" stroke-width="2"/>
<line x1="300.0" y1="332" x2="450.0" y2="268" stroke="#94a3b8" stroke-width="2"/>
<line x1="150.0" y1="232" x2="150.0" y2="168" stroke="#94a3b8" stroke-width="2"/>
<line x1="150.0" y1="232" x2="300.0" y2="168" stroke="#94a3b8" stroke-width="2"/>
<line x1="300.0" y1="232" x2="150.0" y2="168" stroke="#94a3b8" stroke-width="2"/>
<line x1="300.0" y1="232" x2="450.0" y2="168" stroke="#94a3b8" stroke-width="2"/>
<line x1="450.0" y1="232" x2="300.0" y2="168" stroke="#94a3b8" stroke-width="2"/>
<line x1="450.0" y1="232" x2="450.0" y2="168" stroke="#94a3b8" stroke-width="2"/>
<line x1="150.0" y1="132" x2="300.0" y2="68" stroke="#94a3b8" stroke-width="2"/>
<line x1="300.0" y1="132" x2="300.0" y2="68" stroke="#94a3b8" stroke-width="2"/>
<line x1="450.0" y1="132" x2="300.0" y2="68" stroke="#94a3b8" stroke-width="2"/>
<rect x="248.0" y="332" width="104" height="36" rx="18" fill="#dbe5f0" stroke="#164374" stroke-width="2"/>
<text x="300.0" y="356" class="t" text-anchor="middle" >∅</text>
<rect x="98.0" y="232" width="104" height="36" rx="18" fill="#cdeaf1" stroke="#164374" stroke-width="2"/>
<text x="150.0" y="256" class="t" text-anchor="middle" >{1}</text>
<rect x="248.0" y="232" width="104" height="36" rx="18" fill="#cdeaf1" stroke="#164374" stroke-width="2"/>
<text x="300.0" y="256" class="t" text-anchor="middle" >{2}</text>
<rect x="398.0" y="232" width="104" height="36" rx="18" fill="#cdeaf1" stroke="#164374" stroke-width="2"/>
<text x="450.0" y="256" class="t" text-anchor="middle" >{3}</text>
<rect x="98.0" y="132" width="104" height="36" rx="18" fill="#f8fafc" stroke="#164374" stroke-width="2"/>
<text x="150.0" y="156" class="t" text-anchor="middle" >{1, 2}</text>
<rect x="248.0" y="132" width="104" height="36" rx="18" fill="#f8fafc" stroke="#164374" stroke-width="2"/>
<text x="300.0" y="156" class="t" text-anchor="middle" >{1, 3}</text>
<rect x="398.0" y="132" width="104" height="36" rx="18" fill="#f8fafc" stroke="#164374" stroke-width="2"/>
<text x="450.0" y="156" class="t" text-anchor="middle" >{2, 3}</text>
<rect x="248.0" y="32" width="104" height="36" rx="18" fill="#dbe5f0" stroke="#164374" stroke-width="2"/>
<text x="300.0" y="56" class="t" text-anchor="middle" >{1, 2, 3}</text>
<text x="700" y="70" class="h" text-anchor="start" >|Ω| = n  →  2ⁿ events</text>
<text x="760" y="110" class="t" text-anchor="end" >1</text>
<text x="790" y="110" class="t" text-anchor="start" >2</text>
<text x="760" y="146" class="t" text-anchor="end" >2</text>
<text x="790" y="146" class="t" text-anchor="start" >4</text>
<text x="760" y="182" class="t" text-anchor="end" >3</text>
<text x="790" y="182" class="t" text-anchor="start" >8</text>
<text x="760" y="218" class="t" text-anchor="end" >6</text>
<text x="790" y="218" class="t" text-anchor="start" >64</text>
<text x="760" y="254" class="t" text-anchor="end" >10</text>
<text x="790" y="254" class="t" text-anchor="start" >1,024</text>
<text x="760" y="290" class="t" text-anchor="end" >20</text>
<text x="790" y="290" class="t" text-anchor="start" >1,048,576</text>
<text x="700" y="350" class="s" text-anchor="start" >lines: one element added</text>
</svg>
