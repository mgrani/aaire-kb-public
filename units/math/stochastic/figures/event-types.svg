<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img">
<title>Six event types drawn on the sample space of a die</title>
<style>
  .t { font: 17px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
  .s { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #475569; }
  .h { font: 700 18px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
  .sym { font: 22px "Times New Roman", serif; fill: #164374; }
  .dot { font: 700 15px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
</style>
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
<rect x="25" y="20" width="250" height="130" rx="10" fill="#f8fafc" stroke="#164374" stroke-width="2"/>
<text x="261" y="44" class="sym" text-anchor="end" >Ω</text>
<circle cx="80" cy="65" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="80" y="70" class="dot" text-anchor="middle" >1</text>
<circle cx="150" cy="65" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="150" y="70" class="dot" text-anchor="middle" >2</text>
<circle cx="220" cy="65" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="220" y="70" class="dot" text-anchor="middle" >3</text>
<circle cx="80" cy="115" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="80" y="120" class="dot" text-anchor="middle" >4</text>
<circle cx="150" cy="115" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="150" y="120" class="dot" text-anchor="middle" >5</text>
<circle cx="220" cy="115" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="220" y="120" class="dot" text-anchor="middle" >6</text>
<text x="150.0" y="180" class="sym" text-anchor="middle" >∅</text>
<text x="150.0" y="204" class="t" text-anchor="middle" >impossible event</text>
<text x="150.0" y="224" class="s" text-anchor="middle" >no outcome belongs to it</text>
<rect x="345" y="20" width="250" height="130" rx="10" fill="#cdeaf1" stroke="#164374" stroke-width="2"/>
<text x="581" y="44" class="sym" text-anchor="end" >Ω</text>
<circle cx="400" cy="65" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="400" y="70" class="dot" text-anchor="middle" >1</text>
<circle cx="470" cy="65" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="470" y="70" class="dot" text-anchor="middle" >2</text>
<circle cx="540" cy="65" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="540" y="70" class="dot" text-anchor="middle" >3</text>
<circle cx="400" cy="115" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="400" y="120" class="dot" text-anchor="middle" >4</text>
<circle cx="470" cy="115" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="470" y="120" class="dot" text-anchor="middle" >5</text>
<circle cx="540" cy="115" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="540" y="120" class="dot" text-anchor="middle" >6</text>
<text x="470.0" y="180" class="sym" text-anchor="middle" >Ω</text>
<text x="470.0" y="204" class="t" text-anchor="middle" >certain event</text>
<text x="470.0" y="224" class="s" text-anchor="middle" >every outcome belongs to it</text>
<rect x="665" y="20" width="250" height="130" rx="10" fill="#cdeaf1" stroke="#164374" stroke-width="2"/>
<text x="901" y="44" class="sym" text-anchor="end" >Ω</text>
<rect x="702" y="33" width="106" height="50" rx="18" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
<rect x="702" y="33" width="106" height="50" rx="18" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
<text x="712" y="49" class="h" text-anchor="start" style="fill:#164374;font-size:15px">A</text>
<circle cx="720" cy="65" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="720" y="70" class="dot" text-anchor="middle" >1</text>
<circle cx="790" cy="65" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="790" y="70" class="dot" text-anchor="middle" >2</text>
<circle cx="860" cy="65" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="860" y="70" class="dot" text-anchor="middle" >3</text>
<circle cx="720" cy="115" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="720" y="120" class="dot" text-anchor="middle" >4</text>
<circle cx="790" cy="115" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="790" y="120" class="dot" text-anchor="middle" >5</text>
<circle cx="860" cy="115" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="860" y="120" class="dot" text-anchor="middle" >6</text>
<text x="790.0" y="180" class="sym" text-anchor="middle" >Ā = Ω ∖ A</text>
<text x="790.0" y="204" class="t" text-anchor="middle" >complementary event</text>
<text x="790.0" y="224" class="s" text-anchor="middle" >A = {1, 2},  Ā = {3, 4, 5, 6}</text>
<rect x="25" y="270" width="250" height="130" rx="10" fill="#f8fafc" stroke="#164374" stroke-width="2"/>
<text x="261" y="294" class="sym" text-anchor="end" >Ω</text>
<rect x="132" y="333" width="36" height="50" rx="18" fill="#cdeaf1" stroke="#0083A1" stroke-width="2.5"/>
<text x="142" y="349" class="h" text-anchor="start" style="fill:#0083A1;font-size:15px"></text>
<circle cx="80" cy="315" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="80" y="320" class="dot" text-anchor="middle" >1</text>
<circle cx="150" cy="315" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="150" y="320" class="dot" text-anchor="middle" >2</text>
<circle cx="220" cy="315" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="220" y="320" class="dot" text-anchor="middle" >3</text>
<circle cx="80" cy="365" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="80" y="370" class="dot" text-anchor="middle" >4</text>
<circle cx="150" cy="365" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="150" y="370" class="dot" text-anchor="middle" >5</text>
<circle cx="220" cy="365" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="220" y="370" class="dot" text-anchor="middle" >6</text>
<text x="150.0" y="430" class="sym" text-anchor="middle" >|A| = 1</text>
<text x="150.0" y="454" class="t" text-anchor="middle" >elementary event</text>
<text x="150.0" y="474" class="s" text-anchor="middle" >A = {5}: one outcome</text>
<rect x="345" y="270" width="250" height="130" rx="10" fill="#f8fafc" stroke="#164374" stroke-width="2"/>
<text x="581" y="294" class="sym" text-anchor="end" >Ω</text>
<rect x="374" y="273" width="122" height="118" rx="26" fill="#dbe5f0" stroke="#164374" stroke-width="2.5"/>
<text x="369" y="345.0" class="h" text-anchor="end" style="fill:#164374;font-size:15px">B</text>
<rect x="382" y="283" width="106" height="50" rx="18" fill="#cdeaf1" stroke="#0083A1" stroke-width="2.5"/>
<text x="478" y="299" class="h" text-anchor="end" style="fill:#0083A1;font-size:15px">A</text>
<circle cx="400" cy="315" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="400" y="320" class="dot" text-anchor="middle" >1</text>
<circle cx="470" cy="315" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="470" y="320" class="dot" text-anchor="middle" >2</text>
<circle cx="540" cy="315" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="540" y="320" class="dot" text-anchor="middle" >3</text>
<circle cx="400" cy="365" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="400" y="370" class="dot" text-anchor="middle" >4</text>
<circle cx="470" cy="365" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="470" y="370" class="dot" text-anchor="middle" >5</text>
<circle cx="540" cy="365" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="540" y="370" class="dot" text-anchor="middle" >6</text>
<text x="470.0" y="430" class="sym" text-anchor="middle" >A ⊆ B</text>
<text x="470.0" y="454" class="t" text-anchor="middle" >A entails B</text>
<text x="470.0" y="474" class="s" text-anchor="middle" >A = {1, 2},  B = {1, 2, 4, 5}</text>
<rect x="665" y="270" width="250" height="130" rx="10" fill="#f8fafc" stroke="#164374" stroke-width="2"/>
<text x="901" y="294" class="sym" text-anchor="end" >Ω</text>
<rect x="702" y="283" width="106" height="50" rx="18" fill="#cdeaf1" stroke="#0083A1" stroke-width="2.5"/>
<text x="712" y="299" class="h" text-anchor="start" style="fill:#0083A1;font-size:15px">A</text>
<rect x="842" y="283" width="36" height="100" rx="18" fill="#e9e1fb" stroke="#7c3aed" stroke-width="2.5"/>
<text x="852" y="299" class="h" text-anchor="start" style="fill:#7c3aed;font-size:15px">B</text>
<circle cx="720" cy="315" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="720" y="320" class="dot" text-anchor="middle" >1</text>
<circle cx="790" cy="315" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="790" y="320" class="dot" text-anchor="middle" >2</text>
<circle cx="860" cy="315" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="860" y="320" class="dot" text-anchor="middle" >3</text>
<circle cx="720" cy="365" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="720" y="370" class="dot" text-anchor="middle" >4</text>
<circle cx="790" cy="365" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="790" y="370" class="dot" text-anchor="middle" >5</text>
<circle cx="860" cy="365" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="860" y="370" class="dot" text-anchor="middle" >6</text>
<text x="790.0" y="430" class="sym" text-anchor="middle" >A ∩ B = ∅</text>
<text x="790.0" y="454" class="t" text-anchor="middle" >incompatible events</text>
<text x="790.0" y="474" class="s" text-anchor="middle" >A = {1, 2},  B = {3, 6}</text>
</svg>
