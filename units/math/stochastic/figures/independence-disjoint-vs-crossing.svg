<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img">
<title>Three sample spaces drawn as rectangles, A and B each of area 0.4. (a) A and B are disjoint vertical strips. (b) A is a vertical strip and B a horizontal strip across the whole width, crossing in an area of 0.16. (c) A is a vertical strip and B a block that also crosses it, but only in an area of 0.1</title>
<style>
  .t { font: 16px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
  .h { font: 700 18px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
  .sym { font: 22px "Times New Roman", serif; fill: #164374; }
</style>
<defs>
  <clipPath id="om1"><rect x="20" y="50" width="260" height="170" rx="12"/></clipPath>
  <clipPath id="om2"><rect x="320" y="50" width="260" height="170" rx="12"/></clipPath>
  <clipPath id="om3"><rect x="620" y="50" width="260" height="170" rx="12"/></clipPath>
</defs>
<rect x="0" y="0" width="900" height="290" fill="#ffffff"/>

<text x="150" y="30" class="h" text-anchor="middle">(a) disjoint</text>
<rect x="20" y="50" width="260" height="170" rx="12" fill="#f8fafc"/>
<g clip-path="url(#om1)">
  <rect x="20" y="50" width="104" height="170" fill="#0083A1" fill-opacity="0.35" stroke="#0083A1" stroke-width="2.5"/>
  <rect x="176" y="50" width="104" height="170" fill="#164374" fill-opacity="0.25" stroke="#164374" stroke-width="2.5"/>
</g>
<rect x="20" y="50" width="260" height="170" rx="12" fill="none" stroke="#164374" stroke-width="2"/>
<text x="72" y="143" class="h" text-anchor="middle" style="fill:#0083A1;font-size:24px">A</text>
<text x="228" y="143" class="h" text-anchor="middle" style="fill:#164374;font-size:24px">B</text>
<text x="150" y="143" class="sym" text-anchor="middle">Ω</text>

<text x="450" y="30" class="h" text-anchor="middle">(b) crossing</text>
<rect x="320" y="50" width="260" height="170" rx="12" fill="#f8fafc"/>
<g clip-path="url(#om2)">
  <rect x="320" y="50" width="104" height="170" fill="#0083A1" fill-opacity="0.35" stroke="#0083A1" stroke-width="2.5"/>
  <rect x="320" y="50" width="260" height="68" fill="#164374" fill-opacity="0.25" stroke="#164374" stroke-width="2.5"/>
</g>
<rect x="320" y="50" width="260" height="170" rx="12" fill="none" stroke="#164374" stroke-width="2"/>
<text x="372" y="178" class="h" text-anchor="middle" style="fill:#0083A1;font-size:24px">A</text>
<text x="502" y="92" class="h" text-anchor="middle" style="fill:#164374;font-size:24px">B</text>
<text x="502" y="178" class="sym" text-anchor="middle">Ω</text>

<text x="750" y="30" class="h" text-anchor="middle">(c) crossing</text>
<rect x="620" y="50" width="260" height="170" rx="12" fill="#f8fafc"/>
<g clip-path="url(#om3)">
  <rect x="620" y="50" width="104" height="170" fill="#0083A1" fill-opacity="0.35" stroke="#0083A1" stroke-width="2.5"/>
  <rect x="672" y="50" width="208" height="85" fill="#164374" fill-opacity="0.25" stroke="#164374" stroke-width="2.5"/>
</g>
<rect x="620" y="50" width="260" height="170" rx="12" fill="none" stroke="#164374" stroke-width="2"/>
<text x="672" y="186" class="h" text-anchor="middle" style="fill:#0083A1;font-size:24px">A</text>
<text x="802" y="100" class="h" text-anchor="middle" style="fill:#164374;font-size:24px">B</text>
<text x="802" y="186" class="sym" text-anchor="middle">Ω</text>

<text x="450" y="268" class="t" text-anchor="middle">In all three: P(A) = P(B) = 0.4</text>
</svg>
