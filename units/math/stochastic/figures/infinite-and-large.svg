<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img">
<title>A continuous sample space for a dosage and the orderings of a seven-team race</title>
<style>
  .t { font: 17px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
  .s { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #475569; }
  .h { font: 700 18px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
  .sym { font: 22px "Times New Roman", serif; fill: #164374; }
  .dot { font: 700 15px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
</style>
<rect x="0" y="0" width="960" height="260" fill="#ffffff"/>
<text x="230" y="32" class="h" text-anchor="middle" >Dosage of a drug: Ω = (0, ∞)</text>
<line x1="40" y1="120" x2="420" y2="120" stroke="#164374" stroke-width="2.5"/>
<path d="M420 113 L434 120 L420 127 Z" fill="#164374"/>
<circle cx="40" cy="120" r="6" fill="#ffffff" stroke="#164374" stroke-width="2.5"/>
<rect x="115" y="110" width="75" height="20" rx="4" fill="#cdeaf1" stroke="#0083A1" stroke-width="2"/>
<line x1="40" y1="130" x2="40" y2="136" stroke="#164374" stroke-width="1.5"/>
<text x="40" y="154" class="s" text-anchor="middle" >0</text>
<line x1="115" y1="130" x2="115" y2="136" stroke="#164374" stroke-width="1.5"/>
<text x="115" y="154" class="s" text-anchor="middle" >5</text>
<line x1="190" y1="130" x2="190" y2="136" stroke="#164374" stroke-width="1.5"/>
<text x="190" y="154" class="s" text-anchor="middle" >10</text>
<line x1="265" y1="130" x2="265" y2="136" stroke="#164374" stroke-width="1.5"/>
<text x="265" y="154" class="s" text-anchor="middle" >15</text>
<line x1="340" y1="130" x2="340" y2="136" stroke="#164374" stroke-width="1.5"/>
<text x="340" y="154" class="s" text-anchor="middle" >20</text>
<text x="430" y="154" class="s" text-anchor="start" >mg</text>
<text x="152.5" y="98" class="t" text-anchor="middle" >event: 5 to 10 mg</text>
<text x="230" y="205" class="s" text-anchor="middle" >uncountably many outcomes — probability</text>
<text x="230" y="225" class="s" text-anchor="middle" >can only live on intervals, not on points</text>
<text x="720" y="32" class="h" text-anchor="middle" >Race with 7 teams: all orderings</text>
<circle cx="555" cy="75" r="18" fill="#cdeaf1" stroke="#0083A1" stroke-width="2.5"/>
<text x="555" y="80" class="dot" text-anchor="middle" >3</text>
<circle cx="603" cy="75" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="603" y="80" class="dot" text-anchor="middle" >1</text>
<circle cx="651" cy="75" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="651" y="80" class="dot" text-anchor="middle" >7</text>
<circle cx="699" cy="75" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="699" y="80" class="dot" text-anchor="middle" >2</text>
<circle cx="747" cy="75" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
