<text x="843" y="80" class="dot" text-anchor="middle" >6</text>
<circle cx="555" cy="123" r="18" fill="#cdeaf1" stroke="#0083A1" stroke-width="2.5"/>
<text x="555" y="128" class="dot" text-anchor="middle" >3</text>
<circle cx="603" cy="123" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="603" y="128" class="dot" text-anchor="middle" >5</text>
<circle cx="651" cy="123" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="651" y="128" class="dot" text-anchor="middle" >1</text>
<circle cx="699" cy="123" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="699" y="128" class="dot" text-anchor="middle" >7</text>
<circle cx="747" cy="123" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="747" y="128" class="dot" text-anchor="middle" >6</text>
<circle cx="795" cy="123" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="795" y="128" class="dot" text-anchor="middle" >2</text>
<circle cx="843" cy="123" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="843" y="128" class="dot" text-anchor="middle" >4</text>
<circle cx="555" cy="171" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="555" y="176" class="dot" text-anchor="middle" >6</text>
<circle cx="603" cy="171" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="603" y="176" class="dot" text-anchor="middle" >2</text>
<circle cx="651" cy="171" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="651" y="176" class="dot" text-anchor="middle" >4</text>
<circle cx="699" cy="171" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="699" y="176" class="dot" text-anchor="middle" >1</text>
<circle cx="747" cy="171" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="747" y="176" class="dot" text-anchor="middle" >3</text>
<circle cx="795" cy="171" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="795" y="176" class="dot" text-anchor="middle" >7</text>
<circle cx="843" cy="171" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="843" y="176" class="dot" text-anchor="middle" >5</text>
<text x="699" y="213" class="t" text-anchor="middle" >⋮</text>
<text x="720" y="238" class="s" text-anchor="middle" >7! = 5,040 outcomes; shaded: the event "team 3 wins"</text>
</svg>
