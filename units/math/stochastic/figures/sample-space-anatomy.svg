<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" role="img">
<title>A sample space as a set: outcomes are elements, an event is a subset</title>
<style>
  .t { font: 17px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
  .s { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #475569; }
  .h { font: 700 18px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
  .sym { font: 22px "Times New Roman", serif; fill: #164374; }
  .dot { font: 700 15px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
</style>
<rect x="0" y="0" width="400" height="420" fill="#ffffff"/>
<rect x="20" y="30" width="300" height="230" rx="12" fill="#f8fafc" stroke="#164374" stroke-width="2.5"/>
<text x="304" y="60" class="sym" text-anchor="end" >Ω</text>
<rect x="44" y="151" width="252" height="68" rx="26" fill="#cdeaf1" stroke="#0083A1" stroke-width="2.5"/>
<text x="50" y="243" class="h" text-anchor="start" style="fill:#0083A1;font-size:22px">A</text>
<circle cx="80" cy="100" r="24" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="80" y="107" class="dot" text-anchor="middle" style="font-size:20px">1</text>
<circle cx="170" cy="100" r="24" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="170" y="107" class="dot" text-anchor="middle" style="font-size:20px">2</text>
<circle cx="260" cy="100" r="24" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="260" y="107" class="dot" text-anchor="middle" style="font-size:20px">3</text>
<circle cx="80" cy="185" r="24" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="80" y="192" class="dot" text-anchor="middle" style="font-size:20px">4</text>
<circle cx="170" cy="185" r="24" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="170" y="192" class="dot" text-anchor="middle" style="font-size:20px">5</text>
<circle cx="260" cy="185" r="24" fill="#ffffff" stroke="#0f172a" stroke-width="3.5"/>
<text x="260" y="192" class="dot" text-anchor="middle" style="font-size:20px">6</text>
<text x="262" y="243" class="sym" text-anchor="middle" style="font-size:26px">ω</text>
<text x="20" y="300" class="h" text-anchor="start" style="font-size:19px">Ω</text>
<text x="150" y="300" class="t" text-anchor="start" style="font-size:18px">sample space: all outcomes</text>
<text x="20" y="332" class="h" text-anchor="start" style="font-size:19px">ω = 6</text>
<text x="150" y="332" class="t" text-anchor="start" style="font-size:18px">an outcome: an element</text>
<text x="20" y="364" class="h" text-anchor="start" style="font-size:19px">A = {4, 5, 6}</text>
<text x="150" y="364" class="t" text-anchor="start" style="font-size:18px">an event: a subset</text>
<text x="20" y="404" class="t" text-anchor="start" style="font-size:18px">ω ∈ A: the event "at least 4" occurs</text>
</svg>
