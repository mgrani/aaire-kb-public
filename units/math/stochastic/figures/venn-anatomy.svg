<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img">
<title>Anatomy of a Venn diagram: sample space, two events and their regions</title>
<style>
  .t { font: 17px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
  .s { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #475569; }
  .h { font: 700 18px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
  .sym { font: 22px "Times New Roman", serif; fill: #164374; }
  .dot { font: 700 15px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
</style>
<rect x="0" y="0" width="800" height="340" fill="#ffffff"/>
<rect x="120" y="20" width="560" height="300" rx="12" fill="#f8fafc" stroke="#164374" stroke-width="2.5"/>
<text x="662" y="50" class="sym" text-anchor="end" >Ω</text>
<circle cx="330" cy="170" r="110" fill="#cdeaf1" fill-opacity="0.8" stroke="#0083A1" stroke-width="2.5"/>
<circle cx="470" cy="170" r="110" fill="#dbe5f0" fill-opacity="0.8" stroke="#164374" stroke-width="2.5"/>
<text x="280" y="110" class="h" text-anchor="middle" style="fill:#0083A1;font-size:22px">A</text>
<text x="520" y="110" class="h" text-anchor="middle" style="fill:#164374;font-size:22px">B</text>
<text x="275" y="178" class="t" text-anchor="middle" >A ∖ B</text>
<text x="400" y="178" class="t" text-anchor="middle" >A ∩ B</text>
<text x="525" y="178" class="t" text-anchor="middle" >B ∖ A</text>
<text x="400" y="305" class="s" text-anchor="middle" >outside both: the complement of A ∪ B</text>
</svg>
