<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" role="img">
<title>Bayes' theorem on a Venn diagram: the same overlap divided by B or by A</title>
<style>
  .t { font: 17px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
  .s { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #475569; }
  .h { font: 700 18px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
  .sym { font: 22px "Times New Roman", serif; fill: #164374; }
  .dot { font: 700 15px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
</style>
<rect x="0" y="0" width="900" height="372" fill="#ffffff"/>
<text x="200" y="30" class="h" text-anchor="middle" >P(A | B): the overlap out of B</text>
<rect x="20" y="50" width="360" height="230" rx="12" fill="#f8fafc" stroke="#164374" stroke-width="2"/>
<text x="364" y="78" class="sym" text-anchor="end" >Ω</text>
<clipPath id="clipB3"><circle cx="250" cy="165" r="85"/></clipPath>
<circle cx="150" cy="165" r="85" fill="#cdeaf1" clip-path="url(#clipB3)"/>
<circle cx="150" cy="165" r="85" fill="none" stroke="#0083A1" stroke-width="2.5"/>
<circle cx="250" cy="165" r="85" fill="none" stroke="#164374" stroke-width="2.5"/>
<circle cx="250" cy="165" r="85" fill="none" stroke="#7c3aed" stroke-width="4.5"/>
<text x="88" y="103" class="h" text-anchor="middle" style="fill:#0083A1;font-size:22px">A</text>
<text x="312" y="103" class="h" text-anchor="middle" style="fill:#164374;font-size:22px">B</text>
<text x="680" y="30" class="h" text-anchor="middle" >P(B | A): the same overlap out of A</text>
<rect x="500" y="50" width="360" height="230" rx="12" fill="#f8fafc" stroke="#164374" stroke-width="2"/>
<text x="844" y="78" class="sym" text-anchor="end" >Ω</text>
<clipPath id="clipB4"><circle cx="730" cy="165" r="85"/></clipPath>
<circle cx="630" cy="165" r="85" fill="#cdeaf1" clip-path="url(#clipB4)"/>
<circle cx="630" cy="165" r="85" fill="none" stroke="#0083A1" stroke-width="2.5"/>
<circle cx="730" cy="165" r="85" fill="none" stroke="#164374" stroke-width="2.5"/>
<circle cx="630" cy="165" r="85" fill="none" stroke="#7c3aed" stroke-width="4.5"/>
<text x="568" y="103" class="h" text-anchor="middle" style="fill:#0083A1;font-size:22px">A</text>
<text x="792" y="103" class="h" text-anchor="middle" style="fill:#164374;font-size:22px">B</text>
<text x="450" y="318" class="t" text-anchor="middle" style="font-size:20px">P(A | B) · P(B)  =  P(A ∩ B)  =  P(B | A) · P(A)</text>
<rect x="370" y="342" width="22" height="18" fill="#cdeaf1" stroke="#0083A1"/>
<text x="400" y="356" class="s" text-anchor="start" >counted</text>
<rect x="480" y="342" width="22" height="18" fill="none" stroke="#7c3aed" stroke-width="3"/>
<text x="510" y="356" class="s" text-anchor="start" >out of</text>
</svg>
