<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img">
<title>Conditioning on B: everything outside B is ruled out and B becomes the whole sample space</title>
<style>
  .t { font: 17px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
  .s { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #475569; }
  .h { font: 700 18px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
  .sym { font: 22px "Times New Roman", serif; fill: #164374; }
  .dot { font: 700 15px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
</style>
<rect x="0" y="0" width="900" height="370" fill="#ffffff"/>
<text x="200" y="30" class="h" text-anchor="middle" >The stone lands somewhere in Ω</text>
<rect x="20" y="50" width="360" height="230" rx="12" fill="#f8fafc" stroke="#164374" stroke-width="2"/>
<text x="364" y="78" class="sym" text-anchor="end" >Ω</text>
<clipPath id="clipB1"><circle cx="250" cy="165" r="85"/></clipPath>
<circle cx="150" cy="165" r="85" fill="#cdeaf1"/>
<circle cx="150" cy="165" r="85" fill="none" stroke="#0083A1" stroke-width="2.5"/>
<circle cx="250" cy="165" r="85" fill="none" stroke="#164374" stroke-width="2.5"/>
<rect x="20" y="50" width="360" height="230" rx="12" fill="none" stroke="#7c3aed" stroke-width="4"/>
<text x="88" y="103" class="h" text-anchor="middle" style="fill:#0083A1;font-size:22px">A</text>
<text x="312" y="103" class="h" text-anchor="middle" style="fill:#164374;font-size:22px">B</text>
<text x="200" y="314" class="t" text-anchor="middle" >P(A) = area of A / area of Ω</text>
<path d="M405 165 H455" stroke="#164374" stroke-width="2.5"/><path d="M455 157 L470 165 L455 173 Z" fill="#164374"/>
<text x="437" y="150" class="s" text-anchor="middle" >learn:</text>
<text x="437" y="196" class="s" text-anchor="middle" >in B</text>
<text x="680" y="30" class="h" text-anchor="middle" >We learn: it landed in B</text>
<rect x="500" y="50" width="360" height="230" rx="12" fill="#f8fafc" stroke="#164374" stroke-width="2"/>
<text x="844" y="78" class="sym" text-anchor="end" >Ω</text>
<clipPath id="clipB2"><circle cx="730" cy="165" r="85"/></clipPath>
<rect x="500" y="50" width="360" height="230" rx="12" fill="#e2e8f0" opacity="0.75"/>
<circle cx="730" cy="165" r="85" fill="#f8fafc"/>
<circle cx="630" cy="165" r="85" fill="#cdeaf1" clip-path="url(#clipB2)"/>
<circle cx="630" cy="165" r="85" fill="none" stroke="#0083A1" stroke-width="2.5" stroke-dasharray="6 5"/>
<circle cx="730" cy="165" r="85" fill="none" stroke="#164374" stroke-width="2.5"/>
<circle cx="730" cy="165" r="85" fill="none" stroke="#7c3aed" stroke-width="4.5"/>
<text x="568" y="103" class="h" text-anchor="middle" style="fill:#0083A1;font-size:22px">A</text>
<text x="792" y="103" class="h" text-anchor="middle" style="fill:#164374;font-size:22px">B</text>
<circle cx="748" cy="200" r="7" fill="#0f172a"/>
<text x="680" y="314" class="t" text-anchor="middle" >P(A | B) = area of A ∩ B / area of B</text>
<rect x="370" y="338" width="22" height="18" fill="#cdeaf1" stroke="#0083A1"/>
<text x="400" y="352" class="s" text-anchor="start" >counted</text>
<rect x="480" y="338" width="22" height="18" fill="none" stroke="#7c3aed" stroke-width="3"/>
<text x="510" y="352" class="s" text-anchor="start" >out of</text>
</svg>
