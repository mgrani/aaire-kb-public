<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img">
<title>Two different regions: (A union B) intersect C versus (A intersect B) union C</title>
<style>
  .t { font: 17px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
  .s { font: 14px Arial, "Helvetica Neue", sans-serif; fill: #475569; }
  .h { font: 700 18px Arial, "Helvetica Neue", sans-serif; fill: #164374; }
  .sym { font: 22px "Times New Roman", serif; fill: #164374; }
  .dot { font: 700 15px Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
</style>
<rect x="0" y="0" width="860" height="360" fill="#ffffff"/>
<text x="200" y="26" class="h" text-anchor="middle" >(A ∪ B) ∩ C</text>
<rect x="20" y="40" width="360" height="270" rx="12" fill="#f8fafc" stroke="#164374" stroke-width="2"/>
<clipPath id="ab-union"><circle cx="150" cy="120" r="80" fill="#cdeaf1" /><circle cx="250" cy="120" r="80" fill="#cdeaf1" /></clipPath><circle cx="200" cy="205" r="80" fill="#cdeaf1" clip-path="url(#ab-union)"/>
<circle cx="150" cy="120" r="80" fill="none" stroke="#164374" stroke-width="2.5"/>
<text x="55" y="66" class="h" text-anchor="middle" style="font-size:20px">A</text>
<circle cx="250" cy="120" r="80" fill="none" stroke="#164374" stroke-width="2.5"/>
<text x="345" y="66" class="h" text-anchor="middle" style="font-size:20px">B</text>
<circle cx="200" cy="205" r="80" fill="none" stroke="#164374" stroke-width="2.5"/>
<text x="300" y="281" class="h" text-anchor="middle" style="font-size:20px">C</text>
<text x="640" y="26" class="h" text-anchor="middle" >(A ∩ B) ∪ C</text>
<rect x="460" y="40" width="360" height="270" rx="12" fill="#f8fafc" stroke="#164374" stroke-width="2"/>
<clipPath id="b-only"><circle cx="690" cy="120" r="80" fill="#cdeaf1" /></clipPath><circle cx="640" cy="205" r="80" fill="#cdeaf1" /><circle cx="590" cy="120" r="80" fill="#cdeaf1" clip-path="url(#b-only)"/>
<circle cx="590" cy="120" r="80" fill="none" stroke="#164374" stroke-width="2.5"/>
<text x="495" y="66" class="h" text-anchor="middle" style="font-size:20px">A</text>
<circle cx="690" cy="120" r="80" fill="none" stroke="#164374" stroke-width="2.5"/>
<text x="785" y="66" class="h" text-anchor="middle" style="font-size:20px">B</text>
<circle cx="640" cy="205" r="80" fill="none" stroke="#164374" stroke-width="2.5"/>
<text x="740" y="281" class="h" text-anchor="middle" style="font-size:20px">C</text>
<text x="200" y="340" class="s" text-anchor="middle" >inside C only</text>
<text x="640" y="340" class="s" text-anchor="middle" >all of C, plus the lens A ∩ B</text>
</svg>
